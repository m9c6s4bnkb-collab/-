<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心理学概論｜一問一答</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#667085;--line:#e4e7ec;--accent:#3448c5;--good:#137a4d;--bad:#b42318;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headerin{max-width:900px;margin:auto;padding:11px 14px}.title{font-size:17px;font-weight:800;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:14px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.panel{padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}
button,select,input{font:inherit}button,.btn,select{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.stat{background:#f8fafc;border-radius:10px;padding:7px 8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}
.card{padding:18px}.qno{font-size:12px;color:var(--muted);margin-bottom:6px}.question{font-size:18px;font-weight:750;line-height:1.7;margin:0 0 14px}.options{display:grid;gap:9px}.opt{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid #d0d5dd;background:#fff}.opt:hover{background:#f9fafb}.opt.selected{border-color:var(--accent);background:var(--soft)}.opt.correct{border-color:var(--good);background:#ecfdf3}.opt.wrong{border-color:var(--bad);background:#fef3f2}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.feedback.good{border-color:#a6f4c5}.feedback.bad{border-color:#fecdca}.answer{font-weight:800}.topic{margin-top:7px;color:var(--muted);font-size:12px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.nav button{flex:1}.nav button:nth-child(2){flex:1.4}
.empty{text-align:center;padding:28px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.links a{text-decoration:none;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:9px;color:var(--accent);font-size:12px}
.shortInput{display:flex;gap:8px}.shortInput input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:11px;min-width:0}.selfrow{display:flex;gap:8px;margin-top:9px}.selfrow button{flex:1}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.question{font-size:16px}.card{padding:14px}.headerin{padding-top:8px}.wrap{padding:10px}.shortInput{display:block}.shortInput button{width:100%;margin-top:8px}}
</style></head>

<script>const QUESTIONS=[{"q":"言語連想検査で有名な人物は誰か。","answers":["ユング"],"exp":"ユングの言語連想検査が有名。","topic":"ユング","all_required":false,"id":"gai_sa_001"},{"q":"ユングの言語連想検査では何個の刺激語を提示するとされているか。","answers":["100","100語"],"exp":"100の刺激語を提示する。","topic":"ユング","all_required":false,"id":"gai_sa_002"},{"q":"言語連想検査では、反応語のほかに何を分析するか。2つ答えよ。","answers":["反応時間|反応態度"],"exp":"反応語・反応時間・反応態度を分析する。","topic":"ユング","all_required":true,"id":"gai_sa_003"},{"q":"成長過程で抑圧・忘却されたものを指す無意識を何というか。","answers":["個人的無意識"],"exp":"ユングは無意識を個人的無意識と集合的無意識に分けた。","topic":"ユング","all_required":false,"id":"gai_sa_004"},{"q":"個人や文化を超えて全人類が共通して持つ無意識を何というか。","answers":["集合的無意識"],"exp":"全人類に共通して持つ無意識。","topic":"ユング","all_required":false,"id":"gai_sa_005"},{"q":"集合的無意識の中に含まれ、共通したイメージを生み出す源を何というか。","answers":["元型"],"exp":"元型そのものは意識できないとされる。","topic":"ユング","all_required":false,"id":"gai_sa_006"},{"q":"「感情によって色づけられた心的内容の集合体」を何というか。","answers":["コンプレックス"],"exp":"ユングのコンプレックスの説明。","topic":"コンプレックス","all_required":false,"id":"gai_sa_007"},{"q":"劣等感と結びついている複合感情を何というか。","answers":["劣等感コンプレックス","劣等コンプレックス"],"exp":"劣等感コンプレックスは劣等感と結びついた複合感情。","topic":"コンプレックス","all_required":false,"id":"gai_sa_008"},{"q":"受け入れがたい感情や資質などを他者が持っていると認識する現象を何というか。","answers":["投影"],"exp":"投影の定義。","topic":"投影","all_required":false,"id":"gai_sa_009"},{"q":"他者に投影していたものが実は自分のコンプレックスだと気づくことを何というか。","answers":["投影の引き戻し","投影のひきもどし"],"exp":"投影の引き戻し。","topic":"投影","all_required":false,"id":"gai_sa_010"},{"q":"自由連想法を用いた人物は誰か。","answers":["フロイト"],"exp":"フロイトが神経症の治療法として用いた。","topic":"精神分析","all_required":false,"id":"gai_sa_011"},{"q":"自由連想法でみられる沈黙や遅刻などを何というか。","answers":["抵抗"],"exp":"自由連想の過程における抵抗。","topic":"精神分析","all_required":false,"id":"gai_sa_012"},{"q":"弱点を意識していくことを何というか。","answers":["直面"],"exp":"直面にはタイミング等への配慮が必要。","topic":"精神分析","all_required":false,"id":"gai_sa_013"},{"q":"過去の重要人物への感情をセラピストに向ける現象を何というか。","answers":["転移"],"exp":"精神分析で生じる転移。","topic":"精神分析","all_required":false,"id":"gai_sa_014"},{"q":"意識では受容できなかった自己の一側面を何というか。","answers":["影","シャドウ","影（シャドウ）"],"exp":"ユングの影（シャドウ）。","topic":"ユング","all_required":false,"id":"gai_sa_015"},{"q":"失声や失明、失立失歩などがみられ、葛藤が身体症状へ転換する病気を何というか。","answers":["転換性障害"],"exp":"ストレスや葛藤が身体症状へ転換して表現される。","topic":"臨床","all_required":false,"id":"gai_sa_016"},{"q":"症状を持つことで本人に好都合な状況が生じることを何というか。","answers":["疾病利得"],"exp":"周囲の気を引く、面倒を見てもらえる等。","topic":"臨床","all_required":false,"id":"gai_sa_017"},{"q":"汎適応症候群を提唱した人物は誰か。","answers":["セリエ"],"exp":"セリエのストレス理論。","topic":"ストレス","all_required":false,"id":"gai_sa_018"},{"q":"汎適応症候群の3段階を順に答えよ。","answers":["警告反応期|抵抗期|疲憊期"],"exp":"警告反応期→抵抗期→疲憊期。","topic":"ストレス","all_required":true,"id":"gai_sa_019"},{"q":"ライフイベント理論を提唱した2人を答えよ。","answers":["ホームズ|レイ"],"exp":"ホームズとレイ。","topic":"ストレス","all_required":true,"id":"gai_sa_020"},{"q":"社会的再適応評価尺度で結婚はいくつを基準とするか。","answers":["50","50点"],"exp":"結婚の50を基準とする。","topic":"ストレス","all_required":false,"id":"gai_sa_021"},{"q":"社会的再適応評価尺度で最も高く100とされる出来事は何か。","answers":["配偶者の死"],"exp":"配偶者の死が100。","topic":"ストレス","all_required":false,"id":"gai_sa_022"},{"q":"心理的ストレス理論を提唱した人物は誰か。","answers":["ラザルス"],"exp":"認知的評価理論とも呼ばれる。","topic":"ストレス","all_required":false,"id":"gai_sa_023"},{"q":"脅威か否かを判断する評価を何というか。","answers":["一次的評価"],"exp":"脅威か否かの判断。","topic":"ストレス","all_required":false,"id":"gai_sa_024"},{"q":"対処できるかどうかを判断する評価を何というか。","answers":["二次的評価"],"exp":"対処可能性の判断。","topic":"ストレス","all_required":false,"id":"gai_sa_025"},{"q":"日常のちょっとした不愉快な事柄や心配事を何というか。","answers":["デイリーハッスル","日常のイライラ事"],"exp":"ストレッサーの一分類。","topic":"ストレス","all_required":false,"id":"gai_sa_026"},{"q":"ストレッサー自体を取り除くための行動を何型コーピングというか。","answers":["問題焦点型コーピング"],"exp":"問題の解決や対策を行う。","topic":"コーピング","all_required":false,"id":"gai_sa_027"},{"q":"不快な感情を軽減するための行動を何型コーピングというか。","answers":["情動焦点型コーピング"],"exp":"感情を話す、気晴らしなど。","topic":"コーピング","all_required":false,"id":"gai_sa_028"},{"q":"状況に応じてコーピングを柔軟に使い分ける能力を何というか。","answers":["コーピングの柔軟性"],"exp":"適切に対処するため重要とされる。","topic":"コーピング","all_required":false,"id":"gai_sa_029"},{"q":"ハウスが分類した4つのソーシャルサポートを答えよ。","answers":["手段的サポート|情報的サポート|情緒的サポート|評価的サポート"],"exp":"手段的・情報的・情緒的・評価的サポート。","topic":"ソーシャルサポート","all_required":true,"id":"gai_sa_030"},{"q":"DSM-5で、奇妙で風変わりな信念や習慣を特徴とする人格障害群は何群か。","answers":["A群"],"exp":"A群の特徴。","topic":"人格","all_required":false,"id":"gai_sa_031"},{"q":"DSM-5で、劇的・過度な感情や言動がみられる人格障害群は何群か。","answers":["B群"],"exp":"B群の特徴。","topic":"人格","all_required":false,"id":"gai_sa_032"},{"q":"DSM-5で、不安や自信のなさが強い人格障害群は何群か。","answers":["C群"],"exp":"C群の特徴。","topic":"人格","all_required":false,"id":"gai_sa_033"},{"q":"見捨てられ不安が顕著で、理想化と価値下げを繰り返すパーソナリティ症を何というか。","answers":["境界性人格障害","ボーダーラインパーソナリティ症"],"exp":"境界性人格障害の特徴。","topic":"人格","all_required":false,"id":"gai_sa_034"},{"q":"誇大性、賞賛への強い欲求、共感の欠如を特徴とするパーソナリティ症を何というか。","answers":["自己愛性人格障害","自己愛性パーソナリティ症"],"exp":"自己愛性人格障害。","topic":"人格","all_required":false,"id":"gai_sa_035"},{"q":"社会的引きこもりは、何か月以上自宅にひきこもり社会参加していない状態とされるか。","answers":["6か月","6ヶ月","6か月以上"],"exp":"6か月以上。","topic":"青年期","all_required":false,"id":"gai_sa_036"},{"q":"測定内容が測定対象を正確に測定している程度を何というか。","answers":["妥当性"],"exp":"妥当性の定義。","topic":"心理検査","all_required":false,"id":"gai_sa_037"},{"q":"測定内容が安定性と一貫性を有している程度を何というか。","answers":["信頼性"],"exp":"信頼性の定義。","topic":"心理検査","all_required":false,"id":"gai_sa_038"},{"q":"妥当性の3分類を答えよ。","answers":["内容的妥当性|基準関連妥当性|構成概念妥当性"],"exp":"3分類。","topic":"心理検査","all_required":true,"id":"gai_sa_039"},{"q":"妥当性と信頼性が確かめられていることを何というか。","answers":["標準化"],"exp":"資料上の標準化の説明。","topic":"心理検査","all_required":false,"id":"gai_sa_040"},{"q":"母性剥奪を提唱した人物は誰か。","answers":["ボウルビィ"],"exp":"ボウルビィの母性剥奪。","topic":"発達","all_required":false,"id":"gai_sa_041"},{"q":"母親から引き離された乳児の3段階を順に答えよ。","answers":["抗議|絶望|離脱"],"exp":"抗議→絶望→離脱。","topic":"発達","all_required":true,"id":"gai_sa_042"},{"q":"男児が母親へ愛着、父親へ敵意を抱く複合感情を何というか。","answers":["エディプス・コンプレックス"],"exp":"男根期の男児に関する説明。","topic":"精神分析","all_required":false,"id":"gai_sa_043"},{"q":"女児が父親への性的関心と母親への敵意を抱く複合感情を何というか。","answers":["エレクトラ・コンプレックス"],"exp":"ユングが名づけたとされる。","topic":"精神分析","all_required":false,"id":"gai_sa_044"},{"q":"DSM-5で分離不安症は何に含まれるとされているか。","answers":["不安症候群"],"exp":"DSM-5では不安症候群に含まれると記載されている。","topic":"臨床","all_required":false,"id":"gai_sa_045"},{"q":"第2の分離固体化を論じた人物は誰か。","answers":["ブロス"],"exp":"青年期の養育者との関係変化。","topic":"青年期","all_required":false,"id":"gai_sa_046"},{"q":"10～12歳の時期を何期というか。","answers":["分化期"],"exp":"第2の分離固体化の最初の時期。","topic":"青年期","all_required":false,"id":"gai_sa_047"},{"q":"12～15歳頃の時期を何期というか。","answers":["再接近期"],"exp":"物理的には距離を置きつつ心理的依存もみられる。","topic":"青年期","all_required":false,"id":"gai_sa_048"},{"q":"15～18歳頃の時期を何期というか。","answers":["練習期"],"exp":"友人との交流が活発になる。","topic":"青年期","all_required":false,"id":"gai_sa_049"},{"q":"18～22歳の時期を何期というか。","answers":["固体化期"],"exp":"安定した自己が出来上がる時期。","topic":"青年期","all_required":false,"id":"gai_sa_050"},{"q":"青年期にみられる特有の無気力状態を何というか。","answers":["スチューデント・アパシー"],"exp":"アパシーは無気力や無関心を意味する。","topic":"青年期","all_required":false,"id":"gai_sa_051"},{"q":"ある側面の評価が他の側面の評価に影響する現象を何というか。","answers":["ハロー効果","光背効果"],"exp":"対人認知の歪み。","topic":"社会心理","all_required":false,"id":"gai_sa_052"},{"q":"1879年に世界初の心理学実験室を開設した人物は誰か。","answers":["ヴント"],"exp":"ライプツィヒ大学に開設。","topic":"心理学史","all_required":false,"id":"gai_sa_053"},{"q":"ヴントが用いた、意識内容を観察・報告させる方法を何というか。","answers":["内観法"],"exp":"統制環境下で用いた。","topic":"心理学史","all_required":false,"id":"gai_sa_054"},{"q":"ヴントが心理学実験室を開設した年は何年か。","answers":["1879","1879年"],"exp":"1879年。","topic":"心理学史","all_required":false,"id":"gai_sa_055"},{"q":"無意味綴りを使って忘却曲線を示した人物は誰か。","answers":["エビングハウス"],"exp":"記憶を実験的に研究した。","topic":"心理学史","all_required":false,"id":"gai_sa_056"},{"q":"エビングハウスが用いた無意味綴りは、どのような3文字構成か。","answers":["子音|母音|子音"],"exp":"子音－母音－子音。","topic":"心理学史","all_required":true,"id":"gai_sa_057"},{"q":"ゲシュタルト心理学を創設した人物は誰か。","answers":["ウェルトハイマー"],"exp":"ゲシュタルト心理学の創設者。","topic":"心理学史","all_required":false,"id":"gai_sa_058"},{"q":"ゲシュタルト心理学の代表的研究である運動知覚の現象を何というか。","answers":["仮現運動"],"exp":"ウェルトハイマーの仮現運動研究。","topic":"心理学史","all_required":false,"id":"gai_sa_059"},{"q":"ゲシュタルトを思考や問題解決に応用した人物は誰か。","answers":["ケーラー"],"exp":"代表研究者の一人。","topic":"心理学史","all_required":false,"id":"gai_sa_060"},{"q":"ゲシュタルトを集団力学に応用した人物は誰か。","answers":["レヴィン"],"exp":"実験社会心理学の基礎を作った。","topic":"心理学史","all_required":false,"id":"gai_sa_061"},{"q":"行動主義を提唱した人物は誰か。","answers":["ワトソン"],"exp":"1910年代前半に提唱。","topic":"心理学史","all_required":false,"id":"gai_sa_062"},{"q":"行動主義で刺激と反応の連合を表す理論を何というか。","answers":["S-R理論","SR理論"],"exp":"刺激と反応の連合による学習。","topic":"心理学史","all_required":false,"id":"gai_sa_063"},{"q":"ワトソンが行った有名な条件づけ実験を何というか。","answers":["アルバート坊やの実験"],"exp":"感情も刺激―反応関係で説明できると考えた。","topic":"心理学史","all_required":false,"id":"gai_sa_064"},{"q":"精神分析学を創設した人物は誰か。","answers":["フロイト"],"exp":"無意識を重視。","topic":"精神分析","all_required":false,"id":"gai_sa_065"},{"q":"意識・前意識・無意識の3層からなるとする理論を何というか。","answers":["局所論"],"exp":"フロイトの主な理論の一つ。","topic":"精神分析","all_required":false,"id":"gai_sa_066"},{"q":"イド・自我・超自我の3機能からなるとする理論を何というか。","answers":["構造論"],"exp":"フロイトの主な理論の一つ。","topic":"精神分析","all_required":false,"id":"gai_sa_067"},{"q":"イド・自我・超自我の力関係を重視する理論を何というか。","answers":["力動論"],"exp":"フロイトの主な理論の一つ。","topic":"精神分析","all_required":false,"id":"gai_sa_068"},{"q":"自我心理学で、抑圧以外のさまざまな防衛機制を提唱した人物は誰か。","answers":["アンナ・フロイト"],"exp":"フロイト以降の精神分析学の代表。","topic":"精神分析","all_required":false,"id":"gai_sa_069"},{"q":"WHOが1980年に提唱した障害分類モデルを何というか。","answers":["ICIDH"],"exp":"機能障害・能力障害・社会的不利の3次元。","topic":"障害","all_required":false,"id":"gai_sa_070"},{"q":"ICIDHの3次元を答えよ。","answers":["機能障害|能力障害|社会的不利"],"exp":"3つの次元。","topic":"障害","all_required":true,"id":"gai_sa_071"},{"q":"WHOが2001年に提唱した生活機能の分類を何というか。","answers":["ICF"],"exp":"健康状態、環境要因等を包括的に捉える。","topic":"障害","all_required":false,"id":"gai_sa_072"},{"q":"ICFで、課題や行為の遂行を意味する要素は何か。","answers":["活動"],"exp":"ICFの活動。","topic":"障害","all_required":false,"id":"gai_sa_073"},{"q":"ICFで、社会や家庭への関わりを意味する要素は何か。","answers":["参加"],"exp":"ICFの参加。","topic":"障害","all_required":false,"id":"gai_sa_074"},{"q":"ICFの構成要素を6つ答えよ。","answers":["心身機能・身体構造|活動|参加|健康状態|環境因子|個人因子"],"exp":"資料に示された6要素。","topic":"障害","all_required":true,"id":"gai_sa_075"},{"q":"障害を個人の中に生じた問題として捉える考え方を何というか。","answers":["医学モデル"],"exp":"個人の治療・訓練・克服を重視する。","topic":"障害","all_required":false,"id":"gai_sa_076"},{"q":"障害を社会的障壁によって生み出されるものとする考え方を何というか。","answers":["障害の社会モデル"],"exp":"障壁を取り除くのは社会の責務とする。","topic":"障害","all_required":false,"id":"gai_sa_077"},{"q":"DSM-IV-TRで転換性障害が含まれると記載されている障害名は何か。","answers":["身体表現障害"],"exp":"転換性障害はDSM-IV-TRでは「身体表現障害」に含まれると記載されている。","topic":"臨床","all_required":false,"id":"gai_sa_078"},{"q":"社会的再適応評価尺度で、再適応の労力を表す数量を何というか。","answers":["マグニチュード"],"exp":"再適応の労力をマグニチュードという数量で表す。","topic":"ストレス","all_required":false,"id":"gai_sa_079"},{"q":"ハウスがソーシャルサポートを分類する際に用いた二次元を答えよ。","answers":["直接的|間接的|道具的|情緒的"],"exp":"直接的－間接的、道具的－情緒的という二次元から分類した。","topic":"ソーシャルサポート","all_required":true,"id":"gai_sa_080"},{"q":"人格障害で使用していると考えられる防衛機制は何か。","answers":["分裂"],"exp":"人格障害では分裂という防衛機制を使用していると考えられると記載されている。","topic":"人格","all_required":false,"id":"gai_sa_081"},{"q":"ゲシュタルト心理学で知覚の体制化に関して提唱された法則を何というか。","answers":["プレグナンツの法則"],"exp":"知覚の体制化におけるプレグナンツの法則。","topic":"心理学史","all_required":false,"id":"gai_sa_082"},{"q":"フロイトが精神分析学で注目した行為は何か。","answers":["失錯行為"],"exp":"フロイトは失錯行為に注目し、無意識を重視した。","topic":"精神分析","all_required":false,"id":"gai_sa_083"},{"q":"セリエは、外部からの刺激とそれに伴う反応を総じて何と定義したか。","answers":["ストレス"],"exp":"ストレッサーとストレス反応を総じてストレスと定義した。","topic":"ストレス","all_required":false,"id":"gai_sa_084"},{"q":"ゲシュタルトとは、要素に還元できない何を意味するか。","answers":["まとまりのあるひとつの全体が持つ構造的特性","まとまりのある全体が持つ構造的特性"],"exp":"要素に還元できない、まとまりのあるひとつの全体が持つ構造的特性を意味する。","topic":"心理学史","all_required":false,"id":"gai_sa_085"}];const STORAGE_KEY='quiz_gairon_short_v20260917';let state=loadState(STORAGE_KEY);
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．.、()（）\[\]【】「」『』:：;；/\\\-−―ー]/g,'')}
function loadState(key){try{return JSON.parse(localStorage.getItem(key))||{}}catch(e){return {}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function ensure(i){let id=QUESTIONS[i].id;if(!state[id])state[id]={attempts:0,correct:0,wrong:0,last:null};return state[id]}
function fisher(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let filter='all',idx=0,order=QUESTIONS.map((_,i)=>i),randomMode=false,session={answered:0,correct:0,wrong:0};
function matches(i){let r=ensure(i);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function currentList(){return order.filter(matches)}
function updateStats(){let total=QUESTIONS.length,done=0,wrong=0;QUESTIONS.forEach((_,i)=>{let r=ensure(i);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+total;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=currentList().length+'問表示'}
function setFilter(v){filter=v;idx=0;resetLocal();render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';resetLocal();render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;resetLocal();render()}}
function moveQ(d){let list=currentList();if(!list.length)return;idx=(idx+d+list.length)%list.length;resetLocal();render()}

let revealed=false,userInput='',pendingSelfScore=false;
function resetLocal(){revealed=false;userInput='';pendingSelfScore=false;let c=document.getElementById('card');if(c)c.dataset.qi=''}
function requiredTerms(q){if(!q.all_required)return null;let raw=q.answers[0]||'';return raw.split('|').map(norm).filter(Boolean)}
function isCorrect(q,input){
  let n=norm(input);
  if(q.all_required){let terms=requiredTerms(q);return terms.every(t=>n.includes(t))}
  return q.answers.some(a=>norm(a)===n)
}
function checkShort(){let inp=document.getElementById('ansInput');let val=inp?inp.value:'';if(!val.trim())return;userInput=val;let qi=currentList()[idx],q=QUESTIONS[qi],r=ensure(qi),ok=isCorrect(q,val);r.attempts++;session.answered++;if(ok){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();revealed=true;pendingSelfScore=false;render()}
function showAnswer(){let inp=document.getElementById('ansInput');userInput=inp?inp.value:'';revealed=true;pendingSelfScore=true;render()}
function selfScore(ok){let qi=currentList()[idx],r=ensure(qi);r.attempts++;session.answered++;if(ok){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();pendingSelfScore=false;render()}
function retry(){revealed=false;userInput='';pendingSelfScore=false;render()}
function displayAnswer(q){return q.all_required?(q.answers[0]||'').split('|').join('／'):q.answers.join('／')}
function render(){updateStats();let list=currentList(),card=document.getElementById('card');if(!list.length){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}if(idx>=list.length)idx=0;let qi=list[idx],q=QUESTIONS[qi];card.dataset.qi=qi;let fb='';if(revealed){let auto=userInput.trim()?isCorrect(q,userInput):null;let cls=auto===true?'good':(auto===false&&!pendingSelfScore?'bad':'');let status=auto===true?'○ 正解':(auto===false&&!pendingSelfScore?'× 不正解':'答えを確認');fb=`<div class="feedback ${cls}"><div class="answer">${status}　正解：${displayAnswer(q)}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>`;if(pendingSelfScore)fb+=`<div class="selfrow"><button onclick="selfScore(true)">自分では正解</button><button onclick="selfScore(false)">自分では不正解</button></div>`}let inputBlock=!revealed?`<div class="shortInput"><input id="ansInput" type="text" placeholder="答えを入力" value="${userInput.replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')checkShort()"><button class="primary" onclick="checkShort()">答え合わせ</button></div><div style="margin-top:8px"><button onclick="showAnswer()">答えを見る（自己採点）</button></div>`:'';card.innerHTML=`<div class="qno">${idx+1} / ${list.length}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div>${inputBlock}${fb}<div class="nav"><button onclick="moveQ(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="moveQ(1)">次へ →</button></div>`;updateStats()}
render();
</script></body></html>
