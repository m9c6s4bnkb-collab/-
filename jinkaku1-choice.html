<script>const questions=[{"id":"jin1-c-001","q":"自分一人では気づきにくい『自分らしさ』を捉える観点を何というか。","options":["自己理解の視点","分析心理学","構造論","類型論"],"correct":0,"answer":"自己理解の視点","explanation":"資料では、正答は「自己理解の視点」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-002","q":"自分にとってあまりになじみ深い人格上の特徴は、何のように当然であるため改めて意識されにくいか。","options":["鏡","空気","カメラ","仮面"],"correct":1,"answer":"空気","explanation":"資料では、正答は「空気」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-003","q":"自分の内面・態度・行動を映し出すものとして必要だとされる比喩は何か。","options":["カメラ","舞台","鏡","空気"],"correct":2,"answer":"鏡","explanation":"資料では、正答は「鏡」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-004","q":"自分の位置づけを知る方法として資料が挙げるものは何か。","options":["一人での内省だけ","身体計測","筆跡の判定","他者との比較"],"correct":3,"answer":"他者との比較","explanation":"資料では、正答は「他者との比較」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-005","q":"周囲の人から意見や反応を受け取って自分を知る方法は何か。","options":["他者からのフィードバック","行動の類型化","他者への投影","自己への抑圧"],"correct":0,"answer":"他者からのフィードバック","explanation":"資料では、正答は「他者からのフィードバック」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-006","q":"『自分らしさ』が顕在化する場として、資料が重視するものは何か。","options":["筆跡だけ","他者との関わり合い","遺伝情報だけ","無刺激の環境"],"correct":1,"answer":"他者との関わり合い","explanation":"資料では、正答は「他者との関わり合い」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-007","q":"自分自身の姿を客観的に捉えるために通すものは何か。","options":["検査という答え","自己という仮面","他者という鏡","意識という窓"],"correct":2,"answer":"他者という鏡","explanation":"資料では、正答は「他者という鏡」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-008","q":"自覚されている面とともに『自分らしさ』がもつものは何か。","options":["他者にも決して分からない側面だけ","環境と無関係な側面","常に完全に自覚できる側面","自分では自覚しにくい側面"],"correct":3,"answer":"自分では自覚しにくい側面","explanation":"資料では、正答は「自分では自覚しにくい側面」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-c-009","q":"対人関係における相互的な認識過程を表すモデルを提唱した人物は誰か。","options":["ルフトとインガム","クリス","シュプランガー","アイゼンク"],"correct":0,"answer":"ルフトとインガム","explanation":"資料では、正答は「ルフトとインガム」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-010","q":"自己と他者の認識を『知っている／知らない』で整理するモデルを何というか。","options":["体験過程理論","ジョハリの窓","経済論","心の局所論"],"correct":1,"answer":"ジョハリの窓","explanation":"資料では、正答は「ジョハリの窓」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-011","q":"ジョハリの窓が自己理解・他者理解に用いる認識の軸はいくつか。","options":["12","5つ","2つ","16"],"correct":2,"answer":"2つ","explanation":"資料では、正答は「2つ」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-012","q":"ジョハリの窓で分類される自己の領域はいくつか。","options":["5つ","16","6つ","4つ"],"correct":3,"answer":"4つ","explanation":"資料では、正答は「4つ」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-013","q":"自分も他者も知っている公的な『私』に当たる領域はどれか。","options":["開放領域","隠蔽領域","未知領域","盲点領域"],"correct":0,"answer":"開放領域","explanation":"資料では、自分も他者も知っている公的な『私』に当たるのは「開放領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-c-014","q":"自分は知っているが他者には知られていない私的な『私』に当たる領域はどれか。","options":["未知領域","隠蔽領域","盲点領域","開放領域"],"correct":1,"answer":"隠蔽領域","explanation":"資料では、自分は知っているが他者には知られていない私的な『私』に当たるのは「隠蔽領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-c-015","q":"他者だけが知り、自分では気づいていない『私』に当たる領域はどれか。","options":["開放領域","未知領域","盲点領域","隠蔽領域"],"correct":2,"answer":"盲点領域","explanation":"資料では、他者だけが知り、自分では気づいていない『私』に当たるのは「盲点領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-c-016","q":"自分も他者も気づいていない無意識下の『私』に当たる領域はどれか。","options":["開放領域","盲点領域","隠蔽領域","未知領域"],"correct":3,"answer":"未知領域","explanation":"資料では、自分も他者も気づいていない無意識下の『私』に当たるのは「未知領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-c-017","q":"開放領域を広げる3作用のうち、自分が知っている情報を他者へ伝える作用は何か。","options":["自己開示","抑圧","発見","フィードバック"],"correct":0,"answer":"自己開示","explanation":"資料では、正答は「自己開示」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-018","q":"開放領域を広げる3作用のうち、他者が把握している自分の特徴を伝えてもらう作用は何か。","options":["発見","フィードバック","自己開示","抑圧"],"correct":1,"answer":"フィードバック","explanation":"資料では、正答は「フィードバック」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-019","q":"開放領域を広げる3作用のうち、自分も他者も知らなかった側面が明らかになる作用は何か。","options":["自己開示","抑圧","発見","フィードバック"],"correct":2,"answer":"発見","explanation":"資料では、正答は「発見」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-020","q":"3つの作用によって広がる領域はどれか。","options":["隠蔽領域","未知領域","盲点領域","開放領域"],"correct":3,"answer":"開放領域","explanation":"資料では、正答は「開放領域」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-021","q":"開放領域が広がると、他の領域はどうなるか。","options":["小さくなる","すべて消失する","必ず同じ大きさになる","大きくなる"],"correct":0,"answer":"小さくなる","explanation":"資料では、正答は「小さくなる」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-022","q":"開放領域の拡大によって深まるものの組合せはどれか。","options":["衝動と感情","対人関係と自己理解","身体発達と知能","抑圧と退行"],"correct":1,"answer":"対人関係と自己理解","explanation":"資料では、正答は「対人関係と自己理解」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-c-023","q":"人の知覚を、外界を受動的に写すだけではないと説明する際、否定される比喩は何か。","options":["地図","鏡","カメラ","窓"],"correct":2,"answer":"カメラ","explanation":"資料では、正答は「カメラ」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-024","q":"人が情報を照合するものとして挙げられているのは何か。","options":["頭蓋骨の形","筆跡だけ","未来の予言","過去の経験"],"correct":3,"answer":"過去の経験","explanation":"資料では、正答は「過去の経験」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-025","q":"人は情報を補足・加工しながら、何を主体的・能動的に構成するか。","options":["認知的世界","心的エネルギー","集合的無意識","身体的体型"],"correct":0,"answer":"認知的世界","explanation":"資料では、正答は「認知的世界」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-026","q":"認知の歪みは、どの程度単純な刺激でも生じ得るか。","options":["人間関係だけ","単なる図形のような刺激","精神病患者の妄想だけ","複雑な文章だけ"],"correct":1,"answer":"単なる図形のような刺激","explanation":"資料では、正答は「単なる図形のような刺激」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-027","q":"人間という対象は、単純な図形と比べてどのような刺激だとされるか。","options":["価値観の入らない刺激","必ず同じ反応を生む刺激","はるかに複雑な情緒刺激","完全に中立な刺激"],"correct":2,"answer":"はるかに複雑な情緒刺激","explanation":"資料では、正答は「はるかに複雑な情緒刺激」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-028","q":"他者に関する情報を歪めやすい主観的フィルターとして、資料に挙げられている組合せはどれか。","options":["価値観・能力・感情・記憶","先入観・知能・気質・態度","感情・欲求・習慣・技能","価値観・先入観・感情・見方のくせ"],"correct":3,"answer":"価値観・先入観・感情・見方のくせ","explanation":"資料では、正しい組合せは「価値観・先入観・感情・見方のくせ」である。","section":"3. 他者理解の視点"},{"id":"jin1-c-029","q":"正当な他者把握を妨げやすいものの総称として、資料が用いる表現は何か。","options":["主観的なフィルター","生理的な尺度","形式分析","客観的なカメラ"],"correct":0,"answer":"主観的なフィルター","explanation":"資料では、正答は「主観的なフィルター」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-c-030","q":"性格や人格が初めて観察可能になるのは、何に反映されたときか。","options":["価値観","行動","体型","遺伝情報"],"correct":1,"answer":"行動","explanation":"資料では、正答は「行動」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-031","q":"人間の行動を変化させる環境条件の例として、資料に挙げられているものはどれか。","options":["根源特性","元型","暑さ","前意識"],"correct":2,"answer":"暑さ","explanation":"資料では、正答は「暑さ」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-032","q":"疲労と並び、環境条件による行動変化の例として資料に挙げられているものは何か。","options":["類型","抑圧","個性化","空腹"],"correct":3,"answer":"空腹","explanation":"資料では、正答は「空腹」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-033","q":"類似した環境下で多くの人に共通して現れる面を何というか。","options":["共通性","個人差","独自特性","劣等機能"],"correct":0,"answer":"共通性","explanation":"資料では、正答は「共通性」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-034","q":"類似した環境下でも人によって異なって現れる面を何というか。","options":["共通性","個人差","集合的無意識","現実原則"],"correct":1,"answer":"個人差","explanation":"資料では、正答は「個人差」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-035","q":"同一状況下でさえ生じる差異を表す資料中の表現は何か。","options":["社会的な規範","意識的な抑圧","個人的な差異","普遍的な同一性"],"correct":2,"answer":"個人的な差異","explanation":"資料では、正答は「個人的な差異」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-036","q":"人格の通状況的一貫性とは、状況が変わっても個人独自に何が現れることか。","options":["測定不能な体型","完全に無作為な変化","一時的な環境反応だけ","一貫した特徴"],"correct":3,"answer":"一貫した特徴","explanation":"資料では、正答は「一貫した特徴」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-037","q":"パーソナリティ概念によって行うこととして挙げられている組合せはどれか。","options":["個人の独自性の理解・説明・予測","頭蓋骨の測定・分類・治療","衝動の抑圧・否認・歪曲","知能の測定・採点・診断"],"correct":0,"answer":"個人の独自性の理解・説明・予測","explanation":"資料では、正答は「個人の独自性の理解・説明・予測」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-038","q":"変容する環境の中でも保たれる核心を表す言葉は何か。","options":["身体類型","その人らしさ","公的な私","社会体制"],"correct":1,"answer":"その人らしさ","explanation":"資料では、正答は「その人らしさ」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-039","q":"パーソナリティを三層構造で捉えた人物は誰か。","options":["ホーナイ","コスタとマックレー","大山","ジェンドリン"],"correct":2,"answer":"大山","explanation":"資料では、正答は「大山」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-040","q":"人格を示す三層構造を構成する概念の組合せはどれか。","options":["外向性・神経症傾向・開放性","意識・前意識・無意識","イド・自我・ orrect":0,"answer":"肥満型","explanation":"資料では、循環（躁うつ）気質および躁うつ病と対応づけられた体型に当たるのは「肥満型」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-070","q":"粘着気質およびてんかんと対応づけられた体型はどれか。","options":["内胚葉型","闘士型","肥満型","細長型"],"correct":1,"answer":"闘士型","explanation":"資料では、粘着気質およびてんかんと対応づけられた体型に当たるのは「闘士型」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-071","q":"シェルドンが消化器系の発達と結びつけた体型はどれか。","options":["闘士型","肥満型","内胚葉型","細長型"],"correct":2,"answer":"内胚葉型","explanation":"資料では、シェルドンが消化器系の発達と結びつけた体型に当たるのは「内胚葉型」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-072","q":"細長型に対応づけられ、非社交的・静か・鈍感さなどを示す気質はどれか。","options":["粘着気質","循環（躁うつ）気質","内臓型気質","分裂気質"],"correct":3,"answer":"分裂気質","explanation":"資料では、細長型に対応づけられ、非社交的・静か・鈍感さなどを示す気質に当たるのは「分裂気質」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-073","q":"肥満型に対応づけられ、社交的・親切・温厚などを示す気質はどれか。","options":["循環（躁うつ）気質","分裂気質","内臓型気質","粘着気質"],"correct":0,"answer":"循環（躁うつ）気質","explanation":"資料では、肥満型に対応づけられ、社交的・親切・温厚などを示す気質に当たるのは「循環（躁うつ）気質」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-074","q":"闘士型に対応づけられ、頑固・精力的・几帳面などを示す気質はどれか。","options":["内臓型気質","粘着気質","循環（躁うつ）気質","分裂気質"],"correct":1,"answer":"粘着気質","explanation":"資料では、闘士型に対応づけられ、頑固・精力的・几帳面などを示す気質に当たるのは「粘着気質」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-075","q":"シェルドンが内胚葉型に対応づけた気質はどれか。","options":["粘着気質","循環（躁うつ）気質","内臓型気質","分裂気質"],"correct":2,"answer":"内臓型気質","explanation":"資料では、シェルドンが内胚葉型に対応づけた気質に当たるのは「内臓型気質」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-076","q":"細長型・分裂気質との対応が示された病気はどれか。","options":["神経症","てんかん","躁うつ病","統合失調症"],"correct":3,"answer":"統合失調症","explanation":"資料では、細長型・分裂気質との対応が示された病気に当たるのは「統合失調症」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-077","q":"肥満型・循環気質との対応が示された病気はどれか。","options":["躁うつ病","神経症","てんかん","統合失調症"],"correct":0,"answer":"躁うつ病","explanation":"資料では、肥満型・循環気質との対応が示された病気に当たるのは「躁うつ病」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-078","q":"闘士型・粘着気質との対応が示された病気はどれか。","options":["躁うつ病","てんかん","統合失調症","神経症"],"correct":1,"answer":"てんかん","explanation":"資料では、闘士型・粘着気質との対応が示された病気に当たるのは「てんかん」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-079","q":"クレッチマーによる体型・気質・病気の三つの対応表に含まれていない病気はどれか。","options":["統合失調症","てんかん","神経症","躁うつ病"],"correct":2,"answer":"神経症","explanation":"資料では、この三つの対応表には含まれていない病気に当たるのは「神経症」である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-080","q":"当初の臨床対象に限らず、後にはどのような人にも当てはまるとされたか。","options":["精神病患者だけ","高齢者だけ","犯罪者だけ","健常者"],"correct":3,"answer":"健常者","explanation":"資料では、正答は「健常者」と説明されている。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-081","q":"精神医学で長く受け入れられたのは、何を示す用語としてか。","options":["病前性格","生活史","身体症状","知能指数"],"correct":0,"answer":"病前性格","explanation":"資料では、正答は「病前性格」と説明されている。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-082","q":"現在でも有効とされる実用面は何か。","options":["中間型を数値で完全に測れる","性格情報を端的に表現し共有できる","遺伝と環境を分離できる","知能を正確に算出できる"],"correct":1,"answer":"性格情報を端的に表現し共有できる","explanation":"資料では、正答は「性格情報を端的に表現し共有できる」と説明されている。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-083","q":"問題点として不明確だとされる関係の一つはどれか。","options":["自己開示とフィードバックの関係","現実検討と適応の関係","気質と精神病の関係","自己概念と経験の関係"],"correct":2,"answer":"気質と精神病の関係","explanation":"資料では、正答は「気質と精神病の関係」と説明されている。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-084","q":"クレッチマーの類型論で、因果関係が不明確だとされるものはどれか。","options":["意識と無意識の関係","イドと自我の関係","自我と超自我の関係","体型と気質の関係"],"correct":3,"answer":"体型と気質の関係","explanation":"資料では、正答は「体型と気質の関係」と説明されている。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-085","q":"健常な男子大学生の身体計測を用いた類型論の提唱者は誰か。","options":["シェルドン","アイゼンク","アンナ・フロイト","大山"],"correct":0,"answer":"シェルドン","explanation":"資料では、正答は「シェルドン」と説明されている。","section":"9. シェルドンの類型論"},{"id":"jin1-c-086","q":"シェルドンの類型論の調査対象はどのような人々だったか。","options":["精神病患者","健常な男子大学生","乳幼児","成人女性だけ"],"correct":1,"answer":"健常な男子大学生","explanation":"資料では、正答は「健常な男子大学生」と説明されている。","section":"9. シェルドンの類型論"},{"id":"jin1-c-087","q":"体型との統計的関連を検討した、胎生期の発達単位は何か。","options":["自律神経だけ","頭蓋骨","胚葉","血液型"],"correct":2,"answer":"胚葉","explanation":"資料では、正答は「胚葉」と説明されている。","section":"9. シェルドンの類型論"},{"id":"jin1-c-088","q":"胚葉の発達と体型・性格を結びつけるシェルドンの理論は、別名何と呼ばれるか。","options":["分析心理学","構造論","類型論","発生的類型論"],"correct":3,"answe ,"explanation":"資料では、正答は「感覚と直観」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-109","q":"最も発達した心の機能を何というか。","options":["優越機能","劣等機能","自我機能","適応機能"],"correct":0,"answer":"優越機能","explanation":"資料では、正答は「優越機能」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-110","q":"最も発達した機能の対極にあるものを何というか。","options":["統合機能","劣等機能","自己実現傾向","優越機能"],"correct":1,"answer":"劣等機能","explanation":"資料では、正答は「劣等機能」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-111","q":"二つの方向と四つの機能を組み合わせると、性格類型はいくつになるか。","options":["10","3つ","8つ","12"],"correct":2,"answer":"8つ","explanation":"資料では、正答は「8つ」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-112","q":"意識と無意識はどのような関係にあると考えられたか。","options":["一方向の因果関係だけ","常に対立して統合不能","互いに無関係","相補的な関係"],"correct":3,"answer":"相補的な関係","explanation":"資料では、正答は「相補的な関係」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-113","q":"心の問題が生じる背景として、抑圧された側面が何を回復しようとするとされたか。","options":["自己の全体性","体型の均一性","社会階級の固定","知能指数の高さ"],"correct":0,"answer":"自己の全体性","explanation":"資料では、正答は「自己の全体性」と説明されている。","section":"10. ユングの類型論"},{"id":"jin1-c-114","q":"基本的生活領域のどこへ価値を置くかで性格を分類した人物は誰か。","options":["ロジャーズ","シュプランガー","クレッチマー","オールポート"],"correct":1,"answer":"シュプランガー","explanation":"資料では、正答は「シュプランガー」と説明されている。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-115","q":"シュプランガーの価値類型はいくつ設定されているか。","options":["4つ","16","6つ","5つ"],"correct":2,"answer":"6つ","explanation":"資料では、正答は「6つ」と説明されている。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-116","q":"客観的・論理的な知識体系を創造することに価値を置く類型はどれか。","options":["審美型","権力型","経済型","理論型"],"correct":3,"answer":"理論型","explanation":"資料では、客観的・論理的な知識体系を創造することに価値を置く類型に当たるのは「理論型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-117","q":"事物の経済性や功利性を重視する類型はどれか。","options":["経済型","審美型","権力型","理論型"],"correct":0,"answer":"経済型","explanation":"資料では、事物の経済性や功利性を重視する類型に当たるのは「経済型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-118","q":"繊細で敏感であり、美しいものに価値を置く類型はどれか。","options":["権力型","審美型","理論型","宗教型"],"correct":1,"answer":"審美型","explanation":"資料では、繊細で敏感であり、美しいものに価値を置く類型に当たるのは「審美型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-119","q":"神への奉仕や宗教体験を重視する類型はどれか。","options":["社会型","経済型","宗教型","権力型"],"correct":2,"answer":"宗教型","explanation":"資料では、神への奉仕や宗教体験を重視する類型に当たるのは「宗教型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-120","q":"権力を求め、他人を支配しようとする類型はどれか。","options":["理論型","審美型","社会型","権力型"],"correct":3,"answer":"権力型","explanation":"資料では、権力を求め、他人を支配しようとする類型に当たるのは「権力型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-121","q":"人間を愛し、人を進歩させることに価値を置く類型はどれか。","options":["社会型","宗教型","理論型","審美型"],"correct":0,"answer":"社会型","explanation":"資料では、人間を愛し、人を進歩させることに価値を置く類型に当たるのは「社会型」である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-122","q":"各人が志向する文化価値を規定することが多いものとして挙げられているのは何か。","options":["血液型だけ","職業など","頭蓋骨の形だけ","筆跡だけ"],"correct":1,"answer":"職業など","explanation":"資料では、正答は「職業など」と説明されている。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-123","q":"現実の個人を一つの型に決められないことがあるのはなぜか。","options":["身体計測が必要だから","価値志向が一切ないため","複数の価値志向をもつことがあるため","全員が同じ職業だから"],"correct":2,"answer":"複数の価値志向をもつことがあるため","explanation":"資料では、正答は「複数の価値志向をもつことがあるため」と説明されている。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-124","q":"シュプランガーの価値類型論は何を分類基準とするか。","options":["身体の太り方","神経系の活動","心的エネルギーの量","最も価値を置く生活領域"],"correct":3,"answer":"最も価値を置く生活領域","explanation":"資料では、正答は「最も価値を置く生活領域」と説明されている。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-125","q":"性格形成で社会体制を重視した人物は誰か。","options":["フロム","アンナ・フロイト","大山","ホーナイ"],"correct":0,"answer":"フロム","explanation":"資料では、正答は「フロム」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-126","q":"フロムの類型論で個人の性格を規定すると重視されたものは何か。","options":["頭蓋骨の形だけ","社会や経済の仕組み","筆跡だけ","体型だけ"],"correct":1,"answer":"社会や経済の仕組み","explanation":"資料では、正答は「社会や経済の仕組み」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-127","q":"社会的な在り方に基づく性格類型はいくつか。","options":["10","3つ","5つ","12"],"correct":2,"answer":"5つ","explanation":"資料では、正答は「5つ」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-128","q":"労働階級の労働を不当に利用するとされた資本家にみられる型はどれか。","options":["貯蔵的性格","受容的性格","生産的性格","搾取的性格"],"correct":3,"answer":"搾取的性格","explanation":"資料では、労働階級の労働を不当に利用するとされた資本家にみられる型に当たるのは「搾取的性格」である。","section":"12. フロムの類型論"},{"id":"jin1-c-129","q":"金銭や利権をため込んで安心を得ようとする型はどれか。","options":["貯蔵的性格","市場的性格","搾取的性格","受容的性格"],"correct":0,"answer":"貯蔵的性格","explanation":"資料では、金銭や利権をため込んで安心を得ようとする型に当たるのは「貯蔵的性格」である。","section":"12. フロムの類型論"},{"id":"jin1-c-130","q":"所得格差・生活水準の違い・主従関係を従順に受け入れ、抵抗できない政治的従属者に多い型はどれか。","options":["搾取的性格","受容的性格","貯蔵的性格","生産的性格"],"correct":1,"answer":"受容的性格","explanation":"資料では、所得格差・生活水準の違い・主従関係を従順に受け入れ、抵抗できない政治的従属者に多い型に当たるのは「受容的性格」である。","section":"12. フロムの類型論"},{"id":"jin1-c-131","q":"能力・才能・権力を社会全体の利益や発展のため利他的に用いる型はどれか。","options":["受容的性格","市場的性格","生産的性格","搾取的性格"],"correct":2,"answer":"生産的性格","explanation":"資料では、能力・才能・権力を社会全体の利益や発展のため利他的に用いる型に当たるのは「生産的性格」である。","section":"12. フロムの類型論"},{"id":"jin1-c-132","q":"市場の受容に合わせて自分の価値観や能力を適応的に変える、資本主義社会に典型的な型はどれか。","options":["受容的性格","生産的性格","搾取的性格","市場的性格"],"correct":3,"answer":"市場的性格","explanation":"資料では、市場の受容に合わせて自分の価値観や能力を適応的に変える、資本主義社会に典型的な型に当たるのは「市場的性格」である。","section":"12. フロムの類型論"},{"id":"jin1-c-133","q":"安心を得るためにため込むものの組合せはどれか。","options":["金銭と利権","規範と道徳","知識と経験","感情と衝動"],"correct":0,"answer":"金銭と利権","explanation":"資料では、正答は「金銭と利権」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-134","q":"従順に受け入れるものとして挙げられた三つの組合せはどれか。","options":["意識・前意識・無意識","所得格差・生活水準の違い・主従関係","思考・感情・感覚","現実検討・適応・統合"],"correct":1,"answer":"所得格差・生活水準の違い・主従関係","explanation":"資料では、正答は「所得格差・生活水準の違い・主従関係」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-135","q":"利他的に用いるものとして挙げられた三つの組合せはどれか。","options":["不安・罪悪感・恥","金銭・利権・地位","能力・才能・権力","意識・無意識・前意識"],"correct":2,"answer":"能力・才能・権力","explanation":"資料では、正答は「能力・才能・権力」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-136","q":"資本主義社会に典型的だとされた型はどれか。","options":["搾取的性格","貯蔵的性格","受容的性格","市場的性格"],"correct":3,"answer":"市場的性格","explanation":"資料では、正答は「市場的性格」と説明されている。","section":"12. フロムの類型論"},{"id":"jin1-c-137","q":"基本的な対人関係の態度に注目した人物は誰か。","options":["ホーナイ","アンナ・フロイト","大山","フロム"],"correct":0,"answer":"ホーナイ","explanation":"資料では、正答は「ホーナイ」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-138","q":"ホーナイの類型論が分類基準としたものは何か。","options":["心的機構へのエネルギー配分","基本的な対人関係の態度","知能指数","体型と胚葉"],"correct":1,"answer":"基本的な対人関係の態度","explanation":"資料では、正答は「基本的な対人関係の態度」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-139","q":"設定された対人関係の型はいくつか。","options":["5つ","16","3つ","6つ"],"correct":2,"answer":"3つ","explanation":"資料では、正答は「3つ」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-140","q":"外向的・積極的で、対立を恐れず自己主張し、目標達成を目指す型はどれか。","options":["依存型","市場的性格","離反型","攻撃型"],"correct":3,"answer":"攻撃型","explanation":"資料では、外向的・積極的で、対立を恐れず自己主張し、目標達成を目指す型に当たるのは「攻撃型」である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-141","q":"同調的・消極的で、他者や集団の期待に応えて不安や緊張を和らげる型はどれか。","options":["依存型","離反型","攻撃型","市場的性格"],"correct":0,"answer":"依存型","explanation":"資料では、同調的・消極的で、他者や集団の期待に応えて不安や緊張を和らげる型に当たるのは「依存型」である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-142","q":"内向的で独立志向が強く、対人関係や競争を避けて内的世界を重視する型はどれか。","options":["市場的性格","離反型","依存型","攻撃型"],"correct":1,"answer":"離反型","explanation":"資料では、内向的で独立志向が強く、対人関係や競争を避けて内的世界を重視する型に当たるのは「離反型」である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-143","q":"市場の受容に合わせ、自分の価値観や能力を変えるフロムの型はどれか。","options":["依存型","攻撃型","市場的性格","離反型"],"correct":2,"answer":"市場的性格","explanation":"資料では、市場の受容に合わせ、自分の価値観や能力を変えるフロムの型に当たるのは「市場的性格」である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-144","q":"三つの対人関係パターンを人が形成する目的は何か。","options":["発達年齢を測るため","知能を高めるため","体型を変えるため","不安に対処するため"],"correct":3,"answer":"不安に対処するため","explanation":"資料では、正答は「不安に対処するため」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-145","q":"他者との対立を恐れない型はどれか。","options":["攻撃型","市場的性格","離反型","依存型"],"correct":0,"answer":"攻撃型","explanation":"資料では、正答は「攻撃型」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-146","q":"他者や集団の期待に応える型はどれか。","options":["市場的性格","依存型","離反型","攻撃型"],"correct":1,"answer":"依存型","explanation":"資料では、正答は「依存型」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-147","q":"対人関係や競争を避ける型はどれか。","options":["市場的性格","依存型","離反型","攻撃型"],"correct":2,"answer":"離反型","explanation":"資料では、正答は「離反型」と説明されている。","section":"13. ホーナイの類型論"},{"id":"jin1-c-148","q":"人々が共通して持つ性格特徴と、各特徴の組合せによって個人を理解する考え方は何か。","options":["状況主義","経済論","類型論","特性論"],"correct":3,"answer":"特性論","explanation":"資料では、正答は「特性論」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-149","q":"人格の特性論では、個人差を何の差として捉えるか。","options":["特性の程度","類型の有無だけ","体型の種類だけ","無意識の層数"],"correct":0,"answer":"特性の程度","explanation":"資料では、正答は「特性の程度」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-150","q":"個人差を程度の差として扱うため適している研究の組合せはどれか。","options":["宗教体験の分類だけ","実証的・統計的研究","神話の解釈だけ","筆跡の直観的判断"],"correct":1,"answer":"実証的・統計的研究","explanation":"資料では、正答は「実証的・統計的研究」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-151","q":"人格の特性論の長所として挙げられるものは何か。","options":["中間型を扱えない","個人の全体性だけを直観できる","性格を詳細に把握できる","状況を完全に無視できる"],"correct":2,"answer":"性格を詳細に把握できる","explanation":"資料では、正答は「性格を詳細に把握できる」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-152","q":"課題として捉えにくいとされるものは何か。","options":["統計的個人差","共通する特徴","測定得点","性格全体のまとまり"],"correct":3,"answer":"性格全体のまとまり","explanation":"資料では、正答は「性格全体のまとまり」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-153","q":"人格の特性論で、全体性と並んで捉えにくいとされるものは何か。","options":["個性的な特徴などの独自性","多くの人に共通する特性","数値化された程度差","因子分析の結果"],"correct":0,"answer":"個性的な特徴などの独自性","explanation":"資料では、正答は「個性的な特徴などの独自性」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-154","q":"代表的理論に含まれないものはどれか。","options":["アイゼンクの特性論","クレッチマーの類型論","ビッグファイブ理論","オールポートの特性論"],"correct":1,"answer":"クレッチマーの類型論","explanation":"資料では、正答は「クレッチマーの類型論」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-155","q":"複数の性格特性をどのように扱って人格を理解するか。","options":["一つだけを絶対視する","すべて同一とみなす","組み合わせとして扱う","体型へ置き換える"],"correct":2,"answer":"組み合わせとして扱う","explanation":"資料では、正答は「組み合わせとして扱う」と説明されている。","section":"14. 特性論"},{"id":"jin1-c-156","q":"『性格特性』という概念を初めて使用した人物は誰か。","options":["ロジャーズ","クレッチマー","ホーナイ","オールポート"],"correct":3,"answer":"オールポート","explanation":"資料では、正答は「オールポート」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-157","q":"特性論的な性格理論を体系化した人物は誰か。","options":["オールポート","コスタとマックレー","ジェンドリン","シェルドン"],"correct":0,"answer":"オールポート","explanation":"資料では、正答は「オールポート」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-158","q":"一人の個人に特有の特徴を指すものはどれか。","options":["共通特性","個別特性","態度的特性","表出的特性"],"correct":1,"answer":"個別特性","explanation":"資料では、一人の個人に特有の特徴に当たるのは「個別特性」である。","section":"15. オールポートの特性論"},{"id":"jin1-c-159","q":"多くの人に共通してみられる特徴を指すものはどれか。","options":["態度的特性","表出的特性","共通特性","個別特性"],"correct":2,"answer":"共通特性","explanation":"資料では、多くの人に共通してみられる特徴に当たるのは「共通特性」である。","section":"15. オールポートの特性論"},{"id":"jin1-c-160","q":"共通特性を分けたうち、4つ設定された側面を指すものはどれか。","options":["態度的特性","共通特性","個別特性","表出的特性"],"correct":3,"answer":"表出的特性","explanation":"資料では、共通特性を分けたうち、4つ設定された側面に当たるのは「表出的特性」である。","section":"15. オールポートの特性論"},{"id":"jin1-c-161","q":"共通特性を分けたうち、10設定された側面を指すものはどれか。","options":["態度的特性","表出的特性","共通特性","個別特性"],"correct":0,"answer":"態度的特性","explanation":"資料では、共通特性を分けたうち、10設定された側面に当たるのは「態度的特性」である。","section":"15. オールポートの特性論"},{"id":"jin1-c-162","q":"共通特性のうち、表出的なものはいくつに分けられたか。","options":["2つ","4つ","10","3つ"],"correct":1,"answer":"4つ","explanation":"資料では、正答は「4つ」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-163","q":"共通特性のうち、態度的なものはいくつに分けられたか。","options":["6つ","2つ","10","8つ"],"correct":2,"answer":"10","explanation":"資料では、正答は「10」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-164","q":"諸特性の程度を測定してプロフィール化したものを何というか。","options":["インク・ブロット","エゴグラム","フェルトセンス","サイコグラフ"],"correct":3,"answer":"サイコグラフ","explanation":"資料では、正答は「サイコグラフ」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-165","q":"オールポートらの『人格目録』のプロフィールは何を記述するために作成されたか。","options":["個人のパーソナリティ","神経系の構造","社会体制","身体疾患"],"correct":0,"answer":"個人のパーソナリティ","explanation":"資料では、正答は「個人のパーソナリティ」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-166","q":"オールポートらの特性論で用いられた特性の選定方法には、どのような問題があったか。","options":["臨床診断だけで確定されたこと","便宜的に選定されたこと","選定が一切行われなかったこと","因子分析だけで選定されたこと"],"correct":1,"answer":"便宜的に選定されたこと","explanation":"資料では、正答は「便宜的に選定されたこと」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-167","q":"特性が便宜的に選ばれたため残された課題は何か。","options":["流動性","身体性","妥当性","意識性"],"correct":2,"answer":"妥当性","explanation":"資料では、正答は「妥当性」と説明されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-168","q":"オールポートの考えを基礎に因子分析を用いた人物は誰か。","options":["アンナ・フロイト","大山","フロム","キャッテル"],"correct":3,"answer":"キャッテル","explanation":"資料では、正答は「キャッテル」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-169","q":"オールポートが性格特性を最初に分けた組合せはどれか。","options":["独自特性と共通特性","個人的無意識と集合的無意識","外向型と内向型","優越機能と劣等機能"],"correct":0,"answer":"独自特性と共通特性","explanation":"資料では、正答は「独自特性と共通特性」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-170","q":"外から直接観察できる行動特徴の集まりはどれか。","options":["独自特性","表面特性","根源特性","共通特性"],"correct":1,"answer":"表面特性","explanation":"資料では、外から直接観察できる行動特徴の集まりに当たるのは「表面特性」である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-171","q":"直接には観察されず、複数の行動特徴の背後に想定されるものはどれか。","options":["表面特性","共通特性","根源特性","独自特性"],"correct":2,"answer":"根源特性","explanation":"資料では、直接には観察されず、複数の行動特徴の背後に想定されるものに当たるのは「根源特性」である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-172","q":"個人に特有の特徴として分類されたものはどれか。","options":["根源特性","表面特性","共通特性","独自特性"],"correct":3,"answer":"独自特性","explanation":"資料では、個人に特有の特徴として分類されたものに当たるのは「独自特性」である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-173","q":"多くの人に共通する特徴として分類されたものはどれか。","options":["共通特性","根源特性","表面特性","独自特性"],"correct":0,"answer":"共通特性","explanation":"資料では、多くの人に共通する特徴として分類されたものに当たるのは「共通特性」である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-174","q":"因子分析で当初抽出された表面特性はいくつか。","options":["12","35","5つ","16"],"correct":1,"answer":"35","explanation":"資料では、正答は「35」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-175","q":"当初提唱された根源特性はいくつか。","options":["2つ","8つ","12","3つ"],"correct":2,"answer":"12","explanation":"資料では、正答は「12」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-176","q":"当初の根源特性へ後から追加された特性はいくつか。","options":["10","3つ","12","4つ"],"correct":3,"answer":"4つ","explanation":"資料では、正答は「4つ」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-177","q":"最終的に見いだされた根源特性はいくつか。","options":["16","35","6つ","2つ"],"correct":0,"answer":"16","explanation":"資料では、正答は「16」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-178","q":"最終的な根源特性を測定するために作成された検査は何か。","options":["MPI","16PF人格検査","MMPI","NEO-PI-R"],"correct":1,"answer":"16PF人格検査","explanation":"資料では、正答は「16PF人格検査」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-179","q":"外から見える複数の行動特徴の背後にあるものとして想定されたのは何か。","options":["共通特性","独自特性","根源特性","表面特性"],"correct":2,"answer":"根源特性","explanation":"資料では、正答は「根源特性」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-180","q":"キャッテルの特性論で、特性抽出に使われた統計的方法は何か。","options":["自由連想法","質疑法","行動描写法","因子分析"],"correct":3,"answer":"因子分析","explanation":"資料では、正答は「因子分析」と説明されている。","section":"16. キャッテルの特性論"},{"id":"jin1-c-181","q":"類型論と特性論の両方を取り入れた人物は誰か。","options":["アイゼンク","ミッシェル","クリス","ユング"],"correct":0,"answer":"アイゼンク","explanation":"資料では、正答は「アイゼンク」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-182","q":"パーソナリティをいくつの水準からなる階層構造として捉えたか。","options":["6つ","4つ","35","8つ"],"correct":1,"answer":"4つ","explanation":"資料では、正答は「4つ」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-183","q":"日常生活における個人の一回ごとの具体的行動で、階層の最下位にあるものはどれか。","options":["特性","習慣的反応","特殊的反応","類型"],"correct":2,"answer":"特殊的反応","explanation":"資料では、日常生活における個人の一回ごとの具体的行動で、階層の最下位にあるものに当たるのは「特殊的反応」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-184","q":"具体的行動が繰り返されることで形成されるものはどれか。","options":["特殊的反応","類型","特性","習慣的反応"],"correct":3,"answer":"習慣的反応","explanation":"資料では、具体的行動が繰り返されることで形成されるものに当たるのは「習慣的反応」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-185","q":"複数の習慣的反応の背後に存在するとされるものはどれか。","options":["特性","特殊的反応","類型","習慣的反応"],"correct":0,"answer":"特性","explanation":"資料では、複数の習慣的反応の背後に存在するとされるものに当たるのは「特性」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-186","q":"複数の特性の背後にある、最上位の因子はどれか。","options":["特殊的反応","類型","特性","習慣的反応"],"correct":1,"answer":"類型","explanation":"資料では、複数の特性の背後にある、最上位の因子に当たるのは「類型」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-187","q":"階層を下位から上位へ並べた正しい順序はどれか。","options":["特殊的反応→特性→習慣的反応→類型","習慣的反応→特殊的反応→類型→特性","特殊的反応→習慣的反応→特性→類型","特性→類型→特殊的反応→習慣的反応"],"correct":2,"answer":"特殊的反応→習慣的反応→特性→類型","explanation":"資料では、正答は「特殊的反応→習慣的反応→特性→類型」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-188","q":"アイゼンクが示した三つの類型次元の組合せはどれか。","options":["外向性―内向性・協調性・開放性","循環気質・粘着気質・分裂気質","理論型・経済型・審美型","外向性―内向性・神経症的傾向・精神病的傾向"],"correct":3,"answer":"外向性―内向性・神経症的傾向・精神病的傾向","explanation":"資料では、正しい組合せは「外向性―内向性・神経症的傾向・精神病的傾向」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-189","q":"三つの類型次元に含まれないものはどれか。","options":["開放性","神経症的傾向","外向性―内向性","精神病的傾向"],"correct":0,"answer":"開放性","explanation":"資料では、正答は「開放性」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-190","q":"外向性―内向性の生理学的基礎として想定されたものは何か。","options":["消化器系の発達","大脳皮質の興奮・抑制","筋肉と骨の発達","血液型"],"correct":1,"answer":"大脳皮質の興奮・抑制","explanation":"資料では、正答は「大脳皮質の興奮・抑制」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-191","q":"神経症的傾向の生理学的基礎として想定されたものは何か。","options":["胚葉の数","大脳皮質の興奮・抑制","自律神経系の活動","感覚器系の発達"],"correct":2,"answer":"自律神経系の活動","explanation":"資料では、正答は「自律神経系の活動」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-192","q":"二つの生理的次元を取り上げて作成された検査は何か。","options":["Y-G人格検査","MMPI","16PF","MPI（モーズレイ性格検査）"],"correct":3,"answer":"MPI（モーズレイ性格検査）","explanation":"資料では、正答は「MPI（モーズレイ性格検査）」と説明されている。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-193","q":"語彙研究と因子分析で性格特性を五次元に整理した人物は誰か。","options":["ゴールドバーグ","アイゼンク","ロジャーズ","クレッチマー"],"correct":0,"answer":"ゴールドバーグ","explanation":"資料では、正答は「ゴールドバーグ」と説明されている。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-194","q":"ゴールドバーグらの語彙研究が発展させたのは、誰以来の特性研究か。","options":["ユング","オールポート","アイゼンク","アンナ・フロイト"],"correct":1,"answer":"オールポート","explanation":"資料では、正答は「オールポート」と説明されている。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-195","q":"パーソナリティを基本的な五特性で説明する枠組みを何というか。","options":["類型論","自己理論","5因子モデル","精神力動論"],"correct":2,"answer":"5因子モデル","explanation":"資料では、正答は「5因子モデル」と説明されている。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-196","q":"活動的である傾向はどの特性か。","options":["開放性","調和性（協調性）","誠実性（勤勉性）","外向性"],"correct":3,"answer":"外向性","explanation":"資料では、活動的である傾向に当たるのは「外向性」である。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-197","q":"不安・抑うつ・傷つきやすさを示す傾向 」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-207","q":"従来の特性論が行動にあると考えていたものは何か。","options":["知能だけとの相関","無意識だけの支配","時間や状況を超えた一貫性","完全な無作為性"],"correct":2,"answer":"時間や状況を超えた一貫性","explanation":"資料では、正答は「時間や状況を超えた一貫性」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-208","q":"ミッシェルは、性格特性と何との関連が弱いと主張したか。","options":["発達年齢","血液型","筆跡","行動"],"correct":3,"answer":"行動","explanation":"資料では、正答は「行動」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-209","q":"行動にみられないと主張された一貫性を何というか。","options":["通状況的一貫性","時間的一貫性","測定的一貫性","遺伝的一貫性"],"correct":0,"answer":"通状況的一貫性","explanation":"資料では、正答は「通状況的一貫性」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-210","q":"行動理解で重視すべき外的要因の組合せはどれか。","options":["気質と性格","環境と状況","思考と感情","体型と胚葉"],"correct":1,"answer":"環境と状況","explanation":"資料では、正答は「環境と状況」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-211","q":"外的要因を重視する立場を何というか。","options":["類型論","経済論","状況主義","特性論"],"correct":2,"answer":"状況主義","explanation":"資料では、正答は「状況主義」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-212","q":"論争で対置されたものの組合せはどれか。","options":["体型と気質","自我と自己","受容と共感","人（特性）と状況"],"correct":3,"answer":"人（特性）と状況","explanation":"資料では、正答は「人（特性）と状況」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-213","q":"現在、行動は何によって生じると考えられているか。","options":["パーソナリティ特性と状況の相互作用","特性だけ","状況だけ","体型だけ"],"correct":0,"answer":"パーソナリティ特性と状況の相互作用","explanation":"資料では、正答は「パーソナリティ特性と状況の相互作用」と説明されている。","section":"19. 一貫性論争"},{"id":"jin1-c-214","q":"心を一つの空間として三層に分けた理論の提唱者は誰か。","options":["ホーナイ","フロイト","コスタとマックレー","クリス"],"correct":1,"answer":"フロイト","explanation":"資料では、正答は「フロイト」と説明されている。","section":"20. 心の局所論"},{"id":"jin1-c-215","q":"心を意識・前意識・無意識に分ける考え方は何か。","options":["自己理論","構造論","心の局所論","体験過程理論"],"correct":2,"answer":"心の局所論","explanation":"資料では、正答は「心の局所論」と説明されている。","section":"20. 心の局所論"},{"id":"jin1-c-216","q":"フロイトの局所論で、心はいくつの層から成るか。","options":["2つ","10","4つ","3つ"],"correct":3,"answer":"3つ","explanation":"資料では、正答は「3つ」と説明されている。","section":"20. 心の局所論"},{"id":"jin1-c-217","q":"直接、自分の経験だと感じることができる心的内容はどれか。","options":["意識", "options":["クリス","ユング","ジェンドリン","キャッテル"],"correct":2,"answer":"ジェンドリン","explanation":"資料では、正答は「ジェンドリン」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-416","q":"身体感覚として体験される感情を明確化する心理療法は何か。","options":["精神分析療法","自由連想法","エンカウンター・グループ","フォーカシング"],"correct":3,"answer":"フォーカシング","explanation":"資料では、正答は「フォーカシング」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-417","q":"心理療法の成否に深く関わるものは何か。","options":["クライエントの感情体験","検査用紙の枚数","クライエントの体型","セラピストの年齢"],"correct":0,"answer":"クライエントの感情体験","explanation":"資料では、正答は「クライエントの感情体験」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-418","q":"感情は何として体験されるとされるか。","options":["知能得点","身体感覚","発達年齢","性格類型"],"correct":1,"answer":"身体感覚","explanation":"資料では、正答は「身体感覚」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-419","q":"最初に注意を向ける場所はどこか。","options":["他者の表情だけ","体型分類表","身体","統計表"],"correct":2,"answer":"身体","explanation":"資料では、正答は「身体」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-420","q":"言葉にならない不明確な意味を含んだ、気になる身体感覚はどれか。","options":["コンプレックス","フェルトシフト","ハンドル","フェルトセンス"],"correct":3,"answer":"フェルトセンス","explanation":"資料では、言葉にならない不明確な意味を含んだ、気になる身体感覚に当たるのは「フェルトセンス」である。","section":"40. フォーカシング"},{"id":"jin1-c-421","q":"身体感覚をぴったり表現するイメージや名前はどれか。","options":["ハンドル","フェルトセンス","コンプレックス","フェルトシフト"],"correct":0,"answer":"ハンドル","explanation":"資料では、身体感覚をぴったり表現するイメージや名前に当たるのは「ハンドル」である。","section":"40. フォーカシング"},{"id":"jin1-c-422","q":"身体感覚と表現が一致したときに生じる『これだ！』という感じへの変化はどれか。","options":["フェルトセンス","フェルトシフト","コンプレックス","ハンドル"],"correct":1,"answer":"フェルトシフト","explanation":"資料では、身体感覚と表現が一致したときに生じる『これだ！』という感じへの変化に当たるのは「フェルトシフト」である。","section":"40. フォーカシング"},{"id":"jin1-c-423","q":"無意識内で感情によって一つにまとまった集合体はどれか。","options":["フェルトシフト","ハンドル","コンプレックス","フェルトセンス"],"correct":2,"answer":"コンプレックス","explanation":"資料では、無意識内で感情によって一つにまとまった集合体に当たるのは「コンプレックス」である。","section":"40. フォーカシング"},{"id":"jin1-c-424","q":"身体感覚が感じられるまで行うことは何か。","options":["すぐ言語化を強制する","否認する","採点する","待つ"],"correct":3,"answer":"待つ","explanation":"資料では、正答は「待つ」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-425","q":"フェルトセンスに対して探すものは何か。","options":["ぴったり表現するイメージや名前","体型の名称","知能指数","価値類型"],"correct":0,"answer":"ぴったり表現するイメージや名前","explanation":"資料では、正答は「ぴったり表現するイメージや名前」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-426","q":"フェルトシフトの実感によって得られるものは何か。","options":["発達年齢","新たな気づき","社会的地位","体型の変化"],"correct":1,"answer":"新たな気づき","explanation":"資料では、正答は「新たな気づき」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-c-427","q":"新たな気づきをどうすることで効果が発揮されるか。","options":["投影する","否認する","受容する","抑圧する"],"correct":2,"answer":"受容する","explanation":"資料では、正答は「受容する」と説明されている。","section":"40. フォーカシング"}];const STORAGE_KEY="personality-part1-choice-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function answerChoice(choice){
  if(state.answered)return;const i=currentIndex();if(i===null)return;const q=questions[i];state.answered=true;const ok=choice===q.correct;record(i,ok);
  [...document.querySelectorAll('.option')].forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');else if(k===choice)b.classList.add('wrong');else b.classList.add('dim');});
  $('feedback').innerHTML=`<div class="answerbox ${ok?'ok':'bad'}"><b>${ok?'正解！':'不正解'}</b><div>正答：${escapeHtml(q.answer)}</div><div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('history').textContent=historyText(rec(i));$('retry').disabled=false;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('options').innerHTML='';$('feedback').innerHTML='';$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;
  $('options').innerHTML=q.options.map((o,k)=>`<button class="option" onclick="answerChoice(${k})"><span class="letter">${LETTERS[k]}</span><span>${escapeHtml(o)}</span></button>`).join('');$('feedback').innerHTML='';$('retry').disabled=!state.answered;
}
render();
</script></body></html>
