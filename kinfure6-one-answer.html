Set Phrases","kind":"special"},{"en":"wear and tear","ja":"摩耗","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"},{"en":"well in advance","ja":"十分前もって","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"},{"en":"when it comes to","ja":"～に関して言えば","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"},{"en":"with the exception of","ja":"～を例外として","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"},{"en":"within walking distance","ja":"徒歩圏内","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"},{"en":"work ethic","ja":"勤労意欲","pos":[],"page":9,"section":"120 Set Phrases","kind":"special"}];const STORAGE="kinfure6_oneanswer_stats_v1",MENUKEY="kinfure6_oneanswer_menu_hidden_v1";
const $=id=>document.getElementById(id);
const POS=['名詞','動詞','形容詞','副詞','前置詞','接続詞'];
let current=null,currentMode=null,session={answered:0,correct:0};
let stats=JSON.parse(localStorage.getItem(STORAGE)||'{}');
function baseKey(x){return x.section+'|'+x.kind+'|'+x.page+'|'+x.en+'|'+x.ja}
function statKey(x,m){return m+'|'+baseKey(x)}
function getStat(x,m){return stats[statKey(x,m)]||{wrong:0,correct:0}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(stats))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffled(a){return a.slice().sort(()=>Math.random()-.5)}
function filtered(){
 let arr=WORDS.slice(),s=$('scope').value,m=$('mode').value;
 if(s==='main')arr=arr.filter(x=>x.kind==='main');
 if(s==='related')arr=arr.filter(x=>x.kind==='related');
 if(s==='phrases')arr=arr.filter(x=>x.kind==='special');
 if(s==='unanswered')arr=arr.filter(x=>{const st=getStat(x,m);return st.correct===0&&st.wrong===0});
 if(s==='wrong'||s==='wrong1')arr=arr.filter(x=>getStat(x,m).wrong>=1);
 if(s==='wrong2')arr=arr.filter(x=>getStat(x,m).wrong>=2);
 if(m.startsWith('pos'))arr=arr.filter(x=>x.pos&&x.pos.length&&x.pos.every(p=>POS.includes(p)));
 return arr;
}
function updateStats(){
 const p=filtered();$('pool').textContent=p.length;$('answered').textContent=session.answered;$('correct').textContent=session.correct;
 $('rate').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'0%';
}
function nextQ(){
 currentMode=$('mode').value;const p=filtered();updateStats();
 if(!p.length){$('word').textContent='該当する問題がありません';$('body').innerHTML='';$('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');return}
 current=p[Math.floor(Math.random()*p.length)];
 $('word').textContent=current.en;$('kind').textContent=currentMode.startsWith('ja')?'英語 → 日本語':'英語 → 品詞';
 $('rel').textContent=current.kind==='main'?'Score 990｜見出し語':current.kind==='related'?'Score 990｜関連語・派生語':'120 Set Phrases';
 $('page').textContent='PDF p.'+current.page;$('miss').textContent='誤答 '+getStat(current,currentMode).wrong+'回';
 $('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');renderBody();
}
function mark(ok){let s=getStat(current,currentMode);if(ok)s.correct++;else s.wrong++;stats[statKey(current,currentMode)]=s;save();session.answered++;if(ok)session.correct++;updateStats();$('miss').textContent='誤答 '+s.wrong+'回';$('next').classList.remove('hidden')}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
$('start').onclick=nextQ;$('shuffle').onclick=nextQ;$('next').onclick=nextQ;$('scope').onchange=updateStats;$('mode').onchange=()=>{currentMode=$('mode').value;updateStats();if(current)nextQ()};

let menuIsHidden=localStorage.getItem(MENUKEY)==='1';
function applyMenu(){['introCard','menuCard','statsCard'].forEach(id=>$(id).classList.toggle('menuHidden',menuIsHidden));$('menuToggle').textContent=menuIsHidden?'メニューを表示':'メニューを非表示'}
$('menuToggle').onclick=()=>{menuIsHidden=!menuIsHidden;localStorage.setItem(MENUKEY,menuIsHidden?'1':'0');applyMenu()};applyMenu();currentMode=$('mode').value;updateStats();

function renderBody(){
 const b=$('body');b.innerHTML='';
 if(currentMode==='ja1'){b.innerHTML='<input id="textAns" type="text" placeholder="日本語訳を入力"><div class="note">表記ゆれがあるため、答えを表示したあと自分で○／×判定します。</div>';$('check').classList.remove('hidden');$('check').textContent='答えを見る';$('check').onclick=revealJA}
 else{b.innerHTML='<input id="textAns" type="text" placeholder="例：名詞、動詞"><div class="note">複数ある場合は「名詞、動詞」のように入力してください。</div>';$('check').classList.remove('hidden');$('check').textContent='答え合わせ';$('check').onclick=checkPOSText}
}
function revealJA(){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>答え：</strong>${esc(current.ja)}<div class="actions"><button class="btn primary" id="selfYes">正解にする</button><button class="btn danger" id="selfNo">不正解にする</button></div>`;$('check').classList.add('hidden');$('selfYes').onclick=()=>selfMark(true);$('selfNo').onclick=()=>selfMark(false)}
function selfMark(ok){mark(ok);$('selfYes').disabled=true;$('selfNo').disabled=true}
function checkPOSText(){let v=($('textAns').value||'').replace(/[\s、，,/・]+/g,' ').trim();let got=POS.filter(p=>v.includes(p)).sort(),ans=current.pos.slice().sort();let ok=got.length===ans.length&&got.every((x,i)=>x===ans[i]);showFeedback(ok,'正解：'+ans.join('・'));mark(ok);$('check').classList.add('hidden');$('textAns').disabled=true}
