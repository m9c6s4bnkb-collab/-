:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#667085;--line:#e4e7ec;--accent:#3448c5;--good:#137a4d;--bad:#b42318;--soft:#eef2ff}

<script>const QUESTIONS=[{"q": "心的過程の例として挙げられている3つの働きを答えよ。", "answers": ["知覚・記憶・思考", "知覚、記憶、思考"], "exp": "知覚・記憶・思考。", "topic": "感情基礎", "required": ["知覚", "記憶", "思考"], "id": "kan_sa_001"}, {"q": "原因が明らかで、生理的覚醒を伴うことがあり、比較的短時間の強い感情を何というか。", "answers": ["情動"], "exp": "情動。", "topic": "感情基礎", "id": "kan_sa_002"}, {"q": "原因が必ずしも明らかでなく、比較的長時間続く快・不快の感情状態を何というか。", "answers": ["ムード"], "exp": "ムード。", "topic": "感情基礎", "id": "kan_sa_003"}, {"q": "情動が主観的に体験される状態を何というか。", "answers": ["情動経験"], "exp": "情動経験。", "topic": "感情基礎", "id": "kan_sa_004"}, {"q": "ムードが主観的に体験される状態を何というか。", "answers": ["ムード体験"], "exp": "ムード体験。", "topic": "感情基礎", "id": "kan_sa_005"}, {"q": "中枢神経系を構成する2つを答えよ。", "answers": ["脳・脊髄", "脳、脊髄"], "exp": "脳と脊髄。", "topic": "神経系", "required": ["脳", "脊髄"], "id": "kan_sa_006"}, {"q": "末梢神経系を構成する2種類の神経を答えよ。", "answers": ["脳神経・脊髄神経", "脳神経、脊髄神経"], "exp": "脳神経と脊髄神経。", "topic": "神経系", "required": ["脳神経", "脊髄神経"], "id": "kan_sa_007"}, {"q": "体性神経系を構成する2種類の神経を答えよ。", "answers": ["感覚神経・運動神経", "感覚神経、運動神経"], "exp": "感覚神経と運動神経。", "topic": "神経系", "required": ["感覚神経", "運動神経"], "id": "kan_sa_008"}, {"q": "自律神経系を構成し、互いに拮抗的に作用する2つの神経を答えよ。", "answers": ["交感神経・副交感神経", "交感神経、副交感神経"], "exp": "交感神経と副交感神経。", "topic": "自律神経", "required": ["交感神経", "副交感神経"], "id": "kan_sa_009"}, {"q": "交感神経と副交感神経の拮抗的作用によって維持される体内環境の安定を何というか。", "answers": ["ホメオスタシス"], "exp": "ホメオスタシス。", "topic": "自律神経", "id": "kan_sa_010"}, {"q": "間脳の主要な2部位を答えよ。", "answers": ["視床・視床下部", "視床、視床下部"], "exp": "視床と視床下部。", "topic": "間脳", "required": ["視床", "視床下部"], "id": "kan_sa_011"}, {"q": "睡眠や概日リズムに関わり、松果体から分泌される物質は何か。", "answers": ["メラトニン"], "exp": "メラトニン。", "topic": "間脳", "id": "kan_sa_012"}, {"q": "小脳は脳全体のおよそ何分の1の大きさか。", "answers": ["10分の1", "1/10"], "exp": "約1/10。", "topic": "小脳", "id": "kan_sa_013"}, {"q": "小脳に含まれる神経細胞数は、中枢神経系全体のおよそどの程度か。", "answers": ["半分以上", "1/2以上"], "exp": "中枢神経系の半分以上。", "topic": "小脳", "id": "kan_sa_014"}, {"q": "原小脳の別名を答えよ。", "answers": ["前庭小脳"], "exp": "前庭小脳。", "topic": "小脳", "id": "kan_sa_015"}, {"q": "古小脳の別名を答えよ。", "answers": ["脊髄小脳"], "exp": "脊髄小脳。", "topic": "小脳", "id": "kan_sa_016"}, {"q": "新小脳の別名を答えよ。", "answers": ["橋小脳"], "exp": "橋小脳。", "topic": "小脳", "id": "kan_sa_017"}, {"q": "脳幹を構成する3部位を答えよ。", "answers": ["中脳・橋・延髄", "中脳、橋、延髄"], "exp": "中脳・橋・延髄。", "topic": "脳幹", "required": ["中脳", "橋", "延髄"], "id": "kan_sa_018"}, {"q": "広義の脳幹に含めることがある部位は何か。", "answers": ["間脳"], "exp": "間脳。", "topic": "脳幹", "id": "kan_sa_019"}, {"q": "覚醒・意識水準・睡眠、特にレム睡眠に関わる脳幹内の領域は何か。", "answers": ["脳幹網様体"], "exp": "脳幹網様体。", "topic": "脳幹", "id": "kan_sa_020"}, {"q": "線条体を構成する2つの神経核を答えよ。", "answers": ["尾状核・被殻", "尾状核、被殻"], "exp": "尾状核と被殻。", "topic": "大脳基底核", "required": ["尾状核", "被殻"], "id": "kan_sa_021"}, {"q": "大脳基底核の出力部として挙げられる2部位を答えよ。", "answers": ["淡蒼球内節・黒質網様部", "淡蒼球の内節・黒質の網様部", "淡蒼球内節、黒質網様部"], "exp": "淡蒼球内節と黒質網様部。", "topic": "大脳基底核", "required": ["淡蒼球", "黒質"], "id": "kan_sa_022"}, {"q": "振戦・動作の緩慢・筋固縮がみられる大脳基底核の疾患は何か。", "answers": ["パーキンソン病"], "exp": "パーキンソン病。", "topic": "大脳基底核", "id": "kan_sa_023"}, {"q": "不随意運動が起こる大脳基底核の疾患は何か。", "answers": ["ハンチントン病"], "exp": "ハンチントン病。", "topic": "大脳基底核", "id": "kan_sa_024"}, {"q": "大脳辺縁系の構成要素を3つ以上答えよ。", "answers": ["海馬・扁桃体・帯状回・乳頭体・中隔核", "海馬、扁桃体、帯状回、乳頭体、中隔核"], "exp": "海馬・扁桃体・帯状回・乳頭体・中隔核など。", "topic": "辺縁系", "required": ["海馬", "扁桃体", "帯状回"], "id": "kan_sa_025"}, {"q": "扁桃体が評価した情報を主に送る2つの部位を答えよ。", "answers": ["視床下部・脳幹", "視床下部、脳幹"], "exp": "視床下部と脳幹。", "topic": "辺縁系", "required": ["視床下部", "脳幹"], "id": "kan_sa_026"}, {"q": "扁桃体が損傷されると障害されることが知られている認知は何か。", "answers": ["情動表情の認知", "情動表情認知"], "exp": "情動表情の認知。", "topic": "辺縁系", "id": "kan_sa_027"}, {"q": "扁桃体は特にどのような情動に関する出来事の記憶形成に関わるとされるか。", "answers": ["恐怖や不安", "恐怖・不安", "恐怖と不安"], "exp": "恐怖や不安。", "topic": "辺縁系", "required": ["恐怖", "不安"], "id": "kan_sa_028"}, {"q": "神経伝達物質として最初に発見された物質は何か。", "answers": ["アセチルコリン", "ACh"], "exp": "アセチルコリン。", "topic": "神経伝達", "id": "kan_sa_029"}, {"q": "アセチルコリンが最初に発見された年は何年か。", "answers": ["1921年", "1921"], "exp": "1921年。", "topic": "神経伝達", "id": "kan_sa_030"}, {"q": "神経伝達物質は大きく何分類とされているか function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;render()}}

let revealed=false,judged=false,userAns='';
function record(ok){let qi=currentList()[idx],r=ensure(qi);r.attempts++;session.answered++;if(ok){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState()}
function check(){if(revealed)return;let qi=currentList()[idx],q=QUESTIONS[qi],inp=document.getElementById('ans');userAns=inp?inp.value:'';let nu=norm(userAns);let ok=q.required?q.required.every(x=>nu.includes(norm(x))):q.answers.some(a=>norm(a)===nu);record(ok);revealed=true;judged=true;render()}
function showAnswer(){if(revealed)return;revealed=true;judged=false;render()}
function selfJudge(ok){if(judged)return;record(ok);judged=true;render()}
function render(){updateStats();let list=currentList(),card=document.getElementById('card');if(!list.length){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}if(idx>=list.length)idx=0;let qi=list[idx],q=QUESTIONS[qi],area='';if(!revealed){area=`<div class="shortInput"><input id="ans" autocomplete="off" placeholder="答えを入力" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">判定する</button></div><div class="selfrow"><button onclick="showAnswer()">答えを見る（自己採点）</button></div>`}else{let r=ensure(qi);area=`<div class="feedback ${judged?(r.last==='correct'?'good':'bad'):''}"><div class="answer">正解例：${q.answers[0]}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>${!judged?'<div class="selfrow"><button onclick="selfJudge(true)">自分では正解</button><button onclick="selfJudge(false)">自分では不正解</button></div>':''}`}card.innerHTML=`<div class="qno">${idx+1} / ${list.length}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div>${area}<div class="nav"><button onclick="moveQ(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="moveQ(1)">次へ →</button></div>`;if(!revealed)setTimeout(()=>{let x=document.getElementById('ans');if(x)x.focus()},20);updateStats()}
function moveQ(d){revealed=false;judged=false;let list=currentList();idx=(idx+d+list.length)%list.length;render()}
function retry(){revealed=false;judged=false;render()}
render();</script></body></html>
