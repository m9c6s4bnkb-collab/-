.shortinput{width:100%;min-height:94px;padding:12px;resize:vertical}.markrow,.resetrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.markrow button,.resetrow button{min-height:46px;padding:9px}.mark-ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mark-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.footnote{color:var(--muted);font-size:12px;margin:13px 2px 0}.toplink{margin:0 0 10px}.toplink a{color:var(--accent);font-weight:700;text-decoration:none}.hidden{display:none!important}

<script>const questions=[{"id":"jin2-c-001","q":"対象者の行動・対人関係・コミュニケーションを観察し、特徴や法則性を明らかにする研究方法は何か。","options":["KJ法","観察法","行動目録法","非構造化面接"],"correct":1,"answer":"観察法","explanation":"観察法とは、対象者の行動や対人関係、コミュニケーションを観察・記録し、その特徴や法則性を明らかにする研究方法である。","section":"41. 観察法"},{"id":"jin2-c-002","q":"観察法で記録対象となる三つのものは何か。","options":["行動・対人関係・コミュニケーション","乳幼児・障害児・動物","個人の特徴と発達過程","夢・空想・神話"],"correct":0,"answer":"行動・対人関係・コミュニケーション","explanation":"観察法とは、対象者の行動や対人関係、コミュニケーションを観察・記録し、その特徴や法則性を明らかにする研究方法である。","section":"41. 観察法"},{"id":"jin2-c-003","q":"対象者へ働きかけず、自然な環境で行動を見る方法はどれか。","options":["行動目録法","自然観察法","日誌法","実験的観察法"],"correct":1,"answer":"自然観察法","explanation":"観察法には、対象者に働きかけを行わず自然な環境で行動を観察する自然観察法と、特定の行動が生じるように環境条件を設定・操作して観察する実験的観察法がある。","section":"41. 観察法"},{"id":"jin2-c-004","q":"特定の行動が生じるよう、環境条件を設定・操作して見る方法はどれか。","options":["日誌法","自然観察法","実験的観察法","行動目録法"],"correct":2,"answer":"実験的観察法","explanation":"観察法には、対象者に働きかけを行わず自然な環境で行動を観察する自然観察法と、特定の行動が生じるように環境条件を設定・操作して観察する実験的観察法がある。","section":"41. 観察法"},{"id":"jin2-c-005","q":"観察法が直接の対象とするものは何か。","options":["自然な行動","保育日誌","実際の行動そのもの","記録者の主観や記憶に依存するため"],"correct":2,"answer":"実際の行動そのもの","explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-c-006","q":"観察法について、言語による回答が難しくても観察研究の対象にできるものとして、資料に挙げられた組合せはどれか。","options":["成人・高齢者・教師","研究者・面接者・保護者","大学生・会社員・競技者","乳幼児・障害児・動物"],"correct":3,"answer":"乳幼児・障害児・動物","explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-c-007","q":"観察法について、日常生活の中で把握できることが長所とされるものは何か。","options":["実際の行動そのもの","保育日誌","自然な行動","記録者の主観や記憶に依存するため"],"correct":2,"answer":"自然な行動","explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-c-008","q":"観察法の課題として資料に挙げられた四点の組合せはどれか。","options":["質問順序の固定・回答形式の統一・得点換算・所要時間の短縮","自由連想・抵抗分析・転移分析・ワークスルー","行動頻度の集計・尺度評定・平均値算出・因子分析","観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮"],"correct":3,"answer":"観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮","explanation":"一方で、観察者の視点や解釈が主観的になりやすく、信頼性や妥当性の確保、プライバシーへの配慮が課題となる。","section":"41. 観察法"},{"id":"jin2-c-009","q":"日常生活で観察した行動や様子を、後から思い出して記録する方法は何か。","options":["KJ法","評定尺度法","事例研究法","日誌法"],"correct":3,"answer":"日誌法","explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-c-010","q":"日誌法は、どの研究方法における記録法の一つか。","options":["行動描写法","観察法","グラウンデッド・セオリー・アプローチ","日誌法"],"correct":1,"answer":"観察法","explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-c-011","q":"日誌法の例として、保育日誌と並んで挙げられているものは何か。","options":["行動目録","評定尺度","逸話記録","育児日誌"],"correct":3,"answer":"育児日誌","explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-c-012","q":"育児日誌と並ぶ日誌法の例として挙げられているものは何か。","options":["因子分析","投映法","性格検査","保育日誌"],"correct":3,"answer":"保育日誌","explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-c-013","q":"日誌法では、観察した内容をいつ記録するか。","options":["観察した後に思い出して記録する","行動の出現と同時にチェックする","観察前に予測して記録する","複数の評定者の一致後に記録する"],"correct":0,"answer":"観察した後に思い出して記録する","explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-c-014","q":"日誌法について、詳細に把握できるものの組合せはどれか。","options":["行動・対人関係・コミュニケーション","個人の特徴と発達過程","質問と回答形式","乳幼児・障害児・動物"],"correct":1,"answer":"個人の特徴と発達過程","explanation":"個人の特徴や発達の過程を詳細に把握できる。","section":"42. 日誌法"},{"id":"jin2-c-015","q":"日誌法について、客観性に欠けやすい理由は何か。","options":["複数評定者を用いるため","行動を数量化するため","記録者の主観や記憶に依存するため","マニュアルを使うため"],"correct":2,"answer":"記録者の主観や記憶に依存するため","explanation":"一方で、記録者の主観や記憶に依存するため、客観性に欠けるという課題がある。","section":"42. 日誌法"},{"id":"jin2-c-016","q":"観察したい行動を事前にカテゴリー化し、出現のたびにチェックする方法は何か。","options":["実験的観察法","半構造化面接","検査法","行動目録法"],"correct":3,"answer":"行動目録法","explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-c-017","q":"行動目録法の別名として、チェックリスト法と並んで挙げられているものは何か。","options":["逸話記録法","評定尺度法","日誌法","カテゴリー・チェック法"],"correct":3,"answer":"カテゴリー・チェック法","explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-c-018","q":"行動目録法の別名として、カテゴリー・チェック法と並んで挙げられているものは何か。","options":["行動描写法","面接法","チェックリスト法","自由連想法"],"correct":2,"answer":"チェックリスト法","explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-c-019","q":"行動目録法について、行動のカテゴリーを作る時点はいつか。","options":["結果公表後","5つ","観察前","観察終了後"],"correct":2,"answer":"観察前","explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-c-020","q":"行動目録法について、事前に分類する行動の例として挙げられている組合せはどれか。","options":["意識と無意識","自発的関わりと受動的関わり","外向と内向","抑圧と昇華"],"correct":1,"answer":"自発的関わりと受動的関わり","explanation":"観察場面で生起すると予想される行動や、自発的関わり・受動的関わりなどの観察したい行動をあらかじめカテゴリー化し、該当する行動が見られるたびにチェックして記録する方法である。","section":"43. 行動目録法"},{"id":"jin2-c-021","q":"行動目録法について、該当する行動が見られるたびに何を行うか。","options":["生起頻度","数量的分析","チェックして記録する","図版を提示する"],"correct":2,"answer":"チェックして記録する","explanation":"観察場面で生起すると予想される行動や、自発的関わり・受動的関わりなどの観察したい行動をあらかじめカテゴリー化し、該当する行動が見られるたびにチェックして記録する方法である。","section":"43. 行動目録法"},{"id":"jin2-c-022","q":"行動目録法について、カテゴリーごとに集計するものは何か。","options":["生起頻度","描画の遠近","チェックして記録する","生活史"],"correct":0,"answer":"生起頻度","explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-c-023","q":"行動目録法について、生起頻度の集計によって可能になる分析は何か。","options":["数量的分析","チェックして記録する","明確な仮説","保育日誌"],"correct":0,"answer":"数量的分析","explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-c-024","q":"行動目録法について、カテゴリー・システム法でよく用いられる標本化の方法は何か。","options":["時間見本法","自由連想法","日誌法","質疑法"],"correct":0,"answer":"時間見本法","explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-c-025","q":"行動目録法について、どのような仮説がある観察で用いられることが多いか。","options":["明確な仮説","チェックして記録する","診断名が確定した仮説","生起頻度"],"correct":0,"answer":"明確な仮説","explanation":"また、行動目録法は、明確な仮説に基づいて観察を行う際に用いられることが多く、仮説に沿った適切なカテゴリーリストを作成することが分析の妥当性を高める上で重要である。","section":"43. 行動目録法"},{"id":"jin2-c-026","q":"行動目録法について、分析の妥当性を高めるため重要な準備は何か。","options":["仮説に沿った適切なカテゴリーリストの作成","一人の主観で評価すること","質問内容を説明しないこと","全行動を一つの項目にすること"],"correct":0,"answer":"仮説に沿った適切なカテゴリーリストの作成","explanation":"また、行動目録法は、明確な仮説に基づいて観察を行う際に用いられることが多く、仮説に沿った適切なカテゴリーリストを作成することが分析の妥当性を高める上で重要である。","section":"43. 行動目録法"},{"id":"jin2-c-027","q":"行動を事前に設定した評価尺度に沿って数段階で評価する方法は何か。","options":["日誌法","非構造化面接","評定尺度法","自然観察法"],"correct":2,"answer":"評定尺度法","explanation":"評定尺度法とは、観察法で用いられる記録方法の一つであり、観察対象の行動をあらかじめ設定した評価尺度に沿って評定する方法である。","section":"44. 評定尺度法"},{"id":"jin2-c-028","q":"評定尺度法が記録するのは行動の頻度ではなく何か。","options":["生活史","強さ・程度・印象","評定者の主観","物語内容"],"correct":1,"answer":"強さ・程度・印象","explanation":"行動の頻度ではなく、その強さや程度、印象などを数段階の尺度を用いて記録する。","section":"44. 評定尺度法"},{"id":"jin2-c-029","q":"評定尺度法について、授業態度の評価例で用いられる段階数はいくつか。","options":["5つ","28","80","2つ"],"correct":0,"answer":"5つ","explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-c-030","q":"評定尺度法について、子どもの授業態度の積極性を評価する際に示された両極はどれか。","options":["非常に緊張―非常に弛緩","非常に消極的―非常に積極的","非常に依存的―非常に独立的","非常に内向的―非常に外向的"],"correct":1,"answer":"非常に消極的―非常に積極的","explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-c-031","q":"『非常に消極的―非常に積極的』と並ぶ評定尺度法の評価例はどれか。","options":["非常に退屈―非常に楽しい","非常に不安―非常に平静","非常に緩慢―非常に迅速","非常に静か―非常に騒がしい"],"correct":0,"answer":"非常に退屈―非常に楽しい","explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-c-032","q":"評定尺度法について、評定結果が影響されやすいものは何か。","options":["強さ・程度・印象","複数","独立して評定する","評定者の主観"],"correct":3,"answer":"評定者の主観","explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-c-033","q":"評定尺度法について、信頼性や客観性を高めるため、評定者は何人にするか。","options":["強さ・程度・印象","評定者の主観","複数","独立して評定する"],"correct":2,"answer":"複数","explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-c-034","q":"評定尺度法について、複数の観察者は互いにどう評定するか。","options":["対象者に答えを決めてもらう","順番に得点を修正する","相談して同じ得点を付ける","独立して評定する"],"correct":3,"answer":"独立して評定する","explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-c-035","q":"評定尺度法について、複数評定の結果から用いるものの組合せはどれか。","options":["夢と空想","精神年齢と生活年齢","自発的関わりと受動的関わり","一致度と平均値"],"correct":3,"answer":"一致度と平均値","explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-c-036","q":"行動や出来事を時間の流れに沿って詳しく記述する方法は何か。","options":["行動描写法","自然観察法","構造化面接","KJ法"],"correct":0,"answer":"行動描写法","explanation":"行動描写法（逸話記録法）とは、観察法で用いられる記録方法の一つであり、観察対象の行動や出来事を時間の流れに沿って詳細に記述する方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-037","q":"行動描写法の別名は何か。","options":["カテゴリー・チェック法","チェックリスト法","逸話記録法","評定尺度法"],"correct":2,"answer":"逸話記録法","explanation":"行動描写法（逸話記録法）とは、観察法で用いられる記録方法の一つであり、観察対象の行動や出来事を時間の流れに沿って詳細に記述する方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-038","q":"行動描写法について、把握しやすいものとして挙げられる三つは何か。","options":["整理と分析","質問・順序・回答形式","家・木・人物","行動の背景・文脈・過程"],"correct":3,"answer":"行動の背景・文脈・過程","explanation":"この方法の長所は、行動が生じた背景や文脈、行動の過程を把握しやすく、詳細な記録をもとに後から再検討できる点にある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-039","q":"行動描写法について、詳細な記録があるため、後から何ができるか。","options":["生起頻度を扱う量的分析","強さ・程度・印象","評定者の主観","再検討"],"correct":3,"answer":"再検討","explanation":"この方法の長所は、行動が生じた背景や文脈、行動の過程を把握しやすく、詳細な記録をもとに後から再検討できる点にある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-040","q":"行動描写法の欠点として、多く必要になるものは何か。","options":["観察者の人数","時間と労力","検査用具","統計的な標本数"],"correct":1,"answer":"時間と労力","explanation":"一方で、記録に多くの時間と労力を要し、情報量が膨大になるため、整理や分析が難しくなるという欠点がある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-041","q":"行動描写法について、情報量が膨大になることで難しくなることの組合せは何か。","options":["受容と共感","観察と記録","整理と分析","質問と回答"],"correct":2,"answer":"整理と分析","explanation":"一方で、記録に多くの時間と労力を要し、情報量が膨大になるため、整理や分析が難しくなるという欠点がある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-042","q":"行動描写法について、行動目録法が適する分析は何か。","options":["生起頻度を扱う量的分析","知能の多因子分析","行動の質と過程を扱う質的分析","夢の内容分析"],"correct":0,"answer":"生起頻度を扱う量的分析","explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-043","q":"行動描写法が適する分析は何か。","options":["質問紙の因子分析","行動の質やプロセスを深く理解する質的分析","生起頻度の量的分析","体型の統計分類"],"correct":1,"answer":"行動の質やプロセスを深く理解する質的分析","explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-044","q":"行動の生起頻度を扱う行動目録法と比べ、行動描写法が重視するものは何か。","options":["質とプロセス","生起頻度と平均値","得点と順位","項目数と尺度数"],"correct":0,"answer":"質とプロセス","explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-045","q":"比較的自由で制限の少ない状況で対面し、会話と非言語表現から情報を集める方法は何か。","options":["面接法","グラウンデッド・セオリー・アプローチ","日誌法","半構造化面接"],"correct":0,"answer":"面接法","explanation":"面接法とは、比較的自由で制限の少ない状況下において、被面接者と対面して話し合い、同時にその非言語的な表現も観察することで、目的に沿って必要な情報を収集しようとする方法。","section":"46. 面接法"},{"id":"jin2-c-046","q":"面接法について、面接で話し合いと同時に観察するものは何か。","options":["対象者の内面","非言語的な表現","その時点・場面","過去・現在・未来"],"correct":1,"answer":"非言語的な表現","explanation":"面接法とは、比較的自由で制限の少ない状況下において、被面接者と対面して話し合い、同時にその非言語的な表現も観察することで、目的に沿って必要な情報を収集しようとする方法。","section":"46. 面接法"},{"id":"jin2-c-047","q":"面接法の三種類の組合せはどれか。","options":["構造化・半構造化・非構造化面接","投映・質問紙・描画法","形式・内容・継起分析","自然・実験・参与観察"],"correct":0,"answer":"構造化・半構造化・非構造化面接","explanation":"種類としては、構造化面接、非構造化面接、半構造化面接がある。","section":"46. 面接法"},{"id":"jin2-c-048","q":"面接法について、数量的データと比べて豊かに捉えられるものは何か。","options":["対象者の内面","項目数","非言語的な表現","その時点・場面"],"correct":0,"answer":"対象者の内面","explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-c-049","q":"面接法について、観察法から得るデータが限定されやすいものは何か。","options":["過去・現在・未来の全て","対象者の生活史全体","全ての状況","その時点・場面"],"correct":3,"answer":"その時点・場面","explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-c-050","q":"面接法について、面接で話題を展開できる時間範囲はどれか。","options":["過去・現在・未来","非言語的な表現","対象者の内面","その時点・場面"],"correct":0,"answer":"過去・現在・未来","explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-c-051","q":"面接法について、対象や領域が限られる原因となる依存性は何か。","options":["統計への依存","描画への依存","言語への依存","非言語的な表現"],"correct":2,"answer":"言語への依存","explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-c-052","q":"面接法について、短所として保障されないとされるものは何か。","options":["非言語観察","客観性","柔軟性","内面の豊かさ"],"correct":1,"answer":"客観性","explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-c-053","q":"面接法について、回答内容を方向づける危険があるのは誰の意識や態度か。","options":["ある程度一定の結果に達する","採点者","他の参加者","面接者"],"correct":3,"answer":"面接者","explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-c-054","q":"質問項目・提示順序・回答形式を事前に固定する方法は何か。","options":["行動描写法","KJ法","行動目録法","構造化面接"],"correct":3,"answer":"構造化面接","explanation":"面接法において、あらかじめ質問項目やその提示順序、回答形式を設定したかたちで行う方法をいう。","section":"47. 構造化面接"},{"id":"jin2-c-055","q":"構造化面接について、事前に設定する三つの要素は何か。","options":["家・木・人物","質問項目・提示順序・回答形式","構造化・半構造化・非構造化面接","意識・前意識・無意識"],"correct":1,"answer":"質問項目・提示順序・回答形式","explanation":"面接法において、あらかじめ質問項目やその提示順序、回答形式を設定したかたちで行う方法をいう。","section":"47. 構造化面接"},{"id":"jin2-c-056","q":"構造化面接について、対象者や状況に応じて、準備した質問をどうしてはいけないか。","options":["マニュアルに従う","同じ順で提示する","変更する","決めた形式で回答させる"],"correct":2,"answer":"変更する","explanation":"事前に質問が準備されており、対象者や面接状況に応じてそれらを変更してはならない。","section":"47. 構造化面接"},{"id":"jin2-c-057","q":"構造化面接について、複数の面接者を用いる場合に図るものは何か。","options":["マニュアル化された診断面接","面接内容の一致","知能の一致","面接者の個性化"],"correct":1,"answer":"面接内容の一致","explanation":"そのため、複数の面接者がいる場合などでは、それぞれの面接内容の一致を図る目的から用いられる。","section":"47. 構造化面接"},{"id":"jin2-c-058","q":"構造化面接に分類される診断面接は何か。","options":["自由な心理療法","面接内容の一致","マニュアル化された診断面接","日誌記録"],"correct":2,"answer":"マニュアル化された診断面接","explanation":"マニュアル化された診断面接もここに分類される。","section":"47. 構造化面接"},{"id":"jin2-c-059","q":"構造化面接について、マニュアルに従えば、誰が使ってもどうなりやすいか。","options":["面接者","質問を自由に変えられる","妥当性が最大になる","ある程度一定の結果に達する"],"correct":3,"answer":"ある程度一定の結果に達する","explanation":"マニュアルに従えばある程度誰でも使用でき、一定の結果に達することができる。","section":"47. 構造化面接"},{"id":"jin2-c-060","q":"構造化面接で高いとされるものは何か。","options":["主観的意味の深掘り","柔軟性","語りの自由度","客観性"],"correct":3,"answer":"客観性","explanation":"また、客観性は高い。","section":"47. 構造化面接"},{"id":"jin2-c-061","q":"構造化面接で高いとされる測定上の性質は何か。","options":["自由度","変更する","主観性","信頼性"],"correct":3,"answer":"信頼性","explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-c-062","q":"構造化面接について、質問内容の説明ができないため起こり得ることは何か。","options":["対象者の誤解","検査者の個性化","変更する","得点の自動上昇"],"correct":0,"answer":"対象者の誤解","explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-c-063","q":"構造化面接について、誤解によって問題が生じ得る測定上の性質は何か。","options":["匿名性","経済性","妥当性","信頼性"],"correct":2,"answer":"妥当性","explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-c-064","q":"基本の質問を準備しつつ、流れに応じて追加・変更する方法は何か。","options":["行動描写法","KJ法","行動目録法","半構造化面接"],"correct":3,"answer":"半構造化面接","explanation":"半構造化面接は、基本となる質問項目や回答形式を事前に用意しながら、話の流れに応じて質問を追加・変更できる方法である。","section":"48. 半構造化面接"},{"id":"jin2-c-065","q":"半構造化面接について、事前に設定するものの組合せはどれか。","options":["対象者の回答内容","結果と解釈","診断と治療方針","質問項目と回答形式"],"correct":3,"answer":"質問項目と回答形式","explanation":"面接法において、事前に質問項目や回答形式を設定する一方で、話の流れに応じて臨機応変に質問の追加・変更を行う方法をいう。","section":"48. 半構造化面接"},{"id":"jin2-c-066","q":"半構造化面接について、話の流れに応じてできることは何か。","options":["質問順序の固定","回答形式の統一","面接の中断","質問の追加や変更"],"correct":3,"answer":"質問の追加や変更","explanation":"面接法において、事前に質問項目や回答形式を設定する一方で、話の流れに応じて臨機応変に質問の追加・変更を行う方法をいう。","section":"48. 半構造化面接"},{"id":"jin2-c-067","q":"半構造化面接について、対象者の何に沿った情報を得られるか。","options":["柔軟性","検査得点","筆跡","語り"],"correct":3,"answer":"語り","explanation":"対象者の語りに応じた面接の進行により、対象者の語りに沿った情報を得ることができ、また、面接者の関心に応じて、より深い内容の語りを引き出すこともできる。","section":"48. 半構造化面接"},{"id":"jin2-c-068","q":"半構造化面接について、面接者の関心に応じて引き出せるものは何か。","options":["より深い内容の語り","事前に定めた回答形式","観察行動の生起頻度","検査得点の標準値"],"correct":0,"answer":"より深い内容の語り","explanation":"対象者の語りに応じた面接の進行により、対象者の語りに沿った情報を得ることができ、また、面接者の関心に応じて、より深い内容の語りを引き出すこともできる。","section":"48. 半構造化面接"},{"id":"jin2-c-069","q":"半構造化面接の最大の利点は何か。","options":["語り","項目数の少なさ","自動採点","柔軟性"],"correct":3,"answer":"柔軟性","explanation":"このような柔軟性こそが、半構造化面接の最大の利点であると言える。","section":"48. 半構造化面接"},{"id":"jin2-c-070","q":"半構造化面接について、基本項目を網羅することで保つものは何か。","options":["面接の匿名性","検査の再検査信頼性","調査の妥当性","観察者間の一致率"],"correct":2,"answer":"調査の妥当性","explanation":"基本項目を網羅することで調査の妥当性を保ちつつ、対象者の反応に合わせて深掘りできるため、本人の主観的な意味づけや潜在的な背景を詳細に引き出すことができる。","section":"48. 半構造化面接"},{"id":"jin2-c-071","q":"半構造化面接について、反応に合わせた深掘りで引き出せる二つは何か。","options":["質問項目の順序と回答形式","本人の主観的意味づけと潜在的背景","観察行動の頻度と平均値","検査得点の高低と順位"],"correct":1,"answer":"本人の主観的意味づけと潜在的背景","explanation":"基本項目を網羅することで調査の妥当性を保ちつつ、対象者の反応に合わせて深掘りできるため、本人の主観的な意味づけや潜在的な背景を詳細に引き出すことができる。","section":"48. 半構造化面接"},{"id":"jin2-c-072","q":"半構造化面接について、適用されるのは、探索領域がどの程度想定されている場合か。","options":["数量を扱う場合","全く想定されていない場合","ある程度想定されている場合","確定している場合"],"correct":2,"answer":"ある程度想定されている場合","explanation":"探索する領域がある程度想定されている場合や、発見を目的とした質的研究などの場合に適用される。","section":"48. 半構造化面接"},{"id":"jin2-c-073","q":"半構造化面接について、適用される研究の目的として挙げられるものは何か。","options":["仮説の統計的検証","得点の標準化","行動頻度の集計","発見"],"correct":3,"answer":"発見","explanation":"探索する領域がある程度想定されている場合や、発見を目的とした質的研究などの場合に適用される。","section":"48. 半構造化面接"},{"id":"jin2-c-074","q":"質問項目や回答形式を事前に決めず、自由に語ってもらう方法は何か。","options":["非構造化面接","事例研究法","実験的観察法","構造化面接"],"correct":0,"answer":"非構造化面接","explanation":"非構造化面接は、質問項目や回答形式を事前に固定せず、対象者に自由に語ってもらい、流れに応じて面接者が質問や説明を行う方法である。","section":"49. 非構造化面接"},{"id":"jin2-c-075","q":"非構造化面接について、事前に設定しない二つのものは何か。","options":["面接の目的と場所","対象者と面接者","開始時刻と終了時刻","質問項目と回答形式"],"correct":3,"answer":"質問項目と回答形式","explanation":"面接法において、質問項目や回答形式を事前に設定しない形で、被面接者に自由に語ってもらいながら行う方法をいう。","section":"49. 非構造化面接"},{"id":"jin2-c-076","q":"非構造化面接について、話の流れに応じて面接者が行うものは何か。","options":["語り合い","固定項目の機械的提示","臨機応変な質問や説明","生き生きとした語り"],"correct":2,"answer":"臨機応変な質問や説明","explanation":"話の流れに応じて面接者が臨機応変に質問や説明を行い、対象者がおのずと語るような面接がなされる。","section":"49. 非構造化面接"},{"id":"jin2-c-077","q":"非構造化面接は、形式的な面接より何に近いと表現されるか。","options":["語り合い","質問紙","身体検査","採点作業"],"correct":0,"answer":"語り合い","explanation":"「面接」というより「語り合い」であり、形式的な面接では引き出すことができない、より生き生きとした語りを得ることができる。","section":"49. 非構造化面接"},{"id":"jin2-c-078","q":"非構造化面接について、形式的面接では得にくいどのような語りを得られるか。","options":["臨機応変な質問や説明","固定された語り","生き生きとした語り","語り合い"],"correct":2,"answer":"生き生きとした語り","explanation":"「面接」というより「語り合い」であり、形式的な面接では引き出すことができない、より生き生きとした語りを得ることができる。","section":"49. 非構造化面接"},{"id":"jin2-c-079","q":"非構造化面接について、質問内容への説明によって避けられるものは何か。","options":["対象者の自由な語り","対象者の誤解","心理療法","発見"],"correct":1,"answer":"対象者の誤解","explanation":"非構造化面接は、質問内容への説明を行うことができることから、被面接者の質問内容への誤解が避けられるため、面接の妥当性は高い。","section":"49. 非構造化面接"},{"id":"jin2-c-080","q":"非構造化面接について、誤解を避けられるため高いとされるものは何か。","options":["再現性","妥当性","信頼性","客観性"],"correct":1,"answer":"妥当性","explanation":"非構造化面接は、質問内容への説明を行うことができることから、被面接者の質問内容への誤解が避けられるため、面接の妥当性は高い。","section":"49. 非構造化面接"},{"id":"jin2-c-081","q":"非構造化面接について、進め方が大きく依存するものは何か。","options":["面接者の技量","心理療法","生活年齢","半構造化面接"],"correct":0,"answer":"面接者の技量","explanation":"しかし、面接の進め方が面接者の技量に負うところが大きく、信頼性に問題が生じる場合がある。","section":"49. 非構造化面接"},{"id":"jin2-c-082","q":"非構造化面接について、面接者の技量に左右されるため問題が生じやすいものは何か。","options":["妥当性","信頼性","語りの豊かさ","説明可能性"],"correct":1,"answer":"信頼性","e  ロールシャッハ・テスト"},{"id":"jin2-c-320","q":"ロールシャッハ・テストについて、最初に被検者が各図版について行うことは何か。","options":["物語を文章で書く","人物を描く","何に見えるかを口頭で述べる","五段階で評定する"],"correct":2,"answer":"何に見えるかを口頭で述べる","explanation":"まず、被検者はそれぞれの図版について向に見えるかを口頭で述べる。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-321","q":"ロールシャッハ・テストについて、口頭反応の後、検査者が質問する内容は何か。","options":["何に見えるかを口頭で述べる","図版のどの特徴からそう見えたか","形式分析","内容分析"],"correct":1,"answer":"図版のどの特徴からそう見えたか","explanation":"その後、検査者はその図版のどのような特徴からそのように見えたのかについて質疑を行う。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-322","q":"ロールシャッハ反応の四つのスコアリング項目の組合せはどれか。","options":["質問領域・回答時間・正答率・偏差値","生活史・興味・人格・知能","他責・自責・無責・要求固執","反応領域・反応決定因・反応内容・形態水準"],"correct":3,"answer":"反応領域・反応決定因・反応内容・形態水準","explanation":"それらの回答から、反応領域、反応決定因、反応内容、形態水塗などのスコアリングを行う。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-323","q":"ロールシャッハ・テストについて、スコアリングされた反応を量的に分析する方法は何か。","options":["継起分析","内容分析","形式分析","因子分析"],"correct":2,"answer":"形式分析","explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-324","q":"ロールシャッハ・テストについて、一枚の図版への反応を質的に分析する方法は何か。","options":["因子分析","継起分析","内容分析","形式分析"],"correct":2,"answer":"内容分析","explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-325","q":"ロールシャッハ・テストについて、各図版への反応の流れを力動的に分析する方法は何か。","options":["因子分析","内容分析","継起分析","形式分析"],"correct":2,"answer":"継起分析","explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-326","q":"ロールシャッハ・テストについて、日本で従来主流だった、三つの分析を行う方法は何か。","options":["欲求－圧力分析","KJ法","PDI","片口法"],"correct":3,"answer":"片口法","explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-327","q":"ロールシャッハ・テストについて、包括システムとも呼ばれ、形式分析だけを行う方法は何か。","options":["片口法","KJ法","欲求－圧力分析","エクスナー法"],"correct":3,"answer":"エクスナー法","explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-328","q":"ロールシャッハ・テストについて、片口法が行う分析の組合せはどれか。","options":["形式分析・内容分析・継起分析","欲求分析と圧力分析","無彩色・赤と黒の2色・複数の色彩","反応領域・反応決定因・反応内容・形態水準"],"correct":0,"answer":"形式分析・内容分析・継起分析","explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-329","q":"ロールシャッハ・テストについて、エクスナー法が行う分析は何か。","options":["三分析すべて","形式分析のみ","欲求－圧力分析","何に見えるかを口頭で述べる"],"correct":1,"answer":"形式分析のみ","explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-c-330","q":"絵画統覚検査について、TATを開発した研究者の組合せはどれか。","options":["カーンバーグ","マレーとモーガン","カウフマン夫妻","ハザウェーとマッキンレー"],"correct":1,"answer":"マレーとモーガン","explanation":"マレーとモーガンによって開発された。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-c-331","q":"曖昧な人物場面の絵から自由に物語を語らせる検査は何か。","options":["TAT","ビネー式知能検査","新版K式発達検査","MPI"],"correct":0,"answer":"TAT","explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-c-332","q":"絵画統覚検査について、TATはどの方法に分類される性格検査か。","options":["描画法","投映法","観察法","面接法"],"correct":1,"answer":"投映法","explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-c-333","q":"絵画統覚検査について、TATで示す図版に主に含まれるものは何か。","options":["物語","パーソナリティ傾向","人物を含む曖昧な状況","欲求－圧力分析"],"correct":2,"answer":"人物を含む曖昧な状況","explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-c-334","q":"絵画統覚検査について、被検者が絵から自由に作るものは何か。","options":["人物を含む曖昧な状況","発達輪郭表","物語","五段階評定"],"correct":2,"answer":"物語","explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らか r":"対人関係","explanation":"家には家庭環境、木には自己像、人物には対人関係が投影きれていると考えられている。","section":"76. HTPテスト"},{"id":"jin2-c-387","q":"HTPテストについて、絵の比率や遠近を採点・集計する解釈を何というか。","options":["継起分析","欲求－圧力分析","質的分析","形式分析"],"correct":3,"answer":"形式分析","explanation":"解釈は、絵の比率や遠近などをスコアリングし集計する形式分析と、描かれた内容や順序、描画態度などを総合的に分析する質的分析から行われる。","section":"76. HTPテスト"},{"id":"jin2-c-388","q":"HTPテストについて、内容・順序・描画態度を総合的にみる解釈を何というか。","options":["質的分析","因子分析","日付","共分散分析"],"correct":0,"answer":"質的分析","explanation":"解釈は、絵の比率や遠近などをスコアリングし集計する形式分析と、描かれた内容や順序、描画態度などを総合的に分析する質的分析から行われる。","section":"76. HTPテスト"},{"id":"jin2-c-389","q":"HTPテストについて、人物を男女両方描く方法を何というか。","options":["PDI","HTPP","TAT","S-HTP"],"correct":1,"answer":"HTPP","explanation":"現在では、人物を男女両方描く方法（HTPP）や、1枚の紙に描く方法（S-HTP）などのさまざまな方法が開発されている。","section":"76. HTPテスト"},{"id":"jin2-c-390","q":"HTPテストについて、家・木・人物を1枚の紙に描く方法を何というか。","options":["S-HTP","PDI","TAT","HTPP"],"correct":0,"answer":"S-HTP","explanation":"現在では、人物を男女両方描く方法（HTPP）や、1枚の紙に描く方法（S-HTP）などのさまざまな方法が開発されている。","section":"76. HTPテスト"},{"id":"jin2-c-391","q":"風景構成法を開発した人物は誰か。","options":["中井久夫","京都市児童院","アイゼンク","キャッテル"],"correct":0,"answer":"中井久夫","explanation":"中井久夫によって開発された。","section":"77. 風景構成法"},{"id":"jin2-c-392","q":"もとは統合失調症患者への治療的接近を探るため開発された方法は何か。","options":["遠城寺式乳幼児分析的発達検査法","CMI","風景構成法","GHQ"],"correct":2,"answer":"風景構成法","explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-c-393","q":"風景構成法について、開発当初の位置づけは何か。","options":["質問紙法","心理療法","知能検査","発達検査"],"correct":1,"answer":"心理療法","explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-c-394","q":"風景構成法について、現在の位置づけは何か。","options":["面接法","描画法","観察法","質問紙法"],"correct":1,"answer":"描画法","explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-c-395","q":"風景構成法について、描画に用いる用紙の特徴は何か。","options":["二つ折りの紙","チェックリスト","枠づけされた画用紙","質問紙"],"correct":2,"answer":"枠づけされた画用紙" た画用紙","確立されていない"],"correct":3,"answer":"確立されていない","explanation":"解釈法は確立されてはいないが、箱庭療法の観点が有用であるとされている。","section":"77. 風景構成法"},{"id":"jin2-c-404","q":"風景構成法について、解釈に有用とされる心理療法の観点は何か。","options":["箱庭療法","認知療法","交流分析","自律訓練法"],"correct":0,"answer":"箱庭療法","explanation":"解釈法は確立されてはいないが、箱庭療法の観点が有用であるとされている。","section":"77. 風景構成法"},{"id":"jin2-c-405","q":"男児の人物画から知的発達を評価する検査を開発した人物は誰か。","options":["津守真と稲毛教子ら","グッドイナフ","テーラー","ゴールドバーグ"],"correct":1,"answer":"グッドイナフ","explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-406","q":"男児の描画から動作性知能を評価する方法は何か。","options":["NEO-PI-R","バウム・テスト","グッドイナフ人物画","ウェクスラー式知能検査"],"correct":2,"answer":"グッドイナフ人物画","explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-407","q":"グッドイナフ人物画について、評価の主目的は何か。","options":["動作性知能のアセスメント","自覚症状の把握","対人関係の物語分析","人格の五因子測定"],"correct":0,"answer":"動作性知能のアセスメント","explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-408","q":"グッドイナフ人物画について、健常児への適用年齢はどこからどこまでか。","options":["2歳～成人","2歳6か月～18歳11か月","3～9歳","0～4歳8か月"],"correct":2,"answer":"3～9歳","explanation":"適用年齢は健常児の場合、3～9歳である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-409","q":"グッドイナフ人物画知能検査で描くよう求める対象は何か。","options":["男児","風景","成人女性","家"],"correct":0,"answer":"男児","explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-410","q":"グッドイナフ人物画について、採点項目数はどの程度か。","options":["10項目程度","50項目程度","24項目程度","120項目程度"],"correct":1,"answer":"50項目程度","explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-411","q":"グッドイナフ人物画について、採点する人物描画の特徴の組合せはどれか。","options":["欲求・圧力・葛藤","言語・社会・運動","外向性・開放性・誠実性","形・比率・明細化"],"correct":3,"answer":"形・比率・明細化","explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-412","q":"グッドイナフ人物画について、採点結果から評価するものは何か。","options":["身体疾患","知的水準","動作性知能のアセスメント","3～9歳"],"correct":1,"answer":"知的水準","explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-413","q":"グッドイナフ人物画について、人物描画は、子どもにとってどのような反応を示しやすいか。","options":["動作性知能のアセスメント","言語能力が必須","成人にしかできない","比較的抵抗が少ない"],"correct":3,"answer":"比較的抵抗が少ない","explanation":"人物像の描画は比較的抵抗が少なく、発達に遅れがみられる子どもにも適用可能である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-414","q":"グッドイナフ人物画について、発達面で適用可能な対象はどれか。","options":["発達に遅れがみられる子ども","動作性知能のアセスメント","3～9歳","男児"],"correct":0,"answer":"発達に遅れがみられる子ども","explanation":"人物像の描画は比較的抵抗が少なく、発達に遅れがみられる子どもにも適用可能である。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-415","q":"グッドイナフ人物画について、動作性検査として関係する二能力は何か。","options":["外向性と神経症傾向","文章理解と作文能力","目と手の感覚運動協応と空間認知","言語理解と語彙"],"correct":2,"answer":"目と手の感覚運動協応と空間認知","explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-416","q":"グッドイナフ人物画について、知的水準をより的確に評価するため組み合わせる検査は何か。","options":["身体検査","言語性検査","血液検査","動作性知能のアセスメント"],"correct":1,"answer":"言語性検査","explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-417","q":"グッドイナフ人物画について、動作性検査と言語性検査を組み合わせることを何というか。","options":["エゴグラム","サイコグラフ","神経症判定図","テスト・バッテリー"],"correct":3,"answer":"テスト・バッテリー","explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-c-418","q":"一卵性または二卵性の双子を対象に遺伝と環境の影響を調べる方法は何か。","options":["日誌法","行動目録法","双生児研究","KJ法"],"correct":2,"answer":"双生児研究","explanation":"双生児研究とは、一卵性または二卵性双生児を対象に行われる研究のことである。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-419","q":"双生児研究について、一卵性双生児が共有する遺伝情報の割合は何％か。","options":["90％","100％","25％","50％"],"correct":1,"answer":"100％","explanation":"また、100％同一の遺伝情報をもつ一卵性双生児と比較することで、遺伝と環境の影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-420","q":"双生児研究について、一卵性双生児の間にみられる違いは、主に何の違いによると考えるか。","options":["遺伝","環境","性別","年齢"],"correct":1,"answer":"環境","explanation":"一卵性双生児は100％同一の遺伝情報をもつため、双子の間にみられる違いは主に環境の違いによるものと考えられる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-421","q":"双生児研究について、一卵性双生児の片方だけが特定の経験や教育を受けた場合、比較によって何の効果を検討できるか。","options":["遺伝要因","性別要因","年齢要因","環境要因"],"correct":3,"answer":"環境要因","explanation":"例えば、一方だけが特定の経験や教育を受けた場合、その影響を比較することで環境要因の効果を検討できる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-422","q":"双生児研究について、二卵性双生児が共有する遺伝情報の割合は何％か。","options":["25％","50％","75％","90％"],"correct":1,"answer":"50％","explanation":"一方で、二卵性双生児は、通常の兄弟姉妹と同様に、遺伝情報が50％しか共有されない。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-423","q":"双生児研究について、二卵性双生児の遺伝情報共有率は、どの関係と同程度か。","options":["一卵性双生児","通常の兄弟姉妹","親子で100％","血縁のない他人と同一"],"correct":1,"answer":"通常の兄弟姉妹","explanation":"一方で、二卵性双生児は、通常の兄弟姉妹と同様に、遺伝情報が50％しか共有されない。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-424","q":"双生児研究について、二卵性双生児が共有する養育環境は、一卵性双生児と比べてどの程度か。","options":["同程度","全く共有しない","100％","50％"],"correct":0,"answer":"同程度","explanation":"しかし、育った環境は一卵性双生児と同程度共有される。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-425","q":"双生児研究について、二卵性双生児間の違いをみることで主に検討できるものは何か。","options":["通常の兄弟姉妹","遺伝的影響","検査者効果","回答の歪曲"],"correct":1,"answer":"遺伝的影響","explanation":"そのため、双子間の違いをみることで遺伝的影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-426","q":"双生児研究について、一卵性と二卵性の双子を比較する主な目的は何か。","options":["遺伝と環境の影響を調べる","知能検査の妥当性を調べる","発達年齢を算出する","精神疾患を診断する"],"correct":0,"answer":"遺伝と環境の影響を調べる","explanation":"また、100％同一の遺伝情報をもつ一卵性双生児と比較することで、遺伝と環境の影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-c-427","q":"双生児の比較観察から層理論を提唱した人物は誰か。","options":["ゴットシャルト","ビネーとシモン","京都市児童院","アイゼンク"],"correct":0,"answer":"ゴットシャルト","explanation":"これによって、ゴットシャルトは、パーソナリティは、より環境の影響が強い知性的上層と遺伝的規定性が強い内部感情的基底層の２つの主要層から構成されるという層理論を提唱した。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-c-428","q":"層理論について、思考・判断・意思に対する遺伝の影響は、環境の何倍とされたか。","options":["12倍以上","2～3倍","1倍未満","5～6倍"],"correct":1,"answer":"2～3倍","explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-c-429","q":"層理論につい   questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function answerChoice(choice){
  if(state.answered)return;const i=currentIndex();if(i===null)return;const q=questions[i];state.answered=true;const ok=choice===q.correct;record(i,ok);
  [...document.querySelectorAll('.option')].forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');else if(k===choice)b.classList.add('wrong');else b.classList.add('dim');});
  $('feedback').innerHTML=`<div class="answerbox ${ok?'ok':'bad'}"><b>${ok?'正解！':'不正解'}</b><div>正答：${escapeHtml(q.answer)}</div><div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('history').textContent=historyText(rec(i));$('retry').disabled=false;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('options').innerHTML='';$('feedback').innerHTML='';$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;
  $('options').innerHTML=q.options.map((o,k)=>`<button class="option" onclick="answerChoice(${k})"><span class="letter">${LETTERS[k]}</span><span>${escapeHtml(o)}</span></button>`).join('');$('feedback').innerHTML='';$('retry').disabled=!state.answered;
}
render();
</script></body></html>
