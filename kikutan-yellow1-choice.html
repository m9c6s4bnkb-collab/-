const POS=['名詞','動詞','形容詞','副詞','前置詞','接続詞'];
const $=id=>document.getElementById(id);
let current=null, currentMode='ja4';
let session={answered:0,correct:0};
let stats=JSON.parse(localStorage.getItem('kikutan_yellow1_choice_stats_v1')||'{}');
function keyOf(x){return x.en+'|'+x.ja}
function save(){localStorage.setItem('kikutan_yellow1_choice_stats_v1',JSON.stringify(stats))}
function getStat(x){return stats[keyOf(x)]||{wrong:0,correct:0}}
function filtered(){
 let arr=WORDS.slice(), s=$('scope').value;
 if(s==='main') arr=arr.filter(x=>!x.related);
 if(s==='related') arr=arr.filter(x=>x.related);
 if(s==='wrong'||s==='wrong1') arr=arr.filter(x=>getStat(x).wrong>=1);
 if(s==='wrong2') arr=arr.filter(x=>getStat(x).wrong>=2);
 return arr;
}
function updateStats(){
 $('answered').textContent=session.answered; $('correct').textContent=session.correct;
 $('rate').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'0%';
 $('pool').textContent=filtered().length; $('countNote').textContent=`収録語数：${WORDS.length}語（関連語・派生語 ${WORDS.filter(x=>x.related).length}語を含む）`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sample(arr,n,exclude){let a=arr.filter(x=>x!==exclude); for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a.slice(0,n)}
function nextQ(){
 const arr=filtered(); updateStats(); $('feedback').classList.add('hidden'); $('next').classList.add('hidden'); $('check').classList.add('hidden');
 if(!arr.length){current=null;$('word').textContent='この条件に該当する問題がありません';$('body').innerHTML='';return}
 current=arr[Math.floor(Math.random()*arr.length)]; currentMode=$('mode').value;
 $('word').textContent=current.en; $('kind').textContent=currentMode.startsWith('ja')?'英語 → 日本語':'英語 → 品詞'; $('rel').textContent=current.related?'関連語・派生語':'見出し語'; $('miss').textContent='誤答 '+getStat(current).wrong+'回';
 renderBody();
}
function renderBody(){
 const b=$('body'); b.innerHTML='';
 if(currentMode==='ja4'){
   let opts=[current,...sample(WORDS,3,current)].sort(()=>Math.random()-.5);
   const wrap=document.createElement('div');wrap.className='choices';
   opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=x.ja;btn.addEventListener('click',()=>grade(btn,x===current,wrap));wrap.appendChild(btn)});b.appendChild(wrap);
 } else if(currentMode==='ja1'){
   b.innerHTML='<input id="textAns" type="text" placeholder="日本語訳を入力"><div class="note">入力後に「答え合わせ」。表記ゆれがあるため、答え表示後に自分で正誤判定できます。</div>'; $('check').classList.remove('hidden'); $('check').textContent='答えを見る'; $('check').onclick=revealJA;
 } else if(currentMode==='pos4'){
   const box=document.createElement('div');box.className='posgrid'; POS.forEach(p=>{const lab=document.createElement('label');lab.className='posopt';lab.innerHTML=`<input type="checkbox" value="${p}">${p}`;box.appendChild(lab)}); b.appendChild(box); $('check').classList.remove('hidden'); $('check').textContent='答え合わせ'; $('check').onclick=checkPOS;
 } else {
   b.innerHTML='<input id="textAns" type="text" placeholder="例：名詞、動詞"><div class="note">複数ある場合は「名詞、動詞」のように入力。</div>'; $('check').classList.remove('hidden'); $('check').textContent='答え合わせ'; $('check').onclick=checkPOSText;
 }
}
function mark(ok){let s=getStat(current); if(ok)s.correct++;else s.wrong++; stats[keyOf(current)]=s; save(); session.answered++; if(ok)session.correct++; updateStats(); $('miss').textContent='誤答 '+s.wrong+'回'; $('next').classList.remove('hidden')}
function grade(btn,ok,wrap){[...wrap.children].forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');if(!ok){[...wrap.children].find(x=>x.textContent===current.ja)?.classList.add('correct')} showFeedback(ok,`正解：${current.ja}`);mark(ok)}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
function revealJA(){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>答え：</strong>${esc(current.ja)}<div class="actions"><button type="button" class="btn primary" id="selfYes">正解にする</button><button type="button" class="btn danger" id="selfNo">不正解にする</button></div>`;$('check').classList.add('hidden');$('selfYes').onclick=()=>selfMark(true);$('selfNo').onclick=()=>selfMark(false)}
function selfMark(ok){mark(ok);$('selfYes').disabled=true;$('selfNo').disabled=true}
function checkPOS(){let selected=[...document.querySelectorAll('#body input[type=checkbox]:checked')].map(x=>x.value).sort();let ans=current.pos.slice().sort();let ok=selected.length===ans.length&&selected.every((x,i)=>x===ans[i]);showFeedback(ok,'正解：'+ans.join('・'));mark(ok);$('check').classList.add('hidden');document.querySelectorAll('#body input').forEach(x=>x.disabled=true)}
function checkPOSText(){let v=($('textAns').value||'').replace(/[\s、，,/・]+/g,' ').trim();let got=POS.filter(p=>v.includes(p)).sort();let ans=current.pos.slice().sort();let ok=got.length===ans.length&&got.every((x,i)=>x===ans[i]);showFeedback(ok,'正解：'+ans.join('・'));mark(ok);$('check').classList.add('hidden');$('textAns').disabled=true}
$('start').addEventListener('click',nextQ);$('shuffle').addEventListener('click',nextQ);$('next').addEventListener('click',nextQ);$('scope').addEventListener('change',updateStats);$('mode').addEventListener('change',()=>{if(current)nextQ()});$('reset').addEventListener('click',()=>{if(confirm('正答・誤答の学習データをすべて消しますか？')){stats={};session={answered:0,correct:0};save();updateStats();nextQ()}});
let menuIsHidden=localStorage.getItem('kikutan_yellow1_choice_menu_hidden')==='1';
function applyMenuVisibility(){
 ['introCard','menuCard','statsCard'].forEach(id=>$(id).classList.toggle('menuHidden',menuIsHidden));
 $('menuToggle').textContent=menuIsHidden?'メニューを表示':'メニューを非表示';
}
$('menuToggle').addEventListener('click',()=>{
 menuIsHidden=!menuIsHidden;
 localStorage.setItem('kikutan_yellow1_choice_menu_hidden',menuIsHidden?'1':'0');
 applyMenuVisibility();
});
applyMenuVisibility();
updateStats();
</script></body></html>
