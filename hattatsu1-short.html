const data=QUESTIONS,KEY='hattatsu1_short_v1';
let hist=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='all',randomized=false;
function norm(s){return (s||'').normalize('NFKC').trim().toLowerCase().replace(/[ 　・,，、。．（）()\-ー〜～]/g,'')}
function st(id){return hist[id]||{attempts:0,wrong:0,correct:0}}
function save(){localStorage.setItem(KEY,JSON.stringify(hist))}
function okf(x){const s=st(x.id);if(filter==='all')return true;if(filter==='unanswered')return s.attempts===0;if(filter==='wrong')return s.wrong>0;if(filter==='w1')return s.wrong===1;if(filter==='w2')return s.wrong===2;if(filter==='w3')return s.wrong>=3;return true}
function render(){
 let a=data.filter(okf);if(randomized)a=[...a].sort(()=>Math.random()-.5);
 root.innerHTML='';
 a.forEach((x,i)=>{
  const s=st(x.id),c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="qno">${i+1}/${a.length}</div><div class="q">${x.q}</div><input id="in-${x.id}" class="answer" autocomplete="off" placeholder="答えを入力"><div class="actions"><button onclick="check('${x.id}')">答える</button><button onclick="showa('${x.id}')">答えを見る</button></div><div id="fb-${x.id}" class="feedback"></div><div id="m-${x.id}" class="meta">累計：${s.attempts}回答 / ${s.correct}正解 / ${s.wrong}誤答</div>`;
  c.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')check(x.id)});
  root.appendChild(c);
 });
 update(a.length);
}
function q(id){return data.find(x=>x.id===id)}
function check(id){
 let x=q(id),v=document.getElementById('in-'+id).value,good=x.answers.some(a=>norm(a)===norm(v)),s=st(id);
 s.attempts++;if(good)s.correct++;else s.wrong++;hist[id]=s;save();
 let f=document.getElementById('fb-'+id);f.style.display='block';f.innerHTML=`<b>${good?'正解！':'不正解'}</b><br>正答：${x.answer}${x.explanation?'<br>'+x.explanation:''}`;
