<title>障害者・障害児心理学｜4択216問</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#68707c;--line:#dde2e9;--accent:#2563eb;--good:#18794e;--bad:#a8322d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:780px;margin:auto;padding:18px 14px 50px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
h1{font-size:25px;margin:0 0 5px}
.desc{font-size:12px;color:var(--muted);line-height:1.6}
.toggle,.mode,.tool{border:1px solid var(--line);background:#fff;color:var(--accent);font-weight:800;cursor:pointer}
.toggle{border-radius:999px;padding:9px 12px;white-space:nowrap}
.menu.hidden{display:none}
.modes{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}
.mode{border-radius:999px;padding:9px 12px;font-size:13px}
.mode.active{background:#17191d;color:#fff;border-color:#17191d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 5px;text-align:center}
.stat b{font-size:22px;display:block}
.stat small{font-size:10px;color:var(--muted)}
.progress{height:8px;background:#e4e7eb;border-radius:999px;overflow:hidden;margin:10px 0}
.bar{height:100%;background:#ff7a00;width:0}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.tool{border-radius:10px;padding:8px 11px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;margin-top:16px}
.num{font-size:12px;color:var(--muted);margin-bottom:9px}
.q{font-size:20px;font-weight:820;line-height:1.65;white-space:pre-line;margin-bottom:16px}
.history{font-size:12px;color:var(--muted);background:#f6f8fb;border-radius:10px;padding:8px 10px;margin-bottom:13px}
.choices{display:grid;gap:9px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;font-size:15.5px;font-weight:700;line-height:1.55;color:var(--text);cursor:pointer}
.choice.correct{border:2px solid #68b88d;background:#eaf8ef;color:#146c43}
.choice.wrong{border:2px solid #e49a95;background:#fff0ef;color:#a8322d}
.choice:disabled{opacity:1}
.feedback{display:none;margin-top:13px;padding:12px;border-radius:11px;font-weight:900}
.feedback.good{display:block;background:#eaf8ef;color:var(--good)}
.feedback.bad{display:block;background:#fff0ef;color:var(--bad)}
.explain{display:none;margin-top:10px;background:#f7f9fc;border-radius:11px;padding:12px;line-height:1.7;font-size:14px}
.explain.show{display:block}
.next{display:none;width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px;font-weight:850;cursor:pointer}
.next.show{display:block}
.empty{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--muted);margin-top:18px}
.footer-note{font-size:11px;color:var(--muted);line-height:1.65;margin-top:14px}

</style>
</head>

const KEY='shougai_choice_rebuilt_216_v1';
const fresh=()=>({correct:Array(Q.length).fill(0),wrong:Array(Q.length).fill(0),attempts:Array(Q.length).fill(0),randomOrder:[]});
let state;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');state=s&&s.correct?.length===Q.length?s:fresh()}catch(e){state=fresh()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));

function shuffleNew(){
  state.randomOrder=[...Array(Q.length).keys()];
  for(let i=state.randomOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.randomOrder[i],state.randomOrder[j]]=[state.randomOrder[j],state.randomOrder[i]]}
  save();
}
if(state.randomOrder.length!==Q.length) shuffleNew();

let mode='balanced',pool=[],pos=0,locked=false;

function build(){
  const ids=[...Array(Q.length).keys()];
  if(mode==='balanced') pool=[...BALANCED];
  else if(mode==='random') pool=[...state.randomOrder];
  else if(mode==='unanswered') pool=BALANCED.filter(i=>state.attempts[i]===0);
  else if(mode==='wrongAny') pool=BALANCED.filter(i=>state.wrong[i]>=1);
  else if(mode==='wrong1') pool=BALANCED.filter(i=>state.wrong[i]===1);
  else if(mode==='wrong2') pool=BALANCED.filter(i=>state.wrong[i]===2);
  else pool=BALANCED.filter(i=>state.wrong[i]>=3);
  pos=0;
}

function stats(){
  const c=state.correct.reduce((a,b)=>a+b,0), w=state.wrong.reduce((a,b)=>a+b,0), a=c+w;
  document.getElementById('correct').textContent=c;
  document.getElementById('wrong').textContent=w;
  document.getElementById('rate').textContent=a?Math.round(c/a*100)+'%':'0%';
  document.getElementById('pos').textContent=pool.length?(pos+1)+'/'+pool.length:'0/'+pool.length;
  const seen=state.attempts.filter(x=>x>0).length;
  document.getElementById('bar').style.width=(seen/Q.length*100)+'%';
}

function draw(){
  const quiz=document.getElementById('quiz'),empty=document.getElementById('empty');
  quiz.innerHTML='';
  if(!pool.length){empty.style.display='block';stats();return}
  empty.style.display='none';locked=false;
  const qi=pool[pos],item=Q[qi];
  const card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="num">問題 '+(pos+1)+' / '+pool.length+'</div><div class="q"></div><div class="history"></div><div class="choices"></div><div class="feedback"></div><div class="explain"></div><button class="next">次の問題へ →</button>';
  card.querySelector('.q').textContent=item.q;
  card.querySelector('.history').textContent=`この問題の履歴：○ ${state.correct[qi]}回 ／ × ${state.wrong[qi]}回 ／ 挑戦 ${state.attempts[qi]}回`;
  item.choices.forEach((ch,i)=>{
    const b=document.createElement('button');b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+ch;
    b.onclick=()=>answer(qi,i,card);
    card.querySelector('.choices').appendChild(b);
  });
  card.querySelector('.next').onclick=()=>{pos=(pos+1)%pool.length;draw();window.scrollTo({top:0,behavior:'smooth'})};
  quiz.appendChild(card);stats();
}

function answer(qi,sel,card){
  if(locked)return;locked=true;
  const item=Q[qi],ok=sel===item.answer;
  state.attempts[qi]++; if(ok)state.correct[qi]++; else state.wrong[qi]++; save();
  [...card.querySelectorAll('.choice')].forEach((b,i)=>{
    b.disabled=true;
    if(i===item.answer)b.classList.add('correct');
    if(i===sel&&i!==item.answer)b.classList.add('wrong');
  });
  const fb=card.querySelector('.feedback');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'○ 正解！':'× 不正解';
  const ex=card.querySelector('.explain');ex.classList.add('show');
  ex.innerHTML='<b>正解：'+String.fromCharCode(65+item.answer)+'. '+item.correct+'</b><br><br>'+item.explanation;
  card.querySelector('.history').textContent=`この問題の履歴：○ ${state.correct[qi]}回 ／ × ${state.wrong[qi]}回 ／ 挑戦 ${state.attempts[qi]}回`;
  card.querySelector('.next').classList.add('show');stats();
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');mode=b.dataset.mode;build();draw();
});
document.getElementById('reshuffle').onclick=()=>{shuffleNew();if(mode==='random'){build();draw()}};
document.getElementById('reset').onclick=()=>{if(confirm('正解・不正解・挑戦回数をすべて消しますか？')){state=fresh();shuffleNew();build();draw()}};
document.getElementById('toggle').onclick=()=>{const m=document.getElementById('menu'),b=document.getElementById('toggle');const h=m.classList.toggle('hidden');b.textContent=h?'▼ メニューを表示':'▲ メニューを隠す'};
build();draw();
</script>
</body>
</html>
