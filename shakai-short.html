<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>社会心理学｜一問一答</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1d2733;--muted:#667085;--line:#dce3ec;--accent:#3157d5;--accent2:#e9efff;--ok:#087a55;--okbg:#e9f8f2;--bad:#b42318;--badbg:#fff0ee;--shadow:0 10px 30px rgba(31,45,61,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
button,input,select,textarea{font:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(49,87,213,.22);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:900px;margin:auto;padding:13px 18px}.titleline{display:flex;align-items:center;justify-content:space-between;gap:12px}.titleline h1{font-size:19px;line-height:1.35;margin:0}.badge{white-space:nowrap;color:var(--accent);background:var(--accent2);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:#f8faff;border:1px solid #e8edf5;border-radius:10px;padding:7px 9px}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}
main{max-width:900px;margin:auto;padding:18px}.controls{display:grid;grid-template-columns:1.4fr 1fr auto;gap:9px;margin-bottom:14px}.controls select,.controls button{min-height:44px;padding:8px 11px}.secondary{background:#fff}.danger{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.q{font-size:19px;font-weight:700;line-height:1.65;margin:15px 0 18px;white-space:pre-wrap}
.options{display:grid;gap:10px}.option{display:grid;grid-template-columns:34px 1fr;align-items:center;text-align:left;width:100%;padding:12px 13px;border-color:var(--line);transition:.15s}.option:hover{border-color:#9fb0e7;background:#f8faff}.letter{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#eef2f8;font-weight:800}.option.correct{border-color:#55b797;background:var(--okbg)}.option.wrong{border-color:#ee8f86;background:var(--badbg)}.option.dim{opacity:.62}
.answerbox{margin-top:16px;border-radius:13px;padding:13px 14px}.answerbox.ok{background:var(--okbg);border:1px solid #9bd8c2}.answerbox.bad{background:var(--badbg);border:1px solid #f0aaa3}.answerbox.neutral{background:#f6f8fc;border:1px solid var(--line)}.answerbox b{display:block;margin-bottom:3px}.explain{margin-top:6px}.source{margin-top:6px;color:var(--muted);font-size:12px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}.nav button{min-height:44px;padding:8px}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.shortinput{width:100%;min-height:94px;padding:12px;resize:vertical}.markrow,.resetrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.markrow button,.resetrow button{min-height:46px;padding:9px}.mark-ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mark-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.footnote{color:var(--muted);font-size:12px;margin:13px 2px 0}.hidden{display:none!important}.homebar{max-width:900px;margin:0 auto;padding:9px 18px 0}.homebar a{color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
@media(max-width:620px){.head{padding:11px 13px}.titleline{align-items:flex-start}.titleline h1{font-size:17px}.stats{gap:5px}.stat{padding:6px}.stat b{font-size:14px}.controls{grid-template-columns:1fr 1fr}.controls .wide{grid-column:1/-1}.card{padding:16px 14px;border-radius:15px}.q{font-size:17px}.option{padding:11px 9px}.nav{grid-template-columns:1fr 1fr}.nav .wide{grid-column:1/-1}main{padding:13px}}
</style></head>

<script>const questions=[{"id":"soc-s-001","q":"外集団よりも、自分が所属する集団を高く評価し、好意的な態度や行動をとる傾向を何というか。","answer":"内集団びいき","aliases":[],"explanation":"自分の所属集団を相対的に高く評価する傾向である。","section":"1. 内集団びいき"},{"id":"soc-s-002","q":"自分が所属している集団を何というか。","answer":"内集団","aliases":[],"explanation":"資料では、自分が所属している集団を内集団としている。","section":"1. 内集団びいき"},{"id":"soc-s-003","q":"自分が所属していない集団を何というか。","answer":"外集団","aliases":[],"explanation":"資料では、自分が所属していない集団を外集団としている。","section":"1. 内集団びいき"},{"id":"soc-s-004","q":"援助行動を引き起こす要因のうち、内集団びいきと深くかかわるものは何か。","answer":"被援助者との類似性","aliases":[],"explanation":"相手との類似性が、同じ集団の一員だという知覚と結びつく。","section":"1. 内集団びいき"},{"id":"soc-s-005","q":"レヴィンらのフィールド実験で対象となったのは、どのような人々か。","answer":"あるサッカーチームのファンである大学生","aliases":[],"explanation":"あるサッカーチームを応援する大学生を対象にした。","section":"1. 内集団びいき"},{"id":"soc-s-006","q":"レヴィンらは、参加者の目の前で人がけがをして苦しむ場面に対する援助を、どの方法で調べたか。","answer":"フィールド実験","aliases":[],"explanation":"日常場面に近い状況で援助行動を観察するフィールド実験だった。","section":"1. 内集団びいき"},{"id":"soc-s-007","q":"レヴィンらの実験で、参加者がより援助したのはどの人物か。","answer":"自分の好きなチームのユニフォームを着た人物","aliases":[],"explanation":"好きなチームのユニフォームが内集団の手がかりになった。","section":"1. 内集団びいき"},{"id":"soc-s-008","q":"内集団を高く評価し、外集団を相対的に低く位置づけることから生じるおそれがあるものは何か。","answer":"自文化中心主義や外集団への偏見・差別","aliases":[],"explanation":"資料は、自文化中心主義や外集団への偏見・差別につながる危険を挙げている。","section":"1. 内集団びいき"},{"id":"soc-s-009","q":"自分に都合のよい結果は内的要因に、都合の悪い結果は外的要因に帰属する傾向を何というか。","answer":"セルフ・サービング・バイアス","aliases":["セルフサービングバイアス"],"explanation":"自分に有利な形で原因を帰属するバイアスである。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-010","q":"自分に有利な形で原因を帰属する傾向は、どの動機を満たす方法の一つとされるか。","answer":"自己高揚動機","aliases":[],"explanation":"資料では、自己高揚動機を満たす方法の一つと説明されている。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-011","q":"自分にとって都合のよい出来事は、一般にどこへ帰属されるか。","answer":"自分自身の内的要因","aliases":[],"explanation":"成功などは自分の能力や努力といった内的要因に帰属されやすい。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-012","q":"自分にとって都合の悪い出来事は、一般にどこへ帰属されるか。","answer":"外的要因","aliases":[],"explanation":"失敗などは状況や環境といった外的要因に帰属されやすい。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-013","q":"都合のよいことを自分の内的要因へ帰属することを何というか。","answer":"自己高揚的帰属","aliases":[],"explanation":"都合のよい結果に用いられる呼称が自己高揚的帰属である。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-014","q":"都合の悪いことを外的要因へ帰属することを何というか。","answer":"自己防衛的帰属","aliases":[],"explanation":"都合の悪い結果に用いられる呼称が自己防衛的帰属である。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-015","q":"成功を自分の内的属性に帰属することで、維持・向上しようとするものは何か。","answer":"自尊感情","aliases":[],"explanation":"自尊感情を保つことが、このバイアスの動機的説明の一つである。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-016","q":"成功を内的属性に帰属する背景として、自尊感情のほかに挙げられる対人的な動機は何か。","answer":"他者に望ましい印象をもたらそうとする動機","aliases":[],"explanation":"他者からよく見られたいという印象管理の側面も説明されている。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-017","q":"情報処理による説明では、期待に合致する成功結果と何との関係を知覚しやすいとされるか。","answer":"自分の努力","aliases":[],"explanation":"人は成功を意図し期待して行動するため、成功と努力を結びつけやすい。","section":"2. セルフ・サービング・バイアス"},{"id":"soc-s-018","q":"成功の確信が持てないとき、自己評価を守るために遂行の障害を自ら作ったり主張したりすることを何というか。","answer":"セルフ・ハンディキャッピング","aliases":[],"explanation":"失敗時の能力帰属を避け、成功時の能力帰属を強められる方略である。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-019","q":"遂行の妨げとなる障害を用いる自己高揚方略は、どのようなときに生じやすいか。","answer":"課題に成功する確信が持てないとき","aliases":[],"explanation":"成功できるか不確かな場面で自己評価を保つために用いられる。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-020","q":"課題遂行を妨げる障害を設ける主な目的は何か。","answer":"自己評価を維持すること","aliases":[],"explanation":"能力が低いという評価から自己を守ることが目的である。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-021","q":"障害がある状況で失敗した場合、自分の能力不足への帰属はどうなるか。","answer":"割り引かれる","aliases":[],"explanation":"失敗は障害のせいだと説明できるため、能力不足の寄与が小さく見積もられる。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-022","q":"障害がある状況にもかかわらず成功した場合、自分の能力への帰属はどうなるか。","answer":"割り増しされる","aliases":[],"explanation":"困難にもかかわらず成功したため、能力が高いと評価しやすくなる。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-023","q":"この自己高揚方略の具体例として資料に挙げられている訴えはどれか。","answer":"身体的不調の訴え","aliases":[],"explanation":"体調不良をあらかじめ主張することが例として挙げられている。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-024","q":"この自己高揚方略の具体例として、課題について何を主張することが挙げられているか。","answer":"課題の困難さ","aliases":[],"explanation":"課題自体が難しいと主張し、失敗の説明を用意する。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-025","q":"自ら選ぶ行動上の障害として、資料に挙げられているものはどれか。","answer":"不利な遂行条件","aliases":[],"explanation":"あえて不利な条件を選ぶこともセルフ・ハンディキャッピングに含まれる。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-026","q":"資料で、課題遂行前に行う具体的行動の一つとして挙げられているものは何か。","answer":"アルコールの摂取","aliases":[],"explanation":"アルコール摂取も遂行を妨げ得る障害の例とされる。","section":"3. セルフ・ハンディキャッピング"},{"id":"soc-s-027","q":"集団の中に自らを埋没させ、自己への意識が薄らいだ状態を何というか。","answer":"没個性化","aliases":[],"explanation":"集団内で自己意識が弱まった状態を指す。","section":"4. 没個性化"},{"id":"soc-s-028","q":"この状態では、社会的規範や社会からの何に対する意識が低くなるか。","answer":"批判","aliases":[],"explanation":"社会的規範や社会からの批判への意識が低下する。","section":"4. 没個性化"},{"id":"soc-s-029","q":"自己への意識が薄らいだとき、起こりやすくなる三種類の行動は何か。","answer":"無責任な行動・衝動的／感情的な行動・攻撃行動","aliases":[],"explanation":"資料は無責任な行動、衝動的・感情的な行動、攻撃行動を挙げている。","section":"4. 没個性化"},{"id":"soc-s-030","q":"この状態を生じやすくする集団規模の条件は何か。","answer":"大集団の成員であること","aliases":[],"explanation":"大きな集団の一員であることが条件の一つである。","section":"4. 没個性化"},{"id":"soc-s-031","q":"この状態を生じやすくする、個人の特定されにくさに関する条件は何か。","answer":"匿名性が保証されていること","aliases":[],"explanation":"匿名性は自己意識や責任感を弱める条件になる。","section":"4. 没個性化"},{"id":"soc-s-032","q":"この状態を生じやすくする、責任に関する条件は何か。","answer":"責任が分散していること","aliases":[],"explanation":"集団内で責任が分散していることが条件の一つである。","section":"4. 没個性化"},{"id":"soc-s-033","q":"この状態を生じやすくする、覚醒水準に関する条件は何か。","answer":"興奮状態であること","aliases":[],"explanation":"興奮状態も没個性化を促す条件として挙げられる。","section":"4. 没個性化"},{"id":"soc-s-034","q":"この状態になると低下するとされる感情の組合せはどれか。","answer":"罪・恥・恐怖感","aliases":[],"explanation":"自己意識の低下に伴って、罪・恥・恐怖感も低下する。","section":"4. 没個性化"},{"id":"soc-s-035","q":"過激で極端な行動は、その後どのように広がると説明されているか。","answer":"周囲の人の行動にも影響して拡大する","aliases":[],"explanation":"一人の極端な行動が周囲に影響し、さらに拡大し得る。","section":"4. 没個性化"},{"id":"soc-s-036","q":"個人が持つ二つの認知の間に矛盾があるときに生じる不快な状態を何というか。","answer":"認知的不協和","aliases":[],"explanation":"二つの認知が矛盾すると不快な不協和状態が生じる。","section":"5. 認知的不協和理論"},{"id":"soc-s-037","q":"認知間の矛盾から生じる不快状態を説明した理論の提唱者は誰か。","answer":"フェスティンガー","aliases":[],"explanation":"フェスティンガーが提唱した理論である。","section":"5. 認知的不協和理論"},{"id":"soc-s-038","q":"不快な不協和状態を解消するため、個人が変えるとされるものは何か。","answer":"態度や行動","aliases":[],"explanation":"態度または行動を変え、認知間の矛盾を減らそうとする。","section":"5. 認知的不協和理論"},{"id":"soc-s-039","q":"不快状態への別の対処として、個人はどのような情報を避けるとされるか。","answer":"不協和をさらに増大させる情報","aliases":[],"explanation":"矛盾を強める情報を回避することでも不協和を抑えようとする。","section":"5. 認知的不協和理論"},{"id":"soc-s-040","q":"フェスティンガーとともに実験を行った研究者は誰か。","answer":"カールスミス","aliases":[],"explanation":"資料ではフェスティンガーとカールスミスによる実験が紹介されている。","section":"5. 認知的不協和理論"},{"id":"soc-s-041","q":"フェスティンガーが特に注目した不一致は、何と何の間のものか。","answer":"態度と行動","aliases":[],"explanation":"本来の態度と実際にとった行動の不一致に焦点を当てた。","section":"5. 認知的不協和理論"},{"id":"soc-s-042","q":"実験参加者が最初に行った単調で退屈な作業の時間はどれくらいか。","answer":"1時間半","aliases":[],"explanation":"参加者は単調な作業を1時間半行った。","section":"5. 認知的不協和理論"},{"id":"soc-s-043","q":"実験で一部の参加者が別の参加者に伝えるよう求められた内容は何か。","answer":"課題は面白かった","aliases":[],"explanation":"本来の態度と異なる「課題は面白かった」という発言を求められた。","section":"5. 認知的不協和理論"},{"id":"soc-s-044","q":"別の参加者に課題について嘘をつくよう求められた群が受け取った報酬はいくらか。","answer":"1ドル","aliases":[],"explanation":"資料に示された報酬額は1ドルである。","section":"5. 認知的不協和理論"},{"id":"soc-s-045","q":"実験の最後に課題への評価がより高くなったのはどちらか。","answer":"嘘をつくよう求められた参加者","aliases":[],"explanation":"本来の態度と異なる発言による不協和を減らすため、課題への態度が好意的になった。","section":"5. 認知的不協和理論"},{"id":"soc-s-046","q":"フェスティンガーらの実験から、本来の態度と異なる行動の後に何が変化すると示されたか。","answer":"態度","aliases":[],"explanation":"行動との不一致を解消する方向に態度が変わった。","section":"5. 認知的不協和理論"},{"id":"soc-s-047","q":"送り手がメッセージを送り、受け手の態度や行動を変えることを目的とするコミュニケーションを何というか。","answer":"説得的コミュニケーション","aliases":[],"explanation":"態度や行動の変化を意図したメッセージ伝達である。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-048","q":"説得効果に影響する送り手の二つの特徴は何か。","answer":"信憑性と魅力","aliases":[],"explanation":"資料では送り手の特徴として信憑性と魅力が挙げられる。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-049","q":"メッセージを送る人物が信じるに値するかを表す特徴を何というか。","answer":"信憑性","aliases":[],"explanation":"送り手を信頼できる程度を信憑性という。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-050","q":"送り手の信憑性が高まると受け手からみなされる伝え方はどれか。","answer":"知識を偏りなく誠実に伝える","aliases":[],"explanation":"知識を偏りなく誠実に伝える人物は信じるに値すると判断されやすい。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-051","q":"送り手のどのような魅力が高いほど、受け手の態度は変化しやすいとされるか。","answer":"身体的魅力と内面的魅力","aliases":[],"explanation":"資料は身体的魅力と内面的魅力の双方を挙げている。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-052","q":"送り手の特徴以外に、説得効果を変化させるものは何か。","answer":"伝える方法や内容の構成","aliases":[],"explanation":"どのような方法・構成で伝えるかによっても説得効果は異なる。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-053","q":"肯定面と否定面の双方を含めて伝える方法を何というか。","answer":"両面的メッセージ","aliases":[],"explanation":"説得に有効な内容構成の一つとして両面的メッセージが挙げられている。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-054","q":"恐ろしさを喚起して態度や行動の変化を促す伝え方を何というか。","answer":"恐怖アピール・メッセージ","aliases":[],"explanation":"恐怖を利用する説得メッセージである。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-055","q":"好ましい感情を生じさせて説得効果を高める伝え方を何というか。","answer":"ポジティブ感情喚起メッセージ","aliases":[],"explanation":"ポジティブ感情を喚起する伝え方も有効とされる。","section":"6. 説得的コミュニケーション"},{"id":"soc-s-056","q":"承諾されやすい小さな依頼の後に、本来の依頼を行う方法を何というか。","answer":"フット・イン・ザ・ドア","aliases":[],"explanation":"小さな要請から本命の要請へ進む段階的要請法である。","section":"7. フット・イン・ザ・ドア"},{"id":"soc-s-057","q":"段階的要請法で最初に提示するのは、どのような要請か。","answer":"承諾してもらえそうな小さな要請","aliases":[],"explanation":"まず受け入れやすい小さな依頼を承諾してもらう。","section":"7. フット・イン・ザ・ドア"},{"id":"soc-s-058","q":"小さな依頼を受け入れた後に形成されると説明される自己イメージはどれか。","answer":"自分は協力的で良い人だ","aliases":[],"explanation":"最初の承諾が協力的な自己イメージを作り、次の行動との一貫性を促す。","section":"7. フット・イン・ザ・ドア"},{"id":"soc-s-059","q":"段階的要請法では、最初と二回目の依頼内容が異なる場合、効果はどうなるとされるか。","answer":"内容が異なっても効果がある","aliases":[],"explanation":"二つの依頼の内容が異なっても効果があることが知られている。","section":"7. フット・イン・ザ・ドア"},{"id":"soc-s-060","q":"段階的要請法では、最初と二回目の依頼者が異なる場合、効果はどうなるとされるか。","answer":"依頼者が異なっても効果がある","aliases":[],"explanation":"依頼者が変わっても効果がみられるとされる。","section":"7. フット・イン・ザ・ドア"},{"id":"soc-s-061","q":"最初に承諾されにくい大きな依頼を断らせ、その後に本来の依頼を行う方法を何というか。","answer":"ドア・イン・ザ・フェイス","aliases":[],"explanation":"大きな要請から譲歩して本命の要請を示す譲歩的要請法である。","section":"8. ドア・イン・ザ・フェイス"},{"id":"soc-s-062","q":"譲歩的要請法で、最初の困難な要請に対して相手が行うことは何か。","answer":"断る","aliases":[],"explanation":"最初の大きな要請を断らせた後、本来の要請を提示する。","section":"8. ドア・イン・ザ・フェイス"},{"id":"soc-s-063","q":"最初の困難な要請の後、本来の要請は相手にどのように見えるか。","answer":"説得者が譲歩したように見える","aliases":[],"explanation":"二つ目の要請が小さくなり、説得者の譲歩として知覚される。","section":"8. ドア・イン・ザ・フェイス"},{"id":"soc-s-064","q":"譲歩的要請法の効果を説明する原理は何か。","answer":"譲歩の返報性","aliases":[],"explanation":"説得者が譲歩したため、被説得者も譲歩しなければならないと感じる。","section":"8. ドア・イン・ザ・フェイス"},{"id":"soc-s-065","q":"妥当な条件で承諾を得た後、隠していたコストを加えたり有利な条件を除いたりして再要請する方法を何というか。","answer":"ロー・ボール","aliases":[],"explanation":"先に承諾を取りつけてから条件を不利にする承諾先取り要請法である。","section":"9. ロー・ボール"},{"id":"soc-s-066","q":"承諾先取り要請法で、最初に行う申し出はどのようなものか。","answer":"妥当な申し出","aliases":[],"explanation":"まず妥当で受け入れやすい条件を示して承諾を得る。","section":"9. ロー・ボール"},{"id":"soc-s-067","q":"最初の承諾後に行われる条件変更として適切なのはどれか。","answer":"隠していたコストを加える","aliases":[],"explanation":"隠していた負担を追加することが典型的な操作である。","section":"9. ロー・ボール"},{"id":"soc-s-068","q":"最初の承諾後に行われるもう一つの条件変更は何か。","answer":"相手に有利な条件や魅力的なものを取り除く","aliases":[],"explanation":"魅力的な条件を撤回したうえで再度要請する場合もある。","section":"9. ロー・ボール"},{"id":"soc-s-069","q":"条件が不利になっても承諾を取り消しにくくなるのは、何が生じるためか。","answer":"一度引き受けた依頼への責任感","aliases":[],"explanation":"いったん承諾すると、その決定に対する責任感が生じる。","section":"9. ロー・ボール"},{"id":"soc-s-070","q":"受け手の動機づけや情報処理能力によって、態度変化に至る経路が異なるとする理論を何というか。","answer":"精緻化見込みモデル","aliases":[],"explanation":"説得を処理する中心ルートと周辺ルートを説明するモデルである。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-071","q":"態度変化に至る二つの経路を説明するモデルを提唱した研究者の組合せはどれか。","answer":"ペティとカシオッポ","aliases":[],"explanation":"ペティとカシオッポが提唱した。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-072","q":"受け手にメッセージを処理する動機づけと能力がある場合に用いられる経路を何というか。","answer":"中心ルート","aliases":[],"explanation":"動機づけと能力が高いと内容を吟味する中心ルートが用いられる。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-073","q":"中心ルートでは、メッセージの何が吟味されるか。","answer":"内容","aliases":[],"explanation":"主張内容をよく検討し、その受け止め方で態度変化が決まる。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-074","q":"中心ルートで態度変化の方向を決めるものは何か。","answer":"内容をどのように受け止めたか","aliases":[],"explanation":"内容を吟味した結果としての受け止め方が重要になる。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-075","q":"受け手に動機づけや情報処理能力がない場合に用いられる経路を何というか。","answer":"周辺ルート","aliases":[],"explanation":"内容そのものではなく周辺的手がかりに基づく経路である。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-076","q":"周辺ルートで用いられる手がかりの例はどれか。","answer":"送り手の専門性","aliases":[],"explanation":"専門家が言っているといった内容外の手がかりが使われる。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-077","q":"周辺ルートで用いられる社会的な手がかりの例はどれか。","answer":"周囲の意見","aliases":[],"explanation":"周囲が賛成しているかなども周辺的手がかりになる。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-078","q":"高いメッセージ処理動機と関係する個人特性として挙げられているものは何か。","answer":"思考欲求","aliases":[],"explanation":"考えることを好む思考欲求は、高い動機づけに関係する。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-079","q":"高いメッセージ処理動機と関係する、話題と自分との関連の強さを何というか。","answer":"個人的関与度","aliases":[],"explanation":"話題への個人的関与度が高いほど、内容を吟味する動機が高まりやすい。","section":"10. 精緻化見込みモデル"},{"id":"soc-s-080","q":"将来受ける説得の内容を事前に知らせ、反論を準備させることで抵抗を高める考え方を何というか。","answer":"接種理論","aliases":[],"explanation":"予防接種になぞらえ、弱い攻撃への備えが後の説得への抵抗を生むと考える。","section":"11. 接種理論"},{"id":"soc-s-081","q":"これから説得されると予告されることで、受け手に生まれる余裕は何か。","answer":"反論を準備する時間的余裕","aliases":[],"explanation":"事前予告により反論を考える時間が確保される。","section":"11. 接種理論"},{"id":"soc-s-082","q":"説得への抵抗が特に高まりやすいのは、どのような話題か。","answer":"自分の関心が強い話題","aliases":[],"explanation":"関心が強い話題で反対の説得を予告されると抵抗が高まる。","section":"11. 接種理論"},{"id":"soc-s-083","q":"関心の強い話題について、どのような説得が予告されると抵抗が高まるか。","answer":"自分の態度と反する説得","aliases":[],"explanation":"自分の立場への反対説得を予告されることで反論が準備される。","section":"11. 接種理論"},{"id":"soc-s-084","q":"事前予告によって受け手が準備するものは何か。","answer":"説得メッセージに対する反論","aliases":[],"explanation":"本格的な説得の前に反論を用意することで抵抗しやすくなる。","section":"11. 接種理論"},{"id":"soc-s-085","q":"自分の自由が制限されたと認知したとき、自由の回復を望む動機づけが生じるとする理論は何か。","answer":"心理的リアクタンス理論","aliases":[],"explanation":"脅かされた選択の自由を取り戻そうとする反応を説明する。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-086","q":"自由が制限されたと認知すると、何を望む動機づけが喚起されるか。","answer":"自由の回復","aliases":[],"explanation":"失われそうな自由を取り戻そうとする。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-087","q":"説得者が意図した方向とは反対に、受け手の態度が変わる効果を何というか。","answer":"ブーメラン効果","aliases":[],"explanation":"強い説得が自由を脅かし、意図と逆方向の態度変化を招くことがある。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-088","q":"説得によって自由が脅かされた受け手の反応として適切なのはどれか。","answer":"説得を受け入れない","aliases":[],"explanation":"自由を守るために説得を拒否することがある。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-089","q":"反発の大きさを規定する、制限対象の価値に関する要因は何か。","answer":"制限される自由の重要度","aliases":[],"explanation":"重要な自由ほど、制限への反発が大きくなる。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-090","q":"反発の大きさを規定する、自由の量に関する要因は何か。","answer":"制限される自由の割合","aliases":[],"explanation":"どれほど多くの自由が制限されるかが影響する。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-091","q":"反発の大きさを規定する、働きかけの強さに関する要因は何か。","answer":"自由への脅威の程度","aliases":[],"explanation":"自由がどれほど強く脅かされるかによってリアクタンスは変わる。","section":"12. 心理的リアクタンス理論"},{"id":"soc-s-092","q":"周囲の環境から得られる情報をどのように処理するかを扱う領域を何というか。","answer":"社会的認知","aliases":[],"explanation":"社会環境の情報処理を扱う領域である。","section":"13. 社会的認知"},{"id":"soc-s-093","q":"社会的認知に含まれる二つの領域は何か。","answer":"対人認知と社会的推論","aliases":[],"explanation":"資料は対人認知（印象形成）と社会的推論（原因帰属）を挙げている。","section":"13. 社会的認知"},{"id":"soc-s-094","q":"他者に関する情報を手がかりとして、その人物の全体的な印象を形成することを何というか。","answer":"対人認知（印象形成）","aliases":[],"explanation":"他者についての情報から全体像を作る過程である。","section":"13. 社会的認知"},{"id":"soc-s-095","q":"多くの人が他者の印象を即決するとき、手がかりにしやすいものは何か。","answer":"外見的な特徴","aliases":[],"explanation":"研究では外見的特徴を用いた即時の印象判断が示されている。","section":"13. 社会的認知"},{"id":"soc-s-096","q":"人間の基本感情を六つに分類した研究者は誰か。","answer":"エクマン","aliases":[],"explanation":"エクマンが六つの基本感情と対応する表情を示した。","section":"13. 社会的認知"},{"id":"soc-s-097","q":"資料に示された六つの基本感情の組合せとして正しいものはどれか。","answer":"驚き・恐怖・嫌悪・怒り・喜び・悲しみ","aliases":[],"explanation":"資料の六感情は驚き、恐怖、嫌悪、怒り、喜び、悲しみである。","section":"13. 社会的認知"},{"id":"soc-s-098","q":"エクマンは、基本感情のそれぞれに対応する何があることを示したか。","answer":"顔面表情","aliases":[],"explanation":"各基本感情には対応する顔面表情があるとした。","section":"13. 社会的認知"},{"id":"soc-s-099","q":"基本感情に対応する各表情には、何の特有な動きがあるとされたか。","answer":"顔の筋肉","aliases":[],"explanation":"表情ごとに特有の顔面筋の動きがある。","section":"13. 社会的認知"},{"id":"soc-s-100","q":"人物印象を形づくる情報の重要度の違いを実験的に示した研究者は誰か。","answer":"アッシュ","aliases":[],"explanation":"アッシュは形容詞リストを用いて印象形成を研究した。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-101","q":"印象形成の実験で参加者に提示されたものは何か。","answer":"架空の人物の特徴を表す形容詞のリスト","aliases":[],"explanation":"架空人物を表す複数の形容詞から印象を形成させた。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-102","q":"印象形成に大きな影響を及ぼし、印象の核となる情報を何というか。","answer":"中心特性","aliases":[],"explanation":"人は中心特性を核にして全体的な印象を形成する。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-103","q":"印象形成への影響が小さい情報を何というか。","answer":"周辺特性","aliases":[],"explanation":"印象への寄与が相対的に小さい情報である。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-104","q":"人物情報の何が、形成される印象に影響すると指摘されているか。","answer":"呈示順序","aliases":[],"explanation":"同じ情報でも示される順序によって印象が変わり得る。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-105","q":"最初の方に示された情報が印象形成へ強く影響する現象を何というか。","answer":"初頭効果","aliases":[],"explanation":"先に提示された情報が強い重みをもつ効果である。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-106","q":"最後に与えられた情報が印象形成へ強く影響する現象を、資料では何と呼んでいるか。","answer":"親近性効果","aliases":[],"explanation":"資料では、初頭効果とは逆の効果を「親近性効果」と表記している。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-107","q":"アッシュの実験から、人は何を核として人物の印象を形成するとされたか。","answer":"重要な情報","aliases":[],"explanation":"すべての特徴を同じ重さで扱うのではなく、重要な特徴を核にする。","section":"14. アッシュの印象形成理論"},{"id":"soc-s-108","q":"出来事や他者の行動がなぜ生じたか、その原因を推論することを何というか。","answer":"原因帰属","aliases":[],"explanation":"身の回りの事象や行動の原因を推論する過程である。","section":"15. 原因帰属"},{"id":"soc-s-109","q":"原因帰属の基本的な枠組みを示した研究者は誰か。","answer":"ハイダー","aliases":[],"explanation":"ハイダーは原因を内的・外的に分類した。","section":"15. 原因帰属"},{"id":"soc-s-110","q":"行為者の性格・能力・意図などに原因を求めることを何というか。","answer":"内的帰属","aliases":[],"explanation":"行為者内部の性質へ原因を求める帰属である。","section":"15. 原因帰属"},{"id":"soc-s-111","q":"行為者の内部にある原因の例として資料に挙げられていないものはどれか。","answer":"周囲の状況","aliases":[],"explanation":"周囲の状況は行為者外部の要因であり、外的帰属に当たる。","section":"15. 原因帰属"},{"id":"soc-s-112","q":"周囲の状況や環境など、行為者以外に原因を求めることを何というか。","answer":"外的帰属","aliases":[],"explanation":"行為者の外部に原因を求める帰属である。","section":"15. 原因帰属"},{"id":"soc-s-113","q":"ハイダーの枠組みに安定性の要因を加え、教育現場に適用した研究者は誰か。","answer":"ワイナー","aliases":[],"explanation":"ワイナーは原因の所在に安定性の次元を加えた。","section":"15. 原因帰属"},{"id":"soc-s-114","q":"ワイナーが原因帰属の枠組みを適用した主な場面はどこか。","answer":"教育現場","aliases":[],"explanation":"ハイダーの枠組みに安定性を加え、教育場面へ適用した。","section":"15. 原因帰属"},{"id":"soc-s-115","q":"ワイナーが原因の所在に加えた次元は何か。","answer":"安定性","aliases":[],"explanation":"原因が安定的か一時的かという次元である。","section":"15. 原因帰属"},{"id":"soc-s-116","q":"ワイナーの枠組みで用いられる二つの次元は何か。","answer":"原因の所在と安定性","aliases":[],"explanation":"内的・外的という所在と、安定的・一時的という安定性を用いる。","section":"15. 原因帰属"},{"id":"soc-s-117","q":"ワイナーが教育場面の帰属原因として挙げた四つは何か。","answer":"能力・努力・課題の困難さ・運","aliases":[],"explanation":"資料では能力、努力、課題の困難さ、運の四つに分類している。","section":"15. 原因帰属"},{"id":"soc-s-118","q":"人がどのような場合に内的帰属または外的帰属を行うかを、三種類の情報から説明する理論を何というか。","answer":"共変動理論","aliases":[],"explanation":"合意性・弁別性・一貫性を考慮する原因帰属の理論である。","section":"16. 共変動理論"},{"id":"soc-s-119","q":"ある人の行動が他者の行動と一致しているかを表す情報は何か。","answer":"合意性","aliases":[],"explanation":"同じ状況で他者も同じ行動をするかに関する情報である。","section":"16. 共変動理論"},{"id":"soc-s-120","q":"ある刺激に対してだけその行動をするかを表す情報は何か。","answer":"弁別性","aliases":[],"explanation":"刺激を区別し、特定の刺激にのみ反応しているかを見る。","section":"16. 共変動理論"},{"id":"soc-s-121","q":"状況にかかわらず同じ行動が繰り返されるかを表す情報は何か。","answer":"一貫性","aliases":[],"explanation":"その行動が状況を越えて一貫しているかに関する情報である。","section":"16. 共変動理論"},{"id":"soc-s-122","q":"原因帰属で考慮される三つの情報の組合せはどれか。","answer":"合意性・弁別性・一貫性","aliases":[],"explanation":"資料では合意性、弁別性、一貫性の三点を考慮する。","section":"16. 共変動理論"},{"id":"soc-s-123","q":"合意性・弁別性・一貫性がすべて高い場合、どの帰属が行われるか。","answer":"外的帰属","aliases":[],"explanation":"三つがすべて高い場合、原因は外部にあると判断される。","section":"16. 共変動理論"},{"id":"soc-s-124","q":"合意性と弁別性が低く、一貫性が高い場合、どの帰属が行われるか。","answer":"内的帰属","aliases":[],"explanation":"本人だけが様々な刺激に同じ行動をするため、本人内部の原因が推論される。","section":"16. 共変動理論"},{"id":"soc-s-125","q":"合意性と一貫性が高く、弁別性が低い場合、資料ではどの帰属が行われるとしているか。","answer":"外的帰属","aliases":[],"explanation":"資料の記述では、この組合せも外的帰属とされている。","section":"16. 共変動理論"},{"id":"soc-s-126","q":"観察した他者の行動原因を、一般に行為者の内的要因へ求めやすい傾向を何というか。","answer":"根本的な帰属の誤り","aliases":[],"explanation":"観察した行動の原因を内的に帰属しやすい傾向である。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-127","q":"自分の行為は外的要因に、他者の行為はその人の内的要因に帰属しやすい傾向を何というか。","answer":"行為者・観察者バイアス","aliases":[],"explanation":"同じ行動でも、自分が行為者か観察者かで帰属が異なる。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-128","q":"行為者は、自分自身の行為の原因をどこに帰属しやすいか。","answer":"外的なもの","aliases":[],"explanation":"資料では、行為者は自分の行為を外的なものに帰属しやすいとされる。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-129","q":"観察者は、行為者の行動原因をどこに帰属しやすいか。","answer":"行為者の内的なもの","aliases":[],"explanation":"観察者は目立つ行為者に注意が向き、その内的要因を重視しやすい。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-130","q":"ある刺激による生理的喚起や行動を、別の刺激が原因だと誤って判断することを何というか。","answer":"錯誤帰属","aliases":[],"explanation":"実際とは別の刺激に覚醒の原因を帰属する。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-131","q":"自分の考えや行動を一般的だとみなし、他者も同じ選択をすると推測する傾向を何というか。","answer":"合意性過大視バイアス","aliases":[],"explanation":"自分と同じ考えを持つ人の割合を実際より多く見積もる傾向である。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-132","q":"自分に都合のよいことは内的に、都合の悪いことは外的に説明する帰属の歪みは何か。","answer":"セルフ・サービング・バイアス","aliases":["セルフサービングバイアス"],"explanation":"成功と失敗を自分に有利な仕方で説明する帰属バイアスである。","section":"17. 推論・帰属の誤りとバイアス"},{"id":"soc-s-133","q":"対人関係が知己から終焉まで段階的に展開するとした研究者は誰か。","answer":"Levinger","aliases":["レビンジャー"],"explanation":"Levingerは対人関係の展開を複数の段階で示した。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-134","q":"Levingerの対人関係の展開で、最初の段階は何か。","answer":"知己になる段階","aliases":[],"explanation":"まず互いに知り合う知己の段階から始まる。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-135","q":"知己になった後に続く段階は何か。","answer":"関係構築の段階","aliases":[],"explanation":"知己の次に関係を築く段階へ進む。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-136","q":"関係構築の後に続く段階は何か。","answer":"持続の段階","aliases":[],"explanation":"構築された関係が持続する段階である。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-137","q":"持続してきた関係が悪化すると、場合によって進む段階は何か。","answer":"崩壊の段階","aliases":[],"explanation":"すべての関係ではないが、持続の後に崩壊へ進む場合がある。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-138","q":"対人関係の展開の最終段階は何か。","answer":"終焉の段階","aliases":[],"explanation":"崩壊を経た関係は終焉の段階を迎える。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-139","q":"人物の魅力を大きく左右する、その人の性格に関する要因は何か。","answer":"人格的特徴","aliases":[],"explanation":"一般に人物の魅力は人格的特徴に負うところが大きい。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-140","q":"容貌などの良さを指し、特に男女の出会いの初期に重要な要因は何か。","answer":"外見的特徴","aliases":[],"explanation":"外見的特徴は対人関係の初期段階の好意に強くかかわる。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-141","q":"自分と相手が似ているかどうかが魅力度に影響するとする仮説を、資料では何というか。","answer":"類似性－影響仮説","aliases":["類似性影響仮説","類似性－魅力仮説","類似性魅力仮説"],"explanation":"資料では「類似性－影響仮説」と表記されている。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-142","q":"ものの考え方や価値観が自分と似た相手に好意を抱きやすいことを表す要因は何か。","answer":"態度の類似","aliases":[],"explanation":"態度や価値観の類似した相手は魅力的に感じられやすい。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-143","q":"ほかの点では異なっていても、同じ出来事を一緒に経験することで魅力が高まる要因は何か。","answer":"経験の共有","aliases":[],"explanation":"同じ経験を共有することは好意形成の一因になる。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-144","q":"自分にはない特徴を持つ人に好意を抱くことを何というか。","answer":"相補性","aliases":[],"explanation":"互いに異なる特徴が補い合うことによる魅力である。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-145","q":"自分に好意を示す人を好み、自分を嫌う人を同様に嫌う傾向を何というか。","answer":"好意の返報性","aliases":[],"explanation":"相手から向けられた好意または嫌悪と同じ方向の感情を返しやすい。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-146","q":"他者との物理的距離の近さを何というか。","answer":"近接性","aliases":[],"explanation":"物理的に近く、接触機会が多いことに関する要因である。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-147","q":"物理的距離の近さは、対人関係のどの時期に特に重要とされるか。","answer":"初期","aliases":[],"explanation":"資料では、近接性は対人関係の初期に非常に重要とされる。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-148","q":"自信を失っている人が好意的に接されると、その相手を好みやすいことに関係する要因は何か。","answer":"感情状態","aliases":[],"explanation":"そのときの感情状態も、相手への好意を左右する。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-149","q":"怒りや恐怖による興奮を相手への胸の高まりだと誤解し、魅力が高まることに関係する要因は何か。","answer":"生理的覚醒","aliases":[],"explanation":"生理的興奮の原因を相手の存在に誤って帰属することで魅力が高まる。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-150","q":"生理的興奮の錯誤帰属による魅力の上昇を示す例として挙げられている実験は何か。","answer":"吊り橋実験","aliases":["つり橋実験"],"explanation":"吊り橋で生じた恐怖の覚醒を相手への好意と取り違える例である。","section":"18. 対人関係の展開・形成"},{"id":"soc-s-151","q":"文学作品などを参考に、六つの愛のスタイルを提唱した研究者は誰か。","answer":"リー","aliases":[],"explanation":"リーは文学作品などを基に六つの愛のスタイルを示した。","section":"19. リーの愛のスタイル"},{"id":"soc-s-152","q":"相手との一体感を求めるロマンティックな愛を何というか。","answer":"エロス","aliases":[],"explanation":"一体感を求めるロマンティックなスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-153","q":"自己中心的でゲーム的であり、相手に執着せず深入りを避ける愛を何というか。","answer":"ルダス","aliases":[],"explanation":"恋愛をゲームのように捉え、執着を避けるスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-154","q":"友情から自然に愛情が芽生える愛を何というか。","answer":"ストーゲイ","aliases":[],"explanation":"友情的な関係を基盤とする愛のスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-155","q":"独占欲が強く、執着や嫉妬などの激しい感情を伴う愛を何というか。","answer":"マニア","aliases":[],"explanation":"情熱的で所有欲や嫉妬を伴いやすいスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-156","q":"利他的・献身的で、見返りを求めず自己犠牲をいとわない愛を何というか。","answer":"アガペ","aliases":[],"explanation":"相手のための献身を重視する愛のスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-157","q":"社会的・経済的な条件を考えて相手を選ぶ、合理的・実利的な愛を何というか。","answer":"プラグマ","aliases":[],"explanation":"実際的な条件を重視して相手を選ぶスタイルである。","section":"19. リーの愛のスタイル"},{"id":"soc-s-158","q":"リーが示した愛のスタイルはいくつか。","answer":"6つ","aliases":[],"explanation":"資料にはエロス、ルダス、ストーゲイ、マニア、アガペ、プラグマの六つが示されている。","section":"19. リーの愛のスタイル"},{"id":"soc-s-159","q":"日本人について、女性より男性の方が強いとされる傾向はどれか。","answer":"アガペ","aliases":[],"explanation":"資料では、日本人男性は女性よりアガペ傾向が強いとされる。","section":"19. リーの愛のスタイル"},{"id":"soc-s-160","q":"日本人について、男性より女性の方が強いとされる二つの傾向は何か。","answer":"プラグマとルダス","aliases":[],"explanation":"女性はプラグマとルダスの傾向が強いとされる。","section":"19. リーの愛のスタイル"},{"id":"soc-s-161","q":"恋愛相手への愛情が強いとされる三つの傾向は何か。","answer":"エロス・マニア・アガペ","aliases":[],"explanation":"資料ではエロス、マニア、アガペが強い人は恋愛相手への愛情も強いとされる。","section":"19. リーの愛のスタイル"},{"id":"soc-s-162","q":"現在の恋愛関係への満足が高い場合が多いとされる傾向はどれか。","answer":"エロス","aliases":[],"explanation":"エロス傾向の強さは現在の恋愛関係への満足と関連するとされる。","section":"19. リーの愛のスタイル"},{"id":"soc-s-163","q":"三つの要素の組合せによって愛のタイプを説明する理論を何というか。","answer":"愛の三角理論","aliases":[],"explanation":"親密性・情熱・コミットメントの組合せで愛を捉える。","section":"20. 愛の三角理論"},{"id":"soc-s-164","q":"好意や親密感から成る穏やかな感情を何というか。","answer":"親密性","aliases":[],"explanation":"親密性は愛の三大要素の一つである。","section":"20. 愛の三角理論"},{"id":"soc-s-165","q":"夢中になる愛情関係や相手との一体感を求める強い衝動を何というか。","answer":"情熱","aliases":[],"explanation":"強い動機的な衝動を表す要素である。","section":"20. 愛の三角理論"},{"id":"soc-s-166","q":"パートナーとの関係を長期的に続けようとする判断を何というか。","answer":"コミットメント","aliases":[],"explanation":"関係への長期的関与を決める認知的な要素である。","section":"20. 愛の三角理論"},{"id":"soc-s-167","q":"愛の三大要素のうち、感情的成分に当たるものは何か。","answer":"親密性","aliases":[],"explanation":"資料では親密性が感情的成分とされる。","section":"20. 愛の三角理論"},{"id":"soc-s-168","q":"愛の三大要素のうち、動機的成分に当たるものは何か。","answer":"情熱","aliases":[],"explanation":"資料では情熱が動機的成分とされる。","section":"20. 愛の三角理論"},{"id":"soc-s-169","q":"愛の三大要素のうち、認知的成分に当たるものは何か。","answer":"コミットメント","aliases":[],"explanation":"資料ではコミットメントが認知的成分とされる。","section":"20. 愛の三角理論"},{"id":"soc-s-170","q":"三つの要素の組合せによって説明される愛のタイプはいくつか。","answer":"8種類","aliases":[],"explanation":"資料では三要素の組合せにより八種類を説明できるとしている。","section":"20. 愛の三角理論"},{"id":"soc-s-171","q":"資料では、愛の三角理論のタイプとして最初にどの三つが列挙されているか。","answer":"好意・形だけの愛・夢中になる愛","aliases":[],"explanation":"資料の列挙は、好意、形だけの愛、夢中になる愛から始まる。","section":"20. 愛の三角理論"},{"id":"soc-s-172","q":"資料では「夢中になる愛」に続いて、どの四つのタイプが列挙されているか。","answer":"ロマンティックな愛・友愛・愚かな愛・完全な愛","aliases":[],"explanation":"続けてロマンティックな愛、友愛、愚かな愛、完全な愛が挙げられている。","section":"20. 愛の三角理論"},{"id":"soc-s-173","q":"対人関係の維持・崩壊に関する諸理論の根底にある共通理論を何というか。","answer":"社会的交換理論","aliases":[],"explanation":"対人相互作用をコストと報酬の交換として捉える。","section":"21. 社会的交換理論"},{"id":"soc-s-174","q":"この理論は、対人相互作用を何と何の交換として捉えるか。","answer":"コストと報酬","aliases":[],"explanation":"関係から得る報酬と支払うコストを中心に考える。","section":"21. 社会的交換理論"},{"id":"soc-s-175","q":"個人は他者との相互作用から生じる何を最大化するように行動すると考えるか。","answer":"利益","aliases":[],"explanation":"報酬からコストを考慮した利益を最大化しようとすると考える。","section":"21. 社会的交換理論"},{"id":"soc-s-176","q":"他者との相互作用に費やす時間・労力・資源を何というか。","answer":"コスト","aliases":[],"explanation":"関係のために費やされるものがコストである。","section":"21. 社会的交換理論"},{"id":"soc-s-177","q":"他者との相互作用の結果として得られる有形・無形のものを何というか。","answer":"報酬","aliases":[],"explanation":"相互作用からもたらされる有形・無形の便益を報酬という。","section":"21. 社会的交換理論"},{"id":"soc-s-178","q":"コストと報酬をまとめて何というか。","answer":"社会的資源","aliases":[],"explanation":"コストと報酬の双方を社会的資源と呼ぶ。","section":"21. 社会的交換理論"},{"id":"soc-s-179","q":"資料で社会的資源の例として挙げられている組合せはどれか。","answer":"金銭・物品・情報・地位・援助・愛","aliases":[],"explanation":"金銭、物品、情報、地位、援助、愛が例示されている。","section":"21. 社会的交換理論"},{"id":"soc-s-180","q":"関係満足・投資・代替対象から、恋愛関係の持続可能性を説明する理論を何というか。","answer":"投資モデル","aliases":[],"explanation":"三要因を基に関係へのコミットメントと持続を説明する。","section":"22. 投資モデル"},{"id":"soc-s-181","q":"現在、パートナーとの関係にどの程度満足しているかを表す要因は何か。","answer":"関係満足","aliases":[],"explanation":"現在の関係から得る満足の程度である。","section":"22. 投資モデル"},{"id":"soc-s-182","q":"現在の関係にどの程度の時間や労力を費やしてきたかを表す要因は何か。","answer":"投資","aliases":[],"explanation":"これまで関係に投入した資源の大きさである。","section":"22. 投資モデル"},{"id":"soc-s-183","q":"ほかに魅力的な異性が存在するかを表す要因は何か。","answer":"代替対象の可能性","aliases":[],"explanation":"現在の関係以外に選べる魅力的な相手がいる可能性である。","section":"22. 投資モデル"},{"id":"soc-s-184","q":"関係を維持するかの判断に先立って考慮される主要な要因はいくつか。","answer":"3つ","aliases":[],"explanation":"関係満足、投資、代替対象の可能性の三つを考慮する。","section":"22. 投資モデル"},{"id":"soc-s-185","q":"三つの要因を考慮してなされる、関係を維持するかどうかの判断を何というか。","answer":"コミットメント","aliases":[],"explanation":"関係を続けようとする判断がコミットメントである。","section":"22. 投資モデル"},{"id":"soc-s-186","q":"現在の関係に不満があっても、関係を続けやすくなるのはどのような場合か。","answer":"これまでの投資量が多い場合","aliases":[],"explanation":"費やした時間や労力が多いと、不満足でも関係を維持しやすい。","section":"22. 投資モデル"},{"id":"soc-s-187","q":"このモデルでは、関係が長く続くかを何によって予測できるとされるか。","answer":"コミットメントの程度","aliases":[],"explanation":"コミットメントの高さが関係持続を予測する点が特色である。","section":"22. 投資モデル"},{"id":"soc-s-188","q":"資料で最もよいとされる関係性はどれか。","answer":"双方のコミットメントが高く、そのことを互いに理解している関係","aliases":[],"explanation":"互いの高いコミットメントを双方が認識している関係が最良とされる。","section":"22. 投資モデル"},{"id":"soc-s-189","q":"共通目標を持ち、一定期間関係を維持し、成員同士が影響し合う個人の集まりを何というか。","answer":"集団","aliases":[],"explanation":"共通目標、関係の持続、相互影響が集団の特徴として示されている。","section":"23. 集団凝集性"},{"id":"soc-s-190","q":"集団を一つにまとめ、メンバーを集団にとどめるよう作用する集団の魅力を何というか。","answer":"集団凝集性","aliases":[],"explanation":"成員を集団に引きつけて結びつける力である。","section":"23. 集団凝集性"},{"id":"soc-s-191","q":"どのような集団ほど凝集性が高いとされるか。","answer":"多くのメンバーから魅力的だと思われる集団","aliases":[],"explanation":"集団そのものを魅力的に感じる成員が多いほど凝集性は高い。","section":"23. 集団凝集性"},{"id":"soc-s-192","q":"凝集性を高める成員間の要因は何か。","answer":"ほかのメンバーが魅力的で友好的であること","aliases":[],"explanation":"魅力的で友好的な他成員の存在が集団の魅力を高める。","section":"23. 集団凝集性"},{"id":"soc-s-193","q":"凝集性を高める、集団の目標・活動と個人との関係はどれか。","answer":"個人の興味や価値と合っていること","aliases":[],"explanation":"自分の興味や価値に合う目標・活動は集団を魅力的にする。","section":"23. 集団凝集性"},{"id":"soc-s-194","q":"集団への所属が個人の何を高めると、集団の魅力が増すか。","answer":"誇りや自尊心","aliases":[],"explanation":"所属が誇りや自尊心につながることも凝集性を高める。","section":"23. 集団凝集性"},{"id":"soc-s-195","q":"集団内でメンバーが守るべきルールや規範を何というか。","answer":"集団規範","aliases":[],"explanation":"集団成員に共有され、行動を方向づけるルールである。","section":"24. 集団規範"},{"id":"soc-s-196","q":"集団成員の多くが共通して保持するものとして含まれるのは何か。","answer":"考え方・価値観・社会的態度","aliases":[],"explanation":"共有された考え方、価値観、社会的態度が集団規範に含まれる。","section":"24. 集団規範"},{"id":"soc-s-197","q":"集団内のルールは、必ず文章にして成員へ示される必要があるか。","answer":"必ずしも明文化される必要はない","aliases":[],"explanation":"明文化されなくても、暗黙に従うべきものとして機能する。","section":"24. 集団規範"},{"id":"soc-s-198","q":"明文化されていない場合、集団内のルールはどのように機能するか。","answer":"暗黙のうちに従うべきルールとして機能する","aliases":[],"explanation":"共有された期待として暗黙に成員の行動を方向づける。","section":"24. 集団規範"},{"id":"soc-s-199","q":"集団内のルールはメンバーの行動にどのような力を持つか。","answer":"拘束する力","aliases":[],"explanation":"メンバーには規範に沿った行動が求められる。","section":"24. 集団規範"},{"id":"soc-s-200","q":"自分の意見や行動を、他者または集団の意見や行動に合わせることを何というか。","answer":"同調","aliases":[],"explanation":"他者や集団に合わせて自分の意見・行動を変えることを指す。","section":"25. 同調"},{"id":"soc-s-201","q":"他者や集団に合わせる反応は、資料ではどの二種類に分けられるか。","answer":"追従と私的受容","aliases":[],"explanation":"表面的に合わせる追従と、正しいと認めて受け入れる私的受容がある。","section":"25. 同調"},{"id":"soc-s-202","q":"自分の意見は正しいと思ったまま、表面上だけ集団に合わせることを何というか。","answer":"追従","aliases":[],"explanation":"内面の判断は変えず、表面上のみ合わせる反応である。","section":"25. 同調"},{"id":"soc-s-203","q":"他者や集団の意見を正しいと認め、内面的にも受け入れることを何というか。","answer":"私的受容","aliases":[],"explanation":"表面的な一致だけでなく、判断そのものを受け入れる反応である。","section":"25. 同調"},{"id":"soc-s-204","q":"他者や集団に合わせるまでの二つのプロセスは何か。","answer":"規範的影響と情報的影響","aliases":[],"explanation":"賞賛・罰に関する規範的影響と、判断の正しさに関する情報的影響がある。","section":"25. 同調"},{"id":"soc-s-205","q":"他者から賞賛されたい、罰を避けたいという動機に基づいて集団規範に沿うことを何というか。","answer":"規範的影響","aliases":[],"explanation":"受容されたい、拒否されたくないという社会的な動機による。","section":"25. 同調"},{"id":"soc-s-206","q":"他者の意見や判断を参考にし、より適切に判断・行動しようとすることを何というか。","answer":"情報的影響","aliases":[],"explanation":"他者を正しい情報源として利用するプロセスである。","section":"25. 同調"},{"id":"soc-s-207","q":"集団成員に対して、その集団の規範へ合わせるよう働く強制的な影響力を何というか。","answer":"集団圧力","aliases":[],"explanation":"集団規範に沿わせる方向に成員へ働く力である。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-208","q":"線分判断課題を用いて集団圧力を調べた研究者は誰か。","answer":"アッシュ","aliases":[],"explanation":"アッシュはサクラを含む線分判断実験を行った。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-209","q":"アッシュの実験で、参加者が見本と同じ長さのものを選んだ選択肢は何本か。","answer":"3本","aliases":[],"explanation":"一本の見本線分と同じ長さの線分を、三本から選ばせた。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-210","q":"線分判断実験の集団内に配置されていた、研究者側の協力者を何というか。","answer":"サクラ","aliases":[],"explanation":"ほかの参加者を装い、あらかじめ決められた誤答をする協力者である。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-211","q":"他者の答えが明らかに誤りで、自分の判断が正しいと分かっていても同調しやすかったのはどのような状況か。","answer":"自分以外の全員の意見が一致していた状況","aliases":[],"explanation":"誤答であっても集団が全員一致すると、強い圧力が生じた。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-212","q":"誤った多数派の中に正しい判断をするサクラが一人いると、誤答率はどうなったか。","answer":"低下した","aliases":[],"explanation":"一人でも味方がいると全員一致が崩れ、同調が減った。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-213","q":"線分判断実験から、集団圧力を規定すると考えられた集団成員の反応の特徴は何か。","answer":"斉一性","aliases":[],"explanation":"集団成員の反応がそろっていること、つまり斉一性が重要だった。","section":"26. 集団圧力・同調実験"},{"id":"soc-s-214","q":"権威者の命令に従い、自分の意見に反する行動をとることを何というか。","answer":"服従","aliases":[],"explanation":"権威からの命令によって、自分の意思に反する行動を行うことを指す。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-215","q":"権威への命令に従う行動を実験的に研究した人物は誰か。","answer":"ミルグラム","aliases":[],"explanation":"ミルグラムは電気ショックを用いたと説明される服従実験を行った。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-216","q":"ミルグラムは、何の効果を調べる実験だと参加者に説明したか。","answer":"学習における罰の効果","aliases":[],"explanation":"表向きは学習に対する罰の効果を検討する実験とされた。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-217","q":"実験者の指示に従い続けた参加者の割合は何％か。","answer":"65％","aliases":[],"explanation":"資料では被験者の65％が実験者の指示に服従したとされる。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-218","q":"参加者は、生徒役が何をしても電気ショックを与え続けたか。","answer":"苦痛を訴えても","aliases":[],"explanation":"生徒役の苦痛の訴えがあっても、権威者の指示に従った。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-219","q":"この実験は、権威者から命令されると、どのような命令にも従い得ることを示したか。","answer":"残酷で非人間的な命令","aliases":[],"explanation":"権威の下では、倫理的に問題のある命令にも従い得ることが示された。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-220","q":"追加実験で、服従に影響する人物側の要因として挙げられたものは何か。","answer":"権威者の特徴","aliases":[],"explanation":"権威者がどのような人物・立場かが服従に影響する。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-221","q":"追加実験で、服従に影響する被害者との距離に関する要因は何か。","answer":"被害者に対する近接性","aliases":[],"explanation":"被害者との近さも命令に従う程度を左右する。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-222","q":"追加実験で、服従を弱める仲間に関する要因は何か。","answer":"仲間となる不服従者の存在","aliases":[],"explanation":"命令に従わない仲間がいることが不服従を支える。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-223","q":"問題のある命令に従わず、自由を表明する勇気を与えるものは何か。","answer":"サポートしてくれる仲間","aliases":[],"explanation":"支えてくれる仲間の存在が不服従を可能にする。","section":"27. 服従・権威への服従実験"},{"id":"soc-s-224","q":"集団規範がどれほど強い拘束力を持つかを測る方法を何というか。","answer":"リターン・ポテンシャル・モデル","aliases":[],"explanation":"行動の程度に対する集団の評価を曲線で表す。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-225","q":"このモデルの横軸には何をとるか。","answer":"ある行動の程度","aliases":[],"explanation":"横軸は対象となる行動の程度を示す。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-226","q":"このモデルの縦軸には何をとるか。","answer":"横軸の行動に対する評価の度合い","aliases":[],"explanation":"縦軸は各行動水準に対する是認・否認などの評価を表す。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-227","q":"行動の程度と、それに対する評価を結んだ曲線を何というか。","answer":"リターン・ポテンシャル曲線","aliases":[],"explanation":"横軸と縦軸の対応を結んだ曲線である。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-228","q":"曲線の最大値に対応する横軸上の点を何というか。","answer":"最大リターン点","aliases":[],"explanation":"集団から最も高く評価される行動水準を示す。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-229","q":"最大リターン点は、集団がどのようにみなす行動を示すか。","answer":"理想とみなしている行動","aliases":[],"explanation":"集団にとって最も望ましい行動の程度である。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-230","q":"曲線が是認の領域にあり、他のメンバーから否認されない行動の範囲を何というか。","answer":"許容範囲","aliases":[],"explanation":"是認される側に位置する行動の幅が許容範囲である。","section":"28. リターン・ポテンシャル・モデル"},{"id":"soc-s-231","q":"目標達成機能と集団維持機能からリーダーシップを捉える理論を提唱した研究者は誰か。","answer":"三隅二不二","aliases":[],"explanation":"三隅二不二がPM理論を提唱した。","section":"29. PM理論"},{"id":"soc-s-232","q":"集団目標を達成するために計画を立て、成員へ積極的に指示・命令する働きを何というか。","answer":"P機能（目標達成機能）","aliases":[],"explanation":"PはPerformanceにかかわる目標達成の機能である。","section":"29. PM理論"},{"id":"soc-s-233","q":"集団のまとまりを保つため、友好的な雰囲気をつくる働きを何というか。","answer":"M機能（集団維持機能）","aliases":[],"explanation":"Mは集団の維持や人間関係にかかわる機能である。","section":"29. PM理論"},{"id":"soc-s-234","q":"P機能とM機能の強弱によって、リーダーシップはいくつの型に分類されるか。","answer":"4つ","aliases":[],"explanation":"PM、Pm、pM、pmの四型に分けられる。","section":"29. PM理論"},{"id":"soc-s-235","q":"二つの機能がともに強い型はどれか。","answer":"PM型","aliases":[],"explanation":"PMは、目標達成機能と集団維持機能の双方が強い型である。","section":"29. PM理論"},{"id":"soc-s-236","q":"目標達成機能が強く、集団維持機能が弱い型はどれか。","answer":"Pm型","aliases":[],"explanation":"Pが大文字、mが小文字なので、Pのみが強い型である。","section":"29. PM理論"},{"id":"soc-s-237","q":"目標達成機能が弱く、集団維持機能が強い型はどれか。","answer":"pM型","aliases":[],"explanation":"pが小文字、Mが大文字なので、Mのみが強い型である。","section":"29. PM理論"},{"id":"soc-s-238","q":"二つの機能がともに弱い型はどれか。","answer":"pm型","aliases":[],"explanation":"pとmがともに小文字の型である。","section":"29. PM理論"},{"id":"soc-s-239","q":"生産性やメンバーの意欲を促進する効果が最も示されている型はどれか。","answer":"PM型","aliases":[],"explanation":"目標達成と集団維持の双方が強いPM型が有効とされる。","section":"29. PM理論"},{"id":"soc-s-240","q":"リーダーの特徴と集団状況の組合せから効果性を説明するモデルを提唱した研究者は誰か。","answer":"フィードラー","aliases":[],"explanation":"フィードラーが条件即応モデルを提唱した。","section":"30. 条件即応モデル"},{"id":"soc-s-241","q":"条件即応モデルでは、何と何が集団の課題達成に影響すると考えるか。","answer":"リーダーの性格特徴と集団の状況","aliases":[],"explanation":"リーダーの型と状況との適合が効果性を左右する。","section":"30. 条件即応モデル"},{"id":"soc-s-242","q":"リーダーの性格特徴を分類する基礎となる評定を何というか。","answer":"LPC評定","aliases":[],"explanation":"最も苦手な仕事仲間をどう評価するかに基づく。","section":"30. 条件即応モデル"},{"id":"soc-s-243","q":"LPC評定では、誰に対する評価を行うか。","answer":"最も苦手な仕事仲間","aliases":[],"explanation":"資料では、最も苦手な仕事仲間に対する評定と説明されている。","section":"30. 条件即応モデル"},{"id":"soc-s-244","q":"良好な対人関係を築こうとするリーダーの型を何というか。","answer":"人間関係志向型","aliases":[],"explanation":"人間関係の維持を重視する型である。","section":"30. 条件即応モデル"},{"id":"soc-s-245","q":"課題を達成することを追求するリーダーの型を何というか。","answer":"課題志向型","aliases":[],"explanation":"課題の遂行や成果を重視する型である。","section":"30. 条件即応モデル"},{"id":"soc-s-246","q":"集団の状況統制力を決める、対人的な次元は何か。","answer":"リーダーとメンバーの関係の良否","aliases":[],"explanation":"リーダーと成員の関係が良いか悪いかが状況統制に含まれる。","section":"30. 条件即応モデル"},{"id":"soc-s-247","q":"集団の状況統制力を決める、課題構造に関する次元は何か。","answer":"課題の遂行手順が明確かどうか","aliases":[],"explanation":"課題が構造化され、手順が明確かが影響する。","section":"30. 条件即応モデル"},{"id":"soc-s-248","q":"集団の状況統制力を決める、地位に関する次元は何か。","answer":"リーダーの権限の強さ","aliases":[],"explanation":"リーダーがどの程度強い権限を持つかが三次元の一つである。","section":"30. 条件即応モデル"},{"id":"soc-s-249","q":"集団の状況統制力は、いくつの次元の組合せで決まるか。","answer":"3次元","aliases":[],"explanation":"リーダー・メンバー関係、課題構造、リーダーの権限の三次元で決まる。","section":"30. 条件即応モデル"},{"id":"soc-s-250","q":"状況統制力が高い場合または低い場合に有効とされるリーダーはどの型か。","answer":"課題志向型","aliases":[],"explanation":"統制力が両極端の状況では課題志向型が有効とされる。","section":"30. 条件即応モデル"},{"id":"soc-s-251","q":"状況統制力が中程度の場合に有効とされるリーダーはどの型か。","answer":"人間関係志向型","aliases":[],"explanation":"中程度の状況では人間関係志向型が有効とされる。","section":"30. 条件即応モデル"},{"id":"soc-s-252","q":"サマーキャンプ実験を行い、目標葛藤が集団間対立を生むことを示した研究者は誰か。","answer":"シェリフ夫妻","aliases":[],"explanation":"シェリフ夫妻による泥棒洞窟実験として知られる。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-253","q":"集団間の利害対立を扱ったサマーキャンプ実験の別名は何か。","answer":"泥棒洞窟実験","aliases":[],"explanation":"サマーキャンプ実験は泥棒洞窟実験とも呼ばれる。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-254","q":"サマーキャンプ実験から、何が集団間の対立を生み出すと示されたか。","answer":"目標葛藤","aliases":[],"explanation":"希少資源をめぐる両立しない目標が対立を生じさせた。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-255","q":"実験の最初に、集団内の仲間意識を育てた段階を何というか。","answer":"集団形成期","aliases":[],"explanation":"まず別々の集団の内部でまとまりを形成した。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-256","q":"少年たちに外集団の存在を知らせ、集団間競争を行わせた段階を何というか。","answer":"集団対立期","aliases":[],"explanation":"希少資源をめぐる競争により対立を生じさせた段階である。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-257","q":"集団対立期に、二集団が競争した対象は何か。","answer":"価値ある希少資源","aliases":[],"explanation":"限られた価値ある資源をめぐる競争が設定された。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-258","q":"二集団が協力しなければ達成できない目標を導入した段階を何というか。","answer":"葛藤解消期","aliases":[],"explanation":"上位目標を導入して対立の低減を試みた段階である。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-259","q":"対立していた二集団を協力的にした、双方が力を合わせる必要のある目標を何というか。","answer":"上位目標","aliases":[],"explanation":"二集団に共通し、協力しなければ達成できない目標である。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-260","q":"集団間に利害の対立があると、両集団の関係はどうなると示されたか。","answer":"対立関係になる","aliases":[],"explanation":"競合する利害は集団葛藤を生み出す。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-261","q":"二集団が協力しなければならない共通課題を設定すると、関係はどうなったか。","answer":"集団同士が協力的になった","aliases":[],"explanation":"上位目標の導入が集団間協力を促した。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-262","q":"サマーキャンプ実験が支持する理論は何か。","answer":"現実的葛藤理論","aliases":[],"explanation":"希少資源をめぐる競争と上位目標の効果が現実的葛藤理論を支持する。","section":"31. 現実的葛藤理論・サマーキャンプ実験"},{"id":"soc-s-263","q":"自分の性格特徴・能力・属性に由来する自己の捉え方を何というか。","answer":"個人的アイデンティティ","aliases":[],"explanation":"個人固有の特徴に基づくアイデンティティである。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-264","q":"自分が所属する内集団に由来する自己の捉え方を何というか。","answer":"社会的アイデンティティ","aliases":[],"explanation":"所属集団の一員としての自己に基づくアイデンティティである。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-265","q":"社会的アイデンティティ理論を提唱した研究者の組合せはどれか。","answer":"タジフェルとターナー","aliases":[],"explanation":"タジフェルとターナーが内集団びいきや集団葛藤を説明した。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-266","q":"社会的アイデンティティ理論が主に説明する現象の組合せはどれか。","answer":"内集団びいきと集団葛藤","aliases":[],"explanation":"所属集団を肯定的に評価する過程から内集団びいきや葛藤を説明する。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-267","q":"人は一般に、どのような自己評価を得ようと動機づけられるか。","answer":"より望ましい自己評価","aliases":[],"explanation":"肯定的な自己評価を得ようとする動機が前提にある。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-268","q":"望ましい自己評価を求める動機は、所属集団に関して何を獲得しようとさせるか。","answer":"肯定的な社会的アイデンティティ","aliases":[],"explanation":"自分の集団を肯定的に位置づけることで自己評価も高めようとする。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-269","q":"肯定的な所属集団像を求めることで、人は二つの集団の何を明確にするか。","answer":"内集団と外集団の境界","aliases":[],"explanation":"自分たちと彼らを区別する境界が明確になる。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-270","q":"内集団と外集団を比較する過程は、何を引き起こし得るか。","answer":"内集団びいき・偏見・差別・集団葛藤","aliases":[],"explanation":"内集団をより高く評価する比較が偏見や葛藤につながる。","section":"32. 個人的・社会的アイデンティティ"},{"id":"soc-s-271","q":"異なる集団の人々が接触すると偏見が低減するとした研究者の組合せはどれか。","answer":"ペティグルーとトロップ","aliases":[],"explanation":"ペティグルーとトロップが集団間接触の効果を示した。","section":"33. 接触仮説"},{"id":"soc-s-272","q":"集団間の交流によって偏見が低減するとする考え方を何というか。","answer":"接触仮説","aliases":[],"explanation":"外集団との接触が偏見を弱めるとする仮説である。","section":"33. 接触仮説"},{"id":"soc-s-273","q":"異なる集団の人と関わることを表す英語と日本語の組合せはどれか。","answer":"Intergroup Contact（集団間接触）","aliases":[],"explanation":"Intergroup Contactは異集団間の接触を意味する。","section":"33. 接触仮説"},{"id":"soc-s-274","q":"外集団の人と接触するときに感じる恐怖や不安を表す変数は何か。","answer":"Anxiety（不安）","aliases":[],"explanation":"外集団接触に伴う不安を表す変数である。","section":"33. 接触仮説"},{"id":"soc-s-275","q":"外集団への興味や関心を表す変数は何か。","answer":"Empathy（共感）","aliases":[],"explanation":"資料ではEmpathyを外集団への興味・関心、共感としている。","section":"33. 接触仮説"},{"id":"soc-s-276","q":"外集団に対する否定的な先入観や態度を表す変数は何か。","answer":"Prejudice（偏見）","aliases":[],"explanation":"外集団への否定的な態度がPrejudiceである。","section":"33. 接触仮説"},{"id":"soc-s-277","q":"接触仮説の説明で用いられた変数はいくつか。","answer":"4つ","aliases":[],"explanation":"集団間接触、不安、共感、偏見の四変数で構成される。","section":"33. 接触仮説"},{"id":"soc-s-278","q":"集団間接触・不安・共感・偏見の関連を検討するために用いられた分析は何か。","answer":"パス解析","aliases":[],"explanation":"四変数の直接・間接的な関連をパス解析で検討した。","section":"33. 接触仮説"},{"id":"soc-s-279","q":"パス解析では、外集団への不安が高いほど偏見はどうなると示されたか。","answer":"強まる","aliases":[],"explanation":"外集団不安の高さは偏見の強さにつながる。","section":"33. 接触仮説"},{"id":"soc-s-280","q":"集団間接触が増えると、外集団への不安はどうなると示されたか。","answer":"低減する","aliases":[],"explanation":"交流によって不安が減り、それを通じて偏見も下がる。","section":"33. 接触仮説"},{"id":"soc-s-281","q":"集団間接触が増えると、相手への共感や親近感はどうなるか。","answer":"高まる","aliases":[],"explanation":"交流は外集団成員への共感と親近感を高める。","section":"33. 接触仮説"},{"id":"soc-s-282","q":"外集団への共感が高まると、偏見はどうなるか。","answer":"減少する","aliases":[],"explanation":"接触による共感の増加が偏見低減につながる。","section":"33. 接触仮説"},{"id":"soc-s-283","q":"偏見の低減には、相手についての知識よりも何が効果的だと示唆されたか。","answer":"交流によって生じる感情","aliases":[],"explanation":"接触に伴う不安低減や共感増加という感情過程が重要とされた。","section":"33. 接触仮説"},{"id":"soc-s-284","q":"他者からの学習を通して獲得された信念・価値観・習慣などの情報体系を何というか。","answer":"文化","aliases":[],"explanation":"資料では文化を、社会的学習で獲得される情報体系と定義している。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-285","q":"信念や価値観などが文化となるためには、誰によって共有される必要があるか。","answer":"多くの人々から構成される集団","aliases":[],"explanation":"文化は個人だけでなく、集団で共有される必要がある。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-286","q":"共有された情報体系が文化となるために必要な、時間的な条件は何か。","answer":"世代間で受け継がれること","aliases":[],"explanation":"集団内で共有され、世代を越えて継承されることが必要とされる。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-287","q":"西洋を中心とする国々で優勢とされる、個人的目標を優先する立場を何というか。","answer":"個人主義","aliases":[],"explanation":"西洋では個人の目標や独立を重視する傾向がある。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-288","q":"個人的目標を優先する文化で、より重視されるものの組合せはどれか。","answer":"独立・自立・自律","aliases":[],"explanation":"個人主義では、独立、自立、自律が重視される。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-289","q":"東洋を中心とする国々で優勢とされる、内集団の目標を優先する立場を何というか。","answer":"集団主義","aliases":[],"explanation":"東洋では内集団の目標を優先する傾向がある。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-290","q":"内集団の目標を優先する文化で重視されるものの組合せはどれか。","answer":"相互協調・協力・調和","aliases":[],"explanation":"集団主義では他者との協調や調和が重視される。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-291","q":"内集団の目標を優先する文化では、自分をどのような立場として捉えやすいか。","answer":"家族やチームの一員","aliases":[],"explanation":"家族やチームの一員としての立場が重視される。","section":"34. 文化・個人主義・集団主義"},{"id":"soc-s-292","q":"文化によって自己の理解・解釈の仕方が異なるという概念を提唱した研究者は誰か。","answer":"マーカスと北山","aliases":[],"explanation":"マーカスと北山が文化的自己観を提唱した。","section":"35. 文化的自己観"},{"id":"soc-s-293","q":"文化的自己観の概念が提唱された論文の発表年はいつか。","answer":"1991年","aliases":[],"explanation":"資料では1991年の論文で提唱されたとされる。","section":"35. 文化的自己観"},{"id":"soc-s-294","q":"文化ごとに形成されると主張されたものは何か。","answer":"自己についての理解・解釈の仕方","aliases":[],"explanation":"文化は、自己をどう理解するかという枠組みに影響するとされた。","section":"35. 文化的自己観"},{"id":"soc-s-295","q":"自己を他者から切り離された独立・自立・自律的な存在と捉える自己観を何というか。","answer":"相互独立的自己観","aliases":[],"explanation":"他者とは独立した個として自己を捉える。","section":"35. 文化的自己観"},{"id":"soc-s-296","q":"相互独立的な自己の捉え方が優勢とされる地域はどこか。","answer":"西洋","aliases":[],"explanation":"資料では西洋で相互独立的自己観が優勢とされる。","section":"35. 文化的自己観"},{"id":"soc-s-297","q":"自己を社会的ネットワークの中で他者を包含した存在と捉える自己観を何というか。","answer":"相互協調的自己観","aliases":[],"explanation":"他者との関係の中に自己を位置づける自己観である。","section":"35. 文化的自己観"},{"id":"soc-s-298","q":"相互協調的な自己の捉え方が優勢とされる地域の組合せはどれか。","answer":"東洋・アフリカ・南米諸国","aliases":[],"explanation":"資料では東洋、アフリカ、南米諸国が挙げられている。","section":"35. 文化的自己観"},{"id":"soc-s-299","q":"文化による自己観の違いは、何に影響すると示唆されているか。","answer":"認知的プロセス","aliases":[],"explanation":"自己観は、情報の見方や考え方にも関係する。","section":"35. 文化的自己観"},{"id":"soc-s-300","q":"物事の部分部分に注目する思考を何というか。","answer":"分析的思考","aliases":[],"explanation":"相互独立的自己観のもとで優勢になりやすい思考である。","section":"35. 文化的自己観"},{"id":"soc-s-301","q":"物事の全体像に注目する思考を何というか。","answer":"包括的思考","aliases":[],"explanation":"相互協調的自己観のもとで優勢になりやすい思考である。","section":"35. 文化的自己観"},{"id":"soc-s-302","q":"相互独立的自己観と結びつきやすい認知傾向はどれか。","answer":"分析的思考","aliases":[],"explanation":"独立した対象の部分に注意を向ける分析的思考と関連する。","section":"35. 文化的自己観"},{"id":"soc-s-303","q":"相互協調的自己観と結びつきやすい認知傾向はどれか。","answer":"包括的思考","aliases":[],"explanation":"対象と周囲の関係を含めて全体を見る包括的思考と関連する。","section":"35. 文化的自己観"},{"id":"soc-s-304","q":"行動の動因となり、その行動を方向づけたり持続させたりする過程を何というか。","answer":"動機づけ","aliases":[],"explanation":"行動を始め、方向づけ、続けさせるプロセスである。","section":"36. 動機づけ"},{"id":"soc-s-305","q":"報酬や賞賛を得るための手段として行動することを何というか。","answer":"外発的動機づけ","aliases":[],"explanation":"行動の外にある報酬を目的とする動機づけである。","section":"36. 動機づけ"},{"id":"soc-s-306","q":"報酬の獲得ではなく、活動そのものに満足や喜びを見いだして行動することを何というか。","answer":"内発的動機づけ","aliases":[],"explanation":"行動それ自体が目的・報酬となっている。","section":"36. 動機づけ"},{"id":"soc-s-307","q":"大学生を対象に、パズルへの報酬の効果を調べた研究者は誰か。","answer":"デシ","aliases":[],"explanation":"デシは報酬が活動への従事に及ぼす影響を調べた。","section":"36. 動機づけ"},{"id":"soc-s-308","q":"デシの研究で参加者が取り組んだ課題は何か。","answer":"パズル","aliases":[],"explanation":"資料では大学生がパズルに取り組んだ。","section":"36. 動機づけ"},{"id":"soc-s-309","q":"デシの研究で外発的に動機づけられた群では、何によってパズルへの従事時間が変化したか。","answer":"報酬の有無","aliases":[],"explanation":"報酬があるかないかで活動を続ける時間が変わった。","section":"36. 動機づけ"},{"id":"soc-s-310","q":"もともと内発的に動機づけられた行動に外的報酬を与えると、動機づけが低下する現象を何というか。","answer":"アンダーマイニング効果","aliases":[],"explanation":"外的報酬が内発的動機づけを損なう現象である。","section":"37. アンダーマイニング効果"},{"id":"soc-s-311","q":"この効果が生じる前は、何が報酬の役割を果たしていたか。","answer":"行動すること自体","aliases":[],"explanation":"活動そのものの楽しさや満足が報酬だった。","section":"37. アンダーマイニング効果"},{"id":"soc-s-312","q":"外的報酬が加わると、本人はその行動を何のための手段とみなしやすくなるか。","answer":"外的報酬を得るため","aliases":[],"explanation":"行動の意味が、楽しむことから報酬獲得の手段へ変わる。","section":"37. アンダーマイニング効果"},{"id":"soc-s-313","q":"外的報酬によって活動が報酬獲得の手段とみなされると、何が低下するか。","answer":"内発的動機づけ","aliases":[],"explanation":"活動それ自体への興味や自発性が弱まる。","section":"37. アンダーマイニング効果"},{"id":"soc-s-314","q":"動機づけの文化差を実験した研究者の組合せはどれか。","answer":"IyengarとLepper","aliases":["イヤンガーとレッパー"],"explanation":"IyengarとLepperは、課題選択者の効果を文化間で比較した。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-315","q":"動機づけの文化差を調べた研究が発表された年はいつか。","answer":"1999年","aliases":[],"explanation":"資料の見出しでは1999年の研究とされている。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-316","q":"実験の対象となった子どもの二つの文化的背景は何か。","answer":"東アジア系アメリカ人とヨーロッパ系アメリカ人","aliases":[],"explanation":"米国内に住む二つの文化背景の子どもを比較した。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-317","q":"子どもたちが取り組んだ課題は何か。","answer":"アナグラム課題","aliases":[],"explanation":"文字を並べ替えるアナグラム課題が用いられた。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-318","q":"実験で操作されたのは、課題の何に関する条件か。","answer":"誰が問題を選択したか","aliases":[],"explanation":"本人や母親など、問題を選ぶ人が異なる条件を比較した。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-319","q":"ヨーロッパ系アメリカ人の子どもで、取り組み時間と正答率が最も高かった条件はどれか。","answer":"自分で問題を選んだ条件","aliases":[],"explanation":"個人の選択が動機づけを最も高めた。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-320","q":"東アジア系アメリカ人の子どもで、取り組み時間と正答率が最も高かった条件はどれか。","answer":"母親が問題を選んだ条件","aliases":[],"explanation":"内集団の一員である母親による選択が最も効果的だった。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-321","q":"課題を選ぶ人の効果が文化的背景によって異なったことから、何が示されたか。","answer":"文化によって動機づけのあり方が異なる","aliases":[],"explanation":"自己選択の価値は文化的自己観によって異なり得る。","section":"38. Iyengar & Lepper（1999）"},{"id":"soc-s-322","q":"幸福で良い人生を送っていることを表す概念を何というか。","answer":"Well-being","aliases":["ウェルビーイング"],"explanation":"資料では幸福で良い人生を送っていることと定義される。","section":"39. Well-being"},{"id":"soc-s-323","q":"この概念の中核にある状態はどれか。","answer":"人生が良い状態で、理想的な人生を送っていること","aliases":[],"explanation":"単なる一時的感情ではなく、人生全体が良い状態だという捉え方が中核にある。","section":"39. Well-being"},{"id":"soc-s-324","q":"個人の価値観に基づいて人生を総合評価する立場を何というか。","answer":"主観的アプローチ（主観的Well-being）","aliases":[],"explanation":"本人自身の価値観や評価を重視する。","section":"39. Well-being"},{"id":"soc-s-325","q":"研究者が設定した客観的指標に基づいて定義・測定する立場を何というか。","answer":"客観的アプローチ（心理的Well-being）","aliases":[],"explanation":"研究者側が定めた心理的機能の指標を重視する立場である。","section":"39. Well-being"},{"id":"soc-s-326","q":"心理的Well-beingの要素のうち、自分が発達・向上している感覚にかかわるものは何か。","answer":"自己成長","aliases":[],"explanation":"心理的Well-beingの六要素の一つである。","section":"39. Well-being"},{"id":"soc-s-327","q":"心理的Well-beingの要素のうち、自分自身を肯定的に受け入れることにかかわるものは何か。","answer":"自己受容","aliases":[],"explanation":"自己を受け入れることが心理的Well-beingの要素に含まれる。","section":"39. Well-being"},{"id":"soc-s-328","q":"心理的Well-beingの要素のうち、自分の基準で判断し行動することにかかわるものは何か。","answer":"自律性","aliases":[],"explanation":"自律性は心理的Well-beingを構成する六要素の一つである。","section":"39. Well-being"},{"id":"soc-s-329","q":"心理的Well-beingの要素のうち、周囲の環境をうまく扱うことにかかわるものは何か。","answer":"環境の克服","aliases":[],"explanation":"環境を管理し適応する感覚が要素として挙げられている。","section":"39. Well-being"},{"id":"soc-s-330","q":"心理的Well-beingの要素のうち、他者との質の高い関係にかかわるものは何か。","answer":"良好な人間関係","aliases":[],"explanation":"他者との良い関係が心理的Well-beingの一要素である。","section":"39. Well-being"},{"id":"soc-s-331","q":"心理的Well-beingの要素のうち、生きる方向や意味にかかわるものは何か。","answer":"人生の目的","aliases":[],"explanation":"人生の目的を持つことが六要素の一つに含まれる。","section":"39. Well-being"},{"id":"soc-s-332","q":"心理的Well-beingの要素はいくつ挙げられているか。","answer":"6つ","aliases":[],"explanation":"自己成長、自己受容、自律性、環境の克服、良好な人間関係、人生の目的の六つである。","section":"39. Well-being"},{"id":"soc-s-333","q":"この概念の測定に主に用いられるとされる尺度は何か。","answer":"人生満足度尺度","aliases":[],"explanation":"資料では主に人生満足度尺度が用いられるとしている。","section":"39. Well-being"},{"id":"soc-s-334","q":"身近な環境の人間関係が、どの程度流動的または固定的かを表す指標を何というか。","answer":"関係流動性","aliases":[],"explanation":"新しい関係への参入や既存関係からの離脱のしやすさを表す。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-335","q":"人間関係が流動的な環境では、既存の関係や集団からどうしやすいか。","answer":"離脱しやすい","aliases":[],"explanation":"流動的な環境では現在の関係から離れやすい。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-336","q":"人間関係が流動的な環境では、別の人間関係へどうしやすいか。","answer":"参入しやすい","aliases":[],"explanation":"新たな関係を選び、参加しやすい環境である。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-337","q":"人間関係が固定的な環境で、既存の関係から離脱した後に生じやすいことは何か。","answer":"ほかの関係への参入が困難になる","aliases":[],"explanation":"代わりの関係を築きにくいため、現在の関係を失うコストが大きい。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-338","q":"関係が固定的で新しい関係へ入りにくいと、何を恐れる傾向が高まるか。","answer":"既存の関係からの排除","aliases":[],"explanation":"現在の関係を失うことへの恐れが強くなる。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-339","q":"日本の社会環境の人間関係について、資料ではどのような特徴があるとしているか。","answer":"比較的固定化されている","aliases":[],"explanation":"日本では関係流動性が比較的低いと説明されている。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-340","q":"日本で人間関係が比較的固定的であることは、新しい関係を築く機会にどう影響するか。","answer":"機会を少なくする","aliases":[],"explanation":"関係の固定性により、新しい関係に移る機会が少なくなる。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-341","q":"日本で新しい関係を築く機会が少ないことは、どの傾向の高さにつながると考えられるか。","answer":"排除回避傾向","aliases":[],"explanation":"既存関係から排除されることを避けようとする傾向が高まる。","section":"40. 関係流動性・排除回避傾向"},{"id":"soc-s-342","q":"他者から制限されず、望む生き方や行動を自分で選んでいると考える程度を何というか。","answer":"自由選択の感覚","aliases":[],"explanation":"自分で選べているという主観的な感覚を指す。","section":"41. 自由選択の感覚"},{"id":"soc-s-343","q":"自分で生き方や行動を選べるという感覚は、何の重要な規定因とされるか。","answer":"Well-being","aliases":["ウェルビーイング"],"explanation":"自由選択の感覚が高いほどWell-beingも高まりやすい。","section":"41. 自由選択の感覚"},{"id":"soc-s-344","q":"日本では、自分で選べているという感覚にどのような年代差があるとされるか。","answer":"年代を問わず低い","aliases":[],"explanation":"資料では日本人は年代を問わず低い傾向にあるとしている。","section":"41. 自由選択の感覚"},{"id":"soc-s-345","q":"日本におけるWell-beingの低さを説明する一因として挙げられているものは何か。","answer":"自由選択の感覚の低さ","aliases":[],"explanation":"自分で選択できている感覚の低さが幸福感を下げると考えられる。","section":"41. 自由選択の感覚"},{"id":"soc-s-346","q":"日本社会の人間関係と自由選択の感覚の連鎖を示した研究者と年はどれか。","answer":"中里（2017）","aliases":[],"explanation":"資料では中里（2017）の説明が紹介されている。","section":"41. 自由選択の感覚"},{"id":"soc-s-347","q":"中里（2017）の説明で、関係流動性が低いと最初に高まる傾向は何か。","answer":"排除回避傾向","aliases":[],"explanation":"既存関係を失うことへの恐れが高まる。","section":"41. 自由選択の感覚"},{"id":"soc-s-348","q":"排除を避けようとする傾向が高いと、どのような行動をとりやすくなるか。","answer":"周りの目を気にして行動する","aliases":[],"explanation":"周囲からどう見られるかを重視し、自分の希望だけで選びにくくなる。","section":"41. 自由選択の感覚"},{"id":"soc-s-349","q":"周りの目を気にして行動すると、自由選択の感覚とWell-beingはどうなると説明されるか。","answer":"自由選択の感覚が低下し、Well-beingも低下する","aliases":[],"explanation":"関係流動性の低さからWell-being低下へ至る連鎖の後半である。","section":"41. 自由選択の感覚"},{"id":"soc-s-350","q":"困難な状況にある人へ、周囲から有形・無形の資源が提供されることを何というか。","answer":"ソーシャル・サポート","aliases":["ソーシャルサポート"],"explanation":"周囲の人々から提供される支援資源を指す。","section":"42. ソーシャル・サポート"},{"id":"soc-s-351","q":"支援を二次元から四種類に分類した研究者は誰か。","answer":"ハウス","aliases":[],"explanation":"ハウスは二つの次元を組み合わせて四種類のサポートを示した。","section":"42. ソーシャル・サポート"},{"id":"soc-s-352","q":"ハウスが支援の分類に用いた二つの次元は何か。","answer":"直接的－間接的、道具的－情緒的","aliases":[],"explanation":"直接性と、道具的か情緒的かという二次元で分類する。","section":"42. ソーシャル・サポート"},{"id":"soc-s-353","q":"ハウスが示した支援の種類はいくつか。","answer":"4つ","aliases":[],"explanation":"手段的、情報的、情緒的、評価的の四種類である。","section":"42. ソーシャル・サポート"},{"id":"soc-s-354","q":"金銭や必要物資、家事や子どもの世話などの援助を何というか。","answer":"手段的サポート","aliases":[],"explanation":"具体的な物資や労力を直接提供する支援である。","section":"42. ソーシャル・サポート"},{"id":"soc-s-355","q":"問題解決に役立つ情報を提供する支援を何というか。","answer":"情報的サポート","aliases":[],"explanation":"助言や情報によって問題解決を助ける支援である。","section":"42. ソーシャル・サポート"},{"id":"soc-s-356","q":"同情や共感など、感情面で支える援助を何というか。","answer":"情緒的サポート","aliases":[],"explanation":"気持ちに寄り添う情緒面の支援である。","section":"42. ソーシャル・サポート"},{"id":"soc-s-357","q":"個人の行動に対して適切な評価を与える援助を何というか。","answer":"評価的サポート","aliases":[],"explanation":"自己評価や判断の手がかりとなるフィードバックを与える支援である。","section":"42. ソーシャル・サポート"},{"id":"soc-s-358","q":"家事や子どもの世話は、どの面での援助の例か。","answer":"労力面","aliases":[],"explanation":"手段的サポートには物質面だけでなく労力面の援助も含まれる。","section":"42. ソーシャル・サポート"},{"id":"soc-s-359","q":"ストレスを起こす出来事に直面したとき、支援が効力を発揮して悪影響を弱めることを何というか。","answer":"ソーシャル・サポートのストレス緩衝効果","aliases":["ストレス緩衝効果"],"explanation":"支援がストレスの影響を和らげる働きを指す。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-360","q":"支持的な夫の有無とうつ症状の関連を調べた研究者の組合せはどれか。","answer":"BrownとHarris","aliases":["ブラウンとハリス"],"explanation":"BrownとHarrisの調査が例として挙げられている。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-361","q":"BrownとHarrisの調査対象は、どのような経験をした人々か。","answer":"人生で苦悩的出来事を経験した女性","aliases":[],"explanation":"苦悩的なライフイベントを経験した女性を対象にした。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-362","q":"支持的な夫がいる女性のうち、うつ症状を発症した割合は何％か。","answer":"10％","aliases":[],"explanation":"支持的な夫がいる場合の発症割合は10％だった。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-363","q":"支持的な夫に恵まれなかった女性のうち、うつ症状を呈した割合は何％か。","answer":"41％","aliases":[],"explanation":"支持的な夫がいない場合は41％だった。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-364","q":"BrownとHarrisの結果から、困難に直面した場合でも何が精神的健康を保つと考えられるか。","answer":"サポートを受けられること","aliases":[],"explanation":"支援の存在がストレスの悪影響を弱めると解釈される。","section":"43. ソーシャル・サポートのストレス緩衝効果"},{"id":"soc-s-365","q":"ソーシャル・サポートとWell-beingの関連を、感情の変化によって説明する理論を何というか。","answer":"感情媒介説","aliases":[],"explanation":"支援が感情を改善し、その結果Well-beingが高まると考える。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-366","q":"感情を通じた説明では、支援によってネガティブ感情はどうなると考えるか。","answer":"低減する","aliases":[],"explanation":"サポートはネガティブ感情を和らげるとされる。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-367","q":"感情を通じた説明では、支援によってポジティブ感情はどうなると考えるか。","answer":"増大する","aliases":[],"explanation":"ポジティブ感情の増加を通じてWell-beingにつながる。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-368","q":"身近な人からの支援が安心感を生み、自由にふるまえることでWell-beingが高まるとする理論を何というか。","answer":"自由媒介説","aliases":[],"explanation":"支援が自由な行動を可能にするという経路を想定する。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-369","q":"自由を通じた説明で、身近な人の支援によってまず得られる状態は何か。","answer":"安心してふるまえる状態","aliases":[],"explanation":"支援があると安心し、周囲を過度に恐れず行動しやすくなる。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-370","q":"支援を受けて安心してふるまえると、何の感覚が上昇するとされるか。","answer":"自由選択の感覚","aliases":[],"explanation":"支援が自己決定できる感覚を高め、それがWell-beingにつながる。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-371","q":"ソーシャル・サポートとWell-beingの関連を説明する二つの理論は何か。","answer":"感情媒介説と自由媒介説","aliases":[],"explanation":"資料では感情を通じる経路と自由選択を通じる経路が示されている。","section":"44. 感情媒介説・自由媒介説"},{"id":"soc-s-372","q":"ある刺激対象に対する、ポジティブまたはネガティブな反応を何というか。","answer":"態度","aliases":[],"explanation":"対象に対する評価的な反応を指す。","section":"45. 態度"},{"id":"soc-s-373","q":"対象について何を考え信じるかにかかわる成分は何か。","answer":"認知的成分","aliases":[],"explanation":"態度を構成する三成分のうち、知識や信念に関する側面である。","section":"45. 態度"},{"id":"soc-s-374","q":"対象にどのような気持ちを抱くかにかかわる成分は何か。","answer":"感情的成分","aliases":[],"explanation":"好悪などの感情に関する側面である。","section":"45. 態度"},{"id":"soc-s-375","q":"対象に対してどのように行動するかにかかわる成分は何か。","answer":"行動的成分","aliases":[],"explanation":"接近・回避などの行動傾向に関する側面である。","section":"45. 態度"},{"id":"soc-s-376","q":"態度を構成する三つの成分は、互いにどのような関係を保つとされるか。","answer":"整合性を保つ","aliases":[],"explanation":"認知・感情・行動の三成分は整合する傾向がある。","section":"45. 態度"},{"id":"soc-s-377","q":"態度形成に関係する四つの要因は何か。","answer":"欲求満足の結果・情報・所属集団・パーソナリティ","aliases":[],"explanation":"資料では欲求満足の結果、情報、所属集団、パーソナリティを挙げている。","section":"45. 態度"},{"id":"soc-s-378","q":"資料では、態度はいくつの成分から構成されるとしているか。","answer":"3つ","aliases":[],"explanation":"認知的・感情的・行動的成分の三つである。","section":"45. 態度"},{"id":"soc-s-379","q":"本人・関連する他者・対象の三者関係から態度変化を説明する理論を提唱した人物は誰か。","answer":"ハイダー","aliases":[],"explanation":"ハイダーがP-O-X関係を用いるバランス理論を提唱した。","section":"46. バランス理論"},{"id":"soc-s-380","q":"バランス理論で、本人を表す記号は何か。","answer":"P","aliases":[],"explanation":"資料では本人をPと表している。","section":"46. バランス理論"},{"id":"soc-s-381","q":"バランス理論で、対象に関連する他者を表す記号は何か。","answer":"O","aliases":[],"explanation":"Oは本人以外の関連他者を表す。","section":"46. バランス理論"},{"id":"soc-s-382","q":"バランス理論で、態度の対象を表す記号は何か。","answer":"X","aliases":[],"explanation":"Xは評価や態度が向けられる対象を表す。","section":"46. バランス理論"},{"id":"soc-s-383","q":"三つの関係が不均衡なとき、人は何をしようとすると考えられるか。","answer":"不均衡を解消しようとする","aliases":[],"explanation":"不均衡による不快さを減らす方向に態度を変える。","section":"46. バランス理論"},{"id":"soc-s-384","q":"P-O、O-X、P-Xの関係性の積がプラスの場合、どの状態か。","answer":"均衡状態","aliases":[],"explanation":"三関係の符号の積が正なら均衡とされる。","section":"46. バランス理論"},{"id":"soc-s-385","q":"P-O、O-X、P-Xの関係性の積がマイナスの場合、どの状態か。","answer":"不均衡状態","aliases":[],"explanation":"三関係の符号の積が負なら不均衡とされる。","section":"46. バランス理論"},{"id":"soc-s-386","q":"自分についての情報や感情を、他者に言葉で伝えることを何というか。","answer":"自己開示","aliases":[],"explanation":"自分自身の情報や感情を他者へ言語的に伝える行為である。","section":"47. 自己開示"},{"id":"soc-s-387","q":"自分の情報や感情を伝えることは、対人関係の何に重要な役割を果たすか。","answer":"親密化","aliases":[],"explanation":"互いを知る自己開示は関係を親密にする。","section":"47. 自己開示"},{"id":"soc-s-388","q":"自己開示において、話題に取り上げる領域の多さを何というか。","answer":"広さ","aliases":[],"explanation":"どれほど多様な領域を話すかが自己開示の広さである。","section":"47. 自己開示"},{"id":"soc-s-389","q":"自己開示において、話題をどの程度詳しく話すかを何というか。","answer":"深さ","aliases":[],"explanation":"一つの話題についてどこまで詳細に伝えるかが深さである。","section":"47. 自己開示"},{"id":"soc-s-390","q":"二者が親密になるにつれて、自己開示の広さと深さはどうなるか。","answer":"どちらも拡大する","aliases":[],"explanation":"関係が深まるほど話題の範囲も詳細さも増す。","section":"47. 自己開示"},{"id":"soc-s-391","q":"関係を進展させるためには、自己開示はどのように行われる必要があるか。","answer":"お互いに行う必要がある","aliases":[],"explanation":"一方通行ではなく相互的な自己開示が必要とされる。","section":"47. 自己開示"},{"id":"soc-s-392","q":"一方の開示に応じて、相手も自分のことを開示する相互性を何というか。","answer":"自己開示の返報性","aliases":[],"explanation":"関係の進展には、開示を互いに返し合うことが重要である。","section":"47. 自己開示"}];const STORAGE_KEY="social-psychology-short-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function revealAnswer(){
  const i=currentIndex();if(i===null||state.revealed)return;state.revealed=true;const q=questions[i];const typed=$('response').value.trim();
  $('feedback').innerHTML=`<div class="answerbox neutral"><b>正答</b><div>${escapeHtml(q.answer)}</div>${typed?`<div class="source">あなたの回答：${escapeHtml(typed)}</div>`:''}<div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('markrow').classList.remove('hidden');$('reveal').disabled=true;$('response').disabled=true;
}
function markShort(ok){if(state.answered)return;const i=currentIndex();if(i===null)return;state.answered=true;record(i,ok);$('markrow').classList.add('hidden');$('retry').disabled=false;$('history').textContent=historyText(rec(i));const box=$('feedback').firstElementChild;if(box){box.classList.remove('neutral');box.classList.add(ok?'ok':'bad');box.insertAdjacentHTML('afterbegin',`<b>${ok?'正解として記録しました':'不正解として記録しました'}</b>`);}}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('response').value='';$('response').disabled=true;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=true;$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;$('response').value='';$('response').disabled=false;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=false;$('retry').disabled=true;
}
render();
</script></body></html>
