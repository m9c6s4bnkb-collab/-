<script>const DATA={"mc":[{"q":"研究者が意図的に操作・設定する変数を何というか。","options":["標準変数","独立変数","従属変数","剰余変数"],"answer":1,"explanation":"独立変数は研究者が意図的に操作・設定する変数で、要因・説明変数とも呼ばれる。","source":"心理学統計法"},{"q":"独立変数の変化に伴って生じる結果の変数を何というか。","options":["水準","従属変数","独立変数","母数"],"answer":1,"explanation":"従属変数は独立変数の影響を受けて変化する結果側の変数である。","source":"心理学統計法"},{"q":"独立変数の条件の数を何というか。","options":["自由度","偏差","標本","水準"],"answer":3,"explanation":"独立変数の条件の数は水準と呼ばれる。","source":"心理学統計法"},{"q":"「音声刺激の違いが反応時間に与える影響」で独立変数にあたるものはどれか。","options":["参加者数","音声刺激","反応時間","平均反応時間"],"answer":1,"explanation":"操作する側の音声刺激が独立変数である。","source":"心理学統計法"},{"q":"「音声刺激の違いが反応時間に与える影響」で従属変数にあたるものはどれか。","options":["音声刺激","参加者の割り当て","刺激条件数","反応時間"],"answer":3,"explanation":"測定される結果である反応時間が従属変数である。","source":"心理学統計法"},{"q":"対象を区別するためのカテゴリー分類を目的とし、数字の大小に意味がない尺度はどれか。","options":["比率尺度","順序尺度","間隔尺度","名義尺度"],"answer":3,"explanation":"名義尺度では数値はカテゴリーを区別する記号として機能し、大小や序列に意味はない。","source":"心理学統計法"},{"q":"順位のように大小関係には意味があるが、数値間の間隔が等しいとは限らない尺度はどれか。","options":["比率尺度","名義尺度","順序尺度","間隔尺度"],"answer":2,"explanation":"順序尺度は順序のみが明らかで、間隔は必ずしも等しくない。","source":"心理学統計法"},{"q":"数値間の間隔は一定だが、0が「存在しない」ことを意味しない尺度はどれか。","options":["比率尺度","間隔尺度","名義尺度","順序尺度"],"answer":1,"explanation":"間隔尺度は等間隔だが絶対的原点を持たない。","source":"心理学統計法"},{"q":"絶対的原点としての0を持つ尺度はどれか。","options":["順序尺度","間隔尺度","名義尺度","比率尺度"],"answer":3,"explanation":"比率尺度は等間隔で、絶対的原点0を持つ。","source":"心理学統計法"},{"q":"次のうち名義尺度の例として資料に挙げられているものはどれか。","options":["重さ","血液型","徒競走の順位","長さ"],"answer":1,"explanation":"血液型は名義尺度の例である。","source":"心理学統計法"},{"q":"次のうち順序尺度の例として資料に挙げられているものはどれか。","options":["国籍","長さ","重さ","徒競走の順位"],"answer":3,"explanation":"徒競走の順位は順序尺度の例である。","source":"心理学統計法"},{"q":"次のうち比率尺度の例として資料に挙げられているものはどれか。","options":["成績","血液型","国籍","重さ"],"answer":3,"explanation":"重さや長さなどの物理的数値は比率尺度に該当する。","source":"心理学統計法"},{"q":"平均値について正しいものはどれか。","options":["名義尺度でも算出できる","最も頻度の高い値を表す","外れ値の影響をほとんど受けない","すべての値を反映するため外れ値の影響を受けやすい"],"answer":3,"explanation":"平均値は全観測値を用いるため外れ値の影響を受けやすい。","source":"心理学統計法"},{"q":"中央値について正しいものはどれか。","options":["外れ値の影響を受けにくい","最も頻度の高い値である","名義尺度でのみ使用できる","必ず平均値と一致する"],"answer":0,"explanation":"中央値は中央の値を用いるため外れ値の影響を受けにくい。","source":"心理学統計法"},{"q":"データ数が偶数のとき、中央値はどのように求めるか。","options":["中央の2値を足して2で割る","最大値と最小値の差をとる","最も頻度の高い値を選ぶ","全値を足して標本数で割る"],"answer":0,"explanation":"偶数個の場合は中央の2値の平均をとる。","source":"心理学統計法"},{"q":"最頻値とは何か。","options":["小さい順に並べた中央の値","最も頻度の高い観測値","観測値の総和をnで割った値","最大値と最小値の平均"],"answer":1,"explanation":"最頻値は最も多く出現する観測値である。","source":"心理学統計法"},{"q":"名義変数でも求めることができる代表値はどれか。","options":["標準偏差","分散","平均値","最頻値"],"answer":3,"explanation":"最頻値は名義変数でも求めることができる。","source":"心理学統計法"},{"q":"得られたデータを整理・要約し、その特徴や傾向を記述する統計はどれか。","options":["回帰分析","記述統計","推測統計","偏相関分析"],"answer":1,"explanation":"記述統計は手元のデータを整理・要約する。","source":"心理学統計法"},{"q":"標本から母集団全体の特徴や傾向を推測する統計はどれか。","options":["質的研究","単純集計","推測統計","記述統計"],"answer":2,"explanation":"推測統計は標本から母集団について推測する。","source":"心理学統計法"},{"q":"調査対象となる集団全体を何というか。","options":["変数","標本","母集団","水準"],"answer":2,"explanation":"集団全体が母集団である。","source":"心理学統計法"},{"q":"母集団から選ばれた調査対象者を何というか。","options":["水準","母数","偏差","標本（サンプル）"],"answer":3,"explanation":"母集団から選ばれた対象者は標本またはサンプルと呼ばれる。","source":"心理学統計法"},{"q":"個々の標本の値から平均値を引いたものを何というか。","options":["標準誤差","共分散","偏差","分散"],"answer":2,"explanation":"観測値−平均値が偏差である。","source":"心理学統計法"},{"q":"分散は何の平均値か。","options":["z得点","偏差","偏差の2乗","標準偏差"],"answer":2,"explanation":"分散は偏差の2乗の平均値である。","source":"心理学統計法"},{"q":"偏差をそのまま合計して散布度にできない主な理由はどれか。","options":["標本数に依存しないため","必ず1になるため","正負が打ち消し合い合計が0になるため","単位がなくなるため"],"answer":2,"explanation":"偏差には正負があり、合計すると0になる。","source":"心理学統計法"},{"q":"標準偏差はどのように求めるか。","options":["分散を2乗する","偏差を標本数で割る","分散の正の平方根をとる","平均値の平方根をとる"],"answer":2,"explanation":"分散の正の平方根が標準偏差である。","source":"心理学統計法"},{"q":"標準偏差を用いる利点として資料に示されているものはどれか。","options":["外れ値を除外できる","母平均が直接求められる","必ず0から1の範囲になる","単位が元のデータと同じになる"],"answer":3,"explanation":"分散は単位が2乗されるが、平方根をとる標準偏差では元の単位に戻る。","source":"心理学統計法"},{"q":"正規分布の形として正しいものはどれか。","options":["平均値を中心に左右対称の釣鐘型","必ず二つの山を持つ形","すべての値が同頻度の長方形","右側だけに長い裾を持つ形"],"answer":0,"explanation":"正規分布は平均値を中心とする左右対称の釣鐘型である。","source":"心理学統計法"},{"q":"正規分布で一致する代表値の組み合わせはどれか。","options":["平均値・最大値・最小値","平均値・標準偏差・中央値","平均値・中央値・最頻値","中央値・分散・最頻値"],"answer":2,"explanation":"正規分布では平均値・中央値・最頻値が一致する。","source":"心理学統計法"},{"q":"標準偏差が大きくなると正規分布の形はどうなるか。","options":["必ず右に歪む","山が低くなり左右に広がる","山が高くなり狭くなる","形は変化しない"],"answer":1,"explanation":"標準偏差が大きいほど分布は広がり、山は低くなる。","source":"心理学統計法"},{"q":"正規分布では平均値±1標準偏差の範囲に約何％が含まれるか。","options":["99%","95%","50%","68%"],"answer":3,"explanation":"資料では約68%とされている。","source":"心理学統計法"},{"q":"正規分布では平均値±2標準偏差の範囲に約何％が含まれるか。","options":["68%","95%","100%","75%"],"answer":1,"explanation":"資料では約95%とされている。","source":"心理学統計法"},{"q":"分布の非対称性の程度を示す指標はどれか。","options":["分散","歪度","標準誤差","尖度"],"answer":1,"explanation":"歪度は左右対称性からのずれを表す。","source":"心理学統計法"},{"q":"歪度の絶対値が大きいほど何を意味するか。","options":["平均値が大きい","標本数が多い","分布の非対称性が大きい","分布が正規分布に近い"],"answer":2,"explanation":"歪度の絶対値が大きいほど非対称である。","source":"心理学統計法"},{"q":"資料において尖度が示すものはどれか。","options":["2変数の関連の方向","分布の平均値","標本平均の散らばり","分布の左右の裾の長さの度合い"],"answer":3,"explanation":"資料では尖度を分布の左右の裾の長さの度合いを示す指標としている。","source":"心理学統計法"},{"q":"資料の定義では正規分布の歪度と尖度はいくつか。","options":["歪度1・尖度0","歪度0・尖度3","歪度0・尖度1","歪度3・尖度0"],"answer":1,"explanation":"資料では正規分布の歪度は0、尖度は3とされている。","source":"心理学統計法"},{"q":"ローデータを集団内の相対的位置が分かるよう変換する手続きを何というか。","options":["統制","標準化","無作為化","一般化"],"answer":1,"explanation":"この変換手続きを標準化という。","source":"心理学統計法"},{"q":"z得点の計算として正しいものはどれか。","options":["標準偏差を偏差で割る","偏差を2乗する","平均値を分散で割る","偏差を標準偏差で割る"],"answer":3,"explanation":"z得点=(個々の値−平均値)/標準偏差である。","source":"心理学統計法"},{"q":"一般にデータをz得点へ変換したときの平均値と標準偏差はどれか。","options":["平均1・標準偏差1","平均1・標準偏差0","平均0・標準偏差1","平均0・標準偏差0"],"answer":2,"explanation":"z得点では平均0、標準偏差1になる。","source":"心理学統計法"},{"q":"平均0、標準偏差1に調整された特別な正規分布を何というか。","options":["度数分布","標準正規分布","二項分布","標本分布"],"answer":1,"explanation":"標準化された正規分布を標準正規分布という。","source":"心理学統計法"},{"q":"標準誤差が表すものとして最も適切なのはどれか。","options":["標本平均値の散らばり具合","個々の観測値の散らばり具合","2変数の連動性","分布の非対称性"],"answer":0,"explanation":"標準誤差は複数の標本から得られる標本平均値の散らばりを表す。","source":"心理学統計法"},{"q":"標準誤差が小さい場合、資料ではどのように解釈されるか。","options":["個々のデータのばらつきが必ず大きい","帰無仮説が必ず棄却される","標本からの推測精度が高い","相関が強い"],"answer":2,"explanation":"標準誤差が小さいほど母平均の推測精度が高い。","source":"心理学統計法"},{"q":"2つの量的変数を縦軸・横軸にとり、測定値を点で表した図はどれか。","options":["円グラフ","ヒストグラム","箱ひげ図","散布図"],"answer":3,"explanation":"散布図は2つの量的変数の対応する値をプロットする。","source":"心理学統計法"},{"q":"散布図のプロットが右上がりの場合、どのような関係を示すか。","options":["無相関","正の相関","負の相関","因果関係"],"answer":1,"explanation":"右上がりは正の相関を示す。","source":"心理学統計法"},{"q":"散布図のプロットが右下がりの場合、どのような関係を示すか。","options":["負の相関","正の相関","無相関","交互作用"],"answer":0,"explanation":"右下がりは負の相関を示す。","source":"心理学統計法"},{"q":"相関係数の正・負が示すものはどれか。","options":["関係の方向性","因果関係の有無","標本数","関係の強さ"],"answer":0,"explanation":"符号は関係の方向性を示す。","source":"心理学統計法"},{"q":"相関係数の絶対値の大きさが示すものはどれか。","options":["関係の強さ","測定尺度の種類","標本平均","関係の方向性"],"answer":0,"explanation":"絶対値の大きさは関係の強さを示す。","source":"心理学統計法"},{"q":"共分散がプラスになるのはどのような場合か。","options":["2変数が無関係である","両変数の平均が0である","一方が増えるともう一方が減る","一方が増えるともう一方も増える"],"answer":3,"explanation":"同じ方向に変動すると共分散はプラスになる。","source":"心理学統計法"},{"q":"共分散の値の大きさだけで関係の強さを判断できない理由はどれか。","options":["名義尺度にしか使えないため","必ず0になるため","データの単位によって値が変動するため","符号を持たないため"],"answer":2,"explanation":"共分散はcmやkgなど測定単位の影響を受ける。","source":"心理学統計法"},{"q":"共分散の弱点を補い、関係の強さを-1から1で表すものはどれか。","options":["有意水準","標準誤差","相関係数","尖度"],"answer":2,"explanation":"相関係数は単位の影響を除いて-1〜1で関連を表す。","source":"心理学統計法"},{"q":"「差がない」「関連がない」とする仮説はどれか。","options":["対立仮説","帰無仮説","因果仮説","作業仮説"],"answer":1,"explanation":"帰無仮説は差や関連がないとする仮説である。","source":"心理学統計法"},{"q":"研究者が本当に証明したい「差がある」「関連がある」という仮説はどれか。","options":["零仮説","対立仮説","帰無仮説","標本仮説"],"answer":1,"explanation":"資料では対立仮説を研究者が証明したい仮説として説明している。","source":"心理学統計法"},{"q":"統計的検定ではまず何が正しいと仮定するか。","options":["対立仮説","帰無仮説","外的妥当性","因果関係"],"answer":1,"explanation":"まず帰無仮説が正しいと仮定し、その下でデータが起こる確率を計算する。","source":"心理学統計法"},{"q":"帰無仮説の下で得られたデータが起こる確率として計算されるものはどれか。","options":["共分散","z得点","p値","標準偏差"],"answer":2,"explanation":"資料では帰無仮説の下で得られたデータが起こる確率をp値としている。","source":"心理学統計法"},{"q":"帰無仮説を棄却するかどうかの判断基準となる確率値はどれか。","options":["有意水準","標準誤差","分散","決定係数"],"answer":0,"explanation":"有意水準は棄却判断の基準となる確率値で、αで表される。","source":"心理学統計法"},{"q":"有意水準を表す記号はどれか。","options":["r","α","β","z"],"answer":1,"explanation":"有意水準はαで表される。","source":"心理学統計法"},{"q":"資料で慣習的な有意水準として挙げられている組み合わせはどれか。","options":["10%と20%","68%と95%","5%と1%","50%と68%"],"answer":2,"explanation":"資料では5%、厳しく判断する場合は1%が挙げられている。","source":"心理学統計法"},{"q":"独立変数以外で従属変数に影響を与える変数を何というか。","options":["標準変数","従属変数","目的変数","剰余変数"],"answer":3,"explanation":"剰余変数は独立変数以外で従属変数に影響する変数である。","source":"心理学研究法Ⅰ"},{"q":"剰余変数が統制されていないことで、結果が独立変数によるのか別要因によるのか判別できなくなる状態を何というか。","options":["交絡","標準化","収束","無作為化"],"answer":0,"explanation":"剰余変数が統制されないと交絡が生じる。","source":"心理学研究法Ⅰ"},{"q":"二つの変数の間に規則的な連動が見られる状態を何というか。","options":["相関関係","内的一貫性","因果関係","交互作用"],"answer":0,"explanation":"相関関係は二変数が規則的に連動する状態である。","source":"心理学研究法Ⅰ"},{"q":"変数Xが原因となり変数Yという結果が生じる関係はどれか。","options":["相関関係","疑似相関","因果関係","共分散"],"answer":2,"explanation":"原因と結果の関係を因果関係という。","source":"心理学研究法Ⅰ"},{"q":"相関関係について正しい説明はどれか。","options":["相関があれば必ず因果関係がある","負の相関は関連がないことを示す","相関があっても直ちに因果関係とは断定できない","相関係数は0から1のみをとる"],"answer":2,"explanation":"相関は連動を示すが、それだけで因果関係は証明できない。","source":"心理学研究法Ⅰ"},{"q":"因果関係を主張する条件として資料に挙げられていないものはどれか。","options":["XとYに統計的関連があること","XがYより時間的に先行すること","他の因果的説明が排除されていること","XとYの平均値が等しいこと"],"answer":3,"explanation":"因果関係の3条件は時間的先行、統計的関連、他の因果的説明の排除である。","source":"心理学研究法Ⅰ"},{"q":"X→Yの因果関係を主張する際の時間的条件はどれか。","options":["XとYが必ず同時に生じる","XがYより先に生じる","YがXより先に生じる","時間的順序は問わない"],"answer":1,"explanation":"原因Xが結果Yより時間的に先行する必要がある。","source":"心理学研究法Ⅰ"},{"q":"同一の調査対象集団を継続的に追跡して変化を捉える方法はどれか。","options":["有意抽出法","縦断的研究","横断的研究","参加者間計画"],"answer":1,"explanation":"縦断的研究では同一集団から継続的にデータを得る。","source":"心理学研究法Ⅰ"},{"q":"3歳・4歳・5歳の別々の群を同時に測定して年齢差を比較する方法はどれか。","options":["参加者内計画","横断的研究","縦断的研究","再検査法"],"answer":1,"explanation":"一時点で異なる年齢群を比較するのは横断的研究である。","source":"心理学研究法Ⅰ"},{"q":"縦断的研究の限界として資料に挙げられているものはどれか。","options":["時間経過を直接捉えられない","同じ測定ツールの反復による練習効果","個人の変化を追跡できない","一度に多くのデータを集めやすい"],"answer":1,"explanation":"縦断研究では反復測定による練習効果などが限界となる。","source":"心理学研究法Ⅰ"},{"q":"横断的研究の長所として資料に挙げられているものはどれか。","options":["因果関係を必ず証明できる","練習効果を積極的に利用できる","時間や費用を抑え一度に多くのデータを集められる","同一人物の変化を直接追跡できる"],"answer":2,"explanation":"横断研究は時間・費用のコストを抑えやすい。","source":"心理学研究法Ⅰ"},{"q":"実験参加者を各条件へ等確率で振り分ける方法はどれか。","options":["有意抽出","無作為割り当て","無作為抽出","折半法"],"answer":1,"explanation":"無作為割り当て（ランダム・アサインメント）は参加者を条件へランダムに振り分ける。","source":"心理学研究法Ⅰ"},{"q":"無作為割り当ての主な目的はどれか。","options":["参加者属性が特定の群に偏るのを防ぐ","外的基準を設定する","母集団から標本を抽出する","質問項目を半分に分ける"],"answer":0,"explanation":"群間で年齢・性格・能力などの偏りを防ぎ、条件を等質に近づける。","source":"心理学研究法Ⅰ"},{"q":"無作為割り当てによって特に高められると資料にあるものはどれか。","options":["再検査信頼性","表面的妥当性","内容的妥当性","内的妥当性"],"answer":3,"explanation":"群の等質化により内的妥当性が高まる。","source":"心理学研究法Ⅰ"},{"q":"t検定の主な目的はどれか。","options":["2つの名義変数の割合を比較する","3群以上の平均値を同時に比較する","2つの標本の平均値を比較する","尺度の内的一貫性を測る"],"answer":2,"explanation":"t検定は2標本の平均値差を検討する。","source":"心理学研究法Ⅰ"},{"q":"資料でt検定の前提として挙げられているものはどれか。","options":["独立性・収束性・弁別性","内的妥当性・外的妥当性・信頼性","歪度0・尖度3・平均0","正規性・等分散性・無作為抽出"],"answer":3,"explanation":"資料では正規性、等分散性、無作為抽出が挙げられている。","source":"心理学研究法Ⅰ"},{"q":"等分散性が満たされない場合に用いると資料にある検定はどれか。","options":["折半法","ウェルチの検定","KJ法","再検査法"],"answer":1,"explanation":"等分散性を前提としないウェルチの検定が用いられる。","source":"心理学研究法Ⅰ"},{"q":"同一人物の介入前後の平均値を比較する場合に適するのはどれか。","options":["横断的研究","対応のないt検定","有意抽出法","対応のあるt検定"],"answer":3,"explanation":"同じ対象を繰り返し測定する比較は対応ありである。","source":"心理学研究法Ⅰ"},{"q":"互いに独立した2集団の平均値を比較する場合に適するのはどれか。","options":["対応のあるt検定","再検査法","対応のないt検定","参加者内計画"],"answer":2,"explanation":"異なる独立集団の差には対応のないt検定を用いる。","source":"心理学研究法Ⅰ"},{"q":"対応のあるt検定の利点として資料に示されているものはどれか。","options":["3群以上を一度に比較できる","外的妥当性を必ず高める","母集団を無作為に抽出できる","個人差やばらつきの影響を抑えられる"],"answer":3,"explanation":"同一対象を使うため個人差による誤差を抑えられる。","source":"心理学研究法Ⅰ"},{"q":"自由度の基本的な意味として最も近いものはどれか。","options":["p値そのもの","独立変数の数だけ","自由に値を決めることができる変数の数","母集団の人数"],"answer":2,"explanation":"資料では自由度を基本的に「自由に値を決めることができる変数の数」と説明している。","source":"心理学研究法Ⅰ"},{"q":"実験法の特徴として最も適切なものはどれか。","options":["言語データだけを扱う","独立変数を意図的に操作し従属変数との因果関係を検討する","独立変数を一切操作しない","母集団全員を必ず調査する"],"answer":1,"explanation":"実験法は独立変数を操作し、従属変数への影響を調べる。","source":"心理学研究法Ⅰ"},{"q":"内的妥当性が高いとは、主にどのような状態か。","options":["他の対象や場面に広く一般化できる","項目が直感的に妥当に見える","同じテストを繰り返すと同じ結果になる","実験操作や統制が適切で因果関係が正しく立証されている"],"answer":3,"explanation":"内的妥当性は因果関係を正しく立証できている程度を指す。","source":"心理学研究法Ⅰ"},{"q":"外的妥当性が示すものはどれか。","options":["独立変数以外を統制できた程度","結果を他の対象や場面に一般化できる程度","尺度項目の内的一貫性","同一対象の測定安定性"],"answer":1,"explanation":"外的妥当性は結果の一般化可能性を指す。","source":"心理学研究法Ⅰ"},{"q":"厳密な統制について資料が指摘していることはどれか。","options":["内的妥当性を高めても現実離れすると外的妥当性が下がることがある","内的妥当性と外的妥当性を必ず同時に高める","妥当性とは無関係である","外的妥当性だけを高める"],"answer":0,"explanation":"統制と現実性のバランスが重要とされる。","source":"心理学研究法Ⅰ"},{"q":"3群以上の平均値差を検定する分析手法はどれか。","options":["相関分析","t検定","再検査法","分散分析"],"answer":3,"explanation":"3群以上の平均値差には分散分析を用いる。","source":"心理学研究法Ⅰ"},{"q":"分散分析で、従属変数に影響を与える独立変数を何というか。","options":["残差","基準","水準","要因"],"answer":3,"explanation":"分散分析では独立変数を要因という。","source":"心理学研究法Ⅰ"},{"q":"分散分析で、要因の中の異なる条件を何というか。","options":["自由度","要因","標本","水準"],"answer":3,"explanation":"要因内の条件を水準という。","source":"心理学研究法Ⅰ"},{"q":"要因が1つの場合に行う分散分析はどれか。","options":["二要因分散分析","多元配置分散分析のみ","対応のあるt検定","一要因分散分析"],"answer":3,"explanation":"要因が1つなら一要因分散分析である。","source":"心理学研究法Ⅰ"},{"q":"二要因分散分析で、特定の要因が結果に与える単独の効果を何というか。","options":["主効果","交互作用","残差","偏回帰係数"],"answer":0,"explanation":"一つの要因単独の効果を主効果という。","source":"心理学研究法Ⅰ"},{"q":"ある要因の効果が、もう一方の要因の水準によって異なることを何というか。","options":["交互作用","主効果","疑似相関","標準化"],"answer":0,"explanation":"二要因分散分析では交互作用も検討される。","source":"心理学研究法Ⅰ"},{"q":"各水準に異なる参加者を割り当てる計画はどれか。","options":["参加者内計画","参加者間計画","縦断的研究","再検査法"],"answer":1,"explanation":"水準ごとに異なる参加者を用いるのが参加者間計画である。","source":"心理学研究法Ⅰ"},{"q":"同じ参加者から繰り返しデータを測定する計画はどれか。","options":["参加者間計画","有意抽出法","参加者内計画","横断的研究"],"answer":2,"explanation":"同じ参加者を複数条件で測定するのが参加者内計画である。","source":"心理学研究法Ⅰ"},{"q":"帰無仮説が真なのに棄却してしまう誤りはどれか。","options":["測定誤差","第1種の誤り","標本誤差","第2種の誤り"],"answer":1,"explanation":"真の帰無仮説を誤って棄却するのが第1種の誤りである。","source":"心理学研究法Ⅰ"},{"q":"帰無仮説が偽なのに棄却しない誤りはどれか。","options":["交絡","第2種の誤り","残差","第1種の誤り"],"answer":1,"explanation":"偽の帰無仮説を棄却できないのが第2種の誤りである。","source":"心理学研究法Ⅰ"},{"q":"第1種の誤りを犯す確率と等しいものはどれか。","options":["相関係数r","検定力1−β","有意水準α","β"],"answer":2,"explanation":"資料では第1種の誤りの確率は有意水準αと等しい。","source":"心理学研究法Ⅰ"},{"q":"第2種の誤りを犯す確率を表す記号はどれか。","options":["β","r","R","α"],"answer":0,"explanation":"第2種の誤りの確率はβで表す。","source":"心理学研究法Ⅰ"},{"q":"検定力はどの式で表されるか。","options":["1−α","α+β","1−β","1/β"],"answer":2,"explanation":"偽の帰無仮説を正しく棄却する確率が検定力で、1−βで表す。","source":"心理学研究法Ⅰ"},{"q":"母集団の全要素が等しい確率で選ばれるよう標本を抽出する方法はどれか。","options":["参加者間計画","無作為抽出法","有意抽出法","無作為割り当て"],"answer":1,"explanation":"無作為抽出法は母集団から標本を等確率で選ぶ。","source":"心理学研究法Ⅰ"},{"q":"研究者が目的や基準に基づき対象を意図的に選ぶ方法はどれか。","options":["有意抽出法","折半法","無作為抽出法","無作為割り当て"],"answer":0,"explanation":"有意抽出法は研究者が意図的に対象を選定する。","source":"心理学研究法Ⅰ"},{"q":"無作為抽出法と無作為割り当ての違いとして正しいものはどれか。","options":["どちらも全く同じ手続きである","どちらも尺度項目を分割する方法である","抽出は条件分け、割り当ては母集団からの選定である","抽出は母集団から標本を選び、割り当ては参加者を条件に振り分ける"],"answer":3,"explanation":"ランダム・サンプリングは標本抽出、ランダム・アサインメントは条件への割り当てである。","source":"心理学研究法Ⅰ"},{"q":"知能や性格のように直接観察できないが、言動や反応を説明するため想定される枠組みを何というか。","options":["剰余変数","外的基準","構成概念","水準"],"answer":2,"explanation":"直接観察できない心理学的概念を構成概念という。","source":"心理学研究法Ⅰ"},{"q":"構成概念を客観的・数値的に測定するための道具として資料に示されているものはどれか。","options":["尺度","KJ法","カバーストーリー","散布図"],"answer":0,"explanation":"構成概念を測定可能な変数へ変換する道具が尺度である。","source":"心理学研究法Ⅰ"},{"q":"構成概念妥当性の確認方法として資料に挙げられていないものはどれか。","options":["既存尺度との相関","異なる特性をもつ群間の得点差","テストの因子構造","有意水準を5%に固定すること"],"answer":3,"explanation":"構成概念妥当性は複数の証拠を総合的に評価する。","source":"心理学研究法Ⅰ"},{"q":"測定内容が安定性と一貫性を備えている程度を何というか。","options":["外的基準","信頼性","検定力","妥当性"],"answer":1,"explanation":"信頼性は測定の安定性と一貫性に関する概念である。","source":"心理学研究法Ⅰ"},{"q":"同じテストを2回行って安定性を検討する方法はどれか。","options":["再検査法","有意抽出法","KJ法","折半法"],"answer":0,"explanation":"再検査法は同じ対象に同じテストを繰り返す。","source":"心理学研究法Ⅰ"},{"q":"同質のテストを2種類用意して安定性を検討する 解：混合計画","source":"実験計画法"}],"sa":[{"q":"研究者が意図的に操作・設定する変数を何というか。","answer":"独立変数","alts":["説明変数","要因"],"explanation":"独立変数は研究者が操作・設定する側の変数。","source":"心理学統計法"},{"q":"独立変数の変化に伴って生じる結果の変数を何というか。","answer":"従属変数","alts":["結果変数","基準変数"],"explanation":"結果として測定される側の変数。","source":"心理学統計法"},{"q":"独立変数の条件の数を何というか。","answer":"水準","alts":[],"explanation":"条件の数を水準という。","source":"心理学統計法"},{"q":"カテゴリー分類のみを目的とし、大小関係に意味がない尺度は何か。","answer":"名義尺度","alts":[],"explanation":"性別・血液型・国籍などが例。","source":"心理学統計法"},{"q":"順序には意味があるが、数値間隔が等しいとは限らない尺度は何か。","answer":"順序尺度","alts":[],"explanation":"順位などが例。","source":"心理学統計法"},{"q":"数値間隔は一定だが絶対的原点を持たない尺度は何か。","answer":"間隔尺度","alts":[],"explanation":"0が「存在しない」を意味しない。","source":"心理学統計法"},{"q":"等間隔で絶対的原点0を持つ尺度は何か。","answer":"比率尺度","alts":[],"explanation":"重さや長さが例。","source":"心理学統計法"},{"q":"n個の観測値の総和をnで割った代表値は何か。","answer":"平均値","alts":[],"explanation":"全ての値を反映するため外れ値の影響を受けやすい。","source":"心理学統計法"},{"q":"データを小さい順に並べたとき中央に位置する代表値は何か。","answer":"中央値","alts":[],"explanation":"外れ値の影響を受けにくい。","source":"心理学統計法"},{"q":"最も頻度の高い観測値を何というか。","answer":"最頻値","alts":[],"explanation":"名義変数でも求められる。","source":"心理学統計法"},{"q":"手元のデータを整理・要約して特徴や傾向を記述する統計を何というか。","answer":"記述統計","alts":[],"explanation":"代表値や散布度などで要約する。","source":"心理学統計法"},{"q":"標本から母集団全体の特徴や傾向を推測する統計を何というか。","answer":"推測統計","alts":[],"explanation":"一部のデータから集団全体を推測する。","source":"心理学統計法"},{"q":"調査対象となる集団全体を何というか。","answer":"母集団","alts":[],"explanation":"調査したい集団全体。","source":"心理学統計法"},{"q":"母集団から選ばれた調査対象者を何というか。","answer":"標本","alts":["サンプル"],"explanation":"標本＝サンプル。","source":"心理学統計法"},{"q":"個々の値から平均値を引いた値を何というか。","answer":"偏差","alts":[],"explanation":"観測値−平均値。","source":"心理学統計法"},{"q":"偏差の2乗の平均値を何というか。","answer":"分散","alts":[],"explanation":"データのばらつきを示す散布度。","source":"心理学統計法"},{"q":"分散の正の平方根をとった指標を何というか。","answer":"標準偏差","alts":["SD"],"explanation":"元データと同じ単位でばらつきを表す。","source":"心理学統計法"},{"q":"平均値を中心に左右対称の釣鐘型をした分布を何というか。","answer":"正規分布","alts":[],"explanation":"平均値・中央値・最頻値が一致する。","source":"心理学統計法"},{"q":"分布の非対称性の程度を示す指標を何というか。","answer":"歪度","alts":[],"explanation":"絶対値が大きいほど非対称。","source":"心理学統計法"},{"q":"資料で分布の左右の裾の長さの度合いを示すとされる指標は何か。","answer":"尖度","alts":[],"explanation":"資料では正規分布の尖度は3。","source":"心理学統計法"},{"q":"ローデータを集団内の相対的位置が分かるよう変換する手続きを何というか。","answer":"標準化","alts":[],"explanation":"単位や平均値の異なるデータを比較しやすくする。","source":"心理学統計法"},{"q":"偏差を標準偏差で割って求める標準得点を何というか。","answer":"z得点","alts":["zスコア"],"explanation":"z得点化すると一般に平均0、標準偏差1。","source":"心理学統計法"},{"q":"平均0、標準偏差1に調整された正規分布を何というか。","answer":"標準正規分布","alts":[],"explanation":"標準化された特別な正規分布。","source":"心理学統計法"},{"q":"標本平均値の散らばり具合を何というか。","answer":"標準誤差","alts":[],"explanation":"標本平均が母平均からどれくらいずれる可能性があるかを示す。","source":"心理学統計法"},{"q":"2つの量的変数を縦軸・横軸にとって点をプロットした図を何というか。","answer":"散布図","alts":[],"explanation":"関連の方向・強さ、外れ値などを確認できる。","source":"心理学統計法"},{"q":"2変数が同じ方向に動くとプラス、逆方向に動くとマイナスになる連動性の指標は何か。","answer":"共分散","alts":[],"explanation":"単位の影響を受けるため大きさだけで強さを判断できない。","source":"心理学統計法"},{"q":"「差がない」「関連がない」とする仮説を何というか。","answer":"帰無仮説","alts":[],"explanation":"検定ではまずこれが正しいと仮定する。","source":"心理学統計法"},{"q":"研究者が証明したい「差がある」「関連がある」という仮説を何というか。","answer":"対立仮説","alts":[],"explanation":"帰無仮説が棄却されたとき採択される。","source":"心理学統計法"},{"q":"帰無仮説を棄却するかどうかの判断基準となる確率値を何というか。","answer":"有意水準","alts":["危険率"],"explanation":"αで表される。","source":"心理学統計法"},{"q":"独立変数以外で従属変数に影響する変数を何というか。","answer":"剰余変数","alts":[],"explanation":"統制されないと交絡が生じうる。","source":"心理学研究法Ⅰ"},{"q":"独立変数の効果と他の要因の効果を判別できなくなる状態を何というか。","answer":"交絡","alts":[],"explanation":"剰余変数の統制が不十分な場合に生じる。","source":"心理学研究法Ⅰ"},{"q":"二つの変数に規則的な連動が見られる関係を何というか。","answer":"相関関係","alts":[],"explanation":"相関だけでは因果を断定できない。","source":"心理学研究法Ⅰ"},{"q":"Xが原因でYという結果が生じる関係を何というか。","answer":"因果関係","alts":[],"explanation":"時間的先行・統計的関連・他説明の排除が条件。","source":"心理学研究法Ⅰ"},{"q":"同一集団を継続的に追跡して時間経過に伴う変化を捉える研究を何というか。","answer":"縦断的研究","alts":[],"explanation":"同じ対象を長期間追跡する。","source":"心理学研究法Ⅰ"},{"q":"特定の一時点で異なる年齢群などを測定し、時間的変化を推測する研究を何というか。","answer":"横断的研究","alts":[],"explanation":"時間や費用を抑えやすい。","source":"心理学研究法Ⅰ"},{"q":" function save(){localStorage.setItem(KEY,JSON.stringify(rec))}function rFor(i){return rec[type][i]||{correct:0,wrong:0,attempts:0,last:null}}function setR(i,r){rec[type][i]=r;save()}
function setType(t){type=t;idx=0;build();render()}function setMode(m){mode=m;idx=0;build();render()}function build(){let arr=DATA[type].map((_,i)=>i);if(mode==='unanswered')arr=arr.filter(i=>rFor(i).attempts===0);if(mode==='wrong')arr=arr.filter(i=>rFor(i).wrong>0);if(mode==='wrong1')arr=arr.filter(i=>rFor(i).wrong===1);if(mode==='wrong2')arr=arr.filter(i=>rFor(i).wrong===2);if(mode==='wrong3')arr=arr.filter(i=>rFor(i).wrong>=3);if(mode==='random'){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}list=arr;updateStats()}
function updateStats(){let rs=Object.values(rec[type]),c=rs.reduce((a,x)=>a+x.correct,0),w=rs.reduce((a,x)=>a+x.wrong,0),done=rs.filter(x=>x.attempts>0).length;document.getElementById('sCorrect').textContent=c;document.getElementById('sWrong').textContent=w;document.getElementById('sRate').textContent=(c+w)?Math.round(c/(c+w)*100)+'%':'-';document.getElementById('sProgress').textContent=done+'/'+DATA[type].length;document.getElementById('tabMc').classList.toggle('active',type==='mc');document.getElementById('tabSa').classList.toggle('active',type==='sa');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function render(){updateStats();let empty=!list.length;document.getElementById('empty').classList.toggle('hidden',!empty);document.getElementById('card').classList.toggle('hidden',empty);if(empty)return;if(idx>=list.length)idx=0;if(idx<0)idx=list.length-1;let qi=list[idx],q=DATA[type][qi],r=rFor(qi);locked=false;document.getElementById('meta').textContent=(idx+1)+' / '+list.length;document.getElementById('question').textContent=q.q;document.getElementById('source').textContent='出典：'+q.source;document.getElementById('feedback').className='feedback hidden';document.getElementById('feedback').textContent='';document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回';document.getElementById('mcArea').classList.toggle('hidden',type!=='mc');document.getElementById('saArea').classList.toggle('hidden',type!=='sa');if(type==='mc'){let box=document.getElementById('choices');box.innerHTML='';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>judgeMc(j,b);box.appendChild(b)});document.getElementById('revealMc').disabled=false}else{document.getElementById('saInput').value='';document.getElementById('saInput').disabled=false}}
function showFb(ok,text){let f=document.getElementById('feedback');f.className='feedback '+(ok===true?'ok':ok===false?'ng':'');f.innerHTML=text}
function judgeMc(sel){if(locked)return;locked=true;let qi=list[idx],q=DATA.mc[qi],r=rFor(qi);r.attempts++;if(sel===q.answer)r.correct++;else r.wrong++;r.last=sel===q.answer;setR(qi,r);[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===sel&&sel!==q.answer)b.classList.add('wrong')});showFb(sel===q.answer,(sel===q.answer?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealMc(){if(locked)return;locked=true;let q=DATA.mc[list[idx]];[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct')});showFb(null,'<b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation)}
function norm(s){return s.toLowerCase().replace(/[\s　・･\.。()（）\-−ー]/g,'').replace(/ｔ/g,'t').replace(/ｚ/g,'z')}
function judgeSa(){if(locked)return;let inp=document.getElementById('saInput').value.trim();if(!inp)return;locked=true;let qi=list[idx],q=DATA.sa[qi],r=rFor(qi),valid=[q.answer,...(q.alts||[])].map(norm),ok=valid.includes(norm(inp));r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=ok;setR(qi,r);document.getElementById('saInput').disabled=true;showFb(ok,(ok?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.answer+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealSa(){if(locked)return;locked=true;let q=DATA.sa[list[idx]];document.getElementById('saInput').disabled=true;showFb(null,'<b>答え：</b>'+q.answer+'<br>'+q.explanation)}function next(){idx++;render()}function prev(){idx--;render()}function resetAll(){if(confirm('正解・不正解・間違えた回数など、すべての記録を消しますか？')){rec={mc:{},sa:{}};save();build();render()}}
document.getElementById('mcCount').textContent=DATA.mc.length;document.getElementById('saCount').textContent=DATA.sa.length;build();render();</script></body></html>
