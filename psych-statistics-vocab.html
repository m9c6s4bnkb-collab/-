<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>統計英単語｜参考書⑤</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f2ed;--ink:#22262c;--muted:#7a7d82;--line:#d3cfc6;--accent:#5d7698}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
h1{margin:0;font-size:2rem} .sub{color:var(--muted);margin-top:6px;line-height:1.6;font-size:.92rem}
.toggle{border:0;background:transparent;color:#526986;font-weight:800;cursor:pointer;padding:10px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 10px}
.pill{border:1px solid #c8c4ba;background:#fbfaf7;border-radius:999px;padding:11px 17px;font-weight:800;color:#334;cursor:pointer}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.type.active{background:#2f3d50;border-color:#2f3d50}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.stat{border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:18px;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat strong{font-size:1.9rem} .stat span{font-size:.8rem;color:#7f7f7f;margin-top:8px}
.progress{height:8px;background:#dad6cf;border-radius:99px;overflow:hidden;margin:18px 8px}
.progress div{height:100%;background:#d66e3f;width:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.btn{border:1px solid #c9c5bc;background:#faf9f6;border-radius:12px;padding:11px 15px;font-weight:800;color:#405675;cursor:pointer}
.card{background:rgba(255,255,255,.74);border:1px solid #d9d5cd;border-radius:20px;padding:26px;margin-top:12px}
.meta,.history,.source{font-size:.8rem;color:#888} .meta{margin-bottom:12px}
.word{font-size:1.45rem;font-weight:850;line-height:1.5;margin:10px 0 12px}
.history{margin:10px 0 16px}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;border:1px solid #d5d1c8;background:#fff;border-radius:14px;padding:14px;font-size:1rem;cursor:pointer}
.choice.correct{background:#eaf6ed;border-color:#67a878} .choice.wrong{background:#fff0f0;border-color:#d56b6b}
.qa{display:flex;gap:10px;flex-wrap:wrap} .qa input{flex:1;min-width:220px;padding:13px;border:1px solid #cdc8be;border-radius:12px;font-size:1rem}
.feedback{margin-top:15px;padding:14px;border-radius:14px;background:#f4f3f0;line-height:1.65}
.nav{display:flex;gap:10px;margin-top:18px} .hidden{display:none!important}
@media(max-width:680px){.wrap{padding:20px 12px 45px}h1{font-size:1.5rem}.card{padding:20px 15px}.stat{min-height:92px}.stat strong{font-size:1.5rem}}
</style>
</head>
<body>
<main class="wrap">
<div class="top">
 <div><h1>統計英単語</h1><div class="sub">参考書⑤「心理統計・研究法用語 定義リスト」収録語<br>出題方向は <b>英語 → 日本語</b> のみ</div></div>
 <button id="toggle" class="toggle">▲ メニューを隠す</button>
</div>

<section id="menu">
 <div class="controls">
  <button class="pill type active" data-type="mc">4択</button>
  <button class="pill type" data-type="qa">一問一答</button>
 </div>
 <div class="controls">
  <button class="pill active" data-mode="all">通常</button>
  <button class="pill" data-mode="random">ランダム</button>
  <button class="pill" data-mode="unanswered">未回答だけ</button>
  <button class="pill" data-mode="wrongAny">間違えた問題</button>
  <button class="pill" data-mode="wrong1">1回間違えた</button>
  <button class="pill" data-mode="wrong2">2回間違えた</button>
  <button class="pill" data-mode="wrong3">3回以上間違えた</button>
 </div>
 <div class="stats">
  <div class="stat"><strong id="position">0/0</strong><span>現在位置</span></div>
  <div class="stat"><strong id="correct">0</strong><span>累積正解</span></div>
  <div class="stat"><strong id="wrong">0</strong><span>累積不正解</span></div>
  <div class="stat"><strong id="rate">—</strong><span>正答率</span></div>
 </div>
 <div class="progress"><div id="bar"></div></div>
 <div class="actions"><button class="btn" id="reset">記録をリセット</button><button class="btn" id="reshuffle">ランダム順を作り直す</button></div>
</section>

<section class="card" id="card">
 <div class="meta"><span id="counter"></span>　<span id="kind"></span></div>
 <div class="word" id="word"></div>
 <div class="history" id="history"></div>
 <div id="body"></div>
 <div id="feedback" class="feedback hidden"></div>
 <div class="nav"><button class="btn" id="prev">← 前へ</button><button class="btn" id="next">次へ →</button></div>
</section>
<div id="empty" class="hidden" style="text-align:center;padding:40px;color:#777">該当する問題はありません。</div>
</main>

const KEY='psych_statistics_vocab_20260901_v1';
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．\.\-ー_()（）「」『』]/g,'');
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const rec=id=>state[id]||(state[id]={correct:0,wrong:0,attempts:0});
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
let type='mc',mode='all',pool=[],idx=0,locked=false;
function build(){
 let a=BANK.map((_,i)=>i);
 if(mode==='unanswered')a=a.filter(i=>rec(BANK[i].id).attempts===0);
 if(mode==='wrongAny')a=a.filter(i=>rec(BANK[i].id).wrong>0);
 if(mode==='wrong1')a=a.filter(i=>rec(BANK[i].id).wrong===1);
 if(mode==='wrong2')a=a.filter(i=>rec(BANK[i].id).wrong===2);
 if(mode==='wrong3')a=a.filter(i=>rec(BANK[i].id).wrong>=3);
 if(mode==='random')for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 pool=a;idx=0;render();
}
function totals(){let c=0,w=0;BANK.forEach(q=>{let r=rec(q.id);c+=r.correct;w+=r.wrong});return{c,w}}
function stat(){
 let t=totals(),n=t.c+t.w;
 $('correct').textContent=t.c;$('wrong').textContent=t.w;$('rate').textContent=n?Math.round(t.c/n*100)+'%':'—';
 $('position').textContent=pool.length?(idx+1)+'/'+pool.length:'0/0';
 $('bar').style.width=pool.length?((idx+1)/pool.length*100)+'%':'0%';
}
function render(){
 stat();
 if(!pool.length){$('card').classList.add('hidden');$('empty').classList.remove('hidden');return}
 $('card').classList.remove('hidden');$('empty').classList.add('hidden');
 let q=BANK[pool[idx]],r=rec(q.id);locked=false;
 $('counter').textContent='問題 '+(idx+1)+' / '+pool.length;$('kind').textContent=type==='mc'?'4択':'一問一答';
 $('word').textContent=q.en;$('history').textContent=`この問題の履歴：○ ${r.correct}回 ／ × ${r.wrong}回 ／ 挑戦 ${r.attempts}回`;
 $('feedback').classList.add('hidden');$('body').innerHTML='';
 if(type==='mc'){
  let box=document.createElement('div');box.className='choices';
  q.choices.forEach((c,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+c;b.onclick=()=>ansMC(q,j,b,box);box.appendChild(b)});
  $('body').appendChild(box);
 }else{
  let f=document.createElement('form');f.className='qa';let inp=document.createElement('input');inp.placeholder='日本語を入力';
  let b=document.createElement('button');b.className='btn';b.textContent='回答する';b.type='submit';f.append(inp,b);
  f.onsubmit=e=>{e.preventDefault();ansQA(q,inp.value,inp,b)};$('body').appendChild(f);setTimeout(()=>inp.focus(),0);
 }
}
function fb(ok,q){let f=$('feedback');f.classList.remove('hidden');f.innerHTML=(ok?'<b>○ 正解！</b>':'<b>× 不正解</b>　正解：<b>'+q.jp+'</b>')+'<div class="source">出典：参考書⑤ 定義リスト</div>';stat();let r=rec(q.id);$('history').textContent=`この問題の履歴：○ ${r.correct}回 ／ × ${r.wrong}回 ／ 挑戦 ${r.attempts}回`;}
function ansMC(q,j,b,box){if(locked)return;locked=true;let r=rec(q.id);r.attempts++;let ok=j===q.answer;ok?r.correct++:r.wrong++;save();[...box.children].forEach((x,k)=>{x.disabled=true;if(k===q.answer)x.classList.add('correct')});if(!ok)b.classList.add('wrong');fb(ok,q)}
function ansQA(q,v,inp,b){if(locked||!v.trim())return;locked=true;let r=rec(q.id);r.attempts++;let ok=norm(v)===norm(q.jp);ok?r.correct++:r.wrong++;save();inp.disabled=true;b.disabled=true;fb(ok,q)}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));build()});
$('next').onclick=()=>{if(pool.length){idx=(idx+1)%pool.length;render()}};$('prev').onclick=()=>{if(pool.length){idx=(idx-1+pool.length)%pool.length;render()}};
