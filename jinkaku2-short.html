<script>const questions=[{"id":"jin2-s-001","q":"対象者の行動・対人関係・コミュニケーションを観察し、特徴や法則性を明らかにする研究方法は何か。","answer":"観察法","aliases":[],"explanation":"資料では、正答は「観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-002","q":"観察法で記録対象となる三つのものは何か。","answer":"行動・対人関係・コミュニケーション","aliases":[],"explanation":"資料では、正答は「行動・対人関係・コミュニケーション」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-003","q":"対象者へ働きかけず、自然な環境で行動を見る方法はどれか。","answer":"自然観察法","aliases":[],"explanation":"資料では、正答は「自然観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-004","q":"特定の行動が生じるよう、環境条件を設定・操作して見る方法はどれか。","answer":"実験的観察法","aliases":[],"explanation":"資料では、正答は「実験的観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-005","q":"観察法が直接の対象とするものは何か。","answer":"実際の行動そのもの","aliases":[],"explanation":"資料では、正答は「実際の行動そのもの」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-006","q":"言語による回答が難しくても観察研究の対象にできるものとして、資料に挙げられた組合せはどれか。","answer":"乳幼児・障害児・動物","aliases":[],"explanation":"資料では、正しい組合せは「乳幼児・障害児・動物」である。","section":"41. 観察法"},{"id":"jin2-s-007","q":"日常生活の中で把握できることが長所とされるものは何か。","answer":"自然な行動","aliases":[],"explanation":"資料では、正答は「自然な行動」と説明されている。","section":"41. 観察法"},{"id":"jin2-s-008","q":"観察法の課題として資料に挙げられた四点の組合せはどれか。","answer":"観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮","aliases":[],"explanation":"資料では、正しい組合せは「観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮」である。","section":"41. 観察法"},{"id":"jin2-s-009","q":"日常生活で観察した行動や様子を、後から思い出して記録する方法は何か。","answer":"日誌法","aliases":[],"explanation":"資料では、正答は「日誌法」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-010","q":"日誌法は、どの研究方法における記録法の一つか。","answer":"観察法","aliases":[],"explanation":"資料では、正答は「観察法」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-011","q":"日誌法の例として挙げられているものはどれか。","answer":"育児日誌","aliases":[],"explanation":"資料では、正答は「育児日誌」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-012","q":"育児日誌と並ぶ日誌法の例として挙げられているものは何か。","answer":"保育日誌","aliases":[],"explanation":"資料では、正答は「保育日誌」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-013","q":"記録を行う時点はいつか。","answer":"観察した後に思い出して記録する","aliases":[],"explanation":"資料では、正答は「観察した後に思い出して記録する」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-014","q":"詳細に把握できるものの組合せはどれか。","answer":"個人の特徴と発達過程","aliases":[],"explanation":"資料では、正答は「個人の特徴と発達過程」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-015","q":"客観性に欠けやすい理由は何か。","answer":"記録者の主観や記憶に依存するため","aliases":[],"explanation":"資料では、正答は「記録者の主観や記憶に依存するため」と説明されている。","section":"42. 日誌法"},{"id":"jin2-s-016","q":"観察したい行動を事前にカテゴリー化し、出現のたびにチェックする方法は何か。","answer":"行動目録法","aliases":[],"explanation":"資料では、正答は「行動目録法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-017","q":"行動目録法の別名として挙げられているものは何か。","answer":"カテゴリー・チェック法","aliases":[],"explanation":"資料では、正答は「カテゴリー・チェック法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-018","q":"カテゴリー・システム法の別名として、組織的観察法のほかに挙げられているものは何か。","answer":"チェックリスト法","aliases":[],"explanation":"資料では、正答は「チェックリスト法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-019","q":"行動のカテゴリーを作る時点はいつか。","answer":"観察前","aliases":[],"explanation":"資料では、正答は「観察前」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-020","q":"事前に分類する行動の例として挙げられている組合せはどれか。","answer":"自発的関わりと受動的関わり","aliases":[],"explanation":"資料では、正答は「自発的関わりと受動的関わり」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-021","q":"該当する行動が見られるたびに何を行うか。","answer":"チェックして記録する","aliases":[],"explanation":"資料では、正答は「チェックして記録する」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-022","q":"カテゴリーごとに集計するものは何か。","answer":"生起頻度","aliases":[],"explanation":"資料では、正答は「生起頻度」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-023","q":"生起頻度の集計によって可能になる分析は何か。","answer":"数量的分析","aliases":[],"explanation":"資料では、正答は「数量的分析」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-024","q":"カテゴリー・システム法でよく用いられる標本化の方法は何か。","answer":"時間見本法","aliases":[],"explanation":"資料では、正答は「時間見本法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-025","q":"どのような仮説がある観察で用いられることが多いか。","answer":"明確な仮説","aliases":[],"explanation":"資料では、正答は「明確な仮説」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-026","q":"分析の妥当性を高めるため重要な準備は何か。","answer":"仮説に沿った適切なカテゴリーリストの作成","aliases":[],"explanation":"資料では、正答は「仮説に沿った適切なカテゴリーリストの作成」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-s-027","q":"行動を事前に設定した評価尺度に沿って数段階で評価する方法は何か。","answer":"評定尺度法","aliases":[],"explanation":"資料では、正答は「評定尺度法」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-028","q":"評定尺度法が記録するのは行動の頻度ではなく何か。","answer":"強さ・程度・印象","aliases":[],"explanation":"資料では、正答は「強さ・程度・印象」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-029","q":"授業態度の評価例で用いられる段階数はいくつか。","answer":"5つ","aliases":[],"explanation":"資料では、正答は「5つ」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-030","q":"授業態度の評価例として示された両極はどれか。","answer":"非常に消極的―非常に積極的","aliases":[],"explanation":"資料では、正答は「非常に消極的―非常に積極的」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-031","q":"『非常に消極的―非常に積極的』と並ぶ評定尺度法の評価例はどれか。","answer":"非常に退屈―非常に楽しい","aliases":[],"explanation":"資料では、正答は「非常に退屈―非常に楽しい」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-032","q":"評定結果が影響されやすいものは何か。","answer":"評定者の主観","aliases":[],"explanation":"資料では、正答は「評定者の主観」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-033","q":"信頼性や客観性を高めるため、評定者は何人にするか。","answer":"複数","aliases":[],"explanation":"資料では、正答は「複数」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-034","q":"複数の観察者は互いにどう評定するか。","answer":"独立して評定する","aliases":[],"explanation":"資料では、正答は「独立して評定する」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-035","q":"複数評定の結果から用いるものの組合せはどれか。","answer":"一致度と平均値","aliases":[],"explanation":"資料では、正答は「一致度と平均値」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-s-036","q":"行動や出来事を時間の流れに沿って詳しく記述する方法は何か。","answer":"行動描写法","aliases":["逸話記録法"],"explanation":"資料では、正答は「行動描写法」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-037","q":"自然観察法の別名は何か。","answer":"逸話記録法","aliases":[],"explanation":"資料では、正答は「逸話記録法」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-038","q":"把握しやすいものとして挙げられる三つは何か。","answer":"行動の背景・文脈・過程","aliases":[],"explanation":"資料では、正答は「行動の背景・文脈・過程」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-039","q":"詳細な記録があるため、後から何ができるか。","answer":"再検討","aliases":[],"explanation":"資料では、正答は「再検討」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-040","q":"自然観察法の欠点として多く必要になるものは何か。","answer":"時間と労力","aliases":[],"explanation":"資料では、正答は「時間と労力」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-041","q":"情報量が膨大になることで難しくなることの組合せは何か。","answer":"整理と分析","aliases":[],"explanation":"資料では、正答は「整理と分析」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-042","q":"行動目録法が適する分析は何か。","answer":"生起頻度を扱う量的分析","aliases":[],"explanation":"資料では、正答は「生起頻度を扱う量的分析」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-043","q":"行動描写法が適する分析は何か。","answer":"行動の質やプロセスを深く理解する質的分析","aliases":[],"explanation":"資料では、正答は「行動の質やプロセスを深く理解する質的分析」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-044","q":"行動の一部を切り取る組織的観察法と比べ、自然観察法が重視するものは何か。","answer":"質とプロセス","aliases":[],"explanation":"資料では、正答は「質とプロセス」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-045","q":"比較的自由で制限の少ない状況で対面し、会話と非言語表現から情報を集める方法は何か。","answer":"面接法","aliases":[],"explanation":"資料では、正答は「面接法」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-046","q":"面接で話し合いと同時に観察するものは何か。","answer":"非言語的な表現","aliases":[],"explanation":"資料では、正答は「非言語的な表現」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-047","q":"面接法の三種類の組合せはどれか。","answer":"構造化・半構造化・非構造化面接","aliases":[],"explanation":"資料では、正答は「構造化・半構造化・非構造化面接」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-048","q":"数量的データと比べて豊かに捉えられるものは何か。","answer":"対象者の内面","aliases":[],"explanation":"資料では、正答は「対象者の内面」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-049","q":"観察法から得るデータが限定されやすいものは何か。","answer":"その時点・場面","aliases":[],"explanation":"資料では、正答は「その時点・場面」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-050","q":"面接で話題を展開できる時間範囲はどれか。","answer":"過去・現在・未来","aliases":[],"explanation":"資料では、正答は「過去・現在・未来」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-051","q":"対象や領域が限られる原因となる依存性は何か。","answer":"言語への依存","aliases":[],"explanation":"資料では、正答は「言語への依存」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-052","q":"短所として保障されないとされるものは何か。","answer":"客観性","aliases":[],"explanation":"資料では、正答は「客観性」と説明されている。","section":"46. 面接法"},{"id":"jin2-s-053","q":"回答内容を方向づける危険があるのは誰の意識や態度か。","answer":"面接者","aliases":[],"explanati const STORAGE_KEY="personality-part2-short-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function revealAnswer(){
  const i=currentIndex();if(i===null||state.revealed)return;state.revealed=true;const q=questions[i];const typed=$('response').value.trim();
  $('feedback').innerHTML=`<div class="answerbox neutral"><b>正答</b><div>${escapeHtml(q.answer)}</div>${typed?`<div class="source">あなたの回答：${escapeHtml(typed)}</div>`:''}<div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('markrow').classList.remove('hidden');$('reveal').disabled=true;$('response').disabled=true;
}
function markShort(ok){if(state.answered)return;const i=currentIndex();if(i===null)return;state.answered=true;record(i,ok);$('markrow').classList.add('hidden');$('retry').disabled=false;$('history').textContent=historyText(rec(i));const box=$('feedback').firstElementChild;if(box){box.classList.remove('neutral');box.classList.add(ok?'ok':'bad');box.insertAdjacentHTML('afterbegin',`<b>${ok?'正解として記録しました':'不正解として記録しました'}</b>`);}}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('response').value='';$('response').disabled=true;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=true;$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;$('response').value='';$('response').disabled=false;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=false;$('retry').disabled=true;
}
render();
</script></body></html>
