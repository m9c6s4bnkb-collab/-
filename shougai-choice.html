<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>障害者・障害児心理学 301問</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#68707c;--line:#dde2e9;--accent:#2463eb;--good:#18794e;--bad:#c2413b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 14px 40px}
.top{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.96);backdrop-filter:blur(10px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:2px 0 4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.modes,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit}
.mode,.tool{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;color:var(--accent)}
.mode.active{background:#17181a;color:#fff;border-color:#17181a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat b{display:block;font-size:24px} .stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar{height:100%;width:0;background:#ff7a00;transition:.2s}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.q{font-size:18px;font-weight:800;line-height:1.65;white-space:pre-line;margin:8px 0 14px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;margin:8px 0;line-height:1.55;color:var(--text);font-weight:600}
.choice:hover{border-color:#b8c2d0}
.choice.selected{border:2px solid var(--accent);background:#eef4ff}
.choice.correct{border:2px solid #66b98c;background:#eaf8ef;color:#146c43}
.choice.wrong{border:2px solid #e59a95;background:#fff0ef;color:#a8322d}
.feedback{display:none;margin-top:12px;padding:11px;border-radius:11px;font-weight:800}
.feedback.good{display:block;background:#eaf8ef;color:var(--good)}
.feedback.bad{display:block;background:#fff0ef;color:var(--bad)}
.explain{display:none;margin-top:10px;background:#f7f9fc;border-radius:11px;padding:12px;line-height:1.7}
.explain.show{display:block}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.small{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;color:var(--accent);font-weight:700}
.next{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:800}
.empty{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);margin-top:18px}
@media(max-width:520px){
  .stats{grid-template-columns:1fr 1fr}
  .choice{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1>障害者・障害児心理学</h1><button class="tool" id="toggleMenu" type="button">▲ メニューを隠す</button></div>
    <div id="menuBody">
    <div class="sub">301問・再チェック最終版｜問題・答え・解説はそのまま</div>

    <div class="modes">
      <button class="mode active" data-mode="normal">通常</button>
      <button class="mode" data-mode="random">ランダム</button>
      <button class="mode" data-mode="wrong">間違えた問題</button>
      <button class="mode" data-mode="unanswered">未回答だけ</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="position">0/301</b><span>現在位置</span></div>
      <div class="stat"><b id="correctCount">0</b><span>正解</span></div>
      <div class="stat"><b id="wrongCount">0</b><span>不正解</span></div>
      <div class="stat"><b id="rate">0%</b><span>正答率</span></div>
    </div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="tools">
      <button class="tool" id="resetBtn">記録をリセット</button>
      <button class="tool" id="shuffleBtn">ランダム順を作り直す</button>
    </div>
    </div>
  </div>

  <div id="quiz"></div>
  <div class="empty" id="empty">このモードで表示する問題はありません。</div>
</div>

<script>
const Q = [{"q":"自閉症の原因論の変遷について、次の文の（　　）に入る時期を選べ。\n「（　　）には、脳機能障害を原因とし、中核症状は社会性の障害という見方が主流となった。」","choices":["3歳以前","30か月以内","1980年代後半","30か月"],"answer":2,"correct":"1980年代後半","explanation":"1980年代後半には脳機能障害を原因とし、中核症状は社会性の障害という見方が主流となった。"},{"q":"チック症の診断について、次の文の（　　）に入る最も適切な語句を選べ。\n「二種以上の運動チックと音声チックを有し、それが（　　）持続する状態をトゥレット症と呼ぶ。」","choices":["2年以上","1か月以上","6か月以上","1年以上"],"answer":3,"correct":"1年以上","explanation":"二種以上の運動チックと音声チックを有し、それが1年以上持続する状態をトゥレット症と呼ぶ。"},{"q":"場面緘黙の特徴について、次の文の（　　）に入る最も適切な内容を選べ。\n「場面緘黙は、発声器官等に明らかな器質的・機能的障害はないが、心理的要因により、（　　）状態を指す。」","choices":["特定の社会的状況では発話困難だが、家庭などでは通常の発話が可能","社会的状況を問わず発話困難で、家庭でも通常の発話がみられない","特定の社会的状況では通常に発話できるが、家庭でのみ発話困難となる","発声器官の器質的障害により、状況にかかわらず発話困難となる"],"answer":0,"correct":"特定の社会的状況では発話困難だが、家庭などでは通常の発話が可能","explanation":"場面緘黙は、発声器官等に明らかな器質的・機能的障害はないが、心理的要因により特定の社会的状況で発話困難を一貫して示し、家庭などでは通常の発話が可能な状態を指す。"},{"q":"ICFについて、次の文を完成させる語句はどれか。\n「ICFは（　　）にWHOが提唱した。」","choices":["2001年","1905年","2013年","2007年"],"answer":0,"correct":"2001年","explanation":"ICFは2001年にWHOが提唱した。"},{"q":"学習内容の応用について、次の説明の空欄に当てはまるものはどれか。\n「学習した内容を別の場面に応用することを（　　）という。」","choices":["般化","統合","参加","カナー"],"answer":0,"correct":"般化","explanation":"学習した内容を別の場面に応用することを般化という。"},{"q":"ディスレクシアについて、次の文を完成させる語句はどれか。\n「ディスレクシアは（　　）に起因する特異的学習障害と定義される。」","choices":["書字障害","視覚的弁別のつまずき","神経生物学的原因","推論・論理的思考の弱さ"],"answer":2,"correct":"神経生物学的原因","explanation":"ディスレクシアは神経生物学的原因に起因する特異的学習障害と定義される。"},{"q":"重複障害に関する資料の記述として、（　　）に入るものを選べ。\n「重複障害とは、盲・聾・知的障害・肢体不自由・病弱のうち（　　）をあわせ有することである。」","choices":["2つ以上","概念的スキル","重症心身障害児","先天性あるいは早期後天性の障害による知的発達の遅れ"],"answer":0,"correct":"2つ以上","explanation":"重複障害とは、盲・聾・知的障害・肢体不自由・病弱のうち2つ以上をあわせ有することである。"},{"q":"障害児教育の理念について、次の記述を完成させよ。\n「インテグレーションとは「（　　）」を意味する。」","choices":["統合","通常の学級","インテグレーション","特別支援教育"],"answer":0,"correct":"統合","explanation":"インテグレーションとは「統合」を意味する。"},{"q":"自閉症の類型について、次の説明の空欄に当てはまるものはどれか。\n「カナー型は言語表出がない、あるいは言葉の遅れがみられ、生後（　　）に出現するとされる。」","choices":["1980年代","3歳以前","IQ75〜80以上","30か月以内"],"answer":3,"correct":"30か月以内","explanation":"カナー型 const KEY = "shougai_301_progress_v1";
const letters = ["A","B","C","D"];
let state = loadState();
let mode = "normal";
let randomOrder = makeRandomOrder();

function loadState(){
  try{
    const x = JSON.parse(localStorage.getItem(KEY) || "{}");
    return {
      answers: x.answers || {},
      current: Number.isInteger(x.current) ? x.current : 0
    };
  }catch(e){
    return {answers: {}, current: 0};
  }
}

function saveState(){
  localStorage.setItem(KEY, JSON.stringify(state));
}

function makeRandomOrder(){
  const a = [...Array(Q.length).keys()];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getOrder(){
  if(mode==="random") return randomOrder;
  if(mode==="wrong"){
    return [...Array(Q.length).keys()].filter(i => state.answers[i] && state.answers[i].correct===false);
  }
  if(mode==="unanswered"){
    return [...Array(Q.length).keys()].filter(i => !state.answers[i]);
  }
  return [...Array(Q.length).keys()];
}

function stats(){
  const vals = Object.values(state.answers);
  const correct = vals.filter(x=>x.correct).length;
  const wrong = vals.filter(x=>!x.correct).length;
  const answered = correct + wrong;
  const rate = answered ? Math.round(correct/answered*100) : 0;
  return {correct,wrong,answered,rate};
}

function updateStats(order, pos){
  const s=stats();
  document.getElementById("correctCount").textContent=s.correct;
  document.getElementById("wrongCount").textContent=s.wrong;
  document.getElementById("rate").textContent=s.rate+"%";
  document.getElementById("position").textContent=(order.length ? (pos+1) : 0)+"/"+order.length;
  document.getElementById("bar").style.width=(s.answered/Q.length*100)+"%";
}

function render(){
  const order=getOrder();
  const quiz=document.getElementById("quiz");
  const empty=document.getElementById("empty");
  quiz.innerHTML="";
  if(!order.length){
    empty.style.display="block";
    updateStats(order,0);
    return;
  }
  empty.style.display="none";

  let pos = Math.min(state.current, order.length-1);
  if(pos<0) pos=0;
  state.current=pos;
  const qi=order[pos];
  const q=Q[qi];
  const rec=state.answers[qi];

  const card=document.createElement("section");
  card.className="card";
  card.innerHTML=`
    <div class="meta">問題 ${qi+1} / ${Q.length}</div>
    <div class="q">${escapeHtml(q.q).replace(/\n/g,"<br>")}</div>
    <div id="choices"></div>
    <div id="feedback" class="feedback"></div>
    <div id="explain" class="explain"><b>正解：${letters[q.answer]}. ${escapeHtml(q.correct)}</b><br><br>${escapeHtml(q.explanation)}</div>
    <div class="card-actions">
      <button class="small" id="prevBtn">← 前へ</button>
      <button class="small" id="showBtn">答え・解説を見る</button>
      <button class="next" id="nextBtn">次の問題へ →</button>
    </div>
  `;
  quiz.appendChild(card);

  const box=card.querySelector("#choices");
  q.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<b>${letters[i]}.</b> ${escapeHtml(c)}`;
    b.onclick=()=>answer(qi,i,b,card);
    if(rec){
      if(i===q.answer) b.classList.add("correct");
      if(i===rec.selected && rec.selected!==q.answer) b.classList.add("wrong");
      b.disabled=true;
    }
    box.appendChild(b);
  });

  if(rec){
    showResult(card,q,rec);
  }

  card.querySelector("#showBtn").onclick=()=>card.querySelector("#explain").classList.toggle("show");
  card.querySelector("#prevBtn").onclick=()=>{ if(state.current>0){state.current--;saveState();render();window.scrollTo(0,0);} };
  card.querySelector("#nextBtn").onclick=()=>{ if(state.current<order.length-1){state.current++;saveState();render();window.scrollTo(0,0);} };

  updateStats(order,pos);
}

function answer(qi,selected,btn,card){
  if(state.answers[qi]) return;
  const q=Q[qi];
  const ok=selected===q.answer;
  state.answers[qi]={selected,correct:ok};
  saveState();

  [...card.querySelectorAll(".choice")].forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add("correct");
    if(i===selected && !ok) b.classList.add("wrong");
  });
  showResult(card,q,state.answers[qi]);
  updateStats(getOrder(),state.current);
}

function showResult(card,q,rec){
  const f=card.querySelector("#feedback");
  if(rec.correct){
    f.className="feedback good";
    f.textContent="○ 正解！";
  }else{
    f.className="feedback bad";
    f.textContent="× 不正解";
  }
  card.querySelector("#explain").classList.add("show");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

document.querySelectorAll(".mode").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    mode=b.dataset.mode;
    state.current=0;
    saveState();
    render();
    window.scrollTo(0,0);
  };
});

document.getElementById("resetBtn").onclick=()=>{
  if(confirm("回答記録をすべてリセットしますか？")){
    state={answers:{},current:0};
    saveState();
    render();
  }
};

document.getElementById("shuffleBtn").onclick=()=>{
  randomOrder=makeRandomOrder();
  if(mode==="random"){state.current=0;saveState();render();}
};

render();

const tm=document.getElementById('toggleMenu'), mb=document.getElementById('menuBody'); if(tm&&mb){tm.addEventListener('click',()=>{const hide=mb.style.display!=='none';mb.style.display=hide?'none':'';tm.textContent=hide?'▼ メニューを表示':'▲ メニューを隠す';});}
</script>
