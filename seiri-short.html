:["アセチルコリン"],"exp":"アセチルコリン。","topic":"EDA","id":"psa_b4ae0e07c8ce"},{"q":"EDAの生起に関与する2つの脳領域を答えよ。","answers":["前部帯状回と扁桃体","前部帯状回、扁桃体"],"exp":"前部帯状回と扁桃体。","topic":"EDA","id":"psa_3e99532661b9"},{"q":"1分間あたりの心拍数を表す単位は何か。","answers":["bpm"],"exp":"bpm。","topic":"循環","id":"psa_13cf45113609"},{"q":"数秒以内に生じる心拍変化への関与が大きい神経は何か。","answers":["迷走神経"],"exp":"迷走神経。","topic":"循環","id":"psa_3d00193a5131"},{"q":"呼吸に伴う瞬時心拍数の変動を何というか。","answers":["呼吸性洞性不整脈","RSA"],"exp":"呼吸性洞性不整脈（RSA）。","topic":"循環","id":"psa_70533a30ff59"},{"q":"HRVで、高周波成分が主に反映する自律神経活動は何か。","answers":["副交感神経","迷走神経","副交感神経（迷走神経）"],"exp":"主に副交感神経（迷走神経）活動。","topic":"循環","id":"psa_752bdd9bef5f"},{"q":"能動的対処でCOが増加する血行力学的反応パターンを何というか。","answers":["心臓優位パターン"],"exp":"心臓優位パターン。","topic":"循環","id":"psa_8f7457537879"},{"q":"受動的対処でTPRが上昇する血行力学的反応パターンを何というか。","answers":["血管優位パターン"],"exp":"血管優位パターン。","topic":"循環","id":"psa_4165a0a662ea"},{"q":"燃え尽き症候群を提唱した人物は誰か。","answers":["フロイデンバーガー"],"exp":"フロイデンバーガー。","topic":"ストレス","id":"psa_0761a1b8b73a"},{"q":"血液容積脈の略称を答えよ。","answers":["BVP"],"exp":"BVP。","topic":"循環","id":"psa_7992d589fdd0"},{"q":"脈波が手首に到達するまでおよそ何msか。","answers":["150ms","約150ms","150㎳"],"exp":"約150ms。","topic":"循環","id":"psa_b80204c5f928"},{"q":"交感神経―副腎髄質系の略称は何か。","answers":["SAM系","SAM"],"exp":"SAM系。","topic":"ストレス","id":"psa_649eed68e03f"},{"q":"視床下部―下垂体―副腎系の略称は何か。","answers":["HPA系","HPA"],"exp":"HPA系。","topic":"ストレス","id":"psa_f3278e24f9c2"},{"q":"HPA系で視床下部の室傍核から分泌されるホルモンは何か。","answers":["CRH"],"exp":"CRH。","topic":"ストレス","id":"psa_27f5670ef3e2"},{"q":"HPA系で下垂体前葉から分泌されるホルモンは何か。","answers":["ACTH"],"exp":"ACTH。","topic":"ストレス","id":"psa_2735ea912e7d"},{"q":"HPA系で副腎皮質から分泌されるホルモンは何か。","answers":["コルチゾール"],"exp":"コルチゾール。","topic":"ストレス","id":"psa_51151a9a42e8"},{"q":"筋活動電位を記録したものを何というか。","answers":["筋電図","EMG"],"exp":"筋電図（EMG）。","topic":"生理計測","id":"psa_e937b6b0c770"},{"q":"生理反応を視覚・聴覚などで提示し自己調整を促す技法を何というか。","answers":["バイオ・フィードバック療法","バイオフィードバック療法","バイオフィードバック"],"exp":"バイオ・フィードバック療法。","topic":"生理計測","id":"psa_f9b46dc38097"},{"q":"閉眼安静時に8～13Hz程度でみられる脳波は何か。","answers":["α波","アルファ波"],"exp":"α波。","topic":"脳波","id":"psa_4ecc38aa2489"},{"q":"精神活動時に13Hz以上でみられる速波は何か。","answers":["β波","ベータ波"],"exp":"β波。","topic":"脳波","id":"psa_93d7c976d681"},{"q":"入眠時に4～7Hz程度でみられる脳波は何か。","answers":["θ波","シータ波"],"exp":"θ波。","topic":"脳波","id":"psa_9504e4474e2c"},{"q":"4Hz以下で、深い睡眠にみられる脳波は何か。","answers":["δ波","デルタ波"],"exp":"δ波。","topic":"脳波","id":"psa_3ff0f21382ad"},{"q":"睡眠段階2で出現する12～14Hzの特徴的な波を何というか。","answers":["紡錘波"],"exp":"紡錘波。","topic":"脳波","id":"psa_c5b67ce00494"},{"q":"てんかん性異常波のうち、皮質のてんかん焦点から生じた発作発射が頭皮上へ伝播した鋭い突発波を何というか。","answers":["棘波"],"exp":"棘波。","topic":"脳波","id":"psa_fc6deee5b8b6"},{"q":"特定事象の前後の脳電位を加算平均して測定する電位を何というか。","answers":["事象関連電位","ERP"],"exp":"事象関連電位（ERP）。","topic":"ERP","id":"psa_2b11b002d536"},{"q":"刺激提示後およそ300～900msに出現し、頭頂部で大きい陽性ERP成分は何か。","answers":["P3","P300"],"exp":"P3（P300）。","topic":"ERP","id":"psa_0cfd0e062990"},{"q":"P3を典型的に測定する課題は何か。","answers":["オドボール課題"],"exp":"オドボール課題。","topic":"ERP","id":"psa_ca3b7bc43ede"},{"q":"警告刺激の後、命令刺激を待つ間に記録される緩やかな陰性電位は何か。","answers":["随伴性陰性変動","CNV"],"exp":"随伴性陰性変動（CNV）。","topic":"ERP","id":"psa_ef5572325b09"},{"q":"随意運動の500～1000ms前から始まり、運動開始点で頂点に達する電位は何か。","answers":["運動準備電位"],"exp":"運動準備電位。","topic":"ERP","id":"psa_5858c9e11d53"},{"q":"注意を向けた音刺激で振幅が増大しやすい陰性ERP成分は何か。","answers":["処理陰性電位","PN","Nd"],"exp":"処理陰性電位（PN/Nd）。","topic":"ERP","id":"psa_9531ca9fe01e"},{"q":"標準刺激の中に逸脱刺激が出たときに生じる陰性ERP成分は何か。","answers":["ミスマッチ陰性電位","MMN"],"exp":"ミスマッチ陰性電位（MMN）。","topic":"ERP","id":"psa_f3b0816ca6cb"},{"q":"情動刺激への持続的注意・評価を反映するとされる、400～1000ms頃の陽性ERP成分は何か。","answers":["後期陽性成分","LPP"],"exp":"後期陽性成分（LPP）。","topic":"ERP","id":"psa_357a0ca9d013"},{"q":"誤反応直後に前頭部正中線付近でみられ、誤り検出に関係する陰性ERP成分は何か。","answers":["エラー関連陰性電位","ERN"],"exp":"エラー関連陰性電位（ERN）。","topic":"ERP","id":"psa_a2a963fe6aff"},{"q":"文脈から逸脱する単語に対して約400msで出現する陰性電位は何か。","answers":["N400"],"exp":"N400。","topic":"ERP","id":"psa_e059ffce2f5c"},{"q":"ホメオスタシスの例で、人間の体温はおよそ何℃に保たれるとされるか。","answers":["36℃","約36℃","36℃程度"],"exp":"36℃程度。","topic":"生理基礎","id":"psa_956b27432585"},{"q":"闘争―逃走反応では、胃腸の運動はどのように変化するか。","answers":["抑制","抑制される"],"exp":"胃腸運動は抑制される。","topic":"生理基礎","id":"psa_ab97663b22f3"},{"q":"皮膚電気活動は、どの種類の発汗を電気的に捉えたものか。","answers":["精神性発汗"],"exp":"精神性発汗。","topic":"EDA","id":"psa_b47151483f15"},{"q":"不安患者のSCLは、安静時・音呈示の両セッションでどのような変化を示したか。","answers":["軽度の連続上昇","軽度に連続上昇","連続上昇"],"exp":"軽度の連続上昇。","topic":"EDA","id":"psa_5c82dc7cbc1f"},{"q":"心臓の心房には、どの自律神経が分布するか。","answers":["両方","交感神経と副交感神経","交感神経・副交感神経"],"exp":"交感神経と副交感神経の両方。","topic":"循環","id":"psa_04ed34ca9340"},{"q":"心室には主にどちらの自律神経が分布するか。","answers":["交感神経"],"exp":"心室にはほとんど交感神経が分布する。","topic":"循環","id":"psa_3fd0e0625bb1"},{"q":"心拍数の変化に交感・副交感の両方が関与する理由として、ペースメーカーは心臓のどこにあるとされるか。","answers":["右心房"],"exp":"右心房。","topic":"循環","id":"psa_5f0260947b80"},{"q":"不快刺激を予測した際、中性画像にも大きな定位反応がみられることは、脅威状況で何をする適応的反応と説明されるか。","answers":["刺激に注意を向けて確認する","注意を向けて確認する"],"exp":"刺激に注意を向けて確認する反応。","topic":"循環","id":"psa_6340d7745b9e"},{"q":"呼吸性洞性不整脈で、呼気相ではどちらの自律神経が優位となるか。","answers":["副交感神経","副交感神経（迷走神経）","迷走神経"],"exp":"副交感神経優位となる。","topic":"循環","id":"psa_8e2a919898c4"},{"q":"HRVの低周波成分は、どの自律神経の影響を反映するか。","answers":["両方","交感神経と副交感神経","交感・副交感神経の両方"],"exp":"両方の影響を反映する。","topic":"循環","id":"psa_3853a9b5af85"},{"q":"プラセボ効果は、新薬の効果検証でどのように扱うべきか。","answers":["ある","必要がある","統制する必要がある"],"exp":"統制する必要がある。","topic":"ストレス","id":"psa_84e3ebdb9bc2"},{"q":"SAM系で分泌される2つのカテコールアミンを答えよ。","answers":["アドレナリンとノルアドレナリン","アドレナリン、ノルアドレナリン"],"exp":"アドレナリンとノルアドレナリン。","topic":"ストレス","id":"psa_bf5572431766"},{"q":"分泌型免疫グロブリンAは、急性ストレス下でどのように変化する報告が多いか。","answers":["上昇","上昇する"],"exp":"急性ストレスでは上昇。","topic":"ストレス","id":"psa_8fe90b9f0331"},{"q":"分泌型免疫グロブリンAは、慢性ストレス状態でどのように変化する報告が多いか。","answers":["低下","低下する"],"exp":"慢性ストレスでは低下。","topic":"ストレス","id":"psa_babf258f88e0"},{"q":"神経末端からアセチルコリンが放出された後、筋線維のどの部位が脱分極するか。","answers":["終板部","筋線維の終板部"],"exp":"終板部が脱分極する。","topic":"生理計測","id":"psa_c68016e69063"},{"q":"書痙は、他人の目を意識して上手に書こうとすると症状がどのように変化するか。","answers":["強くなる","増強する","強くなることがある"],"exp":"強くなるとされる。","topic":"生理計測","id":"psa_da8c14903821"},{"q":"脳波を記録するとき、縦軸と横軸はそれぞれ何か。","answers":["縦軸が電位、横軸が時間","電位、時間","縦軸電位横軸時間"],"exp":"縦軸は電位、横軸は時間。","topic":"脳波","id":"psa_f6aab1b4b46e"},{"q":"睡眠段階1で現れる低振幅徐波の周波数は何Hzか。","answers":["2～7Hz","2〜7Hz","2-7Hz"],"exp":"2～7Hz。","topic":"脳波","id":"psa_d0869518bc01"},{"q":"てんかんの原因が不明とされる割合はおよそ何％か。","answers":["40％","約40％","40%"],"exp":"約40％。","topic":"脳波","id":"psa_94df79730263"},{"q":"ERP成分を定義する4つの要素を答えよ。","answers":["潜時、極性、頭皮上分布、実験変数への応答性","潜時極性頭皮上分布実験変数への応答性"],"exp":"潜時・極性・頭皮上分布・実験変数への応答性。","topic":"ERP","id":"psa_91006b6a20dd"},{"q":"P3の振幅に影響すると2つの要因を答えよ。","answers":["刺激の出現確率と自己関連性","出現確率と自己関連性","刺激の出現確率、自己関連性"],"exp":"刺激の出現確率と自己関連性。","topic":"ERP","id":"psa_17620b5eead3"},{"q":"随伴性陰性変動に関与すると指摘される心理機能を2つ以上答えよ。","answers":["注意、覚醒","注意と覚醒","意欲、記憶","意欲と記憶","注意、覚醒、意欲、記憶"],"exp":"注意・覚醒・意欲（動機づけ）・記憶など。","topic":"ERP","id":"psa_e604d1576ee4"},{"q":"運動準備電位は、中心部の何野で発生するとされるか。","answers":["運動野"],"exp":"中心部の運動野。","topic":"ERP","id":"psa_a59e54a73edd"},{"q":"運動準備電位は、他動運動ではどのようになるか。","answers":["出現しない","しない","出現しない。"],"exp":"他動運動では出現しない。","topic":"ERP","id":"psa_1d2ec0a512f5"},{"q":"処理陰性電位の初期成分は、何のフィルター機構と関連するとされるか。","answers":["選択的注意","選択的注意のフィルター機構"],"exp":"選択的注意のフィルター機構。","topic":"ERP","id":"psa_550bc8728e0b"},{"q":"MMNは、音のどのような変化に応じて生じるか。ものを2つ以上答えよ。","answers":["高さ、強度","高さと強度","持続時間、位置","持続時間と位置","高さ、強度、持続時間、位置"],"exp":"高さ・強度・持続時間・位置など。","topic":"ERP","id":"psa_d41be9ba4b2d"},{"q":"MMNは刺激間隔がおよそ何秒以上になると、ほとんど観察できなくなるとされるか。","answers":["10秒","10秒以上","約10秒"],"exp":"10秒以上。","topic":"ERP","id":"psa_5a5b5eb2e3b3"},{"q":"LPPは主に頭皮上のどの部位で優位に観察されるか。","answers":["頭頂部"],"exp":"頭頂部優位。","topic":"ERP","id":"psa_9d388c16ea1a"},{"q":"ERNの主な起源とされる皮質はどこか。","answers":["前部帯状皮質"],"exp":"前部帯状皮質。","topic":"ERP","id":"psa_40941229e45e"},{"q":"N400は、中心部からどの部位にかけて優位に出現するとされるか。","answers":["頭頂部","中心-頭頂部","中心‐頭頂部"],"exp":"中心―頭頂部優位。","topic":"ERP","id":"psa_d3148bf084b2"}];const STORAGE_KEY="quiz_seiri_short_v20260914b";
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．.、()（）\[\]【】「」『』:：;；/\\\-−―ー]/g,'')}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return {}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function rec(q){if(!state[q.id])state[q.id]={attempts:0,correct:0,wrong:0,last:null};return state[q.id]}
function fisher(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state=loadState(),filter='all',randomMode=false,order=QUESTIONS.map((_,i)=>i),idx=0,activeQi=null;
let session={answered:0,correct:0,wrong:0};
function matches(i){let r=rec(QUESTIONS[i]);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function listNow(){return order.filter(matches)}
function updateStats(){let done=0,wrong=0;QUESTIONS.forEach(q=>{let r=rec(q);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+QUESTIONS.length;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=listNow().length+'問表示'}
function setFilter(v){filter=v;idx=0;activeQi=null;resetView();render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;activeQi=null;resetView();document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;activeQi=null;resetView();render()}}
function selectActive(){let list=listNow();if(!list.length){activeQi=null;return null}if(idx>=list.length)idx=0;if(activeQi===null)activeQi=list[idx];return activeQi}
function move(d){let list=listNow();resetView();activeQi=null;if(!list.length){idx=0;render();return}idx=(idx+d+list.length)%list.length;render()}

let revealed=false,judged=false,userAns='';
function resetView(){revealed=false;judged=false;userAns=''}
function record(ok){if(activeQi===null)return;let r=rec(QUESTIONS[activeQi]);r.attempts++;session.answered++;if(ok){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState()}
function check(){if(revealed||activeQi===null)return;let q=QUESTIONS[activeQi];userAns=(document.getElementById('ans')||{value:''}).value;let ok=q.answers.some(a=>norm(a)===norm(userAns));record(ok);revealed=true;judged=true;render()}
function showAnswer(){if(revealed)return;userAns=(document.getElementById('ans')||{value:''}).value;revealed=true;judged=false;render()}
function selfJudge(ok){if(judged)return;record(ok);judged=true;render()}
function retry(){revealed=false;judged=false;userAns='';render()}
function render(){updateStats();let card=document.getElementById('card');let qi=selectActive();if(qi===null){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}let q=QUESTIONS[qi],area='';if(!revealed){area=`<div class="shortInput"><input id="ans" autocomplete="off" placeholder="答えを入力" onkeydown="if(event.key==='Enter')check()"><button class="primary" onclick="check()">判定する</button></div><div class="selfrow"><button onclick="showAnswer()">答えを見る（自己採点）</button></div>`}else{let r=rec(q);area=`<div class="feedback ${judged?(r.last==='correct'?'good':'bad'):''}"><div class="answer">正解例：${q.answers[0]}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>${!judged?'<div class="selfrow"><button onclick="selfJudge(true)">自分では正解</button><button onclick="selfJudge(false)">自分では不正解</button></div>':''}`}let list=listNow();let pos=list.indexOf(qi);let label=pos>=0?`${pos+1} / ${list.length}`:'解答済み（現在のフィルタ対象外）';card.innerHTML=`<div class="qno">${label}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div>${area}<div class="nav"><button onclick="move(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="move(1)">次へ →</button></div>`;if(!revealed)setTimeout(()=>{let x=document.getElementById('ans');if(x)x.focus()},20);updateStats()}
render();</script></body></html>
