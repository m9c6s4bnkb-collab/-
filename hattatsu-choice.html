opic": "具体的操作期"}, {"q": "形式的操作期に可能となる思考は何か。", "choices": ["脱中心化", "保存の概念", "仮説演繹的思考", "同一性"], "answer": 2, "correct": "仮説演繹的思考", "explanation": "", "topic": "形式的操作期"}, {"q": "養育者を拠点に外界を探索するとき、その養育者の役割を何というか。", "choices": ["定位行動", "安全基地", "接近行動", "発信行動"], "answer": 1, "correct": "安全基地", "explanation": "", "topic": "愛着"}, {"q": "サリーとアン課題で知られる研究者は誰か。", "choices": ["バロン＝コーエンら", "ウィニコット", "コールバーグ", "ヴィゴツキー"], "answer": 0, "correct": "バロン＝コーエンら", "explanation": "", "topic": "心の理論"}, {"q": "条件刺激だけで生じるようになった反射を何というか。", "choices": ["無条件刺激", "内制止", "条件反応", "消去"], "answer": 2, "correct": "条件反応", "explanation": "", "topic": "レスポンデント条件付け"}, {"q": "パブロフは消去を何による反応抑制と考えたか。", "choices": ["条件反応", "内制止", "弁別（分化）", "自発的回復"], "answer": 1, "correct": "内制止", "explanation": "", "topic": "自発的回復"}, {"q": "オペラント条件付けの別名は何か。", "choices": ["レスポンデント条件付け", "観察学習", "道具的条件付け", "スキナー"], "answer": 2, "correct": "道具的条件付け", "explanation": "", "topic": "オペラント条件付け"}, {"q": "情報処理モデルで知識・記憶・思考は何リソースか。", "choices": ["構成主義", "状況主義", "内的リソース", "外的リソース"], "answer": 2, "correct": "内的リソース", "explanation": "", "topic": "認知主義"}, {"q": "情報処理モデルで道具や他者は何リソースか。", "choices": ["構成主義", "認知主義", "外的リソース", "状況主義"], "answer": 2, "correct": "外的リソース", "explanation": "", "topic": "認知主義"}]; const KEY="devlearn_rebuilt_278_v1"; const letters=["A","B","C","D"]; let mode="normal",randomOrder=makeRandomOrder(),state=loadState();
function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return {answers:x.answers||{},current:Number.isInteger(x.current)?x.current:0,menuHidden:!!x.menuHidden};}catch(e){return {answers:{},current:0,menuHidden:false};}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function makeRandomOrder(){const a=[...Array(Q.length).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getOrder(){if(mode==="random")return randomOrder;if(mode==="wrong")return [...Array(Q.length).keys()].filter(i=>state.answers[i]&&state.answers[i].correct===false);if(mode==="unanswered")return [...Array(Q.length).keys()].filter(i=>!state.answers[i]);return [...Array(Q.length).keys()];}
function st(){const v=Object.values(state.answers),c=v.filter(x=>x.correct).length,w=v.filter(x=>!x.correct).length,a=c+w;return {c,w,a,r:a?Math.round(c/a*100):0};}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function upd(ord,pos){const s=st();position.textContent=(ord.length?(pos+1):0)+"/"+ord.length;correctCount.textContent=s.c;wrongCount.textContent=s.w;rate.textContent=s.r+"%";bar.style.width=(s.a/Q.length*100)+"%";}
function result(card,rec){const f=card.querySelector("#feedback");f.className="feedback "+(rec.correct?"good":"bad");f.textContent=rec.correct?"○ 正解！":"× 不正解";card.querySelector("#explain").classList.add("show");}
function answer(qi,sel,card){if(state.answers[qi])return;const q=Q[qi],ok=sel===q.answer;state.answers[qi]={selected:sel,correct:ok};saveState();[...card.querySelectorAll(".choice")].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===sel&&!ok)b.classList.add("wrong");});result(card,state.answers[qi]);upd(getOrder(),state.current);}
function render(){const ord=getOrder(),quiz=document.getElementById("quiz"),empty=document.getElementById("empty");quiz.innerHTML="";if(!ord.length){empty.style.display="block";upd(ord,0);return;}empty.style.display="none";state.current=Math.min(state.current,ord.length-1);const qi=ord[state.current],q=Q[qi],rec=state.answers[qi];const card=document.createElement("section");card.className="card";card.innerHTML=`<div class="meta">問題 ${qi+1} / ${Q.length}</div><div class="q">${esc(q.q).replace(/\n/g,"<br>")}</div><div id="choices"></div><div id="feedback" class="feedback"></div><div id="explain" class="explain"><b>正解：${letters[q.answer]}. ${esc(q.correct)}</b><br><br>${esc(q.explanation)}</div><div class="card-actions"><button class="small" id="prevBtn">← 前へ</button><button class="small" id="showBtn">答え・解説を見る</button><button class="next" id="nextBtn">次の問題へ →</button></div>`;quiz.appendChild(card);const box=card.querySelector("#choices");q.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${letters[i]}.</b> ${esc(c)}`;b.onclick=()=>answer(qi,i,card);if(rec){b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===rec.selected&&i!==q.answer)b.classList.add("wrong");}box.appendChild(b);});if(rec)result(card,rec);card.querySelector("#showBtn").onclick=()=>card.querySelector("#explain").classList.toggle("show");card.querySelector("#prevBtn").onclick=()=>{if(state.current>0){state.current--;saveState();render();scrollTo(0,0);}};card.querySelector("#nextBtn").onclick=()=>{if(state.current<ord.length-1){state.current++;saveState();render();scrollTo(0,0);}};upd(ord,state.current);}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;state.current=0;saveState();render();scrollTo(0,0);});
resetBtn.onclick=()=>{if(confirm("回答記録をすべてリセットしますか？")){state.answers={};state.current=0;saveState();render();}};shuffleBtn.onclick=()=>{randomOrder=makeRandomOrder();if(mode==="random"){state.current=0;saveState();render();}};
function applyMenu(){menuBody.classList.toggle("hidden",state.menuHidden);toggleMenu.textContent=state.menuHidden?"▼ メニューを表示":"▲ メニューを隠す";}toggleMenu.onclick=()=>{state.menuHidden=!state.menuHidden;saveState();applyMenu();};applyMenu();render();
</script></body></html>
