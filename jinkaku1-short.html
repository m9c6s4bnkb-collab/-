<script>const questions=[{"id":"jin1-s-001","q":"自分一人では気づきにくい『自分らしさ』を捉える観点を何というか。","answer":"自己理解の視点","aliases":[],"explanation":"資料では、正答は「自己理解の視点」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-002","q":"自分にとってあまりになじみ深い人格上の特徴は、何のように当然であるため改めて意識されにくいか。","answer":"空気","aliases":[],"explanation":"資料では、正答は「空気」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-003","q":"自分の内面・態度・行動を映し出すものとして必要だとされる比喩は何か。","answer":"鏡","aliases":[],"explanation":"資料では、正答は「鏡」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-004","q":"自分の位置づけを知る方法として資料が挙げるものは何か。","answer":"他者との比較","aliases":[],"explanation":"資料では、正答は「他者との比較」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-005","q":"周囲の人から意見や反応を受け取って自分を知る方法は何か。","answer":"他者からのフィードバック","aliases":[],"explanation":"資料では、正答は「他者からのフィードバック」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-006","q":"『自分らしさ』が顕在化する場として、資料が重視するものは何か。","answer":"他者との関わり合い","aliases":[],"explanation":"資料では、正答は「他者との関わり合い」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-007","q":"自分自身の姿を客観的に捉えるために通すものは何か。","answer":"他者という鏡","aliases":[],"explanation":"資料では、正答は「他者という鏡」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-008","q":"自覚されている面とともに『自分らしさ』がもつものは何か。","answer":"自分では自覚しにくい側面","aliases":[],"explanation":"資料では、正答は「自分では自覚しにくい側面」と説明されている。","section":"1. 自己理解の視点"},{"id":"jin1-s-009","q":"対人関係における相互的な認識過程を表すモデルを提唱した人物は誰か。","answer":"ルフトとインガム","aliases":[],"explanation":"資料では、正答は「ルフトとインガム」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-010","q":"自己と他者の認識を『知っている／知らない』で整理するモデルを何というか。","answer":"ジョハリの窓","aliases":[],"explanation":"資料では、正答は「ジョハリの窓」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-011","q":"ジョハリの窓が自己理解・他者理解に用いる認識の軸はいくつか。","answer":"2つ","aliases":[],"explanation":"資料では、正答は「2つ」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-012","q":"ジョハリの窓で分類される自己の領域はいくつか。","answer":"4つ","aliases":[],"explanation":"資料では、正答は「4つ」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-013","q":"自分も他者も知っている公的な『私』に当たる領域はどれか。","answer":"開放領域","aliases":[],"explanation":"資料では、自分も他者も知っている公的な『私』に当たるのは「開放領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-s-014","q":"自分は知っているが他者には知られていない私的な『私』に当たる領域はどれか。","answer":"隠蔽領域","aliases":[],"explanation":"資料では、自分は知っているが他者には知られていない私的な『私』に当たるのは「隠蔽領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-s-015","q":"他者だけが知り、自分では気づいていない『私』に当たる領域はどれか。","answer":"盲点領域","aliases":[],"explanation":"資料では、他者だけが知り、自分では気づいていない『私』に当たるのは「盲点領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-s-016","q":"自分も他者も気づいていない無意識下の『私』に当たる領域はどれか。","answer":"未知領域","aliases":[],"explanation":"資料では、自分も他者も気づいていない無意識下の『私』に当たるのは「未知領域」である。","section":"2. ジョハリの窓"},{"id":"jin1-s-017","q":"開放領域を広げる3作用のうち、自分が知っている情報を他者へ伝える作用は何か。","answer":"自己開示","aliases":[],"explanation":"資料では、正答は「自己開示」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-018","q":"開放領域を広げる3作用のうち、他者が把握している自分の特徴を伝えてもらう作用は何か。","answer":"フィードバック","aliases":[],"explanation":"資料では、正答は「フィードバック」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-019","q":"開放領域を広げる3作用のうち、自分も他者も知らなかった側面が明らかになる作用は何か。","answer":"発見","aliases":[],"explanation":"資料では、正答は「発見」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-020","q":"3つの作用によって広がる領域はどれか。","answer":"開放領域","aliases":[],"explanation":"資料では、正答は「開放領域」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-021","q":"開放領域が広がると、他の領域はどうなるか。","answer":"小さくなる","aliases":[],"explanation":"資料では、正答は「小さくなる」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-022","q":"開放領域の拡大によって深まるものの組合せはどれか。","answer":"対人関係と自己理解","aliases":[],"explanation":"資料では、正答は「対人関係と自己理解」と説明されている。","section":"2. ジョハリの窓"},{"id":"jin1-s-023","q":"人の知覚を、外界を受動的に写すだけではないと説明する際、否定される比喩は何か。","answer":"カメラ","aliases":[],"explanation":"資料では、正答は「カメラ」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-024","q":"人が情報を照合するものとして挙げられているのは何か。","answer":"過去の経験","aliases":[],"explanation":"資料では、正答は「過去の経験」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-025","q":"人は情報を補足・加工しながら、何を主体的・能動的に構成するか。","answer":"認知的世界","aliases":[],"explanation":"資料では、正答は「認知的世界」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-026","q":"認知の歪みは、どの程度単純な刺激でも生じ得るか。","answer":"単なる図形のような刺激","aliases":[],"explanation":"資料では、正答は「単なる図形のような刺激」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-027","q":"人間という対象は、単純な図形と比べてどのような刺激だとされるか。","answer":"はるかに複雑な情緒刺激","aliases":[],"explanation":"資料では、正答は「はるかに複雑な情緒刺激」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-028","q":"他者に関する情報を歪めやすい主観的フィルターとして、資料に挙げられている組合せはどれか。","answer":"価値観・先入観・感情・見方のくせ","aliases":[],"explanation":"資料では、正しい組合せは「価値観・先入観・感情・見方のくせ」である。","section":"3. 他者理解の視点"},{"id":"jin1-s-029","q":"正当な他者把握を妨げやすいものの総称として、資料が用いる表現は何か。","answer":"主観的なフィルター","aliases":[],"explanation":"資料では、正答は「主観的なフィルター」と説明されている。","section":"3. 他者理解の視点"},{"id":"jin1-s-030","q":"性格や人格が初めて観察可能になるのは、何に反映されたときか。","answer":"行動","aliases":[],"explanation":"資料では、正答は「行動」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-031","q":"人間の行動を変化させる環境条件の例として、資料に挙げられているものはどれか。","answer":"暑さ","aliases":[],"explanation":"資料では、正答は「暑さ」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-032","q":"疲労と並び、環境条件による行動変化の例として資料に挙げられているものは何か。","answer":"空腹","aliases":[],"explanation":"資料では、正答は「空腹」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-033","q":"類似した環境下で多くの人に共通して現れる面を何というか。","answer":"共通性","aliases":[],"explanation":"資料では、正答は「共通性」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-034","q":"類似した環境下でも人によって異なって現れる面を何というか。","answer":"個人差","aliases":[],"explanation":"資料では、正答は「個人差」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-035","q":"同一状況下でさえ生じる差異を表す資料中の表現は何か。","answer":"個人的な差異","aliases":[],"explanation":"資料では、正答は「個人的な差異」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-036","q":"人格の通状況的一貫性とは、状況が変わっても個人独自に何が現れることか。","answer":"一貫した特徴","aliases":[],"explanation":"資料では、正答は「一貫した特徴」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-037","q":"パーソナリティ概念によって行うこととして挙げられている組合せはどれか。","answer":"個人の独自性の理解・説明・予測","aliases":[],"explanation":"資料では、正答は「個人の独自性の理解・説明・予測」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-038","q":"変容する環境の中でも保たれる核心を表す言葉は何か。","answer":"その人らしさ","aliases":[],"explanation":"資料では、正答は「その人らしさ」と説明されている。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-039","q":"パーソナリティを三層構造で捉えた人物は誰か。","answer":"大山","aliases":[],"explanation":"資料では、正答は「大山」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-040","q":"人格を示す三層構造を構成する概念の組合せはどれか。","answer":"気質・性格・人格","aliases":[],"explanation":"資料では、正答は「気質・性格・人格」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-041","q":"気分・テンポ・刺激への感受性など、生物学的側面が強い先天的な基礎部分を指す概念はどれか。","answer":"気質","aliases":[],"explanation":"資料では、気分・テンポ・刺激への感受性など、生物学的側面が強い先天的な基礎部分に当たるのは「気質」である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-042","q":"個人を特徴づける、ある程度固定的で恒常的な基本的行動傾向を指す概念はどれか。","answer":"性格","aliases":[],"explanation":"資料では、その人を特徴づける、ある程度固定的で恒常的な基本的行動傾向に当たるのは「性格」である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-043","q":"環境への適応機能を含む、個人の心身システムの動的で全体的な組織を指す概念はどれか。","answer":"人格","aliases":[],"explanation":"資料では、環境への適応機能を含む、個人の心身システムの動的で全体的な組織に当たるのは「人格」である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-044","q":"一定原理に基づく典型へ多様な性格を分類する考え方を指す概念はどれか。","answer":"類型","aliases":[],"explanation":"資料では、一定原理に基づく典型へ多様な性格を分類する考え方に当たるのは「類型」である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-045","q":"先天的な性格の土台に位置づけられるものはどれか。","answer":"気質","aliases":[],"explanation":"資料では、正答は「気質」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-046","q":"知能や価値観まで包含する、性格より広い概念はどれか。","answer":"人格","aliases":[],"explanation":"資料では、正答は「人格」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-047","q":"先天的な土台から統合的全体像へ至る順序として正しいものはどれか。","answer":"気質→性格→人格","aliases":[],"explanation":"資料では、正答は「気質→性格→人格」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-048","q":"個人の行動や思考を決定するとされるものは何か。","answer":"心身システムのダイナミックな組織","aliases":[],"explanation":"資料では、正答は「心身システムのダイナミックな組織」と説明されている。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-049","q":"頭蓋骨の形から性格を分類する方法はどれか。","answer":"骨相学","aliases":[],"explanation":"資料では、頭蓋骨の形から性格を分類する方法に当たるのは「骨相学」である。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-050","q":"顔や身体的特徴から人格を推測する方法はどれか。","answer":"人相学","aliases":[],"explanation":"資料では、顔や身体的特徴から人格を推測する方法に当たるのは「人相学」である。","secti ":"身体感覚をぴったり表現するイメージや名前はどれか。","answer":"ハンドル","aliases":[],"explanation":"資料では、身体感覚をぴったり表現するイメージや名前に当たるのは「ハンドル」である。","section":"40. フォーカシング"},{"id":"jin1-s-422","q":"身体感覚と表現が一致したときに生じる『これだ！』という感じへの変化はどれか。","answer":"フェルトシフト","aliases":[],"explanation":"資料では、身体感覚と表現が一致したときに生じる『これだ！』という感じへの変化に当たるのは「フェルトシフト」である。","section":"40. フォーカシング"},{"id":"jin1-s-423","q":"無意識内で感情によって一つにまとまった集合体はどれか。","answer":"コンプレックス","aliases":[],"explanation":"資料では、無意識内で感情によって一つにまとまった集合体に当たるのは「コンプレックス」である。","section":"40. フォーカシング"},{"id":"jin1-s-424","q":"身体感覚が感じられるまで行うことは何か。","answer":"待つ","aliases":[],"explanation":"資料では、正答は「待つ」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-s-425","q":"フェルトセンスに対して探すものは何か。","answer":"ぴったり表現するイメージや名前","aliases":[],"explanation":"資料では、正答は「ぴったり表現するイメージや名前」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-s-426","q":"フェルトシフトの実感によって得られるものは何か。","answer":"新たな気づき","aliases":[],"explanation":"資料では、正答は「新たな気づき」と説明されている。","section":"40. フォーカシング"},{"id":"jin1-s-427","q":"新たな気づきをどうすることで効果が発揮されるか。","answer":"受容する","aliases":[],"explanation":"資料では、正答は「受容する」と説明されている。","section":"40. フォーカシング"}];const STORAGE_KEY="personality-part1-short-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function revealAnswer(){
  const i=currentIndex();if(i===null||state.revealed)return;state.revealed=true;const q=questions[i];const typed=$('response').value.trim();
  $('feedback').innerHTML=`<div class="answerbox neutral"><b>正答</b><div>${escapeHtml(q.answer)}</div>${typed?`<div class="source">あなたの回答：${escapeHtml(typed)}</div>`:''}<div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('markrow').classList.remove('hidden');$('reveal').disabled=true;$('response').disabled=true;
}
function markShort(ok){if(state.answered)return;const i=currentIndex();if(i===null)return;state.answered=true;record(i,ok);$('markrow').classList.add('hidden');$('retry').disabled=false;$('history').textContent=historyText(rec(i));const box=$('feedback').firstElementChild;if(box){box.classList.remove('neutral');box.classList.add(ok?'ok':'bad');box.insertAdjacentHTML('afterbegin',`<b>${ok?'正解として記録しました':'不正解として記録しました'}</b>`);}}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('response').value='';$('response').disabled=true;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=true;$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;$('response').value='';$('response').disabled=false;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=false;$('retry').disabled=true;
}
render();
</script></body></html>
