の刺激量を何と呼ぶか。","answer":"刺激閾","group":"psychophysics_term","term":"刺激閾","note":"刺激が感知できる最小限の物理量であり、絶対閾ともいう。","id":"p2q0013","options":["弁別閾","絶対閾","刺激閾","調整法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A1","stem":"刺激閾の別名は何か。","answer":"絶対閾","group":"psychophysics_synonym","term":"刺激閾","note":"刺激が感知できる最小限の物理量であり、絶対閾ともいう。","id":"p2q0014","options":["絶対閾","調整法","弁別閾","刺激閾"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A1","stem":"刺激閾が表すのは、刺激を感知できるどの程度の物理量か。","answer":"最小限の物理量","group":"psychophysics_definition","term":"刺激閾","note":"刺激が感知できる最小限の物理量であり、絶対閾ともいう。","id":"p2q0015","options":["直接的に測定する","最小限の物理量","気づくことのできる最小限の差","実施が簡便である"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q2","stem":"同種の2つの刺激を比較した時に、その差異を感じるために必要な最低限の刺激量を何と呼ぶか。","answer":"弁別閾","group":"psychophysics_term","term":"弁別閾","note":"2つの刺激強度の違いに気づくための最小限の物理量である。","id":"p2q0016","options":["刺激閾","絶対閾","調整法","弁別閾"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A2","stem":"弁別閾は、2つの刺激の何の違いに気づくための指標か。","answer":"刺激強度","group":"psychophysics_target","term":"弁別閾","note":"2つの刺激強度の違いに気づくための最小限の物理量である。","id":"p2q0017","options":["弁別閾","バイアス","刺激強度","刺激閾"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A2","stem":"弁別閾が表す差はどの程度か。","answer":"気づくことのできる最小限の差","group":"psychophysics_definition","term":"弁別閾","note":"2つの刺激強度の違いに気づくための最小限の物理量である。","id":"p2q0018","options":["最小限の物理量","直接的に測定する","気づくことのできる最小限の差","実験参加者の主観の影響を受けやすい"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q3","stem":"精神物理学的測定法の1つで、実験参加者が刺激の強度を変化させ、反応する手続きを何と呼ぶか。","answer":"調整法","group":"psychophysics_method","term":"調整法","note":"極限法や恒常法に比べて実施が簡便だが、実験参加者の主観の影響を受けやすい欠点がある。","id":"p2q0019","options":["調整法","マグニチュード推定法","一対比較法","恒常法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A3","stem":"調整法の長所は何か。","answer":"実施が簡便である","group":"psychophysics_procon","term":"調整法","note":"極限法や恒常法に比べて実施が簡便だが、実験参加者の主観の影響を受けやすい欠点がある。","id":"p2q0020","options":["実験参加者によるバイアスを受けにくい","実験者・実験参加者ともに負担が大きい","実施が簡便である","試行回数が少なくデータ処理が簡便"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A3","stem":"調整法の欠点は何か。","answer":"実験参加者の主観の影響を受けやすい","group":"psychophysics_procon","term":"調整法","note":"極限法や恒常法に比べて実施が簡便だが、実験参加者の主観の影響を受けやすい欠点がある。","id":"p2q0021","options":["実験参加者の主観の影響を受けやすい","実験者・実験参加者ともに負担が大きい","比較する刺激対が増えて参加者の負担が大きくなる","実験参加者によるバイアスを受けにくい"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q4","stem":"精神物理学的測定法の1つで、実験者が刺激の強度を段階的に変化させ、実験参加者に反応させる手続きを何と呼ぶか。","answer":"極限法","group":"psychophysics_method","term":"極限法","note":"恒常法より試行回数やデータ処理が簡便だが、実験参加者が慣れによって実験刺激を予測するおそれがある。","id":"p2q0022","options":["恒常法","二肢強制選択法","調整法","極限法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A4","stem":"極限法は恒常法と比べて、試行回数やデータ処理についてどのような利点があるか。","answer":"試行回数が少なくデータ処理が簡便","group":"psychophysics_procon","term":"極限法","note":"恒常法より試行回数やデータ処理が簡便だが、実験参加者が慣れによって実験刺激を予測するおそれがある。","id":"p2q0023","options":["実験参加者の主観の影響を受けやすい","試行回数が少なくデータ処理が簡便","実施が簡便である","実験者・実験参加者ともに負担が大きい"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A4","stem":"極限法で実験参加者が刺激を予測しやすくなる原因として挙げられるものは何か。","answer":"慣れ","group":"psychophysics_bias","term":"極限法","note":"恒常法より試行回数やデータ処理が簡便だが、実験参加者が慣れによって実験刺激を予測するおそれがある。","id":"p2q0024","options":["刺激閾","飽き","バイアス","慣れ"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q5","stem":"精神物理学的測定法の1つで、実験者が刺激の強度をランダムに変化させ、実験参加者に反応させる手続きを何と呼ぶか。","answer":"恒常法","group":"psychophysics_method","term":"恒常法","note":"調整法や極限法に比べて実験参加者によるバイアスを受けにくいが、実施にあたり実験者・実験参加者ともに負担が大きい。","id":"p2q0025","options":["調整法","極限法","二肢強制選択法","恒常法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A5","stem":"恒常法の長所は何か。","answer":"実験参加者によるバイアスを受けにくい","group":"psychophysics_procon","term":"恒常法","note":"調整法や極限法に比べて実験参加者によるバイアスを受けにくいが、実施にあたり実験者・実験参加者ともに負担が大きい。","id":"p2q0026","options":["実験参加者によるバイアスを受けにくい","実験者・実験参加者ともに負担が大きい","実験参加者の主観の影響を受けやすい","比較する刺激対が増えて参加者の負担が大きくなる"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A5","stem":"恒常法の欠点は何か。","answer":"実験者・実験参加者ともに負担が大きい","group":"psychophysics_procon","term":"恒常法","note":"調整法や極限法に比べて実験参加者によるバイアスを受けにくいが、実施にあたり実験者・実験参加者ともに負担が大きい。","id":"p2q0027","options":["比較する刺激対が増えて参加者の負担が大きくなる","試行回数が少なくデータ処理が簡便","実験参加者の主観の影響を受けやすい","実験者・実験参加者ともに負担が大きい"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q6","stem":"ある刺激に対する感覚強度を基準として、別の刺激に対する感覚強度がその基準の何倍かを数値で回答させる手続きを何と呼ぶか。","answer":"マグニチュード推定法","group":"psychophysics_method","term":"マグニチュード推定法","note":"Stevens,S.S.（スティーヴンス）が開発した、直接的に感覚量を測定する方法で、この方法から感覚量が物理量のべき乗に比例するというスティーヴンスの法則を提唱した。","id":"p2q0028","options":["二肢強制選択法","調整法","一対比較法","マグニチュード推定法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A6","stem":"マグニチュード推定法を開発した人物は誰か。","answer":"Stevens,S.S.（スティーヴンス）","group":"psychophysics_person","term":"マグニチュード推定法","note":"Stevens,S.S.（スティーヴンス）が開発した、直接的に感覚量を測定する方法で、この方法から感覚量が物理量のべき乗に比例するというスティーヴンスの法則を提唱した。","id":"p2q0029","options":["比較する刺激対が増えて参加者の負担が大きくなる","実験参加者によるバイアスを受けにくい","Stevens,S.S.（スティーヴンス）","実験者・実験参加者ともに負担が大きい"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A6","stem":"マグニチュード推定法は感覚量をどのように測定する方法か。","answer":"直接的に測定する","group":"psychophysics_definition","term":"マグニチュード推定法","note":"Stevens,S.S.（スティーヴンス）が開発した、直接的に感覚量を測定する方法で、この方法から感覚量が物理量のべき乗に比例するというスティーヴンスの法則を提唱した。","id":"p2q0030","options":["気づくことのできる最小限の差","最小限の物理量","実施が簡便である","直接的に測定する"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A6","stem":"感覚量が物理量のべき乗に比例するとする法則は何か。","answer":"スティーヴンスの法則","group":"psychophysics_law","term":"マグニチュード推定法","note":"Stevens,S.S.（スティーヴンス）が開発した、直接的に感覚量を測定する方法で、この方法から感覚量が物理量のべき乗に比例するというスティーヴンスの法則を提唱した。","id":"p2q0031","options":["直接的に測定する","マグニチュード推定法","実施が簡便である","スティーヴンスの法則"]},{"page":2,"chapter":"知覚・認知","origin":"左ページQuestion Q7","stem":"複数の評価対象について2つずつ組み合わせを作り、すべての組み合わせを比較した結果を統合して評価する手続きを何と呼ぶか。","answer":"一対比較法","group":"psychophysics_method","term":"一対比較法","note":"個々の比較は2刺激間の判断なので容易だが、刺激数が多いと比較する刺激対が多くなり、実験参加者に負担がかかる。また、同じ刺激が何度も呈示されるため飽きが生じるおそれもある。","id":"p2q0032","options":["一対比較法","恒常法","極限法","マグニチュード推定法"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A7","stem":"一対比較法で個々の判断が比較的容易なのは、1回にいくつの刺激を比較するためか。","answer":"2つ","group":"psychophysics_number","term":"一対比較法","note":"個々の比較は2刺激間の判断なので容易だが、刺激数が多いと比較する刺激対が多くなり、実験参加者に負担がかかる。また、同じ刺激が何度も呈示されるため飽きが生じるおそれもある。","id":"p2q0033","options":["2つ","1つ","4つ","3つ"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A7","stem":"一対比較法で刺激数が増えると生じやすい問題は何か。","answer":"比較する刺激対が増えて参加者の負担が大きくなる","group":"psychophysics_procon","term":"一対比較法","note":"個々の比較は2刺激間の判断なので容易だが、刺激数が多いと比較する刺激対が多くなり、実験参加者に負担がかかる。また、同じ刺激が何度も呈示されるため飽きが生じるおそれもある。","id":"p2q0034","options":["実験参加者によるバイアスを受けにくい","試行回数が少なくデータ処理が簡便","実施が簡便である","比較する刺激対が増えて参加者の負担が大きくなる"]},{"page":2,"chapter":"知覚・認知","origin":"右ページAnswer解説 A7","stem":"一対比較法で同じ刺激が繰り返し呈示されることで生じうるものは何か。","answer":"飽き","group":"psychophysics_bias","term":"一対比較法","note":"個々の比較は2刺激間の判断なので容易だが、刺激数が多いと比較する刺激対が多くなり、実験参加者に負担がかかる。また、同じ刺激が何度も呈示されるため飽きが生じるおそれもある。","id":"p2q0035","options":["飽き","刺激閾","バイアス","慣れ"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q8","stem":"刺激をランダムに呈示し、その反応として2つの選択肢のうちどちらか1つを実験参加者に選ばせる手続きを何と呼ぶか。","answer":"二肢強制選択法","group":"psychophysics_method","term":"二肢強制選択法","note":"あらかじめ反応の範囲が決まっているためデータ処理がしやすく、実験参加者によるバイアスを受けにくい方法とされる。","id":"p2q0036","options":["マグニチュード推定法","極限法","一対比較法","二肢強制選択法"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A8","stem":"二肢強制選択法でデータ処理がしやすい理由は何か。","answer":"反応の範囲があらかじめ決まっている","group":"forcedchoice_feature","term":"二肢強制選択法","note":"あらかじめ反応の範囲が決まっているためデータ処理がしやすく、実験参加者によるバイアスを受けにくい方法とされる。","id":"p2q0037","options":["一定の手続きに従えば必ず解決に至る","ボトムアップ処理（データ駆動処理）","反応の範囲があらかじめ決まっている","実験参加者の主観の影響を受けやすい"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A8","stem":"二肢強制選択法は実験参加者による何を受けにくいとされるか。","answer":"バイアス","group":"psychophysics_bias","term":"二肢強制選択法","note":"あらかじめ反応の範囲が決まっているためデータ処理がしやすく、実験参加者によるバイアスを受けにくい方法とされる。","id":"p2q0038","options":["慣れ","バイアス","飽き","弁別閾"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q9","stem":"ある刺激によって本来生じる感覚だけでなく、異なる種類の感覚も生じる現象を何と呼ぶか。","answer":"共感覚","group":"perception_term","term":"共感覚","note":"例えば、音楽を聴くと色が見えるといった色聴など、共感覚者によって感覚の感じ方は様々である。","id":"p2q0039","options":["プルキンエ現象","閾下知覚","対比","共感覚"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A9","stem":"共感覚の例として、音を聞いたときに色を感じる現象を何というか。","answer":"色聴","group":"perception_example","term":"共感覚","note":"例えば、音楽を聴くと色が見えるといった色聴など、共感覚者によって感覚の感じ方は様々である。","id":"p2q0040","options":["色聴","残像","光覚","色覚恒常"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A9","stem":"共感覚では、1つの刺激によってどのような感覚が生じるか。","answer":"本来の感覚に加えて異なる種類の感覚も生じる","group":"perception_definition","term":"共感覚","note":"例えば、音楽を聴くと色が見えるといった色聴など、共感覚者によって感覚の感じ方は様々である。","id":"p2q0041","options":["本来の感覚に加えて異なる種類の感覚も生じる","プルキンエ現象","知覚の恒常性","適応的なメカニズム"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q10","stem":"2つ以上の刺激を呈示した時に、それらの刺激が単独で呈示された場合よりも相互に際立って知覚される現象を何と呼ぶか。","answer":"対比","group":"perception_term","term":"対比","note":"呈示された各刺激の特徴の差が強調される方向に知覚される。例えば灰色は白と一緒に呈示されると暗く、黒と一緒に呈示されると明るく見える。","id":"p2q0042","options":["共感覚","閾下知覚","プルキンエ現象","対比"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A10","stem":"対比では、同時に呈示された刺激間の何が強調される方向に知覚されるか。","answer":"特徴の差","group":"perception_property","term":"対比","note":"呈示された各刺激の特徴の差が強調される方向に知覚される。例えば灰色は白と一緒に呈示されると暗く、黒と一緒に呈示されると明るく見える。","id":"p2q0043","options":["特徴の差","適応的なメカニズム","共感覚","閾下知覚"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A10","stem":"灰色を白と一緒に呈示した場合、灰色はどのように見えやすいか。","answer":"暗く見える","group":"perception_direction","term":"対比","note":"呈示された各刺激の特徴の差が強調される方向に知覚される。例えば灰色は白と一緒に呈示されると暗く、黒と一緒に呈示されると明るく見える。","id":"p2q0044","options":["知覚の恒常性","暗く見える","明るく見える","閾下知覚"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A10","stem":"灰色を黒と一緒に呈示した場合、灰色はどのように見えやすいか。","answer":"明るく見える","group":"perception_direction","term":"対比","note":"呈示された各刺激の特徴の差が強調される方向に知覚される。例えば灰色は白と一緒に呈示されると暗く、黒と一緒に呈示されると明るく見える。","id":"p2q0045","options":["知覚の体制化","知覚の恒常性","暗く見える","明るく見える"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q11","stem":"暗い場所から急に明るい場所へ移動した際、はじめは非常にまぶしいと感じるが次第に慣れてくる現象を何と呼ぶか。","answer":"明順応","group":"adaptation_term","term":"明順応","note":"明所で機能するのは錐体細胞である。明順応は虹彩の調整によってなされるため数十秒程度で完了する。","id":"p2q0046","options":["明順応","プルキンエ現象","知覚の恒常性","暗順応"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A11","stem":"明所で主に機能する視細胞は何か。","answer":"錐体細胞","group":"visual_cell","term":"明順応","note":"明所で機能するのは錐体細胞である。明順応は虹彩の調整によってなされるため数十秒程度で完了する。","id":"p2q0047","options":["毛様体筋","桿体細胞","錐体細胞","虹彩の調整"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A11","stem":"明順応に関わる眼の調整は何か。","answer":"虹彩の調整","group":"visual_mechanism","term":"明順応","note":"明所で機能するのは錐体細胞である。明順応は虹彩の調整によってなされるため数十秒程度で完了する。","id":"p2q0048","options":["虹彩の調整","数十秒程度","ロドプシン","桿体細胞の感度変化"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A11","stem":"明順応が完了するまでのおおよその時間はどの程度か。","answer":"数十秒程度","group":"visual_duration","term":"明順応","note":"明所で機能するのは錐体細胞である。明順応は虹彩の調整によってなされるため数十秒程度で完了する。","id":"p2q0049","options":["数分程度","数十秒程度","1時間程度","30分程度"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q12","stem":"明るい場所から急に暗い場所へ移動した際、はじめは何も見えないが次第に周囲が見えるようになる現象を何と呼ぶか。","answer":"暗順応","group":"adaptation_term","term":"暗順応","note":"暗所で機能する桿体細胞にはロドプシンという光を感じる物質が含まれ、その合成に時間がかかるため暗順応が完了するまでに30分程度かかる。","id":"p2q0050","options":["明順応","プルキンエ現象","知覚の恒常性","暗順応"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A12","stem":"暗所で主に機能する視細胞は何か。","answer":"桿体細胞","group":"visual_cell","term":"暗順応","note":"暗所で機能する桿体細胞にはロドプシンという光を感じる物質が含まれ、その合成に時間がかかるため暗順応が完了するまでに30分程度かかる。","id":"p2q0051","options":["桿体細胞","錐体細胞","虹彩の調整","毛様体筋"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A12","stem":"桿体細胞に含まれる光を感じる物質は何か。","answer":"ロドプシン","group":"visual_substance","term":"暗順応","note":"暗所で機能する桿体細胞にはロドプシンという光を感じる物質が含まれ、その合成に時間がかかるため暗順応が完了するまでに30分程度かかる。","id":"p2q0052","options":["数十秒程度","虹彩の調整","ロドプシン","30分程度"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A12","stem":"暗順応が完了するまでのおおよその時間はどの程度か。","answer":"30分程度","group":"visual_duration","term":"暗順応","note":"暗所で機能する桿体細胞にはロドプシンという光を感じる物質が含まれ、その合成に時間がかかるため暗順応が完了するまでに30分程度かかる。","id":"p2q0053","options":["30分程度","2時間程度","数十秒程度","5分程度"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q13","stem":"明るい場所では黄色い花が明るく見えているが、薄暗い場所では緑の葉の方が明るく見える現象を何と呼ぶか。","answer":"プルキンエ現象","group":"perception_term","term":"プルキンエ現象","note":"その場所の明るさによって同じものでも色彩が異なって見える現象で、暗順応による桿体細胞の感度変化によって生じる。","id":"p2q0054","options":["閾下知覚","知覚の体制化","プルキンエ現象","知覚の恒常性"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A13","stem":"プルキンエ現象は何の変化によって生じると説明されるか。","answer":"桿体細胞の感度変化","group":"visual_mechanism","term":"プルキンエ現象","note":"その場所の明るさによって同じものでも色彩が異なって見える現象で、暗順応による桿体細胞の感度変化によって生じる。","id":"p2q0055","options":["30分程度","虹彩の調整","数十秒程度","桿体細胞の感度変化"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A13","stem":"プルキンエ現象が生じる際に関係する順応は何か。","answer":"暗順応","group":"adaptation_term","term":"プルキンエ現象","note":"その場所の明るさによって同じものでも色彩が異なって見える現象で、暗順応による桿体細胞の感度変化によって生じる。","id":"p2q0056","options":["知覚の恒常性","明順応","プルキンエ現象","暗順応"]},{"page":3,"chapter":"知覚・認知","origin":"左ページQuestion Q14","stem":"意識できない刺激閾以下の刺激によって、何らかの反応が生じる現象を何と呼ぶか。","answer":"閾下知覚","group":"perception_term","term":"閾下知覚","note":"映画館で『コカコーラを飲もう』『ポップコーンを食べよう』という文字メッセージを5秒ごとに1/3000秒挿入したところ、売上が驚異的に増えたという実験が有名である。","id":"p2q0057","options":["プルキンエ現象","対比","共感覚","閾下知覚"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A14","stem":"閾下知覚の有名な映画館実験で挿入されたメッセージの例は何か。","answer":"『コカコーラを飲もう』『ポップコーンを食べよう』","group":"subliminal_example","term":"閾下知覚","note":"映画館で『コカコーラを飲もう』『ポップコーンを食べよう』という文字メッセージを5秒ごとに1/3000秒挿入したところ、売上が驚異的に増えたという実験が有名である。","id":"p2q0058","options":["『この商品を買おう』『もう一度見よう』","『コカコーラを飲もう』『ポップコーンを食べよう』","『水を飲もう』『キャンディーを食べよう』","『映画を見よう』『席を立とう』"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A14","stem":"閾下知覚の映画館実験では、メッセージはどのくらいの間隔で挿入されたとされるか。","answer":"5秒ごと","group":"subliminal_timing","term":"閾下知覚","note":"映画館で『コカコーラを飲もう』『ポップコーンを食べよう』という文字メッセージを5秒ごとに1/3000秒挿入したところ、売上が驚異的に増えたという実験が有名である。","id":"p2q0059","options":["30秒ごと","1秒ごと","5秒ごと","1/3000秒"]},{"page":3,"chapter":"知覚・認知","origin":"右ページAnswer解説 A14","stem":"閾下知覚の映画館実験で、1回のメッセージ呈示時間はどの程度だったとされるか。","answer":"1/3000秒","group":"subliminal_timing","term":"閾下知覚","note":"映画館で『コカコーラを飲もう』『ポップコーンを食べよう』という文字メッセージを5秒ごとに1/3000秒挿入したところ、売上が驚異的に増えたという実験が有名である。","id":"p2q0060","options":["1/300秒","1/3000秒","5秒ごと","1/30秒"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q15","stem":"感覚受容器に与えられる刺激が変化しても、その刺激に対して生じる知覚が比較的安定している現象を何と呼ぶか。","answer":"知覚の恒常性","group":"perception_term","term":"知覚の恒常性","note":"感覚受容器に与えられる近刺激が変化しても、外界にある遠刺激の特徴があまり変わらずに知覚される。環境との関係において適応的なメカニズムである。","id":"p2q0061","options":["知覚の体制化","共感覚","対比","知覚の恒常性"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A15","stem":"知覚の恒常性で、感覚受容器に与えられる刺激を何というか。","answer":"近刺激","group":"perception_stimulus","term":"知覚の恒常性","note":"感覚受容器に与えられる近刺激が変化しても、外界にある遠刺激の特徴があまり変わらずに知覚される。環境との関係において適応的なメカニズムである。","id":"p2q0062","options":["近刺激","遠刺激","共感覚","対比"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A15","stem":"知覚の恒常性で、外界にある対象の刺激を何というか。","answer":"遠刺激","group":"perception_stimulus","term":"知覚の恒常性","note":"感覚受容器に与えられる近刺激が変化しても、外界にある遠刺激の特徴があまり変わらずに知覚される。環境との関係において適応的なメカニズムである。","id":"p2q0063","options":["遠刺激","共感覚","近刺激","対比"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A15","stem":"知覚の恒常性は環境との関係においてどのようなメカニズムとされるか。","answer":"適応的なメカニズム","group":"perception_property","term":"知覚の恒常性","note":"感覚受容器に与えられる近刺激が変化しても、外界にある遠刺激の特徴があまり変わらずに知覚される。環境との関係において適応的なメカニズムである。","id":"p2q0064","options":["特徴の差","知覚の恒常性","適応的なメカニズム","知覚の体制化"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q16","stem":"平面図形の長さや大きさ、角度、方向などの幾何学的性質が、実際とは異なって知覚される現象を何と呼ぶか。","answer":"幾何学的錯視","group":"illusion_term","term":"幾何学的錯視","note":"代表例にミュラー・リヤー錯視がある。錯視だと知っていても錯視効果が解消されるものではない。","id":"p2q0065","options":["マッハバンド","反転図形（多義図形）","幾何学的錯視","主観的輪郭"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A16","stem":"幾何学的錯視の代表例は何か。","answer":"ミュラー・リヤー錯視","group":"illusion_example","term":"幾何学的錯視","note":"代表例にミュラー・リヤー錯視がある。錯視だと知っていても錯視効果が解消されるものではない。","id":"p2q0066","options":["妻と老婆","ルビンの盃","カニッツァの三角形","ミュラー・リヤー錯視"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A16","stem":"錯視であることを知れば、幾何学的錯視の効果は消えるか。","answer":"消えない","group":"illusion_property","term":"幾何学的錯視","note":"代表例にミュラー・リヤー錯視がある。錯視だと知っていても錯視効果が解消されるものではない。","id":"p2q0067","options":["ルビンの盃","消えない","明るさや色の違い","主観的輪郭"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q17","stem":"実際には存在しないにもかかわらず、周囲の刺激位置によって輪郭線が存在しているように知覚される現象を何と呼ぶか。","answer":"主観的輪郭","group":"illusion_term","term":"主観的輪郭","note":"主観的輪郭では輪郭線の中と外で明るさや色に違いが見られ、図形が知覚されて重なりが感じられる。代表例にカニッツァの三角形がある。","id":"p2q0068","options":["反転図形（多義図形）","マッハバンド","主観的輪郭","幾何学的錯視"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A17","stem":"主観的輪郭の代表例は何か。","answer":"カニッツァの三角形","group":"illusion_example","term":"主観的輪郭","note":"主観的輪郭では輪郭線の中と外で明るさや色に違いが見られ、図形が知覚されて重なりが感じられる。代表例にカニッツァの三角形がある。","id":"p2q0069","options":["ルビンの盃","妻と老婆","カニッツァの三角形","ミュラー・リヤー錯視"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A17","stem":"主観的輪郭では、輪郭線の内外で何の違いが知覚されるか。","answer":"明るさや色の違い","group":"illusion_property","term":"主観的輪郭","note":"主観的輪郭では輪郭線の中と外で明るさや色に違いが見られ、図形が知覚されて重なりが感じられる。代表例にカニッツァの三角形がある。","id":"p2q0070","options":["マッハバンド","幾何学的錯視","明るさや色の違い","消えない"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q18","stem":"輝度が均一な領域が一定の割合で変化する輝度勾配領域と接している場合、その境界部分に発生する錯視的な線を何と呼ぶか。","answer":"マッハバンド","group":"illusion_term","term":"マッハバンド","note":"輝度勾配領域が暗い均一領域と接しているところでは暗い線、明るい均一領域と接しているところでは明るい線が知覚される。","id":"p2q0071","options":["主観的輪郭","反転図形（多義図形）","マッハバンド","幾何学的錯視"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A18","stem":"輝度勾配領域が暗い均一領域と接する境界では、どのような線が知覚されるか。","answer":"暗い線","group":"machband_direction","term":"マッハバンド","note":"輝度勾配領域が暗い均一領域と接しているところでは暗い線、明るい均一領域と接しているところでは明るい線が知覚される。","id":"p2q0072","options":["絶対閾","刺激閾","明るい線","暗い線"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A18","stem":"輝度勾配領域が明るい均一領域と接する境界では、どのような線が知覚されるか。","answer":"明るい線","group":"machband_direction","term":"マッハバンド","note":"輝度勾配領域が暗い均一領域と接しているところでは暗い線、明るい均一領域と接しているところでは明るい線が知覚される。","id":"p2q0073","options":["バイアス","刺激強度","明るい線","暗い線"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q19","stem":"同一図形であるにもかかわらず、2つ以上の見え方がある図形を何と呼ぶか。","answer":"反転図形（多義図形）","group":"illusion_term","term":"反転図形（多義図形）","note":"『ルビンの盃』に代表される図と地が交替する図形や、『妻と老婆』のように1つの図形から2つ以上の対象を見いだせる意味反転図形などがある。","id":"p2q0074","options":["主観的輪郭","マッハバンド","反転図形（多義図形）","幾何学的錯視"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A19","stem":"図と地が交替する反転図形の代表例は何か。","answer":"ルビンの盃","group":"illusion_example","term":"反転図形（多義図形）","note":"『ルビンの盃』に代表される図と地が交替する図形や、『妻と老婆』のように1つの図形から2つ以上の対象を見いだせる意味反転図形などがある。","id":"p2q0075","options":["ルビンの盃","ミュラー・リヤー錯視","妻と老婆","カニッツァの三角形"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A19","stem":"1つの図形から複数の対象を見いだす意味反転図形の例は何か。","answer":"妻と老婆","group":"illusion_example","term":"反転図形（多義図形）","note":"『ルビンの盃』に代表される図と地が交替する図形や、『妻と老婆』のように1つの図形から2つ以上の対象を見いだせる意味反転図形などがある。","id":"p2q0076","options":["ミュラー・リヤー錯視","カニッツァの三角形","妻と老婆","ルビンの盃"]},{"page":4,"chapter":"知覚・認知","origin":"左ページQuestion Q20","stem":"多数の刺激をバラバラに知覚するのではなく、まとまったかたまりとして知覚する働きを何と呼ぶか。","answer":"知覚の体制化","group":"perception_term","term":"知覚の体制化","note":"群化とも呼ばれる。体制化が起こる要因には、接近、類同、閉合、よいかたち、よい連続、共通運命がある。","id":"p2q0077","options":["知覚の恒常性","閾下知覚","知覚の体制化","共感覚"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A20","stem":"知覚の体制化の別名は何か。","answer":"群化","group":"organization_synonym","term":"知覚の体制化","note":"群化とも呼ばれる。体制化が起こる要因には、接近、類同、閉合、よいかたち、よい連続、共通運命がある。","id":"p2q0078","options":["統合","分化","群化","般化"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A20","stem":"知覚の体制化を生じさせる要因を3つ挙げるとすれば何か。","answer":"接近・類同・閉合","group":"organization_factor","term":"知覚の体制化","note":"群化とも呼ばれる。体制化が起こる要因には、接近、類同、閉合、よいかたち、よい連続、共通運命がある。","id":"p2q0079","options":["接近・類同・閉合","プレグナンツの法則","群化","共通運命"]},{"page":4,"chapter":"知覚・認知","origin":"右ページAnswer解説 A20","stem":"知覚の体制化を生じさせる要因として、要素が同じ方向に動くことを何というか。","answer":"共通運命","group":"organization_factor","term":"知覚の体制化","note":"群化とも呼ばれる。体制化が起こる要因には、接近、類同、閉合、よいかたち、よい連続、共通運命がある。","id":"p2q0080","options":["接近・類同・閉合","群化","共通運命","プレグナンツの法則"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q21","stem":"Wertheimer,M.（ウェルトハイマー）が提唱した、知覚の体制化がより簡潔な方向に向かって起こる傾向を何と呼ぶか。","answer":"プレグナンツの法則","group":"organization_term","term":"プレグナンツの法則","note":"体制化（群化）はこの法則に従って生じる。刺激の配置によって体制化の要因が2つ以上存在する場合、どれに従って体制化が決定されるかは個々の要因ではなく、この法則に基づく。","id":"p2q0081","options":["接近・類同・閉合","共通運命","群化","プレグナンツの法則"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A21","stem":"プレグナンツの法則を提唱した人物は誰か。","answer":"Wertheimer,M.（ウェルトハイマー）","group":"organization_person","term":"プレグナンツの法則","note":"体制化（群化）はこの法則に従って生じる。刺激の配置によって体制化の要因が2つ以上存在する場合、どれに従って体制化が決定されるかは個々の要因ではなく、この法則に基づく。","id":"p2q0082","options":["共通運命","プレグナンツの法則","接近・類同・閉合","Wertheimer,M.（ウェルトハイマー）"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A21","stem":"複数の群化要因が競合するとき、体制化の決定を方向づける法則は何か。","answer":"プレグナンツの法則","group":"organization_term","term":"プレグナンツの法則","note":"体制化（群化）はこの法則に従って生じる。刺激の配置によって体制化の要因が2つ以上存在する場合、どれに従って体制化が決定されるかは個々の要因ではなく、この法則に基づく。","id":"p2q0083","options":["共通運命","群化","プレグナンツの法則","接近・類同・閉合"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q22","stem":"実際には物理的な運動が生じていないにもかかわらず運動が知覚される現象を何と呼ぶか。","answer":"仮現運動","group":"motion_term","term":"仮現運動","note":"日常場面では映画や踏切の警報機などが例として挙げられる。仮現運動の研究はゲシュタルト心理学の出発点ともいえる。","id":"p2q0084","options":["仮現運動","運動残効","自動運動","誘導運動"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A22","stem":"仮現運動の日常的な例として挙げられるものは何か。","answer":"映画や踏切の警報機","group":"motion_example","term":"仮現運動","note":"日常場面では映画や踏切の警報機などが例として挙げられる。仮現運動の研究はゲシュタルト心理学の出発点ともいえる。","id":"p2q0085","options":["映画や踏切の警報機","隣の電車の動きで自分の電車が動いたように感じる場面","ビックリハウス","夜間飛行中のパイロット"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A22","stem":"仮現運動の研究は、どの心理学の出発点とされるか。","answer":"ゲシュタルト心理学","group":"motion_theory","term":"仮現運動","note":"日常場面では映画や踏切の警報機などが例として挙げられる。仮現運動の研究はゲシュタルト心理学の出発点ともいえる。","id":"p2q0086","options":["渦巻の拡大または縮小","映画や踏切の警報機","夜間飛行中のパイロット","ゲシュタルト心理学"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q23","stem":"暗いところで静止した光点をしばらく見つめていると、実際には動いていないにもかかわらず、不規則に動いているように見える現象を何と呼ぶか。","answer":"自動運動","group":"motion_term","term":"自動運動","note":"夜間飛行中のパイロットに起こりうる現象で、星や漁火、他の航空機の機外灯などによって容易に引き起こされる。","id":"p2q0087","options":["仮現運動","誘導運動","運動残効","自動運動"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A23","stem":"自動運動が問題となりやすい職業場面として挙げられるものは何か。","answer":"夜間飛行中のパイロット","group":"motion_example","term":"自動運動","note":"夜間飛行中のパイロットに起こりうる現象で、星や漁火、他の航空機の機外灯などによって容易に引き起こされる。","id":"p2q0088","options":["夜間飛行中のパイロット","映画や踏切の警報機","ビックリハウス","星や漁火、他の航空機の機外灯"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A23","stem":"自動運動を引き起こしやすい刺激の例は何か。","answer":"星や漁火、他の航空機の機外灯","group":"motion_example","term":"自動運動","note":"夜間飛行中のパイロットに起こりうる現象で、星や漁火、他の航空機の機外灯などによって容易に引き起こされる。","id":"p2q0089","options":["ビックリハウス","星や漁火、他の航空機の機外灯","隣の電車の動きで自分の電車が動いたように感じる場面","夜間飛行中のパイロット"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q24","stem":"囲むものと囲まれるものという2つの視対象がある場合に、実際には囲むものが動いていても、囲まれているものが動いているように見える現象を何と呼ぶか。","answer":"誘導運動","group":"motion_term","term":"誘導運動","note":"日常場面では、自分の電車は動いていないのに隣のホームの電車が動き始めると自分の電車が動き始めたように感じる例がある。この原理を利用したものに遊園地のビックリハウスがある。","id":"p2q0090","options":["誘導運動","自動運動","運動残効","仮現運動"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A24","stem":"誘導運動の日常的な例として挙げられる場面は何か。","answer":"隣の電車の動きで自分の電車が動いたように感じる場面","group":"motion_example","term":"誘導運動","note":"日常場面では、自分の電車は動いていないのに隣のホームの電車が動き始めると自分の電車が動き始めたように感じる例がある。この原理を利用したものに遊園地のビックリハウスがある。","id":"p2q0091","options":["夜間飛行中のパイロット","映画や踏切の警報機","星や漁火、他の航空機の機外灯","隣の電車の動きで自分の電車が動いたように感じる場面"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A24","stem":"誘導運動の原理を利用した遊園地の施設として挙げられるものは何か。","answer":"ビックリハウス","group":"motion_example","term":"誘導運動","note":"日常場面では、自分の電車は動いていないのに隣のホームの電車が動き始めると自分の電車が動き始めたように感じる例がある。この原理を利用したものに遊園地のビックリハウスがある。","id":"p2q0092","options":["夜間飛行中のパイロット","隣の電車の動きで自分の電車が動いたように感じる場面","ビックリハウス","星や漁火、他の航空機の機外灯"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q25","stem":"一定方向に動いている対象をしばらく見つめた後に、静止した対象を見ると、その対象が今まで見ていた動く対象とは逆方向に動いて見える現象を何と呼ぶか。","answer":"運動残効","group":"motion_term","term":"運動残効","note":"運動残効の1つである渦巻残効では、運動だけでなく渦巻の拡大あるいは縮小が知覚される。","id":"p2q0093","options":["誘導運動","自動運動","運動残効","仮現運動"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A25","stem":"運動残効では、静止対象は直前に見ていた運動と比べてどちらの方向に動いて見えるか。","answer":"逆方向","group":"motion_direction","term":"運動残効","note":"運動残効の1つである渦巻残効では、運動だけでなく渦巻の拡大あるいは縮小が知覚される。","id":"p2q0094","options":["自動運動","仮現運動","誘導運動","逆方向"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A25","stem":"渦巻残効では運動に加えて何が知覚されるか。","answer":"渦巻の拡大または縮小","group":"motion_effect","term":"運動残効","note":"運動残効の1つである渦巻残効では、運動だけでなく渦巻の拡大あるいは縮小が知覚される。","id":"p2q0095","options":["夜間飛行中のパイロット","ゲシュタルト心理学","映画や踏切の警報機","渦巻の拡大または縮小"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q26","stem":"特定の音節を発する口の動きに別の音声を重ねた映像を呈示した時、視覚情報が音声知覚に影響を与える現象を何と呼ぶか。","answer":"マガーク効果","group":"multisensory_term","term":"マガーク効果","note":"例えば、『ガ』と発音している映像に『バ』という音声を合わせて呈示した場合、『ダ』のように聞こえる。","id":"p2q0096","options":["知覚の恒常性","明るく見える","幾何学的錯視","マガーク効果"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A26","stem":"マガーク効果の例で、『ガ』の口の映像に『バ』の音声を組み合わせると、どのように聞こえやすいか。","answer":"『ダ』","group":"multisensory_example","term":"マガーク効果","note":"例えば、『ガ』と発音している映像に『バ』という音声を合わせて呈示した場合、『ダ』のように聞こえる。","id":"p2q0097","options":["『ダ』","刺激閾","絶対閾","弁別閾"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A26","stem":"マガーク効果では、どの感覚情報が音声知覚に影響するか。","answer":"視覚情報","group":"multisensory_modality","term":"マガーク効果","note":"例えば、『ガ』と発音している映像に『バ』という音声を合わせて呈示した場合、『ダ』のように聞こえる。","id":"p2q0098","options":["視覚情報","特徴の差","バイアス","刺激強度"]},{"page":5,"chapter":"知覚・認知","origin":"左ページQuestion Q27","stem":"視覚対象を網膜にはっきりと映し出すため、眼の水晶体の厚さを変化させる働きを何と呼ぶか。","answer":"調節","group":"depthcue_term","term":"調節","note":"奥行き知覚における単眼手がかりの1つ。水晶体の厚さを変えることによって網膜上に鮮明な像を結び、このときの毛様体筋の伸縮が奥行き知覚の手がかりになる。","id":"p2q0099","options":["両眼視差","調節","輻輳","アフォーダンス"]},{"page":5,"chapter":"知覚・認知","origin":"右ページAnswer解説 A27","stem":" tion_term","term":"選択的注意","note":"選択的注意のメカニズムには、意味処理より前の知覚段階で選択するとする初期選択説と、意味処理以降の反応選択段階で選択するとする後期選択説がある。","id":"p2q0120","options":["ストループ効果","変化の見落とし","選択的注意","カクテルパーティー効果"]},{"page":6,"chapter":"知覚・認知","origin":"右ページAnswer解説 A33","stem":"選択的注意について、意味処理より前の段階で情報を選ぶとする考えは何か。","answer":"初期選択説","group":"attention_theory","term":"選択的注意","note":"選択的注意のメカニズムには、意味処理より前の知覚段階で選択するとする初期選択説と、意味処理以降の反応選択段階で選択するとする後期選択説がある。","id":"p2q0121","options":["物理的な処理","初期選択説","選択的注意","後期選択説"]},{"page":6,"chapter":"知覚・認知","origin":"右ページAnswer解説 A33","stem":"選択的注意について、意味処理以降の反応選択段階で情報を選ぶとする考えは何か。","answer":"後期選択説","group":"attention_theory","term":"選択的注意","note":"選択的注意のメカニズムには、意味処理より前の知覚段階で選択するとする初期選択説と、意味処理以降の反応選択段階で選択するとする後期選択説がある。","id":"p2q0122","options":["後期選択説","初期選択説","物理的な処理","選択的注意"]},{"page":7,"chapter":"知覚・認知","origin":"左ページQuestion Q34","stem":"パーティー会場のように多くの人々が会話する声が聞こえる状況の中で、自分の会話相手の声を聞き取れる現象を何と呼ぶか。","answer":"カクテルパーティー効果","group":"attention_term","term":"カクテルパーティー効果","note":"選択的注意の代表例。現在は聴覚情報だけでなく、話し手の口元の動きなど注意を向けた音に関する視覚情報も統合的に処理されることで生じると考えられている。","id":"p2q0123","options":["カクテルパーティー効果","変化の見落とし","選択的注意","ストループ効果"]},{"page":7,"chapter":"知覚・認知","origin":"右ページAnswer解説 A34","stem":"カクテルパーティー効果は何の代表例か。","answer":"選択的注意","group":"attention_term","term":"カクテルパーティー効果","note":"選択的注意の代表例。現在は聴覚情報だけでなく、話し手の口元の動きなど注意を向けた音に関する視覚情報も統合的に処理されることで生じると考えられている。","id":"p2q0124","options":["カクテルパーティー効果","変化の見落とし","ストループ効果","選択的注意"]},{"page":7,"chapter":"知覚・認知","origin":"右ページAnswer解説 A34","stem":"カクテルパーティー効果では、聴覚情報に加えて何が統合的に処理されると考えられているか。","answer":"話し手の口元の動きなどの視覚情報","group":"attention_cue","term":"カクテルパーティー効果","note":"選択的注意の代表例。現在は聴覚情報だけでなく、話し手の口元の動きなど注意を向けた音に関する視覚情報も統合的に処理されることで生じると考えられている。","id":"p2q0125","options":["話し手の口元の動きなどの視覚情報","カクテルパーティー効果","『見えないゴリラ』の実験","特定の課題や物事に注意を向けすぎる状態"]},{"page":7,"chapter":"知覚・認知","origin":"左ページQuestion Q35","stem":"左右の耳に異なった刺激音を同時に聞かせる実験手続きを何と呼ぶか。","answer":"両耳分離聴実験","group":"attention_method","term":"両耳分離聴実験","note":"選択的注意や大脳の機能差の研究に用いられる。左右の耳から別々に聞こえる ":["フールプルーフ","ヒューマンエラー","フェールセーフ","ハインリッヒの法則"]},{"page":9,"chapter":"知覚・認知","origin":"右ページAnswer解説 A53","stem":"フェールセーフが重視するのは、エラー発生後にどのような状態へ制御することか。","answer":"安全な状態","group":"safety_principle","term":"フェールセーフ","note":"エラーが起こっても、安全に制御する設計をいう。","id":"p2q0184","options":["操作を間違えることができない設計","人間は間違える","安全な状態","事故に至らない危ない状況を防止すること"]},{"page":9,"chapter":"知覚・認知","origin":"右ページAnswer解説 A53","stem":"フェールセーフは、エラーそのものを完全に防ぐことより何を重視するか。","answer":"エラーが起きても安全に制御すること","group":"safety_principle","term":"フェールセーフ","note":"エラーが起こっても、安全に制御する設計をいう。","id":"p2q0185","options":["人間は間違える","操作を間違えることができない設計","エラーが起きても安全に制御すること","事故に至らない危ない状況を防止すること"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q54","stem":"1件の重大事故の背後には29件の軽度事故があり、その背後には300件の事故にはならなかった危ない状況があるとする考えを何と呼ぶか。","answer":"ハインリッヒの法則","group":"safety_term","term":"ハインリッヒの法則","note":"事故にはならなかったが危ない状況をいかに防止するかによって事故の発生を防止できると考える。また不安全行動や不安全状態がなくなれば危ない状況や事故がなくなるとされる。","id":"p2q0186","options":["ハインリッヒの法則","フェールセーフ","ヒューマンエラー","フールプルーフ"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A54","stem":"ハインリッヒの法則で、1件の重大事故の背後にある軽度事故は何件とされるか。","answer":"29件","group":"heinrich_number","term":"ハインリッヒの法則","note":"事故にはならなかったが危ない状況をいかに防止するかによって事故の発生を防止できると考える。また不安全行動や不安全状態がなくなれば危ない状況や事故がなくなるとされる。","id":"p2q0187","options":["49件","20件","29件","300件"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A54","stem":"ハインリッヒの法則で、1件の重大事故の背後にある危ない状況は何件とされるか。","answer":"300件","group":"heinrich_number","term":"ハインリッヒの法則","note":"事故にはならなかったが危ない状況をいかに防止するかによって事故の発生を防止できると考える。また不安全行動や不安全状態がなくなれば危ない状況や事故がなくなるとされる。","id":"p2q0188","options":["300件","29件","600件","100件"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A54","stem":"ハインリッヒの法則で事故防止のために重視されるものは何か。","answer":"事故に至らない危ない状況を防止すること","group":"safety_principle","term":"ハインリッヒの法則","note":"事故にはならなかったが危ない状況をいかに防止するかによって事故の発生を防止できると考える。また不安全行動や不安全状態がなくなれば危ない状況や事故がなくなるとされる。","id":"p2q0189","options":["人間は間違える","事故に至らない危ない状況を防止すること","安全な状態","エラーが起きても安全に制御すること"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q55","stem":"記憶研究において、記銘した情報を想起し、そのまま再現する方法を何と呼ぶか。","answer":"再生法","group":"memory_method","term":"再生法","note":"試験の穴埋め問題や記述問題のように、覚えたものをそのまま書き出すことが例として挙げられる。","id":"p2q0190","options":["再学習法","再生法","一対比較法","再認法"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A55","stem":"再生法を用いる試験問題の例は何か。","answer":"穴埋め問題や記述問題","group":"memory_example","term":"再生法","note":"試験の穴埋め問題や記述問題のように、覚えたものをそのまま書き出すことが例として挙げられる。","id":"p2q0191","options":["多肢選択法や正誤判断問題","穴埋め問題や記述問題","昨年富士山に登ったという記憶","レミニセンス・バンプ"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A55","stem":"再生法では、覚えた情報をどのように回答するか。","answer":"そのまま書き出す","group":"memory_process","term":"再生法","note":"試験の穴埋め問題や記述問題のように、覚えたものをそのまま書き出すことが例として挙げられる。","id":"p2q0192","options":["そのまま書き出す","提示内容が以前覚えたものと一致するかの判断","注意を向けられた情報","精緻化リハーサル"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q56","stem":"記憶研究において、提示された情報が以前記銘したものと同じであるかを判断する方法を何と呼ぶか。","answer":"再認法","group":"memory_method","term":"再認法","note":"試験の多肢選択法や正誤判断問題のように、提示された内容が以前覚えたものと一致するかを判断することが例として挙げられる。","id":"p2q0193","options":["再学習法","再生法","再認法","一対比較法"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A56","stem":"再認法を用いる試験問題の例は何か。","answer":"多肢選択法や正誤判断問題","group":"memory_example","term":"再認法","note":"試験の多肢選択法や正誤判断問題のように、提示された内容が以前覚えたものと一致するかを判断することが例として挙げられる。","id":"p2q0194","options":["昨年富士山に登ったという記憶","多肢選択法や正誤判断問題","穴埋め問題や記述問題","意味記憶とエピソード記憶"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A56","stem":"再認法で求められる判断は何か。","answer":"提示内容が以前覚えたものと一致するかの判断","group":"memory_process","term":"再認法","note":"試験の多肢選択法や正誤判断問題のように、提示された内容が以前覚えたものと一致するかを判断することが例として挙げられる。","id":"p2q0195","options":["注意を向けられた情報","Baddeley,A.（バッデリー）","そのまま書き出す","提示内容が以前覚えたものと一致するかの判断"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q57","stem":"Ebbinghaus,H.（エビングハウス）の記憶研究に用いられた、一度完全に覚えた記銘材料を一定時間後に再び記銘し、最初に覚えた時と比べてどれくらい時間が短縮されたかを測定する方法を何と呼ぶか。","answer":"再学習法","group":"memory_method","term":"再学習法","note":"Ebbinghausはこの手続きで記憶の忘却を研究した。短縮された時間を保持率として見いだされたのがエビングハウスの忘却曲線である。","id":"p2q0196","options":["再認法","再生法","一対比較法","再学習法"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A57","stem":"再学習法を用いて忘却を研究した人物は誰か。","answer":"Ebbinghaus,H.（エビングハウス）","group":"memory_person","term":"再学習法","note":"Ebbinghausはこの手続きで記憶の忘却を研究した。短縮された時間を保持率として見いだされたのがエビングハウスの忘却曲線である。","id":"p2q0197","options":["TOT現象（喉まで出かかる現象）","Ebbinghaus,H.（エビングハウス）","Baddeley,A.（バッデリー）","Craik,F.I.M.（クレイク）とLockhart,R.S.（ロックハート）"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A57","stem":"再学習法で、再学習時に短縮された時間は何として扱われるか。","answer":"保持率","group":"memory_measure","term":"再学習法","note":"Ebbinghausはこの手続きで記憶の忘却を研究した。短縮された時間を保持率として見いだされたのがエビングハウスの忘却曲線である。","id":"p2q0198","options":["再認法","再生法","再学習法","保持率"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A57","stem":"再学習法から示された有名な曲線は何か。","answer":"エビングハウスの忘却曲線","group":"memory_model","term":"再学習法","note":"Ebbinghausはこの手続きで記憶の忘却を研究した。短縮された時間を保持率として見いだされたのがエビングハウスの忘却曲線である。","id":"p2q0199","options":["処理水準モデル","手続き記憶とプライミング","エビングハウスの忘却曲線","記憶の2貯蔵庫モデル"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q58","stem":"系列学習において、最初と最後に呈示された項目の記憶成績が中間に呈示された項目よりも高くなる現象を何と呼ぶか。","answer":"系列位置効果","group":"memory_term","term":"系列位置効果","note":"項目の最初の方の記憶成績が良いことを初頭効果、最後の方の記憶成績が良いことを新近性効果という。これらは長期記憶、短期記憶からなる記憶の2貯蔵庫モデルを支持するとされる。","id":"p2q0200","options":["TOT現象（喉まで出かかる現象）","ツァイガルニク効果","系列位置効果","プライミング"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A58","stem":"系列位置効果で、系列の最初の方の記憶成績が良い現象を何というか。","answer":"初頭効果","group":"serial_effect","term":"系列位置効果","note":"項目の最初の方の記憶成績が良いことを初頭効果、最後の方の記憶成績が良いことを新近性効果という。これらは長期記憶、短期記憶からなる記憶の2貯蔵庫モデルを支持するとされる。","id":"p2q0201","options":["特徴の差","初頭効果","新近性効果","刺激強度"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A58","stem":"系列位置効果で、系列の最後の方の記憶成績が良い現象を何というか。","answer":"新近性効果","group":"serial_effect","term":"系列位置効果","note":"項目の最初の方の記憶成績が良いことを初頭効果、最後の方の記憶成績が良いことを新近性効果という。これらは長期記憶、短期記憶からなる記憶の2貯蔵庫モデルを支持するとされる。","id":"p2q0202","options":["新近性効果","初頭効果","虹彩の調整","暗く見える"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A58","stem":"系列位置効果は、どの記憶モデルを支持するとされるか。","answer":"記憶の2貯蔵庫モデル","group":"memory_model","term":"系列位置効果","note":"項目の最初の方の記憶成績が良いことを初頭効果、最後の方の記憶成績が良いことを新近性効果という。これらは長期記憶、短期記憶からなる記憶の2貯蔵庫モデルを支持するとされる。","id":"p2q0203","options":["穴埋め問題や記述問題","処理水準モデル","エビングハウスの忘却曲線","記憶の2貯蔵庫モデル"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q59","stem":"感覚受容器から得たすべての情報が符号化されずに、瞬間的に保持される記憶を何と呼ぶか。","answer":"感覚記憶","group":"memory_store","term":"感覚記憶","note":"情報処理における符号化以前の段階。視覚情報の記憶はアイコニックメモリーで保持時間は1秒以内、聴覚情報の記憶はエコーイックメモリーで保持時間は数秒とされる。","id":"p2q0204","options":["長期記憶","感覚記憶","短期記憶","作動記憶（作業記憶）"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A59","stem":"視覚情報の感覚記憶を何というか。","answer":"アイコニックメモリー","group":"sensory_memory_type","term":"感覚記憶","note":"情報処理における符号化以前の段階。視覚情報の記憶はアイコニックメモリーで保持時間は1秒以内、聴覚情報の記憶はエコーイックメモリーで保持時間は数秒とされる。","id":"p2q0205","options":["半透明のゴーグル","手袋とカバー","エコーイックメモリー","アイコニックメモリー"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A59","stem":"聴覚情報の感覚記憶を何というか。","answer":"エコーイックメモリー","group":"sensory_memory_type","term":"感覚記憶","note":"情報処理における符号化以前の段階。視覚情報の記憶はアイコニックメモリーで保持時間は1秒以内、聴覚情報の記憶はエコーイックメモリーで保持時間は数秒とされる。","id":"p2q0206","options":["アイコニックメモリー","半透明のゴーグル","エコーイックメモリー","手袋とカバー"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A59","stem":"アイコニックメモリーの保持時間はどの程度か。","answer":"1秒以内","group":"sensory_duration","term":"感覚記憶","note":"情報処理における符号化以前の段階。視覚情報の記憶はアイコニックメモリーで保持時間は1秒以内、聴覚情報の記憶はエコーイックメモリーで保持時間は数秒とされる。","id":"p2q0207","options":["15〜30秒","数分","1秒以内","数秒"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A59","stem":"エコーイックメモリーの保持時間はどの程度か。","answer":"数秒","group":"sensory_duration","term":"感覚記憶","note":"情報処理における符号化以前の段階。視覚情報の記憶はアイコニックメモリーで保持時間は1秒以内、聴覚情報の記憶はエコーイックメモリーで保持時間は数秒とされる。","id":"p2q0208","options":["数分","1秒以内","数秒","15〜30秒"]},{"page":10,"chapter":"知覚・認知","origin":"左ページQuestion Q60","stem":"情報が注意を向けられることで符号化され、一時的に保持される記憶を何と呼ぶか。","answer":"短期記憶","group":"memory_store","term":"短期記憶","note":"感覚記憶のうち注意を向けられたものが短期記憶に送られる。保持時間は15秒〜30秒程度で、容量は7±2チャンク程度とされる。","id":"p2q0209","options":["感覚記憶","長期記憶","作動記憶（作業記憶）","短期記憶"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A60","stem":"短期記憶に送られるのは、感覚記憶のうちどのような情報か。","answer":"注意を向けられた情報","group":"memory_process","term":"短期記憶","note":"感覚記憶のうち注意を向けられたものが短期記憶に送られる。保持時間は15秒〜30秒程度で、容量は7±2チャンク程度とされる。","id":"p2q0210","options":["注意を向けられた情報","レミニセンス・バンプ","提示内容が以前覚えたものと一致するかの判断","そのまま書き出す"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A60","stem":"短期記憶の保持時間はどの程度か。","answer":"15〜30秒程度","group":"memory_duration","term":"短期記憶","note":"感覚記憶のうち注意を向けられたものが短期記憶に送られる。保持時間は15秒〜30秒程度で、容量は7±2チャンク程度とされる。","id":"p2q0211","options":["数分程度","30分程度","半永久的","15〜30秒程度"]},{"page":10,"chapter":"知覚・認知","origin":"右ページAnswer解説 A60","stem":"短期記憶の容量はどの程度とされるか。","answer":"7±2チャンク","group":"memory_capacity","term":"短期記憶","note":"感覚記憶のうち注意を向けられたものが短期記憶に送られる。保持時間は15秒〜30秒程度で、容量は7±2チャンク程度とされる。","id":"p2q0212","options":["限界がない","7±2チャンク","12±2チャンク","3±1チャンク"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q61","stem":"情報にイメージを加えたり、語呂合わせのような意味的処理を行ったりすることで既有の知識と結びつけるリハーサルを何と呼ぶか。","answer":"精緻化リハーサル","group":"memory_process_term","term":"精緻化リハーサル","note":"短期記憶内の情報を反復して想起することをリハーサルという。リハーサルには精緻化リハーサルと、情報を単純に繰り返す維持リハーサルがある。リハーサルによって忘却を防いだり長期記憶へ転送したりできる。","id":"p2q0213","options":["リハーサル","15〜30秒程度","精緻化リハーサル","ツァイガルニク効果"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A61","stem":"情報を単純に繰り返すリハーサルを何というか。","answer":"維持リハーサル","group":"rehearsal_type","term":"精緻化リハーサル","note":"短期記憶内の情報を反復して想起することをリハーサルという。リハーサルには精緻化リハーサルと、情報を単純に繰り返す維持リハーサルがある。リハーサルによって忘却を防いだり長期記憶へ転送したりできる。","id":"p2q0214","options":["二肢強制選択法","最小限の物理量","プルキンエ現象","維持リハーサル"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A61","stem":"リハーサルによって短期記憶の情報をどこへ転送できるか。","answer":"長期記憶","group":"memory_store","term":"精緻化リハーサル","note":"短期記憶内の情報を反復して想起することをリハーサルという。リハーサルには精緻化リハーサルと、情報を単純に繰り返す維持リハーサルがある。リハーサルによって忘却を防いだり長期記憶へ転送したりできる。","id":"p2q0215","options":["長期記憶","短期記憶","感覚記憶","作動記憶（作業記憶）"] 空間スケッチパッド、音韻ループ、エピソード・バッファ、それらを制御する中央実行系からなるモデルを提唱した。","id":"p2q0221","options":["音韻ループ","中央実行系","視空間スケッチパッド","情報処理の場"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A62","stem":"作動記憶の下位システムを制御する機構は何か。","answer":"中央実行系","group":"workingmemory_component","term":"作動記憶（作業記憶）","note":"短期記憶を情報の貯蔵庫ではなく情報処理の場として捉えた考え。Baddeley,A.（バッデリー）は視空間スケッチパッド、音韻ループ、エピソード・バッファ、それらを制御する中央実行系からなるモデルを提唱した。","id":"p2q0222","options":["中央実行系","音韻ループ","視空間スケッチパッド","情報処理の場"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q63","stem":"ほぼ無限の容量をもち、半永久的に保持される記憶を何と呼ぶか。","answer":"長期記憶","group":"memory_store","term":"長期記憶","note":"半永久的に保持され、容量にも限界がないとされる。短期記憶の情報がリハーサルによって長期記憶に送られるとされる。","id":"p2q0223","options":["長期記憶","短期記憶","感覚記憶","作動記憶（作業記憶）"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A63","stem":"長期記憶の保持期間はどのように表現されるか。","answer":"半永久的","group":"memory_duration","term":"長期記憶","note":"半永久的に保持され、容量にも限界がないとされる。短期記憶の情報がリハーサルによって長期記憶に送られるとされる。","id":"p2q0224","options":["半永久的","感覚記憶","15〜30秒程度","再学習法"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A63","stem":"長期記憶の容量はどのように考えられているか。","answer":"限界がない","group":"memory_capacity","term":"長期記憶","note":"半永久的に保持され、容量にも限界がないとされる。短期記憶の情報がリハーサルによって長期記憶に送られるとされる。","id":"p2q0225","options":["7±2チャンク","手続き記憶","自伝的記憶","限界がない"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A63","stem":"短期記憶から長期記憶への転送に関わる過程は何か。","answer":"リハーサル","group":"memory_process_term","term":"長期記憶","note":"半永久的に保持され、容量にも限界がないとされる。短期記憶の情報がリハーサルによって長期記憶に送られるとされる。","id":"p2q0226","options":["手続き記憶","リハーサル","限界がない","精緻化リハーサル"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q64","stem":"言葉やイメージで表現することのできる、事実に関する記憶を何と呼ぶか。","answer":"宣言的記憶（陳述記憶）","group":"memory_type","term":"宣言的記憶（陳述記憶）","note":"長期記憶の種類の1つで、言葉やイメージによって意識化できる記憶。意味記憶とエピソード記憶に分けられる。","id":"p2q0227","options":["非宣言的記憶（非陳述記憶）","エピソード記憶","宣言的記憶（陳述記憶）","手続き記憶"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A64","stem":"宣言的記憶の意識へのアクセスについて、最も適切な特徴はどれか。","answer":"意識化できる","group":"memory_awareness","term":"宣言的記憶（陳述記憶）","note":"長期記憶の種類の1つで、言葉やイメージによって意識化できる記憶。意味記憶とエピソード記憶に分けられる。","id":"p2q0228","options":["意識化できる","想起意識","必ずしも可能ではない","プライミング"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A64","stem":"宣言的記憶を構成する2種類の記憶は何か。","answer":"意味記憶とエピソード記憶","group":"memory_components","term":"宣言的記憶（陳述記憶）","note":"長期記憶の種類の1つで、言葉やイメージによって意識化できる記憶。意味記憶とエピソード記憶に分けられる。","id":"p2q0229","options":["多肢選択法や正誤判断問題","意味記憶とエピソード記憶","手続き記憶とプライミング","手続き記憶やプライミング"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q65","stem":"一般常識や言葉の意味などといった知識としての記憶を何と呼ぶか。","answer":"意味記憶","group":"memory_type","term":"意味記憶","note":"長期記憶の種類の1つ。例えば『富士山は標高3,776mの日本一高い山である』といった内容で、言語の使用に必要な記憶である。","id":"p2q0230","options":["意味記憶","潜在記憶","顕在記憶","非宣言的記憶（非陳述記憶）"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A65","stem":"意味記憶は、言語の何に必要な記憶とされるか。","answer":"言語の使用","group":"memory_function","term":"意味記憶","note":"長期記憶の種類の1つ。例えば『富士山は標高3,776mの日本一高い山である』といった内容で、言語の使用に必要な記憶である。","id":"p2q0231","options":["自伝的記憶","言語の使用","リハーサル","限界がない"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A65","stem":"意味記憶の例として示される富士山の標高は何mか。","answer":"3,776m","group":"memory_number","term":"意味記憶","note":"長期記憶の種類の1つ。例えば『富士山は標高3,776mの日本一高い山である』といった内容で、言語の使用に必要な記憶である。","id":"p2q0232","options":["5,776m","3,776m","2,776m","4,776m"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q66","stem":"個人が体験した出来事についての記憶を何と呼ぶか。","answer":"エピソード記憶","group":"memory_type","term":"エピソード記憶","note":"長期記憶の種類の1つで、時間や空間が特定された自分の経験に関する記憶。例えば『昨年富士山に登った』といった内容である。","id":"p2q0233","options":["顕在記憶","エピソード記憶","意味記憶","展望記憶"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A66","stem":"エピソード記憶では、自分の経験について何が特定されているか。","answer":"時間や空間","group":"memory_dimension","term":"エピソード記憶","note":"長期記憶の種類の1つで、時間や空間が特定された自分の経験に関する記憶。例えば『昨年富士山に登った』といった内容である。","id":"p2q0234","options":["自伝的記憶","限界がない","時間や空間","リハーサル"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A66","stem":"エピソード記憶の例として適切なものは何か。","answer":"昨年富士山に登ったという記憶","group":"memory_example","term":"エピソード記憶","note":"長期記憶の種類の1つで、時間や空間が特定された自分の経験に関する記憶。例えば『昨年富士山に登った』といった内容である。","id":"p2q0235","options":["穴埋め問題や記述問題","非宣言的記憶（非陳述記憶）","多肢選択法や正誤判断問題","昨年富士山に登ったという記憶"]},{"page":11,"chapter":"知覚・認知","origin":"左ページQuestion Q67","stem":"個人の経験した出来事の中でも強い感情や個人的な意味をもち、個人のアイデンティティと関連する記憶を何と呼ぶか。","answer":"自伝的記憶","group":"memory_type","term":"自伝的記憶","note":"長期記憶の種類の1つで、エピソード記憶の1つでもある。自分にとって重要な意味をもつ。","id":"p2q0236","options":["自伝的記憶","手続き記憶","エピソード記憶","展望記憶"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A67","stem":"自伝的記憶は、どの記憶の一種とされるか。","answer":"エピソード記憶","group":"memory_type","term":"自伝的記憶","note":"長期記憶の種類の1つで、エピソード記憶の1つでもある。自分にとって重要な意味をもつ。","id":"p2q0237","options":["自伝的記憶","意味記憶","エピソード記憶","手続き記憶"]},{"page":11,"chapter":"知覚・認知","origin":"右ページAnswer解説 A67","stem":"自伝的記憶が自分にとってもつ特徴は何か。","answer":"重要な意味をもつ","group":"autobiographical_property","term":"自伝的記憶","note":"長期記憶の種類の1つで、エピソード記憶の1つでもある。自分にとって重要な意味をもつ。","id":"p2q0238","options":["直接的に測定する","実施が簡便である","明るさや色の違い","重要な意味をもつ"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q68","stem":"必ずしも言葉やイメージで他者に伝えられるとは限らない記憶を何と呼ぶか。","answer":"非宣言的記憶（非陳述記憶）","group":"memory_type","term":"非宣言的記憶（非陳述記憶）","note":"長期記憶の種類の1つ。言葉やイメージによって意識化できるとは限らない記憶で、手続き記憶やプライミングなどに分けられる。","id":"p2q0239","options":["非宣言的記憶（非陳述記憶）","意味記憶","エピソード記憶","顕在記憶"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A68","stem":"非宣言的記憶に含まれる記憶の例を2つ挙げるとすれば何か。","answer":"手続き記憶とプライミング","group":"memory_components","term":"非宣言的記憶（非陳述記憶）","note":"長期記憶の種類の1つ。言葉やイメージによって意識化できるとは限らない記憶で、手続き記憶やプライミングなどに分けられる。","id":"p2q0240","options":["意味記憶とエピソード記憶","手続き記憶やプライミング","手続き記憶とプライミング","多肢選択法や正誤判断問題"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A68","stem":"非宣言的記憶は、言葉やイメージによる意識化が常に可能か。","answer":"必ずしも可能ではない","group":"memory_awareness","term":"非宣言的記憶（非陳述記憶）","note":"長期記憶の種類の1つ。言葉やイメージによって意識化できるとは限らない記憶で、手続き記憶やプライミングなどに分けられる。","id":"p2q0241","options":["必ずしも可能ではない","意識化できる","想起意識","注意を向けられた情報"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q69","stem":"自転車の乗り方や泳ぎ方など、特定の動作や技能に関する記憶を何と呼ぶか。","answer":"手続き記憶","group":"memory_type","term":"手続き記憶","note":"長期記憶の種類の1つ。ある目標に向かった活動が繰り返されることで一定のパターンとして形成され、十分にパターン化されると想起意識を伴わない。","id":"p2q0242","options":["潜在記憶","手続き記憶","自伝的記憶","意味記憶"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A69","stem":"手続き記憶は、ある活動がどのように行われることで形成されるか。","answer":"繰り返されることで形成される","group":"procedural_process","term":"手続き記憶","note":"長期記憶の種類の1つ。ある目標に向かった活動が繰り返されることで一定のパターンとして形成され、十分にパターン化されると想起意識を伴わない。","id":"p2q0243","options":["星や漁火、他の航空機の機外灯","気づくことのできる最小限の差","繰り返されることで形成される","利用可能性ヒューリスティック"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A69","stem":"手続きが十分にパターン化されると、何を伴わなくなるか。","answer":"想起意識","group":"memory_awareness","term":"手続き記憶","note":"長期記憶の種類の1つ。ある目標に向かった活動が繰り返されることで一定のパターンとして形成され、十分にパターン化されると想起意識を伴わない。","id":"p2q0244","options":["短期記憶","必ずしも可能ではない","意識化できる","想起意識"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q70","stem":"特定の情報が過去経験によって想起されやすくなる現象を何と呼ぶか。","answer":"プライミング","group":"memory_term","term":"プライミング","note":"長期記憶の種類の1つ。例えばテレビで放映されたカレーをおいしそうだと思い、それについて意識することなく夕飯にカレーを食べるといった経験がある。活性化拡散モデルによって説明される。","id":"p2q0245","options":["ツァイガルニク効果","レミニセンス・バンプ","プライミング","TOT現象（喉まで出かかる現象）"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A70","stem":"プライミングを説明するモデルは何か。","answer":"活性化拡散モデル","group":"language_model","term":"プライミング","note":"長期記憶の種類の1つ。例えばテレビで放映されたカレーをおいしそうだと思い、それについて意識することなく夕飯にカレーを食べるといった経験がある。活性化拡散モデルによって説明される。","id":"p2q0246","options":["影響する","メンタルレキシコン（心的辞書）","決定する","活性化拡散モデル"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A70","stem":"プライミングは、過去経験によって情報がどうなる現象か。","answer":"想起されやすくなる","group":"priming_effect","term":"プライミング","note":"長期記憶の種類の1つ。例えばテレビで放映されたカレーをおいしそうだと思い、それについて意識することなく夕飯にカレーを食べるといった経験がある。活性化拡散モデルによって説明される。","id":"p2q0247","options":["適応的なメカニズム","想起されやすくなる","カニッツァの三角形","桿体細胞の感度変化"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q71","stem":"想起意識を伴わない記憶を何と呼ぶか。","answer":"潜在記憶","group":"memory_type","term":"潜在記憶","note":"長期記憶の種類の1つで、手続き記憶やプライミングなどが含まれる。一方、エピソード記憶のように想起意識を伴う記憶を顕在記憶という。","id":"p2q0248","options":["顕在記憶","展望記憶","潜在記憶","手続き記憶"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A71","stem":"潜在記憶に含まれる記憶の例は何か。","answer":"手続き記憶やプライミング","group":"memory_components","term":"潜在記憶","note":"長期記憶の種類の1つで、手続き記憶やプライミングなどが含まれる。一方、エピソード記憶のように想起意識を伴う記憶を顕在記憶という。","id":"p2q0249","options":["手続き記憶とプライミング","手続き記憶やプライミング","意味記憶とエピソード記憶","多肢選択法や正誤判断問題"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A71","stem":"想起意識を伴う記憶を何というか。","answer":"顕在記憶","group":"memory_type","term":"潜在記憶","note":"長期記憶の種類の1つで、手続き記憶やプライミングなどが含まれる。一方、エピソード記憶のように想起意識を伴う記憶を顕在記憶という。","id":"p2q0250","options":["手続き記憶","エピソード記憶","展望記憶","顕在記憶"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q72","stem":"今より先の時点で行うことに関する記憶を何と呼ぶか。","answer":"展望記憶","group":"memory_type","term":"展望記憶","note":"例えば『来週の日曜日に友達と会う』といった予定に関する記憶。行為を意図した時点からそれを行うまでに時間が空き、その間はその行為について意識が離れている。","id":"p2q0251","options":["潜在記憶","非宣言的記憶（非陳述記憶）","自伝的記憶","展望記憶"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A72","stem":"展望記憶が扱うのは、過去と未来のどちらの予定か。","answer":"未来の予定","group":"prospective_time","term":"展望記憶","note":"例えば『来週の日曜日に友達と会う』といった予定に関する記憶。行為を意図した時点からそれを行うまでに時間が空き、その間はその行為について意識が離れている。","id":"p2q0252","options":["未来の予定","現在の状態","過去の出来事","一般的な知識"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A72","stem":"展望記憶では、行為を意図した時点から実行するまでの間、その行為への意識はどうなっているか。","answer":"いったん離れている","group":"prospective_property","term":"展望記憶","note":"例えば『来週の日曜日に友達と会う』といった予定に関する記憶。行為を意図した時点からそれを行うまでに時間が空き、その間はその行為について意識が離れている。","id":"p2q0253","options":["適応的なメカニズム","桿体細胞の感度変化","カニッツァの三角形","いったん離れている"]},{"page":12,"chapter":"知覚・認知","origin":"左ページQuestion Q73","stem":"Craik,F.I.M.（クレイク）とLockhart,R.S.（ロックハート）が提唱した、音や文字に注意を向ける浅い処理よりも、意味的・連想的な分析を行う深い処理の方が情報保持に優れるとする考えを何と呼ぶか。","answer":"処理水準モデル","group":"memory_model","term":"処理水準モデル","note":"情報の認知的処理は、感覚的・物理的分析を行う浅い水準から、意味的・連想的な分析を行う深い水準まで段階構造を有する。処理水準は逐次的な階層構造ではなく、記憶は認知的処理の副産物で、深く処理するほど保持が優れると考える。","id":"p2q0254","options":["処理水準モデル","エビングハウスの忘却曲線","プライミング","記憶の2貯蔵庫モデル"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A73","stem":"処理水準モデルを提唱した人物は誰か。","answer":"Craik,F.I.M.（クレイク）とLockhart,R.S.（ロックハート）","group":"memory_person","term":"処理水準モデル","note":"情報の認知的処理は、感覚的・物理的分析を行う浅い水準から、意味的・連想的な分析を行う深い水準まで段階構造を有する。処理水準は逐次的な階層構造ではなく、記憶は認知的処理の副産物で、深く処理するほど保持が優れると考える。","id":"p2q0255","options":["Ebbinghaus,H.（エビングハウス）","提示内容が以前覚えたものと一致するかの判断","Craik,F.I.M.（クレイク）とLockhart,R.S.（ロックハート）","Baddeley,A.（バッデリー）"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A73","stem":"処理水準モデルでは、情報保持がより優れるのはどのような処理か。","answer":"深い処理","group":"levels_property","term":"処理水準モデル","note":"情報の認知的処理は、感覚的・物理的分析を行う浅い水準から、意味的・連想的な分析を行う深い水準まで段階構造を有する。処理水準は逐次的な階層構造ではなく、記憶は認知的処理の副産物で、深く処理するほど保持が優れると考える。","id":"p2q0256","options":["特徴の差","深い処理","認知的処理","刺激強度"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A73","stem":"処理水準モデルでは、記憶を何の副産物と考えるか。","answer":"認知的処理","group":"levels_property","term":"処理水準モデル","note":"情報の認知的処理は、感覚的・物理的分析を行う浅い水準から、意味的・連想的な分析を行う深い水準まで段階構造を有する。処理水準は逐次的な階層構造ではなく、記憶は認知的処理の副産物で、深く処理するほど保持が優れると考える。","id":"p2q0257","options":["一対比較法","深い処理","認知的処理","暗く見える"]},{"page":12,"chapter":"知覚・認知","origin":"右ページAnswer解説 A73","stem":"深い処理の例として挙げられる分析は何か。","answer":"意味的・連想的な分析","group":"levels_processing","term":"処理水準モデル","note":"情報の認知的処理は、感覚的・物理的分析を行う浅い水準から、意味的・連想的な分析を行う深い水準まで段階構造を有する。処理水準は逐次的な階層構造ではなく、記憶は認知的処理の副産物で、深く処理するほど保持が優れると考える。","id":"p2q0258","options":["ミュラー・リヤー錯視","マグニチュード推定法","意味的・連想的な分析","スティーヴンスの法則"]},{"page":13,"chapter":"知覚・認知","origin":"左ページQuestion Q74","stem":"高齢者が10代〜30代頃に経験した出来事を想起しやすい現象を何と呼ぶか。","answer":"レミニセンス・バンプ","group":"memory_term","term":"レミニセンス・バンプ","note":"自伝的記憶の想起には、出来事を経験した時期、想起する年齢、想起量に特徴的な関連がある。0〜5歳頃までの出来事の想起量が極端に少ない幼児期健忘、最近の出来事ほどよく想起される新近性効果、そしてレミニセンス・バンプがある。","id":"p2q0259","options":["レミニセンス","レミニセンス・バンプ","TOT現象（喉まで出かかる現象）","ツァイガルニク効果"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A74","stem":"0〜5歳頃までの出来事の想起量が極端に少ない現象を何というか。","answer":"幼児期健忘","group":"autobio_effect","term":"レミニセンス・バンプ","note":"自伝的記憶の想起には、出来事を経験した時期、想起する年齢、想起量に特徴的な関連がある。0〜5歳頃までの出来事の想起量が極端に少ない幼児期健忘、最近の出来事ほどよく想起される新近性効果、そしてレミニセンス・バンプがある。","id":"p2q0260","options":["レミニセンス・バンプ","新近性効果","幼児期健忘","初頭効果"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A74","stem":"自伝的記憶で、最近の出来事ほどよく想起される現象を何というか。","answer":"新近性効果","group":"serial_effect","term":"レミニセンス・バンプ","note":"自伝的記憶の想起には、出来事を経験した時期、想起する年齢、想起量に特徴的な関連がある。0〜5歳頃までの出来事の想起量が極端に少ない幼児期健忘、最近の出来事ほどよく想起される新近性効果、そしてレミニセンス・バンプがある。","id":"p2q0261","options":["一対比較法","初頭効果","新近性効果","暗く見える"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A74","stem":"レミニセンス・バンプで想起されやすい年代はおおむね何代から何代か。","answer":"10代〜30代","group":"autobio_age","term":"レミニセンス・バンプ","note":"自伝的記憶の想起には、出来事を経験した時期、想起する年齢、想起量に特徴的な関連がある。0〜5歳頃までの出来事の想起量が極端に少ない幼児期健忘、最近の出来事ほどよく想起される新近性効果、そしてレミニセンス・バンプがある。","id":"p2q0262","options":["40代〜50代","60代以降","0〜5歳","10代〜30代"]},{"page":13,"chapter":"知覚・認知","origin":"左ページQuestion Q75","stem":"ある気分の時に記銘された情報は、その時と同じ気分であると想起されやすい現象を何と呼ぶか。","answer":"気分状態依存効果","group":"mood_memory_term","term":"気分状態依存効果","note":"楽しい気分の時に覚えたことは楽しい気分の時に、悲しい気分の時に覚えたことは悲しい気分の時に想起しやすい。気分に限らず、記銘した文脈と検索時の文脈が一致していると想起されやすいことを文脈依存効果という。","id":"p2q0263","options":["文脈依存効果","気分状態依存効果","気分一致効果","PNA現象"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A75","stem":"記銘時と検索時の文脈が一致すると想起されやすくなる現象を何というか。","answer":"文脈依存効果","group":"mood_memory_term","term":"気分状態依存効果","note":"楽しい気分の時に覚えたことは楽しい気分の時に、悲しい気分の時に覚えたことは悲しい気分の時に想起しやすい。気分に限らず、記銘した文脈と検索時の文脈が一致していると想起されやすいことを文脈依存効果という。","id":"p2q0264","options":["気分一致効果","文脈依存効果","気分状態依存効果","PNA現象"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A75","stem":"気分状態依存効果で想起が促進されるのは、記銘時と想起時の気分がどのような場合か。","answer":"同じ場合","group":"mood_condition","term":"気分状態依存効果","note":"楽しい気分の時に覚えたことは楽しい気分の時に、悲しい気分の時に覚えたことは悲しい気分の時に想起しやすい。気分に限らず、記銘した文脈と検索時の文脈が一致していると想起されやすいことを文脈依存効果という。","id":"p2q0265","options":["PNA現象","文脈依存効果","同じ場合","気分一致効果"]},{"page":13,"chapter":"知覚・認知","origin":"左ページQuestion Q76","stem":"気分と一致した感情価をもつ記憶の想起が促進される現象を何と呼ぶか。","answer":"気分一致効果","group":"mood_memory_term","term":"気分一致効果","note":"楽しい気分の時には楽しい出来事を、悲しい気分の時には悲しい出来事を想起しやすい。ポジティブ気分の場合は効果が安定しているが、ネガティブ気分の場合は不安定であり、PNA現象と呼ばれる。","id":"p2q0266","options":["文脈依存効果","気分一致効果","PNA現象","気分状態依存効果"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A76","stem":"気分一致効果で、楽しい気分のときに想起されやすい内容は何か。","answer":"楽しい出来事","group":"mood_content","term":"気分一致効果","note":"楽しい気分の時には楽しい出来事を、悲しい気分の時には悲しい出来事を想起しやすい。ポジティブ気分の場合は効果が安定しているが、ネガティブ気分の場合は不安定であり、PNA現象と呼ばれる。","id":"p2q0267","options":["楽しい出来事","悲しい出来事","文脈依存効果","気分一致効果"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A76","stem":"気分一致効果で、悲しい気分のときに想起されやすい内容は何か。","answer":"悲しい出来事","group":"mood_content","term":"気分一致効果","note":"楽しい気分の時には楽しい出来事を、悲しい気分の時には悲しい出来事を想起しやすい。ポジティブ気分の場合は効果が安定しているが、ネガティブ気分の場合は不安定であり、PNA現象と呼ばれる。","id":"p2q0268","options":["気分一致効果","文脈依存効果","悲しい出来事","楽しい出来事"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A76","stem":"ネガティブ気分で気分一致効果が不安定である現象を何と呼ぶか。","answer":"PNA現象","group":"mood_memory_term","term":"気分一致効果","note":"楽しい気分の時には楽しい出来事を、悲しい気分の時には悲しい出来事を想起しやすい。ポジティブ気分の場合は効果が安定しているが、ネガティブ気分の場合は不安定であり、PNA現象と呼ばれる。","id":"p2q0269","options":["気分状態依存効果","文脈依存効果","気分一致効果","PNA現象"]},{"page":13,"chapter":"知覚・認知","origin":"左ページQuestion Q77","stem":"通常は時間の経過とともに記憶成績が低下するが、記銘直後より一定時間後の方が成績がよい現象を何と呼ぶか。","answer":"レミニセンス","group":"memory_term","term":"レミニセンス","note":"有意味語でも無意味綴りでも生じうる。有意味語の再生で比較的長い時間後に生じるバラード・ウィリアムズ現象と、無意味綴りの再生で比較的短時間に生じるワード・ホヴランド現象がある。","id":"p2q0270","options":["プライミング","レミニセンス・バンプ","ツァイガルニク効果","レミニセンス"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A77","stem":"有意味語の再生で比較的長い時間後にみられるレミニセンスを何というか。","answer":"バラード・ウィリアムズ現象","group":"reminiscence_type","term":"レミニセンス","note":"有意味語でも無意味綴りでも生じうる。有意味語の再生で比較的長い時間後に生じるバラード・ウィリアムズ現象と、無意味綴りの再生で比較的短時間に生じるワード・ホヴランド現象がある。","id":"p2q0271","options":["気づくことのできる最小限の差","非宣言的記憶（非陳述記憶）","ワード・ホヴランド現象","バラード・ウィリアムズ現象"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A77","stem":"無意味綴りの再生で比較的短時間にみられるレミニセンスを何というか。","answer":"ワード・ホヴランド現象","group":"reminiscence_type","term":"レミニセンス","note":"有意味語でも無意味綴りでも生じうる。有意味語の再生で比較的長い時間後に生じるバラード・ウィリアムズ現象と、無意味綴りの再生で比較的短時間に生じるワード・ホヴランド現象がある。","id":"p2q0272","options":["夜間飛行中のパイロット","既有の知識や予想・期待","バラード・ウィリアムズ現象","ワード・ホヴランド現象"]},{"page":13,"chapter":"知覚・認知","origin":"左ページQuestion Q78","stem":"完了した事柄よりも未完了の事柄の方が想起されやすい現象を何と呼ぶか。","answer":"ツァイガルニク効果","group":"memory_term","term":"ツァイガルニク効果","note":"人がある欲求から目標指向的な行動をすると緊張が生じるが、目標が達成されれば解消される。そのため目標が達成されない事柄の方が忘れにくいとされる。","id":"p2q0273","options":["ツァイガルニク効果","レミニセンス・バンプ","TOT現象（喉まで出かかる現象）","系列位置効果"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A78","stem":"ツァイガルニク効果で、目標指向的な行動をすると生じるものは何か。","answer":"緊張","group":"zeigarnik_process","term":"ツァイガルニク効果","note":"人がある欲求から目標指向的な行動をすると緊張が生じるが、目標が達成されれば解消される。そのため目標が達成されない事柄の方が忘れにくいとされる。","id":"p2q0274","options":["解消される","2つ","飽き","緊張"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A78","stem":"ツァイガルニク効果で、目標達成後に緊張はどうなるか。","answer":"解消される","group":"zeigarnik_process","term":"ツァイガルニク効果","note":"人がある欲求から目標指向的な行動をすると緊張が生じるが、目標が達成されれば解消される。そのため目標が達成されない事柄の方が忘れにくいとされる。","id":"p2q0275","options":["緊張","一対比較法","解消される","暗く見える"]},{"page":13,"chapter":"知覚・認知","origin":"右ページAnswer解説 A78","stem":"ツァイガルニク効果では、どのような課題が忘れにくいとされるか。","answer":"未完了課題","group":"zeigarnik_target","term":"ツァイガルニク効果","note":"人がある欲求から目標指向的な行動をすると緊張が生じるが、目標が達成されれば解消される。そのため目標が達成されない事柄の方が忘れにくいとされる。","id":"p2q0276","options":["未完了課題","解消される","暗く見える","一対比較法"]},{"page":14,"chapter":"知覚・認知","origin":"左ページQuestion Q79","stem":"自らの認知活動を客観的に捉え、制御する認知機能を何と呼ぶか。","answer":"メタ認知","group":"metacognition_term","term":"メタ認知","note":"自分の認知活動を監視し、目標に沿っているかを評価し、制御を行う高次の認知活動。認知に関する知識であるメタ認知的知識と、自らの認知状態の監視・評価・制御を行うメタ認知的活動に分かれる。","id":"p2q0277","options":["監視","評価","メタ認知","制御"]},{"page":14,"chapter":"知覚・認知","origin":"右ページAnswer解説 A79","stem":"メタ認知において、自分の認知活動を見張る働きを何というか。","answer":"監視","group":"metacognition_activity","term":"メタ認知","note":"自分の認知活動を監視し、目標に沿っているかを評価し、制御を行う高次の認知 in":"右ページAnswer解説 A80","stem":"TOT現象はどのような語に対して生じやすいか。","answer":"人名","group":"tot_target","term":"TOT現象（喉まで出かかる現象）","note":"ある単語について最初の文字が分かっているが出てこないといった状態。一般的に若年者より高齢者にみられ、人名に対して生じやすい。","id":"p2q0285","options":["2つ","人名","慣れ","飽き"]},{"page":15,"chapter":"学習","origin":"左ページQuestion Q1","stem":"各種の動物が生得的にもつ性質が学習を規定する傾向を何と呼ぶか。","answer":"学習の生物学的制約","group":"learning_term","term":"学習の生物学的制約","note":"種によって学習が容易な刺激と反応の組み合わせ、学習が困難な組み合わせがある。例えばラットは食物後に嘔吐するとその食物を避けるようになるが、食物後に電気ショックが対呈示されてもその食物を避けるようにはならない。","id":"p2q0286","options":["学習の生物学的制約","代理強化","学習性無力感","洞察学習"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A1","stem":"学習の生物学的制約では、学習のしやすさは何によって異なるか。","answer":"種","group":"learning_basis","term":"学習の生物学的制約","note":"種によって学習が容易な刺激と反応の組み合わせ、学習が困難な組み合わせがある。例えばラットは食物後に嘔吐するとその食物を避けるようになるが、食物後に電気ショックが対呈示されてもその食物を避けるようにはならない。","id":"p2q0287","options":["種","潜在学習","嘔吐","代理強化"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A1","stem":"ラットでは、食物摂取後に何が起こるとその食物を避ける学習が成立しやすいか。","answer":"嘔吐","group":"learning_example","term":"学習の生物学的制約","note":"種によって学習が容易な刺激と反応の組み合わせ、学習が困難な組み合わせがある。例えばラットは食物後に嘔吐するとその食物を避けるようになるが、食物後に電気ショックが対呈示されてもその食物を避けるようにはならない。","id":"p2q0288","options":["潜在学習","嘔吐","代理強化","電気ショック"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A1","stem":"ラットでは、食物摂取後に何を対呈示してもその食物を避ける学習が成立しにくいとされるか。","answer":"電気ショック","group":"learning_example","term":"学習の生物学的制約","note":"種によって学習が容易な刺激と反応の組み合わせ、学習が困難な組み合わせがある。例えばラットは食物後に嘔吐するとその食物を避けるようになるが、食物後に電気ショックが対呈示されてもその食物を避けるようにはならない。","id":"p2q0289","options":["電気ショック","学習性無力感","試行錯誤学習","嘔吐"]},{"page":15,"chapter":"学習","origin":"左ページQuestion Q2","stem":"生理的な反射をもたらす無条件刺激と、もともとは中性的な刺激を対呈示することで、条件刺激だけでも同様の反応を生じさせる一連の手続きを何と呼ぶか。","answer":"レスポンデント条件づけ（古典的条件づけ）","group":"conditioning_term","term":"レスポンデント条件づけ（古典的条件づけ）","note":"代表的な実験としてPavlov,I.P.（パブロフ）の条件反射や、Watson,J.B.（ワトソン）によるアルバート坊やの実験がある。","id":"p2q0290","options":["オペラント条件づけ（道具的条件づけ）","レスポンデント条件づけ（古典的条件づけ）","レスポンデント条件づけ","オペラント条件づけ"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A2","stem":"レスポンデント条件づけの代表的研究者として挙げられる人物は誰か。","answer":"Pavlov,I.P.（パブロフ）","group":"conditioning_person","term":"レスポンデント条件づけ（古典的条件づけ）","note":"代表的な実験としてPavlov,I.P.（パブロフ）の条件反射や、Watson,J.B.（ワトソン）によるアルバート坊やの実験がある。","id":"p2q0291","options":["Skinner,B.F.（スキナー）","Bandura,A.（バンデューラ）","Pavlov,I.P.（パブロフ）","Watson,J.B.（ワトソン）"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A2","stem":"レスポンデント条件づけを用いた恐怖条件づけの有名な実験は何か。","answer":"アルバート坊やの実験","group":"conditioning_example","term":"レスポンデント条件づけ（古典的条件づけ）","note":"代表的な実験としてPavlov,I.P.（パブロフ）の条件反射や、Watson,J.B.（ワトソン）によるアルバート坊やの実験がある。","id":"p2q0292","options":["オペラント条件づけ","アルバート坊やの実験","嫌悪条件づけ","レスポンデント条件づけ"]},{"page":15,"chapter":"学習","origin":"左ページQuestion Q3","stem":"イヌに唾液分泌を引き起こす肉粉を与える際にベル音を聞かせることを繰り返し、やがてベル音だけでも唾液を分泌することを発見した人物は誰か。","answer":"Pavlov,I.P.（パブロフ）","group":"conditioning_person","term":"Pavlov,I.P.（パブロフ）","note":"イヌを被験体とした唾液分泌の研究で、肉粉を無条件刺激、ベル音を条件刺激として対呈示し、ベル音だけで唾液分泌が生じる条件反射を示した。","id":"p2q0293","options":["Pavlov,I.P.（パブロフ）","Skinner,B.F.（スキナー）","Watson,J.B.（ワトソン）","Bandura,A.（バンデューラ）"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A3","stem":"パブロフの実験で無条件刺激として用いられたものは何か。","answer":"肉粉","group":"pavlov_stimulus","term":"Pavlov,I.P.（パブロフ）","note":"イヌを被験体とした唾液分泌の研究で、肉粉を無条件刺激、ベル音を条件刺激として対呈示し、ベル音だけで唾液分泌が生じる条件反射を示した。","id":"p2q0294","options":["嘔吐","ベル音","般化","肉粉"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A3","stem":"パブロフの実験で条件刺激として用いられたものは何か。","answer":"ベル音","group":"pavlov_stimulus","term":"Pavlov,I.P.（パブロフ）","note":"イヌを被験体とした唾液分泌の研究で、肉粉を無条件刺激、ベル音を条件刺激として対呈示し、ベル音だけで唾液分泌が生じる条件反射を示した。","id":"p2q0295","options":["肉粉","反応数","強化子","ベル音"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A3","stem":"パブロフの実験で測定された条件反応は何か。","answer":"唾液分泌","group":"pavlov_response","term":"Pavlov,I.P.（パブロフ）","note":"イヌを被験体とした唾液分泌の研究で、肉粉を無条件刺激、ベル音を条件刺激として対呈示し、ベル音だけで唾液分泌が生じる条件反射を示した。","id":"p2q0296","options":["自発的な","白ネズミ","大きな音","唾液分泌"]},{"page":15,"chapter":"学習","origin":"左ページQuestion Q4","stem":"生後11か月のアルバート坊やが白ネズミに触ろうとすると同時に大きな音を鳴らし、白ネズミを怖がるようにした恐怖条件づけ実験を行った人物は誰か。","answer":"Watson,J.B.（ワトソン）","group":"conditioning_person","term":"Watson,J.B.（ワトソン）","note":"この実験では無条件刺激が大きな音、条件刺激が白ネズミで、これらの対呈示を繰り返すと白ネズミを見ただけで泣く条件反応がみられた。","id":"p2q0297","options":["Skinner,B.F.（スキナー）","Pavlov,I.P.（パブロフ）","Watson,J.B.（ワトソン）","Bandura,A.（バンデューラ）"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A4","stem":"アルバート坊やの実験で無条件刺激として用いられたものは何か。","answer":"大きな音","group":"albert_stimulus","term":"Watson,J.B.（ワトソン）","note":"この実験では無条件刺激が大きな音、条件刺激が白ネズミで、これらの対呈示を繰り返すと白ネズミを見ただけで泣く条件反応がみられた。","id":"p2q0298","options":["大きな音","自発的な","白ネズミ","唾液分泌"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A4","stem":"アルバート坊やの実験で条件刺激として用いられたものは何か。","answer":"白ネズミ","group":"albert_stimulus","term":"Watson,J.B.（ワトソン）","note":"この実験では無条件刺激が大きな音、条件刺激が白ネズミで、これらの対呈示を繰り返すと白ネズミを見ただけで泣く条件反応がみられた。","id":"p2q0299","options":["自発的な","唾液分泌","大きな音","白ネズミ"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A4","stem":"アルバート坊やの実験で形成された条件反応は何か。","answer":"白ネズミを見て泣く恐怖反応","group":"albert_response","term":"Watson,J.B.（ワトソン）","note":"この実験では無条件刺激が大きな音、条件刺激が白ネズミで、これらの対呈示を繰り返すと白ネズミを見ただけで泣く条件反応がみられた。","id":"p2q0300","options":["白ネズミを見て泣く恐怖反応","目的に沿って再体制化された","ガルシア効果（味覚嫌悪学習）","学習の構え（学習セット）"]},{"page":15,"chapter":"学習","origin":"左ページQuestion Q5","stem":"有機体のオペラント行動に報酬や罰などを与えることによって、その行動の生起回数を変化させる一連の手続きを何と呼ぶか。","answer":"オペラント条件づけ（道具的条件づけ）","group":"conditioning_term","term":"オペラント条件づけ（道具的条件づけ）","note":"オペラントは『自発的な』という意味であり、行動は先行する刺激によって誘発されるのではなく、環境に働きかけるように自発的になされる。","id":"p2q0301","options":["オペラント条件づけ","嫌悪条件づけ","オペラント条件づけ（道具的条件づけ）","レスポンデント条件づけ（古典的条件づけ）"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A5","stem":"オペラントという語が表す意味は何か。","answer":"自発的な","group":"operant_property","term":"オペラント条件づけ（道具的条件づけ）","note":"オペラントは『自発的な』という意味であり、行動は先行する刺激によって誘発されるのではなく、環境に働きかけるように自発的になされる。","id":"p2q0302","options":["環境に働きかける","ブザー音","自発的な","スキナー箱"]},{"page":15,"chapter":"学習","origin":"右ページAnswer解説 A5","stem":"オペラント行動は環境に対してどのような働きをするか。","answer":"環境に働きかける","group":"operant_property","term":"オペラント条件づけ（道具的条件づけ）","note":"オペラントは『自発的な』という意味であり、行動は先行する刺激によって誘発されるのではなく、環境に働きかけるように自発的になされる。","id":"p2q0303","options":["三項随伴性","自発的な","環境に働きかける","スキナー箱"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q6","stem":"レバーを押すとエサが得られる実験装置を用いて、ネズミのレバー押し学習を研究した人物は誰か。","answer":"Skinner,B.F.（スキナー）","group":"conditioning_person","term":"Skinner,B.F.（スキナー）","note":"実験装置はスキナー箱と呼ばれる。空腹のネズミを箱に入れ、ブザー音のとき偶然レバーを押すとエサが出る経験を繰り返すと、ブザー音のとき自発的なレバー押しがみられるようになる。","id":"p2q0304","options":["Pavlov,I.P.（パブロフ）","Bandura,A.（バンデューラ）","Watson,J.B.（ワトソン）","Skinner,B.F.（スキナー）"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A6","stem":"スキナーがレバー押し学習に用いた装置を何というか。","answer":"スキナー箱","group":"operant_apparatus","term":"Skinner,B.F.（スキナー）","note":"実験装置はスキナー箱と呼ばれる。空腹のネズミを箱に入れ、ブザー音のとき偶然レバーを押すとエサが出る経験を繰り返すと、ブザー音のとき自発的なレバー押しがみられるようになる。","id":"p2q0305","options":["スキナー箱","ブザー音","三項随伴性","自発的な"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A6","stem":"スキナー箱の例で、レバー押し行動の後に与えられるものは何か。","answer":"エサ","group":"operant_consequence","term":"Skinner,B.F.（スキナー）","note":"実験装置はスキナー箱と呼ばれる。空腹のネズミを箱に入れ、ブザー音のとき偶然レバーを押すとエサが出る経験を繰り返すと、ブザー音のとき自発的なレバー押しがみられるようになる。","id":"p2q0306","options":["強化子","ブザー音","エサ","自発的な"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A6","stem":"スキナー箱の例で、レバー押しが起こる手がかりとなる音は何か。","answer":"ブザー音","group":"operant_stimulus","term":"Skinner,B.F.（スキナー）","note":"実験装置はスキナー箱と呼ばれる。空腹のネズミを箱に入れ、ブザー音のとき偶然レバーを押すとエサが出る経験を繰り返すと、ブザー音のとき自発的なレバー押しがみられるようになる。","id":"p2q0307","options":["自発的な","強化子","ブザー音","スキナー箱"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q7","stem":"オペラント条件づけにおける、弁別刺激―オペラント反応―強化子という一連の過程を何と呼ぶか。","answer":"三項随伴性","group":"operant_term","term":"三項随伴性","note":"スキナー箱のネズミの例では、弁別刺激がブザー音、オペラント反応がレバー押し行動、強化子がエサである。","id":"p2q0308","options":["三項随伴性","ブザー音","スキナー箱","自発的な"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A7","stem":"三項随伴性の第1の要素は何か。","answer":"弁別刺激","group":"three_term_component","term":"三項随伴性","note":"スキナー箱のネズミの例では、弁別刺激がブザー音、オペラント反応がレバー押し行動、強化子がエサである。","id":"p2q0309","options":["唾液分泌","弁別刺激","強化子","オペラント反応"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A7","stem":"三項随伴性の第2の要素は何か。","answer":"オペラント反応","group":"three_term_component","term":"三項随伴性","note":"スキナー箱のネズミの例では、弁別刺激がブザー音、オペラント反応がレバー押し行動、強化子がエサである。","id":"p2q0310","options":["オペラント反応","負の弱化（罰）","強化子","弁別刺激"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A7","stem":"三項随伴性の第3の要素は何か。","answer":"強化子","group":"three_term_component","term":"三項随伴性","note":"スキナー箱のネズミの例では、弁別刺激がブザー音、オペラント反応がレバー押し行動、強化子がエサである。","id":"p2q0311","options":["弁別刺激","強化子","反応数","オペラント反応"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A7","stem":"スキナー箱の例で三項随伴性の強化子は何か。","answer":"エサ","group":"operant_consequence","term":"三項随伴性","note":"スキナー箱のネズミの例では、弁別刺激がブザー音、オペラント反応がレバー押し行動、強化子がエサである。","id":"p2q0312","options":["強化子","ブザー音","エサ","自発的な"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q8","stem":"条件刺激だけでなく、それと類似した他の刺激についても同様の反応が生じることを何と呼ぶか。","answer":"般化","group":"conditioning_process","term":"般化","note":"アルバート坊やの実験では、白ネズミへの恐怖条件づけ成立後、白ウサギやサンタクロースのお面などにも泣く恐怖反応が生じるようになった。","id":"p2q0313","options":["弁別","般化","消去","自発的回復"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A8","stem":"アルバート坊やの実験で般化がみられた刺激の例は何か。","answer":"白ウサギやサンタクロースのお面","group":"generalization_example","term":"般化","note":"アルバート坊やの実験では、白ネズミへの恐怖条件づけ成立後、白ウサギやサンタクロースのお面などにも泣く恐怖反応が生じるようになった。","id":"p2q0314","options":["白い布","黒いネズミ","白ウサギやサンタクロースのお面","ベルの音"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A8","stem":"般化では、条件刺激とどのような刺激にも反応が広がるか。","answer":"類似した刺激","group":"generalization_basis","term":"般化","note":"アルバート坊やの実験では、白ネズミへの恐怖条件づけ成立後、白ウサギやサンタクロースのお面などにも泣く恐怖反応が生じるようになった。","id":"p2q0315","options":["時々行われる","抑制する過程","電気ショック","類似した刺激"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q9","stem":"特定の刺激に対してのみ反応が生じるようになることを何と呼ぶか。","answer":"弁別","group":"conditioning_process","term":"弁別","note":"スキナー箱のレバー押し学習で、ブザー音が鳴ったときだけレバーを押せばエサがもらえるようにすると、別の音が鳴ってもレバーを押さなくなる。","id":"p2q0316","options":["消去","般化","弁別","自発的回復"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A9","stem":"弁別では、どのような刺激に対して反応するようになるか。","answer":"特定の刺激","group":"discrimination_target","term":"弁別","note":"スキナー箱のレバー押し学習で、ブザー音が鳴ったときだけレバーを押せばエサがもらえるようにすると、別の音が鳴ってもレバーを押さなくなる。","id":"p2q0317","options":["三項随伴性","スキナー箱","自発的回復","特定の刺激"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A9","stem":"スキナー箱の弁別の例で、反応が生じる手がかりとなる刺激は何か。","answer":"ブザー音","group":"operant_stimulus","term":"弁別","note":"スキナー箱のレバー押し学習で、ブザー音が鳴ったときだけレバーを押せばエサがもらえるようにすると、別の音が鳴ってもレバーを押さなくなる。","id":"p2q0318","options":["スキナー箱","強化子","自発的な","ブザー音"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q10","stem":"レスポンデント条件づけで条件反応が形成された後、条件刺激のみを呈示し続けると条件反応が消失することを何と呼ぶか。","answer":"消去","group":"conditioning_process","term":"消去","note":"条件づけで形成された反応が強化されないことで見られなくなること。オペラント条件づけでは、オペラント反応後に強化子を与えないことを続けると反応頻度が低下してやがて見られなくなる。","id":"p2q0319","options":["弁別","般化","消去","自発的回復"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A10","stem":"オペラント条件づけの消去では、反応後に何を与えないようにするか。","answer":"強化子","group":"operant_consequence","term":"消去","note":"条件づけで形成された反応が強化されないことで見られなくなること。オペラント条件づけでは、オペラント反応後に強化子を与えないことを続けると反応頻度が低下してやがて見られなくなる。","id":"p2q0320","options":["自発的な","強化子","ブザー音","エサ"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A10","stem":"オペラント条件づけで消去が進むと、反応の生起頻度はどうなるか。","answer":"低下する","group":"extinction_effect","term":"消去","note":"条件づけで形成された反応が強化されないことで見られなくなること。オペラント条件づけでは、オペラント反応後に強化子を与えないことを続けると反応頻度が低下してやがて見られなくなる。","id":"p2q0321","options":["唾液分泌","白ネズミ","大きな音","低下する"]},{"page":16,"chapter":"学習","origin":"左ページQuestion Q11","stem":"消去によって条件反応が完全に見られなくなった後、一定の休止期間を経て再び条件刺激を呈示すると、一時的に条件反応が生起することを何と呼ぶか。","answer":"自発的回復","group":"conditioning_process","term":"自発的回復","note":"自発的回復から、消去は反応を消し去る過程ではなく、抑制する過程であることが示される。","id":"p2q0322","options":["消去","弁別","自発的回復","般化"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A11","stem":"自発的回復から、消去は反応を消去するのではなく何する過程と考えられるか。","answer":"抑制する過程","group":"extinction_property","term":"自発的回復","note":"自発的回復から、消去は反応を消し去る過程ではなく、抑制する過程であることが示される。","id":"p2q0323","options":["類似した刺激","時々行われる","電気ショック","抑制する過程"]},{"page":16,"chapter":"学習","origin":"右ページAnswer解説 A11","stem":"自発的回復がみられるためには、消去後に何が置かれるか。","answer":"一定の休止期間","group":"extinction_condition","term":"自発的回復","note":"自発的回復から、消去は反応を消し去る過程ではなく、抑制する過程であることが示される。","id":"p2q0324","options":["一定の休止期間","オペラント反応","正の弱化（罰）","負の弱化（罰）"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q12","stem":"オペラント反応後に快刺激が呈示されることで、オペラント反応の生起回数が増えることを何と呼ぶか。","answer":"正の強化","group":"reinforcement_term","term":"正の強化","note":"強化はオペラント反応に後続する結果によって反応頻度が増加すること。刺激が呈示されることを正という。手伝いの後におこづかいをもらい手伝いの頻度が増える例がある。","id":"p2q0325","options":["負の強化","負の弱化（罰）","正の弱化（罰）","正の強化"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A12","stem":"正の強化では、反応の直後に環境へどのような操作が行われるか。","answer":"刺激の呈示","group":"reinforcement_operation","term":"正の強化","note":"強化はオペラント反応に後続する結果によって反応頻度が増加すること。刺激が呈示されることを正という。手伝いの後におこづかいをもらい手伝いの頻度が増える例がある。","id":"p2q0326","options":["おこづかい","刺激の除去","正の強化","刺激の呈示"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A12","stem":"正の強化の例として、手伝いの後に何をもらうと手伝いが増えるとされるか。","answer":"おこづかい","group":"reinforcement_example","term":"正の強化","note":"強化はオペラント反応に後続する結果によって反応頻度が増加すること。刺激が呈示されることを正という。手伝いの後におこづかいをもらい手伝いの頻度が増える例がある。","id":"p2q0327","options":["叱責","おこづかい","頭痛","刺激の呈示"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A12","stem":"強化が生じると、反応頻度はどうなるか。","answer":"増加する","group":"reinforcement_effect","term":"正の強化","note":"強化はオペラント反応に後続する結果によって反応頻度が増加すること。刺激が呈示されることを正という。手伝いの後におこづかいをもらい手伝いの頻度が増える例がある。","id":"p2q0328","options":["負の強化","減少する","増加する","正の強化"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q13","stem":"オペラント反応後に不快刺激が除去されることで、オペラント反応の生起回数が増えることを何と呼ぶか。","answer":"負の強化","group":"reinforcement_term","term":"負の強化","note":"刺激が除去されることを負という。頭痛時に薬を飲んだ後に頭痛が治まり、薬を飲む頻度が増えることなどが例として挙げられる。","id":"p2q0329","options":["負の強化","正の弱化（罰）","負の弱化（罰）","正の強化"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A13","stem":"負の強化で、反応後に起こるのは刺激の呈示と除去のどちらか。","answer":"刺激の除去","group":"reinforcement_operation","term":"負の強化","note":"刺激が除去されることを負という。頭痛時に薬を飲んだ後に頭痛が治まり、薬を飲む頻度が増えることなどが例として挙げられる。","id":"p2q0330","options":["刺激の呈示","おこづかい","正の強化","刺激の除去"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A13","stem":"負の強化の例で、薬を飲む反応の後に除去される不快刺激は何か。","answer":"頭痛","group":"reinforcement_example","term":"負の強化","note":"刺激が除去されることを負という。頭痛時に薬を飲んだ後に頭痛が治まり、薬を飲む頻度が増えることなどが例として挙げられる。","id":"p2q0331","options":["負の強化","おこづかい","頭痛","叱責"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A13","stem":"負の強化が生じると、反応頻度はどうなるか。","answer":"増加する","group":"reinforcement_effect","term":"負の強化","note":"刺激が除去されることを負という。頭痛時に薬を飲んだ後に頭痛が治まり、薬を飲む頻度が増えることなどが例として挙げられる。","id":"p2q0332","options":["増加する","負の強化","減少する","正の強化"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q14","stem":"オペラント反応後に不快刺激が呈示されることで、オペラント反応の生起回数が低下することを何と呼ぶか。","answer":"正の弱化（罰）","group":"reinforcement_term","term":"正の弱化（罰）","note":"弱化はオペラント反応に後続する結果によって反応頻度が減少すること。正の弱化の例として、いたずらをした後に怒られていたずらが減ることが挙げられる。","id":"p2q0333","options":["正の弱化（罰）","負の強化","負の弱化（罰）","正の強化"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A14","stem":"正の弱化（正の罰）では、反応の直後に環境へどのような操作が行われるか。","answer":"刺激の呈示","group":"reinforcement_operation","term":"正の弱化（罰）","note":"弱化はオペラント反応に後続する結果によって反応頻度が減少すること。正の弱化の例として、いたずらをした後に怒られていたずらが減ることが挙げられる。","id":"p2q0334","options":["刺激の呈示","正の強化","おこづかい","刺激の除去"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A14","stem":"正の弱化の例で、いたずらの後に与えられる不快刺激は何か。","answer":"叱責","group":"reinforcement_example","term":"正の弱化（罰）","note":"弱化はオペラント反応に後続する結果によって反応頻度が減少すること。正の弱化の例として、いたずらをした後に怒られていたずらが減ることが挙げられる。","id":"p2q0335","options":["叱責","正の強化","頭痛","おこづかい"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A14","stem":"弱化が生じると、反応頻度はどうなるか。","answer":"減少する","group":"reinforcement_effect","term":"正の弱化（罰）","note":"弱化はオペラント反応に後続する結果によって反応頻度が減少すること。正の弱化の例として、いたずらをした後に怒られていたずらが減ることが挙げられる。","id":"p2q0336","options":["減少する","負の強化","正の強化","増加する"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q15","stem":"オペラント反応後に快刺激が除去されることで、オペラント反応の生起回数が低下することを何と呼ぶか。","answer":"負の弱化（罰）","group":"reinforcement_term","term":"負の弱化（罰）","note":"負の弱化の具体例として、いたずらをした後におこづかいを減らされることでいたずらが減ることが挙げられる。","id":"p2q0337","options":["負の弱化（罰）","負の強化","正の強化","正の弱化（罰）"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A15","stem":"負の弱化で、反応後に起こるのは刺激の呈示と除去のどちらか。","answer":"刺激の除去","group":"reinforcement_operation","term":"負の弱化（罰）","note":"負の弱化の具体例として、いたずらをした後におこづかいを減らされることでいたずらが減ることが挙げられる。","id":"p2q0338","options":["刺激の除去","正の強化","おこづかい","刺激の呈示"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A15","stem":"負の弱化の例として、いたずらの後に何を減らすとされるか。","answer":"おこづかい","group":"reinforcement_example","term":"負の弱化（罰）","note":"負の弱化の具体例として、いたずらをした後におこづかいを減らされることでいたずらが減ることが挙げられる。","id":"p2q0339","options":["頭痛","叱責","おこづかい","刺激の呈示"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A15","stem":"負の弱化が生じると、反応頻度はどうなるか。","answer":"減少する","group":"reinforcement_effect","term":"負の弱化（罰）","note":"負の弱化の具体例として、いたずらをした後におこづかいを減らされることでいたずらが減ることが挙げられる。","id":"p2q0340","options":["正の強化","減少する","増加する","負の強化"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q16","stem":"特定のオペラント反応を、いつ、どのように強化するかについての規則を何と呼ぶか。","answer":"強化スケジュール","group":"schedule_term","term":"強化スケジュール","note":"強化を受ける反応が、その前に強化を受けた反応の出現からの経過時間や反応数によって分類される。","id":"p2q0341","options":["強化スケジュール","変動比率スケジュール","部分強化スケジュール","変動間隔スケジュール"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A16","stem":"強化スケジュールを分類する基準の1つは何か。","answer":"経過時間","group":"schedule_basis","term":"強化スケジュール","note":"強化を受ける反応が、その前に強化を受けた反応の出現からの経過時間や反応数によって分類される。","id":"p2q0342","options":["反応数","必要な反応回数","経過時間","反応回数"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A16","stem":"強化スケジュールを分類するもう1つの基準は何か。","answer":"反応数","group":"schedule_basis","term":"強化スケジュール","note":"強化を受ける反応が、その前に強化を受けた反応の出現からの経過時間や反応数によって分類される。","id":"p2q0343","options":["反応回数","経過時間","必要な反応回数","反応数"]},{"page":17,"chapter":"学習","origin":"左ページQuestion Q17","stem":"強化スケジュールにおいて、特定のオペラント反応が生じるたびに強化する場合を何と呼ぶか。","answer":"連続強化スケジュール","group":"schedule_term","term":"連続強化スケジュール","note":"同じオペラント反応が繰り返された場合に毎回強化を行う。例えば、手伝いをするたびにおこづかいをもらうことである。","id":"p2q0344","options":["強化スケジュール","ハンフリーズ効果（部分強化効果）","連続強化スケジュール","変動比率スケジュール"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A17","stem":"連続強化スケジュールでは、反応の何回ごとに強化するか。","answer":"毎回","group":"schedule_frequency","term":"連続強化スケジュール","note":"同じオペラント反応が繰り返された場合に毎回強化を行う。例えば、手伝いをするたびにおこづかいをもらうことである。","id":"p2q0345","options":["毎回","時々行われる","一部の反応","経過時間"]},{"page":17,"chapter":"学習","origin":"右ページAnswer解説 A17","stem":"連続強化スケジュールの例として挙げられるものは何か。","answer":"手伝いをするたびにおこづかいをもらう","group":"schedule_example","term":"連続強化スケジュール","note":"同じオペラント反応が繰り返された場合に毎回強化を行う。例えば、手伝いをするたびにおこづかいをもらうことである。","id":"p2q0346","options":["魚釣り","手伝いをするたびにおこづかいをもらう","月給制の給与","ギャンブル"]},{"page":18,"chapter":"学習","origin":"左ページQuestion Q18","stem":"強化スケジュールにおいて、特定のオペラント反応が生じた際に、毎回ではなく一部の反応を強化する場合を何と呼ぶか。","answer":"部分強化スケジュール","group":"schedule_term","term":"部分強化スケジュール","note":"同じオペラント反応が繰り返された場合に時々強化を行う。手伝いをしておこづかいをもらう場合もあれば、もらわない場合もある例が挙げられる。","id":"p2q0347","options":["部分強化スケジュール","変動間隔スケジュール","変動比率スケジュール","強化スケジュール"]},{"page":18,"chapter":"学習","origin":"右ページAnswer解説 A18","stem":"部分強化スケジュールでは、反応はどのような頻度で強化されるか。","answer":"一部の反応","group":"schedule_frequency","term":"部分強化スケジュール","note":"同じオペラント反応が繰り返された場合に時々強化を行う。手伝いをしておこづかいをもらう場合もあれば、もらわない場合もある例が挙げられる。","id":"p2q0348","options":["ギャンブル","時々行われる","毎回","一部の反応"]},{"page":18,"chapter":"学習","origin":"右ページAnswer解説 A18","stem":"部分強化スケジュールの特徴として、同じ反応に対する強化はどのように行われるか。","answer":"時々行われる","group":"schedule_frequency","term":"部分強化スケジュール","note":"同じオペラント反応が繰り返された場合に時々強化を行う。手伝いをしておこづかいをもらう場合もあれば、もらわない場合もある例が挙げられる。","id":"p2q0349","options":["月給制の給与","時々行われる","一部の反応","毎回"]},{"page":18,"chapter":"学習","origin":"左ページQuestion Q19","stem":"部分強化スケジュールにおいて、反応数に関わらず一定時間ごとに強化する場合を何と呼ぶか。","answer":"固定間隔スケジュール","group":"schedule_term","term":"固定間隔スケジュール","note":"前に強化を受けたオペラント反応の出現から次の強化を受ける反応の出現までの経過時間が一定。具体例に月給制の給与がある。反応数は関係ない。","id":"p2q0350","options":["固定間隔スケジュール
