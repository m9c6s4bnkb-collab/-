const POS=['名詞','動詞','形容詞','副詞','前置詞','接続詞'];
let current=null,currentMode=null,session={answered:0,correct:0};
let stats=JSON.parse(localStorage.getItem(STORAGE)||'{}');

function baseKey(x){return x.section+'|'+x.kind+'|'+x.page+'|'+x.en+'|'+x.ja}
function statKey(x,mode){return mode+'|'+baseKey(x)}
function getStat(x,mode){return stats[statKey(x,mode)]||{wrong:0,correct:0}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(stats))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function filtered(){
  let arr=WORDS.slice(), s=$('scope').value, mode=$('mode').value;
  if(s==='main')arr=arr.filter(x=>x.kind==='main');
  if(s==='related')arr=arr.filter(x=>x.kind==='related');
  if(s==='special')arr=arr.filter(x=>x.kind==='special');
  if(s==='730')arr=arr.filter(x=>x.section==='Score 730');
  if(s==='860')arr=arr.filter(x=>x.section==='Score 860');
  if(s==='unanswered')arr=arr.filter(x=>{const st=getStat(x,mode);return st.correct===0&&st.wrong===0});
  if(s==='wrong'||s==='wrong1')arr=arr.filter(x=>getStat(x,mode).wrong>=1);
  if(s==='wrong2')arr=arr.filter(x=>getStat(x,mode).wrong>=2);
  if(mode.startsWith('pos'))arr=arr.filter(x=>x.pos && x.pos.length && x.pos.every(p=>POS.includes(p)));
  return arr;
}

function updateStats(){
  const p=filtered(), mode=$('mode').value;
  $('pool').textContent=p.length;$('answered').textContent=session.answered;$('correct').textContent=session.correct;
  $('rate').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'0%';
}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function nextQ(){
 currentMode=$('mode').value; const p=filtered(); updateStats();
 if(!p.length){$('word').textContent='該当する問題がありません';$('body').innerHTML='';$('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');return}
 current=p[Math.floor(Math.random()*p.length)];
 $('word').textContent=current.en;
 $('kind').textContent=currentMode.startsWith('ja')?'英語 → 日本語':'英語 → 品詞';
 $('rel').textContent=current.section+'｜'+(current.kind==='main'?'見出し語':current.kind==='related'?'関連語・派生語':'特集ページ');
 $('page').textContent='PDF p.'+current.page;
 $('miss').textContent='誤答 '+getStat(current,currentMode).wrong+'回';
 $('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');
 renderBody();
}
function mark(ok){
 let s=getStat(current,currentMode); if(ok)s.correct++;else s.wrong++;
 stats[statKey(current,currentMode)]=s;save();session.answered++;if(ok)session.correct++;
 updateStats();$('miss').textContent='誤答 '+s.wrong+'回';$('next').classList.remove('hidden');
}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
$('start').onclick=nextQ;$('shuffle').onclick=nextQ;$('next').onclick=nextQ;
$('scope').onchange=updateStats;$('mode').onchange=()=>{currentMode=$('mode').value;updateStats();if(current)nextQ()};
$('reset').onclick=()=>{if(confirm('金フレ4の学習データをすべて消しますか？')){stats={};session={answered:0,correct:0};save();updateStats();nextQ()}};
let menuIsHidden=localStorage.getItem(MENUKEY)==='1';
function applyMenuVisibility(){['introCard','menuCard','statsCard'].forEach(id=>$(id).classList.toggle('menuHidden',menuIsHidden));$('menuToggle').textContent=menuIsHidden?'メニューを表示':'メニューを非表示'}
$('menuToggle').onclick=()=>{menuIsHidden=!menuIsHidden;localStorage.setItem(MENUKEY,menuIsHidden?'1':'0');applyMenuVisibility()};
applyMenuVisibility();currentMode=$('mode').value;updateStats();

function renderBody(){
 const b=$('body'); b.innerHTML='';
 if(currentMode==='ja4'){
   const same=WORDS.filter(x=>x!==current && x.ja!==current.ja && x.section===current.section && x.kind===current.kind);
   const fallback=WORDS.filter(x=>x!==current && x.ja!==current.ja && !same.includes(x));
   let ds=shuffle(same).slice(0,3);
   if(ds.length<3) ds=ds.concat(shuffle(fallback).slice(0,3-ds.length));
   let opts=shuffle([current,...ds]), wrap=document.createElement('div');wrap.className='choices';
   opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=x.ja;btn.onclick=()=>grade(btn,x===current,wrap);wrap.appendChild(btn)});
   b.appendChild(wrap);
 }else{
   let box=document.createElement('div');box.className='posgrid';
   POS.forEach(p=>{let lab=document.createElement('label');lab.className='posopt';lab.innerHTML=`<input type="checkbox" value="${p}">${p}`;box.appendChild(lab)});
   b.appendChild(box);$('check').classList.remove('hidden');$('check').onclick=checkPOS;
 }
}
function grade(btn,ok,wrap){
 [...wrap.children].forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');
 if(!ok)[...wrap.children].find(x=>x.textContent===current.ja)?.classList.add('correct');
 showFeedback(ok,'正解：'+current.ja);mark(ok)
}
function checkPOS(){
 let selected=[...document.querySelectorAll('#body input:checked')].map(x=>x.value).sort(), ans=current.pos.slice().sort();
 let ok=selected.length===ans.length&&selected.every((x,i)=>x===ans[i]);
 showFeedback(ok,'正解：'+ans.join('・'));mark(ok);$('check').classList.add('hidden');
 document.querySelectorAll('#body input').forEach(x=>x.disabled=true)
}
</script></body></html>
