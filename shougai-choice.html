<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>障害者・障害児心理学 301問｜最新版</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#68707c;--line:#dfe3e8;--accent:#2463eb;--good:#18794e;--bad:#b23832}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}
.top{padding:8px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:26px;margin:4px 0 6px;line-height:1.3}
.sub{font-size:14px;color:var(--muted);line-height:1.55;margin:4px 0 10px}
.toggle,.tool,.mode{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:10px 14px;font-weight:800}
.toggle{white-space:nowrap}
.menu-body.hidden{display:none}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.mode.active{background:#17191d;color:#fff;border-color:#17191d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 10px;text-align:center}
.stat b{display:block;font-size:27px;line-height:1.2}
.stat span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.progress{height:8px;background:#e4e7eb;border-radius:999px;overflow:hidden;margin:14px 0 10px}
.bar{height:100%;width:0;background:#ff7a00;transition:width .2s}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{border-radius:12px;padding:9px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.meta{font-size:14px;color:var(--muted);margin-bottom:12px}
.q{font-size:21px;font-weight:800;line-height:1.7;white-space:pre-line;margin-bottom:18px}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:14px 15px;font-size:16px;font-weight:700;line-height:1.5}
.choice:hover{background:#fafbfc}
.choice:disabled{opacity:1}
.choice.correct{border:2px solid #66b98c;background:#eaf8ef;color:#146c43}
.choice.wrong{border:2px solid #e59a95;background:#fff0ef;color:#a8322d}
.feedback{display:none;margin-top:14px;padding:13px;border-radius:13px;font-weight:900;font-size:18px}
.feedback.good{display:block;background:#eaf8ef;color:var(--good)}
.feedback.bad{display:block;background:#fff0ef;color:var(--bad)}
.explain{display:none;margin-top:10px;background:#f3f6fb;border-radius:13px;padding:14px;line-height:1.75;font-size:15px}
.explain.show{display:block}
.explain .answer{font-weight:900;font-size:17px;margin-bottom:8px}
.next{display:none;width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:900}
.next.show{display:block}
.empty{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--muted);margin-top:18px}
@media(max-width:520px){h1{font-size:23px}.q{font-size:19px}.choice{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title-row">
      <h1>障害者・障害児心理学</h1>
      <button class="toggle" id="toggleMenu" type="button">▲ メニューを隠す</button>
    </div>
    <div class="menu-body" id="menuBody">
      <div class="sub">301問｜再点検・選択肢修正版＋正誤判定・正答率・ランダム・間違い復習</div>
      <div class="modes">
        <button class="mode active" data-mode="normal">通常</button>
        <button class="mode" data-mode="random">ランダム</button>
        <button class="mode" data-mode="wrong">間違えた問題</button>
        <button class="mode" data-mode="unanswered">未回答だけ</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="position">0/301</b><span>現在位置</span></div>
        <div class="stat"><b id="correctCount">0</b><span>正解</span></div>
        <div class="stat"><b id="wrongCount">0</b><span>不正解</span></div>
        <div class="stat"><b id="rate">0%</b><span>正答率</span></div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="tools">
        <button class="tool" id="resetBtn">記録をリセット</button>
        <button class="tool" id="shuffleBtn">ランダム順を作り直す</button>
      </div>
    </div>
  </div>
  <div id="quiz"></div>
  <div class="empty" id="empty">このモードで表示する問題はありません。</div>
</div>

<script>
const Q=[{"q": "自閉症の原因論の変遷について、次の文の（　　）に入る時期を選べ。\n「（　　）には、脳機能障害を原因とし、中核症状は社会性の障害という見方が主流となった。」", "choices": ["1970年代", "1960年代", "1980年代後半", "1980年代"], "answer": 2, "correct": "1980年代後半", "explanation": "1980年代後半には脳機能障害を原因とし、中核症状は社会性の障害という見方が主流となった。"}, {"q": "チック症の診断について、次の文の（　　）に入る最も適切な語句を選べ。\n「二種以上の運動チックと音声チックを有し、それが（　　）持続する状態をトゥレット症と呼ぶ。」", "choices": ["2年以上", "1か月以上", "6か月以上", "1年以上"], "answer": 3, "correct": "1年以上", "explanation": "二種以上の運動チックと音声チックを有し、それが1年以上持続する状態をトゥレット症と呼ぶ。"}, {"q": "場面緘黙の特徴について、次の文の（　　）に入る最も適切な内容を選べ。\n「場面緘黙は、発声器官等に明らかな器質的・機能的障害はないが、心理的要因により、（　　）状態を指す。」", "choices": ["特定の社会的状況では発話困難だが、家庭などでは通常の発話が可能", "社会的状況を問わず発話困難で、家庭でも通常の発話がみられない", "特定の社会的状況では通常に発話できるが、家庭でのみ発話困難となる", "発声器官の器質的障害により、状況にかかわらず発話困難となる"], "answer": 0, "correct": "特定の社会的状況では発話困難だが、家庭などでは通常の発話が可能", "explanation": "場面緘黙は、発声器官等に明らかな器質的・機能的障害はないが、心理的要因により特定の社会的状況で発話困難を一貫して示し、家庭などでは通常の発話が可能な状態を指す。"}, {"q": "ICFについて、次の文を完成させる語句はどれか。\n「ICFは（　　）にWHOが提唱した。」", "choices": ["2001年", "1905年", "2013年", "2007年"], "answer": 0, "correct": "2001年", "explanation": "ICFは2001年にWHOが提唱した。"}, {"q": "学習内容の応用について、次の説明の空欄に当てはまるものはどれか。\n「学習した内容を別の場面に応用することを（　　）という。」", "choices": ["転移", "般化", "弁別", "統合"], "answer": 0, "correct": "般化", "explanation": "学習した内容を別の場面に応用することを般化という。"}, {"q": "ディスレクシアについて、次の文を完成させる語句はどれか。\n「ディスレクシアは（　　）に起因する特異的学習障害と定義される。」", "choices": ["デコーディングの弱さ", "音韻認識の弱さ", "神経生物学的原因", "視覚的弁別のつまずき"], "answer": 2, "correct": "神経生物学的原因", "explanation": "ディスレクシアは神経生物学的原因に起因する特異的学習障害と定義される。"}, {"q": "重複障害に関する資料の記述として、（　　）に入るものを選べ。\n「重複障害とは、盲・聾・知的障害・肢体不自由・病弱のうち（　　）をあわせ有することである。」", "choices": ["2つ以上", "3つ以上", "4つ", "5つ"], "answer": 0, "correct": "2つ以上", "explanation": "重複障害とは、盲・聾・知的障害・肢体不自由・病弱のうち2つ以上をあわせ有することである。"}, {"q": "障害児教育の理念について、次の記述を完成させよ。\n「インテグレーションとは「（　　）」を意味する。」", "choices": ["統合", "包括", "正常化", "分離"], "answer": 0, "correct": "統合", "explanation": "インテグレーションとは「統合」を意味する。"}, {"q": "自閉症の類型について、次の説明の空欄に当てはまるものはどれか。\n「カナー型は言語表出がない、あるいは言葉の遅れがみられ、生後（　　）に出現するとされる。」", "choices": ["生後12か月以内", "生後18か月以 let state=saved&&Array.isArray(saved.results)&&saved.results.length===Q.length?saved:{results:Array(Q.length).fill(null),randomOrder:[]};
let mode='normal', pos=0, pool=[];

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function makeRandom(){
  state.randomOrder=[...Array(Q.length).keys()];
  for(let i=state.randomOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[state.randomOrder[i],state.randomOrder[j]]=[state.randomOrder[j],state.randomOrder[i]]}
  save();
}
if(!state.randomOrder||state.randomOrder.length!==Q.length) makeRandom();

function buildPool(){
  if(mode==='normal') pool=[...Array(Q.length).keys()];
  if(mode==='random') pool=[...state.randomOrder];
  if(mode==='wrong') pool=[...Array(Q.length).keys()].filter(i=>state.results[i]===false);
  if(mode==='unanswered') pool=[...Array(Q.length).keys()].filter(i=>state.results[i]===null);
  if(pos>=pool.length) pos=Math.max(0,pool.length-1);
}

function updateStats(){
  const answered=state.results.filter(x=>x!==null).length;
  const correct=state.results.filter(x=>x===true).length;
  const wrong=state.results.filter(x=>x===false).length;
  document.getElementById('correctCount').textContent=correct;
  document.getElementById('wrongCount').textContent=wrong;
  document.getElementById('rate').textContent=answered?Math.round(correct/answered*100)+'%':'0%';
  document.getElementById('position').textContent=pool.length?(pos+1)+'/'+pool.length:'0/'+pool.length;
  document.getElementById('bar').style.width=(Q.length?answered/Q.length*100:0)+'%';
}

function render(){
  buildPool(); updateStats();
  const quiz=document.getElementById('quiz'), empty=document.getElementById('empty');
  quiz.innerHTML='';
  if(!pool.length){empty.style.display='block';return}
  empty.style.display='none';
  const qi=pool[pos], item=Q[qi], prev=(mode==='wrong'?null:state.results[qi]);
  const card=document.createElement('div');card.className='card';
  const meta=document.createElement('div');meta.className='meta';meta.textContent='問題 '+(pos+1)+' / '+pool.length;
  const q=document.createElement('div');q.className='q';q.textContent=item.q;
  const choices=document.createElement('div');choices.className='choices';
  const letters=['A','B','C','D'];
  item.choices.forEach((c,i)=>{
    const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML='<b>'+letters[i]+'.</b> '+c;
    b.addEventListener('click',()=>answer(qi,i,card));
    choices.appendChild(b);
  });
  const fb=document.createElement('div');fb.className='feedback';fb.id='feedback';
  const ex=document.createElement('div');ex.className='explain';ex.id='explain';
  const nx=document.createElement('button');nx.className='next';nx.type='button';nx.textContent='次の問題へ';
  nx.addEventListener('click',()=>{if(pos<pool.length-1)pos++;else pos=0;render();window.scrollTo({top:0,behavior:'smooth'})});
  card.append(meta,q,choices,fb,ex,nx);quiz.appendChild(card);
  if(prev!==null) showResult(qi, prev, null, card);
}

function showResult(qi,isCorrect,selected,card){
  const item=Q[qi], buttons=[...card.querySelectorAll('.choice')];
  buttons.forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add('correct');if(selected!==null&&i===selected&&i!==item.answer)b.classList.add('wrong')});
  const fb=card.querySelector('.feedback');
  fb.className='feedback '+(isCorrect?'good':'bad');
  fb.textContent=isCorrect?'○ 正解！':'× 不正解';
  const ex=card.querySelector('.explain');
  ex.classList.add('show');
  ex.innerHTML='<div class="answer">正解：'+['A','B','C','D'][item.answer]+'. '+item.correct+'</div><div>'+item.explanation.replace(/\n/g,'<br>')+'</div>';
  card.querySelector('.next').classList.add('show');
}

function answer(qi,selected,card){
  if(mode!=='wrong' && state.results[qi]!==null)return;
  const ok=selected===Q[qi].answer;
  state.results[qi]=ok;save();showResult(qi,ok,selected,card);updateStats();
}

document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  mode=b.dataset.mode;pos=0;render();
}));
document.getElementById('shuffleBtn').addEventListener('click',()=>{makeRandom();if(mode==='random'){pos=0;render()}});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('正解・不正解の記録をすべてリセットしますか？')){state.results=Array(Q.length).fill(null);save();pos=0;render()}
});
document.getElementById('toggleMenu').addEventListener('click',()=>{
  const body=document.getElementById('menuBody'),btn=document.getElementById('toggleMenu');
  const hidden=body.classList.toggle('hidden');btn.textContent=hidden?'▼ メニューを表示':'▲ メニューを隠す';
});
render();
</script>
</body></html>
