<script>const questions=[{"id":"jin2-c-001","q":"対象者の行動・対人関係・コミュニケーションを観察し、特徴や法則性を明らかにする研究方法は何か。","options":["観察法","KJ法","行動目録法","非構造化面接"],"correct":0,"answer":"観察法","explanation":"資料では、正答は「観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-002","q":"観察法で記録対象となる三つのものは何か。","options":["体型・血液型・筆跡","行動・対人関係・コミュニケーション","知能・発達年齢・指数","夢・空想・神話"],"correct":1,"answer":"行動・対人関係・コミュニケーション","explanation":"資料では、正答は「行動・対人関係・コミュニケーション」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-003","q":"対象者へ働きかけず、自然な環境で行動を見る方法はどれか。","options":["行動目録法","日誌法","自然観察法","実験的観察法"],"correct":2,"answer":"自然観察法","explanation":"資料では、正答は「自然観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-004","q":"特定の行動が生じるよう、環境条件を設定・操作して見る方法はどれか。","options":["日誌法","自然観察法","行動目録法","実験的観察法"],"correct":3,"answer":"実験的観察法","explanation":"資料では、正答は「実験的観察法」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-005","q":"観察法が直接の対象とするものは何か。","options":["実際の行動そのもの","検査得点だけ","身体計測だけ","過去の記憶だけ"],"correct":0,"answer":"実際の行動そのもの","explanation":"資料では、正答は「実際の行動そのもの」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-006","q":"言語による回答が難しくても観察研究の対象にできるものとして、資料に挙げられた組合せはどれか。","options":["成人・高齢者・教師","乳幼児・障害児・動物","研究者・面接者・保護者","大学生・会社員・競技者"],"correct":1,"answer":"乳幼児・障害児・動物","explanation":"資料では、正しい組合せは「乳幼児・障害児・動物」である。","section":"41. 観察法"},{"id":"jin2-c-007","q":"日常生活の中で把握できることが長所とされるものは何か。","options":["検査場面だけの反応","作為的な回答だけ","自然な行動","体型の分類"],"correct":2,"answer":"自然な行動","explanation":"資料では、正答は「自然な行動」と説明されている。","section":"41. 観察法"},{"id":"jin2-c-008","q":"観察法の課題として資料に挙げられた四点の組合せはどれか。","options":["質問順序・回答時間・採点速度・費用","標準化・知能指数・偏差値・下位検査","転移・抵抗・解釈・洞察","観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮"],"correct":3,"answer":"観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮","explanation":"資料では、正しい組合せは「観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮」である。","section":"41. 観察法"},{"id":"jin2-c-009","q":"日常生活で観察した行動や様子を、後から思い出して記録する方法は何か。","options":["日誌法","KJ法","評定尺度法","事例研究法"],"correct":0,"answer":"日誌法","explanation":"資料では、正答は「日誌法」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-010","q":"日誌法は、どの研究方法における記録法の一つか。","options":["行動描写法","観察法","グラウンデッド・セオリー・アプローチ","日誌法"],"correct":1,"answer":"観察法","explanation":"資料では、正答は「観察法」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-011","q":"日誌法の例として挙げられているものはどれか。","options":["質問紙","知能検査","育児日誌","描画検査"],"correct":2,"answer":"育児日誌","explanation":"資料では、正答は「育児日誌」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-012","q":"育児日誌と並ぶ日誌法の例として挙げられているものは何か。","options":["因子分析","投映法","性格検査","保育日誌"],"correct":3,"answer":"保育日誌","explanation":"資料では、正答は「保育日誌」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-013","q":"記録を行う時点はいつか。","options":["観察した後に思い出して記録する","行動と完全に同時だけ","観察前に予測して記録する","数年後に他者が推測する"],"correct":0,"answer":"観察した後に思い出して記録する","explanation":"資料では、正答は「観察した後に思い出して記録する」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-014","q":"詳細に把握できるものの組合せはどれか。","options":["知能と病名だけ","個人の特徴と発達過程","質問と回答形式","体型と血液型"],"correct":1,"answer":"個人の特徴と発達過程","explanation":"資料では、正答は「個人の特徴と発達過程」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-015","q":"客観性に欠けやすい理由は何か。","options":["複数評定者を用いるため","行動を数量化するため","記録者の主観や記憶に依存するため","マニュアルを使うため"],"correct":2,"answer":"記録者の主観や記憶に依存するため","explanation":"資料では、正答は「記録者の主観や記憶に依存するため」と説明されている。","section":"42. 日誌法"},{"id":"jin2-c-016","q":"観察したい行動を事前にカテゴリー化し、出現のたびにチェックする方法は何か。","options":["実験的観察法","半構造化面接","検査法","行動目録法"],"correct":3,"answer":"行動目録法","explanation":"資料では、正答は「行動目録法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-017","q":"行動目録法の別名として挙げられているものは何か。","options":["カテゴリー・チェック法","時間見本法","質疑法","逸話記録法"],"correct":0,"answer":"カテゴリー・チェック法","explanation":"資料では、正答は「カテゴリー・チェック法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-018","q":"カテゴリー・システム法の別名として、組織的観察法のほかに挙げられているものは何か。","options":["行動描写法","チェックリスト法","面接法","自由連想法"],"correct":1,"answer":"チェックリスト法","explanation":"資料では、正答は「チェックリスト法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-019","q":"行動のカテゴリーを作る時点はいつか。","options":["結果公表後","対象者の退室後だけ","観察前","観察終了後だけ"],"correct":2,"answer":"観察前","explanation":"資料では、正答は「観察前」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-020","q":"事前に分類する行動の例として挙げられている組合せはどれか。","options":["意識と無意識","外向と内向","抑圧と昇華","自発的関わりと受動的関わり"],"correct":3,"answer":"自発的関わりと受動的関わり","explanation":"資料では、正答は「自発的関わりと受動的関わり」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-021","q":"該当する行動が見られるたびに何を行うか。","options":["チェックして記録する","五段階で印象だけを評定する","後日思い出すだけ","図版を提示する"],"correct":0,"answer":"チェックして記録する","explanation":"資料では、正答は「チェックして記録する」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-022","q":"カテゴリーごとに集計するものは何か。","options":["描画の遠近","生起頻度","知能指数","生活史"],"correct":1,"answer":"生起頻度","explanation":"資料では、正答は「生起頻度」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-023","q":"生起頻度の集計によって可能になる分析は何か。","options":["内容分析だけ","継起分析だけ","数量的分析","質的分析だけ"],"correct":2,"answer":"数量的分析","explanation":"資料では、正答は「数量的分析」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-024","q":"カテゴリー・システム法でよく用いられる標本化の方法は何か。","options":["自由連想法","日誌法","質疑法","時間見本法"],"correct":3,"answer":"時間見本法","explanation":"資料では、正答は「時間見本法」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-025","q":"どのような仮説がある観察で用いられることが多いか。","options":["明確な仮説","体型だけの仮説","診断名が確定した仮説","仮説が一切ない観察だけ"],"correct":0,"answer":"明確な仮説","explanation":"資料では、正答は「明確な仮説」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-026","q":"分析の妥当性を高めるため重要な準備は何か。","options":["一人の主観だけで評価すること","仮説に沿った適切なカテゴリーリストの作成","質問内容を説明しないこと","全行動を一つの項目にすること"],"correct":1,"answer":"仮説に沿った適切なカテゴリーリストの作成","explanation":"資料では、正答は「仮説に沿った適切なカテゴリーリストの作成」と説明されている。","section":"43. 行動目録法"},{"id":"jin2-c-027","q":"行動を事前に設定した評価尺度に沿って数段階で評価する方法は何か。","options":["日誌法","非構造化面接","評定尺度法","自然観察法"],"correct":2,"answer":"評定尺度法","explanation":"資料では、正答は「評定尺度法」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-028","q":"評定尺度法が記録するのは行動の頻度ではなく何か。","options":["生活史","発達年齢","物語内容","強さ・程度・印象"],"correct":3,"answer":"強さ・程度・印象","explanation":"資料では、正答は「強さ・程度・印象」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-029","q":"授業態度の評価例で用いられる段階数はいくつか。","options":["5つ","28","80","2つ"],"correct":0,"answer":"5つ","explanation":"資料では、正答は「5つ」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-030","q":"授業態度の評価例として示された両極はどれか。","options":["非常に外向的―非常に内向的","非常に消極的―非常に積極的","非常に高い―非常に低い","非常に若い―非常に高齢"],"correct":1,"answer":"非常に消極的―非常に積極的","explanation":"資料では、正答は「非常に消極的―非常に積極的」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-031","q":"『非常に消極的―非常に積極的』と並ぶ評定尺度法の評価例はどれか。","options":["非常に理論的―非常に経済的","非常に高次―非常に低次","非常に退屈―非常に楽しい","非常に不安―非常に安心"],"correct":2,"answer":"非常に退屈―非常に楽しい","explanation":"資料では、正答は「非常に退屈―非常に楽しい」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-032","q":"評定結果が影響されやすいものは何か。","options":["質問数だけ","対象者の遺伝情報","検査用紙の大きさ","評定者の主観"],"correct":3,"answer":"評定者の主観","explanation":"資料では、正答は「評定者の主観」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-033","q":"信頼性や客観性を高めるため、評定者は何人にするか。","options":["複数","機械だけ","必ず一人","対象者本人だけ"],"correct":0,"answer":"複数","explanation":"資料では、正答は「複数」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-034","q":"複数の観察者は互いにどう評定するか。","options":["対象者に答えを決めてもらう","独立して評定する","順番に得点を修正する","相談して同じ得点を付ける"],"correct":1,"answer":"独立して評定する","explanation":"資料では、正答は「独立して評定する」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-035","q":"複数評定の結果から用いるものの組合せはどれか。","options":["夢と空想","精神年齢と生活年齢","一致度と平均値","頻度と順位だけ"],"correct":2,"answer":"一致度と平均値","explanation":"資料では、正答は「一致度と平均値」と説明されている。","section":"44. 評定尺度法"},{"id":"jin2-c-036","q":"行動や出来事を時間の流れに沿って詳しく記述する方法は何か。","options":["自然観察法","構造化面接","KJ法","行動描写法"],"correct":3,"answer":"行動描写法","explanation":"資料では、正答は「行動描写法」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-037","q":"自然観察法の別名は何か。","options":["逸話記録法","カテゴリー・チェック法","チェックリスト法","評定尺度法"],"correct":0,"answer":"逸話記録法","explanation":"資料では、正答は「逸話記録法」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-038","q":"把握しやすいものとして挙げられる三つは何か。","options":["知能・発達年齢・指数","行動の背景・文脈・過程","質問・順序・回答形式","家・木・人物"],"correct":1,"answer":"行動の背景・文脈・過程","explanation":"資料では、正答は「行動の背景・文脈・過程」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-039","q":"詳細な記録があるため、後から何ができるか。","options":["体型変更","遺伝子操作","再検討","発達年齢の固定"],"correct":2,"answer":"再検討","explanation":"資料では、正答は「再検討」と説明されている。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-c-040"," や周囲の一般的常識","explanation":"資料では、正答は「社会的規範や周囲の一般的常識」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-480","q":"パーソナリティの偏りによって生じるものは何か。","options":["体型の変化","発達年齢の上昇","必ず高い適応","社会生活上の支障"],"correct":3,"answer":"社会生活上の支障","explanation":"資料では、正答は「社会生活上の支障」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-481","q":"パーソナリティの偏りは時間的にどのようなものか。","options":["一時的でなく持続的","必ず成人後に消える","一瞬だけ","数分で消える"],"correct":0,"answer":"一時的でなく持続的","explanation":"資料では、正答は「一時的でなく持続的」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-482","q":"本人は持続的な偏りをどのように感じているか。","options":["他者のものと感じる","自然なもの","一時的な演技と感じる","検査者が作ったものと感じる"],"correct":1,"answer":"自然なもの","explanation":"資料では、正答は「自然なもの」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-483","q":"DSM-5ではパーソナリティ症をいくつの群に分けるか。","options":["31","120","3つ","5つ"],"correct":2,"answer":"3つ","explanation":"資料では、正答は「3つ」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-484","q":"奇妙で風変わりな信念や習慣を特徴とする群はどれか。","options":["B群","D群","C群","A群"],"correct":3,"answer":"A群","explanation":"資料では、正答は「A群」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-485","q":"劇的で過度な感情や言動を特徴とする群はどれか。","options":["B群","C群","A群","D群"],"correct":0,"answer":"B群","explanation":"資料では、正答は「B群」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-486","q":"不安や自信のなさが強い群はどれか。","options":["B群","C群","A群","D群"],"correct":1,"answer":"C群","explanation":"資料では、正答は「C群」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-487","q":"DSM-5のA群に分類される三つのパーソナリティ症の組合せはどれか。","options":["反社会性・ボーダーライン・演技性","回避性・依存性・強迫性","猜疑性・シゾイド・統合失調型","自己愛性・依存性・猜疑性"],"correct":2,"answer":"猜疑性・シゾイド・統合失調型","explanation":"資料では、正しい組合せは「猜疑性・シゾイド・統合失調型」である。","section":"84. パーソナリティ症"},{"id":"jin2-c-488","q":"DSM-5のB群に分類される四つのパーソナリティ症の組合せはどれか。","options":["猜疑性・シゾイド・統合失調型・回避性","回避性・依存性・強迫性・猜疑性","神経症性・境界性・精神病性・依存性","反社会性・ボーダーライン・自己愛性・演技性"],"correct":3,"answer":"反社会性・ボーダーライン・自己愛性・演技性","explanation":"資料では、正しい組合せは「反社会性・ボーダーライン・自己愛性・演技性」である。","section":"84. パーソナリティ症"},{"id":"jin2-c-489","q":"DSM-5のC群に分類される三つのパーソナリティ症の組合せはどれか。","options":["回避性・依存性・強迫性","猜疑性・シゾイド・統合失調型","反社会性・ボーダーライン・自己愛性","神経症性・境界性・精神病性"],"correct":0,"answer":"回避性・依存性・強迫性","explanation":"資料では、正しい組合せは「回避性・依存性・強迫性」である。","section":"84. パーソナリティ症"},{"id":"jin2-c-490","q":"A群を構成する診断はいくつか。","options":["12","3つ","53","195"],"correct":1,"answer":"3つ","explanation":"資料では、正答は「3つ」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-491","q":"B群を構成する診断はいくつか。","options":["12","53","4つ","195"],"correct":2,"answer":"4つ","explanation":"資料では、正答は「4つ」と説明されている。","section":"84. パーソナリティ症"},{"id":"jin2-c-492","q":"C群を構成する診断はいくつか。","options":["120","5つ","16","3つ"],"correct":3,"answer":"3つ","explanation":"資料では、正答は「3つ」と説明されている。","section":"84. パーソナリティ症"}];const STORAGE_KEY="personality-part2-choice-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function answerChoice(choice){
  if(state.answered)return;const i=currentIndex();if(i===null)return;const q=questions[i];state.answered=true;const ok=choice===q.correct;record(i,ok);
  [...document.querySelectorAll('.option')].forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');else if(k===choice)b.classList.add('wrong');else b.classList.add('dim');});
  $('feedback').innerHTML=`<div class="answerbox ${ok?'ok':'bad'}"><b>${ok?'正解！':'不正解'}</b><div>正答：${escapeHtml(q.answer)}</div><div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('history').textContent=historyText(rec(i));$('retry').disabled=false;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('options').innerHTML='';$('feedback').innerHTML='';$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;
  $('options').innerHTML=q.options.map((o,k)=>`<button class="option" onclick="answerChoice(${k})"><span class="letter">${LETTERS[k]}</span><span>${escapeHtml(o)}</span></button>`).join('');$('feedback').innerHTML='';$('retry').disabled=!state.answered;
}
render();
</script></body></html>
