<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>障害者・障害児心理学 4択1000問</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181a;--muted:#74777c;--line:#e5e7eb;--accent:#ff7a00;--good:#17864a;--bad:#c63c3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0} .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.modes{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.modes button,.tools button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-weight:700}
.modes button.active{background:#17181a;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;text-align:center}
.stat b{display:block;font-size:18px} .stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px 16px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:14px}
.q{font-size:20px;font-weight:800;line-height:1.55;white-space:pre-line;margin:8px 0 18px}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;font-size:16px;font-weight:700;line-height:1.45}
.choice:disabled{opacity:1}
.choice.correct{border-color:#93d2ad;background:#eef9f2;color:var(--good)}
.choice.wrong{border-color:#efb4b4;background:#fff0f0;color:var(--bad)}
.feedback{margin-top:14px;padding:12px;border-radius:14px;font-weight:800;display:none}
.feedback.show{display:block} .feedback.ok{background:#eef9f2;color:var(--good)} .feedback.ng{background:#fff0f0;color:var(--bad)}
.next{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:15px;padding:14px;font-size:16px;font-weight:800;display:none}
.next.show{display:block}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.footer{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
[hidden]{display:none!important}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)} .q{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<h1>障害者・障害児心理学</h1>
<div class="sub">4択クイズ 1000問</div>

<div class="modes">
<button id="normal" class="active">通常</button>
<button id="random">ランダム</button>
<button id="wrongOnly">間違いだけ</button>
</div>

<div class="stats">
<div class="stat"><b id="pos">1/1000</b><span>現在位置</span></div>
<div class="stat"><b id="correct">0</b><span>正解</span></div>
<div class="stat"><b id="wrong">0</b><span>不正解</span></div>
<div class="stat"><b id="rate">0%</b><span>正答率</span></div>
</div>

<div class="card">
<div class="meta"><span id="qno"></span><span id="status"></span></div>
<div id="question" class="q"></div>
<div id="choices" class="choices"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next">次の問題へ</button>
</div>

<div class="tools">
<button id="prev">← 前へ</button>
<button id="reset">記録をリセット</button>
</div>

<div class="footer">
選択肢をタップするとその場で正誤判定します。間違えた問題は「間違いだけ」で復習できます。正誤記録はこのブラウザ内に保存されます。
</div>
</div>

se_no": 100}];
const KEY="shogai4choice1000_v1";
let st={mode:"normal",order:[...Array(Q.length).keys()],pos:0,results:{}};
const $=id=>document.getElementById(id);

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.results)st.results=x.results}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({results:st.results}))}
function wrongIdx(){return Object.keys(st.results).filter(k=>st.results[k]==="wrong").map(Number)}

function setMode(m){
  st.mode=m;
  ["normal","random","wrongOnly"].forEach(id=>$(id).classList.remove("active"));
  if(m==="normal"){
    st.order=[...Array(Q.length).keys()];
    $("normal").classList.add("active");
  } else if(m==="random"){
    st.order=[...Array(Q.length).keys()].sort(()=>Math.random()-.5);
    $("random").classList.add("active");
  } else {
    const w=wrongIdx();
    if(!w.length){alert("まだ間違えた問題がありません"); return setMode("normal");}
    st.order=w;
    $("wrongOnly").classList.add("active");
  }
  st.pos=0; render();
}

function stats(){
  const vals=Object.values(st.results);
  const c=vals.filter(v=>v==="correct").length;
  const w=vals.filter(v=>v==="wrong").length;
  const total=c+w;
  $("correct").textContent=c;
  $("wrong").textContent=w;
  $("rate").textContent=total?Math.round(c/total*100)+"%":"0%";
  $("pos").textContent=(st.pos+1)+"/"+st.order.length;
}

function render(){
  if(!st.order.length) return setMode("normal");
  const idx=st.order[st.pos], x=Q[idx];
  $("qno").textContent="問題 "+(idx+1)+" / 1000";
  $("status").textContent=st.results[idx]==="correct"?"○ 正解済み":st.results[idx]==="wrong"?"× 要復習":"未回答";
  $("question").textContent=x.q;
  const box=$("choices"); box.innerHTML="";
  x.choices.forEach((ch,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=String.fromCharCode(65+i)+". "+ch;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("next").className="next";
  stats();
}

function answer(i){
  const idx=st.order[st.pos], x=Q[idx];
  const buttons=[...document.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);
  buttons[x.answer].classList.add("correct");
  const ok=i===x.answer;
  if(!ok) buttons[i].classList.add("wrong");
  st.results[idx]=ok?"correct":"wrong";
  save();
  const f=$("feedback");
  f.className="feedback show "+(ok?"ok":"ng");
  f.textContent=ok?"○ 正解！":"× 不正解　正解："+x.correct;
  $("next").className="next show";
  stats();
}

function next(){
  if(st.mode==="wrong"){
    const w=wrongIdx();
    if(!w.length){alert("間違い問題を全部クリアしました！"); return setMode("normal");}
    st.order=w;
    st.pos=st.pos>=st.order.length-1?0:st.pos+1;
  } else {
    st.pos=(st.pos+1)%st.order.length;
  }
  render();
}
function prev(){st.pos=(st.pos-1+st.order.length)%st.order.length;render()}

$("normal").onclick=()=>setMode("normal");
$("random").onclick=()=>setMode("random");
$("wrongOnly").onclick=()=>setMode("wrong");
$("next").onclick=next;
$("prev").onclick=prev;
$("reset").onclick=()=>{if(confirm("正誤記録をすべてリセットしますか？")){st.results={};save();setMode("normal")}};

load();
render();
</script>
