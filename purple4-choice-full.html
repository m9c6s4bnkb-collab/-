const DATA=[{"id":"p4q0001","page":1,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n業績への関心と人間に対する関心の2軸からリーダーシップを捉える理論。","answer":"マネジリアル・グリッド理論","aliases":["マネジリアル・グリッド理論"],"term":"マネジリアル・グリッド理論","group":"leadership_theory","kind":"term","note":"業績への関心と人間に対する関心の2軸からリーダーシップを捉える理論。 2つの軸は何か。 答え：業績への関心と人間に対する関心。 各軸は何段階に分けられるか。 答え：9段階。","source":"左ページQuestion Q65","options":["マネジリアル・グリッド理論","オーセンティック・リーダーシップ","指示型・支援型・参加型・達成型","自分らしく誠実に行動すること"],"correctIndex":0},{"id":"p4q0006","page":1,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\nフォロワーの成熟度に応じて有効なリーダーシップ行動が異なると考える理論。","answer":"SL理論","aliases":["SL理論"],"term":"SL理論","group":"leadership_theory","kind":"term","note":"フォロワーの成熟度に応じて有効なリーダーシップ行動が異なると考える理論。 フォロワーの成熟レベルは何段階に区分されるか。 答え：4段階。 成熟度が最も低い段階で中心となる行動は何か。 答え：指示的行動。","source":"左ページQuestion Q66","options":["9・9型","SL理論","自己認識","9段階"],"correctIndex":1},{"id":"p4q0011","page":1,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\nフォロワーが目標に到達するための道筋をリーダーが示すことを重視する理論。","answer":"パス・ゴール理論","aliases":["パス・ゴール理論"],"term":"パス・ゴール理論","group":"leadership_theory","kind":"term","note":"フォロワーが目標に到達するための道筋をリーダーが示すことを重視する理論。 リーダーが示すのは目標までの何か。 答え：道筋（パス）。 リーダーシップ行動は何型に分類されるか。 答え：指示型・支援型・参加型・達成型。","source":"左ページQuestion Q67","options":["マネジリアル・グリッド理論","委任型リーダーシップ","パス・ゴール理論","フォロワーへの奉仕"],"correctIndex":2},{"id":"p4q0016","page":1,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\nフォロワーの意識や行動に変化をもたらし、組織を変革していくリーダーシップ。","answer":"変革型リーダーシップ","aliases":["変革型リーダーシップ"],"term":"変革型リーダーシップ","group":"leadership_theory","kind":"term","note":"フォロワーの意識や行動に変化をもたらし、組織を変革していくリーダーシップ。 提唱者として本文で挙げられている人物は誰か。 答え：Burns,J.M.（バーンズ）。 構成要素はいくつか。 答え：4つ。","source":"左ページQuestion Q68","options":["モチベーションの鼓舞","委任型リーダーシップ","オーセンティック・リーダーシップ","変革型リーダーシップ"],"correctIndex":3},{"id":"p4q0021","page":1,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n倫理や価値観に基づいて自分らしく誠実に行動することを重視するリーダーシップ。","answer":"オーセンティック・リーダーシップ","aliases":["オーセンティック・リーダーシップ"],"term" ions":["不安や期待、偏見","流言（噂）","重要性や曖昧さ","デマ"],"correctIndex":1},{"id":"p4q0071","page":3,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n政治的・経済的・社会的な意図の実現を目的として操作される情報。","answer":"デマ","aliases":["デマ"],"term":"デマ","group":"social_information","kind":"term","note":"政治的・経済的・社会的な意図の実現を目的として操作される情報。 どのような意図の実現を目的とするか。 答え：政治的・経済的・社会的な意図。 広まりやすい社会状況はどのようなものか。 答え：社会が緊迫した状況。","source":"左ページQuestion Q79","options":["平均化","不安や期待、偏見","デマ","同化"],"correctIndex":2},{"id":"p4q0076","page":3,"chapter":"社会心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n集団や群集状況で匿名性が高まり、自己統制が弱まる現象。","answer":"没個性化","aliases":["没個性化"],"term":"没個性化","group":"social_behavior","kind":"term","note":"集団や群集状況で匿名性が高まり、自己統制が弱まる現象。 提唱者として本文で挙げられる人物は誰か。 答え：Zimbardo,P.G.（ジンバルドー）。 生じやすくなる行動は何か。 答え：攻撃的・反社会的行動。","source":"左ページQuestion Q80","options":["コホート","Zimbardo,P.G.（ジンバルドー）","公平理論","没個性化"],"correctIndex":3},{"id":"p4q0081","page":4,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\nある一時点で年齢の異なる集団を比較し、発達的変化を捉える研究法。","answer":"横断的研究","aliases":["横断的研究"],"term":"横断的研究","group":"development_method","kind":"term","note":"ある一時点で年齢の異なる集団を比較し、発達的変化を捉える研究法。 データ収集に要する時間やコストは比較的どうか。 答え：少ない。 時間経過に伴う変化そのものを追跡できるか。 答え：追跡できない。","source":"左ページQuestion Q1","options":["横断的研究","縦断的研究","行いやすい","コホート効果"],"correctIndex":0},{"id":"p4q0086","page":4,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n同じ集団を一定期間追跡し、複数回の調査で発達的変化を捉える研究法。","answer":"縦断的研究","aliases":["縦断的研究"],"term":"縦断的研究","group":"development_method","kind":"term","note":"同じ集団を一定期間追跡し、複数回の調査で発達的変化を捉える研究法。 時間経過に伴う変化を捉えられるか。 答え：捉えられる。 因果関係の検討は横断研究より行いやすいか。 答え：行いやすい。","source":"左ページQuestion Q2","options":["コホート効果","縦断的研究","練習効果","コホート分析"],"correctIndex":1},{"id":"p4q0091","page":4,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n同時期に生まれ育ち、共通した時代背景をもつ集団。","answer":"コホート","aliases":["コホート"],"term":"コホート","group":"development_method","kind":"term","note":"同時期に生まれ育ち、共通した時代背景をもつ集団。 共通しているものは何か。 答え：時代背景。 教育経験の違いによって何が異なる可能性があるか。 答え：心理的な発達過程。","source":"左ページQuestion Q3","options":["横断的研究","難しい","コホート","縦断的研究"],"correctIndex":2},{"id":"p4q0096","page":4,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n複数のコホートを追跡して時間的変化を比較する研究法。","answer":"コホート分析","aliases":["コホート分析"],"term":"コホート分析","group":"development_method","kind":"term","note":"複数のコホートを追跡して時間的変化を比較する研究法。 何を区別するために用いられるか。 答え：コホート特異的な発達過程と普遍的な発達過程。 研究にはどのような負担があるか。 答え：多くの時間やコストがかかる。","source":"左ページQuestion Q4","options":["コホート効果","コホートの影響","捉えられる","コホート分析"],"correctIndex":3},{"id":"p4q0101","page":4,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n発達は外的環境よりも内的な成熟によって促進されるとする立場。","answer":"成熟優位説","aliases":["成熟優位説"],"term":"成熟優位説","group":"development_theory","kind":"term","note":"発達は外的環境よりも内的な成熟によって促進されるとする立場。 提唱の根拠となった実験は何か。 答え：一卵性双生児の階段のぼり実験。 発達を促進すると重視されるものは何か。 答え：内的な成熟。","source":"左ページQuestion Q5","options":["成熟優位説","レディネス","約1年","内的な成熟"],"correctIndex":0},{"id":"p4q0106","page":5,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n学習が成立するために必要な心身の準備状態。","answer":"レディネス","aliases":["レディネス"],"term":"レディネス","group":"development_theory","kind":"term","note":"学習が成立するために必要な心身の準備状態。 学習成立の前提となるものは何か。 答え：学習者の心身の準備。 文字学習のレディネスの例として挙げられるものは何か。 答え：話し言葉の獲得。","source":"左ページQuestion Q6","options":["成熟優位説","レディネス","約1年","輻輳説"],"correctIndex":1},{"id":"p4q0111","page":5,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n発達は遺伝要因と環境要因の加算によって生じると考える立場。","answer":"輻輳説","aliases":["輻輳説"],"term":"輻輳説","group":"development_theory","kind":"term","note":"発達は遺伝要因と環境要因の加算によって生じると考える立場。 発達を規定する2要因は何か。 答え：遺伝要因と環境要因。 モデルの性質として本文で批判される点は何か。 答え：単なる加算で静的であること。","source":"左ページQuestion Q7","options":["身長","レディネス","輻輳説","絶対音感"],"correctIndex":2},{"id":"p4q0116","page":5,"chapter":"発達心理学","side":"basic","stem":"次の説明に当てはまる用語・概念はどれか。\n遺伝的素質の発現には、環境条件が一定の閾値を超える必要があるとする考え。","answer":"環境閾値説","aliases":["環境閾値説"],"term":"環境閾値説","group":"development_theory","kind":"term","note":"遺伝的素質の発現には、環境条件が一定の閾値を超える必要があるとする考え。 素質の発現を左右するのは環境条 const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stat(id){return hist[id]||{correct:0,wrong:0,last:null}}function record(id,ok){const s=stat(id);s.correct+=(ok?1:0);s.wrong+=(!ok?1:0);s.last=ok?'correct':'wrong';hist[id]=s;localStorage.setItem(KEY,JSON.stringify(hist));}
function pool(){let a=DATA.slice();const side=el('side').value,chap=el('chapter').value,rev=el('review').value;if(side!=='all')a=a.filter(x=>x.side===side);if(chap!=='all')a=a.filter(x=>x.chapter===chap);if(rev==='unanswered')a=a.filter(x=>{const s=stat(x.id);return s.correct+s.wrong===0});if(rev==='lastwrong')a=a.filter(x=>stat(x.id).last==='wrong');if(rev==='everwrong')a=a.filter(x=>stat(x.id).wrong>0);if(rev==='wrong1')a=a.filter(x=>stat(x.id).wrong===1);if(rev==='wrong2')a=a.filter(x=>stat(x.id).wrong===2);if(rev==='wrong3')a=a.filter(x=>stat(x.id).wrong>=3);return a;}
function start(){order=pool();if(el('ord').value==='random')order.sort(()=>Math.random()-.5);pos=0;renderQuestion();updateStats();} function current(){return order[pos]}
function next(){if(pos<order.length-1){pos++;renderQuestion();}else renderDone();}function prev(){if(pos>0){pos--;renderQuestion();}}
function meta(q){el('meta').innerHTML=`<span class="pill">${q.side==='basic'?'基本':'右ページ詳細'}</span><span class="pill">${esc(q.chapter||'')}</span><span class="pill">誤答 ${stat(q.id).wrong}回</span><span class="pill">${pos+1} / ${order.length}</span>`;}
function renderDone(){el('stem').textContent=order.length?'この範囲は終了！':'該当する問題がありません';el('body').innerHTML='';el('feedback').className='feedback';}
function updateStats(){const p=pool();el('pool').textContent=p.length;el('answered').textContent=sessionA;el('correct').textContent=sessionC;el('rate').textContent=sessionA?Math.round(sessionC/sessionA*100)+'%':'0%';}

function renderQuestion(){const q=current(); if(!q){renderDone();return;} meta(q); el('stem').textContent=q.stem; const box=el('body');box.innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button class="choice" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')+'</div>'; el('feedback').className='feedback'; el('feedback').innerHTML=''; document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.i)));}
function answerChoice(i){const q=current(); if(document.querySelector('.choice.correct,.choice.wrong'))return; const ok=i===q.correctIndex; document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');}); if(!ok)document.querySelectorAll('.choice')[i].classList.add('wrong'); record(q.id,ok); sessionA++; if(ok)sessionC++; const fb=el('feedback');fb.className='feedback show';fb.innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}：${esc(q.answer)}</div><div class="note">${esc(q.note||'')}</div>`; updateStats();}

el('start').onclick=start;el('next').onclick=next;el('prev').onclick=prev;['side','chapter','review','ord'].forEach(id=>el(id).onchange=updateStats);el('reset').onclick=()=>{if(confirm('この問題集の学習履歴をすべて削除しますか？')){hist={};localStorage.removeItem(KEY);sessionA=sessionC=0;start();}};updateStats();
