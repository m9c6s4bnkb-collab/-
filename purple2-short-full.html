:["シャトルボックス","逃避学習","学習の2要因説","呈示される前"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A28","stem":"学習の2要因説を提唱した人物は誰か。","answer":"Mowrer,O.H.（マウラー）","group":"learning_person","term":"学習の2要因説","note":"環境刺激と電撃の対呈示による恐怖反応がレスポンデント条件づけで起こり、その恐怖が非荷電の部屋へ逃げることで低減され強化されるというオペラント条件づけの過程からなる。","id":"p2q0383","options":["Pavlov,I.P.（パブロフ）","Mowrer,O.H.（マウラー）","Thorndike,E.L.（ソーンダイク）","Tolman,E.C.（トールマン）"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A28","stem":"学習の2要因説で恐怖反応を形成する過程は何か。","answer":"レスポンデント条件づけ","group":"conditioning_term","term":"学習の2要因説","note":"環境刺激と電撃の対呈示による恐怖反応がレスポンデント条件づけで起こり、その恐怖が非荷電の部屋へ逃げることで低減され強化されるというオペラント条件づけの過程からなる。","id":"p2q0384","options":["嫌悪条件づけ","レスポンデント条件づけ（古典的条件づけ）","オペラント条件づけ","レスポンデント条件づけ"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A28","stem":"学習の2要因説で逃避行動を強化する過程は何か。","answer":"オペラント条件づけ","group":"conditioning_term","term":"学習の2要因説","note":"環境刺激と電撃の対呈示による恐怖反応がレスポンデント条件づけで起こり、その恐怖が非荷電の部屋へ逃げることで低減され強化されるというオペラント条件づけの過程からなる。","id":"p2q0385","options":["嫌悪条件づけ","オペラント条件づけ","レスポンデント条件づけ","ガルシア効果（味覚嫌悪学習）"]},{"page":19,"chapter":"学習","origin":"左ページQuestion Q29","stem":"逃避も抵抗もできないストレッサーに長期間曝された結果、その状況から逃れようとする努力すら行わなくなる現象を何と呼ぶか。","answer":"学習性無力感","group":"learning_term","term":"学習性無力感","note":"Seligman,M.E.P.（セリグマン）が提唱した。強制的・不可避的な不快経験が繰り返されると、自分の行動が外的環境に影響を及ぼせないという非随伴性の認知が生じる。抑うつ形成のメカニズムを説明できると考えた。","id":"p2q0386","options":["学習の生物学的制約","実験神経症","洞察学習","学習性無力感"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A29","stem":"学習性無力感を提唱した人物は誰か。","answer":"Seligman,M.E.P.（セリグマン）","group":"learning_person","term":"学習性無力感","note":"Seligman,M.E.P.（セリグマン）が提唱した。強制的・不可避的な不快経験が繰り返されると、自分の行動が外的環境に影響を及ぼせないという非随伴性の認知が生じる。抑うつ形成のメカニズムを説明できると考えた。","id":"p2q0387","options":["Bandura,A.（バンデューラ）","Seligman,M.E.P.（セリグマン）","Harlow,H.F.（ハーロウ）","Tolman,E.C.（トールマン）"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A29","stem":"学習性無力感で形成される、自分の行動が環境に影響しないという認知を何というか。","answer":"非随伴性の認知","group":"helplessness_cognition","term":"学習性無力感","note":"Seligman,M.E.P.（セリグマン）が提唱した。強制的・不可避的な不快経験が繰り返されると、自分の行動が外的環境に影響を及ぼせないという非随伴性の認知が生じる。抑うつ形成のメカニズムを説明できると考えた。","id":"p2q0388","options":["非随伴性の認知","オペラント反応","正の弱化（罰）","一定の休止期間"]},{"page":19,"chapter":"学習","origin":"右ページAnswer解説 A29","stem":"学習性無力感は何の形成メカニズムを説明するものとして扱われたか。","answer":"抑うつ","group":"helplessness_target","term":"学習性無力感","note":"Seligman,M.E.P.（セリグマン）が提唱した。強制的・不可避的な不快経験が繰り返されると、自分の行動が外的環境に影響を及ぼせないという非随伴性の認知が生じる。抑うつ形成のメカニズムを説明できると考えた。","id":"p2q0389","options":["抑うつ","反応数","ベル音","強化子"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q30","stem":"弁別訓練において2つの刺激の弁別が困難な場合に、被験体が示す神経症的な状態を何と呼ぶか。","answer":"実験神経症","group":"learning_term","term":"実験神経症","note":"Pavlov,I.P.がイヌを被験体とした視覚弁別訓練で見いだした。刺激の弁別が困難になり嫌悪刺激の対呈示による罰を受ける可能性が高まると、興奮状態に陥り、はじめにできていた弁別課題さえ不可能になった。","id":"p2q0390","options":["潜在学習","実験神経症","観察学習（モデリング）","学習の構え（学習セット）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A30","stem":"実験神経症を見いだした人物は誰か。","answer":"Pavlov,I.P.（パブロフ）","group":"learning_person","term":"実験神経症","note":"Pavlov,I.P.がイヌを被験体とした視覚弁別訓練で見いだした。刺激の弁別が困難になり嫌悪刺激の対呈示による罰を受ける可能性が高まると、興奮状態に陥り、はじめにできていた弁別課題さえ不可能になった。","id":"p2q0391","options":["Harlow,H.F.（ハーロウ）","Mowrer,O.H.（マウラー）","Thorndike,E.L.（ソーンダイク）","Pavlov,I.P.（パブロフ）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A30","stem":"実験神経症が見いだされた課題は何か。","answer":"視覚弁別訓練","group":"experimental_neurosis_task","term":"実験神経症","note":"Pavlov,I.P.がイヌを被験体とした視覚弁別訓練で見いだした。刺激の弁別が困難になり嫌悪刺激の対呈示による罰を受ける可能性が高まると、興奮状態に陥り、はじめにできていた弁別課題さえ不可能になった。","id":"p2q0392","options":["電気ショック","視覚弁別訓練","類似した刺激","抑制する過程"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A30","stem":"実験神経症では刺激の弁別が難しくなると、イヌはどのような状態に陥るか。","answer":"興奮状態","group":"experimental_neurosis_effect","term":"実験神経症","note":"Pavlov,I.P.がイヌを被験体とした視覚弁別訓練で見いだした。刺激の弁別が困難になり嫌悪刺激の対呈示による罰を受ける可能性が高まると、興奮状態に陥り、はじめにできていた弁別課題さえ不可能になった。","id":"p2q0393","options":["大きな音","白ネズミ","唾液分泌","興奮状態"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q31","stem":"Tolman,E.C.（トールマン）が提唱した、行動として直接現れることがないものの、内的に形成される学習過程を何と呼ぶか。","answer":"潜在学習","group":"learning_term","term":"潜在学習","note":"ラットの迷路学習で、最初は出口にエサが置かれず、途中からエサが置かれると成績が急に向上したことから、行動に現れていない潜在的な学習過程があると考えた。","id":"p2q0394","options":["実験神経症","潜在学習","代理強化","試行錯誤学習"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A31","stem":"潜在学習を提唱した人物は誰か。","answer":"Tolman,E.C.（トールマン）","group":"learning_person","term":"潜在学習","note":"ラットの迷路学習で、最初は出口にエサが置かれず、途中からエサが置かれると成績が急に向上したことから、行動に現れていない潜在的な学習過程があると考えた。","id":"p2q0395","options":["Seligman,M.E.P.（セリグマン）","Tolman,E.C.（トールマン）","Bandura,A.（バンデューラ）","Thorndike,E.L.（ソーンダイク）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A31","stem":"潜在学習が示された代表的な課題は何か。","answer":"ラットの迷路学習","group":"latent_example","term":"潜在学習","note":"ラットの迷路学習で、最初は出口にエサが置かれず、途中からエサが置かれると成績が急に向上したことから、行動に現れていない潜在的な学習過程があると考えた。","id":"p2q0396","options":["環境に働きかける","強化スケジュール","ラットの迷路学習","シャトルボックス"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A31","stem":"潜在学習の実験で、途中から何が置かれると成績が急に向上したか。","answer":"エサ","group":"latent_consequence","term":"潜在学習","note":"ラットの迷路学習で、最初は出口にエサが置かれず、途中からエサが置かれると成績が急に向上したことから、行動に現れていない潜在的な学習過程があると考えた。","id":"p2q0397","options":["光刺激","水","電気ショック","エサ"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q32","stem":"Bandura,A.（バンデューラ）が提唱した、学習者の直接的な経験ではなく、モデルとなる他者の行動の観察を通じてその行動を学習することを何と呼ぶか。","answer":"観察学習（モデリング）","group":"learning_term","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0398","options":["潜在学習","洞察学習","学習の構え（学習セット）","観察学習（モデリング）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習を提唱した人物は誰か。","answer":"Bandura,A.（バンデューラ）","group":"learning_person","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0399","options":["Mowrer,O.H.（マウラー）","Thorndike,E.L.（ソーンダイク）","Bandura,A.（バンデューラ）","Seligman,M.E.P.（セリグマン）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習で、モデルに与えられる報酬や罰を何というか。","answer":"代理強化","group":"learning_term","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0400","options":["代理強化","学習の生物学的制約","洞察学習","潜在学習"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習の4過程のうち、モデルに注意を向ける段階は何か。","answer":"注意過程","group":"observational_process","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0401","options":["保持過程","注意過程","動機づけ過程","運動再生過程"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習の4過程のうち、観察した内容を記憶する段階は何か。","answer":"保持過程","group":"observational_process","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0402","options":["保持過程","動機づけ過程","注意過程","運動再生過程"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習の4過程のうち、観察した行動を実際に再現する段階は何か。","answer":"運動再生過程","group":"observational_process","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0403","options":["運動再生過程","保持過程","注意過程","動機づけ過程"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A32","stem":"観察学習の4過程のうち、行動を実行する意欲に関わる段階は何か。","answer":"動機づけ過程","group":"observational_process","term":"観察学習（モデリング）","note":"学習者が観察中にモデルの行動に対して与えられる報酬や罰を代理強化と呼ぶ。観察学習は注意過程、保持過程、運動再生過程、動機づけ過程によって成立する。","id":"p2q0404","options":["運動再生過程","保持過程","動機づけ過程","注意過程"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q33","stem":"学習者がモデルとなる他者の行動を観察している際に、モデルの行動に対して与えられる報酬や罰を何と呼ぶか。","answer":"代理強化","group":"learning_term","term":"代理強化","note":"代理強化は学習した行動の遂行水準に影響を及ぼすとされる。","id":"p2q0405","options":["代理強化","洞察学習","学習の構え（学習セット）","潜在学習"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A33","stem":"代理強化は、学習した行動の何に影響を及ぼすとされるか。","answer":"遂行水準","group":"vicarious_effect","term":"代理強化","note":"代理強化は学習した行動の遂行水準に影響を及ぼすとされる。","id":"p2q0406","options":["白ネズミ","大きな音","遂行水準","唾液分泌"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q34","stem":"Thorndike,E.L.（ソーンダイク）が提唱した、試行を何度も重ねることによって徐々に問題解決に至る方略を何と呼ぶか。","answer":"試行錯誤学習","group":"learning_term","term":"試行錯誤学習","note":"ソーンダイクが『ネコの問題箱』の実験から提唱した。箱に入れられたネコは初めは様々な行動をするが、試行を繰り返すうちに箱に入れられるとすぐ脱出できるようになった。","id":"p2q0407","options":["学習の生物学的制約","試行錯誤学習","潜在学習","学習の構え（学習セット）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A34","stem":"試行錯誤学習を提唱した人物は誰か。","answer":"Thorndike,E.L.（ソーンダイク）","group":"learning_person","term":"試行錯誤学習","note":"ソーンダイクが『ネコの問題箱』の実験から提唱した。箱に入れられたネコは初めは様々な行動をするが、試行を繰り返すうちに箱に入れられるとすぐ脱出できるようになった。","id":"p2q0408","options":["Pavlov,I.P.（パブロフ）","Seligman,M.E.P.（セリグマン）","Tolman,E.C.（トールマン）","Thorndike,E.L.（ソーンダイク）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A34","stem":"試行錯誤学習を示した実験装置は何か。","answer":"ネコの問題箱","group":"trialerror_apparatus","term":"試行錯誤学習","note":"ソーンダイクが『ネコの問題箱』の実験から提唱した。箱に入れられたネコは初めは様々な行動をするが、試行を繰り返すうちに箱に入れられるとすぐ脱出できるようになった。","id":"p2q0409","options":["ネコの問題箱","類似した刺激","電気ショック","抑制する過程"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A34","stem":"試行錯誤学習では、試行を重ねると問題解決までの行動はどうなるか。","answer":"効率化する","group":"trialerror_effect","term":"試行錯誤学習","note":"ソーンダイクが『ネコの問題箱』の実験から提唱した。箱に入れられたネコは初めは様々な行動をするが、試行を繰り返すうちに箱に入れられるとすぐ脱出できるようになった。","id":"p2q0410","options":["三項随伴性","特定の刺激","効率化する","スキナー箱"]},{"page":20,"chapter":"学習","origin":"左ページQuestion Q35","stem":"Thorndike,E.L.（ソーンダイク）が提唱した、ある状況で生じた反応のうち、快をもたらす反応は状況との結びつきが強まり、不快をもたらす反応は結びつきが弱まるとする法則を何と呼ぶか。","answer":"効果の法則","group":"learning_law","term":"効果の法則","note":"学習が成立するためには、その行動が外的環境に対して何らかの効果をもつことが必要である。快をもたらすような行動は環境とのつながりが強められる。","id":"p2q0411","options":["学習性無力感","効果の法則","アカゲザル","実験神経症"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A35","stem":"効果の法則を提唱した人物は誰か。","answer":"Thorndike,E.L.（ソーンダイク）","group":"learning_person","term":"効果の法則","note":"学習が成立するためには、その行動が外的環境に対して何らかの効果をもつことが必要である。快をもたらすような行動は環境とのつながりが強められる。","id":"p2q0412","options":["Mowrer,O.H.（マウラー）","Köhler,W.（ケーラー）","Tolman,E.C.（トールマン）","Thorndike,E.L.（ソーンダイク）"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A35","stem":"効果の法則で、快をもたらす行動と環境とのつながりはどうなるか。","answer":"強められる","group":"law_effect","term":"効果の法則","note":"学習が成立するためには、その行動が外的環境に対して何らかの効果をもつことが必要である。快をもたらすような行動は環境とのつながりが強められる。","id":"p2q0413","options":["特定の刺激","強められる","スキナー箱","三項随伴性"]},{"page":20,"chapter":"学習","origin":"右ページAnswer解説 A35","stem":"効果の法則では、学習成立のために行動が何に対して効果をもつ必要があるか。","answer":"外的環境","group":"law_target","term":"効果の法則","note":"学習が成立するためには、その行動が外的環境に対して何らかの効果をもつことが必要である。快をもたらすような行動は環境とのつながりが強められる。","id":"p2q0414","options":["大きな音","外的環境","白ネズミ","唾液分泌"]},{"page":21,"chapter":"学習","origin":"左ページQuestion Q36","stem":"Köhler,W.（ケーラー）が提唱した、現在の状況を整理し、過去経験などと統合して一気に問題解決への見通しを立てる方略を何と呼ぶか。","answer":"洞察学習","group":"learning_term","term":"洞察学習","note":"ケーラーが類人猿を被験体とした実験から提唱した。1本の棒だけでは届かないバナナを取るため、檻の中の2本の棒をつなげる行動が突然示された。問題場面の構造が目的に沿って再体制化された結果と考えられる。","id":"p2q0415","options":["潜在学習","学習の構え（学習セット）","学習性無力感","洞察学習"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A36","stem":"洞察学習を提唱した人物は誰か。","answer":"Köhler,W.（ケーラー）","group":"learning_person","term":"洞察学習","note":"ケーラーが類人猿を被験体とした実験から提唱した。1本の棒だけでは届かないバナナを取るため、檻の中の2本の棒をつなげる行動が突然示された。問題場面の構造が目的に沿って再体制化された結果と考えられる。","id":"p2q0416","options":["Köhler,W.（ケーラー）","Bandura,A.（バンデューラ）","Mowrer,O.H.（マウラー）","Thorndike,E.L.（ソーンダイク）"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A36","stem":"洞察学習の実験で被験体となった動物は何か。","answer":"類人猿","group":"insight_subject","term":"洞察学習","note":"ケーラーが類人猿を被験体とした実験から提唱した。1本の棒だけでは届かないバナナを取るため、檻の中の2本の棒をつなげる行動が突然示された。問題場面の構造が目的に沿って再体制化された結果と考えられる。","id":"p2q0417","options":["類人猿","ラット","イヌ","ネコ"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A36","stem":"洞察学習の例で、バナナを取るために類人猿が行ったことは何か。","answer":"2本の棒をつなげた","group":"insight_action","term":"洞察学習","note":"ケーラーが類人猿を被験体とした実験から提唱した。1本の棒だけでは届かないバナナを取るため、檻の中の2本の棒をつなげる行動が突然示された。問題場面の構造が目的に沿って再体制化された結果と考えられる。","id":"p2q0418","options":["2本の棒をつなげた","学習の生物学的制約","オペラント条件づけ","リハビリテーション"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A36","stem":"洞察学習は問題場面の構造がどのように変化した結果と考えられるか。","answer":"目的に沿って再体制化された","group":"insight_process","term":"洞察学習","note":"ケーラーが類人猿を被験体とした実験から提唱した。1本の棒だけでは届かないバナナを取るため、檻の中の2本の棒をつなげる行動が突然示された。問題場面の構造が目的に沿って再体制化された結果と考えられる。","id":"p2q0419","options":["白ネズミを見て泣く恐怖反応","目的に沿って再体制化された","学習の構え（学習セット）","ガルシア効果（味覚嫌悪学習）"]},{"page":21,"chapter":"学習","origin":"左ページQuestion Q37","stem":"いくつかの問題構造が同じ学習課題に取り組んだ経験によって、その構造の課題の解決が容易になることを何と呼ぶか。","answer":"学習の構え（学習セット）","group":"learning_term","term":"学習の構え（学習セット）","note":"『学習の仕方を学習する』ことである。Harlow,H.F.（ハーロウ）がアカゲザルを被験体とした視覚弁別実験から提唱した。様々な正解を経験するうちに課題の性質を学習し、高い正解率を示すようになった。","id":"p2q0420","options":["実験神経症","観察学習（モデリング）","学習の構え（学習セット）","潜在学習"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A37","stem":"学習の構えを提唱した人物は誰か。","answer":"Harlow,H.F.（ハーロウ）","group":"learning_person","term":"学習の構え（学習セット）","note":"『学習の仕方を学習する』ことである。Harlow,H.F.（ハーロウ）がアカゲザルを被験体とした視覚弁別実験から提唱した。様々な正解を経験するうちに課題の性質を学習し、高い正解率を示すようになった。","id":"p2q0421","options":["Harlow,H.F.（ハーロウ）","Bandura,A.（バンデューラ）","Tolman,E.C.（トールマン）","Seligman,M.E.P.（セリグマン）"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A37","stem":"学習の構えの実験で用いられた動物は何か。","answer":"アカゲザル","group":"learning_subject","term":"学習の構え（学習セット）","note":"『学習の仕方を学習する』ことである。Harlow,H.F.（ハーロウ）がアカゲザルを被験体とした視覚弁別実験から提唱した。様々な正解を経験するうちに課題の性質を学習し、高い正解率を示すようになった。","id":"p2q0422","options":["学習性無力感","効果の法則","アカゲザル","実験神経症"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A37","stem":"学習の構えを言い換えると何を学習することか。","answer":"学習の仕方を学習する","group":"learning_definition","term":"学習の構え（学習セット）","note":"『学習の仕方を学習する』ことである。Harlow,H.F.（ハーロウ）がアカゲザルを被験体とした視覚弁別実験から提唱した。様々な正解を経験するうちに課題の性質を学習し、高い正解率を示すようになった。","id":"p2q0423","options":["学習の構え（学習セット）","学習の仕方を学習する","観察学習（モデリング）","学習の生物学的制約"]},{"page":21,"chapter":"学習","origin":"左ページQuestion Q38","stem":"先に学習したことが、後の学習を促進することを何と呼ぶか。","answer":"正の転移","group":"transfer_term","term":"正の転移","note":"刺激の類似度と求められる反応の類似度がいずれも高い場合に生じる。スケートボードが得意な人はスノーボードの習得が早いことなどが例である。","id":"p2q0424","options":["正の転移","負の転移","両側性転移","学習の構え（学習セット）"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A38","stem":"正の転移が生じやすいのは、刺激の類似度と反応の類似度がどのような場合か。","answer":"いずれも高い場合","group":"transfer_condition","term":"正の転移","note":"刺激の類似度と求められる反応の類似度がいずれも高い場合に生じる。スケートボードが得意な人はスノーボードの習得が早いことなどが例である。","id":"p2q0425","options":["左手の学習","低い場合","いずれも高い場合","リハビリテーション"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A38","stem":"正の転移の例として挙げられるスポーツの組み合わせは何か。","answer":"スケートボードとスノーボード","group":"transfer_example","term":"正の転移","note":"刺激の類似度と求められる反応の類似度がいずれも高い場合に生じる。スケートボードが得意な人はスノーボードの習得が早いことなどが例である。","id":"p2q0426","options":["左手の学習","スケートボードとスノーボード","いずれも高い場合","硬式テニスとバドミントン"]},{"page":21,"chapter":"学習","origin":"左ページQuestion Q39","stem":"先に学習したことが、後の学習を抑制することを何と呼ぶか。","answer":"負の転移","group":"transfer_term","term":"負の転移","note":"刺激の類似度は高いが、求められる反応の類似度が低い場合に生じる。硬式テニスが得意な人は、ラケットの握り方やボールとシャトルの違いなどからバドミントンの習得に時間がかかる例がある。","id":"p2q0427","options":["正の転移","負の転移","学習の構え（学習セット）","両側性転移"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A39","stem":"負の転移が生じやすいのは、刺激の類似度が高く反応の類似度がどういう場合か。","answer":"低い場合","group":"transfer_condition","term":"負の転移","note":"刺激の類似度は高いが、求められる反応の類似度が低い場合に生じる。硬式テニスが得意な人は、ラケットの握り方やボールとシャトルの違いなどからバドミントンの習得に時間がかかる例がある。","id":"p2q0428","options":["いずれも高い場合","負の転移","正の転移","低い場合"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A39","stem":"負の転移の例として挙げられるスポーツの組み合わせは何か。","answer":"硬式テニスとバドミントン","group":"transfer_example","term":"負の転移","note":"刺激の類似度は高いが、求められる反応の類似度が低い場合に生じる。硬式テニスが得意な人は、ラケットの握り方やボールとシャトルの違いなどからバドミントンの習得に時間がかかる例がある。","id":"p2q0429","options":["左手の学習","リハビリテーション","硬式テニスとバドミントン","スケートボードとスノーボード"]},{"page":21,"chapter":"学習","origin":"左ページQuestion Q40","stem":"身体の一方の器官を使用した先行学習が、もう一方の器官を使用した後続学習に促進的な効果をもたらすことを何と呼ぶか。","answer":"両側性転移","group":"transfer_term","term":"両側性転移","note":"正の転移の一種である。例えば右手による学習が左手の学習に促進的な作用を及ぼす。リハビリテーションに応用されている。","id":"p2q0430","options":["負の転移","両側性転移","学習の構え（学習セット）","正の転移"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A40","stem":"両側性転移は、転移の方向による分類ではどの種類に含まれるか。","answer":"正の転移","group":"transfer_term","term":"両側性転移","note":"正の転移の一種である。例えば右手による学習が左手の学習に促進的な作用を及ぼす。リハビリテーションに応用されている。","id":"p2q0431","options":["正の転移","両側性転移","負の転移","学習の構え（学習セット）"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A40","stem":"両側性転移が応用されている領域は何か。","answer":"リハビリテーション","group":"transfer_application","term":"両側性転移","note":"正の転移の一種である。例えば右手による学習が左手の学習に促進的な作用を及ぼす。リハビリテーションに応用されている。","id":"p2q0432","options":["リハビリテーション","硬式テニスとバドミントン","両側性転移","いずれも高い場合"]},{"page":21,"chapter":"学習","origin":"右ページAnswer解説 A40","stem":"両側性転移の例として、右手の学習がどこへ促進的に作用するか。","answer":"左手の学習","group":"transfer_example","term":"両側性転移","note":"正の転移の一種である。例えば右手による学習が左手の学習に促進的な作用を及ぼす。リハビリテーションに応用されている。","id":"p2q0433","options":["左手の学習","負の転移","硬式テニスとバドミントン","スケートボードとスノーボード"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q1","stem":"行動を一定の目標に向けて生起、持続、終結させるプロセスを何と呼ぶか。","answer":"動機づけ","group":"motivation_term","term":"動機づけ","note":"行動を生起させる機能、持続させる機能、終結させる機能の3つから構成される。人の内部にあって行動を引き起こすものを欲求や動因、外部にあって行動を引き起こすものを誘因と呼ぶ。","id":"p2q0434","options":["動機づけ","フラストレーション耐性（欲求不満耐性）","外発的動機づけ","達成動機"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A1","stem":"動機づけを構成する3つの機能は何か。","answer":"生起・持続・終結","group":"motivation_functions","term":"動機づけ","note":"行動を生起させる機能、持続させる機能、終結させる機能の3つから構成される。人の内部にあって行動を引き起こすものを欲求や動因、外部にあって行動を引き起こすものを誘因と呼ぶ。","id":"p2q0435","options":["生起・持続・終結","カフェテリア実験","活動すること自体","外発的動機づけ"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A1","stem":"人の内部にあって行動を引き起こすものを何というか。","answer":"欲求や動因","group":"motivation_source","term":"動機づけ","note":"行動を生起させる機能、持続させる機能、終結させる機能の3つから構成される。人の内部にあって行動を引き起こすものを欲求や動因、外部にあって行動を引き起こすものを誘因と呼ぶ。","id":"p2q0436","options":["報酬や賞賛","活動すること自体","欲求や動因","誘因"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A1","stem":"人の外部にあって行動を引き起こすものを何というか。","answer":"誘因","group":"motivation_source","term":"動機づけ","note":"行動を生起させる機能、持続させる機能、終結させる機能の3つから構成される。人の内部にあって行動を引き起こすものを欲求や動因、外部にあって行動を引き起こすものを誘因と呼ぶ。","id":"p2q0437","options":["欲求や動因","誘因","活動すること自体","動機づけ"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q2","stem":"外部から与えられる刺激によって動機づけられることを何と呼ぶか。","answer":"外発的動機づけ","group":"motivation_term","term":"外発的動機づけ","note":"誘因となる報酬や賞賛などを与えることによって動機づけが高められる。","id":"p2q0438","options":["動機づけ","外発的動機づけ","内発的動機づけ","達成動機"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A2","stem":"外発的動機づけを高める誘因の例は何か。","answer":"報酬や賞賛","group":"motivation_example","term":"外発的動機づけ","note":"誘因となる報酬や賞賛などを与えることによって動機づけが高められる。","id":"p2q0439","options":["食べ物を食べる","動因低減説","自己効力感","報酬や賞賛"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A2","stem":"外発的動機づけでは、動機づけの源は本人の内側と外側のどちらにあるか。","answer":"外側","group":"motivation_location","term":"外発的動機づけ","note":"誘因となる報酬や賞賛などを与えることによって動機づけが高められる。","id":"p2q0440","options":["外側","誘因","達成動機","動機づけ"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q3","stem":"Hull,C.L.（ハル）が提唱した、高まった動因を低減するために人は行動し、動因を低減させた行動が強化されるとする考えを何と呼ぶか。","answer":"動因低減説","group":"motivation_theory","term":"動因低減説","note":"生体のホメオスタシスに基づく考え。例えば空腹という動因は食べ物を食べる行動によって低減され、その行動が強化される。","id":"p2q0441","options":["機能的自律性","動因低減説","自己決定理論","欲求不満―攻撃仮説"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A3","stem":"動因低減説を提唱した人物は誰か。","answer":"Hull,C.L.（ハル）","group":"motivation_person","term":"動因低減説","note":"生体のホメオスタシスに基づく考え。例えば空腹という動因は食べ物を食べる行動によって低減され、その行動が強化される。","id":"p2q0442","options":["Weiner,B.（ワイナー）","Bandura,A.（バンデューラ）","Dollard,J.（ダラード）とMiller,N.E.（ミラー）","Hull,C.L.（ハル）"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A3","stem":"動因低減説の基盤にある生体の恒常性を何というか。","answer":"ホメオスタシス","group":"motivation_basis","term":"動因低減説","note":"生体のホメオスタシスに基づく考え。例えば空腹という動因は食べ物を食べる行動によって低減され、その行動が強化される。","id":"p2q0443","options":["ホメオスタシス","内発的動機づけ","外発的動機づけ","食べ物を食べる"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A3","stem":"動因低減説の例で、空腹という動因を低減する行動は何か。","answer":"食べ物を食べる","group":"motivation_example","term":"動因低減説","note":"生体のホメオスタシスに基づく考え。例えば空腹という動因は食べ物を食べる行動によって低減され、その行動が強化される。","id":"p2q0444","options":["報酬や賞賛","ホメオスタシス","食べ物を食べる","外発的動機づけ"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q4","stem":"外的な報酬や罰によらず、その活動自体が目的や報酬となって動機づけられることを何と呼ぶか。","answer":"内発的動機づけ","group":"motivation_term","term":"内発的動機づけ","note":"外的報酬によらず、活動すること自体が報酬となって動機づけが高められる。もともとは動因低減説の反証として提唱された。","id":"p2q0445","options":["達成動機","内発的動機づけ","自己効力感","親和動機"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A4","stem":"内発的動機づけでは何が報酬となるか。","answer":"活動すること自体","group":"motivation_source","term":"内発的動機づけ","note":"外的報酬によらず、活動すること自体が報酬となって動機づけが高められる。もともとは動因低減説の反証として提唱された。","id":"p2q0446","options":["誘因","生起・持続・終結","欲求や動因","活動すること自体"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A4","stem":"内発的動機づけは、もともと何の反証として提唱されたか。","answer":"動因低減説","group":"motivation_theory","term":"内発的動機づけ","note":"外的報酬によらず、活動すること自体が報酬となって動機づけが高められる。もともとは動因低減説の反証として提唱された。","id":"p2q0447","options":["自己決定理論","機能的自律性","動因低減説","欲求不満―攻撃仮説"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q5","stem":"もともと報酬がなくても楽しんでいた活動に物質的報酬を与えると、内発的動機づけが低減する現象を何と呼ぶか。","answer":"アンダーマイニング効果（過正当化効果）","group":"motivation_term","term":"アンダーマイニング効果（過正当化効果）","note":"もともとは活動をすること自体が報酬であったにもかかわらず、物質的報酬が与えられることで活動の目的が外的報酬を受けることに変化し、内発的動機づけが低下すると考えられる。","id":"p2q0448","options":["アンダーマイニング効果（過正当化効果）","親和動機","動機づけ","達成動機"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A5","stem":"アンダーマイニング効果で、活動の目的は何へと変化すると考えられるか。","answer":"外的報酬を受けること","group":"undermining_process","term":"アンダーマイニング効果（過正当化効果）","note":"もともとは活動をすること自体が報酬であったにもかかわらず、物質的報酬が与えられることで活動の目的が外的報酬を受けることに変化し、内発的動機づけが低下すると考えられる。","id":"p2q0449","options":["コンフリクト（葛藤）","生得的欲求を満たすため","欲求の対象そのもの","外的報酬を受けること"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A5","stem":"アンダーマイニング効果によって低下するのは何か。","answer":"内発的動機づけ","group":"motivation_term","term":"アンダーマイニング効果（過正当化効果）","note":"もともとは活動をすること自体が報酬であったにもかかわらず、物質的報酬が与えられることで活動の目的が外的報酬を受けることに変化し、内発的動機づけが低下すると考えられる。","id":"p2q0450","options":["内発的動機づけ","自己効力感","アンダーマイニング効果（過正当化効果）","外発的動機づけ"]},{"page":22,"chapter":"動機づけ・情動","origin":"左ページQuestion Q6","stem":"Allport,G.W.（オルポート）が提唱した、もともとは生得的欲求を満たすための手段だった行動が、再構成されて自律的になり、それ自体が目的となることを何と呼ぶか。","answer":"機能的自律性","group":"motivation_theory","term":"機能的自律性","note":"例えば新生児にとって母親は空腹など生得的欲求を満たすための手段であったが、その後の乳幼児にとって母親は欲求の対象そのものへと変化する。","id":"p2q0451","options":["機能的自律性","自己決定理論","動因低減説","欲求不満―攻撃仮説"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A6","stem":"機能的自律性を提唱した人物は誰か。","answer":"Allport,G.W.（オルポート）","group":"motivation_person","term":"機能的自律性","note":"例えば新生児にとって母親は空腹など生得的欲求を満たすための手段であったが、その後の乳幼児にとって母親は欲求の対象そのものへと変化する。","id":"p2q0452","options":["Hull,C.L.（ハル）","Allport,G.W.（オルポート）","Dollard,J.（ダラード）とMiller,N.E.（ミラー）","Atkinson,J.W.（アトキンソン）"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A6","stem":"機能的自律性の例で、新生児にとって母親は当初何のための手段か。","answer":"生得的欲求を満たすため","group":"functional_autonomy_stage","term":"機能的自律性","note":"例えば新生児にとって母親は空腹など生得的欲求を満たすための手段であったが、その後の乳幼児にとって母親は欲求の対象そのものへと変化する。","id":"p2q0453","options":["接近―回避コンフリクト","欲求の対象そのもの","生得的欲求を満たすため","接近―接近コンフリクト"]},{"page":22,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A6","stem":"機能的自律性の例で、成長後に母親は何へと変化するか。","answer":"欲求の対象そのもの","group":"functional_autonomy_stage","term":"機能的自律性","note":"例えば新生児にとって母親は空腹など生得的欲求を満たすための手段であったが、その後の乳幼児にとって母親は欲求の対象そのものへと変化する。","id":"p2q0454","options":["生得的欲求を満たすため","生起・持続・終結","欲求不満―攻撃仮説","欲求の対象そのもの"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q7","stem":"覚醒水準と課題遂行の水準は逆U字の関係にあり、覚醒水準が高まるにつれて遂行は高まるが、最適な水準を超えると遂行が低下するとする考えを何と呼ぶか。","answer":"ヤーキーズ・ダッドソンの法則","group":"motivation_law","term":"ヤーキーズ・ダッドソンの法則","note":"目覚めたばかりの状態や極度の緊張状態におけるパフォーマンスは、適度なストレス状況でのパフォーマンスよりも劣る。","id":"p2q0455","options":["Young,A.（ヤング）","ヤーキーズ・ダッドソンの法則","Hull,C.L.（ハル）","Weiner,B.（ワイナー）"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A7","stem":"ヤーキーズ・ダッドソンの法則で、覚醒水準と遂行水準の関係はどのような形か。","answer":"逆U字","group":"yerkes_shape","term":"ヤーキーズ・ダッドソンの法則","note":"目覚めたばかりの状態や極度の緊張状態におけるパフォーマンスは、適度なストレス状況でのパフォーマンスよりも劣る。","id":"p2q0456","options":["関係性","有能感","自律性","逆U字"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A7","stem":"ヤーキーズ・ダッドソンの法則で最もパフォーマンスが高くなりやすいのはどの程度のストレスか。","answer":"適度なストレス","group":"yerkes_level","term":"ヤーキーズ・ダッドソンの法則","note":"目覚めたばかりの状態や極度の緊張状態におけるパフォーマンスは、適度なストレス状況でのパフォーマンスよりも劣る。","id":"p2q0457","options":["食べ物を食べる","適度なストレス","外発的動機づけ","ホメオスタシス"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q8","stem":"Deci,E.L.（デシ）とRyan,R.M.（ライアン）が提唱した、外発的動機づけと内発的動機づけを自己決定性の一次元上に位置づける理論を何と呼ぶか。","answer":"自己決定理論","group":"motivation_theory","term":"自己決定理論","note":"外発的に動機づけられた行動も自己決定の過程を経て内発的に動機づけられた行動へ変化すると考える。内発的動機づけを高めるには自律性、有能感、関係性の3つの要因を満たす必要がある。","id":"p2q0458","options":["動因低減説","機能的自律性","欲求不満―攻撃仮説","自己決定理論"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A8","stem":"自己決定理論を提唱した人物は誰か。","answer":"Deci,E.L.（デシ）とRyan,R.M.（ライアン）","group":"motivation_person","term":"自己決定理論","note":"外発的に動機づけられた行動も自己決定の過程を経て内発的に動機づけられた行動へ変化すると考える。内発的動機づけを高めるには自律性、有能感、関係性の3つの要因を満たす必要がある。","id":"p2q0459","options":["Deci,E.L.（デシ）とRyan,R.M.（ライアン）","Weiner,B.（ワイナー）","Rosenzweig,S.（ローゼンツヴァイク）","Hull,C.L.（ハル）"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A8","stem":"自己決定理論で内発的動機づけを高める基本的欲求の1つは何か。","answer":"自律性","group":"selfdetermination_need","term":"自己決定理論","note":"外発的に動機づけられた行動も自己決定の過程を経て内発的に動機づけられた行動へ変化すると考える。内発的動機づけを高めるには自律性、有能感、関係性の3つの要因を満たす必要がある。","id":"p2q0460","options":["自律性","関係性","有能感","逆U字"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A8","stem":"自己決定理論で内発的動機づけを高める基本的欲求の1つは何か。","answer":"有能感","group":"selfdetermination_need","term":"自己決定理論","note":"外発的に動機づけられた行動も自己決定の過程を経て内発的に動機づけられた行動へ変化すると考える。内発的動機づけを高めるには自律性、有能感、関係性の3つの要因を満たす必要がある。","id":"p2q0461","options":["自律性","逆U字","有能感","関係性"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A8","stem":"自己決定理論で内発的動機づけを高める基本的欲求の1つは何か。","answer":"関係性","group":"selfdetermination_need","term":"自己決定理論","note":"外発的に動機づけられた行動も自己決定の過程を経て内発的に動機づけられた行動へ変化すると考える。内発的動機づけを高めるには自律性、有能感、関係性の3つの要因を満たす必要がある。","id":"p2q0462","options":["自律性","逆U字","関係性","有能感"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q9","stem":"Bandura,A.（バンデューラ）が提唱した、ある状況において自分は適切に行動できるという信念を何と呼ぶか。","answer":"自己効力感","group":"motivation_term","term":"自己効力感","note":"人は外的環境を解釈し、予期機能に基づいて行動する。予期機能には、行動がどんな結果を引き起こすかという結果予期と、適切な行動ができるかという効力予期があり、この効力予期に当たるのが自己効力感である。高まると積極的関与が促進され、困難でも努力を長く続ける。","id":"p2q0463","options":["親和動機","自己効力感","動機づけ","フラストレーション耐性（欲求不満耐性）"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A9","stem":"自己効力感を提唱した人物は誰か。","answer":"Bandura,A.（バンデューラ）","group":"motivation_person","term":"自己効力感","note":"人は外的環境を解釈し、予期機能に基づいて行動する。予期機能には、行動がどんな結果を引き起こすかという結果予期と、適切な行動ができるかという効力予期があり、この効力予期に当たるのが自己効力感である。高まると積極的関与が促進され、困難でも努力を長く続ける。","id":"p2q0464","options":["Weiner,B.（ワイナー）","Atkinson,J.W.（アトキンソン）","Bandura,A.（バンデューラ）","Deci,E.L.（デシ）とRyan,R.M.（ライアン）"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A9","stem":"行動がどんな結果を引き起こすかという予期を何というか。","answer":"結果予期","group":"expectancy_type","term":"自己効力感","note":"人は外的環境を解釈し、予期機能に基づいて行動する。予期機能には、行動がどんな結果を引き起こすかという結果予期と、適切な行動ができるかという効力予期があり、この効力予期に当たるのが自己効力感である。高まると積極的関与が促進され、困難でも努力を長く続ける。","id":"p2q0465","options":["離乳直後","効力予期","結果予期","動機づけ"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A9","stem":"適切な行動ができるかという予期を何というか。","answer":"効力予期","group":"expectancy_type","term":"自己効力感","note":"人は外的環境を解釈し、予期機能に基づいて行動する。予期機能には、行動がどんな結果を引き起こすかという結果予期と、適切な行動ができるかという効力予期があり、この効力予期に当たるのが自己効力感である。高まると積極的関与が促進され、困難でも努力を長く続ける。","id":"p2q0466","options":["言語的説得","遂行達成","効力予期","生理的・情動的状態"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A9","stem":"自己効力感が高まると、困難に直面した際の努力はどうなるか。","answer":"より長く続く","group":"selfefficacy_effect","term":"自己効力感","note":"人は外的環境を解釈し、予期機能に基づいて行動する。予期機能には、行動がどんな結果を引き起こすかという結果予期と、適切な行動ができるかという効力予期があり、この効力予期に当たるのが自己効力感である。高まると積極的関与が促進され、困難でも努力を長く続ける。","id":"p2q0467","options":["より長く続く","自己決定理論","感覚遮断実験","機能的自律性"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q10","stem":"自己効力感を形成する4つの情報のうち、自分と似た他者の成功体験を観察することを何と呼ぶか。","answer":"代理的経験","group":"selfefficacy_source","term":"代理的経験","note":"自分と似た他者の成功体験を観察する代理的経験は、自己効力感を形成する要因の1つである。","id":"p2q0468","options":["代理的経験","報酬や賞賛","動因低減説","欲求や動因"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A10","stem":"代理的経験で観察するのは、どのような他者の体験か。","answer":"自分と似た他者の成功体験","group":"selfefficacy_example","term":"代理的経験","note":"自分と似た他者の成功体験を観察する代理的経験は、自己効力感を形成する要因の1つである。","id":"p2q0469","options":["Hull,C.L.（ハル）","自分と似た他者の成功体験","Young,A.（ヤング）","生得的欲求を満たすため"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A10","stem":"代理的経験は何を形成する要因の1つか。","answer":"自己効力感","group":"motivation_term","term":"代理的経験","note":"自分と似た他者の成功体験を観察する代理的経験は、自己効力感を形成する要因の1つである。","id":"p2q0470","options":["アンダーマイニング効果（過正当化効果）","自己効力感","外発的動機づけ","内発的動機づけ"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q11","stem":"Young,A.（ヤング）が行った、栄養成分の摂取を制限された実験動物をさまざまなエサから自由に摂取できる状況に置き、不足している栄養素を自ら摂取する様子を観察した実験を何と呼ぶか。","answer":"カフェテリア実験","group":"motivation_experiment","term":"カフェテリア実験","note":"食行動におけるホメオスタシスが確認された実験で、この行動は離乳直後の乳幼児でも観察される。","id":"p2q0471","options":["カフェテリア実験","出生直後","乳児期後半","幼児期前半"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A11","stem":"カフェテリア実験で確認された食行動の調節原理は何か。","answer":"ホメオスタシス","group":"motivation_basis","term":"カフェテリア実験","note":"食行動におけるホメオスタシスが確認された実験で、この行動は離乳直後の乳幼児でも観察される。","id":"p2q0472","options":["内発的動機づけ","外発的動機づけ","ホメオスタシス","食べ物を食べる"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A11","stem":"カフェテリア実験でみられる行動は、どの時期の乳幼児でも観察されるとされるか。","answer":"離乳直後","group":"development_timing","term":"カフェテリア実験","note":"食行動におけるホメオスタシスが確認された実験で、この行動は離乳直後の乳幼児でも観察される。","id":"p2q0473","options":["効力予期","動機づけ","離乳直後","結果予期"]},{"page":23,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A11","stem":"カフェテリア実験を行った人物は誰か。","answer":"Young,A.（ヤング）","group":"motivation_person","term":"カフェテリア実験","note":"食行動におけるホメオスタシスが確認された実験で、この行動は離乳直後の乳幼児でも観察される。","id":"p2q0474","options":["Deci,E.L.（デシ）とRyan,R.M.（ライアン）","Weiner,B.（ワイナー）","Young,A.（ヤング）","Atkinson,J.W.（アトキンソン）"]},{"page":23,"chapter":"動機づけ・情動","origin":"左ページQuestion Q12","stem":"実験参加者の感覚器に刺激が入らない状態を続けると、思考の混乱や身体的な違和 const $=s=>document.querySelector(s);const key='purple2_short_history_v1';let hist=JSON.parse(localStorage.getItem(key)||'{}'),order=[],pos=0,session={answered:0,correct:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rec(id){return hist[id]||(hist[id]={attempts:0,correct:0,wrong:0,last:null})} function save(){localStorage.setItem(key,JSON.stringify(hist))}
function filtered(){let mode=$('#mode').value,chap=$('#chap').value;return DATA.filter(x=>{let r=rec(x.id);if(chap!=='all'&&x.chapter!==chap)return false;if(mode==='unanswered'&&r.attempts>0)return false;if(mode==='wrong1'&&r.wrong<1)return false;if(mode==='wrong2'&&r.wrong<2)return false;if(mode==='lastwrong'&&r.last!=='wrong')return false;return true})}
function rebuild(rand=false){order=filtered().map(x=>x.id);if(rand)order=shuffle(order);pos=0;session={answered:0,correct:0};render()}
function current(){return DATA.find(x=>x.id===order[pos])} function baseMeta(it){return `出典：紫2..pdf PDF p.${it.page}｜${it.origin}`}
function updateStats(){let all=Object.values(hist);let attempts=all.reduce((s,r)=>s+r.attempts,0),correct=all.reduce((s,r)=>s+r.correct,0),wrong=all.reduce((s,r)=>s+r.wrong,0);$('#st1').textContent=session.answered;$('#st2').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'—';$('#st3').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';$('#st4').textContent=wrong}
function prev(){if(pos>0){pos--;render()}} function next(){if(pos<order.length-1){pos++;render()}else{renderDone()}}
function renderDone(){updateStats();$('.card').innerHTML=`<div class="empty"><b>このセットは終了！</b><br>フィルタを変えるか、同じ条件で解き直せます。<div style="margin-top:14px"><button onclick="rebuild(true)">同じ条件でランダムにもう一度</button></div></div>`}
function resetSession(){rebuild(false)} function resetAll(){if(confirm('累積の回答履歴・誤答回数もすべて消しますか？')){hist={};save();rebuild(false)}}
function render(){updateStats();if(!order.length){renderDone();return}const it=current();$('.card').innerHTML=`<div class="qno">${pos+1} / ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><div class="stem">${it.stem}</div><button id="showBtn" class="primary" onclick="showAnswer()">答えを見る</button><div id="fb" class="feedback"></div><div id="judge" style="display:none;margin-top:12px;gap:8px"><button onclick="judge(true)">○ 正解</button><button onclick="judge(false)">× 不正解</button></div><div class="nav"><button onclick="prev()" ${pos===0?'disabled':''}>← 前へ</button><button id="nextBtn" onclick="next()" disabled>次へ →</button></div>`}
function showAnswer(){const it=current();$('#fb').innerHTML=`<div class="answer">答え：${it.answer}</div><div>${it.note}</div><div class="meta">分野：${it.chapter}<br>元項目：${it.term}<br>${baseMeta(it)}</div>`;$('#fb').classList.add('show');$('#showBtn').disabled=true;$('#judge').style.display='flex'}
function judge(ok){const it=current();let r=rec(it.id);if($('#judge').dataset.done)return;$('#judge').dataset.done='1';r.attempts++;r.last=ok?'correct':'wrong';ok?r.correct++:r.wrong++;save();session.answered++;if(ok)session.correct++;$('#judge').querySelectorAll('button').forEach(b=>b.disabled=true);$('#nextBtn').disabled=false;updateStats()}
let chapters=[...new Set(DATA.map(x=>x.chapter))];$('#chap').innerHTML='<option value="all">全分野</option>'+chapters.map(c=>`<option>${c}</option>`).join('');$('#mode').onchange=()=>rebuild(false);$('#chap').onchange=()=>rebuild(false);rebuild(false);
</script></body></html>
