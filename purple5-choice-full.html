const DATA=[{"id":"p5q0001","page":1,"chapter":"心理アセスメント","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n場面や状況を表す絵を見せて物語を作らせ、その内容からパーソナリティを理解する投映法。","answer":"主題（絵画）統覚検査（TAT）","aliases":["主題（絵画）統覚検査（TAT）"],"term":"主題（絵画）統覚検査（TAT）","group":"projective_verbal","kind":"term","note":"場面や状況を表す絵を見せて物語を作らせ、その内容からパーソナリティを理解する投映法。 Murrayの欲求―圧力理論に基づいて開発された。 場面図30枚と白紙1枚の計31枚からなり、原版では年齢・性別に応じた20枚を2回に分けて用いる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["主題（絵画）統覚検査（TAT）","Murrayの欲求―圧力理論","Jung","絵画欲求不満テスト（P-Fスタディ）"],"correctIndex":0},{"id":"p5q0004","page":1,"chapter":"心理アセスメント","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\nフラストレーション場面のイラストへの反応から、被検者の性格特性を理解する投映法。","answer":"絵画欲求不満テスト（P-Fスタディ）","aliases":["絵画欲求不満テスト（P-Fスタディ）"],"term":"絵画欲求不満テスト（P-Fスタディ）","group":"projective_verbal","kind":"term","note":"フラストレーション場面のイラストへの反応から、被検者の性格特性を理解する投映法。 自我阻害場面と超自我阻害場面に分けられる24枚のイラストを用いる。 反応をアグレッションの方向と型の組合せなどから分類し、11の評点因子に分ける。","source":"左ページQuestion（右ページ解説で内容確認）","options":["主題（絵画）統覚検査（TAT）","絵画欲求不満テスト（P-Fスタディ）","100語","文章完成法（SCT）"],"correctIndex":1},{"id":"p5q0007","page":1,"chapter":"心理アセスメント","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n不完全で多義的な刺激文に続く文章を自由に記述させ、完成文から性格特性を理解する検査。","answer":"文章完成法（SCT）","aliases":["文章完成法（SCT）"],"term":"文章完成法（SCT）","group":"projective_verbal","kind":"term","note":"不完全で多義的な刺激文に続く文章を自由に記述させ、完成文から性格特性を理解する検査。 言語連想検査から発展したとされる。 文章の理解力や作文能力があれば児童期以上から適用でき、必要に応じて検査者が刺激語を作成することもできる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["100語","絵画欲求不満テスト（P-Fスタディ）","文章完成法（SCT）","Murrayの欲求―圧力理論"],"correctIndex":2},{"id":"p5q0010","page":1,"chapter":"心理アセスメント","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n刺激語に対して自由に連想した反応語や反応時間などを分析し、パーソナリティを把握する検査。","answer":"言語連想検査","aliases":["言語連想検査"],"term":"言語連想検査","group":"projective_verbal","kind":"term","note":"刺激語に対して自由に連想した反応語や反応時間などを分析し、パーソナリティを把握する検査。 臨床場面ではJungがはじめて用いたとされる。 100語の刺激語を提示し、反応語や反応時間などから個人のコンプレックスを明らかにしようとした。","source":"左ページQuestion（右ページ解説で内容確認）","options":["主題（絵画）統覚検査（TAT）","Jung","場面図30枚と白紙1 r":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n具体的な行動を分析し、環境との関係を操作して行動変容を図る方法。","answer":"応用行動分析","aliases":["応用行動分析"],"term":"応用行動分析","group":"behavior_therapy","kind":"term","note":"具体的な行動を分析し、環境との関係を操作して行動変容を図る方法。 行動を先行事象・行動・結果の関係から分析する。 行動療法における代表的な行動分析の考え方である。","source":"左ページQuestion（右ページ解説で内容確認）","options":["受動的注意集中","系統的脱感作法","応用行動分析","Schultz"],"correctIndex":2},{"id":"p5q0298","page":17,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n不安を引き起こす場面を弱いものから強いものへ段階づけて並べたリスト。","answer":"不安階層表","aliases":["不安階層表"],"term":"不安階層表","group":"behavior_therapy","kind":"term","note":"不安を引き起こす場面を弱いものから強いものへ段階づけて並べたリスト。 系統的脱感作法などで用いられる。 不安の程度に応じて刺激場面を順序づける。","source":"左ページQuestion（右ページ解説で内容確認）","options":["嫌悪療法","Wolpe","シェイピング","不安階層表"],"correctIndex":3},{"id":"p5q0301","page":17,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n不安階層表の刺激を弱いものから順に想起・経験し、リラクセーションと組み合わせて不安反応を弱める方法。","answer":"系統的脱感作法","aliases":["系統的脱感作法"],"term":"系統的脱感作法","group":"behavior_therapy","kind":"term","note":"不安階層表の刺激を弱いものから順に想起・経験し、リラクセーションと組み合わせて不安反応を弱める方法。 Wolpeが考案した。 不安と弛緩反応を両立しにくい反応として扱い、段階的に不安を弱める。","source":"左ページQuestion（右ページ解説で内容確認）","options":["系統的脱感作法","漸進的筋弛緩法","モデリング療法","不安階層表"],"correctIndex":0},{"id":"p5q0304","page":17,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n自己暗示を用いて心身の緊張を緩め、リラクセーションを得る方法。","answer":"自律訓練法","aliases":["自律訓練法"],"term":"自律訓練法","group":"behavior_therapy","kind":"term","note":"自己暗示を用いて心身の緊張を緩め、リラクセーションを得る方法。 Schultzが提唱した。 身体感覚への受動的注意集中を用いる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["シェイピング","自律訓練法","モデリング療法","行動療法"],"correctIndex":1},{"id":"p5q0307","page":17,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n自律訓練法で、身体感覚を無理に変えようとせず受け止めながら注意を向ける態度。","answer":"受動的注意集中","aliases":["受動的注意集中"],"term":"受動的注意集中","group":"behavior_therapy","kind":"term","note":"自律訓練法で、身体感覚を無理に変えようとせず受け止めながら注意を向ける態度。 自律訓練法の練習態度として重視される。 感覚を操作するのではなく、起こっている感覚に受動的に注意を向ける。","source":"左ページQuestion 。","answer":"嫌悪療法","aliases":["嫌悪療法"],"term":"嫌悪療法","group":"behavior_therapy","kind":"term","note":"不適切な行動に不快刺激を結びつけ、その行動の生起頻度を減らす方法。 罰によって行動の生起頻度をコントロールする側面をもつ。 倫理的アセスメントが必要であり、用いられる場面は限られる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Wolpe","認知療法","モデリング療法","嫌悪療法"],"correctIndex":3},{"id":"p5q0325","page":18,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n通常は自覚しにくい生理反応を視覚・聴覚情報として示し、自己調整を学習する方法。","answer":"バイオフィードバック","aliases":["バイオフィードバック"],"term":"バイオフィードバック","group":"behavior_therapy","kind":"term","note":"通常は自覚しにくい生理反応を視覚・聴覚情報として示し、自己調整を学習する方法。 生理心理学に由来し、客観的指標を可視化する点が大きな特徴である。 クライエントが自分の状態を理解しやすくなり、治療意欲の向上につながることがある。","source":"左ページQuestion（右ページ解説で内容確認）","options":["バイオフィードバック","認知療法","ペアレント・トレーニング","レスポンスコスト"],"correctIndex":0},{"id":"p5q0328","page":19,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n子どもの問題行動への対応を、保護者が学習して実践する支援法。","answer":"ペアレント・トレーニング","aliases":["ペアレント・トレーニング"],"term":"ペアレント・トレーニング","group":"behavior_therapy","kind":"term","note":"子どもの問題行動への対応を、保護者が学習して実践する支援法。 AD/HD児などの親を対象とした親訓練として用いられる。 親が子どもの行動を理解し、望ましい関わり方を学ぶことを目指す。","source":"左ページQuestion（右ページ解説で内容確認）","options":["系統的脱感作法","ペアレント・トレーニング","エクスポージャー（曝露療法）","トークンエコノミー"],"correctIndex":1},{"id":"p5q0331","page":19,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n望ましい行動に対してトークンを与え、後で報酬と交換できるようにして行動を強化する方法。","answer":"トークンエコノミー","aliases":["トークンエコノミー"],"term":"トークンエコノミー","group":"behavior_therapy","kind":"term","note":"望ましい行動に対してトークンを与え、後で報酬と交換できるようにして行動を強化する方法。 トークンは二次性強化子として機能する。 望ましい行動の生起頻度を高めることを目的とする。","source":"左ページQuestion（右ページ解説で内容確認）","options":["漸進的筋弛緩法","応用行動分析","トークンエコノミー","Jacobson"],"correctIndex":2},{"id":"p5q0334","page":19,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・検査・技法はどれか。\n不適切な行動が生じた際に、持っている強化子やトークンを失わせて行動を減らす方法。","answer":"レスポンスコスト","aliases":["レスポンスコスト"],"term":"レスポンスコスト","group":"behavior_therapy","kind":"term","note":"不適切な行動が生じた際に、持っている強化子やトークンを失わせて行動を減らす方法。 好子を取り去ることで行動の生起頻度を低下させる。 トーク function stat(id){return hist[id]||{correct:0,wrong:0,last:null}}function record(id,ok){const s=stat(id);s.correct+=(ok?1:0);s.wrong+=(!ok?1:0);s.last=ok?'correct':'wrong';hist[id]=s;localStorage.setItem(KEY,JSON.stringify(hist));}
function pool(){let a=DATA.slice();const side=el('side').value,chap=el('chapter').value,rev=el('review').value;if(side!=='all')a=a.filter(x=>x.side===side);if(chap!=='all')a=a.filter(x=>x.chapter===chap);if(rev==='unanswered')a=a.filter(x=>{const s=stat(x.id);return s.correct+s.wrong===0});if(rev==='lastwrong')a=a.filter(x=>stat(x.id).last==='wrong');if(rev==='everwrong')a=a.filter(x=>stat(x.id).wrong>0);if(rev==='wrong1')a=a.filter(x=>stat(x.id).wrong===1);if(rev==='wrong2')a=a.filter(x=>stat(x.id).wrong===2);if(rev==='wrong3')a=a.filter(x=>stat(x.id).wrong>=3);return a;}
function start(){order=pool();if(el('ord').value==='random')order.sort(()=>Math.random()-.5);pos=0;renderQuestion();updateStats();} function current(){return order[pos]}
function next(){if(pos<order.length-1){pos++;renderQuestion();}else renderDone();}function prev(){if(pos>0){pos--;renderQuestion();}}
function meta(q){el('meta').innerHTML=`<span class="pill">${q.side==='basic'?'基本':'右ページ詳細'}</span><span class="pill">${esc(q.chapter||'')}</span><span class="pill">誤答 ${stat(q.id).wrong}回</span><span class="pill">${pos+1} / ${order.length}</span>`;}
function renderDone(){el('stem').textContent=order.length?'この範囲は終了！':'該当する問題がありません';el('body').innerHTML='';el('feedback').className='feedback';}
function updateStats(){const p=pool();el('pool').textContent=p.length;el('answered').textContent=sessionA;el('correct').textContent=sessionC;el('rate').textContent=sessionA?Math.round(sessionC/sessionA*100)+'%':'0%';}

function renderQuestion(){const q=current(); if(!q){renderDone();return;} meta(q); el('stem').textContent=q.stem; const box=el('body');box.innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button class="choice" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')+'</div>'; el('feedback').className='feedback'; el('feedback').innerHTML=''; document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.i)));}
function answerChoice(i){const q=current(); if(document.querySelector('.choice.correct,.choice.wrong'))return; const ok=i===q.correctIndex; document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');}); if(!ok)document.querySelectorAll('.choice')[i].classList.add('wrong'); record(q.id,ok); sessionA++; if(ok)sessionC++; const fb=el('feedback');fb.className='feedback show';fb.innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}：${esc(q.answer)}</div><div class="note">${esc(q.note||'')}</div>`; updateStats();}

el('start').onclick=start;el('next').onclick=next;el('prev').onclick=prev;['side','chapter','review','ord'].forEach(id=>el(id).onchange=updateStats);el('reset').onclick=()=>{if(confirm('この問題集の学習履歴をすべて削除しますか？')){hist={};localStorage.removeItem(KEY);sessionA=sessionC=0;start();}};updateStats();
</script></body></html>
