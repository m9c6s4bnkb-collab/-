let state=loadState();

function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return {answers:x.answers||{},current:Number.isInteger(x.current)?x.current:0,menuHidden:!!x.menuHidden};}catch(e){return {answers:{},current:0,menuHidden:false};}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function makeRandomOrder(){const a=[...Array(Q.length).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getOrder(){if(mode==="random")return randomOrder;if(mode==="wrong")return [...Array(Q.length).keys()].filter(i=>state.answers[i]&&state.answers[i].correct===false);if(mode==="unanswered")return [...Array(Q.length).keys()].filter(i=>!state.answers[i]);return [...Array(Q.length).keys()];}
function getStats(){const v=Object.values(state.answers),c=v.filter(x=>x.correct).length,w=v.filter(x=>!x.correct).length,a=c+w;return {c,w,a,r:a?Math.round(c/a*100):0};}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function updateStats(ord,pos){const s=getStats();document.getElementById("position").textContent=(ord.length?(pos+1):0)+"/"+ord.length;document.getElementById("correctCount").textContent=s.c;document.getElementById("wrongCount").textContent=s.w;document.getElementById("rate").textContent=s.r+"%";document.getElementById("bar").style.width=(s.a/Q.length*100)+"%";}
function showResult(card,rec){const f=card.querySelector("#feedback");f.className="feedback "+(rec.correct?"good":"bad");f.textContent=rec.correct?"○ 正解！":"× 不正解";card.querySelector("#explain").classList.add("show");}
function answer(qi,sel,card){if(mode!=="wrong"&&state.answers[qi])return;const q=Q[qi],ok=sel===q.answer;state.answers[qi]={selected:sel,correct:ok};saveState();[...card.querySelectorAll(".choice")].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===sel&&!ok)b.classList.add("wrong");});showResult(card,state.answers[qi]);updateStats(getOrder(),state.current);}
function render(){
  const ord=getOrder(),quiz=document.getElementById("quiz"),empty=document.getElementById("empty");
  quiz.innerHTML="";
  if(!ord.length){empty.style.display="block";updateStats(ord,0);return;}
  empty.style.display="none";state.current=Math.min(state.current,ord.length-1);if(state.current<0)state.current=0;
  const qi=ord[state.current],q=Q[qi],rec=(mode==='wrong'?null:state.answers[qi]);
  const card=document.createElement("section");card.className="card";
  card.innerHTML=`<div class="meta">問題 ${qi+1} / ${Q.length}</div><div class="q">${esc(q.q).replace(/\n/g,"<br>")}</div><div id="choices"></div><div id="feedback" class="feedback"></div><div id="explain" class="explain"><b>正解：${letters[q.answer]}. ${esc(q.correct)}</b><br><br>${esc(q.explanation)}</div><div class="card-actions"><button class="small" id="prevBtn">← 前へ</button><button class="small" id="showBtn">答え・解説を見る</button><button class="next" id="nextBtn">次の問題へ →</button></div>`;
  quiz.appendChild(card);
  const box=card.querySelector("#choices");
  q.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<b>${letters[i]}.</b> ${esc(c)}`;b.onclick=()=>answer(qi,i,card);if(rec){b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===rec.selected&&i!==q.answer)b.classList.add("wrong");}box.appendChild(b);});
  if(rec)showResult(card,rec);
  card.querySelector("#showBtn").onclick=()=>card.querySelector("#explain").classList.toggle("show");
  card.querySelector("#prevBtn").onclick=()=>{if(state.current>0){state.current--;saveState();render();window.scrollTo(0,0);}};
  card.querySelector("#nextBtn").onclick=()=>{if(state.current<ord.length-1){state.current++;saveState();render();window.scrollTo(0,0);}};
  updateStats(ord,state.current);
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;state.current=0;saveState();render();window.scrollTo(0,0);});
document.getElementById("resetBtn").onclick=()=>{if(confirm("回答記録をすべてリセットしますか？")){state.answers={};state.current=0;saveState();render();}};
document.getElementById("shuffleBtn").onclick=()=>{randomOrder=makeRandomOrder();if(mode==="random"){state.current=0;saveState();render();}};
const menu=document.getElementById("menuBody"),toggle=document.getElementById("toggleMenu");
function applyMenu(){menu.classList.toggle("hidden",state.menuHidden);toggle.textContent=state.menuHidden?"▼ メニューを表示":"▲ メニューを隠す";}
toggle.onclick=()=>{state.menuHidden=!state.menuHidden;saveState();applyMenu();};
applyMenu();render();
</script></body></html>
