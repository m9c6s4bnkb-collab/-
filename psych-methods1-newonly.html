<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心理学研究法Ⅰ 新規問題のみ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e8ef;padding:12px 16px}h1{font-size:18px;margin:0 0 8px}
.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap}.btn,button,select{border:1px solid #d8dde8;background:#fff;border-radius:10px;padding:9px 11px;font-size:14px}
.btn.active{background:#20242a;color:#fff}.wrap{max-width:780px;margin:auto;padding:16px}.stats{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 5px #0000000d}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 9px #0000000d}.num{font-size:12px;color:#7b8494;margin-bottom:8px}.q{font-weight:700;line-height:1.65;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid #dfe3eb;border-radius:12px;background:#fff}.opt.correct{background:#e9f8ee;border-color:#69b77d}.opt.wrong{background:#fff0f0;border-color:#e08b8b}
.answer{margin-top:12px;padding:12px;background:#f2f5fa;border-radius:10px;display:none;line-height:1.6}.answer.show{display:block}.shortinput{width:100%;font-size:16px;padding:12px;border:1px solid #d8dde8;border-radius:10px;margin-bottom:8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.good{color:#16733b}.bad{color:#b32929}.muted{color:#7b8494;font-size:13px}.empty{text-align:center;padding:40px;color:#7b8494}
</style></head><body>
<header><h1>心理学研究法Ⅰ｜4択・一問一答</h1><div class="tabs"><button id="tabM" class="btn active">4択</button><button id="tabS" class="btn">一問一答</button></div></header>
<div class="wrap"><div class="stats" id="stats"></div>
<div class="filters">
<select id="filter"><option value="all">すべて</option><option value="unanswered">未回答</option><option value="wrong">間違えた問題だけ</option><option value="w1">1回間違い</option><option value="w2">2回間違い</option><option value="w3">3回以上間違い</option></select>
<button id="shuffle">ランダム</button><button id="resetSession">今回の回答をリセット</button>
</div><div id="list"></div></div>
<script>
const MCQ=[{"id": "new_m1", "q": "尺度が複数項目で構成されていても測定精度を高めるために必要だと資料が強調する条件はどれか。", "a": "項目間で測定対象に一貫性があること", "opts": ["項目間で測定対象に一貫性があること", "回答段階を2件法にすること", "すべて逆転項目にすること", "項目数だけを増やすこと"], "cat": "尺度構成", "exp": "正解：項目間で測定対象に一貫性があること"}, {"id": "new_m2", "q": "質問項目を選定するときの基準として資料に含まれないものはどれか。", "a": "研究者が答えを予測しやすいか", "opts": ["回答形式に合う尋ね方か", "回答者が回答可能な内容か", "人によって違う解釈をされる言葉がないか", "研究者が答えを予測しやすいか"], "cat": "質問項目", "exp": "正解：研究者が答えを予測しやすいか"}, {"id": "new_m3", "q": "ダブル・バーレルの問題とは、質問項目作成上どのような問題か。", "a": "1つの項目で複数の内容を同時に尋ねてしまう問題", "opts": ["同じ尺度を2回実施する問題", "選択肢を2つだけにする問題", "回答者を2群に分ける問題", "1つの項目で複数の内容を同時に尋ねてしまう問題"], "cat": "質問項目", "exp": "正解：1つの項目で複数の内容を同時に尋ねてしまう問題"}, {"id": "new_m4", "q": "評定法がよく用いられる理由として資料に挙げられているものはどれか。", "a": "情報量が多く、分析しやすい", "opts": ["無回答が絶対に生じない", "必ず因果関係を証明できる", "情報量が多く、分析しやすい", "標本抽出が不要になる"], "cat": "質問紙", "exp": "正解：情報量が多く、分析しやすい"}, {"id": "new_m5", "q": "評定法の利点として資料にあるものはどれか。", "a": "他の回答形式から得られたデータへ容易に変換可能である", "opts": ["回答者数が不要になる", "信頼性が必ず1になる", "他の回答形式から得られたデータへ容易に変換可能である", "尺度水準が必ず比率尺度になる"], "cat": "質問紙", "exp": "正解：他の回答形式から得られたデータへ容易に変換可能である"}, {"id": "new_m6", "q": "人生満足度尺度の回答形式として資料に示されているのは何件法か。", "a": "7件法", "opts": ["5件法", "7件法", "4件法", "10件法"], "cat": "質問紙", "exp": "正解：7件法"}, {"id": "new_m7", "q": "単回帰分析で用いる基本的な回帰式として資料に示されるものはどれか。", "a": "y = bx + a", "opts": ["y = x² + a", "F = t/r", "r = x + y", "y = bx + a"], "cat": "回帰分析", "exp": "正解：y = bx + a"}, {"id": "new_m8", "q": "回帰分析における残差とは何か。", "a": "回帰式による予測値と実際の値との差", "opts": ["説明変数と目的変数の相関係数", "切片と傾きの積", "目的変数の平均値", "回帰式による予測値と実際の値との差"], "cat": "回帰分析", "exp": "正解：回帰式による予測値と実際の値との差"}, {"id": "new_m9", "q": "回帰直線を求める際、残差をそのまま足さず二乗する理由はどれか。", "a": "正負の残差が相殺されるのを防ぐため", "opts": ["正負の残差が相殺されるのを防ぐため", "切片を0にするため", "標本数を増やすため", "相関を必ず正にするため"], "cat": "回帰分析", "exp": "正解：正負の残差が相殺されるのを防ぐため"}, {"id": "new_m10", "q": "資料が示す回帰分析の目的の1つはどれか。", "a": "研究者が考えたモデルがどの程度データを説明するか評価すること", "opts": ["尺度項目を半分にすること", "参加者を無作為割り当てすること", "研究者が考えたモデルがどの程度データを説明するか評価すること", "変数を必ず正規分布にすること"], "cat": "回帰分析", "exp": "正解：研究者が考えたモデルがどの程度データを説明するか評価すること"}, {"id": "new_m11", "q": "資料が示す回帰分析のもう1つの主要目的はどれか。", "a": "個々の説明変数が目的変数の予測にどの程度役立つか知ること", "opts": ["実験順序を決めること", "質問紙の回答段階を決めること", "個々の説明変数が目的変数の予測にどの程度役立つか知ること", "標本平均を母平均と同一にすること"], "cat": "回帰分析", "exp": "正解：個々の説明変数が目的変数の予測にどの程度役立つか知ること"}, {"id": "new_m12", "q": "決定係数R²が表すものとして適切なのはどれか。", "a": "目的変数のばらつきのうちモデルが説明する割合", "opts": ["目的変数のばらつきのうちモデルが説明する割合", "参加者の脱落率", "尺度の逆転項目率", "説明変数の個数"], "cat": "回帰分析", "exp": "正解：目的変数のばらつきのうちモデルが説明する割合"}, {"id": "new_m13", "q": "決定係数R²が取り得る範囲として資料に示されているのはどれか。", "a": "0〜1", "opts": ["0〜1", "−∞〜∞", "−1〜1", "0〜100"], "cat": "回帰分析", "exp": "正解：0〜1"}, {"id": "new_m14", "q": "標準化回帰係数βを用いる主な理由として資料にあるものはどれか。", "a": "測定単位による回帰係数の大きさの違いを共通基準で比較するため", "opts": ["切片を必ず1にするため", "残差を0にするため", "標本数を統一するため", "測定単位による回帰係数の大きさの違いを共通基準で比較するため"], "cat": "回帰分析", "exp": "正解：測定単位による回帰係数の大きさの違いを共通基準で比較するため"}, {"id": "new_m15", "q": "標準化回帰係数βは資料では何に相当するものと説明されているか。", "a": "回帰分析における相関係数に相当する指標", "opts": ["回帰分析における相関係数に相当する指標", "尺度のα係数", "t検定の自由度", "分散分析のF値"], "cat": "回帰分析", "exp": "正解：回帰分析における相関係数に相当する指標"}, {"id": "new_m16", "q": "重回帰分析で多重共線性が問題になるのはどのような場合か。", "a": "説明変数間の関連が強すぎる場合", "opts": ["説明変数が2個以上あるだけの場合", "目的変数が量的変数の場合", "説明変数間の関連が強すぎる場合", "標本数が偶数の場合"], "cat": "重回帰分析", "exp": "正解：説明変数間の関連が強すぎる場合"}, {"id": "new_m17", "q": "多重共線性が生じた際に起こり得ることとして資料にあるものはどれか。", "a": "予想や常識と逆の符号が出るなど結果が不安定になる", "opts": ["必ずR²が1になる", "全てのp値が0になる", "標本数が自動的に減る", "予想や常識と逆の符号が出るなど結果が不安定になる"], "cat": "重回帰分析", "exp": "正解：予想や常識と逆の符号が出るなど結果が不安定になる"}, {"id": "new_m18", "q": "多重共線性を疑う相関の目安として資料に挙げられているのはどれか。", "a": "説明変数間でr=.80以上など", "opts": ["r=.30以上", "説明変数間でr=.80以上など", "r=.50以上なら必ず", "r=.10以上"], "cat": "重回帰分析", "exp": "正解：説明変数間でr=.80以上など"}, {"id": "new_m19", "q": "多重共線性が強い説明変数への対応として資料に挙げられているものはどれか。", "a": "いずれかを用いない、または合成得点を作る", "opts": ["目的変数に変更する", "いずれかを用いない、または合成得点を作る", "両方の得点を2倍する", "有意水準を.10にする"], "cat": "重回帰分析", "exp": "正解：いずれかを用いない、または合成得点を作る"}, {"id": "new_m20", "q": "近年の重回帰分析の報告について資料が推奨傾向として述べているのはどれか。", "a": "仮説モデルに沿った結果を、非有意な説明変数があってもそのまま報告する", "opts": ["非有意変数は必ず全て削除する", "R²は報告しない", "有意な変数だけ最初から測定する", "仮説モデルに沿った結果を、非有意な説明変数があってもそのまま報告する"], "cat": "重回帰分析", "exp": "正解：仮説モデルに沿った結果を、非有意な説明変数があってもそのまま報告する"}, {"id": "new_m21", "q": "回帰分析の残差分散に関する関係式として資料にあるものはどれか。", "a": "目的変数の分散＝説明分散＋残差分散", "opts": ["残差分散＝説明分散÷目的変数の分散", "説明分散＝目的変数の分散＋残差分散", "目的変数の分散＝説明分散＋残差分散", "目的変数の分散＝説明分散×残差分散"], "cat": "回帰分析", "exp": "正解：目的変数の分散＝説明分散＋残差分散"}, {"id": "new_m22", "q": "決定係数の説明率を分散で表した式として資料にあるものはどれか。", "a": "説明分散÷目的変数の分散", "opts": ["説明分散＋残差分散", "残差分散÷説明分散", "説明分散÷目的変数の分散", "目的変数の分散÷説明分散"], "cat": "回帰分析", "exp": "正解：説明分散÷目的変数の分散"}]; const SHORT=[{"id": "new_s1", "q": "1つの質問項目で複数の内容を同時に尋ねる問題を何という？", "a": "ダブル・バーレル", "cat": "質問項目"}, {"id": "new_s2", "q": "資料で心理調査によく用いられる回答方法は？", "a": "評定法", "cat": "質問紙"}, {"id": "new_s3", "q": "授業中課題では逆転項目を尺度全体の何割程度入れるとしている？", "a": "2〜3割程度", "cat": "質問紙"}, {"id": "new_s4", "q": "回帰式による予測値と実際の値との差を何という？", "a": "残差", "cat": "回帰分析"}, {"id": "new_s5", "q": "残差の二乗和を最小にする回帰直線の算出方法は？", "a": "最小二乗法", "cat": "回帰分析"}, {"id": "new_s6", "q": "目的変数の分散のうちモデルが説明する割合を表す指標は？", "a": "決定係数R²", "cat": "回帰分析"}, {"id": "new_s7", "q": "Cohenの目安でR²=.02の効果量は？", "a": "小", "cat": "回帰分析"}, {"id": "new_s8", "q": "Cohenの目安でR²=.13の効果量は？", "a": "中", "cat": "回帰分析"}, {"id": "new_s9", "q": "Cohenの目安でR²=.26の効果量は？", "a": "大", "cat": "回帰分析"}, {"id": "new_s10", "q": "測定単位に依存せず説明変数の影響力を比較する回帰係数は？", "a": "標準化回帰係数β", "cat": "回帰分析"}, {"id": "new_s11", "q": "説明変数同士の関連が強すぎて結果が不安定になる問題は？", "a": "多重共線性", "cat": "重回帰分析"}, {"id": "new_s12", "q": "資料で多重共線性を疑うVIFの目安は？", "a": "10より高い", "cat": "重回帰分析"}];
let mode='m', orderM=MCQ.map(x=>x.id), orderS=SHORT.map(x=>x.id);
const KEY='methods_newonly_20260829_v1'; let state=JSON.parse(localStorage.getItem(KEY)||'{}');
function rec(id){if(!state[id])state[id]={attempts:0,wrong:0,correct:0,last:null};return state[id]}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function selected(){let arr=mode==='m'?MCQ:SHORT, order=mode==='m'?orderM:orderS, f=document.getElementById('filter').value;
 arr=order.map(id=>arr.find(x=>x.id===id)).filter(Boolean);
 return arr.filter(x=>{let r=rec(x.id); if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='wrong')return r.wrong>0;if(f==='w1')return r.wrong===1;if(f==='w2')return r.wrong===2;if(f==='w3')return r.wrong>=3;});}
function stats(){let arr=mode==='m'?MCQ:SHORT, attempts=arr.reduce((s,x)=>s+rec(x.id).attempts,0), wrong=arr.filter(x=>rec(x.id).wrong>0).length, done=arr.filter(x=>rec(x.id).attempts>0).length;
 document.getElementById('stats').innerHTML=`<b>${mode==='m'?'4択':'一問一答'}：${arr.length}問</b>　回答済み ${done}/${arr.length}　｜　誤答履歴あり ${wrong}問<br><span class="muted">誤答回数は解き直しても保存されます。</span>`}
function norm(s){return s.trim().replace(/[ 　・（）()]/g,'').toLowerCase()}
function render(){stats();let list=document.getElementById('list'), arr=selected();list.innerHTML='';if(!arr.length){list.innerHTML='<div class="empty">該当する問題はありません。</div>';return}
 arr.forEach((x,idx)=>{let r=rec(x.id),c=document.createElement('div');c.className='card';
 let base=`<div class="num">問題 ${idx+1} / ${arr.length}　｜　誤答 ${r.wrong}回</div><div class="q">${x.q}</div>`;
 if(mode==='m'){let os=x.opts.map(o=>`<button class="opt" data-o="${encodeURIComponent(o)}">${o}</button>`).join('');c.innerHTML=base+os+`<div class="answer">${x.exp}</div>`;
 c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(c.dataset.done)return;c.dataset.done='1';let o=decodeURIComponent(b.dataset.o),ok=o===x.a;r.attempts++;r.last=ok;if(ok)r.correct++;else r.wrong++;save();b.classList.add(ok?'correct':'wrong');c.querySelectorAll('.opt').forEach(z=>{if(decodeURIComponent(z.dataset.o)===x.a)z.classList.add('correct')});c.querySelector('.answer').classList.add('show');stats()})}
 else{c.innerHTML=base+`<input class="shortinput" placeholder="答えを入力"><div class="controls"><button class="judge">答え合わせ</button><button class="showAns">答えを見る</button></div><div class="answer">正解：${x.a}</div>`;
 let inp=c.querySelector('input');c.querySelector('.judge').onclick=()=>{if(c.dataset.done)return;let ok=norm(inp.value)===norm(x.a)||norm(x.a).includes(norm(inp.value))&&norm(inp.value).length>=2;c.dataset.done='1';r.attempts++;r.last=ok;if(ok)r.correct++;else r.wrong++;save();c.querySelector('.answer').classList.add('show');inp.classList.add(ok?'good':'bad');stats()};
 c.querySelector('.showAns').onclick=()=>c.querySelector('.answer').classList.add('show')}
 list.appendChild(c)})}
document.getElementById('tabM').onclick=()=>{mode='m';tabM.classList.add('active');tabS.classList.remove('active');render()}
document.getElementById('tabS').onclick=()=>{mode='s';tabS.classList.add('active');tabM.classList.remove('active');render()}
document.getElementById('filter').onchange=render;
document.getElementById('shuffle').onclick=()=>{let o=mode==='m'?orderM:orderS;for(let i=o.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}render()}
document.getElementById('resetSession').onclick=()=>render();
render();
</script></body></html>
