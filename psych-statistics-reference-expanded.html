<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心理学統計 参考書①〜⑤｜作り直し版</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f2ed;--card:#fffefa;--ink:#20242a;--muted:#747980;--line:#d8d4cc;--accent:#334766;--soft:#eef1f5;--good:#eaf6ed;--bad:#fff0f0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
h1{font-size:2rem;margin:0 0 6px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.92rem;line-height:1.6}
.menuToggle{border:0;background:transparent;color:#51637f;font-weight:800;font-size:.9rem;cursor:pointer;padding:10px}
.panel{margin-top:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 14px}
.pill{border:1px solid #c8c5be;background:#fbfaf7;border-radius:999px;padding:11px 18px;font-weight:800;color:#334;cursor:pointer}
.pill.active{background:#5d7698;color:white;border-color:#5d7698}
.typePill.active{background:#2f3d50;border-color:#2f3d50}
.selectrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:5px 0 12px}
select{border:1px solid #cbc7be;background:#fff;border-radius:12px;padding:11px 12px;font-size:.95rem;min-width:250px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.stat{background:rgba(255,255,255,.62);border:1px solid #d5d0c7;border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat strong{font-size:2rem;font-weight:650}
.stat span{font-size:.82rem;color:#7d7d7d;margin-top:8px}
.progress{height:8px;border-radius:999px;background:#d9d5ce;overflow:hidden;margin:18px 10px 14px}
.progress>div{height:100%;width:0;background:#d8693a;transition:width .2s}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 24px}
.btn{border:1px solid #c9c5bc;background:#f8f7f3;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;color:#364b6a}
.btn.danger{color:#8a3a3a}
.card{background:rgba(255,255,255,.72);border:1px solid #d9d5cd;border-radius:20px;padding:28px 28px;margin-top:10px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.meta{font-size:.8rem;color:#777;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}
.q{font-size:1.16rem;font-weight:800;line-height:1.7;margin-bottom:8px}
.history{font-size:.78rem;color:#9a9a9a;margin:12px 0 16px}
.choices{display:grid;gap:10px}
.choice{border:1px solid #d7d3ca;background:#fff;border-radius:14px;padding:14px 15px;text-align:left;font-size:1rem;cursor:pointer;line-height:1.55}
.choice:hover{border-color:#98a7b9}
.choice.correct{background:var(--good);border-color:#64a873}
.choice.wrong{background:var(--bad);border-color:#d76b6b}
.feedback{margin-top:15px;padding:14px 16px;border-radius:14px;background:#f4f4f2;line-height:1.7}
.source{font-size:.8rem;color:#777;margin-top:5px}
.qaform{display:flex;gap:10px;flex-wrap:wrap}
.qaform input{flex:1;min-width:220px;border:1px solid #cfcac0;border-radius:12px;padding:13px 14px;font-size:1rem;background:white}
.nav{display:flex;gap:10px;margin-top:18px}
.hidden{display:none!important}
.empty{padding:40px 20px;text-align:center;color:#777}
@media(max-width:680px){
  .wrap{padding:20px 12px 45px} h1{font-size:1.5rem}
  .stats{grid-template-columns:repeat(2,1fr)} .stat{min-height:95px}
  .stat strong{font-size:1.55rem} .card{padding:20px 16px}
  .pill{padding:10px 14px;font-size:.9rem} select{min-width:100%;width:100%}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>心理学統計 参考書①〜⑤</h1>
      <div class="sub">参考書本文・確認問題・図表を読み直して作り直した版<br>4択／一問一答・何度でも解き直し・累積履歴・ミス回数別復習</div>
    </div>
    <button class="menuToggle" id="menuToggle">▲ メニューを隠す</button>
  </div>

  <section id="menu" class="panel">
    <div class="controls" id="typeControls">
      <button class="pill typePill active" data-type="mc">4択</button>
      <button class="pill typePill" data-type="qa">一問一答</button>
    </div>

    <div class="controls" id="modeControls">
      <button class="pill active" data-mode="all">通常</button>
      <button class="pill" data-mode="random">ランダム</button>
      <button class="pill" data-mode="unanswered">未回答だけ</button>
      <button class="pill" data-mode="wrongAny">間違えた問題</button>
      <button class="pill" data-mode="wrong1">1回間違えた</button>
      <button class="pill" data-mode="wrong2">2回間違えた</button>
      <button class="pill" data-mode="wrong3">3回以上間違えた</button>
    </div>

    <div class="selectrow">
      <select id="chapter">
        <option value="all">すべての章・分野</option>
        <option value="01 尺度水準">01 尺度水準</option>
<option value="02 心理学の研究法">02 心理学の研究法</option>
<option value="03 縦断研究と横断研究">03 縦断研究と横断研究</option>
<option value="04 信頼性">04 信頼性</option>
<option value="05 妥当性">05 妥当性</option>
<option value="06 度数分布表">06 度数分布表</option>
<option value="07 代表値">07 代表値</option>
<option value="08 標準偏差と正規分布">08 標準偏差と正規分布</option>
<option value="09 標準化と偏差値">09 標準化と偏差値</option>
<option value="10 相関係数">10 相関係数</option>
<option value="11 相関関係と因果関係">11 相関関係と因果関係</option>
<option value="12 内的妥当性">12 内的妥当性</option>
<option value="13 外的妥当性">13 外的妥当性</option>
<option value="14 統計的仮説検定">14 統計的仮説検定</option>
<option value="15 第1種・第2種の誤り">15 第1種・第2種の誤り</option>
<option value="16 t検定">16 t検定</option>
<option value="17 分散分析">17 分散分析</option>
<option value="18 要因計画法">18 要因計画法</option>
<option value="19 2要因分散分析">19 2要因分散分析</option>
<option value="20 因子分析">20 因子分析</option>
<option value="21 因子軸の回転">21 因子軸の回転</option>
<option value="22 回帰分析">22 回帰分析</option>
<option value="23 重回帰分析">23 重回帰分析</option>
<option value="24 カイ2乗検定">24 カイ2乗検定</option>
<option value="25 自由度">25 自由度</option>
<option value="26 点推定と区間推定">26 点推定と区間推定</option>
<option value="27 中心極限定理">27 中心極限定理</option>
<option value="28 さまざまな統計用語">28 さまざまな統計用語</option>
<option value="29 ランダム化比較試験">29 ランダム化比較試験</option>
<option value="30 倫理的配慮">30 倫理的配慮</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat"><strong id="position">0/0</strong><span>現在位置</span></div>
      <div class="stat"><strong id="correct">0</strong><span>累積正解</span></div>
      <div class="stat"><strong id="wrong">0</strong><span>累積不正解</span></div>
      <div class="stat"><strong id="rate">—</strong><span>正答率</span></div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="actions">
      <button class="btn danger" id="reset">記録をリセット</button>
      <button class="btn" id="reshuffle">ランダム順を作り直す</button>
    </div>
  </section>

  <section class="card" id="card">
    <div class="meta"><span id="counter"></span><span id="chap"></span><span id="kind"></span></div>
    <div class="q" id="question"></div>
    <div class="history" id="history"></div>
    <div id="body"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="nav">
      <button class="btn" id="prev">← 前へ</button>
      <button class="btn" id="next">次へ →</button>
    </div>
  </section>
  <div id="empty" class="empty hidden">この条件に当てはまる問題はありません。</div>
</main>

加者は、参加後でも不利益なく参加をやめられるという権利は？", "answers": ["研究参加を撤回する権利"], "exp": "正解：研究参加を撤回する権利"}, {"id": "mc0219", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究で欺瞞を用いた場合などに、終了後に真の目的を説明することは？", "choices": ["標準化", "スクリーニング", "デブリーフィング", "ランダム化"], "answer": 2, "exp": "正解：デブリーフィング"}, {"id": "qa0219", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究で欺瞞を用いた場合などに、終了後に真の目的を説明することは？", "answers": ["デブリーフィング"], "exp": "正解：デブリーフィング"}, {"id": "mc0220", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "個人が特定されないようデータを扱うことは？", "choices": ["標準化", "無作為化", "層化", "匿名化"], "answer": 3, "exp": "正解：匿名化"}, {"id": "qa0220", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "個人が特定されないようデータを扱うことは？", "answers": ["匿名化"], "exp": "正解：匿名化"}, {"id": "mc0221", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究倫理審査を行う組織は？", "choices": ["因子分析委員会", "統制群", "倫理審査委員会", "母集団"], "answer": 2, "exp": "正解：倫理審査委員会"}, {"id": "qa0221", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究倫理審査を行う組織は？", "answers": ["倫理審査委員会"], "exp": "正解：倫理審査委員会"}, {"id": "mc0222", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究参加は強制ではなく本人の意思に基づくべきである。この原則は？", "choices": ["強制参加", "完全統制", "外的妥当性", "自発的参加"], "answer": 3, "exp": "正解：自発的参加"}, {"id": "qa0222", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究参加は強制ではなく本人の意思に基づくべきである。この原則は？", "answers": ["自発的参加"], "exp": "正解：自発的参加"}, {"id": "mc0223", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究に伴う身体的・心理的負担をできる限り小さくする配慮は？", "choices": ["有意水準の最大化", "標本誤差の増加", "因子数の増加", "リスクの最小化"], "answer": 3, "exp": "正解：リスクの最小化"}, {"id": "qa0223", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "研究に伴う身体的・心理的負担をできる限り小さくする配慮は？", "answers": ["リスクの最小化"], "exp": "正解：リスクの最小化"}, {"id": "mc0224", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "論文やレポートで他者の文章・考えを利用するとき必要なのは？", "choices": ["多重比較", "無記名化", "無作為割付", "適切な引用"], "answer": 3, "exp": "正解：適切な引用"}, {"id": "qa0224", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "論文やレポートで他者の文章・考えを利用するとき必要なのは？", "answers": ["適切な引用"], "exp": "正解：適切な引用"}, {"id": "mc0225", "type": "mc", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "他者の文章を自分のもののように示す行為は？", "choices": ["剽窃", "査読", "引用", "匿名化"], "answer": 0, "exp": "正解：剽窃"}, {"id": "qa0225", "type": "qa", "chapter": "30 倫理的配慮", "source": "参考書④ p.190-193", "q": "他者の文章を自分のもののように示す行為は？", "answers": ["剽窃"], "exp": "正解：剽窃"}];
const KEY='psych_stats_reference_rebuilt_20260901_v1';

const $=id=>document.getElementById(id);
const norm=s=>String(s??'').normalize('NFKC').toLowerCase()
 .replace(/[\s　・･,，。．\.\-ー_()（）「」『』\[\]［］/]/g,'')
 .replace(/χ2/g,'χ²').replace(/r2/g,'r²');

function fresh(){return {}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state=fresh()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const rec=id=>state[id] || (state[id]={correct:0,wrong:0,attempts:0});

let type='mc', mode='all', chapter='all', pool=[], idx=0, locked=false;

function selectedIds(){
  let arr=BANK.map((q,i)=>i).filter(i=>BANK[i].type===type && (chapter==='all'||BANK[i].chapter===chapter));
  if(mode==='unanswered') arr=arr.filter(i=>rec(BANK[i].id).attempts===0);
  if(mode==='wrongAny') arr=arr.filter(i=>rec(BANK[i].id).wrong>0);
  if(mode==='wrong1') arr=arr.filter(i=>rec(BANK[i].id).wrong===1);
  if(mode==='wrong2') arr=arr.filter(i=>rec(BANK[i].id).wrong===2);
  if(mode==='wrong3') arr=arr.filter(i=>rec(BANK[i].id).wrong>=3);
  if(mode==='random'){
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  }
  return arr;
}
function rebuild(){pool=selectedIds();idx=0;render();}
function totals(){
 let qs=BANK.filter(q=>q.type===type);
 let c=0,w=0;
 qs.forEach(q=>{let r=rec(q.id);c+=r.correct;w+=r.wrong});
 return {c,w};
}
function stats(){
 const t=totals(), attempts=t.c+t.w;
 $('correct').textContent=t.c;
 $('wrong').textContent=t.w;
 $('rate').textContent=attempts?Math.round(t.c/attempts*100)+'%':'—';
 $('position').textContent=pool.length?(idx+1)+'/'+pool.length:'0/0';
 $('bar').style.width=pool.length?((idx+1)/pool.length*100)+'%':'0%';
}
function render(){
 stats();
 if(!pool.length){$('card').classList.add('hidden');$('empty').classList.remove('hidden');return}
 $('card').classList.remove('hidden');$('empty').classList.add('hidden');
 if(idx<0)idx=0;if(idx>=pool.length)idx=pool.length-1;
 const q=BANK[pool[idx]], r=rec(q.id);locked=false;
 $('counter').textContent='問題 '+(idx+1)+' / '+pool.length;
 $('chap').textContent=q.chapter;
 $('kind').textContent=q.type==='mc'?'4択':'一問一答';
 $('question').textContent=q.q;
 $('history').textContent=`この問題の履歴：○ ${r.correct}回 ／ × ${r.wrong}回 ／ 挑戦 ${r.attempts}回`;
 $('feedback').classList.add('hidden');$('feedback').innerHTML='';
 const body=$('body');body.innerHTML='';
 if(q.type==='mc'){
   const wrap=document.createElement('div');wrap.className='choices';
   q.choices.forEach((c,j)=>{
     const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+c;
     b.onclick=()=>answerMC(q,j,b,wrap);wrap.appendChild(b);
   });
   body.appendChild(wrap);
 } else {
   const form=document.createElement('form');form.className='qaform';
   const input=document.createElement('input');input.placeholder='答えを入力';input.autocomplete='off';
   const btn=document.createElement('button');btn.className='btn';btn.type='submit';btn.textContent='回答する';
   form.append(input,btn);form.onsubmit=e=>{e.preventDefault();answerQA(q,input.value,input,btn)};
   body.appendChild(form);setTimeout(()=>input.focus(),0);
 }
}
function showFeedback(ok,q,answerText){
 const f=$('feedback');f.classList.remove('hidden');
 f.innerHTML=(ok?'<b>○ 正解！</b>':'<b>× 不正解</b>　正解：<b>'+answerText+'</b>')
   +'<div style="margin-top:7px">'+q.exp+'</div>'
   +'<div class="source">出典：'+q.source+'</div>';
 stats();$('history').textContent=`この問題の履歴：○ ${rec(q.id).correct}回 ／ × ${rec(q.id).wrong}回 ／ 挑戦 ${rec(q.id).attempts}回`;
}
function answerMC(q,j,btn,wrap){
 if(locked)return;locked=true;let r=rec(q.id);r.attempts++;
 const ok=j===q.answer;if(ok)r.correct++;else r.wrong++;save();
 [...wrap.children].forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('correct');});
 if(!ok)btn.classList.add('wrong');showFeedback(ok,q,q.choices[q.answer]);
}
function answerQA(q,val,input,btn){
 if(locked||!val.trim())return;locked=true;let r=rec(q.id);r.attempts++;
 const ok=q.answers.some(a=>norm(a)===norm(val));if(ok)r.correct++;else r.wrong++;save();
 input.disabled=true;btn.disabled=true;showFeedback(ok,q,q.answers[0]);
}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
 type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));rebuild();
});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
 mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));rebuild();
});
$('chapter').onchange=e=>{chapter=e.target.value;rebuild()};
$('next').onclick=()=>{if(pool.length){idx=(idx+1)%pool.length;render()}};
$('prev').onclick=()=>{if(pool.length){idx=(idx-1+pool.length)%pool.length;render()}};
$('reshuffle').onclick=()=>{mode='random';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='random'));rebuild()};
$('reset').onclick=()=>{if(confirm('この問題集の学習記録をすべてリセットしますか？')){state=fresh();save();rebuild()}};
$('menuToggle').onclick=()=>{const m=$('menu');m.classList.toggle('hidden');$('menuToggle').textContent=m.classList.contains('hidden')?'▼ メニューを表示':'▲ メニューを隠す'};

rebuild();
</script>
</body></html>
