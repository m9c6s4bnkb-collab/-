const KEY="shogai4choice1000_unique_v1";
let st={mode:"normal",order:[...Array(Q.length).keys()],pos:0,results:{}};
const $=id=>document.getElementById(id);

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.results)st.results=x.results}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify({results:st.results}))}
function wrongIdx(){return Object.keys(st.results).filter(k=>st.results[k]==="wrong").map(Number)}
function unansweredIdx(){return [...Array(Q.length).keys()].filter(i=>!st.results[i])}

function setMode(m){
 st.mode=m;
 ["normal","random","wrongOnly","unanswered"].forEach(id=>$(id).classList.remove("active"));
 if(m==="normal"){st.order=[...Array(Q.length).keys()];$("normal").classList.add("active")}
 else if(m==="random"){st.order=[...Array(Q.length).keys()];for(let i=st.order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[st.order[i],st.order[j]]=[st.order[j],st.order[i]]}$("random").classList.add("active")}
 else if(m==="wrong"){const w=wrongIdx();if(!w.length){alert("まだ間違えた問題がありません");return setMode("normal")}st.order=w;$("wrongOnly").classList.add("active")}
 else if(m==="unanswered"){const u=unansweredIdx();if(!u.length){alert("未回答問題はありません");return setMode("normal")}st.order=u;$("unanswered").classList.add("active")}
 st.pos=0;render();
}

function stats(){
 const vals=Object.values(st.results),c=vals.filter(v=>v==="correct").length,w=vals.filter(v=>v==="wrong").length,total=c+w;
 $("correct").textContent=c;$("wrong").textContent=w;$("rate").textContent=total?Math.round(c/total*100)+"%":"0%";
 $("pos").textContent=(st.pos+1)+"/"+st.order.length;
 $("bar").style.width=(total/Q.length*100)+"%";
}

function render(){
 if(!st.order.length)return setMode("normal");
 const idx=st.order[st.pos],x=Q[idx];
 $("qno").textContent="問題 "+(idx+1)+" / 1000";
 $("status").textContent=st.results[idx]==="correct"?"○ 正解済み":st.results[idx]==="wrong"?"× 要復習":"未回答";
 $("question").textContent=x.q;
 const box=$("choices");box.innerHTML="";
 x.choices.forEach((ch,i)=>{
   const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+ch;
   b.onclick=()=>answer(i);box.appendChild(b);
 });
 $("feedback").className="feedback";$("feedback").textContent="";
 $("explain").className="explain";$("explain").textContent="";
 $("next").className="next";stats();
}

function answer(i){
 const idx=st.order[st.pos],x=Q[idx],buttons=[...document.querySelectorAll(".choice")];
 buttons.forEach(b=>b.disabled=true);buttons[x.answer].classList.add("correct");
 const ok=i===x.answer;if(!ok)buttons[i].classList.add("wrong");
 st.results[idx]=ok?"correct":"wrong";save();
 const f=$("feedback");f.className="feedback show "+(ok?"ok":"ng");f.textContent=ok?"○ 正解！":"× 不正解　正解："+x.correct;
 const e=$("explain");e.className="explain show";e.textContent="解説："+x.explanation;
 $("next").className="next show";stats();
}

function next(){
 if(st.mode==="wrong"){const w=wrongIdx();if(!w.length){alert("間違い問題を全部クリアしました！");return setMode("normal")}st.order=w;st.pos=st.pos>=st.order.length-1?0:st.pos+1}
 else if(st.mode==="unanswered"){const u=unansweredIdx();if(!u.length){alert("1000問すべて回答しました！");return setMode("normal")}st.order=u;st.pos=0}
 else st.pos=(st.pos+1)%st.order.length;
 render();
}
function prev(){st.pos=(st.pos-1+st.order.length)%st.order.length;render()}

$("normal").onclick=()=>setMode("normal");
$("random").onclick=()=>setMode("random");
$("wrongOnly").onclick=()=>setMode("wrong");
