<body><main class="wrap">

<section class="card" id="intro"><h1>心理学統計 参考書問題集【増量版】</h1>
<div class="sub">統計参考書①〜⑤をもとに、本文・確認問題・応用的な使い分け・表問題・英語→日本語をまとめた問題集です。4択と一問一答を切り替えられます。</div>

<script>
const QUESTIONS=[{"id": "q0001", "chapter": "01 尺度水準", "type": "mc", "q": "血液型（A・B・O・AB型）はどの尺度水準か。", "choices": ["名義尺度", "順序尺度", "間隔尺度", "比率尺度"], "answer": 0, "exp": "大小関係をもたず、分類のみを表す。", "tag": "本文"}, {"id": "q0002", "chapter": "01 尺度水準", "type": "mc", "q": "徒競走の順位（1位・2位・3位）はどの尺度水準か。", "choices": ["名義尺度", "順序尺度", "間隔尺度", "比率尺度"], "answer": 1, "exp": "大小・順序はあるが、順位間の差が等しいとは限らない。", "tag": "本文"}, {"id": "q0003", "chapter": "01 尺度水準", "type": "mc", "q": "摂氏温度はどの尺度水準か。", "choices": ["名義尺度", "順序尺度", "間隔尺度", "比率尺度"], "answer": 2, "exp": "差には意味があるが、0℃は「温度が存在しない」ことを意味しない。", "tag": "本文"}, {"id": "q0004", "chapter": "01 尺度水準", "type": "mc", "q": "身長はどの尺度水準か。", "choices": ["名義尺度", "順序尺度", "間隔尺度", "比率尺度"], "answer": 3, "exp": "絶対原点があり、比にも意味がある。", "tag": "本文"}, {"id": "q0005", "chapter": "01 尺度水準", "type": "qa", "q": "大小関係をもたず、純粋な分類のみを表す尺度を何というか。", "answers": ["名義尺度"], "exp": "", "tag": "本文"}, {"id": "q0006", "chapter": "01 尺度水準", "type": "qa", "q": "大小関係はあるが、隣り合う値の間隔が等しいとは限らない尺度を何というか。", "answers": ["順序尺度"], "exp": "", "tag": "本文"}, {"id": "q0007", "chapter": "01 尺度水準", "type": "qa", "q": "値の間隔が等しいが、絶対原点をもたない尺度を何というか。", "answers": ["間隔尺度"], "exp": "", "tag": "本文"}, {"id": "q0008", "chapter": "01 尺度水準", "type": "qa", "q": "絶対原点をもち、値の比にも意味がある尺度を何というか。", "answers": ["比率尺度"], "exp": "", "tag": "本文"}, {"id": "q0009", "chapter": "01 尺度水準", "type": "mc", "q": "次のうち、絶対原点をもつものはどれか。", "choices": ["摂氏温度", "テスト順位", "身長", "血液型"], "answer": 2, "exp": "", "tag": "本文"}, {"id": "q0010", "chapter": "01 尺度水準", "type": "mc", "q": "「60kgは30kgの2倍」といえるのは、体重がどの尺度だからか。", "choices": ["名義尺度", "順序尺度", "間隔尺度", "比率尺度"], "answer": 3, "exp": "", "tag": "本文"}, {"id": "q0011", "chapter": "01 尺度水準", "type": "mc", "q": "「20℃は10℃の2倍の温かさ」と単純にはいえない主な理由はどれか。", "choices": ["順位がないから", "絶対原点がないから", "分類できないから", "測定できないから"], "answer": 1, "exp": "", "tag": "本文"}, {"id": "q0012", "chapter": "02 心理学の研究法", "type": "qa", "q": "独立変数を操作し、その影響を従属変数で検討する方法を何というか。", "answers": ["実験法"], "exp": "", "tag": "本文"}, {"id": "q0013", "chapter": "02 心理学の研究法", "type": "qa", "q": "対象の行動を観察して記録する方法を何というか。", "answers": ["観察法"], "exp": "", "tag": "本文"}, {"id": "q0014", "chapter": "02 心理学の研究法", "type": "qa", "q": "調査対象者と対面し、口頭で質問して情報を得る方法を何というか。", "answers": ["面接法"], "exp": "", "tag": "本文"}, {"id": "q0015", "chapter": "02 心理学の研究法", "type": "qa", "q": "質問項目への回答を通して情報を得る方法を何というか。", "answers": ["質問紙法"], "exp": "", "tag": "本文"}, {"id": "q0016", "chapter": "02 心理学の研究法", "type": "mc", "q": "因果関係を最も直接的に検討しやすい研究法はどれか。", "choices": ["観察法", "実験法", "面接法", "質問紙法"], "answer": 1, "exp": "", "tag": "本文"}, {"id": "q0017", "chapter": "02 心理学の研究法", "type": "mc", "q": "実験法で研究者が操作する変数はどれか。", "choices": ["従属変数", "独立変数", "剰余変数", "外的基準"], "answer": 1, "exp": "", "tag": "本文"}, {"id": "q0018", "chapter": "02 心理学の研究法", "type": "mc", "q": "実験法で、独立変数の操作による影響を測定する変数はどれか。", "choices": ["従属変数", "独立変数", "統制群", "母集団"], "answer": 0, "exp": "", "tag": "本文"}, {"id": "q0019", "chapter": "02 心理学の研究法", "type": "qa", "q": "独立変数以外で従属変数に影響する可能性がある変数を何というか。", "answers": ["剰余変数", "外在変数"], "exp": "", "tag": "本文"}, {"id": "q0020", "chapter": "02 心理学の研究法", "type": "mc", "q": "研究者が対象に積極的な働きかけをせず、自然な行動を記録する方法に最も近いものはどれか。", "choices": ["実験法", "観察法", "質問紙法", "面接法"], "answer": 1, "exp": "", "tag": "本文"}, {"id": "q0021", "chapter": "03 縦断研究と横断研究", "type": "qa", "q": "同一の個人を長期にわたって追跡し、発達的変化を検討する研究を何というか。", "answers": ["縦断研究"], "exp": "", "tag": "本文"}, {"id": "q0022", "chapter": "03 縦断研究と横断研究", "type": "qa", "q": "異なる年齢集団を同一時点で比較する研究を何というか。", "answers": ["横断研究"], "exp": "", "tag": "本文"}, {"id": "q0023", "chapter": "03 縦断研究と横断研究", "type": "qa", "q": "同じ時期に生まれた集団など、共通の特徴をもつ集団を追跡する研究を何というか。", "answers": ["コホート研究"], "exp": "", "tag": "本文"}, {"id": "q0024", "chapter": "03 縦断研究と横断研究", "type": "mc", "q": "6歳児を2021年から毎年測定し、12歳まで追跡した。この研究はどれか。", "choices": ["横断研究", "縦断研究", "事例研究", "無作為化比較試験"], "answer": 1, "exp": "", "tag": "本文"}, {"id": "q0025", "chapter": "03 縦断研究と横断研究", "type": "mc", "q": "2026年に6歳・12歳・18歳をそれぞれ測定して比較した。この研究はどれか。", "choices": ["横断研究", "縦断研究", "コホート研究", const KEY='psychStatsReference_expanded_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'{}'), current=null, seq=-1;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state)); updateStats();}
function rec(id){return state[id]||{attempts:0,correct:0,wrong:0,last:false}}
function chapters(){return [...new Set(QUESTIONS.map(q=>q.chapter))]}
chapters().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('chapter').appendChild(o)})
function filtered(){
 let a=QUESTIONS.filter(q=>($('type').value==='all'||q.type===$('type').value)&&($('chapter').value==='all'||q.chapter===$('chapter').value));
 const s=$('scope').value;
 if(s==='unanswered') a=a.filter(q=>rec(q.id).attempts===0);
 if(s==='wrong') a=a.filter(q=>rec(q.id).wrong>0);
 if(s==='wrong1') a=a.filter(q=>rec(q.id).wrong>=1);
 if(s==='wrong2') a=a.filter(q=>rec(q.id).wrong>=2);
 return a;
}
function updateStats(){
 const rs=Object.values(state); const attempts=rs.reduce((s,r)=>s+r.attempts,0), cor=rs.reduce((s,r)=>s+r.correct,0), wr=rs.reduce((s,r)=>s+r.wrong,0);
 $('answered').textContent=Object.keys(state).length; $('correct').textContent=cor; $('rate').textContent=attempts?Math.round(cor/attempts*100)+'%':'0%'; $('misses').textContent=wr; $('pool').textContent=filtered().length;
 $('count').textContent=`全 ${QUESTIONS.length} 問（4択 ${QUESTIONS.filter(q=>q.type==='mc').length}問／一問一答 ${QUESTIONS.filter(q=>q.type==='qa').length}問）`;
}
function show(q){
 current=q; $('chap').textContent=q.chapter; $('kind').textContent=q.type==='mc'?'4択':'一問一答'; $('tag').textContent=q.tag||'本文'; $('miss').textContent='誤答 '+rec(q.id).wrong+'回';
 $('question').innerHTML=q.q; $('feedback').classList.add('hidden'); $('feedback').innerHTML=''; const b=$('body'); b.innerHTML='';
 if(q.type==='mc'){let d=document.createElement('div');d.className='choices';q.choices.forEach((c,i)=>{let bt=document.createElement('button');bt.className='choice';bt.innerHTML=(i+1)+'. '+c;bt.onclick=()=>answerMC(i,bt,d);d.appendChild(bt)});b.appendChild(d)}
 else{let inp=document.createElement('input');inp.placeholder='答えを入力';inp.id='qaInput';inp.addEventListener('keydown',e=>{if(e.key==='Enter')answerQA()});b.appendChild(inp);let ac=document.createElement('div');ac.className='actions';let bt=document.createElement('button');bt.className='primary';bt.textContent='回答する';bt.onclick=answerQA;ac.appendChild(bt);b.appendChild(ac);setTimeout(()=>inp.focus(),50)}
}
function norm(s){return String(s).toLowerCase().replace(/[\s　・･,，。．()（）]/g,'').replace(/χ²/g,'χ2')}
function record(ok){let r=rec(current.id);r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=ok;state[current.id]=r;save();$('miss').textContent='誤答 '+r.wrong+'回'}
function answerMC(i,bt,box){if(box.dataset.done)return;box.dataset.done=1;const ok=i===current.answer;[...box.children].forEach((x,j)=>{x.disabled=true;if(j===current.answer)x.classList.add('correct')});if(!ok)bt.classList.add('wrong');record(ok);$('feedback').innerHTML=(ok?'正解！':'不正解')+(current.exp?'<br>'+current.exp:'');$('feedback').classList.remove('hidden')}
function answerQA(){let inp=$('qaInput');if(!inp||inp.disabled)return;let ans=current.answers||[];let ok=ans.some(a=>norm(inp.value)===norm(a));inp.disabled=true;record(ok);$('feedback').innerHTML=(ok?'正解！':'不正解')+'<br><b>正答：</b>'+ans.join('／')+(current.exp?'<br>'+current.exp:'');$('feedback').classList.remove('hidden')}
function next(rand=false){let a=filtered();if(!a.length){alert('この条件の出題候補がありません。');return}if(rand) current=a[Math.floor(Math.random()*a.length)]; else {seq=(seq+1)%a.length;current=a[seq]}show(current)}
$('next').onclick=()=>next(false);$('random').onclick=()=>next(true);
['type','scope','chapter'].forEach(id=>$(id).onchange=updateStats);
$('reset').onclick=()=>{if(confirm('正答・誤答回数を含む学習データをすべて削除しますか？')){state={};save();}};
$('menuToggle').onclick=()=>{let hidden=$('menu').style.display==='none';['intro','menu','stats'].forEach(id=>$(id).style.display=hidden?'':'none');$('menuToggle').textContent=hidden?'メニューを非表示':'メニューを表示'};
updateStats();
</script></body></html>
