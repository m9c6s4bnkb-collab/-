<script>const DATA={"mc":[{"q":"研究者が意図的に操作・設定する変数を何というか。","options":["剰余変数","標準変数","独立変数","従属変数"],"answer":2,"explanation":"独立変数は研究者が意図的に操作・設定する変数で、要因・説明変数とも呼ばれる。","source":"心理学統計法 授業資料"},{"q":"独立変数の変化に伴って生じる結果の変数を何というか。","options":["母数","水準","従属変数","独立変数"],"answer":2,"explanation":"従属変数は独立変数の影響を受けて変化する結果側の変数である。","source":"心理学統計法 授業資料"},{"q":"独立変数の条件の数を何というか。","options":["水準","標本","偏差","自由度"],"answer":0,"explanation":"独立変数の条件の数は水準と呼ばれる。","source":"心理学統計法 授業資料"},{"q":"「音声刺激の違いが反応時間に与える影響」で独立変数にあたるものはどれか。","options":["反応時間","参加者数","音声刺激","平均反応時間"],"answer":2,"explanation":"操作する側の音声刺激が独立変数である。","source":"心理学統計法 授業資料"},{"q":"「音声刺激の違いが反応時間に与える影響」で従属変数にあたるものはどれか。","options":["参加者の割り当て","反応時間","刺激条件数","音声刺激"],"answer":1,"explanation":"測定される結果である反応時間が従属変数である。","source":"心理学統計法 授業資料"},{"q":"対象を区別するためのカテゴリー分類を目的とし、数字の大小に意味がない尺度はどれか。","options":["名義尺度","順序尺度","間隔尺度","比率尺度"],"answer":0,"explanation":"名義尺度では数値はカテゴリーを区別する記号として機能し、大小や序列に意味はない。","source":"心理学統計法 授業資料"},{"q":"順位のように大小関係には意味があるが、数値間の間隔が等しいとは限らない尺度はどれか。","options":["間隔尺度","名義尺度","比率尺度","順序尺度"],"answer":3,"explanation":"順序尺度は順序のみが明らかで、間隔は必ずしも等しくない。","source":"心理学統計法 授業資料"},{"q":"数値間の間隔は一定だが、0が「存在しない」ことを意味しない尺度はどれか。","options":["間隔尺度","比率尺度","順序尺度","名義尺度"],"answer":0,"explanation":"間隔尺度は等間隔だが絶対的原点を持たない。","source":"心理学統計法 授業資料"},{"q":"絶対的原点としての0を持つ尺度はどれか。","options":["名義尺度","間隔尺度","比率尺度","順序尺度"],"answer":2,"explanation":"比率尺度は等間隔で、絶対的原点0を持つ。","source":"心理学統計法 授業資料"},{"q":"次のうち名義尺度の例として資料に挙げられているものはどれか。","options":["長さ","重さ","血液型","徒競走の順位"],"answer":2,"explanation":"血液型は名義尺度の例である。","source":"心理学統計法 授業資料"},{"q":"次のうち順序尺度の例として資料に挙げられているものはどれか。","options":["長さ","徒競走の順位","重さ","国籍"],"answer":1,"explanation":"徒競走の順位は順序尺度の例である。","source":"心理学統計法 授業資料"},{"q":"次のうち比率尺度の例として資料に挙げられているものはどれか。","options":["血液型","国籍","重さ","成績"],"answer":2,"explanation":"重さや長さなどの物理的数値は比率尺度に該当する。","source":"心理学統計法 授業資料"},{"q":"平均値について正しいものはどれか。","options":["最も頻度の高い値を表す","すべての値を反映するため外れ値の影響を受けやすい","外れ値の影響をほとんど受けない","名義尺度でも算出できる"],"answer":1,"explanation":"平均値は全観測値を用いるため外れ値の影響を受けやすい。","source":"心理学統計法 授業資料"},{"q":"中央値について正しいものはどれか。","options":["外れ値の影響を受けにくい","名義尺度でのみ使用できる","最も頻度の高い値である","必ず平均値と一致する"],"answer":0,"explanation":"中央値は中央の値を用いるため外れ値の影響を受けにくい。","source":"心理学統計法 授業資料"},{"q":"データ数が偶数のとき、中央値はどのように求めるか。","options":["中央の2値を足して2で割る","最も頻度の高い値を選ぶ","全値を足して標本数で割る","最大値と最小値の差をとる"],"answer":0,"explanation":"偶数個の場合は中央の2値の平均をとる。","source":"心理学統計法 授業資料"},{"q":"最頻値とは何か。","options":["最も頻度の高い観測値","小さい順に並べた中央の値","観測値の総和をnで割った値","最大値と最小値の平均"],"answer":0,"explanation":"最頻値は最も多く出現する観測値である。","source":"心理学統計法 授業資料"},{"q":"名義変数でも求めることができる代表値はどれか。","options":["平均値","最頻値","分散","標準偏差"],"answer":1,"explanation":"最頻値は名義変数でも求めることができる。","source":"心理学統計法 授業資料"},{"q":"得られたデータを整理・要約し、その特徴や傾向を記述する統計はどれか。","options":["推測統計","回帰分析","記述統計","偏相関分析"],"answer":2,"explanation":"記述統計は手元のデータを整理・要約する。","source":"心理学統計法 授業資料"},{"q":"標本から母集団全体の特徴や傾向を推測する統計はどれか。","options":["推測統計","記述統計","質的研究","単純集計"],"answer":0,"explanation":"推測統計は標本から母集団について推測する。","source":"心理学統計法 授業資料"},{"q":"調査対象となる集団全体を何というか。","options":["水準","標本","変数","母集団"],"answer":3,"explanation":"集団全体が母集団である。","source":"心理学統計法 授業資料"},{"q":"母集団から選ばれた調査対象者を何というか。","options":["偏差","母数","標本（サンプル）","水準"],"answer":2,"explanation":"母集団から選ばれた対象者は標本またはサンプルと呼ばれる。","source":"心理学統計法 授業資料"},{"q":"個々の標本の値から平均値を引いたものを何というか。","options":["偏差","分散","標準誤差","共分散"],"answer":0,"explanation":"観測値−平均値が偏差である。","source":"心理学統計法 授業資料"},{"q":"分散は何の平均値か。","options":["標準偏差","偏差","z得点","偏差の2乗"],"answer":3,"explanation":"分散は偏差の2乗の平均値である。","source":"心理学統計法 授業資料"},{"q":"偏差をそのまま合計して散布度にできない主な理由はどれか。","options":["単位がなくなるため","正負が打ち消し合い合計が0になるため","標本数に依存しないため","必ず1になるため"],"answer":1,"explanation":"偏差には正負があり、合計すると0になる。","source":"心理学統計法 授業資料"},{"q":"標準偏差はどのように求めるか。","options":["偏差を標本数で割る","分散の正の平方根をとる","分散を2乗する","平均値の平方根をとる"],"answer":1,"explanation":"分散の正の平方根が標準偏差である。","source":"心理学統計法 授業資料"},{"q":"標準偏差を用いる利点として資料に示されているものはどれか。","options":["必ず0から1の範囲になる","単位が元のデータと同じになる","母平均が直接求められる","外れ値を除外できる"],"answer":1,"explanation":"分散は単位が2乗されるが、平方根をとる標準偏差では元の単位に戻る。","source":"心理学統計法 授業資料"},{"q":"正規分布の形として正しいものはどれか。","options":["平均値を中心に左右対称の釣鐘型","右側だけに長い裾を持つ形","すべての値が同頻度の長方形","必ず二つの山を持つ形"],"answer":0,"explanation":"正規分布は平均値を中心とする左右対称の釣鐘型である。","source":"心理学統計法 授業資料"},{"q":"正規分布で一致する代表値の組み合わせはどれか。","options":["平均値・標準偏差・中央値","中央値・分散・最頻値","平均値・最大値・最小値","平均値・中央値・最頻値"],"answer":3,"explanation":"正規分布では平均値・中央値・最頻値が一致する。","source":"心理学統計法 授業資料"},{"q":"標準偏差が大きくなると正規分布の形はどうなるか。","options":["山が高くなり狭くなる","必ず右に歪む","山が低くなり左右に広がる","形は変化しない"],"answer":2,"explanation":"標準偏差が大きいほど分布は広がり、山は低くなる。","source":"心理学統計法 授業資料"},{"q":"正規分布では平均値±1標準偏差の範囲に約何％が含まれるか。","options":["68%","50%","95%","99%"],"answer":0,"explanation":"資料では約68%とされている。","source":"心理学統計法 授業資料"},{"q":"正規分布では平均値±2標準偏差の範囲に約何％が含まれるか。","options":["95%","68%","75%","100%"],"answer":0,"explanation":"資料では約95%とされている。","source":"心理学統計法 授業資料"},{"q":"分布の非対称性の程度を示す指標はどれか。","options":["標準誤差","分散","尖度","歪度"],"answer":3,"explanation":"歪度は左右対称性からのずれを表す。","source":"心理学統計法 授業資料"},{"q":"歪度の絶対値が大きいほど何を意味するか。","options":["分布の非対称性が大きい","分布が正規分布に近い","平均値が大きい","標本数が多い"],"answer":0,"explanation":"歪度の絶対値が大きいほど非対称である。","source":"心理学統計法 授業資料"},{"q":"資料において尖度が示すものはどれか。","options":["標本平均の散らばり","分布の平均値","分布の左右の裾の長さの度合い","2変数の関連の方向"],"answer":2,"explanation":"資料では尖度を分布の左右の裾の長さの度合いを示す指標としている。","source":"心理学統計法 授業資料"},{"q":"資料の定義では正規分布の歪度と尖度はいくつか。","options":["歪度0・尖度3","歪度1・尖度0","歪度0・尖度1","歪度3・尖度0"],"answer":0,"explanation":"資料では正規分布の歪度は0、尖度は3とされている。","source":"心理学統計法 授業資料"},{"q":"ローデータを集団内の相対的位置が分かるよう変換する手続きを何というか。","options":["一般化","統制","標準化","無作為化"],"answer":2,"explanation":"この変換手続きを標準化という。","source":"心理学統計法 授業資料"},{"q":"z得点の計算として正しいものはどれか。","options":["偏差を2乗する","偏差を標準偏差で割る","平均値を分散で割る","標準偏差を偏差で割る"],"answer":1,"explanation":"z得点=(個々の値−平均値)/標準偏差である。","source":"心理学統計法 授業資料"},{"q":"一般にデータをz得点へ変換したときの平均値と標準偏差はどれか。","options":["平均0・標準偏差0","平均1・標準偏差0","平均1・標準偏差1","平均0・標準偏差1"],"answer":3,"explanation":"z得点では平均0、標準偏差1になる。","source":"心理学統計法 授業資料"},{"q":"平均0、標準偏差1に調整された特別な正規分布を何というか。","options":["標本分布","度数分布","二項分布","標準正規分布"],"answer":3,"explanation":"標準化された正規分布を標準正規分布という。","source":"心理学統計法 授業資料"},{"q":"標準誤差が表すものとして最も適切なのはどれか。","options":["標本平均値の散らばり具合","個々の観測値の散らばり具合","2変数の連動性","分布の非対称性"],"answer":0,"explanation":"標準誤差は複数の標本から得られる標本平均値の散らばりを表す。","source":"心理学統計法 授業資料"},{"q":"標準誤差が小さい場合、資料ではどのように解釈されるか。","options":["帰無仮説が必ず棄却される","相関が強い","個々のデータのばらつきが必ず大きい","標本からの推測精度が高い"],"answer":3,"explanation":"標準誤差が小さいほど母平均の推測精度が高い。","source":"心理学統計法 授業資料"},{"q":"2つの量的変数を縦軸・横軸にとり、測定値を点で表した図はどれか。","options":["散布図","ヒストグラム","箱ひげ図","円グラフ"],"answer":0,"explanation":"散布図は2つの量的変数の対応する値をプロットする。","source":"心理学統計法 授業資料"},{"q":"散布図のプロットが右上がりの場合、どのような関係を示すか。","options":["負の相関","無相関","正の相関","因果関係"],"answer":2,"explanation":"右上がりは正の相関を示す。","source":"心理学統計法 授業資料"},{"q":"散布図のプロットが右下がりの場合、どのような関係を示すか。","options":["負の相関","正の相関","無相関","交互作用"],"answer":0,"explanation":"右下がりは負の相関を示す。","source":"心理学統計法 授業資料"},{"q":"相関係数の正・負が示すものはどれか。","options":["関係の方向性","標本数","関係の強さ","因果関係の有無"],"answer":0,"explanation":"符号は関係の方向性を示す。","source":"心理学統計法 授業資料"},{"q":"相関係数の絶対値の大きさが示すものはどれか。","options":["関係の強さ","標本平均","関係の方向性","測定尺度の種類"],"answer":0,"explanation":"絶対値の大きさは関係の強さを示す。","source":"心理学統計法 授業資料"},{"q":"共分散がプラスになるのはどのような場合か。","options":["一方が増えるともう一方が減る","一方が増えるともう一方も増える","両変数の平均が0である","2変数が無関係である"],"answer":1,"explanation":"同じ方向に変動すると共分散はプラスになる。","source":"心理学統計法 授業資料"},{"q":"共分散の値の大きさだけで関係の強さを判断できない理由はどれか。","options":["符号を持たないため","必ず0になるため","名義尺度にしか使えないため","データの単位によって値が変動するため"],"answer":3,"explanation":"共分散はcmやkgなど測定単位の影響を受ける。","source":"心理学統計法 授業資料"},{"q":"共分散の弱点を補い、関係の強さを-1から1で表すものはどれか。","options":["尖度","標準誤差","有意水準","相関係数"],"answer":3,"explanation":"相関係数は単位の影響を除いて-1〜1で関連を表す。","source":"心理学統計法 授業資料"},{"q":"「差がない」「関連がない」とする仮説はどれか。","options":["帰無仮説","対立仮説","作業仮説","因果仮説"],"answer":0,"explanation":"帰無仮説は差や関連がないとする仮説である。","source":"心理学統計法 授業資料"},{"q":"研究者が本当に証明したい「差がある」「関連がある」という仮説はどれか。","options":["帰無仮説","零仮説","対立仮説","標本仮説"],"answer":2,"explanation":"資料では対立仮説を研究者が証明したい仮説として説明している。","source":"心理学統計法 授業資料"},{"q":"統計的検定ではまず何が正しいと仮定するか。","options":["帰無仮説","対立仮説","因果関係","外的妥当性"],"answer":0,"explanation":"まず帰無仮説が正しいと仮定し、その下でデータが起こる確率を計算する。","source":"心理学統計法 授業資料"},{"q":"帰無仮説の下で得られたデータが起こる確率として計算されるものはどれか。","options":["p値","z得点","共分散","標準偏差"],"answer":0,"explanation":"資料では帰無仮説の下で得られたデータが起こる確率をp値としている。","source":"心理学統計法 授業資料"},{"q":"帰無仮説を棄却するかどうかの判断基準となる確率値はどれか。","options":["有意水準","標準誤差","分散","決定係数"],"answer":0,"explanation":"有意水準は棄却判断の基準となる確率値で、αで表される。","source":"心理学統計法 授業資料"},{"q":"有意水準を表す記号はどれか。","options":["β","r","α","z"],"answer":2,"explanation":"有意水準はαで表される。","source":"心理学統計法 授業資料"},{"q":"資料で慣習的な有意水準として挙げられている組み合わせはどれか。","options":["68%と95%","50%と68%","10%と20%","5%と1%"],"answer":3,"explanation":"資料では5%、厳しく判断する場合は1%が挙げられている。","source":"心理学統計法 授業資料"},{"q":"心理学を学問として成立させているものとして、資料で強調されている組み合わせはどれか。","options":["再現性と芸術性","直観性と主観性","臨床性と個別性","実証性と客観性"],"answer":3,"explanation":"資料では、心理学を学問として成立させるものとして実証性と客観性が示されている。","source":"心理学統計法 授業資料"},{"q":"実証性の説明として最も適切なのはどれか。","options":["実際に集めた証拠（データ）に基づいて理論や考えの正当性を示すこと","研究者の経験だけで結論を出すこと","統計を用いずに直感で判断すること","誰にも観察できない現象を扱うこと"],"answer":0,"explanation":"実証性は、実際に集めた証拠（データ）に基づいて理論や考えの正当性を示すこと。","source":"心理学統計法 授業資料"},{"q":"実験法の特徴として資料に示されているものはどれか。","options":["原因となり得るものを研究者が操作し、行動などを観察する","自然場面を操作せず観察するだけである","質問紙だけを用いて回答を求める","対象者への対面質問のみを行う"],"answer":0,"explanation":"実験法では原因となり得るものを操作し、結果を観察・測定する。","source":"心理学統計法 授業資料"},{"q":"質問紙法の説明として適切なのはどれか。","options":["独立変数を必ず操作する","対象者の行動を自然場面で見るだけである","研究目的に沿った質問紙を用意し、対象者に回答を求める","口頭回答しか認めない"],"answer":2,"explanation":"質問紙法は研究目的に沿って質問紙を用意し回答を求める方法。","source":"心理学統計法 授業資料"},{"q":"観察法の説明として適切なのはどれか。","options":["必ず実験操作を行う","必ず尺度得点を算出する","人間の行動を注意深く見て法則性を見出そうとする","面接者が口頭で質問する"],"answer":2,"explanation":"観察法は行動を注意深く観察し対象を理解して法則性を見出す。","source":"心理学統計法 授業資料"},{"q":"面接法が特に有用とされる場面はどれか。","options":["独立変数を無作為に操作したいとき","大規模データを自動集計したいとき","度数分布だけを求めたいとき","質問紙では捉えきれないことをより深く聞きたいとき"],"answer":3,"explanation":"面接法は質問紙で捉えきれない内容をより突っ込んで聞く際に用いられる。","source":"心理学統計法 授業資料"},{"q":"個人や状況によって値が変わり得る対象者の情報一つひとつを何というか。","options":["標本誤差","変数","母数","臨界値"],"answer":1,"explanation":"資料では対象者の情報一つひとつを変数と呼ぶ。","source":"心理学統計法 授業資料"},{"q":"身長や体重のように数量的に表され、量的な違いを扱うものはどれか。","options":["名義変数のみ","量的変数","質的変数","カテゴリ変数のみ"],"answer":1,"explanation":"身長や体重など数量的に表されるものは量的変数。","source":"心理学統計法 授業資料"},{"q":"性別などカテゴリー・分類的な違いを扱うものはどれか。","options":["標準変数","質的変数","量的変数","連続変数"],"answer":1,"explanation":"カテゴリー分類を扱うものは質的変数。","source":"心理学統計法 授業資料"},{"q":"質的変数に「女性=1、男性=2」と数値を割り当てた場合の説明として正しいものはどれか。","options":["平均値を必ず計算すべきである","数値自体には数量としての意味はない","比率尺度になる","2は1の2倍という意味になる"],"answer":1,"explanation":"質的変数を数値化しても、その数字自体に数量的意味はない。","source":"心理学統計法 授業資料"},{"q":"変数の情報をデータとして集めるための行為を何というか。","options":["棄却","推定","測定","標準化"],"answer":2,"explanation":"変数の情報をデータとして集める行為を測定という。","source":"心理学統計法 授業資料"},{"q":"測定するために用いるツールを何というか。","options":["水準","尺度","標本","統計量"],"answer":1,"explanation":"測定に用いるツールが尺度。","source":"心理学統計法 授業資料"},{"q":"間隔尺度で正しく行える計算として資料が示すものはどれか。","options":["足し算・引き算","どの計算もできない","掛け算・割り算による倍数比較のみ","割り算だけ"],"answer":0,"explanation":"間隔尺度では差には意味があるため足し算・引き算は可能だが、倍数表現は適切でない。","source":"心理学統計法 授業資料"},{"q":"比率尺度が間隔尺度と異なる重要な特徴はどれか。","options":["数値に意味がない","順序がない","等間隔ではない","絶対的原点がある"],"answer":3,"explanation":"比率尺度には何もない状態を表す絶対的原点0がある。","source":"心理学統計法 授業資料"},{"q":"当該度数が総度数の何％かを示したものを何というか。","options":["標準得点","累積誤差","相対度数","偏差"],"answer":2,"explanation":"相対度数は当該度数が全体の度数の何％かを示す。","source":"心理学統計法 授業資料"},{"q":"量的変数の度数分布を示す際、区間ごとに度数をまとめる理由として適切なのはどれか。","options":["量的変数には大小がないため","平均値を計算できないため","必ず名義尺度だから","あらゆる値が現れ得るため"],"answer":3,"explanation":"量的変数では多様な値が現れ得るので、区間ごとに度数を示すと理解しやすい。","source":"心理学統計法 授業資料"},{"q":"データの特徴を理解しやすいようにまとめる段階を何というか。","options":["無作為抽出","記述統計","仮説設定","推測統計"],"answer":1,"explanation":"心理学研究の3ステップでは、データ収集の次に記述統計で特徴をまとめる。","source":"心理学統計法 授業資料"},{"q":"得られた結果が偶然ではない意味のある結果と言えそうかを検討する段階はどれか。","options":["尺度作成","記述統計","データ入力","推測統計（統計的検定）"],"answer":3,"explanation":"推測統計では標本で得た結果が母集団でも認められるかを検討する。","source":"心理学統計法 授業資料"},{"q":"心理学研究で統計が必要な理由として資料に示されているものはどれか。","options":["研究者の直感を優先するため","データ収集を不要にするため","主観性を排し、客観的な判断をするため","必ず因果関係を証明するため"],"answer":2,"explanation":"統計は客観性を担保した形でデータを示すために重要。","source":"心理学統計法 授業資料"},{"q":"標準化の利点として適切なのはどれか。","options":["標本数を増やす","外れ値を必ず削除する","すべてのデータを同じ値にする","単位や平均値の異なるデータを比較しやすくする"],"answer":3,"explanation":"標準化により異なる尺度のデータの相対的位置を比較できる。","source":"心理学統計法 授業資料"},{"q":"標本平均値を何度も得たとき、それらの平均はどこに近づくと資料で説明されているか。","options":["最頻値","最大値","母平均","必ず0"],"answer":2,"explanation":"複数の標本平均値の平均は母平均に一致するという説明がある。","source":"心理学統計法 授業資料"},{"q":"サンプルサイズが大きくなると標準誤差は一般にどうなるか。","options":["大きくなる","小さくなる","必ず1になる","変化しない"],"answer":1,"explanation":"資料ではサンプルサイズが大きいほど標準誤差は小さくなり、標本統計量が母集団をより反映すると説明。","source":"心理学統計法 授業資料"},{"q":"統計的仮説検定の目的として最も適切なのはどれか。","options":["標本の値を必ず母数と一致させる","すべての外れ値を除去する","変数を質的変数に変換する","標本で観測されたことが母集団でも認められるかを確率的に判断する"],"answer":3,"explanation":"統計的仮説検定は標本での結果が偶然か、母集団でも認められるかを判断する。","source":"心理学統計法 授業資料"},{"q":"検定統計量とは何か。","options":["有意水準そのもの","各検定法に基づきデータをコンパクトにまとめた値","標本数そのもの","必ず0から1をとる値"],"answer":1,"explanation":"資料ではt統計量やF統計量など、検定法に基づきデータをまとめた値と説明。","source":"心理学統計法 授業資料"},{"q":"有意水準として通常用いられる値はどれか。","options":["5％や1％","25％や50％","0％のみ","68％や95％"],"answer":0,"explanation":"資料では通常5％や1％が用いられる。","source":"心理学統計法 授業資料"},{"q":"p値が有意水準より小さい場合の判断はどれか。","options":["分析を中止する","帰無仮説を必ず採択する","標本を母集団とみなす","帰無仮説を棄却する"],"answer":3,"explanation":"p値が有意水準を下回れば帰無仮説を棄却する。","source":"心理学統計法 授業資料"},{"q":"t検定はどのような場合に用いると資料で説明されているか。","options":["質的変数1つの度数だけを見る場合","相関係数を標準化する場合","3群以上の比率だけを比較する場合","従属変数が量的変数で、2群の平均値を比較する場合"],"answer":3,"explanation":"t検定は量的な従属変数について2グループの平均値差を分析する。","source":"心理学統計法 授業資料"},{"q":"同じ参加者から2回測定した平均値を比較する場合に適するのはどれか。","options":["カイ二乗検定","対応のないt検定","無相関検定","対応のあるt検定"],"answer":3,"explanation":"同一参加者など独立でない2平均の比較には対応のあるt検定。","source":"心理学統計法 授業資料"},{"q":"互いに独立した2つの集団の平均値を比較する場合に適するのはどれか。","options":["対応のあるt検定","標準化","共分散だけ","対応のないt検定"],"answer":3,"explanation":"独立した2群には対応のないt検定。","source":"心理学統計法 授業資料"},{"q":"資料で近年広まっていると説明される、対応のないt検定に関する考え方はどれか。","options":["等分散の事前検定をせずWelch検定を常に採用する","必ず通常のt検定だけを使う","正規性を満たさないと分析不能","p値を報告しない"],"answer":0,"explanation":"資料では等分散検定を行わずWelch検定を常に採用する考え方が広まっているとされる。","source":"心理学統計法 授業資料"},{"q":"t検定の結果で必ず報告すると資料にある3つはどれか。","options":["t値・自由度・p値","平均値・中央値・最頻値","分散・歪度・尖度","r・F・χ²"],"answer":0,"explanation":"t検定ではt値、自由度、p値を必ず報告する。","source":"心理学統計法 授業資料"},{"q":"t検定のt値を報告する際、資料ではどのようにするとされているか。","options":["必ずマイナスで報告する","絶対値としてプラスで報告する","小数点以下を省略する","報告しない"],"answer":1,"explanation":"条件順序で符号が変わるため、資料では絶対値を報告するとしている。","source":"心理学統計法 授業資料"},{"q":"自由度について資料で押さえるべき説明はどれか。","options":["有意水準と同じ値","相関係数の絶対値","自由に変動できる観測値の数","標準偏差の2乗"],"answer":2,"explanation":"自由度は自由に変動できる観測値（スコア）の数と説明される。","source":"心理学統計法 授業資料"},{"q":"一つのパラメータを固定した場合の自由度の基本形として資料に示されるものはどれか。","options":["1/n","n−1","n×2","n+1"],"answer":1,"explanation":"基本的に、そのパラメータ算出に用いるスコア数−1（n−1）。","source":"心理学統計法 授業資料"},{"q":"共分散が正の値になる傾向はどれか。","options":["すべての点が平均上にある","散布図が右上がり","変数がカテゴリーのみ","散布図が右下がり"],"answer":1,"explanation":"偏差の積が正の回答者が多いと共分散はプラスで右上がり傾向。","source":"心理学統計法 授業資料"},{"q":"共分散が負の値になる傾向はどれか。","options":["平均値が同じ場合のみ","完全な無相関のみ","散布図が右下がり","散布図が右上がり"],"answer":2,"explanation":"偏差の積が負の回答者が多いと共分散はマイナスで右下がり傾向。","source":"心理学統計法 授業資料"},{"q":"共分散の問題点はどれか。","options":["測定単位の影響を受ける","符号が存在しない","量的変数には使えない","必ず−1から1に収まる"],"answer":0,"explanation":"共分散はcmとmのような測定単位によって値が変わり解釈しにくい。","source":"心理学統計法 授業資料"},{"q":"相関係数を用いる主な利点はどれか。","options":["因果関係を必ず証明できる","質的変数を量的変数に変える","測定単位の影響を除いて関連の方向と強さを表せる","標本誤差を0にする"],"answer":2,"explanation":"相関係数は共分散を標準化し、単位に依存せず関連を表す。","source":"心理学統計法 授業資料"},{"q":"無相関検定における帰無仮説はどれか。","options":["標本平均が0である","母集団で相関関係はない","母集団で因果関係がある","母集団で完全な正の相関がある"],"answer":1,"explanation":"相関係数の検定では「相関関係はない（無相関）」が帰無仮説。","source":"心理学統計法 授業資料"},{"q":"近年の資料で示されるp値の記載方法として適切なのはどれか。","options":["小数点第3位まで正確な値を記載する","百分率だけで書く","常にp<.05とのみ書く","整数で書く"],"answer":0,"explanation":"資料では近年、p値は小数点第3位まで正確な値を記載するとされる。","source":"心理学統計法 授業資料"},{"q":"p値が.001より小さい場合の表記として資料に示されるものはどれか。","options":["p = .000","p = 0","p > .001","p < .001"],"answer":3,"explanation":"資料では.001より小さい場合はp < .001と書く。","source":"心理学統計法 授業資料"},{"q":"p値が.250より大きい場合の表記として資料に示されるものはどれか。","options":["p < .250","p = 1.000","p > .250","p = .000"],"answer":2,"explanation":"資料では.250より大きい場合はp > .250とする。","source":"心理学統計法 授業資料"},{"q":"偏差とは何か。","options":["最大値と最小値の差","偏差を2乗した値","個々の値から平均値を引いた値","分散の平方根"],"answer":2,"explanation":"正解：個々の値から平均値を引いた値","source":"散布度"},{"q":"偏差をそのまま合計して散布度にできない理由は？","options":["正負が相殺され合計が0になるため","平均が変わるため","標本数が減るため","単位が消えるため"],"answer":0,"explanation":"正解：正負が相殺され合計が0になるため","source":"散布度"},{"q":"分散で偏差を2乗する理由は？","options":["正負の相殺を防ぐため","平均を0にするため","標本数を増やすため","尺度を変えるため"],"answer":0,"explanation":"正解：正負の相殺を防ぐため","source":"散布度"},{"q":"標準偏差が元データと同じ単位になる理由は？","options":["標準化するため","分散の正の平方根をとるため","平均で割るため","偏差を足すため"],"answer":1,"explanation":"正解：分散の正の平方根をとるため","source":"散布度"},{"q":"正規分布で一致する3つの代表値は？","options":["最頻値・歪度・尖度","平均値・分散・標準偏差","平均値・中央値・最頻値","中央値・範囲・分散"],"answer":2,"explanation":"正解：平均値・中央値・最頻値","source":"正規分布"},{"q":"平均±1SDに含まれる割合は約？","options":["68％","80％","50％","95％"],"answer":0,"explanation":"正解：68％","source":"正規分布"},{"q":"平均±2SDに含まれる割合は約？","options":["75％","95％","99％","68％"],"answer":1,"explanation":"正解：95％","source":"正規分布"},{"q":"標準偏差が大きい正規分布の形は？","options":["二峰性","高く尖った形","右に歪んだ形","低く広がった形"],"answer":3,"explanation":"正解：低く広がった形","source":"正規分布"},{"q":"資料で正規分布の歪度はいくつ？","options":["3","−1","0","1"],"answer":2,"explanation":"正解：0","source":"歪度・尖度"},{"q":"資料で正規分布の尖度はいくつ？","options":["−3","3","1","0"],"answer":1,"explanation":"正解：3","source":"歪度・尖度"},{"q":"資料の目安で歪度の絶対値0.5未満は？","options":["やや歪む","ひどく歪む","判定不能","ほぼ正規"],"answer":3,"explanation":"正解：ほぼ正規","source":"歪度・尖度"},{"q":"z得点の式は？","options":["（個々の値−平均値）÷標準偏差","平均値÷個々の値","分散÷偏差","偏差×標準偏差"],"answer":0,"explanation":"正解：（個々の値−平均値）÷標準偏差","source":"標準化"},{"q":"z得点に変換後の平均値と標準偏差は？","options":["平均50・標準偏差10","平均0・標準偏差1","平均100・標準偏差15","平均1・標準偏差0"],"answer":1,"explanation":"正解：平均0・標準偏差1","source":"標準化"},{"q":"標準誤差が小さいことは何を意味する？","options":["母平均の推測精度が高い","標本数が必ず小さい","個人差が大きい","母平均が0"],"answer":0,"explanation":"正解：母平均の推測精度が高い","source":"標本理論"},{"q":"散布図が右上がりなら？","options":["正の相関","負の相関","無相関","因果関係"],"answer":0,"explanation":"正解：正の相関","source":"相関"},{"q":"散布図が右下がりなら？","options":["負の相関","交互作用","正の相関","無相関"],"answer":0,"explanation":"正解：負の相関","source":"相関"},{"q":"相関係数の符号は何を表す？","options":["関係の方向","関係の強さ","標本数","因果方向"],"answer":0,"explanation":"正解：関係の方向","source":"相関"},{"q":"相関係数の絶対値は何を表す？","options":["平均差","因果の確実性","直線的関連の強さ","標準誤差"],"answer":2,"explanation":"正解：直線的関連の強さ","source":"相関"},{"q":"共分散の値の大きさを関係の強さとして直接比較しにくい理由は？","options":["2変数に使えないため","符号がないため","データの単位の影響を受けるため","平均を使わないため"],"answer":2,"explanation":"正解：データの単位の影響を受けるため","source":"共分散"},{"q":"p値が.001未満のとき資料の表記は？","options":["p = .000","p < .001","p = .001","p > .001"],"answer":1,"explanation":"正解：p < .001","source":"結果表記"},{"q":"p値が.250より大きいとき資料の表記は？","options":["p = .250","p < .250","p > .250","p = .999"],"answer":2,"explanation":"正解：p > .250","source":"結果表記"}],"sa":[{"q":"研究者が意図的に操作・設定する変数を何というか。","answer":"独立変数","alts":["説明変数","要因"],"explanation":"独立変数は研究者が操作・設定する側の変数。","source":"心理学統計法 授業資料"},{"q":"独立変数の変化に伴って生じる結果の変数を何というか。","answer":"従属変数","alts":["結果変数","基準変数"],"explanation":"結果として測定される側の変数。","source":"心理学統計法 授業資料"},{"q":"独立変数の条件の数を何というか。","answer":"水準","alts":[],"explanation":"条件の数を水準という。","source":"心理学統計法 授業資料"},{"q":"カテゴリー分類のみを目的とし、大小関係に意味がない尺度は何か。","answer":"名義尺度","alts":[],"explanation":"性別・血液型・国籍などが例。","source":"心理学統計法 授業資料"},{"q":"順序には意味があるが、数値間隔が等しいとは限らない尺度は何か。","answer":"順序尺度","alts":[],"explanation":"順位などが例。","source":"心理学統計法 授業資料"},{"q":"数値間隔は一定だが絶対的原点を持たない尺度は何か。","answer":"間隔尺度","alts":[],"explanation":"0が「存在しない」を意味しない。","source":"心理学統計法 授業資料"},{"q":"等間隔で絶対的原点0を持つ尺度は何か。","answer":"比率尺度","alts":[],"explanation":"重さや長さが例。","source":"心理学統計法 授業資料"},{"q":"n個の観測値の総和をnで割った代表値は何か。","answer":"平均値","alts":[],"explanation":"全ての値を反映するため外れ値の影響を受けやすい。","source":"心理学統計法 授業資料"},{"q":"データを小さい順に並べたとき中央に位置する代表値は何か。","answer":"中央値","alts":[],"explanation":"外れ値の影響を受けにくい。","source":"心理学統計法 授業資料"},{"q":"最も頻度の高い観測値を何というか。","answer":"最頻値","alts":[],"explanation":"名義変数でも求められる。","source":"心理学統計法 授業資料"},{"q":"手元のデータを整理・要約して特徴や傾向を記述する統計を何というか。","answer":"記述統計","alts":[],"explanation":"代表値や散布度などで要約する。","source":"心理学統計法 授業資料"},{"q":"標本から母集団全体の特徴や傾向を推測する統計を何というか。","answer":"推測統計","alts":[],"explanation":"一部のデータから集団全体を推測する。","source":"心理学統計法 授業資料"},{"q":"調査対象となる集団全体を何というか。","answer":"母集団","alts":[],"explanation":"調査したい集団全体。","source":"心理学統計法 授業資料"},{"q":"母集団から選ばれた調査対象者を何というか。","answer":"標本","alts":["サンプル"],"explanation":"標本＝サンプル。","source":"心理学統計法 授業資料"},{"q":"個々の値から平均値を引いた値を何というか。","answer":"偏差","alts":[],"explanation":"観測値−平均値。","source":"心理学統計法 授業資料"},{"q":"偏差の2乗の平均値を何というか。","answer":"分散","alts":[],"explanation":"データのばらつきを示す散布度。","source":"心理学統計法 授業資料"},{"q":"分散の正の平方根をとった指標を何というか。","answer":"標準偏差","alts":["SD"],"explanation":"元データと同じ単位でばらつきを表す。","source":"心理学統計法 授業資料"},{"q":"平均値を中心に左右対称の釣鐘型をした分布を何というか。","answer":"正規分布","alts":[],"explanation":"平均値・中央値・最頻値が一致する。","source":"心理学統計法 授業資料"},{"q":"分布の非対称性の程度を示す指標を何というか。","answer":"歪度","alts":[],"explanation":"絶対値が大きいほど非対称。","source":"心理学統計法 授業資料"},{"q":"資料で分布の左右の裾の長さの度合いを示すとされる指標は何か。","answer":"尖度","alts":[],"explanation":"資料では正規分布の尖度は3。","source":"心理学統計法 授業資料"},{"q":"ローデータを集団内の相対的位置が分かるよう変換する手続きを何というか。","answer":"標準化","alts":[],"explanation":"単位や平均値の異なるデータを比較しやすくする。","source":"心理学統計法 授業資料"},{"q":"偏差を標準偏差で割って求める標準得点を何というか。","answer":"z得点","alts":["zスコア"],"explanation":"z得点化すると一般に平均0、標準偏差1。","source":"心理学統計法 授業資料"},{"q":"平均0、標準偏差1に調整された正規分布を何というか。","answer":"標準正規分布","alts":[],"explanation":"標準化された特別な正規分布。","source":"心理学統計法 授業資料"},{"q":"標本平均値の散らばり具合を何というか。","answer":"標準誤差","alts":[],"explanation":"標本平均が母平均からどれくらいずれる可能性があるかを示す。","source":"心理学統計法 授業資料"},{"q":"2つの量的変数を縦軸・横軸にとって点をプロットした図を何というか。","answer":"散布図","alts":[],"explanation":"関連の方向・強さ、外れ値などを確認できる。","source":"心理学統計法 授業資料"},{"q":"2変数が同じ方向に動くとプラス、逆方向に動くとマイナスになる連動性の指標は何か。","answer":"共分散","alts":[],"explanation":"単位の影響を受けるため大きさだけで強さを判断できない。","source":"心理学統計法 授業資料"},{"q":"「差がない」「関連がない」とする仮説を何というか。","answer":"帰無仮説","alts":[],"explanation":"検定ではまずこれが正しいと仮定する。","source":"心理学統計法 授業資料"},{"q":"研究者が証明したい「差がある」「関連がある」という仮説を何というか。","answer":"対立仮説","alts":[],"explanation":"帰無仮説が棄却されたとき採択される。","source":"心理学統計法 授業資料"},{"q":"帰無仮説を棄却するかどうかの判断基準となる確率値を何というか。","answer":"有意水準","alts":["危険率"],"explanation":"αで表される。","source":"心理学統計法 授業資料"},{"q":"心理学を学問として成立させているものとして資料で挙げられる2つは何か。","answer":"実証性と客観性","alts":["実証性・客観性"],"explanation":"実際のデータに基づく実証性と、条件を満たせば誰でも観察できる客観性。","source":"心理学統計法 授業資料"},{"q":"対象者に関する、個人や状況によって値が変わり得る情報を何というか。","answer":"変数","alts":[],"explanation":"対象者の情報一つひとつを変数と呼ぶ。","source":"心理学統計法 授業資料"},{"q":"身長や体重のように数量的な違いを扱う変数を何というか。","answer":"量的変数","alts":[],"explanation":"数量的に表される変数。","source":"心理学統計法 授業資料"},{"q":"性別や国籍のようにカテゴリー・分類的な違いを扱う変数を何というか。","answer":"質的変数","alts":[],"explanation":"カテゴリー分類を表す変数。","source":"心理学統計法 授業資料"},{"q":"変数の情報をデータとして集める行為を何というか。","answer":"測定","alts":[],"explanation":"測る・取る行為。","source":"心理学統計法 授業資料"},{"q":"測定に用いるツールを何というか。","answer":"尺度","alts":[],"explanation":"尺度には名義・順序・間隔・比率の4種類がある。","source":"心理学統計法 授業資料"},{"q":"当該度数が総度数の何％かを示す値を何というか。","answer":"相対度数","alts":[],"explanation":"度数を全体に対する割合で表したもの。","source":"心理学統計法 授業資料"},{"q":"心理学研究の通常の3ステップを順に答えよ。","answer":"データの収集→記述統計→推測統計","alts":["データ収集→記述統計→推測統計"],"explanation":"資料で示される基本的な3ステップ。","source":"心理学統計法 授業資料"},{"q":"標本で得た結果が母集団でも認められるかを確率的に判定する方法を何というか。","answer":"統計的仮説検定","alts":["仮説検定"],"explanation":"標本の結果が偶然かどうかを検討する。","source":"心理学統計法 授業資料"},{"q":"各検定法に基づいてデータをコンパクトにまとめた値を何というか。","answer":"検定統計量","alts":["統計量"],"explanation":"t統計量やF統計量など。","source":"心理学統計法 授業資料"},{"q":"低い確率を何％以内とするかという基準を何というか。","answer":"有意水準","alts":["危険率","α"],"explanation":"通常5％や1％。","source":"心理学統計法 授業資料"},{"q":"2群の平均値差を分析する手法を何というか。","answer":"t検定","alts":["t 検定"],"explanation":"従属変数が量的変数の場合に用いる。","source":"心理学統計法 授業資料"},{"q":"同じ参加者を繰り返し測定した2平均の比較に用いる検定は何か。","answer":"対応のあるt検定","alts":["対応ありt検定"],"explanation":"参加者内の比較。","source":"心理学統計法 授業資料"},{"q":"独立した2集団の平均値比較に用いる検定は何か。","answer":"対応のないt検定","alts":["対応なしt検定"],"explanation":"参加者間の比較。","source":"心理学統計法 授業資料"},{"q":"等分散を仮定しないt検定を何というか。","answer":"Welch検定","alts":["ウェルチ検定","Welchの検定"],"explanation":"資料では近年常に採用する考え方が広まっていると説明。","source":"心理学統計法 授業資料"},{"q":"t検定で必ず報告する3つの値を答えよ。","answer":"t値・自由度・p値","alts":["t値、自由度、p値"],"explanation":"資料で必須とされる3項目。","source":"心理学統計法 授業資料"},{"q":"自由に変動できる観測値の数を何というか。","answer":"自由度","alts":[],"explanation":"一つのパラメータ固定時は基本的にn−1。","source":"心理学統計法 授業資料"},{"q":"サンプルサイズが大きくなるほど小さくなる、標本平均値の散らばりの指標は何か。","answer":"標準誤差","alts":["SE"],"explanation":"標本平均の標準偏差に相当する。","source":"心理学統計法 授業資料"},{"q":"2変数それぞれの偏差の積をもとに、連動の方向を表す指標は何か。","answer":"共分散","alts":[],"explanation":"正なら右上がり、負なら右下がりの傾向。","source":"心理学統計法 授業資料"},{"q":"母集団で相関関係がないという帰無仮説を検定することを何というか。","answer":"無相関検定","alts":[],"explanation":"標本の相関が母集団でも認められるかを検討する。","source":"心理学統計法 授業資料"},{"q":"個々の値から平均値を引いた値は？","answer":"偏差","aliases":[],"explanation":"正解：偏差","source":"散布度"},{"q":"偏差の2乗の平均は？","answer":"分散","aliases":[],"explanation":"正解：分散","source":"散布度"},{"q":"分散の正の平方根は？","answer":"標準偏差","aliases":[],"explanation":"正解：標準偏差","source":"散布度"},{"q":"正規分布の平均±1SDに約何％？","answer":"約68％","aliases":[],"explanation":"正解：約68％","source":"正規分布"},{"q":"正規分布の平均±2SDに約何％？","answer":"約95％","aliases":[],"explanation":"正解：約95％","source":"正規分布"},{"q":"資料で正規分布の歪度は？","answer":"0","aliases":[],"explanation":"正解：0","source":"歪度・尖度"},{"q":"資料で正規分布の尖度は？","answer":"3","aliases":[],"explanation":"正解：3","source":"歪度・尖度"},{"q":"z得点の平均は？","answer":"0","aliases":[],"explanation":"正解：0","source":"標準化"},{"q":"z得点の標準偏差は？","answer":"1","aliases":[],"explanation":"正解：1","source":"標準化"},{"q":"標本平均の分布の標準偏差は？","answer":"標準誤差","aliases":[],"explanation":"正解：標準誤差","source":"標本理論"},{"q":"p値が.001未満ならどう表記する？","answer":"p < .001","aliases":[],"explanation":"正解：p < .001","source":"結果表記"}]}; const KEY='psy_stats_lecture_quiz_v1'; let type='mc',mode='all',idx=0,list=[],locked=false; let rec=JSON.parse(localStorage.getItem(KEY)||'{"mc":{},"sa":{}}');
function save(){localStorage.setItem(KEY,JSON.stringify(rec))}function rFor(i){return rec[type][i]||{correct:0,wrong:0,attempts:0,last:null}}function setR(i,r){rec[type][i]=r;save()}
function setType(t){type=t;idx=0;build();render()}function setMode(m){mode=m;idx=0;build();render()}function build(){let arr=DATA[type].map((_,i)=>i);if(mode==='unanswered')arr=arr.filter(i=>rFor(i).attempts===0);if(mode==='wrong')arr=arr.filter(i=>rFor(i).wrong>0);if(mode==='wrong1')arr=arr.filter(i=>rFor(i).wrong===1);if(mode==='wrong2')arr=arr.filter(i=>rFor(i).wrong===2);if(mode==='wrong3')arr=arr.filter(i=>rFor(i).wrong>=3);if(mode==='random'){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}list=arr;updateStats()}
function updateStats(){let rs=Object.values(rec[type]),c=rs.reduce((a,x)=>a+x.correct,0),w=rs.reduce((a,x)=>a+x.wrong,0),done=rs.filter(x=>x.attempts>0).length;document.getElementById('sCorrect').textContent=c;document.getElementById('sWrong').textContent=w;document.getElementById('sRate').textContent=(c+w)?Math.round(c/(c+w)*100)+'%':'-';document.getElementById('sProgress').textContent=done+'/'+DATA[type].length;document.getElementById('tabMc').classList.toggle('active',type==='mc');document.getElementById('tabSa').classList.toggle('active',type==='sa');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function render(){updateStats();let empty=!list.length;document.getElementById('empty').classList.toggle('hidden',!empty);document.getElementById('card').classList.toggle('hidden',empty);if(empty)return;if(idx>=list.length)idx=0;if(idx<0)idx=list.length-1;let qi=list[idx],q=DATA[type][qi],r=rFor(qi);locked=false;document.getElementById('meta').textContent=(idx+1)+' / '+list.length;document.getElementById('question').textContent=q.q;document.getElementById('source').textContent='出典：'+q.source;document.getElementById('feedback').className='feedback hidden';document.getElementById('feedback').textContent='';document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回';document.getElementById('mcArea').classList.toggle('hidden',type!=='mc');document.getElementById('saArea').classList.toggle('hidden',type!=='sa');if(type==='mc'){let box=document.getElementById('choices');box.innerHTML='';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>judgeMc(j,b);box.appendChild(b)});document.getElementById('revealMc').disabled=false}else{document.getElementById('saInput').value='';document.getElementById('saInput').disabled=false}}
function showFb(ok,text){let f=document.getElementById('feedback');f.className='feedback '+(ok===true?'ok':ok===false?'ng':'');f.innerHTML=text}
function judgeMc(sel){if(locked)return;locked=true;let qi=list[idx],q=DATA.mc[qi],r=rFor(qi);r.attempts++;if(sel===q.answer)r.correct++;else r.wrong++;r.last=sel===q.answer;setR(qi,r);[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===sel&&sel!==q.answer)b.classList.add('wrong')});showFb(sel===q.answer,(sel===q.answer?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealMc(){if(locked)return;locked=true;let q=DATA.mc[list[idx]];[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct')});showFb(null,'<b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation)}
function norm(s){return s.toLowerCase().replace(/[\s　・･\.。()（）\-−ー]/g,'').replace(/ｔ/g,'t').replace(/ｚ/g,'z')}
function judgeSa(){if(locked)return;let inp=document.getElementById('saInput').value.trim();if(!inp)return;locked=true;let qi=list[idx],q=DATA.sa[qi],r=rFor(qi),valid=[q.answer,...(q.alts||[])].map(norm),ok=valid.includes(norm(inp));r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=ok;setR(qi,r);document.getElementById('saInput').disabled=true;showFb(ok,(ok?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.answer+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealSa(){if(locked)return;locked=true;let q=DATA.sa[list[idx]];document.getElementById('saInput').disabled=true;showFb(null,'<b>答え：</b>'+q.answer+'<br>'+q.explanation)}function next(){idx++;render()}function prev(){idx--;render()}function resetAll(){if(confirm('正解・不正解・間違えた回数など、すべての記録を消しますか？')){rec={mc:{},sa:{}};save();build();render()}}
document.getElementById('mcCount').textContent=DATA.mc.length;document.getElementById('saCount').textContent=DATA.sa.length;build();render();</script></body></html>
