.answerbox{margin-top:16px;border-radius:13px;padding:13px 14px}.answerbox.ok{background:var(--okbg);border:1px solid #9bd8c2}.answerbox.bad{background:var(--badbg);border:1px solid #f0aaa3}.answerbox.neutral{background:#f6f8fc;border:1px solid var(--line)}.answerbox b{display:block;margin-bottom:3px}.explain{margin-top:6px}.source{margin-top:6px;color:var(--muted);font-size:12px}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}.nav button{min-height:44px;padding:8px}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}

.shortinput{width:100%;min-height:94px;padding:12px;resize:vertical}.markrow,.resetrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.markrow button,.resetrow button{min-height:46px;padding:9px}.mark-ok{background:var(--ok);color:#fff;border-color:var(--ok)}.mark-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.footnote{color:var(--muted);font-size:12px;margin:13px 2px 0}.toplink{margin:0 0 10px}.toplink a{color:var(--accent);font-weight:700;text-decoration:none}.hidden{display:none!important}

<script>const questions=[{"id":"jin2-s-001","q":"対象者の行動・対人関係・コミュニケーションを観察し、特徴や法則性を明らかにする研究方法は何か。","answer":"観察法","aliases":[],"explanation":"観察法とは、対象者の行動や対人関係、コミュニケーションを観察・記録し、その特徴や法則性を明らかにする研究方法である。","section":"41. 観察法"},{"id":"jin2-s-002","q":"観察法で記録対象となる三つのものは何か。","answer":"行動・対人関係・コミュニケーション","aliases":[],"explanation":"観察法とは、対象者の行動や対人関係、コミュニケーションを観察・記録し、その特徴や法則性を明らかにする研究方法である。","section":"41. 観察法"},{"id":"jin2-s-003","q":"対象者へ働きかけず、自然な環境で行動を見る方法はどれか。","answer":"自然観察法","aliases":[],"explanation":"観察法には、対象者に働きかけを行わず自然な環境で行動を観察する自然観察法と、特定の行動が生じるように環境条件を設定・操作して観察する実験的観察法がある。","section":"41. 観察法"},{"id":"jin2-s-004","q":"特定の行動が生じるよう、環境条件を設定・操作して見る方法はどれか。","answer":"実験的観察法","aliases":[],"explanation":"観察法には、対象者に働きかけを行わず自然な環境で行動を観察する自然観察法と、特定の行動が生じるように環境条件を設定・操作して観察する実験的観察法がある。","section":"41. 観察法"},{"id":"jin2-s-005","q":"観察法が直接の対象とするものは何か。","answer":"実際の行動そのもの","aliases":[],"explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-s-006","q":"観察法について、言語による回答が難しくても観察研究の対象にできるものとして、資料に挙げられた組合せはどれか。","answer":"乳幼児・障害児・動物","aliases":[],"explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-s-007","q":"観察法について、日常生活の中で把握できることが長所とされるものは何か。","answer":"自然な行動","aliases":[],"explanation":"観察法は、実際の行動そのものを対象とするため、言語的理解力が十分でない乳幼児や障害児、動物なども研究対象にできるほか、日常生活における自然な行動を把握できるという利点がある。","section":"41. 観察法"},{"id":"jin2-s-008","q":"観察法の課題として資料に挙げられた四点の組合せはどれか。","answer":"観察者の視点や解釈の主観性・信頼性の確保・妥当性の確保・プライバシーへの配慮","aliases":[],"explanation":"一方で、観察者の視点や解釈が主観的になりやすく、信頼性や妥当性の確保、プライバシーへの配慮が課題となる。","section":"41. 観察法"},{"id":"jin2-s-009","q":"日常生活で観察した行動や様子を、後から思い出して記録する方法は何か。","answer":"日誌法","aliases":[],"explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-s-010","q":"日誌法は、どの研究方法における記録法の一つか。","answer":"観察法","aliases":[],"explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-s-011","q":"日誌法の例として、保育日誌と並んで挙げられているものは何か。","answer":"育児日誌","aliases":[],"explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-s-012","q":"育児日誌と並ぶ日誌法の例として挙げられているものは何か。","answer":"保育日誌","aliases":[],"explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-s-013","q":"日誌法では、観察した内容をいつ記録するか。","answer":"観察した後に思い出して記録する","aliases":[],"explanation":"日誌法とは、観察法における記録方法の一つであり、育児日誌や保育日誌のように、日常生活の中で観察した対象者の行動や様子を後から思い出して記録する方法である。","section":"42. 日誌法"},{"id":"jin2-s-014","q":"日誌法について、詳細に把握できるものの組合せはどれか。","answer":"個人の特徴と発達過程","aliases":[],"explanation":"個人の特徴や発達の過程を詳細に把握できる。","section":"42. 日誌法"},{"id":"jin2-s-015","q":"日誌法について、客観性に欠けやすい理由は何か。","answer":"記録者の主観や記憶に依存するため","aliases":[],"explanation":"一方で、記録者の主観や記憶に依存するため、客観性に欠けるという課題がある。","section":"42. 日誌法"},{"id":"jin2-s-016","q":"観察したい行動を事前にカテゴリー化し、出現のたびにチェックする方法は何か。","answer":"行動目録法","aliases":[],"explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-s-017","q":"行動目録法の別名として、チェックリスト法と並んで挙げられているものは何か。","answer":"カテゴリー・チェック法","aliases":[],"explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-s-018","q":"行動目録法の別名として、カテゴリー・チェック法と並んで挙げられているものは何か。","answer":"チェックリスト法","aliases":[],"explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-s-019","q":"行動目録法について、行動のカテゴリーを作る時点はいつか。","answer":"観察前","aliases":[],"explanation":"行動目録法とは、観察法で用いられる記録方法の一つであり、カテゴリー・チェック法やチェックリスト法とも呼ばれる。","section":"43. 行動目録法"},{"id":"jin2-s-020","q":"行動目録法について、事前に分類する行動の例として挙げられている組合せはどれか。","answer":"自発的関わりと受動的関わり","aliases":[],"explanation":"観察場面で生起すると予想される行動や、自発的関わり・受動的関わりなどの観察したい行動をあらかじめカテゴリー化し、該当する行動が見られるたびにチェックして記録する方法である。","section":"43. 行動目録法"},{"id":"jin2-s-021","q":"行動目録法について、該当する行動が見られるたびに何を行うか。","answer":"チェックして記録する","aliases":[],"explanation":"観察場面で生起すると予想される行動や、自発的関わり・受動的関わりなどの観察したい行動をあらかじめカテゴリー化し、該当する行動が見られるたびにチェックして記録する方法である。","section":"43. 行動目録法"},{"id":"jin2-s-022","q":"行動目録法について、カテゴリーごとに集計するものは何か。","answer":"生起頻度","aliases":[],"explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-s-023","q":"行動目録法について、生起頻度の集計によって可能になる分析は何か。","answer":"数量的分析","aliases":[],"explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-s-024","q":"行動目録法について、カテゴリー・システム法でよく用いられる標本化の方法は何か。","answer":"時間見本法","aliases":[],"explanation":"各カテゴリーの生起頻度を集計することで数量的な分析が可能であり、時間見本法でよく用いられる。","section":"43. 行動目録法"},{"id":"jin2-s-025","q":"行動目録法について、どのような仮説がある観察で用いられることが多いか。","answer":"明確な仮説","aliases":[],"explanation":"また、行動目録法は、明確な仮説に基づいて観察を行う際に用いられることが多く、仮説に沿った適切なカテゴリーリストを作成することが分析の妥当性を高める上で重要である。","section":"43. 行動目録法"},{"id":"jin2-s-026","q":"行動目録法について、分析の妥当性を高めるため重要な準備は何か。","answer":"仮説に沿った適切なカテゴリーリストの作成","aliases":[],"explanation":"また、行動目録法は、明確な仮説に基づいて観察を行う際に用いられることが多く、仮説に沿った適切なカテゴリーリストを作成することが分析の妥当性を高める上で重要である。","section":"43. 行動目録法"},{"id":"jin2-s-027","q":"行動を事前に設定した評価尺度に沿って数段階で評価する方法は何か。","answer":"評定尺度法","aliases":[],"explanation":"評定尺度法とは、観察法で用いられる記録方法の一つであり、観察対象の行動をあらかじめ設定した評価尺度に沿って評定する方法である。","section":"44. 評定尺度法"},{"id":"jin2-s-028","q":"評定尺度法が記録するのは行動の頻度ではなく何か。","answer":"強さ・程度・印象","aliases":[],"explanation":"行動の頻度ではなく、その強さや程度、印象などを数段階の尺度を用いて記録する。","section":"44. 評定尺度法"},{"id":"jin2-s-029","q":"評定尺度法について、授業態度の評価例で用いられる段階数はいくつか。","answer":"5つ","aliases":[],"explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-s-030","q":"評定尺度法について、子どもの授業態度の積極性を評価する際に示された両極はどれか。","answer":"非常に消極的―非常に積極的","aliases":[],"explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-s-031","q":"『非常に消極的―非常に積極的』と並ぶ評定尺度法の評価例はどれか。","answer":"非常に退屈―非常に楽しい","aliases":[],"explanation":"例えば、子どもの授業態度について、「非常に消極的」から「非常に積極的」、「非常に退屈」から「非常に楽しい」などの5段階で評価することが挙げられる。","section":"44. 評定尺度法"},{"id":"jin2-s-032","q":"評定尺度法について、評定結果が影響されやすいものは何か。","answer":"評定者の主観","aliases":[],"explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-s-033","q":"評定尺度法について、信頼性や客観性を高めるため、評定者は何人にするか。","answer":"複数","aliases":[],"explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-s-034","q":"評定尺度法について、複数の観察者は互いにどう評定するか。","answer":"独立して評定する","aliases":[],"explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-s-035","q":"評定尺度法について、複数評定の結果から用いるものの組合せはどれか。","answer":"一致度と平均値","aliases":[],"explanation":"評定尺度法は評定者の主観に影響されやすいため、複数の観察者が独立して評定を行い、その一致度や平均値を用いることで信頼性や客観性を高めることができる。","section":"44. 評定尺度法"},{"id":"jin2-s-036","q":"行動や出来事を時間の流れに沿って詳しく記述する方法は何か。","answer":"行動描写法","aliases":["逸話記録法"],"explanation":"行動描写法（逸話記録法）とは、観察法で用いられる記録方法の一つであり、観察対象の行動や出来事を時間の流れに沿って詳細に記述する方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-037","q":"行動描写法の別名は何か。","answer":"逸話記録法","aliases":[],"explanation":"行動描写法（逸話記録法）とは、観察法で用いられる記録方法の一つであり、観察対象の行動や出来事を時間の流れに沿って詳細に記述する方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-038","q":"行動描写法について、把握しやすいものとして挙げられる三つは何か。","answer":"行動の背景・文脈・過程","aliases":[],"explanation":"この方法の長所は、行動が生じた背景や文脈、行動の過程を把握しやすく、詳細な記録をもとに後から再検討できる点にある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-039","q":"行動描写法について、詳細な記録があるため、後から何ができるか。","answer":"再検討","aliases":[],"explanation":"この方法の長所は、行動が生じた背景や文脈、行動の過程を把握しやすく、詳細な記録をもとに後から再検討できる点にある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-040","q":"行動描写法の欠点として、多く必要になるものは何か。","answer":"時間と労力","aliases":[],"explanation":"一方で、記録に多くの時間と労力を要し、情報量が膨大になるため、整理や分析が難しくなるという欠点がある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-041","q":"行動描写法について、情報量が膨大になることで難しくなることの組合せは何か。","answer":"整理と分析","aliases":[],"explanation":"一方で、記録に多くの時間と労力を要し、情報量が膨大になるため、整理や分析が難しくなるという欠点がある。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-042","q":"行動描写法について、行動目録法が適する分析は何か。","answer":"生起頻度を扱う量的分析","aliases":[],"explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-043","q":"行動描写法が適する分析は何か。","answer":"行動の質やプロセスを深く理解する質的分析","aliases":[],"explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-044","q":"行動の生起頻度を扱う行動目録法と比べ、行動描写法が重視するものは何か。","answer":"質とプロセス","aliases":[],"explanation":"行動目録法が行動の生起頻度を扱う量的分析に適しているのに対し、行動描写法は行動の質やプロセスを深く理解するための質的分析に適した方法である。","section":"45. 行動描写法（逸話記録法）"},{"id":"jin2-s-045","q":"比較的自由で制限の少ない状況で対面し、会話と非言語表現から情報を集める方法は何か。","answer":"面接法","aliases":[],"explanation":"面接法とは、比較的自由で制限の少ない状況下において、被面接者と対面して話し合い、同時にその非言語的な表現も観察することで、目的に沿って必要な情報を収集しようとする方法。","section":"46. 面接法"},{"id":"jin2-s-046","q":"面接法について、面接で話し合いと同時に観察するものは何か。","answer":"非言語的な表現","aliases":[],"explanation":"面接法とは、比較的自由で制限の少ない状況下において、被面接者と対面して話し合い、同時にその非言語的な表現も観察することで、目的に沿って必要な情報を収集しようとする方法。","section":"46. 面接法"},{"id":"jin2-s-047","q":"面接法の三種類の組合せはどれか。","answer":"構造化・半構造化・非構造化面接","aliases":[],"explanation":"種類としては、構造化面接、非構造化面接、半構造化面接がある。","section":"46. 面接法"},{"id":"jin2-s-048","q":"面接法について、数量的データと比べて豊かに捉えられるものは何か。","answer":"対象者の内面","aliases":[],"explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-s-049","q":"面接法について、観察法から得るデータが限定されやすいものは何か。","answer":"その時点・場面","aliases":[],"explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-s-050","q":"面接法について、面接で話題を展開できる時間範囲はどれか。","answer":"過去・現在・未来","aliases":[],"explanation":"面接法は、数量的データに比べて、対象者の内面を豊かな形で捉えることができ、また、観察法から得られるデータがその時点(場面)に限定されるのに対して、過去・現在・未来にわたって話題展開を行うことが可能といった長所がある。","section":"46. 面接法"},{"id":"jin2-s-051","q":"面接法について、対象や領域が限られる原因となる依存性は何か。","answer":"言語への依存","aliases":[],"explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-s-052","q":"面接法について、短所として保障されないとされるものは何か。","answer":"客観性","aliases":[],"explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-s-053","q":"面接法について、回答内容を方向づける危険があるのは誰の意識や態度か。","answer":"面接者","aliases":[],"explanation":"一方で、言語に依存するため、領域や対象が限られることや、客観性の保障がない、面接者の意識や態度が回答内容を方向付ける危険性があるなどの短所がある。","section":"46. 面接法"},{"id":"jin2-s-054","q":"質問項目・提示順序・回答形式を事前に固定する方法は何か。","answer":"構造化面接","aliases":[],"explanation":"面接法において、あらかじめ質問項目やその提示順序、回答形式を設定したかたちで行う方法をいう。","section":"47. 構造化面接"},{"id":"jin2-s-055","q":"構造化面接について、事前に設定する三つの要素は何か。","answer":"質問項目・提示順序・回答形式","aliases":[],"explanation":"面接法において、あらかじめ質問項目やその提示順序、回答形式を設定したかたちで行う方法をいう。","section":"47. 構造化面接"},{"id":"jin2-s-056","q":"構造化面接について、対象者や状況に応じて、準備した質問をどうしてはいけないか。","answer":"変更する","aliases":[],"explanation":"事前に質問が準備されており、対象者や面接状況に応じてそれらを変更してはならない。","section":"47. 構造化面接"},{"id":"jin2-s-057","q":"構造化面接について、複数の面接者を用いる場合に図るものは何か。","answer":"面接内容の一致","aliases":[],"explanation":"そのため、複数の面接者がいる場合などでは、それぞれの面接内容の一致を図る目的から用いられる。","section":"47. 構造化面接"},{"id":"jin2-s-058","q":"構造化面接に分類される診断面接は何か。","answer":"マニュアル化された診断面接","aliases":[],"explanation":"マニュアル化された診断面接もここに分類される。","section":"47. 構造化面接"},{"id":"jin2-s-059","q":"構造化面接について、マニュアルに従えば、誰が使ってもどうなりやすいか。","answer":"ある程度一定の結果に達する","aliases":[],"explanation":"マニュアルに従えばある程度誰でも使用でき、一定の結果に達することができる。","section":"47. 構造化面接"},{"id":"jin2-s-060","q":"構造化面接で高いとされるものは何か。","answer":"客観性","aliases":[],"explanation":"また、客観性は高い。","section":"47. 構造化面接"},{"id":"jin2-s-061","q":"構造化面接で高いとされる測定上の性質は何か。","answer":"信頼性","aliases":[],"explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-s-062","q":"構造化面接について、質問内容の説明ができないため起こり得ることは何か。","answer":"対象者の誤解","aliases":[],"explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-s-063","q":"構造化面接について、誤解によって問題が生じ得る測定上の性質は何か。","answer":"妥当性","aliases":[],"explanation":"面接の信頼性は高いが、質問内容への説明を行うことができないため、対象者が質問内容を誤解する恐れがあり、面接の妥当性に問題が生じる場合がある。","section":"47. 構造化面接"},{"id":"jin2-s-064","q":"基本の質問を準備しつつ、流れに応じて追加・変更する方法は何か。","answer":"半構造化面接","aliases":[],"explanation":"半構造化面接は、基本となる質問項目や回答形式を事前に用意しながら、話の流れに応じて質問を追加・変更できる方法である。","section":"48. 半構造化面接"},{"id":"jin2-s-065","q":"半構造化面接について、事前に設定するものの組合せはどれか。","answer":"質問項目と回答形式","aliases":[],"explanation":"面接法において、事前に質問項目や回答形式を設定する一方で、話の流れに応じて臨機応変に質問の追加・変更を行う方法をいう。","section":"48. 半構造化面接"},{"id":"jin2-s-066","q":"半構造化面接について、話の流れに応じてできることは何か。","answer":"質問の追加や変更","aliases":[],"explanation":"面接法において、事前に質問項目や回答形式を設定する一方で、話の流れに応じて臨機応変に質問の追加・変更を行う方法をいう。","section":"48. 半構造化面接"},{"id":"jin2-s-067","q":"半構造化面接について、対象者の何に沿った情報を得られるか。","answer":"語り","aliases":[],"explanation":"対象者の語りに応じた面接の進行により、対象者の語りに沿った情報を得ることができ、また、面接者の関心に応じて、より深い内容の語りを引き出すこともできる。","section":"48. 半構造化面接"},{"id":"jin2-s-068","q":"半構造化面接について、面接者の関心に応じて引き出せるものは何か。","answer":"より深い内容の語り","aliases":[],"explanation":"対象者の語りに応じた面接の進行により、対象者の語りに沿った情報を得ることができ、また、面接者の関心に応じて、より深い内容の語りを引き出すこともできる。","section":"48. 半構造化面接"},{"id":"jin2-s-069","q":"半構造化面接の最大の利点は何か。","answer":"柔軟性","aliases":[],"explanation":"このような柔軟性こそが、半構造化面接の最大の利点であると言える。","section":"48. 半構造化面接"},{"id":"jin2-s-070","q":"半構造化面接について、基本項目を網羅することで保つものは何か。","answer":"調査の妥当性","aliases":[],"explanation":"基本項目を網羅することで調査の妥当性を保ちつつ、対象者の反応に合わせて深掘りできるため、本人の主観的な意味づけや潜在的な背景を詳細に引き出すことができる。","section":"48. 半構造化面接"},{"id":"jin2-s-071","q":"半構造化面接について、反応に合わせた深掘りで引き出せる二つは何か。","answer":"本人の主観的意味づけと潜在的背景","aliases":[],"explanation":"基本項目を網羅することで調査の妥当性を保ちつつ、対象者の反応に合わせて深掘りできるため、本人の主観的な意味づけや潜在的な背景を詳細に引き出すことができる。","section":"48. 半構造化面接"},{"id":"jin2-s-072","q":"半構造化面接について、適用されるのは、探索領域がどの程度想定されている場合か。","answer":"ある程度想定されている場合","aliases":[],"explanation":"探索する領域がある程度想定されている場合や、発見を目的とした質的研究などの場合に適用される。","section":"48. 半構造化面接"},{"id":"jin2-s-073","q":"半構造化面接について、適用される研究の目的として挙げられるものは何か。","answer":"発見","aliases":[],"explanation":"探索する領域がある程度想定されている場合や、発見を目的とした質的研究などの場合に適用される。","section":"48. 半構造化面接"},{"id":"jin2-s-074","q":"質問項目や回答形式を事前に決めず、自由に語ってもらう方法は何か。","answer":"非構造化面接","aliases":[],"explanation":"非構造化面接は、質問項目や回答形式を事前に固定せず、対象者に自由に語ってもらい、流れに応じて面接者が質問や説明を行う方法である。","section":"49. 非構造化面接"},{"id":"jin2-s-075","q":"非構造化面接について、事前に設定しない二つのものは何か。","answer":"質問項目と回答形式","aliases":[],"explanation":"面接法において、質問項目や回答形式を事前に設定しない形で、被面接者に自由に語ってもらいながら行う方法をいう。","section":"49. 非構造化面接"},{"id":"jin2-s-076","q":"非構造化面接について、話の流れに応じて面接者が行うものは何か。","answer":"臨機応変な質問や説明","aliases":[],"explanation":"話の流れに応じて面接者が臨機応変に質問や説明を行い、対象者がおのずと語るような面接がなされる。","section":"49. 非構造化面接"},{"id":"jin2-s-077","q":"非構造化面接は、形式的な面接より何に近いと表現されるか。","answer":"語り合い","aliases":[],"explanation":"「面接」というより「語り合い」であり、形式的な面接では引き出すことができない、より生き生きとした語りを得ることができる。","section":"49. 非構造化面接"},{"id":"jin2-s-078","q":"非構造化面接について、形式的面接では得にくいどのような語りを得られるか。","answer":"生き生きとした語り","aliases":[],"explanation":"「面接」というより「語り合い」であり、形式的な面接では引き出すことができない、より生き生きとした語りを得ることができる。","section":"49. 非構造化面接"},{"id":"jin2-s-079","q":"非構造化面接について、質問内容への説明によって避けられるものは何か。","answer":"対象者の誤解","aliases":[],"explanation":"非構造化面接は、質問内容への説明を行うことができることから、被面接者の質問内容への誤解が避けられるため、面接の妥当性は高い。","section":"49. 非構造化面接"},{"id":"jin2-s-080","q":"非構造化面接について、誤解を避けられるため高いとされるものは何か。","answer":"妥当性","aliases":[],"explanation":"非構造化面接は、質問内容への説明を行うことができることから、被面接者の質問内容への誤解が避けられるため、面接の妥当性は高い。","section":"49. 非構造化面接"},{"id":"jin2-s-081","q":"非構造化面接について、進め方が大きく依存するものは何か。","answer":"面接者の技量","aliases":[],"explanation":"しかし、面接の進め方が面接者の技量に負うところが大きく、信頼性に問題が生じる場合がある。","section":"49. 非構造化面接"},{"id":"jin2-s-082","q":"非構造化面接について、面接者の技量に左右されるため問題が生じやすいものは何か。","answer":"信頼性","aliases":[],"explanation":"しかし、面接の進め方が面接者の技量に負うところが大きく、信頼性に問題が生じる場合がある。","section":"49. 非構造化面接"},{"id":"jin2-s-083","q":"非構造化面接に分類できる実践は何か。","answer":"心理療法","aliases":[],"explanation":"心理療法はここに分類でき、自由に探索したり、発見が目的な場合に適用される。","section":"49. 非構造化面接"},{"id":"jin2-s-084","q":"非構造化面接について、適用される目的の組合せはどれか。","answer":"自由な探索と発見","aliases":[],"explanation":"心理療法はここに分類でき、自由に探索したり、発見が目的な場合に適用される。","section":"49. 非構造化面接"},{"id":"jin2-s-085","q":"非構造化面接について、低いとされるものは何か。","answer":"客観性","aliases":[],"explanation":"ただ、客観性は低い。","section":"49. 非構造化面接"},{"id":"jin2-s-086","q":"主に言語データを扱い、結果も言語で記述する方法は何か。","answer":"質的研究法","aliases":[],"explanation":"おもに言語データを扱い、分析やその結果も言語で記述される研究法。","section":"50. 質的研究法"},{"id":"jin2-s-087","q":"質的研究法について、質的研究が主に扱うデータは何か。","answer":"言語データ","aliases":[],"explanation":"おもに言語データを扱い、分析やその結果も言語で記述される研究法。","section":"50. 質的研究法"},{"id":"jin2-s-088","q":"質的研究法について、分析結果は主に何で記述されるか。","answer":"言語","aliases":[],"explanation":"おもに言語データを扱い、分析やその結果も言語で記述される研究法。","section":"50. 質的研究法"},{"id":"jin2-s-089","q":"質的研究法について、心理臨床で変数間の関係のため統計処理が難しくなるのはどのような場合か。","answer":"多くの変数が複雑に影響し合う場合","aliases":[],"explanation":"心理臨床の研究対象は、多くの変数が複雑に影響し合う場合や、少数の事例を扱う場合があり、統計処理が難しく量的研究のみではそれらを検討することが困難なことがある。","section":"50. 質的研究法"},{"id":"jin2-s-090","q":"心理臨床の研究対象について、多くの変数が複雑に影響し合う場合と並び、量的研究だけでは検討しにくいとされるのはどのような場合か。","answer":"少数の事例を扱う場合","aliases":[],"explanation":"心理臨床の研究対象は、多くの変数が複雑に影響し合う場合や、少数の事例を扱う場合があり、統計処理が難しく量的研究のみではそれらを検討することが困難なことがある。","section":"50. 質的研究法"},{"id":"jin2-s-091","q":"質的研究法について、量的研究では見えにくく、質的研究が把握に適するものは何か。","answer":"思考や心的力動の過程","aliases":[],"explanation":"質的研究では、量的研究では明らかになりにくい、対象者の思考や心的力動の過程を把握することに適しており、対象者の文脈や時間的流れを切り離すことなく捉えることができる点が特徴である。","section":"50. 質的研究法"},{"id":"jin2-s-092","q":"質的研究法について、切り離さずに捉えられるものの組合せは何か。","answer":"対象者の文脈と時間的流れ","aliases":[],"explanation":"質的研究では、量的研究では明らかになりにくい、対象者の思考や心的力動の過程を把握することに適しており、対象者の文脈や時間的流れを切り離すことなく捉えることができる点が特徴である。","section":"50. 質的研究法"},{"id":"jin2-s-093","q":"質的研究法の代表的方法として、資料に挙げられている2つの組合せはどれか。","answer":"事例研究法とグラウンデッド・セオリー・アプローチ","aliases":["グラウンデッド・セオリー・アプローチと事例研究法","事例研究法、グラウンデッド・セオリー・アプローチ","事例研究法・グラウンデッド・セオリー・アプローチ"],"explanation":"資料では、質的研究法の代表的方法として、事例研究法とグラウンデッド・セオリー・アプローチの2つが挙げられている。","section":"50. 質的研究法"},{"id":"jin2-s-095","q":"一例または少 :"69. GHQ精神健康調査票"},{"id":"jin2-s-300","q":"GHQ精神健康調査票について、GHQの四因子の組合せはどれか。","answer":"身体症状・不安と不眠・社会的活動障害・うつ状態","aliases":[],"explanation":"質問項目は、①身体症状、②不安と不眠、③社会的活動障害、④うつ状態といった因子から構成されている。","section":"69. GHQ精神健康調査票"},{"id":"jin2-s-301","q":"GHQ精神健康調査票について、GHQの因子はいくつか。","answer":"4つ","aliases":[],"explanation":"GHQの質問項目は、身体症状、不安と不眠、社会的活動障害、うつ状態という4因子で構成される。","section":"69. GHQ精神健康調査票"},{"id":"jin2-s-302","q":"GHQ精神健康調査票について、GHQ原法の項目数はいくつか。","answer":"60","aliases":[],"explanation":"原法は60項目であるが、因子分析の結果を基に28項目版、30項目版などの短縮版が作成されている。","section":"69. GHQ精神健康調査票"},{"id":"jin2-s-303","q":"GHQ精神健康調査票について、因子分析を基に作成された短縮版の項目数の組合せはどれか。","answer":"28項目版と30項目版","aliases":[],"explanation":"原法は60項目であるが、因子分析の結果を基に28項目版、30項目版などの短縮版が作成されている。","section":"69. GHQ精神健康調査票"},{"id":"jin2-s-304","q":"NEO-PI-Rの基礎となる5因子モデルを提唱した人物の組合せはどれか。","answer":"コスタとマックレー","aliases":[],"explanation":"NEO-PI-R（ネオ人格目録改訂版）は、コスタとマックレーが提唱した5因子モデルに基づく性格検査である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-305","q":"5因子モデルに基づくネオ人格目録改訂版の略称は何か。","answer":"NEO-PI-R","aliases":["ネオ人格目録改訂版"],"explanation":"NEO-PI-R（ネオ人格目録改訂版）は、コスタとマックレーが提唱した5因子モデルに基づく性格検査である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-306","q":"NEO-PI-Rが測定する五因子の組合せはどれか。","answer":"神経症傾向（N）・外向性（E）・開放性（O）・協調性（A）・誠実性（C）","aliases":[],"explanation":"測定する5因子は、神経症傾向（N）、外向性（E）、開放性（O）、協調性（A）、誠実性（C）である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-307","q":"NEO-PI-Rが測定する基本因子はいくつか。","answer":"5つ","aliases":[],"explanation":"NEO-PI-R（ネオ人格目録改訂版）は、コスタとマックレーが提唱した5因子モデルに基づく性格検査である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-308","q":"NEO-PI-Rについて、各基本因子はいくつの下位次元から構成されるか。","answer":"6つ","aliases":[],"explanation":"さらに、各因子はそれぞれ6つの下位次元から構成されており、個人のパーソナリティをより詳細に把握することができる。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-309","q":"NEO-PI-Rの神経症傾向を構成する六つの下位次元の組合せはどれか。","answer":"不安・敵意・抑うつ・自意識・衝動性・傷つきやすさ","aliases":[],"explanation":"例えば、神経症傾向は不安、敵意、抑うつ、自意識、衝動性、傷つきやすさの6つの下位次元からなる。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-310","q":"NEO-PI-Rについて、同じ因子得点でも解釈が異なる場合があるのはなぜか。","answer":"下位次元の特徴が異なるため","aliases":[],"explanation":"そのため、同じ因子得点であっても下位次元の特徴によって解釈が異なる場合がある。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-311","q":"NEO-PI-R全体で測定する特性はいくつか。","answer":"30","aliases":[],"explanation":"全体では5因子30特性を測定し、個人差をきめ細かく評価することが可能である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-312","q":"NEO-PI-Rについて、一つの下位次元を構成する項目はいくつか。","answer":"8つ","aliases":[],"explanation":"各下位次元は8項目で構成され、総項目数は240項目である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-313","q":"NEO-PI-Rの総項目数はいくつか。","answer":"240","aliases":[],"explanation":"各下位次元は8項目で構成され、総項目数は240項目である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-314","q":"NEO-PI-Rについて、下位次元を用いることで可能になる評価は何か。","answer":"個人差をきめ細かく評価する","aliases":[],"explanation":"全体では5因子30特性を測定し、個人差をきめ細かく評価することが可能である。","section":"70. NEO-PI-R（ネオ人格目録改訂版）"},{"id":"jin2-s-315","q":"左右対称のインク・ブロットを用いる検査を考案した人物は誰か。","answer":"ロールシャッハ","aliases":[],"explanation":"ロールシャッハによって考案された投映法人格検査である。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-316","q":"左右対称のインク・ブロット図版を用いる投映法検査は何か。","answer":"ロールシャッハ・テスト","aliases":[],"explanation":"ロールシャッハによって考案された投映法人格検査である。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-317","q":"ロールシャッハ・テストはどの方法に分類される人格検査か。","answer":"投映法","aliases":[],"explanation":"ロールシャッハによって考案された投映法人格検査である。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-318","q":"ロールシャッハ図版の枚数はいくつか。","answer":"10","aliases":[],"explanation":"検査刺激は左右対称のインク・ブロットでできた10枚の図版で、無彩色、赤と黒の2色、複数の色彩を用いたものがある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-319","q":"ロールシャッハ図版の三つの色彩構成の組合せはどれか。","answer":"無彩色・赤と黒の2色・複数の色彩","aliases":[],"explanation":"検査刺激は左右対称のインク・ブロットでできた10枚の図版で、無彩色、赤と黒の2色、複数の色彩を用いたものがある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-320","q":"ロールシャッハ・テストについて、最初に被検者が各図版について行うことは何か。","answer":"何に見えるかを口頭で述べる","aliases":[],"explanation":"まず、被検者はそれぞれの図版について向に見えるかを口頭で述べる。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-321","q":"ロールシャッハ・テストについて、口頭反応の後、検査者が質問する内容は何か。","answer":"図版のどの特徴からそう見えたか","aliases":[],"explanation":"その後、検査者はその図版のどのような特徴からそのように見えたのかについて質疑を行う。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-322","q":"ロールシャッハ反応の四つのスコアリング項目の組合せはどれか。","answer":"反応領域・反応決定因・反応内容・形態水準","aliases":[],"explanation":"それらの回答から、反応領域、反応決定因、反応内容、形態水塗などのスコアリングを行う。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-323","q":"ロールシャッハ・テストについて、スコアリングされた反応を量的に分析する方法は何か。","answer":"形式分析","aliases":[],"explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-324","q":"ロールシャッハ・テストについて、一枚の図版への反応を質的に分析する方法は何か。","answer":"内容分析","aliases":[],"explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-325","q":"ロールシャッハ・テストについて、各図版への反応の流れを力動的に分析する方法は何か。","answer":"継起分析","aliases":[],"explanation":"解釈は、スコアリングされた反応を量的に分析する形式分析や、1枚の図版の反応を質的に分析する内容分析、各図版の反応の流れを力動的に分析していく継起分析がある。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-326","q":"ロールシャッハ・テストについて、日本で従来主流だった、三つの分析を行う方法は何か。","answer":"片口法","aliases":[],"explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-327","q":"ロールシャッハ・テストについて、包括システムとも呼ばれ、形式分析だけを行う方法は何か。","answer":"エクスナー法","aliases":["包括システム"],"explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-328","q":"ロールシャッハ・テストについて、片口法が行う分析の組合せはどれか。","answer":"形式分析・内容分析・継起分析","aliases":[],"explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-329","q":"ロールシャッハ・テストについて、エクスナー法が行う分析は何か。","answer":"形式分析のみ","aliases":[],"explanation":"実施や解釈についてはさまざまな立場があり、日本においてはこれまで形式分析や内容分析、継起分析を行う片口法が主流であったが、最近では形式分析のみを行うエクスナー法（包括システム）も用いられるようになっている。","section":"71. ロールシャッハ・テスト"},{"id":"jin2-s-330","q":"絵画統覚検査について、TATを開発した研究者の組合せはどれか。","answer":"マレーとモーガン","aliases":[],"explanation":"マレーとモーガンによって開発された。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-331","q":"曖昧な人物場面の絵から自由に物語を語らせる検査は何か。","answer":"TAT","aliases":["絵画統覚検査"],"explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-332","q":"絵画統覚検査について、TATはどの方法に分類される性格検査か。","answer":"投映法","aliases":[],"explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-333","q":"絵画統覚検査について、TATで示す図版に主に含まれるものは何か。","answer":"人物を含む曖昧な状況","aliases":[],"explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-334","q":"絵画統覚検査について、被検者が絵から自由に作るものは何か。","answer":"物語","aliases":[],"explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-335","q":"絵画統覚検査について、物語内容から明らかにしようとするものは何か。","answer":"パーソナリティ傾向","aliases":[],"explanation":"おもに人物を含んだあいまいな状況が描かれた複数枚の絵を被検者に示し、それらの絵から物語をそれぞれ自由に語らせ、それらの物語の内容から被検者のパーソナリティ傾向を明らかにする投映法性格検査である。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-336","q":"絵画統覚検査について、TAT原法の絵が描かれた図版は何枚か。","answer":"30","aliases":[],"explanation":"原法は、絵が描かれた図版30枚と白紙図版1枚の計31枚からなる。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-337","q":"絵画統覚検査について、TAT原法の白紙図版は何枚か。","answer":"1枚","aliases":[],"explanation":"原法は、絵が描かれた図版30枚と白紙図版1枚の計31枚からなる。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-338","q":"絵画統覚検査について、TAT原法の図版総数はいくつか。","answer":"31","aliases":[],"explanation":"原法は、絵が描かれた図版30枚と白紙図版1枚の計31枚からなる。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-339","q":"絵画統覚検査について、マレーが提唱したTATの解釈法は何か。","answer":"欲求－圧力分析","aliases":[],"explanation":"解釈法として、マレーの提唱した欲求－圧力分析があるが、十分に確立されているわけではない。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-340","q":"絵画統覚検査について、欲求－圧力分析の確立度はどうか。","answer":"十分に確立されていない","aliases":[],"explanation":"解釈法として、マレーの提唱した欲求－圧力分析があるが、十分に確立されているわけではない。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-341","q":"絵画統覚検査について、TAT図版の四つの対象区分の組合せはどれか。","answer":"少年用（B）・少女用（G）・成人男性用（M）・成人女性用（F）","aliases":[],"explanation":"また、各図版は少年用（B）・少女用（G）・成人男性用（M）・成人女性用（F）に分けられる。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-342","q":"絵画統覚検査について、児童用に開発された統覚検査は何か。","answer":"CAT","aliases":[],"explanation":"児童用としてCATや高齢者用のSATがある。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-343","q":"絵画統覚検査について、高齢者用に開発された統覚検査は何か。","answer":"SAT","aliases":[],"explanation":"児童用としてCATや高齢者用のSATがある。","section":"72. 絵画統覚検査（TAT）"},{"id":"jin2-s-344","q":"PFスタディを考案した人物は誰か。","answer":"ローゼンツヴァイク","aliases":[],"explanation":"ローゼンツヴァイクによって考案された投映法性格検査である。","section":"73. PFスタディ"},{"id":"jin2-s-345","q":"欲求不満場面の吹き出しへ発言を記入する検査は何か。","answer":"PFスタディ","aliases":[],"explanation":"他人から害を被った場面や攻撃を受ける場面、欲求不満が喚起される場面などが24枚のイラストで示され、被検者は空白の吹き出しが描かれている右側の人物の発言を連想し、そのなかに記入することを求められる。","section":"73. PFスタディ"},{"id":"jin2-s-346","q":"PFスタディはどの方法に分類される性格検査か。","answer":"投映法","aliases":[],"explanation":"ローゼンツヴァイクによって考案された投映法性格検査である。","section":"73. PFスタディ"},{"id":"jin2-s-347","q":"PFスタディのイラストは何枚か。","answer":"24","aliases":[],"explanation":"他人から害を被った場面や攻撃を受ける場面、欲求不満が喚起される場面などが24枚のイラストで示され、被検者は空白の吹き出しが描かれている右側の人物の発言を連想し、そのなかに記入することを求められる。","section":"73. PFスタディ"},{"id":"jin2-s-348","q":"PFスタディについて、イラストで示される状況の組合せはどれか。","answer":"被害・攻撃・欲求不満の場面","aliases":[],"explanation":"他人から害を被った場面や攻撃を受ける場面、欲求不満が喚起される場面などが24枚のイラストで示され、被検者は空白の吹き出しが描かれている右側の人物の発言を連想し、そのなかに記入することを求められる。","section":"73. PFスタディ"},{"id":"jin2-s-349","q":"PFスタディについて、空白の吹き出しが描かれているのはどちら側の人物か。","answer":"右側","aliases":[],"explanation":"他人から害を被った場面や攻撃を受ける場面、欲求不満が喚起される場面などが24枚のイラストで示され、被検者は空白の吹き出しが描かれている右側の人物の発言を連想し、そのなかに記入することを求められる。","section":"73. PFスタディ"},{"id":"jin2-s-350","q":"PFスタディについて、被検者は吹き出しへ何を記入するか。","answer":"右側の人物の発言を連想して記入する","aliases":[],"explanation":"他人から害を被った場面や攻撃を受ける場面、欲求不満が喚起される場面などが24枚のイラストで示され、被検者は空白の吹き出しが描かれている右側の人物の発言を連想し、そのなかに記入することを求められる。","section":"73. PFスタディ"},{"id":"jin2-s-351","q":"PFスタディについて、P-Fスタディで評定するアグレッションの三方向の組合せはどれか。","answer":"他責・自責・無責","aliases":[],"explanation":"このような欲求不満場面での反応傾向を、他責・自責・無責のアグレッションの方向と、障害優位・自我防衛・要求固執のアグレッションの型から分類し、それを基に解釈を行っていく。","section":"73. PFスタディ"},{"id":"jin2-s-352","q":"PFスタディについて、P-Fスタディで評定するアグレッションの三つの型の組合せはどれか。","answer":"障害優位・自我防衛・要求固執","aliases":[],"explanation":"このような欲求不満場面での反応傾向を、他責・自責・無責のアグレッションの方向と、障害優位・自我防衛・要求固執のアグレッションの型から分類し、それを基に解釈を行っていく。","section":"73. PFスタディ"},{"id":"jin2-s-353","q":"PFスタディについて、反応傾向を解釈する二つの分類軸は何か。","answer":"アグレッションの方向と型","aliases":[],"explanation":"このような欲求不満場面での反応傾向を、他責・自責・無責のアグレッションの方向と、障害優位・自我防衛・要求固執のアグレッションの型から分類し、それを基に解釈を行っていく。","section":"73. PFスタディ"},{"id":"jin2-s-354","q":"未完成で多義的な文の後半を自由に書き加える検査は何か。","answer":"文章完成法","aliases":["SCT"],"explanation":"「わたしは子どもの頃・・・」というような未完成で多義的な文章の後半を、被検者が自由に書き加えることで文章を完成させる投映法性格査である。","section":"74. 文章完成法"},{"id":"jin2-s-355","q":"文章完成法はどの方法に分類される性格検査か。","answer":"投映法","aliases":[],"explanation":"投映法に分類されるが、比較的浅い前意識レベルを明らかにする検査と位置づけられている。","section":"74. 文章完成法"},{"id":"jin2-s-356","q":"文章完成法について、刺激文の例として示されている書き出しはどれか。","answer":"『わたしは子どもの頃…』","aliases":[],"explanation":"「わたしは子どもの頃・・・」というような未完成で多義的な文章の後半を、被検者が自由に書き加えることで文章を完成させる投映法性格査である。","section":"74. 文章完成法"},{"id":"jin2-s-357","q":"文章完成法について、適用に必要な二つの能力は何か。","answer":"文章理解と作文能力","aliases":[],"explanation":"文章理解と作文能力がある児童以上に用いられる。","section":"74. 文章完成法"},{"id":"jin2-s-358","q":"文章完成法について、適用対象はどの段階以上か。","answer":"児童以上","aliases":[],"explanation":"文章理解と作文能力がある児童以上に用いられる。","section":"74. 文章完成法"},{"id":"jin2-s-359","q":"文章完成法について、比較的浅いどの意識レベルを明らかにする検査か。","answer":"前意識","aliases":[],"explanation":"投映法に分類されるが、比較的浅い前意識レベルを明らかにする検査と位置づけられている。","section":"74. 文章完成法"},{"id":"jin2-s-360","q":"文章完成法で具体的に把握できる四つの内容の組合せはどれか。","answer":"生活史・興味・パーソナリティ・知能","aliases":[],"explanation":"被検者の生活史や興味、パーソナリティや知能など外的・内的状況を具体的に把握できる検査として、他の心理検査とともにテストバッテリーに組み込まれることが多い。","section":"74. 文章完成法"},{"id":"jin2-s-361","q":"文章完成法は、他の心理検査とともに何へ組み込まれることが多いか。","answer":"テスト・バッテリー","aliases":[],"explanation":"被検者の生活史や興味、パーソナリティや知能など外的・内的状況を具体的に把握できる検査として、他の心理検査とともにテストバッテリーに組み込まれることが多い。","section":"74. 文章完成法"},{"id":"jin2-s-362","q":"文章完成法で把握するのは、対象者のどのような状況か。","answer":"外的・内的状況","aliases":[],"explanation":"被検者の生活史や興味、パーソナリティや知能など外的・内的状況を具体的に把握できる検査として、他の心理検査とともにテストバッテリーに組み込まれることが多い。","section":"74. 文章完成法"},{"id":"jin2-s-363","q":"バウム・テストを確立した人物は誰か。","answer":"コッホ","aliases":[],"explanation":"コッホによって確立された描画法検査である。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-364","q":"実のなる木を一本描かせる描画法検査は何か。","answer":"バウム・テスト","aliases":["樹木画テスト","バウム"],"explanation":"A4用紙に鉛筆で「（実のなる）木を1本」描かせ、その絵を評定する。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-365","q":"バウム・テストで用いる用紙サイズは何か。","answer":"A4","aliases":[],"explanation":"A4用紙に鉛筆で「（実のなる）木を1本」描かせ、その絵を評定する。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-366","q":"バウム・テストの描画に用いる筆記具は何か。","answer":"鉛筆","aliases":[],"explanation":"A4用紙に鉛筆で「（実のなる）木を1本」描かせ、その絵を評定する。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-367","q":"バウム・テストで描くよう求める対象は何か。","answer":"実のなる木を1本","aliases":[],"explanation":"A4用紙に鉛筆で「（実のなる）木を1本」描かせ、その絵を評定する。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-368","q":"バウムテストについて、描かれた木に投影されると考えるものは何か。","answer":"描き手の自己像","aliases":[],"explanation":"描かれた木には、描き手の自己像が投影されていると考えられている。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-369","q":"バウムテストについて、解釈でまず捉えるものとして挙げられるのは何か。","answer":"全体的な印象","aliases":[],"explanation":"解釈には、全体的な印象をとらえたり、特定の指標や全体の類型化による方法があるが、直感と方法論をうまく補い合いながら被検者への理解を深めていくことが望ましいとされる。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-370","q":"バウムテストについて、印象以外の解釈方法の組合せはどれか。","answer":"特定の指標と全体の類型化","aliases":[],"explanation":"解釈には、全体的な印象をとらえたり、特定の指標や全体の類型化による方法があるが、直感と方法論をうまく補い合いながら被検者への理解を深めていくことが望ましいとされる。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-371","q":"バウムテストについて、被検者理解を深めるため補い合わせる二つは何か。","answer":"直感と方法論","aliases":[],"explanation":"解釈には、全体的な印象をとらえたり、特定の指標や全体の類型化による方法があるが、直感と方法論をうまく補い合いながら被検者への理解を深めていくことが望ましいとされる。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-372","q":"バウムテストは、年齢の面でどのような対象に適用できるか。","answer":"さまざまな年齢層","aliases":[],"explanation":"他の描画法と同様に、さまざまな年齢層や言語表出が困難な者にも適用可能である。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-373","q":"バウムテストについて、言語面で適用可能な対象はどれか。","answer":"言語表出が困難な人","aliases":[],"explanation":"他の描画法と同様に、さまざまな年齢層や言語表出が困難な者にも適用可能である。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-374","q":"バウム・テストの四つの用途の組合せはどれか。","answer":"一般的な人格検査・発達の指標・精神症状のアセスメント・心理療法の効果測定","aliases":[],"explanation":"また、一般的な人格検査としてだけでなく、発達の指標や精神症状などのアセスメント、心理療法の効果測定などに用いられている。","section":"75. バウム（樹木画）テスト"},{"id":"jin2-s-375","q":"HTPテストを考案した人物は誰か。","answer":"バック","aliases":[],"explanation":"バックによって考案された描画法で、被検者の知能や人格のアセスメントを行うものである。","section":"76. HTPテスト"},{"id":"jin2-s-376","q":"家・木・人物を描かせて知能や人格をみる描画法は何か。","answer":"HTPテスト","aliases":["家と樹木と人物描画検査"],"explanation":"バックによって考案された描画法で、被検者の知能や人格のアセスメントを行うものである。","section":"76. HTPテスト"},{"id":"jin2-s-377","q":"HTPテストがアセスメントするものの組合せは何か。","answer":"知能と人格","aliases":[],"explanation":"バックによって考案された描画法で、被検者の知能や人格のアセスメントを行うものである。","section":"76. HTPテスト"},{"id":"jin2-s-378","q":"HTPテストについて、原法で用いる紙はどのようなものか。","answer":"1枚を二つ折りにした4ページの紙","aliases":[],"explanation":"原法では、1枚を2つ折りにした4ページからなる紙に、1ページ目に日付、2ページ目に家、3ページ目に木、4ページ目に人物を描かせる。","section":"76. HTPテスト"},{"id":"jin2-s-379","q":"HTPテストについて、HTP原法の1ページ目に記入するものは何か。","answer":"日付","aliases":[],"explanation":"原法では、1枚を2つ折りにした4ページからなる紙に、1ページ目に日付、2ページ目に家、3ページ目に木、4ページ目に人物を描かせる。","section":"76. HTPテスト"},{"id":"jin2-s-380","q":"HTPテストについて、HTP原法の2ページ目に描くものは何か。","answer":"家","aliases":[],"explanation":"原法では、1枚を2つ折りにした4ページからなる紙に、1ページ目に日付、2ページ目に家、3ページ目に木、4ページ目に人物を描かせる。","section":"76. HTPテスト"},{"id":"jin2-s-381","q":"HTPテストについて、HTP原法の3ページ目に描くものは何か。","answer":"木","aliases":[],"explanation":"原法では、1枚を2つ折りにした4ページからなる紙に、1ページ目に日付、2ページ目に家、3ページ目に木、4ページ目に人物を描かせる。","section":"76. HTPテスト"},{"id":"jin2-s-382","q":"HTPテストについて、HTP原法の4ページ目に描くものは何か。","answer":"人物","aliases":[],"explanation":"原法では、1枚を2つ折りにした4ページからなる紙に、1ページ目に日付、2ページ目に家、3ページ目に木、4ページ目に人物を描かせる。","section":"76. HTPテスト"},{"id":"jin2-s-383","q":"HTPテストについて、描画終了後に行う質問を何というか。","answer":"PDI","aliases":[],"explanation":"また、解釈のための資料として、描画終了後にPDIと呼ばれる質問もなされる。","section":"76. HTPテスト"},{"id":"jin2-s-384","q":"HTPテストについて、HTPで家に投影されると考えるものは何か。","answer":"家庭環境","aliases":[],"explanation":"家には家庭環境、木には自己像、人物には対人関係が投影きれていると考えられている。","section":"76. HTPテスト"},{"id":"jin2-s-385","q":"HTPテストについて、HTPで木に投影されると考えるものは何か。","answer":"自己像","aliases":[],"explanation":"家には家庭環境、木には自己像、人物には対人関係が投影きれていると考えられている。","section":"76. HTPテスト"},{"id":"jin2-s-386","q":"HTPテストについて、HTPで人物に投影されると考えるものは何か。","answer":"対人関係","aliases":[],"explanation":"家には家庭環境、木には自己像、人物には対人関係が投影きれていると考えられている。","section":"76. HTPテスト"},{"id":"jin2-s-387","q":"HTPテストについて、絵の比率や遠近を採点・集計する解釈を何というか。","answer":"形式分析","aliases":[],"explanation":"解釈は、絵の比率や遠近などをスコアリングし集計する形式分析と、描かれた内容や順序、描画態度などを総合的に分析する質的分析から行われる。","section":"76. HTPテスト"},{"id":"jin2-s-388","q":"HTPテストについて、内容・順序・描画態度を総合的にみる解釈を何というか。","answer":"質的分析","aliases":[],"explanation":"解釈は、絵の比率や遠近などをスコアリングし集計する形式分析と、描かれた内容や順序、描画態度などを総合的に分析する質的分析から行われる。","section":"76. HTPテスト"},{"id":"jin2-s-389","q":"HTPテストについて、人物を男女両方描く方法を何というか。","answer":"HTPP","aliases":[],"explanation":"現在では、人物を男女両方描く方法（HTPP）や、1枚の紙に描く方法（S-HTP）などのさまざまな方法が開発されている。","section":"76. HTPテスト"},{"id":"jin2-s-390","q":"HTPテストについて、家・木・人物を1枚の紙に描く方法を何というか。","answer":"S-HTP","aliases":[],"explanation":"現在では、人物を男女両方描く方法（HTPP）や、1枚の紙に描く方法（S-HTP）などのさまざまな方法が開発されている。","section":"76. HTPテスト"},{"id":"jin2-s-391","q":"風景構成法を開発した人物は誰か。","answer":"中井久夫","aliases":[],"explanation":"中井久夫によって開発された。","section":"77. 風景構成法"},{"id":"jin2-s-392","q":"もとは統合失調症患者への治療的接近を探るため開発された方法は何か。","answer":"風景構成法","aliases":[],"explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-s-393","q":"風景構成法について、開発当初の位置づけは何か。","answer":"心理療法","aliases":[],"explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-s-394","q":"風景構成法について、現在の位置づけは何か。","answer":"描画法","aliases":[],"explanation":"もともとは統合失調症患者への治療的接近の可能性を追求するために開発された心理療法であるが、現在では描画法として位置づけられている。","section":"77. 風景構成法"},{"id":"jin2-s-395","q":"風景構成法について、描画に用いる用紙の特徴は何か。","answer":"枠づけされた画用紙","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-396","q":"風景構成法の描画に用いる筆記具は何か。","answer":"サインペン","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-397","q":"風景構成法の大景群を構成する四項目の組合せはどれか。","answer":"川・山・田・道","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-398","q":"風景構成法の中景群を構成する三項目の組合せはどれか。","answer":"家・木・人","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-399","q":"風景構成法の小景群を構成する三項目の組合せはどれか。","answer":"花・動物・石","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-400","q":"風景構成法について、三景群の後に教示されるものは何か。","answer":"描き足りないと思うもの","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-401","q":"風景構成法について、一連の要素を描いた後に行うことは何か。","answer":"彩色","aliases":[],"explanation":"枠づけされた画用紙にサインペンで、川・山・田・道の大景群、家・木・人の中景群、花・動物・石の小景群、その他描き足りないと思うものを、順番に検査者が教示し、被検者に描いてもらい、彩色する。","section":"77. 風景構成法"},{"id":"jin2-s-402","q":"風景構成法について、完成後、検査者と被検者が一緒に行うことは何か。","answer":"作品を鑑賞しながら質問する","aliases":[],"explanation":"完成後は2人で作品を鑑賞しながら質問を行う。","section":"77. 風景構成法"},{"id":"jin2-s-403","q":"風景構成法について、解釈法の確立度はどうか。","answer":"確立されていない","aliases":[],"explanation":"解釈法は確立されてはいないが、箱庭療法の観点が有用であるとされている。","section":"77. 風景構成法"},{"id":"jin2-s-404","q":"風景構成法について、解釈に有用とされる心理療法の観点は何か。","answer":"箱庭療法","aliases":[],"explanation":"解釈法は確立されてはいないが、箱庭療法の観点が有用であるとされている。","section":"77. 風景構成法"},{"id":"jin2-s-405","q":"男児の人物画から知的発達を評価する検査を開発した人物は誰か。","answer":"グッドイナフ","aliases":[],"explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-406","q":"男児の描画から動作性知能を評価する方法は何か。","answer":"グッドイナフ人物画","aliases":[],"explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-407","q":"グッドイナフ人物画について、評価の主目的は何か。","answer":"動作性知能のアセスメント","aliases":[],"explanation":"グッドイナフが開発した動作性知能のアセスメントを目的とした描画法である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-408","q":"グッドイナフ人物画について、健常児への適用年齢はどこからどこまでか。","answer":"3～9歳","aliases":[],"explanation":"適用年齢は健常児の場合、3～9歳である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-409","q":"グッドイナフ人物画知能検査で描くよう求める対象は何か。","answer":"男児","aliases":[],"explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-410","q":"グッドイナフ人物画について、採点項目数はどの程度か。","answer":"50項目程度","aliases":[],"explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-411","q":"グッドイナフ人物画について、採点する人物描画の特徴の組合せはどれか。","answer":"形・比率・明細化","aliases":[],"explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-412","q":"グッドイナフ人物画について、採点結果から評価するものは何か。","answer":"知的水準","aliases":[],"explanation":"男児を描かせ、その人物や部分の形、比率、明細化など50項目程度について採点し知的水準を評価する。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-413","q":"グッドイナフ人物画について、人物描画は、子どもにとってどのような反応を示しやすいか。","answer":"比較的抵抗が少ない","aliases":[],"explanation":"人物像の描画は比較的抵抗が少なく、発達に遅れがみられる子どもにも適用可能である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-414","q":"グッドイナフ人物画について、発達面で適用可能な対象はどれか。","answer":"発達に遅れがみられる子ども","aliases":[],"explanation":"人物像の描画は比較的抵抗が少なく、発達に遅れがみられる子どもにも適用可能である。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-415","q":"グッドイナフ人物画について、動作性検査として関係する二能力は何か。","answer":"目と手の感覚運動協応と空間認知","aliases":[],"explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-416","q":"グッドイナフ人物画について、知的水準をより的確に評価するため組み合わせる検査は何か。","answer":"言語性検査","aliases":[],"explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-417","q":"グッドイナフ人物画について、動作性検査と言語性検査を組み合わせることを何というか。","answer":"テスト・バッテリー","aliases":[],"explanation":"目と手の感覚運動協応や空間認知といった動作性検査であるため、子どもの知的水準をより的確に評価したい場合は、他の言語性検査とテストバッテリーを組むことが望ましいとされる。","section":"78. グッドイナフ人物画"},{"id":"jin2-s-418","q":"一卵性または二卵性の双子を対象に遺伝と環境の影響を調べる方法は何か。","answer":"双生児研究","aliases":["双生児統制法"],"explanation":"双生児研究とは、一卵性または二卵性双生児を対象に行われる研究のことである。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-419","q":"双生児研究について、一卵性双生児が共有する遺伝情報の割合は何％か。","answer":"100％","aliases":[],"explanation":"また、100％同一の遺伝情報をもつ一卵性双生児と比較することで、遺伝と環境の影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-420","q":"双生児研究について、一卵性双生児の間にみられる違いは、主に何の違いによると考えるか。","answer":"環境","aliases":[],"explanation":"一卵性双生児は100％同一の遺伝情報をもつため、双子の間にみられる違いは主に環境の違いによるものと考えられる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-421","q":"双生児研究について、一卵性双生児の片方だけが特定の経験や教育を受けた場合、比較によって何の効果を検討できるか。","answer":"環境要因","aliases":[],"explanation":"例えば、一方だけが特定の経験や教育を受けた場合、その影響を比較することで環境要因の効果を検討できる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-422","q":"双生児研究について、二卵性双生児が共有する遺伝情報の割合は何％か。","answer":"50％","aliases":[],"explanation":"一方で、二卵性双生児は、通常の兄弟姉妹と同様に、遺伝情報が50％しか共有されない。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-423","q":"双生児研究について、二卵性双生児の遺伝情報共有率は、どの関係と同程度か。","answer":"通常の兄弟姉妹","aliases":[],"explanation":"一方で、二卵性双生児は、通常の兄弟姉妹と同様に、遺伝情報が50％しか共有されない。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-424","q":"双生児研究について、二卵性双生児が共有する養育環境は、一卵性双生児と比べてどの程度か。","answer":"同程度","aliases":[],"explanation":"しかし、育った環境は一卵性双生児と同程度共有される。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-425","q":"双生児研究について、二卵性双生児間の違いをみることで主に検討できるものは何か。","answer":"遺伝的影響","aliases":[],"explanation":"そのため、双子間の違いをみることで遺伝的影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-426","q":"双生児研究について、一卵性と二卵性の双子を比較する主な目的は何か。","answer":"遺伝と環境の影響を調べる","aliases":[],"explanation":"また、100％同一の遺伝情報をもつ一卵性双生児と比較することで、遺伝と環境の影響を調べることができる。","section":"79. 双生児研究（双生児統制法）"},{"id":"jin2-s-427","q":"双生児の比較観察から層理論を提唱した人物は誰か。","answer":"ゴットシャルト","aliases":[],"explanation":"これによって、ゴットシャルトは、パーソナリティは、より環境の影響が強い知性的上層と遺伝的規定性が強い内部感情的基底層の２つの主要層から構成されるという層理論を提唱した。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-428","q":"層理論について、思考・判断・意思に対する遺伝の影響は、環境の何倍とされたか。","answer":"2～3倍","aliases":[],"explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-429","q":"層理論について、遺伝が環境の2～3倍影響するとされた特徴の組合せはどれか。","answer":"思考・判断・意思","aliases":[],"explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-430","q":"層理論について、衝動性や感情に対する遺伝の影響は、環境の何倍とされたか。","answer":"5～6倍","aliases":[],"explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-431","q":"層理論について、遺伝が環境の5～6倍影響するとされた特徴の組合せはどれか。","answer":"衝動性と感情","aliases":[],"explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-432","q":"層理論について、根本気分に対する遺伝の影響は、環境の何倍とされたか。","answer":"12倍以上","aliases":[],"explanation":"また、生理的状態と関連深い根本気分は、遺伝は環境の12倍以上の影響を受けるという結果が得られた。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-433","q":"層理論について、根本気分は何と関連が深いとされるか。","answer":"生理的状態","aliases":[],"explanation":"また、生理的状態と関連深い根本気分は、遺伝は環境の12倍以上の影響を受けるという結果が得られた。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-434","q":"層理論について、環境の影響がより強い人格の層はどれか。","answer":"知性的上層","aliases":[],"explanation":"これによって、ゴットシャルトは、パーソナリティは、より環境の影響が強い知性的上層と遺伝的規定性が強い内部感情的基底層の２つの主要層から構成されるという層理論を提唱した。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-435","q":"層理論について、遺伝的規定性がより強い人格の層はどれか。","answer":"内部感情的基底層","aliases":[],"explanation":"これによって、ゴットシャルトは、パーソナリティは、より環境の影響が強い知性的上層と遺伝的規定性が強い内部感情的基底層の２つの主要層から構成されるという層理論を提唱した。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-436","q":"層理論で人格を構成する主要層はいくつか。","answer":"2つ","aliases":[],"explanation":"これによって、ゴットシャルトは、パーソナリティは、より環境の影響が強い知性的上層と遺伝的規定性が強い内部感情的基底層の２つの主要層から構成されるという層理論を提唱した。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-437","q":"層理論について、ゴットシャルトが用いた研究法は何か。","answer":"双生児の比較観察研究","aliases":[],"explanation":"双生児の比較観察研究によって、思考、判断、意思などは、遺伝が環境の２～３倍の影響を受け、衝動性や感情は、遺伝が環境の５～6倍の影響を受ける。","section":"80. 層理論（ゴットシャルト）"},{"id":"jin2-s-438","q":"同一性・防衛・現実吟味から人格構造を捉えた人物は誰か。","answer":"カーンバーグ","aliases":[],"explanation":"カーンバーグによって提唱された、人格構造を同一性の統合度、防衛操作、現実吟味からとらえる考え方である。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-439","q":"カーンバーグが人格構造を捉える三観点の組合せはどれか。","answer":"同一性の統合度・防衛操作・現実吟味","aliases":[],"explanation":"カーンバーグによって提唱された、人格構造を同一性の統合度、防衛操作、現実吟味からとらえる考え方である。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-440","q":"カーンバーグの人格構造論について、同一性の統合度を構成する二つの内容は何か。","answer":"自我境界と自己・他者表象の統合程度","aliases":[],"explanation":"同一性の統合度とは、自他の表象を含んだ自他の区別である自我境界や、自己や他者の表象の統合の程度を指す。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-441","q":"カーンバーグの人格構造論について、自他の区別にかかわる境界を何というか。","answer":"自我境界","aliases":[],"explanation":"同一性の統合度とは、自他の表象を含んだ自他の区別である自我境界や、自己や他者の表象の統合の程度を指す。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-442","q":"現実適応や葛藤処理に用いる防衛機制を、人格構造論では何というか。","answer":"防衛操作","aliases":[],"explanation":"防衛操作とは、現実適応や葛藤処理のために用いられる防衛機制のことである。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-443","q":"カーンバーグの人格構造論について、現実世界を正しく認識し判断する能力を何というか。","answer":"現実吟味","aliases":[],"explanation":"現実吟味とは、現実世界を正しく認識して判断する能力をいう。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-444","q":"カーンバーグの三つの人格構造の組合せはどれか。","answer":"神経症人格構造・境界性人格構造・精神病人格構造","aliases":[],"explanation":"これらの観点から、神経症人格構造、境界性人格構造、精神病人格構造に分類した。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-445","q":"カーンバーグの人格構造論について、自己表象と他者表象が明確に区別され、矛盾部分も統合されている構造はどれか。","answer":"神経症人格構造","aliases":[],"explanation":"①神経症人格構造→自己表象と他者表象が明確に区別され、また矛盾した部分も統合されており、抑圧や反動形成、合理化などの高次の防衛機制を用い、現実を適切に認識している。","section":"81. カーンバーグの人格構造論"},{"id":"jin2-s-446","q":"カーンバーグの人格構造論について、自己表象と他者表象は区別されるが、矛盾部分が分離したままの構造はどれか。","answer":"境界性人格構造","aliases":[]," if(localStorage.getItem(CONTENT_REVISION_KEY)!==CONTENT_REVISION){for(const id of ["jin2-s-094","jin2-s-106","jin2-s-453","jin2-s-477","jin2-s-018","jin2-s-013","jin2-s-037","jin2-s-040","jin2-s-044","jin2-s-090","jin2-s-093","jin2-s-105","jin2-s-128","jin2-s-232","jin2-s-379","jin2-s-461","jin2-s-468","jin2-s-476","jin2-s-030","jin2-s-011","jin2-s-017","jin2-s-089","jin2-s-097","jin2-s-218","jin2-s-275","jin2-s-372","jin2-s-467","jin2-s-470","jin2-s-008","jin2-s-031","jin2-s-066","jin2-s-068","jin2-s-070","jin2-s-073","jin2-s-071","jin2-s-087","jin2-s-088","jin2-s-118","jin2-s-122","jin2-s-170","jin2-s-181","jin2-s-229","jin2-s-261","jin2-s-273","jin2-s-276","jin2-s-350","jin2-s-373","jin2-s-374","jin2-s-420","jin2-s-421","jin2-s-426","jin2-s-466","jin2-s-472","jin2-s-473"])delete records[id];localStorage.setItem(CONTENT_REVISION_KEY,CONTENT_REVISION);localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function revealAnswer(){
  const i=currentIndex();if(i===null||state.revealed)return;state.revealed=true;const q=questions[i];const typed=$('response').value.trim();
  $('feedback').innerHTML=`<div class="answerbox neutral"><b>正答</b><div>${escapeHtml(q.answer)}</div>${typed?`<div class="source">あなたの回答：${escapeHtml(typed)}</div>`:''}<div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('markrow').classList.remove('hidden');$('reveal').disabled=true;$('response').disabled=true;
}
function markShort(ok){if(state.answered)return;const i=currentIndex();if(i===null)return;state.answered=true;record(i,ok);$('markrow').classList.add('hidden');$('retry').disabled=false;$('history').textContent=historyText(rec(i));const box=$('feedback').firstElementChild;if(box){box.classList.remove('neutral');box.classList.add(ok?'ok':'bad');box.insertAdjacentHTML('afterbegin',`<b>${ok?'正解として記録しました':'不正解として記録しました'}</b>`);}}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('response').value='';$('response').disabled=true;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=true;$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;$('response').value='';$('response').disabled=false;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=false;$('retry').disabled=true;
}
render();
</script></body></html>
