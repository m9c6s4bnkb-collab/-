  function matches(s, filter) {

    if (filter === 'last-wrong') return s.last === false;
    if (filter === 'ever-wrong') return s.wrong > 0;
    if (filter === 'wrong-1') return s.wrong === 1;
    if (filter === 'wrong-2') return s.wrong === 2;
    if (filter === 'wrong-3') return s.wrong >= 3;
    return true;
  }
  function shuffle(items, rng = Math.random) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
  function select(bank, history, domain, filter, order, rng) {
    const result = bank.filter(q => (!domain || domain === 'all' || q.domain === domain) && matches(stat(history, q.id), filter)).map(q => q.id);
    return order === 'random' ? shuffle(result, rng) : result;
  }
  function summarize(history, ids) {
    let correct = 0, wrong = 0, answered = 0;
    for (const id of ids) {
      const x = stat(history, id);
      correct += x.correct; wrong += x.wrong;
      if (x.correct + x.wrong > 0) answered++;
    }
    return {correct, wrong, answered, attempts: correct + wrong, rate: correct + wrong ? Math.round(correct / (correct + wrong) * 100) : null};
  }
  return {normalize, isCorrect, stat, record, amend, matches, shuffle, select, summarize};
});

<script>(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  try {
    const Core = window.MedQuizCore;
    const data = JSON.parse($('questionBank').textContent);
    const bank = data.questions;
    const ids = bank.map(q => q.id);
    const lookup = new Map(bank.map(q => [q.id, q]));
    const mode = document.body.dataset.mode === 'qa' ? 'qa' : 'choice';
    const label = mode === 'qa' ? '一問一答' : '4択';
    const prefix = 'psych-quiz:medical:2026-09-02:v1:';
    const historyKey = prefix + 'history:' + mode;
    const prefsKey = prefix + 'prefs:' + mode;
    const foldedKey = prefix + 'menu-folded';
    let writable = true;
    let history = {};
    let round = {ids: [], index: 0, results: new Map()};
    let currentResult = null;
    let displayedOptions = [];
    let composing = false;

    function storageIssue(message) {
      writable = false;
      $('saveNotice').hidden = false;
      $('saveNotice').textContent = message;
    }
    function readHistory() {
      if (!writable) return history;
      try {
        const raw = localStorage.getItem(historyKey);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.schema !== 1 || !parsed.records || typeof parsed.records !== 'object' || Array.isArray(parsed.records)) throw new Error('Invalid history');
        const clean = {};
        for (const id of Object.keys(parsed.records)) {
          if (/^med-\d{2}-\d{2}$/.test(id)) clean[id] = Core.stat(parsed.records, id);
        }
        return clean;
      } catch (error) {
        storageIssue('履歴を読み込めませんでした。この画面では学習できますが、閉じる前にSafariなどの通常のブラウザで開き直してください。');
        return history;
      }
    }
    function saveHistory() {
      if (!writable) return;
      try {
        localStorage.setItem(historyKey, JSON.stringify({schema: 1, subject: 'medical-psychology', mode, records: history}));
      } catch (error) {
        storageIssue('履歴を保存できませんでした。この画面での学習は続けられます。ブラウザの保存設定や空き容量を確認してください。');
      }
    }
    function getPrefs() {
      try { return JSON.parse(localStorage.getItem(prefsKey) || '{}') || {}; }
      catch (error) { return {}; }
    }
    function savePrefs() {
      try { localStorage.setItem(prefsKey, JSON.stringify({domain: $('domain').value, filter: $('filter').value, order: $('order').value})); }
      catch (error) { /* The history path reports persistent storage errors. */ }
    }
    function setMenu(folded, save) {
      $('menu').hidden = folded;
      $('toggleMenu').textContent = folded ? 'メニューを表示' : 'メニューを隠す';
      $('toggleMenu').setAttribute('aria-expanded', String(!folded));
      if (save) {
        try { localStorage.setItem(foldedKey, folded ? '1' : '0'); }
        catch (error) { /* A preference failure must not prevent practice. */ }
      }
    }
    function currentQuestion() { return lookup.get(round.ids[round.index]); }
    function roundNumbers() {
      const values = Array.from(round.results.values());
      return {answered: values.length, correct: values.filter(Boolean).length, skipped: round.ids.length - values.length};
    }
    function updateStats() {
      const s = Core.summarize(history, ids);
      $('totalCorrect').textContent = String(s.correct);
      $('totalWrong').textContent = String(s.wrong);
      $('totalRate').textContent = s.rate === null ? '—' : s.rate + '%';
      $('totalAnswered').textContent = String(s.answered);
    }
    function updateProgress(finished) {
      const r = roundNumbers();
      $('progress').textContent = label + ' ' + (finished ? round.ids.length : round.index + 1) + ' / ' + round.ids.length;
      $('roundScore').textContent = '今回 ' + r.correct + '問正解 / ' + r.answered + '問回答';
      const done = finished ? round.ids.length : round.index + (currentResult ? 1 : 0);
      const percent = round.ids.length ? Math.round(done / round.ids.length * 100) : 0;
      $('progressFill').style.width = percent + '%';
      $('progressBar').setAttribute('aria-valuenow', String(percent));
    }
    function focusQuestion() {
      try { $('question').focus({preventScroll: true}); } catch (error) { $('question').focus(); }
      if (typeof $('questionCard').scrollIntoView === 'function') $('questionCard').scrollIntoView({block: 'start', behavior: 'auto'});
    }
    function renderQuestion(focus) {
      if (round.index >= round.ids.length) { finish(); return; }
      const q = currentQuestion();
      currentResult = null;
      composing = false;
      displayedOptions = [];
      $('endCard').hidden = true;
      $('questionCard').hidden = false;
      $('studyProgress').hidden = false;
      $('question').textContent = q.q;
      $('feedback').hidden = true;
      $('sourceNote').hidden = true;
      $('sourceNote').replaceChildren();
      $('fixGrade').hidden = true;
      $('inputError').hidden = true;
      $('inputError').textContent = '';
      $('answerInput').value = '';
      $('answerInput').disabled = false;
      $('answerInput').removeAttribute('aria-invalid');
      $('checkAnswer').disabled = false;
      $('revealQa').disabled = false;
      $('revealChoice').disabled = false;
      $('again').hidden = true;
      $('skip').hidden = false;
      $('next').hidden = true;
      $('choices').hidden = mode !== 'choice';
      $('choiceReveal').hidden = mode !== 'choice';
      $('qaForm').hidden = mode !== 'qa';
      $('choices').replaceChildren();
      if (mode === 'choice') {
        const choices = Core.shuffle([{text: q.a[0], correct: true}].concat(q.d.map(text => ({text, correct: false}))));
        choices.forEach((item, index) => {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'option';
          const letter = document.createElement('span'); letter.className = 'letter'; letter.textContent = 'ABCD'[index]; letter.setAttribute('aria-hidden', 'true');
          const text = document.createElement('span'); text.className = 'optiontext'; text.textContent = item.text;
          button.append(letter, text);
          const option = {button, correct: item.correct, text: item.text};
          displayedOptions.push(option);
          button.addEventListener('click', () => submit(item.correct, 'choice', item.text));
          $('choices').appendChild(button);
        });
      }
      updateProgress(false);
      if (focus) focusQuestion();
    }
    function renderFeedback() {
      const q = currentQuestion();
      const correct = currentResult.correct;
      $('feedback').classList.toggle('incorrect', !correct);
      $('resultTitle').textContent = correct ? (currentResult.amended ? '正解に修正しました' : '正解！') : '不正解 · ここを確認しよう';
      $('correctAnswer').textContent = '正解：' + q.a[0];
      $('explanation').textContent = q.e;
      const t = data.topics[q.topic];
      $('source').textContent = '出典：' + data.source + ' / PDF p.' + t.pages + ' / 項目' + q.topic + '「' + t.title + '」';
      const note = data.notes[q.id];
      $('sourceNote').replaceChildren();
      $('sourceNote').hidden = !note;
      if (note) {
        const heading = document.createElement('strong'); heading.textContent = '資料の補足';
        const paragraph = document.createElement('p'); paragraph.textContent = note.text;
        $('sourceNote').append(heading, paragraph);
        note.links.forEach(link => {
          if (!/^https:\/\//.test(link.url)) return;
          const a = document.createElement('a'); a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = link.title;
          $('sourceNote').appendChild(a);
        });
      }
      const s = Core.stat(history, q.id);
      $('attempts').textContent = 'この問題の累計：正解 ' + s.correct + '回 / 誤答 ' + s.wrong + '回';
      $('fixGrade').hidden = !(mode === 'qa' && !correct && currentResult.kind === 'input');
      $('feedback').hidden = false;
      $('again').hidden = false;
      $('skip').hidden = true;
      $('next').hidden = false;
      $('next').textContent = round.index === round.ids.length - 1 ? '今回の結果を見る' : '次の問題へ';
    }
    function newAttemptId() {
      return (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }
    function submit(correct, kind, given) {
      if (currentResult || !currentQuestion()) return;
      const q = currentQuestion();
      currentResult = {correct: !!correct, kind, given, attemptId: newAttemptId(), amended: false};
      history = readHistory();
      history = Core.record(history, q.id, currentResult.correct, currentResult.attemptId, Date.now());
      saveHistory();
      round.results.set(q.id, currentResult.correct);
      $('answerInput').disabled = true;
      $('checkAnswer').disabled = true;
      $('revealQa').disabled = true;
      $('revealChoice').disabled = true;
      $('inputError').hidden = true;
      if (mode === 'qa') $('answerInput').blur();
      displayedOptions.forEach(option => {
        option.button.disabled = true;
        const chosen = kind === 'choice' && given === option.text;
        if (option.correct || chosen) {
          option.button.classList.add(option.correct ? 'right' : 'wrong');
          const mark = document.createElement('span'); mark.className = 'choiceMark'; mark.textContent = option.correct ? '✓ 正解' : '×';
          option.button.appendChild(mark);
        }
      });
      renderFeedback(); updateStats(); updateProgress(false);
      if (typeof $('feedback').scrollIntoView === 'function') $('feedback').scrollIntoView({block: 'nearest', behavior: 'auto'});
    }
    function begin(questionIds, focus) {
      round = {ids: questionIds.slice(), index: 0, results: new Map()};
      currentResult = null;
      $('restart').disabled = round.ids.length === 0;
      updateStats();
      if (!round.ids.length) {
        $('questionCard').hidden = true; $('studyProgress').hidden = true; $('endCard').hidden = false;
        $('endTitle').textContent = 'この条件の問題はありません';
        $('endText').textContent = '範囲や復習条件を変えるか、全問題から始めてね。';
        $('repeatRound').hidden = true; $('retryWrong').hidden = true; $('retrySkipped').hidden = true;
        return;
      }
      renderQuestion(focus);
    }
    function startFromFilters(focus) {
      history = readHistory();
      savePrefs();
      begin(Core.select(bank, history, $('domain').value, $('filter').value, $('order').value), focus);
    }
    function ordered(ids) { return $('order').value === 'random' ? Core.shuffle(ids) : ids.slice(); }
    function repeat() { if (round.ids.length) begin(ordered(round.ids), true); else startFromFilters(true); }
    function advance() { round.index++; renderQuestion(true); }
    function finish() {
      const r = roundNumbers();
      $('questionCard').hidden = true; $('endCard').hidden = false;
      $('endTitle').textContent = 'このセットが終わったよ！';
      const rate = r.answered ? Math.round(r.correct / r.answered * 100) + '%' : '—';
      $('endText').textContent = '正解 ' + r.correct + '問 / 回答 ' + r.answered + '問（正答率 ' + rate + '）\nあとでにした問題 ' + r.skipped + '問';
      $('repeatRound').hidden = false;
      $('retryWrong').hidden = r.answered === r.correct;
      $('retrySkipped').hidden = r.skipped === 0;
      updateProgress(true); updateStats();
      try { $('endTitle').focus({preventScroll: true}); } catch (error) { $('endTitle').focus(); }
      if (typeof $('endCard').scrollIntoView === 'function') $('endCard').scrollIntoView({block: 'start', behavior: 'auto'});
    }

    document.title = '医療心理学｜' + label + ' ' + bank.length + '問';
    $(mode === 'qa' ? 'qaTab' : 'choiceTab').setAttribute('aria-current', 'page');
    $('countLine').textContent = label + ' 全' + bank.length + '問 · 資料75項目';
    for (const [key, title] of Object.entries(data.domains)) {
      const option = document.createElement('option'); option.value = key; option.textContent = title;
      $('domain').appendChild(option);
    }
    const prefs = getPrefs();
    for (const key of ['domain', 'filter', 'order']) {
      if (prefs[key] && Array.from($(key).options).some(o => o.value === prefs[key])) $(key).value = prefs[key];
    }
    let folded = false;
    try { folded = localStorage.getItem(foldedKey) === '1'; } catch (error) { /* default expanded */ }
    setMenu(folded, false);
    $('toggleMenu').addEventListener('click', () => setMenu(!$('menu').hidden, true));
    $('applyFilters').addEventListener('click', () => startFromFilters(true));
    $('restart').addEventListener('click', repeat);
    for (const id of ['domain', 'filter', 'order']) $(id).addEventListener('change', () => startFromFilters(false));
    $('qaForm').addEventListener('submit', event => {
      event.preventDefault();
      if (composing || currentResult) return;
      const value = $('answerInput').value;
      if (!Core.normalize(value)) {
        $('inputError').textContent = '答えを入力するか、「わからない」を選んでね。';
        $('inputError').hidden = false;
        $('answerInput').setAttribute('aria-invalid', 'true');
        $('answerInput').focus(); return;
      }
      submit(Core.isCorrect(value, currentQuestion().a), 'input', value);
    });
    $('answerInput').addEventListener('compositionstart', () => { composing = true; });
    $('answerInput').addEventListener('compositionend', () => { composing = false; });
    $('answerInput').addEventListener('keydown', event => {
      if (event.key === 'Enter' && (event.isComposing || composing || event.keyCode === 229)) event.preventDefault();
    });
    $('answerInput').addEventListener('input', () => { $('inputError').hidden = true; $('answerInput').removeAttribute('aria-invalid'); });
    $('revealQa').addEventListener('click', () => submit(false, 'reveal', ''));
    $('revealChoice').addEventListener('click', () => submit(false, 'reveal', ''));
    $('again').addEventListener('click', () => renderQuestion(true));
    $('next').addEventListener('click', advance);
    $('skip').addEventListener('click', advance);
    $('fixGrade').addEventListener('click', () => {
      if (!currentResult || currentResult.correct || currentResult.kind !== 'input') return;
      history = readHistory();
      const next = Core.amend(history, currentQuestion().id, currentResult.attemptId);
      if (!next) {
        $('attempts').textContent = '別の画面でこの問題の履歴が更新されました。解き直して答えを確認してください。';
        $('fixGrade').hidden = true; return;
      }
      history = next; currentResult.correct = true; currentResult.amended = true;
      round.results.set(currentQuestion().id, true);
      saveHistory(); renderFeedback(); updateStats(); updateProgress(false);
    });
    $('repeatRound').addEventListener('click', repeat);
    $('retryWrong').addEventListener('click', () => begin(ordered(round.ids.filter(id => round.results.get(id) === false)), true));
    $('retrySkipped').addEventListener('click', () => begin(ordered(round.ids.filter(id => !round.results.has(id))), true));
    $('allQuestions').addEventListener('click', () => { $('domain').value = 'all'; $('filter').value = 'all'; startFromFilters(true); });
    window.addEventListener('storage', event => {
      if (event.key === historyKey) { history = readHistory(); updateStats(); }
    });
    startFromFilters(false);
  } catch (error) {
    $('question').textContent = '問題を読み込めませんでした。ファイルを保存し直して、ブラウザで開いてください。';
    if (window.console && console.error) console.error(error);
  }
})();
