const $=id=>document.getElementById(id);
const POS=['名詞','動詞','形容詞','副詞','前置詞','接続詞'];
let current=null,currentMode=null,session={answered:0,correct:0};
let stats=JSON.parse(localStorage.getItem(STORAGE)||'{}');
function keyOf(x){return x.section+'|'+(x.related?'R':'M')+'|'+x.en+'|'+x.ja}
function getStat(x){return stats[keyOf(x)]||{wrong:0,correct:0}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(stats))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){
 let arr=WORDS.slice(),s=$('scope').value;
 if(s==='main')arr=arr.filter(x=>!x.related);
 if(s==='related')arr=arr.filter(x=>x.related);
 if(s==='score')arr=arr.filter(x=>x.section==='Score 600');
 if(s==='part1')arr=arr.filter(x=>x.section==='Part 1');
 if(s==='unanswered')arr=arr.filter(x=>{const st=getStat(x);return st.correct===0&&st.wrong===0});
 if(s==='wrong'||s==='wrong1')arr=arr.filter(x=>getStat(x).wrong>=1);
 if(s==='wrong2')arr=arr.filter(x=>getStat(x).wrong>=2);
 return arr;
}
function updateStats(){const p=filtered();$('pool').textContent=p.length;$('answered').textContent=session.answered;$('correct').textContent=session.correct;$('rate').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'0%'}
function sample(arr,n,exclude){let a=arr.filter(x=>x!==exclude).slice().sort(()=>Math.random()-.5);return a.slice(0,n)}
function nextQ(){
 currentMode=$('mode').value;const p=filtered();updateStats();
 if(!p.length){$('word').textContent='該当する問題がありません';$('body').innerHTML='';$('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');return}
 current=p[Math.floor(Math.random()*p.length)];
 $('word').textContent=current.en;$('kind').textContent=currentMode.startsWith('ja')?'英語 → 日本語':'英語 → 品詞';
 $('rel').textContent=current.section+'｜'+(current.related?'関連語・派生語':'見出し語');
 $('miss').textContent='誤答 '+getStat(current).wrong+'回';
 $('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');renderBody();
}
function mark(ok){let s=getStat(current);if(ok)s.correct++;else s.wrong++;stats[keyOf(current)]=s;save();session.answered++;if(ok)session.correct++;updateStats();$('miss').textContent='誤答 '+s.wrong+'回';$('next').classList.remove('hidden')}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
$('start').onclick=nextQ;$('shuffle').onclick=nextQ;$('next').onclick=nextQ;$('scope').onchange=updateStats;$('mode').onchange=()=>{if(current)nextQ()};
$('reset').onclick=()=>{if(confirm('学習データをすべて消しますか？')){stats={};session={answered:0,correct:0};save();updateStats();nextQ()}};
let menuIsHidden=localStorage.getItem(MENUKEY)==='1';
function applyMenuVisibility(){['introCard','menuCard','statsCard'].forEach(id=>$(id).classList.toggle('menuHidden',menuIsHidden));$('menuToggle').textContent=menuIsHidden?'メニューを表示':'メニューを非表示'}
$('menuToggle').onclick=()=>{menuIsHidden=!menuIsHidden;localStorage.setItem(MENUKEY,menuIsHidden?'1':'0');applyMenuVisibility()};applyMenuVisibility();updateStats();

function renderBody(){
 const b=$('body');b.innerHTML='';
 if(currentMode==='ja4'){
  let opts=[current,...sample(WORDS,3,current)].sort(()=>Math.random()-.5);let wrap=document.createElement('div');wrap.className='choices';
  opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=x.ja;btn.onclick=()=>grade(btn,x===current,wrap);wrap.appendChild(btn)});b.appendChild(wrap);
 }else{
  let box=document.createElement('div');box.className='posgrid';POS.forEach(p=>{let lab=document.createElement('label');lab.className='posopt';lab.innerHTML=`<input type="checkbox" value="${p}">${p}`;box.appendChild(lab)});b.appendChild(box);$('check').classList.remove('hidden');$('check').onclick=checkPOS;
 }
}
function grade(btn,ok,wrap){[...wrap.children].forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');if(!ok)[...wrap.children].find(x=>x.textContent===current.ja)?.classList.add('correct');showFeedback(ok,'正解：'+current.ja);mark(ok)}
function checkPOS(){let selected=[...document.querySelectorAll('#body input:checked')].map(x=>x.value).sort(),ans=current.pos.slice().sort();let ok=selected.length===ans.length&&selected.every((x,i)=>x===ans[i]);showFeedback(ok,'正解：'+ans.join('・'));mark(ok);$('check').classList.add('hidden');document.querySelectorAll('#body input').forEach(x=>x.disabled=true)}
