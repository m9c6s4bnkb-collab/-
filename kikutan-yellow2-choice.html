const POS=['名詞','動詞','形容詞','副詞','前置詞','接続詞'];

function getStat(x){return stats[keyOf(x)]||{wrong:0,correct:0}}
function filtered(){

 return arr;
}

function mark(ok){let s=getStat(current); if(ok)s.correct++;else s.wrong++; stats[keyOf(current)]=s; save(); session.answered++; if(ok)session.correct++; updateStats(); $('miss').textContent='誤答 '+s.wrong+'回'; $('next').classList.remove('hidden')}
function grade(btn,ok,wrap){[...wrap.children].forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');if(!ok){[...wrap.children].find(x=>x.textContent===current.ja)?.classList.add('correct')} showFeedback(ok,`正解：${current.ja}`);mark(ok)}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
function revealJA(){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>答え：</strong>${esc(current.ja)}<div class="actions"><button type="button" class="btn primary" id="selfYes">正解にする</button><button type="button" class="btn danger" id="selfNo">不正解にする</button></div>`;$('check').classList.add('hidden');$('selfYes').onclick=()=>selfMark(true);$('selfNo').onclick=()=>selfMark(false)}
