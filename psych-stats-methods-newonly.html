<script>const DATA={"mc":[{"q":"SPSSの尖度がHADの尖度より3小さく表示される理由として資料にある説明はどれか。","options":["SPSSでは尖度から単純に3を引いているため","HADでは尖度を3倍しているため","HADでは歪度を尖度に加えているため","SPSSでは標準偏差を加えているため"],"answer":0,"explanation":"正解：SPSSでは尖度から単純に3を引いているため","source":"分布の形"},{"q":"資料では、正規性を判断するとき歪度・尖度と併せて何を確認することが勧められているか。","options":["散布図","回帰直線","箱ひげ図だけ","ヒストグラム"],"answer":3,"explanation":"正解：ヒストグラム","source":"分布の形"},{"q":"データ解析で研究者が本来知りたいものとして資料が強調しているのはどれか。","options":["標本の値そのものではなく母集団における傾向","回答者個人の順位だけ","標本平均だけ","標本分散だけ"],"answer":0,"explanation":"正解：標本の値そのものではなく母集団における傾向","source":"標本理論"},{"q":"母平均は資料では何を用いて推測すると説明されているか。","options":["最頻値","相関係数","不偏分散","標本平均"],"answer":3,"explanation":"正解：標本平均","source":"標本理論"},{"q":"同じ母集団から標本を取り直すたび標本統計量が少しずつ変わる主な理由はどれか。","options":["母数そのものが毎回変わるため","尺度水準が毎回変わるため","有意水準が変化するため","サンプリングに伴う標本誤差"],"answer":3,"explanation":"正解：サンプリングに伴う標本誤差","source":"標本理論"},{"q":"資料では、母集団における値である母数についてどのように説明されているか。","options":["標本ごとに母数も変化する","標本が変わっても母数自体は一定である","母数は標本平均と必ず同じ","母数は標本数に比例する"],"answer":1,"explanation":"正解：標本が変わっても母数自体は一定である","source":"標本理論"},{"q":"標準誤差は、同じような調査を繰り返したときの何を表す指標か。","options":["母数そのものがどの程度変動するか","個々人の得点が尺度内でどの程度変動するか","標本統計量が調査ごとにどの程度変動するか","質問項目数がどの程度変動するか"],"answer":2,"explanation":"正解：標本統計量が調査ごとにどの程度変動するか","source":"標準誤差"},{"q":"標準誤差は別の言い方をすると何の標準偏差と考えられるか。","options":["質問項目の標準偏差","標本統計量たちの標準偏差","順位の標準偏差","母集団の個々の値の標準偏差"],"answer":1,"explanation":"正解：標本統計量たちの標準偏差","source":"標準誤差"},{"q":"資料では標準誤差の考え方は平均値以外の何にも適用できるとされているか。","options":["研究仮説だけ","自由記述だけ","相関係数など、さまざまな統計量","名義尺度だけ"],"answer":2,"explanation":"正解：相関係数など、さまざまな統計量","source":"標準誤差"},{"q":"仮に多数の標本平均を得られた場合、それらの平均は何に一致すると資料で説明されているか。","options":["母分散","標準誤差","有意水準","母平均"],"answer":3,"explanation":"正解：母平均","source":"標本理論"},{"q":"相関係数の効果量基準について資料が注意していることはどれか。","options":["標本数に関係なく因果を示す","必ず全研究で同じ基準を使う","r=.30未満は無相関と断定する","絶対的な基準ではなく目安である"],"answer":3,"explanation":"正解：絶対的な基準ではなく目安である","source":"相関"},{"q":"相関係数が0に近くても2変数に関連が存在しうる例として資料が挙げるのはどれか。","options":["同じ変数同士の関係","名義尺度の一致","二次曲線的な関係","完全な直線関係"],"answer":2,"explanation":"正解：二次曲線的な関係","source":"相関"},{"q":"相関係数が主として表すのはどのような関連か。","options":["因果関係","直線的な関連","群間平均差","あらゆる非線形関係"],"answer":1,"explanation":"正解：直線的な関連","source":"相関"},{"q":"相関分析の結果報告について、資料では通常省略してよいとされているものはどれか。","options":["p値","相関係数r","検定統計量t値と自由度","変数名"],"answer":2,"explanation":"正解：検定統計量t値と自由度","source":"結果報告"},{"q":"心理学研究で相関を確認する組合せとして資料に挙げられているものはどれか。","options":["独立変数と研究者名","文献名とページ数","主観報告と行動指標・生理指標","有意水準と標本数"],"answer":2,"explanation":"正解：主観報告と行動指標・生理指標","source":"相関"},{"q":"尺度得点同士の相関で、資料が尺度得点の例として示しているものはどれか。","options":["最頻値だけ","順位だけ","自由記述の文字数だけ","尺度の合計得点または平均得点"],"answer":3,"explanation":"正解：尺度の合計得点または平均得点","source":"相関"},{"q":"尺度が複数項目で構成されていても測定精度を高めるために必要だと資料が強調する条件はどれか。","options":["項目間で測定対象に一貫性があること","回答段階を2件法にすること","すべて逆転項目にすること","項目数だけを増やすこと"],"answer":0,"explanation":"正解：項目間で測定対象に一貫性があること","source":"尺度構成"},{"q":"質問項目を選定するときの基準として資料に含まれないものはどれか。","options":["回答形式に合う尋ね方か","回答者が回答可能な内容か","人によって違う解釈をされる言葉がないか","研究者が答えを予測しやすいか"],"answer":3,"explanation":"正解：研究者が答えを予測しやすいか","source":"質問項目"},{"q":"ダブル・バーレルの問題とは、質問項目作成上どのような問題か。","options":["同じ尺度を2回実施する問題","選択肢を2つだけにする問題","回答者を2群に分ける問題","1つの項目で複数の内容を同時に尋ねてしまう問題"],"answer":3,"explanation":"正解：1つの項目で複数の内容を同時に尋ねてしまう問題","source":"質問項目"},{"q":"評定法がよく用いられる理由として資料に挙げられているものはどれか。","options":["無回答が絶対に生じない","必ず因果関係を証明できる","情報量が多く、分析しやすい","標本抽出が不要になる"],"answer":2,"explanation":"正解：情報量が多く、分析しやすい","source":"質問紙"},{"q":"評定法の利点として資料にあるものはどれか。","options":["回答者数が不要になる","信頼性が必ず1になる","他の回答形式から得られたデータへ容易に変換可能である","尺度水準が必ず比率尺度になる"],"answer":2,"explanation":"正解：他の回答形式から得られたデータへ容易に変換可能である","source":"質問紙"},{"q":"人生満足度尺度の回答形式として資料に示されているのは何件法か。","options":["5件法","7件法","4件法","10件法"],"answer":1,"explanation":"正解：7件法","source":"質問紙"},{"q":"単回帰分析で用いる基本的な回帰式として資料に示されるものはどれか。","options":["y = x² + a","F = t/r","r = x + y","y = bx + a"],"answer":3,"explanation":"正解：y = bx + a","source":"回帰分析"},{"q":"回帰分析における残差とは何か。","options":["説明変数と目的変数の相関係数","切片と傾きの積","目的変数の平均値","回帰式による予測値と実際の値との差"],"answer":3,"explanation":"正解：回帰式による予測値と実際の値との差","source":"回帰分析"},{"q":"回帰直線を求める際、残差をそのまま足さず二乗する理由はどれか。","options":["正負の残差が相殺されるのを防ぐため","切片を0にするため","標本数を増やすため","相関を必ず正にするため"],"answer":0,"explanation":"正解：正負の残差が相殺されるのを防ぐため","source":"回帰分析"},{"q":"資料が示す回帰分析の目的の1つはどれか。","options":["尺度項目を半分にすること","参加者を無作為割り当てすること","研究者が考えたモデルがどの程度データを説明するか評価すること","変数を必ず正規分布にすること"],"answer":2,"explanation":"正解：研究者が考えたモデルがどの程度データを説明するか評価すること","source":"回帰分析"},{"q":"資料が示す回帰分析のもう1つの主要目的はどれか。","options":["実験順序を決めること","質問紙の回答段階を決めること","個々の説明変数が目的変数の予測にどの程度役立つか知ること","標本平均を母平均と同一にすること"],"answer":2,"explanation":"正解：個々の説明変数が目的変数の予測にどの程度役立つか知ること","source":"回帰分析"},{"q":"決定係数R²が表すものとして適切なのはどれか。","options":["目的変数のばらつきのうちモデルが説明する割合","参加者の脱落率","尺度の逆転項目率","説明変数の個数"],"answer":0,"explanation":"正解：目的変数のばらつきのうちモデルが説明する割合","source":"回帰分析"},{"q":"決定係数R²が取り得る範囲として資料に示されているのはどれか。","options":["0〜1","−∞〜∞","−1〜1","0〜100"],"answer":0,"explanation":"正解：0〜1","source":"回帰分析"},{"q":"標準化回帰係数βを用いる主な理由として資料にあるものはどれか。","options":["切片を必ず1にするため","残差を0にするため","標本数を統一するため","測定単位による回帰係数の大きさの違いを共通基準で比較するため"],"answer":3,"explanation":"正解：測定単位による回帰係数の大きさの違いを共通基準で比較するため","source":"回帰分析"},{"q":"標準化回帰係数βは資料では何に相当するものと説明されているか。","options":["回帰分析における相関係数に相当する指標","尺度のα係数","t検定の自由度","分散分析のF値"],"answer":0,"explanation":"正解：回帰分析における相関係数に相当する指標","source":"回帰分析"},{"q":"重回帰分析で多重共線性が問題になるのはどのような場合か。","options":["説明変数が2個以上あるだけの場合","目的変数が量的変数の場合","説明変数間の関連が強すぎる場合","標本数が偶数の場合"],"answer":2,"explanation":"正解：説明変数間の関連が強すぎる場合","source":"重回帰分析"},{"q":"多重共線性が生じた際に起こり得ることとして資料にあるものはどれか。","options":["必ずR²が1になる","全てのp値が0になる","標本数が自動的に減る","予想や常識と逆の符号が出るなど結果が不安定になる"],"answer":3,"explanation":"正解：予想や常識と逆の符号が出るなど結果が不安定になる","source":"重回帰分析"},{"q":"多重共線性を疑う相関の目安として資料に挙げられているのはどれか。","options":["r=.30以上","説明変数間でr=.80以上など","r=.50以上なら必ず","r=.10以上"],"answer":1,"explanation":"正解：説明変数間でr=.80以上など","source":"重回帰分析"},{"q":"多重共線性が強い説明変数への対応として資料に挙げられているものはどれか。","options":["目的変数に変更する","いずれかを用いない、または合成得点を作る","両方の得点を2倍する","有意水準を.10にする"],"answer":1,"explanation":"正解：いずれかを用いない、または合成得点を作る","source":"重回帰分析"},{"q":"近年の重回帰分析の報告について資料が推奨傾向として述べているのはどれか。","options":["非有意変数は必ず全て削除する","R²は報告しない","有意な変数だけ最初から測定する","仮説モデルに沿った結果を、非有意な説明変数があってもそのまま報告する"],"answer":3,"explanation":"正解：仮説モデルに沿った結果を、非有意な説明変数があってもそのまま報告する","source":"重回帰分析"},{"q":"回帰分析の残差分散に関する関係式として資料にあるものはどれか。","options":["残差分散＝説明分散÷目的変数の分散","説明分散＝目的変数の分散＋残差分散","目的変数の分散＝説明分散＋残差分散","目的変数の分散＝説明分散×残差分散"],"answer":2,"explanation":"正解：目的変数の分散＝説明分散＋残差分散","source":"回帰分析"},{"q":"決定係数の説明率を分散で表した式として資料にあるものはどれか。","options":["説明分散＋残差分散","残差分散÷説明分散","説明分散÷目的変数の分散","目的変数の分散÷説明分散"],"answer":2,"explanation":"正解：説明分散÷目的変数の分散","source":"回帰分析"}],"sa":[{"q":"SPSSで「過度な尖度なし」に相当する尖度はいくつ？","answer":"0","aliases":[],"explanation":"正解：0","source":"分布の形"},{"q":"HADで「過度な尖度なし」に相当する尖度はいくつ？","answer":"3","aliases":[],"explanation":"正解：3","source":"分布の形"},{"q":"母分散の推定に用いる分散を何という？","answer":"不偏分散","aliases":[],"explanation":"正解：不偏分散","source":"標本理論"},{"q":"サンプリングによって標本統計量が変動することから生じる誤差は？","answer":"標本誤差","aliases":[],"explanation":"正解：標本誤差","source":"標本理論"},{"q":"同様の調査を繰り返した際の標本統計量の変動を表す指標は？","answer":"標準誤差","aliases":[],"explanation":"正解：標準誤差","source":"標準誤差"},{"q":"多数の標本平均値の標準偏差に相当するものは？","answer":"標準誤差","aliases":[],"explanation":"正解：標準誤差","source":"標準誤差"},{"q":"資料の目安で |r|=.10 の効果量は？","answer":"小","aliases":[],"explanation":"正解：小","source":"相関"},{"q":"資料の目安で |r|=.30 の効果量は？","answer":"中","aliases":[],"explanation":"正解：中","source":"相関"},{"q":"資料の目安で |r|=.50 の効果量は？","answer":"大","aliases":[],"explanation":"正解：大","source":"相関"},{"q":"直線的ではないためrが0付近でも関連があり得る関係の例は？","answer":"二次曲線関係","aliases":[],"explanation":"正解：二次曲線関係","source":"相関"},{"q":"1つの質問項目で複数の内容を同時に尋ねる問題を何という？","answer":"ダブル・バーレル","aliases":[],"explanation":"正解：ダブル・バーレル","source":"質問項目"},{"q":"資料で心理調査によく用いられる回答方法は？","answer":"評定法","aliases":[],"explanation":"正解：評定法","source":"質問紙"},{"q":"授業中課題では逆転項目を尺度全体の何割程度入れるとしている？","answer":"2〜3割程度","aliases":[],"explanation":"正解：2〜3割程度","source":"質問紙"},{"q":"回帰式による予測値と実際の値との差を何という？","answer":"残差","aliases":[],"explanation":"正解：残差","source":"回帰分析"},{"q":"残差の二乗和を最小にする回帰直線の算出方法は？","answer":"最小二乗法","aliases":[],"explanation":"正解：最小二乗法","source":"回帰分析"},{"q":"目的変数の分散のうちモデルが説明する割合を表す指標は？","answer":"決定係数R²","aliases":[],"explanation":"正解：決定係数R²","source":"回帰分析"},{"q":"Cohenの目安でR²=.02の効果量は？","answer":"小","aliases":[],"explanation":"正解：小","source":"回帰分析"},{"q":"Cohenの目安でR²=.13の効果量は？","answer":"中","aliases":[],"explanation":"正解：中","source":"回帰分析"},{"q":"Cohenの目安でR²=.26の効果量は？","answer":"大","aliases":[],"explanation":"正解：大","source":"回帰分析"},{"q":"測定単位に依存せず説明変数の影響力を比較する回帰係数は？","answer":"標準化回帰係数β","aliases":[],"explanation":"正解：標準化回帰係数β","source":"回帰分析"},{"q":"説明変数同士の関連が強すぎて結果が不安定になる問題は？","answer":"多重共線性","aliases":[],"explanation":"正解：多重共線性","source":"重回帰分析"},{"q":"資料で多重共線性を疑うVIFの目安は？","answer":"10より高い","aliases":[],"explanation":"正解：10より高い","source":"重回帰分析"}]}; const KEY='stats_methods_newonly_20260829_v1'; let type='mc',mode='all',idx=0,list=[],locked=false; let rec=JSON.parse(localStorage.getItem(KEY)||'{"mc":{},"sa":{}}');
function save(){localStorage.setItem(KEY,JSON.stringify(rec))}function rFor(i){return rec[type][i]||{correct:0,wrong:0,attempts:0,last:null}}function setR(i,r){rec[type][i]=r;save()}
function setType(t){type=t;idx=0;build();render()}function setMode(m){mode=m;idx=0;build();render()}function build(){let arr=DATA[type].map((_,i)=>i);if(mode==='unanswered')arr=arr.filter(i=>rFor(i).attempts===0);if(mode==='wrong')arr=arr.filter(i=>rFor(i).wrong>0);if(mode==='wrong1')arr=arr.filter(i=>rFor(i).wrong===1);if(mode==='wrong2')arr=arr.filter(i=>rFor(i).wrong===2);if(mode==='wrong3')arr=arr.filter(i=>rFor(i).wrong>=3);if(mode==='random'){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}list=arr;updateStats()}
function updateStats(){let rs=Object.values(rec[type]),c=rs.reduce((a,x)=>a+x.correct,0),w=rs.reduce((a,x)=>a+x.wrong,0),done=rs.filter(x=>x.attempts>0).length;document.getElementById('sCorrect').textContent=c;document.getElementById('sWrong').textContent=w;document.getElementById('sRate').textContent=(c+w)?Math.round(c/(c+w)*100)+'%':'-';document.getElementById('sProgress').textContent=done+'/'+DATA[type].length;document.getElementById('tabMc').classList.toggle('active',type==='mc');document.getElementById('tabSa').classList.toggle('active',type==='sa');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function render(){updateStats();let empty=!list.length;document.getElementById('empty').classList.toggle('hidden',!empty);document.getElementById('card').classList.toggle('hidden',empty);if(empty)return;if(idx>=list.length)idx=0;if(idx<0)idx=list.length-1;let qi=list[idx],q=DATA[type][qi],r=rFor(qi);locked=false;document.getElementById('meta').textContent=(idx+1)+' / '+list.length;document.getElementById('question').textContent=q.q;document.getElementById('source').textContent='出典：'+q.source;document.getElementById('feedback').className='feedback hidden';document.getElementById('feedback').textContent='';document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回';document.getElementById('mcArea').classList.toggle('hidden',type!=='mc');document.getElementById('saArea').classList.toggle('hidden',type!=='sa');if(type==='mc'){let box=document.getElementById('choices');box.innerHTML='';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>judgeMc(j,b);box.appendChild(b)});document.getElementById('revealMc').disabled=false}else{document.getElementById('saInput').value='';document.getElementById('saInput').disabled=false}}
function showFb(ok,text){let f=document.getElementById('feedback');f.className='feedback '+(ok===true?'ok':ok===false?'ng':'');f.innerHTML=text}
function judgeMc(sel){if(locked)return;locked=true;let qi=list[idx],q=DATA.mc[qi],r=rFor(qi);r.attempts++;if(sel===q.answer)r.correct++;else r.wrong++;r.last=sel===q.answer;setR(qi,r);[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===sel&&sel!==q.answer)b.classList.add('wrong')});showFb(sel===q.answer,(sel===q.answer?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealMc(){if(locked)return;locked=true;let q=DATA.mc[list[idx]];[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct')});showFb(null,'<b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation)}
function norm(s){return s.toLowerCase().replace(/[\s　・･\.。()（）\-−ー]/g,'').replace(/ｔ/g,'t').replace(/ｚ/g,'z')}
function judgeSa(){if(locked)return;let inp=document.getElementById('saInput').value.trim();if(!inp)return;locked=true;let qi=list[idx],q=DATA.sa[qi],r=rFor(qi),valid=[q.answer,...(q.alts||[])].map(norm),ok=valid.includes(norm(inp));r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=ok;setR(qi,r);document.getElementById('saInput').disabled=true;showFb(ok,(ok?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.answer+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealSa(){if(locked)return;locked=true;let q=DATA.sa[list[idx]];document.getElementById('saInput').disabled=true;showFb(null,'<b>答え：</b>'+q.answer+'<br>'+q.explanation)}function next(){idx++;render()}function prev(){idx--;render()}function resetAll(){if(confirm('正解・不正解・間違えた回数など、すべての記録を消しますか？')){rec={mc:{},sa:{}};save();build();render()}}
document.getElementById('mcCount').textContent=DATA.mc.length;document.getElementById('saCount').textContent=DATA.sa.length;build();render();</script></body></html>
