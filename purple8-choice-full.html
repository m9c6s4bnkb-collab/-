<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紫8｜4択問題【作り直し版】</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid #e5e8ef;padding:12px 16px}.wrap{max-width:820px;margin:auto;padding:16px}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#68707c;margin-top:5px}.panel,.card{background:#fff;border:1px solid #dde2e9;border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:0 3px 14px rgba(0,0,0,.035)}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.filters label{display:block;font-size:12px;color:#68707c;margin-bottom:4px}select,input{width:100%;border:1px solid #d8dde8;border-radius:10px;padding:10px;background:#fff}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #d8dde8;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.btn.primary{background:#20242a;color:#fff}.btn.danger{color:#9b2c2c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#68707c}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pill{background:#f0f2f6;border-radius:999px;padding:4px 8px;font-size:11px;color:#59616d}.stem{font-size:17px;font-weight:700;line-height:1.65;white-space:pre-line;margin:7px 0 14px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #d7dce5;background:#fff;border-radius:11px;padding:12px;line-height:1.5}.choice.correct{outline:2px solid #2f7d4f;background:#eef9f2}.choice.wrong{outline:2px solid #b54343;background:#fff0f0}.feedback{display:none;margin-top:12px;background:#f5f6f9;border-radius:11px;padding:12px;line-height:1.6}.feedback.show{display:block}.answer{font-weight:800}.note{font-size:13px;color:#505763;margin-top:7px;white-space:pre-line}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}.answer-input{width:100%;min-height:82px;resize:vertical;border:1px solid #d7dce5;border-radius:11px;padding:11px;font-size:16px}.selfgrade{display:flex;gap:8px;margin-top:10px}.selfgrade button{flex:1}.hidden{display:none!important}@media(max-width:600px){.filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:11px}.stem{font-size:16px}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>紫8｜4択問題【作り直し版】</h1><div class="sub">問題数 130問。元Questionを残し、右ページは“覚える価値のある細部”だけを具体的な問いにして再構成。水増し・答えが見える問題・「さらに適切な説明」型を除去。</div></div></header><main class="wrap"><section class="panel"><div class="filters"><div><label>出題内容</label><select id="side"><option value="all">基本＋右ページ詳細</option><option value="basic">基本問題のみ</option><option value="detail">右ページ詳細のみ</option></select></div><div><label>分野</label><select id="chapter"><option value="all">すべて</option><option value="司法・犯罪">司法・犯罪</option><option value="産業・労働">産業・労働</option><option value="最重要キーパーソン">最重要キーパーソン</option></select></div><div><label>復習</label><select id="review"><option value="all">すべて</option><option value="unanswered">未回答だけ</option><option value="lastwrong">前回不正解</option><option value="everwrong">一度でも不正解</option><option value="wrong1">誤答1回</option><option value="wrong2">誤答2回</option><option value="wrong3">誤答3回以上</option></select></div><div><label>出題順</label><select id="ord"><option value="source">資料順</option><option value="random">ランダム</option></select></div></div><div class="buttons"><button class="btn primary" id="start">この条件で開始</button><button class="btn danger" id="reset">履歴リセット</button></div></section><section class="panel stats"><div class="stat"><b id="pool">0</b><span>出題候補</span></div><div class="stat"><b id="answered">0</b><span>今回の回答</span></div><div class="stat"><b id="correct">0</b><span>今回の正解</span></div><div class="stat"><b id="rate">0%</b><span>今回の正答率</span></div></section><section class="card"><div class="meta" id="meta"></div><div class="stem" id="stem">「この条件で開始」を押してね</div><div id="body"></div><div class="feedback" id="feedback"></div><div class="nav"><button class="btn" id="prev">← 前へ</button><button class="btn primary" id="next">次へ →</button></div></section></main><script src="purple8-data-1.js"></script><script src="purple8-data-2.js"></script><script>
let DATA=[];const DATA_GZ_B64=window.PURPLE8_DATA||'';async function loadData(){const bin=atob(DATA_GZ_B64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const stream=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));const txt=await new Response(stream).text();DATA=JSON.parse(txt);updateStats();} const KEY="purple8_choice_rebuilt_v1"; let hist=JSON.parse(localStorage.getItem(KEY)||'{}');let order=[],pos=0,sessionA=0,sessionC=0;
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stat(id){return hist[id]||{correct:0,wrong:0,last:null}}function record(id,ok){const s=stat(id);s.correct+=(ok?1:0);s.wrong+=(!ok?1:0);s.last=ok?'correct':'wrong';hist[id]=s;localStorage.setItem(KEY,JSON.stringify(hist));}
function pool(){let a=DATA.slice();const side=el('side').value,chap=el('chapter').value,rev=el('review').value;if(side!=='all')a=a.filter(x=>x.side===side);if(chap!=='all')a=a.filter(x=>x.chapter===chap);if(rev==='unanswered')a=a.filter(x=>{const s=stat(x.id);return s.correct+s.wrong===0});if(rev==='lastwrong')a=a.filter(x=>stat(x.id).last==='wrong');if(rev==='everwrong')a=a.filter(x=>stat(x.id).wrong>0);if(rev==='wrong1')a=a.filter(x=>stat(x.id).wrong===1);if(rev==='wrong2')a=a.filter(x=>stat(x.id).wrong===2);if(rev==='wrong3')a=a.filter(x=>stat(x.id).wrong>=3);return a;}
function start(){order=pool();if(el('ord').value==='random')order.sort(()=>Math.random()-.5);pos=0;renderQuestion();updateStats();} function current(){return order[pos]}
function next(){if(pos<order.length-1){pos++;renderQuestion();}else renderDone();}function prev(){if(pos>0){pos--;renderQuestion();}}
function meta(q){el('meta').innerHTML=`<span class="pill">${q.side==='basic'?'基本':'右ページ詳細'}</span><span class="pill">${esc(q.chapter||'')}</span><span class="pill">誤答 ${stat(q.id).wrong}回</span><span class="pill">${pos+1} / ${order.length}</span>`;}
function renderDone(){el('stem').textContent=order.length?'この範囲は終了！':'該当する問題がありません';el('body').innerHTML='';el('feedback').className='feedback';}
function updateStats(){const p=pool();el('pool').textContent=p.length;el('answered').textContent=sessionA;el('correct').textContent=sessionC;el('rate').textContent=sessionA?Math.round(sessionC/sessionA*100)+'%':'0%';}

function renderQuestion(){const q=current(); if(!q){renderDone();return;} meta(q); el('stem').textContent=q.stem; const box=el('body');box.innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button class="choice" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')+'</div>'; el('feedback').className='feedback'; el('feedback').innerHTML=''; document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.i)));}
function answerChoice(i){const q=current(); if(document.querySelector('.choice.correct,.choice.wrong'))return; const ok=i===q.correctIndex; document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');}); if(!ok)document.querySelectorAll('.choice')[i].classList.add('wrong'); record(q.id,ok); sessionA++; if(ok)sessionC++; const fb=el('feedback');fb.className='feedback show';fb.innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}：${esc(q.answer)}</div><div class="note">${esc(q.note||'')}</div>`; updateStats();}

el('start').onclick=start;el('next').onclick=next;el('prev').onclick=prev;['side','chapter','review','ord'].forEach(id=>el(id).onchange=updateStats);el('reset').onclick=()=>{if(confirm('この問題集の学習履歴をすべて削除しますか？')){hist={};localStorage.removeItem(KEY);sessionA=sessionC=0;start();}};loadData();
</script></body></html>
