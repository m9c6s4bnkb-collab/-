病理的な状態"],"correct":2,"answer":"人生の転機","explanation":"人生の転機において過去を振り返り、自分自身を見つめ直すことは、より高次の成長につながると考えたのである。","section":"30. 創造的退行"},{"id":"jin1-c-335","q":"創造的退行について、転機で行うこととして挙げられる組合せはどれか。","options":["過去を振り返り、自分自身を見つめ直す","家庭と職場","他者を分類し、性格を固定する","症状を無視し、感情を抑圧する"],"correct":0,"answer":"過去を振り返り、自分自身を見つめ直す","explanation":"人生の転機において過去を振り返り、自分自身を見つめ直すことは、より高次の成長につながると考えたのである。","section":"30. 創造的退行"},{"id":"jin1-c-336","q":"創造的退行について、健康的な退行を『自我による自我のための退行』と呼んだ人物は誰か。","options":["キャッテル","フロイト","クリス","大山"],"correct":2,"answer":"クリス","explanation":"また、後の精神分析学派も退行の健康的な側面を認め、クリスはこれを「自我による自我のための退行」と呼んだ。","section":"30. 創造的退行"},{"id":"jin1-c-337","q":"創造的退行について、後の精神分析学派が認めた退行の側面は何か。","options":["防衛機制","不安や葛藤","健康的な側面","病理的な状態"],"correct":2,"answer":"健康的な側面","explanation":"また、後の精神分析学派も退行の健康的な側面を認め、クリスはこれを「自我による自我のための退行」と呼んだ。","section":"30. 創造的退行"},{"id":"jin1-c-338","q":"弱点を何らかの形で補い、劣等感を克服しようとすることを何というか。","options":["否認","抑圧","補償","投影"],"correct":2,"answer":"補償","explanation":"補償とは、弱点を何らかの形で補うことで、劣等感を克服しようとすることを言う。","section":"31. 無意識の補償作用"},{"id":"jin1-c-339","q":"無意識の補償作用について、人間の心が全体的な調和と均衡を保つ基礎となる関係は何か。","options":["知能と年齢の比例関係","意識と無意識の相補的関係","意識の態度","職業と価値の同一関係"],"correct":1,"answer":"意識と無意識の相補的関係","explanation":"人間の心は、意識と無意識の相補的関係によって、全体的な調和・均衡を保っている。","section":"31. 無意識の補償作用"},{"id":"jin1-c-340","q":"無意識に相補する働きが芽生えやすいのは、何が過度に一面的になったときか。","options":["補償","検査の形式","意識と無意識の相補的関係","意識の態度"],"correct":3,"answer":"意識の態度","explanation":"意識の態度があまりに一面的になると、無意識にそれを相補する働きが芽生えることを強調しており、それがタイプ論における優越機能と劣等機能である。","section":"31. 無意識の補償作用"},{"id":"jin1-c-341","q":"無意識の補償作用について、類型論で補償的関係を表す機能の組合せはどれか。","options":["意識と前意識","外向性と開放性","優越機能と劣等機能","現実検討機能と適応機能"],"correct":2,"answer":"優越機能と劣等機能","explanation":"意識の態度があまりに一面的になると、無意識にそれを相補する働きが芽生えることを強調しており、それがタイプ論における優越機能と劣等機能である。","section":"31. 無意識の補償作用"},{"id":"jin1-c-342","q":"ユングの考えで、無意識の補償作用の現れとして挙げられる三つの組合せはどれか。","options":["夢・症状・対人関係上の問題","夢・自由連想・抵抗","症状・自我・超自我","対人関係上の問題・条件づけ・強化"],"correct":0,"answer":"夢・症状・対人関係上の問題","explanation":"夢、症状、対人関係上の問題も無意識の補償作用の現れとされている。","section":"31. 無意識の補償作用"},{"id":"jin1-c-343","q":"心が補償作用によって保とうとする二つの状態は何か。","options":["依存と離反","興奮と抑制","調和と均衡","外向と内向"],"correct":2,"answer":"調和と均衡","explanation":"人間の心は、意識と無意識の相補的関係によって、全体的な調和・均衡を保っている。","section":"31. 無意識の補償作用"},{"id":"jin1-c-344","q":"無意識内で、感情によって一つにまとまった集合体を何というか。","options":["元型","ペルソナ","フェルトセンス","コンプレックス"],"correct":3,"answer":"コンプレックス","explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-345","q":"無意識的コンプレックスについて、コンプレックスとして集まった心的要素を一つにまとめるものは何か。","options":["自我にとって受け入れがたい大きな経験","その経験と似た体験","職業","何らかの感情"],"correct":3,"answer":"何らかの感情","explanation":"無意識の中にあり何らかの感情によって1つのまとまりとなっている集合体のことである。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-346","q":"無意識的コンプレックスについて、コンプレックスが乱すものは何か。","options":["刺激を受け取る感覚機能","価値を判断する思考機能","外界を適切に扱おうとする自我の働き","社会的役割を担うペルソナ"],"correct":2,"answer":"外界を適切に扱おうとする自我の働き","explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-347","q":"無意識的コンプレックスについて、コンプレックスの核にあるものは何か。","options":["自我にとって中立な小さな出来事","何らかの感情","知能検査の問題","自我にとって受け入れがたい大きな経験"],"correct":3,"answer":"自我にとって受け入れがたい大きな経験","explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-348","q":"無意識的コンプレックスについて、核となる経験へ何が重なって形成されるか。","options":["その経験と似た体験","異なる価値類型","反対の検査得点","何らかの感情"],"correct":0,"answer":"その経験と似た体験","explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-349","q":"無意識的コンプレックスについて、コンプレックスに伴うものとして挙げられているのは何か。","options":["非常に強い情動","何らかの感情","完全な無感情","自我にとって受け入れがたい大きな経験"],"correct":0,"answer":"非常に強い情動","explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-350","q":"無意識的コンプレックスについて、強い情動の具体例として示されているものは何か。","options":["理由の明確な喜び","訳の分からない怒り","課題への好奇心","職業への関心"],"correct":1,"answer":"訳の分からない怒り","explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-351","q":"無意識的コンプレックスについて、資料本文が説明している形成過程はどれか。","options":["核となる経験に似た体験が重なり合う","知能検査得点で突然決まる","何らかの感情","価値類型を選ぶと形成される"],"correct":0,"answer":"核となる経験に似た体験が重なり合う","explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-c-352","q":"目的論的視点について、原因よりも『何のために』に注目する視点を重視した人物は誰か。","options":["ロジャーズ","ユング","クレッチマー","オールポート"],"correct":1,"answer":"ユング","explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-c-353","q":"原因ではなく目的に注目する見方を何というか。","options":["目的論的視点","状況主義","特性論","経済論"],"correct":0,"answer":"目的論的視点","explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-c-354","q":"ユングの目的論的視点が重視する問いはどれか。","options":["何のために","何が原因か","誰の責任か","いつ始まったか"],"correct":0,"answer":"何のために","explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-c-355","q":"ユングの目的論的視点では、症状や問題への対応を、単に症状や問題をどうする方向だけに限定しないか。","options":["分類する","測定する","なくす","他者へ置き換える"],"correct":2,"answer":"なくす","explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-c-356","q":"目的論的視点について、症状や問題を、本人が何を目指すためのメッセージとして扱うか。","options":["より高い検査得点","意味あるメッセージ","より良い生き方","一つの価値類型"],"correct":2,"answer":"より良い生き方","explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-c-357","q":"ユングの目的論的視点に立つと、厄介な問題はどのような問題として捉え直されるか。","options":["一時的な問題","大切な問題","原因解明だけの問題","測定上の問題"],"correct":1,"answer":"大切な問題","explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-c-358","q":"目的論的視点について、症状や問題に見いだすものは何か。","options":["より良い生き方","コンプレックス","意味あるメッセージ","何らかの感情"],"correct":2,"answer":"意味あるメッセージ","explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-c-359","q":"クライエント中心療法を創始した人物は誰か。","options":["アイゼンク","ロジャーズ","アンナ・フロイト","クレッチマー"],"correct":1,"answer":"ロジャーズ","explanation":"ロジャーズにより創始された心理療法を指す。","section":"34. クライエント中心療法"},{"id":"jin1-c-360","q":"指示的な精神分析や行動療法への批判から生まれた心理療法は何か。","options":["精神分析療法","クライエント中心療法","行動療法","分析心理学"],"correct":1,"answer":"クライエント中心療法","explanation":"クライエント中心療法は、ロジャーズが、指示的アプローチである精神分析や行動療法への批判から創始した心理療法である。","section":"34. クライエント中心療法"},{"id":"jin1-c-361","q":"クライエント中心療法の以前の名称は何か。","options":["非指示的療法","体験過程療法","指示的療法","分析的治療"],"correct":0,"answer":"非指示的療法","explanation":"以前は非指示的療法とよばれていたが、受身的、消極的、表面的といった批判や誤解を招いたため、クライエント中心療法と改名された。","section":"34. クライエント中心療法"},{"id":"jin1-c-362","q":"クライエント中心療法について、旧名称が招いた批判・誤解の組合せはどれか。","options":["社交的・親切・温厚","活動的・積極的・深層的","衝動的・感情的・幼児的","受身的・消極的・表面的"],"correct":3,"answer":"受身的・消極的・表面的","explanation":"以前は非指示的療法とよばれていたが、受身的、消極的、表面的といった批判や誤解を招いたため、クライエント中心療法と改名された。","section":"34. クライエント中心療法"},{"id":"jin1-c-363","q":"クライエント中心療法について、治療の方向や本人を傷つけた経験を最もよく知るとされたのは誰か。","options":["ロジャーズ","ユング","セラピスト","クライエント自身"],"correct":3,"answer":"クライエント自身","explanation":"ロジャーズは何がその人を傷つけ、どんな経験をしたか、どの方向に行くべきか、知っているのはクライエント自身であると考え、「受容」「共感」といった表面技法から、セラピストの態度を重視した。","section":"34. クライエント中心療法"},{"id":"jin1-c-364","q":"クライエント中心療法について、受容や共感を単なる何としてではなく捉え直したか。","options":["表面的な技法","心理療法の原理","セラピストの態度","基本的条件"],"correct":0,"answer":"表面的な技法","explanation":"ロジャーズは、受容や共感を表面的な技法として扱うのではなく、セラピストの態度そのものを重視した。","section":"34. クライエント中心療法"},{"id":"jin1-c-365","q":"クライエント中心療法について、ロジャーズが表面技法より重視したものは何か。","options":["検査得点","自由連想","治療室の広さ","セラピストの態度"],"correct":3,"answer":"セラピストの態度","explanation":"ロジャーズは、受容や共感を表面的な技法として扱うのではなく、セラピストの態度そのものを重視した。","section":"34. クライエント中心療法"},{"id":"jin1-c-366","q":"クライエント中心療法でセラピストに必要とされる三条件の組合せはどれか。","options":["自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解","自己一致・条件付きの肯定的配慮・解釈","自由連想・夢分析・抵抗分析","指示・助言・説得"],"correct":0,"answer":"自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解","explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。","section":"34. クライエント中心療法"},{"id":"jin1-c-367","q":"クライエント中心療法について、セラピスト側の三条件に含まれないものはどれか。","options":["自由連想","共感的理解","無条件の肯定的配慮（受容）","自己一致（純粋性）"],"correct":0,"answer":"自由連想","explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。自由連想はこの3条件には含まれない。","section":"34. クライエント中心療法"},{"id":"jin1-c-368","q":"クライエント中心療法について、重視されるセラピスト側の態度はいくつか。","options":["8つ","2つ","3つ","10"],"correct":2,"answer":"3つ","explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。","section":"34. クライエント中心療法"},{"id":"jin1-c-369","q":"クライエント中心療法について、現在、三条件はどのように受け入れられているか。","options":["身体検査の採点基準","セラピストの態度","学派を超えて共通する基本的態度","自由連想"],"correct":2,"answer":"学派を超えて共通する基本的態度","explanation":"現在では学派を超えて共通する基本的態度として受け入れられている。","section":"34. クライエント中心療法"},{"id":"jin1-c-370","q":"クライエント中心療法が批判の対象とした二つの指示的アプローチは何か。","options":["描画法と投映法","観察法と面接法","特性論と類型論","精神分析と行動療法"],"correct":3,"answer":"精神分析と行動療法","explanation":"それまでの指示的アプローチである精神分析や行動療法への批判として生まれた。","section":"34. クライエント中心療法"},{"id":"jin1-c-371","q":"自己理論について、有機体的経験と自己概念の関係から人格や適応を理解する理論の提唱者は誰か。","options":["ロジャーズ","キャッテル","フロイト","大山"],"correct":0,"answer":"ロジャーズ","explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-c-372","q":"経験と自己概念の関係を中心に据える考え方は何か。","options":["状況主義","自己理論","精神力動論","類型論"],"correct":1,"answer":"自己理論","explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-c-373","q":"自己理論について、人間に本来備わる、自己を維持し強化しようとする傾向は何か。","options":["自己実現傾向","投影性同一視","神経症傾向","精神病的傾向"],"correct":0,"answer":"自己実現傾向","explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-c-374","q":"自己理論について、経験を通して、自分に関する何がまとめられて形成されるか。","options":["認識や価値観","胚葉や神経系","自己実現傾向","自己概念"],"correct":0,"answer":"認識や価値観","explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-c-375","q":"自己理論について、自分に関する認識や価値観をまとめたものは何か。","options":["集合的無意識","自己概念","元型","類型"],"correct":1,"answer":"自己概念","explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-c-376","q":"自己理論について、経験と自己概念が一致している場合の心理状態はどれか。","options":["心理的に安定し適応的","対人関係を回避する","自己実現傾向","衝動的・幼児的"],"correct":0,"answer":"心理的に安定し適応的","explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-c-377","q":"自己理論について、自己概念と一致しない経験が意識されにくくなる二つの処理は何か。","options":["自由連想と転移","受容と共感","否認と歪曲","抑圧と昇華"],"correct":2,"answer":"否認と歪曲","explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-c-378","q":"自己理論について、心理的適応に問題が生じやすいのは、どの領域が多い場合か。","options":["現実検討できる領域","自己概念と経験が一致する領域","自己概念と経験が一致していない領域","開放領域"],"correct":2,"answer":"自己概念と経験が一致していない領域","explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-c-379","q":"自己理論について、心理的健康を理解するうえで重要なものは何か。","options":["自己と経験の一致の程度","自己実現傾向","認識や価値観","自己概念"],"correct":0,"answer":"自己と経験の一致の程度","explanation":"このように、自己実現傾向を基盤としつつ、自己と経験の一致の程度が心理的健康を理解する上で重要とされる。","section":"35. 自己理論"},{"id":"jin1-c-380","q":"自己理論について、自己概念の形成基盤となるものは何か。","options":["筆跡","経験","自己実現傾向","認識や価値観"],"correct":1,"answer":"経験","explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-c-381","q":"自己理論が理解しようとする二つの対象は何か。","options":["知能と運動","職業と所得","人格と適応","家と木"],"correct":2,"answer":"人格と適応","explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-c-382","q":"自分が認識する自分と実際の体験が一致している状態を何というか。","options":["自己開示","自己一致","個性化","抑圧"],"correct":1,"answer":"自己一致","explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-c-383","q":"自己一致（純粋性）の状態では、何と何が一致しているか。","options":["自己概念と経験","意識と無意識","理性と感情","自我と自己"],"correct":0,"answer":"自己概念と経験","explanation":"自己一致（純粋性）とは、自分についての認識である自己概念と、実際の体験である経験が一致している状態をいう。","section":"36. 自己一致"},{"id":"jin1-c-384","q":"自己一致を日常的に言い換えた説明はどれか。","options":["知能と年齢が一致する","『あなたが～なら受け入れる』という条件付きの態度","あるべき自分と、感じたり行動する自分に矛盾がない","感じたことをすべて否認する"],"correct":2,"answer":"あるべき自分と、感じたり行動する自分に矛盾がない","explanation":"つまり、あるべき自分と、感じたり行動する自分に矛盾がない状態をいう。","section":"36. 自己一致"},{"id":"jin1-c-385","q":"自己一致について、心理的不適応をもたらすとされるものは何か。","options":["自己概念と経験の不一致","無条件の受容","共感的理解","自己実現傾向"],"correct":0,"answer":"自己概念と経験の不一致","explanation":"クライエント中心療法では、自己概念と経験の不一致がクライエントに心理的不適応をもたらすと考える。","section":"36. 自己一致"},{"id":"jin1-c-386","q":"自己一致について、セラピストが修正を支援するものは何か。","options":["過去の事実そのもの","『こうあるべき』と考える自己概念","自己概念と経験の不一致","ありのままの自分"],"correct":1,"answer":"『こうあるべき』と考える自己概念","explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-c-387","q":"自己一致について、クライエントが受け入れられるよう支援するものは何か。","options":["自己概念と経験の不一致","『こうあるべき』と考える自己概念","ありのままの自分","自己実現傾向"],"correct":2,"answer":"ありのままの自分","explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-c-388","q":"自己一致について、無条件の肯定的配慮（受容）は、誰に必要な態度として位置づけられるか。","options":["ロジャーズ","クライエント","検査者","セラピスト"],"correct":3,"answer":"セラピスト","explanation":"クライエント中心療法におけるセラピストに必要な態度のひとつである。","section":"36. 自己一致"},{"id":"jin1-c-389","q":"自己一致について、無条件の肯定的配慮（受容）が重視される心理療法は何か。","options":["描画法","クライエント中心療法","精神分析療法","行動療法"],"correct":1,"answer":"クライエント中心療法","explanation":"クライエント中心療法では、自己概念と経験の不一致がクライエントに心理的不適応をもたらすと考える。","section":"36. 自己一致"},{"id":"jin1-c-390","q":"クライエントを一人の人間として条件を付けず認める態度は何か。","options":["抵抗","無条件の肯定的配慮","自己一致","共感的理解"],"correct":1,"answer":"無条件の肯定的配慮","explanation":"クライエントをひとりの人間として無条件に認め、ポジティブな面と同様にネガティブな面も受容することをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-391","q":"無条件の肯定的配慮では、クライエントのポジティブな面と何の面をともに受容するか。","options":["自分自身を受容すること","ネガティブな面","防衛","自分自身の受容"],"correct":1,"answer":"ネガティブな面","explanation":"クライエントをひとりの人間として無条件に認め、ポジティブな面と同様にネガティブな面も受容することをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-392","q":"無条件の肯定的配慮（受容）と反対の例はどれか。","options":["無条件に認める態度","どのようであれ受け入れる態度","一人の人間として認める態度","『あなたが～なら受け入れる』という条件付きの態度"],"correct":3,"answer":"『あなたが～なら受け入れる』という条件付きの態度","explanation":"つまり、「あなたが～なら、あなたを受け入れる」といった態度ではなく、クライエントがどのようであれ、受け入れる態度をいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-393","q":"無条件の肯定的配慮について、不適応状態は、本人が何をできていない状態だと説明されるか。","options":["知能を測定すること","自分自身を受容すること","ネガティブな面","職業を選ぶこと"],"correct":1,"answer":"自分自身を受容すること","explanation":"クライエントが不適応状態にあるということは、クライエントが自分自身を受容できていない状態にあることを意味する。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-394","q":"セラピストが無条件に受容すると、クライエントは何をせずに自己を見つめ直せるか。","options":["自己開示","共感","防衛","発見"],"correct":2,"answer":"防衛","explanation":"セラピストが無条件にクライエントを受容することで、クライエントは防衛することなく自己を見つめ直し、自分自身を受容できるようになる。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-395","q":"無条件の受容を経験した結果、可能になることは何か。","options":["他者の統制","自分自身の受容","無条件の肯定的配慮","ネガティブな面"],"correct":1,"answer":"自分自身の受容","explanation":"セラピストが無条件にクライエントを受容することで、クライエントは防衛することなく自己を見つめ直し、自分自身を受容できるようになる。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-396","q":"無条件の肯定的配慮について、共感的理解は、誰に必要とされる態度か。","options":["クライエント","セラピスト","研究参加者","検査対象者"],"correct":1,"answer":"セラピスト","explanation":"共感的理解はセラピストに必要な態度であり、クライエントの感情に巻き込まれず、その経験や情動を「あたかも自分のもの」のように感じることをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-c-397","q":"相手の経験や情動を『あたかも自分のもの』のように感じる態度は何か。","options":["共感的理解","無条件の肯定的配慮","転移","同一化"],"correct":0,"answer":"共感的理解","explanation":"共感的理解はセラピストに必要な態度であり、クライエントの感情に巻き込まれず、その経験や情動を「あたかも自分のもの」のように感じることをいう。","section":"38. 共感的理解"},{"id":"jin1-c-398","q":"共感的理解では、相手の感情に対してどうならないことが必 if(localStorage.getItem(CONTENT_REVISION_KEY)!==CONTENT_REVISION){for(const id of ["jin1-c-045","jin1-c-097","jin1-c-098","jin1-c-099","jin1-c-136","jin1-c-145","jin1-c-146","jin1-c-147","jin1-c-179","jin1-c-246","jin1-c-249","jin1-c-423","jin1-c-044","jin1-c-071","jin1-c-075","jin1-c-092","jin1-c-096","jin1-c-143","jin1-c-220","jin1-c-244","jin1-c-268","jin1-c-032","jin1-c-165","jin1-c-169","jin1-c-311","jin1-c-354","jin1-c-355","jin1-c-357","jin1-c-048","jin1-c-310","jin1-c-419","jin1-c-031","jin1-c-083","jin1-c-151","jin1-c-006","jin1-c-008","jin1-c-026","jin1-c-086","jin1-c-088","jin1-c-100","jin1-c-101","jin1-c-102","jin1-c-123","jin1-c-166","jin1-c-202","jin1-c-213","jin1-c-223","jin1-c-260","jin1-c-272","jin1-c-288","jin1-c-325","jin1-c-332","jin1-c-346","jin1-c-383","jin1-c-412","jin1-c-425"])delete records[id];localStorage.setItem(CONTENT_REVISION_KEY,CONTENT_REVISION);localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function answerChoice(choice){
  if(state.answered)return;const i=currentIndex();if(i===null)return;const q=questions[i];state.answered=true;const ok=choice===q.correct;record(i,ok);
  [...document.querySelectorAll('.option')].forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');else if(k===choice)b.classList.add('wrong');else b.classList.add('dim');});
  $('feedback').innerHTML=`<div class="answerbox ${ok?'ok':'bad'}"><b>${ok?'正解！':'不正解'}</b><div>正答：${escapeHtml(q.answer)}</div><div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('history').textContent=historyText(rec(i));$('retry').disabled=false;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('options').innerHTML='';$('feedback').innerHTML='';$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;
  $('options').innerHTML=q.options.map((o,k)=>`<button class="option" onclick="answerChoice(${k})"><span class="letter">${LETTERS[k]}</span><span>${escapeHtml(o)}</span></button>`).join('');$('feedback').innerHTML='';$('retry').disabled=!state.answered;
}
render();
</script></body></html>
