const $=s=>document.querySelector(s);const key='purple4_choice_history_v1';let hist=JSON.parse(localStorage.getItem(key)||'{}'),order=[],pos=0,session={answered:0,correct:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rec(id){return hist[id]||(hist[id]={attempts:0,correct:0,wrong:0,last:null})} function save(){localStorage.setItem(key,JSON.stringify(hist))}
function filtered(){let mode=$('#mode').value,chap=$('#chap').value;return DATA.filter(x=>{let r=rec(x.id);if(chap!=='all'&&x.chapter!==chap)return false;if(mode==='unanswered'&&r.attempts>0)return false;if(mode==='wrong1'&&r.wrong<1)return false;if(mode==='wrong2'&&r.wrong<2)return false;if(mode==='lastwrong'&&r.last!=='wrong')return false;return true})}
function rebuild(rand=false){order=filtered().map(x=>x.id);if(rand)order=shuffle(order);pos=0;session={answered:0,correct:0};render()}
function current(){return DATA.find(x=>x.id===order[pos])} function baseMeta(it){return `出典：紫4(2).pdf PDF p.${it.page}｜${it.origin}`}
function updateStats(){let all=Object.values(hist);let attempts=all.reduce((s,r)=>s+r.attempts,0),correct=all.reduce((s,r)=>s+r.correct,0),wrong=all.reduce((s,r)=>s+r.wrong,0);$('#st1').textContent=session.answered;$('#st2').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'—';$('#st3').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';$('#st4').textContent=wrong}
function prev(){if(pos>0){pos--;render()}} function next(){if(pos<order.length-1){pos++;render()}else{renderDone()}}
function renderDone(){updateStats();$('.card').innerHTML=`<div class="empty"><b>このセットは終了！</b><br>フィルタを変えるか、同じ条件で解き直せます。<div style="margin-top:14px"><button onclick="rebuild(true)">同じ条件でランダムにもう一度</button></div></div>`}
function resetSession(){rebuild(false)} function resetAll(){if(confirm('累積の回答履歴・誤答回数もすべて消しますか？')){hist={};save();rebuild(false)}}
function render(){updateStats();if(!order.length){renderDone();return}const it=current();const letters=['A','B','C','D'];$('.card').innerHTML=`<div class="qno">${pos+1} / ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><div class="stem">${it.stem}</div><div class="choices">${it.options.map((o,i)=>`<button class="choice" onclick="answer(this,${i})"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}</div><div id="fb" class="feedback"></div><div class="nav"><button onclick="prev()" ${pos===0?'disabled':''}>← 前へ</button><button id="nextBtn" onclick="next()" disabled>次へ →</button></div>`}
function answer(btn,i){const it=current();if($('.choice:disabled'))return;let ok=it.options[i]===it.answer;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(it.options[j]===it.answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');let r=rec(it.id);r.attempts++;r.last=ok?'correct':'wrong';ok?r.correct++:r.wrong++;save();session.answered++;if(ok)session.correct++;$('#fb').innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}｜答え：${it.answer}</div><div>${it.note}</div><div class="meta">分野：${it.chapter}<br>元項目：${it.term}<br>${baseMeta(it)}</div>`;$('#fb').classList.add('show');$('#nextBtn').disabled=false;updateStats()}
let chapters=[...new Set(DATA.map(x=>x.chapter))];$('#chap').innerHTML='<option value="all">全分野</option>'+chapters.map(c=>`<option>${c}</option>`).join('');$('#mode').onchange=()=>rebuild(false);$('#chap').onchange=()=>rebuild(false);rebuild(false);
</script></body></html>
