<script>const QUESTIONS=[{"q": "人・物・出来事などを、良い―悪い、危険―安全、有用―有害、好き―嫌いなどの軸で評価する反応。 この内容に最も当てはまる用語はどれか。", "options": ["感情", "ムード", "情動経験", "ムード体験"], "answer": "感情", "exp": "人・物・出来事などの対象を、良い―悪い、危険―安全、有用―有害、好き―嫌いなどの軸に位置づける評価的な反応。", "topic": "感情基礎", "id": "kan_mc_001"}, {"q": "原因が明らかで、しばしば生理的覚醒を伴う、比較的短時間の強い感情。 この内容に最も当てはまる用語はどれか。", "options": ["情動", "ムード体験", "感情", "ムード"], "answer": "情動", "exp": "原因が明らかで、しばしば生理的覚醒を伴う、比較的短時間の強い感情。", "topic": "感情基礎", "id": "kan_mc_002"}, {"q": "原因が必ずしも明らかではなく、比較的長時間持続する快・不快の感情状態。 この内容に最も当てはまる用語はどれか。", "options": ["ムード", "情動", "情動経験", "ムード体験"], "answer": "ムード", "exp": "原因が必ずしも明らかではなく、比較的長時間持続する快・不快の感情状態。", "topic": "感情基礎", "id": "kan_mc_003"}, {"q": "情動が主観的に体験される状態。 この内容に最も当てはまる用語はどれか。", "options": ["情動経験", "ムード体験", "感情", "情動"], "answer": "情動経験", "exp": "情動が主観的に体験される状態。", "topic": "感情基礎", "id": "kan_mc_004"}, {"q": "ムードが主観的に体験される状態。 この内容に最も当てはまる用語はどれか。", "options": ["ムード体験", "情動", "ムード", "情動経験"], "answer": "ムード体験", "exp": "ムードが主観的に体験される状態。", "topic": "感情基礎", "id": "kan_mc_005"}, {"q": "脳と脊髄から構成され、受容器からの情報を処理し、効果器を働かせる情報を末梢神経へ伝える神経系。 この内容に最も当てはまる用語はどれか。", "options": ["中枢神経系", "体性神経系", "自律神経系", "感覚神経"], "answer": "中枢神経系", "exp": "脳と脊髄から構成され、受容器からの情報を処理し、効果器を働かせる情報を末梢神経へ伝える神経系。", "topic": "神経系", "id": "kan_mc_006"}, {"q": "中枢神経系以外の神経で、脳神経と脊髄神経から構成される神経系。 この内容に最も当てはまる用語はどれか。", "options": ["末梢神経系", "感覚神経", "運動神経", "交感神経"], "answer": "末梢神経系", "exp": "中枢神経系以外の神経で、脳神経と脊髄神経から構成される神経系。", "topic": "神経系", "id": "kan_mc_007"}, {"q": "随意運動と感覚を担う末梢神経系の一部。 この内容に最も当てはまる用語はどれか。", "options": ["体性神経系", "交感神経", "副交感神経", "中枢神経系"], "answer": "体性神経系", "exp": "随意運動と感覚を担う末梢神経系の一部。", "topic": "神経系", "id": "kan_mc_008"}, {"q": "大脳から独立して内臓器官や分泌腺を統制する末梢神経系の一部。 この内容に最も当てはまる用語はどれか。", "options": ["自律神経系", "中枢神経系", "末梢神経系", "体性神経系"], "answer": "自律神経系", "exp": "大脳から独立して内臓器官や分泌腺を統制する末梢神経系の一部。", "topic": "神経系", "id": "kan_mc_009"}, {"q": "受容器から感覚情報を中枢神経へ伝える神経。 この内容に最も当てはまる用語はどれか。", "options": ["感覚神経", "体性神経系", "自律神経系", "運動神経"], "answer": "感覚神経", "exp": "受容器から感覚情報を中枢神経へ伝える神経。", "to 。", "options": ["トムキンス", "ストラック", "エクマン", "ザイアンス"], "answer": "トムキンス", "exp": "仮説の提唱者はトムキンスで、ストラックらがペン実験を行った。", "topic": "情動理論", "id": "kan_mc_134"}, {"q": "ストラックらのペン実験でマンガをよりおもしろいと評価したのはどの群か。", "options": ["歯でペンをくわえた笑顔群", "唇でペンをくわえた非笑顔群", "ペンを持たなかった群だけ", "両群に差はなかった"], "answer": "歯でペンをくわえた笑顔群", "exp": "歯でペンをくわえる笑顔群の方がおもしろいと評価した。", "topic": "情動理論", "id": "kan_mc_135"}, {"q": "エクマンらが基本感情として分類した数はいくつか。", "options": ["6種類", "2種類", "4種類", "8種類"], "answer": "6種類", "exp": "喜び・驚き・恐れ・悲しみ・怒り・嫌悪の6種類。", "topic": "表情研究", "id": "kan_mc_136"}, {"q": "エクマンらの研究で示唆されたことはどれか。", "options": ["基本感情の表情表出や認知には普遍性がある", "表情認知は文化ごとに完全に異なる", "感情表情は学習では形成されないと証明された", "表情と感情は無関係である"], "answer": "基本感情の表情表出や認知には普遍性がある", "exp": "5か国で感情判断の一致率が高かったことから普遍性が示唆された。", "topic": "表情研究", "id": "kan_mc_137"}, {"q": "ラザルスの一次的評価と二次的評価の組合せとして正しいものはどれか。", "options": ["一次：有害か有用か　二次：対処可能かどうか", "一次：対処可能か　二次：好きか嫌いか", "一次：覚醒水準　二次：生理反応", "一次：過去記憶　二次：未来予測"], "answer": "一次：有害か有用か　二次：対処可能かどうか", "exp": "一次的評価・二次的評価の区別。", "topic": "情動理論", "id": "kan_mc_138"}, {"q": "ラザルスの説明で、有害だが対処可能と判断したときに生じる感情はどれか。", "options": ["怒り", "悲しみ", "静穏", "快活"], "answer": "怒り", "exp": "有害かつ対処可能では怒り、有害かつ対処不可能では無力感や悲しみとされる。", "topic": "情動理論", "id": "kan_mc_139"}, {"q": "ザイアンスが感情優先説の根拠とした現象はどれか。", "options": ["単純接触効果", "感情状態依存効果", "視覚的断崖", "自己乖離"], "answer": "単純接触効果", "exp": "単純接触効果が、認知評価に先立つ感情的評価の根拠として挙げられる。", "topic": "情動理論", "id": "kan_mc_140"}, {"q": "単純接触効果について正しいものはどれか。", "options": ["刺激を意識的に認識できないほど短時間でも生じうる", "完全に同一の刺激にしか生じない", "刺激への接触回数が増えるほど必ず嫌悪が高まる", "意識的な意味理解が必須である"], "answer": "刺激を意識的に認識できないほど短時間でも生じうる", "exp": "閾下単純接触でも生じると説明されている。", "topic": "情動理論", "id": "kan_mc_141"}, {"q": "ソマティック・マーカーの処理で重要な役割をもつ部位はどれか。", "options": ["腹内側前頭前野", "後頭葉一次視覚野", "小脳虫部", "松果体"], "answer": "腹内側前頭前野", "exp": "ソマティック・マーカーの重要な信号処理に腹内側前頭前野が関与するとされる。", "topic": "意思決定", "id": "kan_mc_142"}, {"q": "アイオワ・ギャンブリング課題で健常者が良いデッキを選びやすくなるのはおよそ何試行後か。", "options": ["40～50試行後", "4～5試行後", "100～120試行後", "1試行後"], "answer": "40～50試行後", "exp": "健常者は40、50試行後には良いデッキを選択するようになるとさ function matches(i){let r=ensure(i);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function currentList(){return order.filter(matches)}
function updateStats(){let total=QUESTIONS.length, done=0, wrong=0;QUESTIONS.forEach((_,i)=>{let r=ensure(i);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+total;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=currentList().length+'問表示'}
function setFilter(v){filter=v;idx=0;render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;render()}}

let selected=null,revealed=false,displayOpts=[];
function selectChoice(opt){if(revealed)return;selected=opt;render()}
function checkChoice(){if(revealed||selected===null)return;let qi=currentList()[idx],q=QUESTIONS[qi],r=ensure(qi);r.attempts++;session.answered++;if(selected===q.answer){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();revealed=true;render()}
function render(){updateStats();let list=currentList(),card=document.getElementById('card');if(!list.length){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}if(idx>=list.length)idx=0;let qi=list[idx],q=QUESTIONS[qi];if(card.dataset.qi!=qi||!displayOpts.length){selected=null;revealed=false;displayOpts=fisher(q.options);card.dataset.qi=qi}let ops=displayOpts.map(o=>{let c='opt';if(revealed&&o===q.answer)c+=' correct';else if(revealed&&o===selected&&o!==q.answer)c+=' wrong';else if(!revealed&&o===selected)c+=' selected';return `<button class="${c}" onclick='selectChoice(${JSON.stringify(o)})'>${o}</button>`}).join('');let fb='';if(revealed){let ok=selected===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><div class="answer">${ok?'○ 正解':'× 不正解'}　正解：${q.answer}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>`}let checkBtn=!revealed?`<button class="primary" onclick="checkChoice()" ${selected===null?'disabled':''}>答え合わせ</button>`:'';card.innerHTML=`<div class="qno">${idx+1} / ${list.length}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div><div class="options">${ops}</div><div style="margin-top:12px">${checkBtn}</div>${fb}<div class="nav"><button onclick="moveQ(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="moveQ(1)">次へ →</button></div>`;updateStats()}
function moveQ(d){revealed=false;selected=null;displayOpts=[];let list=currentList();idx=(idx+d+list.length)%list.length;document.getElementById('card').dataset.qi='';render()}
function retry(){revealed=false;selected=null;displayOpts=fisher(QUESTIONS[currentList()[idx]].options);render()}
render();</script></body></html>
