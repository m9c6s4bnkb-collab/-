<script type="application/json" id="questionBank">{"schema":1,"subject":"医療心理学","edition":"2026-09-02","source":"医療心理学.pdf","questions":[{"id":"med-01-01","topic":1,"domain":"systems","q":"古代医療で、精霊界と現実界の仲介者が祈りによって回復を願う治療のあり方を何という？","a":["シャーマニズム"],"d":["インキュベーション","催眠療法","ライフレビュー"],"e":"シャーマニズムではシャーマンが精霊界と現実界を仲介する。夢による癒しを求めるインキュベーションと区別する。"},{"id":"med-01-02","topic":1,"domain":"systems","q":"身を清めて寺社や洞窟にこもり、そこで見た夢によって癒しを得ようとする古代の治療法は？","a":["インキュベーション","孵化","ふか"],"d":["シャーマニズム","自由連想法","系統的脱感作法"],"e":"インキュベーションは「孵化」とも訳される。夢を通じて癒しを得るという特徴を押さえる。"},{"id":"med-01-03","topic":1,"domain":"systems","q":"古代医療で重視された病気の「意味づけや物語」を、資料ではどの外来語で表している？","a":["ナラティヴ","ナラティブ","ナラティヴに基づく治療","ナラティブに基づく治療"],"d":["エビデンス","コンプライアンス","アセスメント"],"e":"資料は、病気の意味や物語を重視する治療をナラティヴに基づくものとして説明している。"},{"id":"med-02-01","topic":2,"domain":"systems","q":"病院・診療所・助産所の定義や医療計画など、医療提供体制を定める法律は？","a":["医療法"],"d":["医師法","健康増進法","地域保健法"],"e":"医療法は良質で適切な医療を効率的に提供する体制を定め、医療を受ける人の適切な選択も支援する。"},{"id":"med-02-02","topic":2,"domain":"systems","q":"医療法の理念において、生命の尊重とともに保持すべきものは、個人の何？","a":["尊厳","個人の尊厳"],"d":["業績","所属","収入"],"e":"生命の尊重と個人の尊厳の保持が基本になる。患者を一人の人として尊重するという意味である。"},{"id":"med-02-03","topic":2,"domain":"systems","q":"医療法が医療提供の基盤として重視する、医療従事者と患者との関係は？","a":["信頼関係","信頼"],"d":["上下関係","競争関係","血縁関係"],"e":"医療は医療従事者と患者との信頼関係に基づいて行われることが重視される。"},{"id":"med-02-04","topic":2,"domain":"systems","q":"医療法が想定する医療には、治療や疾病予防に加え、失われた機能や生活の回復を支える何が含まれる？","a":["リハビリテーション","リハビリ"],"d":["トリアージ","スクリーニング","インテーク"],"e":"資料は、医療が治療だけでなく疾病予防やリハビリテーションを含むと説明している。"},{"id":"med-02-05","topic":2,"domain":"systems","q":"医療法が定める、医療事故の調査に関係する支援機関の正式名称は？","a":["医療事故調査・支援センター","医療事故調査支援センター"],"d":["精神医療審査会","精神保健福祉センター","産業保健総合支援センター"],"e":"医療事故調査・支援センターは医療事故調査制度に関わる。精神医療審査会は精神科入院や処遇の審査を行う機関である。"},{"id":"med-03-01","topic":3,"domain":"systems","q":"患者が受診する医療機関を自由に選べる、日本の医療制度の特徴は？","a":["フリーアクセス"],"d":["ゲートキーピング","トリアージ","アウトリーチ"],"e":"フリーアクセスは医療機関を選択して受診できることを指す。医療費が無料という意味ではない。"},{"id":"med-03-02","topic":3,"domain":"systems","q":"複数の疾患をもつ患者や幅広い健康問題に対応するため、2018年に始まった専門医制度は？","a":["総合診療専門医制度","総合診療専門医"],"d":["精神保健指定医制度","産業医制度","学校医制度"],"e":"高齢化や地域包括ケアの推進を背景に、総合的に診療する専門医が求められた。"},{"id":"med-03-03","topic":3,"domain":"systems","q":"紹介状なしの大病院受診に対する定額負担が、制度として導入されたのは何年？","a":["2016年","2016","平成28年"],"d":["2015年","2018年","2020年"],"e":"制度導入は2016年4月。資料の「2015年」は法改正と施行を分けて整理する必要がある。"},{"id":"med-03-04","topic":3,"domain":"systems","q":"フリーアクセスの課題として資料が挙げるのは、患者がどのような医療機関へ集中すること？","a":["大病院や専門医","大病院","大病院・専門医","専門医"],"d":["地域の保健所","学校の保健室","職場の健康相談室"],"e":"紹介状がなくても大病院や専門医を受診できるため、患者集中が起こり、機能分担が課題になる。"},{"id":"med-04-01","topic":4,"domain":"systems","q":"医療ニーズに応じて医療機能を分担する地域区分で、医療計画の基本となるものは？","a":["医療圏"],"d":["学区","生活圏","通勤圏"],"e":"医療圏は、地域の実情に応じて効率的な医療提供体制を整えるための区分である。"},{"id":"med-04-02","topic":4,"domain":"systems","q":"主に日常的な医療を担い、一般に市町村単位で考えられる医療圏は？","a":["一次医療圏","1次医療圏","第一医療圏"],"d":["二次医療圏","三次医療圏","広域災害医療圏"],"e":"一次医療圏は日常的な医療の範囲。二次は一般的な入院医療、三次は高度で専門的な医療に対応する。"},{"id":"med-04-03","topic":4,"domain":"systems","q":"一般的な入院医療を担い、複数の市町村から構成される医療圏は？","a":["二次医療圏","2次医療圏","第二医療圏"],"d":["一次医療圏","三次医療圏","広域災害医療圏"],"e":"二次医療圏は複数の市町村を一つの圏域として、入院医療などの提供体制を整える。"},{"id":"med-04-04","topic":4,"domain":"systems","q":"高度で専門的な医療を担い、原則として都道府県単位で設定される医療圏は？","a":["三次医療圏","3次医療圏","第三医療圏"],"d":["一次医療圏","二次医療圏","市町村保健圏"],"e":"三次医療圏は高度・専門医療を担う広い圏域である。一次・二次との役割の違いを押さえる。"},{"id":"med-05-01","topic":5,"domain":"systems","q":"「国民の心の健康の保持増進」に寄与する心理専門職の国家資格は？","a":["公認心理師"],"d":["臨床心理士","精神保健福祉士","産業カウンセラー"],"e":"公認心理師は、公認心理師法に基づく国家資格。臨床心理士などの資格と制度上の位置づけを区別する。"},{"id":"med-05-02","topic":5,"domain":"systems","q":"公認心理師のように、有資格者だけが一定の名称を名乗れる資格の方式を何という？","a":["名称独占","名称独占資格"],"d":["業務独占","必置資格","任用資格"],"e":"名称独占は名称の使用を有資格者に限る仕組み。心理支援の業務全体を独占する意味ではない。"},{"id":"med-05-03","topic":5,"domain":"systems","q":"公認心理師法が定義する専門業務は、大きく何つ？","a":["4つ","4","四つ"],"d":["3つ","5つ","6つ"],"e":"心理状態の観察・分析、本人への支援、関係者への支援、心の健康に関する教育・情報提供の4つである。"},{"id":"med-05-04","topic":5,"domain":"systems","q":"本人を支援する家族や教師の相談に応じることは、公認心理師の4業務のうち何にあたる？","a":["関係者への支援","関係者支援","関係者"],"d":["本人への直接支援","心理状態の観察・分析","心の健康に関する教育・情報提供"],"e":"本人への支援とは別に、本人を取り巻く関係者への相談・助言も法定業務に含まれる。"},{"id":"med-05-05","topic":5,"domain":"systems","q":"公認心理師の業務のうち、心の健康に関する知識を広める教育や情報提供を、資料では何という？","a":["心理教育"],"d":["心理査定","薬物療法","行動観察"],"e":"資料は教育・情報提供の業務を心理教育と整理している。個別の心理面接だけが業務ではない。"},{"id":"med-05-06","topic":5,"domain":"systems","q":"公認心理師の信用を傷つけるような行為を禁じる規定を何という？","a":["信用失墜行為の禁止","信用失墜行為禁止"],"d":["秘密保持義務","関係者との連携","資質向上の責務"],"e":"信用失墜行為の禁止は専門職としての信用を守る規定。秘密を守る義務とは別に定められる。"},{"id":"med-05-07","topic":5,"domain":"systems","q":"業務で知った人の秘密を、正当な理由なく漏らしてはならない公認心理師の義務は？","a":["秘密保持義務","守秘義務","秘密保持"],"d":["信用失墜行為の禁止","説明義務","記録保存義務"],"e":"秘密保持義務は、公認心理師でなくなった後も続く。資格を失えば秘密を話してよいということではない。"},{"id":"med-05-08","topic":5,"domain":"systems","q":"支援に係る主治の医師がいる場合、公認心理師が指示を受けなければならない相手は誰？","a":["主治医","主治の医師"],"d":["病院の事務長","都道府県知事","所属先の心理職全員"],"e":"関係者との連携に加え、支援に係る主治の医師がいる場合にはその指示を受けることが求められる。"},{"id":"med-05-09","topic":5,"domain":"systems","q":"国民の心の健康の保持増進を目的とする心理専門職の国家資格を持たない者が、その名称中に使うことを禁じられる3文字は？","a":["心理師"],"d":["心理士","相談員","支援員"],"e":"法律は「公認心理師」だけでなく、名称中の「心理師」の使用も制限している。「心理士」と文字を区別する。"},{"id":"med-06-01","topic":6,"domain":"systems","q":"精神保健福祉法の正式名称は？","a":["精神保健及び精神障害者福祉に関する法律","精神保健および精神障害者福祉に関する法律"],"d":["精神障害者の医療及び保護に関する法律","精神保健及び地域医療に関する法律","精神障害者の自立及び就労に関する法律"],"e":"正式名称は「精神保健及び精神障害者福祉に関する法律」。医療と福祉、権利擁護を含む法律である。"},{"id":"med-06-02","topic":6,"domain":"systems","q":"精神科入院の必要性や患者の処遇、退院・処遇改善の請求について審査する機関は？","a":["精神医療審査会"],"d":["医療事故調査・支援センター","障害支援区分認定審査会","労働委員会"],"e":"精神医療審査会は精神科入院や処遇について専門的・独立した立場から審査する。"},{"id":"med-06-03","topic":6,"domain":"systems","q":"精神医療審査会は、都道府県と、どの種類の市に置かれる？","a":["指定都市","政令指定都市"],"d":["中核市","一般市","特別区"],"e":"資料では都道府県と指定都市に設置されると説明している。市町村すべてに設置されるわけではない。"},{"id":"med-06-04","topic":6,"domain":"systems","q":"精神医療審査会の委員は、精神保健指定医、保健・福祉の専門家と、どの分野の専門家から構成される？","a":["法律","法律の専門家","法学","法律家"],"d":["薬学","栄養学","経営学"],"e":"医学だけでなく、保健・福祉と法律の専門性を取り入れ、入院や処遇を審査する。"},{"id":"med-06-05","topic":6,"domain":"systems","q":"精神保健福祉法が、社会復帰・自立とともに促進しようとする、社会の活動に加わることを何という？","a":["社会参加"],"d":["社会的比較","社会的促進","社会的手抜き"],"e":"精神保健福祉法の目的には、医療だけでなく自立や社会参加の促進も含まれる。"},{"id":"med-06-06","topic":6,"domain":"systems","q":"精神科病院の入院患者が、退院とは別に、入院中の扱いの改善を求める請求は？","a":["処遇改善の請求","処遇改善請求"],"d":["労災認定の請求","介護認定の請求","資格登録の請求"],"e":"退院請求と処遇改善請求は、精神医療審査会が審査する内容として挙げられている。"},{"id":"med-07-01","topic":7,"domain":"systems","q":"十分な説明を受け、内容を理解したうえで支援や治療に同意することを何という？","a":["インフォームド・コンセント","インフォームドコンセント","IC"],"d":["インフォームド・アセント","パターナリズム","アドヒアランス"],"e":"インフォームド・コンセントでは、単に署名を得るだけでなく、理解に基づく自発的な同意が重要である。"},{"id":"med-07-02","topic":7,"domain":"systems","q":"インフォームド・コンセントを行う時期について、資料が重視しているのは、支援関係のいつからいつまで？","a":["最初から最後まで","関係の最初から最後まで","全過程","支援の全過程","継続的に"],"d":["契約時の一度","検査を実施する当日","終結面接の直前"],"e":"説明と同意は初回で完結せず、関係の全過程で継続する。方針が変わる際にも理解を確認する。"},{"id":"med-07-03","topic":7,"domain":"systems","q":"説明を受ける人の理解を保障するため、平易な説明とともに保障すべき、疑問を伝えられる場は？","a":["質問の場","質問する機会","質問の機会","質問"],"d":["再契約の機会","支援者を評価する機会","検査を練習する機会"],"e":"一方的に説明するだけでは十分でない。提示方法に配慮し、質問できる機会を設ける。"},{"id":"med-07-04","topic":7,"domain":"systems","q":"資料では、同意のために提示する選択肢は少なくともいくつと説明されている？","a":["2つ","2","二つ","2つ以上"],"d":["1つ","3つ","4つ"],"e":"資料は2つ以上の選択肢の提示を挙げる。実際には実行可能な代替策や、受けない選択も含めた説明が重要になる。"},{"id":"med-07-05","topic":7,"domain":"systems","q":"いったん同意した人が、支援の途中でその同意を取り消すことを何という？","a":["同意の撤回","撤回"],"d":["代理同意","黙示の同意","包括同意"],"e":"資料は、途中で同意を撤回しても、そのことを理由に不利益を受けないことを重視している。"},{"id":"med-08-01","topic":8,"domain":"systems","q":"自傷他害のおそれがあり、精神保健指定医2名以上の判断が一致したときに、知事の権限で行う入院形態は？","a":["措置入院"],"d":["医療保護入院","任意入院","応急入院"],"e":"措置入院では自傷他害のおそれと、指定医2名以上の一致した判断が要点。家族等の同意に基づく医療保護入院と区別する。"},{"id":"med-08-02","topic":8,"domain":"systems","q":"通常の措置入院で、入院が必要という判断の一致が必要な精神保健指定医の人数は最低何名？","a":["2名","2人","2","二名","二人"],"d":["1名","3名","4名"],"e":"通常の措置入院は2名以上。緊急措置入院では1名の診察による例外的な手続がある。"},{"id":"med-08-03","topic":8,"domain":"systems","q":"資料で、通常の措置入院を行う権限をもつとされる行政機関の長は？","a":["都道府県知事","知事"],"d":["精神科病院の管理者","保健所長","家庭裁判所長"],"e":"措置入院は都道府県知事の権限で行われる。病院管理者が行う医療保護入院との違いである。"},{"id":"med-08-04","topic":8,"domain":"systems","q":"緊急性が高く通常の措置入院の手続をとれず、指定医1名の診察で行う入院形態は？","a":["緊急措置入院"],"d":["応急入院","医療保護入院","任意入院"],"e":"緊急措置入院にも自傷他害のおそれ等の要件がある。応急入院は家族等の同意が得られない急速を要する場合の制度である。"},{"id":"med-08-05","topic":8,"domain":"systems","q":"緊急措置入院で認められる入院期間の上限は何時間？","a":["72時間","72","七十二時間"],"d":["12時間","24時間","48時間"],"e":"緊急措置入院は72時間以内に限られる。通常の措置入院の要件や、その後の入院形態の検討と区別する。"},{"id":"med-08-06","topic":8,"domain":"systems","q":"精神障害のため任意入院できる状態になく、指定医が入院治療の必要性を認め、原則として家族等の同意で行う入院は？","a":["医療保護入院"],"d":["措置入院","緊急措置入院","応急入院"],"e":"医療保護入院は、本人が単に拒否しているという理由だけで成立する制度ではない。精神障害によって任意入院できる状態にない等の要件がある。"},{"id":"med-08-07","topic":8,"domain":"systems","q":"医療保護入院を行う主体は、精神科病院の誰？","a":["管理者","病院管理者","精神科病院の管理者"],"d":["都道府県知事","精神医療審査会の委員長","市町村の福祉事務所長"],"e":"医療保護入院は病院の管理者が行う。家族等の同意や指定医の診察は必要な手続であり、決定主体そのものとは区別する。"},{"id":"med-08-08","topic":8,"domain":"systems","q":"精神科入院患者の退院に向けた生活上の相談や関係機関との調整を担う、選任される相談員は？","a":["退院後生活環境相談員"],"d":["医療安全管理者","児童福祉司","介護認定調査員"],"e":"退院後生活環境相談員は早期退院と退院後の生活を支援する。医療保護入院者に加え、2024年4月から措置入院者への選任も義務化された。"},{"id":"med-09-01","topic":9,"domain":"systems","q":"精神保健福祉法において、患者本人の同意に基づいて行われる入院形態は？","a":["任意入院"],"d":["措置入院","医療保護入院","応急入院"],"e":"任意入院は本人の同意に基づく。原則として退院の申出があれば退院させなければならない。"},{"id":"med-09-02","topic":9,"domain":"systems","q":"任意入院者の退院の申出に対し、指定医の診察で入院継続が必要と判断された場合、退院を制限できるのは最長何時間？","a":["72時間","72","七十二時間"],"d":["12時間","24時間","48時間"],"e":"指定医の診察による退院制限は72時間まで。任意入院を期間の限りなく続けさせる根拠ではない。"},{"id":"med-09-03","topic":9,"domain":"systems","q":"直ちに入院が必要で任意入院できる状態になく、家族等の同意も得られない場合に、指定病院で行う入院形態は？","a":["応急入院"],"d":["緊急措置入院","任意入院","通常の措置入院"],"e":"応急入院は、本人や家族等の同意を得ることができず急速を要する場合の入院。自傷他害のおそれを要件とする緊急措置入院と区別する。"},{"id":"med-09-04","topic":9,"domain":"systems","q":"精神保健指定医の診察に基づく応急入院の期間の上限は何時間？","a":["72時間","72","七十二時間"],"d":["12時間","24時間","96時間"],"e":"指定医による応急入院は72時間まで。特定医師による例外的な12時間の制度と混同しないよう、問題では指定医と明記している。"},{"id":"med-09-05","topic":9,"domain":"systems","q":"応急入院を実施できるのは、都道府県知事が指定したどのような病院？","a":["応急入院指定病院"],"d":["特定機能病院","地域医療支援病院","すべての精神科病院"],"e":"応急入院は、応急入院の指定を受けた病院に限られる。精神科を標榜するだけで実施できるわけではない。"},{"id":"med-10-01","topic":10,"domain":"systems","q":"他の方法では回避しがたい危険があり、患者を一人で閉鎖的な部屋に入れる行動制限を何という？","a":["隔離"],"d":["身体拘束","保護観察","開放処遇"],"e":"隔離は医療・保護のためのやむを得ない制限であり、懲罰として行うものではない。"},{"id":"med-10-02","topic":10,"domain":"systems","q":"隔離が何時間を超える場合に、精神保健指定医の判断が必要になる？","a":["12時間","12","十二時間"],"d":["6時間","24時間","72時間"],"e":"12時間を超える隔離には指定医の判断が必要。12時間以下でも、要否の判断は医師が行う。"},{"id":"med-10-03","topic":10,"domain":"systems","q":"隔離中の医師の診察は、原則として少なくとも毎日何回必要？","a":["1回","1","一回"],"d":["2回","3回","4回"],"e":"隔離中は原則として少なくとも毎日1回の診察が必要であり、観察を続け漫然とした隔離を避ける。"},{"id":"med-10-04","topic":10,"domain":"systems","q":"12時間を超えない隔離についても、その要否を判断する必要がある専門職は？","a":["医師"],"d":["公認心理師","看護師","精神保健福祉士"],"e":"指定医の判断が不要な短時間の隔離でも、医師による判断は必要になる。"},{"id":"med-10-05","topic":10,"domain":"systems","q":"自傷のおそれ等が著しく切迫し、他によい代替方法がないときに、身体の動きを制限する処置は？","a":["身体拘束","身体的拘束"],"d":["通信制限","隔離","開放処遇"],"e":"身体拘束は制限が強く、二次的な身体的障害の可能性もある。代替方法が見つかるまでのやむを得ない処置として位置づけられる。"},{"id":"med-10-06","topic":10,"domain":"systems","q":"精神科入院患者の身体拘束について、時間の長短にかかわらず必要性を判断する医師の資格は？","a":["精神保健指定医","指定医"],"d":["産業医","学校医","総合診療専門医"],"e":"身体拘束には精神保健指定医の判断が必要。隔離の12時間という基準を身体拘束に当てはめない。"},{"id":"med-10-07","topic":10,"domain":"systems","q":"資料において、身体拘束中の医師の診察頻度はどのように示されている？","a":["毎日頻回","頻回","毎日頻回に行う"],"d":["毎日1回","週1回","月1回"],"e":"身体拘束中は頻回の診察と常時の臨床的観察を行い、必要性を繰り返し検討する。"},{"id":"med-10-08","topic":10,"domain":"systems","q":"入院患者が院外の人とやり取りする手紙を、行動制限の規定では何という？","a":["信書","手紙"],"d":["診療録","紹介状","同意書"],"e":"正しくは「信書」。資料の「親書」は表記を修正した。信書の発受は制限できない行動として扱われる。"},{"id":"med-10-09","topic":10,"domain":"systems","q":"人権擁護に関わる面会・電話で、患者の代理人となるどの専門職との連絡は制限できない？","a":["弁護士","代理人弁護士"],"d":["産業医","介護支援専門員","学校薬剤師"],"e":"患者の代理人である弁護士や、人権擁護に関わる行政職員との連絡は保護される。"},{"id":"med-10-10","topic":10,"domain":"systems","q":"任意入院患者の処遇は、原則としてどのような処遇？","a":["開放処遇"],"d":["閉鎖処遇","隔離処遇","拘束処遇"],"e":"任意入院は本人の同意に基づくため、原則は開放処遇。医療・保護上必要な場合に例外的な制限が検討される。"},{"id":"med-10-11","topic":10,"domain":"systems","q":"任意入院者の開放処遇を制限し始めた後、指定医が診察するのはおおむね何時間以内？","a":["72時間","72","七十二時間"],"d":["12時間","24時間","48時間"],"e":"医師の判断で開始できるが、その後おおむね72時間以内に指定医が診察する。"},{"id":"med-11-01","topic":11,"domain":"systems","q":"一定程度の精神障害の状態を認定し、自立や社会参加の支援につなげる手帳の正式名称は？","a":["精神障害者保健福祉手帳"],"d":["精神障害者医療福祉手帳","精神障害者福祉医療手帳","精神保健医療手帳"],"e":"正式名称は「精神障害者保健福祉手帳」。資料本文には名称の取り違えがあるため修正した。"},{"id":"med-11-02","topic":11,"domain":"systems","q":"精神障害者保健福祉手帳の有効期間は原則何年間？","a":["2年","2年間","2","二年"],"d":["1年","3年","5年"],"e":"有効期間は2年間。延長を希望する場合は更新手続が必要になる。"},{"id":"med-11-03","topic":11,"domain":"systems","q":"精神障害者保健福祉手帳の障害等級で、最も重い等級は何級？","a":["1級","1","一級"],"d":["2級","3級","6級"],"e":"重い方から1級・2級・3級。身体障害者手帳など別制度の等級と混同しない。"},{"id":"med-11-04","topic":11,"domain":"systems","q":"精神障害者保健福祉手帳の交付可否や等級の判定に関わる専門機関は？","a":["精神保健福祉センター"],"d":["児童相談所","労働基準監督署","医療事故調査・支援センター"],"e":"資料の「精神保健医療センター」は「精神保健福祉センター」に修正した。申請窓口や交付主体と、専門的判定を担う機関を区別する。"},{"id":"med-11-05","topic":11,"domain":"systems","q":"資料が、精神障害者保健福祉手帳の対象に原則として含めていないのは、どの障害だけがある場合？","a":["知的障害","知的障害だけ"],"d":["統合失調症","気分障害","てんかん"],"e":"知的障害のみの場合は通常、療育手帳など別の制度で扱われる。精神疾患を併せもつ場合は別に検討される。"},{"id":"med-12-01","topic":12,"domain":"systems","q":"医療場面で患者の権利を規定した、世界医師会の宣言は？","a":["リスボン宣言"],"d":["ヘルシンキ宣言","ジュネーブ宣言","オタワ憲章"],"e":"リスボン宣言は患者の権利に関する宣言。医学研究の倫理を扱うヘルシンキ宣言と区別する。"},{"id":"med-12-02","topic":12,"domain":"systems","q":"現在のリスボン宣言の原則は全部で何項目？","a":["11項目","11","十一項目"],"d":["10項目","8項目","12項目"],"e":"資料は①〜⑪を列挙しながら「10つ」と記している。世界医師会の宣言の原則は11項目である。"},{"id":"med-12-03","topic":12,"domain":"systems","q":"リスボン宣言で、診療する医師や医療機関を選ぶ権利は何という？","a":["選択の自由の権利","選択の自由"],"d":["情報に対する権利","健康教育を受ける権利","守秘義務に対する権利"],"e":"選択の自由は、医師や医療機関の選択・変更などに関わる。治療への同意を自分で決める自己決定の権利と関連するが区別される。"},{"id":"med-12-04","topic":12,"domain":"systems","q":"リスボン宣言で、自分が受ける治療について説明を受け、自ら同意・拒否を決める権利は？","a":["自己決定の権利","自己決定権"],"d":["健康教育を受ける権利","宗教的支援に関する権利","尊厳に対する権利"],"e":"自己決定の権利は、患者自身が治療に関わる決定を行うことを保障する。"},{"id":"med-12-05","topic":12,"domain":"systems","q":"リスボン宣言で、自分の病状や医療上の記録について知ることに関わる権利は？","a":["情報に対する権利","情報への権利"],"d":["守秘義務に対する権利","選択の自由の権利","宗教的支援に関する権利"],"e":"情報に対する権利と、情報を他者に漏らされない守秘義務に対する権利を区別する。"},{"id":"med-12-06","topic":12,"domain":"systems","q":"リスボン宣言で、患者の秘密をみだりに他者へ知られないようにする権利は？","a":["守秘義務に対する権利","秘密保持の権利","プライバシーの権利"],"d":["健康教育を受ける権利","選択の自由の権利","情報に対する権利"],"e":"守秘義務に対する権利は、患者情報を秘密として保護することに関わる。"},{"id":"med-12-07","topic":12,"domain":"systems","q":"リスボン宣言で、病気の予防や健康維持に必要な知識を学ぶことに関わる権利は？","a":["健康教育を受ける権利","健康教育の権利"],"d":["宗教的支援に関する権利","守秘義務に対する権利","尊厳に対する権利"],"e":"健康教育を受ける権利は、健康や疾病予防について学ぶことに関わる。"},{"id":"med-12-08","topic":12,"domain":"systems","q":"リスボン宣言で、信仰に応じた精神的・道徳的支えを受けることに関わる権利は？","a":["宗教的支援に関する権利","宗教的支援を受ける権利"],"d":["健康教育を受ける権利","選択の自由の権利","情報に対する権利"],"e":"宗教的支援に関する権利は、宗教的な支援を受けることや拒むことに関わる原則である。"},{"id":"med-13-01","topic":13,"domain":"systems","q":"医療倫理の歴史的起源として、資料が挙げる医師の宣誓は？","a":["ヒポクラテスの誓い","ヒポクラテスの誓"],"d":["リスボン宣言","ニュルンベルク綱領","オタワ憲章"],"e":"ヒポクラテスの誓いは、医師の職業倫理や任務に関する誓いとして挙げられる。"},{"id":"med-13-02","topic":13,"domain":"systems","q":"患者が自分で選んだ治療方針を尊重する、医療倫理の原則は？","a":["自律尊重原則","自律尊重","自律性尊重の原則"],"d":["善行原則","無危害原則","正義原則"],"e":"自律尊重では患者の意思決定を尊重する。そのための情報提供や理解の支援も重要になる。"},{"id":"med-13-03","topic":13,"domain":"systems","q":"患者にとっての利益をもたらす行為を行う、医療倫理の原則は？","a":["善行原則","善行"],"d":["自律尊重原則","無危害原則","正義原則"],"e":"善行は患者の利益を積極的に促進する原則。「害を与えない」という無危害と区別する。"},{"id":"med-13-04","topic":13,"domain":"systems","q":"患者に危害を及ぼすことを避ける、医療倫理の原則は？","a":["無危害原則","無危害","無害原則"],"d":["自律尊重原則","善行原則","正義原則"],"e":"無危害は、患者に害を与えないことを求める。善行は利益をもたらすことを求める。"},{"id":"med-13-05","topic":13,"domain":"systems","q":"医療における利益と負担を公平に配分する、医療倫理の原則は？","a":["正義原則","正義"],"d":["自律尊重原則","善行原則","無危害原則"],"e":"正義原則は医療資源や負担などの公平な配分に関わる。"},{"id":"med-14-01","topic":14,"domain":"systems","q":"治療の内容、危険性、期待される利益を把握する意思決定能力は？","a":["理解","理解能力"],"d":["認識","推論","意思表明"],"e":"理解は医療情報の内容を把握する能力。自分自身の問題として捉える認識と分けて考える。"},{"id":"med-14-02","topic":14,"domain":"systems","q":"「この病気や治療の必要性は、自分自身に関わることだ」と捉える意思決定能力は？","a":["認識","認識能力"],"d":["理解","推論","意思表明"],"e":"認識は、得た情報を自分の病気や状況に結びつけて捉える能力である。"},{"id":"med-14-03","topic":14,"domain":"systems","q":"複数の治療法の効果や将来への影響を比較し、筋道を立てて考える意思決定能力は？","a":["推論","推論能力"],"d":["理解","認識","意思表明"],"e":"推論は、選択肢を比較して理由を検討する能力。選択した意思を伝える能力とは別である。"},{"id":"med-14-04","topic":14,"domain":"systems","q":"自分が選んだ治療について、その意思を他者に伝える意思決定能力は？","a":["意思表明","意思表明能力"],"d":["理解","認識","推論"],"e":"意思表明は、自分の選択を他者に伝える能力。言葉の流暢さだけで全ての意思決定能力を判断しない。"},{"id":"med-14-05","topic":14,"domain":"systems","q":"意思決定能力が十分でない患者への同意手続で、資料が挙げる、法律上の権限をもつ人は？","a":["代理人","法的代理人","法律上の権限をもつ代理人"],"d":["職場の同僚","病院の受付担当者","隣人"],"e":"資料は、法律上の権限をもつ代理人から可能な限り同意を得るとしている。家族であれば常に全ての医療同意を代行できるという意味ではない。"},{"id":"med-15-01","topic":15,"domain":"systems","q":"事故には至らなかった「ヒヤリハット」を、資料では何と呼ぶ？","a":["インシデント"],"d":["アクシデント","コンプライアンス","トリアージ"],"e":"資料ではインシデントをヒヤリハット、アクシデントを事故として整理している。報告・分析して再発を防ぐ。"},{"id":"med-15-02","topic":15,"domain":"systems","q":"医療安全における「事故」を、資料ではどの外来語で表している？","a":["アクシデント"],"d":["インシデント","アセスメント","コンサルテーション"],"e":"アクシデントは事故として扱われる。組織の分類基準を踏まえ、インシデントも含めて分析することが重要である。"},{"id":"med-15-03","topic":15,"domain":"systems","q":"医療安全のために、起こり得る危険をあらかじめ考えて対処を学ぶ訓練は？","a":["危険予知トレーニング","危険予知訓練","KYT"],"d":["SST","リワークプログラム","ライフレビュー"],"e":"危険予知トレーニングは事故が起こる前に危険を見つける練習。事後の報告・分析と組み合わせて行う。"},{"id":"med-15-04","topic":15,"domain":"systems","q":"5S活動のうち、必要な物と不要な物を分け、不要な物を取り除くことは？","a":["整理"],"d":["整頓","清掃","清潔"],"e":"5Sは整理・整頓・清掃・清潔・躾。整理は要・不要を分けること、整頓は使いやすく配置することである。"},{"id":"med-15-05","topic":15,"domain":"systems","q":"5S活動のうち、必要な物を取り出しやすい場所に配置することは？","a":["整頓"],"d":["整理","清掃","躾"],"e":"整頓は物の配置や置き場所を整えること。不要な物を除く整理とは異なる。"},{"id":"med-15-06","topic":15,"domain":"systems","q":"5S活動のうち、汚れやごみを取り除くことは？","a":["清掃"],"d":["整理","整頓","躾"],"e":"清掃は汚れを取り除く活動。整ったきれいな状態を保つ清潔と区別する。"},{"id":"med-15-07","topic":15,"domain":"systems","q":"5S活動のうち、整理・整頓・清掃した状態を保つことは？","a":["清潔"],"d":["整理","清掃","躾"],"e":"清潔は、清掃などによって得られた良好な状態を維持することを指す。"},{"id":"med-15-08","topic":15,"domain":"systems","q":"5S活動のうち、決められた方法やルールを習慣として守ることは？","a":["躾","しつけ"],"d":["整理","整頓","清潔"],"e":"躾は、決められたことを守れるよう習慣づけること。5つを区別して覚える。"},{"id":"med-15-09","topic":15,"domain":"systems","q":"医師法で、医師の診療録に定められている保存期間は何年間？","a":["5年","5年間","5","五年"],"d":["2年","3年","10年"],"e":"診療録は医師法で5年間。資料の「診療に関する諸記録」の2年を、診療録を含む全記録の共通ルールにしない。"},{"id":"med-15-10","topic":15,"domain":"systems","q":"資料が挙げる、病院日誌や看護記録など「診療に関する諸記録」を備える期間は過去何年間？","a":["2年","2年間","2","二年"],"d":["1年","3年","5年"],"e":"医療法施行規則の「診療に関する諸記録」についての過去2年間という規定。診療録の5年や他の適用法令による保存義務は別に確認する。"},{"id":"med-15-11","topic":15,"domain":"systems","q":"患者と医療従事者の双方を病原体から守る取り組みは、資料の医療安全の3領域のうち何にあたる？","a":["感染症対策","感染対策","院内感染対策"],"d":["診療記録の管理","医療事故の分析","医薬品の在庫管理"],"e":"感染対策は患者を守ると同時に、診療に関わる医療者自身を守る取り組みでもある。"},{"id":"med-16-01","topic":16,"domain":"health","q":"母子保健・成人保健・老人保健などを含む、地域住民を対象とする保健活動の領域は？","a":["地域保健"],"d":["学校保健","産業保健","環境保健"],"e":"地域保健は、母子・成人・高齢者など地域で生活する人々の健康を支える。"},{"id":"med-16-02","topic":16,"domain":"health","q":"学校で行う健康教育、安全確保、給食などに関わる保健活動の領域は？","a":["学校保健"],"d":["地域保健","産業保健","環境保健"],"e":"学校保健は学校という場で行われる保健活動。児童生徒だけでなく教職員も対象となる。"},{"id":"med-16-03","topic":16,"domain":"health","q":"労働基準法や労働安全衛生法などに基づく、働く人を対象とした保健活動の領域は？","a":["産業保健"],"d":["学校保健","環境保健","母子保健"],"e":"産業保健は労働者の健康と安全を守る活動であり、職場環境や過重労働への対応も含む。"},{"id":"med-16-04","topic":16,"domain":"health","q":"大気汚染、騒音、廃棄物処理などを扱う保健活動の領域は？","a":["環境保健"],"d":["精神保健","学校保健","成人保健"],"e":"環境保健は、生活環境の要因から健康を守る領域である。"},{"id":"med-16-05","topic":16,"domain":"health","q":"住民の心の健康の保持増進や、精神障害のある人への援助に関わる保健活動の領域は？","a":["精神保健"],"d":["環境保健","産業保健","学校保健"],"e":"精神保健は精神的な健康に関わる領域。実際の活動では地域・学校・職場などとも重なり合う。"},{"id":"med-16-06","topic":16,"domain":"health","q":"資料では、保健活動は急性期・慢性期の患者に加え、どのような人も対象に含む？","a":["健常者","健康な人","未発症の人","疾患を発症していない人"],"d":["急性疾患の入院患者","再発予防中の患者","リハビリテーション中の患者"],"e":"発症前の健康増進・疾病予防から、発症後の治療や再発予防までが対象になる。"},{"id":"med-17-01","topic":17,"domain":"health","q":"健康教育や予防接種など、病気の発症自体を防ぐ予防段階は？","a":["一次予防","1次予防","第一予防"],"d":["二次予防","三次予防","再発後の治療"],"e":"一次予防は健康増進と発病予防。早期発見・早期治療を行う二次予防と区別する。"},{"id":"med-17-02","topic":17,"domain":"health","q":"集団検診などを通じて、病気を早く見つけて早く治療する予防段階は？","a":["二次予防","2次予防","第二予防"],"d":["一次予防","三次予防","終末期ケア"],"e":"二次予防は早期発見・早期治療。発症そのものを防ぐ一次予防とは目的が異なる。"},{"id":"med-17-03","topic":17,"domain":"health","q":"疾患の悪化や機能障害を防ぎ、リハビリテーションや社会復帰を支える予防段階は？","a":["三次予防","3次予防","第三予防"],"d":["一次予防","二次予防","発症前教育"],"e":"三次予防は発症後の悪化・障害の防止や社会復帰を目指す。時期だけでなく活動の目的で判断する。"},{"id":"med-18-01","topic":18,"domain":"health","q":"成人期の人々を対象に、健康教室やがん検診などを行う保健活動は？","a":["成人保健"],"d":["母子保健","学校保健","産業保健"],"e":"成人保健は成人の健康維持・増進と疾病予防を目的に、相談・教育・検診などを行う。"},{"id":"med-18-02","topic":18,"domain":"health","q":"資料で、特定健康診査・特定保健指導や後期高齢者医療制度の根拠として挙げられている法律は？","a":["高齢者医療確保法","高齢者の医療の確保に関する法律"],"d":["介護保険法","母子保健法","医師法"],"e":"高齢者の医療の確保に関する法律が根拠となる。特定健診等は高齢者だけが対象という意味ではない。"},{"id":"med-18-03","topic":18,"domain":"health","q":"後期高齢者医療制度で、都道府県内の市町村が加入し制度運営を担う組織は？","a":["後期高齢者医療広域連合","広域連合"],"d":["精神医療審査会","地域包括支援センター","社会福祉協議会"],"e":"資料は後期高齢者医療広域連合による保健事業を挙げている。地域包括支援センターとは別の組織である。"},{"id":"med-19-01","topic":19,"domain":"health","q":"アルコール・薬物だけでなく、ギャンブルやゲームなどについても地域保健の課題となる問題は？","a":["依存","依存の問題","依存症"],"d":["せん妄","解離","失語"],"e":"依存の問題では医学的治療に加え、本人と家族への心理支援が必要になる。"},{"id":"med-19-02","topic":19,"domain":"health","q":"社会的要因や精神疾患との関連も考え、医療・福祉・教育・労働の連携で支える、長く社会的交流が乏しい状態は？","a":["ひきこもり","引きこもり","引き籠もり"],"d":["せん妄","緊張病","失行"],"e":"資料はひきこもり支援で多分野の連携を重視する。ひきこもりを一つの精神疾患と同一視しない。"},{"id":"med-19-03","topic":19,"domain":"health","q":"児童虐待や高齢者虐待などを把握した際、関係機関へ知らせる行為を何という？","a":["通告","通報","通告・通報","通報・通告"],"d":["隔離","診断","措置入院"],"e":"資料は虐待・暴力について関係機関への通告・通報を挙げる。具体的な義務や手続は対象・根拠法によって異なる。"},{"id":"med-19-04","topic":19,"domain":"health","q":"資料は、自殺の背景にある要因をどのように捉えている？","a":["複合的要因","複数の要因","複合要因"],"d":["単一の遺伝的要因","単一の経済的要因","単一の性格的要因"],"e":"自殺は複合的要因によって生じ得るため、医療・学校・職場・地域等が連携した対策が必要である。"},{"id":"med-20-01","topic":20,"domain":"health","q":"自殺の危険を示すサインに気づき、声をかけ、話を聴き、必要な援助につなぐ人を何という？","a":["ゲートキーパー"],"d":["ケースワーカー","ピアレビューアー","リスクマネジャー"],"e":"ゲートキーパーの役割は気づき・傾聴・つなぎ・見守り。専門家だけに限られる役割ではない。"},{"id":"med-20-02","topic":20,"domain":"health","q":"ゲートキーパーの4つの役割で、相手の変化を察して声をかけることは？","a":["気づき","気付き"],"d":["傾聴","つなぎ","見守り"],"e":"気づきは、変化やサインを見つけて声をかけること。相談が来るのを待つだけではない。"},{"id":"med-20-03","topic":20,"domain":"health","q":"ゲートキーパーの4つの役割で、本人の気持ちを尊重して耳を傾けることは？","a":["傾聴"],"d":["気づき","つなぎ","見守り"],"e":"傾聴では相手の気持ちを尊重して話を聴く。評価や説教を急がない姿勢が重要になる。"},{"id":"med-20-04","topic":20,"domain":"health","q":"ゲートキーパーの4つの役割で、専門家への早めの相談を促すことは？","a":["つなぎ","繋ぎ","つなぐ"],"d":["気づき","傾聴","見守り"],"e":"つなぎは必要な援助や専門家へ橋渡しすること。自分一人で問題を解決しようとしない。"},{"id":"med-20-05","topic":20,"domain":"health","q":"ゲートキーパーの4つの役割で、温かく寄り添い、その後も心配りを続けることは？","a":["見守り","見守る"],"d":["気づき","傾聴","つなぎ"],"e":"見守りは援助につないだ後も相手に関心をもち、心配りを続けることを含む。"},{"id":"med-21-01","topic":21,"domain":"health","q":"学校保健を各学校で行う際、資料が責任者として挙げているのは誰？","a":["学校長","校長"],"d":["養護教諭","学校医","PTA会長"],"e":"学校保健は学校長の責任のもとで、教職員・養護教諭・学校医などが関わって行う。"},{"id":"med-21-02","topic":21,"domain":"health","q":"学校教育法とともに、学校保健の基盤として資料が挙げる法律は？","a":["学校保健安全法"],"d":["労働安全衛生法","母子保健法","医療法"],"e":"学校保健安全法は学校での保健・安全に関わる基本的な法律である。"},{"id":"med-21-03","topic":21,"domain":"health","q":"学校保健に関わる専門職として、学校医・学校歯科医とともに挙げられるのは？","a":["学校薬剤師"],"d":["精神保健指定医","労働基準監督官","児童福祉司"],"e":"学校保健には学校医、学校歯科医、学校薬剤師などの外部専門職も関わる。"},{"id":"med-21-04","topic":21,"domain":"health","q":"学校保健の対象として、児童・生徒・学生以外に資料が挙げる人々は？","a":["教職員","学校の教職員"],"d":["卒業生","近隣の住民","学校への納入業者"],"e":"資料は児童生徒・学生だけでなく、教職員の健康も対象に含めている。"},{"id":"med-22-01","topic":22,"domain":"health","q":"スクールカウンセラーやソーシャルワーカーを活用し、家庭・地域とも連携して学校を支える取り組みは？","a":["チーム学校","チームとしての学校"],"d":["地域移行支援","職場復帰支援","医療観察制度"],"e":"チーム学校では、学校内外の専門性を生かして連携し、子どもや保護者等を支援する。"},{"id":"med-22-02","topic":22,"domain":"health","q":"学校で心理面の相談支援を担う専門職として、資料がソーシャルワーカーとともに挙げるのは？","a":["スクールカウンセラー","SC"],"d":["学校薬剤師","労働基準監督官","退院後生活環境相談員"],"e":"スクールカウンセラーは心理的支援、スクールソーシャルワーカーは環境・制度への働きかけなどの専門性を生かして連携する。"},{"id":"med-22-03","topic":22,"domain":"health","q":"学校で支援を考える際、児童期・思春期の変化とともに理解が重要とされる、個々の発達上の特徴は？","a":["発達特性","発達の特性"],"d":["医療圏","労働衛生基準","疾病の病期"],"e":"発達特性や障害への理解を踏まえ、子どもに合った支援を考えることが重要である。"},{"id":"med-23-01","topic":23,"domain":"health","q":"産業保健の根拠法として、労働基準法とともに資料が挙げる法律は？","a":["労働安全衛生法"],"d":["学校保健安全法","精神保健福祉法","地域保健法"],"e":"労働安全衛生法は、職場の安全・健康管理やストレスチェック制度などの基盤になる。"},{"id":"med-23-02","topic":23,"domain":"health","q":"産業保健に関わる行政機関として、都道府県労働局とともに挙げられる、労働条件等を監督する機関は？","a":["労働基準監督署"],"d":["児童相談所","精神医療審査会","保健センター"],"e":"資料は労働局・労働基準監督署・産業保健総合支援センター等を挙げる。"},{"id":"med-23-03","topic":23,"domain":"health","q":"職場で産業医・保健師・看護師・カウンセラーなどが協働することを、職種間の何という？","a":["連携","多職種連携","職種間連携"],"d":["職種別の独立運用","業務の全面委譲","単一職種への集約"],"e":"職場の健康は一つの職種だけで完結せず、多職種が連携して支える。"},{"id":"med-24-01","topic":24,"domain":"health","q":"職場の騒音を下げたり有害物質の濃度を下げたりする、労働衛生上の管理は？","a":["作業環境管理"],"d":["作業管理","健康管理","労務管理"],"e":"作業環境管理は作業を行う環境の有害要因を減らすこと。作業方法や時間を調整する作業管理と区別する。"},{"id":"med-24-02","topic":24,"domain":"health","q":"作業手順や作業時間、休憩の取り方を調整して負担を減らす、労働衛生上の管理は？","a":["作業管理"],"d":["作業環境管理","健康管理","設備管理"],"e":"作業管理は「どのように働くか」を調整する。環境そのものを整える作業環境管理とは異なる。"},{"id":"med-24-03","topic":24,"domain":"health","q":"健康診断、運動・栄養指導、心理相談などを行う、労働衛生上の管理は？","a":["健康管理"],"d":["作業管理","作業環境管理","工程管理"],"e":"健康管理は労働者の心身の状態を把握し、疾病予防や健康の維持・増進を図る。"},{"id":"med-25-01","topic":25,"domain":"health","q":"職場の4つのケアで、労働者自身がストレスに気づき対処するものは？","a":["セルフケア"],"d":["ラインによるケア","事業場内産業保健スタッフ等によるケア","事業場外資源によるケア"],"e":"セルフケアは本人による気づきと対処。管理監督者や専門スタッフによるケアも組み合わせる。"},{"id":"med-25-02","topic":25,"domain":"health","q":"職場の4つのケアで、管理監督者が部下の相談や職場環境の改善に関わるものは？","a":["ラインによるケア","ラインケア"],"d":["セルフケア","事業場内産業保健スタッフ等によるケア","事業場外資源によるケア"],"e":"ラインによるケアは上司などの管理監督者が担う。産業医等が担う専門的ケアと区別する。"},{"id":"med-25-03","topic":25,"domain":"health","q":"職場の4つのケアで、職場の産業医や保健師、カウンセラー等が担うものは？","a":["事業場内産業保健スタッフ等によるケア","事業場内産業保健スタッフによるケア","事業場内スタッフによるケア","事業所内資源によるケア"],"d":["セルフケア","ラインによるケア","事業場外資源によるケア"],"e":"職場内部の産業保健スタッフ等による専門的支援。外部機関を利用するケアと区別する。"},{"id":"med-25-04","topic":25,"domain":"health","q":"職場の4つのケアで、外部の医療機関などを活用するものは？","a":["事業場外資源によるケア","事業所外資源によるケア","外部資源によるケア"],"d":["セルフケア","ラインによるケア","事業場内産業保健スタッフ等によるケア"],"e":"事業場外資源によるケアは、外部の専門機関を活用して職場内の取り組みを支える。"},{"id":"med-26-01","topic":26,"domain":"health","q":"心理的負担を把握する検査と、その結果に基づく医師の面接指導等からなる職場の制度は？","a":["ストレスチェック制度","ストレスチェック"],"d":["特定健康診査","就学時健康診断","医療観察制度"],"e":"労働安全衛生法第66条の10に規定される。労働者の気づきや職場改善を通じ、メンタルヘルス不調を予防する。"},{"id":"med-26-02","topic":26,"domain":"health","q":"ストレスチェック制度の主目的は、メンタルヘルス不調を未然に防ぐ何次予防？","a":["一次予防","1次予防","1","一次"],"d":["二次予防","三次予防","発症後のリハビリテーション"],"e":"ストレスに気づき対処することで発症を防ぐ一次予防が主目的。精神疾患の診断そのものを目的とする検査ではない。"},{"id":"med-26-03","topic":26,"domain":"health","q":"2026年9月時点で、ストレスチェックの実施義務の基準となる事業場の労働者数は何人以上？","a":["50人","50","五十人","50人以上"],"d":["10人","30人","100人"],"e":"現時点の基準は50人以上。50人未満にも2028年4月1日から義務が広がるため、時点を付けて出題している。"},{"id":"med-26-04","topic":26,"domain":"health","q":"ストレスチェックの3領域は、仕事のストレス要因、心身のストレス反応と、周囲の何？","a":["サポート","支援","周囲のサポート"],"d":["裁量","評価","期待"],"e":"検査には仕事のストレス要因、心身のストレス反応、周囲のサポートの3領域が必要とされる。"},{"id":"med-26-05","topic":26,"domain":"health","q":"資料がストレスチェックで使用を推奨するとしている調査票は？","a":["職業性ストレス簡易調査票"],"d":["一般健康調査票","成人用ソーシャルスキル自己評定尺度","精神健康調査票"],"e":"職業性ストレス簡易調査票は、仕事の要因・ストレス反応・周囲のサポートを把握するために用いられる。"},{"id":"med-26-06","topic":26,"domain":"health","q":"ストレスチェックの個人結果は、実施者から直接、誰に通知される？","a":["労働者本人","本人","受検者本人","受検者"],"d":["直属の上司","人事担当者","事業者の代表者"],"e":"個人結果はまず本人に通知される。事業者に提供するには本人の同意が必要になる。"},{"id":"med-26-07","topic":26,"domain":"health","q":"ストレスチェックの個人結果を事業者に提供するために必要なものは？","a":["本人の同意","労働者本人の同意","同意"],"d":["上司の推薦","同僚の署名","家族の許可"],"e":"本人の同意なく個人結果を事業者に提供することは禁止される。個人結果と集団分析の情報を混同しない。"},{"id":"med-26-08","topic":26,"domain":"health","q":"高ストレスで面接指導が必要とされた労働者から申出があったとき、面接指導を実施する職種は？","a":["医師"],"d":["衛生管理者","公認心理師","人事担当者"],"e":"事業者は医師による面接指導を実施する。心理職による相談と、制度上の医師の面接指導は区別する。"},{"id":"med-27-01","topic":27,"domain":"health","q":"仕事上の責任を果たしながら、家庭や地域生活でも多様な生き方を選べる「仕事と生活の調和」を何という？","a":["ワーク・ライフ・バランス","ワークライフバランス","WLB"],"d":["ワーカホリズム","バーンアウト","プレゼンティーイズム"],"e":"ワーク・ライフ・バランスは仕事と生活の調和。単に仕事時間を一律に減らす意味ではない。"},{"id":"med-27-02","topic":27,"domain":"health","q":"「仕事と生活の調和（ワーク・ライフ・バランス）憲章」が策定された年は？","a":["2007年","2007","平成19年"],"d":["2003年","2010年","2015年"],"e":"資料は2007年の策定を挙げる。目指す社会や関係者が果たす役割を示したものである。"},{"id":"med-27-03","topic":27,"domain":"health","q":"仕事と生活の調和憲章が目指す社会の一つは、就労による何的自立が可能な社会？","a":["経済的自立","経済","経済的"],"d":["心理的自立","社会的自立","身体的自立"],"e":"「就労による経済的自立が可能な社会」が挙げられている。"},{"id":"med-27-04","topic":27,"domain":"health","q":"仕事と生活の調和憲章は、健康で豊かな生活のために何を確保できる社会を目指す？","a":["時間","生活時間","生活のための時間"],"d":["所得","技能","職位"],"e":"経済的自立に加え、健康で豊かな生活のための時間、多様な働き方・生き方の選択を重視する。"},{"id":"med-28-01","topic":28,"domain":"practice","q":"病気や障害を抱えていても、生活の主体者として人生を再生・再構築していくことを何という？","a":["リカバリー"],"d":["寛解","レスポンス","再発予防"],"e":"リカバリーは症状の変化に限らず、本人の人生や社会的な役割の回復を含む。"},{"id":"med-28-02","topic":28,"domain":"practice","q":"リカバリーのうち、症状の減少や機能の回復に注目するものは？","a":["臨床的リカバリー","クリニカルリカバリー"],"d":["パーソナル・リカバリー","心理的ディタッチメント","職務満足感"],"e":"臨床的リカバリーは症状・機能の回復に注目する。本人の満足や希望を重視するパーソナル・リカバリーと区別する。"},{"id":"med-28-03","topic":28,"domain":"practice","q":"リカバリーのうち、当事者自身の満足のある生活や希望の実現を重視するものは？","a":["パーソナル・リカバリー","パーソナルリカバリー","個人的リカバリー"],"d":["臨床的リカバリー","医学的寛解","症状反応"],"e":"パーソナル・リカバリーでは、病気が残っていても自分らしい生活や希望を実現する過程が重要である。"},{"id":"med-28-04","topic":28,"domain":"practice","q":"同じ問題や経験をもつ人たちが、自分たちの力で助け合う活動を、資料では何という？","a":["セルフヘルプ活動","セルフヘルプ","自助活動","自助グループ"],"d":["家族へのコンサルテーション","病院によるケース会議","専門家による集団査定"],"e":"資料は、セルフヘルプ活動や知識教育が活動・参加の制約を減らし、精神的な回復にもつながると説明する。"},{"id":"med-28-05","topic":28,"domain":"practice","q":"産業保健領域で、日常のストレスや疲労から回復し、自分らしい生活を取り戻す過程や活動を何という？","a":["リカバリー体験"],"d":["対象喪失","作為体験","身体的被影響体験"],"e":"資料のリカバリー体験は、ストレスや疲労による心身のダメージから回復する過程・活動を指す。"},{"id":"med-29-01","topic":29,"domain":"practice","q":"相談を受け始める際の最初の面接で、受理面接・初回面接とも呼ばれるものは？","a":["インテーク面接","インテイク面接","インテーク","インテイク","予診","受理面接","初回面接"],"d":["終結面接","フォローアップ面接","ライフレビュー面接"],"e":"インテーク面接では情報収集と、相談機関が提供できるサービスの説明を行う。"},{"id":"med-29-02","topic":29,"domain":"practice","q":"インテーク面接では、情報収集に加えて、相談機関が提供できる何について説明する？","a":["サービス","支援内容","提供できる支援","支援サービス"],"d":["診断の最終結果","標準化検査の正答","他機関の内部評価"],"e":"相談機関が提供できるサービスを伝え、クライエントが支援を受ける意思を確認する。"},{"id":"med-29-03","topic":29,"domain":"practice","q":"インテーク面接で、受容と共感を通して形成する、信頼に基づく関係を何という？","a":["ラポール","ラポート"],"d":["転移","同一化","逆転移"],"e":"ラポールは安心して相談できる信頼関係。情報収集を急ぐだけでは形成しにくい。"},{"id":"med-29-04","topic":29,"domain":"practice","q":"インテーク面接で得た情報は、適切なアセスメントと、何の方法を決めるために用いられる？","a":["支援","援助","支援方法","援助方法"],"d":["診療報酬の算定","疾病分類の改訂","集団基準の標準化"],"e":"抱える問題や状況を理解し、どのようなアセスメントや支援が適切かを考える。"},{"id":"med-29-05","topic":29,"domain":"practice","q":"インテーク面接は情報収集の手続であるだけでなく、それ自体がどのような機能をもつ？","a":["支援","援助","支援機能","治療的機能"],"d":["認定機能","診断分類機能","予後判定機能"],"e":"話を受け止められる経験そのものが支援になるため、後の支援につなぐだけの準備作業とは捉えない。"},{"id":"med-30-01","topic":30,"domain":"practice","q":"パーソナリティ・行動傾向・生活状況などを多角的に評価・理解することを何という？","a":["心理アセスメント","心理査定","アセスメント"],"d":["薬物療法","トリアージ","行動制限"],"e":"心理アセスメントは問題点だけでなく、健康な側面や強みも把握して支援に役立てる。"},{"id":"med-30-02","topic":30,"domain":"practice","q":"本人と対話し、話の内容ややり取りから状態を理解する、資料の心理アセスメント方法は？","a":["面接法","面接"],"d":["行動観察法","心理検査法","文献研究法"],"e":"面接法は対話を通じて情報を得る方法。行動観察法・心理検査法と組み合わせて多面的に理解する。"},{"id":"med-30-03","topic":30,"domain":"practice","q":"本人の行動を直接見て、表情・動き・他者との関わりなどを把握するアセスメント方法は？","a":["行動観察法","行動観察","観察法"],"d":["面接法","心理検査法","文献研究法"],"e":"行動観察では実際の振る舞いや状況を観察する。言葉による説明や検査結果と組み合わせて理解する。"},{"id":"med-30-04","topic":30,"domain":"practice","q":"心理アセスメントで、病的な側面とともに把握する、本人が活用できる健康な力や資源は？","a":["強み","ストレングス","健康な側面"],"d":["主訴","診断名","病歴"],"e":"本人の強みや資源も把握することが支援につながる。病的側面だけに限定しない。"},{"id":"med-30-05","topic":30,"domain":"practice","q":"集めた情報から立て、必要に応じて修正しながら支援に生かす、クライエント理解の仮説は？","a":["見立て","ケースフォーミュレーション","事例定式化"],"d":["診断基準","カットオフ値","標準得点"],"e":"見立ては一度決めて固定するものではなく、新しい情報や支援の経過に応じて修正する。"},{"id":"med-30-06","topic":30,"domain":"practice","q":"あらかじめ定められた課題や質問への反応を用いて心理的特徴を把握する、資料のアセスメント方法は？","a":["心理検査法","心理検査"],"d":["面接法","行動観察法","文献研究法"],"e":"心理検査法では定められた課題や質問を用いる。面接や行動観察から得た情報と合わせて理解する。"},{"id":"med-31-01","topic":31,"domain":"practice","q":"病院の心理面接は、資料では原則として誰の指示や依頼に基づいて実施するとされる？","a":["医師","主治医"],"d":["学校長","都道府県知事","労働基準監督官"],"e":"病院では医師の指示・依頼や診療チームとの連携のもとで心理面接が行われる。"},{"id":"med-31-02","topic":31,"domain":"practice","q":"病院で面接の目的が明確でない場合、心理職が患者と主治医と話し合って設定するものは？","a":["面接の目標","現実的な目標","目標","支援目標"],"d":["疾病の分類基準","心理検査の換算基準","障害認定の基準"],"e":"患者や主治医の期待を確認し、現実的な目標を共有することが重要である。"},{"id":"med-31-03","topic":31,"domain":"practice","q":"心理面接の時間や場所など、面接を支える枠組みを何という？","a":["面接構造","構造","治療構造"],"d":["病型分類","医療圏","診療科編成"],"e":"病院では構造を意識しながらも、患者の身体状態や病棟の事情に応じて柔軟に対応する。"},{"id":"med-32-01","topic":32,"domain":"practice","q":"集団内の対人関係や相互作用を活用し、精神症状の改善や社会適応を促す支援は？","a":["グループ・ワーク","グループワーク","集団精神療法","集団心理療法"],"d":["個人心理療法","心理検査法","身体療法"],"e":"集団精神療法は集団の相互作用を活用する。参加者間の交流自体が支援の要素になる。"},{"id":"med-32-02","topic":32,"domain":"practice","q":"集団プログラムのうち、休職した人の職場復帰を支えるものは？","a":["リワーク","リワークプログラム","職場復帰支援"],"d":["回想法","脱嗜癖プログラム","緩和ケア"],"e":"資料はグループ・ワークの例としてリワークを挙げる。職場復帰に向けた支援を行う。"},{"id":"med-32-03","topic":32,"domain":"practice","q":"入院集団精神療法の目標に挙げられる、自分自身への理解を深めることを何という？","a":["自己洞察","自己理解","自己洞察の深化"],"d":["対人依存","自己喪失","思考抑制"],"e":"資料は対人不安や葛藤の軽減、自己洞察の深化、対人関係技術の習得を挙げる。"},{"id":"med-32-04","topic":32,"domain":"practice","q":"資料の入院・通院集団精神療法の説明では、実施にあたるスタッフは精神科医等を含めて最低何名？","a":["2名","2人","2","二名"],"d":["1名","3名","4名"],"e":"資料では2名以上のスタッフとされる。この説明を、あらゆるグループ活動の一律の人数要件として広げない。"},{"id":"med-33-01","topic":33,"domain":"practice","q":"身体科と精神科などが、継続的な協力関係を組織して共同治療を行うことを何という？","a":["リエゾン"],"d":["コンサルテーション","トリアージ","インテーク"],"e":"リエゾンは専門職間の連携・継続的な協力関係を指す。全人的な医療を目指す。"},{"id":"med-33-02","topic":33,"domain":"practice","q":"心理職が、患者を支援している看護師等の専門職に助言し、その援助を支えることを何という？","a":["コンサルテーション","コンサルテーション支援"],"d":["個人心理療法","心理検査","トリアージ"],"e":"コンサルテーションは、直接患者だけに働きかけるのではなく、患者の援助に関わる専門職を支援する。"},{"id":"med-33-03","topic":33,"domain":"practice","q":"リエゾンを説明する資料中の表現は、「病気より何を診る」？","a":["病人","患者","人"],"d":["診療科","検査値","病名"],"e":"「病気より病人」は、病気の一面だけでなく、その病気をもつ人全体を理解する姿勢を表している。"},{"id":"med-34-01","topic":34,"domain":"psychiatry","q":"妄想や幻覚、感情の平板化などを主症状とし、資料で思春期から青年期を好発期とする疾患は？","a":["統合失調症"],"d":["せん妄","認知症","強迫症"],"e":"統合失調症には陽性症状と陰性症状があり、経過や支援を多面的に理解する必要がある。"},{"id":"med-34-02","topic":34,"domain":"psychiatry","q":"統合失調症の幻覚・妄想のように、通常はみられない体験が加わる症状群を何という？","a":["陽性症状"],"d":["陰性症状","離脱症状","解離症状"],"e":"「陽性」は良い症状という意味ではなく、通常ない体験が加わるという意味で用いられる。"},{"id":"med-34-03","topic":34,"domain":"psychiatry","q":"統合失調症の意欲低下・感情の平板化のように、通常ある機能が低下する症状群を何という？","a":["陰性症状"],"d":["陽性症状","強迫症状","離脱症状"],"e":"「陰性」は、本来あるはずの機能や反応の減少を指す。"},{"id":"med-34-04","topic":34,"domain":"psychiatry","q":"統合失調症で、喜怒哀楽の表出が乏しくなることを、資料では感情の何という？","a":["平板化","感情の平板化"],"d":["高揚","両価性","転移"],"e":"感情の平板化は陰性症状に含まれる。気分が高ぶることとは異なる。"},{"id":"med-34-05","topic":34,"domain":"psychiatry","q":"資料は統合失調症が発症しやすい時期を、思春期から何期としている？","a":["青年期"],"d":["幼児期","乳児期","老年期"],"e":"思春期から青年期が好発期として挙げられるが、個人差があり、この年代だけに発症するわけではない。"},{"id":"med-34-06","topic":34,"domain":"psychiatry","q":"統合失調症の成立に関わる歴史的人物として、資料はクレペリンと誰を挙げている？","a":["ブロイラー","ブロイレル","Bleuler"],"d":["エンゲル","ウィニコット","キューブラー・ロス"],"e":"資料はクレペリンとブロイラーを挙げる。シュナイダーは診断上重視された一級症状を提唱した人物である。"},{"id":"med-34-07","topic":34,"domain":"psychiatry","q":"統合失調症の発症に関する仮説として、資料が挙げる神経伝達物質は？","a":["ドパミン","ドーパミン"],"d":["アセチルコリン","メラトニン","オキシトシン"],"e":"ドパミン仮説が挙げられる。ただし、単一の物質だけで全ての発症や症状を説明できるという意味ではない。"},{"id":"med-34-08","topic":34,"domain":"psychiatry","q":"統合失調症で、主に幻覚・妄想などの軽減に用いる薬剤の分類は？","a":["抗精神病薬"],"d":["抗認知症薬","抗てんかん薬","抗ヒスタミン薬"],"e":"資料では薬物療法を中心に、SSTや作業療法などの心理社会的支援も並行して行うと説明している。"},{"id":"med-35-01","topic":35,"domain":"psychiatry","q":"統合失調症の診断上重要とされた「一級症状」を提唱した人物は？","a":["シュナイダー","Schneider"],"d":["クレペリン","ブロイラー","エンゲル"],"e":"一級症状はシュナイダーが提唱した歴史的な症状整理。これだけで現在の診断が確定するわけではない。"},{"id":"med-35-02","topic":35,"domain":"psychiatry","q":"自分の考えが、外から聞こえる声のように聞こえる体験を何という？","a":["思考化声","考想化声","思考化音声"],"d":["思考奪取","思考吹入","思考伝播"],"e":"思考化声は自分の思考が声として聞こえる体験。資料の表記「思考化音声」も入力では受け付ける。"},{"id":"med-35-03","topic":35,"domain":"psychiatry","q":"複数の人が会話している声が聞こえる幻聴を、資料では何という？","a":["対話性幻聴","対話性の幻聴"],"d":["批判的幻聴","思考化声","身体的被影響体験"],"e":"対話性幻聴は複数の声の会話という形をとる。自分の行為を批判する声とは分けて整理する。"},{"id":"med-35-04","topic":35,"domain":"psychiatry","q":"自分の行為を批判する声が聞こえる幻聴を、資料では何という？","a":["批判的幻聴","批判性幻聴","批評性幻聴","注釈性幻聴"],"d":["対話性幻聴","思考化声","妄想知覚"],"e":"資料は批判的幻聴と表記している。本人の行為への批判・批評などの声が特徴となる。"},{"id":"med-35-05","topic":35,"domain":"psychiatry","q":"電波や光線などによって、自分の身体が外から影響を受けていると体験することは？","a":["身体的被影響体験","身体的な被影響体験"],"d":["思考奪取","対話性幻聴","思考伝播"],"e":"身体的被影響体験では身体が外部から作用されていると感じる。思考への介入とは対象が異なる。"},{"id":"med-35-06","topic":35,"domain":"psychiatry","q":"「誰かに自分の考えを抜き取られた」と感じる体験は？","a":["思考奪取","考想奪取"],"d":["思考吹入","思考伝播","思考化声"],"e":"思考奪取は考えが奪われる体験。外から考えを入れられる思考吹入と反対の方向で整理すると区別しやすい。"},{"id":"med-35-07","topic":35,"domain":"psychiatry","q":"「自分のものではない考えを、外から吹き込まれた」と感じる体験は？","a":["思考吹入","考想吹入","思考挿入","考想挿入"],"d":["思考奪取","思考化声","思考伝播"],"e":"思考吹入は思考が外から入れられる体験。自分の考えが周囲に知られる思考伝播とは異なる。"},{"id":"med-35-08","topic":35,"domain":"psychiatry","q":"実際に見聞きした出来事に、直ちに妄想的な特別の意味を与える体験は？","a":["妄想知覚"],"d":["対話性幻聴","思考奪取","感情の平板化"],"e":"妄想知覚は、知覚した事柄への特別な意味づけが特徴。対象のない知覚体験である幻覚とは区別する。"},{"id":"med-35-09","topic":35,"domain":"psychiatry","q":"自分の思考・感情・意欲などが、他者に「させられている」と感じる体験は？","a":["作為体験","させられ体験"],"d":["思考伝播","思考化声","妄想知覚"],"e":"作為体験は、自分の体験や行動が他者の力で生じているように感じることをいう。"},{"id":"med-35-10","topic":35,"domain":"psychiatry","q":"「口に出していない考えが、周りの人に伝わっている」と感じる体験は？","a":["思考伝播","考想伝播","思考伝ぱ","考想伝ぱ"],"d":["思考奪取","思考吹入","対話性幻聴"],"e":"思考伝播は自分の思考が周囲へ伝わる体験。思考吹入は外から入る、思考奪取は奪われる体験である。"},{"id":"med-36-01","topic":36,"domain":"psychiatry","q":"統合失調症の妄想型・破瓜型・緊張型という伝統的類型が、記載されなくなった診断分類は？","a":["DSM-5","DSM5"],"d":["DSM-III","DSM-IV","ICD-10"],"e":"資料自身が、DSM-5では類型分類の記載がなくなったと注記している。以下の類型問題は歴史的整理として学ぶ。"},{"id":"med-36-02","topic":36,"domain":"psychiatry","q":"伝統的類型で、陰性症状が比較的乏しく、妄想や幻覚が目立つ型は？","a":["妄想型"],"d":["破瓜型","緊張型","残遺型"],"e":"資料の妄想型は妄想・幻覚が中心。現在のDSM-5の病型として扱わない。"},{"id":"med-36-03","topic":36,"domain":"psychiatry","q":"伝統的類型で、まとまりのない会話や行動、感情の鈍麻・平板化などが目立つ型は？","a":["破瓜型","解体型"],"d":["妄想型","緊張型","残遺型"],"e":"破瓜型は陰性症状やまとまりのなさが目立つと整理される。"},{"id":"med-36-04","topic":36,"domain":"psychiatry","q":"伝統的類型で、精神運動興奮と緊張病性昏迷、奇異な姿勢などが中心になる型は？","a":["緊張型"],"d":["妄想型","破瓜型","残遺型"],"e":"緊張型は運動面の特徴が中心。緊張病そのものは統合失調症だけにみられるものではない。"},{"id":"med-36-05","topic":36,"domain":"psychiatry","q":"資料の伝統的分類で、一般に20代後半から30代以降に発症することが多いと説明される型は？","a":["妄想型"],"d":["破瓜型","緊張型","単純型"],"e":"資料は妄想型の発症を他の類型より比較的遅い時期として説明する。個人の診断や予後の断定には使わない。"},{"id":"med-36-06","topic":36,"domain":"psychiatry","q":"資料の伝統的分類で、緩徐に進行し、薬物療法への反応が乏しく予後が不良な場合が多いとされる型は？","a":["破瓜型","解体型"],"d":["妄想型","緊張型","分類不能型"],"e":"この記述は資料の伝統的類型の説明であり、現在の個々の患者の回復可能性を決めつけるものではない。"},{"id":"med-36-07","topic":36,"domain":"psychiatry","q":"資料の伝統的分類で、治療への反応は良好でも再発が多いと説明される型は？","a":["緊張型"],"d":["妄想型","破瓜型","単純型"],"e":"資料では緊張型について、反応が良好でも再発が多いと整理している。"},{"id":"med-37-01","topic":37,"domain":"psychiatry","q":"統合失調症で陽性症状が顕在化し、医療の関与が始まる時期を、資料では何期という？","a":["急性期"],"d":["消耗期","回復期","維持期"],"e":"資料の急性期では、幻覚・妄想などの陽性症状への対応が中心となる。"},{"id":"med-37-02","topic":37,"domain":"psychiatry","q":"統合失調症の急性期の支援で、陽性症状の軽減とともに最優先される、本人と周囲を危険から守る目標は？","a":["安全の確保","安全確保","安全"],"d":["就労技能の向上","社会的役割の拡大","地域活動への参加"],"e":"急性期では安全確保、不安・緊張の緩和、安心感と休養を支えることが重要になる。"},{"id":"med-37-03","topic":37,"domain":"psychiatry","q":"急性期の統合失調症で、栄養とともに支える基本的な生存機能として資料が挙げるものは？","a":["睡眠"],"d":["記憶","知覚","判断"],"e":"睡眠や栄養など基本的な生存機能を整え、十分な休養を支えることが目標になる。"},{"id":"med-38-01","topic":38,"domain":"psychiatry","q":"陽性症状が軽減する一方で陰性症状が前景化し、心身が疲れやすい時期を、資料では何期という？","a":["消耗期"],"d":["急性期","回復期","寛解維持期"],"e":"消耗期では心身の疲弊や、病気になったことへのショック、不安などへの配慮が必要になる。"},{"id":"med-38-02","topic":38,"domain":"psychiatry","q":"消耗期に回復してくる、自分が病気であるという理解・認識を何という？","a":["病識"],"d":["病型","見当識","自己効力感"],"e":"病識が回復することで、病気にかかったショックや将来への不安を感じることもあり、支援が必要になる。"},{"id":"med-38-03","topic":38,"domain":"psychiatry","q":"消耗期の作業療法について、資料が一人ひとりの状態に合わせる形として挙げるプログラムは？","a":["個別プログラム","個別"],"d":["大集団プログラム","講義型プログラム","職場単位プログラム"],"e":"消耗期には個別プログラムによる作業療法など、疲弊しやすい状態に合わせた支援が挙げられる。"},{"id":"med-39-01","topic":39,"domain":"psychiatry","q":"統合失調症で、社会復帰のために認知機能や生活機能の課題への援助が重要となる時期を、資料では何期という？","a":["回復期"],"d":["急性期","消耗期","前駆期"],"e":"資料では回復期に、認知・生活機能の課題やリハビリテーション、社会福祉的援助を重視する。"},{"id":"med-39-02","topic":39,"domain":"psychiatry","q":"統合失調症の回復期に薬物療法を継続する目的として、資料が挙げる予防は何？","a":["再発予防","再発の予防"],"d":["生活環境の調整","対人関係の評価","社会資源の調整"],"e":"症状が落ち着いても再発を防ぐための継続的な治療が重要になる。変更は治療者との相談のもとで行う。"},{"id":"med-39-03","topic":39,"domain":"psychiatry","q":"回復期の家族支援で、病気の正確な知識や再発予防の対応を伝える援助は？","a":["心理教育","家族心理教育"],"d":["投影法","隔離","トリアージ"],"e":"家族への心理教育に加え、家族自身の苦悩や負担への支援も重要になる。"},{"id":"med-40-01","topic":40,"domain":"psychiatry","q":"「当たり前だった世界」や「他者と同じ世界を共有している感覚」が揺らぐことを何という？","a":["自明性の喪失"],"d":["対象恒常性","全能感","見当識の保持"],"e":"自明性の喪失は、これまで当然だった現実感覚が不安定になること。統合失調症の体験理解で用いられる概念である。"},{"id":"med-40-02","topic":40,"domain":"psychiatry","q":"資料で、自明性の喪失とともに不安定になるのは、「今ここに自分が普通に何している」という感覚？","a":["存在","存在している","自己の存在"],"d":["適応","認識","所属"],"e":"世界の共有感だけでなく、自分がここに存在している感覚も揺らぎ、不安や混乱につながると説明される。"},{"id":"med-41-01","topic":41,"domain":"practice","q":"健康や病気を、生物学的・心理的・社会的要因の相互作用で捉えるモデルは？","a":["生物・心理・社会モデル","生物心理社会モデル","生物心理社会的モデル","BPSモデル","バイオサイコソーシャルモデル"],"d":["生物医学モデル","精神分析モデル","行動主義モデル"],"e":"生物・心理・社会モデルは複数の側面を関連づけて患者を全人的に理解する枠組みである。"},{"id":"med-41-02","topic":41,"domain":"practice","q":"生物・心理・社会モデルを提唱した人物は？","a":["エンゲル","Engel"],"d":["ブロイラー","シュナイダー","ウィニコット"],"e":"エンゲルが提唱したモデルで、多職種連携の基盤としても用いられる。"},{"id":"med-41-03","topic":41,"domain":"practice","q":"生物・心理・社会モデルで、脳や遺伝、身体的特徴はどの側面の要因？","a":["生物学的要因","生物学的","生物"],"d":["心理的要因","社会的要因","文化的要因"],"e":"脳・遺伝・身体的特徴は生物学的要因に位置づけられる。"},{"id":"med-41-04","topic":41,"domain":"practice","q":"生物・心理・社会モデルで、認知傾向や性格はどの側面の要因？","a":["心理的要因","心理的","心理"],"d":["生物学的要因","社会的要因","経済的要因"],"e":"認知傾向や性格などは心理的要因。社会的な地位や経済状況と区別する。"},{"id":"med-41-05","topic":41,"domain":"practice","q":"生物・心理・社会モデルで、対人関係や経済状況、社会的地位はどの側面の要因？","a":["社会的要因","社会的","社会"],"d":["生物学的要因","心理的要因","遺伝的要因"],"e":"社会的要因は人を取り巻く関係や社会的条件。3側面は独立せず相互に影響する。"},{"id":"med-41-06","topic":41,"domain":"practice","q":"資料の職種の整理で、心理専門職が基盤とする活動モデルは？","a":["査定―援助モデル","査定援助モデル","査定・援助モデル"],"d":["診断―治療モデル","需給―配分モデル","選別―搬送モデル"],"e":"資料は心理専門職を査定―援助モデル、精神科医を診断―治療モデルと整理している。実際の職種の関心を一側面だけに固定しない。"},{"id":"med-41-07","topic":41,"domain":"practice","q":"精神障害者の社会復帰に関する相談・援助を主な仕事とする国家資格の専門職は？","a":["精神保健福祉士","PSW"],"d":["精神科医","公認心理師","薬剤師"],"e":"資料では精神保健福祉士が社会的視点を重視して相談や援助を行うとされる。"},{"id":"med-42-01","topic":42,"domain":"practice","q":"精神疾患による生活上の困難を抱える人が、決まった時間に通い、活動を通してリハビリテーションを行う場は？","a":["精神科デイケア","デイケア"],"d":["NICU","応急入院病棟","医療事故調査室"],"e":"精神科デイケアは、通所して文化的活動や運動などを行うリハビリテーションの場である。"},{"id":"med-42-02","topic":42,"domain":"practice","q":"精神科病院の外来で行われ、資料では比較的大規模と説明されるデイケアの形態は？","a":["病院型","病院型デイケア"],"d":["クリニック型","地域型","訪問型"],"e":"病院型は症状が安定し、家庭に適応し始めた患者などを対象とすると説明される。"},{"id":"med-42-03","topic":42,"domain":"practice","q":"資料が病院型の精神科デイケアの規模として挙げる人数は、およそ何人から何人？","a":["50〜100人","50～100人","50から100人","50人から100人","50-100人"],"d":["10〜20人","20〜30人","150〜200人"],"e":"資料の例示は50〜100人程度。すべての施設の定員を定めた法的基準として覚えない。"},{"id":"med-42-04","topic":42,"domain":"practice","q":"精神科クリニック等で、比較的軽症の人の社会復帰やリワークなどを行うデイケア形態は？","a":["クリニック型","クリニック型デイケア"],"d":["病院型","地域型","入院型"],"e":"クリニック型では入院経験のない人なども対象に、社会復帰のリハビリテーションを行う。"},{"id":"med-42-05","topic":42,"domain":"practice","q":"資料がクリニック型のデイケアの規模として挙げる人数は、およそ何人から何人？","a":["10〜20人","10～20人","10から20人","10人から20人","10-20人"],"d":["30〜50人","50〜100人","100〜150人"],"e":"資料では10〜20人程度の小規模な形として説明している。施設の実際の規模には幅がある。"},{"id":"med-42-06","topic":42,"domain":"practice","q":"精神保健福祉センターや保健所などで、仲間づくりや再発予防を目的に行うデイケア形態は？","a":["地域型","地域型デイケア"],"d":["病院型","クリニック型","入院型"],"e":"地域型は地域の機関で行われ、年齢や病状がさまざまな人が参加する。"},{"id":"med-42-07","topic":42,"domain":"practice","q":"クリニック型デイケアの例として、依存からの回復を支えるプログラムを資料では何という？","a":["脱嗜癖プログラム","脱嗜癖","依存症回復プログラム"],"d":["リワークプログラム","ライフレビュー面接","危険予知トレーニング"],"e":"資料はリワークとともに脱嗜癖プログラムを挙げ、施設ごとの目的に応じた活動を説明する。"},{"id":"med-43-01","topic":43,"domain":"practice","q":"日常生活上の具体的課題に対処する技能を学び、会話や感情表現などを練習するプログラムは？","a":["SST","ソーシャルスキルトレーニング","社会生活技能訓練","生活技能訓練"],"d":["PFA","DPAT","KYT"],"e":"SSTは社会生活に必要な技能を練習するプログラム。行動理論や社会的学習理論を基盤とする。"},{"id":"med-43-02","topic":43,"domain":"practice","q":"SSTの基盤として、資料は行動理論と、他者を見て学ぶことを重視するどの理論を挙げている？","a":["社会的学習理論"],"d":["精神分析理論","愛着理論","認知的不協和理論"],"e":"SSTではモデルを見て学ぶことや実際に練習することを活用する。"},{"id":"med-43-03","topic":43,"domain":"practice","q":"SSTの基本要素で、目標とする行動やそのやり方を言葉で伝えることは？","a":["教示"],"d":["モデリング","リハーサル","フィードバック"],"e":"教示は目標の行動を説明すること。実演して見本を示すモデリングとは異なる。"},{"id":"med-43-04","topic":43,"domain":"practice","q":"SSTの基本要素で、目標とする行動を実際にやって見せることは？","a":["モデリング"],"d":["教示","リハーサル","般化"],"e":"モデリングは見本を提示すること。学習者自身が実行して練習するリハーサルと区別する。"},{"id":"med-43-05","topic":43,"domain":"practice","q":"SSTの基本要素で、ロールプレイを通じて本人が目標行動を実際に練習することは？","a":["リハーサル","行動リハーサル"],"d":["教示","モデリング","般化"],"e":"リハーサルは本人が行動を練習する段階。見本を見るだけで終わらせない。"},{"id":"med-43-06","topic":43,"domain":"practice","q":"SSTの基本要素で、練習した行動が適切にできたか、良い点や改善点を伝え合うことは？","a":["フィードバック"],"d":["教示","モデリング","般化"],"e":"フィードバックは行動の結果について具体的に伝えること。次の練習の改善につながる。"},{"id":"med-43-07","topic":43,"domain":"practice","q":"SSTの基本要素で、練習した技能を日常の別の場面でも使えるようにすることは？","a":["般化","一般化"],"d":["教示","モデリング","リハーサル"],"e":"般化は訓練場面を超え、実際の生活で技能を使えるようにすることである。"},{"id":"med-44-01","topic":44,"domain":"children","q":"生物学的・心理的・社会経済的背景などから、母子の重大な問題が予想される妊娠の総称は？","a":["ハイリスク妊娠"],"d":["多胎妊娠","高年妊娠","若年妊娠"],"e":"ハイリスク妊娠では生物学的要因だけでなく、心理・社会・経済的な背景も含めて支援を考える。"},{"id":"med-44-02","topic":44,"domain":"children","q":"資料のハイリスク妊娠の要因分類で、産科合併症や胎児異常はどの因子に含まれる？","a":["生物学的因子","生物学的要因","生物学的"],"d":["生物心理的因子","社会経済的因子","文化的因子"],"e":"資料は産科合併症や胎児異常を生物学的因子に含めている。"},{"id":"med-44-03","topic":44,"domain":"children","q":"資料のハイリスク妊娠の要因分類で、親の精神疾患や若年出産はどの因子に含まれる？","a":["生物心理的因子","生物心理的要因","生物心理的"],"d":["生物学的因子","社会経済的因子","地理的因子"],"e":"資料の分類では、親の精神疾患・発達障害・若年出産を生物心理的因子として整理している。"},{"id":"med-44-04","topic":44,"domain":"children","q":"資料のハイリスク妊娠の要因分類で、貧困や低い教育水準はどの因子に含まれる？","a":["社会経済的因子","社会経済的要因","社会経済的"],"d":["生物学的因子","生物心理的因子","遺伝的因子"],"e":"生活基盤や教育機会などの社会経済的条件も、必要な支援を考えるうえで重要になる。"},{"id":"med-44-05","topic":44,"domain":"children","q":"ハイリスク妊娠の例として資料に挙げられる、一度に複数の胎児を妊娠している状態は？","a":["多胎妊娠","多胎"],"d":["単胎妊娠","想像妊娠","偽妊娠"],"e":"資料は多胎妊娠のほか、前置胎盤・妊娠高血圧症候群や基礎疾患をもつ妊娠等を挙げている。"},{"id":"med-45-01","topic":45,"domain":"children","q":"妊娠後期から出産後しばらく、母親が乳児の欲求やサインにとても敏感になる状態は？","a":["原始的没頭","母親の原始的没頭","原初的没頭"],"d":["ホールディング","移行対象","自明性の喪失"],"e":"原始的没頭は乳児への感受性が高まる心理状態として説明される。全ての母親が同じ体験をするという意味ではない。"},{"id":"med-45-02","topic":45,"domain":"children","q":"原始的没頭、ホールディング、ほどよい母親、移行対象の概念を説明した人物は？","a":["ウィニコット","Winnicott"],"d":["ボウルビィ","エンゲル","シュナイダー"],"e":"ウィニコットは母子関係と乳児の心理発達を理解するためにこれらの概念を用いた。"},{"id":"med-45-03","topic":45,"domain":"children","q":"乳児を身体的・心理的に支え、安心感を与えることを、ウィニコットは何と呼んだ？","a":["ホールディング","抱えること","抱っこする環境"],"d":["原始的没頭","移行対象","躁的防衛"],"e":"ホールディングは身体を抱くだけでなく、心理的にも乳児を支えることを含む。"},{"id":"med-45-04","topic":45,"domain":"children","q":"乳児の要求に適度に応え、現実への適応や自立を促す養育者のあり方を示す、ウィニコットの概念は？","a":["ほどよい母親","程よい母親","ほどほどによい母親","ほどよい母"],"d":["原始的没頭","対象恒常性","躁的防衛"],"e":"ほどよい母親は完全無欠の養育者という意味ではなく、発達に応じた適度な応答を重視する概念である。"},{"id":"med-45-05","topic":45,"domain":"children","q":"タオルやぬいぐるみなど、乳児が安心を得ながら母親への依存から離れていく際に役立つ対象は？","a":["移行対象"],"d":["喪失対象","迫害対象","部分対象"],"e":"移行対象は内的世界と外的世界をつなぎ、母親と離れることへの適応を助けるものとして説明される。"},{"id":"med-45-06","topic":45,"domain":"children","q":"資料で、原始的没頭がみられる時期は、妊娠のいつ頃から産後しばらくまで？","a":["妊娠後期","後期"],"d":["妊娠前","妊娠初期","妊娠中期"],"e":"資料は妊娠後期から産後しばらくの期間を挙げている。"},{"id":"med-46-01","topic":46,"domain":"children","q":"新生児が生まれた直後から自分で周囲に関わり、養育者の反応を引き出そうとする性質は？","a":["能動的適応","新生児の能動的適応"],"d":["受動的適応","順応","馴化"],"e":"新生児は刺激を受け取るだけの存在ではなく、注意や全身の動きで周囲に働きかける。"},{"id":"med-46-02","topic":46,"domain":"children","q":"新生児が多くの刺激の中から、他者など特定の対象に向ける注意を何という？","a":["選択的注意"],"d":["分割的注意","転換性注意","無選択的注意"],"e":"資料は新生児が他者に選択的注意を向け、養育者の関心を引きつけると説明する。"},{"id":"med-46-03","topic":46,"domain":"children","q":"新生児は養育者との関わりを通して、自分の何状態を調整すると説明されている？","a":["情緒状態","情緒","感情状態","感情"],"d":["栄養状態","感染状態","発育状態"],"e":"養育者とのやり取りは、新生児の情緒調整と親子関係の形成に関わる。"},{"id":"med-47-01","topic":47,"domain":"children","q":"早産児や低出生体重児などの新生児に、高度な集中治療を提供する専門病棟の略称は？","a":["NICU"],"d":["ICU","PICU","SCU"],"e":"NICUは新生児集中治療室。ICUは一般の集中治療室、PICUは小児集中治療室である。"},{"id":"med-47-02","topic":47,"domain":"children","q":"資料では、NICUは一日何時間の体制で高度な医療を提供すると説明されている？","a":["24時間","24","二十四時間"],"d":["8時間","12時間","16時間"],"e":"資料はNICUを24時間体制で高度な医療を提供する専門病棟と説明している。"},{"id":"med-47-03","topic":47,"domain":"children","q":"NICUに入院した子の親が、「想像していた健康な赤ちゃん」のイメージを失うことは、どのような心理的体験？","a":["喪失体験","対象喪失"],"d":["身体的被影響体験","再体験","役割葛藤"],"e":"喪失は実際の死別だけでなく、期待していた妊娠・出産や赤ちゃんのイメージを失うことも含む。"},{"id":"med-47-04","topic":47,"domain":"children","q":"NICU入院に際し、親が「自分のせいでこうなったのでは」と感じる気持ちは？","a":["罪悪感"],"d":["喪失感","不安感","無力感"],"e":"資料は不安・衝撃に加えて罪悪感や無力感を挙げる。親に原因があると決めつける意味ではない。"},{"id":"med-47-05","topic":47,"domain":"children","q":"NICUの親子の課題として、悲嘆に向き合うこととともに、目の前の「現実の赤ちゃん」と築くものは？","a":["関係","関係性","親子関係","関係形成"],"d":["医療上の判断基準","病気の分類","入院の適応基準"],"e":"想像上の赤ちゃんのイメージと現実との違いに向き合いながら、実際の子どもとの関係が育っていく。"},{"id":"med-48-01","topic":48,"domain":"children","q":"NICUで心理職が大切にする、赤ちゃんのすぐそばで親子が共に過ごす場所は？","a":["ベッドサイド","赤ちゃんのベッドサイド"],"d":["面接室","家族待合室","退院支援室"],"e":"資料では赤ちゃんのベッドサイドで親子が共に過ごすことを大切にし、家族全体を支える視点を挙げている。"},{"id":"med-48-02","topic":48,"domain":"children","q":"親が安心して不安や悲しみを言葉にできるよう、心理職が用意するものは？","a":["感情を語れる場","語れる場","安心して語れる場","安心して感情を語れる場"],"d":["治療手順を説明する場","役割分担を決める場","退院計画を共有する場"],"e":"感情を語れる場をつくり、無理に前向きさを求めずに親の不安や悲しみに寄り添う。"},{"id":"med-48-03","topic":48,"domain":"children","q":"現実の赤ちゃんとの関係を築く支援では、心理職は赤ちゃんの小さな何や行動を親と共有する？","a":["反応","小さな反応"],"d":["診断名","在胎週数","検査値"],"e":"赤ちゃんの小さな反応に注目することで、親が赤ちゃんの個別性や働きかけに気づくことを支える。"},{"id":"med-48-04","topic":48,"domain":"children","q":"資料で、周産期に心理職による支援が重要となるリスクとして、若年出産や精神疾患とともに挙げられる抑うつの問題は？","a":["周産期うつ","周産期うつ病","周産期のうつ"],"d":["せん妄","思考伝播","統合失調症の緊張型"],"e":"周産期うつなど、妊娠・出産の時期に生じる心理的困難にも支援が必要になる。"},{"id":"med-49-01","topic":49,"domain":"children","q":"NICUで、言葉による働きかけだけでなく親子と「共にいること」を表す英語は？","a":["being","ビーイング"],"d":["doing","screening","triage"],"e":"資料は語りを聴くことと、共にいること（being）を重要な支援として挙げる。"},{"id":"med-49-02","topic":49,"domain":"children","q":"NICUの親が「自分がしっかりしなければ」と思い、気持ちを言葉にできなくなる背景として、資料が挙げることは？","a":["感情の抑制","感情を抑え込むこと","感情を抑える","感情抑制"],"d":["感情の脱抑制","情動の感染","認知的再評価"],"e":"強い緊張や不安の中で感情を抑え込むと、語ること自体が難しくなる場合がある。"},{"id":"med-49-03","topic":49,"domain":"children","q":"NICUで親子の言葉にならないやり取りを理解するため、語られた内容とともに捉えるべき表情・反応・雰囲気などは、何的な情報？","a":["非言語的情報","非言語的","非言語"],"d":["言語的情報","社会経済的情報","検査情報"],"e":"言葉だけでなく非言語的な様子に目を向け、声かけや抱っこ、反応の共有を通して親子関係を支える。"},{"id":"med-50-01","topic":50,"domain":"children","q":"長期間にわたり治療や管理が必要となる病気を何という？","a":["慢性疾患"],"d":["急性疾患","一過性反応","急性中毒"],"e":"慢性疾患は長く付き合っていく必要があるため、治療と日常生活・発達を併せて考える。"},{"id":"med-50-02","topic":50,"domain":"children","q":"資料が小児の慢性腎疾患の例として、慢性腎炎とともに挙げる疾患は？","a":["ネフローゼ症候群","ネフローゼ"],"d":["過敏性腸症候群","睡眠時無呼吸症候群","メタボリックシンドローム"],"e":"資料では慢性腎炎やネフローゼ症候群のある子どもの不安や生活上の制限を扱っている。"},{"id":"med-50-03","topic":50,"domain":"children","q":"慢性疾患の説明を子どもが理解できるよう、特に子どものどの段階に合わせる必要がある？","a":["発達段階","発達"],"d":["疾患の病期","治療の段階","退院手続の段階"],"e":"発達段階に応じた理解を支え、病気を過度に恐れたり軽視したりせず向き合えるようにする。"},{"id":"med-50-04","topic":50,"domain":"children","q":"慢性疾患の子どもが、自分なりに生活を楽しみ、育んでいくことが重要とされるのは、病気とともに生きる何？","a":["自信","病気とともに生きる自信"],"d":["自責感","警戒心","罪悪感"],"e":"制限との折り合いをつけながら自分の生活を営む経験が、病気とともに生きる自信につながる。"},{"id":"med-51-01","topic":51,"domain":"children","q":"子どもの心の問題が身体症状として表れやすい背景として、資料が挙げるのは心身がまだどういう状態だから？","a":["未分化","心身が未分化"],"d":["完全に独立","老化","固定化"],"e":"子どもは心と身体が未分化で、言語表現も発達途中のため、心理的な問題が身体や行動に表れやすい。"},{"id":"med-51-02","topic":51,"domain":"children","q":"子どもが不安を言葉にできず、腹痛などの身体症状として表すことを何という？","a":["身体化"],"d":["行動化","合理化","昇華"],"e":"身体化は心の問題が身体症状に表れること。ただし、実際の身体疾患の評価も欠かせない。"},{"id":"med-51-03","topic":51,"domain":"children","q":"子どもの心の問題が、言葉よりも振る舞いとして表れることを何という？","a":["行動化"],"d":["身体化","知性化","昇華"],"e":"行動化は行動を通して気持ちや葛藤が表れること。身体症状としての表れとは区別する。"},{"id":"med-51-04","topic":51,"domain":"children","q":"小児医療で疾患だけでなく、心身や発達・生活を合わせて見る視点を、資料では「何としての子ども」と表現する？","a":["全体","全体としての子ども"],"d":["身体疾患の患者","検査の対象","症状の集合"],"e":"資料は「全体としての子ども」を見る必要を強調する。訴えの背後にある気持ちにも目を向ける。"},{"id":"med-52-01","topic":52,"domain":"physical","q":"愛情を向ける人、健康、役割など、自分にとってかけがえのないものを失うことを何という？","a":["対象喪失"],"d":["対象恒常性","移行対象","原始的没頭"],"e":"対象喪失は死別だけでなく、役割や健康の喪失も含む広い概念である。"},{"id":"med-52-02","topic":52,"domain":"physical","q":"対象喪失によって生じる悲しみなどの心的過程を、資料では何という？","a":["喪","悲哀","悲嘆","グリーフ"],"d":["万能感","作為体験","脱抑制"],"e":"対象喪失という出来事と、それに伴う喪・悲哀という心的過程を区別する。"},{"id":"med-52-03","topic":52,"domain":"physical","q":"対象喪失の対象には人だけでなく、仕事や家庭で担ってきた立場・働きも含まれる。これを何という？","a":["役割","社会的役割"],"d":["所属感","価値観","生活習慣"],"e":"資料は愛情・依存の対象に加えて、役割や健康などを失うことも対象喪失に含める。"},{"id":"med-53-01","topic":53,"domain":"physical","q":"非現実的な万能感や対象の支配・価値下げによって、罪悪感や喪失不安を軽くしようとする防衛は？","a":["躁的防衛"],"d":["抑圧","反動形成","知性化"],"e":"躁的防衛では、対象への依存や喪失への不安を、万能感や支配・価値の切り下げなどで避けようとする。"},{"id":"med-53-02","topic":53,"domain":"physical","q":"躁的防衛で、自分なら対象を自由に支配できると感じる、非現実的な感覚は？","a":["万能感","全能感"],"d":["無力感","罪悪感","疎外感"],"e":"非現実的な万能感は、傷つけた罪悪感や失う不安から距離をとるために働く。"},{"id":"med-53-03","topic":53,"domain":"physical","q":"躁的防衛がみられる位置づけとして、資料が挙げる、対象を全体として捉えられる段階は？","a":["抑うつポジション","抑うつ態勢","抑うつ的ポジション"],"d":["妄想分裂ポジション","口唇期","潜伏期"],"e":"資料では抑うつポジションでの罪悪感や喪失不安に対する防衛として説明される。"},{"id":"med-53-04","topic":53,"domain":"physical","q":"躁的防衛では、対象を支配しようとするほか、その価値をどのように扱う？","a":["おとしめる","価値をおとしめる","価値を下げる","切り下げる","価値の切り下げ"],"d":["理想化して高める","ありのまま受け入れる","適切に再評価する"],"e":"価値を低く見積もることで「失っても重要ではない」と感じ、不安や罪悪感を軽くしようとする。"},{"id":"med-54-01","topic":54,"domain":"physical","q":"食事・運動・喫煙・飲酒などの生活習慣が発症や経過に関わる疾患の総称は？","a":["生活習慣病"],"d":["感染症","先天性疾患","急性外傷"],"e":"生活習慣病には2型糖尿病や高血圧症などが含まれる。生活習慣だけで全てが決まるという意味ではない。"},{"id":"med-54-02","topic":54,"domain":"physical","q":"資料が生活習慣病の多くに関連するものとして挙げる、腹部内臓の周囲に脂肪が蓄積する肥満の型は？","a":["内臓脂肪型肥満","内臓脂肪型","内臓脂肪肥満"],"d":["皮下脂肪型肥満","水分貯留","低栄養"],"e":"資料は内臓脂肪型肥満との関連を説明する。全ての生活習慣病に肥満が必須という意味ではない。"},{"id":"med-54-03","topic":54,"domain":"physical","q":"生活習慣病の予防と早期対応のため、内臓脂肪の蓄積と複数の代謝上の問題に注目した概念は？","a":["メタボリック・シンドローム","メタボリックシンドローム","メタボリック症候群","代謝症候群"],"d":["ネフローゼ症候群","離脱症候群","適応障害"],"e":"資料は生活習慣病への対策としてメタボリック・シンドロームを挙げる。"},{"id":"med-54-04","topic":54,"domain":"physical","q":"資料が生活習慣病の代表例として挙げる糖尿病は、どの型？","a":["2型糖尿病","Ⅱ型糖尿病","II型糖尿病","2型"],"d":["1型糖尿病","妊娠糖尿病","ステロイド糖尿病"],"e":"資料の生活習慣病の例は2型糖尿病。1型糖尿病を生活習慣が原因の病気と混同しない。"},{"id":"med-55-01","topic":55,"domain":"physical","q":"血糖を下げる働きをもち、分泌や作用が不足すると糖尿病に関わるホルモンは？","a":["インスリン"],"d":["グルカゴン","アドレナリン","コルチゾール"],"e":"インスリンの分泌不足や作用不足で高血糖が生じる。血糖を上げる方向に働くホルモンと区別する。"},{"id":"med-55-02","topic":55,"domain":"physical","q":"インスリンを作る、膵臓にある細胞は何細胞？","a":["β細胞","ベータ細胞","B細胞","膵β細胞"],"d":["α細胞","δ細胞","PP細胞"],"e":"インスリンは膵臓のβ細胞で作られる。資料の「すい臓」は「膵臓」と同じである。"},{"id":"med-55-03","topic":55,"domain":"physical","q":"主に自己免疫などによるβ細胞の破壊から、インスリン分泌が著しく不足する糖尿病は？","a":["1型糖尿病","Ⅰ型糖尿病","I型糖尿病","一型糖尿病","1型","Ⅰ型","I型"],"d":["2型糖尿病","妊娠糖尿病","ステロイド糖尿病"],"e":"1型糖尿病ではインスリンが著しく不足する。生活習慣だけが原因の病気ではない。"},{"id":"med-55-04","topic":55,"domain":"physical","q":"遺伝的要因と、食事・運動・肥満などの環境的要因が関連する、資料の糖尿病の型は？","a":["2型糖尿病","Ⅱ型糖尿病","II型糖尿病","二型糖尿病","2型","Ⅱ型","II型"],"d":["1型糖尿病","妊娠糖尿病","ステロイド糖尿病"],"e":"2型糖尿病は遺伝的要因と環境的要因が関わる。本人の生活習慣だけに原因を帰すのは適切ではない。"},{"id":"med-55-05","topic":55,"domain":"physical","q":"1型糖尿病で必要となる、不足したホルモンを補う治療は？","a":["インスリン療法","インスリン注射","インスリン注射による治療"],"d":["食事療法のみ","経口血糖降下薬のみ","運動療法のみ"],"e":"1型糖尿病ではインスリンを補う治療が必要になる。具体的な方法は医療者が個別に決定する。"},{"id":"med-55-06","topic":55,"domain":"physical","q":"糖尿病の代表的な合併症で、眼の網膜が障害されるものは？","a":["糖尿病網膜症","網膜症"],"d":["糖尿病腎症","糖尿病神経障害","糖尿病性足病変"],"e":"資料が挙げる主な合併症は糖尿病神経障害・網膜症・腎症である。"},{"id":"med-55-07","topic":55,"domain":"physical","q":"糖尿病の代表的な合併症で、腎臓が障害されるものは？","a":["糖尿病腎症","腎症"],"d":["糖尿病網膜症","糖尿病神経障害","糖尿病性足病変"],"e":"糖尿病腎症は腎臓の障害。長期間の高血糖が血管等に影響する。"},{"id":"med-55-08","topic":55,"domain":"physical","q":"糖尿病の代表的な合併症で、神経が傷つけられるものは？","a":["糖尿病神経障害","神経障害"],"d":["糖尿病網膜症","糖尿病腎症","糖尿病性足病変"],"e":"資料では高血糖が長く続くことで、神経や血管が障害されると説明される。"},{"id":"med-55-09","topic":55,"domain":"physical","q":"資料で、2型糖尿病の基本的治療として食事療法と組み合わせるものは？","a":["運動療法"],"d":["心理療法","作業療法","光療法"],"e":"資料では食事・運動療法と生活習慣の改善、必要に応じた薬物療法を挙げる。"},{"id":"med-55-10","topic":55,"domain":"physical","q":"資料が1型・2型以外の糖尿病として挙げる、妊娠中の糖代謝異常に関わるものは？","a":["妊娠糖尿病"],"d":["糖尿病網膜症","低血糖症","ネフローゼ症候群"],"e":"資料は妊娠糖尿病とステロイド糖尿病を挙げる。妊娠に伴う耐糖能異常の分類には医療上の定義がある。"},{"id":"med-56-01","topic":56,"domain":"cancer","q":"身体の必要性にかかわらず、異常な細胞が分裂を続ける性質を何という？","a":["自律性増殖","自律的増殖","自律増殖"],"d":["接触抑制","細胞老化","アポトーシス"],"e":"資料では、がん細胞が必要に応じた制御から離れて増え続けることを自律性増殖と説明する。"},{"id":"med-56-02","topic":56,"domain":"cancer","q":"がん細胞が発生した場所から、周囲の組織に入り込んで広がることを何という？","a":["浸潤"],"d":["転移","寛解","退縮"],"e":"浸潤は周囲へ入り込む広がり。離れた臓器などに新しい病巣をつくる転移と区別する。"},{"id":"med-56-03","topic":56,"domain":"cancer","q":"がん細胞が離れた場所の臓器などへ移動し、新たな病巣を形成することを何という？","a":["転移"],"d":["浸潤","寛解","退縮"],"e":"転移では、血行性・リンパ行性などの経路を通して別の場所へがんが広がる。"},{"id":"med-56-04","topic":56,"domain":"cancer","q":"がんを表す医学的な別名は？","a":["悪性腫瘍","悪性新生物"],"d":["良性腫瘍","炎症性病変","過形成"],"e":"資料ではがんを悪性腫瘍と説明し、自律性増殖・浸潤・転移などの性質を挙げている。"},{"id":"med-56-05","topic":56,"domain":"cancer","q":"がんの進行の程度を表す「病期」を、一般にどの外来語で表す？","a":["ステージ"],"d":["グレード","スコア","パフォーマンス"],"e":"ステージは病気の広がり・進行度を表す。がんの種類によって病期の分類方法は異なる。"},{"id":"med-56-06","topic":56,"domain":"cancer","q":"原発腫瘍、リンパ節転移、遠隔転移という3要素でがんの広がりを表す分類は？","a":["TNM分類","TNM"],"d":["ICF分類","DSM分類","ICD分類"],"e":"TNMはT・N・Mの組み合わせによる分類。全てのがんが同一の病期体系をもつわけではない。"},{"id":"med-56-07","topic":56,"domain":"cancer","q":"TNM分類のTが表すのは、主として原発腫瘍の何？","a":["大きさや浸潤","大きさと浸潤","大きさや広がり","原発腫瘍の広がり","腫瘍の大きさと浸潤","腫瘍の大きさ"],"d":["リンパ節転移","遠隔転移","全身の生活機能"],"e":"Tは原発腫瘍の大きさや局所への広がりなどを表す。"},{"id":"med-56-08","topic":56,"domain":"cancer","q":"TNM分類のNが表すのは、どこへの転移？","a":["リンパ節","領域リンパ節","リンパ節転移"],"d":["肺胞","腎盂","胆管"],"e":"Nは領域リンパ節への転移に関わる。遠隔転移はMで表す。"},{"id":"med-56-09","topic":56,"domain":"cancer","q":"TNM分類のMが表すのは、原発巣から離れた場所への何？","a":["遠隔転移","他臓器への転移","他の臓器への転移"],"d":["局所浸潤","細胞分化","腫瘍の大きさ"],"e":"Mは遠隔転移を表す。Tの局所の広がり、Nの領域リンパ節転移と区別する。"},{"id":"med-56-10","topic":56,"domain":"cancer","q":"資料ががんの標準治療として挙げる3つは、手術・薬物療法と、何療法？","a":["放射線療法","放射線治療","放射線"],"d":["作業療法","心理療法","運動療法"],"e":"がんへの標準的治療として手術・薬物療法・放射線治療を挙げ、単独または組み合わせて用いると説明している。"},{"id":"med-56-11","topic":56,"domain":"cancer","q":"多くの固形がんで用いる病期の説明で、0期から進み、最も進行した段階を表すローマ数字の期は？","a":["Ⅳ期","IV期","4期","ステージ4","ステージⅣ","ステージIV"],"d":["Ⅲ期","Ⅴ期","Ⅵ期"],"e":"一般的な説明は0〜Ⅳ期。資料の「Ⅴ」は修正した。ただし、がんの種類ごとに病期分類は異なり、全てに0期があるわけではない。"},{"id":"med-57-01","topic":57,"domain":"cancer","q":"がんと心の相互の関係を研究し、患者・家族の生活の質や医療者への支援を目指す学問領域は？","a":["サイコオンコロジー","精神腫瘍学"],"d":["サイコメトリクス","神経心理学","健康経済学"],"e":"サイコオンコロジーは精神腫瘍学とも呼ばれ、がん医療における心理社会的支援を扱う。"},{"id":"med-57-02","topic":57,"domain":"cancer","q":"サイコオンコロジーで、患者本人とともに心理的影響や支援の対象となる、身近な人々は？","a":["家族","患者の家族"],"d":["医療保険者","研究資金提供者","薬剤供給者"],"e":"がんは本人だけでなく家族にも心理的影響を及ぼすため、家族への支援も含まれる。"},{"id":"med-57-03","topic":57,"domain":"cancer","q":"資料によると、国際サイコオンコロジー学会（IPOS）が設立されたのは何年？","a":["1984年","1984","昭和59年"],"d":["1974年","1994年","2004年"],"e":"資料はIPOSの設立を1984年と記している。"},{"id":"med-57-04","topic":57,"domain":"cancer","q":"国際サイコオンコロジー学会の略称は？","a":["IPOS"],"d":["JPOS","IARC","WHO"],"e":"IPOSはサイコオンコロジーの国際学会。支援チームの略称ではない。"},{"id":"med-57-05","topic":57,"domain":"cancer","q":"患者や家族の心のケアの重要性に関連して、資料が2006年公布とする法律は？","a":["がん対策基本法"],"d":["医療法","健康増進法","高齢者医療確保法"],"e":"資料は2006年公布のがん対策基本法を、心理社会的支援の重要性に関連づけて説明している。"},{"id":"med-58-01","topic":58,"domain":"cancer","q":"生命を脅かす疾患に伴う身体・心理社会・スピリチュアルな問題に対応し、患者と家族のQOLを改善するアプローチは？","a":["緩和ケア"],"d":["精神科リハビリテーション","集中治療","支持的集団療法"],"e":"緩和ケアは苦痛の予防・評価・緩和を通して生活の質を支える。終末期だけに行うものではない。"},{"id":"med-58-02","topic":58,"domain":"cancer","q":"緩和ケアは、疾患のどの時期から提供されると位置づけられている？","a":["早期","疾患の早期","早期から","診断時から","疾患の早期から"],"d":["治癒を目指す治療の終了後","再発が確定した後","終末期に入った後"],"e":"資料は疾患の早期から病の全過程を通じたケアとする。がんそのものへの治療と並行して行われる。"},{"id":"med-58-03","topic":58,"domain":"cancer","q":"緩和ケアが改善を目指す「生活の質」の英語略称は？","a":["QOL"],"d":["ADL","IADL","SST"],"e":"QOLはquality of life。ADLは日常生活動作を指し、QOLと同じではない。"},{"id":"med-58-04","topic":58,"domain":"cancer","q":"資料が緩和ケアの定義について挙げる国際機関は？","a":["WHO","世界保健機関"],"d":["ILO","UNESCO","OECD"],"e":"資料ではWHOの2002年の定義を紹介している。"},{"id":"med-58-05","topic":58,"domain":"cancer","q":"資料は、緩和ケアを定義したWHOの定義の年を何年としている？","a":["2002年","2002","平成14年"],"d":["1992年","2006年","2012年"],"e":"資料で紹介されているのは2002年のWHOの定義である。定義の出典年として覚える。"},{"id":"med-58-06","topic":58,"domain":"cancer","q":"緩和ケアの対象には患者と、その患者を支える誰が含まれる？","a":["家族","患者の家族"],"d":["医療保険者","医療機関管理者","医療資材の供給者"],"e":"患者と家族が直面する問題に対応し、両者の生活の質を支えることが重視される。"},{"id":"med-59-01","topic":59,"domain":"cancer","q":"人生を振り返り、経験の意味を見いだして人生を統合することを目的とした面接は？","a":["ライフレビュー面接","ライフレビュー","人生回顧"],"d":["インテーク面接","危機介入面接","認知機能検査"],"e":"ライフレビューは人生の回顧や吟味。主に高齢者を対象に行われると説明されている。"},{"id":"med-59-02","topic":59,"domain":"cancer","q":"ライフレビューで、人生を一つの話として構成し、他者に語る側面を資料では何という？","a":["物語生成","物語生成の側面"],"d":["行動形成","認知再構成","転移解釈"],"e":"資料は、物語生成、自伝的記憶想起、臨床的援助法という3つの側面を挙げる。"},{"id":"med-59-03","topic":59,"domain":"cancer","q":"ライフレビューで、自分が経験した過去の出来事を思い出す側面は、何的記憶の想起？","a":["自伝的記憶","自伝的"],"d":["意味記憶","手続き記憶","感覚記憶"],"e":"自伝的記憶は本人の人生経験に関する記憶。人生の出来事を振り返る側面である。"},{"id":"med-59-04","topic":59,"domain":"cancer","q":"ライフレビューは、資料では主にどの年齢層を対象に行われるとされる？","a":["高齢者","老年期","高齢期の人"],"d":["新生児","乳児","幼児"],"e":"資料は主に高齢者に行われるとする。過去の経験の意味づけと人生の統合を支える。"},{"id":"med-60-01","topic":60,"domain":"cancer","q":"身体面だけでなく、心理・社会・スピリチュアルな側面を含めた多面的な苦痛は？","a":["全人的苦痛","トータルペイン","トータル・ペイン"],"d":["全身痛","心因性疼痛","関連痛"],"e":"全人的苦痛は人を全体として捉える考え方であり、複数の側面が影響し合う。"},{"id":"med-60-02","topic":60,"domain":"cancer","q":"全人的苦痛のうち、呼吸困難や倦怠感などは、主にどの側面の苦痛？","a":["身体的苦痛","身体的","身体"],"d":["精神的苦痛","社会的苦痛","スピリチュアルペイン"],"e":"身体症状に由来するつらさは身体的苦痛に整理する。他の苦痛と相互に影響することもある。"},{"id":"med-60-03","topic":60,"domain":"cancer","q":"資料の全人的苦痛の整理で、今後への不安や家族への申し訳なさは、主にどの側面の苦痛？","a":["精神的苦痛","心理的苦痛","精神的","心理的"],"d":["身体的苦痛","経済的苦痛","スピリチュアルペイン"],"e":"資料は不安や家族への申し訳なさを精神的苦痛として挙げている。"},{"id":"med-60-04","topic":60,"domain":"cancer","q":"全人的苦痛のうち、病気による離職や治療費の負担は、社会的側面の中でも何的な苦痛？","a":["経済的苦痛","経済的","経済"],"d":["身体的苦痛","認知的苦痛","知覚的苦痛"],"e":"資料は離職や治療費の負担を経済的苦痛と表現している。全人的苦痛の社会的側面に含めて整理できる。"},{"id":"med-60-05","topic":60,"domain":"cancer","q":"「自分の人生にどんな意味があったのか」といった、生きる意味や存在に関わる苦痛は？","a":["スピリチュアルペイン","スピリチュアル・ペイン","スピリチュアルな苦痛","実存的苦痛"],"d":["身体的苦痛","経済的苦痛","手続上の負担"],"e":"スピリチュアルペインは人生や存在の意味に関する苦痛。宗教をもつ人だけに生じるものではない。"},{"id":"med-61-01","topic":61,"domain":"cancer","q":"急性に生じ、日内・日間で変動する注意や意識の障害を特徴とする状態は？","a":["せん妄","譫妄"],"d":["認知症","抑うつ状態","失語症"],"e":"せん妄は急性の発症と変動が特徴。原因となる身体状態、薬剤、環境などの評価が重要である。"},{"id":"med-61-02","topic":61,"domain":"cancer","q":"昼間より夜間に症状が強くなり、興奮などが目立つせん妄を何という？","a":["夜間せん妄","夜間譫妄"],"d":["低活動型せん妄","混合型せん妄","慢性認知症"],"e":"夜間せん妄は症状が夜間に強まる状態。活動性による型の分類とは分けて考える。"},{"id":"med-61-03","topic":61,"domain":"cancer","q":"せん妄のうち、不穏や活動量の増加が目立つ型は？","a":["過活動型","過活動型せん妄"],"d":["低活動型","混合型","無動型"],"e":"過活動型は興奮や不穏が目立つ。活動が低下する低活動型もあるため、興奮がなければせん妄ではないとはいえない。"},{"id":"med-61-04","topic":61,"domain":"cancer","q":"せん妄のうち、無関心や活動量の低下が目立つ型は？","a":["低活動型","低活動型せん妄"],"d":["過活動型","混合型","興奮型"],"e":"低活動型は目立ちにくく、抑うつ状態と間違われることがある。"},{"id":"med-61-05","topic":61,"domain":"cancer","q":"せん妄で、活動量の増加と低下の両方の特徴がみられる型は？","a":["混合型","混合型せん妄"],"d":["過活動型","低活動型","夜間型"],"e":"混合型は過活動型と低活動型の特徴が混在する。"},{"id":"med-61-06","topic":61,"domain":"cancer","q":"低活動型せん妄は、資料によるとどのような気分の状態と間違われやすい？","a":["抑うつ状態","うつ状態","抑うつ"],"d":["躁状態","多幸状態","高揚状態"],"e":"活動量が低下し無関心に見えるため、抑うつとの区別が難しいことがある。急性発症や変動にも注目する。"},{"id":"med-61-07","topic":61,"domain":"cancer","q":"せん妄としばしば合併し、高齢者で鑑別が難しくなる疾患として資料が挙げるのは？","a":["認知症"],"d":["強迫症","社交不安症","特定の恐怖症"],"e":"高齢者では認知症とせん妄が合併する場合があり、変化前の状態や経過を把握することが重要になる。"},{"id":"med-62-01","topic":62,"domain":"cancer","q":"フロイトが、失った対象へのとらわれから次第に離れていく心的過程を呼んだ名称は？","a":["喪の仕事","モーニングワーク","モーニング・ワーク","グリーフワーク","グリーフ・ワーク"],"d":["原始的没頭","移行対象","作為体験"],"e":"喪の仕事は、喪失に伴う複雑な感情に向き合う心的過程を表す。"},{"id":"med-62-02","topic":62,"domain":"cancer","q":"喪の仕事の理論で、失った対象への愛情と憎しみが同時に存在することは？","a":["両価性","アンビバレンス"],"d":["同調","般化","自律性"],"e":"両価性は一つの対象に相反する感情を抱くこと。喪の仕事ではこの感情に耐え受け止めることが論じられる。"},{"id":"med-62-03","topic":62,"domain":"cancer","q":"フロイトの喪の仕事の説明では、対象喪失が自己喪失にもなることを避けるために、自己と対象の何が重要？","a":["分化","自己と対象の分化","自他の分化"],"d":["融合","同一化の固定","脱分化"],"e":"資料は自己と対象の分化と、両価性に耐える能力を挙げる。これらは喪の過程で育まれることもあるとする。"},{"id":"med-62-04","topic":62,"domain":"cancer","q":"資料のフロイトの説明で、自己と対象が未分化な場合に対象喪失が自己喪失にもなり、陥り得る病的状態は？","a":["メランコリー","病的なメランコリー"],"d":["ハネムーン期","原始的没頭","全能状態"],"e":"これはフロイトの理論上の説明である。悲嘆を経験した人が必ず病的状態になるという意味ではない。"},{"id":"med-62-05","topic":62,"domain":"cancer","q":"フロイト以後、乳幼児の対象喪失の過程を論じた人物として資料が挙げているのは？","a":["ボウルビィ","ボウルビー","ボウルビイ","ボウルビ","Bowlby"],"d":["シュナイダー","エンゲル","ヒポクラテス"],"e":"資料はボウルビィによる乳幼児の対象喪失の過程を紹介している。過程の区切り方は文献の整理によって異なる。"},{"id":"med-63-01","topic":63,"domain":"cancer","q":"死にゆく人の心理を、否認・怒り・取引・抑うつ・受容の5段階で説明した人物は？","a":["キューブラー・ロス","キューブラーロス","キューブラー=ロス","キューブラロス","Kubler-Ross","Kübler-Ross"],"d":["ウィニコット","ボウルビィ","ブロイラー"],"e":"キューブラー・ロスが提示したモデル。全ての人が決まった順序で全段階を経験するという規則ではない。"},{"id":"med-63-02","topic":63,"domain":"cancer","q":"キューブラー・ロスのモデルで、「診断が間違っているのでは」と現実を認めがたい状態は？","a":["否認"],"d":["怒り","取引","抑うつ"],"e":"否認は強い衝撃から自我を守る働きをもつ。本人を無理に現実へ直面させればよいという意味ではない。"},{"id":"med-63-03","topic":63,"domain":"cancer","q":"キューブラー・ロスのモデルで、「なぜ自分がこんな目に」と周囲にも憤りを向ける状態は？","a":["怒り"],"d":["否認","取引","受容"],"e":"怒りは不安などを伴って家族やスタッフに向けられることもあると説明される。"},{"id":"med-63-04","topic":63,"domain":"cancer","q":"キューブラー・ロスのモデルで、「よい行いをするから、もう少し生きたい」と条件を持ち出す状態は？","a":["取引"],"d":["否認","怒り","抑うつ"],"e":"取引は避けられない結果を延期しようと条件を示すこと。治療契約という制度の意味ではない。"},{"id":"med-63-05","topic":63,"domain":"cancer","q":"キューブラー・ロスのモデルで、病気を否定できなくなり、避けられない現実に直面して気分が沈む状態は？","a":["抑うつ","抑鬱"],"d":["否認","怒り","取引"],"e":"資料の誤記「沿うつ」は「抑うつ」に修正している。"},{"id":"med-63-06","topic":63,"domain":"cancer","q":"キューブラー・ロスのモデルで、周囲への関心が薄れ、静かに最期の時を過ごすと説明される段階は？","a":["受容"],"d":["否認","怒り","取引"],"e":"資料は受容を必ずしも幸福な状態とは説明していない。死を積極的に喜んで受け入れるという意味ではない。"},{"id":"med-63-07","topic":63,"domain":"cancer","q":"資料によると、キューブラー・ロスが面談した、死の宣告を受けた患者は何名？","a":["200名","200人","200","二百人"],"d":["50名","100名","500名"],"e":"資料は200名との面談に基づく分析として紹介している。"},{"id":"med-63-08","topic":63,"domain":"cancer","q":"キューブラー・ロスが、多くの患者が最期まで持ち続けていたと見いだしたものは？","a":["希望","何らかの希望"],"d":["確信","達観","万能感"],"e":"各段階にかかわらず、何らかの希望が保たれていたことを資料は強調している。"},{"id":"med-64-01","topic":64,"domain":"cancer","q":"がん患者のグループ療法で、参加者同士が気持ちを表し、仲間と感じ合うことを何という？","a":["共感","共感し合うこと"],"d":["同調","同一化","転移"],"e":"気持ちを表出し、仲間と共感し合える機会が基本的な観点の一つとして挙げられる。"},{"id":"med-64-02","topic":64,"domain":"cancer","q":"がん患者のグループ療法で、感情の共有やストレス対処の体験に加え、がんや治療について提供するものは？","a":["情報","知識","情報提供"],"d":["診断","処方","病期の判定"],"e":"がんと治療に関する情報を提供することも重要。グループ療法は診断・処方の代替ではない。"},{"id":"med-64-03","topic":64,"domain":"cancer","q":"がん患者のグループ療法で、具体的方法を知って体験することが重視される、心理的負荷を軽減する取り組みは？","a":["ストレス対処","ストレス軽減","ストレスマネジメント","ストレスへの対処"],"d":["自己洞察","対人技能訓練","記憶の再構成"],"e":"ストレスを減らす方法を実際に体験することが、基本的な観点の一つとなる。"},{"id":"med-64-04","topic":64,"domain":"cancer","q":"がんや治療、対処法に関する知識を体系的に扱うグループの形式を、資料では何的プログラムという？","a":["心理教育的プログラム","心理教育的","心理教育"],"d":["力動的プログラム","対人関係訓練的プログラム","回想中心のプログラム"],"e":"資料は自由な話し合いを重視する形式のほか、心理教育的プログラムとして行う形式も挙げる。"},{"id":"med-65-01","topic":65,"domain":"cancer","q":"がん患者へのリラクゼーションのうち、資料で「気持ちがいい」「楽になる」などの実感を得やすい方法として説明されるのは？","a":["自律訓練法"],"d":["曝露療法","トークンエコノミー法","反応妨害法"],"e":"資料は自律訓練法について、実施時の快適さや援助を受けている満足感が得られることがあると説明する。"},{"id":"med-65-02","topic":65,"domain":"cancer","q":"筋肉に力を入れてからゆるめることを用いる、資料中のリラクゼーション法は？","a":["漸進的筋弛緩法","漸進性筋弛緩法","筋弛緩法"],"d":["自律訓練法","自由連想法","回想法"],"e":"漸進的筋弛緩法は筋肉の緊張と弛緩を利用する。終末期では体を動かしたり力を入れたりする負担への配慮が必要。"},{"id":"med-65-03","topic":65,"domain":"cancer","q":"終末期患者へのリラクゼーションは、痛みや倦怠感による負担を考え、実施時間をどうすることが望ましい？","a":["短時間にする","短時間","短くする","短く"],"d":["長時間にする","通常と同じ時間にする","回数を減らし一回を長くする"],"e":"資料は患者の負担を考慮し、短時間で実施することを挙げる。状態に合わせた調整が必要になる。"},{"id":"med-65-04","topic":65,"domain":"cancer","q":"呼吸法によって、かえって呼吸を意識し苦しさが増すことがあるため特に配慮が必要なのは、どの症状が強い患者？","a":["呼吸器症状","呼吸苦","呼吸困難","呼吸困難感"],"d":["視力低下","聴力低下","皮膚の色素沈着"],"e":"資料は呼吸器症状や呼吸困難感の強い人への呼吸法に注意を求めている。どのリラクゼーション法も一律に適するわけではない。"},{"id":"med-66-01","topic":66,"domain":"disaster","q":"多数の傷病者が発生し、必要な対応が通常の医療能力を上回る状況で行われる医療は？","a":["災害医療"],"d":["平時の予約診療","定期健診","学校保健"],"e":"資料は主に災害急性期の医療を扱い、限られた資源で多数の傷病者に対応する特徴を説明している。"},{"id":"med-66-02","topic":66,"domain":"disaster","q":"災害医療では限られた医療資源を有効に活用し、一人でも多くの何を救うことを重視する？","a":["人命","命","生命"],"d":["就労機会","社会的役割","経済的資源"],"e":"資料は一人でも多くの人命を救うことを目標としている。平時と異なる資源配分が必要になる。"},{"id":"med-66-03","topic":66,"domain":"disaster","q":"災害時に診療継続を難しくする、停電・断水などの生活基盤の途絶を、一般に何の障害という？","a":["ライフライン","ライフラインの障害"],"d":["トランスポート","コミュニケーション","サプライチェーン"],"e":"停電、断水、医薬品や衛生品の供給停止など、医療の前提となる基盤自体が損なわれることがある。"},{"id":"med-67-01","topic":67,"domain":"disaster","q":"大事故や災害で多数の傷病者が出た際、重症度や緊急性などから治療・搬送の優先度を決めることは？","a":["トリアージ"],"d":["スクリーニング","インテーク","コンサルテーション"],"e":"トリアージは限られた資源のもとで優先度を判断すること。通常の診断や先着順での対応とは異なる。"},{"id":"med-67-02","topic":67,"domain":"disaster","q":"資料のトリアージで、生命が危機的で、直ちに処置が必要な第1順位のタグの色は？","a":["赤","赤色","赤タグ"],"d":["黄","緑","黒"],"e":"赤は直ちに処置を必要とする群。色と優先度を組み合わせて覚える。"},{"id":"med-67-03","topic":67,"domain":"disaster","q":"資料のトリアージで、多少処置が遅れても生命に影響がない第2順位のタグの色は？","a":["黄","黄色","黄タグ"],"d":["赤","緑","黒"],"e":"黄は待機的治療群。赤の直ちに処置が必要な群と区別する。"},{"id":"med-67-04","topic":67,"domain":"disaster","q":"資料のトリアージで、軽度の外傷で自力歩行や通院加療が可能な第3順位のタグの色は？","a":["緑","緑色","緑タグ"],"d":["赤","黄","黒"],"e":"緑は比較的軽症の群。状態は変化し得るため、タグは永久に固定される評価ではない。"},{"id":"med-67-05","topic":67,"domain":"disaster","q":"資料のトリアージで、生命徴候がない、または直ちに処置しても救命困難と判断される群のタグの色は？","a":["黒","黒色","黒タグ"],"d":["赤","黄","緑"],"e":"資料では黒を第4順位としている。実際の判定は定められた手順と医療専門職の判断による。"},{"id":"med-68-01","topic":68,"domain":"disaster","q":"災害急性期から活動できる機動性をもつ、災害派遣医療チームの略称は？","a":["DMAT"],"d":["DPAT","DHEAT","DWAT"],"e":"DMATはDisaster Medical Assistance Team。救急医療・搬送・病院支援などを担う。"},{"id":"med-68-02","topic":68,"domain":"disaster","q":"DMATの主な活動のうち、医療機関が被災して十分に機能できない状況で、その診療機能を補う支援は？","a":["病院支援","医療機関の支援"],"d":["就学支援","職場復帰支援","家族心理教育"],"e":"DMATの活動には救急医療や搬送に加え、病院支援や医療機関との連携が含まれる。"},{"id":"med-68-03","topic":68,"domain":"disaster","q":"DMATは、災害発生直後の急性期として、概ね何時間以内から活動を開始できるチームと説明される？","a":["48時間","48","四十八時間"],"d":["12時間","24時間","96時間"],"e":"概ね48時間以内から活動を開始できる機動性をもつ。活動全体が48時間で必ず終了するという意味ではない。"},{"id":"med-68-04","topic":68,"domain":"disaster","q":"DMATを構成する職種として、医師・看護師のほか、事務や医療技術等の専門性で活動を支える担当者は？","a":["業務調整員"],"d":["衛生管理者","保健所長","診療情報管理士"],"e":"業務調整員は物資・連絡など活動の調整を支える。医療行為をする職種だけでチームが構成されるわけではない。"},{"id":"med-68-05","topic":68,"domain":"disaster","q":"被災地域の都道府県の要請等を受け、DMAT隊員を派遣する医療機関を何という？","a":["DMAT指定医療機関","指定医療機関"],"d":["応急入院指定病院","すべての診療所","学校保健室"],"e":"資料は被災地の要請に基づき、指定医療機関へ出動要請が出されると説明している。"},{"id":"med-69-01","topic":69,"domain":"disaster","q":"被災地の精神科医療と精神保健活動を専門的に支援するチームの略称は？","a":["DPAT"],"d":["DMAT","DHEAT","DWAT"],"e":"DPATは災害派遣精神医療チーム。被災した精神科医療機関の機能補完や支援者支援などを行う。"},{"id":"med-69-02","topic":69,"domain":"disaster","q":"DPATは患者への医療に加え、災害対応に当たる現地の医療者や自治体職員など、誰への支援も行う？","a":["支援者","現地の支援者","被災地の支援者","地域の支援者"],"d":["資格認定者","研修講師","研究参加者"],"e":"被災地の支援者も被災者であり、大きな負担を抱えるため、支援者への支援もDPATの役割となる。"},{"id":"med-69-03","topic":69,"domain":"disaster","q":"DPATの基本構成は、看護師・業務調整員と、どの診療科の医師？","a":["精神科医","精神科医師","精神科"],"d":["小児科医","外科医","放射線科医"],"e":"基本構成に精神科医を含む。現地のニーズに応じて他の専門職が加わる。"},{"id":"med-69-04","topic":69,"domain":"disaster","q":"DPATの初動チームが被災地で活動を開始できる時間の目安は、公式説明では発災から概ね何時間以内？","a":["48時間","48","四十八時間"],"d":["24時間","72時間","120時間"],"e":"資料本文は約72時間とするが、厚労省の活動要領の先遣隊は概ね48時間以内。事務局の現行説明では日本DPATという名称で示される。"},{"id":"med-69-05","topic":69,"domain":"disaster","q":"DPATのSSSで、移動・食事・宿泊・健康管理などを自ら確保して活動する原則は？","a":["Self-sufficiency","セルフサフィシエンシー","自己完結型の活動","自己完結"],"d":["Share","Support","Screening"],"e":"Self-sufficiencyは自己完結型の活動。支援に入った先の資源や負担を必要以上に消費しない。"},{"id":"med-69-06","topic":69,"domain":"disaster","q":"DPATのSSSで、現地の支援者や他の保健医療チームと積極的に情報を共有する原則は？","a":["Share","シェア","積極的な情報共有","情報共有"],"d":["Support","Self-sufficiency","Screening"],"e":"Shareは積極的な情報共有・連携。単独で活動せず、現地の体制に参加する。"},{"id":"med-69-07","topic":69,"domain":"disaster","q":"DPATのSSSで、現地の支援者を支え、「名脇役であれ」と表現される原則は？","a":["Support","サポート","名脇役であれ","名わき役であれ"],"d":["Share","Self-sufficiency","Screening"],"e":"Supportでは支援の主体は現地の支援者と考える。同時に、現地の支援者自身も被災者であることに配慮する。"},{"id":"med-69-08","topic":69,"domain":"disaster","q":"DPATの活動の主体となるのは派遣されたチームだけではなく、基本的にどこの支援者？","a":["被災地域の支援者","現地の支援者","地域の支援者","被災地の支援者"],"d":["派遣元の支援者","中央省庁の支援者","国外の支援者"],"e":"資料は現地の支援者が主体となり、DPATがその活動を支えることを重視する。"},{"id":"med-70-01","topic":70,"domain":"disaster","q":"災害直後の数時間から数日、ショックでぼう然とする時期を、資料の段階モデルでは何という？","a":["茫然自失期","呆然自失期","茫然自失","ぼうぜん自失期"],"d":["ハネムーン期","幻滅期","再建期"],"e":"茫然自失期は災害直後のショックの時期として説明される。この順序や期間には個人差がある。"},{"id":"med-70-02","topic":70,"domain":"disaster","q":"被災者が一丸となって回復に向かい、一見積極的で元気に見える時期を何という？","a":["ハネムーン期","ハネムーン"],"d":["茫然自失期","幻滅期","再建期"],"e":"ハネムーン期では連帯感や積極性がみられる一方、生活上のストレスは増えていることがある。"},{"id":"med-70-03","topic":70,"domain":"disaster","q":"復旧や被害の格差が目立ち、無力感・疲労・怒り・取り残された感覚が生じやすい時期は？","a":["幻滅期","幻滅"],"d":["茫然自失期","ハネムーン期","再建期"],"e":"幻滅期は被災後しばらくして支援や復旧の格差が意識される時期として説明される。"},{"id":"med-70-04","topic":70,"domain":"disaster","q":"生活のめどがつき、現状を受け入れて将来を考えられるようになる時期は？","a":["再建期","再建"],"d":["茫然自失期","ハネムーン期","幻滅期"],"e":"再建期では暮らしの再構築が進み、将来へ目を向けられるようになると説明される。"},{"id":"med-71-01","topic":71,"domain":"disaster","q":"深刻な危機を経験した人に、安全や基本的ニーズを支える実際的な援助を行う心理的応急処置は？","a":["サイコロジカル・ファーストエイド","サイコロジカルファーストエイド","PFA"],"d":["サイコオンコロジー","コンサルテーション","グループサイコセラピー"],"e":"PFAは専門的心理療法とは異なり、危機にある人への支持的・実際的な援助を含む。資料目次の用語の誤記は修正した。"},{"id":"med-71-02","topic":71,"domain":"disaster","q":"PFAの3Lで、周囲の安全や、緊急のニーズ、深刻な反応を確認する原則は？","a":["Look","見る","みる"],"d":["Listen","Link","Learn"],"e":"Lookでは安全と支援ニーズを確認する。詳しい体験を無理に語らせることではない。"},{"id":"med-71-03","topic":71,"domain":"disaster","q":"PFAの3Lで、必要な人に寄り添い、その話に耳を傾ける原則は？","a":["Listen","聞く","聴く","きく"],"d":["Look","Link","Learn"],"e":"Listenでは本人の必要や心配事を聴く。話したくないことを無理に聞き出さない。"},{"id":"med-71-04","topic":71,"domain":"disaster","q":"PFAの3Lで、必要なサービス・情報・身近な支援を利用できるよう手助けする原則は？","a":["Link","つなぐ","繋ぐ"],"d":["Look","Listen","Learn"],"e":"Linkは必要な資源とのつながりを支えること。援助者一人で全てを引き受けるわけではない。"},{"id":"med-71-05","topic":71,"domain":"disaster","q":"PFAを実施する人の範囲について、資料は心理の専門家に限定されるとしている？","a":["限定されない","専門家に限定されない","専門家以外も行える","専門家だけではない"],"d":["精神科医に限定される","公認心理師に限定される","臨床心理士に限定される"],"e":"PFAは援助に関わる人が学んで実施できる基本的支援。専門治療とは目的と役割が異なる。"},{"id":"med-71-06","topic":71,"domain":"disaster","q":"PFAで食料・水・必要な情報の確保を手助けすることは、人のどのようなニーズを満たす支援？","a":["基本的ニーズ","基本的なニーズ","生きるうえでの基本的ニーズ","基礎的ニーズ"],"d":["達成ニーズ","承認ニーズ","自己実現ニーズ"],"e":"心理的支援には、話を聴くことだけでなく生活を支える実際的な援助も含まれる。"},{"id":"med-72-01","topic":72,"domain":"disaster","q":"疾患や不調を起こす危険性の高い人に重点を置いて支援する方法を何という？","a":["ハイリスクアプローチ"],"d":["ポピュレーションアプローチ","ユニバーサルアプローチ","全数調査"],"e":"資料は既存の精神疾患、アルコール問題、子ども、認知症のある高齢者などへの対応を挙げている。"},{"id":"med-72-02","topic":72,"domain":"disaster","q":"災害前から精神疾患がある人で、急な環境変化とともに症状悪化や離脱症状を招く原因として資料が挙げるのは、何の中断？","a":["服薬","服薬中断","薬の服用","治療薬の服用"],"d":["就労","交流","外出"],"e":"薬を入手・服用できなくなることが症状悪化等につながるため、治療継続の支援が重要になる。"},{"id":"med-72-03","topic":72,"domain":"disaster","q":"災害後に受診できない人のもとへ出向き、受療や服薬の確認を支える働きかけは？","a":["アウトリーチ"],"d":["インテーク","トリアージ","リワーク"],"e":"アウトリーチは援助者が生活の場へ出向く支援。相談窓口に来られない人へ働きかける。"},{"id":"med-72-04","topic":72,"domain":"disaster","q":"飲酒を中断・減量した後に、振戦や幻覚、けいれん等が生じることがある状態は？","a":["アルコール離脱症候群","アルコール離脱","離脱症候群"],"d":["急性アルコール中毒","アルコール性肝炎","単純酩酊"],"e":"アルコール離脱は急な飲酒中断などに伴う反応。重症化し得るため、心理支援だけでなく医療的対応が重要になる。"},{"id":"med-72-05","topic":72,"domain":"disaster","q":"資料がアルコールの早期離脱症候群で挙げる、手などがふるえる症状の名称は？","a":["振戦","震戦","ふるえ","震え"],"d":["失語","失行","無動"],"e":"一般的な医学用語は「振戦」。資料の「震戦」も入力では受け付ける。"},{"id":"med-72-06","topic":72,"domain":"disaster","q":"資料がアルコールの後期離脱症候群で中心となる症状として挙げるのは？","a":["振戦せん妄","震戦せん妄","振戦譫妄"],"d":["単純酩酊","急性アルコール中毒","睡眠時無呼吸"],"e":"資料は後期離脱症候群で振戦せん妄が中心となると説明している。"},{"id":"med-72-07","topic":72,"domain":"disaster","q":"アルコールの後期離脱症候群について、資料が発症の目安として挙げるのは離脱後何時間から何時間？","a":["72〜96時間","72～96時間","72から96時間","72時間から96時間","72-96時間"],"d":["6〜12時間","12〜24時間","24〜48時間"],"e":"資料の記載値は72〜96時間。実際の経過には個人差があり、この時間まで待ってよいという基準ではない。"},{"id":"med-72-08","topic":72,"domain":"disaster","q":"災害下で保護者との離別や死別などにより保護的環境が失われた子どもに、発症リスクが高まると資料が挙げる障害は？","a":["PTSD","心的外傷後ストレス障害","心的外傷後ストレス症"],"d":["ADHD","自閉スペクトラム症","学習障害"],"e":"保護的な環境が失われることでPTSDのリスクが高まる場合がある。発達段階に合う支援や家族への支援が重要。"},{"id":"med-72-09","topic":72,"domain":"disaster","q":"災害で生活環境が変わった認知症のある高齢者に、資料が身近に置くよう勧めている物は？","a":["馴染みの物","なじみの物","慣れ親しんだ物","使い慣れた物"],"d":["初めて見る物","学習課題になる物","刺激の強い物"],"e":"馴染みの物や落ち着ける空間は、急激な環境変化による混乱を和らげるための工夫となる。"},{"id":"med-72-10","topic":72,"domain":"disaster","q":"認知症のある人が日時等を把握しやすいよう、カレンダーを見やすく置くことは、何への支援？","a":["見当識","見当識への支援"],"d":["手続き記憶","遠隔記憶","感覚統合"],"e":"見当識は時間・場所などの状況を把握する力。カレンダー等が確認の手がかりになる。"},{"id":"med-72-11","topic":72,"domain":"disaster","q":"災害後の高齢者支援で、水分不足を避ける対策が重要になる。水分不足の状態を何という？","a":["脱水","脱水状態"],"d":["浮腫","低体温","高血糖"],"e":"脱水や低栄養を防ぐなど身体面を整えることも、認知症の症状悪化やせん妄の予防に関わる。"},{"id":"med-72-12","topic":72,"domain":"disaster","q":"災害後の高齢者支援では、視聴覚への配慮や痛みへの対応に加え、睡眠・食事等の何を維持することが重要？","a":["生活リズム","日常の生活リズム"],"d":["作業速度","運動負荷","課題の難易度"],"e":"日常の生活リズムを維持し、環境変化に伴う身体・心理的な負担を減らす。"},{"id":"med-72-13","topic":72,"domain":"disaster","q":"仮設住宅等で地域とのつながりが途切れ、自殺リスクに関わり得ると資料が挙げる感覚は？","a":["孤独感","孤立感"],"d":["罪悪感","無力感","疎外感"],"e":"災害後の自殺対策は急性期だけでなく中長期にも必要で、孤立を防ぐ支援が重要になる。"},{"id":"med-72-14","topic":72,"domain":"disaster","q":"災害後の中長期の自殺対策で、精神的健康の問題を早く見つけるために行う評価を何という？","a":["スクリーニング"],"d":["モデリング","リハーサル","脱感作"],"e":"資料はスクリーニング、相談活動、普及啓発などを、地域の精神保健活動を基盤に行うと説明する。"},{"id":"med-73-01","topic":73,"domain":"disaster","q":"災害で家族や大切なものを失ったことに起因する悲嘆に、特に関わる体験は？","a":["喪失体験","対象喪失"],"d":["外傷体験","二次的ストレス","作為体験"],"e":"喪失体験では悲嘆が長期化・複雑化する場合がある。直接的な生命の危機で生じる外傷体験とも重なり得る。"},{"id":"med-73-02","topic":73,"domain":"disaster","q":"自分や身近な人の生命が脅かされ、強い恐怖や無力感を経験することは？","a":["外傷体験","トラウマ","トラウマ体験","心的外傷体験"],"d":["喪失体験","役割葛藤","適応課題"],"e":"外傷体験による反応が長期化するとPTSD等につながる場合があり、悲嘆を複雑にすることもある。"},{"id":"med-73-03","topic":73,"domain":"disaster","q":"災害そのものの体験に加えて、避難生活・環境変化・生活再建の負担から生じるストレスは？","a":["二次的ストレス","二次的に発生するストレス","二次的なストレス"],"d":["外傷体験そのもの","予期悲嘆","惨事への直接曝露"],"e":"二次的ストレスは生活上の変化や負担から生じる。被災後の長期的支援でも重要な対象になる。"},{"id":"med-74-01","topic":74,"domain":"disaster","q":"災害救援者などが、凄惨な現場や生命の危機に直面して生じるストレス反応を何という？","a":["惨事ストレス"],"d":["日常の役割葛藤","予期悲嘆","適応課題"],"e":"惨事ストレスは救援者や報道関係者など、職務で惨事に接する人にも生じる。"},{"id":"med-74-02","topic":74,"domain":"disaster","q":"災害支援後、「自分だけ助かった」と感じる罪悪感を何という？","a":["サバイバーズ・ギルト","サバイバーズギルト","サバイバーズ・ギルティ","生存者の罪悪感","survivor guilt"],"d":["無力感","羞恥心","加害者への罪悪感"],"e":"資料の「サバイバーズ・ギルド」は「サバイバーズ・ギルト」に修正した。生き残ったことに伴う罪悪感をいう。"},{"id":"med-74-03","topic":74,"domain":"disaster","q":"惨事ストレスで、出来事が繰り返し思い出されたり、再び起きているように感じたりする症状は？","a":["再体験","再体験症状"],"d":["回避","過覚醒","解離"],"e":"再体験は惨事ストレスやPTSDでみられ得る反応。覚醒の亢進や抑うつなどと併せて捉える。"},{"id":"med-74-04","topic":74,"domain":"disaster","q":"惨事ストレスで、警戒や緊張が高まっている状態を、資料では覚醒の何という？","a":["亢進","覚醒亢進","過覚醒"],"d":["低下","消失","固定"],"e":"覚醒亢進は警戒や緊張が高い状態。支援者自身の心理的反応にも注意を向ける必要がある。"},{"id":"med-74-05","topic":74,"domain":"disaster","q":"惨事ストレスの要因として資料が挙げる、同僚が職務中に亡くなることは？","a":["殉職"],"d":["退職","異動","休職"],"e":"資料は同僚の負傷・殉職、救助した人の死などを、救援者の大きな負担になり得る体験として挙げる。"},{"id":"med-74-06","topic":74,"domain":"disaster","q":"救援者の惨事ストレスの要因として、救出活動に対する社会の不支持とともに資料が挙げるものは？","a":["批判","社会からの批判"],"d":["評価の保留","過剰な期待","活動への無関心"],"e":"直接の惨事だけでなく、活動に対する不支持や批判も負担になり得ると説明されている。"},{"id":"med-75-01","topic":75,"domain":"disaster","q":"他者の悲惨な体験の話を聴くなどして、自分が同じ出来事を直接経験しなくてもPTSD様症状を示すことは？","a":["二次受傷","代理受傷","二次的外傷性ストレス"],"d":["一次受傷","燃え尽き症候群","同一化"],"e":"二次受傷は他者の外傷体験に接することによる影響。支援者の症状や生活への変化にも目を向ける。"},{"id":"med-75-02","topic":75,"domain":"disaster","q":"資料が二次受傷の別名・関連する呼び方として挙げる「共感性何」？","a":["共感性疲労","疲労"],"d":["共感的理解","共感的配慮","共感覚"],"e":"資料は共感性疲労、代理受傷、外傷性逆転移を関連する表現として挙げる。専門文献では概念の範囲を区別することもある。"},{"id":"med-75-03","topic":75,"domain":"disaster","q":"資料が二次受傷に関連する呼び方として挙げる、支援関係の中で生じる外傷性の反応を表す用語は？","a":["外傷性逆転移","逆転移"],"d":["転移性治癒","反復強迫","投影性同一視"],"e":"資料は外傷性逆転移を関連する呼び方として挙げている。単純に全用語を同一視せず、文献ごとの意味を確認する。"},{"id":"med-75-04","topic":75,"domain":"disaster","q":"二次受傷で、PTSD症状とともに資料が挙げる、心身の消耗によって意欲等が低下する状態は？","a":["燃え尽き","バーンアウト","燃え尽き症候群"],"d":["抑うつポジション","急性ストレス反応","慢性疲労症候群"],"e":"資料はPTSD症状、燃え尽き、世界観の変容などを挙げている。"},{"id":"med-75-05","topic":75,"domain":"disaster","q":"二次受傷によって変わり得る、世界や人間をどう捉えるかという基本的な見方を何という？","a":["世界観"],"d":["自己効力感","見当識","病識"],"e":"資料は世界観の変容を挙げる。短期の疲れだけでなく、ものの見方への影響もあり得る。"}],"topics":{"1":{"title":"シャーマニズム／インキュベーション","pages":"3","domain":"systems"},"2":{"title":"医療法","pages":"3","domain":"systems"},"3":{"title":"フリーアクセスと総合診療","pages":"3","domain":"systems"},"4":{"title":"医療圏","pages":"3–4","domain":"systems"},"5":{"title":"公認心理師","pages":"4","domain":"systems"},"6":{"title":"精神保健福祉法","pages":"4","domain":"systems"},"7":{"title":"インフォームド・コンセント","pages":"4","domain":"systems"},"8":{"title":"措置入院・医療保護入院","pages":"5","domain":"systems"},"9":{"title":"任意入院・応急入院","pages":"5","domain":"systems"},"10":{"title":"行動制限","pages":"5–6","domain":"systems"},"11":{"title":"精神障害者保健福祉手帳","pages":"6","domain":"systems"},"12":{"title":"リスボン宣言","pages":"6","domain":"s
