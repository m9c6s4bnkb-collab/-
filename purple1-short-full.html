const $=s=>document.querySelector(s); const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let key='purple1_full_short_v1'; let hist=JSON.parse(localStorage.getItem(key)||'{}'); let order=[],pos=0; let session={answered:0,correct:0};
function rec(id){return hist[id]||(hist[id]={attempts:0,correct:0,wrong:0,last:null})} function save(){localStorage.setItem(key,JSON.stringify(hist))}
function filtered(){let mode=$('#mode').value,chap=$('#chap').value;return DATA.filter(x=>{let r=rec(x.id);if(chap!=='all'&&x.chapter!==chap)return false;if(mode==='unanswered'&&r.attempts>0)return false;if(mode==='wrong1'&&r.wrong<1)return false;if(mode==='wrong2'&&r.wrong<2)return false;if(mode==='lastwrong'&&r.last!=='wrong')return false;return true})}
function rebuild(rand=false){order=filtered().map(x=>x.id);if(rand)order=shuffle(order);pos=0;session={answered:0,correct:0};render()}
function current(){return DATA.find(x=>x.id===order[pos])} function baseMeta(it){return `出典：紫1(1).pdf PDF p.${it.page}｜${it.origin}`}
function updateStats(){let all=Object.values(hist);let attempts=all.reduce((s,r)=>s+r.attempts,0),correct=all.reduce((s,r)=>s+r.correct,0),wrong=all.reduce((s,r)=>s+r.wrong,0);$('#st1').textContent=session.answered;$('#st2').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'—';$('#st3').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';$('#st4').textContent=wrong}
function prev(){if(pos>0){pos--;render()}} function next(){if(pos<order.length-1){pos++;render()}else{renderDone()}}
function renderDone(){updateStats();$('.card').innerHTML=`<div class="empty"><b>このセットは終了！</b><br>フィルタを変えるか、同じ条件で解き直せます。<div style="margin-top:14px"><button onclick="rebuild(true)">同じ条件でランダムにもう一度</button></div></div>`}
function resetSession(){rebuild(false)} function resetAll(){if(confirm('累積の回答履歴・誤答回数もすべて消しますか？')){hist={};save();rebuild(false)}}
window.addEventListener('DOMContentLoaded',()=>{let ch=[...new Set(DATA.map(x=>x.chapter))];$('#chap').innerHTML='<option value="all">全分野</option>'+ch.map(x=>`<option>${x}</option>`).join('');$('#mode').onchange=()=>rebuild(false);$('#chap').onchange=()=>rebuild(false);rebuild(false)});

function render(){updateStats();if(!order.length){renderDone();return}const it=current();$('.card').innerHTML=`<div class="qno">${pos+1} / ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><div class="stem">${it.stem}</div><button id="showBtn" class="primary" onclick="showAnswer()">答えを見る</button><div id="fb" class="feedback"></div><div id="judge" style="display:none;margin-top:12px;gap:8px"><button onclick="judge(true)">○ 正解</button><button onclick="judge(false)">× 不正解</button></div><div class="nav"><button onclick="prev()" ${pos===0?'disabled':''}>← 前へ</button><button id="nextBtn" onclick="next()" disabled>次へ →</button></div>`;}
function showAnswer(){const it=current();$('#fb').innerHTML=`<div class="answer">答え：${it.answer}</div><div>${it.note}</div><div class="meta">分野：${it.chapter}<br>元項目：${it.term}<br>${baseMeta(it)}</div>`;$('#fb').classList.add('show');$('#showBtn').disabled=true;$('#judge').style.display='flex'}
function judge(ok){const it=current();let r=rec(it.id);if($('#judge').dataset.done)return;$('#judge').dataset.done='1';r.attempts++;r.last=ok?'correct':'wrong';ok?r.correct++:r.wrong++;save();session.answered++;if(ok)session.correct++;$('#judge').querySelectorAll('button').forEach(b=>b.disabled=true);$('#nextBtn').disabled=false;updateStats()}
</script></body></html>
