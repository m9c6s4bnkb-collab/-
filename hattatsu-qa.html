<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>発達と学習の心理学Ⅰ｜入力式一問一答</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--soft:#edf2f7;--accent:#7c3aed;--ok:#ecfdf5;--ng:#fef2f2}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--border:#374151;--soft:#273244;--ok:#12352b;--ng:#3b1d22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:880px;margin:auto;padding:24px 14px 48px}
.header{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:12px;color:var(--muted)} .progress{font-size:20px;font-weight:800}
.actions{display:flex;gap:7px;flex-wrap:wrap} button{font:inherit;cursor:pointer}
.sub{min-height:42px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:0 11px;font-size:13px;font-weight:750}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.stats div{padding:9px 5px;text-align:center;background:var(--soft);border-radius:11px}
.stats b{font-size:19px;display:block} .stats small{font-size:10px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:clamp(18px,5vw,30px)}
.cat{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:12px}
.question{font-size:clamp(19px,5vw,27px);font-weight:800;line-height:1.55;margin-bottom:22px;white-space:pre-line}
label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}
input{width:100%;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.primary,.next{width:100%;min-height:48px;border:0;border-radius:12px;font-weight:800;margin-top:11px}
.primary{background:var(--accent);color:white} .next{background:var(--text);color:var(--bg);display:none}
.feedback{display:none;margin-top:15px;padding:14px;border-radius:12px;line-height:1.55}
.explain{font-size:13px;margin-top:8px;color:var(--muted);line-height:1.55}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
.menu.hidden .actions,.menu.hidden + .stats{display:none}
.toggle{margin-left:auto}
button:focus-visible,input:focus-visible{outline:3px solid #a78bfa;outline-offset:2px}
@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <div class="menu" id="menu">
    <div class="header">
      <div>
        <div class="eyebrow">発達と学習の心理学Ⅰ｜入力式一問一答</div>
        <div id="progress" class="progress"></div>
      </div>
      <div class="actions">
        <button id="all" class="sub" type="button">全問題</button>
        <button id="shuffle" class="sub" type="button">ランダム</button>
        <button id="wrong" class="sub" type="button">間違えた問題</button>
        <button id="toggle" class="sub toggle" type="button">▲ メニューを隠す</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <div><b id="correct">0</b><small>正解</small></div>
    <div><b id="rate">—</b><small>正答率</small></div>
    <div><b id="mistakes">0</b><small>ミス</small></div>
    <div><b id="total"></b><small>収録問題</small></div>
  </div>

  <section class="card">
    <div id="cat" class="cat"></div>
    <div id="question" class="question"></div>
    <form id="form">
      <label for="answer">答え</label>
      <input id="answer" autocomplete="off" autocapitalize="off" placeholder="答えを入力してね">
      <button class="primary" type="submit">答え合わせ</button>
    </form>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <button id="next" class="next" type="button">次の問題 →</button>
  </section>

  <div class="note">元の433問の問題・正答・解説を使い、答えを入力して○×判定する形式に変更しています。</div>
</main>
<script>
const Q=[["生涯発達と発達の定義", "生涯発達と発達の定義について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は生涯発達の捉えるための視点として、獲得と喪失としての発達、発達の多次元性・多方向性、多様な要因の相互作用の結果としての発達という 3 つを挙げている。」", ["バルテス"], "バルテスは生涯発達の捉えるための視点として、獲得と喪失としての発達、発達の多次元性・多方向性、多様な要因の相互作用の結果としての発達という 3 つを挙げている。"], ["発達の成立要因・発達理論", "発達の成立要因・発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、人間の発達や成長の主な要因を「個体に生まれつき備わった遺伝的特性の発現（神経生理学的な成熟）」であると捉える考え方である。」", ["成熟優位説"], "成熟優位説とは、人間の発達や成長の主な要因を「個体に生まれつき備わった遺伝的特性の発現（神経生理学的な成熟）」であると捉える考え方である。"], ["発達の成立要因・発達理論", "発達の成立要因・発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は一卵性双生児の研究において、一方は生後 46 週から 6 週間、階段上りの訓練を行い、もう一方には訓練を行わず、生後 53 週になってから 2 週間だけ訓練を行うという条件を設定した。」", ["ゲゼル"], "ゲゼルは一卵性双生児の研究において、一方は生後 46 週から 6 週間、階段上りの訓練を行い、もう一方には訓練を行わず、生後 53 週になってから 2 週間だけ訓練を行うという条件を設定した。"], ["発達の成立要因・発達理論", "発達の成立要因・発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、人間の発達において遺伝的要因よりも学習や訓練といった経験的要因が決定的な影響を持つとする考え方である。」", ["学習優位説"], "学習優位説とは、人間の発達において遺伝的要因よりも学習や訓練といった経験的要因が決定的な影響を持つとする考え方である。"], ["学習優位説", "学習優位説について、次の文の（　　）に入る最も適切な語句を答えよ。\n「行動主義心理学を提唱した（　　）は、発達の本質を習慣の形成、すなわち刺激と反応の連合過程であると捉えた。」", ["ワトソン"], "行動主義心理学を提唱したワトソンは、発達の本質を習慣の形成、すなわち刺激と反応の連合過程であると捉えた。"], ["輻輳説", "輻輳説について、次の文の（　　）に入る最も適切な語句を答えよ。\n「輻輳説とは、（　　）が提唱し、人間の発達が「遺伝（内的要因）」か「環境（外的要因）」かのどちらか一方だけで決まるのではなく、両者が総合的に機能していると考える説である。」", ["シュテルン"], "輻輳説とは、シュテルンが提唱し、人間の発達が「遺伝（内的要因）」か「環境（外的要因）」かのどちらか一方だけで決まるのではなく、両者が総合的に機能していると考える説である。"], ["輻輳説", "輻輳説について、次の文の（　　）に入る最も適切な語句を答えよ。\n「シュテルンは、発達的変化は個人の「（　　）＋環境的要因」の加算的影響を受けると考え、どの能力や特徴かによって両者の割合が異なると主張した。」", ["遺伝的要因"], "シュテルンは、発達的変化は個人の「遺伝的要因＋環境的要因」の加算的影響を受けると考え、どの能力や特徴かによって両者の割合が異なると主張した。"], ["輻輳説", "輻輳説について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）はシュテルンの考えを対極図という形で図式化した。」", ["ルクセンブルガー"], "ルクセンブルガーはシュテルンの考えを対極図という形で図式化した。"], ["相互作用説", "相互作用説について、次の文の（　　）に入る最も適切な語句を答えよ。\n「発達の過程において、（　　）と環境要因は相互に関係し合っており、影響を与え合うことによって発達的変化が生じるという説。」", ["遺伝的要因"], "発達の過程において、遺伝的要因と環境要因は相互に関係し合っており、影響を与え合うことによって発達的変化が生じるという説。"], ["発達の成立要因・発達理論", "発達の成立要因・発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、発達は、特性によって環境要因の影響の仕方が異なり、遺伝的な特性が発現するかどうかは、環境要因が特性ごとに決められた閾値を超えるかどうかによる、という考え方。」", ["環境閾値説"], "環境閾値説とは、発達は、特性によって環境要因の影響の仕方が異なり、遺伝的な特性が発現するかどうかは、環境要因が特性ごとに決められた閾値を超えるかどうかによる、という考え方。"], ["発達段階", "発達段階について、次の文の（　　）に入る最も適切な語句を答えよ。\n「代表的な理論:ピアジェ（J. Piaget）の認知発達段階説: 「思考力（知能）」に絞り、（　　）・前作業期・具体的能力期・形式的能力期の 4 段階に区分した。」", ["感覚運動期"], "代表的な理論:ピアジェ（J. Piaget）の認知発達段階説: 「思考力（知能）」に絞り、感覚運動期・前作業期・具体的能力期・形式的能力期の 4 段階に区分した。"], ["人間の発達の特殊性", "人間の発達の特殊性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「外胎児期）←参考書では「（　　）」として載ってる本来、高等哺乳類は、妊娠期間が長く、一度に生まれてくる胎児は少なく、生まれてくる子どもは成熟している離巣性という特徴を持つ。」", ["生理的早産"], "外胎児期）←参考書では「生理的早産」として載ってる本来、高等哺乳類は、妊娠期間が長く、一度に生まれてくる胎児は少なく、生まれてくる子どもは成熟している離巣性という特徴を持つ。"], ["人間の発達の特殊性", "人間の発達の特殊性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「しかし、人間は高等哺乳類でありながら、生後長期間にわたり親の保護を必要とする（　　）という固有の特性をもつ。」", ["二次的留巣性"], "しかし、人間は高等哺乳類でありながら、生後長期間にわたり親の保護を必要とする二次的留巣性という固有の特性をもつ。"], ["人間の発達の特殊性", "人間の発達の特殊性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）であることで、感覚機能は成熟しているが、運動機能は未熟なままであり、胎外環境の影響を強く受けることから、人は環境と関わりながら発達・学習する柔軟性のある動物といえる。」", ["生理的早産"], "生理的早産であることで、感覚機能は成熟しているが、運動機能は未熟なままであり、胎外環境の影響を強く受けることから、人は環境と関わりながら発達・学習する柔軟性のある動物といえる。"], ["胎生期・身体・脳の発達", "胎生期・身体・脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）が提唱した、人間の身体の発育パターンをグラフで示したものである。」", ["スキャモン"], "スキャモンが提唱した、人間の身体の発育パターンをグラフで示したものである。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、身長や体重、骨格や筋肉、呼吸器や消化器にみられるパターンである。」", ["一般型"], "一般型は、身長や体重、骨格や筋肉、呼吸器や消化器にみられるパターンである。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は生殖器や咽頭にみられるパターンで、思春期に急激に発育する。」", ["生殖型"], "生殖型は生殖器や咽頭にみられるパターンで、思春期に急激に発育する。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は胸腺、リンパ節、扁桃腺にみられるパターンである。」", ["リンパ型"], "リンパ型は胸腺、リンパ節、扁桃腺にみられるパターンである。"], ["原始反射", "原始反射について、次の文の（　　）に入る最も適切な語句を答えよ。\n「例えば、口元を軽くつつくと触った方向に頭を向ける（　　）と、口の中に指を入れると吸う吸啜反射は後の乳やミルクを飲む行動につながる。」", ["口唇探索反射"], "例えば、口元を軽くつつくと触った方向に頭を向ける口唇探索反射と、口の中に指を入れると吸う吸啜反射は後の乳やミルクを飲む行動につながる。"], ["からだの発達原理", "からだの発達原理について、次の文の（　　）に入る最も適切な語句を答えよ。\n「１つ目は（　　）であり、人間の発達過程は生誕から死に至るまで連続的な変化課程であることを指す。」", ["連続性"], "１つ目は連続性であり、人間の発達過程は生誕から死に至るまで連続的な変化課程であることを指す。"], ["からだの発達原理", "からだの発達原理について、次の文の（　　）に入る最も適切な語句を答えよ。\n「２つ目は（　　）であり、身体部位によって成長率は異なることを指す。」", ["波動性"], "２つ目は波動性であり、身体部位によって成長率は異なることを指す。"], ["からだの発達原理", "からだの発達原理について、次の文の（　　）に入る最も適切な語句を答えよ。\n「３つ目は（　　）で、上部から下部へ、中心部から末端部へ成長していく。」", ["順序性と方向性"], "３つ目は順序性と方向性で、上部から下部へ、中心部から末端部へ成長していく。"], ["からだの発達原理", "からだの発達原理について、次の文の（　　）に入る最も適切な語句を答えよ。\n「４つ目は（　　）で、感覚器官と運動期間の統合される一方、各器官の細やかな分化が生じる。」", ["分化と統合"], "４つ目は分化と統合で、感覚器官と運動期間の統合される一方、各器官の細やかな分化が生じる。"], ["大脳の構造と機能", "大脳の構造と機能について、次の文の（　　）に入る最も適切な語句を答えよ。\n「大脳は深層の（　　）と表層の新皮質の二重構造となっている。」", ["大脳辺縁系"], "大脳は深層の大脳辺縁系と表層の新皮質の二重構造となっている。"], ["大脳の構造と機能", "大脳の構造と機能について、次の文の（　　）に入る最も適切な語句を答えよ。\n「特に（　　）は、感覚情報が有益か有害かといった生物学的価値判断の中心的役割を担っている。」", ["扁桃体"], "特に扁桃体は、感覚情報が有益か有害かといった生物学的価値判断の中心的役割を担っている。"], ["大脳の構造と機能", "大脳の構造と機能について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、記憶や判断という知的な精神活動と関係している。」", ["新皮質"], "新皮質は、記憶や判断という知的な精神活動と関係している。"], ["大脳の構造と機能", "大脳の構造と機能について、次の文の（　　）に入る最も適切な語句を答えよ。\n「新生児から幼児への発達は、衝動的な欲求が行動として即座に表出されるのではなく、（　　）の統制を受けた適応的なものへと統合化されていく過程といわれている。」", ["新皮質"], "新生児から幼児への発達は、衝動的な欲求が行動として即座に表出されるのではなく、新皮質の統制を受けた適応的なものへと統合化されていく過程といわれている。"], ["脳の発達", "脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「情報の受け渡しはシナプスと呼ばれる細胞同士の接合部で生じ、これを（　　）という。」", ["シナプス結合"], "情報の受け渡しはシナプスと呼ばれる細胞同士の接合部で生じ、これをシナプス結合という。"], ["脳の発達", "脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の相手、数、強さを制御することにより、精密な神経回路が作られる。」", ["シナプス結合"], "シナプス結合の相手、数、強さを制御することにより、精密な神経回路が作られる。"], ["脳の発達", "脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「脳の発達段階の初期では、過剰にシナプスが形成される（　　）がみられる。」", ["シナプスの過剰生成"], "脳の発達段階の初期では、過剰にシナプスが形成されるシナプスの過剰生成がみられる。"], ["脳の発達", "脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「最後に、軸索の中を通過する電気信号が外に漏れないように、軸索の周りを取り囲む髄鞘が層状に巻きつく（　　）が生じる。」", ["髄鞘化"], "最後に、軸索の中を通過する電気信号が外に漏れないように、軸索の周りを取り囲む髄鞘が層状に巻きつく髄鞘化が生じる。"], ["脳の発達", "脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「髄鞘のことをミエリンともいい、（　　）により情報の伝達速度が上がる。」", ["髄鞘化"], "髄鞘のことをミエリンともいい、髄鞘化により情報の伝達速度が上がる。"], ["脳機能の特徴", "脳機能の特徴について、次の文の（　　）に入る最も適切な語句を答えよ。\n「例えば、脳の神経細胞はその機能によって特定の位置に配置されており、これを（　　）という。」", ["脳の機能局在"], "例えば、脳の神経細胞はその機能によって特定の位置に配置されており、これを脳の機能局在という。"], ["胎生期・身体・脳の発達", "胎生期・身体・脳の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は大脳の約 40％を占め、行為の計画、反応の選択と抑制、情動のコントロール、意思決定をつかさどる。」", ["前頭葉"], "前頭葉は大脳の約 40％を占め、行為の計画、反応の選択と抑制、情動のコントロール、意思決定をつかさどる。"], ["情動", "情動について、次の文の（　　）に入る最も適切な語句を答えよ。\n「体内環境や外部環境の変化が生じると、まず、（　　）が行われる。」", ["環境に対する認知的評価"], "体内環境や外部環境の変化が生じると、まず、環境に対する認知的評価が行われる。"], ["情動", "情動について、次の文の（　　）に入る最も適切な語句を答えよ。\n「この認知的評価と記憶・体内環境との照合から（　　）が生じる。」", ["情動状態"], "この認知的評価と記憶・体内環境との照合から情動状態が生じる。"], ["情動", "情動について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、ある刺激、ある状況の認知に対して生じる身体的、神経生理学的活動の特定の変化を指す。」", ["情動状態"], "情動状態とは、ある刺激、ある状況の認知に対して生じる身体的、神経生理学的活動の特定の変化を指す。"], ["基本情動と自己意識的情動", "基本情動と自己意識的情動について、次の文の（　　）に入る最も適切な語句を答えよ。\n「生後 6～8 か月以降になると客体的な自己意識が芽生え、（　　）・共感・羨望の情動が出現する。」", ["照れ"], "生後 6～8 か月以降になると客体的な自己意識が芽生え、照れ・共感・羨望の情動が出現する。"], ["情動調整", "情動調整について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、乳児の情動状態を表した行動を模倣することなく、共有された情動状態がどのような性質のものであるかを養育者がなぞることを指す。」", ["情動調律"], "情動調律とは、乳児の情動状態を表した行動を模倣することなく、共有された情動状態がどのような性質のものであるかを養育者がなぞることを指す。"], ["情動調整", "情動調整について、次の文の（　　）に入る最も適切な語句を答えよ。\n「社会的場面において、今はどのような情動を表出すべきかあるいは表出すべきでないかといった適切な（　　）に関するルールを理解できるようになる。」", ["情動表出"], "社会的場面において、今はどのような情動を表出すべきかあるいは表出すべきでないかといった適切な情動表出に関するルールを理解できるようになる。"], ["移行対象", "移行対象について、次の文の（　　）に入る最も適切な語句を答えよ。\n「幼児がぬいぐるみや毛布などの特定のものに（　　）を示し、握ったりしゃぶるといった様子が見られることがある。」", ["愛着"], "幼児がぬいぐるみや毛布などの特定のものに愛着を示し、握ったりしゃぶるといった様子が見られることがある。"], ["移行対象", "移行対象について、次の文の（　　）に入る最も適切な語句を答えよ。\n「生まれたばかりの乳児を持つ母親は乳児の要求に即座に応えるが、それによって乳児は母子一体の世界なかで（　　）を抱き、例えば母親の乳房は自分が創造したものだという錯覚を抱く。」", ["万能感"], "生まれたばかりの乳児を持つ母親は乳児の要求に即座に応えるが、それによって乳児は母子一体の世界なかで万能感を抱き、例えば母親の乳房は自分が創造したものだという錯覚を抱く。"], ["移行対象", "移行対象について、次の文の（　　）に入る最も適切な語句を答えよ。\n「しかし、乳児が成長するにつれて、次第にそのような錯覚から脱し、（　　）に向かっていく。」", ["現実世界"], "しかし、乳児が成長するにつれて、次第にそのような錯覚から脱し、現実世界に向かっていく。"], ["表象と象徴機能", "表象と象徴機能について、次の文の（　　）に入る最も適切な語句を答えよ。\n「象徴はシンボルともいわれ、このような機能を象徴機能あるいは（　　）という。」", ["シンボル機能"], "象徴はシンボルともいわれ、このような機能を象徴機能あるいはシンボル機能という。"], ["ことば・認知の発達", "ことば・認知の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「表象と（　　）があることで、「そこにない」物事についてのコミュニケーションを行うことが可能となる。」", ["象徴機能"], "表象と象徴機能があることで、「そこにない」物事についてのコミュニケーションを行うことが可能となる。"], ["ことばの獲得", "ことばの獲得について、次の文の（　　）に入る最も適切な語句を答えよ。\n「1 つ目は、物につけられた名前を事物全体の名前だと考える（　　）。」", ["事物全体バイアス"], "1 つ目は、物につけられた名前を事物全体の名前だと考える事物全体バイアス。"], ["ことばの獲得", "ことばの獲得について、次の文の（　　）に入る最も適切な語句を答えよ。\n「2 つ目は、物につけられた名前を事物のカテゴリの名前だと考える（　　）。」", ["事物カテゴリバイアス"], "2 つ目は、物につけられた名前を事物のカテゴリの名前だと考える事物カテゴリバイアス。"], ["ことばの獲得", "ことばの獲得について、次の文の（　　）に入る最も適切な語句を答えよ。\n「3 つ目は、物につけられた名前と形が似ているものは同じ名前で呼ぶ（　　）。」", ["形バイアス"], "3 つ目は、物につけられた名前と形が似ているものは同じ名前で呼ぶ形バイアス。"], ["ことばの獲得", "ことばの獲得について、次の文の（　　）に入る最も適切な語句を答えよ。\n「4 つ目は、物の名前はただ一つだと想定している（　　）。」", ["相互排他性バイアス"], "4 つ目は、物の名前はただ一つだと想定している相互排他性バイアス。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「生後 6～8 週間頃になると、比較的リラックスした状態で（　　）がみられるようになり、生後 6～8 か月頃になると母語の音韻を多く含んだ音節からなる喃語を発するようになる。」", ["クーイング"], "生後 6～8 週間頃になると、比較的リラックスした状態でクーイングがみられるようになり、生後 6～8 か月頃になると母語の音韻を多く含んだ音節からなる喃語を発するようになる。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「3 歳から 4 歳は話し言葉が一応完成する時期で、4 歳頃になると話すことに対する興味が高まり一時的に非常におしゃべりになる（　　）がおとずれる。」", ["多弁期"], "3 歳から 4 歳は話し言葉が一応完成する時期で、4 歳頃になると話すことに対する興味が高まり一時的に非常におしゃべりになる多弁期がおとずれる。"], ["内言と外言", "内言と外言について、次の文の（　　）に入る最も適切な語句を答えよ。\n「内言とは、音声を伴わず自分の頭の中で行われる言語行為で、自分の考えを方向づけたり、行動を（　　）する思考の道具としての機能を持つ。」", ["自己調整"], "内言とは、音声を伴わず自分の頭の中で行われる言語行為で、自分の考えを方向づけたり、行動を自己調整する思考の道具としての機能を持つ。"], ["内言と外言", "内言と外言について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、幼児期は外言が内言に分化する移行期であるとした。」", ["ヴィゴツキー"], "ヴィゴツキーは、幼児期は外言が内言に分化する移行期であるとした。"], ["ことば・認知の発達", "ことば・認知の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、人は活動を通して主体的に外界・環境についての認知を構築していく存在であるとした。」", ["ピアジェ"], "ピアジェは、人は活動を通して主体的に外界・環境についての認知を構築していく存在であるとした。"], ["ことば・認知の発達", "ことば・認知の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の認知発達理論における 5 つの重要概念として、シェマ、同化、調節、均衡化、操作、が挙げられる。」", ["ピアジェ"], "ピアジェの認知発達理論における 5 つの重要概念として、シェマ、同化、調節、均衡化、操作、が挙げられる。"], ["ピアジェの認知発達理論", "ピアジェの認知発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）はスキーマとも言い、人間が外界・環境と相互作用する際に用いられる既有の行動や知識などの認知的枠組みのことである。」", ["シェマ"], "シェマはスキーマとも言い、人間が外界・環境と相互作用する際に用いられる既有の行動や知識などの認知的枠組みのことである。"], ["ピアジェの認知発達理論", "ピアジェの認知発達理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「操作は行為が（　　）として内在化され、実際の動作を行わずに実行可能になることを意味する。」", ["表象"], "操作は行為が表象として内在化され、実際の動作を行わずに実行可能になることを意味する。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の認知発達理論の第一段階で、誕生から 2 歳ぐらいの時期をいう。」", ["ピアジェ"], "ピアジェの認知発達理論の第一段階で、誕生から 2 歳ぐらいの時期をいう。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「最初は唇に触れたものは何でも吸うが、次第にものに応じた吸い方へと（　　）される。」", ["調節"], "最初は唇に触れたものは何でも吸うが、次第にものに応じた吸い方へと調節される。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「8～12 カ月頃になると（　　）を理解できるようになる。」", ["対象の永続性"], "8～12 カ月頃になると対象の永続性を理解できるようになる。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、目の前にある対象物が視覚や触覚によって感知できなくても、その対象物が存在し続けているという認識をさし、表象機能の発達によって獲得される。」", ["対象の永続性"], "対象の永続性とは、目の前にある対象物が視覚や触覚によって感知できなくても、その対象物が存在し続けているという認識をさし、表象機能の発達によって獲得される。"], ["ピアジェの認知発達", "ピアジェの認知発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、生得的反射、第一次循環反応、第二次循環反応、二次的シェマの協応、第三次循環反応、心的表象の 6 段階を経るとされる。」", ["感覚運動期"], "感覚運動期は、生得的反射、第一次循環反応、第二次循環反応、二次的シェマの協応、第三次循環反応、心的表象の 6 段階を経るとされる。"], ["前操作期", "前操作期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の認知発達理論の第 2 段階で、2 歳～7 歳ぐらいの時期をいう。」", ["ピアジェ"], "ピアジェの認知発達理論の第 2 段階で、2 歳～7 歳ぐらいの時期をいう。"], ["ピアジェの認知発達", "ピアジェの認知発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）以外にも前操作期の子どもの思考特徴として、すべてのものに生命や意識があると考えるアニミズム、自然界の様々な事物は人間が作ったものと考える人工論、夢やおとぎ話の世界など心の中で生み出されたものが外界に存在すると考える実念論などが挙げられる。」", ["自己中心性"], "自己中心性以外にも前操作期の子どもの思考特徴として、すべてのものに生命や意識があると考えるアニミズム、自然界の様々な事物は人間が作ったものと考える人工論、夢やおとぎ話の世界など心の中で生み出されたものが外界に存在すると考える実念論などが挙げられる。"], ["三つ山の課題", "三つ山の課題について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）が考案した、他者の視点を理解する能力の発達を調べるための実験課題である。」", ["ピアジェ"], "ピアジェが考案した、他者の視点を理解する能力の発達を調べるための実験課題である。"], ["三つ山の課題", "三つ山の課題について、次の文の（　　）に入る最も適切な語句を答えよ。\n「ピアジェはこの課題を用いて、前操作期の子どもの特徴である（　　）を実証した。」", ["自己中心性"], "ピアジェはこの課題を用いて、前操作期の子どもの特徴である自己中心性を実証した。"], ["三つ山の課題", "三つ山の課題について、次の文の（　　）に入る最も適切な語句を答えよ。\n「なお、（　　）になると視点が変われば見える光景も変わることに気づき始める。」", ["具体的操作期"], "なお、具体的操作期になると視点が変われば見える光景も変わることに気づき始める。"], ["具体的操作期", "具体的操作期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の認知発達理論の第 3 段階で、７歳から 11 歳ぐらいまでをいう。」", ["ピアジェ"], "ピアジェの認知発達理論の第 3 段階で、７歳から 11 歳ぐらいまでをいう。"], ["具体的操作期", "具体的操作期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）が薄れ、脱中心化する能力、つまり物事を多面的・総合的に把握する能力と、操作による対象の変化が逆操作によって元に戻ることを理解する可逆性の出現が特徴である。」", ["自己中心性"], "自己中心性が薄れ、脱中心化する能力、つまり物事を多面的・総合的に把握する能力と、操作による対象の変化が逆操作によって元に戻ることを理解する可逆性の出現が特徴である。"], ["ピアジェの認知発達", "ピアジェの認知発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、対象の形や状態を変化させても、対象の数量といった性質は変化しないという認識を指す。」", ["保存の概念"], "保存の概念とは、対象の形や状態を変化させても、対象の数量といった性質は変化しないという認識を指す。"], ["保存の概念", "保存の概念について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の子どもは対象を知覚的・直感的に認識してしまい、表象を操作することが難しい。」", ["前操作期"], "前操作期の子どもは対象を知覚的・直感的に認識してしまい、表象を操作することが難しい。"], ["保存の概念", "保存の概念について、次の文の（　　）に入る最も適切な語句を答えよ。\n「しかし、（　　）になると元に戻せば同じになるという可逆性や容器の形が変化した分だけ量が増えて見えるといった相補性、何も加減していないため変化していないといった同一性を理解できるようになり、表象の操作が可能となることで保存の概念が成立する。」", ["具体的操作期"], "しかし、具体的操作期になると元に戻せば同じになるという可逆性や容器の形が変化した分だけ量が増えて見えるといった相補性、何も加減していないため変化していないといった同一性を理解できるようになり、表象の操作が可能となることで保存の概念が成立する。"], ["形式的操作期", "形式的操作期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）の認知発達理論の第 4 段階であり、11 歳以降をいう。」", ["ピアジェ"], "ピアジェの認知発達理論の第 4 段階であり、11 歳以降をいう。"], ["形式的操作期", "形式的操作期について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）はこの操作の到達によって子どもの思考が完成すると考えた。」", ["ピアジェ"], "ピアジェはこの操作の到達によって子どもの思考が完成すると考えた。"], ["愛着", "愛着について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）には、泣き・微笑・発声などの発信行動、注視や声のする方を向くといった足位行動、後追いやしがみつきといった接近行動にカテゴリー分けされる。」", ["愛着行動"], "愛着行動には、泣き・微笑・発声などの発信行動、注視や声のする方を向くといった足位行動、後追いやしがみつきといった接近行動にカテゴリー分けされる。"], ["愛着", "愛着について、次の文の（　　）に入る最も適切な語句を答えよ。\n「生後 6 か月～2・3 歳頃になると、特定の対象への（　　）が明確になり、接近行動によって一緒に居たいという態度を示すようになる。」", ["愛着行動"], "生後 6 か月～2・3 歳頃になると、特定の対象への愛着行動が明確になり、接近行動によって一緒に居たいという態度を示すようになる。"], ["遊び", "遊びについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「加えて、友達とのやり取りのなかで、言葉の発達や（　　）能力が発達するなど、社会性の発達が促進される。」", ["自己調整"], "加えて、友達とのやり取りのなかで、言葉の発達や自己調整能力が発達するなど、社会性の発達が促進される。"], ["遊び", "遊びについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「子どもは遊びの中で自分の世界を作りだし、自分のなりたいものになろうとしたり、（　　）や養育者のマネをするために、積極的に対象について探索・観察し、なりたいものを想像しながらまねをするようになる。」", ["ごっこ遊び"], "子どもは遊びの中で自分の世界を作りだし、自分のなりたいものになろうとしたり、ごっこ遊びや養育者のマネをするために、積極的に対象について探索・観察し、なりたいものを想像しながらまねをするようになる。"], ["ギャング・エイジ", "ギャング・エイジについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「集団内だけに通用する言葉や秘密を共有するなどして強い（　　）を示す。」", ["集団凝集性"], "集団内だけに通用する言葉や秘密を共有するなどして強い集団凝集性を示す。"], ["ギャング・エイジ", "ギャング・エイジについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「集団内では力関係による（　　）が行われ、集団の規律やリーダーへの忠誠・服従が求められ、これに反すると追放される。」", ["役割分化"], "集団内では力関係による役割分化が行われ、集団の規律やリーダーへの忠誠・服従が求められ、これに反すると追放される。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な語句を答えよ。\n「6～9 歳頃は大人の意見をそのまま取り入れる（　　）が特徴で、「悪い」とされた子どもへの一方的制裁としていじめが行われる。」", ["他律的道徳"], "6～9 歳頃は大人の意見をそのまま取り入れる他律的道徳が特徴で、「悪い」とされた子どもへの一方的制裁としていじめが行われる。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な語句を答えよ。\n「9～11 歳頃になると、集団内での掟が誕生し、（　　）が形成される。」", ["形式的平等の道徳"], "9～11 歳頃になると、集団内での掟が誕生し、形式的平等の道徳が形成される。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な語句を答えよ。\n「14～17 歳は、（　　）による自我の内部の葛藤や抑圧によっていじめが生じる。」", ["価値観的飲み込まれ状態"], "14～17 歳は、価値観的飲み込まれ状態による自我の内部の葛藤や抑圧によっていじめが生じる。"], ["心の理論", "心の理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）が提唱した心の理論とは、他者を自分とは異なる信念や意図を持った行為者としてとらえ、その感情や思考、意図などの心的状態に対する理解を意味する。」", ["プレマック"], "プレマックが提唱した心の理論とは、他者を自分とは異なる信念や意図を持った行為者としてとらえ、その感情や思考、意図などの心的状態に対する理解を意味する。"], ["心の理論", "心の理論について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）らの誤信念課題（サリーとアンの課題）が有名で、「サリーはかごにビー玉を入れて外出した。」", ["バロン＝コーエン"], "バロン＝コーエンらの誤信念課題（サリーとアンの課題）が有名で、「サリーはかごにビー玉を入れて外出した。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「4 歳頃になると、現実とは異なるサリーの誤信念を理解できるようになり、（　　）が獲得されると考えられている。」", ["心の理論"], "4 歳頃になると、現実とは異なるサリーの誤信念を理解できるようになり、心の理論が獲得されると考えられている。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「自閉スペクトラム症の 4 歳児の多くはこの課題を解くことができず、自閉症児の抱える様々な困難は（　　）を持たないからではないかと指摘されている。」", ["心の理論"], "自閉スペクトラム症の 4 歳児の多くはこの課題を解くことができず、自閉症児の抱える様々な困難は心の理論を持たないからではないかと指摘されている。"], ["向社会的判断", "向社会的判断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「就学前および小学校低学年で優勢な（　　）段階では、道徳的配慮よりも自分に向けられた結果に関心をもっている。」", ["快楽主義的自己焦点的志向", "快楽主義的・自己焦点的志向"], "就学前および小学校低学年で優勢な快楽主義的・自己焦点的志向段階では、道徳的配慮よりも自分に向けられた結果に関心をもっている。"], ["向社会的判断", "向社会的判断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「中・高校生になると、善い人/悪い人、善い行動/悪い行動についての紋切り型のイメージや他者からの承認・受容を考慮した（　　）になる。」", ["承認および対人的志向"], "中・高校生になると、善い人/悪い人、善い行動/悪い行動についての紋切り型のイメージや他者からの承認・受容を考慮した承認および対人的志向になる。"], ["向社会的判断", "向社会的判断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「また小学校高学年の少数と多くの中高校生に優勢な志向として、同情的応答や役割取得、他者の人間性への配慮に含む（　　）が挙げられる。」", ["自己反省的な共感志向"], "また小学校高学年の少数と多くの中高校生に優勢な志向として、同情的応答や役割取得、他者の人間性への配慮に含む自己反省的な共感志向が挙げられる。"], ["向社会的判断", "向社会的判断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「それ以上の年齢になると（　　）となり、内面化された価値、規範、義務、責任を含み、社会の条件あるいは他者の権利や尊厳を守る必要性について不明確ながら言及するようになる。」", ["移行段階"], "それ以上の年齢になると移行段階となり、内面化された価値、規範、義務、責任を含み、社会の条件あるいは他者の権利や尊厳を守る必要性について不明確ながら言及するようになる。"], ["向社会的判断", "向社会的判断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「中高校生の少数には、移行段階で不明確とされている理由について明確に言及できる（　　）がみられることもある。」", ["内面化された段階"], "中高校生の少数には、移行段階で不明確とされている理由について明確に言及できる内面化された段階がみられることもある。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）性とは、他者の感情あるいは他者の置かれている状況を認知して、同じ方向の感情を共有することを意味する。」", ["共感"], "共感性とは、他者の感情あるいは他者の置かれている状況を認知して、同じ方向の感情を共有することを意味する。"], ["共感性", "共感性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「まず、苦しんでいる他者を見ると、他者の苦痛と自己の苦痛を混同したような漠然とした共感的苦痛を示す（　　）の段階がある。」", ["全体的共感"], "まず、苦しんでいる他者を見ると、他者の苦痛と自己の苦痛を混同したような漠然とした共感的苦痛を示す全体的共感の段階がある。"], ["共感性", "共感性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「次に、苦しんでいるのは自己ではなく他者であることに気づくが、他者の内的状態を自己と同じものと考える（　　）の段階になる。」", ["自己中心的共感"], "次に、苦しんでいるのは自己ではなく他者であることに気づくが、他者の内的状態を自己と同じものと考える自己中心的共感の段階になる。"], ["共感性", "共感性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「最後に、他者の現在の状況だけでなく、人生経験に対する共感を抱く（　　）の段階に至る。」", ["他者の人生への共感"], "最後に、他者の現在の状況だけでなく、人生経験に対する共感を抱く他者の人生への共感の段階に至る。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は道徳性の発達として前習慣的水準、習慣的水準、習慣以降の水準の 3 段階を挙げている。」", ["コールバーグ"], "コールバーグは道徳性の発達として前習慣的水準、習慣的水準、習慣以降の水準の 3 段階を挙げている。"], ["コールバーグの道徳性", "コールバーグの道徳性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「前習慣的水準は、他者から褒められることが良いこと、罰せられることが悪いことであると判断する（　　）の段階と、自己や他者の要求や利益を満たす行いが善い行いであると判断する個人の視点の段階で構成される。」", ["自己中心的視点"], "前習慣的水準は、他者から褒められることが良いこと、罰せられることが悪いことであると判断する自己中心的視点の段階と、自己や他者の要求や利益を満たす行いが善い行いであると判断する個人の視点の段階で構成される。"], ["コールバーグの道徳性", "コールバーグの道徳性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「また習慣的水準は、周囲の他者との対人関係を重視し、他者に褒められる行いが善い行いだと判断する（　　）の段階と、社会秩序を維持することを重視し、社会や集団の利益に貢献する行いが善い行いだと判断する社会全体の視点の段階に分けられる。」", ["相互作用を持つ他者の視点"], "また習慣的水準は、周囲の他者との対人関係を重視し、他者に褒められる行いが善い行いだと判断する相互作用を持つ他者の視点の段階と、社会秩序を維持することを重視し、社会や集団の利益に貢献する行いが善い行いだと判断する社会全体の視点の段階に分けられる。"], ["コールバーグの道徳性", "コールバーグの道徳性について、次の文の（　　）に入る最も適切な語句を答えよ。\n「習慣以降の水準では、権利の意味を正しく理解し、法律が集団の合意によって変更可能なものとみなす（　　）の段階と、既存の法律よりも人間の相互信頼と自らの正義と公正の倫理原則に従った判断を行う全ての視点の段階が含まれる。」", ["特定の社会を超えた視点"], "習慣以降の水準では、権利の意味を正しく理解し、法律が集団の合意によって変更可能なものとみなす特定の社会を超えた視点の段階と、既存の法律よりも人間の相互信頼と自らの正義と公正の倫理原則に従った判断を行う全ての視点の段階が含まれる。"], ["発達の最近接領域", "発達の最近接領域について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、子どもの知的発達の水準を、子どもが自力で解決できるレベルのである完成した水準、または今日の発達水準と、自力では解決できない明日の発達水準に分けた。」", ["ヴィゴツキー"], "ヴィゴツキーは、子どもの知的発達の水準を、子どもが自力で解決できるレベルのである完成した水準、または今日の発達水準と、自力では解決できない明日の発達水準に分けた。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「そして、この 2 つの水準のズレの範囲を（　　）と言い、大人や仲間の援助を受ければ問題解決できる到達可能な水準とした。」", ["発達の最近接領域"], "そして、この 2 つの水準のズレの範囲を発達の最近接領域と言い、大人や仲間の援助を受ければ問題解決できる到達可能な水準とした。"], ["愛着・仲間関係・社会性・道徳性の発達", "愛着・仲間関係・社会性・道徳性の発達について、次の文の（　　）に入る最も適切な語句を答えよ。\n「彼は子どもの発達を促すためには、ひとり一人がもつ（　　）に適合した教育が必要であると主張した。」", ["発達の最近接領域"], "彼は子どもの発達を促すためには、ひとり一人がもつ発達の最近接領域に適合した教育が必要であると主張した。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、生理的な反射を引き起こす無条件刺激と中性的な刺激である条件刺激を対呈示することで、条件刺激だけで生理学的な反射と同じ反射である条件反応を形成する一連の手続きを指す。」", ["レスポンデント条件付け"], "レスポンデント条件付けとは、生理的な反射を引き起こす無条件刺激と中性的な刺激である条件刺激を対呈示することで、条件刺激だけで生理学的な反射と同じ反射である条件反応を形成する一連の手続きを指す。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、レスポンデント条件づけにおいて、消去によって条件反応が生起しなくなった後、しばらく休止期間をはさんで再び条件刺激を呈示すると、一時的に条件反応が回復する現象をいう。」", ["自発的回復"], "自発的回復とは、レスポンデント条件づけにおいて、消去によって条件反応が生起しなくなった後、しばらく休止期間をはさんで再び条件刺激を呈示すると、一時的に条件反応が回復する現象をいう。"], ["自発的回復", "自発的回復について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、消去は条件反応を積極的に抑制する生理作用である内制止によるものだと考えた。」", ["パブロフ"], "パブロフは、消去は条件反応を積極的に抑制する生理作用である内制止によるものだと考えた。"], ["自発的回復", "自発的回復について、次の文の（　　）に入る最も適切な語句を答えよ。\n「つまり、消去は刺激－反応の結合を消滅させるのではなく、反応を抑制するだけであって、刺激を休止により内制止の働きが一時的に緩んだ後に（　　）を再び提示することで自発的回復が生じると考えた。」", ["条件刺激"], "つまり、消去は刺激－反応の結合を消滅させるのではなく、反応を抑制するだけであって、刺激を休止により内制止の働きが一時的に緩んだ後に条件刺激を再び提示することで自発的回復が生じると考えた。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、特定の行動に報酬刺激や嫌悪刺激の随伴性を操作することで、その行動の生起頻度を変化させることである。」", ["オペラント条件付け"], "オペラント条件付けとは、特定の行動に報酬刺激や嫌悪刺激の随伴性を操作することで、その行動の生起頻度を変化させることである。"], ["オペラント条件付け", "オペラント条件付けについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「レバーを押すとエサを得ることのできる（　　）箱を用いて、ネズミがえさを得る手段としてレバーを押すことを習得する過程を示している。」", ["スキナー"], "レバーを押すとエサを得ることのできるスキナー箱を用いて、ネズミがえさを得る手段としてレバーを押すことを習得する過程を示している。"], ["オペラント条件付け", "オペラント条件付けについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「パブロフの（　　）が先行刺激に対する条件反射を条件付けの対象とすることに対し、スキナーのオペラント条件付けは、先行刺激なしで自発的に発生する行動を条件づけの対象とする点で異なる。」", ["レスポンデント条件付け"], "パブロフのレスポンデント条件付けが先行刺激に対する条件反射を条件付けの対象とすることに対し、スキナーのオペラント条件付けは、先行刺激なしで自発的に発生する行動を条件づけの対象とする点で異なる。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「そして、（　　）は、弁別刺激－オペラント行動－強化刺激という一連の連鎖からなる三項随伴性によって制御されると指摘した。」", ["オペラント条件付け"], "そして、オペラント条件付けは、弁別刺激－オペラント行動－強化刺激という一連の連鎖からなる三項随伴性によって制御されると指摘した。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）において、学習とは見方、考え方、関わり方、記憶の方法・内容などの情報処理の仕方が変容することであり、「できる」よりも「わかる」ことを重視している。」", ["認知主義"], "認知主義において、学習とは見方、考え方、関わり方、記憶の方法・内容などの情報処理の仕方が変容することであり、「できる」よりも「わかる」ことを重視している。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）において、学習とは、社会的な活動の中に参加し、そこで実践されている知識や技能を取り入れていくことと定義される。」", ["状況主義"], "状況主義において、学習とは、社会的な活動の中に参加し、そこで実践されている知識や技能を取り入れていくことと定義される。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）とは、学習者が直接経験したり強化を受けたりせず、モデルとなる他者の行動を観察することによってその行動を学習すること。」", ["観察学習"], "観察学習とは、学習者が直接経験したり強化を受けたりせず、モデルとなる他者の行動を観察することによってその行動を学習すること。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「学習者がモデルとなる他者の行動、いわゆる示範事象を観察している際にモデルの行動に対して与えられる強化を代理強化といい、（　　）を促進する効果を持つ。」", ["観察学習"], "学習者がモデルとなる他者の行動、いわゆる示範事象を観察している際にモデルの行動に対して与えられる強化を代理強化といい、観察学習を促進する効果を持つ。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、モデルの行動に対して注意を向ける注意過程、モデルの行動を記憶する保持課程、記憶したことを行動として再現する行動生産過程、それらの 3 つの過程の生起を動機づける動機づけ過程、の４つの過程によって成立するとされている。」", ["観察学習"], "観察学習は、モデルの行動に対して注意を向ける注意過程、モデルの行動を記憶する保持課程、記憶したことを行動として再現する行動生産過程、それらの 3 つの過程の生起を動機づける動機づけ過程、の４つの過程によって成立するとされている。"], ["学習理論・条件づけ", "学習理論・条件づけについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）において、学習とは、環境との相互作用を通じ自ら知識を作り上げることと考えられており、「学び合い」による授業や問題解決・発見型授業などが該当する。」", ["構成主義"], "構成主義において、学習とは、環境との相互作用を通じ自ら知識を作り上げることと考えられており、「学び合い」による授業や問題解決・発見型授業などが該当する。"], ["発達と学習の心理学Ⅰ", "感覚遮断の説明として、資料の内容に最も合うものを答えよ。", ["感覚器官に入る刺激情報を操作し、遮断または制限する"], "感覚遮断とは、感覚器官の一部または全体に対して、刺激となる情報を操作し、遮断または制限することを指す。"], ["感覚遮断", "感覚遮断について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、半透明のゴーグル、イヤホン、筒を用いて各感覚を極端に制限した実験を行った。」", ["ヘロン"], "ヘロンは、半透明のゴーグル、イヤホン、筒を用いて各感覚を極端に制限した実験を行った。"], ["学習動機", "学習動機について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）、自尊志向、報酬志向の学び方の特徴として、結果や勉強量、暗記することを重視する学習であることが挙げられる。」", ["関係志向"], "関係志向、自尊志向、報酬志向の学び方の特徴として、結果や勉強量、暗記することを重視する学習であることが挙げられる。"], ["達成動機", "達成動機について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は、達成行動には達成目標への接近動機と失敗に対する回避動機という相反する動機が働き、達成動機はこれらの合成であると考えた。」", ["アトキンソン"], "アトキンソンは、達成行動には達成目標への接近動機と失敗に対する回避動機という相反する動機が働き、達成動機はこれらの合成であると考えた。"], ["学習性無力感", "学習性無力感について、次の文の（　　）に入る最も適切な語句を答えよ。\n「（　　）は犬を被験体に電撃を受ける装置を用いて、電撃から逃れられない状況を繰り返し経験させられた実験群とそのような経験を経ていない統制群に、回避実験を行った。」", ["セリグマン"], "セリグマンは犬を被験体に電撃を受ける装置を用いて、電撃から逃れられない状況を繰り返し経験させられた実験群とそのような経験を経ていない統制群に、回避実験を行った。"], ["自己効力感の性質", "自己効力感の性質について、資料の内容に最も合うものを答えよ。", ["自己効力感は操作可能であり、行動変容をもたらすことができる"], "資料では、自己効力感は操作可能であり、行動変容をもたらすことができるとされている。"], ["障害児教育の理念", "障害児教育の理念について、次の文の（　　）に入る最も適切な語句を答えよ。\n「またニーリエは（　　）における８つの要素として、①ノーマルな一日のリズム、②ノーマルな一週間のリズム、③ノーマルな一年のリズム、④ノーマルなライフサイクル、⑤ノーマルな自己決定の権利、⑥生活している文化圏にふさわしいノーマルな性的関係、⑦生活している国にふさわしいノーマルな経済水準、⑧生活している社会にふさわしいノーマルな環境形態を挙げた。」", ["ノーマライゼーション"], "またニーリエはノーマライゼーションにおける８つの要素として、①ノーマルな一日のリズム、②ノーマルな一週間のリズム、③ノーマルな一年のリズム、④ノーマルなライフサイクル、⑤ノーマルな自己決定の権利、⑥生活している文化圏にふさわしいノーマルな性的関係、⑦生活している国にふさわしいノーマルな経済水準、⑧生活している社会にふさわしいノーマルな環境形態を挙げた。"], ["インクルージョン", "インクルージョンについて、次の文の（　　）に入る最も適切な語句を答えよ。\n「年齢や障害の有無にかかわらず、すべての子どもにわかりやすいように工夫された教育である（　　）や」", ["ユニバーサルデザイン教育"], "年齢や障害の有無にかかわらず、すべての子どもにわかりやすいように工夫された教育であるユニバーサルデザイン教育や"], ["発達段階", "発達段階について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「代表的な理論:エリクソン（E. Erikson）の漸次的発達理論: 生涯を （　　）の段階に分け、それぞれの時期の「心理社会的危機（例: 信頼 vs 不信、アイデンティティの確立）」を中心に区分した。」", ["8 つ"], "代表的な理論:エリクソン（E. Erikson）の漸次的発達理論: 生涯を 8 つの段階に分け、それぞれの時期の「心理社会的危機（例: 信頼 vs 不信、アイデンティティの確立）」を中心に区分した。"], ["発達段階", "発達段階について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「代表的な理論:ピアジェ（J. Piaget）の認知発達段階説: 「思考力（知能）」に絞り、感覚運動期・前作業期・具体的能力期・形式的能力期の （　　）に区分した。」", ["4 段階"], "代表的な理論:ピアジェ（J. Piaget）の認知発達段階説: 「思考力（知能）」に絞り、感覚運動期・前作業期・具体的能力期・形式的能力期の 4 段階に区分した。"], ["胎生期", "胎生期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「このうち受精から着床までの約1 週間を卵体期、着床から妊娠 8 週目までの（　　）を胎芽期と呼ぶ。」", ["約 60 日間"], "このうち受精から着床までの約1 週間を卵体期、着床から妊娠 8 週目までの約 60 日間を胎芽期と呼ぶ。"], ["胎生期", "胎生期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「妊娠 （　　）目までの時期は、ヒトの形を呈していないことから胎芽と呼ばれる。」", ["8 週"], "妊娠 8 週目までの時期は、ヒトの形を呈していないことから胎芽と呼ばれる。"], ["胎生期", "胎生期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「妊娠 10 週ごろまでに大脳・小農・延髄などが形成され、大きさは （　　） 程度になる。」", ["2～3cm", "2〜3cm"], "妊娠 10 週ごろまでに大脳・小農・延髄などが形成され、大きさは 2～3cm 程度になる。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「横軸を年齢、縦軸を 20 歳時点での発育率を （　　）とした発育率を示している。」", ["100%"], "横軸を年齢、縦軸を 20 歳時点での発育率を 100%とした発育率を示している。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「出生直後から急激に発育し、4～5 歳までには成人の （　　）程度に達する。」", ["80％"], "出生直後から急激に発育し、4～5 歳までには成人の 80％程度に達する。"], ["スキャモンの発達曲線", "スキャモンの発達曲線について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「生後から （　　）までにかけて急激に発育し、成人の水準を超えるが、思春期以降は成人の水準程度に低下する。」", ["12〜13 歳", "12～13 歳頃", "12～13 歳"], "生後から 12～13 歳までにかけて急激に発育し、成人の水準を超えるが、思春期以降は成人の水準程度に低下する。"], ["前頭葉", "前頭葉について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「前頭葉は大脳の（　　）を占め、行為の計画、反応の選択と抑制、情動のコントロール、意思決定をつかさどる。」", ["約 40％"], "前頭葉は大脳の約 40％を占め、行為の計画、反応の選択と抑制、情動のコントロール、意思決定をつかさどる。"], ["基本情動と自己意識的情動", "基本情動と自己意識的情動について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「達と自己意識的情動）誕生から 1 歳までに、喜び・驚き・悲しみ・嫌悪・怒り・恐れの （　　）の基本的な情動を表出するようになる。」", ["6 つ"], "達と自己意識的情動）誕生から 1 歳までに、喜び・驚き・悲しみ・嫌悪・怒り・恐れの 6 つの基本的な情動を表出するようになる。"], ["基本情動と自己意識的情動", "基本情動と自己意識的情動について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）以降になると客体的な自己意識が芽生え、照れ・共感・羨望の情動が出現する。」", ["生後 6～8 か月頃", "生後 6〜8 か月", "生後 6～8 か月"], "生後 6～8 か月以降になると客体的な自己意識が芽生え、照れ・共感・羨望の情動が出現する。"], ["情動調整", "情動調整について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃までは養育者主導の調整が行われ、生理的欲求の妨げを養育者が取り除くことで解消される。」", ["生後 3 カ月", "生後 3 カ月頃"], "生後 3 カ月頃までは養育者主導の調整が行われ、生理的欲求の妨げを養育者が取り除くことで解消される。"], ["情動調整", "情動調整について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「1 歳から （　　）頃までは、養育者を補助とした子ども主導の調整が行われる。」", ["2 歳", "2 歳頃"], "1 歳から 2 歳頃までは、養育者を補助とした子ども主導の調整が行われる。"], ["情動調整", "情動調整について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「3 歳から （　　）以降になると、子ども自身での調整が行われる。」", ["4 歳", "4 歳頃"], "3 歳から 4 歳以降になると、子ども自身での調整が行われる。"], ["第一次反抗期", "第一次反抗期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「2 歳から （　　）頃に現れ、大人が何を言っても拒否や否定をし、自己主張が強くなる、悪いことをしても謝らないといった行動が目立つようになる。」", ["3 歳", "3 歳頃"], "2 歳から 3 歳頃に現れ、大人が何を言っても拒否や否定をし、自己主張が強くなる、悪いことをしても謝らないといった行動が目立つようになる。"], ["ことばを聴く力", "ことばを聴く力について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「しかし、（　　）頃になると、母語で区別されない音の違いは無視するようになり、母語で区別される音の違いについてのみ正確に聞き分けるようになる。」", ["生後 9 カ月頃", "生後 9 カ月"], "しかし、生後 9 カ月頃になると、母語で区別されない音の違いは無視するようになり、母語で区別される音の違いについてのみ正確に聞き分けるようになる。"], ["表象と象徴機能", "表象と象徴機能について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃になると、体験したり見聞きしたことをイメージとして思い描くようになる。」", ["生後 10〜12 カ月", "生後 10～12 カ月頃", "生後 10～12 カ月"], "生後 10～12 カ月頃になると、体験したり見聞きしたことをイメージとして思い描くようになる。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「生後 6～8 週間頃になると、比較的リラックスした状態でクーイングがみられるようになり、（　　）頃になると母語の音韻を多く含んだ音節からなる喃語を発するようになる。」", ["生後 6～8 か月頃", "生後 6〜8 か月", "生後 6～8 か月"], "生後 6～8 週間頃になると、比較的リラックスした状態でクーイングがみられるようになり、生後 6～8 か月頃になると母語の音韻を多く含んだ音節からなる喃語を発するようになる。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「1 歳半から （　　）頃になると 2 語文を使うようになり、また、ものに名前があることを認識し、しきりにものの名前を尋ねるようになる。」", ["2 歳", "2 歳頃"], "1 歳半から 2 歳頃になると 2 語文を使うようになり、また、ものに名前があることを認識し、しきりにものの名前を尋ねるようになる。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「2 歳半から （　　）になると、接続詞や助詞が使えるようになり、大人の言葉を盛んに模倣するようになる。」", ["3 歳", "3 歳頃"], "2 歳半から 3 歳になると、接続詞や助詞が使えるようになり、大人の言葉を盛んに模倣するようになる。"], ["語彙の発達", "語彙の発達について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「4 歳から （　　）頃になると、言語はコミュニケーションだけでなく、思考の道具としての機能を持つようになり、言葉を使って考えたり想像したりできるようになる。」", ["5 歳", "5 歳頃"], "4 歳から 5 歳頃になると、言語はコミュニケーションだけでなく、思考の道具としての機能を持つようになり、言葉を使って考えたり想像したりできるようになる。"], ["ピアジェの認知発達理論", "ピアジェの認知発達理論について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「ピアジェの認知発達理論における （　　）の重要概念として、シェマ、同化、調節、均衡化、操作、が挙げられる。」", ["5 つ"], "ピアジェの認知発達理論における 5 つの重要概念として、シェマ、同化、調節、均衡化、操作、が挙げられる。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「ピアジェの認知発達理論の第一段階で、誕生から （　　）ぐらいの時期をいう。」", ["2 歳", "2 歳頃"], "ピアジェの認知発達理論の第一段階で、誕生から 2 歳ぐらいの時期をいう。"], ["感覚運動期", "感覚運動期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「感覚運動期は、生得的反射、第一次循環反応、第二次循環反応、二次的シェマの協応、第三次循環反応、心的表象の （　　）を経るとされる。」", ["6 段階"], "感覚運動期は、生得的反射、第一次循環反応、第二次循環反応、二次的シェマの協応、第三次循環反応、心的表象の 6 段階を経るとされる。"], ["前操作期", "前操作期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「ピアジェの認知発達理論の第 2 段階で、2 歳～（　　）ぐらいの時期をいう。」", ["7 歳頃", "7 歳"], "ピアジェの認知発達理論の第 2 段階で、2 歳～7 歳ぐらいの時期をいう。"], ["前操作期", "前操作期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「その中でも 2 歳から （　　）までを前概念的思考期という。」", ["4 歳", "4 歳頃"], "その中でも 2 歳から 4 歳までを前概念的思考期という。"], ["具体的操作期", "具体的操作期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「ピアジェの認知発達理論の第 3 段階で、７歳から （　　）ぐらいまでをいう。」", ["11 歳", "11 歳頃"], "ピアジェの認知発達理論の第 3 段階で、７歳から 11 歳ぐらいまでをいう。"], ["形式的操作期", "形式的操作期について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「ピアジェの認知発達理論の第 4 段階であり、（　　）以降をいう。」", ["11 歳", "11 歳頃"], "ピアジェの認知発達理論の第 4 段階であり、11 歳以降をいう。"], ["愛着", "愛着について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃までは、自身と養育者の分化が不十分であり、誰に対しても同じような反応をみせる。」", ["生後 3 か月頃", "生後 3 か月"], "生後 3 か月頃までは、自身と養育者の分化が不十分であり、誰に対しても同じような反応をみせる。"], ["愛着", "愛着について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「生後 6 か月～2・（　　）頃になると、特定の対象への愛着行動が明確になり、接近行動によって一緒に居たいという態度を示すようになる。」", ["3 歳", "3 歳頃"], "生後 6 か月～2・3 歳頃になると、特定の対象への愛着行動が明確になり、接近行動によって一緒に居たいという態度を示すようになる。"], ["愛着", "愛着について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）以降になると、養育者との身体的接触が必ずしも必要ではなくなる。」", ["3 歳", "3 歳頃"], "3 歳以降になると、養育者との身体的接触が必ずしも必要ではなくなる。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃は大人の意見をそのまま取り入れる他律的道徳が特徴で、「悪い」とされた子どもへの一方的制裁としていじめが行われる。」", ["6～9 歳頃", "6〜9 歳", "6～9 歳"], "6～9 歳頃は大人の意見をそのまま取り入れる他律的道徳が特徴で、「悪い」とされた子どもへの一方的制裁としていじめが行われる。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃になると、集団内での掟が誕生し、形式的平等の道徳が形成される。」", ["9～11 歳", "9～11 歳頃", "9〜11 歳"], "9～11 歳頃になると、集団内での掟が誕生し、形式的平等の道徳が形成される。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃は、同性の友人との親密な関係性が創造され、私的グループが誕生する。」", ["11～13歳", "11～13歳頃", "11〜13歳"], "11～13歳頃は、同性の友人との親密な関係性が創造され、私的グループが誕生する。"], ["いじめの変遷", "いじめの変遷について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）は、価値観的飲み込まれ状態による自我の内部の葛藤や抑圧によっていじめが生じる。」", ["14～17 歳頃", "14〜17 歳", "14～17 歳"], "14～17 歳は、価値観的飲み込まれ状態による自我の内部の葛藤や抑圧によっていじめが生じる。"], ["心の理論", "心の理論について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「（　　）頃になると、現実とは異なるサリーの誤信念を理解できるようになり、心の理論が獲得されると考えられている。」", ["4 歳", "4 歳頃"], "4 歳頃になると、現実とは異なるサリーの誤信念を理解できるようになり、心の理論が獲得されると考えられている。"], ["心の理論", "心の理論について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「自閉スペクトラム症の （　　）児の多くはこの課題を解くことができず、自閉症児の抱える様々な困難は心の理論を持たないからではないかと指摘されている。」", ["4 歳", "4 歳頃"], "自閉スペクトラム症の 4 歳児の多くはこの課題を解くことができず、自閉症児の抱える様々な困難は心の理論を持たないからではないかと指摘されている。"], ["コールバーグの道徳性", "コールバーグの道徳性について、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「コールバーグは道徳性の発達として前習慣的水準、習慣的水準、習慣以降の水準の （　　）を挙げている。」", ["3 段階"], "コールバーグは道徳性の発達として前習慣的水準、習慣的水準、習慣以降の水準の 3 段階を挙げている。"], ["ノーマライゼーション", "ノーマライゼーションについて、次の文の（　　）に入る最も適切な数値・時期を答えよ。\n「またニーリエはノーマライゼーションにおける（　　）の要素として、①ノーマルな一日のリズム、②ノーマルな一週間のリズム、③ノーマルな一年のリズム、④ノーマルなライフサイクル、⑤ノーマルな自己決定の権利、⑥生活している文化圏にふさわしいノーマルな性的関係、⑦生活している国にふさわしいノーマルな経済水準、⑧生活している社会にふさわしいノーマルな環境形態を挙げた。」", ["８つ"], "またニーリエはノーマライゼーションにおける８つの要素として、①ノーマルな一日のリズム、②ノーマルな一週間のリズム、③ノーマルな一年のリズム、④ノーマルなライフサイクル、⑤ノーマルな自己決定の権利、⑥生活している文化圏にふさわしいノーマルな性的関係、⑦生活している国にふさわしいノーマルな経済水準、⑧生活している社会にふさわしいノーマルな環境形態を挙げた。"], ["発達と学習の心理学Ⅰ", "発達の定義として最も適切なものを答えよ。", ["誕生あるいは受精から死に至るまで、心身の構造や機能が量的・質的に連続して変容する過程", "誕生あるいは受精から死に至るまで、心身の構造や機能が量的質的に連続して変容する過程"], "発達とは、人の誕生あるいは受精から死に至るまでの間、心身の構造や機能が、量的にも質的にも連続的に変容していく過程と定義される。"], ["発達と学習の心理学Ⅰ", "バルテスが生涯発達を捉える視点として挙げた組合せを答えよ。", ["獲得と喪失多次元性と多方向性多様な要因の相互作用", "獲得と喪失・多次元性と多方向性・多様な要因の相互作用"], "バルテスは、獲得と喪失、多次元性・多方向性、多様な要因の相互作用という3視点を挙げている。"], ["発達と学習の心理学Ⅰ", "バルテスが多様な要因の相互作用として挙げた3つのシステムの組合せを答えよ。", ["年齢的段階・歴史的段階・非規範的段階", "年齢的段階歴史的段階非規範的段階"], "多様な要因の相互作用では、年齢的段階、歴史的段階、非規範的段階の3つのシステムが相互に影響するとされる。"], ["発達と学習の心理学Ⅰ", "ゲゼルの双生児研究から導かれた結論として最も適切なものを答えよ。", ["訓練の効果には神経系の成熟とレディネスが必要である"], "ゲゼルは、訓練・学習が効果を発揮するには内的準備状態であるレディネスが整う必要があるとした。"], ["発達と学習の心理学Ⅰ", "ワトソンが発達の本質として捉えたものを答えよ。", ["刺激と反応の連合による習慣の形成"], "ワトソンは、発達の本質を習慣の形成、すなわち刺激と反応の連合過程と捉えた。"], ["発達と学習の心理学Ⅰ", "学習優位説を支持する事例として資料に挙げられている組合せを答えよ。", ["アヴェロン を行うことで情動体験となる。"], ["発達と学習の心理学Ⅰ", "誕生から1歳までに出現する6つの基本情動の組合せを答えよ。", ["喜び驚き悲しみ嫌悪怒り恐れ", "喜び・驚き・悲しみ・嫌悪・怒り・恐れ"], "資料では喜び、驚き、悲しみ、嫌悪、怒り、恐れの6つが基本的情動として挙げられている。"], ["発達と学習の心理学Ⅰ", "生後6～8か月以降、客体的自己意識の芽生えとともに出現する情動の組合せを答えよ。", ["照れ共感羨望", "照れ・共感・羨望"], "客体的自己意識が芽生えると照れ、共感、羨望が出現するとされる。"], ["発達と学習の心理学Ⅰ", "2歳半～3歳頃、基準やルールに照らして自己評価する能力とともに出現する情動を答えよ。", ["誇り・恥・罪悪感", "誇り恥罪悪感"], "2歳半～3歳頃には誇り、恥、罪悪感が出現する。"], ["発達と学習の心理学Ⅰ", "生後3か月頃までの情動調整の主体として最も適切なものを答えよ。", ["養育者主導"], "生後3か月頃までは養育者主導の調整が行われる。"], ["発達と学習の心理学Ⅰ", "生後3か月頃から1歳頃までに用いられる方法の組合せを答えよ。", ["社会的参照・情動調律", "社会的参照情動調律"], "この時期は養育者と子どもの間で、社会的参照や情動調律を用いた調整が行われる。"], ["発達と学習の心理学Ⅰ", "3～4歳以降に理解できるようになるものを答えよ。", ["適切な情動表出に関するルール"], "3～4歳以降は、社会的場面でどの情動を表出すべきかというルールを理解できるようになる。"], ["発達と学習の心理学Ⅰ", "移行対象の役割として最も適切なものを答えよ。", ["分離不安や欲求不満を低減し、内的世界と現実世界を橋渡しする"], "移行対象は分離不安や欲求不満を低減し、内的世界と現実世界の橋渡しをする。"], ["発達と学習の心理学Ⅰ", "第三者による報酬や賞賛を得る手段として行動することを何というか。", ["外発的動機づけ"], "報酬や賞賛など外的なものを得る手段として行動することを外発的動機づけという。"], ["発達と学習の心理学Ⅰ", "行動そのものが目標となっている状態を何というか。", ["内発的動機づけ"], "活動自体が目標となっている状態を内発的動機づけという。"], ["発達と学習の心理学Ⅰ", "アンダーマイニング現象の説明として正しいものを答えよ。", ["内発的に動機づけられた行動に外的報酬を与えると、内発的動機づけが低下する"], "本来内発的に動機づけられた行動に外的報酬を与えることで内発的動機づけが低下する現象を指す。"], ["発達と学習の心理学Ⅰ", "第一次反抗期の背景として資料が挙げるものを答えよ。", ["自己と他者を区別できるようになり、自我が芽生えること"], "自己と他者の区別ができ、自我が芽生えることで自己主張が強くなるとされる。"], ["乳児の音韻知覚", "乳児の音韻知覚について正しい記述を答えよ。", ["出生直後は幅広い音韻を聞き分けるが、生後9か月頃から母語に必要な音の区別へ効率化される"], "出生直後はあらゆる音韻を聞き分けるが、生後9か月頃になると母語で区別される音を中心に正確に聞き分けるようになる。"], ["発達と学習の心理学Ⅰ", "表象の出現によって可能になることとして最も適切なものを答えよ。", ["見聞きしたことをイメージとして思い描く"], "生後10～12か月頃になると、体験したり見聞きしたことをイメージとして思い描く表象が出現する。"], ["発達と学習の心理学Ⅰ", "象徴機能の説明として正しいものを答えよ。", ["ある対象を言葉身ぶり数字などの象徴で表す機能", "ある対象を言葉・身ぶり・数字などの象徴で表す機能"], "1歳頃になると、対象を言葉や身ぶり、数字などの象徴で表すようになる。"], ["発達と学習の心理学Ⅰ", "ある音とある音がつながる確率の高さから単語を切り分ける手がかりを答えよ。", ["音の遷移確率"], "音のつながる確率が高いものを単語として理解することを音の遷移確率による切り分けという。"], ["発達と学習の心理学Ⅰ", "母語の音韻を多く含んだ音節からなる発声を答えよ。", ["喃語"], "生後6～8か月頃には母語の音韻を多く含んだ喃語を発する。"], ["発達と学習の心理学Ⅰ", "自分の考えを方向づけ、行動を自己調整する思考の道具として機能するものを答えよ。", ["内言"], "内言は音声を伴わず頭の中で行われ、思考の道具として機能する。"], ["発達と学習の心理学Ⅰ", "他者 ], "関係・自尊・報酬志向では結果や勉強量、暗記を重視し、失敗すると意欲低下につながりやすい。"], ["発達と学習の心理学Ⅰ", "充実志向・訓練志向・実用志向に共通する学び方の特徴を答えよ。", ["思考過程学習方略意味理解を重視し、失敗に柔軟", "思考過程・学習方略・意味理解を重視し、失敗に柔軟"], "充実・訓練・実用志向では思考過程や方略、意味理解を重視し、失敗に対する柔軟性がある。"], ["発達と学習の心理学Ⅰ", "達成動機が高い人が好む課題難易度を答えよ。", ["成功と失敗の確率が五分五分程度の中程度の難易度"], "達成動機が高い人は成功と失敗の確率が五分五分の中程度の課題を好むとされる。"], ["発達と学習の心理学Ⅰ", "学習性無力感の説明を答えよ。", ["回避できない失敗体験が続き、何をしても無駄だと考えて解決への試みを放棄する状態"], "回避できない失敗体験の連続から否定的自己概念が形成され、解決への試みを放棄する状態を指す。"], ["発達と学習の心理学Ⅰ", "自己効力感を形成する4つの情報源の組合せを答えよ。", ["行動達成代理経験言語的説得遂行時の生理的状態", "行動達成・代理経験・言語的説得・遂行時の生理的状態"], "自己効力感は行動達成、代理経験、言語的説得、遂行時の生理的状態の4情報をもとに形成される。"], ["発達と学習の心理学Ⅰ", "ノーマライゼーションの8要素を示した人物を答えよ。", ["ニーリエ"], "ニーリエはノーマライゼーションにおける8つの要素を示した。"], ["発達と学習の心理学Ⅰ", "インテグレーションの説明として最も適切なものを答えよ。", ["障害のある子を区別した上で通常学級に置き、障害のある側が既存環境に合わせる"], "資料ではインテグレーションを、障害のある子を区別した上で通常学級で教育し、障害者が健常者側に合わせる考え方としている。"], ["発達と学習の心理学Ⅰ", "インクルージョンの説明として最も適切なものを答えよ。", ["障害の有無にかかわらず必要な援助を保障し、最初からすべての子どもが一緒に学べる環境を作る"], "インクルージョンは必要な援助を保障し、最初からすべての子どもが一緒に学べる環境を作る包括教育である。"], ["発達と学習の心理学Ⅰ", "脳の発達過程として資料に沿った順序を答えよ。", ["シナプスの過剰生成→シナプスの刈り込み→髄鞘化"], "資料では、初期のシナプスの過剰生成、その後の刈り込み、最後に髄鞘化という流れが示されている。"], ["発達と学習の心理学Ⅰ", "情動調整の発達の順序として正しいものを答えよ。", ["養育者主導→養育者と子どもの共同→養育者を補助とした子ども主導→子ども自身"], "情動調整は養育者主導から共同調整、養育者を補助とした子ども主導、子ども自身の調整へと発達する。"], ["発達と学習の心理学Ⅰ", "発声・語彙発達の順序として正しいものを答えよ。", ["クーイング→喃語→初語→2語文→語彙爆発→多弁期"], "資料ではクーイング、喃語、初語、2語文、語彙爆発、多弁期の順に記載されている。"], ["発達と学習の心理学Ⅰ", "ピアジェの認知発達段階の正しい順序を答えよ。", ["感覚運動期→前操作期→具体的操作期→形式的操作期"], "ピアジェの認知発達は感覚運動期、前操作期、具体的操作期、形式的操作期の順に進む。"], ["発達と学習の心理学Ⅰ", "感覚運動期の6段階として資料に記載された正しい順序を答えよ。", ["生得的反射→第一次循環反応→第二次循環反応→二次的シェマの協応→第三次循環反応→心的表象"], "感覚運動期は生得的反射から心的表象まで6段階を経るとされる。"], ["いじめの発達的変遷", "いじめの発達的変遷における年齢区分の正しい順序を答えよ。", ["6～9歳→9～11歳→11～13歳→14～17歳頃", "6～9歳→9～11歳→11～13歳→14～17歳", "6〜9歳→9〜11歳→11〜13歳→14〜17歳"], "資料では6～9歳、9～11歳、11～13歳、14～17歳の4段階でいじめの変遷が説明される。"], ["発達と学習の心理学Ⅰ", "向社会的判断の発達順序として最も適切なものを答えよ。", ["快楽主義的自己焦点的志向→他者の要求に目を向けた志向→承認および対人的志向→自己反省的な共感志向→移行段階内面化", "快楽主義的・自己焦点的志向→他者の要求に目を向けた志向→承認および対人的志向→自己反省的な共感志向→移行段階・内面化"], "資料では年齢の上昇に伴って自己焦点から他者要求、承認・対人、自己反省的共感 let pool=[...Q],idx=0,attempt=0,correct=0,wrong=new Set(),done=false;
const $=id=>document.getElementById(id);
const norm=x=>String(x).toLowerCase().normalize('NFKC')
  .replace(/[\s・･,，。\.\-ー_()（）「」『』\/]/g,'')
  .replace(/〜/g,'～');

function stats(){
  $('correct').textContent=correct;
  $('mistakes').textContent=wrong.size;
  $('rate').textContent=attempt?Math.round(correct/attempt*100)+'%':'—';
  $('total').textContent=Q.length;
}
function draw(){
  if(!pool.length){
    $('cat').textContent='復習';
    $('question').textContent='間違えた問題はまだありません！';
    $('form').style.display='none';
    $('next').style.display='none';
    $('progress').textContent='復習問題 0問';
    return;
  }
  $('form').style.display='block';
  done=false;
  const q=pool[idx%pool.length];
  $('progress').textContent=`第 ${idx+1} 問 / ${pool.length} 問`;
  $('cat').textContent='';
  $('question').textContent=q[1];
  $('answer').value='';
  $('feedback').style.display='none';
  $('next').style.display='none';
  $('answer').focus();
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  if(done)return;
  const v=$('answer').value.trim();
  if(!v){
    $('feedback').style.display='block';
    $('feedback').style.background='#fff7ed';
    $('feedback').style.color='#7c2d12';
    $('feedback').textContent='答えを入力してね。';
    return;
  }
  done=true; attempt++;
  const q=pool[idx%pool.length];
  const ok=q[2].some(a=>norm(a)===norm(v));
  const oi=Q.indexOf(q);
  if(ok){
    correct++; wrong.delete(oi);
    $('feedback').style.background='var(--ok)';
    $('feedback').style.color='var(--text)';
    $('feedback').innerHTML='<b style="font-size:31px">○ 正解！</b>' + (q[3]?'<div class="explain">'+q[3]+'</div>':'');
  }else{
    wrong.add(oi);
    $('feedback').style.background='var(--ng)';
    $('feedback').style.color='var(--text)';
    $('feedback').innerHTML='<b style="font-size:29px">× 惜しい！</b><div style="margin-top:7px">正解：<strong>'+q[2][0]+'</strong></div>' + (q[3]?'<div class="explain">'+q[3]+'</div>':'');
  }
  $('feedback').style.display='block';
  $('next').style.display='block';
  stats();
});
$('next').addEventListener('click',()=>{idx=(idx+1)%pool.length;draw()});
$('shuffle').addEventListener('click',()=>{pool=[...Q].sort(()=>Math.random()-.5);idx=0;draw()});
$('all').addEventListener('click',()=>{pool=[...Q];idx=0;draw()});
$('wrong').addEventListener('click',()=>{pool=[...wrong].map(i=>Q[i]);idx=0;draw()});
$('toggle').addEventListener('click',()=>{
  const m=$('menu'),hidden=m.classList.toggle('hidden');
  $('toggle').textContent=hidden?'▼ メニューを表示':'▲ メニューを隠す';
});
stats();draw();
</script>
