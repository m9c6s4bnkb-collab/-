<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>神経心理学｜4択問題</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#667085;--line:#e4e7ec;--accent:#344054;--soft:#f2f4f7;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headerin{max-width:900px;margin:auto;padding:11px 14px}.title{font-size:17px;font-weight:800;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:14px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.panel{padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}
button,select,input{font:inherit}button,.btn,select{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.stat{background:#f8fafc;border-radius:10px;padding:7px 8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}
.card{padding:18px}.qno{font-size:12px;color:var(--muted);margin-bottom:6px}.question{font-size:18px;font-weight:750;line-height:1.7;margin:0 0 14px}.options{display:grid;gap:9px}.opt{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid #d0d5dd;background:#fff}.opt:hover{background:#f9fafb}.opt.correct{border-color:var(--good);background:#ecfdf3}.opt.wrong{border-color:var(--bad);background:#fef3f2}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.feedback.good{border-color:#a6f4c5}.feedback.bad{border-color:#fecdca}.answer{font-weight:800}.topic{margin-top:7px;color:var(--muted);font-size:12px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.nav button{flex:1}.nav button:nth-child(2){flex:1.4}
.empty{text-align:center;padding:28px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.links a{text-decoration:none;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:9px;color:var(--accent);font-size:12px}
.shortInput{display:flex;gap:8px}.shortInput input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:11px;min-width:0}.selfrow{display:flex;gap:8px;margin-top:9px}.selfrow button{flex:1}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.question{font-size:16px}.card{padding:14px}.headerin{padding-top:8px}.wrap{padding:10px}.shortInput{display:block}.shortInput button{width:100%;margin-top:8px}}
</style></head><body><header><div class="headerin"><h1 class="title">神経心理学｜4択問題</h1><div class="sub">4択｜178問｜出典：神経・生理心理学(3).pdf</div><div class="links"><a href="index.html">トップ</a><a href="shinkei-choice.html">神経4択</a><a href="shinkei-short.html">神経一問一答</a><a href="seiri-choice.html">生理4択</a><a href="seiri-short.html">生理一問一答</a></div></div></header><main class="wrap"><section class="panel"><div class="row"><select onchange="setFilter(this.value)"><option value="all">全問題</option><option value="unanswered">未回答</option><option value="lastwrong">前回不正解</option><option value="everwrong">一度でも間違えた</option><option value="wrong2">2回以上間違えた</option><option value="wrong3">3回以上間違えた</option></select><button id="randomBtn" onclick="toggleRandom()">ランダムOFF</button><button onclick="resetSession()">セッション成績リセット</button><button class="danger" onclick="resetAll()">全記録リセット</button><span id="countLabel" class="small"></span></div><div class="stats"><div class="stat"><b id="sAnswered">0</b><span>今回の回答</span></div><div class="stat"><b id="sCorrect">0</b><span>今回の正解</span></div><div class="stat"><b id="cDone">0</b><span>累積：回答済み</span></div><div class="stat"><b id="cWrong">0</b><span>累積：誤答回数</span></div></div></section><section id="card" class="card"></section></main><script>const QUESTIONS=[{"q":"神経系を構成する最小単位で、基本的に細胞体・樹状突起・軸索から構成されるもの。 この内容に最も当てはまる用語はどれか。","options":["神経細胞（ニューロン）","細胞体","樹状突起","軸索"],"answer":"神経細胞（ニューロン）","exp":"神経系を構成する最小単位で、基本的に細胞体・樹状突起・軸索から構成されるもの。","topic":"神経基礎","id":"nmc_4e510e9c7cb9"},{"q":"ほかの神経細胞からの情報を受け取るアンテナの役割を担う部分。 この内容に最も当てはまる用語はどれか。","options":["樹状突起","細胞体","軸索","シナプス"],"answer":"樹状突起","exp":"ほかの神経細胞からの情報を受け取るアンテナの役割を担う部分。","topic":"神経基礎","id":"nmc_48d6e8897339"},{"q":"神経終末で細かく枝分かれし、ほかの神経細胞へ情報を伝える部分。 この内容に最も当てはまる用語はどれか。","options":["軸索","樹状突起","細胞体","シナプス"],"answer":"軸索","exp":"神経終末で細かく枝分かれし、ほかの神経細胞へ情報を伝える部分。","topic":"神経基礎","id":"nmc_5deb301ee5a8"},{"q":"神経細胞どうしが接続する部分で、神経伝達物質によって情報が伝えられる部位。 この内容に最も当てはまる用語はどれか。","options":["シナプス","樹状突起","軸索","ランビエの絞輪"],"answer":"シナプス","exp":"神経細胞どうしが接続する部分で、資料では神経伝達物質によって情報が伝えられるとされる部位。","topic":"神経基礎","id":"nmc_e7930db1e604"},{"q":"髄鞘と髄鞘の切れ目で、電気抵抗が低く、電気信号が飛び飛びに伝わる際の要所となる部位。 この内容に最も当てはまる用語はどれか。","options":["ランビエの絞輪","髄鞘（ミエリン鞘）","シナプス","軸索"],"answer":"ランビエの絞輪","exp":"髄鞘と髄鞘の切れ目で、電気抵抗が低く、電気信号が飛び飛びに伝わる際の要所となる部位。","topic":"神経基礎","id":"nmc_3c5b4697b9ff"},{"q":"神経細胞が刺激を受けていない安静時にみられる膜電位。 この内容に最も当てはまる用語はどれか。","options":["静止電位","活動電位","脱分極","過分極"],"answer":"静止電位","exp":"神経細胞が刺激を受けていない安静時にみられる膜電位。","topic":"神経基礎","id":"nmc_3691f48fb955"},{"q":"細胞膜の内側が外側よりマイナスになっている状態。 この内容に最も当てはまる用語はどれか。","options":["分極","脱分極","再分極","過分極"],"answer":"分極","exp":"細胞膜の内側が外側よりマイナスになっている状態。","topic":"神経基礎","id":"nmc_64dddb465842"},{"q":"神経細胞が刺激を受けて興奮した際に生じる急激な膜電位の変化。 この内容に最も当てはまる用語はどれか。","options":["活動電位","静止電位","脱分極","再分極"],"answer":"活動電位","exp":"神経細胞が刺激を受けて興奮した際に生じる急激な膜電位の変化。","topic":"神経基礎","id":"nmc_a8ca58e98801"},{"q":"刺激で閾値を超えた後、Na⁺が細胞内へ流入して膜内側の電位が急激に上昇する過程。 この内容に最も当てはまる用語はどれか。","options":["脱分極","再分極","過分極","分極"],"answer":"脱分極","exp":"刺激で閾値を超えた後、Na⁺が細胞内へ流入して膜内側の電位が急激に上昇する過程。","topic":"神経基礎","id":"nmc_7bf8d8f0c066"},{"q":"脱分極に続き、K⁺が細胞外へ流出することで膜電位が元の方向へ戻る過程。 この内容に最も当てはまる用語はどれか。","options":["再分極","脱分極","過分極","分極"],"answer":"再分極","exp":"脱分極に続き、K⁺が細胞外へ流出することで膜電位が元の方向へ戻る過程。","topic":"神経基礎","id":"nmc_d3d2a3418c35"},{"q":"再分極後、一時的に静止電位よりさらに低い膜電位となる状態。 この内容に最も当てはまる用語はどれか。","options":["過分極","分極","脱分極","再分極"],"answer":"過分極","exp":"再分極後、一時的に静止電位よりさらに低い膜電位となる状態。","topic":"神経基礎","id":"nmc_5aa3357a3a9c"},{"q":"一度神経インパルスが生じた部位で、しばらく再び活動電位を起こせなくなる期間。 この内容に最も当てはまる用語はどれか。","options":["不応期","静止電位","活動電位","過分極"],"answer":"不応期","exp":"一度神経インパルスが生じた部位で、しばらく再び活動電位を起こせなくなる期間。","topic":"神経基礎","id":"nmc_1d53b3af0a9d"},{"q":"髄鞘で覆われた部分ではインパルスを生じず、次の絞輪部で再び神経インパルスを生じる伝導様式。 この内容に最も当てはまる用語はどれか。","options":["跳躍伝導","神経インパルスの伝導","脱分極","再分極"],"answer":"跳躍伝導","exp":"髄鞘で覆われた部分ではインパルスを生じず、次の絞輪部で再び神経インパルスを生じる伝導様式。","topic":"神経基礎","id":"nmc_6dd35e6f7762"},{"q":"ニューロン間のシナプス伝達効率が長期間にわたって増強される現象。 この内容に最も当てはまる用語はどれか。","options":["長期増強（LTP）","跳躍伝導","活動電位","不応期"],"answer":"長期増強（LTP）","exp":"ニューロン間のシナプス伝達効率が長期間にわたって増強される現象。","topic":"神経基礎","id":"nmc_ebbb41146e8d"},{"q":"前頭葉と視床を結ぶ神経線維を切断する脳外科手術。1930年代にモーニッツが考案した。 この内容に最も当てはまる用語はどれか。","options":["ロボトミー","神経細胞（ニューロン）","樹状突起","軸索"],"answer":"ロボトミー","exp":"前頭葉と視床を結ぶ神経線維を切断する脳外科手術。資料では1930年代にモーニッツが考案したとされる。","topic":"神経基礎","id":"nmc_ca5098202204"},{"q":"大脳半球の言語野の損傷によって、発話・理解・呼称・復唱などの言語活動が困難となる状態。 この内容に最も当てはまる用語はどれか。","options":["失語","ジャルゴン","錯誤性ジャルゴン","新造語性ジャルゴン"],"answer":"失語","exp":"大脳半球の言語野の損傷によって、発話・理解・呼称・復唱などの言語活動が困難となる状態。","topic":"言語","id":"nmc_8efc51cf4951"},{"q":"大脳レベルの障害により、個々の言語音やその連なりを発することが不可能または不正確になる状態。 この内容に最も当てはまる用語はどれか。","options":["発語失行","再帰性発話","無意味再帰性発話","実在語再帰性発話"],"answer":"発語失行","exp":"大脳レベルの障害により、個々の言語音やその連なりを発することが不可能または不正確になる状態。","topic":"言語","id":"nmc_3ad14546c31e"},{"q":"言いたい語が出てこず、指示代名詞や迂遠な表現が増える症状。 この内容に最も当てはまる用語はどれか。","options":["喚語困難","流暢な発話","語音認知障害","語音弁別障害"],"answer":"喚語困難","exp":"言いたい語が出てこず、指示代名詞や迂遠な表現が増える症状。","topic":"言語","id":"nmc_08d27d755111"},{"q":"「ボタン」を「ボハン」のように、発話する音を誤る錯誤。 この内容に最も当てはまる用語はどれか。","options":["音韻性錯語","語性錯語","新造語","喚語困難"],"answer":"音韻性錯語","exp":"「ボタン」を「ボハン」のように、発話する音を誤る錯誤。","topic":"言語","id":"nmc_f15652cf17f5"},{"q":"「時計」を「メガネ」のように、別の実在語に誤って言う錯誤。 この内容に最も当てはまる用語はどれか。","options":["語性錯語","音韻性錯語","新造語","喚語困難"],"answer":"語性錯語","exp":"「時計」を「メガネ」のように、別の実在語に誤って言う錯誤。","topic":"言語","id":"nmc_2e140ef29a12"},{"q":"実在する語とは捉えられない、語のような音の組み合わせを発するもの。 この内容に最も当てはまる用語はどれか。","options":["新造語","音韻性錯語","語性錯語","電文体"],"answer":"新造語","exp":"実在する語とは捉えられない、語のような音の組み合わせを発するもの。","topic":"言語","id":"nmc_8e28da11ad57"},{"q":"「木ある」のように、名詞と動詞などの組み合わせだけで他の文法要素を欠く発話。 この内容に最も当てはまる用語はどれか。","options":["電文体","空疎な発話","ジャルゴン","錯誤性ジャルゴン"],"answer":"電文体","exp":"「木ある」のように、名詞と動詞などの組み合わせだけで他の文法要素を欠く発話。","topic":"言語","id":"nmc_d1dce2fbe772"},{"q":"発話量の割に内容がほとんどない発話。 この内容に最も当てはまる用語はどれか。","options":["空疎な発話","電文体","ジャルゴン","再帰性発話"],"answer":"空疎な発話","exp":"発話量の割に内容がほとんどない発話。","topic":"言語","id":"nmc_34b5754009df"},{"q":"論旨の筋道より低いレベルで意味を理解できない発話。 この内容に最も当てはまる用語はどれか。","options":["ジャルゴン","空疎な発話","電文体","再帰性発話"],"answer":"ジャルゴン","exp":"論旨の筋道より低いレベルで意味を理解できない発話。","topic":"言語","id":"nmc_572bbe1d8a74"},{"q":"語性錯語が頻発して意味不明となる発話。 この内容に最も当てはまる用語はどれか。","options":["錯誤性ジャルゴン","新造語性ジャルゴン","空疎な発話","再帰性発話"],"answer":"錯誤性ジャルゴン","exp":"語性錯語が頻発して意味不明となる発話。","topic":"言語","id":"nmc_80850c2b204c"},{"q":"意味不明の非実在語である新造語が頻発する発話。 この内容に最も当てはまる用語はどれか。","options":["新造語性ジャルゴン","錯誤性ジャルゴン","空疎な発話","再帰性発話"],"answer":"新造語性ジャルゴン","exp":"意味不明の非実在語である新造語が頻発する発話。","topic":"言語","id":"nmc_e37c42c78b12"},{"q":"ごく限られた語または音節が、意味表出と関係なく繰り返し発せられる発話。 この内容に最も当てはまる用語はどれか。","options":["再帰性発話","喚語困難","音韻性錯語","語性錯語"],"answer":"再帰性発話","exp":"ごく限られた語または音節が、意味表出と関係なく繰り返し発せられる発話。","topic":"言語","id":"nmc_4de376e88184"},{"q":"意味をもたない音節が繰り返されるタイプの発話。 この内容に最も当てはまる用語はどれか。","options":["無意味再帰性発話","新造語","電文体","空疎な発話"],"answer":"無意味再帰性発話","exp":"意味をもたない音節が繰り返されるタイプの発話。","topic":"言語","id":"nmc_c80477fcc35d"},{"q":"意味の取れる単語を繰り返すタイプの発話。 この内容に最も当てはまる用語はどれか。","options":["実在語再帰性発話","ジャルゴン","錯誤性ジャルゴン","新造語性ジャルゴン"],"answer":"実在語再帰性発話","exp":"意味の取れる単語を繰り返すタイプの発話。","topic":"言語","id":"nmc_960504bb666d"},{"q":"普通の長さの文を滑らかに滞りなく、適切な抑揚をもって話すこと。 この内容に最も当てはまる用語はどれか。","options":["流暢な発話","再帰性発話","無意味再帰性発話","実在語再帰性発話"],"answer":"流暢な発話","exp":"普通の長さの文を滑らかに滞りなく、適切な抑揚をもって話すこと。","topic":"言語","id":"nmc_db38efab23c1"},{"q":"一つ一つの音、あるいは連続する音を正しく聞き取れない症状。 この内容に最も当てはまる用語はどれか。","options":["語音認知障害","語音弁別障害","語の理解障害","復唱障害"],"answer":"語音認知障害","exp":"一つ一つの音、あるいは連続する音を正しく聞き取れない症状。","topic":"言語","id":"nmc_db4b1fbf543d"},{"q":"どの音かの区別、または同じ音か違う音かの識別に着目したときの呼び方。 この内容に最も当てはまる用語はどれか。","options":["語音弁別障害","語音認知障害","語の理解障害","復唱障害"],"answer":"語音弁別障害","exp":"どの音かの区別、または同じ音か違う音かの識別に着目したときの呼び方。","topic":"言語","id":"nmc_d47910ccaede"},{"q":"文の構造や語順、時間の経過に伴う指示内容を正確に把握することが困難な状態。 この内容に最も当てはまる用語はどれか。","options":["継時的・文法的理解障害","発語失行","喚語困難","音韻性錯語"],"answer":"継時的・文法的理解障害","exp":"文の構造や語順、時間の経過に伴う指示内容を正確に把握することが困難な状態。","topic":"言語","id":"nmc_108fdc5987fa"},{"q":"物品や絵を見て、その名前を答えることが困難な状態。 この内容に最も当てはまる用語はどれか。","options":["呼称障害","復唱障害","喚語困難","語の理解障害"],"a ことで再分極が生じる。","topic":"神経基礎","id":"nmc_c78cd894d38f"},{"q":"神経インパルスが基本的に細胞体側へ逆戻りせず、軸索末端方向へ伝わる理由として適切なものはどれか。","options":["一度興奮した部位に不応期が生じるため","軸索の直径が末端ほど太くなるため","樹状突起だけがNa⁺を通すため","シナプスが電気信号を増幅するため"],"answer":"一度興奮した部位に不応期が生じるため","exp":"不応期によって直前に活動電位が生じた部位は再興奮しにくくなり、一方向性が保たれる。","topic":"神経基礎","id":"nmc_0a17b16fb6b4"},{"q":"有髄線維の髄鞘で覆われた部分について正しい説明はどれか。","options":["膜が絶縁され、その部分ではインパルスが生じない","そこでのみ神経伝達物質が放出される","そこで活動電位が最大振幅になる","無髄線維より電気抵抗が低い"],"answer":"膜が絶縁され、その部分ではインパルスが生じない","exp":"髄鞘部は絶縁され、次のランビエの絞輪で再び神経インパルスが生じる。","topic":"神経基礎","id":"nmc_bfdaa4aba467"},{"q":"LTPについて正しい組合せはどれか。","options":["1973年―ウサギの海馬","1930年代―ウサギの視床","1973年―ヒトの前頭葉","1950年代―ネコの小脳"],"answer":"1973年―ウサギの海馬","exp":"資料ではLTPは1973年にウサギの海馬で発見されたとされる。","topic":"神経基礎","id":"nmc_a895ddf22434"},{"q":"LTPを生じさせる実験操作として適切なものはどれか。","options":["シナプス前ニューロンへの高頻度刺激","シナプス後ニューロンへの長時間抑制","髄鞘の切断","神経伝達物質の完全遮断"],"answer":"シナプス前ニューロンへの高頻度刺激","exp":"シナプス前ニューロンへの高頻度刺激で、シナプス後ニューロンの応答が持続的に増大する。","topic":"神経基礎","id":"nmc_f1a224255ec2"},{"q":"ロボトミーの事例が示したものとして最も適切なものはどれか。","options":["前頭葉が精神生活に重要な働きをもつこと","視床が言語理解だけを担うこと","海馬が運動調整の中心であること","後頭葉が人格形成を単独で担うこと"],"answer":"前頭葉が精神生活に重要な働きをもつこと","exp":"術後の感情・意欲低下や人格変化から、前頭葉の精神生活への重要性が示された。","topic":"神経基礎","id":"nmc_e8efc6e5acc7"},{"q":"分割脳患者で右視野に提示された語について、正しいものはどれか。","options":["左半球で処理され、音読や書字が可能である","右半球で処理され、言語化できない","右半球で処理され、左手だけで書字できる","左右両半球に同時投射されるため差はない"],"answer":"左半球で処理され、音読や書字が可能である","exp":"右視野の情報は左半球で処理され、左半球は言語機能に優れるため音読や書字が可能とされる。","topic":"半球機能差","id":"nmc_af57aa7d2bd3"},{"q":"分割脳患者で左手による図形模写やパズルが比較的正確であることは、どの機能差を示す例か。","options":["右半球の空間処理能力の高さ","左半球の音楽処理能力の高さ","右半球の発語機能の高さ","左半球の顔認知機能の高さ"],"answer":"右半球の空間処理能力の高さ","exp":"右半球は空間認識や図形処理に優れ、左手の運動を担う。","topic":"半球機能差","id":"nmc_b7490ce50278"},{"q":"失語で評価される言語の側面として4つの組合せとして正しいものはどれか。","options":["発話・理解・呼称・復唱","発話・記憶・注意・構成","理解・視覚・聴覚・運動","呼称・計算・模写・見当識"],"answer":"発話・理解・呼称・復唱","exp":"失語で障害される側面は発話・理解・呼称・復唱の4つに大別される。","topic":"言語","id":"nmc_4e70b525b834"},{"q":"発語失行の特徴に含まれないものはどれか。","options":["一定して同じ音だけに同じ歪みが生じる","発語開始が困難で途切れ途切れになる","構音の歪み方が一貫しない","プロソディが平坦または不自然になる"],"answer":"一定して同じ音だけに同じ歪みが生じる","exp":"資料では構音の歪みは、どの音にどのような歪みが生じるか一貫しないことが特徴とされる。","topic":"言語","id":"nmc_ad0fc0a76e54"},{"q":"喚語困難の際にみられやすいとされる表現はどれか。","options":["指示代名詞や迂遠な表現","意味の取れる単語の反復","語性錯語が頻発する発話","名詞と動詞を中心とする電文体"],"answer":"指示代名詞や迂遠な表現","exp":"言いたい語が出ないため、「あれ」などの指示代名詞や遠回しな表現が増える。","topic":"言語","id":"nmc_3293eee144e0"},{"q":"「ボタン」を「ボハン」と発話した。どれに最も当てはまるか。","options":["音韻性錯語","語性錯語","新造語","電文体"],"answer":"音韻性錯語","exp":"語の音を誤る例として「ボタン→ボハン」が挙げられている。","topic":"言語","id":"nmc_d4eb74f7da86"},{"q":"「時計」を見て「メガネ」と答えた。どれに最も当てはまるか。","options":["語性錯語","音韻性錯語","再帰性発話","新造語性ジャルゴン"],"answer":"語性錯語","exp":"別の実在語へ置き換わる誤りは語性錯語である。","topic":"言語","id":"nmc_4574518c36ac"},{"q":"発話量は多いが内容がほとんどない状態を、何と呼ぶか。","options":["空疎な発話","電文体","流暢性","復唱障害"],"answer":"空疎な発話","exp":"発話量の割に内容がほとんどない発話を空疎な発話という。","topic":"言語","id":"nmc_b9b5b4dae0ff"},{"q":"新造語が頻発して意味不明となるジャルゴンはどれか。","options":["新造語性ジャルゴン","錯誤性ジャルゴン","実在語再帰性発話","電文体"],"answer":"新造語性ジャルゴン","exp":"非実在語である新造語が頻発するものを新造語性（無意味性）ジャルゴンという。","topic":"言語","id":"nmc_6e9d95d31f2a"},{"q":"復唱が可能である場合、何が成立していると考えられるか。","options":["語音認知","意味記憶","構成機能","身体所有感"],"answer":"語音認知","exp":"復唱できる場合は、少なくとも語音認知が成立していると考えられる。","topic":"言語","id":"nmc_f0da6795af13"},{"q":"「Aを指してからBを指す」のような課題で特に必要となる理解はどれか。","options":["動作の順序を含む継時的・文法的理解","単純な顔認知","意味記憶だけ","左右視野の統合だけ"],"answer":"動作の順序を含む継時的・文法的理解","exp":"語順や時間的順序を含む指示の理解が必要となる。","topic":"言語","id":"nmc_a457a25f535c"},{"q":"呼称検査で「言えるか」以外に重視される点として適切なのはどれか。","options":["どのように間違えるか","反応時間だけ","視力だけ","声量だけ"],"answer":"どのように間違えるか","exp":"対象認識から語彙検索・構音までのどこに問題があるかを、錯誤の仕方などから分析する。","topic":"言語","id":"nmc_f5c1cf92cbdc"},{"q":"伝導失語で特に著しい障害はどれか。","options":["復唱","日常会話の流暢性","単純な理解","視覚認知"],"answer":"復唱","exp":"伝導失語では理解や日常会話は比較的良好だが復唱が著しく障害される。","topic":"失語型","id":"nmc_2c8253f7b474"},{"q":"健忘失語について正しいものはどれか。","options":["理解・復唱・発話の流暢性は比較的保たれる","発話・理解・復唱・読み書きのすべてが重度に障害される","復唱のみが著しく障害される","発話は非流暢で理解はほぼ不能となる"],"answer":"理解・復唱・発話の流暢性は比較的保たれる","exp":"健忘失語の中心は語想起困難で、その他の言語機能は比較的保たれる。","topic":"失語型","id":"nmc_f267998acff6"},{"q":"純粋失読の特徴として最も適切なものはどれか。","options":["書字は比較的保たれるが、読みが著しく障害される","読みは保たれるが両手の書字のみ障害される","読み書きとも同程度に障害される","言語症状は一切伴わないことが必須である"],"answer":"書字は比較的保たれるが、読みが著しく障害される","exp":"純粋失読では書字能力が良好に保たれる一方、音読・理解の読みが障害される。","topic":"読み書き","id":"nmc_2e13ad884f3d"},{"q":"右利きの人における一般的な失行について、正しいものはどれか。","options":["左半球損傷で生じ、左右両上肢に症状がみられることがある","右半球損傷で生じ、右上肢だけに限局する","小脳損傷でのみ生じる","末梢神経障害が必須である"],"answer":"左半球損傷で生じ、左右両上肢に症状がみられることがある","exp":"資料では右利きでは一般に左半球損傷で生じ、左右両上肢に症状がみられるとされる。","topic":"失行","id":"nmc_dbcb77747c30"},{"q":"日常では自然にできるが、「敬礼をしてください」と指示されるとうまくできない。最も合う障害はどれか。","options":["観念運動失行","観念失行","肢節運動失行","構成障害"],"answer":"観念運動失行","exp":"目的は理解していても、意識的な動作表出が困難なのが観念運動失行である。","topic":"失行","id":"nmc_559dda5152f1"},{"q":"歯ブラシが何のための道具かという知識自体が障害され、使い方が不適切になる。最も合うのはどれか。","options":["概念失行","観念運動失行","着衣失行","肢節運動失行"],"answer":"概念失行","exp":"道具の用途や行為の意味に関する概念的知識の障害が中心となる。","topic":"失行","id":"nmc_9309e6b1c550"},{"q":"「口を開けてください」という指示では開口できないが、あくびでは開口できる。最も合うのはどれか。","options":["口腔顔面失行","発語失行","構成障害","半側身体失認"],"answer":"口腔顔面失行","exp":"意図的動作は障害されるが、自動的・反射的運動は保たれる。","topic":"失行","id":"nmc_9f0a01c028de"},{"q":"歯磨きで歯ブラシに歯磨き粉をつけないなど、一連の手順が組み立てられない。最も合うのはどれか。","options":["観念失行","概念失行","肢節運動失行","把握反射"],"answer":"観念失行","exp":"「何をどの順番で行うか」という系列化や行為計画の障害が中心である。","topic":"失行","id":"nmc_8dcab9bf313b"},{"q":"着衣失行で多いとされる病巣はどれか。","options":["右頭頂葉","左後頭葉","両側海馬","小脳虫部"],"answer":"右頭頂葉","exp":"資料では右頭頂葉を中心とする病巣で起こることが多い。","topic":"失行","id":"nmc_d5065dca2802"},{"q":"肢節運動失行について正しいものはどれか。","options":["中心前回・後回の病巣で、対側に症状が出ることが多い","前頭極のみの病巣で同側に出る","視床だけの病巣で両側に出る","海馬病巣で手指だけに出る"],"answer":"中心前回・後回の病巣で、対側に症状が出ることが多い","exp":"資料では中心前回・後回を病巣とし、対側症状が多いとされる。","topic":"失行","id":"nmc_1ddb5681b36f"},{"q":"成人で把握反射が出現した場合に示唆される病変として適切なものはどれか。","options":["反対側の前頭葉損傷","同側の後頭葉損傷","両側の海馬損傷","小脳損傷"],"answer":"反対側の前頭葉損傷","exp":"特に補足運動野や帯状回前部の障害で現れやすいとされる。","topic":"前頭葉症状","id":"nmc_27a9141747a4"},{"q":"本能性把握反射に最も近い行動はどれか。","options":["手掌周辺の刺激に手が吸い寄せられるように動いて掴む","触れた物を一度握ると意志に反して離せない","相手の発話を無意識に繰り返す","片側の空間を探索しない"],"answer":"手掌周辺の刺激に手が吸い寄せられるように動いて掴む","exp":"把握反射は「握って離せない」、本能性把握反射は刺激へ探索的に手が向かい掴む点が異なる。","topic":"前頭葉症状","id":"nmc_8031449d90f5"},{"q":"脳梁タイプのエイリアン・ハンドで特徴的な症状はどれか。","options":["拮抗失行","道具の強迫的使用","視覚性失認","語音認知障害"],"answer":"拮抗失行","exp":"脳梁タイプでは左右の手が相反する動きをする拮抗失行が特徴とされる。","topic":"前頭葉症状","id":"nmc_4298f9da1a06"},{"q":"前頭葉タイプのエイリアン・ハンドで特徴的な症状はどれか。","options":["道具の強迫的使用","拮抗失行のみ","相貌失認","失読失書"],"answer":"道具の強迫的使用","exp":"前頭葉タイプでは目の前の道具を勝手に使う道具の強迫的使用が特徴とされる。","topic":"前頭葉症状","id":"nmc_b2e1cc3caf7f"},{"q":"後部エイリアン・ハンド症候群について正しいものはどれか。","options":["麻痺がないのに非所属感と意図しない手の運動がみられる","必ず重度片麻痺を伴う","道具への強迫だけが主症状である","視覚性失認が必須である"],"answer":"麻痺がないのに非所属感と意図しない手の運動がみられる","exp":"後部型では運動能力が保たれているにもかかわらず、身体意識の障害と勝手な運動がみられる。","topic":"前頭葉症状","id":"nmc_d182b719622a"},{"q":"ボタンを留めようとする片手に対して、もう一方の手が外してしまう。最も合うのはどれか。","options":["拮抗失行","使用行動","模倣行動","本能性把握反射"],"answer":"拮抗失行","exp":"一方の手の意図した行為に、もう一方の手が反対する動きをする現象である。","topic":"前頭葉症状","id":"nmc_2c4192fea926"},{"q":"一般に右手にみられやすいのはどれか。","options":["道具の強迫的使用","半側空間無視","相貌失認","着衣失行"],"answer":"道具の強迫的使用","exp":"道具の強迫的使用は一般的に右手にみられると記載される。","topic":"前頭葉症状","id":"nmc_eadb0c064065"},{"q":"使用行動と模倣行動について正しいものはどれか。","options":["両者は併発することが多く、使用行動の方がより重症と考えられる","両者は互いに排他的である","模倣行動の方が必ず重症である","どちらも後頭葉の視覚連合野障害だけで生じる"],"answer":"両者は併発することが多く、使用行動の方がより重症と考えられる","exp":"資料では両者は併発しやすく、使用行動がより重症とされる。","topic":"前頭葉症状","id":"nmc_470d4e9571bd"},{"q":"半側空間無視について正しいものはどれか。","options":["多くは右半球損傷で左側無視として現れる","視野障害そのものである","多くは左半球損傷で右側無視のみが生じる","頭部や眼球を動かしても決して見えない"],"answer":"多くは右半球損傷で左側無視として現れる","exp":"半側空間無視は視野障害ではなく注意障害で、多くは右半球損傷後の左側無視である。","topic":"認知・身体","id":"nmc_d2b4ee5f7855"},{"q":"食事で皿の右半分だけを食べ、左半分を残す行動が最も示唆するものはどれか。","options":["半側空間無視","相貌失認","意味記憶障害","復唱障害"],"answer":"半側空間無視","exp":"病巣と反対側の空間を探索しない具体例として挙げられている。","topic":"認知・身体","id":"nmc_3184165357b0"},{"q":"視覚性失認について正しいものはどれか。","options":["触覚など別の感覚を使うと対象を認知できることがある","視力障害が必須である","顔だけが認識できなくなる障害に限られる","主病巣は前頭極のみである"],"answer":"触覚など別の感覚を使うと対象を認知できることがある","exp":"視覚では対象同定が困難でも、触覚など他の感覚では認知できることが特徴である。","topic":"認知・身体","id":"nmc_75e5cf7c817f"},{"q":"視覚性失認の主な病巣としてのはどれか。","options":["後頭葉から側頭葉にかけての視覚連合野","右半球の後頭側頭葉腹側部","前頭葉内側面","海馬・脳弓・乳頭体・視床前核"],"answer":"後頭葉から側頭葉にかけての視覚連合野","exp":"視覚連合野の障害が主に関係するとされる。","topic":"認知・身体","id":"nmc_599cb0992343"},{"q":"相貌失認について、保たれやすいものはどれか。","options":["声を手がかりに人物を同定すること","熟知した人物の顔だけで誰かを同定すること","発症後に出会った人の顔を容易に記憶すること","顔の認識そのものが不可能であること"],"answer":"声を手がかりに人物を同定すること","exp":"顔では同定できなくても、声や氏名・職業などの知識は保持されることがある。","topic":"認知・身体","id":"nmc_fd185b46ca23"},{"q":"相貌失認の主な病巣としてのはどれか。","options":["右半球の後頭側頭葉腹側部、とくに紡錘状回付近","後頭葉から側頭葉にかけての視覚連合野","前頭葉内側面","海馬・脳弓・乳頭体・視床前核"],"answer":"右半球の後頭側頭葉腹側部、とくに紡錘状回付近","exp":"資料では右後頭側頭葉腹側部、特に紡錘状回付近が主病巣とされる。","topic":"認知・身体","id":"nmc_d554d5cc9fc8"},{"q":"見慣れた建物や風景がどこか分からないが、道順を言葉で説明したり地図を描いたりできる。最も合うのはどれか。","options":["街並み失認","道順障害","半側空間無視","相貌失認"],"answer":"街並み失認","exp":"街並み失認では景観認知が障害される一方、道順の言語説明や地図描画は比較的保たれる。","topic":"認知・身体","id":"nmc_f17cf7822715"},{"q":"建物や風景は認識できるが、それらを手がかりに進む方向を決めにくい。最も合うのはどれか。","options":["道順障害","街並み失認","視覚性失認","構成障害"],"answer":"道順障害","exp":"道順障害ではランドマーク認知は可能だが、位置関係や進行方向の判断が難しい。","topic":"認知・身体","id":"nmc_c6bc24a6f88e"},{"q":"片麻痺に対する病態失認で特に多いとされる組合せはどれか。","options":["右半球の脳血管障害―左片麻痺","左半球の脳血管障害―左片麻痺","右半球の脳血管障害―右片麻痺","小脳障害―両下肢麻痺"],"answer":"右半球の脳血管障害―左片麻痺","exp":"資料では主に右半球損傷に伴う左片麻痺でみられる。","topic":"認知・身体","id":"nmc_8023a35232a3"},{"q":"「この手は自分の手ではなく、医師の手だ」と麻痺側上肢について主張する。最も合うのはどれか。","options":["身体パラフレニア","半側身体失認","半側空間無視","後部エイリアン・ハンド症候群"],"answer":"身体パラフレニア","exp":"麻痺肢を他人のものと感じる積極的な妄想性誤認が身体パラフレニアである。","topic":"認知・身体","id":"nmc_1ddf8c741bc8"},{"q":"半側身体失認と身体パラフレニアの違いとして適切なのはどれか。","options":["前者は身体への関心低下が中心で、後者は他人のものだと積極的に誤認する","前者は必ず幻視を伴い、後者は伴わない","前者は左半球だけ、後者は右半球だけで起こる","両者に違いはない"],"answer":"前者は身体への関心低下が中心で、後者は他人のものだと積極的に誤認する","exp":"半側身体失認では存在への関心低下、身体パラフレニアでは他人の手だという妄想性誤認が目立つ。","topic":"認知・身体","id":"nmc_5fd345af0da1"},{"q":"ストループ課題で主に評価される注意機能はどれか。","options":["実行注意","アラーティング","注意の分配機能","注意の定位だけ"],"answer":"実行注意","exp":"競合反応を抑制しながら行動を制御する実行注意はストループ課題などで評価される。","topic":"注意","id":"nmc_3f83189e6f0e"},{"q":"複数の課題を同時に処理する機能はどれか。","options":["注意の分配機能","注意の定位","アラーティング","実行注意"],"answer":"注意の分配機能","exp":"資料では注意の分配機能を複数課題の同時処理と説明する。","topic":"注意","id":"nmc_1a24e2d2e890"},{"q":"エピソード記憶とはどのような記憶か。","options":["時間的・空間的文脈に位置づけられる個人的出来事の記憶","語の意味だけの知識","数秒だけ保持する音の記憶","運動技能だけの記憶"],"answer":"時間的・空間的文脈に位置づけられる個人的出来事の記憶","exp":"エピソード記憶は個人的出来事を時間・空間の文脈とともに保持する記憶である。","topic":"記憶・遂行","id":"nmc_48bb97144144"},{"q":"前向性健忘で比較的良好とされるものはどれか。","options":["再認","遅延再生","新規学習全般","数分後の自由再生"],"answer":"再認","exp":"資料では前向性健忘において再認は比較的良好とされる。","topic":"記憶・遂行","id":"nmc_0560ff5c549f"},{"q":"逆向性健忘の特徴として正しいものはどれか。","options":["古い情報より新しい情報の障害が強いことが少なくない","必ず発症後の情報だけが失われる","意味記憶だけが障害される","再認は必ず完全に保たれる"],"answer":"古い情報より新しい情報の障害が強いことが少なくない","exp":"発症以前の情報でも、比較的新しいものの方が障害されやすいことがあるとされる。","topic":"記憶・遂行","id":"nmc_393be3564b05"},{"q":"意味記憶障害と通常の健忘失語の違いとして適切なのはどれか。","options":["意味記憶障害では正しい名称を示されても分からないことがある","健忘失語では正しい名称を聞いても必ず理解できない","意味記憶障害は一つの感覚モダリティに限局する","両者は完全に同一である"],"answer":"意味記憶障害では正しい名称を示されても分からないことがある","exp":"意味記憶障害では知識自体が損なわれるため、正しい名称を与えられても理解できない場合がある。","topic":"記憶・遂行","id":"nmc_ebc348ce6c15"},{"q":"作話について正しいものはどれか。","options":["本人には嘘をつく意図がなく、内容を真実だと信じている","意図的な虚偽が必須である","意識障害が必ず伴う","質問場面でのみ生じる"],"answer":"本人には嘘をつく意図がなく、内容を真実だと信じている","exp":"作話は意識的な嘘ではなく、本人は誤った記憶内容を真実と信じている。","topic":"記憶・遂行","id":"nmc_6be178ab8759"},{"q":"「会社の会議がある」と自発的に話し、実際に出かけようとする。どれに最も合うか。","options":["自発性作話","誘発性作話","意味記憶障害","再帰性発話"],"answer":"自発性作話","exp":"他者の働きかけなしに生じ、内容に沿って行動することがあるのが自発性作話である。","topic":"記憶・遂行","id":"nmc_5d56a5ea11d3"},{"q":"遂行機能に関与する神経回路として適切なものはどれか。","options":["前頭葉を中心に、基底核や視床も含む広い回路","前頭葉・頭頂葉・帯状回・視床の注意ネットワーク","海馬・脳弓・乳頭体・視床前核","後頭葉から側頭葉にかけての視覚連合野"],"answer":"前頭葉を中心に、基底核や視床も含む広い回路","exp":"遂行機能は前頭葉だけでなく基底核・視床など皮質下構造を含む広い回路が関与する。","topic":"記憶・遂行","id":"nmc_5e91d5df641d"},{"q":"「一定の条件に従って言葉や情報をできるだけ多く素早く産出する」能力はどれか。","options":["流暢性","意思決定","認知機能の柔軟性","選択的注意"],"answer":"流暢性","exp":"語流暢性課題などで評価される能力として説明される。","topic":"記憶・遂行","id":"nmc_74b1532be6a3"},{"q":"軽度認知障害の有病率について示される範囲はどれか。","options":["65歳以上で15～25％","65歳以上で1～2％","40歳以上で50～60％","全年齢で80～90％"],"answer":"65歳以上で15～25％","exp":"資料では65歳以上の高齢者で15～25％とされる。","topic":"認知症","id":"nmc_0129ad69d1db"},{"q":"軽度認知障害の1年間の罹患率として示されるのはどれか。","options":["1000人のうち20～50人程度","1000人のうち1～2人程度","1000人のうち200～500人程度","100人のうち90人程度"],"answer":"1000人のうち20～50人程度","exp":"資料に記載された年間罹患率である。","topic":"認知症","id":"nmc_9399bbe27bf8"},{"q":"アルツハイマー型認知症の初期症状として適切なものはどれか。","options":["前向性健忘","拮抗失行","道具の強迫的使用","語音認知障害のみ"],"answer":"前向性健忘","exp":"初期には前向性健忘がみられ、次第に時の見当識障害が目立つとされる。","topic":"認知症","id":"nmc_a1ab8238c75a"},{"q":"アルツハイマー型認知症がさらに進行したときにみられるとされるものはどれか。","options":["更衣・清拭・トイレ動作など日常生活動作の障害","時の見当識障害だけが残り日常生活動作は保たれる","道具的活動の障害が消失し注意容量が増える","前向性健忘が消失して新規学習が改善する"],"answer":"更衣・清拭・トイレ動作など日常生活動作の障害","exp":"進行すると道具的活動だけでなく基本的ADLの障害も明らかになる。","topic":"認知症","id":"nmc_c6fd544da148"},{"q":"前頭側頭型認知症の分類として示される組合せはどれか。","options":["行動型前頭側頭型認知症と原発性進行性失語","アルツハイマー型と血管性","全失語と伝導失語","前向性健忘と逆向性健忘"],"answer":"行動型前頭側頭型認知症と原発性進行性失語","exp":"行動変化が前景の行動型と、言語症状が前景の原発性進行性失語に分けられる。","topic":"認知症","id":"nmc_46c171702ae8"},{"q":"行動型前頭側頭型認知症について正しいものはどれか。","options":["初期から病識が乏しいことが特徴である","初期から病識が非常に良好である","幻視だけが主症状である","段階的進行が必須である"],"answer":"初期から病識が乏しいことが特徴である","exp":"資料では初期から病識が欠如・乏しいことが特徴とされる。","topic":"認知症","id":"nmc_1ead13c092ec"},{"q":"脳血管障害が起こるたびに段階的に進行するとされる認知症はどれか。","options":["血管性認知症","アルツハイマー型認知症","レビー小体型認知症","前頭側頭型認知症"],"answer":"血管性認知症","exp":"血管性認知症は脳血管障害の発生に伴って段階的に進行するとされる。","topic":"認知症","id":"nmc_3ad1488a3e37"},{"q":"レビー小体型認知症の特徴として挙げられていないものはどれか。","options":["復唱だけの選択的障害","認知機能の変動","繰り返し出現する幻視","パーキンソン症状"],"answer":"復唱だけの選択的障害","exp":"資料では認知機能の変動、幻視、パーキンソン症状が特徴として挙げられる。","topic":"認知症","id":"nmc_3ba5eabbf3ed"},{"q":"レビー小体型認知症の幻視について正しいものはどれか。","options":["人や子どもが見えることが多く、夜間に多い","必ず文字だけが見える","日中にのみ出現する","幻視は特徴ではない"],"answer":"人や子どもが見えることが多く、夜間に多い","exp":"資料では人や子どもの幻視が多く、夜間に出現しやすいとされる。","topic":"認知症","id":"nmc_546bb8bcb38c"},{"q":"活動電位が軸索に沿って隣接部位へ次々と生じ、興奮が伝わっていく現象を何というか。","options":["神経インパルスの伝導","跳躍伝導","長期増強","再分極"],"answer":"神経インパルスの伝導","exp":"活動電位が軸索に沿って次々と伝わっていく現象である。","topic":"神経基礎","id":"nmc_937c765f4e97"},{"q":"左右の大脳半球で、言語・計算・空間処理などの得意な機能が異なることを何というか。","options":["大脳半球機能差","遂行機能障害","注意の定位","構成障害"],"answer":"大脳半球機能差","exp":"資料では大脳半球機能差（大脳半球優位性）として説明されている。","topic":"半球機能差","id":"nmc_3f0a4b59eb92"},{"q":"発音における音または語の選択の誤りを総称して何というか。","options":["錯誤","喚語困難","再帰性発話","電文体"],"answer":"錯誤","exp":"錯誤には音韻性錯語・語性錯語・新造語が含まれる。","topic":"言語","id":"nmc_ad7236744108"},{"q":"一般的な語を聞き取れていると考えられるが、その意味が分からない状態を何というか。","options":["語の理解障害","語音認知障害","復唱障害","呼称障害"],"answer":"語の理解障害","exp":"資料では「語の理解障害」とされる。","topic":"言語","id":"nmc_dba5a2d48ae2"},{"q":"見渡せる範囲を超えて移動するときに道に迷う障害で、街並み失認と道順障害に分けられるものはどれか。","options":["地誌的（地理的）見当識障害","半側空間無視","視覚性失認","構成障害"],"answer":"地誌的（地理的）見当識障害","exp":"街並み失認と道順障害に分類される。","topic":"認知・身体","id":"nmc_d53f689bc884"},{"q":"時間的・空間的文脈の中に位置づけることのできる個人的な出来事の記憶を何というか。","options":["エピソード記憶","意味記憶","短期記憶","作話"],"answer":"エピソード記憶","exp":"資料の定義どおり。","topic":"記憶・遂行","id":"nmc_44e6c7670ed9"},{"q":"語の並べ方が文法に従っているか、その種類や複雑さに注目して評価する障害はどれか。","options":["文法障害","語音認知障害","呼称障害","復唱障害"],"answer":"文法障害","exp":"表出の文法的な構造の有無や複雑さに注目して評価する。","topic":"言語","id":"nmc_df4abfa4bd91"}];const STORAGE_KEY="quiz_shinkei_choice_v20260914b";
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．.、()（）\[\]【】「」『』:：;；/\\\-−―ー]/g,'')}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return {}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function rec(q){if(!state[q.id])state[q.id]={attempts:0,correct:0,wrong:0,last:null};return state[q.id]}
function fisher(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state=loadState(),filter='all',randomMode=false,order=QUESTIONS.map((_,i)=>i),idx=0,activeQi=null;
let session={answered:0,correct:0,wrong:0};
function matches(i){let r=rec(QUESTIONS[i]);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function listNow(){return order.filter(matches)}
function updateStats(){let done=0,wrong=0;QUESTIONS.forEach(q=>{let r=rec(q);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+QUESTIONS.length;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=listNow().length+'問表示'}
function setFilter(v){filter=v;idx=0;activeQi=null;resetView();render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;activeQi=null;resetView();document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;activeQi=null;resetView();render()}}
function selectActive(){let list=listNow();if(!list.length){activeQi=null;return null}if(idx>=list.length)idx=0;if(activeQi===null)activeQi=list[idx];return activeQi}
function move(d){let list=listNow();resetView();activeQi=null;if(!list.length){idx=0;render();return}idx=(idx+d+list.length)%list.length;render()}

let revealed=false,selected=null,displayOpts=[];
function resetView(){revealed=false;selected=null;displayOpts=[]}
function answer(opt){if(revealed||activeQi===null)return;let q=QUESTIONS[activeQi],r=rec(q);selected=opt;revealed=true;r.attempts++;session.answered++;if(opt===q.answer){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();render()}
function retry(){revealed=false;selected=null;if(activeQi!==null)displayOpts=fisher(QUESTIONS[activeQi].options);render()}
function render(){updateStats();let card=document.getElementById('card');let qi=selectActive();if(qi===null){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}let q=QUESTIONS[qi];if(!displayOpts.length)displayOpts=fisher(q.options);let ops=displayOpts.map(o=>{let cls='opt';if(revealed&&o===q.answer)cls+=' correct';else if(revealed&&o===selected&&o!==q.answer)cls+=' wrong';return `<button class="${cls}" onclick='answer(${JSON.stringify(o)})'>${o}</button>`}).join('');let fb='';if(revealed){let ok=selected===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><div class="answer">${ok?'○ 正解':'× 不正解'}　正解：${q.answer}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>`}let list=listNow();let pos=list.indexOf(qi);let label=pos>=0?`${pos+1} / ${list.length}`:'解答済み（現在のフィルタ対象外）';card.innerHTML=`<div class="qno">${label}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div><div class="options">${ops}</div>${fb}<div class="nav"><button onclick="move(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="move(1)">次へ →</button></div>`;updateStats()}
render();</script></body></html>
