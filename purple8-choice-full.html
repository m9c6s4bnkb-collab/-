した。 統制された実験室で、訓練された参加者に内観法を用いて意識を分析した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Ellis,A.（エリス）","1913年","Ebbinghaus,H.（エビングハウス）","Wundt,W.（ヴント）"],"correctIndex":3},{"id":"p8q0097","page":7,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n無意味綴りを用いて記憶を実験的に研究し、忘却曲線を明らかにした人物。","answer":"Ebbinghaus,H.（エビングハウス）","aliases":["Ebbinghaus,H.（エビングハウス）"],"term":"Ebbinghaus,H.（エビングハウス）","group":"person_history_learning","kind":"term","note":"無意味綴りを用いて記憶を実験的に研究し、忘却曲線を明らかにした人物。 自らを実験参加者として、無意味綴りを用いた再学習法による記憶実験を行った。 「心理学の過去は長いが歴史は短い」という言葉でも知られる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Ebbinghaus,H.（エビングハウス）","Watson,J.B.（ワトソン）","Seligman,M.E.P.（セリグマン）","Wertheimer,M.（ウェルトハイマー）"],"correctIndex":0},{"id":"p8q0100","page":8,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nパーソナリティの特性論を発展させ、特性を個人特性と共通特性に分けて考えた人物。","answer":"Allport,G.W.（オルポート）","aliases":["Allport,G.W.（オルポート）"],"term":"Allport,G.W.（オルポート）","group":"person_assessment","kind":"term","note":"パーソナリティの特性論を発展させ、特性を個人特性と共通特性に分けて考えた人物。 「特性」という言葉をはじめて用いた。 辞書から人の特性を表す語を抽出・整理し、心誌というプロフィール図も用いた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Lindemann,E.（リンデマン）","Allport,G.W.（オルポート）","Eysenck,H.J.（アイゼンク）","Erikson,E.H.（エリクソン）"],"correctIndex":1},{"id":"p8q0103","page":8,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n因子分析をパーソナリティ・知能研究に応用し、16因子や流動性知能・結晶性知能を示した人物。","answer":"Cattell,R.B.（キャッテル）","aliases":["Cattell,R.B.（キャッテル）"],"term":"Cattell,R.B.（キャッテル）","group":"person_assessment","kind":"term","note":"因子分析をパーソナリティ・知能研究に応用し、16因子や流動性知能・結晶性知能を示した人物。 因子分析を用いて性格特性や知能に関する研究を行い、理論に基づく性格検査16PFを開発した。 結晶性知能を経験や学習で獲得した知識・判断、流動性知能を新しい場面への適応に必要な情報処理・記憶能力として説明した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Kretschmer,E.（クレッチマー）","Eysenck,H.J.（アイゼンク）","Cattell,R.B.（キャッテル）","Lindemann,E.（リンデマン）"],"correctIndex":2},{"id":"p8q0106","page":8,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n一卵性双生児の階段のぼり実験などから、環境より成熟を重視 "Vygotsky,L.S.（ヴィゴツキー）","Harlow,H.F.（ハーロウ）","Havighurst,R.J.（ハヴィガースト）","Erikson,E.H.（エリクソン）"],"correctIndex":2},{"id":"p8q0118","page":9,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n子どもの認知発達を4段階に分け、シェマ・同化・調節などを用いて説明した人物。","answer":"Piaget,J.（ピアジェ）","aliases":["Piaget,J.（ピアジェ）"],"term":"Piaget,J.（ピアジェ）","group":"person_development","kind":"term","note":"子どもの認知発達を4段階に分け、シェマ・同化・調節などを用いて説明した人物。 子どもと環境との相互作用によってシェマが獲得されると考え、4つの発達段階を設定した。 乳幼児の有能性や領域固有性などの観点から批判も受けたが、発生的認識論として大きな影響を与えた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Bowlby,J.（ボウルビィ）","Kanner,L.（カナー）","Gesell,A.L.（ゲゼル）","Piaget,J.（ピアジェ）"],"correctIndex":3},{"id":"p8q0121","page":9,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nマターナル・ディプリベーションの研究などから、乳幼児と養育者の持続的で親密な関係を重視し愛着理論を提唱した人物。","answer":"Bowlby,J.（ボウルビィ）","aliases":["Bowlby,J.（ボウルビィ）"],"term":"Bowlby,J.（ボウルビィ）","group":"person_development","kind":"term","note":"マターナル・ディプリベーションの研究などから、乳幼児と養育者の持続的で親密な関係を重視し愛着理論を提唱した人物。 ホスピタリズム研究から、その原因をマターナル・ディプリベーションに求めた。 その後、精神医学にエソロジーの視点を取り入れた愛着理論を提唱した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Bowlby,J.（ボウルビィ）","Erikson,E.H.（エリクソン）","Harlow,H.F.（ハーロウ）","Gesell,A.L.（ゲゼル）"],"correctIndex":0},{"id":"p8q0124","page":9,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n人間の欲求を5つの階層として説明する欲求階層説を示し、人間性心理学を提唱した人物。","answer":"Maslow,A.H.（マズロー）","aliases":["Maslow,A.H.（マズロー）"],"term":"Maslow,A.H.（マズロー）","group":"person_humanistic_cbt","kind":"term","note":"人間の欲求を5つの階層として説明する欲求階層説を示し、人間性心理学を提唱した人物。 自己実現の研究から5つの階層からなる欲求階層説を提唱した。 当時影響力のあった精神分析と行動主義を批判し、それらに対抗する立場として人間性心理学を提唱した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["うつ病研究から認知のあり方が感情状態","Maslow,A.H.（マズロー）","Frankl,V.E.（フランクル）","Gendlin,E.T.（ジェンドリン）"],"correctIndex":1},{"id":"p8q0127","page":9,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n人間の行動を個人と環境の関数として捉える場理論を提唱し、集団力学へ発展させた人物。","answer":"Lewin,K.（レヴィン）","aliases":["Lewin,K.（レヴィン）"],"term":"Lewin,K.（レヴィン）","group":"person_social_family","kind":"term","note":"人間の行動を個人と環境の関数として捉える場理論を提唱し、集団力学へ発展させた人物。 ゲシュタルト心理学者の1人で、人間の行動は個人と環境の関数であるという場理論を提唱した。 生活空間・トポロジー・ベクトルなどを用い、その後グループ・ダイナミクスへ発展させた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Moreno,J.L.（モレノ）","Bateson,G.（ベイトソン）","Lewin,K.（レヴィン）","Selye,H.（セリエ）"],"correctIndex":2},{"id":"p8q0130","page":9,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n刺激と反応の結合を重視し、行動主義を提唱した人物。","answer":"Watson,J.B.（ワトソン）","aliases":["Watson,J.B.（ワトソン）"],"term":"Watson,J.B.（ワトソン）","group":"person_history_learning","kind":"term","note":"刺激と反応の結合を重視し、行動主義を提唱した人物。 1913年「行動主義者の見た心理学」で行動主義を提唱した。 アルバート坊やの実験などを行った一方、末梢的条件反射研究や極端な環境主義で批判も受けた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Ebbinghaus,H.（エビングハウス）","Seligman,M.E.P.（セリグマン）","Wertheimer,M.（ウェルトハイマー）","Watson,J.B.（ワトソン）"],"correctIndex":3},{"id":"p8q0133","page":10,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n学習理論を神経症治療へ応用する行動療法を提唱し、パーソナリティ検査MPI・EPQも開発した人物。","answer":"Eysenck,H.J.（アイゼンク）","aliases":["Eysenck,H.J.（アイゼンク）"],"term":"Eysenck,H.J.（アイゼンク）","group":"person_assessment","kind":"term","note":"学習理論を神経症治療へ応用する行動療法を提唱し、パーソナリティ検査MPI・EPQも開発した人物。 1960年『行動療法と神経症』によって行動療法を提唱したとされる。 神経症を不適切に学習された情動反応と捉え、自らのパーソナリティ理論に基づくMPIやEPQを開発した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Eysenck,H.J.（アイゼンク）","Kretschmer,E.（クレッチマー）","Lindemann,E.（リンデマン）","Axline,V.M.（アクスライン）"],"correctIndex":0},{"id":"p8q0136","page":10,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nRogersに師事し、児童中心療法として非指示的な遊戯療法を提唱した人物。","answer":"Axline,V.M.（アクスライン）","aliases":["Axline,V.M.（アクスライン）"],"term":"Axline,V.M.（アクスライン）","group":"person_humanistic_cbt","kind":"term","note":"Rogersに師事し、児童中心療法として非指示的な遊戯療法を提唱した人物。 遊戯療法におけるセラピストの基本的態度として8原則を提唱した。 温かく友好的な関係、子どものありのままの受容、感情の敏感な察知と伝え返しなどを重視した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["うつ病研究から認知のあり方が感情状態","Axline,V.M.（アクスライン）","Gendlin,E.T.（ジェンドリン）","Kalff,D.M.（カルフ）"],"correctIndex":1},{"id":"p8q0139","page":10,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nFreudと袂を分かって個人心理学を創始し、劣等感と「権力への意志」などを論じた人物。","answer":"Adler,A.（アドラー）","aliases":["Adler,A.（アドラー）"],"term":"Adler,A.（アドラー）","group":"person_psychoanalytic","kind":"term","note":"Freudと袂を分かって個人心理学を創始し、劣等感と「権力への意志」などを論じた人物。 もともとFreudの研究会に参加していたが学説上の相違から訣別し、個人心理学を創始した。 人には劣等感を補償するため、より強く完全になろうとする「権力への意志」があると考えた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Freud,S.（フロイト,S.）","環境要因や教育的関わり","Adler,A.（アドラー）","Freud,A.（フロイト,A.）"],"correctIndex":2},{"id":"p8q0142","page":10,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n小児臨床の経験から子どもと母親を1つの単位として捉え、対象関係論を発展させた人物。","answer":"Winnicott,D.W.（ウィニコット）","aliases":["Winnicott,D.W.（ウィニコット）"],"term":"Winnicott,D.W.（ウィニコット）","group":"person_psychoanalytic","kind":"term","note":"小児臨床の経験から子どもと母親を1つの単位として捉え、対象関係論を発展させた人物。 小児病院での経験から子どもと母親を1つの単位として捉える中間派（独立派）の1人である。 移行対象を、乳幼児の内的世界と外的現実の中間領域にあり情緒的発達を促すものと説明した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["「甘え」の状態を、Balint,M.","土居健郎","森田正馬","Winnicott,D.W.（ウィニコット）"],"correctIndex":3},{"id":"p8q0145","page":10,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n生涯を8段階に分けた心理社会的発達理論を示し、アイデンティティやモラトリアムを論じた人物。","answer":"Erikson,E.H.（エリクソン）","aliases":["Erikson,E.H.（エリクソン）"],"term":"Erikson,E.H.（エリクソン）","group":"person_development","kind":"term","note":"生涯を8段階に分けた心理社会的発達理論を示し、アイデンティティやモラトリアムを論じた人物。 自我心理学派の人物で、Freudの発達理論に心理社会的視点を加え、生涯を8段階に分けた。 アイデンティティ、モラトリアム、周辺人といった青年期に関わる概念を提唱した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Erikson,E.H.（エリクソン）","Piaget,J.（ピアジェ）","Harlow,H.F.（ハーロウ）","Havighurst,R.J.（ハヴィガースト）"],"correctIndex":0},{"id":"p8q0148","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n非合理的な信念を論駁する論理療法（論理情動療法・REBT）を開発した人物。","answer":"Ellis,A.（エリス）","aliases":["Ellis,A.（エリス）"],"term":"Ellis,A.（エリス）","group":"person_humanistic_cbt","kind":"term","note":"非合理的な信念を論駁する論理療法（論理情動療法・REBT）を開発した人物。 もともとは精神分析療法を行っていたが、のちに離れた。 ABCDE理論に基づく論理療法（論理情動療法・REBT）を創始した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Berne,E.（バーン）","Ellis,A.（エリス）","Maslow,A.H.（マズロー）","感情の敏感な察知と伝え返しなど"],"correctIndex":1},{"id":"p8q0151","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n治療構造論を論じ、日本で精神分析理論を広く紹介した精神分析家。","answer":"小此木啓吾","aliases":["小此木啓吾"],"term":"小此木啓吾","group":"person_psychoanalytic","kind":"term","note":"治療構造論を論じ、日本で精神分析理論を広く紹介した精神分析家。 日本の精神分析家である。 『モラトリアム人間の時代』など分かりやすい文章で難解な精神分析理論を一般に広く知らせた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Freud,S.（フロイト,S.）","Winnicott,D.W.（ウィニコット）","小此木啓吾","森田正馬"],"correctIndex":2},{"id":"p8q0154","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n人格構造を治療の見通しを立てるための臨床類型として示した人物。","answer":"Kernberg,O.F.（カーンバーグ）","aliases":["Kernberg,O.F.（カーンバーグ）"],"term":"Kernberg,O.F.（カーンバーグ）","group":"person_psychoanalytic","kind":"term","note":"人格構造を治療の見通しを立てるための臨床類型として示した人物。 人格構造論は単なる人格分類ではなく、治療の見通しを立てるための臨床類型である。 3つの人格構造に外向―内向の軸を加え、パーソナリティ障害間の相互関係の位置づけも行った。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Klein,M.（クライン）","もともとFreudの研究会に参加していた","Freud,S.（フロイト,S.）","Kernberg,O.F.（カーンバーグ）"],"correctIndex":3},{"id":"p8q0157","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n早期幼児自閉症を提唱した人物。","answer":"Kanner,L.（カナー）","aliases":["Kanner,L.（カナー）"],"term":"Kanner,L.（カナー）","group":"person_development","kind":"term","note":"早期幼児自閉症を提唱した人物。 1943年に早期幼児自閉症を提唱した。 Aspergerの症例とともに、現在は連続体として捉えられ、DSM-5では自閉スペクトラム症という概念となっている。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Kanner,L.（カナー）","Havighurst,R.J.（ハヴィガースト）","Bowlby,J.（ボウルビィ）","Gesell,A.L.（ゲゼル）"],"correctIndex":0},{"id":"p8q0160","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nLowenfeldの世界技法を分析心理学の考え方と結びつけ、箱庭療法へ発展させた人物。","answer":"Kalff,D.M.（カルフ）","aliases":["Kalff,D.M.（カルフ）"],"term":"Kalff,D.M.（カルフ）","group":"person_humanistic_cbt","kind":"term","note":"Lowenfeldの世界技法を分析心理学の考え方と結びつけ、箱庭療法へ発展させた人物。 箱庭療法の源流はLowenfeldが子どもの心理療法として考案した世界技法である。 Kalffは分析心理学を基盤に、砂箱の中でミニチュア玩具を使って表現する形式へ発展させた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Perls,F.S.（パールズ）","Kalff,D.M.（カルフ）","感情の敏感な察知と伝え返しなど","Rogers,C.R.（ロジャーズ）"],"correctIndex":1},{"id":"p8q0163","page":11,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n箱庭療法を日本へ紹介・普及し、日本の臨床心理学の発展に寄与した人物。","answer":"河合隼雄","aliases":["河合隼雄"],"term":"河合隼雄","group":"person_humanistic_cbt","kind":"term","note":"箱庭療法を日本へ紹介・普及し、日本の臨床心理学の発展に寄与した人物。 日本の臨床心理学の発展に寄与した。 非言語的な表現が日本人に向いていると考え、箱庭療法を日本に普及させた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["5つ","Beck,A.T.（ベック）","河合隼雄","精神分析の口語版"],"correctIndex":2},{"id":"p8q0166","page":12,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n一次・二次・三次予防を示し、危機理論やコンサルテーション理論の発展にも関わった人物。","answer":"Caplan,G.（キャプラン）","aliases":["Caplan,G.（キャプラン）"],"term":"Caplan,G.（キャプラン）","group":"person_social_family","kind":"term","note":"一次・二次・三次予防を示し、危機理論やコンサルテーション理論の発展にも関わった人物。 予防を一般人対象の一次予防、リスクのある人の早期発見・早期治療である二次予防、再発予防と社会復帰の三次予防に分けた。 Lindemannと危機理論を構築し、精神衛生活動の経験をもとにコンサルテーション理論も確立した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Moreno,J.L.（モレノ）","Lindemann,E.（リンデマン）","Lazarus,R.S.（ラザルス）","Caplan,G.（キャプラン）"],"correctIndex":3},{"id":"p8q0169","page":12,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n対象関係論の基礎を築き、遊びを通した児童分析を重視した人物。","answer":"Klein,M.（クライン）","aliases":["Klein,M.（クライン）"],"term":"Klein,M.（クライン）","group":"person_psychoanalytic","kind":"term","note":"対象関係論の基礎を築き、遊びを通した児童分析を重視した人物。 Freudが考えたよりも早期に超自我が形成されると考えた。 子どもが遊びの中で表現する内的世界を解釈する立場をとり、環境要因や教育的関わりを重視したAnna Freudと論争になった。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Klein,M.（クライン）","Winnicott,D.W.（ウィニコット）","Janet,P.（ジャネ）","環境要因や教育的関わり"],"correctIndex":0},{"id":"p8q0172","page":12,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n体型と気質・精神疾患の関係を論じ、3つのパーソナリティ傾向を示した人物。","answer":"Kretschmer,E.（クレッチマー）","aliases":["Kretschmer,E.（クレッチマー）"],"term":"Kretschmer,E.（クレッチマー）","group":"person_assessment","kind":"term","note":"体型と気質・精神疾患の関係を論じ、3つのパーソナリティ傾向を示した人物。 体型と気質・精神疾患の関係からパーソナリティを類型化した。 その理論は、のちに健常な人々にも当てはまるとされた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Vygotsky,L.S.（ヴィゴツキー）","Kretschmer,E.（クレッチマー）","Allport,G.W.（オルポート）","Ebbinghaus,H.（エビングハウス）"],"correctIndex":1},{"id":"p8q0175","page":12,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n精神医学へ対人関係の視点を取り入れ、対人関係論を提唱した人物。","answer":"Sullivan,H.S.（サリヴァン）","aliases":["Sullivan,H.S.（サリヴァン）"],"term":"Sullivan,H.S.（サリヴァン）","group":"person_social_family","kind":"term","note":"精神医学へ対人関係の視点を取り入れ、対人関係論を提唱した人物。 新フロイト派の人物である。 重度の統合失調症患者の治療経験から、精神医学に対人関係の視点を取り入れた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Selye,H.（セリエ）","Caplan,G.（キャプラン）","Sullivan,H.S.（サリヴァン）","Lewin,K.（レヴィン）"],"correctIndex":2},{"id":"p8q0178","page":12,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n体験過程理論を提唱し、フォーカシングを考案した人物。","answer":"Gendlin,E.T.（ジェンドリン）","aliases":["Gendlin,E.T.（ジェンドリン）"],"term":"Gendlin,E.T.（ジェンドリン）","group":"person_humanistic_cbt","kind":"term","note":"体験過程理論を提唱し、フォーカシングを考案した人物。 Rogersの研究グループに参加し、体験過程理論を提唱した。 クライエントが自らの体験過程に気づくための技法としてフォーカシングを考案した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Ellis,A.（エリス）","Berne,E.（バーン）","Frankl,V.E.（フランクル）","Gendlin,E.T.（ジェンドリン）"],"correctIndex":3},{"id":"p8q0181","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n解離と外傷性出来事の関連を早くから指摘した人物。","answer":"Janet,P.（ジャネ）","aliases":["Janet,P.（ジャネ）"],"term":"Janet,P.（ジャネ）","group":"person_psychoanalytic","kind":"term","note":"解離と外傷性出来事の関連を早くから指摘した人物。 解離と外傷性な出来事の関連を指摘していたが、当時はほとんど注目されなかった。 ベトナム戦争後の心的外傷、児童虐待、女性解放運動への関心の高まりを契機に再び注目された。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Janet,P.（ジャネ）","Adler,A.（アドラー）","Winnicott,D.W.（ウィニコット）","Jung,C.G.（ユング）"],"correctIndex":0},{"id":"p8q0184","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nストレッサーへの生体反応を非特異的反応として捉え、汎適応症候群を提唱した人物。","answer":"Selye,H.（セリエ）","aliases":["Selye,H.（セリエ）"],"term":"Selye,H.（セリエ）","group":"person_social_family","kind":"term","note":"ストレッサーへの生体反応を非特異的反応として捉え、汎適応症候群を提唱した人物。 ストレッサーの性質に関係なく適応しようとして生じる反応過程は非特異的であると考えた。 その過程を警告反応期、抵抗期、疲弊期の3段階で説明した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Lewin,K.（レヴィン）","Selye,H.（セリエ）","Bateson,G.（ベイトソン）","人のもつ自発性や創造性"],"correctIndex":1},{"id":"p8q0187","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n日本人の対人関係における「甘え」を理論化した人物。","answer":"土居健郎","aliases":["土居健郎"],"term":"土居健郎","group":"person_psychoanalytic","kind":"term","note":"日本人の対人関係における「甘え」を理論化した人物。 「甘え」の状態を、Balint,M.が提唱した自他未分化な一体感をもつ一次愛に相当するとした。 「甘え」という日本語の心理を臨床心理学的に論じた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Janet,P.（ジャネ）","Winnicott,D.W.（ウィニコット）","土居健郎","森田正馬"],"correctIndex":2},{"id":"p8q0190","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nゲシュタルト心理学を背景に、個人の欲求と体験の関係を図と地で説明し、ゲシュタルト療法を発展させた人物。","answer":"Perls,F.S.（パールズ）","aliases":["Perls,F.S.（パールズ）"],"term":"Perls,F.S.（パールズ）","group":"person_humanistic_cbt","kind":"term","note":"ゲシュタルト心理学を背景に、個人の欲求と体験の関係を図と地で説明し、ゲシュタルト療法を発展させた人物。 個人の欲求と体験の関係をゲシュタルト心理学の図と地によって説明した。 気づかれていなかった自己の部分が気づきによって統合されることで、個人のゲシュタルトが完成すると考えた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Axline,V.M.（アクスライン）","Kalff,D.M.（カルフ）","Berne,E.（バーン）","Perls,F.S.（パールズ）"],"correctIndex":3},{"id":"p8q0193","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n交流分析を提唱した人物。","answer":"Berne,E.（バーン）","aliases":["Berne,E.（バーン）"],"term":"Berne,E.（バーン）","group":"person_humanistic_cbt","kind":"term","note":"交流分析を提唱した人物。 交流分析は「精神分析の口語版」とも呼ばれる。 無意識を仮定せず「今、ここ」を重視することから、人間性心理学に位置づけられる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Berne,E.（バーン）","河合隼雄","箱庭療法の源流はLowenfeld","Ellis,A.（エリス）"],"correctIndex":0},{"id":"p8q0196","page":13,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n強制収容所体験を背景に、実存的空虚と人生の意味を重視するロゴセラピーを創始した人物。","answer":"Frankl,V.E.（フランクル）","aliases":["Frankl,V.E.（フランクル）"],"term":"Frankl,V.E.（フランクル）","group":"person_humanistic_cbt","kind":"term","note":"強制収容所体験を背景に、実存的空虚と人生の意味を重視するロゴセラピーを創始した人物。 第二次大戦中のアウシュヴィッツ強制収容所体験を著した『夜と霧』で知られる。 神経症は実存的空虚から生じると考え、存在価値と人生の意味を再発見させるロゴセラピーを創始した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Axline,V.M.（アクスライン）","Frankl,V.E.（フランクル）","うつ病研究から認知のあり方が感情状態","Maslow,A.H.（マズロー）"],"correctIndex":1},{"id":"p8q0199","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n自我の防衛機制を体系化し、児童分析でも重要な役割を果たした精神分析家。","answer":"Freud,A.（フロイト,A.）","aliases":["Freud,A.（フロイト,A.）"],"term":"Freud,A.（フロイト,A.）","group":"person_psychoanalytic","kind":"term","note":"自我の防衛機制を体系化し、児童分析でも重要な役割を果たした精神分析家。 Freud,S.の末娘で、自我の防衛機制を体系化し自我心理学派の基礎を築いた。 子どもへの精神分析をめぐり、対象関係論のKlein,M.と対立した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["もともとFreudの研究会に参加していた","Adler,A.（アドラー）","Freud,A.（フロイト,A.）","Freud,S.（フロイト,S.）"],"correctIndex":2},{"id":"p8q0202","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n精神分析を創始し、神経症の治療研究を通して多くの理論を提唱した人物。","answer":"Freud,S.（フロイト,S.）","aliases":["Freud,S.（フロイト,S.）"],"term":"Freud,S.（フロイト,S.）","group":"person_psychoanalytic","kind":"term","note":"精神分析を創始し、神経症の治療研究を通して多くの理論を提唱した人物。 精神分析の創始者である。 局所論、構造論、心理―性的発達段階など多数の理論を提唱した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["森田正馬","「甘え」の状態を、Balint,M.","Freud,A.（フロイト,A.）","Freud,S.（フロイト,S.）"],"correctIndex":3},{"id":"p8q0205","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n家族療法のコミュニケーション学派に関わり、ダブルバインド理論を提唱した人物。","answer":"Bateson,G.（ベイトソン）","aliases":["Bateson,G.（ベイトソン）"],"term":"Bateson,G.（ベイトソン）","group":"person_social_family","kind":"term","note":"家族療法のコミュニケーション学派に関わり、ダブルバインド理論を提唱した人物。 ダブルバインドを、言語的メッセージと矛盾する非言語的メッセージが同時に提示され、どちらも選べず身動きがとれない状態と説明した。 そのような状態が続くと統合失調症を発症すると主張した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Bateson,G.（ベイトソン）","Lazarus,R.S.（ラザルス）","Minuchin,S.（ミニューチン）","Caplan,G.（キャプラン）"],"correctIndex":0},{"id":"p8q0208","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nうつ病研究を通して認知のあり方と感情の関係を明らかにし、認知療法を確立した人物。","answer":"Beck,A.T.（ベック）","aliases":["Beck,A.T.（ベック）"],"term":"Beck,A.T.（ベック）","group":"person_humanistic_cbt","kind":"term","note":"うつ病研究を通して認知のあり方と感情の関係を明らかにし、認知療法を確立した人物。 もともとは精神分析療法を行っていたが、うつ病研究から認知のあり方が感情状態と関連することを明らかにした。 構造化された面接で不適応的な認知を修正し、短期間でうつ病を治療しようとする認知療法を確立した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Berne,E.（バーン）","Beck,A.T.（ベック）","Rogers,C.R.（ロジャーズ）","箱庭療法の源流はLowenfeld"],"correctIndex":1},{"id":"p8q0211","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n乳幼児が母親から心理的に独立していく分離―個体化理論を提唱した人物。","answer":"Mahler,M.S.（マーラー）","aliases":["Mahler,M.S.（マーラー）"],"term":"Mahler,M.S.（マーラー）","group":"person_development","kind":"term","note":"乳幼児が母親から心理的に独立していく分離―個体化理論を提唱した人物。 乳幼児が母親の表象を内在化し、母親とは異なる独立した存在として自律していく過程を論じた。 正常な自閉期・正常な共生期を経て、分化期、練習期、再接近期、情緒的対象恒常性の萌芽期へ進むとした。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Bowlby,J.（ボウルビィ）","Kanner,L.（カナー）","Mahler,M.S.（マーラー）","Gesell,A.L.（ゲゼル）"],"correctIndex":2},{"id":"p8q0214","page":14,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n家族構造のゆがみに注目し、構造派家族療法を発展させた人物。","answer":"Minuchin,S.（ミニューチン）","aliases":["Minuchin,S.（ミニューチン）"],"term":"Minuchin,S.（ミニューチン）","group":"person_social_family","kind":"term","note":"家族構造のゆがみに注目し、構造派家族療法を発展させた人物。 IPの問題は家族構造の歪みによるものと考え、適切な家族構造へ変えることを目指した。 代表的技法としてジョイニングやエナクトメントなどが挙げられる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Caplan,G.（キャプラン）","Lazarus,R.S.（ラザルス）","Selye,H.（セリエ）","Minuchin,S.（ミニューチン）"],"correctIndex":3},{"id":"p8q0217","page":15,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n生の欲望とヒポコンドリー性基調、精神交互作用などから神経症を理解し、森田療法を創始した人物。","answer":"森田正馬","aliases":["森田正馬"],"term":"森田正馬","group":"person_psychoanalytic","kind":"term","note":"生の欲望とヒポコンドリー性基調、精神交互作用などから神経症を理解し、森田療法を創始した人物。 生の欲望が強くヒポコンドリー性基調をもつ人が、精神交互作用によって症状を固定化し森田神経質に至ると考えた。 症状へのとらわれを脱し「あるがまま」を受け入れるよう支援し、治療者は不問的態度を重視する。","source":"左ページQuestion（右ページ解説で内容確認）","options":["森田正馬","治療者は不問的態度","3つ","土居健郎"],"correctIndex":0},{"id":"p8q0220","page":15,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n自発性と創造性を重視し、心理劇とソシオメトリーを提唱した人物。","answer":"Moreno,J.L.（モレノ）","aliases":["Moreno,J.L.（モレノ）"],"term":"Moreno,J.L.（モレノ）","group":"person_social_family","kind":"term","note":"自発性と創造性を重視し、心理劇とソシオメトリーを提唱した人物。 人のもつ自発性や創造性を重視し、心理劇（サイコドラマ）を考案した。 集団の心理学的特徴を捉える研究・方法としてソシオメトリーを提唱した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Sullivan,H.S.（サリヴァン）","Moreno,J.L.（モレノ）","Bateson,G.（ベイトソン）","Selye,H.（セリエ）"],"correctIndex":1},{"id":"p8q0223","page":15,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nFreudと訣別後、個人的無意識・集合的無意識・元型を重視する分析心理学を創始した人物。","answer":"Jung,C.G.（ユング）","aliases":["Jung,C.G.（ユング）"],"term":"Jung,C.G.（ユング）","group":"person_psychoanalytic","kind":"term","note":"Freudと訣別後、個人的無意識・集合的無意識・元型を重視する分析心理学を創始した人物。 無意識を個人的無意識と集合的無意識に分け、集合的無意識の中に元型が存在すると主張した。 拡充法を用いた夢分析による治療を行った。","source":"左ページQuestion（右ページ解説で内容確認）","options":["「甘え」の状態を、Balint,M.","Adler,A.（アドラー）","Jung,C.G.（ユング）","環境要因や教育的関わり"],"correctIndex":2},{"id":"p8q0226","page":15,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\nストレッサーへの認知的評価が個人のストレス反応を規定すると考えた人物。","answer":"Lazarus,R.S.（ラザルス）","aliases":["Lazarus,R.S.（ラザルス）"],"term":"Lazarus,R.S.（ラザルス）","group":"person_social_family","kind":"term","note":"ストレッサーへの認知的評価が個人のストレス反応を規定すると考えた人物。 ストレッサーが脅威かどうかという一次的評価を想定した。 そのストレッサーへ対処できるかどうかという二次的評価も想定した。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Selye,H.（セリエ）","Lewin,K.（レヴィン）","Minuchin,S.（ミニューチン）","Lazarus,R.S.（ラザルス）"],"correctIndex":3},{"id":"p8q0229","page":15,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n大災害の遺族などへの臨床的介入から急性悲嘆反応を示した人物。","answer":"Lindemann,E.（リンデマン）","aliases":["Lindemann,E.（リンデマン）"],"term":"Lindemann,E.（リンデマン）","group":"person_social_family","kind":"term","note":"大災害の遺族などへの臨床的介入から急性悲嘆反応を示した人物。 大火災で亡くなった人々や軍人の遺族への臨床的介入の知見から急性悲嘆反応を提唱した。 身体的虚脱、死へのイメージ、罪悪感、敵対的反応、通常の行動パターンの喪失という段階を挙げた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["Lindemann,E.（リンデマン）","Lazarus,R.S.（ラザルス）","Bateson,G.（ベイトソン）","Selye,H.（セリエ）"],"correctIndex":0},{"id":"p8q0232","page":16,"chapter":"最重要キーパーソン","side":"basic","stem":"次の説明に最も当てはまる概念・法律・制度・人物はどれか。\n非指示的療法を発展させ、クライエント中心療法・パーソン・センタード・アプローチへ展開した人物。","answer":"Rogers,C.R.（ロジャーズ）","aliases":["Rogers,C.R.（ロジャーズ）"],"term":"Rogers,C.R.（ロジャーズ）","group":"person_humanistic_cbt","kind":"term","note":"非指示的療法を発展させ、クライエント中心療法・パーソン・センタード・アプローチへ展開した人物。 児童相談臨床の経験から独自の人間観に基づく非指示的療法を開発し、のちにクライエント中心療法と改称した。 後年は個人的心理療法からグループ・アプローチへ関心を移し、パーソン・センタード・アプローチへ発展させた。","source":"左ページQuestion（右ページ解説で内容確認）","options":["うつ病研究から認知のあり方が感情状態","Rogers,C.R.（ロジャーズ）","Frankl,V.E.（フランクル）","Gendlin,E.T.（ジェンドリン）"],"correctIndex":1},{"id":"R-p8q0002","page":1,"chapter":"司法・犯罪","side":"detail","stem":"「司法面接」の目的として資料に示されているものは何か。","answer":"子どもの負担をできるだけ少なくしつつ、正確な情報を得ること","aliases":["子どもの負担をできるだけ少なくしつつ、正確な情報を得ること"],"term":"司法面接","group":"judicial_child","kind":"purpose","note":"子どもの負担をできるだけ少なくしつつ、正確な情報を得ることを目的とする。","source":"右ページAnswer解説から追加","options":["子の元の居住国","司法面接","子どもの負担をできるだけ少なくしつつ、正確な情報を得ること","労働条件について最低基準を保障すること"],"correctIndex":2},{"id":"R-p8q0003","page":1,"chapter":"司法・犯罪","side":"detail","stem":"「司法面接」は、何とは目的が異なると資料で説明されているか。","answer":"治療を目的とするカウンセリングや治療面接","aliases":["治療を目的とするカウンセリングや治療面接"],"term":"司法面接","group":"judicial_child","kind":"comparison","note":"治療を目的とするカウンセリングや治療面接とは目的が異なる。","source":"右ページAnswer解説から追加","options":["ハーグ条約（国際的な子の奪取の民事上の側面に関する条約）","子の元の居住国","司法面接","治療を目的とするカウンセリングや治療面接"],"correctIndex":3},{"id":"R-p8q0008","page":1,"chapter":"司法・犯罪","side":"detail","stem":"「ハーグ条約（国際的な子の奪取の民事上の側面に関する条約）」について、資料では原則としてどこで行うとされるか。","answer":"子の元の居住国","aliases":["子の元の居住国"],"term":"ハーグ条約（国際的な子の奪取の民事上の側面に関する条約）","group":"judicial_child","kind":"place","note":"監護権をめぐる本案の判断 ージAnswer解説から追加","options":["感情の敏感な察知と伝え返しなど","河合隼雄","Ellis,A.（エリス）","ここ」"],"correctIndex":3},{"id":"R-p8q0209","page":14,"chapter":"最重要キーパーソン","side":"detail","stem":"「Beck,A.T.（ベック）」と関連するものとして資料に挙げられているのは何か。","answer":"うつ病研究から認知のあり方が感情状態","aliases":["うつ病研究から認知のあり方が感情状態"],"term":"Beck,A.T.（ベック）","group":"person_humanistic_cbt","kind":"relation","note":"もともとは精神分析療法を行っていたが、うつ病研究から認知のあり方が感情状態と関連することを明らかにした。","source":"右ページAnswer解説から追加","options":["うつ病研究から認知のあり方が感情状態","箱庭療法の源流はLowenfeld","Kalff,D.M.（カルフ）","Gendlin,E.T.（ジェンドリン）"],"correctIndex":0},{"id":"R-p8q0219","page":15,"chapter":"最重要キーパーソン","side":"detail","stem":"「森田正馬」で重視されるものとして資料に示されているのは何か。","answer":"治療者は不問的態度","aliases":["治療者は不問的態度"],"term":"森田正馬","group":"person_psychoanalytic","kind":"focus","note":"症状へのとらわれを脱し「あるがまま」を受け入れるよう支援し、治療者は不問的態度を重視する。","source":"右ページAnswer解説から追加","options":["森田正馬","治療者は不問的態度","Adler,A.（アドラー）","Jung,C.G.（ユング）"],"correctIndex":1},{"id":"R-p8q0221","page":15,"chapter":"最重要キーパーソン","side":"detail","stem":"「Moreno,J.L.（モレノ）」で重視されるものとして資料に示されているのは何か。","answer":"人のもつ自発性や創造性","aliases":["人のもつ自発性や創造性"],"term":"Moreno,J.L.（モレノ）","group":"person_social_family","kind":"focus","note":"人のもつ自発性や創造性を重視し、心理劇（サイコドラマ）を考案した。","source":"右ページAnswer解説から追加","options":["Caplan,G.（キャプラン）","Moreno,J.L.（モレノ）","人のもつ自発性や創造性","Lewin,K.（レヴィン）"],"correctIndex":2},{"id":"Q-RNEW0086","page":931,"chapter":"","side":"detail","stem":"ストレスチェック制度が施行されたのは何年か。","answer":"2015年","aliases":["2015年"],"term":"","group":"curated","kind":"curated","note":"","source":"右ページ解説（精選）","options":["2020年","50人以上","2012年","2015年"],"correctIndex":3},{"id":"Q-RNEW0087","page":932,"chapter":"","side":"detail","stem":"ストレスチェックが義務づけられる事業場は、常時使用する労働者が何人以上か。","answer":"50人以上","aliases":["50人以上"],"term":"","group":"curated","kind":"curated","note":"常時使用する労働者数が50人未 満の事業場では、 当分の間は努力義務とされている。 回実施することが義務づけられている。","source":"右ページ解説（精選）","options":["50人以上","49人以上","30人以上","1943年"],"correctIndex":0},{"id":"Q-RNEW0088","page":934,"chapter":"","side":"detail","stem":"ストレスチェックの結果等の記録は何年間保存するか。","answer":"5年間","aliases":["5年間"],"term":"","group":"curated","kind":"curated","note":"","source":"右ページ解説（精選）","options":["4年間","5年間","1943年","10年間"],"correctIndex":1},{"id":"Q-RNEW0089","page":939,"chapter":"","side":"detail","stem":"脳・心臓疾患の労災認定で、発症前1ヶ月のおおむね何時間を超える時間外労働は業務との関連性が強いと評価されるか。","answer":"100時間","aliases":["100時間"],"term":"","group":"curated","kind":"curated","note":"におおむね100時間を超える時間外労働が認められる場合は、 業務と発症 の関連性が強いと評価される。","source":"右ページ解説（精選）","options":["1943年","60時間","100時間","80時間"],"correctIndex":2},{"id":"Q-RNEW0090","page":940,"chapter":"","side":"detail","stem":"脳・心臓疾患の労災認定で、発症前2〜6ヶ月の月平均時間外労働の目安として資料に示されているのは何時間か。","answer":"80時間","aliases":["80時間"],"term":"","group":"curated","kind":"curated","note":"","source":"右ページ解説（精選）","options":["60時間","79時間","100時間","80時間"],"correctIndex":3},{"id":"Q-RNEW0092","page":968,"chapter":"","side":"detail","stem":"Axlineの遊戯療法では、セラピストの基本的態度として何原則が示されているか。","answer":"8原則","aliases":["8原則"],"term":"","group":"curated","kind":"curated","note":"Rogers,C.R. (ロジャーズ) に師事し、 児童中心療法を提唱した。 法におけるセラピストの基本的態度として、 子どもとのあたたかい友好的 な関係をつくる、 子どものありのままの姿を受容する、 子どもの感情を敏 感に察知しそれを伝え返す、 治療は徐々に進行する過程であることを理解 する、 必要最低限の制限のみを加えるなどの8原則を提唱した。","source":"右ページ解説（精選）","options":["8原則","1943年","10原則","6原則"],"correctIndex":0},{"id":"Q-RNEW0093","page":969,"chapter":"","side":"detail","stem":"Adlerが創始した心理学の立場は何か。","answer":"個人心理学","aliases":["個人心理学"],"term":"","group":"curated","kind":"curated","note":"4k lsFreud,S. (フロイト) の研究会に答介ントトリドイザク からFreud,S.(フロイト)と訣別し、 個人心理学を創始した。 Bd, 人には劣 等感を補償するためにより強く完全になろうとする 「権力への意志」がある と考えた。","source":"右ページ解説（精選）","options":["人間性心理学","個人心理学","分析心理学","1943年"],"correctIndex":1},{"id":"Q-RNEW0094","page":974,"chapter":"","side":"detail","stem":"Kernbergが人格構造を捉える際に重視した3つの観点は何か。","answer":"同一性・防衛機制・現実検討","aliases":["同一性・防衛機制・現実検討"],"term":"","group":"curated","kind":"curated","note":"Kernbergは同一性、防衛機制、現実検討などを基準に人格構造を捉えた。","source":"右ページ解説（精選）","options":["合意性・弁別性・一貫性","自律性・有能感・関係性","同一性・防衛機制・現実検討","イド・自我・超自我"],"correctIndex":2},{"id":"Q-RNEW0095","page":975,"chapter":"","side":"detail","stem":"Kannerが早期幼児自閉症を報告したのは何年か。","answer":"1943年","aliases":["1943年"],"term":"","group":"curated","kind":"curated","note":"彼は1943年に早期幼児自閉症を提唱した。 これらは現在、 連続体としてと らえられ、 DSM-5において自閉スペクトラム症という概念にたっている。","source":"右ページ解説（精選）","options":["2015年","100時間","個人心理学","1943年"],"correctIndex":3},{"id":"Q-RNEW0096","page":992,"chapter":"","side":"detail","stem":"Beckが創始した、うつ病などへの心理療法は何か。","answer":"認知療法","aliases":["認知療法"],"term":"","group":"curated","kind":"curated","note":"Beckは、認知のあり方と気分・行動の関係を重視し、うつ病への認知療法を創始した。","source":"右ページ解説（精選）","options":["認知療法","来談者中心療法","森田療法","80時間"],"correctIndex":0},{"id":"Q-RNEW0097","page":996,"chapter":"","side":"detail","stem":"Morenoが考案した集団心理療法は何か。","answer":"心理劇（サイコドラマ）","aliases":["心理劇（サイコドラマ）"],"term":"","group":"curated","kind":"curated","note":"Morenoはソシオメトリーや心理劇（サイコドラマ）を考案した。","source":"右ページ解説（精選）","options":["ゲシュタルト療法","心理劇（サイコドラマ）","100時間","家族療法"],"correctIndex":1}]; const KEY="purple8_choice_rebuilt_v1"; let hist=JSON.parse(localStorage.getItem(KEY)||'{}');let order=[],pos=0,sessionA=0,sessionC=0;
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stat(id){return hist[id]||{correct:0,wrong:0,last:null}}function record(id,ok){const s=stat(id);s.correct+=(ok?1:0);s.wrong+=(!ok?1:0);s.last=ok?'correct':'wrong';hist[id]=s;localStorage.setItem(KEY,JSON.stringify(hist));}
function pool(){let a=DATA.slice();const side=el('side').value,chap=el('chapter').value,rev=el('review').value;if(side!=='all')a=a.filter(x=>x.side===side);if(chap!=='all')a=a.filter(x=>x.chapter===chap);if(rev==='unanswered')a=a.filter(x=>{const s=stat(x.id);return s.correct+s.wrong===0});if(rev==='lastwrong')a=a.filter(x=>stat(x.id).last==='wrong');if(rev==='everwrong')a=a.filter(x=>stat(x.id).wrong>0);if(rev==='wrong1')a=a.filter(x=>stat(x.id).wrong===1);if(rev==='wrong2')a=a.filter(x=>stat(x.id).wrong===2);if(rev==='wrong3')a=a.filter(x=>stat(x.id).wrong>=3);return a;}
function start(){order=pool();if(el('ord').value==='random')order.sort(()=>Math.random()-.5);pos=0;renderQuestion();updateStats();} function current(){return order[pos]}
function next(){if(pos<order.length-1){pos++;renderQuestion();}else renderDone();}function prev(){if(pos>0){pos--;renderQuestion();}}
function meta(q){el('meta').innerHTML=`<span class="pill">${q.side==='basic'?'基本':'右ページ詳細'}</span><span class="pill">${esc(q.chapter||'')}</span><span class="pill">誤答 ${stat(q.id).wrong}回</span><span class="pill">${pos+1} / ${order.length}</span>`;}
function renderDone(){el('stem').textContent=order.length?'この範囲は終了！':'該当する問題がありません';el('body').innerHTML='';el('feedback').className='feedback';}
function updateStats(){const p=pool();el('pool').textContent=p.length;el('answered').textContent=sessionA;el('correct').textContent=sessionC;el('rate').textContent=sessionA?Math.round(sessionC/sessionA*100)+'%':'0%';}

function renderQuestion(){const q=current(); if(!q){renderDone();return;} meta(q); el('stem').textContent=q.stem; const box=el('body');box.innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button class="choice" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')+'</div>'; el('feedback').className='feedback'; el('feedback').innerHTML=''; document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.i)));}
function answerChoice(i){const q=current(); if(document.querySelector('.choice.correct,.choice.wrong'))return; const ok=i===q.correctIndex; document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');}); if(!ok)document.querySelectorAll('.choice')[i].classList.add('wrong'); record(q.id,ok); sessionA++; if(ok)sessionC++; const fb=el('feedback');fb.className='feedback show';fb.innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}：${esc(q.answer)}</div><div class="note">${esc(q.note||'')}</div>`; updateStats();}

el('start').onclick=start;el('next').onclick=next;el('prev').onclick=prev;['side','chapter','review','ord'].forEach(id=>el(id).onchange=updateStats);el('reset').onclick=()=>{if(confirm('この問題集の学習履歴をすべて削除しますか？')){hist={};localStorage.removeItem(KEY);sessionA=sessionC=0;start();}};updateStats();
