.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.q{font-size:19px;font-weight:700;line-height:1.65;margin:15px 0 18px;white-space:pre-wrap}

.footnote{color:var(--muted);font-size:12px;margin:13px 2px 0}.toplink{margin:0 0 10px}.toplink a{color:var(--accent);font-weight:700;text-decoration:none}.hidden{display:none!important}

<script>const questions=[{"id":"jin1-c-001","q":"自分一人では気づきにくい『自分らしさ』を捉える観点を何というか。","options":["自己理解の視点","分析心理学","構造論","類型論"],"correct":0,"answer":"自己理解の視点","explanation":"自己理解の視点とは、自分一人では気づきにくい「自分らしさ」を捉えることである。","section":"1. 自己理解の視点"},{"id":"jin1-c-002","q":"自己理解の視点について、自分にとってあまりになじみ深い人格上の特徴は、何のように当然であるため改めて意識されにくいか。","options":["鏡","空気","カメラ","仮面"],"correct":1,"answer":"空気","explanation":"自分にとってあまりに「なじみ深いもの」は、空気のように「当然のこと」として、改めて意識されることは少ない。","section":"1. 自己理解の視点"},{"id":"jin1-c-003","q":"自己理解の視点について、自分の内面・態度・行動を映し出すものとして必要だとされる比喩は何か。","options":["カメラ","鏡","舞台","空気"],"correct":1,"answer":"鏡","explanation":"人間は自分一人で自分自身を見つめることは難しく、自分の内面、態度、行動を映し出す「鏡」が必要である。","section":"1. 自己理解の視点"},{"id":"jin1-c-004","q":"自己理解の視点について、自分の位置づけを知る方法として資料が挙げるものは何か。","options":["空気","鏡","筆跡の判定","他者との比較"],"correct":3,"answer":"他者との比較","explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-c-005","q":"自己理解の視点について、周囲の人から意見や反応を受け取って自分を知る方法は何か。","options":["行動の類型化","他者への投影","他者からのフィードバック","自己への抑圧"],"correct":2,"answer":"他者からのフィードバック","explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-c-006","q":"自己理解の視点について、『自分らしさ』が顕在化する場として、資料が重視するものは何か。","options":["一人で行う内省","身体計測の場面","刺激のない孤立環境","他者との関わり合い"],"correct":3,"answer":"他者との関わり合い","explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-c-007","q":"自己理解の視点について、自分自身の姿を客観的に捉えるために通すものは何か。","options":["検査という答え","自己という仮面","意識という窓","他者という鏡"],"correct":3,"answer":"他者という鏡","explanation":"他者という鏡を通じて初めて、私たちは自分自身の姿を客観的に捉えることが可能になるのである。","section":"1. 自己理解の視点"},{"id":"jin1-c-008","q":"自己理解の視点について、自覚されている面とともに『自分らしさ』がもつものは何か。","options":["自分では自覚しにくい側面","他者にも自分にも明確な側面","一時的な気分を示す側面","身体的特徴から決まる側面"],"correct":0,"answer":"自分では自覚しにくい側面","explanation":"自分らしさは自覚されている面もあるが、自分では自覚しにくい側面も持っている。","section":"1. 自己理解の視点"},{"id":"jin1-c-009","q":"ジョハリの窓について、対人関係における相互的な認識過程を表すモデルを提唱した人物は誰か。","options":["クリス","シュプランガー","アイゼンク","ルフトとインガム"],"correct":3,"answer":"ルフトとインガム","explanation":"ルフトとインガムによって提唱された、対人関係における相互的な認識過程を表すモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-c-010","q":"自己と他者の認識を『知っている／知らない』で整理するモデルを何というか。","options":["体験過程理論","経済論","ジョハリの窓","心の局所論"],"correct":2,"answer":"ジョハリの窓","explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-c-011","q":"ジョハリの窓が自己理解・他者理解に用いる認識の軸はいくつか。","options":["12","5つ","2つ","16"],"correct":2,"answer":"2つ","explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-c-012","q":"ジョハリの窓で分類される自己の領域はいくつか。","options":["5つ","4つ","16","6つ"],"correct":1,"answer":"4つ","explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-c-013","q":"ジョハリの窓について、自分も他者も知っている公的な『私』に当たる領域はどれか。","options":["隠蔽領域","開放領域","未知領域","盲点領域"],"correct":1,"answer":"開放領域","explanation":"①開放領域は、自分も他者も知る公的な「私」。","section":"2. ジョハリの窓"},{"id":"jin1-c-014","q":"ジョハリの窓について、自分は知っているが他者には知られていない私的な『私』に当たる領域はどれか。","options":["隠蔽領域","未知領域","盲点領域","開放領域"],"correct":0,"answer":"隠蔽領域","explanation":"②隠蔽領域は、自分は知っているプライベートな「私」。","section":"2. ジョハリの窓"},{"id":"jin1-c-015","q":"ジョハリの窓について、他者だけが知り、自分では気づいていない『私』に当たる領域はどれか。","options":["開放領域","未知領域","隠蔽領域","盲点領域"],"correct":3,"answer":"盲点領域","explanation":"③盲点領域は、他者のみが知る自分では気づいていない「私」。","section":"2. ジョハリの窓"},{"id":"jin1-c-016","q":"ジョハリの窓について、自分も他者も気づいていない無意識下の『私』に当たる領域はどれか。","options":["開放領域","盲点領域","隠蔽領域","未知領域"],"correct":3,"answer":"未知領域","explanation":"④未知領域は、自分も他者も気づいていない無意識下の私を指す。","section":"2. ジョハリの窓"},{"id":"jin1-c-017","q":"ジョハリの窓について、開放領域を広げる3作用のうち、自分が知っている情報を他者へ伝える作用は何か。","options":["抑圧","発見","フィードバック","自己開示"],"correct":3,"answer":"自己開示","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-018","q":"ジョハリの窓について、開放領域を広げる3作用のうち、他者が把握している自分の特徴を伝えてもらう作用は何か。","options":["発見","フィードバック","自己開示","抑圧"],"correct":1,"answer":"フィードバック","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-019","q":"ジョハリの窓について、開放領域を広げる3作用のうち、自分も他者も知らなかった側面が明らかになる作用は何か。","options":["自己開示","抑圧","発見","フィードバック"],"correct":2,"answer":"発見","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-020","q":"ジョハリの窓について、3つの作用によって広がる領域はどれか。","options":["隠蔽領域","開放領域","未知領域","盲点領域"],"correct":1,"answer":"開放領域","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-021","q":"ジョハリの窓について、開放領域が広がると、他の領域はどうなるか。","options":["すべて消失する","小さくなる","隠蔽領域","大きくなる"],"correct":1,"answer":"小さくなる","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-022","q":"ジョハリの窓について、開放領域の拡大によって深まるものの組合せはどれか。","options":["衝動と感情","対人関係と自己理解","身体発達と知能","抑圧と退行"],"correct":1,"answer":"対人関係と自己理解","explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-c-023","q":"他者理解の視点について、人の知覚を、外界を受動的に写すだけではないと説明する際、否定される比喩は何か。","options":["地図","カメラ","鏡","窓"],"correct":1,"answer":"カメラ","explanation":"他者理解の視点において、我々の知覚はカメラのように外界を単に受動的に写しているわけではない。","section":"3. 他者理解の視点"},{"id":"jin1-c-024","q":"他者理解の視点について、人が情報を照合するものとして挙げられているのは何か。","options":["カメラ","認知的世界","過去の経験","未来の予言"],"correct":2,"answer":"過去の経験","explanation":"人間は過去の経験に照らし合わせ、情報を補足・加工しながら主体的・能動的に「認知的世界」を構成している。","section":"3. 他者理解の視点"},{"id":"jin1-c-025","q":"他者理解の視点について、人は情報を補足・加工しながら、何を主体的・能動的に構成するか。","options":["心的エネルギー","集合的無意識","認知的世界","カメラ"],"correct":2,"answer":"認知的世界","explanation":"人間は過去の経験に照らし合わせ、情報を補足・加工しながら主体的・能動的に「認知的世界」を構成している。","section":"3. 他者理解の視点"},{"id":"jin1-c-026","q":"他者理解の視点について、認知の歪みは、どの程度単純な刺激でも生じ得るか。","options":["人間関係を含む複雑な刺激","強い情動を伴う刺激","過去経験と一致する刺激","単なる図形のような刺激"],"correct":3,"answer":"単なる図形のような刺激","explanation":"そのため、単なる図形のような単純な刺激であっても認知の歪みは生じる。","section":"3. 他者理解の視点"},{"id":"jin1-c-027","q":"他者理解の視点について、人間という対象は、単純な図形と比べてどのような刺激だとされるか。","options":["価値観の入らない刺激","はるかに複雑な情緒刺激","カメラ","過去の経験"],"correct":1,"answer":"はるかに複雑な情緒刺激","explanation":"ましてや人間という対象は、図形とは比較にならないほど複雑な情緒刺激である。","section":"3. 他者理解の視点"},{"id":"jin1-c-028","q":"他者理解の視点について、他者に関する情報を歪めやすい主観的フィルターとして、資料に挙げられている組合せはどれか。","options":["価値観・能力・感情・記憶","先入観・知能・気質・態度","感情・欲求・習慣・技能","価値観・先入観・感情・見方のくせ"],"correct":3,"answer":"価値観・先入観・感情・見方のくせ","explanation":"そこには個人の価値観や先入観、感情、見方のくせなどが入り込みやすく、情報は容易に歪められてしまう。","section":"3. 他者理解の視点"},{"id":"jin1-c-029","q":"他者理解の視点について、正当な他者把握を妨げやすいものの総称として、資料が用いる表現は何か。","options":["生理的な尺度","主観的なフィルター","形式分析","客観的なカメラ"],"correct":1,"answer":"主観的なフィルター","explanation":"自己理解が困難であるのと同様に、他者理解もまた、こうした主観的なフィルターによって正当な把握が妨げられやすい、極めて困難な課題なのである。","section":"3. 他者理解の視点"},{"id":"jin1-c-030","q":"性格や人格が初めて観察可能になるのは、何に反映されたときか。","options":["価値観","行動","共通性","個人差"],"correct":1,"answer":"行動","explanation":"性格（人格）は、行動に反映された時に初めて観察可能となる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-031","q":"行動傾向としてのパーソナリティについて、人間の行動を変化させる温度に関わる環境条件の例は何か。","options":["個人差","共通性","暑さ","一貫した特徴"],"correct":2,"answer":"暑さ","explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-032","q":"行動傾向としてのパーソナリティについて、暑さと並び、人間の行動を変化させる環境条件の例として資料に挙げられているものは何か。","options":["個人差","共通性","空腹","一貫した特徴"],"correct":2,"answer":"空腹","explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-033","q":"行動傾向としてのパーソナリティについて、類似した環境下で多くの人に共通して現れる面を何というか。","options":["個人差","独自特性","共通性","劣等機能"],"correct":2,"answer":"共通性","explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-034","q":"行動傾向としてのパーソナリティについて、類似した環境下でも人によって異なって現れる面を何というか。","options":["共通性","集合的無意識","現実原則","個人差"],"correct":3,"answer":"個人差","explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-035","q":"行動傾向としてのパーソナリティについて、同一状況下でさえ生じる差異を表す資料中の表現は何か。","options":["社会的な規範","意識的な抑圧","個人的な差異","普遍的な同一性"],"correct":2,"answer":"個人的な差異","explanation":"パーソナリティとは、行動や経験にある程度の共通性を備えつつも、同一状況下でさえ生じる「個人的な差異」を指す。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-036","q":"行動傾向としてのパーソナリティについて、人格の通状況的一貫性とは、状況が変わっても個人独自に何が現れることか。","options":["共通性","個人差","一貫した特徴","個人的な差異"],"correct":2,"answer":"一貫した特徴","explanation":"この差異の中には、状況が変わってもその人独自に現れる「一貫した特徴」がある。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-037","q":"パーソナリティ概念によって行うこととして挙げられている組合せはどれか。","options":["価値観・先入観・感情・見方のくせ","衝動の抑圧・否認・歪曲","個人の独自性の理解・説明・予測","知能の測定・採点・診断"],"correct":2,"answer":"個人の独自性の理解・説明・予測","explanation":"こうした個人の独自性を理解し、説明や予測を行うために必要とされるのがパーソナリティという概念である。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-038","q":"行動傾向としてのパーソナリティについて、変容する環境の中でも保たれる核心を表す言葉は何か。","options":["身体類型","公的な私","その人らしさ","社会体制"],"correct":2,"answer":"その人らしさ","explanation":"つまり、変容する環境の中で保たれる「その人らしさ」の核心を行動から捉えようとするものである。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-c-039","q":"パーソナリティを三層構造で捉えた人物は誰か。","options":["ホーナイ","コスタとマックレー","大山","ジェンドリン"],"correct":2,"answer":"大山","explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-040","q":"人格を示す三層構造を構成する概念の組合せはどれか。","options":["外向性・神経症傾向・開放性","気質・性格・人格","意識・前意識・無意識","イド・自我・超自我"],"correct":1,"answer":"気質・性格・人格","explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-041","q":"気分・テンポ・刺激への感受性など、生物学的側面が強い先天的な基礎部分を指す概念はどれか。","options":["気質","性格","類型","人格"],"correct":0,"answer":"気質","explanation":"まず「気質」は、気分やテンポ、刺激への感受性といった生物学的側面が強く、先天的な性格の基礎部分を指す。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-042","q":"個人を特徴づける、ある程度固定的で恒常的な基本的行動傾向を指す概念はどれか。","options":["人格","気質","類型","性格"],"correct":3,"answer":"性格","explanation":"次に「性格」は、その人を特徴づける基本的な行動傾向であり、ある程度固定的で恒常的な個人的特徴である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-043","q":"環境への適応機能を含む、個人の心身システムの動的で全体的な組織を指す概念はどれか。","options":["性格","人格","気質","類型"],"correct":1,"answer":"人格","explanation":"そして「人格」は、これらを含めた環境への適応機能の全体的特徴を指す。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-046","q":"知能や価値観まで包含する、性格より広い概念はどれか。","options":["人格","類型","性格","気質"],"correct":0,"answer":"人格","explanation":"大山の三層構造では、人格は気質と性格を含み、環境への適応機能、知能、価値観までを包含するため、性格より広い概念とされる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-047","q":"先天的な土台から統合的全体像へ至る順序として正しいものはどれか。","options":["性格→人格→気質","気質→人格→性格","人格→性格→気質","気質→性格→人格"],"correct":3,"answer":"気質→性格→人格","explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-048","q":"気質・性格・人格について、個人の行動や思考を決定するとされるものは何か。","options":["心身システムのダイナミックな組織","心的内容の静的な配置","一時的な環境反応の集合","典型的な体型による分類"],"correct":0,"answer":"心身システムのダイナミックな組織","explanation":"これは、個人の行動や思考を決定する心身システムのダイナミックな組織であり、知能や価値観までをも包含する、性格よりも広い概念である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-c-049","q":"古典的なパーソナリティ分類について、頭蓋骨の形から性格を分類する方法はどれか。","options":["骨相学","筆跡学","人相学","血液型性格判断"],"correct":0,"answer":"骨相学","explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-050","q":"古典的なパーソナリティ分類について、顔や身体的特徴から人格を推測する方法はどれか。","options":["筆跡学","骨相学","血液型","人相学"],"correct":3,"answer":"人相学","explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-051","q":"古典的なパーソナリティ分類について、書かれた文字の特徴から性格を判断する方法はどれか。","options":["人相学","筆跡学","骨相学","血液型"],"correct":1,"answer":"筆跡学","explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-052","q":"古典的なパーソナリティ分類について、血液の型と性格を対応づけようとする方法はどれか。","options":["人相学","血液型性格判断","骨相学","筆跡学"],"correct":1,"answer":"血液型性格判断","explanation":"血液型性格判断も広く知られているが、研究では血液型と性格との明確な関連は認められていない。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-053","q":"古典的なパーソナリティ分類について、研究上、性格との明確な関連が認められていないものは何か。","options":["行動傾向","環境条件","血液型","自己概念"],"correct":2,"answer":"血液型","explanation":"血液型性格判断も広く知られているが、研究では血液型と性格との明確な関連は認められていない。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-054","q":"古典的なパーソナリティ分類について、古典的分類法の多くに乏しいとされるものは何か。","options":["科学的根拠","分類名称","人への関心","歴史的意義"],"correct":0,"answer":"科学的根拠","explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-055","q":"古典的なパーソナリティ分類について、科学的限界があっても、古典的分類が後世に与えた影響は何か。","options":["個人差研究の終結","無意識概念の否定","臨床経験の排除","パーソナリティ研究の発展への影響"],"correct":3,"answer":"パーソナリティ研究の発展への影響","explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-056","q":"古典的なパーソナリティ分類について、古典的分類は、人間の何を理解しようとした最初期の試みとされるか。","options":["骨相学","個人差","人相学","筆跡学"],"correct":1,"answer":"個人差","explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-c-057","q":"一定の原理で複数の典型を設定し、多様な性格をそこへ分類する考え方は何か。","options":["自己理論","類型論","構造論","体験過程理論"],"correct":1,"answer":"類型論","explanation":"類型論は、一定の原理に基づいて典型的な性格を複数設定し、現実の多様な性格を分類して理解しやすくする考え方である。","section":"7. 類型論"},{"id":"jin1-c-058","q":"人格の類型論の背景にあるものは何か。","options":["アメリカ行動主義","ドイツ的人間学","フランス社会学","ロシア生理学"],"correct":1,"answer":"ドイツ的人間学","explanation":"ドイツ的人間学を背景とし、主に20世紀前半のヨーロッパで発展した。","section":"7. 類型論"},{"id":"jin1-c-059","q":"類型論について、主に発展した時期と地域の組合せはどれか。","options":["18世紀前半のアジア","20世紀後半のアフリカ","20世紀前半のヨーロッパ","21世紀のオセアニア"],"correct":2,"answer":"20世紀前半のヨーロッパ","explanation":"ドイツ的人間学を背景とし、主に20世紀前半のヨーロッパで発展した。","section":"7. 類型論"},{"id":"jin1-c-060","q":"類型論について、全体的な典型例を示すことによる長所は何か。","options":["科学的因果を確定できる","人の性格を容易に把握できる","中間型を精密に測定できる","全特性を漏れなく評価できる"],"correct":1,"answer":"人の性格を容易に把握できる","explanation":"全体的な典型例が示されているため、人の性格を容易に把握できる。","section":"7. 類型論"},{"id":"jin1-c-061","q":"類型論について、多様な人の性格を簡便に理解する際の長所は何か。","options":["共通言語として役立つ","ドイツ的人間学","すべての個人差を消す","病気を確定診断する"],"correct":0,"answer":"共通言語として役立つ","explanation":"また、多様な人の性格を、簡便に理解する際の共通言語として有用である。","section":"7. 類型論"},{"id":"jin1-c-062","q":"類型論について、複数の典型の特徴を併せ持つ人を捉えにくいという限界は、何に関するものか。","options":["開放領域","中間型","現実検討","優越機能"],"correct":1,"answer":"中間型","explanation":"しかし、その反面、複数の類型の特徴を持つ中間型は捉えることが難しい。","section":"7. 類型論"},{"id":"jin1-c-063","q":"類型論について、典型的性質へ注目するため起こりやすい問題は何か。","options":["他の性質が無視されやすい","ドイツ的人間学","質問紙が使えなくなる","人の性格を容易に把握できる"],"correct":0,"answer":"他の性質が無視されやすい","explanation":"その類型に特徴的な性質をもっているかどうかが注目されるので、他の性質が無視されやすいといった限界もある。","section":"7. 類型論"},{"id":"jin1-c-064","q":"類型論について、代表例に含まれないものはどれか。","options":["シュプランガーの理論","ロジャーズの自己理論","クレッチマーの理論","シェルドンの理論"],"correct":1,"answer":"ロジャーズの自己理論","explanation":"代表的な例として、クレッチマーの類型論やシェルドンの類型論、ユングの類型論、シュプランガーの類型論がある。したがって、選択肢の中で当てはまらないのは「ロジャーズの自己理論」である。","section":"7. 類型論"},{"id":"jin1-c-065","q":"人格の類型論が目指す主な目的は何か。","options":["身体疾患を診断すること","ドイツ的人間学","性格の理解を容易にすること","性格の個人差をなくすこと"],"correct":2,"answer":"性格の理解を容易にすること","explanation":"一定の原理に基づいて典型的な性格をいくつか設定し、現実の多様な性格をそこへ分類し、性格の理解を容易にしようとする考えである。","section":"7. 類型論"},{"id":"jin1-c-066","q":"クレッチマーの類型論について、多くの臨床経験から体型・気質・病前性格の関連を捉えた人物の職業は何か。","options":["文化人類学者","社会学者","精神科医","小児科医"],"correct":2,"answer":"精神科医","explanation":"精神科医であったクレッチマーは、多くの臨床経験から体型と気質、病前性格との間に相関関係を見出し、性格特性論を提唱した。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-067","q":"体型と気質、病前性格の相関を見いだした人物は誰か。","options":["アンナ・フロイト","大山","ホーナイ","クレッチマー"],"correct":3,"answer":"クレッチマー","explanation":"精神科医であったクレッチマーは、多くの臨床経験から体型と気質、病前性格との間に相関関係を見出し、性格特性論を提唱した。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-068","q":"クレッチマーの類型論について、分裂気質および統合失調症と対応づけられた体型はどれか。","options":["内胚葉型","細長型","闘士型","肥満型"],"correct":1,"answer":"細長型","explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-069","q":"クレッチマーの類型論について、循環（躁うつ）気質および躁うつ病と対応づけられた体型はどれか。","options":["肥満型","内胚葉型","闘士型","細長型"],"c on":"8. クレッチマーの類型論"},{"id":"jin1-c-079","q":"クレッチマーによる体型・気質・病気の三つの対応表に含まれていない病気はどれか。","options":["統合失調症","てんかん","神経症","躁うつ病"],"correct":2,"answer":"神経症","explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。神経症は、この3つの対応に含まれない。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-080","q":"クレッチマーの類型論について、当初の臨床対象に限らず、後にはどのような人にも当てはまるとされたか。","options":["細長型","肥満型","闘士型","健常者"],"correct":3,"answer":"健常者","explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-081","q":"クレッチマーの類型論について、精神医学で長く受け入れられたのは、何を示す用語としてか。","options":["病前性格","生活史","身体症状","細長型"],"correct":0,"answer":"病前性格","explanation":"クレッチマーの類型論は、病前性格を示す用語として精神医学の中でも長く受け入れられ、人の性格に関する情報を端的に表現し共有していく手段としては今でも有効である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-082","q":"クレッチマーの類型論について、現在でも有効とされる実用面は何か。","options":["細長型","遺伝と環境を分離できる","知能を正確に算出できる","性格情報を端的に表現し共有できる"],"correct":3,"answer":"性格情報を端的に表現し共有できる","explanation":"クレッチマーの類型論は、病前性格を示す用語として精神医学の中でも長く受け入れられ、人の性格に関する情報を端的に表現し共有していく手段としては今でも有効である。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-083","q":"クレッチマーの類型論で不明確とされる関係のうち、精神病を含むものはどれか。","options":["自己開示とフィードバックの関係","現実検討と適応の関係","自己概念と経験の関係","気質と精神病の関係"],"correct":3,"answer":"気質と精神病の関係","explanation":"しかし、気質と精神病の関係・体型と気質の関係が不明確であるなどの問題点もある。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-084","q":"クレッチマーの類型論で、因果関係が不明確だとされるものはどれか。","options":["意識と無意識の関係","イドと自我の関係","体型と気質の関係","自我と超自我の関係"],"correct":2,"answer":"体型と気質の関係","explanation":"しかし、気質と精神病の関係・体型と気質の関係が不明確であるなどの問題点もある。","section":"8. クレッチマーの類型論"},{"id":"jin1-c-085","q":"健常な男子大学生の身体計測を用いた類型論の提唱者は誰か。","options":["アイゼンク","アンナ・フロイト","大山","シェルドン"],"correct":3,"answer":"シェルドン","explanation":"シェルドンは、健常な男子大学生の身体計測に基づいて、体型と胎生期の胚や葉発達の統計的な関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-c-086","q":"シェルドンの類型論の調査対象はどのような人々だったか。","options":["健常な男子大学生","精神病患者","乳幼児","高齢者"],"correct":0,"answer":"健常な男子大学生","explanation":"シェルドンは、健常な男子大学生の身体計測に基づいて、体型と胎生期の胚や葉発達の統計的な関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-c-087","q":"シェルドンの類型論について、体型との統計的関連を検討した、胎生期の発達単位は何か。","options":["内胚葉型","頭蓋骨","胚葉","血液型"],"correct":2,"answer":"胚葉","explanation":"シェルドンは、健常な男子大学生の身体計測に基づき、体型と胎生期の胚葉発達との統計的関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-c-088","q":"胚葉の発達と体型・性格を結びつけるシェルドンの理論は、別名何と呼ばれるか。","options":["発生的類型論","価値類型論","心の局所論","五因子モデル"],"correct":0,"answer":"発生的類型論","explanation":"発生的類型論とも呼ばれる。","section":"9. シェルドンの類型論"},{"id":"jin1-c-089","q":"シェルドンの類型論について、肥満型で、消化器系が発達した体型はどれか。","options":["中胚葉型","外胚葉型","細長型","内胚葉型"],"correct":3,"answer":"内胚葉型","explanation":"具体的には、内胚葉型（肥満型）は消化器系発達の内臓型気質で、社交的、寛容などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-090","q":"シェルドンの類型論について、痩せ型で、神経系・感覚器系が発達した体型はどれか。","options":["細長型","中胚葉型","外胚葉型","内胚葉型"],"correct":2,"answer":"外胚葉型","explanation":"外胚葉型（痩せ型）は神経系・感覚器系発達の頭脳型気質で、過激、心配症などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-091","q":"シェルドンの類型論について、筋肉と骨が発達した筋骨型はどれか。","options":["内胚葉型","細長型","中胚葉型","外胚葉型"],"correct":2,"answer":"中胚葉型","explanation":"中胚葉型（筋骨型）は筋肉・骨が発達した身体型気質で、精力的、活動的などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-093","q":"シェルドンの類型論について、内胚葉型に対応し、社交的・寛容などを示す気質はどれか。","options":["外胚葉型","頭脳型気質","内臓型気質","粘着気質"],"correct":2,"answer":"内臓型気質","explanation":"具体的には、内胚葉型（肥満型）は消化器系発達の内臓型気質で、社交的、寛容などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-094","q":"シェルドンの類型論について、外胚葉型に対応し、過激・心配症などを示す気質はどれか。","options":["内臓型気質","粘着気質","頭脳型気質","内胚葉型"],"correct":2,"answer":"頭脳型気質","explanation":"外胚葉型（痩せ型）は神経系・感覚器系発達の頭脳型気質で、過激、心配症などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-095","q":"シェルドンの類型論について、中胚葉型に対応し、精力的・活動的などを示す気質はどれか。","options":["粘着気質","身体型気質","頭脳型気質","内臓型気質"],"correct":1,"answer":"身体型気質","explanation":"中胚葉型（筋骨型）は筋肉・骨が発達した身体型気質で、精力的、活動的などである。","section":"9. シェルドンの類型論"},{"id":"jin1-c-100","q":"シェルドンの類型論について、クレッチマーの考え方と共通して指摘される問題は何か。","options":["体型と気質の対応が固定的であること","健常者を調査対象に含めたこと","身体計測を用いて分析したこと","体型変化と気質変化の関係"],"correct":3,"answer":"体型変化と気質変化の関係","explanation":"クレッチマーの類型論と類似しており、体型変化と気質変化に関する問題点が挙げられる。","section":"9. シェルドンの類型論"},{"id":"jin1-c-101","q":"シェルドンの類型論について、クレッチマーと比べて評価されている対象上の特徴は何か。","options":["精神病患者の病前性格を対象にしたこと","健常者の性格を対象にしたこと","乳幼児の発達段階を対象にしたこと","文化的な価値志向を対象にしたこと"],"correct":1,"answer":"健常者の性格を対象にしたこと","explanation":"クレッチマーは精神病患者の病前性格からの出発に対し、シェルドンは健常者の性格を対象としてより広範囲かつ実証的に調査したという点で評価されている。","section":"9. シェルドンの類型論"},{"id":"jin1-c-102","q":"シェルドンの類型論について、クレッチマーと比べて評価されている調査上の特徴は何か。","options":["臨床事例から類型を構成したこと","より広範囲かつ実証的に調査したこと","一事例を長期的に観察したこと","体型との関連を検討しなかったこと"],"correct":1,"answer":"より広範囲かつ実証的に調査したこと","explanation":"クレッチマーは精神病患者の病前性格からの出発に対し、シェルドンは健常者の性格を対象としてより広範囲かつ実証的に調査したという点で評価されている。","section":"9. シェルドンの類型論"},{"id":"jin1-c-103","q":"心的エネルギーの方向と心の機能を組み合わせた分類の提唱者は誰か。","options":["キャッテル","フロイト","ユング","ルフトとインガム"],"correct":2,"answer":"ユング","explanation":"ユングの類型論とは、人の性格を「心的エネルギー(リビドー)の向かう方向」と「心の機能」の組み合わせによって分類する理論である。","section":"10. ユングの類型論"},{"id":"jin1-c-104","q":"ユングの向性による分類で、心的エネルギーを表す用語は何か。","options":["コンプレックス","リビドー","サイコグラフ","フェルトセンス"],"correct":1,"answer":"リビドー","explanation":"ユングの類型論とは、人の性格を「心的エネルギー(リビドー)の向かう方向」と「心の機能」の組み合わせによって分類する理論である。","section":"10. ユングの類型論"},{"id":"jin1-c-105","q":"ユングの類型論について、心的エネルギーが外の世界へ向かう型はどれか。","options":["外向型","感情型","感覚型","内向型"],"correct":0,"answer":"外向型","explanation":"ユングは、心的エネルギーが外の世界に向かう外向型と、内面の世界に向かう内向型の2つを区別した。","section":"10. ユングの類型論"},{"id":"jin1-c-106","q":"ユングの類型論について、心的エネルギーが内面の世界へ向かう型はどれか。","options":["思考型","感覚型","外向型","内向型"],"correct":3,"answer":"内向型","explanation":"ユングは、心的エネルギーが外の世界に向かう外向型と、内面の世界に向かう内向型の2つを区別した。","section":"10. ユングの類型論"},{"id":"jin1-c-107","q":"ユングの類型論について、判断する機能の組合せはどれか。","options":["思考と感情","外向と内向","意識と無意識","自我と自己"],"correct":0,"answer":"思考と感情","explanation":"さらに、心の機能を、物事を判断する思考と感情、情報を受け取る感覚と直観の4つに分類した。","section":"10. ユングの類型論"},{"id":"jin1-c-108","q":"ユングの類型論について、情報を受け取る機能の組合せはどれか。","options":["意識と前意識","感覚と直観","思考と感情","外向と内向"],"correct":1,"answer":"感覚と直観","explanation":"さらに、心の機能を、物事を判断する思考と感情、情報を受け取る感覚と直観の4つに分類した。","section":"10. ユングの類型論"},{"id":"jin1-c-109","q":"ユングの類型論について、最も発達した心の機能を何というか。","options":["劣等機能","優越機能","自我機能","適応機能"],"correct":1,"answer":"優越機能","explanation":"これらの機能には最も発達した優越機能と、その対極にある劣等機能が存在すると考えた。","section":"10. ユングの類型論"},{"id":"jin1-c-110","q":"ユングの類型論について、最も発達した機能の対極にあるものを何というか。","options":["統合機能","自己実現傾向","優越機能","劣等機能"],"correct":3,"answer":"劣等機能","explanation":"これらの機能には最も発達した優越機能と、その対極にある劣等機能が存在すると考えた。","section":"10. ユングの類型論"},{"id":"jin1-c-111","q":"ユングの類型論について、二つの方向と四つの機能を組み合わせると、性格類型はいくつになるか。","options":["10","3つ","12","8つ"],"correct":3,"answer":"8つ","explanation":"ユングは、外向・内向と4つの心的機能を組み合わせ、外向的思考型や内向的感情型などの8つの性格類型を提唱した。","section":"10. ユングの類型論"},{"id":"jin1-c-112","q":"ユングの類型論について、意識と無意識はどのような関係にあると考えられたか。","options":["リビドー","外向型","内向型","相補的な関係"],"correct":3,"answer":"相補的な関係","explanation":"また、意識と無意識は相補的な関係にあり、心の問題は抑圧された無意識的側面が自己の全体性を回復しようとする働きによって生じると考えた。","section":"10. ユングの類型論"},{"id":"jin1-c-113","q":"ユングの類型論について、心の問題が生じる背景として、抑圧された側面が何を回復しようとするとされたか。","options":["自己の全体性","リビドー","社会階級の固定","外向型"],"correct":0,"answer":"自己の全体性","explanation":"また、意識と無意識は相補的な関係にあり、心の問題は抑圧された無意識的側面が自己の全体性を回復しようとする働きによって生じると考えた。","section":"10. ユングの類型論"},{"id":"jin1-c-114","q":"基本的生活領域のどこへ価値を置くかで性格を分類した人物は誰か。","options":["ロジャーズ","クレッチマー","オールポート","シュプランガー"],"correct":3,"answer":"シュプランガー","explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-115","q":"シュプランガーの価値類型はいくつ設定されているか。","options":["6つ","4つ","16","5つ"],"correct":0,"answer":"6つ","explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-116","q":"シュプランガーの類型論について、客観的・論理的な知識体系を創造することに価値を置く類型はどれか。","options":["審美型","理論型","権力型","経済型"],"correct":1,"answer":"理論型","explanation":"①客観的に見て論理的知識体系を想像することに価値を置く理論型。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-117","q":"シュプランガーの類型論について、事物の経済性や功利性を重視する類型はどれか。","options":["審美型","権力型","経済型","理論型"],"correct":2,"answer":"経済型","explanation":"②事物の経済性や功利性を重視する経済型。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-118","q":"シュプランガーの類型論について、繊細で敏感であり、美しいものに価値を置く類型はどれか。","options":["権力型","審美型","理論型","宗教型"],"correct":1,"answer":"審美型","explanation":"③繊細で敏感、美しいものに価値を置く審美型。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-119","q":"シュプランガーの類型論について、神への奉仕や宗教体験を重視する類型はどれか。","options":["社会型","経済型","権力型","宗教型"],"correct":3,"answer":"宗教型","explanation":"④神への奉仕、宗教体験を重視する宗教型。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-120","q":"シュプランガーの類型論について、権力を求め、他人を支配しようとする類型はどれか。","options":["権力型","理論型","審美型","社会型"],"correct":0,"answer":"権力型","explanation":"⑤権力を求め、他人を支配しようとする権力型。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-121","q":"シュプランガーの類型論について、人間を愛し、人を進歩させることに価値を置く類型はどれか。","options":["社会型","宗教型","理論型","審美型"],"correct":0,"answer":"社会型","explanation":"⑥人間を愛し、進歩させることに価値を置く社会型、である。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-122","q":"シュプランガーの類型論について、各人が志向する文化価値を規定することが多いものとして挙げられているのは何か。","options":["経済型","職業など","審美型","宗教型"],"correct":1,"answer":"職業など","explanation":"各自の志向する文化価値は職業等によっても規定される部分が多い。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-123","q":"シュプランガーの類型論について、現実の個人を一つの型に決められないことがあるのはなぜか。","options":["価値志向が生涯を通じて固定されるため","職業が一つの型を自動的に決めるため","文化価値が分類基準にならないため","複数の価値志向をもつことがあるため"],"correct":3,"answer":"複数の価値志向をもつことがあるため","explanation":"現実の個人には複数の価値志向があって、型を決定できないこともある。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-124","q":"シュプランガーの価値類型論は何を分類基準とするか。","options":["最も価値を置く生活領域","身体の太り方","神経系の活動","心的エネルギーの量"],"correct":0,"answer":"最も価値を置く生活領域","explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-c-125","q":"性格形成で社会体制を重視した人物は誰か。","options":["アンナ・フロイト","大山","フロム","ホーナイ"],"correct":2,"answer":"フロム","explanation":"フロムは、性格形成に影響する要因として社会体制を重視し、性格形成において社会や経済の仕組みが個人の性格を規定した。","section":"12. フロムの類型論"},{"id":"jin1-c-126","q":"フロムの類型論で個人の性格を規定すると重視されたものは何か。","options":["搾取的性格","社会や経済の仕組み","貯蔵的性格","受容的性格"],"correct":1,"answer":"社会や経済の仕組み","explanation":"フロムは、性格形成に影響する要因として社会体制を重視し、性格形成において社会や経済の仕組みが個人の性格を規定した。","section":"12. フロムの類型論"},{"id":"jin1-c-127","q":"フロムの類型論について、社会的な在り方に基づく性格類型はいくつか。","options":["5つ","10","3つ","12"],"correct":0,"answer":"5つ","explanation":"彼は人間の性格を、その社会的な在り方に基づき5つのタイプに分類した。","section":"12. フロムの類型論"},{"id":"jin1-c-128","q":"フロムの類型論について、労働階級の労働を不当に利用するとされた資本家にみられる型はどれか。","options":["貯蔵的性格","搾取的性格","受容的性格","生産的性格"],"correct":1,"answer":"搾取的性格","explanation":"①労働階級の労働を不当に搾取するとされた資本家にみられる搾取的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-129","q":"フロムの類型論について、金銭や利権をため込んで安心を得ようとする型はどれか。","options":["市場的性格","搾取的性格","貯蔵的性格","受容的性格"],"correct":2,"answer":"貯蔵的性格","explanation":"②金銭・利権をため込んで安心(保障)を獲得しようとする貯蔵的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-130","q":"フロムの類型論について、所得格差・生活水準の違い・主従関係を従順に受け入れ、抵抗できない政治的従属者に多い型はどれか。","options":["搾取的性格","貯蔵的性格","生産的性格","受容的性格"],"correct":3,"answer":"受容的性格","explanation":"③資本家と労働者の階級闘争の結果、「所得格差や生活水準の違い・主従関係」を従順に受け入れて抵抗することのできない政治的従属者に多い受容的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-131","q":"フロムの類型論について、能力・才能・権力を社会全体の利益や発展のため利他的に用いる型はどれか。","options":["受容的性格","市場的性格","搾取的性格","生産的性格"],"correct":3,"answer":"生産的性格","explanation":"④自己の能力・才能・権力を「社会全体の利益・発展」のために利他的に用いる生産的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-132","q":"フロムの類型論について、市場の受容に合わせて自分の価値観や能力を適応的に変える、資本主義社会に典型的な型はどれか。","options":["受容的性格","生産的性格","市場的性格","搾取的性格"],"correct":2,"answer":"市場的性格","explanation":"⑤市場の受容に合わせて自分の価値観や能力を適応的に変化させる、資本主義社会に典型的な市場的性格、である。","section":"12. フロムの類型論"},{"id":"jin1-c-133","q":"フロムの類型論について、安心を得るためにため込むものの組合せはどれか。","options":["規範と道徳","金銭と利権","知識と経験","感情と衝動"],"correct":1,"answer":"金銭と利権","explanation":"②金銭・利権をため込んで安心(保障)を獲得しようとする貯蔵的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-134","q":"フロムの類型論について、従順に受け入れるものとして挙げられた三つの組合せはどれか。","options":["所得格差・生活水準の違い・主従関係","意識・前意識・無意識","思考・感情・感覚","現実検討・適応・統合"],"correct":0,"answer":"所得格差・生活水準の違い・主従関係","explanation":"③資本家と労働者の階級闘争の結果、「所得格差や生活水準の違い・主従関係」を従順に受け入れて抵抗することのできない政治的従属者に多い受容的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-135","q":"フロムの類型論について、利他的に用いるものとして挙げられた三つの組合せはどれか。","options":["不安・罪悪感・恥","金銭・利権・地位","能力・才能・権力","意識・無意識・前意識"],"correct":2,"answer":"能力・才能・権力","explanation":"④自己の能力・才能・権力を「社会全体の利益・発展」のために利他的に用いる生産的性格。","section":"12. フロムの類型論"},{"id":"jin1-c-137","q":"基本的な対人関係の態度に注目した人物は誰か。","options":["ホーナイ","アンナ・フロイト","大山","フロム"],"correct":0,"answer":"ホーナイ","explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-138","q":"ホーナイの類型論が分類基準としたものは何か。","options":["心的機構へのエネルギー配分","攻撃型","基本的な対人関係の態度","依存型"],"correct":2,"answer":"基本的な対人関係の態度","explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-139","q":"ホーナイの類型論について、設定された対人関係の型はいくつか。","options":["3つ","5つ","16","6つ"],"correct":0,"answer":"3つ","explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-c-140","q":"ホーナイの類型論について、外向的・積極的で、対立を恐れず自己主張し、目標達成を目指す型はどれか。","options":["攻撃型","依存型","市場的性格","離反型"],"correct":0,"answer":"攻撃型","explanation":"攻撃型は、外向的で積極的な性格傾向をもち、他者との対立を恐れず自己主張を行い、目標達成を目指すタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-c-141","q":"ホーナイの類型論について、同調的・消極的で、他者や集団の期待に応えて不安や緊張を和らげる型はどれか。","options":["離反型","攻撃型","市場的性格","依存型"],"correct":3,"answer":"依存型","explanation":"依存型は、同調的で消極的な傾向をもち、他者や集団の期待に応えることで不安や緊張を和らげようとするタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-c-142","q":"ホーナイの類型論について、内向的で独立志向が強く、対人関係や競争を避けて内的世界を重視する型はどれか。","options":["市場的性格","依存型","攻撃型","離反型"],"correct":3,"answer":"離反型","explanation":"離反型は、内向的で独立志向が強く、対人関係や競争を避け、自分の内的世界を重視するタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-c-144","q":"ホーナイの類型論について、三つの対人関係パターンを人が形成する目的は何か。","options":["基本的な対人関係の態度","知能を高めるため","攻撃型","不安に対処するため"],"correct":3,"answer":"不安に対処するため","explanation":"ホーナイは、人は不安に対処するためにこれらの対人関係のパターンを形成すると考えた。","section":"13. ホーナイの類型論"},{"id":"jin1-c-148","q":"人々が共通して持つ性格特徴と、各特徴の組合せによって個人を理解する考え方は何か。","options":["特性論","状況主義","経済論","類型論"],"correct":0,"answer":"特性論","explanation":"特性論とは、人が共通して持つ性格特性(特性)に注目し、その組み合わせの結果によって個人のパーソナリティを理解しようとする考え方である。","section":"14. 特性論"},{"id":"jin1-c-149","q":"人格の特性論では、個人差を何の差として捉えるか。","options":["特性の程度","性格を詳細に把握できる","性格全体のまとまり","無意識の層数"],"correct":0,"answer":"特性の程度","explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-c-150","q":"特性論について、個人差を程度の差として扱うため適している研究の組合せはどれか。","options":["実証的・統計的研究","宗教体験の分類","神話の解釈","筆跡の直観的判断"],"correct":0,"answer":"実証的・統計的研究","explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-c-151","q":"人格の特性論には、性格把握の細かさに関してどのような長所があるか。","options":["中間型を扱えない","特性の程度","性格を詳細に把握できる","性格全体のまとまり"],"correct":2,"answer":"性格を詳細に把握できる","explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-c-152","q":"特性論について、課題として捉えにくいとされるものは何か。","options":["統計的個人差","共通する特徴","性格全体のまとまり","測定得点"],"correct":2,"answer":"性格全体のまとまり","explanation":"しかし、個人の性格全体のまとまりや個性的な特徴などの独自性を捉えにくいという課題もある。","section":"14. 特性論"},{"id":"jin1-c-153","q":"人格の特性論で、全体性と並んで捉えにくいとされるものは何か。","options":["多くの人に共通する特性","数値化された程度差","因子分析の結果","個性的な特徴などの独自性"],"correct":3,"answer":"個性的な特徴などの独自性","explanation":"しかし、個人の性格全体のまとまりや個性的な特徴などの独自性を捉えにくいという課題もある。","section":"14. 特性論"},{"id":"jin1-c-154","q":"特性論について、代表的理論に含まれないものはどれか。","options":["アイゼンクの特性論","ビッグファイブ理論","クレッチマーの類型論","オールポートの特性論"],"correct":2,"answer":"クレッチマーの類型論","explanation":"代表的な理論には、キャッテルの特性論、アイゼンクの特性論、ビッグファイブ理論がある。したがって、選択肢の中で当てはまらないのは「クレッチマーの類型論」である。","section":"14. 特性論"},{"id":"jin1-c-155","q":"特性論について、複数の性格特性をどのように扱って人格を理解するか。","options":["特性の程度","すべて同一とみなす","性格を詳細に把握できる","組み合わせとして扱う"],"correct":3,"answer":"組み合わせとして扱う","explanation":"特性論とは、人が共通して持つ性格特性(特性)に注目し、その組み合わせの結果によって個人のパーソナリティを理解しようとする考え方である。","section":"14. 特性論"},{"id":"jin1-c-156","q":"『性格特性』という概念を初めて使用した人物は誰か。","options":["ロジャーズ","クレッチマー","オールポート","ホーナイ"],"correct":2,"answer":"オールポート","explanation":"オールポートは、「性格特性」という概念を初めて使用し、特性論的性格理論を体系化した人物である。","section":"15. オールポートの特性論"},{"id":"jin1-c-157","q":"特性論的な性格理論を体系化した人物は誰か。","options":["コスタとマックレー","ジェンドリン","シェルドン","オールポート"],"correct":3,"answer":"オールポート","explanation":"オールポートは、「性格特性」という概念を初めて使用し、特性論的性格理論を体系化した人物である。","section":"15. オールポートの特性論"},{"id":"jin1-c-158","q":"オールポートの特性論について、一人の個人に特有の特徴を指すものはどれか。","options":["共通特性","個別特性","態度的特性","表出的特性"],"correct":1,"answer":"個別特性","explanation":"彼は性格特性を、個人に特有の特徴である個別特性と、多くの人に共通する特徴である共通特性に分類した。","section":"15. オールポートの特性論"},{"id":"jin1-c-159","q":"オールポートの特性論について、多くの人に共通してみられる特徴を指すものはどれか。","options":["態度的特性","表出的特性","個別特性","共通特性"],"correct":3,"answer":"共通特性","explanation":"彼は性格特性を、個人に特有の特徴である個別特性と、多くの人に共通する特徴である共通特性に分類した。","section":"15. オールポートの特性論"},{"id":"jin1-c-160","q":"オールポートの特性論について、共通特性を分けたうち、4つ設定された側面を指すものはどれか。","options":["態度的特性","表出的特性","共通特性","個別特性"],"correct":1,"answer":"表出的特性","explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-161","q":"オールポートの特性論について、共通特性を分けたうち、10設定された側面を指すものはどれか。","options":["態度的特性","表出的特性","共通特性","個別特性"],"correct":0,"answer":"態度的特性","explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-162","q":"オールポートの特性論について、共通特性のうち、表出的なものはいくつに分けられたか。","options":["2つ","10","4つ","3つ"],"correct":2,"answer":"4つ","explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-163","q":"オールポートの特性論について、共通特性のうち、態度的なものはいくつに分けられたか。","options":["6つ","10","2つ","8つ"],"correct":1,"answer":"10","explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-164","q":"オールポートの特性論について、諸特性の程度を測定してプロフィール化したものを何というか。","options":["インク・ブロット","エゴグラム","フェルトセンス","サイコグラフ"],"correct":3,"answer":"サイコグラフ","explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-165","q":"オールポートが作成したサイコグラフは、何を記述するためのものか。","options":["個人のパーソナリティ","体型と病前性格の対応","心的機能の優劣","知能の発達水準"],"correct":0,"answer":"個人のパーソナリティ","explanation":"オールポートは、共通特性の程度を測定してプロフィール化し、個人のパーソナリティを記述するサイコグラフを作成した。","section":"15. オールポートの特性論"},{"id":"jin1-c-166","q":"オールポートらの特性論で用いられた特性の選定方法には、どのような問題があったか。","options":["因子分析だけで自動的に選定されたこと","個別特性を測定しなかったこと","便宜的に選定されたこと","共通特性を一種類に限定したこと"],"correct":2,"answer":"便宜的に選定されたこと","explanation":"しかし、用いられた性格特性はオールポートが便宜的に選定したものであり、その妥当性には課題が残されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-167","q":"オールポートの特性論について、特性が便宜的に選ばれたため残された課題は何か。","options":["流動性","身体性","妥当性","意識性"],"correct":2,"answer":"妥当性","explanation":"しかし、用いられた性格特性はオールポートが便宜的に選定したものであり、その妥当性には課題が残されている。","section":"15. オールポートの特性論"},{"id":"jin1-c-168","q":"オールポートの考えを基礎に因子分析を用いた人物は誰か。","options":["アンナ・フロイト","大山","フロム","キャッテル"],"correct":3,"answer":"キャッテル","explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-169","q":"キャッテルは、オールポートの特性論を基礎として、性格特性をどの2種類に分類したか。","options":["個人的無意識と集合的無意識","外向型と内向型","優越機能と劣等機能","独自特性と共通特性"],"correct":3,"answer":"独自特性と共通特性","explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-170","q":"キャッテルの特性論について、外から直接観察できる行動特徴の集まりはどれか。","options":["独自特性","表面特性","根源特性","共通特性"],"correct":1,"answer":"表面特性","explanation":"表面特性とは、外から観察できる行動特徴の集まりである。","section":"16. キャッテルの特性論"},{"id":"jin1-c-171","q":"キャッテルの特性論について、直接には観察されず、複数の行動特徴の背後に想定されるものはどれか。","options":["根源特性","表面特性","共通特性","独自特性"],"correct":0,"answer":"根源特性","explanation":"根源特性とは、直接観察はされず、複数の表面特性の背後にあると想定される特性である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-172","q":"キャッテルの特性論について、個人に特有の特徴として分類されたものはどれか。","options":["根源特性","表面特性","独自特性","共通特性"],"correct":2,"answer":"独自特性","explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-173","q":"キャッテルの特性論について、多くの人に共通する特徴として分類されたものはどれか。","options":["根源特性","表面特性","共通特性","独自特性"],"correct":2,"answer":"共通特性","explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-174","q":"キャッテルの特性論について、因子分析で当初抽出された表面特性はいくつか。","options":["12","5つ","35","16"],"correct":2,"answer":"35","explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-175","q":"キャッテルの特性論について、当初提唱された根源特性はいくつか。","options":["2つ","12","8つ","3つ"],"correct":1,"answer":"12","explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-176","q":"キャッテルの特性論について、当初の根源特性へ後から追加された特性はいくつか。","options":["10","4つ","3つ","12"],"correct":1,"answer":"4つ","explanation":"その後、4つの特性を追加し、最終的に16の根源特性を見出した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-177","q":"キャッテルの特性論について、最終的に見いだされた根源特性はいくつか。","options":["16","35","6つ","2つ"],"correct":0,"answer":"16","explanation":"その後、4つの特性を追加し、最終的に16の根源特性を見出した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-178","q":"キャッテルの特性論について、最終的な根源特性を測定するために作成された検査は何か。","options":["16PF人格検査","MPI","MMPI","NEO-PI-R"],"correct":0,"answer":"16PF人格検査","explanation":"この16の根源特性を測定するために作成されたのが16PF人格検査である。","section":"16. キャッテルの特性論"},{"id":"jin1-c-180","q":"キャッテルの特性論で、特性抽出に使われた統計的方法は何か。","options":["自由連想法","因子分析","質疑法","行動描写法"],"correct":1,"answer":"因子分析","explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-c-181","q":"類型論と特性論の両方を取り入れた人物は誰か。","options":["ミッシェル","クリス","アイゼンク","ユング"],"correct":2,"answer":"アイゼンク","explanation":"アイゼンクは、類型論と特性論の両方の考え方を取り入れ、パーソナリティを4つの水準からなる階層構造として捉えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-182","q":"アイゼンクの特性論について、パーソナリティをいくつの水準からなる階層構造として捉えたか。","options":["6つ","4つ","35","8つ"],"correct":1,"answer":"4つ","explanation":"アイゼンクは、類型論と特性論の両方の考え方を取り入れ、パーソナリティを4つの水準からなる階層構造として捉えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-183","q":"アイゼンクの特性論について、日常生活における個人の一回ごとの具体的行動で、階層の最下位にあるものはどれか。","options":["特性","習慣的反応","特殊的反応","類型"],"correct":2,"answer":"特殊的反応","explanation":"最も下位には、日常生活における個人の具体的な行動である特殊的反応があり、それらが繰り返されることで習慣的反応となる。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-184","q":"アイゼンクの特性論について、具体的行動が繰り返されることで形成されるものはどれか。","options":["習慣的反応","特殊的反応","類型","特性"],"correct":0,"answer":"習慣的反応","explanation":"最も下位には、日常生活における個人の具体的な行動である特殊的反応があり、それらが繰り返されることで習慣的反応となる。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-185","q":"複数の習慣的反応の背後に存在するとされるものはどれか。","options":["特殊的反応","類型","習慣的反応","特性"],"correct":3,"answer":"特性","explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-186","q":"アイゼンクの特性論について、複数の特性の背後にある、最上位の因子はどれか。","options":["特殊的反応","類型","特性","習慣的反応"],"correct":1,"answer":"類型","explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-187","q":"アイゼンクの特性論について、階層を下位から上位へ並べた正しい順序はどれか。","options":["特殊的反応→習慣的反応→特性→類型","特殊的反応→特性→習慣的反応→類型","習慣的反応→特殊的反応→類型→特性","特性→類型→特殊的反応→習慣的反応"],"correct":0,"answer":"特殊的反応→習慣的反応→特性→類型","explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-188","q":"アイゼンクが示した三つの類型次元の組合せはどれか。","options":["外向性―内向性・協調性・開放性","循環気質・粘着気質・分裂気質","理論型・経済型・審美型","外向性―内向性・神経症的傾向・精神病的傾向"],"correct":3,"answer":"外向性―内向性・神経症的傾向・精神病的傾向","explanation":"アイゼンクは多様な性格特性を、「外向性―内向性」「神経症的傾向」、「精神病的傾向」の3つの類型次元に整理した。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-189","q":"アイゼンクの特性論について、三つの類型次元に含まれないものはどれか。","options":["神経症的傾向","外向性―内向性","精神病的傾向","開放性"],"correct":3,"answer":"開放性","explanation":"アイゼンクは多様な性格特性を、「外向性―内向性」「神経症的傾向」、「精神病的傾向」の3つの類型次元に整理した。したがって、選択肢の中で当てはまらないのは「開放性」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-190","q":"アイゼンクの特性論について、外向性―内向性の生理学的基礎として想定されたものは何か。","options":["消化器系の発達","大脳皮質の興奮・抑制","筋肉と骨の発達","特殊的反応"],"correct":1,"answer":"大脳皮質の興奮・抑制","explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-191","q":"アイゼンクの特性論について、神経症的傾向の生理学的基礎として想定されたものは何か。","options":["胚葉の数","自律神経系の活動","大脳皮質の興奮・抑制","感覚器系の発達"],"correct":1,"answer":"自律神経系の活動","explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-192","q":"アイゼンクの特性論について、二つの生理的次元を取り上げて作成された検査は何か。","options":["Y-G人格検査","MMPI","MPI（モーズレイ性格検査）","16PF"],"correct":2,"answer":"MPI（モーズレイ性格検査）","explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-c-193","q":"5因子モデルについて、語彙研究と因子分析で性格特性を五次元に整理した人物は誰か。","options":["アイゼンク","ロジャーズ","クレッチマー","ゴールドバーグ"],"correct":3,"answer":"ゴールドバーグ","explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-194","q":"5因子モデルについて、ゴールドバーグらの語彙研究が発展させたのは、誰以来の特性研究か。","options":["ユング","オールポート","アイゼンク","アンナ・フロイト"],"correct":1,"answer":"オールポート","explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-195","q":"パーソナリティを基本的な五特性で説明する枠組みを何というか。","options":["5因子モデル","類型論","自己理論","精神力動論"],"correct":0,"answer":"5因子モデル","explanation":"このように5つの特性でパーソナリティを捉える理論的枠組みを5因子モデルという。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-196","q":"5因子モデルについて、活動的である傾向はどの特性か。","options":["外向性","開放性","調和性（協調性）","誠実性（勤勉性）"],"correct":0,"answer":"外向性","explanation":"①活動的な傾向である外向性。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-197","q":"5因子モデルについて、不安・抑うつ・傷つきやすさを示す傾向はどの特性か。","options":["開放性","調和性（協調性）","神経症傾向","誠実性（勤勉性）"],"correct":2,"answer":"神経症傾向","explanation":"②不安や抑うつ、傷つきやすい傾向である神経症傾向。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-198","q":"5因子モデルについて、新しい物事を求める傾向はどの特性か。","options":["外向性","神経症傾向","調和性（協調性）","開放性"],"correct":3,"answer":"開放性","explanation":"③新しい物事を求める傾向である開放性。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-199","q":"5因子モデルについて、共感性や優しさを表す傾向はどの特性か。","options":["誠実性（勤勉性）","調和性（協調性）","外向性","神経症傾向"],"correct":1,"answer":"調和性（協調性）","explanation":"④共感性や優しさを意味する調和性(協調性)。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-200","q":"5因子モデルについて、真面目さや努力家であることを表す傾向はどの特性か。","options":["開放性","調和性（協調性）","外向性","誠実性（勤勉性）"],"correct":3,"answer":"誠実性（勤勉性）","explanation":"⑤真面目さや努力家を意味する誠実性(勤勉性)である。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-201","q":"5因子モデルについて、五つの基本特性を用いる理論的枠組みの別名は何か。","options":["自己理論","状況主義","ビッグファイブ理論","類型論"],"correct":2,"answer":"ビッグファイブ理論","explanation":"ビッグファイブ理論とは、パーソナリティを5つの基本的な特性によって説明する理論である。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-202","q":"人格の5因子モデルを発展させた研究者の組合せはどれか。","options":["オールポートとキャッテル","フロイトとユング","ルフトとインガム","コスタとマックレー"],"correct":3,"answer":"コスタとマックレー","explanation":"また、コスタとマックレーはこのモデルを発展させ、その理論に基づく人格検査としてネオ人格目録改訂版(NEO-PI-R)を開発した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-203","q":"5因子モデルについて、発展した五因子モデルに基づいて開発された人格検査は何か。","options":["NEO-PI-R","MPI","MMPI","Y-G人格検査"],"correct":0,"answer":"NEO-PI-R","explanation":"また、コスタとマックレーはこのモデルを発展させ、その理論に基づく人格検査としてネオ人格目録改訂版(NEO-PI-R)を開発した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-204","q":"5因子モデルについて、五つの特性を整理するために用いられた二つの方法は何か。","options":["語彙研究と因子分析","描画と質疑","自由連想と夢分析","面接と行動観察"],"correct":0,"answer":"語彙研究と因子分析","explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-c-205","q":"一貫性論争について、特性と行動の関連の弱さを指摘して議論の契機を作った人物は誰か。","options":["シェルドン","オールポート","ミッシェル","フロイト"],"correct":2,"answer":"ミッシェル","explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-c-206","q":"行動が特性で一貫して説明できるか、状況で変わるかをめぐる議論を何というか。","options":["一貫性論争","特性論","体験過程理論","経済論"],"correct":0,"answer":"一貫性論争","explanation":"一貫性論争とは、人間の行動がパーソナリティ特性によって一貫して説明できるのか、それとも状況によって変化するのかをめぐる論争である。","section":"19. 一貫性論争"},{"id":"jin1-c-207","q":"一貫性論争について、従来の特性論が行動にあると考えていたものは何か。","options":["時間や状況を超えた一貫性","通状況的一貫性","状況主義","完全な無作為性"],"correct":0,"answer":"時間や状況を超えた一貫性","explanation":"それまでの特性論では、人間の行動には時間や状況を超えた一貫性があると考えられていた。","section":"19. 一貫性論争"},{"id":"jin1-c-208","q":"一貫性論争について、ミッシェルは、性格特性と何との関連が弱いと主張したか。","options":["時間や状況を超えた一貫性","通状況的一貫性","行動","筆跡"],"correct":2,"answer":"行動","explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-c-209","q":"一貫性論争について、行動にみられないと主張された一貫性を何というか。","options":["時間的一貫性","通状況的一貫性","測定的一貫性","遺伝的一貫性"],"correct":1,"answer":"通状況的一貫性","explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-c-210","q":"一貫性論争について、行動理解で重視すべき外的要因の組合せはどれか。","options":["環境と状況","気質と性格","思考と感情","人（特性）と状況"],"correct":0,"answer":"環境と状況","explanation":"また、行動を理解するためには環境や状況といった外的要因も重視すべきであると考えた。","section":"19. 一貫性論争"},{"id":"jin1-c-211","q":"一貫性論争について、外的要因を重視する立場を何というか。","options":["類型論","状況主義","経済論","特性論"],"correct":1,"answer":"状況主義","explanation":"このような立場は状況主義と呼ばれる。","section":"19. 一貫性論争"},{"id":"jin1-c-212","q":"一貫性論争について、論争で対置されたものの組合せはどれか。","options":["環境と状況","自我と自己","受容と共感","人（特性）と状況"],"correct":3,"answer":"人（特性）と状況","explanation":"ミッシェルの主張をきっかけに、「人（特性）」か「状況」かをめぐる議論が活発になり、一貫性論争と呼ばれるようになった。","section":"19. 一貫性論争"},{"id":"jin1-c-213","q":"一貫性論争について、現在、行動は何によって生じると考えられているか。","options":["パーソナリティ特性と状況の相互作用","パーソナリティ特性の直接効果","状況による一方向的な決定","過去経験と無意識の相互作用"],"correct":0,"answer":"パーソナリティ特性と状況の相互作用","explanation":"現在では、行動はパーソナリティ特性と状況との相互作用によって生じると考えられている。","section":"19. 一貫性論争"},{"id":"jin1-c-214","q":"心の局所論について、心を一つの空間として三層に分けた理論の提唱者は誰か。","options":["ホーナイ","コスタとマックレー","クリス","フロイト"],"correct":3,"answer":"フロイト","explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-c-215","q":"心を意識・前意識・無意識に分ける考え方は何か。","options":["自己理論","構造論","心の局所論","体験過程理論"],"correct":2,"answer":"心の局所論","explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-c-216","q":"フロイトの局所論で、心はいくつの層から成るか。","options":["3つ","2つ","10","4つ"],"correct":0,"answer":"3つ","explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-c-217","q":"心の局所論について、直接、自分の経験だと感じることができる心的内容はどれか。","options":["自我","無意識","意識","前意識"],"correct":2,"answer":"意識","explanation":"意識とは、直接的に自分の経験だと感じることができるものをいう。","section":"20. 心の局所論"},{"id":"jin1-c-218","q":"心の局所論について、普段は意識されないが、注意を向ければいつでも意識化できる心的内容はどれか。","options":["自我","前意識","無意識","意識"],"correct":1,"answer":"前意識","explanation":"前意識とは、常に意識されてはいないものの、注意を向ければいつでも意識化できるものをいう。","section":"20. 心の局所論"},{"id":"jin1-c-219","q":"心の局所論について、自覚されていないが、自分に大きな影響を与える心的内容はどれか。","options":["前意識","意識","自我","無意識"],"correct":3,"answer":"無意識","explanation":"無意識とは、自覚されていないものの、自分自身に大きな影響を与えるものをいう。","section":"20. 心の局所論"},{"id":"jin1-c-221","q":"心の局所論について、意識から無意識へ心的内容が移る働きを何というか。","options":["意識化","昇華","抑圧","投影"],"correct":2,"answer":"抑圧","explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-c-222","q":"心の局所論について、無意識から意識へ心的内容が移る働きを何というか。","options":["意識化","否認","退行","置き換え"],"correct":0,"answer":"意識化","explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-c-223","q":"心の局所論について、三領域は固定的な状態ではなく、どのような関係にあるとされるか。","options":["境界を越えない固定的な関係","意識から無意識への一方向の関係","常に移行するダイナミックな関係","相互に影響しない独立した関係"],"correct":2,"answer":"常に移行するダイナミックな関係","explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-c-224","q":"心の局所論について、抑圧された内容を探り、再び自分のものとして意識化する治療過程は何か。","options":["フォーカシング","エンカウンター・グループ","クライエント中心療法","精神分析療法"],"correct":3,"answer":"精神分析療法","explanation":"抑圧されたものを探り、再び自らのものとして意識化していくプロセスを精神分析療法(分析的治療)という。","section":"20. 心の局所論"},{"id":"jin1-c-225","q":"フロイトの局所論では、心の中をどのようなものとして捉えるか。","options":["心の局所論","一つの空間や場所","意識","行動の頻度表"],"correct":1,"answer":"一つの空間や場所","explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-c-226","q":"精神分析療法について、無意識に抑圧された欲求や葛藤の意識化を目指す心理療法を創始した人物は誰か。","options":["フロイト","クレッチマー","ホーナイ","コスタとマックレー"],"correct":0,"answer":"フロイト","explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-c-227","q":"無意識の欲求や葛藤を意識化し、症状や心理的問題の改善を目指す方法は何か。","options":["エンカウンター・グループ","クライエント中心療法","行動療法","精神分析療法"],"correct":3,"answer":"精神分析療法","explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-c-228","q":"精神分析療法で代表的に用いられる技法は何か。","options":["自由連想法","欲求－圧力分析","因子分析","行動目録法"],"correct":0,"answer":"自由連想法","explanation":"代表的な技法として自由連想法が用いられ、クライエントは頭に浮かんだことを自由に話す。","section":"21. 精神分析療法"},{"id":"jin1-c-229","q":"精神分析療法について、自由連想法でクライエントに求められることは何か。","options":["頭に浮かんだことを自由に話す","質問紙へ二択で答える","決められた順に絵を描く","行動頻度を記録する"],"correct":0,"answer":"頭に浮かんだことを自由に話す","explanation":"代表的な技法として自由連想法が用いられ、クライエントは頭に浮かんだことを自由に話す。","section":"21. 精神分析療法"},{"id":"jin1-c-230","q":"精神分析療法について、治療中に黙り込んだり話題をそらしたりする現象を何というか。","options":["抵抗","転移","ワークスルー","洞察"],"correct":0,"answer":"抵抗","explanation":"その過程で、クライエントが黙り込んだり話題を逸らしたりする現象は抵抗と呼ばれ、無意識の葛藤を理解するための重要な手がかりとされる。","section":"21. 精神分析療法"},{"id":"jin1-c-231","q":"精神分析療法について、過去の重要人物へ抱いていた感情をセラピストへ向ける現象を何というか。","options":["洞察","抵抗","ワークスルー","転移"],"correct":3,"answer":"転移","explanation":"また、クライエントが過去の重要な人物に抱いていた感情をセラピストに向ける転移が生じることがある。","section":"21. 精神分析療法"},{"id":"jin1-c-232","q":"精神分析療法について、抵抗や転移を理解し、無意識の葛藤への理解を深めることを何というか。","options":["転移","洞察","抵抗","ワークスルー"],"correct":1,"answer":"洞察","explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-c-233","q":"精神分析療法について、得た理解を現実生活で生かせるよう、繰り返し取り組む過程を何というか。","options":["抵抗","ワークスルー","洞察","転移"],"correct":1,"answer":"ワークスルー","explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-c-234","q":"精神分析療法について、治療中の沈黙や話題の変更は、何を理解する重要な手がかりとされるか。","options":["無意識の葛藤","頭に浮かんだことを自由に話す","抵抗","知能の水準"],"correct":0,"answer":"無意識の葛藤","explanation":"その過程で、クライエントが黙り込んだり話題を逸らしたりする現象は抵抗と呼ばれ、無意識の葛藤を理解するための重要な手がかりとされる。","section":"21. 精神分析療法"},{"id":"jin1-c-235","q":"精神分析療法について、転移の対象となるのは誰か。","options":["フロイト","過去の重要人物そのもの","セラピスト","同じ検査を受ける他者"],"correct":2,"answer":"セラピスト","explanation":"また、クライエントが過去の重要な人物に抱いていた感情をセラピストに向ける転移が生じることがある。","section":"21. 精神分析療法"},{"id":"jin1-c-236","q":"精神分析療法について、徹底操作とも呼ばれる過程はどれか。","options":["抵抗","ワークスルー","洞察","転移"],"correct":1,"answer":"ワークスルー","explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-c-237","q":"精神分析療法について、治療で最終的に改善を目指すものの組合せはどれか。","options":["親のしつけ・社会的規範・道徳","職業と価値観","知能と運動能力","症状と心理的問題"],"correct":3,"answer":"症状と心理的問題","explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-c-238","q":"構造論について、心をイド・自我・超自我で説明する理論の提唱者は誰か。","options":["フロイト","クレッチマー","ホーナイ","コスタとマックレー"],"correct":0,"answer":"フロイト","explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-c-239","q":"心を三つの機構から説明する考え方は何か。","options":["心の局所論","体験過程理論","精神力動論","構造論"],"correct":3,"answer":"構造論","explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-c-240","q":"構造論について、心的機構はいくつ設定されているか。","options":["6つ","35","3つ","8つ"],"correct":2,"answer":"3つ","explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-c-241","q":"構造論について、無意識の領域で本能的欲求や衝動を生み、すぐ満たそうとする機構はどれか。","options":["イド（エス）","自己","超自我","自我"],"correct":0,"answer":"イド（エス）","explanation":"イド（エス）は無意識の領域で、本能的な欲求や衝動を生み出し、それらをすぐに満たそうとする。","section":"22. 構造論"},{"id":"jin1-c-242","q":"構造論について、現実を認識・判断し、イドと外界の仲介役を担う機構はどれか。","options":["自我","自己","超自我","イド（エス）"],"correct":0,"answer":"自我","explanation":"自我はイドと外界との仲介役であり、現実を認識・判断し、適切な行動をとる機能を担うため、現実原則に従う。","section":"22. 構造論"},{"id":"jin1-c-243","q":"構造論について、親のしつけ・社会的規範・道徳が内在化された機構はどれか。","options":["イド（エス）","自己","超自我","自我"],"correct":2,"answer":"超自我","explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-c-245","q":"構造論について、現実原則に従う心的機構はどれか。","options":["イド（エス）","自己","超自我","自我"],"correct":3,"answer":"自我","explanation":"自我はイドと外界との仲介役であり、現実を認識・判断し、適切な行動をとる機能を担うため、現実原則に従う。","section":"22. 構造論"},{"id":"jin1-c-247","q":"構造論について、イドの衝動を抑制する機構はどれか。","options":["超自我","イド（エス）","自己","自我"],"correct":0,"answer":"超自我","explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-c-248","q":"構造論について、自我を道徳的方向へ導く機構はどれか。","options":["自己","超自我","自我","イド（エス）"],"correct":1,"answer":"超自我","explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-c-250","q":"構造論について、内在化される内容の組合せとして正しいものはどれか。","options":["親のしつけ・社会的規範・道徳","意識・前意識・無意識","思考・感情・感覚","自由連想・抵抗・転移"],"correct":0,"answer":"親のしつけ・社会的規範・道徳","explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-c-251","q":"心的機構の相互作用や葛藤で考え・行動・夢などを説明する理論は何か。","options":["状況主義","経済論","精神力動論","類型論"],"correct":2,"answer":"精神力動論","explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-252","q":"三つの機構へ配分される心的エネルギー量で人格を説明する理論は何か。","options":["自己理論","心の局所論","体験過程理論","経済論"],"correct":3,"answer":"経済論","explanation":"経済論とは、パーソナリティを3つの心的機構に配分される心的エネルギーの量によって説明する考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-253","q":"精神力動論・経済論について、局所論と構造論を提唱した人物は誰か。","options":["アンナ・フロイト","大山","フロム","フロイト"],"correct":3,"answer":"フロイト","explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-254","q":"精神力動論・経済論について、相互作用や葛藤を起こす三機構の組合せはどれか。","options":["イド・自我・超自我","外向性・開放性・誠実性","意識・前意識・無意識","思考・感情・感覚"],"correct":0,"answer":"イド・自我・超自我","explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-255","q":"精神力動論の説明対象に含まれるものの組合せはどれか。","options":["イド・自我・超自我","衝動的・感情的・幼児的","考え・行動・夢・空想・神経症症状","理性的・合理的・現実に即した行動"],"correct":2,"answer":"考え・行動・夢・空想・神経症症状","explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-256","q":"精神力動論・経済論について、多くの心的エネルギーが配分されると、衝動的・感情的・幼児的になりやすい機構はどれか。","options":["前意識","自我","超自我","イド"],"correct":3,"answer":"イド","explanation":"例えば、イドに多くのエネルギーが配分されると衝動的・感情的・幼児的な性格になりやすい。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-257","q":"精神力動論・経済論について、強いと良心的・理想主義的になる一方、自分に厳しく完全主義的になりやすい機構はどれか。","options":["超自我","イド","前意識","自我"],"correct":0,"answer":"超自我","explanation":"超自我が強い場合は、良心的で理想主義的な一方、自分に厳しい完全主義的な傾向を示す。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-258","q":"精神力動論・経済論について、強いと理性的・合理的で、現実に即して行動しやすい機構はどれか。","options":["超自我","イド","前意識","自我"],"correct":3,"answer":"自我","explanation":"これに対して自我が強い場合は、理性的・合理的で現実に即した行動をとりやすいと考えられる。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-259","q":"精神力動論・経済論について、イドへの配分が多い場合の特徴の組合せはどれか。","options":["良心的・理想主義的・完全主義的","理性的・合理的・現実的","社交的・親切・温厚","衝動的・感情的・幼児的"],"correct":3,"answer":"衝動的・感情的・幼児的","explanation":"例えば、イドに多くのエネルギーが配分されると衝動的・感情的・幼児的な性格になりやすい。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-260","q":"精神力動論・経済論について、超自我が強い場合の特徴の組合せはどれか。","options":["良心的・理想主義的・自分に厳しい完全主義","衝動的・感情的・幼児的","理性的・合理的・現実的","社交的・寛容・活動的"],"correct":0,"answer":"良心的・理想主義的・自分に厳しい完全主義","explanation":"超自我が強い場合は、良心的で理想主義的な一方、自分に厳しい完全主義的な傾向を示す。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-261","q":"精神力動論・経済論について、自我が強い場合の特徴の組合せはどれか。","options":["衝動的・感情的・幼児的","良心的・理想主義的・完全主義的","非社交的・静か・鈍感","理性的・合理的・現実に即した行動"],"correct":3,"answer":"理性的・合理的・現実に即した行動","explanation":"これに対して自我が強い場合は、理性的・合理的で現実に即した行動をとりやすいと考えられる。","section":"23. 精神力動論・経済論"},{"id":"jin1-c-262","q":"心の健康を維持するうえで、フロイトが重視した心的機構はどれか。","options":["超自我","自我","イド（エス）","自己"],"correct":1,"answer":"自我","explanation":"フロイトは、心の健康を維持するうえで、自我の働きが重要であると考えた。","section":"24. 自我機能への注目"},{"id":"jin1-c-263","q":"自我機能への注目について、自我は何との適応を担う心の機能か。","options":["現実検討機能","適応機能","現実","統合機能"],"correct":2,"answer":"現実","explanation":"自我とは、現実との適応を担う心の機能であり、主に現実検討機能、適応機能、統合機能の3つから成る。","section":"24. 自我機能への注目"},{"id":"jin1-c-264","q":"自我機能への注目について、自我を構成する主要機能はいくつか。","options":["10","4つ","3つ","12"],"correct":2,"answer":"3つ","explanation":"自我とは、現実との適応を担う心の機能であり、主に現実検討機能、適応機能、統合機能の3つから成る。","section":"24. 自我機能への注目"},{"id":"jin1-c-265","q":"自我機能への注目について、外界の出来事や自分の思考・感情を正確に認識する機能はどれか。","options":["統合機能","適応機能","現実検討機能","優越機能"],"correct":2,"answer":"現実検討機能","explanation":"現実検討機能は、外界の出来事や自分の思考・感情を正確に認識する機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-266","q":"自我機能への注目について、現実の状況に応じて適切な行動を選択し、自己実現を図る機能はどれか。","options":["優越機能","適応機能","統合機能","現実検討機能"],"correct":1,"answer":"適応機能","explanation":"適応機能は、現実の状況に応じて適切な行動を選択し、自己実現を図る機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-267","q":"自我機能への注目について、イドや超自我との葛藤や、矛盾する感情を受け入れて一貫した人格へまとめる機能はどれか。","options":["現実検討機能","優越機能","適応機能","統合機能"],"correct":3,"answer":"統合機能","explanation":"統合機能は、エスや超自我との間に生じる葛藤や矛盾する感情を受け入れ、一貫した人格として自己をまとめる機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-269","q":"自我機能への注目について、外界だけでなく正確に認識する自分の内面の組合せはどれか。","options":["価値と職業","夢と空想","イドと超自我","思考と感情"],"correct":3,"answer":"思考と感情","explanation":"現実検討機能は、外界の出来事や自分の思考・感情を正確に認識する機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-270","q":"自我機能への注目について、現実に応じた行動選択によって図るものは何か。","options":["類型化","現実検討機能","自己開示","自己実現"],"correct":3,"answer":"自己実現","explanation":"適応機能は、現実の状況に応じて適切な行動を選択し、自己実現を図る機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-271","q":"自我機能への注目について、統合機能が受け入れてまとめる、二つの心的機構間の葛藤はどれか。","options":["意識と前意識","イドと超自我","自我と自己","思考と感覚"],"correct":1,"answer":"イドと超自我","explanation":"統合機能は、エスや超自我との間に生じる葛藤や矛盾する感情を受け入れ、一貫した人格として自己をまとめる機能である。","section":"24. 自我機能への注目"},{"id":"jin1-c-272","q":"自我機能への注目について、三機能によって可能になる生活のあり方は何か。","options":["衝動を即座に満たす生活","現実社会と調和した適応的生活","社会との接触を避ける生活","道徳規範を優先する硬直した生活"],"correct":1,"answer":"現実社会と調和した適応的生活","explanation":"これらの自我機能によって、人は現実社会と調和しながら適応的に生活することができる。","section":"24. 自我機能への注目"},{"id":"jin1-c-273","q":"つらい感情を引き起こす願望や葛藤から自分を守る、自我の無意識的機制を何というか。","options":["防衛機制","補償作用","自我機能","自己一致"],"correct":0,"answer":"防衛機制","explanation":"防衛機制とは、不安や罪悪感、恥などのつらい感情を引き起こす願望や葛藤から自分を守るために働く、自我の無意識的な心理機制である。","section":"25. 防衛機制"},{"id":"jin1-c-274","q":"防衛機制について、守ろうとするつらい感情の組合せとして資料が挙げるものはどれか。","options":["不安・罪悪感・恥","喜び・安心・誇り","興味・関心・好奇心","社交性・寛容・温厚"],"correct":0,"answer":"不安・罪悪感・恥","explanation":"防衛機制とは、不安や罪悪感、恥などのつらい感情を引き起こす願望や葛藤から自分を守るために働く、自我の無意識的な心理機制である。","section":"25. 防衛機制"},{"id":"jin1-c-275","q":"防衛機制について、受け入れがたい内容へ無意識に行う二つの処理は何か。","options":["測定することと採点すること","比較することと分類すること","観察することと記録すること","抑え込むことと別の形へ変換すること"],"correct":3,"answer":"抑え込むことと別の形へ変換すること","explanation":"受け入れがたい心的内容を無意識に抑え込んだり、別の形に変換したりすることで、心の安定を維持しようとする。","section":"25. 防衛機制"},{"id":"jin1-c-276","q":"防衛機制が維持しようとするものは何か。","options":["現実への適応","神経症的防衛機制","心の安定","職業的地位"],"correct":2,"answer":"心の安定","explanation":"受け入れがたい心的内容を無意識に抑え込んだり、別の形に変換したりすることで、心の安定を維持しようとする。","section":"25. 防衛機制"},{"id":"jin1-c-277","q":"防衛機制について、『防衛』の概念を提唱した人物は誰か。","options":["フロイト","ミッシェル","ルフトとインガム","シュプランガー"],"correct":0,"answer":"フロイト","explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-c-278","q":"防衛機制について、防衛を体系的な機制として整理した人物は誰か。","options":["アンナ・フロイト","クリス","ユング","キャッテル"],"correct":0,"answer":"アンナ・フロイト","explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-c-279","q":"防衛機制について、体系化した人物は、概念を提唱した人物とどのような関係か。","options":["姉","娘","師","患者"],"correct":1,"answer":"娘","explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-c-280","q":"資料に列挙された九つの代表的な防衛機制の組合せはどれか。","options":["抑圧・投影・退行・同化・調節・合理化・知性化・昇華・洞察","抑圧・投影・退行・反動形成・同一化・置き換え・合理化・知性化・昇華","否認・分裂・取り入れ・転移・逆転移・同一化・合理化・知性化・昇華","抑圧・投影・退行・反動形成・同一化・置き換え・共感・受容・純粋性"],"correct":1,"answer":"抑圧・投影・退行・反動形成・同一化・置き換え・合理化・知性化・昇華","explanation":"代表的なものには、抑圧、投影、退行、反動形成、同一化、置き換え、合理化、知性化、昇華などがある。","section":"25. 防衛機制"},{"id":"jin1-c-281","q":"防衛機制について、本来は心を守る働きでも、過度に使うと何を妨げることがあるか。","options":["現実への適応","心の安定","胚葉の形成","身体の成長"],"correct":0,"answer":"現実への適応","explanation":"防衛機制は本来、心を守るための働きであるが、過度に用いられると現実への適応を妨げることがある。","section":"25. 防衛機制"},{"id":"jin1-c-282","q":"抑圧や合理化が分類されるまとまりはどれか。","options":["自我機能","原始的防衛機制","類型次元","神経症的防衛機制"],"correct":3,"answer":"神経症的防衛機制","explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-c-283","q":"分裂や投影性同一視が分類されるまとまりはどれか。","options":["類型次元","自我機能","神経症的防衛機制","原始的防衛機制"],"correct":3,"answer":"原始的防衛機制","explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-c-284","q":"防衛機制について、原始的なものの例として挙げられている二つは何か。","options":["否認と歪曲","分裂と投影性同一視","意識化と洞察","抑圧と合理化"],"correct":1,"answer":"分裂と投影性同一視","explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-c-285","q":"分析心理学を提唱した人物は誰か。","options":["クレッチマー","オールポート","ユング","ミッシェル"],"correct":2,"answer":"ユング","explanation":"分析心理学は、ユングによって提唱された理論・治療体系である。","section":"26. 分析心理学"},{"id":"jin1-c-286","q":"ユングが提唱した理論・治療体系を何というか。","options":["分析心理学","経済論","特性論","自己理論"],"correct":0,"answer":"分析心理学","explanation":"分析心理学は、ユングによって提唱された理論・治療体系である。","section":"26. 分析心理学"},{"id":"jin1-c-287","q":"分析心理学について、フロイトと異なり、リビドーを何に限定しなかったか。","options":["現実検討","社会的価値","性的エネルギー","心的エネルギー"],"correct":2,"answer":"性的エネルギー","explanation":"ユングはリビドーを性的エネルギーに限定せず、人間のあらゆる活動を支える心的エネルギーとして捉えた。","section":"26. 分析心理学"},{"id":"jin1-c-288","q":"分析心理学について、ユングがリビドーをどのように捉えたか。","options":["人間のあらゆる活動を支える心的エネルギー","性的活動に限られる心的エネルギー","外界への適応を担う自我の機能","社会から個人に加わる外的圧力"],"correct":0,"answer":"人間のあらゆる活動を支える心的エネルギー","explanation":"ユングはリビドーを性的エネルギーに限定せず、人間のあらゆる活動を支える心的エネルギーとして捉えた。","section":"26. 分析心理学"},{"id":"jin1-c-289","q":"分析心理学について、無意識を分けた二つの層は何か。","options":["自我と自己","個人的無意識と普遍的（集合的）無意識","外向型と内向型","意識と前意識"],"correct":1,"answer":"個人的無意識と普遍的（集合的）無意識","explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-c-290","q":"分析心理学について、普遍的イメージの型を何というか。","options":["フェルトセンス","ハンドル","コンプレックス","元型（アーキタイプ）"],"correct":3,"answer":"元型（アーキタイプ）","explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-c-291","q":"分析心理学について、元型の例として挙げられているイメージは何か。","options":["数や文字","母親や英雄","家や木","山や川"],"correct":1,"answer":"母親や英雄","explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-c-292","q":"分析心理学について、心の調和は何と何が相補的に働くことで保たれるか。","options":["意識と無意識","イドと超自我","性的エネルギー","思考と感覚"],"correct":0,"answer":"意識と無意識","explanation":"さらに、人の心は意識と無意識が相補的に働くことで調和が保たれると考え、その両者を統合しながら自己実現を目指す過程を個性化過程と呼んだ。","section":"26. 分析心理学"},{"id":"jin1-c-293","q":"分析心理学について、意識と無意識を統合しながら自己実現を目指す過程は何か。","options":["ワークスルー","個性化過程","自由連想","自己開示"],"correct":1,"answer":"個性化過程","explanation":"さらに、人の心は意識と無意識が相補的に働くことで調和が保たれると考え、その両者を統合しながら自己実現を目指す過程を個性化過程と呼んだ。","section":"26. 分析心理学"},{"id":"jin1-c-294","q":"分析心理学について、症状や問題を、より良い生き方へ導く意味あるものとして捉える視点は何か。","options":["特性論","原因論的視点","状況主義","目的論的視点"],"correct":3,"answer":"目的論的視点","explanation":"また、症状や問題を単に除去すべきものではなく、より良い生き方へ導くための意味あるメッセージとして捉える目的論的視点を重視した。","section":"26. 分析心理学"},{"id":"jin1-c-295","q":"分析心理学について、ユングの心理療法では、症状を単にどうすべきものとは考えないか。","options":["意味を検討すべきもの","除去すべきもの","生き方へのメッセージ","理解すべきもの"],"correct":1,"answer":"除去すべきもの","explanation":"また、症状や問題を単に除去すべきものではなく、より良い生き方へ導くための意味あるメッセージとして捉える目的論的視点を重視した。","section":"26. 分析心理学"},{"id":"jin1-c-296","q":"個性化について、意識された心の中心を何というか。","options":["自己","自我","イド","超自我"],"correct":1,"answer":"自我","explanation":"ユングは、意識された心の中心を自我、意識と無意識を含む心全体の中心を自己と考えた。","section":"27. 個性化"},{"id":"jin1-c-297","q":"個性化について、意識と無意識を含む心全体の中心を何というか。","options":["ペルソナ","自己","自我","イド"],"correct":1,"answer":"自己","explanation":"ユングは、意識された心の中心を自我、意識と無意識を含む心全体の中心を自己と考えた。","section":"27. 個性化"},{"id":"jin1-c-298","q":"個性化について、思考や感情をまとめながら外界に適応するものはどれか。","options":["アニマ","自我","自己","シャドウ"],"correct":1,"answer":"自我","explanation":"自我は、自分の思考や感情をまとめながら外界に適応し、意識の主体性や統合性を維持する働きを担う。","section":"27. 個性化"},{"id":"jin1-c-299","q":"個性化について、意識の主体性と統合性を維持するものはどれか。","options":["コンプレックス","ペルソナ","自我","自己"],"correct":2,"answer":"自我","explanation":"自我は、自分の思考や感情をまとめながら外界に適応し、意識の主体性や統合性を維持する働きを担う。","section":"27. 個性化"},{"id":"jin1-c-300","q":"個性化について、人格全体を統合し、より高次の全体性を目指すものはどれか。","options":["ペルソナ","自我","イド","自
