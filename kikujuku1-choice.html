<body><main class="wrap">
<div class="topbar"><button type="button" class="menuToggle" id="menuToggle">メニューを非表示</button></div>
<section class="card" id="introCard"><h1>キクジュク1 4択問題集</h1><div class="sub">「キクジュク1.pdf」のDay 1〜10・001〜160をもとにした、GitHub Pagesでそのまま使える1ファイル版です。熟語・定型表現の英語→日本語と日本語→英語を学習できます。未解答・誤答回数別の復習にも対応しています。</div><div class="note">収録：160表現（Day 1〜10）</div></section>
<section class="card" id="menuCard"><div class="controls">

<div><label>出題範囲</label><select id="scope"><option value="all">すべて</option><option value="day1">Day 1</option><option value="day2">Day 2</option><option value="day3">Day 3</option><option value="day4">Day 4</option><option value="day5">Day 5</option><option value="day6">Day 6</option><option value="day7">Day 7</option><option value="day8">Day 8</option><option value="day9">Day 9</option><option value="day10">Day 10</option><option value="unanswered">☆ 未解答だけ</option><option value="wrong">★ 間違えた問題だけ</option><option value="wrong1">★ 1回以上間違えた問題</option><option value="wrong2">★ 2回以上間違えた問題</option></select></div>
</div><div class="actions"><button class="btn primary" id="start">出題開始 / 次の問題</button><button class="btn ghost" id="shuffle">ランダムで次へ</button><button class="btn danger" id="reset">学習データをリセット</button></div></section>
<section class="card stats" id="statsCard"><div class="stat"><strong id="answered">0</strong><span>回答数</span></div><div class="stat"><strong id="correct">0</strong><span>正解</span></div><div class="stat"><strong id="rate">0%</strong><span>正答率</span></div><div class="stat"><strong id="pool">0</strong><span>出題候補</span></div></section>

,"day":7},{"id":103,"en":"make use of A","ja":"Aを利用する","day":7},{"id":104,"en":"make the most [best] of A","ja":"Aを最大限に利用する","day":7},{"id":105,"en":"turn on A [A on]","ja":"A（電気など）をつける","day":7},{"id":106,"en":"turn off A [A off]","ja":"A（電気など）を消す","day":7},{"id":107,"en":"turn out A","ja":"結局Aになる、Aであることが判明する","day":7},{"id":108,"en":"turn into A","ja":"Aに変わる","day":7},{"id":109,"en":"turn up A [A up]","ja":"A（音量など）を上げる、現れる","day":7},{"id":110,"en":"turn in A [A in]","ja":"Aを提出する、Aを中に入れる","day":7},{"id":111,"en":"turn down A [A down]","ja":"Aを断る、A（音量など）を下げる","day":7},{"id":112,"en":"turn to A","ja":"Aに頼る、Aへ向かう","day":7},{"id":113,"en":"look for A","ja":"Aを探す","day":8},{"id":114,"en":"look forward to A","ja":"Aを楽しみに待つ","day":8},{"id":115,"en":"look up A [A up]","ja":"Aを調べる、Aを見上げる","day":8},{"id":116,"en":"look to [toward] A","ja":"Aに頼る、Aに目を向ける","day":8},{"id":117,"en":"look into A","ja":"Aを調査する、研究する","day":8},{"id":118,"en":"look on","ja":"傍観する、見物する","day":8},{"id":119,"en":"look after A","ja":"Aの世話をする","day":8},{"id":120,"en":"look out for A","ja":"Aを警戒する、Aに用心する","day":8},{"id":121,"en":"look over A [A over]","ja":"Aにざっと目を通す","day":8},{"id":122,"en":"look back","ja":"回顧する","day":8},{"id":123,"en":"look up to A","ja":"Aを尊敬する","day":8},{"id":124,"en":"look down on [upon] A","ja":"Aを見下す","day":8},{"id":125,"en":"see to A","ja":"Aの世話をする、Aに対処する","day":8},{"id":126,"en":"see off A [A off]","ja":"Aを見送る","day":8},{"id":127,"en":"watch out for A","ja":"Aに警戒する、Aに用心する","day":8},{"id":128,"en":"watch over A","ja":"Aを見守る","day":8},{"id":129,"en":"speaking [talking] of A","ja":"Aと言えば","day":9},{"id":130,"en":"speak out [up]","ja":"遠慮なく意見を述べる","day":9},{"id":131,"en":"so to speak [say]","ja":"いわば","day":9},{"id":132,"en":"generally speaking","ja":"一般的に言って","day":9},{"id":133,"en":"strictly speaking","ja":"厳密に言えば","day":9},{"id":134,"en":"frankly speaking","ja":"率直に言えば","day":9},{"id":135,"en":"speak ill [badly] of A","ja":"Aのことを悪く言う","day":9},{"id":136,"en":"speak well of A","ja" const STORAGE="kikujuku1_choice_stats", MENUKEY="kikujuku1_choice_menu_hidden";

const $=id=>document.getElementById(id);
let stats=JSON.parse(localStorage.getItem(STORAGE)||'{}');
let current=null,currentMode=null;
let session={answered:0,correct:0};

function keyOf(x,mode=currentMode){return mode+'::'+x.id}
function getStat(x,mode=currentMode){return stats[keyOf(x,mode)]||{correct:0,wrong:0}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(stats))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pool(){
 let arr=WORDS.slice(), s=$('scope').value;
 if(/^day\d+$/.test(s)){const d=Number(s.replace('day',''));arr=arr.filter(x=>x.day===d)}
 if(s==='unanswered') arr=arr.filter(x=>{const st=getStat(x);return st.correct===0&&st.wrong===0});
 if(s==='wrong'||s==='wrong1') arr=arr.filter(x=>getStat(x).wrong>=1);
 if(s==='wrong2') arr=arr.filter(x=>getStat(x).wrong>=2);
 return arr;
}
function updateStats(){
 const p=pool(); $('pool').textContent=p.length; $('answered').textContent=session.answered; $('correct').textContent=session.correct;
 $('rate').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'0%';
}
function sample(arr,n,exclude){
 let a=arr.filter(x=>x!==exclude).slice().sort(()=>Math.random()-.5);
 return a.slice(0,n);
}
function nextQ(){
 currentMode=$('mode').value;
 const p=pool();
 if(!p.length){$('word').textContent='該当する問題がありません';$('body').innerHTML='';$('feedback').classList.add('hidden');$('check').classList.add('hidden');$('next').classList.add('hidden');updateStats();return}
 current=p[Math.floor(Math.random()*p.length)];
 $('kind').textContent=currentMode.startsWith('ja')?'英語 → 日本語':'日本語 → 英語';
 $('day').textContent='Day '+current.day;
 const st=getStat(current); $('miss').textContent='誤答 '+st.wrong+'回';
 $('feedback').classList.add('hidden');$('feedback').innerHTML='';$('check').classList.add('hidden');$('next').classList.add('hidden');
 renderBody();updateStats();
}
function mark(ok){
 let s=getStat(current); if(ok)s.correct++;else s.wrong++; stats[keyOf(current)]=s; save();
 session.answered++; if(ok)session.correct++; updateStats(); $('miss').textContent='誤答 '+s.wrong+'回'; $('next').classList.remove('hidden')
}
function showFeedback(ok,text){$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<strong>${ok?'○ 正解':'× 不正解'}</strong><br>${esc(text)}`}
$('start').addEventListener('click',nextQ);$('shuffle').addEventListener('click',nextQ);$('next').addEventListener('click',nextQ);$('scope').addEventListener('change',updateStats);$('mode').addEventListener('change',()=>{if(current)nextQ()});
$('reset').addEventListener('click',()=>{if(confirm('正答・誤答の学習データをすべて消しますか？')){stats={};session={answered:0,correct:0};save();updateStats();nextQ()}});
let menuIsHidden=localStorage.getItem(MENUKEY)==='1';
function applyMenuVisibility(){['introCard','menuCard','statsCard'].forEach(id=>$(id).classList.toggle('menuHidden',menuIsHidden));$('menuToggle').textContent=menuIsHidden?'メニューを表示':'メニューを非表示'}
$('menuToggle').addEventListener('click',()=>{menuIsHidden=!menuIsHidden;localStorage.setItem(MENUKEY,menuIsHidden?'1':'0');applyMenuVisibility()});
applyMenuVisibility();updateStats();

function renderBody(){

   $('word').textContent=current.en;
   let opts=[current,...sample(WORDS,3,current)].sort(()=>Math.random()-.5);
   const wrap=document.createElement('div');wrap.className='choices';
   opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=x.ja;btn.addEventListener('click',()=>grade(btn,x===current,wrap,'ja'));wrap.appendChild(btn)});b.appendChild(wrap);
 }else{
   $('word').textContent=current.ja;
   let opts=[current,...sample(WORDS,3,current)].sort(()=>Math.random()-.5);
   const wrap=document.createElement('div');wrap.className='choices';
   opts.forEach(x=>{let btn=document.createElement('button');btn.className='choice';btn.textContent=x.en;btn.addEventListener('click',()=>grade(btn,x===current,wrap,'en'));wrap.appendChild(btn)});b.appendChild(wrap);
 }
}
function grade(btn,ok,wrap,dir){
 [...wrap.children].forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');
 const ans=dir==='ja'?current.ja:current.en;
 if(!ok){[...wrap.children].find(x=>x.textContent===ans)?.classList.add('correct')}
 showFeedback(ok,'正解：'+ans);mark(ok)
}

</script></body></html>
