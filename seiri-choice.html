<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>生理心理学｜4択問題</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#667085;--line:#e4e7ec;--accent:#344054;--soft:#f2f4f7;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headerin{max-width:900px;margin:auto;padding:11px 14px}.title{font-size:17px;font-weight:800;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:14px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.panel{padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}
button,select,input{font:inherit}button,.btn,select{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.stat{background:#f8fafc;border-radius:10px;padding:7px 8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}
.card{padding:18px}.qno{font-size:12px;color:var(--muted);margin-bottom:6px}.question{font-size:18px;font-weight:750;line-height:1.7;margin:0 0 14px}.options{display:grid;gap:9px}.opt{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid #d0d5dd;background:#fff}.opt:hover{background:#f9fafb}.opt.correct{border-color:var(--good);background:#ecfdf3}.opt.wrong{border-color:var(--bad);background:#fef3f2}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.feedback.good{border-color:#a6f4c5}.feedback.bad{border-color:#fecdca}.answer{font-weight:800}.topic{margin-top:7px;color:var(--muted);font-size:12px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.nav button{flex:1}.nav button:nth-child(2){flex:1.4}
.empty{text-align:center;padding:28px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.links a{text-decoration:none;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:9px;color:var(--accent);font-size:12px}
.shortInput{display:flex;gap:8px}.shortInput input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:11px;min-width:0}.selfrow{display:flex;gap:8px;margin-top:9px}.selfrow button{flex:1}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.question{font-size:16px}.card{padding:14px}.headerin{padding-top:8px}.wrap{padding:10px}.shortInput{display:block}.shortInput button{width:100%;margin-top:8px}}
</style></head><body><header><div class="headerin"><h1 class="title">生理心理学｜4択問題</h1><div class="sub">4択｜115問｜出典：神経・生理心理学(3).pdf</div><div class="links"><a href="index.html">トップ</a><a href="shinkei-choice.html">神経4択</a><a href="shinkei-short.html">神経一問一答</a><a href="seiri-choice.html">生理4択</a><a href="seiri-short.html">生理一問一答</a></div></div></header><main class="wrap"><section class="panel"><div class="row"><select onchange="setFilter(this.value)"><option value="all">全問題</option><option value="unanswered">未回答</option><option value="lastwrong">前回不正解</option><option value="everwrong">一度でも間違えた</option><option value="wrong2">2回以上間違えた</option><option value="wrong3">3回以上間違えた</option></select><button id="randomBtn" onclick="toggleRandom()">ランダムOFF</button><button onclick="resetSession()">セッション成績リセット</button><button class="danger" onclick="resetAll()">全記録リセット</button><span id="countLabel" class="small"></span></div><div class="stats"><div class="stat"><b id="sAnswered">0</b><span>今回の回答</span></div><div class="stat"><b id="sCorrect">0</b><span>今回の正解</span></div><div class="stat"><b id="cDone">0</b><span>累積：回答済み</span></div><div class="stat"><b id="cWrong">0</b><span>累積：誤答回数</span></div></div></section><section id="card" class="card"></section></main><script>const QUESTIONS=[{"q":"生命維持のために、生体が自己の状態を比較的安定した平衡状態に保とうとする機能。 この内容に最も当てはまる用語はどれか。","options":["ホメオスタシス","闘争―逃走反応","皮膚電気活動（EDA）","通電法"],"answer":"ホメオスタシス","exp":"生命維持のために、生体が自己の状態を比較的安定した平衡状態に保とうとする機能。","topic":"生理基礎","id":"pmc_3a27251ef238"},{"q":"危険に曝されたときの交感神経活動の亢進と副腎髄質からのアドレナリン分泌を中心とする反応。 この内容に最も当てはまる用語はどれか。","options":["闘争―逃走反応","電位法","エクリン汗腺","アポクリン汗腺"],"answer":"闘争―逃走反応","exp":"危険に曝されたときの交感神経活動の亢進と副腎髄質からのアドレナリン分泌を中心とする反応。","topic":"生理基礎","id":"pmc_61036356fc01"},{"q":"精神性発汗を電気的に捉え、自律神経系の変化、ストレスや覚醒度の測定に用いられる指標。 この内容に最も当てはまる用語はどれか。","options":["皮膚電気活動（EDA）","通電法","電位法","エクリン汗腺"],"answer":"皮膚電気活動（EDA）","exp":"精神性発汗を電気的に捉え、自律神経系の変化、ストレスや覚醒度の測定に用いられる指標。","topic":"EDA","id":"pmc_c111a6d4ae60"},{"q":"手掌や手指の一対の電極間に微弱な電流を流し、皮膚の見かけ上の抵抗変化を調べる測定法。 この内容に最も当てはまる用語はどれか。","options":["通電法","電位法","皮膚コンダクタンス水準（SCL）","皮膚コンダクタンス反応（SCR）"],"answer":"通電法","exp":"手掌や手指の一対の電極間に微弱な電流を流し、皮膚の見かけ上の抵抗変化を調べる測定法。","topic":"EDA","id":"pmc_fec88dd53fd1"},{"q":"微弱な電流を流さず、一対の電極間の電位差を直接測定する方法。 この内容に最も当てはまる用語はどれか。","options":["電位法","通電法","皮膚コンダクタンス水準（SCL）","皮膚コンダクタンス反応（SCR）"],"answer":"電位法","exp":"微弱な電流を流さず、一対の電極間の電位差を直接測定する方法。","topic":"EDA","id":"pmc_1e7d31ff2d96"},{"q":"身体の全面に存在し、体温調節に深く関与し、EDAに関係する汗腺。 この内容に最も当てはまる用語はどれか。","options":["エクリン汗腺","アポクリン汗腺","皮膚コンダクタンス水準（SCL）","皮膚コンダクタンス反応（SCR）"],"answer":"エクリン汗腺","exp":"身体の全面に存在し、体温調節に深く関与し、EDAに関係する汗腺。","topic":"EDA","id":"pmc_6028aba23fe5"},{"q":"EDAとはほとんど関係がない汗腺。 この内容に最も当てはまる用語はどれか。","options":["アポクリン汗腺","エクリン汗腺","皮膚コンダクタンス水準（SCL）","皮膚コンダクタンス反応（SCR）"],"answer":"アポクリン汗腺","exp":"資料ではEDAとはほとんど関係がないとされる汗腺。","topic":"EDA","id":"pmc_d8c90d99e41f"},{"q":"同一音を反復呈示した同一音の反復呈示では、健常者では安静時・音呈示の両セッションで連続的に低下した指標。 この内容に最も当てはまる用語はどれか。","options":["皮膚コンダクタンス水準（SCL）","皮膚コンダクタンス反応（SCR）","皮膚電気活動（EDA）","電位法"],"answer":"皮膚コンダクタンス水準（SCL）","exp":"同一音を反復呈示した資料中の例で、健常者では安静時・音呈示の両セッションで連続的に低下した指標。","topic":"EDA","id":"pmc_402033fc36e3"},{"q":"同一音を反復呈示した健常者では初期に大きな反応を示し、その後に急激な慣れの勾配がみられた指標。 この内容に最も当てはまる用語はどれか。","options":["皮膚コンダクタンス反応（SCR）","皮膚コンダクタンス水準（SCL）","皮膚電気活動（EDA）","電位法"],"answer":"皮膚コンダクタンス反応（SCR）","exp":"資料中の健常者では初期に大きな反応を示し、その後に急激な慣れの勾配がみられた指標。","topic":"EDA","id":"pmc_6f0ec044a1ad"},{"q":"心臓をはさんだ体表面に電極を置き、心臓の活動を電気的に記録したもの。 この内容に最も当てはまる用語はどれか。","options":["心電図（ECG）","心拍変動性（HRV）","血圧","心臓優位パターン"],"answer":"心電図（ECG）","exp":"心臓をはさんだ体表面に電極を置き、心臓の活動を電気的に記録したもの。","topic":"循環","id":"pmc_eb3c98262c18"},{"q":"一定時間内の心臓の鼓動回数を示す指標。 この内容に最も当てはまる用語はどれか。","options":["心拍数（HR）","血管優位パターン","血液容積脈（BVP）","心電図（ECG）"],"answer":"心拍数（HR）","exp":"一定時間内の心臓の鼓動回数を示す指標。","topic":"循環","id":"pmc_c936b4f4f834"},{"q":"環境中で新しい刺激に遭遇したとき、それを探索し見極めようとする反応。 この内容に最も当てはまる用語はどれか。","options":["定位反応","心拍数（HR）","呼吸性洞性不整脈（RSA）","心拍変動性（HRV）"],"answer":"定位反応","exp":"環境中で新しい刺激に遭遇したとき、それを探索し見極めようとする反応。","topic":"循環","id":"pmc_96a4f3b41df6"},{"q":"呼吸によって瞬時心拍数が変動する現象。 この内容に最も当てはまる用語はどれか。","options":["呼吸性洞性不整脈（RSA）","血圧","心臓優位パターン","血管優位パターン"],"answer":"呼吸性洞性不整脈（RSA）","exp":"呼吸によって瞬時心拍数が変動する現象。","topic":"循環","id":"pmc_fe0657271c9d"},{"q":"心拍のR−R間隔の変動を示し、自律神経活動の指標として用いられるもの。 この内容に最も当てはまる用語はどれか。","options":["心拍変動性（HRV）","血液容積脈（BVP）","心電図（ECG）","心拍数（HR）"],"answer":"心拍変動性（HRV）","exp":"心拍のR−R間隔の変動を示し、自律神経活動の指標として用いられるもの。","topic":"循環","id":"pmc_518d509b88e4"},{"q":"動脈管内を流れる血液の側圧にほぼ等しい指標。 この内容に最も当てはまる用語はどれか。","options":["血圧","定位反応","呼吸性洞性不整脈（RSA）","心拍変動性（HRV）"],"answer":"血圧","exp":"資料では、動脈管内を流れる血液の側圧にほぼ等しいと説明される指標。","topic":"循環","id":"pmc_b14e20cba905"},{"q":"能動的対処で課題に積極的に関わるときに生じ、心拍出量が増加し骨格筋への血流が増える反応パターン。 この内容に最も当てはまる用語はどれか。","options":["心臓優位パターン","血圧","血管優位パターン","血液容積脈（BVP）"],"answer":"心臓優位パターン","exp":"能動的対処で課題に積極的に関わるときに生じ、心拍出量が増加し骨格筋への血流が増える反応パターン。","topic":"循環","id":"pmc_97998f6e64d3"},{"q":"受動的対処や回避・耐える状況で生じ、末梢血管抵抗が上昇して血圧が上がる反応パターン。 この内容に最も当てはまる用語はどれか。","options":["血管優位パターン","心電図（ECG）","心拍数（HR）","定位反応"],"answer":"血管優位パターン","exp":"受動的対処や回避・耐える状況で生じ、末梢血管抵抗が上昇して血圧が上がる反応パターン。","topic":"循環","id":"pmc_57c8c1fd875e"},{"q":"熱心に仕事へ打ち込んでいた人が、突然意欲を失い心身の不調を抱える現象。 この内容に最も当てはまる用語はどれか。","options":["燃え尽き症候群","分泌型免疫グロブリンA","プラセボ効果","SAM系"],"answer":"燃え尽き症候群","exp":"熱心に仕事へ打ち込んでいた人が、突然意欲を失い心身の不調を抱える現象。","topic":"ストレス","id":"pmc_995408bced4a"},{"q":"心拍に伴って生じる末梢血管の血圧量変化を記録した生理指標。 この内容に最も当てはまる用語はどれか。","options":["血液容積脈（BVP）","心臓優位パターン","血管優位パターン","心電図（ECG）"],"answer":"血液容積脈（BVP）","exp":"心拍に伴って生じる末梢血管の血圧量変化を記録した生理指標。","topic":"循環","id":"pmc_1317fc789099"},{"q":"本来効果のない薬などでも、暗示的作用によって一定程度の改善効果が現れる現象。 この内容に最も当てはまる用語はどれか。","options":["プラセボ効果","SAM系","HPA系","分泌型免疫グロブリンA"],"answer":"プラセボ効果","exp":"本来効果のない薬などでも、暗示的作用によって一定程度の改善効果が現れる現象。","topic":"ストレス","id":"pmc_52e0942859c3"},{"q":"交感神経末端や副腎髄質からカテコールアミンが分泌され、瞳孔散大、末梢血管収縮、血圧上昇、心拍出量増加などを生じるストレス反応系。 この内容に最も当てはまる用語はどれか。","options":["SAM系","燃え尽き症候群","プラセボ効果","HPA系"],"answer":"SAM系","exp":"交感神経末端や副腎髄質からカテコールアミンが分泌され、瞳孔散大、末梢血管収縮、血圧上昇、心拍出量増加などを生じるストレス反応系。","topic":"ストレス","id":"pmc_dea5388d9648"},{"q":"視床下部からCRH、下垂体前葉からACTH、副腎皮質からコルチゾールへとつながるストレス反応系。 この内容に最も当てはまる用語はどれか。","options":["HPA系","分泌型免疫グロブリンA","燃え尽き症候群","プラセボ効果"],"answer":"HPA系","exp":"視床下部からCRH、下垂体前葉からACTH、副腎皮質からコルチゾールへとつながるストレス反応系。","topic":"ストレス","id":"pmc_a3d31cfc0e53"},{"q":"B細胞によって作られ、口腔・気道・腸管などの粘膜上で病原体の増殖を防ぐ抗体。 この内容に最も当てはまる用語はどれか。","options":["分泌型免疫グロブリンA","SAM系","HPA系","燃え尽き症候群"],"answer":"分泌型免疫グロブリンA","exp":"B細胞によって作られ、口腔・気道・腸管などの粘膜上で病原体の増殖を防ぐ抗体。","topic":"ストレス","id":"pmc_83840504a3a2"},{"q":"筋活動電位を記録したもの。 この内容に最も当てはまる用語はどれか。","options":["筋電図（EMG）","心電図（ECG）","脳波（EEG）","血液容積脈（BVP）"],"answer":"筋電図（EMG）","exp":"筋活動電位を記録したもの。","topic":"生理計測","id":"pmc_fd756161cd1e"},{"q":"生理反応の情報を視覚・聴覚など知覚可能な形で示し、意図的な自己調整を促すオペラント条件づけに基づく技法。 この内容に最も当てはまる用語はどれか。","options":["バイオ・フィードバック療法","プラセボ効果","ホメオスタシス","闘争―逃走反応"],"answer":"バイオ・フィードバック療法","exp":"生理反応の情報を視覚・聴覚など知覚可能な形で示し、意図的な自己調整を促すオペラント条件づけに基づく技法。","topic":"生理計測","id":"pmc_badb70719d36"},{"q":"手指の運動機能自体に障害がないのに、文字を書こうとすると震えや硬直が生じる症状。 この内容に最も当てはまる用語はどれか。","options":["書痙","燃え尽き症候群","てんかん","遂行機能障害"],"answer":"書痙","exp":"手指の運動機能自体に障害がないのに、文字を書こうとすると震えや硬直が生じる症状。","topic":"生理計測","id":"pmc_dc1ad8bfd221"},{"q":"神経細胞の集団が示す電気活動を頭皮上の電極などで記録し、進行する脳機能の変動を総和的に捉えるもの。 この内容に最も当てはまる用語はどれか。","options":["脳波（EEG）","棘波","鋭波","α波"],"answer":"脳波（EEG）","exp":"神経細胞の集団が示す電気活動を頭皮上の電極などで記録し、進行する脳機能の変動を総和的に捉えるもの。","topic":"脳波","id":"pmc_a7412251bb15"},{"q":"8～13Hz程度で、閉眼安静時に出現する脳波。 この内容に最も当てはまる用語はどれか。","options":["α波","β波","θ波","δ波"],"answer":"α波","exp":"8～13Hz程度で、閉眼安静時に出現する脳波。","topic":"脳波","id":"pmc_eb9cefa0c8ef"},{"q":"13Hz以上で精神活動時にみられ、速波とも呼ばれる脳波。 この内容に最も当てはまる用語はどれか。","options":["β波","α波","θ波","δ波"],"answer":"β波","exp":"13Hz以上で精神活動時にみられ、速波とも呼ばれる脳波。","topic":"脳波","id":"pmc_010ddb5a8a32"},{"q":"4～7Hz程度で入眠時にみられる脳波。 この内容に最も当てはまる用語はどれか。","options":["θ波","α波","β波","δ波"],"answer":"θ波","exp":"4～7Hz程度で入眠時にみられる脳波。","topic":"脳波","id":"pmc_2796cb3dbda1"},{"q":"4Hz以下で、眠りが深くなると出現する脳波。 この内容に最も当てはまる用語はどれか。","options":["δ波","α波","β波","θ波"],"answer":"δ波","exp":"4Hz以下で、眠りが深くなると出現する脳波。","topic":"脳波","id":"pmc_f75f44cbf606"},{"q":"睡眠段階2でみられる、12～14Hz・0.5秒以上持続する明瞭な波。 この内容に最も当てはまる用語はどれか。","options":["紡錘波","棘波","鋭波","δ波"],"answer":"紡錘波","exp":"睡眠段階2でみられる、12～14Hz・0.5秒以上持続する明瞭な波。","topic":"脳波","id":"pmc_ff41069870b0"},{"q":"大脳神経細胞の異常な興奮により反復性の発作が引き起こされる慢性の病気。 この内容に最も当てはまる用語はどれか。","options":["てんかん","脳波（EEG）","α波","β波"],"answer":"てんかん","exp":"大脳神経細胞の異常な興奮により反復性の発作が引き起こされる慢性の病気。","topic":"脳波","id":"pmc_fd6297ef0ba9"},{"q":"背景活動から区別される鋭い波形の突発波で、皮質のてんかん焦点から生じた発作発射が頭皮上に伝播したもの。 この内容に最も当てはまる用語はどれか。","options":["棘波","鋭波","紡錘波","δ波"],"answer":"棘波","exp":"背景活動から区別される鋭い波形の突発波で、皮質のてんかん焦点から生じた発作発射が頭皮上に伝播したもの。","topic":"脳波","id":"pmc_c2e2af754dc7"},{"q":"てんかん焦点がより深い位置にあるなどのため、発作発射がより広い領域を巻き込んで頭皮上に伝播したもの。 この内容に最も当てはまる用語はどれか。","options":["鋭波","棘波","紡錘波","δ波"],"answer":"鋭波","exp":"てんかん焦点がより深い位置にあるなどのため、発作発射がより広い領域を巻き込んで頭皮上に伝播したもの。","topic":"脳波","id":"pmc_ec9c0e60c4c9"},{"q":"特定の事象に応じて変化する一過性の微小な電気活動を、脳波の加算平均などで測定したもの。 この内容に最も当てはまる用語はどれか。","options":["事象関連電位（ERP）","後期陽性成分（LPP）","エラー関連陰性電位（ERN）","N400"],"answer":"事象関連電位（ERP）","exp":"特定の事象に応じて変化する一過性の微小な電気活動を、脳波の加算平均などで測定したもの。","topic":"ERP","id":"pmc_cc921a637fab"},{"q":"刺激提示後およそ300～900msに出現し、特に頭頂部で大きく観測される陽性ERP成分。 この内容に最も当てはまる用語はどれか。","options":["P3（P300）","随伴性陰性変動（CNV）","後期陽性成分（LPP）","N400"],"answer":"P3（P300）","exp":"刺激提示後およそ300～900msに出現し、特に頭頂部で大きく観測される陽性ERP成分。","topic":"ERP","id":"pmc_6fd23c969fc1"},{"q":"予期しない事象により作業記憶のメンタルモデルを更新する過程がP3に反映されるとする考え。 この内容に最も当てはまる用語はどれか。","options":["文脈更新仮説","運動準備電位","処理陰性電位（PN／Nd）","ミスマッチ陰性電位（MMN）"],"answer":"文脈更新仮説","exp":"予期しない事象により作業記憶のメンタルモデルを更新する過程がP3に反映されるとする考え。","topic":"ERP","id":"pmc_565dc93b828b"},{"q":"警告刺激の後、反応を要求する命令刺激を待っている状態で記録される緩やかな陰性電位。 この内容に最も当てはまる用語はどれか。","options":["随伴性陰性変動（CNV）","運動準備電位","処理陰性電位（PN／Nd）","ミスマッチ陰性電位（MMN）"],"answer":"随伴性陰性変動（CNV）","exp":"警告刺激の後、反応を要求する命令刺激を待っている状態で記録される緩やかな陰性電位。","topic":"ERP","id":"pmc_a8edc9ad592c"},{"q":"随意運動の500～1000ms前に陰性変動を開始し、運動開始点で頂点に達する電位。 この内容に最も当てはまる用語はどれか。","options":["運動準備電位","随伴性陰性変動（CNV）","処理陰性電位（PN／Nd）","エラー関連陰性電位（ERN）"],"answer":"運動準備電位","exp":"随意運動の500～1000ms前に陰性変動を開始し、運動開始点で頂点に達する電位。","topic":"ERP","id":"pmc_8981c992b2f2"},{"q":"音などの刺激に対して、特に注意を向けた刺激で現れやすい陰性ERP成分。 この内容に最も当てはまる用語はどれか。","options":["処理陰性電位（PN／Nd）","随伴性陰性変動（CNV）","運動準備電位","ミスマッチ陰性電位（MMN）"],"answer":"処理陰性電位（PN／Nd）","exp":"音などの刺激に対して、特に注意を向けた刺激で現れやすい陰性ERP成分。","topic":"ERP","id":"pmc_8441733b6e36"},{"q":"反復される標準刺激の中に異なる逸脱刺激が現れたときに生じる、前頭部優位の陰性ERP成分。 この内容に最も当てはまる用語はどれか。","options":["ミスマッチ陰性電位（MMN）","後期陽性成分（LPP）","エラー関連陰性電位（ERN）","N400"],"answer":"ミスマッチ陰性電位（MMN）","exp":"反復される標準刺激の中に異なる逸脱刺激が現れたときに生じる、前頭部優位の陰性ERP成分。","topic":"ERP","id":"pmc_d31cc6dc243e"},{"q":"刺激提示後およそ400～1000msに頭頂部優位でみられ、情動刺激への持続的注意や評価を反映するとされる陽性成分。 この内容に最も当てはまる用語はどれか。","options":["後期陽性成分（LPP）","事象関連電位（ERP）","P3（P300）","文脈更新仮説"],"answer":"後期陽性成分（LPP）","exp":"刺激提示後およそ400～1000msに頭頂部優位でみられ、情動刺激への持続的注意や評価を反映するとされる陽性成分。","topic":"ERP","id":"pmc_8ffaa4804caf"},{"q":"誤反応直後に前頭部正中線付近で観察され、行動モニタリングや誤り検出に関係する陰性ERP成分。 この内容に最も当てはまる用語はどれか。","options":["エラー関連陰性電位（ERN）","随伴性陰性変動（CNV）","運動準備電位","処理陰性電位（PN／Nd）"],"answer":"エラー関連陰性電位（ERN）","exp":"誤反応直後に前頭部正中線付近で観察され、行動モニタリングや誤り検出に関係する陰性ERP成分。","topic":"ERP","id":"pmc_c15ebe689b93"},{"q":"文脈から逸脱する単語を検出したとき、中心‐頭頂部優位に約400msの潜時で出現する陰性電位。 この内容に最も当てはまる用語はどれか。","options":["N400","ミスマッチ陰性電位（MMN）","後期陽性成分（LPP）","エラー関連陰性電位（ERN）"],"answer":"N400","exp":"文脈から逸脱する単語を検出したとき、中心‐頭頂部優位に約400msの潜時で出現する陰性電位。","topic":"ERP","id":"pmc_61da776b52a5"},{"q":"ホメオスタシスの例として正しいものはどれか。","options":["暑いときに発汗して体温を下げる","危険時に胃腸運動を高める","睡眠時に必ず血圧を急上昇させる","寒いときに発汗量を増やす"],"answer":"暑いときに発汗して体温を下げる","exp":"外的・内的変化に適応し、体温などを一定に保つ働きの例として発汗が挙げられる。","topic":"生理基礎","id":"pmc_bca06bde3f0d"},{"q":"人間の体温はおよそ何℃で一定に保たれるか。","options":["36℃程度","30℃程度","40℃程度","45℃程度"],"answer":"36℃程度","exp":"ホメオスタシスの例で、人間の体温は36℃程度で一定に保たれるとされる。","topic":"生理基礎","id":"pmc_f8ad6e055465"},{"q":"闘争―逃走反応でみられる変化として適切でないものはどれか。","options":["胃腸運動の促進","瞳孔の拡大","心拍数の増加","血圧の上昇"],"answer":"胃腸運動の促進","exp":"闘争―逃走反応では胃腸運動は抑制され、唾液や消化液も減少する。","topic":"生理基礎","id":"pmc_a61f1aa9e7e3"},{"q":"闘争―逃走反応を、闘争または逃走のための準備と考えた人物は誰か。","options":["キャノン","モーニッツ","フロイデンバーガー","ブローカ"],"answer":"キャノン","exp":"資料ではキャノンがこの反応を闘争・逃走の準備と考えたとされる。","topic":"生理基礎","id":"pmc_386575713bb1"},{"q":"EDAを計測する部位として多く用いられるのはどれか。","options":["手のひらや指","胸部や背部","頭皮や耳周辺","下腿や足首"],"answer":"手のひらや指","exp":"精神性発汗をとらえるため、手掌・手指で計測することが多い。","topic":"EDA","id":"pmc_a0bcd159189d"},{"q":"EDAの中枢発現機序に関与する脳領域として組合せはどれか。","options":["前部帯状回と扁桃体","海馬と小脳","後頭葉と脳梁","視床下部と一次運動野"],"answer":"前部帯状回と扁桃体","exp":"資料ではEDAの生起に前部帯状回と扁桃体が関与するとされる。","topic":"EDA","id":"pmc_10575ea6ab42"},{"q":"エクリン汗腺の自律神経支配について正しいものはどれか。","options":["交感神経の単独支配で、節後線維の伝達物質はアセチルコリン","交感神経の単独支配で、節後線維の伝達物質はアドレナリン","副交感神経の単独支配で、節後線維の伝達物質はアセチルコリン","交感・副交感神経の二重支配で、節後線維の伝達物質はアセチルコリン"],"answer":"交感神経の単独支配で、節後線維の伝達物質はアセチルコリン","exp":"資料ではエクリン汗腺は交感神経単独支配だが、節後線維の伝達物質はアセチルコリンとされる。","topic":"EDA","id":"pmc_7aeada1cb04d"},{"q":"同一音を20回呈示したとき、健常者のSCLはどのように変化したとか。","options":["安静時・音呈示とも連続的に低下した","両条件で急激に上昇し続けた","まったく変化しなかった","音呈示時だけ一定に上昇した"],"answer":"安静時・音呈示とも連続的に低下した","exp":"健常者のSCLは両セッションで連続的に低下したとされる。","topic":"EDA","id":"pmc_0510c57d6715"},{"q":"同一音の反復呈示に対する健常者のSCRの変化として正しいものはどれか。","options":["初期に大きく、その後急速に慣れる","反復するほど増大し続ける","初回から反応しない","20回目だけ最大となる"],"answer":"初期に大きく、その後急速に慣れる","exp":"健常者では初期反応が大きく、その後急激な慣れの勾配がみられた。","topic":"EDA","id":"pmc_2c887321d3b4"},{"q":"不安患者で同一音の反復呈示による刺激効果が小さい理由として最も適切なものはどれか。","options":["すでに自律系が過喚起状態にあるため","健常者よりもSCLが急速に低下するため","音呈示時だけSCLが連続的に低下するため","初回からSCRが完全に消失しているため"],"answer":"すでに自律系が過喚起状態にあるため","exp":"不安患者はもともと自律系の過喚起状態にあるため、追加刺激の効果が小さいと説明される。","topic":"EDA","id":"pmc_28482f69b9f9"},{"q":"心電図で1分間あたりの拍動数を表す単位はどれか。","options":["bpm","Hz","mV","mmHg"],"answer":"bpm","exp":"1分あたりの心拍数をbpmで表す。","topic":"循環","id":"pmc_912b10eada8a"},{"q":"心臓の上部にある心房の自律神経分布について正しいものはどれか。","options":["交感神経と副交感神経の両方が分布する","交感神経だけが分布する","副交感神経だけが分布する","自律神経は分布しない"],"answer":"交感神経と副交感神経の両方が分布する","exp":"資料では心房に交感・副交感の両者、心室にはほとんど交感神経が分布するとされる。","topic":"循環","id":"pmc_51d2c66f4084"},{"q":"心室の収縮力に主に関与すると最も適切なものはどれか。","options":["交感神経","副交感神経","交感神経と副交感神経の両方","迷走神経"],"answer":"交感神経","exp":"収縮力は主に心室筋の作用であるため、交感神経支配とされる。","topic":"循環","id":"pmc_be32f77a1f84"},{"q":"数秒以内に生じる心拍変化への関与が大きいと最も適切なものはどれか。","options":["迷走神経","交感神経","交感神経と副交感神経の両方","体性神経"],"answer":"迷走神経","exp":"交感神経は作用発現に数秒以上かかるため、短時間の変化は迷走神経の関与が大きい。","topic":"循環","id":"pmc_1c93adbea46a"},{"q":"不快刺激を見た際の大きな定位反応として適切なものはどれか。","options":["一過性の心拍減少","一過性の心拍増加","持続的な心拍減少","心拍数に変化がみられない"],"answer":"一過性の心拍減少","exp":"不快刺激には大きな定位反応として一過性の心拍減少がみられるとされる。","topic":"循環","id":"pmc_5d046e850035"},{"q":"不快刺激を予測しているときに中性画像へも大きな定位反応がみられることは、何を示すと考えられるか。","options":["脅威事態で刺激へ注意を向け確認する適応的反応","刺激反復による慣れ","自律神経反応の完全な消失","不快刺激から注意をそらす反応"],"answer":"脅威事態で刺激へ注意を向け確認する適応的反応","exp":"脅威に備えて刺激を確認する適応的な注意反応と解釈される。","topic":"循環","id":"pmc_2a5a1476641d"},{"q":"特定不安が高い人の不快刺激への注意について正しいものはどれか。","options":["過剰に注意を向け、不適応的注意機能を反映する","不快刺激を完全に無視する","中性刺激だけへ注意する","注意機能とは無関係である"],"answer":"過剰に注意を向け、不適応的注意機能を反映する","exp":"不安の高い人は不快刺激へ過剰に注意を向けるとされる。","topic":"循環","id":"pmc_7ce4e65374b5"},{"q":"呼吸性洞性不整脈で、吸気相にみられる変化はどれか。","options":["交感神経優位となり心拍数が増加する","副交感神経優位となり心拍数が減少する","交感神経優位となり心拍数が減少する","副交感神経優位となり心拍数が増加する"],"answer":"交感神経優位となり心拍数が増加する","exp":"資料では吸気相で交感神経優位・心拍増加、呼気相で副交感神経優位・心拍減少とされる。","topic":"循環","id":"pmc_16bd26507f2a"},{"q":"HRVの周波数解析で高周波成分が主に反映するものはどれか。","options":["副交感神経（迷走神経）活動","交感神経だけ","体性運動神経","視覚系活動"],"answer":"副交感神経（迷走神経）活動","exp":"高周波は主に副交感神経（迷走神経）活動を反映する。","topic":"循環","id":"pmc_0c008f5d41b4"},{"q":"HRVの低周波成分について正しいものはどれか。","options":["交感・副交感神経の両方の影響を反映する","副交感神経だけを反映する","交感神経だけを反映する","自律神経活動を反映しない"],"answer":"交感・副交感神経の両方の影響を反映する","exp":"資料では低周波は交感・副交感の両方の影響を反映するとされる。","topic":"循環","id":"pmc_967d524b4990"},{"q":"能動的に課題へ取り組むときの心臓優位パターンで増加するとされるものはどれか。","options":["心拍出量（CO）","末梢血管抵抗（TPR）","心拍変動性（HRV）","皮膚コンダクタンス水準（SCL）"],"answer":"心拍出量（CO）","exp":"心臓優位ではCOが増加し、骨格筋への血流が増える。","topic":"循環","id":"pmc_cf5f72ed11ed"},{"q":"受動的対処や回避・耐える状況で生じる血管優位パターンの特徴はどれか。","options":["末梢血管抵抗（TPR）が上昇する","心拍出量だけが上昇しTPRは低下する","骨格筋血流だけが増える","血圧は必ず低下する"],"answer":"末梢血管抵抗（TPR）が上昇する","exp":"血管優位ではTPR上昇によって血圧が上がる。","topic":"循環","id":"pmc_84b8f1fdcde7"},{"q":"燃え尽き症候群を提唱した人物として誰か。","options":["フロイデンバーガー","キャノン","モーニッツ","ウェルニッケ"],"answer":"フロイデンバーガー","exp":"資料ではフロイデンバーガーが提唱したとされる。","topic":"ストレス","id":"pmc_9949cc672297"},{"q":"燃え尽き症候群が多いとされる職種の例として正しいものはどれか。","options":["看護師や教師などの対人援助職","職業とは無関係である","機械操作だけを行う職種に限られる","夜勤のない職種に限られる"],"answer":"看護師や教師などの対人援助職","exp":"長期の援助活動で心的エネルギーを消耗しやすい対人援助職に多いとされる。","topic":"ストレス","id":"pmc_76da88429be4"},{"q":"血液容積脈の脈波について正しいものはどれか。","options":["駆出された血液本体より速く末梢へ移動する","血液本体より遅く移動する","末梢方向へは移動しない","心収縮とは無関係に発生する"],"answer":"駆出された血液本体より速く末梢へ移動する","exp":"脈波は血液本体よりはるかに速く末梢へ波及する。","topic":"循環","id":"pmc_04b4cee6857e"},{"q":"脈波が手首へ到達するまでおよそどのくらいか。","options":["150ms","15ms","1.5秒","15秒"],"answer":"150ms","exp":"約150ms後に手首へ到達すると記載される。","topic":"循環","id":"pmc_cb60ee6192b8"},{"q":"プラセボ効果について正しいものはどれか。","options":["薬だけでなく心理的介入や手術でも同様の効果が生じうる","薬でしか生じない","効果検証で統制する必要はない","症状改善に利用する考え方は否定されている"],"answer":"薬だけでなく心理的介入や手術でも同様の効果が生じうる","exp":"薬以外の心理的介入や手術でも生じうるため、効果検証では統制が必要とされる。","topic":"ストレス","id":"pmc_375efdc58ab6"},{"q":"SAM系で分泌されるカテコールアミンとして組合せはどれか。","options":["アドレナリンとノルアドレナリン","コルチゾールとCRH","ACTHとインスリン","セロトニンとGABA"],"answer":"アドレナリンとノルアドレナリン","exp":"SAM系では交感神経末端や副腎髄質からカテコールアミンが分泌される。","topic":"ストレス","id":"pmc_61b69a79f232"},{"q":"HPA系のホルモンの流れとして正しいものはどれか。","options":["CRH→ACTH→コルチゾール","ACTH→CRH→コルチゾール","コルチゾール→CRH→ACTH","アドレナリン→CRH→ACTH"],"answer":"CRH→ACTH→コルチゾール","exp":"視床下部のCRH、下垂体前葉のACTH、副腎皮質のコルチゾールの順である。","topic":"ストレス","id":"pmc_7e94d20eb650"},{"q":"HPA系でACTHを分泌する部位はどれか。","options":["下垂体前葉","視床下部室傍核","副腎髄質","副腎皮質"],"answer":"下垂体前葉","exp":"CRHが下垂体前葉に達し、ACTHが放出される。","topic":"ストレス","id":"pmc_c1d03cef456b"},{"q":"HPA系でコルチゾールを分泌する部位はどれか。","options":["副腎皮質","副腎髄質","下垂体後葉","前部帯状回"],"answer":"副腎皮質","exp":"ACTHが副腎に到達し、副腎皮質からコルチゾールが分泌される。","topic":"ストレス","id":"pmc_c839295be186"},{"q":"分泌型免疫グロブリンAのストレスとの関係として正しいものはどれか。","options":["急性ストレスで上昇し、慢性ストレスで低下する報告が多い","急性・慢性とも必ず低下する","急性・慢性とも必ず上昇する","ストレスとは無関係である"],"answer":"急性ストレスで上昇し、慢性ストレスで低下する報告が多い","exp":"資料では急性ストレス下で上昇、慢性ストレスで低下する報告が多いとされる。","topic":"ストレス","id":"pmc_d9b2079cb51a"},{"q":"筋活動電位が生じる直前の神経筋接合部で放出される物質としてのはどれか。","options":["アセチルコリン","コルチゾール","ドーパミン","CRH"],"answer":"アセチルコリン","exp":"神経興奮が神経末端に達するとアセチルコリンが放出され、終板が脱分極する。","topic":"生理計測","id":"pmc_95c5b4f49670"},{"q":"バイオ・フィードバック療法が基づく理論はどれか。","options":["オペラント条件づけ","古典的条件づけだけ","洞察学習だけ","潜在学習だけ"],"answer":"オペラント条件づけ","exp":"資料ではオペラント条件づけ理論に基づく技法とされる。","topic":"生理計測","id":"pmc_925832f16c97"},{"q":"バイオ・フィードバック療法の最終目標として最も適切なものはどれか。","options":["外部の信号がなくても自ら心身の変化を察知し自己調整できること","常にブザーがないと調整できないこと","生理反応を完全に消失させること","自律神経反応を意識しないこと"],"answer":"外部の信号がなくても自ら心身の変化を察知し自己調整できること","exp":"信号を手がかりに学習し、最終的には信号なしで自己調整できることを目指す。","topic":"生理計測","id":"pmc_5718c5fe6545"},{"q":"書痙について正しいものはどれか。","options":["手指の運動機能自体に障害がなくても、書字時に震えや硬直が出る","常に安静時から麻痺がある","他人の目を意識すると必ず軽快する","バイオフィードバックは用いられない"],"answer":"手指の運動機能自体に障害がなくても、書字時に震えや硬直が出る","exp":"他人の目を意識し上手に書こうとすると症状が強まることがあり、近年はバイオフィードバックも用いられる。","topic":"生理計測","id":"pmc_adbd183d2feb"},{"q":"脳波を記録する際の軸について、正しいものはどれか。","options":["縦軸が電位、横軸が時間","縦軸が時間、横軸が電位","縦軸が血圧、横軸が体温","縦軸が周波数、横軸が心拍数"],"answer":"縦軸が電位、横軸が時間","exp":"資料の参考書バージョンでは、電位を縦軸、時間を横軸に記録するとされる。","topic":"脳波","id":"pmc_6f0f53e4241c"},{"q":"脳波検査について正しいものはどれか。","options":["非侵襲的な脳機能検査である","必ず開頭手術を必要とする","てんかん評価には用いられない","意識障害評価には用いられない"],"answer":"非侵襲的な脳機能検査である","exp":"頭皮上電極を用いる非侵襲的検査で、てんかん、器質性脳障害、意識障害などの評価に用いられる。","topic":"脳波","id":"pmc_dc8a0f44ef3a"},{"q":"閉眼安静時に典型的にみられる脳波はどれか。","options":["α波","β波","θ波","δ波"],"answer":"α波","exp":"α波は8～13Hz程度で閉眼安静時に出現する。","topic":"脳波","id":"pmc_faf0fd697ea9"},{"q":"精神活動時にみられ、13Hz以上の速波とされるのはどれか。","options":["β波","α波","θ波","δ波"],"answer":"β波","exp":"β波はα波より速く、13Hz以上で精神活動時にみられる。","topic":"脳波","id":"pmc_a5d2fecc8220"},{"q":"入眠時にみられる4～7Hz程度の脳波はどれか。","options":["θ波","α波","β波","δ波"],"answer":"θ波","exp":"θ波は4～7Hz程度で入眠時にみられる。","topic":"脳波","id":"pmc_1c28b8988a51"},{"q":"4Hz以下で、眠りが深くなると出現する脳波はどれか。","options":["δ波","α波","β波","θ波"],"answer":"δ波","exp":"δ波は4Hz以下で、深い睡眠で出現する。","topic":"脳波","id":"pmc_0922f3ddfc33"},{"q":"睡眠段階2で特徴的に出現するものはどれか。","options":["12～14Hzで0.5秒以上持続する紡錘波","75μV以上のδ波が50％以上","α波だけが連続する","14～40Hzの速波だけがみられる"],"answer":"12～14Hzで0.5秒以上持続する紡錘波","exp":"段階2では明瞭な紡錘波が出現する。","topic":"脳波","id":"pmc_104fcc899387"},{"q":"睡眠段階3の脳波として正しいものはどれか。","options":["1～2Hz・75μV以上のδ波が20～50％","δ波が50％以上","12～14Hzの紡錘波だけ","α波が100％"],"answer":"1～2Hz・75μV以上のδ波が20～50％","exp":"段階3では高振幅δ波が20～50％、段階4では50％以上とされる。","topic":"脳波","id":"pmc_069d92493c82"},{"q":"睡眠段階4の脳波として正しいものはどれか。","options":["1～2Hz・75μV以上のδ波が50％以上","1～2Hzのδ波が20％未満","α波が連続する","β波だけが出現する"],"answer":"1～2Hz・75μV以上のδ波が50％以上","exp":"段階4ではδ波が50％以上を占める。","topic":"脳波","id":"pmc_2c832a9fe04b"},{"q":"てんかんについて、原因不明とされる割合として示されるのはおよそどれか。","options":["40％","4％","10％","90％"],"answer":"40％","exp":"資料では約40％は原因不明とされる。","topic":"脳波","id":"pmc_ac44c1066595"},{"q":"鋭波について正しい説明はどれか。","options":["焦点がより深いなどのため、より広い領域を巻き込んで頭皮上へ伝播したもの","必ず正常成人にのみ出現する","背景活動と区別できない波形である","皮質表面の焦点だけから直接生じるものに限る"],"answer":"焦点がより深いなどのため、より広い領域を巻き込んで頭皮上へ伝播したもの","exp":"鋭波は深い焦点などにより、発作発射が広い領域を巻き込むと説明される。","topic":"脳波","id":"pmc_f92b3e5ffde9"},{"q":"鋭波がてんかん以外にもみられることがある病変として適切なものはどれか。","options":["脳腫瘍やアルツハイマー病","血管性認知症やレビー小体型認知症","前頭側頭型認知症や軽度認知障害","半側空間無視や相貌失認"],"answer":"脳腫瘍やアルツハイマー病","exp":"ゆっくり増悪する病変でも鋭波がみられることがあるとされる。","topic":"脳波","id":"pmc_ff3a7aa0cd53"},{"q":"ERPを測定する基本的な方法として正しいものはどれか。","options":["特定事象の前後の脳電位を加算平均する","1回の刺激だけで背景脳波をそのまま読む","心拍波形だけを平均する","血圧だけを連続記録する"],"answer":"特定事象の前後の脳電位を加算平均する","exp":"背景脳波は刺激と無関係に揺らぐため、加算平均で相殺しERPを抽出する。","topic":"ERP","id":"pmc_6701514198e8"},{"q":"ERP成分を定義する要素として挙げられていないものはどれか。","options":["周波数帯域","潜時","極性","頭皮上分布"],"answer":"周波数帯域","exp":"資料では、ERP成分は潜時・極性・頭皮上分布・実験変数への応答性によって定義される。","topic":"ERP","id":"pmc_16abbd8fa567"},{"q":"P3の振幅について正しいものはどれか。","options":["まれで重要な刺激ほど大きくなりやすい","刺激の出現確率が高いほど必ず最大になる","自己関連性の影響を受けない","刺激の重要性とは無関係である"],"answer":"まれで重要な刺激ほど大きくなりやすい","exp":"P3振幅は出現確率や自己関連性に影響され、まれで重要な刺激ほど大きくなる。","topic":"ERP","id":"pmc_e1e8bb5ec62d"},{"q":"P3の潜時が反映するものはどれか。","options":["刺激の評価に要する時間","刺激の出現確率","刺激の自己関連性","P3の頭皮上分布"],"answer":"刺激の評価に要する時間","exp":"P3潜時は刺激評価に要する時間を示すとされる。","topic":"ERP","id":"pmc_d7f662abd0aa"},{"q":"P3を典型的に測定する課題はどれか。","options":["オドボール課題","ストループ課題","語流暢性課題","数唱課題"],"answer":"オドボール課題","exp":"文脈更新仮説の説明で、P3はオドボール課題によって典型的に測定されるとされる。","topic":"ERP","id":"pmc_a13c7889f411"},{"q":"CNVが記録される状況として最も適切なのはどれか。","options":["警告刺激の後、反応を要求する命令刺激を待っているとき","誤反応をした直後","文脈から逸脱する単語が提示されたとき","標準刺激中に逸脱刺激が出現したとき"],"answer":"警告刺激の後、反応を要求する命令刺激を待っているとき","exp":"CNVは警告刺激と命令刺激の間にみられる緩やかな陰性電位である。","topic":"ERP","id":"pmc_e155dde39610"},{"q":"運動準備電位が開始する時期として正しいものはどれか。","options":["随意運動の500～1000ms前","随意運動の10秒後","運動開始の5秒後だけ","睡眠中のみ"],"answer":"随意運動の500～1000ms前","exp":"運動準備電位は随意運動に先行して陰性変動を開始し、運動開始点で頂点に達する。","topic":"ERP","id":"pmc_62b45f4636bf"},{"q":"運動準備電位について正しいものはどれか。","options":["運動を能動的にイメージするだけでも出現しうる","他動運動でのみ出現する","運動開始後にのみ出現する","後頭葉視覚野に限局する"],"answer":"運動を能動的にイメージするだけでも出現しうる","exp":"実際に動かなくても能動的な運動イメージで出現し、他動運動では出現しないとされる。","topic":"ERP","id":"pmc_f4ee29797c1e"},{"q":"処理陰性電位について正しいものはどれか。","options":["注意を向けた刺激では振幅が増大し、無視刺激では生じにくい","無視刺激でのみ最大となる","情動刺激にだけ出現する","誤反応直後にのみ出現する"],"answer":"注意を向けた刺激では振幅が増大し、無視刺激では生じにくい","exp":"選択的注意との関連が特徴である。","topic":"ERP","id":"pmc_bf045c93b51b"},{"q":"処理陰性電位と関連するN1成分の潜時として示されるのはどれか。","options":["約100～200ms","約400～1000ms","約300～900ms","約2～3秒"],"answer":"約100～200ms","exp":"PN/Ndは潜時約100～200msのN1と関連するとされる。","topic":"ERP","id":"pmc_a23bc54a4ed6"},{"q":"MMNが出現しやすい状況はどれか。","options":["反復される標準音の中に高さの異なる音が混ざる","同じ刺激だけを非常に長い間隔で1回提示する","誤反応を自覚した直後","運動イメージを行うだけ"],"answer":"反復される標準音の中に高さの異なる音が混ざる","exp":"MMNは標準刺激の列の中に逸脱刺激が出たときに生じる。","topic":"ERP","id":"pmc_c584d9efffcc"},{"q":"MMNの潜時と分布の組合せとして正しいものはどれか。","options":["約100～300ms―前頭部優位","約400～1000ms―頭頂部優位","約300～900ms―頭頂部優位","約500～1000ms前―中心部"],"answer":"約100～300ms―前頭部優位","exp":"MMNは潜時約100～300ms、前頭部優位で観察される。","topic":"ERP","id":"pmc_dcb6757865e8"},{"q":"MMNの主な電源として部位はどれか。","options":["聴覚皮質（上側頭回付近）","前部帯状皮質","中心部の運動野","頭頂部"],"answer":"聴覚皮質（上側頭回付近）","exp":"資料では主に聴覚皮質、上側頭回付近が電源とされる。","topic":"ERP","id":"pmc_b637cb53022d"},{"q":"MMNが刺激間隔10秒以上でほとんど観察できなくなることから、何の機構が重視されているか。","options":["聴覚皮質の感覚記憶機構","長期意味記憶だけ","運動記憶だけ","視覚短期記憶だけ"],"answer":"聴覚皮質の感覚記憶機構","exp":"刺激間隔の影響から、感覚記憶機構の役割が示唆される。","topic":"ERP","id":"pmc_ec6d89f82d4f"},{"q":"LPPについて正しいものはどれか。","options":["快・不快いずれの情動刺激でも中性刺激より振幅が増大しやすい","不快刺激にしか反応しない","中性刺激でのみ増大する","誤反応でのみ出現する"],"answer":"快・不快いずれの情動刺激でも中性刺激より振幅が増大しやすい","exp":"LPPは情動的意味をもつ刺激で強く、快・不快の両方で中性より増大する。","topic":"ERP","id":"pmc_801968d586ed"},{"q":"LPPが反映すると考えられているものはどれか。","options":["情動刺激への持続的な注意配分や評価過程","作業記憶の文脈更新","行動のモニタリングと誤り検出","聴覚皮質の感覚記憶機構"],"answer":"情動刺激への持続的な注意配分や評価過程","exp":"資料の説明どおり。","topic":"ERP","id":"pmc_ad7dd5a33bb4"},{"q":"ERNの主な起源として部位はどれか。","options":["前部帯状皮質","聴覚皮質（上側頭回付近）","中心部の運動野","頭頂部"],"answer":"前部帯状皮質","exp":"ERNは主に前部帯状皮質に起源をもつとされる。","topic":"ERP","id":"pmc_6afcef7af49c"},{"q":"ERNが反映すると考えられているものはどれか。","options":["行動のモニタリングと誤り検出","作業記憶の文脈更新","情動刺激への持続的注意","聴覚皮質の感覚記憶"],"answer":"行動のモニタリングと誤り検出","exp":"誤反応を検出して適切な行動修正を促す神経基盤と関係する。","topic":"ERP","id":"pmc_0666cf968542"},{"q":"N400が大きく出現しやすいのはどのような単語か。","options":["文脈から逸脱する単語","まれで重要な刺激","標準刺激中の逸脱音","誤反応をした直後"],"answer":"文脈から逸脱する単語","exp":"文脈逸脱の検出で約400msの陰性電位が出現する。","topic":"ERP","id":"pmc_e2d7bf5c0460"},{"q":"「ピザは○○するには熱すぎた」の○○に入る語のうち、最も逸脱しているとされたものはどれか。","options":["叫ぶ","飲む","食べる","どれも同じ"],"answer":"叫ぶ","exp":"資料の例では「叫ぶ」が最も文脈から逸脱している。","topic":"ERP","id":"pmc_fb19552fc360"},{"q":"暑いときに体温を下げるために生じる発汗として、項目名に示されているものはどれか。","options":["温熱性発汗","精神性発汗","皮膚コンダクタンス反応","呼吸性洞性不整脈"],"answer":"温熱性発汗","exp":"ホメオスタシスの項目では、発汗として温熱性発汗と精神性発汗が挙げられている。","topic":"生理基礎","id":"pmc_481f927cbd5a"},{"q":"情動と関連し、皮膚電気活動で電気的に捉えられる発汗はどれか。","options":["精神性発汗","温熱性発汗","血液容積脈","心拍変動性"],"answer":"精神性発汗","exp":"皮膚電気活動は精神性発汗を電気的に捉えたものである。","topic":"EDA","id":"pmc_ca1edbecb59c"}];const STORAGE_KEY="quiz_seiri_choice_v20260914b";
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．.、()（）\[\]【】「」『』:：;；/\\\-−―ー]/g,'')}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return {}}}

function rec(q){if(!state[q.id])state[q.id]={attempts:0,correct:0,wrong:0,last:null};return state[q.id]}
function fisher(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state=loadState(),filter='all',randomMode=false,order=QUESTIONS.map((_,i)=>i),idx=0,activeQi=null;
let session={answered:0,correct:0,wrong:0};
function matches(i){let r=rec(QUESTIONS[i]);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function listNow(){return order.filter(matches)}
function updateStats(){let done=0,wrong=0;QUESTIONS.forEach(q=>{let r=rec(q);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+QUESTIONS.length;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=listNow().length+'問表示'}
function setFilter(v){filter=v;idx=0;activeQi=null;resetView();render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;activeQi=null;resetView();document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;activeQi=null;resetView();render()}}
function selectActive(){let list=listNow();if(!list.length){activeQi=null;return null}if(idx>=list.length)idx=0;if(activeQi===null)activeQi=list[idx];return activeQi}
function move(d){let list=listNow();resetView();activeQi=null;if(!list.length){idx=0;render();return}idx=(idx+d+list.length)%list.length;render()}

let revealed=false,selected=null,displayOpts=[];
function resetView(){revealed=false;selected=null;displayOpts=[]}
function answer(opt){if(revealed||activeQi===null)return;let q=QUESTIONS[activeQi],r=rec(q);selected=opt;revealed=true;r.attempts++;session.answered++;if(opt===q.answer){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();render()}
function retry(){revealed=false;selected=null;if(activeQi!==null)displayOpts=fisher(QUESTIONS[activeQi].options);render()}
function render(){updateStats();let card=document.getElementById('card');let qi=selectActive();if(qi===null){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}let q=QUESTIONS[qi];if(!displayOpts.length)displayOpts=fisher(q.options);let ops=displayOpts.map(o=>{let cls='opt';if(revealed&&o===q.answer)cls+=' correct';else if(revealed&&o===selected&&o!==q.answer)cls+=' wrong';return `<button class="${cls}" onclick='answer(${JSON.stringify(o)})'>${o}</button>`}).join('');let fb='';if(revealed){let ok=selected===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><div class="answer">${ok?'○ 正解':'× 不正解'}　正解：${q.answer}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>`}let list=listNow();let pos=list.indexOf(qi);let label=pos>=0?`${pos+1} / ${list.length}`:'解答済み（現在のフィルタ対象外）';card.innerHTML=`<div class="qno">${label}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div><div class="options">${ops}</div>${fb}<div class="nav"><button onclick="move(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="move(1)">次へ →</button></div>`;updateStats()}
render();</script></body></html>
