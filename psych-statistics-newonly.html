<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心理学統計法 新規問題のみ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}h1{font-size:21px;margin:8px 0 4px}.sub{color:#697386;font-size:13px;margin-bottom:12px}.panel,.card{background:white;border:1px solid #e4e8ef;border-radius:16px;box-shadow:0 4px 16px #0000000a}.panel{padding:12px;margin:10px 0}.tabs,.modes,.nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #d8dee9;background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer}.tabs button.active,.modes button.active{background:#20242a;color:#fff;border-color:#20242a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:#f7f8fa;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#6b7280}.card{padding:18px;margin-top:12px}.meta{font-size:12px;color:#7b8494;margin-bottom:8px}.q{font-weight:700;font-size:18px;line-height:1.55;margin:8px 0 16px}.choices{display:grid;gap:9px}.choice{text-align:left;padding:13px}.choice.correct{border-color:#1f9d55;background:#effaf4}.choice.wrong{border-color:#d64545;background:#fff1f1}.choice:disabled{color:#20242a;opacity:1}.feedback{margin-top:14px;padding:12px;border-radius:11px;background:#f6f7f9;line-height:1.55}.feedback.ok{background:#effaf4}.feedback.ng{background:#fff1f1}.hidden{display:none}.answerInput{width:100%;font:inherit;font-size:17px;padding:13px;border:1px solid #cfd6e2;border-radius:11px}.nav{justify-content:space-between;margin-top:14px}.nav button{min-width:110px}.danger{color:#b42318}.menuTitle{font-weight:700;margin-bottom:8px}.note{font-size:12px;color:#6b7280;line-height:1.5}.history{font-size:12px;color:#667085;margin-top:10px}.source{font-size:11px;color:#98a2b3;margin-top:12px}.pill{font-size:12px;padding:6px 9px}.reveal{width:100%;margin-top:10px}.saBtns{display:flex;gap:8px;margin-top:10px}.saBtns button{flex:1}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.q{font-size:17px}}
</style></head><body><div class="wrap"><h1>心理学統計法 授業資料 問題集</h1><div class="sub">4択 <span id="mcCount"></span>問 ／ 一問一答 <span id="saCount"></span>問</div>
<div class="panel"><div class="tabs"><button id="tabMc" onclick="setType('mc')">4択</button><button id="tabSa" onclick="setType('sa')">一問一答</button></div><div class="modes" style="margin-top:9px"><button data-mode="all" onclick="setMode('all')">すべて</button><button data-mode="random" onclick="setMode('random')">ランダム</button><button data-mode="unanswered" onclick="setMode('unanswered')">未回答</button><button data-mode="wrong" onclick="setMode('wrong')">間違えた問題</button><button data-mode="wrong1" onclick="setMode('wrong1')">1回間違い</button><button data-mode="wrong2" onclick="setMode('wrong2')">2回間違い</button><button data-mode="wrong3" onclick="setMode('wrong3')">3回以上</button></div><div class="stats"><div class="stat"><b id="sCorrect">0</b><span>正解</span></div><div class="stat"><b id="sWrong">0</b><span>不正解</span></div><div class="stat"><b id="sRate">-</b><span>正答率</span></div><div class="stat"><b id="sProgress">0/0</b><span>回答済み</span></div></div></div>
<div id="empty" class="card hidden">この条件に該当する問題はまだありません。</div><div id="card" class="card"><div class="meta" id="meta"></div><div class="q" id="question"></div><div id="mcArea"><div class="choices" id="choices"></div><button class="reveal" id="revealMc" onclick="revealMc()">答え・解説を見る</button></div><div id="saArea" class="hidden"><input id="saInput" class="answerInput" placeholder="答えを入力" autocomplete="off"><div class="saBtns"><button onclick="judgeSa()">答える</button><button onclick="revealSa()">答え・解説を見る</button></div></div><div id="feedback" class="feedback hidden"></div><div id="history" class="history"></div><div id="source" class="source"></div><div class="nav"><button onclick="prev()">← 前へ</button><button onclick="next()">次へ →</button></div></div>
<div class="panel"><div class="menuTitle">記録</div><div class="note">回答履歴はこのブラウザ内に保存されます。解き直しても、これまでの正解数・不正解数・間違えた回数は残ります。</div><button class="danger" style="margin-top:10px" onclick="resetAll()">全記録をリセット</button></div></div>
<script>const DATA={"mc":[{"q":"SPSSの尖度がHADの尖度より3小さく表示される理由として資料にある説明はどれか。","options":["SPSSでは尖度から単純に3を引いているため","HADでは尖度を3倍しているため","HADでは歪度を尖度に加えているため","SPSSでは標準偏差を加えているため"],"answer":0,"explanation":"正解：SPSSでは尖度から単純に3を引いているため","source":"分布の形"},{"q":"資料では、正規性を判断するとき歪度・尖度と併せて何を確認することが勧められているか。","options":["散布図","回帰直線","箱ひげ図だけ","ヒストグラム"],"answer":3,"explanation":"正解：ヒストグラム","source":"分布の形"},{"q":"データ解析で研究者が本来知りたいものとして資料が強調しているのはどれか。","options":["標本の値そのものではなく母集団における傾向","回答者個人の順位だけ","標本平均だけ","標本分散だけ"],"answer":0,"explanation":"正解：標本の値そのものではなく母集団における傾向","source":"標本理論"},{"q":"母平均は資料では何を用いて推測すると説明されているか。","options":["最頻値","相関係数","不偏分散","標本平均"],"answer":3,"explanation":"正解：標本平均","source":"標本理論"},{"q":"同じ母集団から標本を取り直すたび標本統計量が少しずつ変わる主な理由はどれか。","options":["母数そのものが毎回変わるため","尺度水準が毎回変わるため","有意水準が変化するため","サンプリングに伴う標本誤差"],"answer":3,"explanation":"正解：サンプリングに伴う標本誤差","source":"標本理論"},{"q":"資料では、母集団における値である母数についてどのように説明されているか。","options":["標本ごとに母数も変化する","標本が変わっても母数自体は一定である","母数は標本平均と必ず同じ","母数は標本数に比例する"],"answer":1,"explanation":"正解：標本が変わっても母数自体は一定である","source":"標本理論"},{"q":"標準誤差は、同じような調査を繰り返したときの何を表す指標か。","options":["母数そのものがどの程度変動するか","個々人の得点が尺度内でどの程度変動するか","標本統計量が調査ごとにどの程度変動するか","質問項目数がどの程度変動するか"],"answer":2,"explanation":"正解：標本統計量が調査ごとにどの程度変動するか","source":"標準誤差"},{"q":"標準誤差は別の言い方をすると何の標準偏差と考えられるか。","options":["質問項目の標準偏差","標本統計量たちの標準偏差","順位の標準偏差","母集団の個々の値の標準偏差"],"answer":1,"explanation":"正解：標本統計量たちの標準偏差","source":"標準誤差"},{"q":"資料では標準誤差の考え方は平均値以外の何にも適用できるとされているか。","options":["研究仮説だけ","自由記述だけ","相関係数など、さまざまな統計量","名義尺度だけ"],"answer":2,"explanation":"正解：相関係数など、さまざまな統計量","source":"標準誤差"},{"q":"仮に多数の標本平均を得られた場合、それらの平均は何に一致すると資料で説明されているか。","options":["母分散","標準誤差","有意水準","母平均"],"answer":3,"explanation":"正解：母平均","source":"標本理論"},{"q":"相関係数の効果量基準について資料が注意していることはどれか。","options":["標本数に関係なく因果を示す","必ず全研究で同じ基準を使う","r=.30未満は無相関と断定する","絶対的な基準ではなく目安である"],"answer":3,"explanation":"正解：絶対的な基準ではなく目安である","source":"相関"},{"q":"相関係数が0に近くても2変数に関連が存在しうる例として資料が挙げるのはどれか。","options":["同じ変数同士の関係","名義尺度の一致","二次曲線的な関係","完全な直線関係"],"answer":2,"explanation":"正解：二次曲線的な関係","source":"相関"},{"q":"相関係数が主として表すのはどのような関連か。","options":["因果関係","直線的な関連","群間平均差","あらゆる非線形関係"],"answer":1,"explanation":"正解：直線的な関連","source":"相関"},{"q":"相関分析の結果報告について、資料では通常省略してよいとされているものはどれか。","options":["p値","相関係数r","検定統計量t値と自由度","変数名"],"answer":2,"explanation":"正解：検定統計量t値と自由度","source":"結果報告"},{"q":"心理学研究で相関を確認する組合せとして資料に挙げられているものはどれか。","options":["独立変数と研究者名","文献名とページ数","主観報告と行動指標・生理指標","有意水準と標本数"],"answer":2,"explanation":"正解：主観報告と行動指標・生理指標","source":"相関"},{"q":"尺度得点同士の相関で、資料が尺度得点の例として示しているものはどれか。","options":["最頻値だけ","順位だけ","自由記述の文字数だけ","尺度の合計得点または平均得点"],"answer":3,"explanation":"正解：尺度の合計得点または平均得点","source":"相関"}],"sa":[{"q":"SPSSで「過度な尖度なし」に相当する尖度はいくつ？","answer":"0","aliases":[],"explanation":"正解：0","source":"分布の形"},{"q":"HADで「過度な尖度なし」に相当する尖度はいくつ？","answer":"3","aliases":[],"explanation":"正解：3","source":"分布の形"},{"q":"母分散の推定に用いる分散を何という？","answer":"不偏分散","aliases":[],"explanation":"正解：不偏分散","source":"標本理論"},{"q":"サンプリングによって標本統計量が変動することから生じる誤差は？","answer":"標本誤差","aliases":[],"explanation":"正解：標本誤差","source":"標本理論"},{"q":"同様の調査を繰り返した際の標本統計量の変動を表す指標は？","answer":"標準誤差","aliases":[],"explanation":"正解：標準誤差","source":"標準誤差"},{"q":"多数の標本平均値の標準偏差に相当するものは？","answer":"標準誤差","aliases":[],"explanation":"正解：標準誤差","source":"標準誤差"},{"q":"資料の目安で |r|=.10 の効果量は？","answer":"小","aliases":[],"explanation":"正解：小","source":"相関"},{"q":"資料の目安で |r|=.30 の効果量は？","answer":"中","aliases":[],"explanation":"正解：中","source":"相関"},{"q":"資料の目安で |r|=.50 の効果量は？","answer":"大","aliases":[],"explanation":"正解：大","source":"相関"},{"q":"直線的ではないためrが0付近でも関連があり得る関係の例は？","answer":"二次曲線関係","aliases":[],"explanation":"正解：二次曲線関係","source":"相関"}]}; const KEY='stats_newonly_20260829_v1'; let type='mc',mode='all',idx=0,list=[],locked=false; let rec=JSON.parse(localStorage.getItem(KEY)||'{"mc":{},"sa":{}}');
function save(){localStorage.setItem(KEY,JSON.stringify(rec))}function rFor(i){return rec[type][i]||{correct:0,wrong:0,attempts:0,last:null}}function setR(i,r){rec[type][i]=r;save()}
function setType(t){type=t;idx=0;build();render()}function setMode(m){mode=m;idx=0;build();render()}function build(){let arr=DATA[type].map((_,i)=>i);if(mode==='unanswered')arr=arr.filter(i=>rFor(i).attempts===0);if(mode==='wrong')arr=arr.filter(i=>rFor(i).wrong>0);if(mode==='wrong1')arr=arr.filter(i=>rFor(i).wrong===1);if(mode==='wrong2')arr=arr.filter(i=>rFor(i).wrong===2);if(mode==='wrong3')arr=arr.filter(i=>rFor(i).wrong>=3);if(mode==='random'){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}list=arr;updateStats()}
function updateStats(){let rs=Object.values(rec[type]),c=rs.reduce((a,x)=>a+x.correct,0),w=rs.reduce((a,x)=>a+x.wrong,0),done=rs.filter(x=>x.attempts>0).length;document.getElementById('sCorrect').textContent=c;document.getElementById('sWrong').textContent=w;document.getElementById('sRate').textContent=(c+w)?Math.round(c/(c+w)*100)+'%':'-';document.getElementById('sProgress').textContent=done+'/'+DATA[type].length;document.getElementById('tabMc').classList.toggle('active',type==='mc');document.getElementById('tabSa').classList.toggle('active',type==='sa');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function render(){updateStats();let empty=!list.length;document.getElementById('empty').classList.toggle('hidden',!empty);document.getElementById('card').classList.toggle('hidden',empty);if(empty)return;if(idx>=list.length)idx=0;if(idx<0)idx=list.length-1;let qi=list[idx],q=DATA[type][qi],r=rFor(qi);locked=false;document.getElementById('meta').textContent=(idx+1)+' / '+list.length;document.getElementById('question').textContent=q.q;document.getElementById('source').textContent='出典：'+q.source;document.getElementById('feedback').className='feedback hidden';document.getElementById('feedback').textContent='';document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回';document.getElementById('mcArea').classList.toggle('hidden',type!=='mc');document.getElementById('saArea').classList.toggle('hidden',type!=='sa');if(type==='mc'){let box=document.getElementById('choices');box.innerHTML='';q.options.forEach((o,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>judgeMc(j,b);box.appendChild(b)});document.getElementById('revealMc').disabled=false}else{document.getElementById('saInput').value='';document.getElementById('saInput').disabled=false}}
function showFb(ok,text){let f=document.getElementById('feedback');f.className='feedback '+(ok===true?'ok':ok===false?'ng':'');f.innerHTML=text}
function judgeMc(sel){if(locked)return;locked=true;let qi=list[idx],q=DATA.mc[qi],r=rFor(qi);r.attempts++;if(sel===q.answer)r.correct++;else r.wrong++;r.last=sel===q.answer;setR(qi,r);[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===sel&&sel!==q.answer)b.classList.add('wrong')});showFb(sel===q.answer,(sel===q.answer?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealMc(){if(locked)return;locked=true;let q=DATA.mc[list[idx]];[...document.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct')});showFb(null,'<b>答え：</b>'+q.options[q.answer]+'<br>'+q.explanation)}
function norm(s){return s.toLowerCase().replace(/[\s　・･\.。()（）\-−ー]/g,'').replace(/ｔ/g,'t').replace(/ｚ/g,'z')}
function judgeSa(){if(locked)return;let inp=document.getElementById('saInput').value.trim();if(!inp)return;locked=true;let qi=list[idx],q=DATA.sa[qi],r=rFor(qi),valid=[q.answer,...(q.alts||[])].map(norm),ok=valid.includes(norm(inp));r.attempts++;if(ok)r.correct++;else r.wrong++;r.last=ok;setR(qi,r);document.getElementById('saInput').disabled=true;showFb(ok,(ok?'○ 正解！':'× 不正解')+'<br><b>答え：</b>'+q.answer+'<br>'+q.explanation);updateStats();document.getElementById('history').textContent='この問題の記録：正解 '+r.correct+'回 ／ 不正解 '+r.wrong+'回 ／ 挑戦 '+r.attempts+'回'}
function revealSa(){if(locked)return;locked=true;let q=DATA.sa[list[idx]];document.getElementById('saInput').disabled=true;showFb(null,'<b>答え：</b>'+q.answer+'<br>'+q.explanation)}function next(){idx++;render()}function prev(){idx--;render()}function resetAll(){if(confirm('正解・不正解・間違えた回数など、すべての記録を消しますか？')){rec={mc:{},sa:{}};save();build();render()}}
document.getElementById('mcCount').textContent=DATA.mc.length;document.getElementById('saCount').textContent=DATA.sa.length;build();render();</script></body></html>
