function shuffle(){state.randomOrder=[...Array(BANK.length).keys()];for(let i=state.randomOrder.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.randomOrder[i],state.randomOrder[j]]=[state.randomOrder[j],state.randomOrder[i]]}save()}if(state.randomOrder.length!==BANK.length)shuffle();
let mode='all',pool=[],pos=0,locked=false;function build(){let ids=[...Array(BANK.length).keys()];if(mode==='all')pool=ids;else if(mode==='random')pool=[...state.randomOrder];else if(mode==='unanswered')pool=ids.filter(i=>state.attempts[i]===0);else if(mode==='wrongAny')pool=ids.filter(i=>state.wrong[i]>=1);else if(mode==='wrong1')pool=ids.filter(i=>state.wrong[i]===1);else if(mode==='wrong2')pool=ids.filter(i=>state.wrong[i]===2);else pool=ids.filter(i=>state.wrong[i]>=3);pos=0}
function stats(){let c=state.correct.reduce((a,b)=>a+b,0),w=state.wrong.reduce((a,b)=>a+b,0),a=c+w;document.getElementById('correct').textContent=c;document.getElementById('wrong').textContent=w;document.getElementById('rate').textContent=a?Math.round(c/a*100)+'%':'0%';document.getElementById('position').textContent=pool.length?(pos+1)+'/'+pool.length:'0/'+pool.length;let solved=state.attempts.filter(x=>x>0).length;document.getElementById('bar').style.width=solved/BANK.length*100+'%'}
function draw(){let quiz=document.getElementById('quiz'),empty=document.getElementById('empty');quiz.innerHTML='';if(!pool.length){empty.style.display='block';stats();return}empty.style.display='none';locked=false;let qi=pool[pos],item=BANK[qi];let card=document.createElement('div');card.className='card';card.innerHTML='<div class="meta">問題 '+(pos+1)+' / '+pool.length+'</div><div class="q"></div><div class="history"></div><div class="choices"></div><div class="feedback"></div><div class="explain"></div><button class="next">次の問題へ</button>';card.querySelector('.q').textContent=item.q;card.querySelector('.history').textContent=`この問題の履歴：○ ${state.correct[qi]}回 ／ × ${state.wrong[qi]}回 ／ 挑戦 ${state.attempts[qi]}回`;item.options.forEach((op,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+op;b.onclick=()=>answer(qi,op,i,card);card.querySelector('.choices').appendChild(b)});card.querySelector('.next').onclick=()=>{pos=(pos+1)%pool.length;draw()};quiz.appendChild(card);stats()}
function answer(qi,selected,i,card){if(locked)return;locked=true;let item=BANK[qi],ok=selected===item.answer;state.attempts[qi]++;if(ok)state.correct[qi]++;else state.wrong[qi]++;save();[...card.querySelectorAll('.choice')].forEach((b,j)=>{b.disabled=true;if(item.options[j]===item.answer)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});let fb=card.querySelector('.feedback');fb.style.display='block';fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'○ 正解！':'× 不正解';let ex=card.querySelector('.explain');ex.style.display='block';ex.innerHTML='<b>正解：'+item.answer+'</b><br><br>'+item.explanation;card.querySelector('.history').textContent=`この問題の履歴：○ ${state.correct[qi]}回 ／ × ${state.wrong[qi]}回 ／ 挑戦 ${state.attempts[qi]}回`;card.querySelector('.next').style.display='block';stats()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;build();draw()});document.getElementById('reset').onclick=()=>{if(confirm('学習記録をすべて消しますか？')){state=fresh();shuffle();build();draw()}};document.getElementById('reshuffle').onclick=()=>{shuffle();if(mode==='random'){build();draw()}};document.getElementById('toggle').onclick=()=>{let m=document.getElementById('menu'),b=document.getElementById('toggle');let h=m.classList.toggle('hidden');b.textContent=h?'▼ メニューを表示':'▲ メニューを隠す'};build();draw();
</script></body></html>
