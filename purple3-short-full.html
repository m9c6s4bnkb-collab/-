e":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A25","stem":"基本的帰属の誤りでは、他者の行動原因としてどの種類の要因を過大視しやすいか。","answer":"内的要因","group":"attribution_source","term":"基本的帰属の誤り（対応バイアス）","note":"基本的帰属の誤りでは、他者の行動について本来の性格や動機づけ、能力などの内的要因が重視されすぎ、外的状況で生じた行動でも内的要因が推測されやすい。","id":"p3q0360","options":["内的要因","外部環境","行為者の内的属性","障害"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A25","stem":"基本的帰属の誤りで過小評価されやすいのは何要因か。","answer":"外的状況要因","group":"attribution_source","term":"基本的帰属の誤り（対応バイアス）","note":"基本的帰属の誤りでは、他者の行動について本来の性格や動機づけ、能力などの内的要因が重視されすぎ、外的状況で生じた行動でも内的要因が推測されやすい。","id":"p3q0361","options":["内的要因","外部環境","障害","外的状況要因"]},{"page":17,"chapter":"社会心理学","origin":"左ページQuestion Q26","stem":"同じ行動でも、他者の場合は内的要因、自分の場合は外部の状況要因に帰属しやすい傾向を何と呼ぶか。","answer":"行為者―観察者バイアス","group":"social_bias","term":"行為者―観察者バイアス","note":"行為者―観察者バイアスは、行為者本人とその行動を見聞きした観察者の間で、同一行動の原因帰属の仕方が異なることである。","id":"p3q0362","options":["透明性錯誤","多元的無知","行為者―観察者バイアス","対応バイアス"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A26","stem":"行為者―観察者バイアスでは、他者の行動は何要因に帰属しやすいか。","answer":"内的要因","group":"attribution_source","term":"行為者―観察者バイアス","note":"行為者―観察者バイアスは、行為者本人とその行動を見聞きした観察者の間で、同一行動の原因帰属の仕方が異なることである。","id":"p3q0363","options":["障害","行為者の内的属性","外的要因","内的要因"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A26","stem":"行為者―観察者バイアスでは、自分の行動は何要因に帰属しやすいか。","answer":"外的要因","group":"attribution_source","term":"行為者―観察者バイアス","note":"行為者―観察者バイアスは、行為者本人とその行動を見聞きした観察者の間で、同一行動の原因帰属の仕方が異なることである。","id":"p3q0364","options":["内的要因","行為者の内的属性","外的要因","障害"]},{"page":17,"chapter":"社会心理学","origin":"左ページQuestion Q27","stem":"他者の行動原因を、その行動と人の意図・内的属性との対応性、外部からの圧力や社会的望ましさなどから推論する理論を何と呼ぶか。","answer":"対応推論理論","group":"social_theory","term":"対応推論理論","note":"Jones,E.E.とDavis,K.E.の対応推論理論では、外部要因の影響が低いのにその行為を意図して行った場合や、社会的に望ましくない行為ほど内的属性の現れと推論されやすい。","id":"p3q0365","options":["接種理論","社会的アイデンティティ理論","ケリーの共変原理（ANOVAモデル）","対応推論理論"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A27","stem":"対応推論理論を提唱した人物は誰か。","answer":"Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","group":"social_person","term":"対応推論理論","note":"Jones,E.E.とDavis,K.E.の対応推論理論では、外部要因の影響が低いのにその行為を意図して行った場合や、社会的に望ましくない行為ほど内的属性の現れと推論されやすい。","id":"p3q0366","options":["Heider,F.（ハイダー）","Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Bem,D.J.（ベム）","Merton,R.K.（マートン）"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A27","stem":"対応推論理論では、外部からの圧力が低い行動ほど何の現れと推論されやすいか。","answer":"行為者の内的属性","group":"attribution_source","term":"対応推論理論","note":"Jones,E.E.とDavis,K.E.の対応推論理論では、外部要因の影響が低いのにその行為を意図して行った場合や、社会的に望ましくない行為ほど内的属性の現れと推論されやすい。","id":"p3q0367","options":["内的要因","外部環境","行為者の内的属性","外的要因"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A27","stem":"対応推論理論では、社会的に望ましい行為と望ましくない行為のどちらが内的属性を推論しやすいか。","answer":"社会的に望ましくない行為","group":"social_behavior","term":"対応推論理論","note":"Jones,E.E.とDavis,K.E.の対応推論理論では、外部要因の影響が低いのにその行為を意図して行った場合や、社会的に望ましくない行為ほど内的属性の現れと推論されやすい。","id":"p3q0368","options":["向社会的行動","社会的に望ましくない行為","愛他的行動","援助行動"]},{"page":18,"chapter":"社会心理学","origin":"左ページQuestion Q28","stem":"Rotter,J.B.（ロッター）が提唱した、行動結果を自分で統制できるか外部要因に統制されるかという認知スタイルを何と呼ぶか。","answer":"ローカス・オブ・コントロール（統制の所在）","group":"social_term","term":"ローカス・オブ・コントロール（統制の所在）","note":"ローカス・オブ・コントロールはRotterの社会的学習理論で提唱された性格特性。能力・努力で結果を統制できると考える内的統制と、運・課題困難度などで決まると考える外的統制がある。","id":"p3q0369","options":["行為者―観察者バイアス","対応推論理論","ローカス・オブ・コントロール（統制の所在）","内的帰属"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A28","stem":"ローカス・オブ・コントロールを提唱した人物は誰か。","answer":"Rotter,J.B.（ロッター）","group":"social_person","term":"ローカス・オブ・コントロール（統制の所在）","note":"ローカス・オブ・コントロールはRotterの社会的学習理論で提唱された性格特性。能力・努力で結果を統制できると考える内的統制と、運・課題困難度などで決まると考える外的統制がある。","id":"p3q0370","options":["Rotter,J.B.（ロッター）","Zajonc,R.B.（ザイアンス）","Fiedler,F.（フィードラー）","Heider,F.（ハイダー）"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A28","stem":"能力や努力によって結果を統制できると考える傾向を何というか。","answer":"内的統制","group":"locus_type","term":"ローカス・オブ・コントロール（統制の所在）","note":"ローカス・オブ・コントロールはRotterの社会的学習理論で提唱された性格特性。能力・努力で結果を統制できると考える内的統制と、運・課題困難度などで決まると考える外的統制がある。","id":"p3q0371","options":["内的帰属","外的統制","内的統制","外的帰属"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A28","stem":"運や課題の困難さによって結果が統制されると考える傾向を何というか。","answer":"外的統制","group":"locus_type","term":"ローカス・オブ・コントロール（統制の所在）","note":"ローカス・オブ・コントロールはRotterの社会的学習理論で提唱された性格特性。能力・努力で結果を統制できると考える内的統制と、運・課題困難度などで決まると考える外的統制がある。","id":"p3q0372","options":["内的帰属","内的統制","外的統制","外的帰属"]},{"page":18,"chapter":"社会心理学","origin":"左ページQuestion Q29","stem":"Kelley,H.H.（ケリー）が提唱した、他者の行動原因を弁別性・一貫性・合意性の組み合わせから推測する考えを何と呼ぶか。","answer":"ケリーの共変原理（ANOVAモデル）","group":"social_theory","term":"ケリーの共変原理（ANOVAモデル）","note":"共変原理では、人・刺激・状況が変化した時の結果の共変性を調べ、弁別性、一貫性、合意性のパターンから原因を推論する。広範な情報を繰り返し収集できる場合に適用可能である。","id":"p3q0373","options":["接種理論","認知的不協和理論","ケリーの共変原理（ANOVAモデル）","社会的アイデンティティ理論"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A29","stem":"ケリーの共変原理で用いられる3情報は、弁別性・一貫性と何か。","answer":"合意性","group":"covariation_cue","term":"ケリーの共変原理（ANOVAモデル）","note":"共変原理では、人・刺激・状況が変化した時の結果の共変性を調べ、弁別性、一貫性、合意性のパターンから原因を推論する。広範な情報を繰り返し収集できる場合に適用可能である。","id":"p3q0374","options":["対応性","合意性","一貫性","弁別性"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A29","stem":"共変原理で、その人が別の刺激にも同じ反応をするかを見る情報を何というか。","answer":"弁別性","group":"covariation_cue","term":"ケリーの共変原理（ANOVAモデル）","note":"共変原理では、人・刺激・状況が変化した時の結果の共変性を調べ、弁別性、一貫性、合意性のパターンから原因を推論する。広範な情報を繰り返し収集できる場合に適用可能である。","id":"p3q0375","options":["合意性","対応性","一貫性","弁別性"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A29","stem":"共変原理で、その反応が時や状況を越えて一貫しているかを見る情報を何というか。","answer":"一貫性","group":"covariation_cue","term":"ケリーの共変原理（ANOVAモデル）","note":"共変原理では、人・刺激・状況が変化した時の結果の共変性を調べ、弁別性、一貫性、合意性のパターンから原因を推論する。広範な情報を繰り返し収集できる場合に適用可能である。","id":"p3q0376","options":["合意性","弁別性","対応性","一貫性"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A29","stem":"共変原理で、他者も同様の反応をするかを見る情報を何というか。","answer":"合意性","group":"covariation_cue","term":"ケリーの共変原理（ANOVAモデル）","note":"共変原理では、人・刺激・状況が変化した時の結果の共変性を調べ、弁別性、一貫性、合意性のパターンから原因を推論する。広範な情報を繰り返し収集できる場合に適用可能である。","id":"p3q0377","options":["対応性","合意性","弁別性","一貫性"]},{"page":18,"chapter":"社会心理学","origin":"左ページQuestion Q30","stem":"自分にとって良い結果は内的属性に、悪い結果は外的要因に帰属する傾向を何と呼ぶか。","answer":"セルフ・サービング・バイアス","group":"social_bias","term":"セルフ・サービング・バイアス","note":"セルフ・サービング・バイアスは利己的帰属ともいい、望ましい結果を内的属性に帰属する自己高揚的帰属と、望ましくない結果を外的要因に帰属する自己防衛的帰属がある。","id":"p3q0378","options":["行為者―観察者バイアス","基本的帰属の誤り（対応バイアス）","セルフ・サービング・バイアス","内集団バイアス"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A30","stem":"セルフ・サービング・バイアスの別名は何か。","answer":"利己的帰属","group":"social_bias","term":"セルフ・サービング・バイアス","note":"セルフ・サービング・バイアスは利己的帰属ともいい、望ましい結果を内的属性に帰属する自己高揚的帰属と、望ましくない結果を外的要因に帰属する自己防衛的帰属がある。","id":"p3q0379","options":["多元的無知","外集団均質化効果","基本的帰属の誤り（対応バイアス）","利己的帰属"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A30","stem":"望ましい結果を内的属性に帰属することを何というか。","answer":"自己高揚的帰属","group":"attribution_type","term":"セルフ・サービング・バイアス","note":"セルフ・サービング・バイアスは利己的帰属ともいい、望ましい結果を内的属性に帰属する自己高揚的帰属と、望ましくない結果を外的要因に帰属する自己防衛的帰属がある。","id":"p3q0380","options":["自己防衛的帰属","外的帰属","内的帰属","自己高揚的帰属"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A30","stem":"望ましくない結果を外的要因に帰属することを何というか。","answer":"自己防衛的帰属","group":"attribution_type","term":"セルフ・サービング・バイアス","note":"セルフ・サービング・バイアスは利己的帰属ともいい、望ましい結果を内的属性に帰属する自己高揚的帰属と、望ましくない結果を外的要因に帰属する自己防衛的帰属がある。","id":"p3q0381","options":["外的帰属","自己防衛的帰属","自己高揚的帰属","内的帰属"]},{"page":18,"chapter":"社会心理学","origin":"左ページQuestion Q31","stem":"Heider,F.（ハイダー）が提唱した、自己・他者・共通の対象の3者関係で不均衡があると認知を変化させて均衡をとろうとする理論を何と呼ぶか。","answer":"バランス理論（P-O-Xモデル、認知的均衡理論）","group":"social_theory","term":"バランス理論（P-O-Xモデル、認知的均衡理論）","note":"バランス理論では3つの相互関係を正・負で表し、その積が正ならバランス状態とする。すべて正、または2つが負で1つが正の場合にバランスがとれる。","id":"p3q0382","options":["心理的リアクタンス理論","素朴心理学","バランス理論（P-O-Xモデル、認知的均衡理論）","認知的不協和理論"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A31","stem":"バランス理論のP-O-XのPは何を表すか。","answer":"自己（P）","group":"pox_element","term":"バランス理論（P-O-Xモデル、認知的均衡理論）","note":"バランス理論では3つの相互関係を正・負で表し、その積が正ならバランス状態とする。すべて正、または2つが負で1つが正の場合にバランスがとれる。","id":"p3q0383","options":["自己（P）","他者（O）","集団（G）","対象（X）"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A31","stem":"バランス理論で、3つの関係の積が正と負のどちらならバランス状態か。","answer":"正","group":"balance_sign","term":"バランス理論（P-O-Xモデル、認知的均衡理論）","note":"バランス理論では3つの相互関係を正・負で表し、その積が正ならバランス状態とする。すべて正、または2つが負で1つが正の場合にバランスがとれる。","id":"p3q0384","options":["正","0","負","符号の積は用いない"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A31","stem":"バランス理論で、3つの関係のうち2つが負、1つが正である時の状態を何というか。","answer":"バランス状態","group":"balance_state","term":"バランス理論（P-O-Xモデル、認知的均衡理論）","note":"バランス理論では3つの相互関係を正・負で表し、その積が正ならバランス状態とする。すべて正、または2つが負で1つが正の場合にバランスがとれる。","id":"p3q0385","options":["認知的不協和状態","バランス状態","中立状態","不均衡状態"]},{"page":18,"chapter":"社会心理学","origin":"左ページQuestion Q32","stem":"Festinger,L.（フェスティンガー）が提唱した、複数の認知要素間の矛盾による不快状態を解消するため認知や行動を変化させるという理論を何と呼ぶか。","answer":"認知的不協和理論","group":"social_theory","term":"認知的不協和理論","note":"認知的不協和を低減する方法には、不協和な認知要素の一方を変えて協和関係にする、不協和な認知要素を過小評価する、新しい協和的認知要素を追加するなどがある。","id":"p3q0386","options":["対応推論理論","自己知覚理論","認知的不協和理論","社会的インパクト理論"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A32","stem":"認知的不協和理論を提唱した人物は誰か。","answer":"Festinger,L.（フェスティンガー）","group":"social_person","term":"認知的不協和理論","note":"認知的不協和を低減する方法には、不協和な認知要素の一方を変えて協和関係にする、不協和な認知要素を過小評価する、新しい協和的認知要素を追加するなどがある。","id":"p3q0387","options":["Zajonc,R.B.（ザイアンス）","Luft,J.（ルフト）とIngham,H.（インガム）","Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Festinger,L.（フェスティンガー）"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A32","stem":"不協和低減法の1つとして、不協和な認知要素をどのように評価する方法があるか。","answer":"過小評価する","group":"dissonance_reduction","term":"認知的不協和理論","note":"認知的不協和を低減する方法には、不協和な認知要素の一方を変えて協和関係にする、不協和な認知要素を過小評価する、新しい協和的認知要素を追加するなどがある。","id":"p3q0388","options":["過小評価する","協和的認知要素を追加する","認知要素の一方を変える","不協和な要素を過小評価する"]},{"page":18,"chapter":"社会心理学","origin":"右ページAnswer解説 A32","stem":"不協和低減のため新たに追加するのは不協和的要素と協和的要素のどちらか。","answer":"協和的認知要素","group":"dissonance_reduction","term":"認知的不協和理論","note":"認知的不協和を低減する方法には、不協和な認知要素の一方を変えて協和関係にする、不協和な認知要素を過小評価する、新しい協和的認知要素を追加するなどがある。","id":"p3q0389","options":["不協和な要素を過小評価する","協和的認知要素を追加する","協和的認知要素","不協和要素を増やす"]},{"page":19,"chapter":"社会心理学","origin":"左ページQuestion Q33","stem":"Bem,D.J.（ベム）が提唱した、自分の内的状態を知る手がかりが不十分な場合に自分の行動や状況から内的状態を推測する理論を何と呼ぶか。","answer":"自己知覚理論","group":"social_theory","term":"自己知覚理論","note":"自己知覚理論は、自分の感情や態度などの内的状態を知覚する過程を扱い、報酬や社会的拘束など行動を強く統制する要因がない時に適用できる。","id":"p3q0390","options":["自己知覚理論","対応推論理論","バランス理論（P-O-Xモデル、認知的均衡理論）","社会的アイデンティティ理論"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A33","stem":"自己知覚理論を提唱した人物は誰か。","answer":"Bem,D.J.（ベム）","group":"social_person","term":"自己知覚理論","note":"自己知覚理論は、自分の感情や態度などの内的状態を知覚する過程を扱い、報酬や社会的拘束など行動を強く統制する要因がない時に適用できる。","id":"p3q0391","options":["Rosenthal,R.（ローゼンタール）","三隅二不二","Ringelmann,M.（リンゲルマン）","Bem,D.J.（ベム）"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A33","stem":"自己知覚理論で推測の対象となるのは自分の何か。","answer":"内的状態","group":"self_target","term":"自己知覚理論","note":"自己知覚理論は、自分の感情や態度などの内的状態を知覚する過程を扱い、報酬や社会的拘束など行動を強く統制する要因がない時に適用できる。","id":"p3q0392","options":["集団規範","他者の態度","外的環境","内的状態"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A33","stem":"自己知覚理論が適用されやすいのは、報酬や社会的拘束が強い場合と弱い場合のどちらか。","answer":"強い統制要因がない場合","group":"control_condition","term":"自己知覚理論","note":"自己知覚理論は、自分の感情や態度などの内的状態を知覚する過程を扱い、報酬や社会的拘束など行動を強く統制する要因がない時に適用できる。","id":"p3q0393","options":["強い統制要因がない場合","強い報酬がある場合","強い社会的拘束がある場合","強い外的圧力がある場合"]},{"page":19,"chapter":"社会心理学","origin":"左ページQuestion Q34","stem":"他者が抱く自分に対する印象を意図的に方向づけようとする行動を何と呼ぶか。","answer":"自己呈示","group":"social_term","term":"自己呈示","note":"自己呈示には言語的だけでなく非言語的な情報伝達も含まれる。Jones,E.E.は自己呈示の目標を、取り入り、自己宣伝、示範、威嚇、哀願の5つに分類した。","id":"p3q0394","options":["自己成就的予言（自己充足的予言）","ピグマリオン効果（教師期待効果）","自己呈示","セルフ・ハンディキャッピング"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A34","stem":"自己呈示には言語的情報だけでなく何的な情報伝達も含まれるか。","answer":"非言語的","group":"communication_type","term":"自己呈示","note":"自己呈示には言語的だけでなく非言語的な情報伝達も含まれる。Jones,E.E.は自己呈示の目標を、取り入り、自己宣伝、示範、威嚇、哀願の5つに分類した。","id":"p3q0395","options":["非言語的","言語的","自己開示","説得的コミュニケーション"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A34","stem":"Jonesが示した自己呈示の目標は全部でいくつか。","answer":"5つ","group":"number_count","term":"自己呈示","note":"自己呈示には言語的だけでなく非言語的な情報伝達も含まれる。Jones,E.E.は自己呈示の目標を、取り入り、自己宣伝、示範、威嚇、哀願の5つに分類した。","id":"p3q0396","options":["5つ","4つ","1つ","3つ"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A34","stem":"自己呈示の目標の1つで、自分の優秀さを強調するものを何というか。","answer":"自己宣伝","group":"self_presentation_strategy","term":"自己呈示","note":"自己呈示には言語的だけでなく非言語的な情報伝達も含まれる。Jones,E.E.は自己呈示の目標を、取り入り、自己宣伝、示範、威嚇、哀願の5つに分類した。","id":"p3q0397","options":["哀願","取り入り","威嚇","自己宣伝"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A34","stem":"自己呈示の目標の1つで、弱さを示して援助を引き出そうとするものを何というか。","answer":"哀願","group":"self_presentation_strategy","term":"自己呈示","note":"自己呈示には言語的だけでなく非言語的な情報伝達も含まれる。Jones,E.E.は自己呈示の目標を、取り入り、自己宣伝、示範、威嚇、哀願の5つに分類した。","id":"p3q0398","options":["示範","取り入り","哀願","自己宣伝"]},{"page":19,"chapter":"社会心理学","origin":"左ページQuestion Q35","stem":"ありのままの自分に関する情報を他者に伝える行動を何と呼ぶか。","answer":"自己開示","group":"social_term","term":"自己開示","note":"自己開示には個人的機能と対人的機能がある。個人的機能にはカタルシス効果や自己明確化、対人的機能には親密感の深まりや信頼感の高まりがある。","id":"p3q0399","options":["自己開示","ピグマリオン効果（教師期待効果）","ジョハリの窓","セルフ・ハンディキャッピング"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A35","stem":"自己開示の個人的機能として、感情を表出することによる効果を何というか。","answer":"カタルシス効果","group":"self_disclosure_function","term":"自己開示","note":"自己開示には個人的機能と対人的機能がある。個人的機能にはカタルシス効果や自己明確化、対人的機能には親密感の深まりや信頼感の高まりがある。","id":"p3q0400","options":["信頼感","親密感","カタルシス効果","自己明確化"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A35","stem":"自己開示の個人的機能で、言語化により自分を理解しやすくする機能を何というか。","answer":"自己明確化","group":"self_disclosure_function","term":"自己開示","note":"自己開示には個人的機能と対人的機能がある。個人的機能にはカタルシス効果や自己明確化、対人的機能には親密感の深まりや信頼感の高まりがある。","id":"p3q0401","options":["カタルシス効果","親密感","自己明確化","信頼感"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A35","stem":"自己開示の対人的機能として高まりやすいものは親密感と何か。","answer":"信頼感","group":"self_disclosure_function","term":"自己開示","note":"自己開示には個人的機能と対人的機能がある。個人的機能にはカタルシス効果や自己明確化、対人的機能には親密感の深まりや信頼感の高まりがある。","id":"p3q0402","options":["親密感","カタルシス効果","信頼感","自己明確化"]},{"page":19,"chapter":"社会心理学","origin":"左ページQuestion Q36","stem":"Altman,I.（アルトマン）とTaylor,D.A.（テーラー）が提唱した、2人の関係の進展を自己開示によって相手の深い部分へ掘り下げる過程と捉える理論を何と呼ぶか。","answer":"社会的浸透理論","group":"social_theory","term":"社会的浸透理論","note":"社会的浸透理論では個人のパーソナリティを中心から周辺へ同心円状に捉え、関係の進展を相互作用の中で周辺的な層から中心的な層へ浸透していく過程とする。報酬とコストにも影響される。","id":"p3q0403","options":["接種理論","暗黙のパーソナリティ理論","対応推論理論","社会的浸透理論"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A36","stem":"社会的浸透理論を提唱した人物は誰か。","answer":"Altman,I.（アルトマン）とTaylor,D.A.（テーラー）","group":"social_person","term":"社会的浸透理論","note":"社会的浸透理論では個人のパーソナリティを中心から周辺へ同心円状に捉え、関係の進展を相互作用の中で周辺的な層から中心的な層へ浸透していく過程とする。報酬とコストにも影響される。","id":"p3q0404","options":["Tajfel,H.（タジフェル）とTurner,J.C.（ターナー）","Altman,I.（アルトマン）とTaylor,D.A.（テーラー）","Fiedler,F.（フィードラー）","Janis,I.L.（ジャニス）"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A36","stem":"社会的浸透理論ではパーソナリティをどのような形状の層として捉えるか。","answer":"同心円状","group":"shape","term":"社会的浸透理論","note":"社会的浸透理論では個人のパーソナリティを中心から周辺へ同心円状に捉え、関係の進展を相互作用の中で周辺的な層から中心的な層へ浸透していく過程とする。報酬とコストにも影響される。","id":"p3q0405","options":["タツノオトシゴ","アーモンド","松ぼっくり","同心円状"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A36","stem":"社会的浸透理論で関係が深まる方向は、周辺的な層からどの層へ向かうか。","answer":"中心的な層","group":"spatial_position","term":"社会的浸透理論","note":"社会的浸透理論では個人のパーソナリティを中心から周辺へ同心円状に捉え、関係の進展を相互作用の中で周辺的な層から中心的な層へ浸透していく過程とする。報酬とコストにも影響される。","id":"p3q0406","options":["中心特性","中心的な層","周辺特性","初頭効果"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A36","stem":"社会的浸透理論では関係進展が相互作用の何とコストに影響されると考えるか。","answer":"報酬","group":"social_factor","term":"社会的浸透理論","note":"社会的浸透理論では個人のパーソナリティを中心から周辺へ同心円状に捉え、関係の進展を相互作用の中で周辺的な層から中心的な層へ浸透していく過程とする。報酬とコストにも影響される。","id":"p3q0407","options":["情報源の信憑性","呈示順序","報酬","顕著な特徴"]},{"page":19,"chapter":"社会心理学","origin":"左ページQuestion Q37","stem":"Luft,J.（ルフト）とIngham,H.（インガム）が提唱した、自己について「自分が知っている／知らない」「他者が知っている／知らない」の2次元から捉えるモデルを何と呼ぶか。","answer":"ジョハリの窓","group":"social_model","term":"ジョハリの窓","note":"ジョハリの窓は開放領域、盲点領域、隠蔽領域、未知領域の4領域からなる。自己開示により開放領域を広げ、他の領域を狭めることが対人関係や自己理解の深化につながる。","id":"p3q0408","options":["ジョハリの窓","自己評価維持モデル","自己開示","ピグマリオン効果（教師期待効果）"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A37","stem":"ジョハリの窓を提唱した人物は誰か。","answer":"Luft,J.（ルフト）とIngham,H.（インガム）","group":"social_person","term":"ジョハリの窓","note":"ジョハリの窓は開放領域、盲点領域、隠蔽領域、未知領域の4領域からなる。自己開示により開放領域を広げ、他の領域を狭めることが対人関係や自己理解の深化につながる。","id":"p3q0409","options":["Luft,J.（ルフト）とIngham,H.（インガム）","Bem,D.J.（ベム）","Altman,I.（アルトマン）とTaylor,D.A.（テーラー）","Heider,F.（ハイダー）"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A37","stem":"ジョハリの窓の4領域は、開放領域・盲点領域・隠蔽領域と何か。","answer":"未知領域","group":"johari_area","term":"ジョハリの窓","note":"ジョハリの窓は開放領域、盲点領域、隠蔽領域、未知領域の4領域からなる。自己開示により開放領域を広げ、他の領域を狭めることが対人関係や自己理解の深化につながる。","id":"p3q0410","options":["隠蔽領域","開放領域","未知領域","盲点領域"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A37","stem":"自己開示によって広がるとされるジョハリの窓の領域は何か。","answer":"開放領域","group":"johari_area","term":"ジョハリの窓","note":"ジョハリの窓は開放領域、盲点領域、隠蔽領域、未知領域の4領域からなる。自己開示により開放領域を広げ、他の領域を狭めることが対人関係や自己理解の深化につながる。","id":"p3q0411","options":["隠蔽領域","開放領域","未知領域","盲点領域"]},{"page":19,"chapter":"社会心理学","origin":"右ページAnswer解説 A37","stem":"開放領域が広がることは対人関係の進展と何の深まりにつながるか。","answer":"自己理解","group":"social_outcome","term":"ジョハリの窓","note":"ジョハリの窓は開放領域、盲点領域、隠蔽領域、未知領域の4領域からなる。自己開示により開放領域を広げ、他の領域を狭めることが対人関係や自己理解の深化につながる。","id":"p3q0412","options":["信頼感","自己理解","態度","好感度"]},{"page":20,"chapter":"社会心理学","origin":"左ページQuestion Q38","stem":"Tesser,A.（テッサー）が提唱した、心理的に近い他者の優れた遂行が自己評価を脅かす時に、関与度・遂行レベル・心理的距離を操作して自己評価を維持する理論を何と呼ぶか。","answer":"自己評価維持モデル","group":"social_model","term":"自己評価維持モデル","note":"自己評価維持モデルでは、心理的距離が近い他者の優れた遂行は、自分の課題への関与度が低ければ自己評価を高めるが、高ければ脅威となる。関与度、遂行レベル、心理的距離を変えて調整する。","id":"p3q0413","options":["自己呈示","自己知覚理論","ジョハリの窓","自己評価維持モデル"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A38","stem":"自己評価維持モデルを提唱した人物は誰か。","answer":"Tesser,A.（テッサー）","group":"social_person","term":"自己評価維持モデル","note":"自己評価維持モデルでは、心理的距離が近い他者の優れた遂行は、自分の課題への関与度が低ければ自己評価を高めるが、高ければ脅威となる。関与度、遂行レベル、心理的距離を変えて調整する。","id":"p3q0414","options":["Tesser,A.（テッサー）","Zajonc,R.B.（ザイアンス）","Latané,B.（ラタネ）とDarley,J.（ダーリー）","Asch,S.E.（アッシュ）"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A38","stem":"自己評価維持モデルで操作される3要因は、関与度・遂行レベルと何か。","answer":"心理的距離","group":"sem_factor","term":"自己評価維持モデル","note":"自己評価維持モデルでは、心理的距離が近い他者の優れた遂行は、自分の課題への関与度が低ければ自己評価を高めるが、高ければ脅威となる。関与度、遂行レベル、心理的距離を変えて調整する。","id":"p3q0415","options":["関与度","心理的距離","集団凝集性","遂行レベル"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A38","stem":"心理的に近い他者の優れた遂行は、自己の関与度が高い場合に自己評価への何となるか。","answer":"脅威","group":"social_consequence","term":"自己評価維持モデル","note":"自己評価維持モデルでは、心理的距離が近い他者の優れた遂行は、自分の課題への関与度が低ければ自己評価を高めるが、高ければ脅威となる。関与度、遂行レベル、心理的距離を変えて調整する。","id":"p3q0416","options":["偏見や差別","脅威","差別や偏見","対人認知の歪み"]},{"page":20,"chapter":"社会心理学","origin":"左ページQuestion Q39","stem":"高い評価が得られる確信がない時に、評価が得られない理由となる障害を他者に主張したり自ら作り出したりすることを何と呼ぶか。","answer":"セルフ・ハンディキャッピング","group":"social_bias","term":"セルフ・ハンディキャッピング","note":"セルフ・ハンディキャッピングでは課題遂行に失敗すると原因を障害へ帰属して能力帰属を割り引き、成功すると障害にもかかわらず成功できた能力への帰属を割り増す。","id":"p3q0417","options":["セルフ・ハンディキャッピング","セルフ・サービング・バイアス","外集団均質化バイアス","行為者―観察者バイアス"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A39","stem":"セルフ・ハンディキャッピングで失敗した場合、原因を何に帰属しやすいか。","answer":"障害","group":"attribution_source","term":"セルフ・ハンディキャッピング","note":"セルフ・ハンディキャッピングでは課題遂行に失敗すると原因を障害へ帰属して能力帰属を割り引き、成功すると障害にもかかわらず成功できた能力への帰属を割り増す。","id":"p3q0418","options":["外的要因","障害","外部環境","行為者の内的属性"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A39","stem":"セルフ・ハンディキャッピングで失敗した時、自己能力への帰属はどのように調整されるか。","answer":"割り引き","group":"evaluation_direction","term":"セルフ・ハンディキャッピング","note":"セルフ・ハンディキャッピングでは課題遂行に失敗すると原因を障害へ帰属して能力帰属を割り引き、成功すると障害にもかかわらず成功できた能力への帰属を割り増す。","id":"p3q0419","options":["適切","割り引き","均質","割り増し"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A39","stem":"セルフ・ハンディキャッピングで成功した時、自己能力への帰属はどのように調整されるか。","answer":"割り増し","group":"evaluation_direction","term":"セルフ・ハンディキャッピング","note":"セルフ・ハンディキャッピングでは課題遂行に失敗すると原因を障害へ帰属して能力帰属を割り引き、成功すると障害にもかかわらず成功できた能力への帰属を割り増す。","id":"p3q0420","options":["割り増し","割り引き","高く見積もる","均質"]},{"page":20,"chapter":"社会心理学","origin":"左ページQuestion Q40","stem":"他者への期待が意識的・無意識的に自分の行動へ影響し、その期待が実現するように機能する現象を何と呼ぶか。","answer":"ピグマリオン効果（教師期待効果）","group":"social_effect","term":"ピグマリオン効果（教師期待効果）","note":"Rosenthal,R.の実験では教師が児童生徒に抱く期待が成績に影響した。期待が高い場合、教師は無意識にヒントを与え、質問を言い換え、回答を待つなどの行動を示した。","id":"p3q0421","options":["自己成就的予言（自己充足的予言）","ピグマリオン効果（教師期待効果）","セルフ・ハンディキャッピング","自己呈示"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A40","stem":"ピグマリオン効果を実験的に示した人物は誰か。","answer":"Rosenthal,R.（ローゼンタール）","group":"social_person","term":"ピグマリオン効果（教師期待効果）","note":"Rosenthal,R.の実験では教師が児童生徒に抱く期待が成績に影響した。期待が高い場合、教師は無意識にヒントを与え、質問を言い換え、回答を待つなどの行動を示した。","id":"p3q0422","options":["Altman,I.（アルトマン）とTaylor,D.A.（テーラー）","Zajonc,R.B.（ザイアンス）","Rosenthal,R.（ローゼンタール）","Asch,S.E.（アッシュ）"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A40","stem":"ピグマリオン効果の別名は何か。","answer":"教師期待効果","group":"social_effect","term":"ピグマリオン効果（教師期待効果）","note":"Rosenthal,R.の実験では教師が児童生徒に抱く期待が成績に影響した。期待が高い場合、教師は無意識にヒントを与え、質問を言い換え、回答を待つなどの行動を示した。","id":"p3q0423","options":["教師期待効果","ブーメラン効果","傍観者効果","サッカー効果"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A40","stem":"高い期待をもつ教師の行動例として、ヒントを与える・質問を言い換えることと並んで挙げられるものは何か。","answer":"回答を待つ","group":"teacher_behavior","term":"ピグマリオン効果（教師期待効果）","note":"Rosenthal,R.の実験では教師が児童生徒に抱く期待が成績に影響した。期待が高い場合、教師は無意識にヒントを与え、質問を言い換え、回答を待つなどの行動を示した。","id":"p3q0424","options":["別の生徒へ直ちに答えを求める","回答を待つ","質問を打ち切る","すぐに正解を教える"]},{"page":20,"chapter":"社会心理学","origin":"左ページQuestion Q41","stem":"個人の予期が無意識のうちにその予期に即した行動を選ばせ、結果として予期したことが現実になる現象を何と呼ぶか。","answer":"自己成就的予言（自己充足的予言）","group":"social_effect","term":"自己成就的予言（自己充足的予言）","note":"Merton,R.K.が名づけた。オイルショック時の品不足では、品不足になるという予期不安から買い急ぎが生じ実際の品不足につながった。ピグマリオン効果は自己成就的予言の1つである。","id":"p3q0425","options":["自己成就的予言（自己充足的予言）","セルフ・ハンディキャッピング","自己呈示","ピグマリオン効果（教師期待効果）"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A41","stem":"自己成就的予言を名づけた人物は誰か。","answer":"Merton,R.K.（マートン）","group":"social_person","term":"自己成就的予言（自己充足的予言）","note":"Merton,R.K.が名づけた。オイルショック時の品不足では、品不足になるという予期不安から買い急ぎが生じ実際の品不足につながった。ピグマリオン効果は自己成就的予言の1つである。","id":"p3q0426","options":["Rotter,J.B.（ロッター）","Heider,F.（ハイダー）","Merton,R.K.（マートン）","Janis,I.L.（ジャニス）"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A41","stem":"自己成就的予言の例として本文で挙げられる社会現象は何か。","answer":"オイルショック時の品不足","group":"social_event","term":"自己成就的予言（自己充足的予言）","note":"Merton,R.K.が名づけた。オイルショック時の品不足では、品不足になるという予期不安から買い急ぎが生じ実際の品不足につながった。ピグマリオン効果は自己成就的予言の1つである。","id":"p3q0427","options":["表情写真実験","キティ・ジェノヴィーズ事件","オイルショック時の品不足","共有地の悲劇"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A41","stem":"自己成就的予言の1つとされる教師期待に関する効果は何か。","answer":"ピグマリオン効果","group":"social_effect","term":"自己成就的予言（自己充足的予言）","note":"Merton,R.K.が名づけた。オイルショック時の品不足では、品不足になるという予期不安から買い急ぎが生じ実際の品不足につながった。ピグマリオン効果は自己成就的予言の1つである。","id":"p3q0428","options":["ピグマリオン効果","スリーパー効果","傍観者効果","ブーメラン効果"]},{"page":20,"chapter":"社会心理学","origin":"左ページQuestion Q42","stem":"他者の存在によって個人の作業速度が高まったり作業量が増えたりする現象を何と呼ぶか。","answer":"社会的促進","group":"social_effect","term":"社会的促進","note":"社会的促進は観察者や共行動者が存在することにより生じる。観察者の存在で促進されることを観察者効果、同じ作業を同時に行う他者がいる場合を共行動効果という。","id":"p3q0429","options":["フリーライダー効果（リンゲルマン効果）","社会的促進","サッカー効果","社会的手抜き（社会的怠惰）"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A42","stem":"観察者の存在だけで行動が促進されることを何というか。","answer":"観察者効果","group":"social_effect","term":"社会的促進","note":"社会的促進は観察者や共行動者が存在することにより生じる。観察者の存在で促進されることを観察者効果、同じ作業を同時に行う他者がいる場合を共行動効果という。","id":"p3q0430","options":["社会的促進","社会的手抜き","共行動効果","観察者効果"]},{"page":20,"chapter":"社会心理学","origin":"右ページAnswer解説 A42","stem":"同じ作業を同時に行う他者の存在で行動が促進されることを何というか。","answer":"共行動効果","group":"social_effect","term":"社会的促進","note":"社会的促進は観察者や共行動者が存在することにより生じる。観察者の存在で促進されることを観察者効果、同じ作業を同時に行う他者がいる場合を共行動効果という。","id":"p3q0431","options":["観察者効果","社会的手抜き","社会的促進","共行動効果"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q43","stem":"集団で共同作業をしている時、単独の場合より個人の作業量が低下する現象を何と呼ぶか。","answer":"社会的手抜き（社会的怠惰）","group":"social_effect","term":"社会的手抜き（社会的怠惰）","note":"社会的手抜きは集団人数が増えるにつれて個人の作業量が低下する現象で、社会的圧力の低下、努力への正当な評価が得にくいこと、結果への責任回避などが要因とされる。","id":"p3q0432","options":["フリーライダー効果（リンゲルマン効果）","社会的促進","サッカー効果","社会的手抜き（社会的怠惰）"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A43","stem":"社会的手抜きでは集団の人数が増えると個人の作業量はどうなるか。","answer":"低下する","group":"effect_direction","term":"社会的手抜き（社会的怠惰）","note":"社会的手抜きは集団人数が増えるにつれて個人の作業量が低下する現象で、社会的圧力の低下、努力への正当な評価が得にくいこと、結果への責任回避などが要因とされる。","id":"p3q0433","options":["逆方向","取り入れにくくなる","抑制される","低下する"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A43","stem":"社会的手抜きの要因として、社会的圧力の低下・評価の困難さと並んで挙げられるものは何か。","answer":"責任の回避","group":"social_factor","term":"社会的手抜き（社会的怠惰）","note":"社会的手抜きは集団人数が増えるにつれて個人の作業量が低下する現象で、社会的圧力の低下、努力への正当な評価が得にくいこと、結果への責任回避などが要因とされる。","id":"p3q0434","options":["心理的距離","情報源の信憑性","責任の回避","顕著な特徴"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q44","stem":"集団作業で自分の能力を低く認知し、自分が集団利益に貢献する必要性がないと考えて動機づけを低下させ、他者に頼る現象を何と呼ぶか。","answer":"フリーライダー効果（リンゲルマン効果）","group":"social_effect","term":"フリーライダー効果（リンゲルマン効果）","note":"フリーライダー効果は社会的手抜きの1つで、Ringelmann,M.の実験に由来する。自らの能力を低いと認知して貢献の必要性がないと考え、他者に頼る。","id":"p3q0435","options":["フリーライダー効果（リンゲルマン効果）","社会的手抜き（社会的怠惰）","サッカー効果","社会的促進"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A44","stem":"フリーライダー効果は何の1つとされるか。","answer":"社会的手抜き","group":"social_effect","term":"フリーライダー効果（リンゲルマン効果）","note":"フリーライダー効果は社会的手抜きの1つで、Ringelmann,M.の実験に由来する。自らの能力を低いと認知して貢献の必要性がないと考え、他者に頼る。","id":"p3q0436","options":["社会的促進","社会的手抜き","観察者効果","共行動効果"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A44","stem":"フリーライダー効果の名称に関連する実験を行った人物は誰か。","answer":"Ringelmann,M.（リンゲルマン）","group":"social_person","term":"フリーライダー効果（リンゲルマン効果）","note":"フリーライダー効果は社会的手抜きの1つで、Ringelmann,M.の実験に由来する。自らの能力を低いと認知して貢献の必要性がないと考え、他者に頼る。","id":"p3q0437","options":["Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Merton,R.K.（マートン）","Ringelmann,M.（リンゲルマン）","Tesser,A.（テッサー）"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A44","stem":"フリーライダー効果では自らの能力を高いと低いのどちらに認知しやすいか。","answer":"低い","group":"degree","term":"フリーライダー効果（リンゲルマン効果）","note":"フリーライダー効果は社会的手抜きの1つで、Ringelmann,M.の実験に由来する。自らの能力を低いと認知して貢献の必要性がないと考え、他者に頼る。","id":"p3q0438","options":["リスキーシフト","低い","コーシャスシフト","集団思考"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q45","stem":"集団作業で自分以外の他者が集団利益に貢献していないと感じ、自らの動機づけを低下させる現象を何と呼ぶか。","answer":"サッカー効果","group":"social_effect","term":"サッカー効果","note":"サッカー効果は社会的手抜きの1つで、他者の能力を低いと認知し、他者が自分に頼り集団利益に貢献していないと感じて動機づけを低下させる。","id":"p3q0439","options":["フリーライダー効果（リンゲルマン効果）","社会的促進","サッカー効果","社会的手抜き（社会的怠惰）"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A45","stem":"サッカー効果は何の1つとされるか。","answer":"社会的手抜き","group":"social_effect","term":"サッカー効果","note":"サッカー効果は社会的手抜きの1つで、他者の能力を低いと認知し、他者が自分に頼り集団利益に貢献していないと感じて動機づけを低下させる。","id":"p3q0440","options":["社会的促進","共行動効果","観察者効果","社会的手抜き"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A45","stem":"サッカー効果では他者の能力を高いと低いのどちらに認知しやすいか。","answer":"低い","group":"degree","term":"サッカー効果","note":"サッカー効果は社会的手抜きの1つで、他者の能力を低いと認知し、他者が自分に頼り集団利益に貢献していないと感じて動機づけを低下させる。","id":"p3q0441","options":["初頭効果","対人認知","低い","呈示順序"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q46","stem":"個人が自己利益を最大化するように行動した結果、社会全体の利益が損なわれ、最終的に個人の利益も減少する事態を何と呼ぶか。","answer":"社会的ジレンマ","group":"social_term","term":"社会的ジレンマ","note":"社会的ジレンマは個人的利益の追求と社会的利益の確保が両立不可能な事態で、Hardin,G.が所有物の悲劇として説明した。利益追求が社会的コストを生み社会全体が疲弊する。","id":"p3q0442","options":["社会的ジレンマ","社会的勢力","条件即応モデル","サッカー効果"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A46","stem":"社会的ジレンマの有名な例としてHardinが示したものは何か。","answer":"共有地の悲劇","group":"social_example","term":"社会的ジレンマ","note":"社会的ジレンマは個人的利益の追求と社会的利益の確保が両立不可能な事態で、Hardin,G.が所有物の悲劇として説明した。利益追求が社会的コストを生み社会全体が疲弊する。","id":"p3q0443","options":["共有地の悲劇","傍観者効果","集団極性化","囚人のジレンマ"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A46","stem":"共有地の悲劇を提唱した人物は誰か。","answer":"Hardin,G.（ハーディン）","group":"social_person","term":"社会的ジレンマ","note":"社会的ジレンマは個人的利益の追求と社会的利益の確保が両立不可能な事態で、Hardin,G.が所有物の悲劇として説明した。利益追求が社会的コストを生み社会全体が疲弊する。","id":"p3q0444","options":["Hardin,G.（ハーディン）","Festinger,L.（フェスティンガー）","Merton,R.K.（マートン）","Fiedler,F.（フィードラー）"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A46","stem":"社会的ジレンマで両立が難しいのは個人的利益と何か。","answer":"社会的利益","group":"social_value","term":"社会的ジレンマ","note":"社会的ジレンマは個人的利益の追求と社会的利益の確保が両立不可能な事態で、Hardin,G.が所有物の悲劇として説明した。利益追求が社会的コストを生み社会全体が疲弊する。","id":"p3q0445","options":["他者評価","社会的利益","社会的損失","個人的損失"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q47","stem":"集団目標の達成のため一定の階層構造をもち、地位ごとの職務・権限・責任が明確な集団を何と呼ぶか。","answer":"フォーマル・グループ（公式集団）","group":"group_type","term":"フォーマル・グループ（公式集団）","note":"フォーマル・グループは集団類型の1つで、各地位への配置は一定の手続きに基づき、成員は明確化された職務や責任を果たす義務がある。","id":"p3q0446","options":["インフォーマル・グループ（非公式集団）","フォーマル・グループ（公式集団）","準拠集団","自主集団"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A47","stem":"フォーマル・グループでは成員の地位配置は何に基づいて行われるか。","answer":"一定の手続き","group":"group_feature","term":"フォーマル・グループ（公式集団）","note":"フォーマル・グループは集団類型の1つで、各地位への配置は一定の手続きに基づき、成員は明確化された職務や責任を果たす義務がある。","id":"p3q0447","options":["自然発生的形成","一定の手続き","暗黙の規範や目標","明確な職務・権限・責任"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A47","stem":"フォーマル・グループで明確に規定されるものは職務・権限と何か。","answer":"責任","group":"group_feature","term":"フォーマル・グループ（公式集団）","note":"フォーマル・グループは集団類型の1つで、各地位への配置は一定の手続きに基づき、成員は明確化された職務や責任を果たす義務がある。","id":"p3q0448","options":["一定の手続き","明確な職務・権限・責任","責任","暗黙の規範や目標"]},{"page":21,"chapter":"社会心理学","origin":"左ページQuestion Q48","stem":"成員の個人的感情によって自然発生的に形成され、明確な階層構造・役割・規制をもたない集団を何と呼ぶか。","answer":"インフォーマル・グループ（非公式集団）","group":"group_type","term":"インフォーマル・グループ（非公式集団）","note":"インフォーマル・グループは私的集団・自主集団ともいわれ、集団の規範や目標は暗黙のうちに共有される。","id":"p3q0449","options":["社会的インパクト理論","インフォーマル・グループ（非公式集団）","リターン・ポテンシャル・モデル","最小条件集団パラダイム"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A48","stem":"インフォーマル・グループの別名として私的集団と並んで挙げられるものは何か。","answer":"自主集団","group":"group_type","term":"インフォーマル・グループ（非公式集団）","note":"インフォーマル・グループは私的集団・自主集団ともいわれ、集団の規範や目標は暗黙のうちに共有される。","id":"p3q0450","options":["フォーマル・グループ（公式集団）","インフォーマル・グループ（非公式集団）","準拠集団","自主集団"]},{"page":21,"chapter":"社会心理学","origin":"右ページAnswer解説 A48","stem":"インフォーマル・グループでは規範や目標は明示的と暗黙的のどちらに共有されるか。","answer":"暗黙のうちに共有される","group":"group_feature","term":"インフォーマル・グループ（非公式集団）","note":"インフォーマル・グループは私的集団・自主集団ともいわれ、集団の規範や目標は暗黙のうちに共有される。","id":"p3q0451","options":["暗黙のうちに共有される","一定の手続き","暗黙の規範や目標","明確な職務・権限・責任"]},{"page":22,"chapter":"社会心理学","origin":"左ページQuestion Q49","stem":"個人の態度や判断、行動に影響を与える集団を何と呼ぶか。","answer":"準拠集団","group":"group_type","term":"準拠集団","note":"個人は準拠集団の規範に基づいて自己評価し態度を形成・変容する。現在の所属集団だけでなく、過去の所属集団、将来所属したい集団など同一視集団や非所属集団も含む。","id":"p3q0452","options":["自主集団","インフォーマル・グループ（非公式集団）","準拠集団","フォーマル・グループ（公式集団）"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A49","stem":"準拠集団の規範は個人の自己評価や何の形成・変容に影響するか。","answer":"態度","group":"social_outcome","term":"準拠集団","note":"個人は準拠集団の規範に基づいて自己評価し態度を形成・変容する。現在の所属集団だけでなく、過去の所属集団、将来所属したい集団など同一視集団や非所属集団も含む。","id":"p3q0453","options":["行動","態度","認知","感情"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A49","stem":"準拠集団は、現在所属している集団だけに限られるか。","answer":"限られない","group":"yes_no","term":"準拠集団","note":"個人は準拠集団の規範に基づいて自己評価し態度を形成・変容する。現在の所属集団だけでなく、過去の所属集団、将来所属したい集団など同一視集団や非所属集団も含む。","id":"p3q0454","options":["将来所属したい集団だけに限られる","限られる","限られない","過去に所属した集団だけに限られる"]},{"page":22,"chapter":"社会心理学","origin":"左ページQuestion Q50","stem":"Moreno,J.L.（モレノ）が開発した、集団成員の感情的な作用や心理的地位を測定し、集団の心理的特徴を数学的に明らかにする研究方法を何と呼ぶか。","answer":"ソシオメトリー","group":"social_method","term":"ソシオメトリー","note":"Morenoは小集団の人間関係を5つに分類し、ソシオメトリック・テスト、自発性テスト、状況テスト、ロール・プレイング・テストなどを考案した。ソシオメトリック・テストでは選択と排斥を軸に分析する。","id":"p3q0455","options":["ソシオメトリー","質問紙法","社会的ネットワーク分析","観察法"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A50","stem":"ソシオメトリーを開発した人物は誰か。","answer":"Moreno,J.L.（モレノ）","group":"social_person","term":"ソシオメトリー","note":"Morenoは小集団の人間関係を5つに分類し、ソシオメトリック・テスト、自発性テスト、状況テスト、ロール・プレイング・テストなどを考案した。ソシオメトリック・テストでは選択と排斥を軸に分析する。","id":"p3q0456","options":["Moreno,J.L.（モレノ）","Janis,I.L.（ジャニス）","Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Jackson,J.M.（ジャクソン）"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A50","stem":"ソシオメトリック・テストで集団成員間の関係を分析する2つの軸は何か。","answer":"選択と排斥","group":"sociometry_axis","term":"ソシオメトリー","note":"Morenoは小集団の人間関係を5つに分類し、ソシオメトリック・テスト、自発性テスト、状況テスト、ロール・プレイング・テストなどを考案した。ソシオメトリック・テストでは選択と排斥を軸に分析する。","id":"p3q0457","options":["選択と排斥","接近と回避","協力と競争","是認と否認"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A50","stem":"Morenoは小集団の人間関係をいくつに分類したか。","answer":"5つ","group":"number_count","term":"ソシオメトリー","note":"Morenoは小集団の人間関係を5つに分類し、ソシオメトリック・テスト、自発性テスト、状況テスト、ロール・プレイング・テストなどを考案した。ソシオメトリック・テストでは選択と排斥を軸に分析する。","id":"p3q0458","options":["5つ","3つ","1つ","4つ"]},{"page":22,"chapter":"社会心理学","origin":"左ページQuestion Q51","stem":"他者のもつ影響力の強さは、他者の勢力、他者との直接性、他者の人数という複合的な関数で規定されると考える理論を何と呼ぶか。","answer":"社会的インパクト理論","group":"social_theory","term":"社会的インパクト理論","note":"社会的インパクト理論では、個人が受ける影響力を他者の強度、直接性、人数の相乗関数として捉え、援助行動の抑制や社会的手抜きなどを説明する。","id":"p3q0459","options":["接種理論","認知的不協和理論","社会的インパクト理論","社会的浸透理論"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A51","stem":"社会的インパクト理論の3要因は、他者の強度・直接性と何か。","answer":"他者の人数","group":"social_impact_factor","term":"社会的インパクト理論","note":"社会的インパクト理論では、個人が受ける影響力を他者の強度、直接性、人数の相乗関数として捉え、援助行動の抑制や社会的手抜きなどを説明する。","id":"p3q0460","options":["他者との直接性","集団凝集性","他者の人数","他者の強度"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A51","stem":"社会的インパクト理論は援助行動の抑制と何を説明できるとされるか。","answer":"社会的手抜き","group":"social_effect","term":"社会的インパクト理論","note":"社会的インパクト理論では、個人が受ける影響力を他者の強度、直接性、人数の相乗関数として捉え、援助行動の抑制や社会的手抜きなどを説明する。","id":"p3q0461","options":["観察者効果","共行動効果","社会的促進","社会的手抜き"]},{"page":22,"chapter":"社会心理学","origin":"左ページQuestion Q52","stem":"集団成員に対して集団規範に沿って行動するように作用する影響力を何と呼ぶか。","answer":"集団圧力","group":"social_term","term":"集団圧力","note":"集団圧力は斉一性の圧力とも呼ばれ、他の成員や組織からの直接的圧力と、成員自身が集団規範に同調する間接的圧力がある。集団凝集性が高いほど強くなる。","id":"p3q0462","options":["社会的勢力","準拠集団","PM理論","集団圧力"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A52","stem":"集団圧力の別名は何か。","answer":"斉一性の圧力","group":"social_term","term":"集団圧力","note":"集団圧力は斉一性の圧力とも呼ばれ、他の成員や組織からの直接的圧力と、成員自身が集団規範に同調する間接的圧力がある。集団凝集性が高いほど強くなる。","id":"p3q0463","options":["斉一性の圧力","周辺特性","社会的ジレンマ","中心特性"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A52","stem":"集団圧力には、組織からの直接的圧力と成員自身の何的圧力があるか。","answer":"間接的圧力","group":"pressure_type","term":"集団圧力","note":"集団圧力は斉一性の圧力とも呼ばれ、他の成員や組織からの直接的圧力と、成員自身が集団規範に同調する間接的圧力がある。集団凝集性が高いほど強くなる。","id":"p3q0464","options":["直接的圧力","制度的圧力","個人的圧力","間接的圧力"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A52","stem":"集団凝集性が高くなるほど、集団圧力はどのように変化するか。","answer":"強くなる","group":"effect_direction","term":"集団圧力","note":"集団圧力は斉一性の圧力とも呼ばれ、他の成員や組織からの直接的圧力と、成員自身が集団規範に同調する間接的圧力がある。集団凝集性が高いほど強くなる。","id":"p3q0465","options":["強くなる","逆方向","低下する","抑制される"]},{"page":22,"chapter":"社会心理学","origin":"左ページQuestion Q53","stem":"集団規範を数量的に測定するモデルを何と呼ぶか。","answer":"リターン・ポテンシャル・モデル","group":"social_model","term":"リターン・ポテンシャル・モデル","note":"Jackson,J.M.が提唱。行動次元を横軸、是認―否認（-4〜4）の評価次元を縦軸にプロットするとリターン・ポテンシャル曲線が得られ、最大リターン点が理想的行動となる。","id":"p3q0466","options":["リターン・ポテンシャル・モデル","フリーライダー効果（リンゲルマン効果）","社会的手抜き（社会的怠惰）","社会的インパクト理論"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A53","stem":"リターン・ポテンシャル・モデルを提唱した人物は誰か。","answer":"Jackson,J.M.（ジャクソン）","group":"social_person","term":"リターン・ポテンシャル・モデル","note":"Jackson,J.M.が提唱。行動次元を横軸、是認―否認（-4〜4）の評価次元を縦軸にプロットするとリターン・ポテンシャル曲線が得られ、最大リターン点が理想的行動となる。","id":"p3q0467","options":["Zajonc,R.B.（ザイアンス）","Jackson,J.M.（ジャクソン）","Ringelmann,M.（リンゲルマン）","Hardin,G.（ハーディン）"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A53","stem":"リターン・ポテンシャル・モデルの横軸は何か。","answer":"行動次元","group":"return_axis","term":"リターン・ポテンシャル・モデル","note":"Jackson,J.M.が提唱。行動次元を横軸、是認―否認（-4〜4）の評価次元を縦軸にプロットするとリターン・ポテンシャル曲線が得られ、最大リターン点が理想的行動となる。","id":"p3q0468","options":["人数次元","是認―否認の評価次元","行動次元","強度次元"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A53","stem":"リターン・ポテンシャル・モデルの縦軸は何か。","answer":"是認―否認の評価次元","group":"return_axis","term":"リターン・ポテンシャル・モデル","note":"Jackson,J.M.が提唱。行動次元を横軸、是認―否認（-4〜4）の評価次元を縦軸にプロットするとリターン・ポテンシャル曲線が得られ、最大リターン点が理想的行動となる。","id":"p3q0469","options":["強度次元","人数次元","是認―否認の評価次元","行動次元"]},{"page":22,"chapter":"社会心理学","origin":"右ページAnswer解説 A53","stem":"リターン・ポテンシャル曲線で理想的行動に対応する点を何というか。","answer":"最大リターン点","group":"return_point","term":"リターン・ポテンシャル・モデル","note":"Jackson,J.M.が提唱。行動次元を横軸、是認―否認（-4〜4）の評価次元を縦軸にプロットするとリターン・ポテンシャル曲線が得られ、最大リターン点が理想的行動となる。","id":"p3q0470","options":["中立点","最小リターン点","最大拒否点","最大リターン点"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q54","stem":"個人で検討した場合より集団で討議した場合のほうが、意見や考えがより極端な方向に向かう現象を何と呼ぶか。","answer":"集団極性化","group":"social_effect","term":"集団極性化","note":"集団極性化は集団内のやり取りで個々の当初の判断・行動・感情などが集団全体として強められる現象。危険方向への決定をリスキーシフト、安全方向への決定をコーシャスシフトという。","id":"p3q0471","options":["社会的手抜き","社会的促進","集団極性化","傍観者効果"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A54","stem":"集団極性化で、よりリスクのある方向に決定が傾くことを何というか。","answer":"リスキーシフト","group":"polarization_type","term":"集団極性化","note":"集団極性化は集団内のやり取りで個々の当初の判断・行動・感情などが集団全体として強められる現象。危険方向への決定をリスキーシフト、安全方向への決定をコーシャスシフトという。","id":"p3q0472","options":["集団思考","コーシャスシフト","リスキーシフト","フォルス・コンセンサス"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A54","stem":"集団極性化で、より無難な方向に決定が傾くことを何というか。","answer":"コーシャスシフト","group":"polarization_type","term":"集団極性化","note":"集団極性化は集団内のやり取りで個々の当初の判断・行動・感情などが集団全体として強められる現象。危険方向への決定をリスキーシフト、安全方向への決定をコーシャスシフトという。","id":"p3q0473","options":["コーシャスシフト","リスキーシフト","集団思考","フォルス・コンセンサス"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q55","stem":"集団意思決定で重要な情報を適切に処理し損なうことによって生じる不合理な思考形態を何と呼ぶか。","answer":"集団思考（集団浅慮）","group":"social_term","term":"集団思考（集団浅慮）","note":"Janis,I.L.が提唱。集団凝集性が高く、意見の一致を重視して外部情報を取り入れにくくなり、異議や疑念が抑制され、過度に楽観的になることなどから生じる。","id":"p3q0474","options":["最小条件集団パラダイム","沈黙の螺旋理論","ソシオメトリー","集団思考（集団浅慮）"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A55","stem":"集団思考を提唱した人物は誰か。","answer":"Janis,I.L.（ジャニス）","group":"social_person","term":"集団思考（集団浅慮）","note":"Janis,I.L.が提唱。集団凝集性が高く、意見の一致を重視して外部情報を取り入れにくくなり、異議や疑念が抑制され、過度に楽観的になることなどから生じる。","id":"p3q0475","options":["Ringelmann,M.（リンゲルマン）","Rotter,J.B.（ロッター）","Rosenthal,R.（ローゼンタール）","Janis,I.L.（ジャニス）"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A55","stem":"集団思考が生じやすい集団は凝集性が高いか低いか。","answer":"高い","group":"degree","term":"集団思考（集団浅慮）","note":"Janis,I.L.が提唱。集団凝集性が高く、意見の一致を重視して外部情報を取り入れにくくなり、異議や疑念が抑制され、過度に楽観的になることなどから生じる。","id":"p3q0476","options":["最初","高い","低い","初頭効果"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A55","stem":"集団思考が生じている時、外部からの情報はどのように扱われやすいか。","answer":"取り入れにくくなる","group":"effect_direction","term":"集団思考（集団浅慮）","note":"Janis,I.L.が提唱。集団凝集性が高く、意見の一致を重視して外部情報を取り入れにくくなり、異議や疑念が抑制され、過度に楽観的になることなどから生じる。","id":"p3q0477","options":["取り入れにくくなる","逆方向","低下する","抑制される"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A55","stem":"集団思考が生じている時、異議や疑念はどのように扱われやすいか。","answer":"抑制される","group":"effect_direction","term":"集団思考（集団浅慮）","note":"Janis,I.L.が提唱。集団凝集性が高く、意見の一致を重視して外部情報を取り入れにくくなり、異議や疑念が抑制され、過度に楽観的になることなどから生じる。","id":"p3q0478","options":["抑制される","逆方向","強くなる","低下する"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q56","stem":"自分の意見や行動が多数派であり一般的であると考える傾向を何と呼ぶか。","answer":"フォルス・コンセンサス","group":"social_bias","term":"フォルス・コンセンサス","note":"フォルス・コンセンサスは自分の反応に対する合意性を過大視することで、自分の選択は状況において適切であり他の選択は不適切だと考える傾向を反映する。","id":"p3q0479","options":["内集団バイアス","セルフ・ハンディキャッピング","フォルス・コンセンサス","外集団均質化バイアス"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A56","stem":"フォルス・コンセンサスでは自分の反応に対する何を過大視するか。","answer":"合意性","group":"social_factor","term":"フォルス・コンセンサス","note":"フォルス・コンセンサスは自分の反応に対する合意性を過大視することで、自分の選択は状況において適切であり他の選択は不適切だと考える傾向を反映する。","id":"p3q0480","options":["心理的距離","顕著な特徴","合意性","呈示順序"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A56","stem":"フォルス・コンセンサスでは自分の選択を状況に対して適切と不適切のどちらと考えやすいか。","answer":"適切","group":"evaluation_direction","term":"フォルス・コンセンサス","note":"フォルス・コンセンサスは自分の反応に対する合意性を過大視することで、自分の選択は状況において適切であり他の選択は不適切だと考える傾向を反映する。","id":"p3q0481","options":["割り増し","均質","割り引き","適切"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q57","stem":"自分の意見が多数派だと思う人は声高に主張する一方、少数派だと思う人は孤立を恐れて沈黙し、多数派意見へ収束していくとする理論を何と呼ぶか。","answer":"沈黙の螺旋理論","group":"social_theory","term":"沈黙の螺旋理論","note":"沈黙の螺旋理論は世論形成過程のモデルで、特定意見が多数派だと多くの人が認識すると多数派への同調が生じ、社会的圧力によって元の意見が変化し収束する。","id":"p3q0482","options":["条件即応モデル","社会的インパクト理論","沈黙の螺旋理論","社会的アイデンティティ理論"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A57","stem":"沈黙の螺旋理論で少数派が沈黙しやすい理由は何への恐れか。","answer":"孤立","group":"social_state","term":"沈黙の螺旋理論","note":"沈黙の螺旋理論は世論形成過程のモデルで、特定意見が多数派だと多くの人が認識すると多数派への同調が生じ、社会的圧力によって元の意見が変化し収束する。","id":"p3q0483","options":["孤立","責任感","心理的抵抗感や反発","評価懸念"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A57","stem":"沈黙の螺旋理論は何の形成過程を説明するモデルか。","answer":"世論","group":"social_outcome","term":"沈黙の螺旋理論","note":"沈黙の螺旋理論は世論形成過程のモデルで、特定意見が多数派だと多くの人が認識すると多数派への同調が生じ、社会的圧力によって元の意見が変化し収束する。","id":"p3q0484","options":["集団規範","個人態度","世論","私見"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q58","stem":"内集団を外集団よりも高く評価したり優遇したりする傾向を何と呼ぶか。","answer":"内集団びいき","group":"social_bias","term":"内集団びいき","note":"内集団びいきは内集団バイアスともいい、外集団より内集団を高く評価する。肯定的自己評価につながる一方、外集団への差別や偏見を生む危険性もある。","id":"p3q0485","options":["外集団均質化バイアス","多元的無知","内集団びいき","セルフ・ハンディキャッピング"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A58","stem":"内集団びいきの別名は何か。","answer":"内集団バイアス","group":"social_bias","term":"内集団びいき","note":"内集団びいきは内集団バイアスともいい、外集団より内集団を高く評価する。肯定的自己評価につながる一方、外集団への差別や偏見を生む危険性もある。","id":"p3q0486","options":["内集団バイアス","透明性錯誤","フォルス・コンセンサス","基本的帰属の誤り（対応バイアス）"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A58","stem":"内集団びいきが外集団に対して生みうる問題は何か。","answer":"差別や偏見","group":"social_consequence","term":"内集団びいき","note":"内集団びいきは内集団バイアスともいい、外集団より内集団を高く評価する。肯定的自己評価につながる一方、外集団への差別や偏見を生む危険性もある。","id":"p3q0487","options":["対人認知の歪み","脅威","差別や偏見","偏見や差別"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A58","stem":"内集団びいきは自己評価をどの方向に変えやすいか。","answer":"肯定的","group":"evaluation_direction","term":"内集団びいき","note":"内集団びいきは内集団バイアスともいい、外集団より内集団を高く評価する。肯定的自己評価につながる一方、外集団への差別や偏見を生む危険性もある。","id":"p3q0488","options":["高く見積もる","肯定的","割り増し","割り引き"]},{"page":23,"chapter":"社会心理学","origin":"左ページQuestion Q59","stem":"人が他者との比較を通じて望ましい自己評価を得るため、内集団への所属を強く意識し外集団より内集団を高く評価するとする理論を何と呼ぶか。","answer":"社会的アイデンティティ理論","group":"social_theory","term":"社会的アイデンティティ理論","note":"Tajfel,H.とTurner,J.C.が提唱した集団間葛藤の生起過程を説明する理論で、集団間比較の過程が外集団への差別や内集団びいきをもたらすと考える。","id":"p3q0489","options":["ケリーの共変原理（ANOVAモデル）","心理的リアクタンス理論","沈黙の螺旋理論","社会的アイデンティティ理論"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A59","stem":"社会的アイデンティティ理論を提唱した人物は誰か。","answer":"Tajfel,H.（タジフェル）とTurner,J.C.（ターナー）","group":"social_person","term":"社会的アイデンティティ理論","note":"Tajfel,H.とTurner,J.C.が提唱した集団間葛藤の生起過程を説明する理論で、集団間比較の過程が外集団への差別や内集団びいきをもたらすと考える。","id":"p3q0490","options":["Tajfel,H.（タジフェル）とTurner,J.C.（ターナー）","Zajonc,R.B.（ザイアンス）","Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Hardin,G.（ハーディン）"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A59","stem":"社会的アイデンティティ理論が説明する過程は何の生起過程か。","answer":"集団間葛藤","group":"social_outcome","term":"社会的アイデンティティ理論","note":"Tajfel,H.とTurner,J.C.が提唱した集団間葛藤の生起過程を説明する理論で、集団間比較の過程が外集団への差別や内集団びいきをもたらすと考える。","id":"p3q0491","options":["集団間協力","集団内葛藤","集団間葛藤","集団間同一視"]},{"page":23,"chapter":"社会心理学","origin":"右ページAnswer解説 A59","stem":"社会的アイデンティティ理論で外集団への差別や内集団びいきを生むとされる過程は何か。","answer":"集団間比較","group":"social_process","term":"社会的アイデンティティ理論","note":"Tajfel,H.とTurner,J.C.が提唱した集団間葛藤の生起過程を説明する理論で、集団間比較の過程が外集団への差別や内集団びいきをもたらすと考える。","id":"p3q0492","options":["時間的比較","集団内比較","個人内比較","集団間比較"]},{"page":24,"chapter":"社会心理学","origin":"左ページQuestion Q60","stem":"集団と個人または集団間の関係を検討するため、参加者を社会的に無意味な基準で2群に分け、匿名で成員間の相互作用もない状況を設定する実験を何と呼ぶか。","answer":"最小条件集団パラダイム","group":"social_paradigm","term":"最小条件集団パラダイム","note":"最小条件集団パラダイムは社会的アイデンティティ理論の基盤となる実験で、無意味な基準で分けただけでも内集団には協力的、外集団には差別的な態度や行動がみられた。","id":"p3q0493","options":["アッシュの同調実験","最小条件集団パラダイム","共有地の悲劇","囚人のジレンマ"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 A60","stem":"最小条件集団パラダイムはどの理論の基盤となる重要な実験か。","answer":"社会的アイデンティティ理論","group":"social_theory","term":"最小条件集団パラダイム","note":"最小条件集団パラダイムは社会的アイデンティティ理論の基盤となる実験で、無意味な基準で分けただけでも内集団には協力的、外集団には差別的な態度や行動がみられた。","id":"p3q0494","options":["社会的アイデンティティ理論","心理的リアクタンス理論","接種理論","認知的不協和理論"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 A60","stem":"最小条件集団パラダイムでは、内集団に対してどのような態度がみられたか。","answer":"協力的な態度","group":"ingroup_behavior","term":"最小条件集団パラダイム","note":"最小条件集団パラダイムは社会的アイデンティティ理論の基盤となる実験で、無意味な基準で分けただけでも内集団には協力的、外集団には差別的な態度や行動がみられた。","id":"p3q0495","options":["差別的な態度","回避的な態度","中立的な態度","協力的な態度"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 A60","stem":"最小条件集団パラダイムでは、外集団に対してどのような態度がみられたか。","answer":"差別的な態度","group":"ingroup_behavior","term":"最小条件集団パラダイム","note":"最小条件集団パラダイムは社会的アイデンティティ理論の基盤となる実験で、無意味な基準で分けただけでも内集団には協力的、外集団には差別的な態度や行動がみられた。","id":"p3q0496","options":["回避的な態度","協力的な態度","差別的な態度","中立的な態度"]},{"page":24,"chapter":"社会心理学","origin":"左ページQuestion Q61","stem":"外集団を似た者同士の集まりとみなす一方、内集団は多様な者の集まりだとみなす傾向を何と呼ぶか。","answer":"外集団均質化バイアス","group":"social_bias","term":"外集団均質化バイアス","note":"外集団均質化バイアスは外集団均質化効果ともいい、外集団をステレオタイプ化して均質な集団と認識する。特定集団への差別や偏見の形成に関与するとされる。","id":"p3q0497","options":["内集団びいき","外集団均質化効果","セルフ・ハンディキャッピング","外集団均質化バイアス"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 A61","stem":"外集団均質化バイアスの別名は何か。","answer":"外集団均質化効果","group":"social_bias","term":"外集団均質化バイアス","note":"外集団均質化バイアスは外集団均質化効果ともいい、外集団をステレオタイプ化して均質な集団と認識する。特定集団への差別や偏見の形成に関与するとされる。","id":"p3q0498","options":["外集団均質化バイアス","内集団びいき","多元的無知","外集団均質化効果"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 A61","stem":"外集団均質化バイアスでは外集団を均質と多様のどちらに認識しやすいか。","answer":"均質","group":"evaluation_direction","term":"外集団均質化バイアス","note":"外集団均質化バイアスは外集団均質化効果ともいい、外集団をステレオタイプ化して均質な集団と認識する。特定集団への差別や偏見の形成に関与するとされる。","id":"p3q0499","options":["適切","割り引き","割り増し","均質"]},{"page":24,"chapter":"社会心理学","origin":"右ページAnswer解説 const $=s=>document.querySelector(s);const key='purple3_short_history_v1';let hist=JSON.parse(localStorage.getItem(key)||'{}'),order=[],pos=0,session={answered:0,correct:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rec(id){return hist[id]||(hist[id]={attempts:0,correct:0,wrong:0,last:null})} function save(){localStorage.setItem(key,JSON.stringify(hist))}
function filtered(){let mode=$('#mode').value,chap=$('#chap').value;return DATA.filter(x=>{let r=rec(x.id);if(chap!=='all'&&x.chapter!==chap)return false;if(mode==='unanswered'&&r.attempts>0)return false;if(mode==='wrong1'&&r.wrong<1)return false;if(mode==='wrong2'&&r.wrong<2)return false;if(mode==='lastwrong'&&r.last!=='wrong')return false;return true})}
function rebuild(rand=false){order=filtered().map(x=>x.id);if(rand)order=shuffle(order);pos=0;session={answered:0,correct:0};render()}
function current(){return DATA.find(x=>x.id===order[pos])} function baseMeta(it){return `出典：紫3(2).pdf PDF p.${it.page}｜${it.origin}`}
function updateStats(){let all=Object.values(hist);let attempts=all.reduce((s,r)=>s+r.attempts,0),correct=all.reduce((s,r)=>s+r.correct,0),wrong=all.reduce((s,r)=>s+r.wrong,0);$('#st1').textContent=session.answered;$('#st2').textContent=session.answered?Math.round(session.correct/session.answered*100)+'%':'—';$('#st3').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';$('#st4').textContent=wrong}
function prev(){if(pos>0){pos--;render()}} function next(){if(pos<order.length-1){pos++;render()}else{renderDone()}}
function renderDone(){updateStats();$('.card').innerHTML=`<div class="empty"><b>このセットは終了！</b><br>フィルタを変えるか、同じ条件で解き直せます。<div style="margin-top:14px"><button onclick="rebuild(true)">同じ条件でランダムにもう一度</button></div></div>`}
function resetSession(){rebuild(false)} function resetAll(){if(confirm('累積の回答履歴・誤答回数もすべて消しますか？')){hist={};save();rebuild(false)}}
function render(){updateStats();if(!order.length){renderDone();return}const it=current();$('.card').innerHTML=`<div class="qno">${pos+1} / ${order.length}</div><div class="progress"><div class="bar" style="width:${(pos+1)/order.length*100}%"></div></div><div class="stem">${it.stem}</div><button id="showBtn" class="primary" onclick="showAnswer()">答えを見る</button><div id="fb" class="feedback"></div><div id="judge" style="display:none;margin-top:12px;gap:8px"><button onclick="judge(true)">○ 正解</button><button onclick="judge(false)">× 不正解</button></div><div class="nav"><button onclick="prev()" ${pos===0?'disabled':''}>← 前へ</button><button id="nextBtn" onclick="next()" disabled>次へ →</button></div>`}
function showAnswer(){const it=current();$('#fb').innerHTML=`<div class="answer">答え：${it.answer}</div><div>${it.note}</div><div class="meta">分野：${it.chapter}<br>元項目：${it.term}<br>${baseMeta(it)}</div>`;$('#fb').classList.add('show');$('#showBtn').disabled=true;$('#judge').style.display='flex'}
function judge(ok){const it=current();let r=rec(it.id);if($('#judge').dataset.done)return;$('#judge').dataset.done='1';r.attempts++;r.last=ok?'correct':'wrong';ok?r.correct++:r.wrong++;save();session.answered++;if(ok)session.correct++;$('#judge').querySelectorAll('button').forEach(b=>b.disabled=true);$('#nextBtn').disabled=false;updateStats()}
let chapters=[...new Set(DATA.map(x=>x.chapter))];$('#chap').innerHTML='<option value="all">全分野</option>'+chapters.map(c=>`<option>${c}</option>`).join('');$('#mode').onchange=()=>rebuild(false);$('#chap').onchange=()=>rebuild(false);rebuild(false);
</script></body></html>
