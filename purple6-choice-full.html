pressive_integrative","kind":"term","note":"異なる心理療法に共通して存在する治療的要因に注目する統合的アプローチ。 特定の理論や技法だけでなく、治療関係など複数療法に共通する要素を重視する。 心理療法間に共通する効果要因を明らかにしようとする。","source":"左ページQuestion（右ページ解説で内容確認）","options":["スクリブル","共通因子アプローチ","効果的な技法を選択すること","意図―努力―身体運動"],"correctIndex":1},{"id":"p6q0103","page":6,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n異なる心理療法の理論や概念を組み合わせ、新たな一貫した理論体系を構成する統合アプローチ。","answer":"理論的統合","aliases":["理論的統合"],"term":"理論的統合","group":"expressive_integrative","kind":"term","note":"異なる心理療法の理論や概念を組み合わせ、新たな一貫した理論体系を構成する統合アプローチ。 複数の理論を単に並べるのではなく、理論レベルで結びつける。 異なる療法の理論を統合した新しい説明枠組みを作ることを目指す。","source":"左ページQuestion（右ページ解説で内容確認）","options":["同化的統合","技法的折衷","理論的統合","スクイグル"],"correctIndex":2},{"id":"p6q0106","page":6,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n中心となる1つの理論的立場を維持しつつ、他の心理療法の技法や考え方を取り入れる統合アプローチ。","answer":"同化的統合","aliases":["同化的統合"],"term":"同化的統合","group":"expressive_integrative","kind":"term","note":"中心となる1つの理論的立場を維持しつつ、他の心理療法の技法や考え方を取り入れる統合アプローチ。 治療者の基本となる理論は保持される。 他学派の有効な技法を、自分の中心理論に取り込んで用いる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["技法的折衷","意図―努力―身体運動","スクリブル","同化的統合"],"correctIndex":3},{"id":"p6q0109","page":6,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n外傷記憶を想起しながら眼球運動などの両側性刺激を用い、記憶の再処理を促す心理療法。","answer":"EMDR（眼球運動による脱感作と再処理）","aliases":["EMDR（眼球運動による脱感作と再処理）"],"term":"EMDR（眼球運動による脱感作と再処理）","group":"expressive_integrative","kind":"term","note":"外傷記憶を想起しながら眼球運動などの両側性刺激を用い、記憶の再処理を促す心理療法。 Shapiro,F.（シャピロ）が開発し、PTSDを主な対象として用いられる。 外傷体験に関連する記憶を想起しながら、眼球運動などを用いる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["EMDR（眼球運動による脱感作と再処理）","Winnicott,D.W.（ウィニコット）","Shapiro,F.（シャピロ）","技法的折衷"],"correctIndex":0},{"id":"p6q0112","page":7,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n役割演技を通して心理的葛藤や対人関係を表現し、理解や変化を促す集団心理療法。","answer":"心理劇","aliases":["心理劇"],"term":"心理劇","group":"group_prevention","kind":"term","note":"役割演技を通して心理的葛藤や対人関係を表現し、理解や変化を促す集団心理療法。 Moreno,J.L.（ pter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n専門家が別の援助者に助言し、その援助者を通して間接的にクライエントを支援する方法。","answer":"コンサルテーション","aliases":["コンサルテーション"],"term":"コンサルテーション","group":"group_prevention","kind":"term","note":"専門家が別の援助者に助言し、その援助者を通して間接的にクライエントを支援する方法。 コンサルタント、コンサルティ、クライエントという複数者の関係で行われる。 専門家がクライエントに直接介入するとは限らない。","source":"左ページQuestion（右ページ解説で内容確認）","options":["心理劇","問題発生前の取り組み","コンサルテーション","アウトリーチ"],"correctIndex":2},{"id":"p6q0130","page":7,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n問題や疾患がまだ生じていない段階で、発生そのものを防ぐために行う予防。","answer":"一次予防","aliases":["一次予防"],"term":"一次予防","group":"group_prevention","kind":"term","note":"問題や疾患がまだ生じていない段階で、発生そのものを防ぐために行う予防。 健康な人や一般集団も対象となる。 健康教育やストレスマネジメントなど、問題発生前の取り組みが含まれる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["補助自我","心理劇","アウトリーチ","一次予防"],"correctIndex":3},{"id":"p6q0133","page":8,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n問題や疾患を早期に発見し、早期に介入して悪化を防ぐ予防。","answer":"二次予防","aliases":["二次予防"],"term":"二次予防","group":"group_prevention","kind":"term","note":"問題や疾患を早期に発見し、早期に介入して悪化を防ぐ予防。 問題が生じ始めた段階で早期発見・早期治療を行う。 検診やスクリーニングなどが二次予防につながる。","source":"左ページQuestion（右ページ解説で内容確認）","options":["二次予防","アウトリーチ","心理劇","危機介入"],"correctIndex":0},{"id":"p6q0136","page":8,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\nすでに生じた疾患や障害の再発・悪化を防ぎ、社会復帰や機能回復を支える予防。","answer":"三次予防","aliases":["三次予防"],"term":"三次予防","group":"group_prevention","kind":"term","note":"すでに生じた疾患や障害の再発・悪化を防ぎ、社会復帰や機能回復を支える予防。 リワークプログラムや復職支援などが例として挙げられる。 再発予防、リハビリテーション、社会参加の支援を含む。","source":"左ページQuestion（右ページ解説で内容確認）","options":["危機介入","三次予防","補助自我","アウトリーチ"],"correctIndex":1},{"id":"p6q0139","page":8,"chapter":"心理的支援","side":"basic","stem":"次の説明に最も当てはまる概念・疾患・検査・技法はどれか。\n援助を必要としている人のもとへ支援者側から出向き、支援につなげる方法。","answer":"アウトリーチ","aliases":["アウトリーチ"],"term":"アウトリーチ","group":"group_prevention","kind":"term","note":"援助を必要としている人のもとへ支援者側から出向き、支援につなげる方法。 相談機関へ自ら来ることが難しい人にも支援を届ける。 待って相談を受けるのではなく、支援者が積極的に接点を作 function pool(){let a=DATA.slice();const side=el('side').value,chap=el('chapter').value,rev=el('review').value;if(side!=='all')a=a.filter(x=>x.side===side);if(chap!=='all')a=a.filter(x=>x.chapter===chap);if(rev==='unanswered')a=a.filter(x=>{const s=stat(x.id);return s.correct+s.wrong===0});if(rev==='lastwrong')a=a.filter(x=>stat(x.id).last==='wrong');if(rev==='everwrong')a=a.filter(x=>stat(x.id).wrong>0);if(rev==='wrong1')a=a.filter(x=>stat(x.id).wrong===1);if(rev==='wrong2')a=a.filter(x=>stat(x.id).wrong===2);if(rev==='wrong3')a=a.filter(x=>stat(x.id).wrong>=3);return a;}

function renderDone(){el('stem').textContent=order.length?'この範囲は終了！':'該当する問題がありません';el('body').innerHTML='';el('feedback').className='feedback';}

function renderQuestion(){const q=current(); if(!q){renderDone();return;} meta(q); el('stem').textContent=q.stem; const box=el('body');box.innerHTML='<div class="choices">'+q.options.map((o,i)=>`<button class="choice" data-i="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')+'</div>'; el('feedback').className='feedback'; el('feedback').innerHTML=''; document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerChoice(Number(b.dataset.i)));}
function answerChoice(i){const q=current(); if(document.querySelector('.choice.correct,.choice.wrong'))return; const ok=i===q.correctIndex; document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q.correctIndex)b.classList.add('correct');}); if(!ok)document.querySelectorAll('.choice')[i].classList.add('wrong'); record(q.id,ok); sessionA++; if(ok)sessionC++; const fb=el('feedback');fb.className='feedback show';fb.innerHTML=`<div class="answer">${ok?'○ 正解':'× 不正解'}：${esc(q.answer)}</div><div class="note">${esc(q.note||'')}</div>`; updateStats();}
