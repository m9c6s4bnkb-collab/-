の刺激が視床を経由して大脳皮質へ達し、視床から大脳皮質への情報が視床の抑制を解除することで、情動体験と身体反応が同時に生じると考える。","id":"p3q0013","options":["時間差を伴って生じる","同時に生じる","身体反応が先に生じる","情動体験が先に生じる"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A21","stem":"キャノン・バード説は情動の起源を中枢と末梢のどちらに求める立場か。","answer":"中枢","group":"emotion_origin","term":"キャノン・バード説（中枢起源説）","note":"キャノン・バード説では、感覚受容器からの刺激が視床を経由して大脳皮質へ達し、視床から大脳皮質への情報が視床の抑制を解除することで、情動体験と身体反応が同時に生じると考える。","id":"p3q0014","options":["末梢","視床","中枢","大脳皮質"]},{"page":1,"chapter":"動機づけ・情動","origin":"左ページQuestion Q22","stem":"Schachter,S.（シャクター）らが提唱した、情動は生理的覚醒とそれに対する認知的解釈によって生起するとする理論を何と呼ぶか。","answer":"情動の2要因説","group":"emotion_theory","term":"情動の2要因説","note":"情動の2要因説では、情動体験は自律神経系の活性化と、それを引き起こした環境を手がかりとした認知的解釈によって生じる。シャクターらのエピネフリン実験が有名である。","id":"p3q0015","options":["拡張―形成理論","ジェームズ・ランゲ説（末梢起源説）","情動の2要因説","欲求階層説"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A22","stem":"情動の2要因説で情動体験を構成する身体的要因は何か。","answer":"自律神経系の活性化","group":"emotion_factor","term":"情動の2要因説","note":"情動の2要因説では、情動体験は自律神経系の活性化と、それを引き起こした環境を手がかりとした認知的解釈によって生じる。シャクターらのエピネフリン実験が有名である。","id":"p3q0016","options":["認知的解釈","環境の手がかり","身体反応","自律神経系の活性化"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A22","stem":"情動の2要因説で、生理的覚醒と組み合わされる要因は何か。","answer":"認知的解釈","group":"emotion_factor","term":"情動の2要因説","note":"情動の2要因説では、情動体験は自律神経系の活性化と、それを引き起こした環境を手がかりとした認知的解釈によって生じる。シャクターらのエピネフリン実験が有名である。","id":"p3q0017","options":["環境の手がかり","身体反応","自律神経系の活性化","認知的解釈"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A22","stem":"情動の2要因説を検討した有名な実験は何か。","answer":"エピネフリン実験","group":"emotion_experiment","term":"情動の2要因説","note":"情動の2要因説では、情動体験は自律神経系の活性化と、それを引き起こした環境を手がかりとした認知的解釈によって生じる。シャクターらのエピネフリン実験が有名である。","id":"p3q0018","options":["双生児研究","エピネフリン実験","表情写真を用いた実験","表情フィードバック実験"]},{"page":1,"chapter":"動機づけ・情動","origin":"左ページQuestion Q23","stem":"戸田正直が提唱した、感情は環境に適応するために遺伝的に与えられたプログラムであると考える理論を何と呼ぶか。","answer":"アーン理論","group":"emotion_theory","term":"アーン理論","note":"アーン理論は進化的視点から、感情を個体の生存に必要な行動選択のメカニズムとみなす。現代社会では環境の急激な変化に感情の進化が追いついていない可能性も考える。","id":"p3q0019","options":["欲求階層説","表情（顔面）フィードバック仮説","認知容量説","アーン理論"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A23","stem":"アーン理論を提唱した人物は誰か。","answer":"戸田正直","group":"emotion_person","term":"アーン理論","note":"アーン理論は進化的視点から、感情を個体の生存に必要な行動選択のメカニズムとみなす。現代社会では環境の急激な変化に感情の進化が追いついていない可能性も考える。","id":"p3q0020","options":["戸田正直","Ekman,P.（エクマン）","Fredrickson,B.L.（フレデリクソン）","Zajonc,R.B.（ザイアンス）"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A23","stem":"アーン理論では、感情は個体の生存に必要な何のメカニズムと考えられるか。","answer":"行動選択","group":"emotion_function","term":"アーン理論","note":"アーン理論は進化的視点から、感情を個体の生存に必要な行動選択のメカニズムとみなす。現代社会では環境の急激な変化に感情の進化が追いついていない可能性も考える。","id":"p3q0021","options":["感情表出","身体調節","行動選択","認知的評価"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A23","stem":"アーン理論は感情をどのような視点から捉える理論か。","answer":"進化的視点","group":"emotion_view","term":"アーン理論","note":"アーン理論は進化的視点から、感情を個体の生存に必要な行動選択のメカニズムとみなす。現代社会では環境の急激な変化に感情の進化が追いついていない可能性も考える。","id":"p3q0022","options":["社会文化的視点","進化的視点","認知的視点","生理的視点"]},{"page":1,"chapter":"動機づけ・情動","origin":"左ページQuestion Q24","stem":"Tomkins,S.（トムキンス）が提唱した、表情筋の動きが脳にフィードバックされることによって情動が生起するとする考えを何と呼ぶか。","answer":"表情（顔面）フィードバック仮説","group":"emotion_theory","term":"表情（顔面）フィードバック仮説","note":"表情フィードバック仮説の実験では、歯でペンを横にくわえる笑顔群と、唇でペンを縦にくわえる非笑顔群を比較し、笑顔群のほうがおもしろいと評価した。","id":"p3q0023","options":["情動の2要因説","表情（顔面）フィードバック仮説","キャノン・バード説（中枢起源説）","認知容量説"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A24","stem":"表情フィードバック仮説の実験で、笑顔に近い表情を作るためにペンをどのようにくわえたか。","answer":"歯で横にくわえる","group":"facial_feedback_condition","term":"表情（顔面）フィードバック仮説","note":"表情フィードバック仮説の実験では、歯でペンを横にくわえる笑顔群と、唇でペンを縦にくわえる非笑顔群を比較し、笑顔群のほうがおもしろいと評価した。","id":"p3q0024","options":["唇で縦にくわえる","歯で縦にくわえる","唇で横にくわえる","歯で横にくわえる"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A24","stem":"表情フィードバック仮説の実験で、非笑顔群はペンをどのようにくわえたか。","answer":"唇で縦にくわえる","group":"facial_feedback_condition","term":"表情（顔面）フィードバック仮説","note":"表情フィードバック仮説の実験では、歯でペンを横にくわえる笑顔群と、唇でペンを縦にくわえる非笑顔群を比較し、笑顔群のほうがおもしろいと評価した。","id":"p3q0025","options":["唇で縦にくわえる","歯で横にくわえる","唇で横にくわえる","歯で縦にくわえる"]},{"page":1,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A24","stem":"表情フィードバック仮説では、何の活動が脳にフィードバックされると考えるか。","answer":"笑顔の表情筋","group":"emotion_process","term":"表情（顔面）フィードバック仮説","note":"表情フィードバック仮説の実験では、歯でペンを横にくわえる笑顔群と、唇でペンを縦にくわえる非笑顔群を比較し、笑顔群のほうがおもしろいと評価した。","id":"p3q0026","options":["自律神経系の活動","認知的解釈","非笑顔の表情筋","笑顔の表情筋"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q25","stem":"感情は認知的評価を経ずに生起し、感情と認知的評価は独立していると考えた人物は誰か。","answer":"Zajonc,R.B.（ザイアンス）","group":"emotion_person","term":"Zajonc,R.B.（ザイアンス）","note":"Zajoncは単純接触効果を根拠に、外的刺激に対する感情は認知的評価を経ずに即時的・自動的に生じると考えた。","id":"p3q0027","options":["Fredrickson,B.L.（フレデリクソン）","Ekman,P.（エクマン）","戸田正直","Zajonc,R.B.（ザイアンス）"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A25","stem":"Zajoncが感情は認知的評価を経ずに生じると考える根拠とした効果は何か。","answer":"単純接触効果","group":"social_effect","term":"Zajonc,R.B.（ザイアンス）","note":"Zajoncは単純接触効果を根拠に、外的刺激に対する感情は認知的評価を経ずに即時的・自動的に生じると考えた。","id":"p3q0028","options":["単純接触効果","新近性効果","ハロー効果（光背効果）","初頭効果"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A25","stem":"Zajoncによれば、外的刺激に対する感情はどのように生じるか。","answer":"即時的・自動的に生じる","group":"emotion_process","term":"Zajonc,R.B.（ザイアンス）","note":"Zajoncは単純接触効果を根拠に、外的刺激に対する感情は認知的評価を経ずに即時的・自動的に生じると考えた。","id":"p3q0029","options":["身体反応の後にのみ生じる","即時的・自動的に生じる","意図的・段階的に生じる","認知的評価の後に生じる"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A25","stem":"Zajoncは感情と認知的評価の関係をどのように捉えたか。","answer":"独立している","group":"emotion_relation","term":"Zajonc,R.B.（ザイアンス）","note":"Zajoncは単純接触効果を根拠に、外的刺激に対する感情は認知的評価を経ずに即時的・自動的に生じると考えた。","id":"p3q0030","options":["感情が認知に必ず先行する","認知が感情に必ず先行する","常に一致する","独立している"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q26","stem":"喜び、驚き、恐れ、悲しみ、怒り、嫌悪という基本的感情の表情表出と認知に文化を越えた普遍性があることを示した人物は誰か。","answer":"Ekman,P.（エクマン）","group":"emotion_person","term":"Ekman,P.（エクマン）","note":"Ekmanはアメリカ、日本、ブラジル、チリ、アルゼンチンの5か国で表情写真を提示し、基本的感情の判断の一致率が高いことを示した。","id":"p3q0031","options":["Fredrickson,B.L.（フレデリクソン）","戸田正直","Ekman,P.（エクマン）","Zajonc,R.B.（ザイアンス）"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A26","stem":"Ekmanの研究で表情写真が提示されたのは何か国の参加者か。","answer":"5か国","group":"number_count","term":"Ekman,P.（エクマン）","note":"Ekmanはアメリカ、日本、ブラジル、チリ、アルゼンチンの5か国で表情写真を提示し、基本的感情の判断の一致率が高いことを示した。","id":"p3q0032","options":["3か国","1か国","5か国","4か国"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A26","stem":"Ekmanの研究で示されたのは、基本的感情の表情認知に何があることか。","answer":"文化を越えた普遍性","group":"emotion_property","term":"Ekman,P.（エクマン）","note":"Ekmanはアメリカ、日本、ブラジル、チリ、アルゼンチンの5か国で表情写真を提示し、基本的感情の判断の一致率が高いことを示した。","id":"p3q0033","options":["状況だけによる変動","文化による完全な相違","個人内での一貫性","文化を越えた普遍性"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A26","stem":"Ekmanの研究で検討された基本的感情には、喜び・驚き・恐れ・悲しみ・怒りと何が含まれるか。","answer":"嫌悪","group":"basic_emotion","term":"Ekman,P.（エクマン）","note":"Ekmanはアメリカ、日本、ブラジル、チリ、アルゼンチンの5か国で表情写真を提示し、基本的感情の判断の一致率が高いことを示した。","id":"p3q0034","options":["怒り","嫌悪","驚き","喜び"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q27","stem":"「快―不快」と「活性―不活性」の2次元から捉えられる原初的な感情状態を何と呼ぶか。","answer":"コア・アフェクト","group":"emotion_term","term":"コア・アフェクト","note":"コア・アフェクトは、身体的状態が即座に感情と解釈されるのではなく、まず単純な身体認識があり、それに基づいた中核的な感情状態である。","id":"p3q0035","options":["情動の2要因説","コア・アフェクト","認知容量説","拡張―形成理論"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A27","stem":"コア・アフェクトを構成する一方の次元は「快―不快」である。もう一方は何か。","answer":"活性―不活性","group":"core_affect_axis","term":"コア・アフェクト","note":"コア・アフェクトは、身体的状態が即座に感情と解釈されるのではなく、まず単純な身体認識があり、それに基づいた中核的な感情状態である。","id":"p3q0036","options":["快―不快","外向―内向","活性―不活性","受容―拒否"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A27","stem":"コア・アフェクトは、身体的状態がただちに感情と解釈される前の何に基づくと考えられるか。","answer":"単純な身体認識","group":"emotion_process","term":"コア・アフェクト","note":"コア・アフェクトは、身体的状態が即座に感情と解釈されるのではなく、まず単純な身体認識があり、それに基づいた中核的な感情状態である。","id":"p3q0037","options":["単純な身体認識","感情のラベリング","認知的解釈","環境の手がかり"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A27","stem":"コア・アフェクトは何次元で捉えられるか。","answer":"2次元","group":"number_count","term":"コア・アフェクト","note":"コア・アフェクトは、身体的状態が即座に感情と解釈されるのではなく、まず単純な身体認識があり、それに基づいた中核的な感情状態である。","id":"p3q0038","options":["2次元","1次元","4次元","3次元"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q28","stem":"判断課題の難易度や重要度などの条件によって、判断に対する感情の影響が異なるとするモデルを何と呼ぶか。","answer":"感情混入モデル","group":"emotion_model","term":"感情混入モデル","note":"感情混入モデルでは、課題の性質や個人の動機づけ・知識の程度などにより感情の影響が異なり、処理を直接アクセス処理、動機充足処理、ヒューリスティック処理、実質的処理などに分類する。","id":"p3q0039","options":["コア・アフェクト","感情混入モデル","拡張―形成理論","情動の2要因説"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A28","stem":"感情混入モデルで、判断への感情の影響を左右する個人側の要因として挙げられるものは何か。","answer":"動機づけや知識の程度","group":"affect_infusion_factor","term":"感情混入モデル","note":"感情混入モデルでは、課題の性質や個人の動機づけ・知識の程度などにより感情の影響が異なり、処理を直接アクセス処理、動機充足処理、ヒューリスティック処理、実質的処理などに分類する。","id":"p3q0040","options":["課題の難易度や重要度","動機づけや知識の程度","刺激への接触回数","情報源の信憑性"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A28","stem":"感情混入モデルで感情の影響が比較的小さい処理として挙げられるものは何か。","answer":"直接アクセス処理","group":"affect_infusion_process","term":"感情混入モデル","note":"感情混入モデルでは、課題の性質や個人の動機づけ・知識の程度などにより感情の影響が異なり、処理を直接アクセス処理、動機充足処理、ヒューリスティック処理、実質的処理などに分類する。","id":"p3q0041","options":["動機充足処理","実質的処理","ヒューリスティック処理","直接アクセス処理"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A28","stem":"感情混入モデルで感情の影響が比較的大きい処理として挙げられるものは何か。","answer":"実質的処理","group":"affect_infusion_process","term":"感情混入モデル","note":"感情混入モデルでは、課題の性質や個人の動機づけ・知識の程度などにより感情の影響が異なり、処理を直接アクセス処理、動機充足処理、ヒューリスティック処理、実質的処理などに分類する。","id":"p3q0042","options":["直接アクセス処理","動機充足処理","実質的処理","ヒューリスティック処理"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q29","stem":"ポジティブ気分ではヒューリスティック処理が、ネガティブ気分ではシステマティック処理がなされやすいと説明する理論を何と呼ぶか。","answer":"認知容量説","group":"emotion_theory","term":"認知容量説","note":"認知容量説では、ポジティブ気分では意図的なヒューリスティック処理がなされやすい一方、ネガティブ気分では認知的資源の消費が少ないためシステマティック処理がなされやすいと説明する。","id":"p3q0043","options":["拡張―形成理論","認知容量説","情動の2要因説","欲求階層説"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A29","stem":"認知容量説によれば、ポジティブ気分の時になされやすい処理は何か。","answer":"ヒューリスティック処理","group":"processing_style","term":"認知容量説","note":"認知容量説では、ポジティブ気分では意図的なヒューリスティック処理がなされやすい一方、ネガティブ気分では認知的資源の消費が少ないためシステマティック処理がなされやすいと説明する。","id":"p3q0044","options":["システマティック処理","実質的処理","直接アクセス処理","ヒューリスティック処理"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A29","stem":"認知容量説によれば、ネガティブ気分の時になされやすい処理は何か。","answer":"システマティック処理","group":"processing_style","term":"認知容量説","note":"認知容量説では、ポジティブ気分では意図的なヒューリスティック処理がなされやすい一方、ネガティブ気分では認知的資源の消費が少ないためシステマティック処理がなされやすいと説明する。","id":"p3q0045","options":["実質的処理","直接アクセス処理","システマティック処理","ヒューリスティック処理"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A29","stem":"認知容量説では、ネガティブ気分時は何の消費が少ないと説明されるか。","answer":"認知的資源","group":"emotion_resource","term":"認知容量説","note":"認知容量説では、ポジティブ気分では意図的なヒューリスティック処理がなされやすい一方、ネガティブ気分では認知的資源の消費が少ないためシステマティック処理がなされやすいと説明する。","id":"p3q0046","options":["身体的資源","個人資源","認知的資源","社会的資源"]},{"page":2,"chapter":"動機づけ・情動","origin":"左ページQuestion Q30","stem":"Fredrickson,B.L.（フレデリクソン）が提唱した、ポジティブ感情が思考や行動のレパートリーを広げ、個人資源を形成して成長やウェルビーイングにつながるという理論を何と呼ぶか。","answer":"拡張―形成理論","group":"emotion_theory","term":"拡張―形成理論","note":"拡張―形成理論はポジティブ感情の機能を説明する理論で、ネガティブ感情が注意を狭めるのに対し、ポジティブ感情は注意や認知・行動の範囲を広げると考える。","id":"p3q0047","options":["表情（顔面）フィードバック仮説","アーン理論","欲求階層説","拡張―形成理論"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A30","stem":"拡張―形成理論を提唱した人物は誰か。","answer":"Fredrickson,B.L.（フレデリクソン）","group":"emotion_person","term":"拡張―形成理論","note":"拡張―形成理論はポジティブ感情の機能を説明する理論で、ネガティブ感情が注意を狭めるのに対し、ポジティブ感情は注意や認知・行動の範囲を広げると考える。","id":"p3q0048","options":["戸田正直","Zajonc,R.B.（ザイアンス）","Fredrickson,B.L.（フレデリクソン）","Ekman,P.（エクマン）"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswer解説 A30","stem":"拡張―形成理論では、ポジティブ感情は注意の範囲をどのようにすると考えるか。","answer":"広げる","group":"attention_direction","term":"拡張―形成理論","note":"拡張―形成理論はポジティブ感情の機能を説明する理論で、ネガティブ感情が注意を狭めるのに対し、ポジティブ感情は注意や認知・行動の範囲を広げると考える。","id":"p3q0049","options":["一定に保つ","広げる","変化させない","狭める"]},{"page":2,"chapter":"動機づけ・情動","origin":"右ページAnswe q0100","options":["コンストラクト","性格","気質","特性"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A11","stem":"Cloningerの気質を構成する4つのうち、新奇性追求・損害回避・報酬依存と並ぶものは何か。","answer":"固執","group":"cloninger_temperament","term":"性格","note":"Cloningerは気質を新奇性追求、損害回避、報酬依存、固執の4つ、性格を自己志向性、協調性、自己超越性の3つからなるとした。","id":"p3q0101","options":["報酬依存","損害回避","新奇性追求","固執"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A11","stem":"Cloningerの性格を構成する3つのうち、自己志向性・協調性と並ぶものは何か。","answer":"自己超越性","group":"cloninger_character","term":"性格","note":"Cloningerは気質を新奇性追求、損害回避、報酬依存、固執の4つ、性格を自己志向性、協調性、自己超越性の3つからなるとした。","id":"p3q0102","options":["協調性","自己志向性","自己超越性","報酬依存"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A11","stem":"Cloningerの理論では、遺伝の影響が大きいとされるのは気質と性格のどちらか。","answer":"気質","group":"personality_term","term":"性格","note":"Cloningerは気質を新奇性追求、損害回避、報酬依存、固執の4つ、性格を自己志向性、協調性、自己超越性の3つからなるとした。","id":"p3q0103","options":["気質","コンストラクト","特性","性格"]},{"page":4,"chapter":"人格","origin":"左ページQuestion Q12","stem":"Kelly,G.A.（ケリー）が提唱した、外界を認知し解釈する枠組みであるコンストラクトの使い方からパーソナリティを理解する理論を何と呼ぶか。","answer":"パーソナル・コンストラクト理論","group":"personality_theory","term":"パーソナル・コンストラクト理論","note":"パーソナル・コンストラクト理論では、経験した事象の類似性からコンストラクトを形成し、状況に応じて適切なコンストラクトを選択して行動する。","id":"p3q0104","options":["行動遺伝学","Big Five（5因子モデル）","パーソナル・コンストラクト理論","一貫性論争（人間―状況論争）"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A12","stem":"パーソナル・コンストラクト理論を提唱した人物は誰か。","answer":"Kelly,G.A.（ケリー）","group":"personality_person","term":"パーソナル・コンストラクト理論","note":"パーソナル・コンストラクト理論では、経験した事象の類似性からコンストラクトを形成し、状況に応じて適切なコンストラクトを選択して行動する。","id":"p3q0105","options":["Sheldon,W.H.（シェルドン）","Allport,G.W.（オルポート）","Kelly,G.A.（ケリー）","Eysenck,H.J.（アイゼンク）"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A12","stem":"Kellyの理論で、経験した事象の類似性から形成される認知的枠組みを何というか。","answer":"コンストラクト","group":"personality_term","term":"パーソナル・コンストラクト理論","note":"パーソナル・コンストラクト理論では、経験した事象の類似性からコンストラクトを形成し、状況に応じて適切なコンストラクトを選択して行動する。","id":"p3q0106","options":["コンストラクト","性格","特性","気質"]},{"page":4,"chapter":"人格","origin":"右ページAnswer解説 A12","stem":"パーソナル・コンストラクト理論では、行動の前に状況に応じて何を選択すると考えるか。","answer":"適切なコンストラクト","group":"personality_process","term":"パーソナル・コンストラクト理論","note":"パーソナル・コンストラクト理論では、経験した事象の類似性からコンストラクトを形成し、状況に応じて適切なコンストラクトを選択して行動する。","id":"p3q0107","options":["価値類型","根源特性","表面特性","適切なコンストラクト"]},{"page":5,"chapter":"人格","origin":"左ページQuestion Q13","stem":"Mischel,W.（ミッシェル）の主張を発端として、行動の一貫性をめぐって特性論者と状況主義者の間で生じた論争を何と呼ぶか。","answer":"一貫性論争（人間―状況論争）","group":"personality_debate","term":"一貫性論争（人間―状況論争）","note":"Mischelは異なる状況における行動の一貫性は低いと特性論を批判した。これを契機に特性論か状況論かという論争から、人か状況かという人間―状況論争へ展開した。","id":"p3q0108","options":["Big Five（5因子モデル）","パーソナル・コンストラクト理論","一貫性論争（人間―状況論争）","行動遺伝学"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A13","stem":"一貫性論争の発端となった人物は誰か。","answer":"Mischel,W.（ミッシェル）","group":"personality_person","term":"一貫性論争（人間―状況論争）","note":"Mischelは異なる状況における行動の一貫性は低いと特性論を批判した。これを契機に特性論か状況論かという論争から、人か状況かという人間―状況論争へ展開した。","id":"p3q0109","options":["Sheldon,W.H.（シェルドン）","McCrae,R.R.（マクレー）とCosta,P.T.（コスタ）","Allport,G.W.（オルポート）","Mischel,W.（ミッシェル）"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A13","stem":"Mischelが批判したのは主としてどの立場か。","answer":"特性論","group":"personality_approach","term":"一貫性論争（人間―状況論争）","note":"Mischelは異なる状況における行動の一貫性は低いと特性論を批判した。これを契機に特性論か状況論かという論争から、人か状況かという人間―状況論争へ展開した。","id":"p3q0110","options":["特性論","状況主義","類型論","一貫性論争（人間―状況論争）"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A13","stem":"Mischelは異なる状況での行動の一貫性を高いと低いのどちらと考えたか。","answer":"低い","group":"degree","term":"一貫性論争（人間―状況論争）","note":"Mischelは異なる状況における行動の一貫性は低いと特性論を批判した。これを契機に特性論か状況論かという論争から、人か状況かという人間―状況論争へ展開した。","id":"p3q0111","options":["低い","肥満型","高い","分裂気質"]},{"page":5,"chapter":"人格","origin":"左ページQuestion Q14","stem":"Mischel,W.（ミッシェル）の主張が発端となった、個人のパーソナリティよりも状況のほうが行動を規定すると考える立場を何と呼ぶか。","answer":"状況主義","group":"personality_approach","term":"状況主義","note":"状況主義は、行動には時間や状況を越えた一貫性があるとする特性論を批判し、状況が行動を強く規定すると考える。","id":"p3q0112","options":["特性論","状況主義","行動遺伝学","類型論"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A14","stem":"状況主義が行動を強く規定すると考えるものは何か。","answer":"状況","group":"personality_factor","term":"状況主義","note":"状況主義は、行動には時間や状況を越えた一貫性があるとする特性論を批判し、状況が行動を強く規定すると考える。","id":"p3q0113","options":["特性","環境要因","遺伝要因","状況"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A14","stem":"状況主義が批判した、時間や状況を越えた行動の一貫性を想定する立場は何か。","answer":"特性論","group":"personality_approach","term":"状況主義","note":"状況主義は、行動には時間や状況を越えた一貫性があるとする特性論を批判し、状況が行動を強く規定すると考える。","id":"p3q0114","options":["類型論","特性論","状況主義","一貫性論争（人間―状況論争）"]},{"page":5,"chapter":"人格","origin":"左ページQuestion Q15","stem":"行動の個人差について、双生児研究などを用いて遺伝要因と環境要因の双方に焦点を当てる学問領域を何と呼ぶか。","answer":"行動遺伝学","group":"personality_field","term":"行動遺伝学","note":"行動遺伝学では、同一の遺伝子と共有環境をもつ一卵性双生児と、約50%の遺伝子と共有環境をもつ二卵性双生児の相関から、遺伝と共有環境、非共有環境の影響を明らかにする。","id":"p3q0115","options":["行動遺伝学","Big Five（5因子モデル）","一貫性論争（人間―状況論争）","パーソナル・コンストラクト理論"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A15","stem":"一卵性双生児は遺伝子をどの程度共有するとされるか。","answer":"同一","group":"twin_genetics","term":"行動遺伝学","note":"行動遺伝学では、同一の遺伝子と共有環境をもつ一卵性双生児と、約50%の遺伝子と共有環境をもつ二卵性双生児の相関から、遺伝と共有環境、非共有環境の影響を明らかにする。","id":"p3q0116","options":["約25％","約75％","同一","約50％"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A15","stem":"二卵性双生児は遺伝子をおよそ何％共有するとされるか。","answer":"50％程度","group":"percentage","term":"行動遺伝学","note":"行動遺伝学では、同一の遺伝子と共有環境をもつ一卵性双生児と、約50%の遺伝子と共有環境をもつ二卵性双生児の相関から、遺伝と共有環境、非共有環境の影響を明らかにする。","id":"p3q0117","options":["約80％","約70％","約95％以上","50％程度"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A15","stem":"双生児研究で、兄弟姉妹で共通する環境を何というか。","answer":"共有環境","group":"environment_type","term":"行動遺伝学","note":"行動遺伝学では、同一の遺伝子と共有環境をもつ一卵性双生児と、約50%の遺伝子と共有環境をもつ二卵性双生児の相関から、遺伝と共有環境、非共有環境の影響を明らかにする。","id":"p3q0118","options":["体内環境","共有環境","外的環境","非共有環境"]},{"page":5,"chapter":"人格","origin":"右ページAnswer解説 A15","stem":"双生児であっても互いに異なる独自の環境を何というか。","answer":"非共有環境","group":"environment_type","term":"行動遺伝学","note":"行動遺伝学では、同一の遺伝子と共有環境をもつ一卵性双生児と、約50%の遺伝子と共有環境をもつ二卵性双生児の相関から、遺伝と共有環境、非共有環境の影響を明らかにする。","id":"p3q0119","options":["非共有環境","体内環境","外的環境","共有環境"]},{"page":6,"chapter":"脳・神経系","origin":"左ページQuestion Q1","stem":"神経細胞と神経細胞の接続部分を何と呼ぶか。","answer":"シナプス","group":"neuro_term","term":"シナプス","note":"シナプスでは神経細胞同士は密着せずシナプス間隙がある。インパルスが軸索終末に達するとシナプス小胞から神経伝達物質が放出され、後細胞の受容体と結合して情報が伝達される。","id":"p3q0120","options":["シナプス","跳躍伝導","脳波","ホメオスタシス（恒常性）"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A1","stem":"シナプスで神経細胞同士の間にあるわずかな隙間を何というか。","answer":"シナプス間隙","group":"synapse_part","term":"シナプス","note":"シナプスでは神経細胞同士は密着せずシナプス間隙がある。インパルスが軸索終末に達するとシナプス小胞から神経伝達物質が放出され、後細胞の受容体と結合して情報が伝達される。","id":"p3q0121","options":["シナプス小胞","受容体","軸索終末","シナプス間隙"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A1","stem":"インパルスが軸索終末に到達すると、どこから神経伝達物質が放出されるか。","answer":"シナプス小胞","group":"synapse_part","term":"シナプス","note":"シナプスでは神経細胞同士は密着せずシナプス間隙がある。インパルスが軸索終末に達するとシナプス小胞から神経伝達物質が放出され、後細胞の受容体と結合して情報が伝達される。","id":"p3q0122","options":["軸索終末","受容体","シナプス小胞","シナプス間隙"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A1","stem":"放出された神経伝達物質は後細胞の何と結合するか。","answer":"受容体","group":"synapse_part","term":"シナプス","note":"シナプスでは神経細胞同士は密着せずシナプス間隙がある。インパルスが軸索終末に達するとシナプス小胞から神経伝達物質が放出され、後細胞の受容体と結合して情報が伝達される。","id":"p3q0123","options":["受容体","シナプス間隙","軸索終末","シナプス小胞"]},{"page":6,"chapter":"脳・神経系","origin":"左ページQuestion Q2","stem":"神経細胞内でインパルスがランビエ絞輪の間を飛び飛びに伝わることを何と呼ぶか。","answer":"跳躍伝導","group":"neuro_term","term":"跳躍伝導","note":"軸索は髄鞘に覆われ、髄鞘の間にランビエ絞輪が規則的に存在する。髄鞘が絶縁体として働くため、インパルスはランビエ絞輪から次の絞輪へ跳ぶように伝導する。","id":"p3q0124","options":["脳波","シナプス","跳躍伝導","ホメオスタシス（恒常性）"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A2","stem":"跳躍伝導でインパルスが飛び移る節を何というか。","answer":"ランビエ絞輪","group":"neuron_part","term":"跳躍伝導","note":"軸索は髄鞘に覆われ、髄鞘の間にランビエ絞輪が規則的に存在する。髄鞘が絶縁体として働くため、インパルスはランビエ絞輪から次の絞輪へ跳ぶように伝導する。","id":"p3q0125","options":["髄鞘","ランビエ絞輪","シナプス小胞","軸索終末"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A2","stem":"跳躍伝導で軸索を覆う絶縁体として働く構造は何か。","answer":"髄鞘","group":"neuron_part","term":"跳躍伝導","note":"軸索は髄鞘に覆われ、髄鞘の間にランビエ絞輪が規則的に存在する。髄鞘が絶縁体として働くため、インパルスはランビエ絞輪から次の絞輪へ跳ぶように伝導する。","id":"p3q0126","options":["軸索終末","髄鞘","シナプス小胞","ランビエ絞輪"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A2","stem":"髄鞘は電気的にどのような性質をもつと説明されるか。","answer":"絶縁体","group":"neuro_property","term":"跳躍伝導","note":"軸索は髄鞘に覆われ、髄鞘の間にランビエ絞輪が規則的に存在する。髄鞘が絶縁体として働くため、インパルスはランビエ絞輪から次の絞輪へ跳ぶように伝導する。","id":"p3q0127","options":["灰白質","不随意的","バランス","絶縁体"]},{"page":6,"chapter":"脳・神経系","origin":"左ページQuestion Q3","stem":"神経細胞とともに脳を構成し、神経細胞を保護したり栄養を供給したりする細胞を何と呼ぶか。","answer":"グリア細胞（神経膠細胞）","group":"neuro_term","term":"グリア細胞（神経膠細胞）","note":"グリア細胞は神経細胞の間を埋め、脳を空間的に支え、栄養供給や修復などを行う。アストロサイト、オリゴデンドロサイト、ミクログリア、上衣細胞があり、神経細胞の約10倍存在する。","id":"p3q0128","options":["グリア細胞（神経膠細胞）","中枢","視床","大脳皮質"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A3","stem":"グリア細胞の一種で星状膠細胞とも呼ばれるものは何か。","answer":"アストロサイト","group":"glia_type","term":"グリア細胞（神経膠細胞）","note":"グリア細胞は神経細胞の間を埋め、脳を空間的に支え、栄養供給や修復などを行う。アストロサイト、オリゴデンドロサイト、ミクログリア、上衣細胞があり、神経細胞の約10倍存在する。","id":"p3q0129","options":["ミクログリア","オリゴデンドロサイト","上衣細胞","アストロサイト"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A3","stem":"グリア細胞の一種で小膠細胞とも呼ばれるものは何か。","answer":"ミクログリア","group":"glia_type","term":"グリア細胞（神経膠細胞）","note":"グリア細胞は神経細胞の間を埋め、脳を空間的に支え、栄養供給や修復などを行う。アストロサイト、オリゴデンドロサイト、ミクログリア、上衣細胞があり、神経細胞の約10倍存在する。","id":"p3q0130","options":["上衣細胞","アストロサイト","オリゴデンドロサイト","ミクログリア"]},{"page":6,"chapter":"脳・神経系","origin":"右ページAnswer解説 A3","stem":"グリア細胞は神経細胞のおよそ何倍存在するとされるか。","answer":"約10倍","group":"ratio","term":"グリア細胞（神経膠細胞）","note":"グリア細胞は神経細胞の間を埋め、脳を空間的に支え、栄養供給や修復などを行う。アストロサイト、オリゴデンドロサイト、ミクログリア、上衣細胞があり、神経細胞の約10倍存在する。","id":"p3q0131","options":["約9倍","約8倍","約6倍","約10倍"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q4","stem":"脳と脊髄から構成される神経系を何と呼ぶか。","answer":"中枢神経系","group":"nervous_system","term":"中枢神経系","note":"中枢神経系では、脳が全身から送られる情報を集約・分析して指令を出し、脊髄が末梢神経系との間を中継する。","id":"p3q0132","options":["中枢神経系","末梢神経系","体性神経系","自律神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A4","stem":"中枢神経系を構成する2つの主要部分は何か。","answer":"脳と脊髄","group":"nervous_components","term":"中枢神経系","note":"中枢神経系では、脳が全身から送られる情報を集約・分析して指令を出し、脊髄が末梢神経系との間を中継する。","id":"p3q0133","options":["脳と脊髄","運動神経と感覚神経","自律神経系と内分泌系","交感神経系と副交感神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A4","stem":"中枢神経系で末梢神経系との中継を担うものは何か。","answer":"脊髄","group":"brain_region","term":"中枢神経系","note":"中枢神経系では、脳が全身から送られる情報を集約・分析して指令を出し、脊髄が末梢神経系との間を中継する。","id":"p3q0134","options":["脊髄","網様体","脳幹網様体","大脳皮質"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q5","stem":"脳と脊髄以外の神経から構成される神経系を何と呼ぶか。","answer":"末梢神経系","group":"nervous_system","term":"末梢神経系","note":"末梢神経系は、感覚受容器で受け取った情報を中枢神経系に送り、中枢神経系から発信された指令を全身へ送る。","id":"p3q0135","options":["体性神経系","自律神経系","末梢神経系","中枢神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A5","stem":"末梢神経系は感覚受容器で得た情報をどこへ送るか。","answer":"中枢神経系","group":"nervous_destination","term":"末梢神経系","note":"末梢神経系は、感覚受容器で受け取った情報を中枢神経系に送り、中枢神経系から発信された指令を全身へ送る。","id":"p3q0136","options":["末梢神経系","交感神経系","副交感神経系","中枢神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A5","stem":"末梢神経系は中枢神経系からの指令をどこへ送るか。","answer":"全身","group":"nervous_destination","term":"末梢神経系","note":"末梢神経系は、感覚受容器で受け取った情報を中枢神経系に送り、中枢神経系から発信された指令を全身へ送る。","id":"p3q0137","options":["感覚受容器","骨格筋","中枢神経系","全身"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q6","stem":"感覚神経と運動神経から構成される神経系を何と呼ぶか。","answer":"体性神経系","group":"nervous_system","term":"体性神経系","note":"体性神経系は骨格筋や皮膚にある神経で、情報の伝達方向によって運動神経と感覚神経に分かれる。運動神経は筋肉へ指令を伝え、感覚神経は刺激を中枢へ伝える。","id":"p3q0138","options":["中枢神経系","体性神経系","末梢神経系","自律神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A6","stem":"体性神経系で、中枢から筋肉へ指令を伝える神経は何か。","answer":"運動神経","group":"nerve_type","term":"体性神経系","note":"体性神経系は骨格筋や皮膚にある神経で、情報の伝達方向によって運動神経と感覚神経に分かれる。運動神経は筋肉へ指令を伝え、感覚神経は刺激を中枢へ伝える。","id":"p3q0139","options":["感覚神経","運動神経","副交感神経","交感神経"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A6","stem":"体性神経系で、感覚器官に生じた刺激を中枢へ伝える神経は何か。","answer":"感覚神経","group":"nerve_type","term":"体性神経系","note":"体性神経系は骨格筋や皮膚にある神経で、情報の伝達方向によって運動神経と感覚神経に分かれる。運動神経は筋肉へ指令を伝え、感覚神経は刺激を中枢へ伝える。","id":"p3q0140","options":["運動神経","感覚神経","交感神経","副交感神経"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A6","stem":"体性神経系は主として骨格筋と何にある神経からなるか。","answer":"皮膚","group":"body_part","term":"体性神経系","note":"体性神経系は骨格筋や皮膚にある神経で、情報の伝達方向によって運動神経と感覚神経に分かれる。運動神経は筋肉へ指令を伝え、感覚神経は刺激を中枢へ伝える。","id":"p3q0141","options":["感覚器官","内臓","皮膚","骨格筋"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q7","stem":"呼吸器・循環器・消化器など内臓器官の活動を調整する神経系を何と呼ぶか。","answer":"自律神経系","group":"nervous_system","term":"自律神経系","note":"自律神経系は交感神経系と副交感神経系に分かれ、不随意に身体の各器官の動きを制御する。","id":"p3q0142","options":["末梢神経系","体性神経系","自律神経系","中枢神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A7","stem":"自律神経系を構成する2つの神経系は何か。","answer":"交感神経系と副交感神経系","group":"nervous_components","term":"自律神経系","note":"自律神経系は交感神経系と副交感神経系に分かれ、不随意に身体の各器官の動きを制御する。","id":"p3q0143","options":["自律神経系と内分泌系","交感神経系と副交感神経系","運動神経と感覚神経","脳と脊髄"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A7","stem":"自律神経系による内臓器官の制御は、本人の意思によって直接調整できる性質か。","answer":"不随意的","group":"neuro_property","term":"自律神経系","note":"自律神経系は交感神経系と副交感神経系に分かれ、不随意に身体の各器官の動きを制御する。","id":"p3q0144","options":["灰白質","不随意的","絶縁体","バランス"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q8","stem":"優位になると心拍数増加、瞳孔散大、消化液分泌低下などがみられる神経系を何と呼ぶか。","answer":"交感神経系","group":"autonomic_branch","term":"交感神経系","note":"交感神経系はストレス状態の時に優位となり、内臓・血管・消化器・汗腺などに分布して身体を活性化する。","id":"p3q0145","options":["自律神経系","中枢神経系","交感神経系","体性神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A8","stem":"交感神経系が優位になりやすいのはどのような状態か。","answer":"ストレス状態","group":"autonomic_state","term":"交感神経系","note":"交感神経系はストレス状態の時に優位となり、内臓・血管・消化器・汗腺などに分布して身体を活性化する。","id":"p3q0146","options":["リラックスした状態","ストレス状態","深い睡眠状態","安静・覚醒状態"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A8","stem":"交感神経系が優位になると、身体全体は活動性が高まる方向と鎮静する方向のどちらへ変化するか。","answer":"活性化","group":"autonomic_effect","term":"交感神経系","note":"交感神経系はストレス状態の時に優位となり、内臓・血管・消化器・汗腺などに分布して身体を活性化する。","id":"p3q0147","options":["抑制","縮小","活性化","散大"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A8","stem":"交感神経系が優位になると瞳孔は散大と縮小のどちらになるか。","answer":"散大","group":"autonomic_effect","term":"交感神経系","note":"交感神経系はストレス状態の時に優位となり、内臓・血管・消化器・汗腺などに分布して身体を活性化する。","id":"p3q0148","options":["体性神経系","末梢神経系","散大","自律神経系"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q9","stem":"優位になると血圧低下、瞳孔縮小、消化液分泌増加などがみられる神経系を何と呼ぶか。","answer":"副交感神経系","group":"autonomic_branch","term":"副交感神経系","note":"副交感神経系はリラックスした状態で優位となり、交感神経系と拮抗して身体を抑制する。","id":"p3q0149","options":["体性神経系","自律神経系","末梢神経系","副交感神経系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A9","stem":"副交感神経系が優位になりやすいのはどのような状態か。","answer":"リラックスした状態","group":"autonomic_state","term":"副交感神経系","note":"副交感神経系はリラックスした状態で優位となり、交感神経系と拮抗して身体を抑制する。","id":"p3q0150","options":["ストレス状態","リラックスした状態","深い睡眠状態","安静・覚醒状態"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A9","stem":"副交感神経系は身体を活性化と抑制のどちらに向かわせるか。","answer":"抑制","group":"autonomic_effect","term":"副交感神経系","note":"副交感神経系はリラックスした状態で優位となり、交感神経系と拮抗して身体を抑制する。","id":"p3q0151","options":["維持","変化しない","活性化","抑制"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A9","stem":"副交感神経系が優位になると瞳孔は散大と縮小のどちらになるか。","answer":"縮小","group":"autonomic_effect","term":"副交感神経系","note":"副交感神経系はリラックスした状態で優位となり、交感神経系と拮抗して身体を抑制する。","id":"p3q0152","options":["縮小","散大","活性化","抑制"]},{"page":7,"chapter":"脳・神経系","origin":"左ページQuestion Q10","stem":"体外環境が変化しても生命維持のために体内環境を一定に保ち続けようとする働きを何と呼ぶか。","answer":"ホメオスタシス（恒常性）","group":"neuro_term","term":"ホメオスタシス（恒常性）","note":"ホメオスタシスは気温や湿度など外的環境の変化に対してバランスを保つ機能で、自律神経系と内分泌系が拮抗的に作用して維持される。","id":"p3q0153","options":["ホルモン","脳波","ホメオスタシス（恒常性）","シナプス"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A10","stem":"ホメオスタシスの維持に関わる2つの系は何か。","answer":"自律神経系と内分泌系","group":"nervous_components","term":"ホメオスタシス（恒常性）","note":"ホメオスタシスは気温や湿度など外的環境の変化に対してバランスを保つ機能で、自律神経系と内分泌系が拮抗的に作用して維持される。","id":"p3q0154","options":["交感神経系と副交感神経系","運動神経と感覚神経","脳と脊髄","自律神経系と内分泌系"]},{"page":7,"chapter":"脳・神経系","origin":"右ページAnswer解説 A10","stem":"ホメオスタシスでは外的環境の変化に対して何を保つことが目指されるか。","answer":"バランス","group":"neuro_property","term":"ホメオスタシス（恒常性）","note":"ホメオスタシスは気温や湿度など外的環境の変化に対してバランスを保つ機能で、自律神経系と内分泌系が拮抗的に作用して維持される。","id":"p3q0155","options":["不随意的","灰白質","バランス","絶縁体"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q11","stem":"大脳表層の灰白質の層で、領域によって異なる高次機能を担う部位を何と呼ぶか。","answer":"大脳皮質","group":"brain_region","term":"大脳皮質","note":"大脳皮質は知覚、随意運動、思考、推理、記憶などに関わり、運動野、感覚野、聴覚野、視覚野、連合野などに分かれる。","id":"p3q0156","options":["大脳皮質","大脳基底核","間脳","脊髄"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A11","stem":"大脳皮質は大脳の表層にある何質の層か。","answer":"灰白質","group":"brain_tissue","term":"大脳皮質","note":"大脳皮質は知覚、随意運動、思考、推理、記憶などに関わり、運動野、感覚野、聴覚野、視覚野、連合野などに分かれる。","id":"p3q0157","options":["神経核","髄質","灰白質","白質"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A11","stem":"大脳皮質が関わる高次機能として、知覚・随意運動・思考・推理と並んで挙げられるものは何か。","answer":"記憶","group":"brain_function","term":"大脳皮質","note":"大脳皮質は知覚、随意運動、思考、推理、記憶などに関わり、運動野、感覚野、聴覚野、視覚野、連合野などに分かれる。","id":"p3q0158","options":["記憶","生命","循環","運動機能"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A11","stem":"大脳皮質の機能領域には運動野・感覚野・聴覚野・視覚野と何があるか。","answer":"連合野","group":"cortical_area","term":"大脳皮質","note":"大脳皮質は知覚、随意運動、思考、推理、記憶などに関わり、運動野、感覚野、聴覚野、視覚野、連合野などに分かれる。","id":"p3q0159","options":["聴覚野","視覚連合野","連合野","一次体性感覚野"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q12","stem":"中心溝より前部に位置し、認知機能から運動機能まで幅広い機能を担う大脳の部位を何と呼ぶか。","answer":"前頭葉","group":"brain_lobe","term":"前頭葉","note":"前頭葉の運動野の前にある前頭連合野は、行動の決定、結果の予測、抽象的な思考などに関わる。","id":"p3q0160","options":["後頭葉","頭頂葉","前頭葉","側頭葉"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A12","stem":"前頭葉の運動野の前に位置する連合野を何というか。","answer":"前頭連合野","group":"cortical_area","term":"前頭葉","note":"前頭葉の運動野の前にある前頭連合野は、行動の決定、結果の予測、抽象的な思考などに関わる。","id":"p3q0161","options":["前頭連合野","連合野","視覚連合野","一次体性感覚野"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A12","stem":"前頭連合野が関わる機能として、行動の決定・結果の予測と並んで挙げられるものは何か。","answer":"抽象的な思考","group":"brain_function","term":"前頭葉","note":"前頭葉の運動野の前にある前頭連合野は、行動の決定、結果の予測、抽象的な思考などに関わる。","id":"p3q0162","options":["内分泌","記憶","抽象的な思考","空間認知"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q13","stem":"中心溝より後部、外側溝より上部に位置し、感覚情報の統合や空間認知などを担う大脳の部位を何と呼ぶか。","answer":"頭頂葉","group":"brain_lobe","term":"頭頂葉","note":"中心溝後方には一次体性感覚野があり温度・圧迫・痛みや筋腱関節の感覚を担う。その後方の頭頂連合野は感覚情報の統合や空間認知に関わる。","id":"p3q0163","options":["側頭葉","頭頂葉","後頭葉","前頭葉"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A13","stem":"中心溝の後ろにある、温度・圧迫・痛みなどの感覚を担う領域は何か。","answer":"一次体性感覚野","group":"cortical_area","term":"頭頂葉","note":"中心溝後方には一次体性感覚野があり温度・圧迫・痛みや筋腱関節の感覚を担う。その後方の頭頂連合野は感覚情報の統合や空間認知に関わる。","id":"p3q0164","options":["連合野","聴覚野","前頭連合野","一次体性感覚野"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A13","stem":"頭頂連合野が関わる機能として感覚情報の統合と並んで挙げられるものは何か。","answer":"空間認知","group":"brain_function","term":"頭頂葉","note":"中心溝後方には一次体性感覚野があり温度・圧迫・痛みや筋腱関節の感覚を担う。その後方の頭頂連合野は感覚情報の統合や空間認知に関わる。","id":"p3q0165","options":["覚醒","評価・判断","抽象的な思考","空間認知"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A13","stem":"一次体性感覚野は中心溝の前後どちらに位置するか。","answer":"後方","group":"spatial_position","term":"頭頂葉","note":"中心溝後方には一次体性感覚野があり温度・圧迫・痛みや筋腱関節の感覚を担う。その後方の頭頂連合野は感覚情報の統合や空間認知に関わる。","id":"p3q0166","options":["跳躍伝導","ランビエ絞輪","後方","シナプス"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q14","stem":"外側溝の下部に位置し、聴覚情報の処理や言語理解、記憶などを担う大脳の部位を何と呼ぶか。","answer":"側頭葉","group":"brain_lobe","term":"側頭葉","note":"側頭葉の横側頭回に聴覚野があり、上側頭回後部には感覚性言語野（ウェルニッケ野）がある。損傷すると感覚性失語が生じる。","id":"p3q0167","options":["前頭葉","後頭葉","頭頂葉","側頭葉"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A14","stem":"側頭葉の横側頭回にある感覚野は何か。","answer":"聴覚野","group":"cortical_area","term":"側頭葉","note":"側頭葉の横側頭回に聴覚野があり、上側頭回後部には感覚性言語野（ウェルニッケ野）がある。損傷すると感覚性失語が生じる。","id":"p3q0168","options":["視覚連合野","前頭連合野","一次体性感覚野","聴覚野"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A14","stem":"上側頭回後部にある言語理解に関わる領域は何か。","answer":"感覚性言語野（ウェルニッケ野）","group":"language_area","term":"側頭葉","note":"側頭葉の横側頭回に聴覚野があり、上側頭回後部には感覚性言語野（ウェルニッケ野）がある。損傷すると感覚性失語が生じる。","id":"p3q0169","options":["ブローカ野","感覚性言語野（ウェルニッケ野）","言語野","ウェルニッケ野"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A14","stem":"ウェルニッケ野が損傷すると生じる失語は何か。","answer":"感覚性失語（ウェルニッケ失語）","group":"aphasia_type","term":"側頭葉","note":"側頭葉の横側頭回に聴覚野があり、上側頭回後部には感覚性言語野（ウェルニッケ野）がある。損傷すると感覚性失語が生じる。","id":"p3q0170","options":["失認","高次脳機能障害","感覚性失語（ウェルニッケ失語）","失語"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q15","stem":"大脳の後部にあり、視覚情報の処理などを担う大脳の部位を何と呼ぶか。","answer":"後頭葉","group":"brain_lobe","term":"後頭葉","note":"後頭葉の視覚野を囲む部位には視覚連合野があり、視覚情報の統合に関わる。損傷すると視覚失認や相貌失認が生じることがある。","id":"p3q0171","options":["側頭葉","頭頂葉","後頭葉","前頭葉"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A15","stem":"後頭葉で視覚野を囲み、視覚情報の統合に関わる領域は何か。","answer":"視覚連合野","group":"cortical_area","term":"後頭葉","note":"後頭葉の視覚野を囲む部位には視覚連合野があり、視覚情報の統合に関わる。損傷すると視覚失認や相貌失認が生じることがある。","id":"p3q0172","options":["視覚連合野","聴覚野","連合野","一次体性感覚野"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A15","stem":"後頭葉の視覚情報処理領域の損傷で生じうる障害の1つは何か。","answer":"視覚失認","group":"agnosia_type","term":"後頭葉","note":"後頭葉の視覚野を囲む部位には視覚連合野があり、視覚情報の統合に関わる。損傷すると視覚失認や相貌失認が生じることがある。","id":"p3q0173","options":["聴覚失認","触覚失認","視覚失認","身体失認"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A15","stem":"顔の認識が困難になる障害を何というか。","answer":"相貌失認","group":"agnosia_type","term":"後頭葉","note":"後頭葉の視覚野を囲む部位には視覚連合野があり、視覚情報の統合に関わる。損傷すると視覚失認や相貌失認が生じることがある。","id":"p3q0174","options":["聴覚失認","身体失認","相貌失認","触覚失認"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q16","stem":"意識や呼吸、循環、消化など生命維持に関わる機能を制御する中脳・橋・延髄からなる部位を何と呼ぶか。","answer":"脳幹","group":"brain_region","term":"脳幹","note":"脳幹には自律神経の中枢が多く集まり、損傷すると生命維持が困難になる。延髄から中脳の中心部には網様体が分布し、意識や覚醒に関わる。","id":"p3q0175","options":["海馬","小脳","扁桃体","脳幹"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A16","stem":"脳幹を構成する3部位は、中脳・橋と何か。","answer":"延髄","group":"brain_region","term":"脳幹","note":"脳幹には自律神経の中枢が多く集まり、損傷すると生命維持が困難になる。延髄から中脳の中心部には網様体が分布し、意識や覚醒に関わる。","id":"p3q0176","options":["海馬","延髄","視床","脳幹"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A16","stem":"脳幹の損傷で特に問題となるのは何の維持が困難になることか。","answer":"生命","group":"brain_function","term":"脳幹","note":"脳幹には自律神経の中枢が多く集まり、損傷すると生命維持が困難になる。延髄から中脳の中心部には網様体が分布し、意識や覚醒に関わる。","id":"p3q0177","options":["評価・判断","生命","抽象的な思考","記憶"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A16","stem":"延髄から中脳中心部に分布し、意識や覚醒に関わる構造は何か。","answer":"網様体","group":"brain_region","term":"脳幹","note":"脳幹には自律神経の中枢が多く集まり、損傷すると生命維持が困難になる。延髄から中脳の中心部には網様体が分布し、意識や覚醒に関わる。","id":"p3q0178","options":["中脳","大脳皮質","大脳辺縁系","網様体"]},{"page":8,"chapter":"脳・神経系","origin":"左ページQuestion Q17","stem":"視床や視床下部などから構成され、左右の大脳半球の間に位置する部位を何と呼ぶか。","answer":"間脳","group":"brain_region","term":"間脳","note":"間脳は大脳辺縁系や大脳基底核、脳幹などと神経線維を通じて連絡し、感覚・情動・自律神経・内分泌などの機能に関わる。","id":"p3q0179","options":["間脳","海馬","延髄","大脳辺縁系"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A17","stem":"間脳を構成する主要部位は視床と何か。","answer":"視床下部","group":"brain_region","term":"間脳","note":"間脳は大脳辺縁系や大脳基底核、脳幹などと神経線維を通じて連絡し、感覚・情動・自律神経・内分泌などの機能に関わる。","id":"p3q0180","options":["間脳","視床下部","大脳半球","視床"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A17","stem":"間脳は左右の何の間に位置するか。","answer":"大脳半球","group":"brain_region","term":"間脳","note":"間脳は大脳辺縁系や大脳基底核、脳幹などと神経線維を通じて連絡し、感覚・情動・自律神経・内分泌などの機能に関わる。","id":"p3q0181","options":["延髄","視床","海馬","大脳半球"]},{"page":8,"chapter":"脳・神経系","origin":"右ページAnswer解説 A17","stem":"間脳が関わる機能として、感覚・情動・自律神経と並んで挙げられるものは何か。","answer":"内分泌","group":"brain_function","term":"間脳","note":"間脳は大脳辺縁系や大脳基底核、脳幹などと神経線維を通じて連絡し、感覚・情動・自律神経・内分泌などの機能に関わる。","id":"p3q0182","options":["生命","運動機能","内分泌","記憶"]},{"page":9,"chapter":"脳・神経系","origin":"左ページQuestion Q18","stem":"中枢神経系の中で最も大きい神経核で、嗅覚以外の感覚情報の中継点として機能する部位を何と呼ぶか。","answer":"視床","group":"brain_region","term":"視床","note":"視床は間脳全体の約80%を占める卵大の灰白質で、嗅覚以外の感覚情報を大脳皮質へ中継する。","id":"p3q0183","options":["網様体","間脳","海馬","視床"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A18","stem":"視床は間脳全体のおよそ何％を占めるか。","answer":"約80％","group":"percentage","term":"視床","note":"視床は間脳全体の約80%を占める卵大の灰白質で、嗅覚以外の感覚情報を大脳皮質へ中継する。","id":"p3q0184","options":["50％程度","約95％以上","約70％","約80％"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A18","stem":"視床が中継しない感覚は何か。","answer":"嗅覚","group":"sensory_modality","term":"視床","note":"視床は間脳全体の約80%を占める卵大の灰白質で、嗅覚以外の感覚情報を大脳皮質へ中継する。","id":"p3q0185","options":["触覚","嗅覚","視覚","聴覚"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A18","stem":"視床は感覚情報を最終的にどこへ中継するか。","answer":"大脳皮質","group":"brain_region","term":"視床","note":"視床は間脳全体の約80%を占める卵大の灰白質で、嗅覚以外の感覚情報を大脳皮質へ中継する。","id":"p3q0186","options":["脳幹網様体","大脳皮質","視床","大脳辺縁系"]},{"page":9,"chapter":"脳・神経系","origin":"左ページQuestion Q19","stem":"自律神経系や内分泌系の中枢として体内環境のホメオスタシスを維持する部位を何と呼ぶか。","answer":"視床下部","group":"brain_region","term":"視床下部","note":"視床下部は間脳の最下部にあり、体温・水分、循環・呼吸、エネルギー代謝、睡眠・覚醒などの生命活動を調節する。","id":"p3q0187","options":["間脳","脳幹","脊髄","視床下部"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A19","stem":"視床下部は間脳のどの位置にあるか。","answer":"最下部","group":"spatial_position","term":"視床下部","note":"視床下部は間脳の最下部にあり、体温・水分、循環・呼吸、エネルギー代謝、睡眠・覚醒などの生命活動を調節する。","id":"p3q0188","options":["最下部","ランビエ絞輪","受容体","シナプス"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A19","stem":"視床下部が中枢となる2つの系は何か。","answer":"自律神経系と内分泌系","group":"nervous_components","term":"視床下部","note":"視床下部は間脳の最下部にあり、体温・水分、循環・呼吸、エネルギー代謝、睡眠・覚醒などの生命活動を調節する。","id":"p3q0189","options":["記憶学習","自律神経系と内分泌系","観察学習","運動学習"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A19","stem":"視床下部が維持する体内環境の安定を何というか。","answer":"ホメオスタシス","group":"neuro_term","term":"視床下部","note":"視床下部は間脳の最下部にあり、体温・水分、循環・呼吸、エネルギー代謝、睡眠・覚醒などの生命活動を調節する。","id":"p3q0190","options":["ホメオスタシス","グリア細胞（神経膠細胞）","ホルモン","神経伝達物質"]},{"page":9,"chapter":"脳・神経系","origin":"左ページQuestion Q20","stem":"視床の上部にあり、睡眠作用をもつメラトニンを分泌する部位を何と呼ぶか。","answer":"松果体","group":"brain_region","term":"松果体","note":"松果体は松ぼっくりに似た形をしており、睡眠に関わるメラトニンを分泌する。","id":"p3q0191","options":["延髄","大脳基底核","帯状回","松果体"]},{"page":9,"chapter":"脳・神経系","origin":"右ページAnswer解説 A20","stem":"松果体 器官","内分泌器官","末梢神経系の器官"]},{"page":10,"chapter":"脳・神経系","origin":"左ページQuestion Q28","stem":"シナプスにおける情報伝達に介在する化学物質を何と呼ぶか。","answer":"神経伝達物質","group":"neuro_term","term":"神経伝達物質","note":"神経伝達物質はシナプスで放出され情報伝達を担う。大きくモノアミン類、アミノ酸、アセチルコリン、神経ペプチドの4カテゴリに分類される。","id":"p3q0222","options":["ホメオスタシス","跳躍伝導","脳波","神経伝達物質"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A28","stem":"神経伝達物質の4カテゴリは、モノアミン類、アミノ酸、アセチルコリンと何か。","answer":"神経ペプチド","group":"neurotransmitter_category","term":"神経伝達物質","note":"神経伝達物質はシナプスで放出され情報伝達を担う。大きくモノアミン類、アミノ酸、アセチルコリン、神経ペプチドの4カテゴリに分類される。","id":"p3q0223","options":["アセチルコリン","モノアミン類","アミノ酸","神経ペプチド"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A28","stem":"神経伝達物質はどこで放出されるか。","answer":"シナプス","group":"neuro_term","term":"神経伝達物質","note":"神経伝達物質はシナプスで放出され情報伝達を担う。大きくモノアミン類、アミノ酸、アセチルコリン、神経ペプチドの4カテゴリに分類される。","id":"p3q0224","options":["神経伝達物質","ホメオスタシス","シナプス","ホメオスタシス（恒常性）"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A28","stem":"神経伝達物質の主な役割は何か。","answer":"情報の伝達","group":"neuro_function","term":"神経伝達物質","note":"神経伝達物質はシナプスで放出され情報伝達を担う。大きくモノアミン類、アミノ酸、アセチルコリン、神経ペプチドの4カテゴリに分類される。","id":"p3q0225","options":["情報の選択","情報の統合","情報の貯蔵","情報の伝達"]},{"page":10,"chapter":"脳・神経系","origin":"左ページQuestion Q29","stem":"特定の器官で作られ、血流によって標的器官へ運ばれて効果を示す化学物質を何と呼ぶか。","answer":"ホルモン","group":"neuro_term","term":"ホルモン","note":"ホルモンは極めて微量でも効果を示し身体の調整物質として働く。産生器官には視床下部、下垂体、甲状腺、副腎、性腺などがある。","id":"p3q0226","options":["ホルモン","脳波","側性化（半球優位性）","跳躍伝導"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A29","stem":"ホルモンは何によって標的器官へ運ばれるか。","answer":"血流","group":"transport_medium","term":"ホルモン","note":"ホルモンは極めて微量でも効果を示し身体の調整物質として働く。産生器官には視床下部、下垂体、甲状腺、副腎、性腺などがある。","id":"p3q0227","options":["神経線維","リンパ流","髄液","血流"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A29","stem":"ホルモンは量が多くなければ作用しないか、微量でも作用するか。","answer":"極めて微量でも作用する","group":"hormone_property","term":"ホルモン","note":"ホルモンは極めて微量でも効果を示し身体の調整物質として働く。産生器官には視床下部、下垂体、甲状腺、副腎、性腺などがある。","id":"p3q0228","options":["濃度にかかわらず作用しない","大量でのみ作用する","極めて微量でも作用する","一定量を超えるとだけ作用する"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A29","stem":"ホルモンを産生する器官として、下垂体・甲状腺・副腎と並んで挙げられるものは何か。","answer":"性腺","group":"endocrine_organ","term":"ホルモン","note":"ホルモンは極めて微量でも効果を示し身体の調整物質として働く。産生器官には視床下部、下垂体、甲状腺、副腎、性腺などがある。","id":"p3q0229","options":["下垂体","副腎","甲状腺","性腺"]},{"page":10,"chapter":"脳・神経系","origin":"左ページQuestion Q30","stem":"脳の電気活動を頭部につけた電極で波形として記録したものを何と呼ぶか。","answer":"脳波","group":"neuro_term","term":"脳波","note":"脳波にはβ波14〜30Hz、α波8〜13Hz、θ波4〜7Hz、δ波1〜3Hzなどがあり、覚醒・睡眠状態と関連する。てんかんや脳腫瘍で特徴的波形がみられることもある。","id":"p3q0230","options":["跳躍伝導","神経伝達物質","脳波","側性化（半球優位性）"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A30","stem":"開眼時や精神活動時にみられやすい脳波は何か。","answer":"β波","group":"brain_wave","term":"脳波","note":"脳波にはβ波14〜30Hz、α波8〜13Hz、θ波4〜7Hz、δ波1〜3Hzなどがあり、覚醒・睡眠状態と関連する。てんかんや脳腫瘍で特徴的波形がみられることもある。","id":"p3q0231","options":["δ波","θ波","β波","α波"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A30","stem":"成人が安静・覚醒・閉眼時にみられやすい脳波は何か。","answer":"α波","group":"brain_wave","term":"脳波","note":"脳波にはβ波14〜30Hz、α波8〜13Hz、θ波4〜7Hz、δ波1〜3Hzなどがあり、覚醒・睡眠状態と関連する。てんかんや脳腫瘍で特徴的波形がみられることもある。","id":"p3q0232","options":["θ波","α波","δ波","β波"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A30","stem":"浅い睡眠時にみられやすい脳波は何か。","answer":"θ波","group":"brain_wave","term":"脳波","note":"脳波にはβ波14〜30Hz、α波8〜13Hz、θ波4〜7Hz、δ波1〜3Hzなどがあり、覚醒・睡眠状態と関連する。てんかんや脳腫瘍で特徴的波形がみられることもある。","id":"p3q0233","options":["δ波","θ波","α波","β波"]},{"page":10,"chapter":"脳・神経系","origin":"右ページAnswer解説 A30","stem":"深い睡眠時にみられやすい脳波は何か。","answer":"δ波","group":"brain_wave","term":"脳波","note":"脳波にはβ波14〜30Hz、α波8〜13Hz、θ波4〜7Hz、δ波1〜3Hzなどがあり、覚醒・睡眠状態と関連する。てんかんや脳腫瘍で特徴的波形がみられることもある。","id":"p3q0234","options":["β波","δ波","θ波","α波"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q31","stem":"事故や病気で脳が損傷し、認知・記憶・感情・言語などの高次機能に支障が生じる状態を何と呼ぶか。","answer":"高次脳機能障害","group":"neuro_disorder","term":"高次脳機能障害","note":"高次脳機能障害は大脳皮質の連合野が担う高次機能の障害で、記憶障害、注意障害、遂行機能障害、社会行動障害、失行、失認、失語などが含まれる。","id":"p3q0235","options":["失認","運動性失語（ブローカ失語）","失語","高次脳機能障害"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A31","stem":"高次脳機能障害に関係する大脳皮質の領域は何か。","answer":"連合野","group":"cortical_area","term":"高次脳機能障害","note":"高次脳機能障害は大脳皮質の連合野が担う高次機能の障害で、記憶障害、注意障害、遂行機能障害、社会行動障害、失行、失認、失語などが含まれる。","id":"p3q0236","options":["一次体性感覚野","連合野","聴覚野","視覚連合野"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A31","stem":"高次脳機能障害に含まれる行為の障害を何というか。","answer":"失行","group":"neuro_disorder","term":"高次脳機能障害","note":"高次脳機能障害は大脳皮質の連合野が担う高次機能の障害で、記憶障害、注意障害、遂行機能障害、社会行動障害、失行、失認、失語などが含まれる。","id":"p3q0237","options":["想起障害","逆向性健忘","失行","記憶障害"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A31","stem":"高次脳機能障害に含まれる認知の障害を何というか。","answer":"失認","group":"neuro_disorder","term":"高次脳機能障害","note":"高次脳機能障害は大脳皮質の連合野が担う高次機能の障害で、記憶障害、注意障害、遂行機能障害、社会行動障害、失行、失認、失語などが含まれる。","id":"p3q0238","options":["失語","前向性健忘","運動性失語（ブローカ失語）","失認"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q32","stem":"右利きでは左半球が主に言語機能、右半球が主に非言語機能を担うといった左右半球の機能差を何と呼ぶか。","answer":"側性化（半球優位性）","group":"neuro_term","term":"側性化（半球優位性）","note":"側性化では、右利きの人の約95%以上、左利きの人でも約70%が左半球に言語野をもつとされる。","id":"p3q0239","options":["ホメオスタシス（恒常性）","ホルモン","側性化（半球優位性）","脳波"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A32","stem":"右利きの人で左半球に言語野をもつ割合はおよそどの程度か。","answer":"約95％以上","group":"percentage","term":"側性化（半球優位性）","note":"側性化では、右利きの人の約95%以上、左利きの人でも約70%が左半球に言語野をもつとされる。","id":"p3q0240","options":["約70％","約95％以上","約80％","50％程度"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A32","stem":"左利きの人でも左半球に言語野をもつ割合はおよそどの程度か。","answer":"約70％","group":"percentage","term":"側性化（半球優位性）","note":"側性化では、右利きの人の約95%以上、左利きの人でも約70%が左半球に言語野をもつとされる。","id":"p3q0241","options":["約80％","約70％","約95％以上","50％程度"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A32","stem":"一般に左半球が優位とされる機能は何か。","answer":"言語機能","group":"brain_function","term":"側性化（半球優位性）","note":"側性化では、右利きの人の約95%以上、左利きの人でも約70%が左半球に言語野をもつとされる。","id":"p3q0242","options":["言語機能","受傷前後の両方","受傷前","受傷時"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q33","stem":"脳の受傷が起こった以降の出来事を覚えられなくなる状態を何と呼ぶか。","answer":"前向性健忘","group":"amnesia_type","term":"前向性健忘","note":"前向性健忘は脳受傷時点を境に、それ以降に経験した出来事の再生ができなくなる記憶障害である。","id":"p3q0243","options":["失行","前向性健忘","感覚性失語（ウェルニッケ失語）","高次脳機能障害"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A33","stem":"前向性健忘で再生が困難になる出来事は、脳損傷を境にしてどちら側の時期に経験したものか。","answer":"受傷後","group":"time_direction","term":"前向性健忘","note":"前向性健忘は脳受傷時点を境に、それ以降に経験した出来事の再生ができなくなる記憶障害である。","id":"p3q0244","options":["受傷時のみ","前後の区別はない","受傷後","受傷前"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A33","stem":"前向性健忘は、情報を新たに保持する過程と既存情報を思い出す過程のどちらの障害に分類されるか。","answer":"記憶障害","group":"disorder_category","term":"前向性健忘","note":"前向性健忘は脳受傷時点を境に、それ以降に経験した出来事の再生ができなくなる記憶障害である。","id":"p3q0245","options":["対象認知の障害","想起障害","言語機能の障害","記憶障害"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q34","stem":"脳の受傷が起こった以前の出来事を思い出せなくなる状態を何と呼ぶか。","answer":"逆向性健忘","group":"amnesia_type","term":"逆向性健忘","note":"逆向性健忘は脳受傷時点を境に、それ以前に経験した出来事を再生できなくなる想起障害である。","id":"p3q0246","options":["高次脳機能障害","逆向性健忘","（左側）半側空間無視","失認"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A34","stem":"逆向性健忘で再生が困難になる出来事は、脳損傷を境にしてどちら側の時期に経験したものか。","answer":"受傷前","group":"time_direction","term":"逆向性健忘","note":"逆向性健忘は脳受傷時点を境に、それ以前に経験した出来事を再生できなくなる想起障害である。","id":"p3q0247","options":["受傷後","前後の区別はない","受傷時のみ","受傷前"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A34","stem":"逆向性健忘は、情報を新たに保持する過程と既存情報を思い出す過程のどちらの障害に分類されるか。","answer":"想起障害","group":"disorder_category","term":"逆向性健忘","note":"逆向性健忘は脳受傷時点を境に、それ以前に経験した出来事を再生できなくなる想起障害である。","id":"p3q0248","options":["対象認知の障害","想起障害","言語機能の障害","記憶障害"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q35","stem":"主に右半球頭頂葉の損傷により、左側にある感覚刺激を認識できなくなる状態を何と呼ぶか。","answer":"（左側）半側空間無視","group":"neuro_disorder","term":"（左側）半側空間無視","note":"左半側空間無視では右側だけ靴を履く、皿の左側の食物を残すなどがみられる。感覚器そのものの障害ではなく、空間性注意に右半球が優位なためと考えられる。","id":"p3q0249","options":["失認","（左側）半側空間無視","高次脳機能障害","感覚性失語（ウェルニッケ失語）"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A35","stem":"左半側空間無視が生じやすいのは主にどちらの半球の損傷か。","answer":"右半球","group":"hemisphere","term":"（左側）半側空間無視","note":"左半側空間無視では右側だけ靴を履く、皿の左側の食物を残すなどがみられる。感覚器そのものの障害ではなく、空間性注意に右半球が優位なためと考えられる。","id":"p3q0250","options":["両半球","左半球","小脳","右半球"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A35","stem":"左半側空間無視で問題になるのは感覚器の障害ではなく何の障害か。","answer":"空間性注意","group":"attention_type","term":"（左側）半側空間無視","note":"左半側空間無視では右側だけ靴を履く、皿の左側の食物を残すなどがみられる。感覚器そのものの障害ではなく、空間性注意に右半球が優位なためと考えられる。","id":"p3q0251","options":["空間性注意","選択的注意","持続的注意","分割注意"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A35","stem":"左半側空間無視が生じやすい大脳葉は何か。","answer":"頭頂葉","group":"brain_lobe","term":"（左側）半側空間無視","note":"左半側空間無視では右側だけ靴を履く、皿の左側の食物を残すなどがみられる。感覚器そのものの障害ではなく、空間性注意に右半球が優位なためと考えられる。","id":"p3q0252","options":["頭頂葉","側頭葉","前頭葉","後頭葉"]},{"page":11,"chapter":"脳・神経系","origin":"左ページQuestion Q36","stem":"運動機能や言語理解に問題がないにもかかわらず、日常生活で目的とする行動の遂行が困難な状態を何と呼ぶか。","answer":"失行","group":"neuro_disorder","term":"失行","note":"失行は運動機能、言語や対象認知に問題がないのに、目的に沿った運動が遂行できない状態で、観念運動失行、観念失行、肢節運動失行などがある。","id":"p3q0253","options":["運動性失語（ブローカ失語）","失語","失行","逆向性健忘"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A36","stem":"失行の種類として、観念失行・肢節運動失行と並んで挙げられるものは何か。","answer":"観念運動失行","group":"apraxia_type","term":"失行","note":"失行は運動機能、言語や対象認知に問題がないのに、目的に沿った運動が遂行できない状態で、観念運動失行、観念失行、肢節運動失行などがある。","id":"p3q0254","options":["肢節運動失行","失認","観念失行","観念運動失行"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A36","stem":"日常生活用品が使えず、目的に沿った運動ができない失行の例として挙げられるのは何失行か。","answer":"観念失行","group":"apraxia_type","term":"失行","note":"失行は運動機能、言語や対象認知に問題がないのに、目的に沿った運動が遂行できない状態で、観念運動失行、観念失行、肢節運動失行などがある。","id":"p3q0255","options":["失認","観念失行","観念運動失行","肢節運動失行"]},{"page":11,"chapter":"脳・神経系","origin":"右ページAnswer解説 A36","stem":"指先を使った細かな運動ができない失行を何というか。","answer":"肢節運動失行","group":"apraxia_type","term":"失行","note":"失行は運動機能、言語や対象認知に問題がないのに、目的に沿った運動が遂行できない状態で、観念運動失行、観念失行、肢節運動失行などがある。","id":"p3q0256","options":["観念失行","失認","肢節運動失行","観念運動失行"]},{"page":12,"chapter":"脳・神経系","origin":"左ページQuestion Q37","stem":"感覚器官に問題がないにもかかわらず、特定の感覚を通して対象を知覚できない状態を何と呼ぶか。","answer":"失認","group":"neuro_disorder","term":"失認","note":"失認はある感覚モダリティにおける対象認知の障害で、視覚失認、聴覚失認、触覚失認、身体失認などがある。","id":"p3q0257","options":["失認","高次脳機能障害","前向性健忘","運動性失語（ブローカ失語）"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A37","stem":"失認は何における対象認知の障害と説明されるか。","answer":"感覚モダリティ","group":"disorder_category","term":"失認","note":"失認はある感覚モダリティにおける対象認知の障害で、視覚失認、聴覚失認、触覚失認、身体失認などがある。","id":"p3q0258","options":["想起障害","言語機能の障害","感覚モダリティ","記憶障害"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A37","stem":"失認の例として、視覚失認・聴覚失認・触覚失認と並んで挙げられるものは何か。","answer":"身体失認","group":"agnosia_type","term":"失認","note":"失認はある感覚モダリティにおける対象認知の障害で、視覚失認、聴覚失認、触覚失認、身体失認などがある。","id":"p3q0259","options":["相貌失認","触覚失認","視覚失認","身体失認"]},{"page":12,"chapter":"脳・神経系","origin":"左ページQuestion Q38","stem":"言語野の損傷によって、発話や言葉の意味理解、復唱、読字、書字などに支障がみられる状態を何と呼ぶか。","answer":"失語","group":"neuro_disorder","term":"失語","note":"失語は言語野の損傷による言語機能の障害で、運動性失語、感覚性失語、伝導失語、健忘失語、全失語などがある。","id":"p3q0260","options":["失語","感覚性失語（ウェルニッケ失語）","前向性健忘","失認"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A38","stem":"失語の原因となるのは何の損傷か。","answer":"言語野","group":"language_area","term":"失語","note":"失語は言語野の損傷による言語機能の障害で、運動性失語、感覚性失語、伝導失語、健忘失語、全失語などがある。","id":"p3q0261","options":["ブローカ野","言語野","感覚性言語野（ウェルニッケ野）","ウェルニッケ野"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A38","stem":"失語の種類として運動性失語・感覚性失語・伝導失語・健忘失語と並んで挙げられるものは何か。","answer":"全失語","group":"aphasia_type","term":"失語","note":"失語は言語野の損傷による言語機能の障害で、運動性失語、感覚性失語、伝導失語、健忘失語、全失語などがある。","id":"p3q0262","options":["流暢な話し方","復唱が保たれた話し方","錯語が多い話し方","全失語"]},{"page":12,"chapter":"脳・神経系","origin":"左ページQuestion Q39","stem":"言語理解はおおむね良好だが、話し方がぎこちなく発話や復唱に支障がみられる失語を何と呼ぶか。","answer":"運動性失語（ブローカ失語）","group":"aphasia_type","term":"運動性失語（ブローカ失語）","note":"前頭葉の運動性言語野（ブローカ野）は言葉を話したり文字に書いたりする働きを担う。損傷で運動性失語が生じ、電文調の話し方、錯語などがみられる。","id":"p3q0263","options":["前向性健忘","高次脳機能障害","感覚性失語（ウェルニッケ失語）","運動性失語（ブローカ失語）"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A39","stem":"運動性失語に関わる言語野は何か。","answer":"ブローカ野","group":"language_area","term":"運動性失語（ブローカ失語）","note":"前頭葉の運動性言語野（ブローカ野）は言葉を話したり文字に書いたりする働きを担う。損傷で運動性失語が生じ、電文調の話し方、錯語などがみられる。","id":"p3q0264","options":["感覚性言語野（ウェルニッケ野）","一次聴覚野","ブローカ野","一次運動野"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A39","stem":"ブローカ野は大脳のどの葉にあるか。","answer":"前頭葉","group":"brain_lobe","term":"運動性失語（ブローカ失語）","note":"前頭葉の運動性言語野（ブローカ野）は言葉を話したり文字に書いたりする働きを担う。損傷で運動性失語が生じ、電文調の話し方、錯語などがみられる。","id":"p3q0265","options":["頭頂葉","側頭葉","後頭葉","前頭葉"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A39","stem":"運動性失語でみられる話し方として本文で挙げられるものは何か。","answer":"電文調の話し方","group":"aphasia_feature","term":"運動性失語（ブローカ失語）","note":"前頭葉の運動性言語野（ブローカ野）は言葉を話したり文字に書いたりする働きを担う。損傷で運動性失語が生じ、電文調の話し方、錯語などがみられる。","id":"p3q0266","options":["電文調の話し方","シナプス小胞","シナプス","ランビエ絞輪"]},{"page":12,"chapter":"脳・神経系","origin":"左ページQuestion Q40","stem":"発話は流暢だが錯語がみられ、言葉の意味理解や復唱に支障がみられる失語を何と呼ぶか。","answer":"感覚性失語（ウェルニッケ失語）","group":"aphasia_type","term":"感覚性失語（ウェルニッケ失語）","note":"側頭葉の感覚性言語野（ウェルニッケ野）は耳で聞いたり目で読んだりした言葉の情報を集約・理解する。損傷で感覚性失語が生じ、聞いたり見たりした言葉を理解できなくなる。","id":"p3q0267","options":["失語","感覚性失語（ウェルニッケ失語）","運動性失語（ブローカ失語）","全失語"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A40","stem":"感覚性失語に関わる言語野は何か。","answer":"ウェルニッケ野","group":"language_area","term":"感覚性失語（ウェルニッケ失語）","note":"側頭葉の感覚性言語野（ウェルニッケ野）は耳で聞いたり目で読んだりした言葉の情報を集約・理解する。損傷で感覚性失語が生じ、聞いたり見たりした言葉を理解できなくなる。","id":"p3q0268","options":["言語野","ウェルニッケ野","感覚性言語野（ウェルニッケ野）","ブローカ野"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A40","stem":"ウェルニッケ野は大脳のどの葉にあるか。","answer":"側頭葉","group":"brain_lobe","term":"感覚性失語（ウェルニッケ失語）","note":"側頭葉の感覚性言語野（ウェルニッケ野）は耳で聞いたり目で読んだりした言葉の情報を集約・理解する。損傷で感覚性失語が生じ、聞いたり見たりした言葉を理解できなくなる。","id":"p3q0269","options":["頭頂葉","前頭葉","側頭葉","後頭葉"]},{"page":12,"chapter":"脳・神経系","origin":"右ページAnswer解説 A40","stem":"感覚性失語では発話の流暢性は一般にどうか。","answer":"流暢である","group":"aphasia_feature","term":"感覚性失語（ウェルニッケ失語）","note":"側頭葉の感覚性言語野（ウェルニッケ野）は耳で聞いたり目で読んだりした言葉の情報を集約・理解する。損傷で感覚性失語が生じ、聞いたり見たりした言葉を理解できなくなる。","id":"p3q0270","options":["流暢である","ランビエ絞輪","電文調の話し方","受容体"]},{"page":13,"chapter":"社会心理学","origin":"左ページQuestion Q1","stem":"容姿や身振り、声など他者に関する限られた情報を手がかりとして、その人の全体的なパーソナリティを推測することを何と呼ぶか。","answer":"印象形成","group":"social_term","term":"印象形成","note":"印象形成は対人認知の1つで、断片的情報に基づき全体的印象を形成する。Aschは形容詞の組み合わせや呈示順序で印象が異なることを示した。","id":"p3q0271","options":["印象形成","受傷時","受傷前後の両方","受傷前"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A1","stem":"印象形成は何認知の1つか。","answer":"対人認知","group":"social_cognition","term":"印象形成","note":"印象形成は対人認知の1つで、断片的情報に基づき全体的印象を形成する。Aschは形容詞の組み合わせや呈示順序で印象が異なることを示した。","id":"p3q0272","options":["自己認知","印象形成","対人認知","認識"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A1","stem":"印象形成の実験を行った人物は誰か。","answer":"Asch,S.E.（アッシュ）","group":"social_person","term":"印象形成","note":"印象形成は対人認知の1つで、断片的情報に基づき全体的印象を形成する。Aschは形容詞の組み合わせや呈示順序で印象が異なることを示した。","id":"p3q0273","options":["Jackson,J.M.（ジャクソン）","Tajfel,H.（タジフェル）とTurner,J.C.（ターナー）","Asch,S.E.（アッシュ）","Bem,D.J.（ベム）"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A1","stem":"Aschの印象形成実験では、形容詞の組み合わせと何によって印象が異なることが示されたか。","answer":"呈示順序","group":"social_factor","term":"印象形成","note":"印象形成は対人認知の1つで、断片的情報に基づき全体的印象を形成する。Aschは形容詞の組み合わせや呈示順序で印象が異なることを示した。","id":"p3q0274","options":["心理的距離","顕著な特徴","集団凝集性","呈示順序"]},{"page":13,"chapter":"社会心理学","origin":"左ページQuestion Q2","stem":"人物に関するさまざまな情報の中で、それが核となって他の情報をまとめ、全体的印象を決定する働きをもつ特性語を何と呼ぶか。","answer":"中心特性","group":"social_term","term":"中心特性","note":"Aschの印象形成研究では、全体的印象を規定する中心的情報を中心特性と呼び、その影響を受けにくい情報を周辺特性と呼ぶ。","id":"p3q0275","options":["スティグマ","印象形成","中心特性","ハロー効果（光背効果）"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A2","stem":"中心特性に対して、全体的印象への影響が比較的小さい情報を何というか。","answer":"周辺特性","group":"social_term","term":"中心特性","note":"Aschの印象形成研究では、全体的印象を規定する中心的情報を中心特性と呼び、その影響を受けにくい情報を周辺特性と呼ぶ。","id":"p3q0276","options":["自己呈示","中心特性","周辺特性","スティグマ"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A2","stem":"中心特性の概念を示した研究者は誰か。","answer":"Asch,S.E.（アッシュ）","group":"social_person","term":"中心特性","note":"Aschの印象形成研究では、全体的印象を規定する中心的情報を中心特性と呼び、その影響を受けにくい情報を周辺特性と呼ぶ。","id":"p3q0277","options":["Festinger,L.（フェスティンガー）","Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Asch,S.E.（アッシュ）","Altman,I.（アルトマン）とTaylor,D.A.（テーラー）"]},{"page":13,"chapter":"社会心理学","origin":"左ページQuestion Q3","stem":"さまざまな情報のうち、最初に与えられた情報が印象形成に強く影響する現象を何と呼ぶか。","answer":"初頭効果","group":"social_effect","term":"初頭効果","note":"Aschの印象形成実験から、呈示順序が印象形成に影響し、特に最初に呈示された情報が大きな影響を与えることが示された。","id":"p3q0278","options":["初頭効果","新近性効果","ハロー効果（光背効果）","単純接触効果"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A3","stem":"初頭効果では、系列のどの位置の情報が強く影響するか。","answer":"最初","group":"serial_position","term":"初頭効果","note":"Aschの印象形成実験から、呈示順序が印象形成に影響し、特に最初に呈示された情報が大きな影響を与えることが示された。","id":"p3q0279","options":["最後","中央","順序は影響しない","最初"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A3","stem":"初頭効果が明らかにされたのは何に関する実験か。","answer":"印象形成","group":"social_term","term":"初頭効果","note":"Aschの印象形成実験から、呈示順序が印象形成に影響し、特に最初に呈示された情報が大きな影響を与えることが示された。","id":"p3q0280","options":["ハロー効果（光背効果）","ステレオタイプ","単純接触効果","印象形成"]},{"page":13,"chapter":"社会心理学","origin":"左ページQuestion Q4","stem":"さまざまな情報のうち、最後に与えられた情報が印象形成に強く影響する現象を何と呼ぶか。","answer":"新近性効果","group":"social_effect","term":"新近性効果","note":"印象形成では初頭効果が知られる一方、その後の研究では最後に与えられた情報が印象形成に大きな影響をもつ新近性効果も示された。","id":"p3q0281","options":["単純接触効果","ハロー効果（光背効果）","新近性効果","初頭効果"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A4","stem":"新近性効果では、系列のどの位置の情報が強く影響するか。","answer":"最後","group":"serial_position","term":"新近性効果","note":"印象形成では初頭効果が知られる一方、その後の研究では最後に与えられた情報が印象形成に大きな影響をもつ新近性効果も示された。","id":"p3q0282","options":["最初","最後","中央","順序は影響しない"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A4","stem":"新近性効果と対照的に、最初の情報が強く影響する現象は何か。","answer":"初頭効果","group":"social_effect","term":"新近性効果","note":"印象形成では初頭効果が知られる一方、その後の研究では最後に与えられた情報が印象形成に大きな影響をもつ新近性効果も示された。","id":"p3q0283","options":["初頭効果","ハロー効果（光背効果）","単純接触効果","新近性効果"]},{"page":13,"chapter":"社会心理学","origin":"左ページQuestion Q5","stem":"他者がある側面で望ましい、または望ましくない特徴をもつと、その評価がその人の全体的評価にまで広がる傾向を何と呼ぶか。","answer":"ハロー効果（光背効果）","group":"social_effect","term":"ハロー効果（光背効果）","note":"ハロー効果では、顕著な1特徴の評価が他の特徴の評価まで左右する。実際以上に望ましい特徴を高く、望ましくない特徴を低く評価する対人認知の歪みである。","id":"p3q0284","options":["ハロー効果（光背効果）","単純接触効果","新近性効果","初頭効果"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A5","stem":"ハロー効果は対人認知の何の1つとされるか。","answer":"歪み","group":"social_cognition","term":"ハロー効果（光背効果）","note":"ハロー効果では、顕著な1特徴の評価が他の特徴の評価まで左右する。実際以上に望ましい特徴を高く、望ましくない特徴を低く評価する対人認知の歪みである。","id":"p3q0285","options":["認識","対人認知","歪み","自己認知"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A5","stem":"ハロー効果で全体評価に影響を及ぼすのはどのような特徴か。","answer":"顕著な特徴","group":"social_factor","term":"ハロー効果（光背効果）","note":"ハロー効果では、顕著な1特徴の評価が他の特徴の評価まで左右する。実際以上に望ましい特徴を高く、望ましくない特徴を低く評価する対人認知の歪みである。","id":"p3q0286","options":["情報源の信憑性","顕著な特徴","心理的距離","呈示順序"]},{"page":13,"chapter":"社会心理学","origin":"右ページAnswer解説 A5","stem":"外見が魅力的な人の他の特徴まで高く評価するのは何効果の例か。","answer":"ハロー効果（光背効果）","group":"social_effect","term":"ハロー効果（光背効果）","note":"ハロー効果では、顕著な1特徴の評価が他の特徴の評価まで左右する。実際以上に望ましい特徴を高く、望ましくない特徴を低く評価する対人認知の歪みである。","id":"p3q0287","options":["ハロー効果（光背効果）","初頭効果","新近性効果","単純接触効果"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q6","stem":"特定の集団やその成員についての過度に一般化されたイメージを何と呼ぶか。","answer":"ステレオタイプ","group":"social_term","term":"ステレオタイプ","note":"ステレオタイプは合理的理由なく特定集団や成員に対して単純化・固定化された否定的または肯定的イメージをもつこと。否定的意味が含まれると偏見、偏見に基づく否定的行動は差別という。","id":"p3q0288","options":["スティグマ","偏見","ステレオタイプ","ハロー効果（光背効果）"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A6","stem":"ステレオタイプに否定的な意味合いが含まれる場合、それを何というか。","answer":"偏見","group":"social_term","term":"ステレオタイプ","note":"ステレオタイプは合理的理由なく特定集団や成員に対して単純化・固定化された否定的または肯定的イメージをもつこと。否定的意味が含まれると偏見、偏見に基づく否定的行動は差別という。","id":"p3q0289","options":["差別","自己開示","偏見","中心特性"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A6","stem":"偏見に基づいて集団成員に否定的な行動をとることを何というか。","answer":"差別","group":"social_term","term":"ステレオタイプ","note":"ステレオタイプは合理的理由なく特定集団や成員に対して単純化・固定化された否定的または肯定的イメージをもつこと。否定的意味が含まれると偏見、偏見に基づく否定的行動は差別という。","id":"p3q0290","options":["自己開示","差別","偏見","周辺特性"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A6","stem":"ステレオタイプは集団イメージを単純化し、どのようにする傾向を含むか。","answer":"固定化する","group":"social_process","term":"ステレオタイプ","note":"ステレオタイプは合理的理由なく特定集団や成員に対して単純化・固定化された否定的または肯定的イメージをもつこと。否定的意味が含まれると偏見、偏見に基づく否定的行動は差別という。","id":"p3q0291","options":["流動化する","単純化する","一般化する","固定化する"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q7","stem":"個人に対して社会的に与えられた否定的な属性やイメージを何と呼ぶか。","answer":"スティグマ","group":"social_term","term":"スティグマ","note":"スティグマという名称は、奴隷や犯罪者などに格印を押して識別できるようにした歴史的事実に由来する。スティグマをもつ人は低く位置づけられ、偏見や差別の対象となる。","id":"p3q0292","options":["中心特性","スティグマ","初頭効果","透明性錯誤"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A7","stem":"スティグマという名称の由来は、奴隷や犯罪者などに何を押したことか。","answer":"格印","group":"historical_origin","term":"スティグマ","note":"スティグマという名称は、奴隷や犯罪者などに格印を押して識別できるようにした歴史的事実に由来する。スティグマをもつ人は低く位置づけられ、偏見や差別の対象となる。","id":"p3q0293","options":["格印","刻印","標識","入れ墨"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A7","stem":"スティグマをもつ人が受けやすい社会的反応は何か。","answer":"偏見や差別","group":"social_consequence","term":"スティグマ","note":"スティグマという名称は、奴隷や犯罪者などに格印を押して識別できるようにした歴史的事実に由来する。スティグマをもつ人は低く位置づけられ、偏見や差別の対象となる。","id":"p3q0294","options":["偏見や差別","対人認知の歪み","孤立","脅威"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A7","stem":"本文でスティグマが存在しうる例として、人種・職業と並んで挙げられるものは何か。","answer":"性的指向","group":"social_category","term":"スティグマ","note":"スティグマという名称は、奴隷や犯罪者などに格印を押して識別できるようにした歴史的事実に由来する。スティグマをもつ人は低く位置づけられ、偏見や差別の対象となる。","id":"p3q0295","options":["性的指向","人種","職業","集団規範"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q8","stem":"一般の人々が漠然と抱いている、パーソナリティ特性と性別・容姿・職業などとの関連性についての認知体系を何と呼ぶか。","answer":"暗黙のパーソナリティ理論","group":"social_theory","term":"暗黙のパーソナリティ理論","note":"暗黙のパーソナリティ理論は過去の経験や価値観に基づき、ある特性は別の特性や属性と関連すると考える素朴な理論で、対人認知の歪みを招く危険性がある。","id":"p3q0296","options":["暗黙のパーソナリティ理論","社会的浸透理論","対応推論理論","接種理論"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A8","stem":"暗黙のパーソナリティ理論は何に基づいて形成されるとされるか。","answer":"過去の経験や価値観","group":"social_factor","term":"暗黙のパーソナリティ理論","note":"暗黙のパーソナリティ理論は過去の経験や価値観に基づき、ある特性は別の特性や属性と関連すると考える素朴な理論で、対人認知の歪みを招く危険性がある。","id":"p3q0297","options":["呈示順序","心理的距離","過去の経験や価値観","顕著な特徴"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A8","stem":"暗黙のパーソナリティ理論が招く危険性として本文で挙げられるものは何か。","answer":"対人認知の歪み","group":"social_consequence","term":"暗黙のパーソナリティ理論","note":"暗黙のパーソナリティ理論は過去の経験や価値観に基づき、ある特性は別の特性や属性と関連すると考える素朴な理論で、対人認知の歪みを招く危険性がある。","id":"p3q0298","options":["差別や偏見","対人認知の歪み","偏見や差別","脅威"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q9","stem":"自分の考えや感情を相手が実際以上に理解していると思い込みすぎる傾向を何と呼ぶか。","answer":"透明性錯誤","group":"social_bias","term":"透明性錯誤","note":"透明性錯誤は自己に対する認識の歪みの1つで、実際以上に相手に理解されている、見透かされていると思い込む。","id":"p3q0299","options":["基本的帰属の誤り（対応バイアス）","利己的帰属","内集団びいき","透明性錯誤"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A9","stem":"透明性錯誤は自己に対する何の歪みとされるか。","answer":"認識","group":"social_cognition","term":"透明性錯誤","note":"透明性錯誤は自己に対する認識の歪みの1つで、実際以上に相手に理解されている、見透かされていると思い込む。","id":"p3q0300","options":["対人認知","印象形成","自己認知","認識"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A9","stem":"透明性錯誤では、相手に自分が理解されている程度を実際よりどのように見積もりやすいか。","answer":"高く見積もる","group":"evaluation_direction","term":"透明性錯誤","note":"透明性錯誤は自己に対する認識の歪みの1つで、実際以上に相手に理解されている、見透かされていると思い込む。","id":"p3q0301","options":["均質","肯定的","高く見積もる","適切"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q10","stem":"Zajonc,R.B.（ザイアンス）が提唱した、繰り返し経験する人や事物に対して好意が高まる現象を何と呼ぶか。","answer":"単純接触効果","group":"social_effect","term":"単純接触効果","note":"単純接触効果では、単純な刺激でも繰り返し接するだけで好感度が高まり、対人魅力の規定要因である近接性はこの効果から説明できる。","id":"p3q0302","options":["ハロー効果（光背効果）","新近性効果","初頭効果","単純接触効果"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A10","stem":"単純接触効果を提唱した人物は誰か。","answer":"Zajonc,R.B.（ザイアンス）","group":"social_person","term":"単純接触効果","note":"単純接触効果では、単純な刺激でも繰り返し接するだけで好感度が高まり、対人魅力の規定要因である近接性はこの効果から説明できる。","id":"p3q0303","options":["Jones,E.E.（ジョーンズ）とDavis,K.E.（デイビス）","Asch,S.E.（アッシュ）","Tajfel,H.（タジフェル）とTurner,J.C.（ターナー）","Zajonc,R.B.（ザイアンス）"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A10","stem":"単純接触効果では、刺激への接触を繰り返すと何が高まるか。","answer":"好感度","group":"social_outcome","term":"単純接触効果","note":"単純接触効果では、単純な刺激でも繰り返し接するだけで好感度が高まり、対人魅力の規定要因である近接性はこの効果から説明できる。","id":"p3q0304","options":["信頼度","好感度","親密度","類似度"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A10","stem":"単純接触効果から説明できる対人魅力の規定要因は何か。","answer":"近接性","group":"attraction_factor","term":"単純接触効果","note":"単純接触効果では、単純な刺激でも繰り返し接するだけで好感度が高まり、対人魅力の規定要因である近接性はこの効果から説明できる。","id":"p3q0305","options":["返報性","相補性","近接性","類似性"]},{"page":14,"chapter":"社会心理学","origin":"左ページQuestion Q11","stem":"他者から受けた好意や援助に対して、それと同種・同程度のものを返すべきだと感じることを何と呼ぶか。","answer":"返報性の規範","group":"social_norm","term":"返報性の規範","note":"返報性の規範は互恵性規範ともいい、相手の自己開示に同程度の自己開示がなされる自己開示の返報性もこの規範に従う行動である。","id":"p3q0306","options":["返報性の規範","ブーメラン効果","スリーパー効果","向社会的行動"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A11","stem":"返報性の規範の別名は何か。","answer":"互恵性規範","group":"social_norm","term":"返報性の規範","note":"返報性の規範は互恵性規範ともいい、相手の自己開示に同程度の自己開示がなされる自己開示の返報性もこの規範に従う行動である。","id":"p3q0307","options":["集団規範","返報性の規範","譲歩の返報性","互恵性規範"]},{"page":14,"chapter":"社会心理学","origin":"右ページAnswer解説 A11","stem":"相手の自己開示に対し同程度の自己開示を返す現象を何というか。","answer":"自己開示の返報性","group":"self_disclosure_term","term":"返報性の規範","note":"返報性の規範は互恵性規範ともいい、相手の自己開示に同程度の自己開示がなされる自己開示の返報性もこの規範に従う行動である。","id":"p3q0308","options":["カタルシス効果","自己呈示","自己明確化","自己開示の返報性"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q12","stem":"他者や集団を助けたり利益をもたらしたりするために行われる自発的な行動を何と呼ぶか。","answer":"向社会的行動","group":"social_behavior","term":"向社会的行動","note":"向社会的行動の具体例には援助・救助・寄付などがあり、自身の利益のためではなく他者の利益のために行われるものを愛他的行動という。","id":"p3q0309","options":["返報性の規範","向社会的行動","傍観者効果","心理的リアクタンス理論"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A12","stem":"向社会的行動の例として、援助・救助と並んで挙げられるものは何か。","answer":"寄付","group":"prosocial_example","term":"向社会的行動","note":"向社会的行動の具体例には援助・救助・寄付などがあり、自身の利益のためではなく他者の利益のために行われるものを愛他的行動という。","id":"p3q0310","options":["寄付","救助","援助","愛他的行動"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A12","stem":"自身の利益ではなく他者の利益のために行われる向社会的行動を何というか。","answer":"愛他的行動","group":"social_behavior","term":"向社会的行動","note":"向社会的行動の具体例には援助・救助・寄付などがあり、自身の利益のためではなく他者の利益のために行われるものを愛他的行動という。","id":"p3q0311","options":["社会的に望ましくない行為","向社会的行動","愛他的行動","援助行動"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q13","stem":"援助が必要な状況でも、自分以外の他者が存在することで援助行動が抑制される現象を何と呼ぶか。","answer":"傍観者効果","group":"social_effect","term":"傍観者効果","note":"傍観者効果はキティ・ジェノヴィーズ事件を契機にLatané,B.とDarley,J.が研究し、責任の分散、評価懸念、多元的無知などで生じると考えた。","id":"p3q0312","options":["社会的促進","傍観者効果","社会的手抜き","集団極性化"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A13","stem":"傍観者効果研究の契機となった事件は何か。","answer":"キティ・ジェノヴィーズ事件","group":"social_event","term":"傍観者効果","note":"傍観者効果はキティ・ジェノヴィーズ事件を契機にLatané,B.とDarley,J.が研究し、責任の分散、評価懸念、多元的無知などで生じると考えた。","id":"p3q0313","options":["表情写真実験","キティ・ジェノヴィーズ事件","オイルショック時の品不足","共有地の悲劇"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A13","stem":"傍観者効果を研究した人物の組み合わせは誰か。","answer":"Latané,B.（ラタネ）とDarley,J.（ダーリー）","group":"social_person","term":"傍観者効果","note":"傍観者効果はキティ・ジェノヴィーズ事件を契機にLatané,B.とDarley,J.が研究し、責任の分散、評価懸念、多元的無知などで生じると考えた。","id":"p3q0314","options":["Zajonc,R.B.（ザイアンス）","Bem,D.J.（ベム）","Latané,B.（ラタネ）とDarley,J.（ダーリー）","Rotter,J.B.（ロッター）"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A13","stem":"傍観者効果の要因として、責任の分散・評価懸念と並んで挙げられるものは何か。","answer":"多元的無知","group":"social_bias","term":"傍観者効果","note":"傍観者効果はキティ・ジェノヴィーズ事件を契機にLatané,B.とDarley,J.が研究し、責任の分散、評価懸念、多元的無知などで生じると考えた。","id":"p3q0315","options":["行為者―観察者バイアス","外集団均質化バイアス","多元的無知","セルフ・ハンディキャッピング"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q14","stem":"援助を行わない他者の行動を参考にし、「援助が必要な状況ではない」と誤って推測して援助を抑制することを何と呼ぶか。","answer":"多元的無知","group":"social_bias","term":"多元的無知","note":"多元的無知は傍観者効果が生じる要因の1つで、他者が緊急性がないと捉えていると推測し、自身も状況を楽観的に捉えて他者と同様に行動してしまう。","id":"p3q0316","options":["多元的無知","利己的帰属","基本的帰属の誤り（対応バイアス）","内集団バイアス"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A14","stem":"多元的無知はどの効果が生じる要因の1つか。","answer":"傍観者効果","group":"social_effect","term":"多元的無知","note":"多元的無知は傍観者効果が生じる要因の1つで、他者が緊急性がないと捉えていると推測し、自身も状況を楽観的に捉えて他者と同様に行動してしまう。","id":"p3q0317","options":["社会的促進","集団極性化","傍観者効果","社会的手抜き"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A14","stem":"多元的無知では、他者の行動から状況を緊急性があるとないのどちらに捉えやすいか。","answer":"緊急性がない","group":"social_inference","term":"多元的無知","note":"多元的無知は傍観者効果が生じる要因の1つで、他者が緊急性がないと捉えていると推測し、自身も状況を楽観的に捉えて他者と同様に行動してしまう。","id":"p3q0318","options":["緊急性が高い","援助が必須である","自分だけが責任を負う","緊急性がない"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q15","stem":"説得者の信憑性が低くても、時間が経過するにつれて説得効果が高くなる現象を何と呼ぶか。","answer":"スリーパー効果","group":"social_effect","term":"スリーパー効果","note":"スリーパー効果では、情報源の信憑性が低いことは時間とともに忘れられる一方、説得内容は記憶に残るため効果が高まる。信憑性が高い場合は時間とともに説得効果が低下する。","id":"p3q0319","options":["固定化する","一般化する","スリーパー効果","単純化する"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A15","stem":"スリーパー効果が生じやすい情報源の信憑性はどの程度か。","answer":"低い場合","group":"credibility_level","term":"スリーパー効果","note":"スリーパー効果では、情報源の信憑性が低いことは時間とともに忘れられる一方、説得内容は記憶に残るため効果が高まる。信憑性が高い場合は時間とともに説得効果が低下する。","id":"p3q0320","options":["中程度の場合","信憑性に左右されない場合","高い場合","低い場合"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A15","stem":"スリーパー効果では時間経過とともに何が忘れられると説明されるか。","answer":"情報源の信憑性","group":"social_factor","term":"スリーパー効果","note":"スリーパー効果では、情報源の信憑性が低いことは時間とともに忘れられる一方、説得内容は記憶に残るため効果が高まる。信憑性が高い場合は時間とともに説得効果が低下する。","id":"p3q0321","options":["情報源の信憑性","顕著な特徴","呈示順序","集団凝集性"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A15","stem":"信憑性の高い説得者の場合、時間経過とともに説得効果はどうなるとされるか。","answer":"低下する","group":"effect_direction","term":"スリーパー効果","note":"スリーパー効果では、情報源の信憑性が低いことは時間とともに忘れられる一方、説得内容は記憶に残るため効果が高まる。信憑性が高い場合は時間とともに説得効果が低下する。","id":"p3q0322","options":["取り入れにくくなる","低下する","逆方向","抑制される"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q16","stem":"説得によって被説得者の態度が説得内容とは逆方向に変わってしまう現象を何と呼ぶか。","answer":"ブーメラン効果","group":"social_effect","term":"ブーメラン効果","note":"ブーメラン効果は、被説得者が説得によって心理的抵抗感や反発を抱き、もともとの立場や態度をより強めることで生じる。","id":"p3q0323","options":["ブーメラン効果","傍観者効果","ピグマリオン効果","スリーパー効果"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A16","stem":"ブーメラン効果では、説得後の態度は説得内容に対してどの方向へ変化するか。","answer":"逆方向","group":"effect_direction","term":"ブーメラン効果","note":"ブーメラン効果は、被説得者が説得によって心理的抵抗感や反発を抱き、もともとの立場や態度をより強めることで生じる。","id":"p3q0324","options":["逆方向","取り入れにくくなる","抑制される","強くなる"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A16","stem":"ブーメラン効果の背景にある心理状態として挙げられるものは何か。","answer":"心理的抵抗感や反発","group":"social_state","term":"ブーメラン効果","note":"ブーメラン効果は、被説得者が説得によって心理的抵抗感や反発を抱き、もともとの立場や態度をより強めることで生じる。","id":"p3q0325","options":["孤立","心理的抵抗感や反発","評価懸念","責任感"]},{"page":15,"chapter":"社会心理学","origin":"左ページQuestion Q17","stem":"自分の態度や行動の自由が脅かされた時に、その自由を回復しようとする動機づけ状態を説明する理論を何と呼ぶか。","answer":"心理的リアクタンス理論","group":"social_theory","term":"心理的リアクタンス理論","note":"心理的リアクタンスはブーメラン効果を説明する理論の1つで、その程度は制限される自由の重要度と割合、自由への脅威の程度に規定される。","id":"p3q0326","options":["心理的リアクタンス理論","社会的インパクト理論","バランス理論（P-O-Xモデル、認知的均衡理論）","暗黙のパーソナリティ理論"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A17","stem":"心理的リアクタンス理論が説明する効果の1つは何か。","answer":"ブーメラン効果","group":"social_effect","term":"心理的リアクタンス理論","note":"心理的リアクタンスはブーメラン効果を説明する理論の1つで、その程度は制限される自由の重要度と割合、自由への脅威の程度に規定される。","id":"p3q0327","options":["ブーメラン効果","ピグマリオン効果","傍観者効果","スリーパー効果"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A17","stem":"心理的リアクタンスの程度を規定する自由側の要因として、重要度と何が挙げられるか。","answer":"割合","group":"reactance_factor","term":"心理的リアクタンス理論","note":"心理的リアクタンスはブーメラン効果を説明する理論の1つで、その程度は制限される自由の重要度と割合、自由への脅威の程度に規定される。","id":"p3q0328","options":["自由への脅威の程度","自由の重要度","制限される自由の割合","割合"]},{"page":15,"chapter":"社会心理学","origin":"右ページAnswer解説 A17","stem":"心理的リアクタンスの程度を規定するもう1つの要因は何への脅威の程度か。","answer":"自由","group":"reactance_factor","term":"心理的リアクタンス理論","note":"心理的リアクタンスはブーメラン効果を説明する理論の1つで、その程度は制限される自由の重要度と割合、自由への脅威の程度に規定される。","id":"p3q0329","options":["情報源の信憑性","自由の重要度","自由","制限される自由の割合"]},{"page":16,"chapter":"社会心理学","origin":"左ページQuestion Q18","stem":"最初に受け入れてもらいやすい小さな要請をし、承諾後に本来の大きな要請をして承諾してもらう方法を何と呼ぶか。","answer":"段階的要請法（フット・イン・ザ・ドア・テクニック）","group":"persuasion_technique","term":"段階的要請法（フット・イン・ザ・ドア・テクニック）","note":"段階的要請法は説得的コミュニケーション技法で、小さな要請への承諾によって「自分は協力的で人助けをする人」という自己認知が形成され、次の要請にも応じやすくなると考える。","id":"p3q0330","options":["承諾先取り法（ロー・ボール・テクニック）","返報的要請法","譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","段階的要請法（フット・イン・ザ・ドア・テクニック）"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A18","stem":"段階的要請法で最初に提示する要請の大きさはどの程度か。","answer":"小さな要請","group":"request_size","term":"段階的要請法（フット・イン・ザ・ドア・テクニック）","note":"段階的要請法は説得的コミュニケーション技法で、小さな要請への承諾によって「自分は協力的で人助けをする人」という自己認知が形成され、次の要請にも応じやすくなると考える。","id":"p3q0331","options":["要請なし","大きな要請","小さな要請","同程度の要請"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A18","stem":"段階的要請法で次の要請にも応じやすくなる理由として形成されるものは何か。","answer":"協力的な人間だという自己認知","group":"social_cognition","term":"段階的要請法（フット・イン・ザ・ドア・テクニック）","note":"段階的要請法は説得的コミュニケーション技法で、小さな要請への承諾によって「自分は協力的で人助けをする人」という自己認知が形成され、次の要請にも応じやすくなると考える。","id":"p3q0332","options":["自己認知","対人認知","他者認知","協力的な人間だという自己認知"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A18","stem":"段階的要請法は何の技法の1つか。","answer":"説得的コミュニケーション","group":"communication_type","term":"段階的要請法（フット・イン・ザ・ドア・テクニック）","note":"段階的要請法は説得的コミュニケーション技法で、小さな要請への承諾によって「自分は協力的で人助けをする人」という自己認知が形成され、次の要請にも応じやすくなると考える。","id":"p3q0333","options":["自己開示","説得的コミュニケーション","非言語的","言語的"]},{"page":16,"chapter":"社会心理学","origin":"左ページQuestion Q19","stem":"最初に相手が受け入れにくい大きな要請をし、拒否後に本来の小さな要請をして承諾を得る方法を何と呼ぶか。","answer":"譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","group":"persuasion_technique","term":"譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","note":"譲歩的誘導法は説得的コミュニケーション技法で、相手が譲歩してきたのだからこちらも譲歩すべきだという譲歩の返報性に基づく。","id":"p3q0334","options":["譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","返報的要請法","承諾先取り法（ロー・ボール・テクニック）","段階的要請法（フット・イン・ザ・ドア・テクニック）"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A19","stem":"譲歩的誘導法で最初に提示する要請の大きさはどの程度か。","answer":"大きな要請","group":"request_size","term":"譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","note":"譲歩的誘導法は説得的コミュニケーション技法で、相手が譲歩してきたのだからこちらも譲歩すべきだという譲歩の返報性に基づく。","id":"p3q0335","options":["小さな要請","大きな要請","要請なし","同程度の要請"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A19","stem":"譲歩的誘導法の背景にある規範は何か。","answer":"譲歩の返報性","group":"social_norm","term":"譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","note":"譲歩的誘導法は説得的コミュニケーション技法で、相手が譲歩してきたのだからこちらも譲歩すべきだという譲歩の返報性に基づく。","id":"p3q0336","options":["集団規範","譲歩の返報性","互恵性規範","返報性の規範"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A19","stem":"譲歩的誘導法では、最初の要請が拒否された後、本来の要請の大きさをどのように変えるか。","answer":"小さくする","group":"request_change","term":"譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","note":"譲歩的誘導法は説得的コミュニケーション技法で、相手が譲歩してきたのだからこちらも譲歩すべきだという譲歩の返報性に基づく。","id":"p3q0337","options":["小さくする","取り外す","大きくする","悪い条件を付け加える"]},{"page":16,"chapter":"社会心理学","origin":"左ページQuestion Q20","stem":"相手が承諾しやすい好条件を含んだ要請を行い、承諾後にその好条件を取り外しても承諾を続けてもらう方法を何と呼ぶか。","answer":"承諾先取り法（ロー・ボール・テクニック）","group":"persuasion_technique","term":"承諾先取り法（ロー・ボール・テクニック）","note":"承諾先取り法は説得的コミュニケーション技法で、好条件を取り外すだけでなく悪条件を付け加える場合もある。一度承諾すると責任感が生じるためと考えられる。","id":"p3q0338","options":["承諾先取り法（ロー・ボール・テクニック）","譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","段階的要請法（フット・イン・ザ・ドア・テクニック）","返報的要請法"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A20","stem":"承諾先取り法では、承諾後に最初の好条件をどうするか。","answer":"取り外す","group":"request_change","term":"承諾先取り法（ロー・ボール・テクニック）","note":"承諾先取り法は説得的コミュニケーション技法で、好条件を取り外すだけでなく悪条件を付け加える場合もある。一度承諾すると責任感が生じるためと考えられる。","id":"p3q0339","options":["取り外す","小さくする","大きくする","悪い条件を付け加える"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A20","stem":"承諾先取り法では好条件の除去以外に、何を付け加える場合があるか。","answer":"悪い条件","group":"request_change","term":"承諾先取り法（ロー・ボール・テクニック）","note":"承諾先取り法は説得的コミュニケーション技法で、好条件を取り外すだけでなく悪条件を付け加える場合もある。一度承諾すると責任感が生じるためと考えられる。","id":"p3q0340","options":["小さくする","悪い条件を付け加える","悪い条件","取り外す"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A20","stem":"承諾先取り法で承諾が継続しやすい理由として生じるものは何か。","answer":"責任感","group":"social_state","term":"承諾先取り法（ロー・ボール・テクニック）","note":"承諾先取り法は説得的コミュニケーション技法で、好条件を取り外すだけでなく悪条件を付け加える場合もある。一度承諾すると責任感が生じるためと考えられる。","id":"p3q0341","options":["評価懸念","責任感","孤立","心理的抵抗感や反発"]},{"page":16,"chapter":"社会心理学","origin":"左ページQuestion Q21","stem":"Petty,R.E.とCacioppo,J.T.が提唱した、説得メッセージの処理の深さによって態度変容へのプロセスが異なると考えるモデルを何と呼ぶか。","answer":"精緻化見込みモデル","group":"social_model","term":"精緻化見込みモデル","note":"精緻化見込みモデルでは、受け手の動機づけと情報処理能力によって精緻化の程度が決まり、精緻化が行われる中心ルートと、あまり行われない周辺ルートに分ける。","id":"p3q0342","options":["譲歩的誘導法（ドア・イン・ザ・フェイス・テクニック）","精緻化見込みモデル","段階的要請法（フット・イン・ザ・ドア・テクニック）","接種理論"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A21","stem":"精緻化見込みモデルを提唱した人物は誰か。","answer":"Petty,R.E.（ペティ）とCacioppo,J.T.（カシオッポ）","group":"social_person","term":"精緻化見込みモデル","note":"精緻化見込みモデルでは、受け手の動機づけと情報処理能力によって精緻化の程度が決まり、精緻化が行われる中心ルートと、あまり行われない周辺ルートに分ける。","id":"p3q0343","options":["Altman,I.（アルトマン）とTaylor,D.A.（テーラー）","Bem,D.J.（ベム）","Petty,R.E.（ペティ）とCacioppo,J.T.（カシオッポ）","Fiedler,F.（フィードラー）"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A21","stem":"精緻化見込みモデルで、情報を十分に吟味する経路を何というか。","answer":"中心ルート","group":"elm_route","term":"精緻化見込みモデル","note":"精緻化見込みモデルでは、受け手の動機づけと情報処理能力によって精緻化の程度が決まり、精緻化が行われる中心ルートと、あまり行われない周辺ルートに分ける。","id":"p3q0344","options":["中心ルート","最初","周辺ルート","初頭効果"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A21","stem":"精緻化見込みモデルで、精緻化があまり行われない経路を何というか。","answer":"周辺ルート","group":"elm_route","term":"精緻化見込みモデル","note":"精緻化見込みモデルでは、受け手の動機づけと情報処理能力によって精緻化の程度が決まり、精緻化が行われる中心ルートと、あまり行われない周辺ルートに分ける。","id":"p3q0345","options":["対人認知","周辺特性","中心ルート","周辺ルート"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A21","stem":"精緻化の程度を規定する2要因は動機づけと何か。","answer":"情報処理能力","group":"elm_factor","term":"精緻化見込みモデル","note":"精緻化見込みモデルでは、受け手の動機づけと情報処理能力によって精緻化の程度が決まり、精緻化が行われる中心ルートと、あまり行われない周辺ルートに分ける。","id":"p3q0346","options":["メッセージの長さ","情報源の信憑性","周囲の人数","情報処理能力"]},{"page":16,"chapter":"社会心理学","origin":"左ページQuestion Q22","stem":"自分の考えや意見についてあらかじめ弱い反論を経験させておくと、後の説得に抵抗しやすくなるという考えを何と呼ぶか。","answer":"接種理論","group":"social_theory","term":"接種理論","note":"接種理論は予防接種によって免疫をつけることになぞらえ、弱い反論に触れることで動機づけを高め、反論する練習機会をもたせると考える。","id":"p3q0347","options":["社会的インパクト理論","バランス理論（P-O-Xモデル、認知的均衡理論）","対応推論理論","接種理論"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A22","stem":"接種理論は何になぞらえて説明されるか。","answer":"予防接種","group":"analogy","term":"接種理論","note":"接種理論は予防接種によって免疫をつけることになぞらえ、弱い反論に触れることで動機づけを高め、反論する練習機会をもたせると考える。","id":"p3q0348","options":["抗体形成","免疫獲得","自然免疫","予防接種"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A22","stem":"接種理論で説得抵抗を高めるため事前に経験させるものは何か。","answer":"弱い反論","group":"persuasion_factor","term":"接種理論","note":"接種理論は予防接種によって免疫をつけることになぞらえ、弱い反論に触れることで動機づけを高め、反論する練習機会をもたせると考える。","id":"p3q0349","options":["弱い反論","強い反論","中立的情報","反論を含まない情報"]},{"page":16,"chapter":"社会心理学","origin":"右ページAnswer解説 A22","stem":"接種理論では弱い反論に触れることで、反論する何が得られるとされるか。","answer":"練習の機会","group":"social_outcome","term":"接種理論","note":"接種理論は予防接種によって免疫をつけることになぞらえ、弱い反論に触れることで動機づけを高め、反論する練習機会をもたせると考える。","id":"p3q0350","options":["練習の機会","態度の固定","情報の忘却","反論の抑制"]},{"page":17,"chapter":"社会心理学","origin":"左ページQuestion Q23","stem":"Heider,F.（ハイダー）が提唱した、出来事や行動の原因を人の内部にあるものに帰属させることを何と呼ぶか。","answer":"内的帰属","group":"attribution_type","term":"内的帰属","note":"内的帰属は、例えば試験の成績が良かった時に自分の努力の結果だと捉えること。Heiderは普通の人が外的環境をどう理解するかを明らかにする素朴心理学を提唱した。","id":"p3q0351","options":["外的帰属","自己高揚的帰属","内的帰属","自己防衛的帰属"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A23","stem":"試験の好成績を自分の努力の結果と考えるのは何帰属か。","answer":"内的帰属","group":"attribution_type","term":"内的帰属","note":"内的帰属は、例えば試験の成績が良かった時に自分の努力の結果だと捉えること。Heiderは普通の人が外的環境をどう理解するかを明らかにする素朴心理学を提唱した。","id":"p3q0352","options":["外的帰属","自己防衛的帰属","自己高揚的帰属","内的帰属"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A23","stem":"内的帰属・外的帰属を提唱した人物は誰か。","answer":"Heider,F.（ハイダー）","group":"social_person","term":"内的帰属","note":"内的帰属は、例えば試験の成績が良かった時に自分の努力の結果だと捉えること。Heiderは普通の人が外的環境をどう理解するかを明らかにする素朴心理学を提唱した。","id":"p3q0353","options":["Festinger,L.（フェスティンガー）","Hardin,G.（ハーディン）","Heider,F.（ハイダー）","三隅二不二"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A23","stem":"Heiderが普通の人の外的環境理解を明らかにするため提唱した心理学を何というか。","answer":"素朴心理学","group":"social_theory","term":"内的帰属","note":"内的帰属は、例えば試験の成績が良かった時に自分の努力の結果だと捉えること。Heiderは普通の人が外的環境をどう理解するかを明らかにする素朴心理学を提唱した。","id":"p3q0354","options":["素朴心理学","ヒューリスティック処理","周辺ルート","システマティック処理"]},{"page":17,"chapter":"社会心理学","origin":"左ページQuestion Q24","stem":"出来事や行動の原因を外部環境にあるものに帰属させることを何と呼ぶか。","answer":"外的帰属","group":"attribution_type","term":"外的帰属","note":"外的帰属の例として、試験の成績が良かった時に試験問題が容易だった、運が良かったと捉えることが挙げられる。","id":"p3q0355","options":["外的帰属","自己防衛的帰属","内的帰属","自己高揚的帰属"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A24","stem":"試験の好成績を問題の容易さのためと考えるのは何帰属か。","answer":"外的帰属","group":"attribution_type","term":"外的帰属","note":"外的帰属の例として、試験の成績が良かった時に試験問題が容易だった、運が良かったと捉えることが挙げられる。","id":"p3q0356","options":["内的帰属","自己防衛的帰属","自己高揚的帰属","外的帰属"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A24","stem":"外的帰属では、原因を主としてどこに求めるか。","answer":"外部環境","group":"attribution_source","term":"外的帰属","note":"外的帰属の例として、試験の成績が良かった時に試験問題が容易だった、運が良かったと捉えることが挙げられる。","id":"p3q0357","options":["外部環境","外的要因","内的要因","行為者の内的属性"]},{"page":17,"chapter":"社会心理学","origin":"左ページQuestion Q25","stem":"他者の行動原因を推論する際、外的な状況要因よりもその人のパーソナリティや能力など内的要因を重視しやすい傾向を何と呼ぶか。","answer":"基本的帰属の誤り（対応バイアス）","group":"social_bias","term":"基本的帰属の誤り（対応バイアス）","note":"基本的帰属の誤りでは、他者の行動について本来の性格や動機づけ、能力などの内的要因が重視されすぎ、外的状況で生じた行動でも内的要因が推測されやすい。","id":"p3q0358","options":["フォルス・コンセンサス","基本的帰属の誤り（対応バイアス）","外集団均質化バイアス","外集団均質化効果"]},{"page":17,"chapter":"社会心理学","origin":"右ページAnswer解説 A25","stem":"基本的帰属の誤りの別名は何か。","answer":"対応バイアス","group":"social_bias","term":"基本的帰属の誤り（対応バイアス）","note":"基本的帰属の誤りでは、他者の行動について本来の性格や動機づけ、能力などの内的要因が重視されすぎ、外的状況で生じた行動でも内的要因が推測されやすい。","id":"p3q0359","options":["フォルス・コンセンサス","外集団均質化バイアス","基本的帰属の誤り（対応バイアス）","対応バイアス"]},{"pag
