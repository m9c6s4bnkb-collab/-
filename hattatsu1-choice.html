3", "tag": "障害・教育", "q": "資料冒頭の一覧で、インクルージョンの次に70番として挙げられている概念はどれか。", "options": ["合理的配慮", "自己効力感", "代理強化", "生理的早産"], "answer": 0, "explanation": "本文の詳細説明はPDF内にないため、一覧にある用語のみを出題。"}, {"id": "c294", "tag": "学習理論", "q": "資料の57番の見出しとして記載されているものはどれか。", "options": ["自己効力感", "学習における強化子の役割", "感覚遮断", "発達の最近接領域"], "answer": 1, "explanation": "PDFでは見出しのみで詳細本文はない。"}];
const data=QUESTIONS,KEY='hattatsu1_choice_v1';
let hist=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='all',randomized=false;
function st(id){return hist[id]||{attempts:0,wrong:0,correct:0}}
function save(){localStorage.setItem(KEY,JSON.stringify(hist))}
function okf(x){const s=st(x.id);if(filter==='all')return true;if(filter==='unanswered')return s.attempts===0;if(filter==='wrong')return s.wrong>0;if(filter==='w1')return s.wrong===1;if(filter==='w2')return s.wrong===2;if(filter==='w3')return s.wrong>=3;return true}
function render(){
 let a=data.filter(okf); if(randomized)a=[...a].sort(()=>Math.random()-.5);
 root.innerHTML='';
 a.forEach((x,i)=>{
   const s=st(x.id),c=document.createElement('div'); c.className='card';
   c.innerHTML=`<div class="qno">${i+1}/${a.length}</div><div class="q">${x.q}</div><div class="opts"></div><div class="feedback"></div><div class="meta">累計：${s.attempts}回答 / ${s.correct}正解 / ${s.wrong}誤答</div>`;
   x.options.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[j]+'. '+o;b.onclick=()=>ans(x,j,c);c.querySelector('.opts').appendChild(b)});
   root.appendChild(c);
 });
 update(a.length);
}
function ans(x,j,c){
 let s=st(x.id); s.attempts++;
 let bs=[...c.querySelectorAll('.opt')]; bs.forEach(b=>b.classList.remove('correct','wrong'));
 if(j===x.answer){s.correct++;bs[j].classList.add('correct')}else{s.wrong++;bs[j].classList.add('wrong');bs[x.answer].classList.add('correct')}
 hist[x.id]=s; save();
 let f=c.querySelector('.feedback');f.style.display='block';f.innerHTML=`<b>${j===x.answer?'正解！':'不正解'}</b><br>正答：${'ABCD'[x.answer]}. ${x.options[x.answer]}<br>${x.explanation}`;
 c.querySelector('.meta').textContent=`累計：${s.attempts}回答 / ${s.correct}正解 / ${s.wrong}誤答`;update(document.querySelectorAll('.card').length);
}
function update(n){stats.textContent=`全${data.length}問｜回答経験あり ${data.filter(x=>st(x.id).attempts>0).length}問｜誤答経験あり ${data.filter(x=>st(x.id).wrong>0).length}問｜現在表示 ${n}問`}
function setf(v,b){filter=v;document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function clearView(){document.querySelectorAll('.feedback').forEach(x=>x.style.display='none');document.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'))}
function resetAll(){if(confirm('正解・誤答回数を含む全履歴を消しますか？')){hist={};localStorage.removeItem(KEY);render()}}
render();
</script></body></html>
