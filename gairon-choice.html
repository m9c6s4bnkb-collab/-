<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心理学概論｜4択問題</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#20242a;--muted:#667085;--line:#e4e7ec;--accent:#3448c5;--good:#137a4d;--bad:#b42318;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.headerin{max-width:900px;margin:auto;padding:11px 14px}.title{font-size:17px;font-weight:800;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:14px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.panel{padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:8px}
button,select,input{font:inherit}button,.btn,select{border:1px solid #d0d5dd;background:white;border-radius:10px;padding:8px 10px;font-size:13px;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.stat{background:#f8fafc;border-radius:10px;padding:7px 8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:11px;color:var(--muted)}
.card{padding:18px}.qno{font-size:12px;color:var(--muted);margin-bottom:6px}.question{font-size:18px;font-weight:750;line-height:1.7;margin:0 0 14px}.options{display:grid;gap:9px}.opt{width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid #d0d5dd;background:#fff}.opt:hover{background:#f9fafb}.opt.selected{border-color:var(--accent);background:var(--soft)}.opt.correct{border-color:var(--good);background:#ecfdf3}.opt.wrong{border-color:var(--bad);background:#fef3f2}
.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}.feedback.good{border-color:#a6f4c5}.feedback.bad{border-color:#fecdca}.answer{font-weight:800}.topic{margin-top:7px;color:var(--muted);font-size:12px}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.nav button{flex:1}.nav button:nth-child(2){flex:1.4}
.empty{text-align:center;padding:28px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.links a{text-decoration:none;border:1px solid var(--line);background:#fff;padding:6px 9px;border-radius:9px;color:var(--accent);font-size:12px}
.shortInput{display:flex;gap:8px}.shortInput input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:11px;min-width:0}.selfrow{display:flex;gap:8px;margin-top:9px}.selfrow button{flex:1}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.question{font-size:16px}.card{padding:14px}.headerin{padding-top:8px}.wrap{padding:10px}.shortInput{display:block}.shortInput button{width:100%;margin-top:8px}}
</style></head>

<button id="randomBtn" onclick="toggleRandom()">ランダムOFF</button><button onclick="resetSession()">セッション成績リセット</button><button class="danger" onclick="resetAll()">全記録リセット</button><span id="countLabel" class="small"></span></div>

<script>const QUESTIONS=[{"q":"刺激語を提示し、自由な反応語・反応時間・反応態度からパーソナリティやコンプレックスを評価する投影法検査はどれか。","options":["言語連想検査","自由連想法","内観法","社会的再適応評価尺度"],"answer":"言語連想検査","exp":"刺激語への反応語、反応時間、反応態度を分析し、パーソナリティを評価する。ユングのものが有名。","topic":"ユング","id":"gai_mc_001"},{"q":"ユングの言語連想検査で提示される刺激語の数として示されているものはどれか。","options":["100語","50語","20語","200語"],"answer":"100語","exp":"100の刺激語への反応からコンプレックスを推定する。","topic":"ユング","id":"gai_mc_002"},{"q":"言語連想検査で分析対象になるものの組合せとして最も適切なのはどれか。","options":["反応語・反応時間・反応態度","刺激語・反応時間・再生率","反応語・再生率・内観報告","刺激語・反応態度・再適応の労力"],"answer":"反応語・反応時間・反応態度","exp":"刺激語への反応語、反応時間、反応態度が分析される。","topic":"ユング","id":"gai_mc_003"},{"q":"成長過程で抑圧・忘却されたものを含み、自覚できない領域をユングは何と呼んだか。","options":["個人的無意識","集合的無意識","元型","影"],"answer":"個人的無意識","exp":"個人的無意識は、成長過程で抑圧・忘却された内容を指す。","topic":"ユング","id":"gai_mc_004"},{"q":"個人や文化を超えて全人類が共通して持つ無意識はどれか。","options":["集合的無意識","個人的無意識","コンプレックス","投影"],"answer":"集合的無意識","exp":"集合的無意識は全人類に共通する無意識とされる。","topic":"ユング","id":"gai_mc_005"},{"q":"集合的無意識の中に含まれ、共通したイメージを生み出す源とされるものはどれか。","options":["元型","自我","抵抗","疾病利得"],"answer":"元型","exp":"元型は共通したイメージを生み出す源とされ、元型そのものは意識できない。","topic":"ユング","id":"gai_mc_006"},{"q":"感情によって色づけられた心的内容の集合体と定義されるものはどれか。","options":["コンプレックス","元型","影","転移"],"answer":"コンプレックス","exp":"ユングは、感情や記憶、連想などが無意識的に組織化された心的複合体とした。","topic":"コンプレックス","id":"gai_mc_007"},{"q":"劣等感コンプレックスの説明として最も適切なのはどれか。","options":["劣等感と結びついた複合感情","劣等感を本人が常に明確に自覚している状態","劣等感を伴わない感情の集合体","劣等感が身体症状へ転換した状態"],"answer":"劣等感と結びついた複合感情","exp":"劣等感は多くのコンプレックスの一つで、劣等感コンプレックスは劣等感と結びついた複合感情を意味する。","topic":"コンプレックス","id":"gai_mc_008"},{"q":"コンプレックスの特徴として示されているものはどれか。","options":["相当な自律性と圧倒的な力を持つ","必ず本人が自覚している","感情を伴わない","一時的な記憶だけからなる"],"answer":"相当な自律性と圧倒的な力を持つ","exp":"相当な自律性と圧倒的な力を持ち、強い情動を伴うことがある。","topic":"コンプレックス","id":"gai_mc_009"},{"q":"自分が受け入れがたい感情や欲望などを抑圧し、他者がそれを持っていると認識する現象はどれか。","options":["投影","直面","抵抗","転移"],"answer":"投影","exp":"自分の受け入れがたい内容を他者にあるものとして認識する。","topic":"投影","id":"gai_mc_010"},{"q":"他者に投影していたものが、実は自分自身のコンプレックスであると気づくことを何というか。","options":["投影の引き戻し","直面","転移","元型の意識化"],"answer":"投影の引き戻し","exp":"他者に投影されていたものを自分のものとして気づくこと。","topic":"投影","id":"gai_mc_011"},{"q":"投影によって図られるものとして示されているのはどれか。","options":["自我の安全","弱点への直面","転移の形成","抵抗の強化"],"answer":"自我の安全","exp":"自分のコンプレックスを他者に投影することで自我の安全が図られる。","topic":"投影","id":"gai_mc_012"},{"q":"フロイトが神経症の治療で無意識を探るために用いた精神分析療法の技法はどれか。","options":["自由連想法","言語連想検査","内観法","認知行動療法"],"answer":"自由連想法","exp":"頭に浮かぶことを隠さず話してもらい、語られた内容を分析素材とする。","topic":"精神分析","id":"gai_mc_013"},{"q":"自由連想法の過程でみられる沈黙や遅刻などを何というか。","options":["抵抗","直面","投影","転移"],"answer":"抵抗","exp":"沈黙や遅刻などは抵抗と呼ばれ、弱点が隠されていることもある。","topic":"精神分析","id":"gai_mc_014"},{"q":"自由連想法において、自分の弱点を意識していくことを何というか。","options":["直面","抵抗","転移","投影"],"answer":"直面","exp":"弱点を意識していくことを直面という。","topic":"精神分析","id":"gai_mc_015"},{"q":"クライエントが過去の重要人物への感情をセラピストに向ける現象はどれか。","options":["転移","抵抗","投影の引き戻し","疾病利得"],"answer":"転移","exp":"過去の重要人物への感情をセラピストへ向けること。","topic":"精神分析","id":"gai_mc_016"},{"q":"自由連想法で直面を行う際に考慮するものの組合せとして適切なのはどれか。","options":["タイミング・成長段階・弱点の大きさ","反応時間・成長段階・弱点の大きさ","タイミング・刺激語の数・弱点の大きさ","タイミング・成長段階・再生率"],"answer":"タイミング・成長段階・弱点の大きさ","exp":"直面には、タイミング、その人の成長段階、弱点の大きさなどを考慮する必要がある。","topic":"精神分析","id":"gai_mc_017"},{"q":"意識では受容できなかった自己の一側面をユングは何と呼んだか。","options":["影（シャドウ）","元型","抵抗","転移"],"answer":"影（シャドウ）","exp":"影は意識では受容できなかった自己の一側面。","topic":"ユング","id":"gai_mc_018"},{"q":"影（シャドウ）について正しいものはどれか。","options":["夢や現実場面で好ましくない人物に投影されることがある","必ず意識化されている","全人類に共通する内容だけからなる","感情を伴わない"],"answer":"夢や現実場面で好ましくない人物に投影されることがある","exp":"影は個人色が強く、夢や現実場面で好ましくない人物に投影されることがある。","topic":"ユング","id":"gai_mc_019"},{"q":"ストレスや心の葛藤が身体症状へ転換して表現される病気はどれか。","options":["転換性障害","分離不安症","社会的引きこもり","人格障害"],"answer":"転換性障害","exp":"失声、失明、失立失歩などの症状がみられる。","topic":"臨床","id":"gai_mc_020"},{"q":"転換性障害の症状例として挙げられていないものはどれか。","options":["慢性的な空虚感","失声","失明","失立失歩"],"answer":"慢性的な空虚感","exp":"転換性障害では失声、失明、失立失歩などが例として挙げられている。慢性的な空虚感は境界性人格障害の特徴として記載されている。","topic":"臨床","id":"gai_mc_021"},{"q":"転換性障害で、症状を持つことによって周囲の気を引くなど本人に好都合な状況が生じることを何というか。","options":["疾病利得","二次的評価","社会的再適応","情動焦点型コーピング"],"answer":"疾病利得","exp":"症状によって本人に好都合な状況となることを疾病利得という。","topic":"臨床","id":"gai_mc_022"},{"q":"転換性障害の説明として最も適切なのはどれか。","options":["症状を十分に説明する身体疾患がみられず、神経系の機能不全による麻痺や感覚低下がみられることがある","症状を十分に説明する身体疾患が必ずみられる","身体症状はなく、感情や思考だけに変化が生じる","社会参加の低下が6か月以上続くことだけで定義される"],"answer":"症状を十分に説明する身体疾患がみられず、神経系の機能不全による麻痺や感覚低下がみられることがある","exp":"症状を十分に説明する身体疾患がみられないこと、神経系の機能不全により麻痺や感覚の鈍化がみられることが挙げられている。","topic":"臨床","id":"gai_mc_023"},{"q":"刺激の種類にかかわらず、適応していく際の生体反応は非特異的だと考えた人物は誰か。","options":["セリエ","ラザルス","ホームズ","レイ"],"answer":"セリエ","exp":"セリエは汎適応症候群を提唱した。","topic":"ストレス","id":"gai_mc_024"},{"q":"汎適応症候群の3段階の正しい順序はどれか。","options":["警告反応期→抵抗期→疲憊期","抵抗期→警告反応期→疲憊期","警告反応期→疲憊期→抵抗期","疲憊期→抵抗期→警告反応期"],"answer":"警告反応期→抵抗期→疲憊期","exp":"警告反応期、抵抗期、疲憊期の順に説明される。","topic":"ストレス","id":"gai_mc_025"},{"q":"ストレッサー遭遇直後に一時的に抵抗力が下がり、その後平常時より高まる段階はどれか。","options":["警告反応期","抵抗期","疲憊期","再適応期"],"answer":"警告反応期","exp":"警告反応期では直後に抵抗力が下がるが、その後高まる。","topic":"ストレス","id":"gai_mc_026"},{"q":"ストレッサーに耐え、目立った症状が消失して適応が良い状態が続く段階はどれか。","options":["抵抗期","警告反応期","疲憊期","直面期"],"answer":"抵抗期","exp":"抵抗期はストレッサーに耐え、適応している状態。","topic":"ストレス","id":"gai_mc_027"},{"q":"長期のストレッサーにより生体機能が破綻し、抵抗力が急激に低下する段階はどれか。","options":["疲憊期","警告反応期","抵抗期","再接近期"],"answer":"疲憊期","exp":"疲憊期では長期ストレッサーにより生体機能が破綻する。","topic":"ストレス","id":"gai_mc_028"},{"q":"ライフイベント研究を提唱した人物の組合せはどれか。","options":["ホームズとレイ","セリエとラザルス","ユングとフロイト","ボウルビィとブロス"],"answer":"ホームズとレイ","exp":"ホームズとレイがライフイベント理論を提唱した。","topic":"ストレス","id":"gai_mc_029"},{"q":"社会的再適応評価尺度で基準の50とされる出来事はどれか。","options":["結婚","配偶者の死","転居","親しい人の死"],"answer":"結婚","exp":"結婚の50を基準に順位づけされる。","topic":"ストレス","id":"gai_mc_030"},{"q":"社会的再適応評価尺度で100と最も高い出来事はどれか。","options":["配偶者の死","結婚","転居","転校"],"answer":"配偶者の死","exp":"配偶者の死が100と最も高い。","topic":"ストレス","id":"gai_mc_031"},{"q":"ライフイベント理論の特徴として正しいものはどれか。","options":["ポジティブな出来事もストレッサーになりうる","ネガティブな出来事だけがストレッサーになる","再適応の労力は健康と無関係","生活変化の大きさは数量化されない"],"answer":"ポジティブな出来事もストレッサーになりうる","exp":"生活変化への再適応の労力が健康に影響し、ポジティブなイベントも含まれる。","topic":"ストレス","id":"gai_mc_032"},{"q":"ストレッサーに対する認知的評価によってストレス反応が生じるとする理論を提唱した人物は誰か。","options":["ラザルス","セリエ","ホームズ","レイ"],"answer":"ラザルス","exp":"ラザルスの心理的ストレス理論（認知的評価理論）。","topic":"ストレス","id":"gai_mc_033"},{"q":"心理的ストレス理論の一次的評価で判断される内容はどれか。","options":["脅威かどうか","対処できるかどうか","ストレスへの脆弱性","ソーシャルサポート"],"answer":"脅威かどうか","exp":"一次的評価では脅威か否かを判断する。","topic":"ストレス","id":"gai_mc_034"},{"q":"心理的ストレス理論の二次的評価で判断される内容はどれか。","options":["対処できるかどうか","脅威かどうか","ストレスへの脆弱性","ソーシャルサポート"],"answer":"対処できるかどうか","exp":"二次的評価では対処可能性を判断する。","topic":"ストレス","id":"gai_mc_035"},{"q":"一次的評価と二次的評価の関係について正しいものはどれか。","options":["同時に行われたり、二次的評価が先になることもある","必ず一次的評価が完全に終了してから二次的評価が始まる","二次的評価は存在しない","一次的評価だけでストレス反応が決まる"],"answer":"同時に行われたり、二次的評価が先になることもある","exp":"両評価は同時の場合や二次的評価が先の場合もある。","topic":"ストレス","id":"gai_mc_036"},{"q":"対処できないと判断された場合のストレス反応の程度に影響するとされるものはどれか。","options":["ストレスへの脆弱性やソーシャルサポート","一次的評価と二次的評価の順序だけ","ストレッサーが重大な刺激かどうかだけ","問題焦点型コーピングを使ったかどうかだけ"],"answer":"ストレスへの脆弱性やソーシャルサポート","exp":"対処不能と評価されても、脆弱性やソーシャルサポートで反応の程度は変化する。","topic":"ストレス","id":"gai_mc_037"},{"q":"ストレッサーの3分類のうち、戦争や犯罪被害など、誰もが強いストレスを受けやすい出来事はどの分類か。","options":["重大な刺激","ライフイベント","デイリーハッスル","ソーシャルサポート"],"answer":"重大な刺激","exp":"戦争や犯罪被害などの重大な刺激。","topic":"ストレス","id":"gai_mc_038"},{"q":"親しい人の死や転居、転校などは、ストレッサー3分類のどれに当たるか。","options":["ライフイベント","重大な刺激","デイリーハッスル","疾病利得"],"answer":"ライフイベント","exp":"人生上の大きな出来事。","topic":"ストレス","id":"gai_mc_039"},{"q":"ちょっとした不愉快な事柄や心配事に当たるものはどれか。","options":["デイリーハッスル","ライフイベント","重大な刺激","抵抗"],"answer":"デイリーハッスル","exp":"日常のイライラ事とも呼ばれる。","topic":"ストレス","id":"gai_mc_040"},{"q":"ストレス反応を緩和するためになされる行動を何というか。","options":["コーピング","投影","抵抗","標準化"],"answer":"コーピング","exp":"ストレスコーピングともいう。","topic":"コーピング","id":"gai_mc_041"},{"q":"ストレッサー自体を取り除くため、問題解決や対策を行うコーピングはどれか。","options":["問題焦点型コーピング","情動焦点型コーピング","直接効果","緩衝効果"],"answer":"問題焦点型コーピング","exp":"問題解決や周囲の協力を得るなどの対処。","topic":"コーピング","id":"gai_mc_042"},{"q":"怒りや悲しみを誰かに話す、気晴らしをするなど、不快感情を軽減するコーピングはどれか。","options":["情動焦点型コーピング","問題焦点型コーピング","投影","直面"],"answer":"情動焦点型コーピング","exp":"不快な感情の軽減を目指す。","topic":"コーピング","id":"gai_mc_043"},{"q":"ストレス対処で重要とされる能力はどれか。","options":["状況に合わせてコーピングを柔軟に使い分ける能力","常に問題焦点型だけを使う能力","常に情動焦点型だけを使う能力","ストレッサーを無視する能力"],"answer":"状況に合わせてコーピングを柔軟に使い分ける能力","exp":"状況に応じて柔軟に使い分ける能力をコーピングの柔軟性という。","topic":"コーピング","id":"gai_mc_044"},{"q":"困難な状況にある個人へ、周囲の人々から有形・無形の資源が提供されることを何というか。","options":["ソーシャルサポート","コーピング","疾病利得","標準化"],"answer":"ソーシャルサポート","exp":"周囲から有形・無形の資源が提供されること。","topic":"ソーシャルサポート","id":"gai_mc_045"},{"q":"ハウスが分類したソーシャルサポートの一つはどれか。","options":["情報的サポート","問題焦点型コーピング","デイリーハッスル","一次的評価"],"answer":"情報的サポート","exp":"ハウスは、手段的・情報的・情緒的・評価的サポートの4つに分類した。","topic":"ソーシャルサポート","id":"gai_mc_046"},{"q":"ハウスによるソーシャルサポートの分類数はいくつか。","options":["4つ","2つ","3つ","5つ"],"answer":"4つ","exp":"手段的・情報的・情緒的・評価的サポートの4つ。","topic":"ソーシャルサポート","id":"gai_mc_047"},{"q":"ソーシャルサポートの効果として示されているものはどれか。","options":["ストレスに対する緩衝効果と精神的健康への直接効果","ストレスに対する直接効果と精神的健康への緩衝効果","ストレスに対する緩衝効果だけ","精神的健康への直接効果だけ"],"answer":"ストレスに対する緩衝効果と精神的健康への直接効果","exp":"主観的に知覚されることにより、緩衝効果や直接効果があるとされる。","topic":"ソーシャルサポート","id":"gai_mc_048"},{"q":"パーソナリティの特徴が社会的規範や一般的常識と比べて著しく偏り、社会生活に支障をきたす状態はどれか。","options":["人格障害（パーソナリティ症）","社会的引きこもり","分離不安症","転換性障害"],"answer":"人格障害（パーソナリティ症）","exp":"偏りは一時的でなく持続的に存在し、本人には自然なものとして捉えられる。","topic":"人格","id":"gai_mc_049"},{"q":"DSM-5における人格障害のA群の特徴として最も適切なのはどれか。","options":["奇妙で風変わりな信念や習慣","劇的・過度な感情や言動","不安や自信のなさ","見捨てられ不安と理想化・価値下げ"],"answer":"奇妙で風変わりな信念や習慣","exp":"A群は奇妙で風変わり、B群は劇的・過度、C群は不安や自信のなさ。","topic":"人格","id":"gai_mc_050"},{"q":"DSM-5における人格障害のB群の特徴はどれか。","options":["劇的・過度な感情や言動","奇妙で風変わりな信念や習慣","不安や自信のなさ","賞賛への強い欲求と共感の欠如"],"answer":"劇的・過度な感情や言動","exp":"B群は劇的・過度な感情や言動がみられる。","topic":"人格","id":"gai_mc_051"},{"q":"DSM-5における人格障害のC群の特徴はどれか。","options":["不安や自信のなさが強い","劇的・過度な感情や言動","奇妙で風変わりな信念や習慣","見捨てられ不安と慢性的な空虚感"],"answer":"不安や自信のなさが強い","exp":"C群は不安や自信のなさが強い。","topic":"人格","id":"gai_mc_052"},{"q":"見捨てられ不安が顕著で、理想化と価値下げを繰り返すことがあるパーソナリティ症はどれか。","options":["境界性人格障害","自己愛性人格障害","転換性障害","分離不安症"],"answer":"境界性人格障害","exp":"不安定な思考・感情、衝動性、慢性的空虚感などが特徴。","topic":"人格","id":"gai_mc_053"},{"q":"境界性人格障害の特徴として最も適切なのはどれか。","options":["理想化と価値下げを繰り返す","他者からの賞賛を強く求め、共感が乏しい","奇妙で風変わりな信念や習慣が中心となる","不安や自信のなさだけが持続する"],"answer":"理想化と価値下げを繰り返す","exp":"境界性人格障害では、人や自分への評価が変化し、理想化と価値下げを繰り返すことがある。","topic":"人格","id":"gai_mc_054"},{"q":"境界性人格障害でみられることがある自己破壊的行為の例はどれか。","options":["薬物の過剰摂取や自傷行為","依存と攻撃","理想化と価値下げ","嫉妬と他者利用"],"answer":"薬物の過剰摂取や自傷行為","exp":"薬物の過剰摂取や自傷行為などを繰り返すことがある。","topic":"人格","id":"gai_mc_055"},{"q":"自己の重要さに対する誇大性、賞賛への強い欲求、共感の欠如を特徴とするパーソナリティ症はどれか。","options":["自己愛性人格障害","境界性人格障害","分離不安症","転換性障害"],"answer":"自己愛性人格障害","exp":"誇大性、賞賛欲求、共感の欠如などが特徴。","topic":"人格","id":"gai_mc_056"},{"q":"自己愛性人格障害の特徴として示されているものはどれか。","options":["他者に対する嫉妬深さ","見捨てられ不安","慢性的な空虚感","理想化と価値下げ"],"answer":"他者に対する嫉妬深さ","exp":"傲慢な態度、不当な他者利用、嫉妬深さなどが挙げられる。","topic":"人格","id":"gai_mc_057"},{"q":"自己愛性人格障害の誇大性や特権意識について正しいものはどれか。","options":["根拠のない幻想的なもので、容易に崩壊しうる","常に現実的根拠がある","傷つきにくさと結びつく","共感性の高さによって支えられる"],"answer":"根拠のない幻想的なもので、容易に崩壊しうる","exp":"誇大性や特権意識は容易に崩壊しうるため、傷つきやすさも持つ。","topic":"人格","id":"gai_mc_058"},{"q":"社会的引きこもりの定義に含まれる期間として示されているものはどれか。","options":["6か月以上","1週間以上","1か月以上","3年以上"],"answer":"6か月以上","exp":"6か月以上自宅にひきこもり社会参加していない状態。","topic":"青年期","id":"gai_mc_059"},{"q":"社会的引きこもりへの対処で重要とされるものはどれか。","options":["人との情緒的交流を通じた成熟と、欲求の実現を待つ能力の成熟","欲求不満をすぐ衝動的に表現できるようにすること","人との情緒的交流を減らし、単独で対処すること","社会参加を避ける期間を長くすること"],"answer":"人との情緒的交流を通じた成熟と、欲求の実現を待つ能力の成熟","exp":"資料では2つの成熟が重要とされる。","topic":"青年期","id":"gai_mc_060"},{"q":"測定内容が測定対象を正確に測定している程度を何というか。","options":["妥当性","信頼性","標準化","一貫性"],"answer":"妥当性","exp":"妥当性は測りたいものを正確に測っている程度。","topic":"心理検査","id":"gai_mc_061"},{"q":"妥当性の3分類に含まれないものはどれか。","options":["安定性","内容的妥当性","基準関連妥当性","構成概念妥当性"],"answer":"安定性","exp":"妥当性は内容的妥当性、基準関連妥当性、構成概念妥当性の3つに大きく分けられる。安定性は信頼性に関する説明である。","topic":"心理検査","id":"gai_mc_062"},{"q":"測定内容が安定性と一貫性を有している程度を何というか。","options":["信頼性","妥当性","標準化","安定性"],"answer":"信頼性","exp":"信頼性は安定性と一貫性を有する程度。","topic":"心理検査","id":"gai_mc_063"},{"q":"同一個人が同一条件で同じテストを繰り返し受け、同等の結果が得られる程度は何を表すか。","options":["安定性","一貫性","妥当性","社会的再適応"],"answer":"安定性","exp":"同一個人・同一条件での反復で同等結果が得られる程度。","topic":"心理検査","id":"gai_mc_064"},{"q":"テストを構成する複数項目について同等の結果が得られる程度は何を表すか。","options":["一貫性","安定性","妥当性","投影"],"answer":"一貫性","exp":"複数項目で同等の結果が得られる程度。","topic":"心理検査","id":"gai_mc_065"},{"q":"心理検査で妥当性と信頼性が確かめられていることを何というか。","options":["標準化","投影","抵抗","局所論"],"answer":"標準化","exp":"資料では妥当性と信頼性が確かめられたことを標準化とする。","topic":"心理検査","id":"gai_mc_066"},{"q":"母性剥奪を提唱した人物は誰か。","options":["ボウルビィ","ブロス","フロイト","ユング"],"answer":"ボウルビィ","exp":"ボウルビィは乳幼児と養育者の親密で持続的な関係を重視した。","topic":"発達","id":"gai_mc_067"},{"q":"母性剥奪における「母性」の意味として最も適切なのはどれか。","options":["暖かい情緒的接触","実母だけによる養育","身体的接触だけ","経済的援助だけ"],"answer":"暖かい情緒的接触","exp":"ここでいう母性は実母に限定されず、暖かい情緒的接触を意味する。","topic":"発達","id":"gai_mc_068"},{"q":"乳児を母親から引き離したときの反応段階の正しい順序はどれか。","options":["抗議→絶望→離脱","絶望→抗議→離脱","抗議→離脱→絶望","離脱→絶望→抗議"],"answer":"抗議→絶望→離脱","exp":"はじめに抗議、次に絶望、最終的に離脱へ移行する。","topic":"発達","id":"gai_mc_069"},{"q":"母性的養育の喪失により影響を受けうる発達として示されているものはどれか。","options":["身体的・知的・情緒的・社会的・人格的発達","身体的・知的・情緒的発達のみ","社会的・人格的発達のみ","身体的発達のみ"],"answer":"身体的・知的・情緒的・社会的・人格的発達","exp":"多面的な発達への障害が挙げられている。","topic":"発達","id":"gai_mc_070"},{"q":"男根期の男児が母親へ愛着、父親へ敵意や対抗心を抱く複合感情はどれか。","options":["エディプス・コンプレックス","エレクトラ・コンプレックス","劣等感コンプレックス","母性剥奪"],"answer":"エディプス・コンプレックス","exp":"フロイトの心理＝性的発達段階の男根期に関する説明。","topic":"精神分析","id":"gai_mc_071"},{"q":"男根期の女児が父親への性的関心と母親への敵意を抱く複合感情はどれか。","options":["エレクトラ・コンプレックス","エディプス・コンプレックス","劣等感コンプレックス","転移"],"answer":"エレクトラ・コンプレックス","exp":"エディプス・コンプレックスと区別するためユングが名づけた。","topic":"精神分析","id":"gai_mc_072"},{"q":"エレクトラ・コンプレックスという名称をつけた人物は誰か。","options":["ユング","フロイト","ブロス","ボウルビィ"],"answer":"ユング","exp":"ユングが名づけたとされる。","topic":"精神分析","id":"gai_mc_073"},{"q":"家や愛着対象からの分離について、発達的に過剰で不適切な恐怖や不安を抱く状態はどれか。","options":["分離不安症","社会的引きこもり","転換性障害","自己愛性人格障害"],"answer":"分離不安症","exp":"分離への過剰な恐怖や不安で生活に不都合が生じる。","topic":"臨床","id":"gai_mc_074"},{"q":"一般的な分離不安について正しいものはどれか。","options":["分離不安自体は病的なものではない","必ず精神障害である","成人には生じない","必ず薬物療法だけで治療する"],"answer":"分離不安自体は病的なものではない","exp":"乳幼児の分離不安自体は病的とは限らない。","topic":"臨床","id":"gai_mc_075"},{"q":"DSM-5で分離不安症が含まれる分類はどれか。","options":["不安症候群","人格障害","転換性障害","社会的引きこもり"],"answer":"不安症候群","exp":"症状が成人期にも持続する場合や他の不安症との移行・併存がみられることから、DSM-5では不安症候群に含まれると記載されている。","topic":"臨床","id":"gai_mc_076"},{"q":"分離不安症の治療として挙げられているものはどれか。","options":["行動療法・認知行動療法・薬物療法","自由連想法だけ","言語連想検査だけ","内観法だけ"],"answer":"行動療法・認知行動療法・薬物療法","exp":"資料ではこれらが治療として挙げられている。","topic":"臨床","id":"gai_mc_077"},{"q":"青年期の養育者との関係変化を「第2の分離固体化」として論じた人物は誰か。","options":["ブロス","ボウルビィ","ユング","フロイト"],"answer":"ブロス","exp":"ブロスによる青年期の第2の分離固体化。","topic":"青年期","id":"gai_mc_078"},{"q":"第2の分離固体化で10～12歳に当たる時期はどれか。","options":["分化期","再接近期","練習期","固体化期"],"answer":"分化期","exp":"10～12歳は分化期。","topic":"青年期","id":"gai_mc_079"},{"q":"第2の分離固体化で12～15歳頃に当たる時期はどれか。","options":["再接近期","分化期","練習期","固体化期"],"answer":"再接近期","exp":"12～15歳頃は再接近期。","topic":"青年期","id":"gai_mc_080"},{"q":"第2の分離固体化で15～18歳頃に当たる時期はどれか。","options":["練習期","分化期","再接近期","固体化期"],"answer":"練習期","exp":"15～18歳頃は練習期。","topic":"青年期","id":"gai_mc_081"},{"q":"第2の分離固体化で18～22歳に当たる時期はどれか。","options":["固体化期","分化期","再接近期","練習期"],"answer":"固体化期","exp":"18～22歳は固体化期。","topic":"青年期","id":"gai_mc_082"},{"q":"12～15歳頃の再接近期の特徴として最も適切なのはどれか。","options":["物理的には母親と距離を置くが心理的には依存している","物理的にも心理的にも完全に自立している","自我とエスの不均衡が中心である","親との距離が安定し自己が完成する"],"answer":"物理的には母親と距離を置くが心理的には依存している","exp":"再接近期では依存と自立のアンビバレントな感情を抱く。","topic":"青年期","id":"gai_mc_083"},{"q":"青年期にみられる特有の無気力状態を何というか。","options":["スチューデント・アパシー","分離不安症","母性剥奪","社会的引きこもり"],"answer":"スチューデント・アパシー","exp":"アパシーは無気力や無関心を意味する。","topic":"青年期","id":"gai_mc_084"},{"q":"スチューデント・アパシーが注目されるようになった時期として示されているのはどれか。","options":["1960年代後半","1870年代","1980年代後半","2000年代"],"answer":"1960年代後半","exp":"1960年代後半から注目された。","topic":"青年期","id":"gai_mc_085"},{"q":"他者のある一側面の評価が、他の側面の評価にも影響する対人認知の歪みはどれか。","options":["ハロー効果","投影","転移","疾病利得"],"answer":"ハロー効果","exp":"光背効果とも呼ばれる。","topic":"社会心理","id":"gai_mc_086"},{"q":"ハロー効果について正しいものはどれか。","options":["顕著な好ましい特徴があると他の特徴も不当に高く評価しやすい","一つの特徴は他の評価に影響しない","好ましくない特徴は評価に影響しない","本人の自己評価だけに生じる"],"answer":"顕著な好ましい特徴があると他の特徴も不当に高く評価しやすい","exp":"好ましい・好ましくない顕著な特徴が他の側面の評価に波及する。","topic":"社会心理","id":"gai_mc_087"},{"q":"1879年にライプツィヒ大学に世界初の心理学実験室を開設した人物は誰か。","options":["ヴント","エビングハウス","ワトソン","フロイト"],"answer":"ヴント","exp":"現代心理学の祖とされる。","topic":"心理学史","id":"gai_mc_088"},{"q":"ヴントが用いた方法はどれか。","options":["内観法","自由連想法","言語連想検査","社会的再適応評価尺度"],"answer":"内観法","exp":"統制された環境で自らの意識内容を観察・報告させた。","topic":"心理学史","id":"gai_mc_089"},{"q":"ヴントが明らかにしようとしたものはどれか。","options":["意識の構成要素","無意識の力動だけ","条件づけによる行動だけ","社会的障壁だけ"],"answer":"意識の構成要素","exp":"内観法で意識の構成要素を明らかにしようとした。","topic":"心理学史","id":"gai_mc_090"},{"q":"ヴントは意識内容についてどのように考えたか。","options":["純粋感覚と単純感覚に分解でき、それらが統覚として結合すると考えた","無意識だけからなると考えた","条件反射だけで説明できると考えた","元型の集合だと考えた"],"answer":"純粋感覚と単純感覚に分解でき、それらが統覚として結合すると考えた","exp":"純粋感覚と単純感覚に分解可能で、統覚として一つの対象を知覚するとした。","topic":"心理学史","id":"gai_mc_091"},{"q":"自分自身を被験者として無意味綴りを用い、忘却の過程を研究した人物は誰か。","options":["エビングハウス","ヴント","ワトソン","ウェルトハイマー"],"answer":"エビングハウス","exp":"記憶研究で無意味綴りを用いた。","topic":"心理学史","id":"gai_mc_092"},{"q":"エビングハウスが用いた無意味綴りの形式として示されているものはどれか。","options":["子音－母音－子音の3文字","母音－母音の2文字","4文字の有意味語","数字だけの5桁"],"answer":"子音－母音－子音の3文字","exp":"単語を連想させない子音－母音－子音の3文字からなる無意味綴り。","topic":"心理学史","id":"gai_mc_093"},{"q":"エビングハウスが明らかにしたものはどれか。","options":["経過時間ごとの忘却の過程","条件づけによる恐怖","無意識の構造","対人認知の歪み"],"answer":"経過時間ごとの忘却の過程","exp":"再生率を調べ、忘却曲線として表した。","topic":"心理学史","id":"gai_mc_094"},{"q":"ゲシュタルト心理学を創設した人物は誰か。","options":["ウェルトハイマー","ワトソン","ヴント","エビングハウス"],"answer":"ウェルトハイマー","exp":"ドイツのウェルトハイマーによって創設された。","topic":"心理学史","id":"gai_mc_095"},{"q":"ゲシュタルト心理学が批判した立場として示されているものはどれか。","options":["要素主義・構成主義","行動主義・S-R理論","局所論・構造論","医学モデル・障害の社会モデル"],"answer":"要素主義・構成主義","exp":"ヴントに代表される要素主義・構成主義を批判した。","topic":"心理学史","id":"gai_mc_096"},{"q":"ゲシュタルト心理学で重視されるものはどれか。","options":["知覚や思考、行動における全体性","意識を要素へ分解すること","行動だけの測定","無意識の葛藤だけ"],"answer":"知覚や思考、行動における全体性","exp":"要素に還元できない全体性を重視する。","topic":"心理学史","id":"gai_mc_097"},{"q":"ゲシュタルト心理学の代表的研究として示されているものはどれか。","options":["仮現運動","アルバート坊や","自由連想法","忘却曲線"],"answer":"仮現運動","exp":"ウェルトハイマーの仮現運動研究に端を発する。","topic":"心理学史","id":"gai_mc_098"},{"q":"ゲシュタルトを思考や問題解決に応用した研究者として挙げられているのは誰か。","options":["ケーラー","レヴィン","ワトソン","ボウルビィ"],"answer":"ケーラー","exp":"ケーラーは思考や問題解決へ応用した。","topic":"心理学史","id":"gai_mc_099"},{"q":"ゲシュタルトを集団力学に応用し、実験社会心理学の基礎を作った人物は誰か。","options":["レヴィン","ケーラー","エビングハウス","フロイト"],"answer":"レヴィン","exp":"レヴィンは集団力学へ応用した。","topic":"心理学史","id":"gai_mc_100"},{"q":"客観的に測定可能な行動のみを心理学の研究対象とする立場はどれか。","options":["行動主義心理学","精神分析学","ゲシュタルト心理学","内観法による意識心理学"],"answer":"行動主義心理学","exp":"目に見えない意識ではなく、行動を研究対象とする。","topic":"心理学史","id":"gai_mc_101"},{"q":"1910年代前半に行動主義を提唱した人物は誰か。","options":["ワトソン","ヴント","フロイト","ユング"],"answer":"ワトソン","exp":"当時主流だった内観法による意識心理学と対立した。","topic":"心理学史","id":"gai_mc_102"},{"q":"行動主義における学習の説明として示されているものはどれか。","options":["刺激と反応の連合によるS-R理論","局所論","構造論","力動論"],"answer":"刺激と反応の連合によるS-R理論","exp":"条件づけで形成される刺激と反応の連合を重視する。","topic":"心理学史","id":"gai_mc_103"},{"q":"ワトソンが行った実験はどれか。","options":["アルバート坊やの実験","仮現運動の実験","忘却曲線の実験","言語連想検査"],"answer":"アルバート坊やの実験","exp":"レスポンデント条件づけに注目し、アルバート坊やの実験を行った。","topic":"心理学史","id":"gai_mc_104"},{"q":"ワトソンの立場がつながったものとして示されているのはどれか。","options":["極端な環境主義","集合的無意識","社会モデル","母性剥奪"],"answer":"極端な環境主義","exp":"遺伝的個人差や意識の存在を廃し、すべての行動が条件づけで獲得可能と考える方向につながった。","topic":"心理学史","id":"gai_mc_105"},{"q":"精神分析学を創設した人物は誰か。","options":["フロイト","ユング","ワトソン","ヴント"],"answer":"フロイト","exp":"無意識の存在を重視した。","topic":"精神分析","id":"gai_mc_106"},{"q":"心を意識・前意識・無意識の3層からなるとする理論はどれか。","options":["局所論","構造論","力動論","S-R理論"],"answer":"局所論","exp":"局所論は意識・前意識・無意識の3層。","topic":"精神分析","id":"gai_mc_107"},{"q":"心をイド・自我・超自我の3機能からなるとする理論はどれか。","options":["構造論","局所論","力動論","認知的評価理論"],"answer":"構造論","exp":"構造論はイド・自我・超自我の3機能。","topic":"精神分析","id":"gai_mc_108"},{"q":"イド・自我・超自我の力関係によって心理的現象が生じるとする理論はどれか。","options":["力動論","局所論","構造論","行動主義"],"answer":"力動論","exp":"力動論は3機能の力関係を重視する。","topic":"精神分析","id":"gai_mc_109"},{"q":"フロイト以降の精神分析学として、自我心理学でさまざまな防衛機制を提唱した人物は誰か。","options":["アンナ・フロイト","エリクソン","ユング","ワトソン"],"answer":"アンナ・フロイト","exp":"抑圧以外のさまざまな防衛機制を提唱した。","topic":"精神分析","id":"gai_mc_110"},{"q":"フロイト以降の精神分析学として、青年期発達に注目した人物として挙げられているのは誰か。","options":["エリクソン","アンナ・フロイト","ウェルトハイマー","ホームズ"],"answer":"エリクソン","exp":"青年期発達に注目した代表者として挙げられる。","topic":"精神分析","id":"gai_mc_111"},{"q":"1980年にWHOが提唱した障害分類モデルはどれか。","options":["ICIDH","ICF","医学モデル","障害の社会モデル"],"answer":"ICIDH","exp":"ICIDHは1980年にWHOが提唱した。","topic":"障害","id":"gai_mc_112"},{"q":"ICIDHで障害を捉える3次元の組合せとして正しいものはどれか。","options":["機能障害・能力障害・社会的不利","心身機能・身体構造・活動","活動・参加・環境因子","健康状態・環境因子・個人因子"],"answer":"機能障害・能力障害・社会的不利","exp":"ICIDHは機能障害、能力障害、社会的不利の3次元で定義する。","topic":"障害","id":"gai_mc_113"},{"q":"2001年にWHOが提唱した、健康状態に関連した生活機能や環境要因を分類・記述するものはどれか。","options":["ICF","ICIDH","医学モデル","障害の社会モデル"],"answer":"ICF","exp":"ICFは2001年にWHOが提唱した。","topic":"障害","id":"gai_mc_114"},{"q":"ICFにおける「その人の課題や行為の遂行」を表す要素はどれか。","options":["活動","参加","心身機能・身体構造","環境因子"],"answer":"活動","exp":"活動は課題や行為の遂行を意味する。","topic":"障害","id":"gai_mc_115"},{"q":"ICFにおける「社会や家庭への関わり」を表す要素はどれか。","options":["参加","活動","個人因子","健康状態"],"answer":"参加","exp":"参加は社会や家庭への関わり。","topic":"障害","id":"gai_mc_116"},{"q":"ICFについて正しいものはどれか。","options":["疾病や障害の有無にかかわらず、すべての人を対象とする","障害のある人だけを対象とする","環境因子を扱わない","身体構造だけを扱う"],"answer":"疾病や障害の有無にかかわらず、すべての人を対象とする","exp":"健康状態に関わる構成要素を包括的にとらえるモデル。","topic":"障害","id":"gai_mc_117"},{"q":"ICFの構成要素として示されていないものはどれか。","options":["社会的不利","心身機能・身体構造","活動","参加"],"answer":"社会的不利","exp":"社会的不利はICIDHの3次元の一つ。","topic":"障害","id":"gai_mc_118"},{"q":"障害を、障害のある人自身の中に生じた個人的問題として捉える考え方はどれか。","options":["医学モデル","障害の社会モデル","ICF","ソーシャルサポート"],"answer":"医学モデル","exp":"社会参加には本人が治療や訓練により障害を克服することが求められると捉える。","topic":"障害","id":"gai_mc_119"},{"q":"障害は、多様な人を想定せずに作られた社会的障壁によって生み出されるとする考え方はどれか。","options":["障害の社会モデル","医学モデル","局所論","力動論"],"answer":"障害の社会モデル","exp":"社会的障壁を問題と捉える。","topic":"障害","id":"gai_mc_120"},{"q":"障害の社会モデルにおいて、障壁を取り除く責務を負うとされるのはどれか。","options":["社会","障害のある本人","家族","WHO"],"answer":"社会","exp":"問題を社会全体の問題として捉え、障壁除去は社会の責務とする。","topic":"障害","id":"gai_mc_121"},{"q":"医学モデルの説明として最も適切なのはどれか。","options":["本人が治療や訓練を行い、社会に適応できるよう障害を克服することが求められる","社会的障壁だけが障害を作ると考える","社会全体が環境を変えることだけを求める","障害の有無にかかわらず全員を同じ構成要素で捉える"],"answer":"本人が治療や訓練を行い、社会に適応できるよう障害を克服することが求められる","exp":"障害を個人内の問題として捉える医学モデルの説明。","topic":"障害","id":"gai_mc_122"},{"q":"個人的無意識について示されている特徴はどれか。","options":["思いがけないことを自分にさせようとする部分でもある","全人類に共通する元型だけからなる","常に本人が意識できる","他者から提供される資源を意味する"],"answer":"思いがけないことを自分にさせようとする部分でもある","exp":"個人的無意識は抑圧・忘却されたものを含み、思いがけないことを自分にさせようとする部分でもあると説明されている。","topic":"ユング","id":"gai_mc_123"},{"q":"元型について正しいものはどれか。","options":["元型そのものは意識できないとされる","成長過程で抑圧された個人的記憶だけを指す","自由連想法における沈黙を指す","社会的再適応の労力を表す"],"answer":"元型そのものは意識できないとされる","exp":"元型そのものは意識できず、多くの人々に共通するパターン化されたイメージが認識されるとされる。","topic":"ユング","id":"gai_mc_124"},{"q":"劣等感コンプレックスに伴うものとして挙げられているのはどれか。","options":["自己嫌悪・自己否定・他者への嫌味などの強い感情","反応時間の短縮だけ","社会的再適応の労力だけ","行動の条件づけだけ"],"answer":"自己嫌悪・自己否定・他者への嫌味などの強い感情","exp":"劣等感を自覚していないことがあり、自己嫌悪、自己否定、他者への嫌味などの強い感情を伴うとされる。","topic":"コンプレックス","id":"gai_mc_125"},{"q":"自由連想法の原法でクライエントが行うこととして適切なのはどれか。","options":["寝椅子に横になり、頭に浮かぶことを隠さず話す","刺激語100語に一語ずつ答える","同じテストを繰り返し受ける","無意味綴りを暗記して再生する"],"answer":"寝椅子に横になり、頭に浮かぶことを隠さず話す","exp":"原法では、クライエントが寝椅子に横になり、頭に浮かぶことを隠さずセラピストに話す。","topic":"精神分析","id":"gai_mc_126"},{"q":"自由連想法でクライエントが語った内容は、どのように扱われるか。","options":["分析の素材となり、無意識の現れとされる","反応時間だけが記録される","社会的再適応の得点に換算される","行動のS-R連合としてのみ扱われる"],"answer":"分析の素材となり、無意識の現れとされる","exp":"語られた内容は分析の素材であり、クライエントの無意識の現れとされる。","topic":"精神分析","id":"gai_mc_127"},{"q":"DSM-IV-TRで転換性障害が含まれると記載されているものはどれか。","options":["身体表現障害","不安症候群","人格障害","社会的引きこもり"],"answer":"身体表現障害","exp":"転換性障害はDSM-IV-TRでは「身体表現障害」に含まれると記載されている。","topic":"臨床","id":"gai_mc_128"},{"q":"セリエが「ストレス」と総称したものの組合せはどれか。","options":["外部からの刺激（ストレッサー）と、それに伴う反応（ストレス反応）","一次的評価と二次的評価","問題焦点型と情動焦点型コーピング","手段的サポートと情報的サポート"],"answer":"外部からの刺激（ストレッサー）と、それに伴う反応（ストレス反応）","exp":"セリエは、外部からの刺激とそれに伴う反応を総じて「ストレス」と定義した。","topic":"ストレス","id":"gai_mc_129"},{"q":"社会的再適応評価尺度で、再適応の労力を数量で表したものを何というか。","options":["マグニチュード","デイリーハッスル","コーピングの柔軟性","疾病利得"],"answer":"マグニチュード","exp":"社会的再適応評価尺度では、再適応の労力をマグニチュードという数量で表す。","topic":"ストレス","id":"gai_mc_130"},{"q":"ハウスがソーシャルサポートを分類する際に用いた二次元の組合せはどれか。","options":["直接的－間接的、道具的－情緒的","一次的－二次的、問題焦点型－情動焦点型","個人的－集合的、意識－無意識","活動－参加、環境因子－個人因子"],"answer":"直接的－間接的、道具的－情緒的","exp":"ハウスは、直接的－間接的、道具的－情緒的という二次元から4種類のサポートを分類した。","topic":"ソーシャルサポート","id":"gai_mc_131"},{"q":"人格障害で用いられていると考えられる防衛機制として記載されているものはどれか。","options":["分裂","投影の引き戻し","直面","転移"],"answer":"分裂","exp":"人格障害では、分裂という防衛機制を使用していると考えられると記載されている。","topic":"人格","id":"gai_mc_132"},{"q":"境界性人格障害の対人関係の特徴として示されているものはどれか。","options":["不信感が募り、依存と攻撃を繰り返す","一貫して他者との距離を保つ","他者への共感が過度に高まる","社会的再適応の労力が低下する"],"answer":"不信感が募り、依存と攻撃を繰り返す","exp":"他者を信頼しようとしても不信感が募り、依存と攻撃を繰り返すことがある。","topic":"人格","id":"gai_mc_133"},{"q":"境界性人格障害の原因として挙げられているものの組合せはどれか。","options":["先天的なストレス脆弱性・幼少期の過度なストレス経験・社会文化的要因","再生率・反応時間・刺激語","活動・参加・環境因子","警告反応期・抵抗期・疲憊期"],"answer":"先天的なストレス脆弱性・幼少期の過度なストレス経験・社会文化的要因","exp":"先天的な脆弱性、幼少期の過度のストレス経験、社会文化的要因などが関与するとされる。","topic":"人格","id":"gai_mc_134"},{"q":"自己愛性人格障害の対人行動として挙げられているものはどれか。","options":["自分の目標達成のために不当に他者を利用する","過去の重要人物への感情をセラピストへ向ける","同性の友人との交流を避ける","ストレッサーを数量化する"],"answer":"自分の目標達成のために不当に他者を利用する","exp":"傲慢な態度や、不当に他者を利用することなどが特徴として挙げられている。","topic":"人格","id":"gai_mc_135"},{"q":"社会的引きこもりの定義に含まれる条件として適切なのはどれか。","options":["他の精神障害が第一原因とは考えにくい","必ず転換性障害を伴う","必ず人格障害が第一原因である","社会参加していない期間は問わない"],"answer":"他の精神障害が第一原因とは考えにくい","exp":"6か月以上社会参加していないことに加え、他の精神障害が第一原因としては考えにくい場合と定義される。","topic":"青年期","id":"gai_mc_136"},{"q":"エディプス・コンプレックスに関連して生じると説明されている感情はどれか。","options":["同性の親を尊敬しながら敵意も抱くことへの罪悪感","配偶者の死への再適応の労力","刺激語への反応の遅れ","身体症状による疾病利得"],"answer":"同性の親を尊敬しながら敵意も抱くことへの罪悪感","exp":"同性の親を尊敬する一方で敵意を抱くことに罪悪感を持つと説明されている。","topic":"精神分析","id":"gai_mc_137"},{"q":"第2の分離固体化の分化期（10～12歳）について示されている特徴はどれか。","options":["自我とエスの間に不均衡が生じ、同性の友人との交流が重要になる","親との距離が安定し、安定した自己が完成する","物理的にも心理的にも親と距離を置き、友人に理想を見出す","母親と物理的に距離を置くが心理的には依存する"],"answer":"自我とエスの間に不均衡が生じ、同性の友人との交流が重要になる","exp":"10～12歳の分化期では、自我とエスの不均衡が生じ、同性の友人との交流が重要になる。","topic":"青年期","id":"gai_mc_138"},{"q":"第2の分離固体化の練習期（15～18歳頃）について適切なのはどれか。","options":["物理的にも心理的にも親と距離を置き、友人の中に理想像を見出す","母親と物理的に距離を置くが心理的には依存する","安定した自己が出来上がり親との距離が安定する","自我とエスの不均衡が中心となる"],"answer":"物理的にも心理的にも親と距離を置き、友人の中に理想像を見出す","exp":"15～18歳頃の練習期では、親と物理的・心理的に距離を置き、友人交流が活発となる。","topic":"青年期","id":"gai_mc_139"},{"q":"ヴントについて示されている説明はどれか。","options":["哲学から分離した科学として心理学を確立しようとした","無意識だけを研究対象とすべきとした","行動だけを研究対象とした","障害を社会的障壁だけから説明した"],"answer":"哲学から分離した科学として心理学を確立しようとした","exp":"ヴントは哲学から分離した科学としての心理学の確立に努めた。","topic":"心理学史","id":"gai_mc_140"},{"q":"ゲシュタルトという語の説明として最も適切なのはどれか。","options":["要素に還元できない、まとまりある全体の構造的特性","刺激と反応の単純な連合","意識・前意識・無意識の3層","障害を個人の問題とみなす考え方"],"answer":"要素に還元できない、まとまりある全体の構造的特性","exp":"ゲシュタルトは、要素に還元できない、まとまりのある一つの全体が持つ構造的特性を意味する。","topic":"心理学史","id":"gai_mc_141"},{"q":"ゲシュタルト心理学で、知覚の体制化に関して提唱された法則はどれか。","options":["プレグナンツの法則","S-R理論","汎適応症候群","社会的再適応評価尺度"],"answer":"プレグナンツの法則","exp":"知覚の体制化におけるプレグナンツの法則が提唱された。","topic":"心理学史","id":"gai_mc_142"},{"q":"フロイトが精神分析学で注目したものとして記載されているのはどれか。","options":["失錯行為","仮現運動","無意味綴り","社会的障壁"],"answer":"失錯行為","exp":"フロイトは人の失錯行為に注目し、無意識の存在を重視した。","topic":"精神分析","id":"gai_mc_143"}];const STORAGE_KEY='quiz_gairon_choice_v20260917';let state=loadState(STORAGE_KEY);
function norm(s){return (s||'').normalize('NFKC').toLowerCase().replace(/[\s　・･,，。．.、()（）\[\]【】「」『』:：;；/\\\-−―ー]/g,'')}
function loadState(key){try{return JSON.parse(localStorage.getItem(key))||{}}catch(e){return {}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function ensure(i){let id=QUESTIONS[i].id;if(!state[id])state[id]={attempts:0,correct:0,wrong:0,last:null};return state[id]}
function fisher(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let filter='all',idx=0,order=QUESTIONS.map((_,i)=>i),randomMode=false,session={answered:0,correct:0,wrong:0};
function matches(i){let r=ensure(i);if(filter==='unanswered')return !r.last;if(filter==='lastwrong')return r.last==='wrong';if(filter==='everwrong')return r.wrong>=1;if(filter==='wrong2')return r.wrong>=2;if(filter==='wrong3')return r.wrong>=3;return true}
function currentList(){return order.filter(matches)}
function updateStats(){let total=QUESTIONS.length,done=0,wrong=0;QUESTIONS.forEach((_,i)=>{let r=ensure(i);if(r.last)done++;wrong+=r.wrong||0});document.getElementById('sAnswered').textContent=session.answered;document.getElementById('sCorrect').textContent=session.correct;document.getElementById('cDone').textContent=done+'/'+total;document.getElementById('cWrong').textContent=wrong;document.getElementById('countLabel').textContent=currentList().length+'問表示'}
function setFilter(v){filter=v;idx=0;resetLocal();render()}
function toggleRandom(){randomMode=!randomMode;order=randomMode?fisher(QUESTIONS.map((_,i)=>i)):QUESTIONS.map((_,i)=>i);idx=0;document.getElementById('randomBtn').textContent=randomMode?'ランダムON':'ランダムOFF';resetLocal();render()}
function resetSession(){session={answered:0,correct:0,wrong:0};updateStats();alert('今回のセッション成績だけリセットしました。累積の学習記録は残っています。')}
function resetAll(){if(confirm('この問題集の累積学習記録をすべて消しますか？')){state={};saveState();session={answered:0,correct:0,wrong:0};idx=0;resetLocal();render()}}
function moveQ(d){let list=currentList();if(!list.length)return;idx=(idx+d+list.length)%list.length;resetLocal();render()}

let selected=null,revealed=false,displayOpts=[];
function resetLocal(){selected=null;revealed=false;displayOpts=[];let c=document.getElementById('card');if(c)c.dataset.qi=''}
function selectChoice(opt){if(revealed)return;selected=opt;render()}
function checkChoice(){if(revealed||selected===null)return;let qi=currentList()[idx],q=QUESTIONS[qi],r=ensure(qi);r.attempts++;session.answered++;if(selected===q.answer){r.correct++;r.last='correct';session.correct++}else{r.wrong++;r.last='wrong';session.wrong++}saveState();revealed=true;render()}
function retry(){revealed=false;selected=null;displayOpts=fisher(QUESTIONS[currentList()[idx]].options);render()}
function render(){updateStats();let list=currentList(),card=document.getElementById('card');if(!list.length){card.innerHTML='<div class="empty">この条件に当てはまる問題はありません。</div>';return}if(idx>=list.length)idx=0;let qi=list[idx],q=QUESTIONS[qi];if(card.dataset.qi!=qi||!displayOpts.length){selected=null;revealed=false;displayOpts=fisher(q.options);card.dataset.qi=qi}let ops=displayOpts.map(o=>{let c='opt';if(revealed&&o===q.answer)c+=' correct';else if(revealed&&o===selected&&o!==q.answer)c+=' wrong';else if(!revealed&&o===selected)c+=' selected';return `<button class="${c}" onclick='selectChoice(${JSON.stringify(o)})'>${o}</button>`}).join('');let fb='';if(revealed){let ok=selected===q.answer;fb=`<div class="feedback ${ok?'good':'bad'}"><div class="answer">${ok?'○ 正解':'× 不正解'}　正解：${q.answer}</div><div>${q.exp}</div><div class="topic">確認後の分類：${q.topic}</div></div>`}let checkBtn=!revealed?`<button class="primary" onclick="checkChoice()" ${selected===null?'disabled':''}>答え合わせ</button>`:'';card.innerHTML=`<div class="qno">${idx+1} / ${list.length}　（全${QUESTIONS.length}問）</div><div class="question">${q.q}</div><div class="options">${ops}</div><div style="margin-top:12px">${checkBtn}</div>${fb}<div class="nav"><button onclick="moveQ(-1)">← 前へ</button><button onclick="retry()">この問題を解き直す</button><button onclick="moveQ(1)">次へ →</button></div>`;updateStats()}
render();
</script></body></html>
