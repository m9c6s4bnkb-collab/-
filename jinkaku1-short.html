<script>const questions=[{"id":"jin1-s-001","q":"自分一人では気づきにくい『自分らしさ』を捉える観点を何というか。","answer":"自己理解の視点","aliases":[],"explanation":"自己理解の視点とは、自分一人では気づきにくい「自分らしさ」を捉えることである。","section":"1. 自己理解の視点"},{"id":"jin1-s-002","q":"自己理解の視点について、自分にとってあまりになじみ深い人格上の特徴は、何のように当然であるため改めて意識されにくいか。","answer":"空気","aliases":[],"explanation":"自分にとってあまりに「なじみ深いもの」は、空気のように「当然のこと」として、改めて意識されることは少ない。","section":"1. 自己理解の視点"},{"id":"jin1-s-003","q":"自己理解の視点について、自分の内面・態度・行動を映し出すものとして必要だとされる比喩は何か。","answer":"鏡","aliases":[],"explanation":"人間は自分一人で自分自身を見つめることは難しく、自分の内面、態度、行動を映し出す「鏡」が必要である。","section":"1. 自己理解の視点"},{"id":"jin1-s-004","q":"自己理解の視点について、自分の位置づけを知る方法として資料が挙げるものは何か。","answer":"他者との比較","aliases":[],"explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-s-005","q":"自己理解の視点について、周囲の人から意見や反応を受け取って自分を知る方法は何か。","answer":"他者からのフィードバック","aliases":[],"explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-s-006","q":"自己理解の視点について、『自分らしさ』が顕在化する場として、資料が重視するものは何か。","answer":"他者との関わり合い","aliases":[],"explanation":"このことから、「他者との比較」による自分の位置づけや、「他者からのフィードバック」による自己理解を通じて、「自分らしさ」とは他者との関わり合いの中で顕在化してくるものである。","section":"1. 自己理解の視点"},{"id":"jin1-s-007","q":"自己理解の視点について、自分自身の姿を客観的に捉えるために通すものは何か。","answer":"他者という鏡","aliases":[],"explanation":"他者という鏡を通じて初めて、私たちは自分自身の姿を客観的に捉えることが可能になるのである。","section":"1. 自己理解の視点"},{"id":"jin1-s-008","q":"自己理解の視点について、自覚されている面とともに『自分らしさ』がもつものは何か。","answer":"自分では自覚しにくい側面","aliases":[],"explanation":"自分らしさは自覚されている面もあるが、自分では自覚しにくい側面も持っている。","section":"1. 自己理解の視点"},{"id":"jin1-s-009","q":"ジョハリの窓について、対人関係における相互的な認識過程を表すモデルを提唱した人物は誰か。","answer":"ルフトとインガム","aliases":[],"explanation":"ルフトとインガムによって提唱された、対人関係における相互的な認識過程を表すモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-s-010","q":"自己と他者の認識を『知っている／知らない』で整理するモデルを何というか。","answer":"ジョハリの窓","aliases":[],"explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-s-011","q":"ジョハリの窓が自己理解・他者理解に用いる認識の軸はいくつか。","answer":"2つ","aliases":[],"explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-s-012","q":"ジョハリの窓で分類される自己の領域はいくつか。","answer":"4つ","aliases":[],"explanation":"ジョハリの窓は、自己と他者の認識を「知っている／知らない」の2次元で捉え、4つの領域に分類するモデルである。","section":"2. ジョハリの窓"},{"id":"jin1-s-013","q":"ジョハリの窓について、自分も他者も知っている公的な『私』に当たる領域はどれか。","answer":"開放領域","aliases":[],"explanation":"①開放領域は、自分も他者も知る公的な「私」。","section":"2. ジョハリの窓"},{"id":"jin1-s-014","q":"ジョハリの窓について、自分は知っているが他者には知られていない私的な『私』に当たる領域はどれか。","answer":"隠蔽領域","aliases":[],"explanation":"②隠蔽領域は、自分は知っているプライベートな「私」。","section":"2. ジョハリの窓"},{"id":"jin1-s-015","q":"ジョハリの窓について、他者だけが知り、自分では気づいていない『私』に当たる領域はどれか。","answer":"盲点領域","aliases":[],"explanation":"③盲点領域は、他者のみが知る自分では気づいていない「私」。","section":"2. ジョハリの窓"},{"id":"jin1-s-016","q":"ジョハリの窓について、自分も他者も気づいていない無意識下の『私』に当たる領域はどれか。","answer":"未知領域","aliases":[],"explanation":"④未知領域は、自分も他者も気づいていない無意識下の私を指す。","section":"2. ジョハリの窓"},{"id":"jin1-s-017","q":"ジョハリの窓について、開放領域を広げる3作用のうち、自分が知っている情報を他者へ伝える作用は何か。","answer":"自己開示","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-018","q":"ジョハリの窓について、開放領域を広げる3作用のうち、他者が把握している自分の特徴を伝えてもらう作用は何か。","answer":"フィードバック","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-019","q":"ジョハリの窓について、開放領域を広げる3作用のうち、自分も他者も知らなかった側面が明らかになる作用は何か。","answer":"発見","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-020","q":"ジョハリの窓について、3つの作用によって広がる領域はどれか。","answer":"開放領域","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-021","q":"ジョハリの窓について、開放領域が広がると、他の領域はどうなるか。","answer":"小さくなる","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-022","q":"ジョハリの窓について、開放領域の拡大によって深まるものの組合せはどれか。","answer":"対人関係と自己理解","aliases":[],"explanation":"このモデルは、「自己開示」、「フィードバック」、「発見」という3つの作用により開放領域が広がり、他の領域が小さくなることで、対人関係や自己理解が深まっていく。","section":"2. ジョハリの窓"},{"id":"jin1-s-023","q":"他者理解の視点について、人の知覚を、外界を受動的に写すだけではないと説明する際、否定される比喩は何か。","answer":"カメラ","aliases":[],"explanation":"他者理解の視点において、我々の知覚はカメラのように外界を単に受動的に写しているわけではない。","section":"3. 他者理解の視点"},{"id":"jin1-s-024","q":"他者理解の視点について、人が情報を照合するものとして挙げられているのは何か。","answer":"過去の経験","aliases":[],"explanation":"人間は過去の経験に照らし合わせ、情報を補足・加工しながら主体的・能動的に「認知的世界」を構成している。","section":"3. 他者理解の視点"},{"id":"jin1-s-025","q":"他者理解の視点について、人は情報を補足・加工しながら、何を主体的・能動的に構成するか。","answer":"認知的世界","aliases":[],"explanation":"人間は過去の経験に照らし合わせ、情報を補足・加工しながら主体的・能動的に「認知的世界」を構成している。","section":"3. 他者理解の視点"},{"id":"jin1-s-026","q":"他者理解の視点について、認知の歪みは、どの程度単純な刺激でも生じ得るか。","answer":"単なる図形のような刺激","aliases":[],"explanation":"そのため、単なる図形のような単純な刺激であっても認知の歪みは生じる。","section":"3. 他者理解の視点"},{"id":"jin1-s-027","q":"他者理解の視点について、人間という対象は、単純な図形と比べてどのような刺激だとされるか。","answer":"はるかに複雑な情緒刺激","aliases":[],"explanation":"ましてや人間という対象は、図形とは比較にならないほど複雑な情緒刺激である。","section":"3. 他者理解の視点"},{"id":"jin1-s-028","q":"他者理解の視点について、他者に関する情報を歪めやすい主観的フィルターとして、資料に挙げられている組合せはどれか。","answer":"価値観・先入観・感情・見方のくせ","aliases":[],"explanation":"そこには個人の価値観や先入観、感情、見方のくせなどが入り込みやすく、情報は容易に歪められてしまう。","section":"3. 他者理解の視点"},{"id":"jin1-s-029","q":"他者理解の視点について、正当な他者把握を妨げやすいものの総称として、資料が用いる表現は何か。","answer":"主観的なフィルター","aliases":[],"explanation":"自己理解が困難であるのと同様に、他者理解もまた、こうした主観的なフィルターによって正当な把握が妨げられやすい、極めて困難な課題なのである。","section":"3. 他者理解の視点"},{"id":"jin1-s-030","q":"性格や人格が初めて観察可能になるのは、何に反映されたときか。","answer":"行動","aliases":[],"explanation":"性格（人格）は、行動に反映された時に初めて観察可能となる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-031","q":"行動傾向としてのパーソナリティについて、人間の行動を変化させる温度に関わる環境条件の例は何か。","answer":"暑さ","aliases":[],"explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-032","q":"行動傾向としてのパーソナリティについて、暑さと並び、人間の行動を変化させる環境条件の例として資料に挙げられているものは何か。","answer":"空腹","aliases":[],"explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-033","q":"行動傾向としてのパーソナリティについて、類似した環境下で多くの人に共通して現れる面を何というか。","answer":"共通性","aliases":[],"explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-034","q":"行動傾向としてのパーソナリティについて、類似した環境下でも人によって異なって現れる面を何というか。","answer":"個人差","aliases":[],"explanation":"人間の行動は暑さや空腹といった環境条件によって変化するが、類似した環境下では、多くの人に共通する「共通性」と、人によって異なる「個人差」が現れる。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-035","q":"行動傾向としてのパーソナリティについて、同一状況下でさえ生じる差異を表す資料中の表現は何か。","answer":"個人的な差異","aliases":[],"explanation":"パーソナリティとは、行動や経験にある程度の共通性を備えつつも、同一状況下でさえ生じる「個人的な差異」を指す。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-036","q":"行動傾向としてのパーソナリティについて、人格の通状況的一貫性とは、状況が変わっても個人独自に何が現れることか。","answer":"一貫した特徴","aliases":[],"explanation":"この差異の中には、状況が変わってもその人独自に現れる「一貫した特徴」がある。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-037","q":"パーソナリティ概念によって行うこととして挙げられている組合せはどれか。","answer":"個人の独自性の理解・説明・予測","aliases":[],"explanation":"こうした個人の独自性を理解し、説明や予測を行うために必要とされるのがパーソナリティという概念である。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-038","q":"行動傾向としてのパーソナリティについて、変容する環境の中でも保たれる核心を表す言葉は何か。","answer":"その人らしさ","aliases":[],"explanation":"つまり、変容する環境の中で保たれる「その人らしさ」の核心を行動から捉えようとするものである。","section":"4. 行動傾向としてのパーソナリティ"},{"id":"jin1-s-039","q":"パーソナリティを三層構造で捉えた人物は誰か。","answer":"大山","aliases":[],"explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-040","q":"人格を示す三層構造を構成する概念の組合せはどれか。","answer":"気質・性格・人格","aliases":[],"explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-041","q":"気分・テンポ・刺激への感受性など、生物学的側面が強い先天的な基礎部分を指す概念はどれか。","answer":"気質","aliases":[],"explanation":"まず「気質」は、気分やテンポ、刺激への感受性といった生物学的側面が強く、先天的な性格の基礎部分を指す。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-042","q":"個人を特徴づける、ある程度固定的で恒常的な基本的行動傾向を指す概念はどれか。","answer":"性格","aliases":[],"explanation":"次に「性格」は、その人を特徴づける基本的な行動傾向であり、ある程度固定的で恒常的な個人的特徴である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-043","q":"環境への適応機能を含む、個人の心身システムの動的で全体的な組織を指す概念はどれか。","answer":"人格","aliases":[],"explanation":"そして「人格」は、これらを含めた環境への適応機能の全体的特徴を指す。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-046","q":"知能や価値観まで包含する、性格より広い概念はどれか。","answer":"人格","aliases":[],"explanation":"大山の三層構造では、人格は気質と性格を含み、環境への適応機能、知能、価値観までを包含するため、性格より広い概念とされる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-047","q":"先天的な土台から統合的全体像へ至る順序として正しいものはどれか。","answer":"気質→性格→人格","aliases":[],"explanation":"大山によれば、パーソナリティは「気質」「性格」「人格」の三層構造で捉えることができる。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-048","q":"気質・性格・人格について、個人の行動や思考を決定するとされるものは何か。","answer":"心身システムのダイナミックな組織","aliases":[],"explanation":"これは、個人の行動や思考を決定する心身システムのダイナミックな組織であり、知能や価値観までをも包含する、性格よりも広い概念である。","section":"5. 気質・性格・人格（大山）"},{"id":"jin1-s-049","q":"古典的なパーソナリティ分類について、頭蓋骨の形から性格を分類する方法はどれか。","answer":"骨相学","aliases":[],"explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-050","q":"古典的なパーソナリティ分類について、顔や身体的特徴から人格を推測する方法はどれか。","answer":"人相学","aliases":[],"explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-051","q":"古典的なパーソナリティ分類について、書かれた文字の特徴から性格を判断する方法はどれか。","answer":"筆跡学","aliases":[],"explanation":"古典的なパーソナリティ分類には、頭蓋骨の形から性格を分類した骨相学、顔や身体的特徴から人格を推測する人相学、筆跡から性格を判断する筆跡学などがあげられる。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-052","q":"古典的なパーソナリティ分類について、血液の型と性格を対応づけようとする方法はどれか。","answer":"血液型性格判断","aliases":[],"explanation":"血液型性格判断も広く知られているが、研究では血液型と性格との明確な関連は認められていない。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-053","q":"古典的なパーソナリティ分類について、研究上、性格との明確な関連が認められていないものは何か。","answer":"血液型","aliases":[],"explanation":"血液型性格判断も広く知られているが、研究では血液型と性格との明確な関連は認められていない。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-054","q":"古典的なパーソナリティ分類について、古典的分類法の多くに乏しいとされるものは何か。","answer":"科学的根拠","aliases":[],"explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-055","q":"古典的なパーソナリティ分類について、科学的限界があっても、古典的分類が後世に与えた影響は何か。","answer":"パーソナリティ研究の発展への影響","aliases":[],"explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-056","q":"古典的なパーソナリティ分類について、古典的分類は、人間の何を理解しようとした最初期の試みとされるか。","answer":"個人差","aliases":[],"explanation":"これらの分類法は科学的根拠に乏しいものが多いが、人間の個人差を理解しようとした最初の試みとして、後のパーソナリティ研究の発展に影響を与えた。","section":"6. 古典的なパーソナリティ分類"},{"id":"jin1-s-057","q":"一定の原理で複数の典型を設定し、多様な性格をそこへ分類する考え方は何か。","answer":"類型論","aliases":[],"explanation":"類型論は、一定の原理に基づいて典型的な性格を複数設定し、現実の多様な性格を分類して理解しやすくする考え方である。","section":"7. 類型論"},{"id":"jin1-s-058","q":"人格の類型論の背景にあるものは何か。","answer":"ドイツ的人間学","aliases":[],"explanation":"ドイツ的人間学を背景とし、主に20世紀前半のヨーロッパで発展した。","section":"7. 類型論"},{"id":"jin1-s-059","q":"類型論について、主に発展した時期と地域の組合せはどれか。","answer":"20世紀前半のヨーロッパ","aliases":[],"explanation":"ドイツ的人間学を背景とし、主に20世紀前半のヨーロッパで発展した。","section":"7. 類型論"},{"id":"jin1-s-060","q":"類型論について、全体的な典型例を示すことによる長所は何か。","answer":"人の性格を容易に把握できる","aliases":[],"explanation":"全体的な典型例が示されているため、人の性格を容易に把握できる。","section":"7. 類型論"},{"id":"jin1-s-061","q":"類型論について、多様な人の性格を簡便に理解する際の長所は何か。","answer":"共通言語として役立つ","aliases":[],"explanation":"また、多様な人の性格を、簡便に理解する際の共通言語として有用である。","section":"7. 類型論"},{"id":"jin1-s-062","q":"類型論について、複数の典型の特徴を併せ持つ人を捉えにくいという限界は、何に関するものか。","answer":"中間型","aliases":[],"explanation":"しかし、その反面、複数の類型の特徴を持つ中間型は捉えることが難しい。","section":"7. 類型論"},{"id":"jin1-s-063","q":"類型論について、典型的性質へ注目するため起こりやすい問題は何か。","answer":"他の性質が無視されやすい","aliases":[],"explanation":"その類型に特徴的な性質をもっているかどうかが注目されるので、他の性質が無視されやすいといった限界もある。","section":"7. 類型論"},{"id":"jin1-s-064","q":"類型論について、代表例に含まれないものはどれか。","answer":"ロジャーズの自己理論","aliases":[],"explanation":"代表的な例として、クレッチマーの類型論やシェルドンの類型論、ユングの類型論、シュプランガーの類型論がある。したがって、選択肢の中で当てはまらないのは「ロジャーズの自己理論」である。","section":"7. 類型論"},{"id":"jin1-s-065","q":"人格の類型論が目指す主な目的は何か。","answer":"性格の理解を容易にすること","aliases":[],"explanation":"一定の原理に基づいて典型的な性格をいくつか設定し、現実の多様な性格をそこへ分類し、性格の理解を容易にしようとする考えである。","section":"7. 類型論"},{"id":"jin1-s-066","q":"クレッチマーの類型論について、多くの臨床経験から体型・気質・病前性格の関連を捉えた人物の職業は何か。","answer":"精神科医","aliases":[],"explanation":"精神科医であったクレッチマーは、多くの臨床経験から体型と気質、病前性格との間に相関関係を見出し、性格特性論を提唱した。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-067","q":"体型と気質、病前性格の相関を見いだした人物は誰か。","answer":"クレッチマー","aliases":[],"explanation":"精神科医であったクレッチマーは、多くの臨床経験から体型と気質、病前性格との間に相関関係を見出し、性格特性論を提唱した。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-068","q":"クレッチマーの類型論について、分裂気質および統合失調症と対応づけられた体型はどれか。","answer":"細長型","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-069","q":"クレッチマーの類型論について、循環（躁うつ）気質および躁うつ病と対応づけられた体型はどれか。","answer":"肥満型","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-070","q":"クレッチマーの類型論について、粘着気質およびてんかんと対応づけられた体型はどれか。","answer":"闘士型","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-072","q":"クレッチマーの類型論について、細長型に対応づけられ、非社交的・静か・鈍感さなどを示す気質はどれか。","answer":"分裂気質","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-073","q":"クレッチマーの類型論について、肥満型に対応づけられ、社交的・親切・温厚などを示す気質はどれか。","answer":"循環（躁うつ）気質","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-074","q":"クレッチマーの類型論について、闘士型に対応づけられ、頑固・精力的・几帳面などを示す気質はどれか。","answer":"粘着気質","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-076","q":"クレッチマーの類型論について、細長型・分裂気質との対応が示された病気はどれか。","answer":"統合失調症","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-077","q":"クレッチマーの類型論について、肥満型・循環気質との対応が示された病気はどれか。","answer":"躁うつ病","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-078","q":"クレッチマーの類型論について、闘士型・粘着気質との対応が示された病気はどれか。","answer":"てんかん","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-079","q":"クレッチマーによる体型・気質・病気の三つの対応表に含まれていない病気はどれか。","answer":"神経症","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。神経症は、この3つの対応に含まれない。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-080","q":"クレッチマーの類型論について、当初の臨床対象に限らず、後にはどのような人にも当てはまるとされたか。","answer":"健常者","aliases":[],"explanation":"クレッチマーは、細長型―分裂気質―統合失調症、肥満型―循環（躁うつ）気質―躁うつ病、闘士型―粘着気質―てんかんという3つの対応を示し、後に健常者にも当てはまるとした。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-081","q":"クレッチマーの類型論について、精神医学で長く受け入れられたのは、何を示す用語としてか。","answer":"病前性格","aliases":[],"explanation":"クレッチマーの類型論は、病前性格を示す用語として精神医学の中でも長く受け入れられ、人の性格に関する情報を端的に表現し共有していく手段としては今でも有効である。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-082","q":"クレッチマーの類型論について、現在でも有効とされる実用面は何か。","answer":"性格情報を端的に表現し共有できる","aliases":[],"explanation":"クレッチマーの類型論は、病前性格を示す用語として精神医学の中でも長く受け入れられ、人の性格に関する情報を端的に表現し共有していく手段としては今でも有効である。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-083","q":"クレッチマーの類型論で不明確とされる関係のうち、精神病を含むものはどれか。","answer":"気質と精神病の関係","aliases":[],"explanation":"しかし、気質と精神病の関係・体型と気質の関係が不明確であるなどの問題点もある。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-084","q":"クレッチマーの類型論で、因果関係が不明確だとされるものはどれか。","answer":"体型と気質の関係","aliases":[],"explanation":"しかし、気質と精神病の関係・体型と気質の関係が不明確であるなどの問題点もある。","section":"8. クレッチマーの類型論"},{"id":"jin1-s-085","q":"健常な男子大学生の身体計測を用いた類型論の提唱者は誰か。","answer":"シェルドン","aliases":[],"explanation":"シェルドンは、健常な男子大学生の身体計測に基づいて、体型と胎生期の胚や葉発達の統計的な関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-s-086","q":"シェルドンの類型論の調査対象はどのような人々だったか。","answer":"健常な男子大学生","aliases":[],"explanation":"シェルドンは、健常な男子大学生の身体計測に基づいて、体型と胎生期の胚や葉発達の統計的な関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-s-087","q":"シェルドンの類型論について、体型との統計的関連を検討した、胎生期の発達単位は何か。","answer":"胚葉","aliases":[],"explanation":"シェルドンは、健常な男子大学生の身体計測に基づき、体型と胎生期の胚葉発達との統計的関連から性格特性論を提唱した。","section":"9. シェルドンの類型論"},{"id":"jin1-s-088","q":"胚葉の発達と体型・性格を結びつけるシェルドンの理論は、別名何と呼ばれるか。","answer":"発生的類型論","aliases":[],"explanation":"発生的類型論とも呼ばれる。","section":"9. シェルドンの類型論"},{"id":"jin1-s-089","q":"シェルドンの類型論について、肥満型で、消化器系が発達した体型はどれか。","answer":"内胚葉型","aliases":[],"explanation":"具体的には、内胚葉型（肥満型）は消化器系発達の内臓型気質で、社交的、寛容などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-090","q":"シェルドンの類型論について、痩せ型で、神経系・感覚器系が発達した体型はどれか。","answer":"外胚葉型","aliases":[],"explanation":"外胚葉型（痩せ型）は神経系・感覚器系発達の頭脳型気質で、過激、心配症などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-091","q":"シェルドンの類型論について、筋肉と骨が発達した筋骨型はどれか。","answer":"中胚葉型","aliases":[],"explanation":"中胚葉型（筋骨型）は筋肉・骨が発達した身体型気質で、精力的、活動的などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-093","q":"シェルドンの類型論について、内胚葉型に対応し、社交的・寛容などを示す気質はどれか。","answer":"内臓型気質","aliases":[],"explanation":"具体的には、内胚葉型（肥満型）は消化器系発達の内臓型気質で、社交的、寛容などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-094","q":"シェルドンの類型論について、外胚葉型に対応し、過激・心配症などを示す気質はどれか。","answer":"頭脳型気質","aliases":[],"explanation":"外胚葉型（痩せ型）は神経系・感覚器系発達の頭脳型気質で、過激、心配症などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-095","q":"シェルドンの類型論について、中胚葉型に対応し、精力的・活動的などを示す気質はどれか。","answer":"身体型気質","aliases":[],"explanation":"中胚葉型（筋骨型）は筋肉・骨が発達した身体型気質で、精力的、活動的などである。","section":"9. シェルドンの類型論"},{"id":"jin1-s-100","q":"シェルドンの類型論について、クレッチマーの考え方と共通して指摘される問題は何か。","answer":"体型変化と気質変化の関係","aliases":[],"explanation":"クレッチマーの類型論と類似しており、体型変化と気質変化に関する問題点が挙げられる。","section":"9. シェルドンの類型論"},{"id":"jin1-s-101","q":"シェルドンの類型論について、クレッチマーと比べて評価されている対象上の特徴は何か。","answer":"健常者の性格を対象にしたこと","aliases":[],"explanation":"クレッチマーは精神病患者の病前性格からの出発に対し、シェルドンは健常者の性格を対象としてより広範囲かつ実証的に調査したという点で評価されている。","section":"9. シェルドンの類型論"},{"id":"jin1-s-102","q":"シェルドンの類型論について、クレッチマーと比べて評価されている調査上の特徴は何か。","answer":"より広範囲かつ実証的に調査したこと","aliases":[],"explanation":"クレッチマーは精神病患者の病前性格からの出発に対し、シェルドンは健常者の性格を対象としてより広範囲かつ実証的に調査したという点で評価されている。","section":"9. シェルドンの類型論"},{"id":"jin1-s-103","q":"心的エネルギーの方向と心の機能を組み合わせた分類の提唱者は誰か。","answer":"ユング","aliases":[],"explanation":"ユングの類型論とは、人の性格を「心的エネルギー(リビドー)の向かう方向」と「心の機能」の組み合わせによって分類する理論である。","section":"10. ユングの類型論"},{"id":"jin1-s-104","q":"ユングの向性による分類で、心的エネルギーを表す用語は何か。","answer":"リビドー","aliases":[],"explanation":"ユングの類型論とは、人の性格を「心的エネルギー(リビドー)の向かう方向」と「心の機能」の組み合わせによって分類する理論である。","section":"10. ユングの類型論"},{"id":"jin1-s-105","q":"ユングの類型論について、心的エネルギーが外の世界へ向かう型はどれか。","answer":"外向型","aliases":[],"explanation":"ユングは、心的エネルギーが外の世界に向かう外向型と、内面の世界に向かう内向型の2つを区別した。","section":"10. ユングの類型論"},{"id":"jin1-s-106","q":"ユングの類型論について、心的エネルギーが内面の世界へ向かう型はどれか。","answer":"内向型","aliases":[],"explanation":"ユングは、心的エネルギーが外の世界に向かう外向型と、内面の世界に向かう内向型の2つを区別した。","section":"10. ユングの類型論"},{"id":"jin1-s-107","q":"ユングの類型論について、判断する機能の組合せはどれか。","answer":"思考と感情","aliases":[],"explanation":"さらに、心の機能を、物事を判断する思考と感情、情報を受け取る感覚と直観の4つに分類した。","section":"10. ユングの類型論"},{"id":"jin1-s-108","q":"ユングの類型論について、情報を受け取る機能の組合せはどれか。","answer":"感覚と直観","aliases":[],"explanation":"さらに、心の機能を、物事を判断する思考と感情、情報を受け取る感覚と直観の4つに分類した。","section":"10. ユングの類型論"},{"id":"jin1-s-109","q":"ユングの類型論について、最も発達した心の機能を何というか。","answer":"優越機能","aliases":[],"explanation":"これらの機能には最も発達した優越機能と、その対極にある劣等機能が存在すると考えた。","section":"10. ユングの類型論"},{"id":"jin1-s-110","q":"ユングの類型論について、最も発達した機能の対極にあるものを何というか。","answer":"劣等機能","aliases":[],"explanation":"これらの機能には最も発達した優越機能と、その対極にある劣等機能が存在すると考えた。","section":"10. ユングの類型論"},{"id":"jin1-s-111","q":"ユングの類型論について、二つの方向と四つの機能を組み合わせると、性格類型はいくつになるか。","answer":"8つ","aliases":[],"explanation":"ユングは、外向・内向と4つの心的機能を組み合わせ、外向的思考型や内向的感情型などの8つの性格類型を提唱した。","section":"10. ユングの類型論"},{"id":"jin1-s-112","q":"ユングの類型論について、意識と無意識はどのような関係にあると考えられたか。","answer":"相補的な関係","aliases":[],"explanation":"また、意識と無意識は相補的な関係にあり、心の問題は抑圧された無意識的側面が自己の全体性を回復しようとする働きによって生じると考えた。","section":"10. ユングの類型論"},{"id":"jin1-s-113","q":"ユングの類型論について、心の問題が生じる背景として、抑圧された側面が何を回復しようとするとされたか。","answer":"自己の全体性","aliases":[],"explanation":"また、意識と無意識は相補的な関係にあり、心の問題は抑圧された無意識的側面が自己の全体性を回復しようとする働きによって生じると考えた。","section":"10. ユングの類型論"},{"id":"jin1-s-114","q":"基本的生活領域のどこへ価値を置くかで性格を分類した人物は誰か。","answer":"シュプランガー","aliases":[],"explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-115","q":"シュプランガーの価値類型はいくつ設定されているか。","answer":"6つ","aliases":[],"explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-116","q":"シュプランガーの類型論について、客観的・論理的な知識体系を創造することに価値を置く類型はどれか。","answer":"理論型","aliases":[],"explanation":"①客観的に見て論理的知識体系を想像することに価値を置く理論型。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-117","q":"シュプランガーの類型論について、事物の経済性や功利性を重視する類型はどれか。","answer":"経済型","aliases":[],"explanation":"②事物の経済性や功利性を重視する経済型。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-118","q":"シュプランガーの類型論について、繊細で敏感であり、美しいものに価値を置く類型はどれか。","answer":"審美型","aliases":[],"explanation":"③繊細で敏感、美しいものに価値を置く審美型。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-119","q":"シュプランガーの類型論について、神への奉仕や宗教体験を重視する類型はどれか。","answer":"宗教型","aliases":[],"explanation":"④神への奉仕、宗教体験を重視する宗教型。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-120","q":"シュプランガーの類型論について、権力を求め、他人を支配しようとする類型はどれか。","answer":"権力型","aliases":[],"explanation":"⑤権力を求め、他人を支配しようとする権力型。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-121","q":"シュプランガーの類型論について、人間を愛し、人を進歩させることに価値を置く類型はどれか。","answer":"社会型","aliases":[],"explanation":"⑥人間を愛し、進歩させることに価値を置く社会型、である。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-122","q":"シュプランガーの類型論について、各人が志向する文化価値を規定することが多いものとして挙げられているのは何か。","answer":"職業など","aliases":[],"explanation":"各自の志向する文化価値は職業等によっても規定される部分が多い。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-123","q":"シュプランガーの類型論について、現実の個人を一つの型に決められないことがあるのはなぜか。","answer":"複数の価値志向をもつことがあるため","aliases":[],"explanation":"現実の個人には複数の価値志向があって、型を決定できないこともある。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-124","q":"シュプランガーの価値類型論は何を分類基準とするか。","answer":"最も価値を置く生活領域","aliases":[],"explanation":"シュプランガーは、個人が基本的生活領域のどの領域に最も価値を置くかにより性格を6類型に分けた。","section":"11. シュプランガーの類型論"},{"id":"jin1-s-125","q":"性格形成で社会体制を重視した人物は誰か。","answer":"フロム","aliases":[],"explanation":"フロムは、性格形成に影響する要因として社会体制を重視し、性格形成において社会や経済の仕組みが個人の性格を規定した。","section":"12. フロムの類型論"},{"id":"jin1-s-126","q":"フロムの類型論で個人の性格を規定すると重視されたものは何か。","answer":"社会や経済の仕組み","aliases":[],"explanation":"フロムは、性格形成に影響する要因として社会体制を重視し、性格形成において社会や経済の仕組みが個人の性格を規定した。","section":"12. フロムの類型論"},{"id":"jin1-s-127","q":"フロムの類型論について、社会的な在り方に基づく性格類型はいくつか。","answer":"5つ","aliases":[],"explanation":"彼は人間の性格を、その社会的な在り方に基づき5つのタイプに分類した。","section":"12. フロムの類型論"},{"id":"jin1-s-128","q":"フロムの類型論について、労働階級の労働を不当に利用するとされた資本家にみられる型はどれか。","answer":"搾取的性格","aliases":[],"explanation":"①労働階級の労働を不当に搾取するとされた資本家にみられる搾取的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-129","q":"フロムの類型論について、金銭や利権をため込んで安心を得ようとする型はどれか。","answer":"貯蔵的性格","aliases":[],"explanation":"②金銭・利権をため込んで安心(保障)を獲得しようとする貯蔵的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-130","q":"フロムの類型論について、所得格差・生活水準の違い・主従関係を従順に受け入れ、抵抗できない政治的従属者に多い型はどれか。","answer":"受容的性格","aliases":[],"explanation":"③資本家と労働者の階級闘争の結果、「所得格差や生活水準の違い・主従関係」を従順に受け入れて抵抗することのできない政治的従属者に多い受容的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-131","q":"フロムの類型論について、能力・才能・権力を社会全体の利益や発展のため利他的に用いる型はどれか。","answer":"生産的性格","aliases":[],"explanation":"④自己の能力・才能・権力を「社会全体の利益・発展」のために利他的に用いる生産的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-132","q":"フロムの類型論について、市場の受容に合わせて自分の価値観や能力を適応的に変える、資本主義社会に典型的な型はどれか。","answer":"市場的性格","aliases":[],"explanation":"⑤市場の受容に合わせて自分の価値観や能力を適応的に変化させる、資本主義社会に典型的な市場的性格、である。","section":"12. フロムの類型論"},{"id":"jin1-s-133","q":"フロムの類型論について、安心を得るためにため込むものの組合せはどれか。","answer":"金銭と利権","aliases":[],"explanation":"②金銭・利権をため込んで安心(保障)を獲得しようとする貯蔵的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-134","q":"フロムの類型論について、従順に受け入れるものとして挙げられた三つの組合せはどれか。","answer":"所得格差・生活水準の違い・主従関係","aliases":[],"explanation":"③資本家と労働者の階級闘争の結果、「所得格差や生活水準の違い・主従関係」を従順に受け入れて抵抗することのできない政治的従属者に多い受容的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-135","q":"フロムの類型論について、利他的に用いるものとして挙げられた三つの組合せはどれか。","answer":"能力・才能・権力","aliases":[],"explanation":"④自己の能力・才能・権力を「社会全体の利益・発展」のために利他的に用いる生産的性格。","section":"12. フロムの類型論"},{"id":"jin1-s-137","q":"基本的な対人関係の態度に注目した人物は誰か。","answer":"ホーナイ","aliases":[],"explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-s-138","q":"ホーナイの類型論が分類基準としたものは何か。","answer":"基本的な対人関係の態度","aliases":[],"explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-s-139","q":"ホーナイの類型論について、設定された対人関係の型はいくつか。","answer":"3つ","aliases":[],"explanation":"ホーナイの類型論とは、基本的な対人関係の態度に着目し、人の性格を攻撃型・依存型・離反型の3つに分類する理論である。","section":"13. ホーナイの類型論"},{"id":"jin1-s-140","q":"ホーナイの類型論について、外向的・積極的で、対立を恐れず自己主張し、目標達成を目指す型はどれか。","answer":"攻撃型","aliases":[],"explanation":"攻撃型は、外向的で積極的な性格傾向をもち、他者との対立を恐れず自己主張を行い、目標達成を目指すタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-s-141","q":"ホーナイの類型論について、同調的・消極的で、他者や集団の期待に応えて不安や緊張を和らげる型はどれか。","answer":"依存型","aliases":[],"explanation":"依存型は、同調的で消極的な傾向をもち、他者や集団の期待に応えることで不安や緊張を和らげようとするタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-s-142","q":"ホーナイの類型論について、内向的で独立志向が強く、対人関係や競争を避けて内的世界を重視する型はどれか。","answer":"離反型","aliases":[],"explanation":"離反型は、内向的で独立志向が強く、対人関係や競争を避け、自分の内的世界を重視するタイプである。","section":"13. ホーナイの類型論"},{"id":"jin1-s-144","q":"ホーナイの類型論について、三つの対人関係パターンを人が形成する目的は何か。","answer":"不安に対処するため","aliases":[],"explanation":"ホーナイは、人は不安に対処するためにこれらの対人関係のパターンを形成すると考えた。","section":"13. ホーナイの類型論"},{"id":"jin1-s-148","q":"人々が共通して持つ性格特徴と、各特徴の組合せによって個人を理解する考え方は何か。","answer":"特性論","aliases":[],"explanation":"特性論とは、人が共通して持つ性格特性(特性)に注目し、その組み合わせの結果によって個人のパーソナリティを理解しようとする考え方である。","section":"14. 特性論"},{"id":"jin1-s-149","q":"人格の特性論では、個人差を何の差として捉えるか。","answer":"特性の程度","aliases":[],"explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-s-150","q":"特性論について、個人差を程度の差として扱うため適している研究の組合せはどれか。","answer":"実証的・統計的研究","aliases":[],"explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-s-151","q":"人格の特性論には、性格把握の細かさに関してどのような長所があるか。","answer":"性格を詳細に把握できる","aliases":[],"explanation":"個人差を特性の程度の差として捉えるため、実証的・統計的な研究に適しており、性格を詳細に把握できる。","section":"14. 特性論"},{"id":"jin1-s-152","q":"特性論について、課題として捉えにくいとされるものは何か。","answer":"性格全体のまとまり","aliases":[],"explanation":"しかし、個人の性格全体のまとまりや個性的な特徴などの独自性を捉えにくいという課題もある。","section":"14. 特性論"},{"id":"jin1-s-153","q":"人格の特性論で、全体性と並んで捉えにくいとされるものは何か。","answer":"個性的な特徴などの独自性","aliases":[],"explanation":"しかし、個人の性格全体のまとまりや個性的な特徴などの独自性を捉えにくいという課題もある。","section":"14. 特性論"},{"id":"jin1-s-154","q":"特性論について、代表的理論に含まれないものはどれか。","answer":"クレッチマーの類型論","aliases":[],"explanation":"代表的な理論には、キャッテルの特性論、アイゼンクの特性論、ビッグファイブ理論がある。したがって、選択肢の中で当てはまらないのは「クレッチマーの類型論」である。","section":"14. 特性論"},{"id":"jin1-s-155","q":"特性論について、複数の性格特性をどのように扱って人格を理解するか。","answer":"組み合わせとして扱う","aliases":[],"explanation":"特性論とは、人が共通して持つ性格特性(特性)に注目し、その組み合わせの結果によって個人のパーソナリティを理解しようとする考え方である。","section":"14. 特性論"},{"id":"jin1-s-156","q":"『性格特性』という概念を初めて使用した人物は誰か。","answer":"オールポート","aliases":[],"explanation":"オールポートは、「性格特性」という概念を初めて使用し、特性論的性格理論を体系化した人物である。","section":"15. オールポートの特性論"},{"id":"jin1-s-157","q":"特性論的な性格理論を体系化した人物は誰か。","answer":"オールポート","aliases":[],"explanation":"オールポートは、「性格特性」という概念を初めて使用し、特性論的性格理論を体系化した人物である。","section":"15. オールポートの特性論"},{"id":"jin1-s-158","q":"オールポートの特性論について、一人の個人に特有の特徴を指すものはどれか。","answer":"個別特性","aliases":[],"explanation":"彼は性格特性を、個人に特有の特徴である個別特性と、多くの人に共通する特徴である共通特性に分類した。","section":"15. オールポートの特性論"},{"id":"jin1-s-159","q":"オールポートの特性論について、多くの人に共通してみられる特徴を指すものはどれか。","answer":"共通特性","aliases":[],"explanation":"彼は性格特性を、個人に特有の特徴である個別特性と、多くの人に共通する特徴である共通特性に分類した。","section":"15. オールポートの特性論"},{"id":"jin1-s-160","q":"オールポートの特性論について、共通特性を分けたうち、4つ設定された側面を指すものはどれか。","answer":"表出的特性","aliases":[],"explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-161","q":"オールポートの特性論について、共通特性を分けたうち、10設定された側面を指すものはどれか。","answer":"態度的特性","aliases":[],"explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-162","q":"オールポートの特性論について、共通特性のうち、表出的なものはいくつに分けられたか。","answer":"4つ","aliases":[],"explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-163","q":"オールポートの特性論について、共通特性のうち、態度的なものはいくつに分けられたか。","answer":"10","aliases":[],"explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-164","q":"オールポートの特性論について、諸特性の程度を測定してプロフィール化したものを何というか。","answer":"サイコグラフ","aliases":["心誌"],"explanation":"さらに、共通特性を4つの表出的特性と10の態度的特性に分け、それらの程度を測定してプロフィール化することで、個人のパーソナリティを記述する心詩(サイコグラフ)を作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-165","q":"オールポートが作成したサイコグラフは、何を記述するためのものか。","answer":"個人のパーソナリティ","aliases":[],"explanation":"オールポートは、共通特性の程度を測定してプロフィール化し、個人のパーソナリティを記述するサイコグラフを作成した。","section":"15. オールポートの特性論"},{"id":"jin1-s-166","q":"オールポートらの特性論で用いられた特性の選定方法には、どのような問題があったか。","answer":"便宜的に選定されたこと","aliases":[],"explanation":"しかし、用いられた性格特性はオールポートが便宜的に選定したものであり、その妥当性には課題が残されている。","section":"15. オールポートの特性論"},{"id":"jin1-s-167","q":"オールポートの特性論について、特性が便宜的に選ばれたため残された課題は何か。","answer":"妥当性","aliases":[],"explanation":"しかし、用いられた性格特性はオールポートが便宜的に選定したものであり、その妥当性には課題が残されている。","section":"15. オールポートの特性論"},{"id":"jin1-s-168","q":"オールポートの考えを基礎に因子分析を用いた人物は誰か。","answer":"キャッテル","aliases":[],"explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-169","q":"キャッテルは、オールポートの特性論を基礎として、性格特性をどの2種類に分類したか。","answer":"独自特性と共通特性","aliases":[],"explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-170","q":"キャッテルの特性論について、外から直接観察できる行動特徴の集まりはどれか。","answer":"表面特性","aliases":[],"explanation":"表面特性とは、外から観察できる行動特徴の集まりである。","section":"16. キャッテルの特性論"},{"id":"jin1-s-171","q":"キャッテルの特性論について、直接には観察されず、複数の行動特徴の背後に想定されるものはどれか。","answer":"根源特性","aliases":[],"explanation":"根源特性とは、直接観察はされず、複数の表面特性の背後にあると想定される特性である。","section":"16. キャッテルの特性論"},{"id":"jin1-s-172","q":"キャッテルの特性論について、個人に特有の特徴として分類されたものはどれか。","answer":"独自特性","aliases":[],"explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-173","q":"キャッテルの特性論について、多くの人に共通する特徴として分類されたものはどれか。","answer":"共通特性","aliases":[],"explanation":"キャッテルは、オールポートの特性論を基礎として、性格特性を独自特性と共通特性に分類した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-174","q":"キャッテルの特性論について、因子分析で当初抽出された表面特性はいくつか。","answer":"35","aliases":[],"explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-175","q":"キャッテルの特性論について、当初提唱された根源特性はいくつか。","answer":"12","aliases":[],"explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-176","q":"キャッテルの特性論について、当初の根源特性へ後から追加された特性はいくつか。","answer":"4つ","aliases":[],"explanation":"その後、4つの特性を追加し、最終的に16の根源特性を見出した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-177","q":"キャッテルの特性論について、最終的に見いだされた根源特性はいくつか。","answer":"16","aliases":[],"explanation":"その後、4つの特性を追加し、最終的に16の根源特性を見出した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-178","q":"キャッテルの特性論について、最終的な根源特性を測定するために作成された検査は何か。","answer":"16PF人格検査","aliases":["16PF性格検査","16PF"],"explanation":"この16の根源特性を測定するために作成されたのが16PF人格検査である。","section":"16. キャッテルの特性論"},{"id":"jin1-s-180","q":"キャッテルの特性論で、特性抽出に使われた統計的方法は何か。","answer":"因子分析","aliases":[],"explanation":"さらに、因子分析を用いて35の表面特性と12の根源特性を提唱した。","section":"16. キャッテルの特性論"},{"id":"jin1-s-181","q":"類型論と特性論の両方を取り入れた人物は誰か。","answer":"アイゼンク","aliases":[],"explanation":"アイゼンクは、類型論と特性論の両方の考え方を取り入れ、パーソナリティを4つの水準からなる階層構造として捉えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-182","q":"アイゼンクの特性論について、パーソナリティをいくつの水準からなる階層構造として捉えたか。","answer":"4つ","aliases":[],"explanation":"アイゼンクは、類型論と特性論の両方の考え方を取り入れ、パーソナリティを4つの水準からなる階層構造として捉えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-183","q":"アイゼンクの特性論について、日常生活における個人の一回ごとの具体的行動で、階層の最下位にあるものはどれか。","answer":"特殊的反応","aliases":[],"explanation":"最も下位には、日常生活における個人の具体的な行動である特殊的反応があり、それらが繰り返されることで習慣的反応となる。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-184","q":"アイゼンクの特性論について、具体的行動が繰り返されることで形成されるものはどれか。","answer":"習慣的反応","aliases":[],"explanation":"最も下位には、日常生活における個人の具体的な行動である特殊的反応があり、それらが繰り返されることで習慣的反応となる。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-185","q":"複数の習慣的反応の背後に存在するとされるものはどれか。","answer":"特性","aliases":[],"explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-186","q":"アイゼンクの特性論について、複数の特性の背後にある、最上位の因子はどれか。","answer":"類型","aliases":[],"explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-187","q":"アイゼンクの特性論について、階層を下位から上位へ並べた正しい順序はどれか。","answer":"特殊的反応→習慣的反応→特性→類型","aliases":[],"explanation":"さらに、複数の習慣的反応の背後には特性が存在し、その特性の背後にはより上位の因子である類型があると考えた。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-188","q":"アイゼンクが示した三つの類型次元の組合せはどれか。","answer":"外向性―内向性・神経症的傾向・精神病的傾向","aliases":[],"explanation":"アイゼンクは多様な性格特性を、「外向性―内向性」「神経症的傾向」、「精神病的傾向」の3つの類型次元に整理した。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-189","q":"アイゼンクの特性論について、三つの類型次元に含まれないものはどれか。","answer":"開放性","aliases":[],"explanation":"アイゼンクは多様な性格特性を、「外向性―内向性」「神経症的傾向」、「精神病的傾向」の3つの類型次元に整理した。したがって、選択肢の中で当てはまらないのは「開放性」である。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-190","q":"アイゼンクの特性論について、外向性―内向性の生理学的基礎として想定されたものは何か。","answer":"大脳皮質の興奮・抑制","aliases":[],"explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-191","q":"アイゼンクの特性論について、神経症的傾向の生理学的基礎として想定されたものは何か。","answer":"自律神経系の活動","aliases":[],"explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-192","q":"アイゼンクの特性論について、二つの生理的次元を取り上げて作成された検査は何か。","answer":"MPI（モーズレイ性格検査）","aliases":["MPI","モーズレイ性格検査"],"explanation":"このうち、大脳皮質の興奮・抑制である「外向性―内向性」と自律神経系の活動を想定する「神経症的傾向」を取り上げ、MPI（モーズレイ性格検査）が作成された。","section":"17. アイゼンクの特性論"},{"id":"jin1-s-193","q":"5因子モデルについて、語彙研究と因子分析で性格特性を五次元に整理した人物は誰か。","answer":"ゴールドバーグ","aliases":[],"explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-194","q":"5因子モデルについて、ゴールドバーグらの語彙研究が発展させたのは、誰以来の特性研究か。","answer":"オールポート","aliases":[],"explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-195","q":"パーソナリティを基本的な五特性で説明する枠組みを何というか。","answer":"5因子モデル","aliases":["ビッグファイブ","ビッグファイブ理論"],"explanation":"このように5つの特性でパーソナリティを捉える理論的枠組みを5因子モデルという。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-196","q":"5因子モデルについて、活動的である傾向はどの特性か。","answer":"外向性","aliases":[],"explanation":"①活動的な傾向である外向性。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-197","q":"5因子モデルについて、不安・抑うつ・傷つきやすさを示す傾向はどの特性か。","answer":"神経症傾向","aliases":[],"explanation":"②不安や抑うつ、傷つきやすい傾向である神経症傾向。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-198","q":"5因子モデルについて、新しい物事を求める傾向はどの特性か。","answer":"開放性","aliases":[],"explanation":"③新しい物事を求める傾向である開放性。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-199","q":"5因子モデルについて、共感性や優しさを表す傾向はどの特性か。","answer":"調和性（協調性）","aliases":[],"explanation":"④共感性や優しさを意味する調和性(協調性)。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-200","q":"5因子モデルについて、真面目さや努力家であることを表す傾向はどの特性か。","answer":"誠実性（勤勉性）","aliases":[],"explanation":"⑤真面目さや努力家を意味する誠実性(勤勉性)である。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-201","q":"5因子モデルについて、五つの基本特性を用いる理論的枠組みの別名は何か。","answer":"ビッグファイブ理論","aliases":["ビッグファイブ"],"explanation":"ビッグファイブ理論とは、パーソナリティを5つの基本的な特性によって説明する理論である。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-202","q":"人格の5因子モデルを発展させた研究者の組合せはどれか。","answer":"コスタとマックレー","aliases":[],"explanation":"また、コスタとマックレーはこのモデルを発展させ、その理論に基づく人格検査としてネオ人格目録改訂版(NEO-PI-R)を開発した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-203","q":"5因子モデルについて、発展した五因子モデルに基づいて開発された人格検査は何か。","answer":"NEO-PI-R","aliases":["ネオ人格目録改訂版"],"explanation":"また、コスタとマックレーはこのモデルを発展させ、その理論に基づく人格検査としてネオ人格目録改訂版(NEO-PI-R)を開発した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-204","q":"5因子モデルについて、五つの特性を整理するために用いられた二つの方法は何か。","answer":"語彙研究と因子分析","aliases":[],"explanation":"ゴールドバーグは、オールポート以来の特性研究を発展させ、語彙研究と因子分析によって特性を5つの次元に整理した。","section":"18. 5因子モデル（ビッグファイブ）"},{"id":"jin1-s-205","q":"一貫性論争について、特性と行動の関連の弱さを指摘して議論の契機を作った人物は誰か。","answer":"ミッシェル","aliases":[],"explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-s-206","q":"行動が特性で一貫して説明できるか、状況で変わるかをめぐる議論を何というか。","answer":"一貫性論争","aliases":[],"explanation":"一貫性論争とは、人間の行動がパーソナリティ特性によって一貫して説明できるのか、それとも状況によって変化するのかをめぐる論争である。","section":"19. 一貫性論争"},{"id":"jin1-s-207","q":"一貫性論争について、従来の特性論が行動にあると考えていたものは何か。","answer":"時間や状況を超えた一貫性","aliases":[],"explanation":"それまでの特性論では、人間の行動には時間や状況を超えた一貫性があると考えられていた。","section":"19. 一貫性論争"},{"id":"jin1-s-208","q":"一貫性論争について、ミッシェルは、性格特性と何との関連が弱いと主張したか。","answer":"行動","aliases":[],"explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-s-209","q":"一貫性論争について、行動にみられないと主張された一貫性を何というか。","answer":"通状況的一貫性","aliases":[],"explanation":"しかし、ミッシェルは、パーソナリティ特性と行動との関連は弱く、行動には通状況的一貫性がみられないと主張した。","section":"19. 一貫性論争"},{"id":"jin1-s-210","q":"一貫性論争について、行動理解で重視すべき外的要因の組合せはどれか。","answer":"環境と状況","aliases":[],"explanation":"また、行動を理解するためには環境や状況といった外的要因も重視すべきであると考えた。","section":"19. 一貫性論争"},{"id":"jin1-s-211","q":"一貫性論争について、外的要因を重視する立場を何というか。","answer":"状況主義","aliases":[],"explanation":"このような立場は状況主義と呼ばれる。","section":"19. 一貫性論争"},{"id":"jin1-s-212","q":"一貫性論争について、論争で対置されたものの組合せはどれか。","answer":"人（特性）と状況","aliases":[],"explanation":"ミッシェルの主張をきっかけに、「人（特性）」か「状況」かをめぐる議論が活発になり、一貫性論争と呼ばれるようになった。","section":"19. 一貫性論争"},{"id":"jin1-s-213","q":"一貫性論争について、現在、行動は何によって生じると考えられているか。","answer":"パーソナリティ特性と状況の相互作用","aliases":[],"explanation":"現在では、行動はパーソナリティ特性と状況との相互作用によって生じると考えられている。","section":"19. 一貫性論争"},{"id":"jin1-s-214","q":"心の局所論について、心を一つの空間として三層に分けた理論の提唱者は誰か。","answer":"フロイト","aliases":[],"explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-s-215","q":"心を意識・前意識・無意識に分ける考え方は何か。","answer":"心の局所論","aliases":[],"explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-s-216","q":"フロイトの局所論で、心はいくつの層から成るか。","answer":"3つ","aliases":[],"explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-s-217","q":"心の局所論について、直接、自分の経験だと感じることができる心的内容はどれか。","answer":"意識","aliases":[],"explanation":"意識とは、直接的に自分の経験だと感じることができるものをいう。","section":"20. 心の局所論"},{"id":"jin1-s-218","q":"心の局所論について、普段は意識されないが、注意を向ければいつでも意識化できる心的内容はどれか。","answer":"前意識","aliases":[],"explanation":"前意識とは、常に意識されてはいないものの、注意を向ければいつでも意識化できるものをいう。","section":"20. 心の局所論"},{"id":"jin1-s-219","q":"心の局所論について、自覚されていないが、自分に大きな影響を与える心的内容はどれか。","answer":"無意識","aliases":[],"explanation":"無意識とは、自覚されていないものの、自分自身に大きな影響を与えるものをいう。","section":"20. 心の局所論"},{"id":"jin1-s-221","q":"心の局所論について、意識から無意識へ心的内容が移る働きを何というか。","answer":"抑圧","aliases":[],"explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-s-222","q":"心の局所論について、無意識から意識へ心的内容が移る働きを何というか。","answer":"意識化","aliases":[],"explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-s-223","q":"心の局所論について、三領域は固定的な状態ではなく、どのような関係にあるとされるか。","answer":"常に移行するダイナミックな関係","aliases":[],"explanation":"各領域は状態的なものではなく、常に、意識から無意識(抑圧)、無意識から意識(意識化)というダイナミクスな関係である。","section":"20. 心の局所論"},{"id":"jin1-s-224","q":"心の局所論について、抑圧された内容を探り、再び自分のものとして意識化する治療過程は何か。","answer":"精神分析療法","aliases":["分析的治療"],"explanation":"抑圧されたものを探り、再び自らのものとして意識化していくプロセスを精神分析療法(分析的治療)という。","section":"20. 心の局所論"},{"id":"jin1-s-225","q":"フロイトの局所論では、心の中をどのようなものとして捉えるか。","answer":"一つの空間や場所","aliases":[],"explanation":"フロイトが提唱した、人の心の中をひとつの空間や場所として捉え、意識、前意識、無意識の3層から構成されているという考えである。","section":"20. 心の局所論"},{"id":"jin1-s-226","q":"精神分析療法について、無意識に抑圧された欲求や葛藤の意識化を目指す心理療法を創始した人物は誰か。","answer":"フロイト","aliases":[],"explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-s-227","q":"無意識の欲求や葛藤を意識化し、症状や心理的問題の改善を目指す方法は何か。","answer":"精神分析療法","aliases":[],"explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-s-228","q":"精神分析療法で代表的に用いられる技法は何か。","answer":"自由連想法","aliases":[],"explanation":"代表的な技法として自由連想法が用いられ、クライエントは頭に浮かんだことを自由に話す。","section":"21. 精神分析療法"},{"id":"jin1-s-229","q":"精神分析療法について、自由連想法でクライエントに求められることは何か。","answer":"頭に浮かんだことを自由に話す","aliases":[],"explanation":"代表的な技法として自由連想法が用いられ、クライエントは頭に浮かんだことを自由に話す。","section":"21. 精神分析療法"},{"id":"jin1-s-230","q":"精神分析療法について、治療中に黙り込んだり話題をそらしたりする現象を何というか。","answer":"抵抗","aliases":[],"explanation":"その過程で、クライエントが黙り込んだり話題を逸らしたりする現象は抵抗と呼ばれ、無意識の葛藤を理解するための重要な手がかりとされる。","section":"21. 精神分析療法"},{"id":"jin1-s-231","q":"精神分析療法について、過去の重要人物へ抱いていた感情をセラピストへ向ける現象を何というか。","answer":"転移","aliases":[],"explanation":"また、クライエントが過去の重要な人物に抱いていた感情をセラピストに向ける転移が生じることがある。","section":"21. 精神分析療法"},{"id":"jin1-s-232","q":"精神分析療法について、抵抗や転移を理解し、無意識の葛藤への理解を深めることを何というか。","answer":"洞察","aliases":[],"explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-s-233","q":"精神分析療法について、得た理解を現実生活で生かせるよう、繰り返し取り組む過程を何というか。","answer":"ワークスルー","aliases":[],"explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-s-234","q":"精神分析療法について、治療中の沈黙や話題の変更は、何を理解する重要な手がかりとされるか。","answer":"無意識の葛藤","aliases":[],"explanation":"その過程で、クライエントが黙り込んだり話題を逸らしたりする現象は抵抗と呼ばれ、無意識の葛藤を理解するための重要な手がかりとされる。","section":"21. 精神分析療法"},{"id":"jin1-s-235","q":"精神分析療法について、転移の対象となるのは誰か。","answer":"セラピスト","aliases":[],"explanation":"また、クライエントが過去の重要な人物に抱いていた感情をセラピストに向ける転移が生じることがある。","section":"21. 精神分析療法"},{"id":"jin1-s-236","q":"精神分析療法について、徹底操作とも呼ばれる過程はどれか。","answer":"ワークスルー","aliases":["徹底操作"],"explanation":"こうした抵抗や転移を理解し、自らの無意識的な葛藤について洞察を深めた後、その理解を現実生活に生かせるよう繰り返し取り組む過程をワークスルー（徹底操作）という。","section":"21. 精神分析療法"},{"id":"jin1-s-237","q":"精神分析療法について、治療で最終的に改善を目指すものの組合せはどれか。","answer":"症状と心理的問題","aliases":[],"explanation":"精神分析療法とは、フロイトによって創始された心理療法であり、無意識に抑圧された欲求や葛藤を意識化することで、症状や心理的問題の改善を目指す方法である。","section":"21. 精神分析療法"},{"id":"jin1-s-238","q":"構造論について、心をイド・自我・超自我で説明する理論の提唱者は誰か。","answer":"フロイト","aliases":[],"explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-s-239","q":"心を三つの機構から説明する考え方は何か。","answer":"構造論","aliases":[],"explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-s-240","q":"構造論について、心的機構はいくつ設定されているか。","answer":"3つ","aliases":[],"explanation":"構造論とは、フロイトが提唱した心の構造に関する理論であり、心をイド（エス）、自我、超自我の3つの機構から説明するものである。","section":"22. 構造論"},{"id":"jin1-s-241","q":"構造論について、無意識の領域で本能的欲求や衝動を生み、すぐ満たそうとする機構はどれか。","answer":"イド（エス）","aliases":[],"explanation":"イド（エス）は無意識の領域で、本能的な欲求や衝動を生み出し、それらをすぐに満たそうとする。","section":"22. 構造論"},{"id":"jin1-s-242","q":"構造論について、現実を認識・判断し、イドと外界の仲介役を担う機構はどれか。","answer":"自我","aliases":[],"explanation":"自我はイドと外界との仲介役であり、現実を認識・判断し、適切な行動をとる機能を担うため、現実原則に従う。","section":"22. 構造論"},{"id":"jin1-s-243","q":"構造論について、親のしつけ・社会的規範・道徳が内在化された機構はどれか。","answer":"超自我","aliases":[],"explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-s-245","q":"構造論について、現実原則に従う心的機構はどれか。","answer":"自我","aliases":[],"explanation":"自我はイドと外界との仲介役であり、現実を認識・判断し、適切な行動をとる機能を担うため、現実原則に従う。","section":"22. 構造論"},{"id":"jin1-s-247","q":"構造論について、イドの衝動を抑制する機構はどれか。","answer":"超自我","aliases":[],"explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-s-248","q":"構造論について、自我を道徳的方向へ導く機構はどれか。","answer":"超自我","aliases":[],"explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-s-250","q":"構造論について、内在化される内容の組合せとして正しいものはどれか。","answer":"親のしつけ・社会的規範・道徳","aliases":[],"explanation":"超自我は、親のしつけや社会的規範、道徳が内在化された領域であり、イドの衝動を抑制し、自我を道徳的な方向へ導く役割を果たす。","section":"22. 構造論"},{"id":"jin1-s-251","q":"心的機構の相互作用や葛藤で考え・行動・夢などを説明する理論は何か。","answer":"精神力動論","aliases":[],"explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-252","q":"三つの機構へ配分される心的エネルギー量で人格を説明する理論は何か。","answer":"経済論","aliases":[],"explanation":"経済論とは、パーソナリティを3つの心的機構に配分される心的エネルギーの量によって説明する考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-253","q":"精神力動論・経済論について、局所論と構造論を提唱した人物は誰か。","answer":"フロイト","aliases":[],"explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-254","q":"精神力動論・経済論について、相互作用や葛藤を起こす三機構の組合せはどれか。","answer":"イド・自我・超自我","aliases":[],"explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-255","q":"精神力動論の説明対象に含まれるものの組合せはどれか。","answer":"考え・行動・夢・空想・神経症症状","aliases":[],"explanation":"精神力動論とは、フロイトが提唱した理論であり、人間の考えや行動、夢や空想、神経症症状などは、イド（エス）・自我・超自我の3つの心的機構の相互作用や葛藤によって説明できるとする考え方である。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-256","q":"精神力動論・経済論について、多くの心的エネルギーが配分されると、衝動的・感情的・幼児的になりやすい機構はどれか。","answer":"イド","aliases":[],"explanation":"例えば、イドに多くのエネルギーが配分されると衝動的・感情的・幼児的な性格になりやすい。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-257","q":"精神力動論・経済論について、強いと良心的・理想主義的になる一方、自分に厳しく完全主義的になりやすい機構はどれか。","answer":"超自我","aliases":[],"explanation":"超自我が強い場合は、良心的で理想主義的な一方、自分に厳しい完全主義的な傾向を示す。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-258","q":"精神力動論・経済論について、強いと理性的・合理的で、現実に即して行動しやすい機構はどれか。","answer":"自我","aliases":[],"explanation":"これに対して自我が強い場合は、理性的・合理的で現実に即した行動をとりやすいと考えられる。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-259","q":"精神力動論・経済論について、イドへの配分が多い場合の特徴の組合せはどれか。","answer":"衝動的・感情的・幼児的","aliases":[],"explanation":"例えば、イドに多くのエネルギーが配分されると衝動的・感情的・幼児的な性格になりやすい。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-260","q":"精神力動論・経済論について、超自我が強い場合の特徴の組合せはどれか。","answer":"良心的・理想主義的・自分に厳しい完全主義","aliases":[],"explanation":"超自我が強い場合は、良心的で理想主義的な一方、自分に厳しい完全主義的な傾向を示す。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-261","q":"精神力動論・経済論について、自我が強い場合の特徴の組合せはどれか。","answer":"理性的・合理的・現実に即した行動","aliases":[],"explanation":"これに対して自我が強い場合は、理性的・合理的で現実に即した行動をとりやすいと考えられる。","section":"23. 精神力動論・経済論"},{"id":"jin1-s-262","q":"心の健康を維持するうえで、フロイトが重視した心的機構はどれか。","answer":"自我","aliases":[],"explanation":"フロイトは、心の健康を維持するうえで、自我の働きが重要であると考えた。","section":"24. 自我機能への注目"},{"id":"jin1-s-263","q":"自我機能への注目について、自我は何との適応を担う心の機能か。","answer":"現実","aliases":[],"explanation":"自我とは、現実との適応を担う心の機能であり、主に現実検討機能、適応機能、統合機能の3つから成る。","section":"24. 自我機能への注目"},{"id":"jin1-s-264","q":"自我機能への注目について、自我を構成する主要機能はいくつか。","answer":"3つ","aliases":[],"explanation":"自我とは、現実との適応を担う心の機能であり、主に現実検討機能、適応機能、統合機能の3つから成る。","section":"24. 自我機能への注目"},{"id":"jin1-s-265","q":"自我機能への注目について、外界の出来事や自分の思考・感情を正確に認識する機能はどれか。","answer":"現実検討機能","aliases":[],"explanation":"現実検討機能は、外界の出来事や自分の思考・感情を正確に認識する機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-266","q":"自我機能への注目について、現実の状況に応じて適切な行動を選択し、自己実現を図る機能はどれか。","answer":"適応機能","aliases":[],"explanation":"適応機能は、現実の状況に応じて適切な行動を選択し、自己実現を図る機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-267","q":"自我機能への注目について、イドや超自我との葛藤や、矛盾する感情を受け入れて一貫した人格へまとめる機能はどれか。","answer":"統合機能","aliases":[],"explanation":"統合機能は、エスや超自我との間に生じる葛藤や矛盾する感情を受け入れ、一貫した人格として自己をまとめる機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-269","q":"自我機能への注目について、外界だけでなく正確に認識する自分の内面の組合せはどれか。","answer":"思考と感情","aliases":[],"explanation":"現実検討機能は、外界の出来事や自分の思考・感情を正確に認識する機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-270","q":"自我機能への注目について、現実に応じた行動選択によって図るものは何か。","answer":"自己実現","aliases":[],"explanation":"適応機能は、現実の状況に応じて適切な行動を選択し、自己実現を図る機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-271","q":"自我機能への注目について、統合機能が受け入れてまとめる、二つの心的機構間の葛藤はどれか。","answer":"イドと超自我","aliases":[],"explanation":"統合機能は、エスや超自我との間に生じる葛藤や矛盾する感情を受け入れ、一貫した人格として自己をまとめる機能である。","section":"24. 自我機能への注目"},{"id":"jin1-s-272","q":"自我機能への注目について、三機能によって可能になる生活のあり方は何か。","answer":"現実社会と調和した適応的生活","aliases":[],"explanation":"これらの自我機能によって、人は現実社会と調和しながら適応的に生活することができる。","section":"24. 自我機能への注目"},{"id":"jin1-s-273","q":"つらい感情を引き起こす願望や葛藤から自分を守る、自我の無意識的機制を何というか。","answer":"防衛機制","aliases":[],"explanation":"防衛機制とは、不安や罪悪感、恥などのつらい感情を引き起こす願望や葛藤から自分を守るために働く、自我の無意識的な心理機制である。","section":"25. 防衛機制"},{"id":"jin1-s-274","q":"防衛機制について、守ろうとするつらい感情の組合せとして資料が挙げるものはどれか。","answer":"不安・罪悪感・恥","aliases":[],"explanation":"防衛機制とは、不安や罪悪感、恥などのつらい感情を引き起こす願望や葛藤から自分を守るために働く、自我の無意識的な心理機制である。","section":"25. 防衛機制"},{"id":"jin1-s-275","q":"防衛機制について、受け入れがたい内容へ無意識に行う二つの処理は何か。","answer":"抑え込むことと別の形へ変換すること","aliases":[],"explanation":"受け入れがたい心的内容を無意識に抑え込んだり、別の形に変換したりすることで、心の安定を維持しようとする。","section":"25. 防衛機制"},{"id":"jin1-s-276","q":"防衛機制が維持しようとするものは何か。","answer":"心の安定","aliases":[],"explanation":"受け入れがたい心的内容を無意識に抑え込んだり、別の形に変換したりすることで、心の安定を維持しようとする。","section":"25. 防衛機制"},{"id":"jin1-s-277","q":"防衛機制について、『防衛』の概念を提唱した人物は誰か。","answer":"フロイト","aliases":[],"explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-s-278","q":"防衛機制について、防衛を体系的な機制として整理した人物は誰か。","answer":"アンナ・フロイト","aliases":[],"explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-s-279","q":"防衛機制について、体系化した人物は、概念を提唱した人物とどのような関係か。","answer":"娘","aliases":[],"explanation":"フロイトが「防衛」という概念を提唱し、その娘のアンナ・フロイトが「防衛機制」として体系化した。","section":"25. 防衛機制"},{"id":"jin1-s-280","q":"資料に列挙された九つの代表的な防衛機制の組合せはどれか。","answer":"抑圧・投影・退行・反動形成・同一化・置き換え・合理化・知性化・昇華","aliases":[],"explanation":"代表的なものには、抑圧、投影、退行、反動形成、同一化、置き換え、合理化、知性化、昇華などがある。","section":"25. 防衛機制"},{"id":"jin1-s-281","q":"防衛機制について、本来は心を守る働きでも、過度に使うと何を妨げることがあるか。","answer":"現実への適応","aliases":[],"explanation":"防衛機制は本来、心を守るための働きであるが、過度に用いられると現実への適応を妨げることがある。","section":"25. 防衛機制"},{"id":"jin1-s-282","q":"抑圧や合理化が分類されるまとまりはどれか。","answer":"神経症的防衛機制","aliases":[],"explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-s-283","q":"分裂や投影性同一視が分類されるまとまりはどれか。","answer":"原始的防衛機制","aliases":[],"explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-s-284","q":"防衛機制について、原始的なものの例として挙げられている二つは何か。","answer":"分裂と投影性同一視","aliases":[],"explanation":"また、防衛機制には抑圧や合理化などの神経症的防衛機制と、分裂や投影性同一視などの原始的防衛機制が存在する。","section":"25. 防衛機制"},{"id":"jin1-s-285","q":"分析心理学を提唱した人物は誰か。","answer":"ユング","aliases":[],"explanation":"分析心理学は、ユングによって提唱された理論・治療体系である。","section":"26. 分析心理学"},{"id":"jin1-s-286","q":"ユングが提唱した理論・治療体系を何というか。","answer":"分析心理学","aliases":[],"explanation":"分析心理学は、ユングによって提唱された理論・治療体系である。","section":"26. 分析心理学"},{"id":"jin1-s-287","q":"分析心理学について、フロイトと異なり、リビドーを何に限定しなかったか。","answer":"性的エネルギー","aliases":[],"explanation":"ユングはリビドーを性的エネルギーに限定せず、人間のあらゆる活動を支える心的エネルギーとして捉えた。","section":"26. 分析心理学"},{"id":"jin1-s-288","q":"分析心理学について、ユングがリビドーをどのように捉えたか。","answer":"人間のあらゆる活動を支える心的エネルギー","aliases":[],"explanation":"ユングはリビドーを性的エネルギーに限定せず、人間のあらゆる活動を支える心的エネルギーとして捉えた。","section":"26. 分析心理学"},{"id":"jin1-s-289","q":"分析心理学について、無意識を分けた二つの層は何か。","answer":"個人的無意識と普遍的（集合的）無意識","aliases":[],"explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-s-290","q":"分析心理学について、普遍的イメージの型を何というか。","answer":"元型（アーキタイプ）","aliases":["元型","アーキタイプ"],"explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-s-291","q":"分析心理学について、元型の例として挙げられているイメージは何か。","answer":"母親や英雄","aliases":[],"explanation":"また、無意識を個人的無意識と普遍的（集合的）無意識の二層に分け、普遍的無意識には母親や英雄などの普遍的なイメージの型である元型（アーキタイプ）が含まれるとした。","section":"26. 分析心理学"},{"id":"jin1-s-292","q":"分析心理学について、心の調和は何と何が相補的に働くことで保たれるか。","answer":"意識と無意識","aliases":[],"explanation":"さらに、人の心は意識と無意識が相補的に働くことで調和が保たれると考え、その両者を統合しながら自己実現を目指す過程を個性化過程と呼んだ。","section":"26. 分析心理学"},{"id":"jin1-s-293","q":"分析心理学について、意識と無意識を統合しながら自己実現を目指す過程は何か。","answer":"個性化過程","aliases":[],"explanation":"さらに、人の心は意識と無意識が相補的に働くことで調和が保たれると考え、その両者を統合しながら自己実現を目指す過程を個性化過程と呼んだ。","section":"26. 分析心理学"},{"id":"jin1-s-294","q":"分析心理学について、症状や問題を、より良い生き方へ導く意味あるものとして捉える視点は何か。","answer":"目的論的視点","aliases":[],"explanation":"また、症状や問題を単に除去すべきものではなく、より良い生き方へ導くための意味あるメッセージとして捉える目的論的視点を重視した。","section":"26. 分析心理学"},{"id":"jin1-s-295","q":"分析心理学について、ユングの心理療法では、症状を単にどうすべきものとは考えないか。","answer":"除去すべきもの","aliases":[],"explanation":"また、症状や問題を単に除去すべきものではなく、より良い生き方へ導くための意味あるメッセージとして捉える目的論的視点を重視した。","section":"26. 分析心理学"},{"id":"jin1-s-296","q":"個性化について、意識された心の中心を何というか。","answer":"自我","aliases":[],"explanation":"ユングは、意識された心の中心を自我、意識と無意識を含む心全体の中心を自己と考えた。","section":"27. 個性化"},{"id":"jin1-s-297","q":"個性化について、意識と無意識を含む心全体の中心を何というか。","answer":"自己","aliases":[],"explanation":"ユングは、意識された心の中心を自我、意識と無意識を含む心全体の中心を自己と考えた。","section":"27. 個性化"},{"id":"jin1-s-298","q":"個性化について、思考や感情をまとめながら外界に適応するものはどれか。","answer":"自我","aliases":[],"explanation":"自我は、自分の思考や感情をまとめながら外界に適応し、意識の主体性や統合性を維持する働きを担う。","section":"27. 個性化"},{"id":"jin1-s-299","q":"個性化について、意識の主体性と統合性を維持するものはどれか。","answer":"自我","aliases":[],"explanation":"自我は、自分の思考や感情をまとめながら外界に適応し、意識の主体性や統合性を維持する働きを担う。","section":"27. 個性化"},{"id":"jin1-s-300","q":"個性化について、人格全体を統合し、より高次の全体性を目指すものはどれか。","answer":"自己","aliases":[],"explanation":"一方、自己は意識と無意識を含む人格全体を統合する中心であり、より高次の全体性を目指す働きをもつ。","section":"27. 個性化"},{"id":"jin1-s-301","q":"個性化について、心にある対立する側面は、どのような関係にあると考えられたか。","answer":"相補的な関係","aliases":[],"explanation":"ユングは、人の心に存在する意識と無意識、理性と感情などの対立する側面は相補的な関係にあり、自己によってより高い次元で統合されると考えた。","section":"27. 個性化"},{"id":"jin1-s-302","q":"個性化について、対立する側面の例として挙げられている組合せはどれか。","answer":"意識と無意識・理性と感情","aliases":[],"explanation":"ユングは、人の心に存在する意識と無意識、理性と感情などの対立する側面は相補的な関係にあり、自己によってより高い次元で統合されると考えた。","section":"27. 個性化"},{"id":"jin1-s-303","q":"個性化について、対立する諸側面をより高い次元で統合する中心は何か。","answer":"自己","aliases":[],"explanation":"ユングは、人の心に存在する意識と無意識、理性と感情などの対立する側面は相補的な関係にあり、自己によってより高い次元で統合されると考えた。","section":"27. 個性化"},{"id":"jin1-s-304","q":"心のさまざまな側面を統合し、全体性を獲得していく過程は何か。","answer":"個性化","aliases":[],"explanation":"このように、心のさまざまな側面を統合し、全体性を獲得していく過程を個性化といい、分析心理学における最終的な目標とされている。","section":"27. 個性化"},{"id":"jin1-s-305","q":"分析心理学における最終的な目標は何か。","answer":"個性化","aliases":[],"explanation":"このように、心のさまざまな側面を統合し、全体性を獲得していく過程を個性化といい、分析心理学における最終的な目標とされている。","section":"27. 個性化"},{"id":"jin1-s-306","q":"ユングが二層に分けて捉え直した、精神分析上の概念は何か。","answer":"無意識","aliases":[],"explanation":"ユングは、フロイトの精神分析における無意識を個人的無意識と普遍的(集合的)無意識に分けて捉えた。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-307","q":"かつて意識されていた内容が抑圧で意識されなくなった層はどれか。","answer":"個人的無意識","aliases":[],"explanation":"個人的無意識は、個人が意識されていた心的内容が抑圧によって意識されなくなったものを指す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-308","q":"民族や人類に共通する非個人的な内容の層はどれか。","answer":"集合的無意識","aliases":["普遍的無意識"],"explanation":"一方で集合的無意識は、意識されていない民族や人類に共通する非個人的なものを指す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-309","q":"個人的無意識と集合的無意識について、集合的な層の存在を考える手がかりとなった患者の表現は何か。","answer":"妄想やイメージ","aliases":[],"explanation":"精神病患者の妄想やイメージを神話、宗教書の中に発見し、妄想的言動に意味を見出す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-310","q":"個人的無意識と集合的無意識について、患者の妄想やイメージと類似するものをどこに発見したか。","answer":"神話や宗教書","aliases":[],"explanation":"精神病患者の妄想やイメージを神話、宗教書の中に発見し、妄想的言動に意味を見出す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-311","q":"個人的無意識と集合的無意識について、ユングは、精神病患者の妄想やイメージを神話や宗教書の中に発見したことから、何に意味を見いだしたか。","answer":"妄想的言動","aliases":[],"explanation":"精神病患者の妄想やイメージを神話、宗教書の中に発見し、妄想的言動に意味を見出す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-312","q":"個人的無意識と集合的無意識について、集合的な層に含まれる、共通イメージやシンボルの源は何か。","answer":"元型（アーキタイプ）","aliases":["元型","アーキタイプ"],"explanation":"集合的無意識のなかには、多くの人に共通したイメージやシンボルを生み出す源である元型(アーキタイプ)が含まれている。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-313","q":"個人的無意識と集合的無意識について、元型的イメージは、どこからどこへエネルギーを運ぶとされるか。","answer":"無意識から意識へ","aliases":[],"explanation":"元型的イメージは無意識のエネルギーを再び意識に運んでくる運び手であり、偏った自我のあり方を保障する役割がある。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-314","q":"個人的無意識と集合的無意識について、元型的イメージは、何の運び手と表現されるか。","answer":"無意識のエネルギー","aliases":[],"explanation":"元型的イメージは無意識のエネルギーを再び意識に運んでくる運び手であり、偏った自我のあり方を保障する役割がある。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-315","q":"個人的無意識と集合的無意識について、個人的な層を生じさせる主な心的過程は何か。","answer":"抑圧","aliases":[],"explanation":"個人的無意識は、個人が意識されていた心的内容が抑圧によって意識されなくなったものを指す。","section":"28. 個人的無意識と集合的無意識"},{"id":"jin1-s-316","q":"家庭や職場などの社会生活へ適応するため身につける社会的自己はどれか。","answer":"ペルソナ","aliases":[],"explanation":"ペルソナとは、ギリシャ劇で用いられた仮面に由来する概念で、家庭や職場などの社会生活に適応するために人が身につける社会的自己を指す。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-317","q":"男性の無意識に存在する女性的側面はどれか。","answer":"アニマ","aliases":[],"explanation":"一方、男性の無意識に存在する女性的側面を「アニマ」、女性の無意識に存在する男性的側面を「アニムス」と呼び、これらはペルソナを補完する役割を果たす。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-318","q":"女性の無意識に存在する男性的側面はどれか。","answer":"アニムス","aliases":[],"explanation":"一方、男性の無意識に存在する女性的側面を「アニマ」、女性の無意識に存在する男性的側面を「アニムス」と呼び、これらはペルソナを補完する役割を果たす。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-319","q":"社会生活で意識に受け入れられず、無意識へ抑圧された自己の側面はどれか。","answer":"シャドウ","aliases":[],"explanation":"また、社会生活を送る中で意識が受け入れられず無意識に抑圧された自己の側面は「シャドウ」と呼ばれる。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-320","q":"ギリシャ劇で使われた仮面に由来する概念はどれか。","answer":"ペルソナ","aliases":[],"explanation":"ペルソナとは、ギリシャ劇で用いられた仮面に由来する概念で、家庭や職場などの社会生活に適応するために人が身につける社会的自己を指す。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-321","q":"ペルソナ・アニマ／アニムス・シャドウについて、社会的自己を身につける場の例として挙げられている組合せはどれか。","answer":"家庭と職場","aliases":[],"explanation":"ペルソナとは、ギリシャ劇で用いられた仮面に由来する概念で、家庭や職場などの社会生活に適応するために人が身につける社会的自己を指す。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-322","q":"無意識にある異性的側面は、何を補完する役割をもつか。","answer":"ペルソナ","aliases":[],"explanation":"一方、男性の無意識に存在する女性的側面を「アニマ」、女性の無意識に存在する男性的側面を「アニムス」と呼び、これらはペルソナを補完する役割を果たす。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-323","q":"ペルソナ・アニマ／アニムス・シャドウについて、抑圧された自己の側面は、単にどうすべきものではないとされるか。","answer":"否定すべきもの","aliases":[],"explanation":"シャドウは否定すべきものではなく、自己の可能性を含んだ重要な側面である。","section":"29. ペルソナ・アニマ／アニムス・シャドウ"},{"id":"jin1-s-324","q":"シャドウが含んでい ","answer":"過去を振り返り、自分自身を見つめ直す","aliases":[],"explanation":"人生の転機において過去を振り返り、自分自身を見つめ直すことは、より高次の成長につながると考えたのである。","section":"30. 創造的退行"},{"id":"jin1-s-336","q":"創造的退行について、健康的な退行を『自我による自我のための退行』と呼んだ人物は誰か。","answer":"クリス","aliases":[],"explanation":"また、後の精神分析学派も退行の健康的な側面を認め、クリスはこれを「自我による自我のための退行」と呼んだ。","section":"30. 創造的退行"},{"id":"jin1-s-337","q":"創造的退行について、後の精神分析学派が認めた退行の側面は何か。","answer":"健康的な側面","aliases":[],"explanation":"また、後の精神分析学派も退行の健康的な側面を認め、クリスはこれを「自我による自我のための退行」と呼んだ。","section":"30. 創造的退行"},{"id":"jin1-s-338","q":"弱点を何らかの形で補い、劣等感を克服しようとすることを何というか。","answer":"補償","aliases":[],"explanation":"補償とは、弱点を何らかの形で補うことで、劣等感を克服しようとすることを言う。","section":"31. 無意識の補償作用"},{"id":"jin1-s-339","q":"無意識の補償作用について、人間の心が全体的な調和と均衡を保つ基礎となる関係は何か。","answer":"意識と無意識の相補的関係","aliases":[],"explanation":"人間の心は、意識と無意識の相補的関係によって、全体的な調和・均衡を保っている。","section":"31. 無意識の補償作用"},{"id":"jin1-s-340","q":"無意識に相補する働きが芽生えやすいのは、何が過度に一面的になったときか。","answer":"意識の態度","aliases":[],"explanation":"意識の態度があまりに一面的になると、無意識にそれを相補する働きが芽生えることを強調しており、それがタイプ論における優越機能と劣等機能である。","section":"31. 無意識の補償作用"},{"id":"jin1-s-341","q":"無意識の補償作用について、類型論で補償的関係を表す機能の組合せはどれか。","answer":"優越機能と劣等機能","aliases":[],"explanation":"意識の態度があまりに一面的になると、無意識にそれを相補する働きが芽生えることを強調しており、それがタイプ論における優越機能と劣等機能である。","section":"31. 無意識の補償作用"},{"id":"jin1-s-342","q":"ユングの考えで、無意識の補償作用の現れとして挙げられる三つの組合せはどれか。","answer":"夢・症状・対人関係上の問題","aliases":[],"explanation":"夢、症状、対人関係上の問題も無意識の補償作用の現れとされている。","section":"31. 無意識の補償作用"},{"id":"jin1-s-343","q":"心が補償作用によって保とうとする二つの状態は何か。","answer":"調和と均衡","aliases":[],"explanation":"人間の心は、意識と無意識の相補的関係によって、全体的な調和・均衡を保っている。","section":"31. 無意識の補償作用"},{"id":"jin1-s-344","q":"無意識内で、感情によって一つにまとまった集合体を何というか。","answer":"コンプレックス","aliases":[],"explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-345","q":"無意識的コンプレックスについて、コンプレックスとして集まった心的要素を一つにまとめるものは何か。","answer":"何らかの感情","aliases":[],"explanation":"無意識の中にあり何らかの感情によって1つのまとまりとなっている集合体のことである。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-346","q":"無意識的コンプレックスについて、コンプレックスが乱すものは何か。","answer":"外界を適切に扱おうとする自我の働き","aliases":[],"explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-347","q":"無意識的コンプレックスについて、コンプレックスの核にあるものは何か。","answer":"自我にとって受け入れがたい大きな経験","aliases":[],"explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-348","q":"無意識的コンプレックスについて、核となる経験へ何が重なって形成されるか。","answer":"その経験と似た体験","aliases":[],"explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-349","q":"無意識的コンプレックスについて、コンプレックスに伴うものとして挙げられているのは何か。","answer":"非常に強い情動","aliases":[],"explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-350","q":"無意識的コンプレックスについて、強い情動の具体例として示されているものは何か。","answer":"訳の分からない怒り","aliases":[],"explanation":"コンプレックスは、無意識の中で何らかの感情によって一つにまとまった集合体であり、訳の分からない怒りなどの非常に強い情動を伴って、自我の働きを乱すことがある。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-351","q":"無意識的コンプレックスについて、資料本文が説明している形成過程はどれか。","answer":"核となる経験に似た体験が重なり合う","aliases":[],"explanation":"コンプレックスは、外界を適切に扱おうとする自我の働きを乱し、その核には、自我にとって受け入れがたい大きな経験があり、その経験と似た体験が重なり合って形成されている。","section":"32. 無意識的コンプレックス"},{"id":"jin1-s-352","q":"目的論的視点について、原因よりも『何のために』に注目する視点を重視した人物は誰か。","answer":"ユング","aliases":[],"explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-s-353","q":"原因ではなく目的に注目する見方を何というか。","answer":"目的論的視点","aliases":[],"explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-s-354","q":"ユングの目的論的視点が重視する問いはどれか。","answer":"何のために","aliases":[],"explanation":"目的論的視点とは、ユングの考えた、原因ではなく、「何のために」という目的に注目する視点を指す。","section":"33. 目的論的視点"},{"id":"jin1-s-355","q":"ユングの目的論的視点では、症状や問題への対応を、単に症状や問題をどうする方向だけに限定しないか。","answer":"なくす","aliases":[],"explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-s-356","q":"目的論的視点について、症状や問題を、本人が何を目指すためのメッセージとして扱うか。","answer":"より良い生き方","aliases":[],"explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-s-357","q":"ユングの目的論的視点に立つと、厄介な問題はどのような問題として捉え直されるか。","answer":"大切な問題","aliases":[],"explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-s-358","q":"目的論的視点について、症状や問題に見いだすものは何か。","answer":"意味あるメッセージ","aliases":[],"explanation":"目的論的視点に立てば、単に症状や問題をなくすという方向性だけではなく、当人がより良い生き方を目指すための大切なメッセージとして扱っていく視点が生まれ、厄介な問題から大切な問題へと捉えられるようになった。","section":"33. 目的論的視点"},{"id":"jin1-s-359","q":"クライエント中心療法を創始した人物は誰か。","answer":"ロジャーズ","aliases":[],"explanation":"ロジャーズにより創始された心理療法を指す。","section":"34. クライエント中心療法"},{"id":"jin1-s-360","q":"指示的な精神分析や行動療法への批判から生まれた心理療法は何か。","answer":"クライエント中心療法","aliases":[],"explanation":"クライエント中心療法は、ロジャーズが、指示的アプローチである精神分析や行動療法への批判から創始した心理療法である。","section":"34. クライエント中心療法"},{"id":"jin1-s-361","q":"クライエント中心療法の以前の名称は何か。","answer":"非指示的療法","aliases":[],"explanation":"以前は非指示的療法とよばれていたが、受身的、消極的、表面的といった批判や誤解を招いたため、クライエント中心療法と改名された。","section":"34. クライエント中心療法"},{"id":"jin1-s-362","q":"クライエント中心療法について、旧名称が招いた批判・誤解の組合せはどれか。","answer":"受身的・消極的・表面的","aliases":[],"explanation":"以前は非指示的療法とよばれていたが、受身的、消極的、表面的といった批判や誤解を招いたため、クライエント中心療法と改名された。","section":"34. クライエント中心療法"},{"id":"jin1-s-363","q":"クライエント中心療法について、治療の方向や本人を傷つけた経験を最もよく知るとされたのは誰か。","answer":"クライエント自身","aliases":[],"explanation":"ロジャーズは何がその人を傷つけ、どんな経験をしたか、どの方向に行くべきか、知っているのはクライエント自身であると考え、「受容」「共感」といった表面技法から、セラピストの態度を重視した。","section":"34. クライエント中心療法"},{"id":"jin1-s-364","q":"クライエント中心療法について、受容や共感を単なる何としてではなく捉え直したか。","answer":"表面的な技法","aliases":[],"explanation":"ロジャーズは、受容や共感を表面的な技法として扱うのではなく、セラピストの態度そのものを重視した。","section":"34. クライエント中心療法"},{"id":"jin1-s-365","q":"クライエント中心療法について、ロジャーズが表面技法より重視したものは何か。","answer":"セラピストの態度","aliases":[],"explanation":"ロジャーズは、受容や共感を表面的な技法として扱うのではなく、セラピストの態度そのものを重視した。","section":"34. クライエント中心療法"},{"id":"jin1-s-366","q":"クライエント中心療法でセラピストに必要とされる三条件の組合せはどれか。","answer":"自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解","aliases":[],"explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。","section":"34. クライエント中心療法"},{"id":"jin1-s-367","q":"クライエント中心療法について、セラピスト側の三条件に含まれないものはどれか。","answer":"自由連想","aliases":[],"explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。自由連想はこの3条件には含まれない。","section":"34. クライエント中心療法"},{"id":"jin1-s-368","q":"クライエント中心療法について、重視されるセラピスト側の態度はいくつか。","answer":"3つ","aliases":[],"explanation":"クライエント中心療法で重視されるセラピスト側の3条件は、自己一致（純粋性）・無条件の肯定的配慮（受容）・共感的理解である。","section":"34. クライエント中心療法"},{"id":"jin1-s-369","q":"クライエント中心療法について、現在、三条件はどのように受け入れられているか。","answer":"学派を超えて共通する基本的態度","aliases":[],"explanation":"現在では学派を超えて共通する基本的態度として受け入れられている。","section":"34. クライエント中心療法"},{"id":"jin1-s-370","q":"クライエント中心療法が批判の対象とした二つの指示的アプローチは何か。","answer":"精神分析と行動療法","aliases":[],"explanation":"それまでの指示的アプローチである精神分析や行動療法への批判として生まれた。","section":"34. クライエント中心療法"},{"id":"jin1-s-371","q":"自己理論について、有機体的経験と自己概念の関係から人格や適応を理解する理論の提唱者は誰か。","answer":"ロジャーズ","aliases":[],"explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-s-372","q":"経験と自己概念の関係を中心に据える考え方は何か。","answer":"自己理論","aliases":[],"explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-s-373","q":"自己理論について、人間に本来備わる、自己を維持し強化しようとする傾向は何か。","answer":"自己実現傾向","aliases":[],"explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-s-374","q":"自己理論について、経験を通して、自分に関する何がまとめられて形成されるか。","answer":"認識や価値観","aliases":[],"explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-s-375","q":"自己理論について、自分に関する認識や価値観をまとめたものは何か。","answer":"自己概念","aliases":[],"explanation":"有機体である人間には本来、自己を維持し強化しようとするとする(自己)実現傾向が備わっており、経験を通して自分に関する認識や価値観をまとめ、自己概念が形成される。","section":"35. 自己理論"},{"id":"jin1-s-376","q":"自己理論について、経験と自己概念が一致している場合の心理状態はどれか。","answer":"心理的に安定し適応的","aliases":[],"explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-s-377","q":"自己理論について、自己概念と一致しない経験が意識されにくくなる二つの処理は何か。","answer":"否認と歪曲","aliases":[],"explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-s-378","q":"自己理論について、心理的適応に問題が生じやすいのは、どの領域が多い場合か。","answer":"自己概念と経験が一致していない領域","aliases":[],"explanation":"経験が自己概念と一致していれば心理的に安定し適応的に生活できるが、自己概念と一致しない経験は否認や歪曲によって意識化されにくくなり、自己概念と経験が一致していない領域が多い場合に心理的適応に問題が生じると主張した。","section":"35. 自己理論"},{"id":"jin1-s-379","q":"自己理論について、心理的健康を理解するうえで重要なものは何か。","answer":"自己と経験の一致の程度","aliases":[],"explanation":"このように、自己実現傾向を基盤としつつ、自己と経験の一致の程度が心理的健康を理解する上で重要とされる。","section":"35. 自己理論"},{"id":"jin1-s-380","q":"自己理論について、自己概念の形成基盤となるものは何か。","answer":"経験","aliases":[],"explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-s-381","q":"自己理論が理解しようとする二つの対象は何か。","answer":"人格と適応","aliases":[],"explanation":"ロジャーズが提唱した理論であり、人がもつ(有機体的)経験と自己概念との関係から人格や適応を理解する考え方である。","section":"35. 自己理論"},{"id":"jin1-s-382","q":"自分が認識する自分と実際の体験が一致している状態を何というか。","answer":"自己一致","aliases":["純粋性"],"explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-s-383","q":"自己一致（純粋性）の状態では、何と何が一致しているか。","answer":"自己概念と経験","aliases":[],"explanation":"自己一致（純粋性）とは、自分についての認識である自己概念と、実際の体験である経験が一致している状態をいう。","section":"36. 自己一致"},{"id":"jin1-s-384","q":"自己一致を日常的に言い換えた説明はどれか。","answer":"あるべき自分と、感じたり行動する自分に矛盾がない","aliases":[],"explanation":"つまり、あるべき自分と、感じたり行動する自分に矛盾がない状態をいう。","section":"36. 自己一致"},{"id":"jin1-s-385","q":"自己一致について、心理的不適応をもたらすとされるものは何か。","answer":"自己概念と経験の不一致","aliases":[],"explanation":"クライエント中心療法では、自己概念と経験の不一致がクライエントに心理的不適応をもたらすと考える。","section":"36. 自己一致"},{"id":"jin1-s-386","q":"自己一致について、セラピストが修正を支援するものは何か。","answer":"『こうあるべき』と考える自己概念","aliases":[],"explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-s-387","q":"自己一致について、クライエントが受け入れられるよう支援するものは何か。","answer":"ありのままの自分","aliases":[],"explanation":"そのため、セラピストはクライエントが「こうあるべき」と考えている自己概念を修正し、ありのままの自分を受容、自己一致できるように支援していく。","section":"36. 自己一致"},{"id":"jin1-s-388","q":"自己一致について、無条件の肯定的配慮（受容）は、誰に必要な態度として位置づけられるか。","answer":"セラピスト","aliases":[],"explanation":"クライエント中心療法におけるセラピストに必要な態度のひとつである。","section":"36. 自己一致"},{"id":"jin1-s-389","q":"自己一致について、無条件の肯定的配慮（受容）が重視される心理療法は何か。","answer":"クライエント中心療法","aliases":[],"explanation":"クライエント中心療法では、自己概念と経験の不一致がクライエントに心理的不適応をもたらすと考える。","section":"36. 自己一致"},{"id":"jin1-s-390","q":"クライエントを一人の人間として条件を付けず認める態度は何か。","answer":"無条件の肯定的配慮","aliases":["受容"],"explanation":"クライエントをひとりの人間として無条件に認め、ポジティブな面と同様にネガティブな面も受容することをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-391","q":"無条件の肯定的配慮では、クライエントのポジティブな面と何の面をともに受容するか。","answer":"ネガティブな面","aliases":[],"explanation":"クライエントをひとりの人間として無条件に認め、ポジティブな面と同様にネガティブな面も受容することをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-392","q":"無条件の肯定的配慮（受容）と反対の例はどれか。","answer":"『あなたが～なら受け入れる』という条件付きの態度","aliases":[],"explanation":"つまり、「あなたが～なら、あなたを受け入れる」といった態度ではなく、クライエントがどのようであれ、受け入れる態度をいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-393","q":"無条件の肯定的配慮について、不適応状態は、本人が何をできていない状態だと説明されるか。","answer":"自分自身を受容すること","aliases":[],"explanation":"クライエントが不適応状態にあるということは、クライエントが自分自身を受容できていない状態にあることを意味する。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-394","q":"セラピストが無条件に受容すると、クライエントは何をせずに自己を見つめ直せるか。","answer":"防衛","aliases":[],"explanation":"セラピストが無条件にクライエントを受容することで、クライエントは防衛することなく自己を見つめ直し、自分自身を受容できるようになる。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-395","q":"無条件の受容を経験した結果、可能になることは何か。","answer":"自分自身の受容","aliases":[],"explanation":"セラピストが無条件にクライエントを受容することで、クライエントは防衛することなく自己を見つめ直し、自分自身を受容できるようになる。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-396","q":"無条件の肯定的配慮について、共感的理解は、誰に必要とされる態度か。","answer":"セラピスト","aliases":[],"explanation":"共感的理解はセラピストに必要な態度であり、クライエントの感情に巻き込まれず、その経験や情動を「あたかも自分のもの」のように感じることをいう。","section":"37. 無条件の肯定的配慮"},{"id":"jin1-s-397","q":"相手の経験や情動を『あたかも自分のもの』のように感じる態度は何か。","answer":"共感的理解","aliases":[],"explanation":"共感的理解はセラピストに必要な態度であり、クライエントの感情に巻き込まれず、その経験や情動を「あたかも自分のもの」のように感じることをいう。","section":"38. 共感的理解"},{"id":"jin1-s-398","q":"共感的理解では、相手の感情に対してどうならないことが必要か。","answer":"巻き込まれない","aliases":[],"explanation":"クライエントの感情に巻き込まれることなく、クライエントの経験や情動をあたかも自分のものであるかのように感じる状態をいう。","section":"38. 共感的理解"},{"id":"jin1-s-399","q":"共感的理解について、クライエントは共感によって、どのような体験をするか。","answer":"理解されているという体験","aliases":[],"explanation":"セラピストの共感的理解によって、クライエントは理解されているという体験をし、それが支えとなり、自分のなかから生じてくる自然な感情を感じることが可能になってくる。","section":"38. 共感的理解"},{"id":"jin1-s-400","q":"共感的理解について、理解されている体験は、クライエントにとって何になるか。","answer":"支え","aliases":[],"explanation":"セラピストの共感的理解によって、クライエントは理解されているという体験をし、それが支えとなり、自分のなかから生じてくる自然な感情を感じることが可能になってくる。","section":"38. 共感的理解"},{"id":"jin1-s-401","q":"共感的理解について、共感的な支えによって感じられるようになるものは何か。","answer":"自分の中から生じる自然な感情","aliases":[],"explanation":"セラピストの共感的理解によって、クライエントは理解されているという体験をし、それが支えとなり、自分のなかから生じてくる自然な感情を感じることが可能になってくる。","section":"38. 共感的理解"},{"id":"jin1-s-402","q":"共感的理解が必要とされる心理療法は何か。","answer":"クライエント中心療法","aliases":[],"explanation":"クライエント中心療法におけるセラピストに必要な態度のひとつである。","section":"38. 共感的理解"},{"id":"jin1-s-403","q":"エンカウンター・グループについて、自己理解・他者理解・人間的成長を目的とする体験型集団療法が展開した年代はいつか。","answer":"1960年代","aliases":[],"explanation":"1960年代からアメリカで展開された、自己理解や他者理解を深め、人間的成長や対人関係の改善を目的とした体験型の集団心理療法である。","section":"39. エンカウンター・グループ"},{"id":"jin1-s-404","q":"エンカウンター・グループが展開した国はどこか。","answer":"アメリカ","aliases":[],"explanation":"1960年代からアメリカで展開された、自己理解や他者理解を深め、人間的成長や対人関係の改善を目的とした体験型の集団心理療法である。","section":"39. エンカウンター・グループ"},{"id":"jin1-s-405","q":"狭義には、誰のベーシック・エンカウンター・グループを指すか。","answer":"ロジャー "ジェンドリン","aliases":[],"explanation":"フォーカシングとは、ジェンドリンの体験過程理論に基づいて開発された心理療法のひとつである。","section":"40. フォーカシング"},{"id":"jin1-s-416","q":"身体感覚として体験される感情を明確化する心理療法は何か。","answer":"フォーカシング","aliases":[],"explanation":"これを明確化するものがフォーカシングである。","section":"40. フォーカシング"},{"id":"jin1-s-417","q":"フォーカシングについて、心理療法の成否に深く関わるものは何か。","answer":"クライエントの感情体験","aliases":[],"explanation":"心理療法の成否はクライエントの感情体験が深く関わるが、この感情は身体感覚として体験される。","section":"40. フォーカシング"},{"id":"jin1-s-418","q":"フォーカシングについて、感情は何として体験されるとされるか。","answer":"身体感覚","aliases":[],"explanation":"心理療法の成否はクライエントの感情体験が深く関わるが、この感情は身体感覚として体験される。","section":"40. フォーカシング"},{"id":"jin1-s-419","q":"フォーカシングについて、最初に注意を向ける場所はどこか。","answer":"身体","aliases":[],"explanation":"身体に注意を向けて、気になる身体感覚が感じられるのを待つ。","section":"40. フォーカシング"},{"id":"jin1-s-420","q":"フォーカシングについて、言葉にならない不明確な意味を含んだ、気になる身体感覚はどれか。","answer":"フェルトセンス","aliases":[],"explanation":"この言葉にならない不明確な意味を含んだ身体感覚をフェルトセンスといい、これをぴったりと表現できるようなイメージや名前であるハンドルを探す。","section":"40. フォーカシング"},{"id":"jin1-s-421","q":"フォーカシングについて、身体感覚をぴったり表現するイメージや名前はどれか。","answer":"ハンドル","aliases":[],"explanation":"この言葉にならない不明確な意味を含んだ身体感覚をフェルトセンスといい、これをぴったりと表現できるようなイメージや名前であるハンドルを探す。","section":"40. フォーカシング"},{"id":"jin1-s-422","q":"フォーカシングについて、身体感覚と表現が一致したときに生じる『これだ！』という感じへの変化はどれか。","answer":"フェルトシフト","aliases":[],"explanation":"フェルトセンスとハンドルが、ぴったりと一致したときに感じられる「これだ！」という感じへの変化をフェルトシフトという。","section":"40. フォーカシング"},{"id":"jin1-s-424","q":"フォーカシングについて、身体感覚が感じられるまで行うことは何か。","answer":"待つ","aliases":[],"explanation":"身体に注意を向けて、気になる身体感覚が感じられるのを待つ。","section":"40. フォーカシング"},{"id":"jin1-s-425","q":"フォーカシングについて、フェルトセンスに対して探すものは何か。","answer":"ぴったり表現するイメージや名前","aliases":[],"explanation":"この言葉にならない不明確な意味を含んだ身体感覚をフェルトセンスといい、これをぴったりと表現できるようなイメージや名前であるハンドルを探す。","section":"40. フォーカシング"},{"id":"jin1-s-426","q":"フォーカシングについて、フェルトシフトの実感によって得られるものは何か。","answer":"新たな気づき","aliases":[],"explanation":"フォーカシングでは、フェルトシフトを実感することで新たな気づきが得られ、それを受容することで効果が発揮される。","section":"40. フォーカシング"},{"id":"jin1-s-427","q":"フォーカシングについて、新たな気づきをどうすることで効果が発揮されるか。","answer":"受容する","aliases":[],"explanation":"フォーカシングでは、フェルトシフトを実感することで新たな気づきが得られ、それを受容することで効果が発揮される。","section":"40. フォーカシング"}];const STORAGE_KEY="personality-part1-short-v1";
const LETTERS = ['A','B','C','D'];
const state = { order: questions.map((_,i)=>i), pos:0, answered:false, revealed:false };
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
const CONTENT_REVISION="2026-09-14-source-audit-r2";
const CONTENT_REVISION_KEY=STORAGE_KEY+':content-revision';
if(localStorage.getItem(CONTENT_REVISION_KEY)!==CONTENT_REVISION){for(const id of ["jin1-s-045","jin1-s-097","jin1-s-098","jin1-s-099","jin1-s-136","jin1-s-145","jin1-s-146","jin1-s-147","jin1-s-179","jin1-s-246","jin1-s-249","jin1-s-423","jin1-s-044","jin1-s-071","jin1-s-075","jin1-s-092","jin1-s-096","jin1-s-143","jin1-s-220","jin1-s-244","jin1-s-268","jin1-s-032","jin1-s-165","jin1-s-169","jin1-s-311","jin1-s-354","jin1-s-355","jin1-s-357","jin1-s-048","jin1-s-310","jin1-s-419","jin1-s-031","jin1-s-083","jin1-s-151","jin1-s-006","jin1-s-008","jin1-s-026","jin1-s-086","jin1-s-088","jin1-s-100","jin1-s-101","jin1-s-102","jin1-s-123","jin1-s-166","jin1-s-202","jin1-s-213","jin1-s-223","jin1-s-260","jin1-s-272","jin1-s-288","jin1-s-325","jin1-s-332","jin1-s-346","jin1-s-383","jin1-s-412","jin1-s-425"])delete records[id];localStorage.setItem(CONTENT_REVISION_KEY,CONTENT_REVISION);localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
function rec(i){ return records[questions[i].id] || {attempts:0,correct:0,wrong:0}; }
function eligible(){
  const f=$('filter').value;
  return state.order.filter(i=>{const r=rec(i);if(f==='all')return true;if(f==='unanswered')return r.attempts===0;if(f==='missed')return r.wrong>0;if(f==='wrong1')return r.wrong===1;if(f==='wrong2')return r.wrong===2;if(f==='wrong3')return r.wrong>=3;return true;});
}
function currentIndex(){const list=eligible();if(!list.length)return null;state.pos=Math.max(0,Math.min(state.pos,list.length-1));return list[state.pos];}
function updateStats(){
  let answered=0, attempts=0, correct=0, wrong=0;
  questions.forEach((_,i)=>{const r=rec(i);if(r.attempts)answered++;attempts+=r.attempts;correct+=r.correct;wrong+=r.wrong;});
  $('sTotal').textContent=questions.length;$('sAnswered').textContent=answered;$('sWrong').textContent=wrong;
  $('sRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
}
function go(delta){const list=eligible();if(!list.length)return;state.pos=(state.pos+delta+list.length)%list.length;state.answered=false;state.revealed=false;render();}
function resetCurrent(){state.answered=false;state.revealed=false;render();}
function setFilter(){state.pos=0;state.answered=false;state.revealed=false;render();}
function shuffle(){
  const a=questions.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.order=a;state.pos=0;state.answered=false;state.revealed=false;render();
}
function sourceOrder(){state.order=questions.map((_,i)=>i);state.pos=0;state.answered=false;state.revealed=false;render();}
function resetAll(){if(confirm('正解・不正解・挑戦回数を含む全記録を消去しますか？')){records={};save();state.pos=0;state.answered=false;state.revealed=false;render();}}
function record(i,isCorrect){const id=questions[i].id;const r=rec(i);r.attempts++;if(isCorrect)r.correct++;else r.wrong++;records[id]=r;save();updateStats();}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function historyText(r){return `挑戦 ${r.attempts}回｜誤答 ${r.wrong}回`;}
function revealAnswer(){
  const i=currentIndex();if(i===null||state.revealed)return;state.revealed=true;const q=questions[i];const typed=$('response').value.trim();
  $('feedback').innerHTML=`<div class="answerbox neutral"><b>正答</b><div>${escapeHtml(q.answer)}</div>${typed?`<div class="source">あなたの回答：${escapeHtml(typed)}</div>`:''}<div class="explain">${escapeHtml(q.explanation)}</div><div class="source">資料項目：${escapeHtml(q.section)}</div></div>`;
  $('markrow').classList.remove('hidden');$('reveal').disabled=true;$('response').disabled=true;
}
function markShort(ok){if(state.answered)return;const i=currentIndex();if(i===null)return;state.answered=true;record(i,ok);$('markrow').classList.add('hidden');$('retry').disabled=false;$('history').textContent=historyText(rec(i));const box=$('feedback').firstElementChild;if(box){box.classList.remove('neutral');box.classList.add(ok?'ok':'bad');box.insertAdjacentHTML('afterbegin',`<b>${ok?'正解として記録しました':'不正解として記録しました'}</b>`);}}
function render(){
  updateStats();const list=eligible(),i=currentIndex();if(i===null){$('progress').textContent='0 / 0';$('history').textContent='';$('question').textContent='この条件に当てはまる問題はありません。';$('response').value='';$('response').disabled=true;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=true;$('retry').disabled=true;return;}
  const q=questions[i];$('progress').textContent=`${state.pos+1} / ${list.length}（全体 Q${i+1}）`;$('history').textContent=historyText(rec(i));$('question').textContent=q.q;$('response').value='';$('response').disabled=false;$('feedback').innerHTML='';$('markrow').classList.add('hidden');$('reveal').disabled=false;$('retry').disabled=true;
}
render();
